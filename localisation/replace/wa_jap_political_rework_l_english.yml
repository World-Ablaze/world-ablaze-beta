l_english:
 # New political tree (template): names only, the descriptions come later.
 JAP_pol_february_26_incident:0 "February 26 Incident"
 JAP_pol_february_26_incident_desc:0 "A new faction has appeared, intent to take control of the government and strike north into the Soviet Union. We must eliminate them before they can do too much damage."
 JAP_pol_active_duty_officer_rule:0 "Active Duty Officer Rule"
 JAP_pol_active_duty_officer_rule_desc:0 "The brief period since the attempted coup d'etat by the Kōdōha faction has been anything but stable. With the military growing upset at the government, something needs to be done to placate them. To that end, Kōki Hirota has proposed making the minister of war a position that can only be given to an actively serving officer, as has been the case a few times throughout our history."
 JAP_pol_first_konoe_cabinet:0 "First Konoe Cabinet"
 JAP_pol_first_konoe_cabinet_desc:0 "Cabinet after cabinet has fallen to the quarrel between the military and the parties, and the government of the country is at a standstill. Konoe Fumimaro, President of the House of Peers and the elder statesman Saionji Kinmochi's choice to succeed, has the hopes of the military and the parties alike. If every quarter gathers its strength behind him, a government of national unity can be built."
 JAP_pol_no_dealings_with_the_nationalists:0 ""No Dealings with the Nationalist Government""
 JAP_pol_no_dealings_with_the_nationalists_desc:0 "It is now plain that the Nationalist Government has no wish for peace. We should cease to deal with it altogether and help a new regime arise that can truly work with us. Otherwise there will be no end to this Incident."
 JAP_pol_hiranuma_cabinet:0 "Hiranuma Cabinet"
 JAP_pol_hiranuma_cabinet_desc:0 "Prime Minister Konoe has unexpectedly resigned to instead lead the Privy Council. This has led to significant instability as Prime Minister Kiichiro’s Cabinet attempts to handle the war situation in China with changing leadership and strategic goals."
 JAP_pol_complicated_and_inscrutable:0 ""Complicated and Inscrutable""
 JAP_pol_complicated_and_inscrutable_desc:0 "Events in Europe have moved in a direction that betrays everything we expected. The cabinet that built its foreign policy on partnership with Germany should take responsibility and resign."
 JAP_pol_yonai_cabinet:0 "Yonai Cabinet"
 JAP_pol_yonai_cabinet_desc:0 "Being drawn into the war in Europe would bring our nation nothing. The time has come to mend our relations with Britain and America under Admiral Yonai and to give ourselves wholly to settling the China Incident."
 JAP_pol_second_konoe_cabinet:0 "Second Konoe Cabinet"
 JAP_pol_second_konoe_cabinet_desc:0 "Konoe has returned following the disastrous tenures of Kiichiro and Yonai. With plans to unite the nation alongside our fellow fascist powers in Europe, as well as finally seeking to end the quagmire in China with decisive victory."
 JAP_pol_tripartite_pact:0 "Tripartite Pact"
 JAP_pol_tripartite_pact_desc:0 "Finally signing the Tripartite Pact as the army has demanded will align us with the other fascist powers of the world, ensuring our place in the New World Order and laying the groundwork for cooperation should the Brits or Yankees attempt to stop our expansion."
 JAP_pol_imperial_rule_assistance_association:0 "Imperial Rule Assistance Association"
 JAP_pol_imperial_rule_assistance_association_desc:0 "In this time of war, a unified administration must be forged from the dissenting factions of the army, navy, and remnants of civilian government. The IRAA, structured as a national syndicalist system to involve every level of individual in government in the state’s organization and prosecution of war, will maintain stability at home as the war effort intensifies."
 JAP_pol_third_konoe_cabinet:0 "Third Konoe Cabinet"
 JAP_pol_third_konoe_cabinet_desc:0 "To bring the talks with America to a settlement we must remove the Foreign Minister who stands in their way. The cabinet should resign, take in a new Foreign Minister and put all its strength into the talks. There is not much time left."
 JAP_pol_tojo_cabinet:0 "Tojo Cabinet"
 JAP_pol_tojo_cabinet_desc:0 "The Prime Minister has become politically isolated and has resigned amidst rumors of falling from the Emperor’s favor. Hideki Tojo, a popular militarist and politician, has gained the Emperor’s trust and risen to unite Japan behind the military. To Ultimate Victory! Banzai!"
 JAP_pol_execution_of_imperial_national_policy:0 "Essentials for Carrying Out Imperial Policy"
 JAP_pol_execution_of_imperial_national_policy_desc:0 "The time has come to set a deadline for a settlement by negotiation. If none is reached by that day, we must resolve on war with America, Britain and the Netherlands to secure our self-preservation."
 JAP_pol_yokusan_election:0 "The Yokusan Election"
 JAP_pol_yokusan_election_desc:0 "For the wartime general election the Council for the Imperial Rule Assistance Political Structure has recommended 466 candidates, one for every seat. With the government behind them there is no reason they should lose. When this election is over, the Diet will be filled to the last man with those who stand by the government."
 JAP_pol_koiso_cabinet:0 "Koiso Cabinet"
 JAP_pol_koiso_cabinet_desc:0 "The recent failures of Tojo have lost him the trust of the Emperor, he will be replaced by Kuniaki Koiso."
 JAP_pol_tokyo_metropolis:0 "Tokyo Metropolis"
 JAP_pol_tokyo_metropolis_desc:0 "Tokyo Prefecture and Tokyo City are abolished and replaced by Tokyo Metropolis, placing the administration of the capital directly under the government. The bill has failed in the Diet for decades, but in a time of emergency the capital cannot do without a strong administration."
 JAP_pol_religious_organisations_law:0 "Religious Organisations Law"
 JAP_pol_religious_organisations_law_desc:0 ""
 JAP_pol_baba_finance:0 "Baba Finance"
 JAP_pol_baba_finance_desc:0 "National defence comes first, and the policy of gradually reducing the bond issues that the late Finance Minister Takahashi upheld is abandoned. The arms build-up will be paid for with higher taxes and more bonds, and the swelling budget is bound to tell on prices."
 JAP_pol_yuki_finance:0 "Yuki Finance"
 JAP_pol_yuki_finance_desc:0 "The swelling military budget threatens to drive prices up, and business is growing uneasy. While holding to the aim of stronger national defence, we must trim the budget, soften the tax increases and mediate between the military and business."
 JAP_pol_peace_preservation_law_revision:0 "Revision of the Peace Preservation Law"
 JAP_pol_peace_preservation_law_revision_desc:0 ""
 JAP_pol_three_and_a_half_percent_bonds:0 "3.5% Government Bonds"
 JAP_pol_three_and_a_half_percent_bonds_desc:0 "To bear a larger issue of bonds we must bring interest rates down and lighten the burden of interest. Converting the 5% bonds into 3.5% bonds will get them placed for the time being, but how long the market will accept bonds at so low a rate no one can say."
 JAP_pol_military_finance_embrace:0 "The Army and Business Embrace"
 JAP_pol_military_finance_embrace_desc:0 "The arms build-up cannot go on without the cooperation of business, and business in turn cannot do without military orders. The military and business must meet each other halfway and expand productive capacity while holding prices down."
 JAP_pol_gold_production_law:0 "Gold Production Law"
 JAP_pol_gold_production_law_desc:0 "The surge in imports that comes with rearmament keeps draining our gold overseas. On the books the Bank of Japan's specie reserve still stands, but at this rate we will soon be unable to pay for what we import. Gold must be brought under state control from the mine to its use, and enough of it secured to settle our accounts."
 JAP_pol_tax_reform:0 "Tax Reform"
 JAP_pol_tax_reform_desc:0 "Growing expenditure cannot be met by bonds alone for ever. We must reform the tax system around the income tax and build one flexible enough to raise revenue without being rebuilt each time taxes go up."
 JAP_pol_military_secrets_law:0 "Revision of the Military Secrets Law"
 JAP_pol_military_secrets_law_desc:0 ""
 JAP_pol_cabinet_planning_board:0 "Cabinet Planning Board"
 JAP_pol_cabinet_planning_board_desc:0 "The Planning Agency and the Resources Bureau are merged into a board under the cabinet that drafts national policy and the plans for mobilisation. It will be the centre of a system in which materials, funds and labour are allotted according to the plans of the state."
 JAP_pol_temporary_funds_adjustment_law:0 "Temporary Funds Adjustment Law"
 JAP_pol_temporary_funds_adjustment_law_desc:0 "We cannot allow scarce funds to flow into industries that are neither needed nor urgent. Loans for equipment and the founding or recapitalising of companies should require the government's permission, so that money goes first to the munitions and basic industries."
 JAP_pol_temporary_trade_measures_law:0 "Temporary Measures on Exports and Imports"
 JAP_pol_temporary_trade_measures_law_desc:0 "The surge in imports has left us short of foreign exchange, and what we can still import must go to the materials the military needs. The government may restrict the export and import of the goods it names, and extend its orders to their manufacture, distribution and consumption."
 JAP_pol_national_defence_security_law:0 "National Defence Security Law"
 JAP_pol_national_defence_security_law_desc:0 ""
 JAP_pol_electric_power_control_law:0 "Electric Power Control Law"
 JAP_pol_electric_power_control_law_desc:0 "The private power companies are made to hand over their main generating and transmission plant to a national policy company, Nippon Hassoden, which runs it as one. To supply the munitions industries first with plentiful and cheap power, electricity must be placed under the management of the state."
 JAP_pol_bank_of_japan_law:0 "Bank of Japan Law"
 JAP_pol_bank_of_japan_law_desc:0 "The Bank of Japan's purpose is defined as regulating currency and finance in line with the policies of the state, and the government's powers of supervision are strengthened. The duty to convert notes is abolished in law as in fact, and the note issue will be managed under a limit set by the government."
 JAP_pol_national_mobilisation_law:0 "National Mobilisation Law"
 JAP_pol_national_mobilisation_law_desc:0 "In time of war the government is empowered to control and employ the human and material resources of the nation for the purposes of national defence. Controls over labour, materials, funds, prices and speech can be put into force by imperial ordinance without going through the Diet, and the whole strength of the nation can be turned to war."
 JAP_pol_power_distribution_control:0 "Power Distribution Control"
 JAP_pol_power_distribution_control_desc:0 "The distribution of electricity across the country is merged into nine regional companies. After generation and transmission, distribution too comes under the control of the state, and power will be allotted according to national policy at every stage."
 JAP_pol_national_service_draft_ordinance:0 "National Service Draft Ordinance"
 JAP_pol_national_service_draft_ordinance_desc:0 "The munitions industries are short of labour, and recruitment alone can no longer supply the hands they need. Under the National Mobilisation Law the government must be able to draft people into the factories and workplaces it names."
 JAP_pol_price_control_ordinance:0 "Price Control Ordinance"
 JAP_pol_price_control_ordinance_desc:0 "To hold down rising prices, every price is pegged at its level on a given day and any increase above it is forbidden. Wages, rents and freight rates are frozen in the same way, but as long as goods remain scarce the black market will be hard to stop."
 JAP_pol_anti_military_speech:0 "The Anti-Military Speech"
 JAP_pol_anti_military_speech_desc:0 "From the rostrum of the House of Representatives Saito Takao openly criticised the government and the military over their handling of the China Incident. To let stand a speech that casts doubt on the aims of the holy war would touch the morale of the men at the front and of the people. The House must expel him and show that the nation speaks with one voice."
 JAP_pol_anniversary_2600:0 "The 2600th Anniversary"
 JAP_pol_anniversary_2600_desc:0 "We have reached the memorable year that marks 2,600 years since the accession of Emperor Jimmu. We should take the occasion to hold grand ceremonies across the country and show the people the dignity of our national polity under an unbroken imperial line."
 JAP_pol_industrial_patriotic_association:0 "Industrial Patriotic Association"
 JAP_pol_industrial_patriotic_association_desc:0 "The industrialists and trade unions in our nation are split and inefficient, which hinders our economic development. We must unite all of these under one umbrella organization, so that our industries can be run as efficiently as possible, and lead to further expansion."
 JAP_pol_wartime_administrative_special_law:0 "Wartime Administrative Special Law"
 JAP_pol_wartime_administrative_special_law_desc:0 "To raise the output of steel, coal, light metals, ships and aircraft, the Prime Minister is empowered to give the ministers of state the instructions that are needed. With the rivalries of the ministries standing in the way of production, administrative authority must be gathered in the Prime Minister's hands."
 JAP_pol_speech_and_assembly_control_law:0 "Speech, Publication, Assembly and Association Control Law"
 JAP_pol_speech_and_assembly_control_law_desc:0 ""
 JAP_pol_munitions_company_law:0 "Munitions Company Law"
 JAP_pol_munitions_company_law_desc:0 "The key munitions firms are designated munitions companies, and a production manager whose appointment the government has a hand in is given full authority over the firm and made answerable for its output. With the demands of the state placed above the wishes of the shareholders, the firms will become organs of state production in name and in fact."
 JAP_pol_wartime_emergency_measures_law:0 "Wartime Emergency Measures Law"
 JAP_pol_wartime_emergency_measures_law_desc:0 "Against the day when the home islands become a battlefield, the government is empowered to issue whatever orders are needed on munitions production, food, transport, defence and much else, regardless of other laws. Now that there may not even be time to summon the Diet, there is nothing for it but to entrust the government with full powers."
 JAP_pol_army_purge_speech:0 "The Army Purge Speech"
 JAP_pol_army_purge_speech_desc:0 ""
 JAP_pol_fundamentals_of_national_policy:0 "Fundamentals of National Policy"
 JAP_pol_fundamentals_of_national_policy_desc:0 ""
 JAP_pol_south_seas_colonisation_company:0 "South Seas Colonisation Company"
 JAP_pol_south_seas_colonisation_company_desc:0 ""
 JAP_pol_new_order_in_east_asia:0 "New Order in East Asia"
 JAP_pol_new_order_in_east_asia_desc:0 "In recent statements by [ROOT.GetLeader], it has become ever more clear that he intends to establish a new order in East Asia, one which has six main goals. They include permanent stability of Eastern Asia, neighborly amity and international justice, joint defense against communism, the creation of a new culture, economic cohesion and co-operation and finally world peace."
 JAP_pol_basic_national_policy_outline:0 "Basic National Policy Outline"
 JAP_pol_basic_national_policy_outline_desc:0 ""
 JAP_pol_planning_board_incident:0 "The Planning Board Incident"
 JAP_pol_planning_board_incident_desc:0 "The Planning Board's draft, which calls for the separation of capital and management, has brought a storm of protest from business as a threat to private property. A new economic order cannot be built with the men who run production as its enemies. We should strike the radical clauses, arrest the officials who wrote the draft and bring the matter to a close."
 JAP_pol_planning_board_draft_stands:0 "The Planning Board's Draft Stands"
 JAP_pol_planning_board_draft_stands_desc:0 "The national defence state cannot be built if things are left to firms that put profit first. The time has come to separate capital from management, over the opposition of business if need be, and make the firms follow the plans of the state. Once that is done, production will move as the military requires."
 JAP_pol_neutrality_pact_with_the_soviet_union:0 "Neutrality Pact with the Soviet Union"
 JAP_pol_neutrality_pact_with_the_soviet_union_desc:0 "While we deal with the Allied Powers, we must make sure the border in Manchukuo and Korea is stable and protected, as a 2-front war would seal our collapse. This pact will of course prevent our expansion north for the time being."
 JAP_pol_negotiations_with_the_united_states:0 "Negotiations with the United States"
 JAP_pol_negotiations_with_the_united_states_desc:0 "Many questions lie unsettled between us and America, but there is still room to negotiate. If we keep patiently at the adjustment of relations through Ambassador Nomura, the worst can be put off."
 JAP_pol_outline_of_imperial_national_policy:0 "Outline of Imperial National Policy"
 JAP_pol_outline_of_imperial_national_policy_desc:0 ""
 JAP_pol_hull_note:0 "The Hull Note"
 JAP_pol_hull_note_desc:0 ""
 JAP_pol_volunteer_military_service_law:0 "Volunteer Military Service Law"
 JAP_pol_volunteer_military_service_law_desc:0 ""
 JAP_pol_arita_craigie_agreement:0 "Arita-Craigie Agreement"
 JAP_pol_arita_craigie_agreement_desc:0 "To settle the dispute over the concessions at Tientsin, Foreign Minister Arita and Ambassador Craigie conclude an agreement in which Britain recognises the special requirements of our forces in China. If relations with Britain ease, the day when Britain and America press on us together can be kept at a distance."
 JAP_pol_nomura_as_foreign_minister:0 "Nomura as Foreign Minister"
 JAP_pol_nomura_as_foreign_minister_desc:0 "Admiral Nomura Kichisaburo, known as a friend of America, is made Foreign Minister. To mend our relations with America, the best course is to entrust the talks to a man with many acquaintances there."
 JAP_pol_showa_restoration:0 "Carry Out the Showa Restoration"
 JAP_pol_showa_restoration_desc:0 ""
 JAP_pol_normal_constitutional_government:0 "Normal Constitutional Government"
 JAP_pol_normal_constitutional_government_desc:0 ""
 JAP_pol_political_upheaval:0 "Political Upheaval"
 JAP_pol_political_upheaval_desc:0 "In the Diet the parties denounce the military's meddling in politics, and the military looks on the parties as its enemies. As long as the two are at odds, no cabinet will last long. Unless a Prime Minister appears who can hold both in check, our politics will not be steady again."
 JAP_pol_yokusan_seijikai:0 "Imperial Rule Assistance Political Association"
 JAP_pol_yokusan_seijikai_desc:0 "For all the Imperial Rule Assistance Association, eighty-five candidates have got in without its recommendation. Left alone, they will make the Diet a foothold for attacks on the government once more. A single political association must be formed at once, every member brought into it, and the matter put right."
 JAP_pol_ultimatum_to_outer_mongolia:0 "Ultimatum to Outer Mongolia"
 JAP_pol_ultimatum_to_outer_mongolia_desc:0 ""
