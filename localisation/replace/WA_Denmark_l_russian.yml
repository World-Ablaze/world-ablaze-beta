l_russian:
 
 DEN_surrender_to_the_germans: "Сдаться немцам"
 
 
 den_armor.1.t: "Вопрос о Гренландии"
 den_armor.1.d: "Теперь, когда нашей родины больше нет, мы должны защитить наши колониальные владения. Мы решили передать Гренландию одной из демократических держав региона, но какой именно?"
 den_armor.1.a: "США будут охранять наши владения до окончания войны."
 den_armor.1.b: "Британия должна использовать наши базы для продолжения борьбы"
 den_armor.1.c: "Канада, скорее всего, впоследствии вернет наши владения."
  
 den_armor.2.t: "Передача Гренландии"
 den_armor.2.d: "После падения Дании правительство в изгнании поставило Гренландию под защиту Соединенных Штатов. Она должна оказаться полезной передовой оперативной базой для любого европейского вмешательства в будущем."
 den_armor.2.a: "Мы защитим их владения!"
  
 den_armor.3.t: "Передача Гренландии"
 den_armor.3.d: "После падения Дании правительство в изгнании передало Гренландию под юрисдикцию Его Величества. Это окажется полезным при защите наших торговых путей от рейдеров."
 den_armor.3.a: "Добро пожаловать в Империю!"
  
 den_armor.4.t: "Передача Гренландии"
 den_armor.4.d: "После падения Дании правительство в изгнании поставило Гренландию под контроль нашей страны. Нам от нее мало пользы, но это лучше, чем позволить ей попасть в руки врага."
 den_armor.4.a: "Мы защитим их владения!"
  
 den_armor.5.t: "Война проиграна"
 den_armor.5.d: "Германию, похоже, невозможно остановить: ее недавние завоевания еще свежи в нашей памяти, а помощи от союзников нет, поэтому у нас нет иного выбора, кроме как сдаться, чтобы избежать ненужных человеческих жертв."
 den_armor.5.a: "Чтобы предотвратить дальнейшее кровопролитие"
  
 den_armor.6.t: "Дания капитулирует"
 den_armor.6.d: "Дания осознала безвыходность своего положения и предложила сдать нам свою страну. Это прекрасная возможность заявить, что мы защищаем Данию только от агрессии союзников, и добиться согласия со стороны датского народа."
 den_armor.6.a: "Мы примем их капитуляцию"
 den_armor.6.b: "Мы возьмем свое железом и кровью!"
  
 den_armor.7.t: "Германия отвергает капитуляцию"
 den_armor.7.d: "Германия отвергла наше предложение о капитуляции и не оставила нам иного выбора, кроме как сражаться."
 den_armor.7.a: "Мы обречены."