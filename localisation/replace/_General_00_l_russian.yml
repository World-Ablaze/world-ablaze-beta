 FE_DIFFICULTY_HARD:1 "§OСложный§!"
 FE_DIFFICULTY_HARD_TOOLTIP:1 "§L§OДобавляет§!: \n§Y- Дополнительные дивизии для ИИ Советского Союза и Великобритании.§! \n§Y- ИИ резервы появляются с полным снаряжением.§! \n§Y- ИИ Советского Союза получает ускоренное время подготовки и меньшие потери опыта дивизий.§! \n§Y- Перл-Харбор — это скриптовое событие, которое повредит ваши корабли.§! \n§Y- ИИ Германии попытается провести «Морского льва» против игрока за Великобританию.§! \n§Y- Больше вторжений ИИ для создания дополнительных трудностей.§! \n§Y- ИИ Советского Союза получает более высокую эффективность воздушных миссий.§! \n§Y- ИИ флоты получают дополнительные бонусы, такие как позиционирование и координация флота.§! \n§Y- Китайский ИИ получает больше укреплений вокруг Чунцина.§! \n§Y- Британский ИИ получает больше верфей.§! §! \n"
 FE_DIFFICULTY_VERY_HARD: "§RОчень сложный§!"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP:1 "§L§Y«То же, что и «§OСложный§!», но с добавленными дебаффами для игрока, бездонная яма страданий и отчаяния».§!§!"
