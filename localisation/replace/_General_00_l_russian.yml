 SIA_GATHERING_STORM_DESC: "Сиам решил вступить в Великую войну, присоединившись к Антанте и отправив экспедиционные силы на западный фронт в Европе. После окончания Великой войны Сиам внес изменения в неравноправные договоры с Францией и Великобританией. После того как Сиам с помощью Объединенных Королевств разработал новую конституцию в 1920-1932 годах, Верховный государственный совет Сиама утвердил первую конституцию Сиама и провозгласил конституционную монархию в Сиаме с 1932 года."

  
