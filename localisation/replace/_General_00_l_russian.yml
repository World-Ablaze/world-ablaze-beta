 ELECTRONICS_TITLE_VEHICLE_WINCH: "Автомобильная лебедка"
 vehicle_winch: "Автомобильная лебедка с приводом от двигателя"
 vehicle_winch_desc: "С появлением более мощных автомобильных двигателей инженеры начали экспериментировать, как еще можно использовать избыточную мощность. Поскольку транспортные средства склонны застревать в грязи, была изобретена автомобильная лебедка с приводом от двигателя. Эта лебедка могла вытащить весь вес автомобиля из грязи, если ее можно было прикрепить к чему-то прочному."
 vehicle_winch_description: "§HМоторизованная и механизированная пехота\n   Лес§!\n   Передвижение: §G+5%§!\n   §YХолмы§!\n   Передвижение: §G+5%§!\n   §YРека§!\n   Передвижение: §G+5%§!\n   §YГоры§!\n   Передвижение: §G+10%§!\n   §YДжунгли§!\n   Передвижение: §G+10%§!\n   §YБолота§!\n   Передвижение: §G+10%§!\n   §YЛес + Болото§!\n   Передвижение: §G+10%§!"
  
 destroyer_desc: "Эсминецы — очень легкое судно для проверки. Его основная задача — защищать крупные корабли от торпед, охотиться на фрегаты и выполнять легкие задачи по сопровождению.\n\nФрегаты — самые легкие проверочные корабли. Его задача — находить и уничтожать подводные лодки и обеспечивать дешевую защиту."
  
