 GROUND_TIER_desc: "Развитие сухопутной доктрины подразделяется на 3 категории: артиллерия, танки и пехота. Эти доктрины дают выбор основной стратегии для уровня 1, продвинутой тактики для уровня 2 и специализированных решений для уровня 3."
  
 GROUND_TIER_2_desc: "Доступ к Доктрине Уровня 2 можно получить после завершения как минимум двух ветвей Доктрины Уровня 1. Доступ к Доктрине Уровня 3 открывается после завершения всей Доктрины Уровня 1 и как минимум двух ветвей Доктрины Уровня 2."
  
 GROUND_TIER_CHECK_2: "Доктрина уровня 2 становится разблокированной после завершения как минимум двух ветвей доктрины уровня 1."
  
 GROUND_TIER_CHECK_3: "Доктрина уровня 3 становится разблокированной после завершения как минимум двух ветвей доктрины уровня 2 И всей доктрины уровня 1."

 NAVAL_TIER_desc: "Развитие военно-морской доктрины подразделяется на 4 категории: крупные корабли, авианосцы, поддержка флота/конвоев и подводные лодки. Эти доктрины дают выбор основной стратегии для уровня 1, специализированных решений для уровня 2 и продвинутой тактики для уровня 3."
  
 NAVAL_TIER_2_desc: "\nКапитальные корабли и авианосцы являются взаимоисключающими на уровнях 2 и 3. Все остальные доктрины развиваются линейно."
  
 NAVAL_TIER_CHECK_2: "Доктрина уровня 2 становится разблокированной после завершения предыдущей доктрины уровня 1.\nКрупные корабли и авианосцы являются взаимоисключающими."
  
 NAVAL_TIER_CHECK_3: "Доктрина уровня 3 становится доступной после завершения предыдущей доктрины уровня 2.\nКрупные корабли и авианосцы являются взаимоисключающими."
  
  
  
 GREAT_AIR_WAR_DOCTRINE_LABEL: "Доктрина Великой Войны"
  
 AIR_TIER_desc: "Развитие воздушной доктрины подразделяется на 3 категории: истребители, поддержка и бомбардировщики. Эти доктрины разделены на 3 отдельных эктина, фокусирующихся на одном аспекте воздушной доктрины."
  
 AIR_TIER_2_desc: "Любой раздел можно начать в любое время и не требует предварительного заполнения других разделов."
  
  
  
  
  

 
 basic_machine_tools_comp: "Базовые станки"
 basic_machine_tools_comp_desc: "Целый ряд новейших фрезерных станков, которые можно использовать в военном машиностроении: от маленьких, гибких моделей, которые по карману любой мастерской, до больших, сложных станков, находящихся на острие технологии."
 improved_machine_tools_comp: "Улучшенные станки"
 improved_machine_tools_comp_desc: "Токарные станки незаменимы в массовом производстве. Более эффективное производство и применение самих станков позволит добиться промышленного преимущества."
 advanced_machine_tools_comp: "Усовершенствованные станки"
 advanced_machine_tools_comp_desc: "Идею автоматизировать станки с помощью сервоприводов обсуждали и ранее. Воплотив ее в жизнь, мы сможем добиться прорывов в других сферах автоматизации, таких, как компьютерная техника."
 assembly_line_production_comp: "Конвейерное производство"
 assembly_line_production_comp_desc: "Конвейерное производство уже используется в разных областях промышленности. Оно может изменить ход войны, поскольку позволяет сильно увеличить темп производства."
 flexible_line_comp: "Гибкий конвейер"
 flexible_line_comp_desc: "Конвейер хоть и работает как часы, но за ним по-прежнему трудятся люди, что позволяет адаптировать его под разные нужды. Мы должны использовать это в нашей промышленности."
 streamlined_line_comp: "Стандартизированный конвейер"
 streamlined_line_comp_desc: "Стандартизация и жестко заданная структура конвейерной линии являются залогами ее эффективности и безопасности. Мы должны сделать упор на эти аспекты в развитии нашей промышленности."
 construction1_comp: "Строительство I"
 construction1_comp_desc: "Усовершенствованные методы и материалы позволяют нам быстрее строить здания, как гражданские, так и военные."
 construction2_comp: "Строительство II"
 construction2_comp_desc: "Модернизация наших инструментов и оборудования будет способствовать дальнейшему развитию строительных работ."
 construction3_comp: "Строительство III"
 construction3_comp_desc: "Освоение современных транспортных средств и опыт, накопленный нами в строительстве, могут быть использованы для того, чтобы сделать ремонт намного быстрее."
 construction4_comp: "Строительство IV"
 construction4_comp_desc: "Более высокая степень механизации и более совершенные технологические процессы еще больше увеличивают скорость возведения зданий."
 construction5_comp: "Строительство V"
 construction5_comp_desc: "Будущее эффективного строительства потребует более тщательного планирования отдельных проектов, а также стандартизированных решений там, где это возможно."
 construction6_comp: "Строительство VI"
 construction6_comp_short: "Строительство VI"
 construction6_comp_desc: ""
 excavation1_comp: "Добыча ресурсов I"
 excavation1_comp_desc: "Совершенствование техники бурения позволяет нам добывать ресурсы, которые ранее были недоступны."
 excavation2_comp: "Добыча ресурсов II"
 excavation2_comp_desc: "Новые технологии помогают нам собирать ресурсы более эффективно. Мы больше не портим ресурсы при их добыче, что приводит к увеличению урожая."
 excavation3_comp: "Добыча ресурсов III"
 excavation3_comp_desc: "Прогресс в области геологии помогает нам определять местонахождение ресурсов. Теперь мы можем сосредоточить усилия по добыче в местах, где больше шансов найти большое количество природных ресурсов."
 excavation4_comp: "Добыча ресурсов IV"
 excavation4_comp_desc: "Автоматизация ключевых процессов и совершенствование механики делают все наши ресурсные площадки гораздо более эффективными."
 excavation5_comp: "Добыча ресурсов V"
 excavation5_comp_desc: "Достижения в таких областях, как добыча полезных ископаемых открытым способом, позволяют нам получать больше ресурсов из существующих мест добычи."
 excavation6_comp: "Добыча ресурсов VI"
 excavation6_comp_short: "Добыча ресурсов VI"
 excavation6_comp_desc: ""
 
