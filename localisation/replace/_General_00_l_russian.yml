 FINLAND_GATHERING_STORM_DESC: "Финляндии, стоящей в тени Красной Менансы, придется выбирать: сотрудничать с не очень дружественным союзником из соображений удобства или противостоять коммунистам в одиночку. Благодаря мощной тактике Мотти и замерзшему ландшафту страна может стать защитной адской дырой для тех, кто осмелится ступить на территорию Белой Смерти.\n\nНа какой стороне встанет Финляндия, когда осядет пыль? Другими словами, какое из зол будет меньшим?"
  
  
