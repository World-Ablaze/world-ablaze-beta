 FE_DIFFICULTY_VERY_EASY_TOOLTIP: "§L§Y«То же самое, что и «Легко», но с добавленными баффами для игроков. Идеально подходит для новичков».§!§!"
 FE_DIFFICULTY_EASY:1 "§3Легкий§!"
 FE_DIFFICULTY_EASY_TOOLTIP: "§L§Y«Убирает все баффы ИИ, кроме некоторого спавна дивизий, роста эффективности, возведения строений и исторических вторжений, которые ИИ не может выполнить самостоятельно.».§!§!"
