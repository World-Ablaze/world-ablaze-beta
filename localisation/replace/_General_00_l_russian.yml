 ARMY_EXPERIENCE_DESC: "Когда ваше снаряжение используется в бою, вы получаете армейский опыт. Это означает, что вы можете получить армейский опыт, когда ваши §HДивизии§! вступают в бой.\nВы также получаете опыт, проводя §HАрмейские учения§! с войсками уровня не ниже $UNIT_TRAINING_LEVEL|Y$ и в определенных §HНациональных фокусах§!. Некоторые §HМинистры§! могут увеличивать получаемый опыт.\n\nАрмейский опыт необходим для создания и изменения ваших §HШаблонов дивизий§!."
  
 SPA_secure_the_northern_garrisons_tt: "Увеличивает §Yгарнизонный контроль§! до §Gтотального§! в регионах §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[866.GetName]§!, §Y[176.GetName]§!, §Y[865.GetName]§!, §Y[166.GetName]§! и §Y[172.GetName]§!.\n\nНационалисты начнут гражданскую войну, контролируя эти провинции, пока их §Yгарнизонный контроль§! в них не ниже, чем §Oслабый§!.\n"
  
