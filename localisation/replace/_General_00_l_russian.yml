 BEL_GATHERING_STORM_DESC: "После того, как Бельгия попала под удар во время последней мировой войны, она снова стала нейтральной страной во все более жаркой Европе. Поскольку бельгийское общество политически поляризовано, необходимо будет принять решение о том, выбирать ли сторону, и, в таком случае, какую сторону выбрать.\n\nБудут ли гарантии нейтралитета Англии иметь значение на этот раз? Находится ли бельгийский нейтралитет под угрозой? Возможно, Бельгии следует начать заботиться о своих собственных интересах..."

