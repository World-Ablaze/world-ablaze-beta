 ger_heavy_cruiser_2: "Hipper Class"
 ger_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Адмирал Хиппер» были первыми тяжелыми крейсерами Kriegsmarine. Официально их водоизмещение составляло 10 000 тонн, но на самом деле оно превышало 16 000 тонн. Они были вооружены восемью 8-дюймовыми орудиями в четырех спаренных башнях и вторичной батареей из двенадцати 105-мм орудий."
  
  
