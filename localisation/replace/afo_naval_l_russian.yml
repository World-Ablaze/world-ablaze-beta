 fra_frigate_hull_1: "Bourrasque Class"
 fra_frigate_hull_1_desc: "По размеру «Bourrasque» сопоставим с большинством современных эсминцев. Они меньше и медленнее, чем Чакаль, но обладают хорошей для своего времени огневой мощью. Они дешевы и имеют ограниченную дальность действия, поэтому их лучше всего использовать для достижения военно-морского превосходства в прибрежных водах."
 fra_frigate_hull_2: "L'Adroit Class"
 fra_frigate_hull_2_desc: "L'Adroit очень похож на Bourrasque по дизайну и назначению. Изменения между ними относительно незначительны."
 fra_frigate_hull_3: "Bougainville Class"
 fra_frigate_hull_3_desc: "Эсминец Класса «Bougainville» предназначен для действий в самых дальних уголках Французской колониальной империи. Они предназначены для чрезвычайно длительных морских путешествий, но при этом значительно жертвуют скоростью. Это первый фрегат, оснащенный глубинными бомбами, но для этого он жертвует торпедными аппаратами."
 fra_frigate_hull_4: "La Melpomene Class"
 fra_frigate_hull_4_desc: "«La Melpomene» — это скорее торпедный катер, чем фрегат или эсминец. Он слабый, хрупкий и имеет ограниченный радиус действия. Однако его можно быстро и легко производить в больших количествах."
 fra_frigate_hull_5: "Le Hardi Class"
 fra_frigate_hull_5_desc: "Эскадренный эсминец Le Hardi сочетает в себе все, на что способен эсминец, и упаковывает это в меньший по размеру корабль. Он очень эффективен при сопровождении конвоев от широкого спектра угроз."
 fra_frigate_hull_6: "Le Fier Class"
 fra_frigate_hull_6_desc: "Le Fier спроектирован с учетом задач разведки и сопровождения в качестве единственного приоритета. Он жертвует наступательными возможностями своих орудий и торпед, но он чрезвычайно эффективен с точки зрения затрат при отслеживании и борьбе с подземными угрозами."
 fra_frigate_hull_7: "Surcouf Class"
 fra_frigate_hull_7_desc: "Использование передовых радиолокационных систем позволяет этому кораблю обнаруживать и уничтожать подводные лодки противника без особых усилий. Кроме того, возвращение к использованию торпед делает «Surcouf» ценным дополнением любого современного военно-морского флота."
  
 fra_destroyer_hull_1: "Chacal Class"
 fra_destroyer_hull_1_desc: "Тип «Chacal», классифицированный как большой эсминец, предназначен для использования в качестве разведывательного подразделения на линии боя. Он имеет относительно хорошую огневую мощь, но имеет высокую себестоимость производства. Он лучше всего подходит для обнаружения вражеских судов и может вступать в бой с другими легкими судами только в случае необходимости. Этот корабль не имеет глубинных бомб."
 fra_destroyer_hull_2: "Guepard Class"
 fra_destroyer_hull_2_desc: "Конструкция Guepard очень похожа на Chacal с несколько увеличенным корпусом и измененным вооружением. В результате он выполняет ту же роль, что и его предшественники, и имеет во многом те же преимущества и недостатки. Этот корабль не имеет глубинных бомб."
 fra_destroyer_hull_3: "Aigle Class"
 fra_destroyer_hull_3_desc: "Class Aigle продолжает традицию, очень похожую на предыдущие модели с небольшими изменениями. Наиболее заметным нововведением является добавление глубинных бомб, которые ранее не были доступны в других конструкциях, что позволяет противостоять подземным угрозам."
 fra_destroyer_hull_4: "Vauquelin Class"
 fra_destroyer_hull_4_desc: "Созданный для борьбы с быстрыми итальянскими легкими крейсерами, Le Fantasque имел увеличенную скорость и быстрее большинства других кораблей того времени. Высокая для эсминца бронепробиваемость позволяет ему поражать другие легкобронированные надводные корабли. Как и другие французские разработки, это крупный эсминец, имеющий значительную себестоимость производства."
 fra_destroyer_hull_5: "Le Fantasque Class"
 fra_destroyer_hull_5_desc: "Созданный для борьбы с быстрыми итальянскими легкими крейсерами, Le Fantasque имел увеличенную скорость и быстрее большинства других кораблей того времени. Высокая для эсминца бронепробиваемость позволяет ему поражать другие легкобронированные надводные корабли. Как и другие французские разработки, это крупный эсминец, имеющий значительную себестоимость производства."
 fra_destroyer_hull_6: "Mogador Class"
 fra_destroyer_hull_6_desc: "Mogador продолжает развивать концепцию быстрых и боеспособных эсминцев Le Fantasque. Эта конструкция включала восемь полузакрытых сдвоенных башен вместо размещения орудий по французскому стандарту с пятью открытыми установками. Его огневая мощь очень хороша для эсминца."
 fra_destroyer_hull_7: "Desaix Class"
 fra_destroyer_hull_7_desc: ""
 fra_destroyer_hull_8: "Kleber Class"
 fra_destroyer_hull_8_desc: "«Kleber» обеспечивает все необходимое от эсминца, поскольку он эффективен в обнаружении и уничтожении целей как над, так и под поверхностью океана. Его отличительной особенностью является высокий уровень противовоздушной обороны. За это приходится платить, поскольку судно относительно дорогое для эсминца."
  
