 depth_charges: "Глубинные бомбы"
 depth_charges_desc: "Простой взрывной контейнер с чувствительным к давлению спусковым крючком взрывается при достижении заданной глубины. Их легко установить на корму корабля, откуда их можно перебросить. \n\nМонтаж этого модуля на §Yфрегаты§!, §Yэсминцы§! и §Yкрейсеры§! позволит им атаковать §Yподводные лодки§!."
 k_guns: "Глубинный бомбомет"
 k_guns_desc: "Простое механическое устройство, которое бросает глубинную бомбу на заданное расстояние от корабля. Это означает, что эсминцу больше не придется проезжать прямо по цели, чтобы поразить ее. \n\nМонтаж этого модуля на §Yфрегаты§!, §Yэсминцы§! и §Yкрейсеры§! позволит им атаковать §Yподводные лодки§!."
 hedgehog_depth_charge_mortar: "Бомбомет «Хеджхог»"
 hedgehog_depth_charge_mortar_desc: "Миномет на борту эсминца может метать заряд взрывчатого вещества гораздо дальше и с гораздо большей скоростью, что позволяет кораблю поддерживать гидролокационный контакт с подлодкой на протяжении всей атаки и резко повышает ее точность.\n\nУстановка этого модуля на §Yфрегаты§! и §Yэсминцы§! позволит им атаковать §Yподводные лодки§!."
 squid_depth_charge_mortar: "Глубинный миномет «Кальмар»"
 squid_depth_charge_mortar_desc: "Метательный заряд большего размера бросает глубинную бомбу, установленную на определенную глубину, в подводную лодку с довольно большого расстояния.\n\nУстанавливаем этот модуль на §YФрегаты§! и §Yэсминцы§! позволит им атаковать §Yподводные лодки§!."
 advanced_sonar: "Гидроакустический буй"
 advanced_sonar_desc: "Одноразовая гидроакустическая система, которую сбрасывают/катапультируют с самолетов или кораблей для ведения противолодочной борьбы. они позволяют глубоко проникать в акваторию для ловли подводных лодок, действующих на гораздо больших глубинах."
 basic_submarine_fuel_tank: "Базовый топливный бак подводной лодки"
 basic_submarine_fuel_tank_desc: "Базовый дополнительный топливный бак, предназначенный для увеличения запаса топлива подводной лодки. Имея на борту больше топлива в резерве, дальность полета подводной лодки может быть увеличена, поскольку дозаправка требуется не так часто."
 improved_submarine_fuel_tank: "Усовершенствованный топливный бак подводной лодки"
 improved_submarine_fuel_tank_desc: "Усовершенствованный топливный бак подводной лодки, построенный на основе конструкции основного топливного бака подводной лодки, обеспечивает еще больший объем хранения дополнительного топлива. Это может значительно увеличить дальность действия подводной лодки, позволяя проводить операции дальше от дома."
 long_lance: "Длинное копье"
 long_lance_desc: "Усовершенствованная конструкция торпеды, обеспечивающая гораздо большую дальность полета. Он вооружает меньшие корабли эффективным способом поражения более крупных и бронированных военных кораблей с большего расстояния."
  
  
