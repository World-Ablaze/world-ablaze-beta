 eng_carrier_hull_1_desc: ""
 eng_carrier_hull_2: "Courageous Class"
 eng_carrier_hull_2_desc: ""
 eng_carrier_hull_3: "Ark Royal Class"
 eng_carrier_hull_3_desc: "Термин «Суперавианосец» впервые был использован газетой New York Times в 1938 году по отношению к HMS Ark Royal. Это заявление было сделано нелегко; Благодаря большому количеству самолетов, тяжелой зенитной батарее и скорости, позволяющей добраться до нужного места, интегрированная кабина экипажа и ангары Ark Royal представляют собой огромный шаг вперед в конструкции авианосца."
 eng_carrier_hull_4: "Illustrious Class"
 eng_carrier_hull_4_desc: "Концепция Illustrious Класса отличается от мышления США; они будут полагаться на свою собственную систему противовоздушной обороны и бронепалубы, чтобы защитить себя от самолетов противника, позволяя своим собственным сосредоточиться на своих задачах. Хотя это означает, что они не могут нести столько самолетов, сколько их американские коллеги, они более устойчивы, если противник застанет их врасплох."
 eng_carrier_hull_5: "Implacable Class"
 eng_carrier_hull_5_desc: "Сохраняя идею Illustious о наличии мощного зенитного вооружения и бронированной кабины экипажа, Class Implacable внес улучшения, приняв схему постоянного палубного парка в американском стиле, которая позволила ему нести гораздо больше самолетов, чем его предшественники."
 eng_carrier_hull_6: "Audacious Class"
 eng_carrier_hull_6_desc: "Имея более высокие ангары для размещения более современных самолетов, Class Audacious страдает от низкой вместимости самолетов по сравнению с некоторыми из своих современников."
 eng_carrier_hull_7: "Malta Class"
 eng_carrier_hull_7_desc: "Class «Malta», спроектированный для удовлетворения потребности Королевского флота в гораздо более крупном авианосце, способном нести на борту трехзначные самолеты, был крупнейшим классом авианосцев, разработанных Великобританией во время Второй мировой войны."
  
