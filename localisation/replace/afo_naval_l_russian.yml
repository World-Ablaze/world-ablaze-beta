 ita_frigate_hull_1: "Audace Class"
 ita_frigate_hull_1_desc: "Первоначально приобретенный в Великобритании, Audace служит командным эсминцем и лучше всего подходит для сопровождения конвоев из-за своей низкой стоимости и противолодочных возможностей."
 ita_frigate_hull_2: "Rosolino Pilo Class"
 ita_frigate_hull_2_desc: "Официально обозначенный как торпедный катер, «Розолино Пило» — слабый и хрупкий корабль с ограниченной дальностью полета. Он лучше всего подходит для сопровождения конвоев и должен по возможности избегать надводных столкновений."
 ita_frigate_hull_3: "General Classi"
 ita_frigate_hull_3_desc: "Созданный как развитие Класса Rosolino Pilo, Generali немного улучшает боевые возможности своего предшественника при очень небольшом увеличении стоимости производства."
 ita_frigate_hull_4: "Palestro Class"
 ita_frigate_hull_4_desc: "Торпедные катера типа «Palestro», как и другие итальянские фрегаты, являются дешевыми и хрупкими кораблями с ограниченными боевыми возможностями, но могут производиться в больших количествах. Он быстрее и имеет лучшее оружие по сравнению с Generali, но лишь с минутным отрывом."
 ita_frigate_hull_5: "Curtatone Class"
 ita_frigate_hull_5_desc: "Корабли Класса Curtatone были первыми кораблями, в которых использовалось спаренное вооружение. Это позволило использовать на корабле больше орудий меньшего размера. Он оснащен улучшенными зенитными орудиями, способными прикрыть флот от воздушных целей."
 ita_frigate_hull_6: "Spica Class"
 ita_frigate_hull_6_desc: "Из-за ограничений Вашингтонского военно-морского договора Class Spica был спроектирован как весовая категория, которую разрешалось производить в неограниченном количестве. Он легче и слабее своего предшественника во многих отношениях, но имеет приличное зенитное вооружение."
 ita_frigate_hull_7: "Ariete Class"
 ita_frigate_hull_7_desc: "Ariete — это увеличенная версия Класса Spica, разработанная с учетом задач сопровождения. В результате его основное вооружение значительно слабее, но имеет улучшенные торпеды и глубинные бомбы. Возможности обнаружения надводных и подводных целей значительно улучшились благодаря внедрению специализированных радиолокационных и гидроакустических систем."
 ita_frigate_hull_8: "Verona Class"
 ita_frigate_hull_8_desc: "«Verona» специально разработана для борьбы с подводными лодками противника благодаря своим превосходным глубинным бомбам и гидролокационным системам. Как и другие фрегаты, он не справится с надводными кораблями противника."
  
 ita_destroyer_hull_1: "Mirabello Class"
 ita_destroyer_hull_1_desc: "Первоначально обозначенные как крейсеры-разведчики, когда они были впервые построены во время Первой мировой войны, Class «Mirabello» является сильно устаревшим кораблем. Однако это один из немногих довоенных эсминцев, оснащенных как торпедными аппаратами, так и пусковыми установками глубинных бомб."
 ita_destroyer_1: "Mirabello Class"
 ita_destroyer_hull_2: "Leone Class"
 ita_destroyer_hull_2_desc: "Class «Leone» превосходит «Mirabello» в бою почти во всех отношениях, но при этом дешевле в производстве. Из-за неэффективного использования топлива дальность его эксплуатации сильно ограничена."
 ita_destroyer_hull_3: "Sella Class"
 ita_destroyer_hull_3_desc: "Эсминцы Класса «Sella» — небольшие и хрупкие корабли, которых не хватает во многих районах. Единственное их преимущество заключается в низкой себестоимости производства. Его лучше всего использовать для обеспечения местного военно-морского превосходства в далеко идущих заморских колониях."
 ita_destroyer_hull_4: "Sauro Class"
 ita_destroyer_hull_4_desc: "Sauro — это увеличенная и улучшенная версия Sella. Как и его предшественник, он пострадает в большинстве прямых столкновений, но может быть использован в небольших сражениях, где численное превосходство может иметь значение."
 ita_destroyer_hull_5: "Navigatori Class"
 ita_destroyer_hull_5_desc: "Созданные для борьбы с крупными французскими эсминцами, такими как Chacal и Guepard, Navigatori были существенно усовершенствованы по сравнению с предыдущими разработками. Им по-прежнему относительно не хватает наступательных возможностей, и вопрос о том, добьются ли они превосходства над другими эсминцами, остается дискуссионным."
 ita_destroyer_hull_6: "Folgore Class"
 ita_destroyer_hull_6_desc: "Во многих отношениях «Folgore» очень похож на «Навигатори». Единственные существенные улучшения, сделанные в Folgore, включают большую топливную экономичность и дальность полета."
 ita_destroyer_hull_7: "Maestrale Class"
 ita_destroyer_hull_7_desc: "Maestrale оснащен приличными глубинными бомбами и навесным вооружением, но при этом довольно доступен по цене. Он также значительно быстрее, приближаясь к скорости большинства современных эсминцев."
 ita_destroyer_hull_8: "Oriani Class"
 ita_destroyer_hull_8_desc: "Class «Oriani» оснащен улучшенными тройными 533-мм торпедными аппаратами и зенитным вооружением."
 ita_destroyer_hull_9: "Soldati Class"
 ita_destroyer_hull_9_desc: "По сути, это копия конструкции Oriani, Soldati имеет немного улучшенные глубинные бомбы и мобильность."
 ita_destroyer_hull_10: "Comandanti Medaglie d'Oro Class"
 ita_destroyer_hull_10_desc: "Используя опыт современных морских боев, это судно оснащено усовершенствованным радаром, способным легко обнаруживать врагов, но требует значительного увеличения стоимости."
 ita_destroyer_hull_11: "Ascari Class"
 ita_destroyer_hull_11_desc: "«Ascari» — хорошо продуманный эсминец, обладающий хорошей дальностью полета и боеспособностью. Хотя он не превосходен ни в одном аспекте, он и не особенно плох ни в одном из них."
  
