 jap_frigate_hull_1: "Chidori Class"
 jap_frigate_hull_1_desc: "Для корабля такого веса «Чидори» имеет большое количество вооружения, что приводит к проблемам с надежностью во время эксплуатации. Хотя у него все еще относительно слабые боевые характеристики, он обладает умеренным уровнем огневой мощи, которую можно производить в ошеломляющих количествах."
 jap_frigate_hull_2: "Otori Class"
 jap_frigate_hull_2_desc: "Торпедный катер «Отори» немного крупнее «Чидори» и более прочен. Хотя его орудия слабее, он имеет улучшенную систему ПВО и торпеды, что обеспечивает ему повышенную универсальность."
 jap_frigate_hull_3: "Shimushu Class"
 jap_frigate_hull_3_desc: "Shimushu предназначен в качестве патрульного и эскортного судна, в первую очередь предназначенного для защиты прибрежных вод, представляющих небольшой риск или стратегическую ценность. Он имеет значительно улучшенные возможности обнаружения по сравнению с «Отори» и оснащен глубинными бомбами. Это очень медленно."
 jap_frigate_hull_4: "Etorofu Class"
 jap_frigate_hull_4_desc: "Почти идентичен классу «Shimushu», основным усовершенствованием «Итурупу» является использование усовершенствованного радара, значительно улучшающего возможности обнаружения кораблей."
 jap_frigate_hull_5: "Mikura Class"
 jap_frigate_hull_5_desc: "Class Mikura очень похож на Shimushu и Эторофу, но использует оружие двойного назначения. В результате он очень хорошо защищает конвои от воздушных угроз. По сравнению с другими фрегатами того времени, «Mikura» не хватает возможностей глубинных бомб, и он может быть немного слабым при защите от подводных лодок."
 jap_frigate_hull_6: "Type C/D Class"
 jap_frigate_hull_6_desc: "Корабли типов C и D значительно улучшают противолодочные возможности наших эскортов, но при этом остаются дешевыми в производстве. Однако они пока сильно отстают от наших конкурентов и, возможно, не смогут противостоять более совершенным подводным лодкам."
  
 jap_destroyer_hull_1: "Minekaze Class"
 jap_destroyer_hull_1_desc: "«Minekaze» — наш первый военный корабль, оторвавшийся от иностранных замыслов европейцев. Он приводится в движение двухвальными турбинами с редуктором, что позволяет ему развивать чрезвычайно высокие скорости. Однако это приводит к быстрому потреблению энергии, что приводит к очень малому рабочему диапазону. Он очень похож на родственные ему эсминцы типов Kamikaze и Муцуки."
 jap_destroyer_hull_2: "Kamikaze Class"
 jap_destroyer_hull_2_desc: "Эсминец Класса «Kamikaze» имеет более слабые глубинные бомбы и меньшую скорость, чем «Минкадзе», за счет увеличения дальности действия."
 jap_destroyer_hull_3: "Mutsuki Class"
 jap_destroyer_hull_3_desc: "Муцуки имеет лишь незначительные отличия от Kamikaze и Minekaze. Он отличается увеличенной дальностью действия и уменьшенной скоростью, как у «Kamikaze», а также улучшен по сравнению с глубинными бомбами, которые присутствовали в конструкции «Минкадзе»."
 jap_destroyer_hull_4: "Fubuki Class"
 jap_destroyer_hull_4_desc: "«Fubuki» — первый современный эсминец Японии, обладающий значительно улучшенными торпедами, противовоздушной обороной и дальностью действия. Он способен выполнить все это, оставаясь при этом относительно доступным. У него есть очевидная слабость – неспособность эффективно обнаруживать и атаковать подводные лодки."
 jap_destroyer_hull_5: "Hatsuharu Class"
 jap_destroyer_hull_5_desc: "Из-за ограничений Вашингтонского военно-морского договора корабли такого размера, как «Fubuki», больше не могут производиться в больших количествах. Class Hatsuharu — более дешевая, но эффективная альтернатива. Хотя его торпеды слабее, его основные орудия очень хороши по сравнению с большинством современных эсминцев."
 jap_destroyer_hull_6: "Shiratsuyu Class"
 jap_destroyer_hull_6_desc: "Разработанный как модификация Класса «Hatsuharu», «Shiratsuyu» сохраняет огневую мощь своих предшественников, но в то же время вносит значительные улучшения в торпедные возможности, что делает его одним из самых мощных Классов эсминцев того времени. Как и все его предшественники, он не содержит средств противолодочного противодействия."
 jap_destroyer_hull_7: "Asashio Class"
 jap_destroyer_hull_7_desc: "После выхода из Лондонского военно-морского договора наша славная нация больше не ограничена в своих возможностях производить мощные военные корабли. Asashio спроектирован как наступательный корабль, как и его предшественник, но с увеличенной дальностью полета и скоростью, что позволяет нам обеспечить контроль над дальними районами Тихого океана."
 jap_destroyer_hull_8: "Kagero Class"
 jap_destroyer_hull_8_desc: "«Kagero», как и «Asashio», не имеет себе равных среди большинства других современных эсминцев с точки зрения боеспособности. Он также включает улучшения в обнаружении подводных лодок и возможностях противовоздушной обороны. Однако ему по-прежнему не хватает эффективных глубинных бомб."
 jap_destroyer_hull_9: "Yugumo Class"
 jap_destroyer_hull_9_desc: "«Югумо» представляет собой повторную конструкцию «Kagero» с улучшенными возможностями гидролокатора и радара, что значительно улучшает возможности военного корабля по разведке и наведению огня. Однако у него по-прежнему нет какого-либо значимого вооружения глубинными бомбами, а это означает, что ему все еще придется бороться с подводными лодками противника."
 jap_destroyer_hull_10: "Akizuki Class"
 jap_destroyer_hull_10_desc: "Используя батареи двойного назначения, «Akizuki» способен достичь высокого уровня огневой мощи и противовоздушной обороны. Хотя его противовоздушная оборона является значительным улучшением по сравнению с его предшественником, она все еще низка по сравнению с американскими эсминцами. Это первый из наших эсминцев, оснащенный усовершенствованными глубинными бомбами."
 jap_destroyer_hull_11: "Matsu Class"
 jap_destroyer_hull_11_desc: "Class «Matsu» отличается от большинства других японских эсминцев тем, что этот корабль в первую очередь создавался для сопровождения. В результате он намного дешевле и может производиться в больших количествах, но он слабее практически по всем аспектам."
 jap_destroyer_hull_12: "Shimakaze Class"
 jap_destroyer_hull_12_desc: "«Shimakaze» лишен необходимости основного артиллерийского вооружения и вместо этого оснащен 15 торпедными аппаратами, способными нанести огромный урон кораблям противника. Он также обладает чрезвычайно высокой скоростью и сильным противовоздушным вооружением, но его производство требует огромных затрат."
  
