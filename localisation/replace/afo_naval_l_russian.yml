 eng_frigate_hull_1: "Bridgewater Class"
 eng_frigate_hull_1_desc: "Шлюп Класса «Bridgewater» — дешевый патрульный корабль, предназначенный для сопровождения конвоев низкого приоритета. По возможности следует избегать контакта с поверхностью."
 eng_frigate_hull_2: "Shoreham Class"
 eng_frigate_hull_2_desc: "Шлюп Класса «Shoreham» оснащен немного лучшей системой противовоздушной обороны по той же низкой цене."
 eng_frigate_hull_3: "Grimsby Class "
 eng_frigate_hull_3_desc: "«Grimsby» оснащен более тяжелым вооружением, чем предыдущие шлюпы, что позволяет ему побеждать некоторые фрегаты противника. Ему по-прежнему следует избегать боя со стандартными кораблями флота."
 eng_frigate_hull_4: "Bittern Class"
 eng_frigate_hull_4_desc: "Class «Bittern» имеет более мощные орудия по сравнению с любым другим фрегатом того времени, что позволяет ему действовать наравне с некоторыми эсминцами и даже превосходить их. Низкая стоимость и большой радиус действия позволяют ему служить эффективным средством проецирования силы."
 eng_frigate_4: "Bittern Class"
 eng_frigate_hull_5: "Egret Class"
 eng_frigate_hull_5_desc: "«Egret» — это увеличенная версия «Bittern», оснащенная улучшенными системами управления огнем. Как и «Bittern», это мощная канонерская лодка, обладающая к тому же хорошими зенитными возможностями. Хотя корабль также имеет улучшенный гидролокатор для обнаружения подводных лодок, у него нет обновлений для глубинных бомб."
 eng_frigate_hull_6: "Black Swan Class"
 eng_frigate_hull_6_desc: "«Черный лебедь» жертвует большей частью огневой мощи «Egret» в пользу установки большего количества глубинных бомб для противолодочной борьбы. У него по-прежнему хорошие ГК, но он будет чаще проигрывать в боях с эсминцами противника."
 eng_frigate_hull_7: "Hunt Class"
 eng_frigate_hull_7_desc: "Class «Hunt» больше похож на стандартные фрегаты, чем предыдущие британские конструкции, поскольку у него низкая огневая мощь и вместо этого он выполняет роль корабля сопровождения конвоев. Он имеет гораздо более высокую скорость, чем предыдущие модели, что позволяет ему догонять и перехватывать подводные лодки противника."
 eng_frigate_hull_8: "Flower Class"
 eng_frigate_hull_8_desc: "Корвет Класса «Flower» оснащен очень ограниченным основным вооружением, которое превосходит даже самые маленькие торпедные катера. Однако он чрезвычайно эффективен при обнаружении судов противника и оснащен чрезвычайно мощными глубинными бомбами, способными испарять подводные лодки противника."
 eng_frigate_hull_9: "River Class"
 eng_frigate_hull_9_desc: "Class «River» совершенствует глубинные бомбы и зенитные орудия, чтобы помочь защититься от огромного количества вражеских угроз. Он также имеет очень большую дальность действия, что позволяет ему защищать конвои на обширных просторах нашей империи."
 eng_frigate_hull_10: "Loch Class"
 eng_frigate_hull_10_desc: "Фрегат Класса «Лох» — это современный корабль, созданный на основе многолетнего опыта противолодочной борьбы. Как и предыдущие разработки, он имеет минимальную огневую мощь в пользу глубинных бомб и зенитных орудий. У него самые эффективные глубинные бомбы среди всех кораблей."
 eng_frigate_hull_11: "Type 15 Class"
 eng_frigate_hull_11_desc: "Type 15 имеет те же глубинные бомбы, что и «Лох», но с улучшенным обнаружением подводных лодок и зенитным вооружением. Это дорого для фрегата, но оно того стоит, если подводные лодки представляют собой проблему."
  
 eng_destroyer_hull_1: "V/W Class"
 eng_destroyer_hull_1_desc: "Корабли Классов V и W датируются Первой мировой войной и слабы по сравнению с большинством других кораблей того времени. При невысокой стоимости он обладает высокой дальностью действия, позволяя защищать отдаленные районы нашей огромной колониальной империи. Высокая противовоздушная способность также позволяет ему защищаться от самолетов противника."
 eng_destroyer_1: "V/W Class"
 eng_destroyer_hull_2: "Shakespeare Class"
 eng_destroyer_hull_2_desc: "Class «Shakespeare» или «Thornycroft» имеет гораздо лучшее основное вооружение, чем эсминцы типов V и W, но ему не хватает такой же эффективности зенитного огня. Самым важным его изменением является введение глубинных бомб, позволяющих защитить его от подводных лодок противника."
 eng_destroyer_hull_3: "A/B/C/D Class"
 eng_destroyer_hull_3_desc: "Эсминцы типов A/B/C/D имеют значительно увеличенную дальность действия, большую, чем у любого другого эсминца любой нации. Модернизация торпед также позволяет этим кораблям угрожать более крупным кораблям противника по низкой цене."
 eng_destroyer_hull_4: "E/F/G/H Class "
 eng_destroyer_hull_4_desc: "Эсминцы типов E/F/G/H аналогичны своим непосредственным предшественникам, за исключением немного более слабых основных орудий и более низкой стоимости."
 eng_destroyer_hull_5: "I Class"
 eng_destroyer_hull_5_desc: "Сохраняя сильные и слабые стороны британских эсминцев, I Class делает упор на торпеды и дальность действия, а не на основные орудия. Усовершенствования глубинных бомб корабля позволяют ему более эффективно бороться с подводными лодками противника."
 eng_destroyer_hull_6: "Class Tribal"
 eng_destroyer_hull_6_desc: "Class Tribal является исключением из предыдущих британских проектов, поскольку в нем больше внимания уделяется огневой мощи, чем торпедам. Он также жертвует некоторыми глубинными бомбами, чтобы их можно было разместить на большем количестве зенитных орудий."
 eng_destroyer_hull_7: "J/K/N Class"
 eng_destroyer_hull_7_desc: "Эсминцы типов J/K/N смогли объединить огневую мощь и торпеды предыдущих моделей и Tribal, в результате чего получился эффективный эсминец, стоимость производства которого действительно выросла."
 eng_destroyer_hull_8: "L/M Class"
 eng_destroyer_hull_8_desc: "Отличительной особенностью эсминцев Классов L и M является более тяжелое зенитное вооружение. Небольшие улучшения также были внесены в возможности обнаружения и глубинные бомбы, что сделало это судно очень эффективным для разведки и сопровождения."
 eng_destroyer_hull_9: "Q/R Class"
 eng_destroyer_hull_9_desc: "Эсминцы Классов Q и R страдают от снижения боевой эффективности в обмен на улучшение разведывательных и противолодочных возможностей. Эти корабли лучше всего подходят для сопровождения конвоев."
 eng_destroyer_hull_10: "S/T Class"
 eng_destroyer_hull_10_desc: "Эсминцы типов S и T следуют той же схеме конструкции, что и Q и R, не уделяя большого внимания чистой огневой мощи, а вместо этого сосредотачиваются на улучшении радара и глубинных бомб."
 eng_destroyer_hull_11: "Battle Class"
 eng_destroyer_hull_11_desc: "Опыт военного времени показал, что наши эсминцы недостаточно оснащены для отражения сосредоточенных атак с воздуха. Battle Class оснащен спаренными артиллерийскими орудиями High Angle, способными уничтожать самолеты противника. У корабля отсутствуют эффективные глубинные бомбы, а значит, он будет бороться с подводными лодками противника."
 eng_destroyer_hull_12: "Weapon Class"
 eng_destroyer_hull_12_desc: "Маленький родственник боевого Класса, Class оружия не оснащен зенитным вооружением в такой степени, как Battle Class. Хотя у него лучшие глубинные бомбы, чем у Оружия, они все равно довольно слабы."
 eng_destroyer_hull_13: "Daring Class"
 eng_destroyer_hull_13_desc: "«Daring» намного крупнее любого из наших предыдущих эсминцев. Как и другие недавние разработки, «Daring» отлично справляется с уничтожением самолетов противника, но страдает от противолодочной борьбы."
  
