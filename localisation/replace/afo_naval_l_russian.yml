 sov_frigate_hull_1: "Класс «Ураган»"
 sov_frigate_hull_1_desc: "Этот небольшой патрульный корабль оснащен глубинными бомбами, способными бороться с подводными лодками, но не имеет других наступательных возможностей. Используйте его для сопровождения прибрежных вод, но по возможности избегайте надводных боев."
 sov_frigate_hull_2: "Класс «Ураган»"
 sov_frigate_hull_2_desc: "«Ястреб» значительно крупнее «Урагана», но в результате его стоимость увеличивается. Хотя он лучше подходит для надводного боя, чем его предшественник, этот корабль не следует использовать там. Из-за слабых глубинных бомб этого судна его не следует использовать широко."
 sov_frigate_hull_3: "Класс «Кольский»"
 sov_frigate_hull_3_desc: "Похожий по истории на своих предшественников, Class «Кольский» — это фрегат, который превосходит стандартные эсминцы как в надводном бою, так и в сопровождении конвоев."
  
 sov_destroyer_hull_1: "Класс «Орфей»"
 sov_destroyer_hull_1_desc: "Класс «Орфей» отстает от большинства военно-морских держав мира. У него очень плохое торпедное и основное вооружение. Однако раннее внедрение глубинных бомб и низкая стоимость позволяют ему выполнять функции сопровождения."
 sov_destroyer_1: "Класс «Орфей»"
 sov_destroyer_hull_2: "Класс «Фидонисий»"
 sov_destroyer_hull_2_desc: "Класс «Фидонисий» имеет плохие наступательные возможности, но обладает превосходными возможностями противовоздушной и противолодочной обороны по сравнению с большинством других эсминцев. Следовательно, его следует использовать для сопровождения и избегать надводных боев."
 sov_destroyer_hull_3: "Класс «Ленинград»"
 sov_destroyer_hull_3_desc: "Лидер эсминца класса «Ленинград» спроектирован как большой и быстрый эсминец, способный обеспечить значительную огневую мощь при небольших затратах. Он сохраняет высокую противолодочную эффективность своих предшественников."
 sov_destroyer_hull_4: "Класс «Гневный»"
 sov_destroyer_hull_4_desc: "Меньший и более дешевый, чем класс «Ленинград», «Гневный» был спроектирован при содействии ВМС Италии. Хотя он немного слабее «Ленинграда», он находится на одном уровне с точки зрения большинства боевых характеристик, но его легче производить."
 sov_destroyer_hull_5: "Класс «Сторожевой»"
 sov_destroyer_hull_5_desc: "«Сторожевой» включает в себя некоторые небольшие улучшения в зенитном вооружении и радаре, но в основном аналогичен предыдущему классу «Гневный». Небольшие улучшения коснулись мореходных качеств судна."
 sov_destroyer_hull_6: "Класс «Ташкент»"
 sov_destroyer_hull_6_desc: "Лидер эсминца класса «Ташкент» получил модернизацию главных батарей и глубинных бомб. Корабль намного больше и может преодолевать гораздо большие расстояния, чем любой предыдущий советский эсминец. Однако эти изменения приводят к значительному увеличению стоимости."
 sov_destroyer_hull_7: "Класс «Огневой»"
 sov_destroyer_hull_7_desc: "«Огневой» — один из наших крупных эсминцев, но он мало что дает с точки зрения реальных боевых возможностей. Во многих отношениях он слабее некоторых наших старых моделей, хотя и дороже."
 sov_destroyer_hull_8: "Класс «Киев»"
 sov_destroyer_hull_8_desc: "Класс «Киев» — одна из самых масштабных модернизаций нашей линейки эсминцев на сегодняшний день. Он включает в себя все улучшения в области обнаружения, защиты конвоев и грубой наступательной мощи. Однако за все это приходится платить, поскольку на данный момент это наш самый дорогой эсминец."
 sov_destroyer_hull_9: "Класс «Грозовой»"
 sov_destroyer_hull_9_desc: "Наиболее значительные изменения, присутствующие на «Грозовом», — это модернизация радара и гидролокатора обнаружения, позволяющая быстро обнаруживать цели. Второе важное изменение — значительно улучшенное зенитное вооружение."
 sov_destroyer_hull_10: "Класс «Хабаровск»"
 sov_destroyer_hull_10_desc: "«Хабаровск» — очень дорогой эсминец, но это чрезвычайно способная машина, способная выполнять любую возможную роль."
  
