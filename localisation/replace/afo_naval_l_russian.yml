 ger_frigate_hull_1: "Type 23 Class"
 ger_frigate_hull_1_desc: "Торпедный катер Type 23 — дешевое судно с торпедной установкой, которое лучше всего использовать для вспомогательных задач, таких как патрулирование и сопровождение. По возможности следует избегать прямых столкновений с военными кораблями противника."
 ger_frigate_hull_2: "Type 24 Class"
 ger_frigate_hull_2_desc: "Type 24 очень похож на предыдущий Class Type 23, но немного больше и дороже в производстве, чтобы обеспечить большую дальность действия."
 ger_frigate_hull_3: "F Class"
 ger_frigate_hull_3_desc: "Первый и единственный корабль сопровождения флота, построенный Кригсмарине, Класса F. Это дешевое и эффективное судно для защиты маршрутов конвоев от подводных лодок противника. Обратите внимание, что этот корабль гораздо медленнее других немецких фрегатов."
 ger_frigate_hull_4: "Type 35 Class"
 ger_frigate_hull_4_desc: "Торпедный катер Type 35 предназначен для поддержки действий флота путем сопровождения и патрулирования прибрежных вод. Он имеет эффективную радиолокационную систему и торпеды при относительно небольших затратах на производство."
 ger_frigate_hull_5: "Type 37 Class"
 ger_frigate_hull_5_desc: "Type 37 продолжает совершенствовать радиолокационные возможности линейки эсминцев, чтобы обеспечить быстрое обнаружение флота противника. Никакого улучшения боеспособности в этом классе кораблей не произошло."
 ger_frigate_hull_6: "Type 39 Class"
 ger_frigate_hull_6_desc: "Type 39 значительно улучшает огневую мощь, обнаружение и противолодочные возможности, но имеет значительно увеличенную стоимость, более похожую на стоимость типичного эсминца."
 ger_frigate_hull_7: "Type 40 Class"
 ger_frigate_hull_7_desc: "Подобно Type 39, Type 40 имеет очень высокий для фрегата уровень огневой мощи, сохраняя при этом отличные противолодочные меры. Однако за это приходится платить, поскольку производство корабля для фрегата очень дорого."
 ger_frigate_hull_8: "Type 41 Class"
 ger_frigate_hull_8_desc: "Type 41 спроектирован как более дешевая альтернатива Type 40. Для производства большего количества этих кораблей были принесены в жертву основные орудия и средства ПВО."
 ger_frigate_hull_9: "Type 44 Class"
 ger_frigate_hull_9_desc: "Type 44 — это дальнейшая оптимизация Type 41, которую можно производить по более низкой цене. Хотя у кораблей есть глубинные бомбы, они сильно устарели по сравнению с конкурентами и должны быть модернизированы для борьбы с современными подводными лодками."
  
 ger_destroyer_hull_1: "1934 Class "
 ger_destroyer_hull_1_desc: "Несмотря на морские ограничения, наложенные на нашу страну, мы создали эсминец, превосходящий все, что есть у наших врагов. Несмотря на свою цену, этот эсминец имеет хорошие орудия, торпеды и глубинные бомбы, что позволяет ему добиваться успеха практически во всех аспектах морского боя. Самой серьезной проблемой этого корабля является крайне малая дальность действия."
 ger_destroyer_hull_2: "1934A Class"
 ger_destroyer_hull_2_desc: "Class 1934A имеет небольшие изменения в мореходности, позволяющие судну преодолевать большие расстояния. Эти изменения, однако, незначительны и приводят лишь к столь же небольшому увеличению себестоимости продукции."
 ger_destroyer_hull_3: "1936 Class"
 ger_destroyer_hull_3_desc: "Эти военные корабли, также известные как Class Z17, еще больше улучшают дальность и надежность предыдущих Классов с минимальными изменениями в боевых возможностях или вообще без них. Внедрение активного гидролокатора действительно дает бонусы к обнаружению подводных лодок."
 ger_destroyer_hull_4: "1936A Class"
 ger_destroyer_hull_4_desc: "Этот улучшенный вариант Класса 1936 года включает в себя улучшенные торпеды и радар. Этот военный корабль по-прежнему оснащен гораздо более мощными орудиями, чем у типичного эсминца."
 ger_destroyer_hull_5: "1936B Class"
 ger_destroyer_hull_5_desc: "Модель 1936B еще больше улучшает радиолокационные возможности этого Класса эсминцев, позволяя быстро обнаруживать надводные и подводные цели. В конструкции также предусмотрены модификации огневой мощи и противовоздушной обороны."
 ger_destroyer_hull_6: "1936C Class"
 ger_destroyer_hull_6_desc: "Благодаря усовершенствованным радиолокационным системам и системам управления огнем самолеты Класса 1936C лучше обнаруживают и поражают цели по сравнению со своими предшественниками. Он оснащен значительно модернизированным зенитным вооружением и улучшенными мореходными качествами."
 ger_destroyer_hull_7: "1942 Class"
 ger_destroyer_hull_7_desc: "Первый Class Кригсмарине, использующий дизельное топливо, эсминцы Класса 1942 года, способные действовать на дальних дистанциях в море. Торпедными аппаратами слегка пожертвовали в пользу чистой огневой мощи. Из-за относительно больших размеров эсминца его массовое производство обходится дорого."
 ger_destroyer_hull_8: "1944 Class"
 ger_destroyer_hull_8_desc: "Чтобы бороться с превосходством противника в линкорах и авианосцах, модель 1944 года фокусируется на более широком использовании торпед и средств ПВО, чтобы позволить этим меньшим кораблям справляться с этими угрозами."
  
