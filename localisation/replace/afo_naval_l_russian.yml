 eng_battleship_hull_1: "Revenge Class"
 eng_battleship_hull_1_desc: "Несмотря на то, что корабли мести были построены после Класса «Queen Elizabeth», они были сравнительно более слабыми по сравнению со своими предшественниками, в частности, они были на 3 узла медленнее. Это было мотивировано сокращением расходов, поскольку гонка дредноутов уже начала приносить свои плоды."
 eng_battleship_hull_2: "Queen Elizabeth Class"
 eng_battleship_hull_2_desc: "Вероятно, первый Class быстрых линкоров, пришедший на смену супердредноуту, Class «Queen Elizabeth» представлял собой отказ от компромисса линейного крейсера, который менял броню на скорость. Таким образом, Class «Queen Elizabeth» мог наносить и принимать наказания в драке с таким же линкором, в то же время имея возможность убегать и перехитрить их. Благодаря переоборудованию Class «Королева Елизавета» сохранит свою полезность во время Второй мировой войны."
 eng_battleship_hull_3: "Nelson Class"
 eng_battleship_hull_3_desc: "Когда проектируемый линкор Класса N3 стал незаконным согласно Вашингтонскому военно-морскому договору, его перепроектировали в Class «Nelson». Class «Nelson», имеющий необычное вооружение со всеми тремя башнями, расположенными впереди надстройки, не похож ни на один другой линкор, отправляющийся в плавание. Тем не менее, с его 16-дюймовыми пушками нельзя шутить."
 eng_battleship_hull_4: "King George V Class"
 eng_battleship_hull_4_desc: "Из-за ограничений Лондонского военно-морского договора в целях экономии веса на них будут установлены только 14-дюймовые орудия, однако конструкция полностью способна использовать тройные 15- или 16-дюймовые орудия при отсутствии договорных ограничений."
 eng_battleship_hull_5: "Lion Class"
 eng_battleship_hull_5_desc: "Учитывая ограничения военно-морских договоров, выброшенные из окна с началом войны, Class Lion представляет собой усовершенствование Класса King George V, будучи вооруженным 16-дюймовыми пушками, для установки которых изначально были разработаны KGV. . Class «Lion» также вносит улучшения во всех отношениях, особенно в скорости и броне."
 eng_battleship_hull_6: "Vanguard Class"
 eng_battleship_hull_6_desc: "Первоначально начавшийся как временное решение с использованием лишних 15-дюймовых орудий на хранении для вывода линкоров в море во время постройки «Lion», конструкция HMS Vanguard постоянно менялась, чтобы отражать уроки войны. Это критически проявляется в ее возмутительном зенитном вооружении, призванном противостоять угрозе авианосцев."
  
