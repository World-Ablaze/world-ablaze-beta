 usa_frigate_hull_1: "Evarts Class"
 usa_frigate_hull_1_desc: "Известный также как класс Captain, Evarts является первым в линейке эсминцев сопровождения. Он относительно дешев, но наносит необходимый удар по подводным лодкам, которого не хватает эсминцам. Его следует использовать только в качестве эскорта и по возможности избегать надводных боев."
 usa_frigate_hull_2: "Buckley Class"
 usa_frigate_hull_2_desc: "Класс Buckley улучшает противолодочные функции и оснащен торпедным аппаратом на случай надводного боя. По-прежнему должен использоваться только в роли эскорта, однако с увеличением скорости может выполнять роль охотника за подводными лодками."
 usa_frigate_hull_3: "Rudderow Class"
 usa_frigate_hull_3_desc: "В соответствии с американской модой, «Руддероу» оснащен наибольшим количеством рельсотронов и метательных установок среди всех фрегатов, что делает его превосходным кораблем сопровождения."
 usa_frigate_hull_4: "John C. Butler Class"
 usa_frigate_hull_4_desc: "По сравнению с предшественником класс «Батлер» имеет несколько улучшенную противовоздушную защиту и дальность полета."
 usa_frigate_hull_5: "Dealey Class"
 usa_frigate_hull_5_desc: "Dealey значительно улучшает противолодочные возможности, а также имеет улучшенное вооружение и скорость."
  
 usa_destroyer_hull_1: "Clemson Class"
 usa_destroyer_hull_1_desc: "Разработанный как расширение Класса Wickes, Clemson предназначался для выполнения противолодочной роли. В результате он имеет ограниченные возможности противовоздушной обороны и ограниченную огневую мощь. Корабль дешев и лучше всего подходит для использования в эскортных вылетах."
 usa_destroyer_hull_2: "Farragut Class"
 usa_destroyer_hull_2_desc: "В «Farragut» используется новая пушка двойного назначения, способная поражать как надводные, так и воздушные цели. Это в сочетании с дополнительными торпедными аппаратами значительно повышает боевые качества этого корабля. Изменения во внутренней работе и топливной эффективности также значительно увеличили максимальную дальность полета судна."
 usa_destroyer_hull_3: "Porter Class"
 usa_destroyer_hull_3_desc: "Конструкция Porter задумывалась как лидер эсминца, значительно крупнее типичных эсминцев. Он предназначен для борьбы с надводными целями и оснащен восемью одноцелевыми пушками Mk 12. Хотя у него значительно больше огневой мощи, чем у его предшественников, он больше и не так универсален."
 usa_destroyer_hull_4: "Mahan Class"
 usa_destroyer_hull_4_desc: "Class Mahan представляет метод движения, в котором используется новая паровая турбина, которая намного проще и эффективнее, чем любые предыдущие формы. В результате у него значительно увеличилась дальность полета и надежность. По сравнению с другими довоенными эсминцами он обладает достаточно приличными торпедными и зенитными возможностями."
 usa_destroyer_hull_5: "Somers Class"
 usa_destroyer_hull_5_desc: "Задуманный как ответ на японскую разработку больших эсминцев, Class Somers представляет собой относительно крупное судно, предназначенное для поражения других надводных кораблей с помощью своих эффективных орудий и торпед."
 usa_destroyer_hull_6: "Benson Class"
 usa_destroyer_hull_6_desc: "Чтобы заполнить пробел до того, как Class «Fletcher» будет готов к запуску в производство, Class «Benson» будет служить эффективным, универсальным эсминцем, способным поражать надводные, подводные и воздушные цели."
 usa_destroyer_hull_7: "Fletcher Class"
 usa_destroyer_hull_7_desc: "Class «Fletcher» — яркий пример того, чем должен быть эсминец. От подводных лодок до надводных кораблей и самолетов — «Fletcher» способен относительно легко обнаруживать и уничтожать цели по приемлемой цене. Недостатком Fletcher является то, что он имеет меньшую дальность действия по сравнению с его предшественниками, но он все равно довольно хорош по сравнению с другими странами."
 usa_destroyer_hull_8: "Allen M. Sumner Class"
 usa_destroyer_hull_8_desc: "Улучшенные системы обнаружения позволяют классу Самнера легче обнаруживать вражеские цели. Их сдвоенные 5-дюймовые установки калибра 38 также позволяли кораблю с большей эффективностью бороться с легкими надводными кораблями."
 usa_destroyer_hull_9: "Gearing Class "
 usa_destroyer_hull_9_desc: "Gearing — это незначительная модификация предыдущей конструкции Самнера. Он был модифицирован и стал немного больше с улучшенным двигателем для увеличения вместимости и дальности действия."
  
