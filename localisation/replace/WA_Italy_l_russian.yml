 ITA_revive_the_guardie_rosse_tt:1 "Создает §Y6 элитных дивизий§! в начале §Yгражданской войны§!."

 ITA_assassinate_victor_emmanuel: "Убийство Виктора Эммануила"
 ITA_assassinate_victor_emmanuel_desc: ""
 ITA_assassinate_victor_emmanuel_lar_tt: "§OРазблокирует операции по убийству Виктора Эммануила.§! [GetAgencyRequirement]"
 ITA_assassinate_victor_emmanuel_tt: "При успешном убийстве мы получим £political_power_texticon  §G300§!"
 assassinate_victor_emmanuel: "Дворцовый переворот"
 assassinate_victor_emmanuel_desc: "Прямой напад вряд ли увенчается успехом. Мы должны использовать более тонкие методы, чтобы приблизиться к Виктору Эммануилу там, где он чувствует себя в безопасности, а затем нанести ему удар, когда он будет повернут спиной."
 assassinate_victor_emmanuel_outcome_tt: "Мы попытаемся убить Виктора Эммануила с помощью агента, которого мы разместили в его доме."
 assassinate_victor_emmanuel_infiltration: "Поддельные документы"
 assassinate_victor_emmanuel_infiltration_desc: "Смешавшись с окружающими в качестве уборщика, наш агент найдет гараж, в котором хранится автомобиль королей."
 assassinate_victor_emmanuel_infiltration_outcome: "Наш агент успешно проник под прикрытием и теперь работает во дворце, используя доступ, предоставленный ему поддельным паспортом."
 assassinate_victor_emmanuel_attack: "Убийство"
 assassinate_victor_emmanuel_attack_desc: "Наш агент будет следовать за Виктором Эммануилом, когда тот покинет дворец, и активирует бомбу, которую он поместил под его автомобиль."
 assassinate_victor_emmanuel_attack_outcome: "Агент сумел подложить бомбу под нужный автомобиль и убил Виктора Эммануила."
 assassinate_victor_emmanuel_exfiltration: "Побег"
 assassinate_victor_emmanuel_exfiltration_desc: "Наш агент подкупил охранника, который поможет ему сбежать в суматохе и хаосе."
 assassinate_victor_emmanuel_exfiltration_outcome: "В суматохе, последовавшей за нападением, нашему агенту удалось скрыться, не дав никому хорошо рассмотреть его лицо."
 assassinate_victor_emmanuel_exfiltration_outcome_fail: "Наш агент был задержан охраной Виктора Эммануила и передан властям. Ему предъявлено обвинение в убийстве."

 ITA_assassinate_benito_mussolini: "Убийство Бенито Муссолини"
 ITA_assassinate_benito_mussolini_desc: ""
 ITA_assassinate_benito_mussolini_lar_tt: "§OРазблокирует операции по убийству Бенито Муссолини.§! [GetAgencyRequirement]"
 ITA_assassinate_benito_mussolini_tt: "При успешном убийстве мы получим £political_power_texticon  §G300§!"
 assassinate_benito_mussolini: "Убийство на вилле"
 assassinate_benito_mussolini_desc: "Муссолини хорошо охраняется, поэтому требуется более сложная операция. Мы должны внедрить нашего агента в его окружение, а затем убить его, когда он будет один."
 assassinate_benito_mussolini_outcome_tt: "Мы попытаемся убить Муссолини с помощью агента, которого мы внедрили в его окружение, пока он будет находиться в своей вилле."
 assassinate_benito_mussolini_infiltration: "Поддельная личность"
 assassinate_benito_mussolini_infiltration_desc: "Смешавшись с толпой в качестве телохранителя и фашиста, наш агент сможет приблизиться и нанести удар."
 assassinate_benito_mussolini_infiltration_outcome: "Наш агент успешно завоевал доверие Муссолини и его охранников."
 assassinate_benito_mussolini_attack: "Убийство"
 assassinate_benito_mussolini_attack_desc: "Наш агент будет следить за Муссолини, когда тот прибудет в свою виллу, а затем нападет на него и убьет."
 assassinate_benito_mussolini_attack_outcome: "Агент сумел найти нож и убил Бенито Муссолини."
 assassinate_benito_mussolini_exfiltration: "Побег"
 assassinate_benito_mussolini_exfiltration_desc: "Наш агент убил нескольких охранников, которые были поблизости, и сбежал."
 assassinate_benito_mussolini_exfiltration_outcome: "В суматохе, последовавшей за нападением, нашему агенту удалось скрыться, и никто ничего не заметил."
 assassinate_benito_mussolini_exfiltration_outcome_fail: "Наш агент был задержан охраной Муссолини и помещен в тюрьму. Ему предъявлено обвинение в убийстве."

