 ITA_increase_the_influence_of_the_vatican_tt: "£faction_ita_vatican §YВатикан§! относится §3дружелюбно§!"
 ITA_increase_the_influence_of_the_vatican_tt2: "£faction_ita_vatican §YВатикан§! станет §Gвлиятельнее§!."
  
 ITA_culto_del_duce_tt: "£faction_ita_vatican §YВатикан§! станет менее §Rвлиятельным§!, уменьшая £stability_texticon  §Yстабильность§! на §R-10.00%§!.\n\n"
  
 ITA_reclasify_the_bourgeoisie_tt: "£faction_ita_bourgeoisie §OБуржуазия§! станет §Yнейтральной§!, §Gубирая§! все дебаффы к £stability_texticon  §Yстабильность§! и £political_power_texticon  §YПриросту политической власти§!.\n\n"
  
 ITA_legge_bottai_tt: "£faction_ita_proletariat §YПролетариат§! §Gувеличит§! §Yвлияние§!.\n\n"
  
