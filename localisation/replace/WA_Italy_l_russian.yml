 ITA_request_control_of_french_territories_tt: "Государство §Y[VIC.GetName]§! существует и контролирует:\n- §Y[735.GetName]§!\n- §Y[1.GetName]§!"
  
 ITA_develop_the_empire: "Развивать империю"
 ITA_develop_the_empire_desc: "С различными племенами и народами Африки нельзя обращаться так, как мы могли бы поступать с другими подвластными народами. Управление этими областями потребует иного подхода."
  
 ITA_devaluate_the_lira: "Девальвировать лиру"
 ITA_devaluate_the_lira_desc: "Война обошлась нам гораздо дороже, чем нам хотелось бы. Наша экономика страдает от последствий. Девальвация нашей валюты сделает нашу продукцию более конкурентоспособной на международном рынке, но сделает жизнь среднего итальянца немного сложнее – необходимая жертва, которую они с радостью принесут."
  
 ITA_bonifica_integrale_tt: "£faction_ita_proletariat §YПролетариат§! станет §3дружелюбнее§!, увеличивая £stability_texticon  §Yстабильность§! на §G+5.00%§!"
  
 ITA_arrest_mussolini_tt: "£faction_ita_bourgeoisie §OБуржуазия§! станет §3дружелюбнее§! и §Gвлиятельнее§!, увеличивая £stability_texticon §Yстабильность§! на §G+5.00%§! и £political_power_texticon §Yежедневный прирост политической власти§! на §G+0.05§!."
  
 ITA_an_army_to_conquer_europe: "Армия для завоевания Европы"
 ITA_an_army_to_conquer_europe_desc: "Война приближается к Европе. Независимо от того, кто выстрелит первым, мы должны быть готовы к бою. Мы создадим планы обороны против каждого из наших соседей и начнем готовить резервные дивизии. Война придет в Европу, но Италия никогда не падет!"
  
 ITA_german_rd_treaty_tt: "£research_bonus_texticon  §Y1x§! §G50%§! Бонус к исследованиям для: §YСинтетические ресурсы§!.\n£research_bonus_texticon  §Y2x§! §G50%§! Бонус к исследованиям для: §YБронетехника§!."
  
