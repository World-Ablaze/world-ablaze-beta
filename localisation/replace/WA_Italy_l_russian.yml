 ITA_fund_military_excercises_tt: "Выполнил решение §Y$ITA_army_reform$§! не менее §Y2 раз§!."
 ITA_analyse_war_reports_tt: "Выполнил решение §Y$ITA_airforce_reform$§! не менее §Y2 раз§!."
 ITA_hold_naval_wargames_tt: "Выполнил решение §Y$ITA_naval_reform$§! не менее §Y2 раз§!."
 
 ITA_struggle_in_ethiopia_completion_tt:2 "Можно выполнить автоматически после провала миссии §Y«$ITA_conquer_the_north_mission$»§! или §Y«$ITA_conquer_the_south_mission$»§!, которые $ITA_benito_mussolini$ выдает в январе 1936 года.\n"
 
 ITA_expand_taranto_la_spezia_dockyards_tt: "решение §YРеформы военно-морского флота§! как минимум §Y2 раза§!."
  
 ITA_paracadutisti: "Паракадутисты"
 ITA_paracadutisti_desc: ""
  
 ITA_revive_the_arditi: "Возродить Ардити"
 ITA_revive_the_arditi_desc: ""
 ITA_revive_the_arditi_tt: "Будет получен элитный шаблон §YШаблон и подразделение дивизии Ардити§!\n"
  
 ITA_issue_fighter_contracts: "Выдать контракты на истребители"
 ITA_issue_fighter_contracts_desc: "Ключом к победе в следующей воздушной войне является полное превосходство в воздухе."
  
 ITA_issue_bomber_contracts: "Выдать контракты на бомбардировщики"
 ITA_issue_bomber_contracts_desc: "Ключом к победе в следующей воздушной войне является полное разрушение промышленной базы противника."
  
 ITA_issue_general_contracts: "Выдать общие контракты"
 ITA_issue_general_contracts_desc: "Чтобы выиграть следующую воздушную войну, нам нужны универсальные военно-воздушные силы, способные сделать все."
  
 ITA_radar_ventures: "Радарные проекты"
 ITA_radar_ventures_desc: "Эта новаторская технология будет функционировать как система раннего предупреждения о воздушных налетах противника и гораздо более надежна, чем наземные наблюдатели."
  
 ITA_quality_over_quantity: "Качество важнее количества"
 ITA_quality_over_quantity_desc: "Мы не должны жертвовать качеством наших самолетов ради того, чтобы производить больше."
  
 ITA_quantity_over_quality: "Количество важнее качества"
 ITA_quantity_over_quality_desc: "Столкнувшись с реальностью нашей промышленной базы, мы должны пожертвовать качеством, чтобы добиться численного равенства с нашими врагами."
  
 ITA_brigata_dassalto: "Штурмовая бригада"
 ITA_brigata_dassalto_desc: "Штурмовая бригада специализируется на нанесении урона наземным войскам противника именно там, где больнее всего."
  
 ITA_bombardamento_lontano: "Дальняя бомбардировка"
 ITA_bombardamento_lontano_desc: "Дальние бомбардировки - верный способ нанести удар по врагу в глубине его территории, где он меньше всего этого ожидает."
  
 ITA_cooperate_with_the_regia_marina: "Сотрудничать с Regia Marina"
 ITA_cooperate_with_the_regia_marina_desc: "Regia Marina ясно дала понять, что ей нужны новые проекты, и обратилась к нам, чтобы удовлетворить эту потребность."
  
 ITA_begin_carrier_trials: "Начать испытания авианосца"
 ITA_begin_carrier_trials_desc: "Учитывая, что военно-морская авиация является важным активом в любом современном бою, мы должны приобрести собственный авианосец, чтобы оставаться конкурентоспособными."
  
 ITA_develop_series_5_fighters: "Разработка истребителей V серии"
 ITA_develop_series_5_fighters_desc: "Война в воздухе постоянно развивается. Чтобы сохранить свое преимущество, мы должны разрабатывать новые конструкции на основе новейшего, самого мощного двигателя: Fiat RA.1050 Tifone."
  
 ITA_develop_series_6_fighters: "Разработать истребители VI серии"
 ITA_develop_series_6_fighters_desc: "Воздушная война приобретает новый накал. Высотные тяжелые бомбардировщики и сверхскоростные истребители. Для противостояния новым угрозам потребуются новые конструкции, использующие преимущества нового мощного двигателя: Fiat RA.1150 Uragano."
  
 ITA_approach_reggiane_for_a_jet_aircraft: "Обратиться к Reggiane по поводу реактивного самолета"
 ITA_approach_reggiane_for_a_jet_aircraft_desc: "Компания Reggiane заявила, что заинтересована в создании прототипа реактивного самолета итальянской разработки, и мы должны дать ей разрешение на реализацию проекта."
  
 ITA_lessons_from_the_spanish_civil_war: "Уроки гражданской войны в Испании"
 ITA_lessons_from_the_spanish_civil_war_desc: "CR.32 блестяще проявил себя в гражданской войне в Испании. За бипланами явно будущее, и мы должны немедленно начать производство улучшенной версии CR.32."
  
 ITA_analyse_war_reports: "Проанализировать военные отчеты"
 ITA_analyse_war_reports_desc: "Мы многому научились из гражданской войны в Испании, и теперь мы должны пересмотреть нашу тактику и скорректировать ее, где это необходимо."
  
 ITA_continue_naval_rearmament: "Продолжить перевооружение ВМФ"
 ITA_continue_naval_rearmament_desc: "Британцы имеют значительное присутствие в Средиземноморье, и мы должны увеличить нашу численность, чтобы иметь возможность конкурировать с ними."
  
 ITA_scale_down_naval_rearmament: "Сокращение масштабов перевооружения ВМФ"
 ITA_scale_down_naval_rearmament_desc: "Наш нынешний флот достаточно велик, чтобы защитить наши интересы в Средиземноморье, нам следует направить средства в другие места."
  
 ITA_milizia_marittima_di_artiglieria_tt: "Построит прибрежное укрепление §Y2 уровня§! в каждой военно-морской базе с §Oминимальным уровнем 3§!."
  
 ITA_workhorse_of_the_fleet: "Рабочая лошадка флота"
 ITA_workhorse_of_the_fleet_desc: "Нам срочно нужны крупные корабли, линкоры — это слишком большая инвестиция для современного флота, будущее — за тяжелыми крейсерами."
  
 ITA_battleship_primacy: "Первенство линкоров"
 ITA_battleship_primacy_desc: "Линкор по-прежнему является ценным, хотя и уязвимым активом любого военно-морского флота, поэтому пришло время начать разработку линкоров нового поколения."
 
 ITA_modernize_the_fleet: "Модернизация флота"
 ITA_modernize_the_fleet_desc: "Наш флот в основном состоит из кораблей времен Первой мировой войны, и чтобы конкурировать с Великобританией в Средиземноморье, мы должны модернизировать наш флот."
  
 ITA_contract_ansaldo: "Контракт с Ansaldo"
 ITA_contract_ansaldo_desc: "Ansaldo может проложить путь к строительству современного итальянского военно-морского флота."
 
 ITA_age_of_carriers: "Эра авианосцев"
 ITA_age_of_carriers_desc: ""
 
 ITA_modernize_the_naval_arm: "Модернизация военно-морских сил"
 ITA_modernize_the_naval_arm_desc: "Учитывая, что морская авиация является важнейшим активом в любом современном конфликте, мы должны приобрести собственный авианосец, чтобы оставаться конкурентоспособными."

 ITA_hold_naval_wargames: "Провести военно-морские учения"
 ITA_hold_naval_wargames_desc: "Моделирование боевых столкновений поможет нам улучшить нашу стратегию и тактику, а проведение учений предоставит нам этот практический опыт."
  
 ITA_expand_taranto_la_spezia_dockyards: "Расширить верфи Таранто и Специи"
 ITA_expand_taranto_la_spezia_dockyards_desc: "Таранто расположен в очень стратегическом регионе, идеальной базе для проявления нашего военно-морского господства в Средиземноморье. Специя находится в самом сердце нашей страны и будет в безопасности от любых нападений. Этими преимуществами следует воспользоваться и вложиться в их развитие."
  
 ITA_form_the_decima_flottiglia_mas: "Сформировать Decima Flottiglia MAS"
 ITA_form_the_decima_flottiglia_mas_desc: "Чтобы оккупировать стратегические районы вокруг Средиземного моря, мы должны подготовить хорошие военно-морские коммандос для достижения этих целей."
  
 ITA_triumph_in_africa: "Триумф в Африке"
 ITA_triumph_in_africa_desc: "В связи с нашей недавней победой над примитивной нацией Эфиопии уместно отпраздновать это событие."
 
 ITA_triumph_in_africa_tt: "§YРазблокирует шаблоны дивизий§!"
 
 ITA_expand_the_repair_yards: "Расширить ремонтные верфи"
 ITA_expand_the_repair_yards_desc: ""
  
 ITA_leave_the_league_of_nations: "Выйти из Лиги Наций"
 ITA_leave_the_league_of_nations_desc: "Лига Наций — это оковы, которые нас сдерживают, мы должны немедленно покинуть эту неэффективную организацию."
  
 ITA_align_with_german_politics: "Согласовать курс с политикой Германии"
 ITA_align_with_german_politics_desc: "Германия идеологически близка нам, альянс укрепит эту связь."
  
 ITA_german_millitary_cooperation_desc: "Благодаря тесному сотрудничеству с мощной немецкой армией мы можем объединить лучшее от немецкой эффективности и итальянской изобретательности. У нас будет стратегическое преимущество перед любым, кто осмелится противостоять нам."
  
 ITA_assert_imperial_claims: "Заявить имперские претензии"
 ITA_assert_imperial_claims_desc: "Чтобы вернуть себе доминирующие позиции в Средиземноморье, мы должны завоевать некоторые стратегически важные районы."
  
 ITA_break_out_of_the_mediterranean_prison: "Побег из средиземноморской тюрьмы"
 ITA_break_out_of_the_mediterranean_prison_desc: "Итальянский флот должен освободиться от оков британского господства, мы должны контролировать доступ к Средиземному морю."
  
 ITA_arrest_mussolini: "Арест Муссолини"
 ITA_arrest_mussolini_desc: "Опасаясь гражданской войны, король позволил Муссолини создать правительство от своего имени, чтобы принести порядок и величие Италии. Вместо этого Муссолини угнетал народ и создал ужасную диктатуру. Король решил, что эту ошибку необходимо исправить и Муссолини должен уйти в отставку! Гражданская война может наступить, но Италия никому не поклонится!"
  
 ITA_ambitions_of_italy: "Амбиции Италии"
 ITA_ambitions_of_italy_desc: ""
  
 ITA_rebuild_the_nation: "Восстановить нацию"
 ITA_rebuild_the_nation_desc: "Италия никогда больше не должна подчиняться прихотям вульгарного деспота. Нацию необходимо восстановить, начав с ее промышленности и сосредоточив внимание на нуждах народа. Мы будем центром производства и инноваций!"
  
 ITA_integrate_former_enemies: "Интегрировать бывших врагов"
 ITA_integrate_former_enemies_desc: ""
  
 ITA_reverse_the_brain_drain: "Обратить вспять утечку мозгов"
 ITA_reverse_the_brain_drain_desc: "Фашистский гнет заставил многие великие умы покинуть Италию и перебраться в другие страны мира. Из-за этого наша страна отстала от соседей в научном отношении. Мы должны обеспечить их права, чтобы они могли вернуться и употребить свой ум на благо Италии!"
  
 ITA_attract_foreign_capital: "Привлечь иностранный капитал"
 ITA_attract_foreign_capital_desc: ""
  
 ITA_ratify_the_stresa_front_desc: "Муссолини обещал народу Италии величие, но вместо этого мы оказались в изоляции, и страны Европы смотрели на нас как на изгойское, преступное государство. Теперь, когда мы восстановили контроль над правительством, мы можем вернуться на свое место в качестве короны западной цивилизации! Наш первый шаг — сближение с Францией посредством военного союза."
  
 ITA_mediterranean_dominance: "Средиземноморское доминирование"
 ITA_mediterranean_dominance_desc: ""
  
 ITA_plan_new_colonies: "Планировать новые колонии"
 ITA_plan_new_colonies_desc: "Мы должны создать новые органы управления, чтобы лучше контролировать нашу империю. Вся Африка и Ближний Восток будут разделены на колониальные правительства, чтобы облегчить бремя прямого контроля.\n§RЭти решения больше не будут доступны, и все существующие колонии будут аннексированы, если мы создадим Novus Imperium Romanum."
  
 ITA_balkan_dominance: "Балканское господство"
 ITA_balkan_dominance_desc: "Балканы представляют собой постоянный вихрь конфликтов и коррупции. Не удовлетворившись войной между собой, они поставили весь мир на грань разрушения! Их нужно вести сильной рукой, будь то мирно или более агрессивными средствами…"
  
 ITA_italian_integrity: "Итальянская честность"
 ITA_italian_integrity_desc: ""
  
 ITA_natural_borders_of_italy: "Естественные границы Италии"
 ITA_natural_borders_of_italy_desc: ""
 ITA_natural_borders_of_italy_tt: "§YВсе территории естественных границ Италии находятся под прямым или подчиненным контролем, а Средиземноморская тюрьма разрушена§!"
  
 ITA_the_corpo_truppe_volontarie: "Добровольческий корпус"
 ITA_the_corpo_truppe_volontarie_desc: ""
  
 ITA_stage_an_incident_at_gibralter: "Устроить инцидент в Гибралтаре"
 ITA_stage_an_incident_at_gibralter_desc: ""
  
 ITA_emperor_of_egypt: "Император Египта"
 ITA_emperor_of_egypt_desc: ""
  
 ITA_sword_of_italy: "Меч Италии"
 ITA_sword_of_italy_desc: "Поскольку Цезарь использовал свои легионы, чтобы завоевать мир, теперь мы выступаем против любого противника. Мы едины и сильны. Италия больше не будет сноской в современной истории, а станет великой нацией, которая должна стоять плечом к плечу с империями прошлого."
  
 ITA_move_towards_the_jewel_of_the_east: "Двигайтесь к жемчужине Востока"
 ITA_move_towards_the_jewel_of_the_east_desc: ""
  
 ITA_yugoslav_alliance: "Югославский Альянс"
 ITA_yugoslav_alliance_desc: "Война в континентальной Европе, несомненно, привлечет к нам внимание Британии и Франции, но мы можем привлечь Балканы в нашу сферу посредством дипломатии и торговли. В конце концов, Рим не был построен за один день, и ведение войны на два фронта закончилось бы только поражением."
  
 ITA_dissolve_yugoslavia: "Распустить Югославию"
 ITA_dissolve_yugoslavia_desc: ""
  
 ITA_claims_on_yugoslavia: "Претензии на Югославию"
 ITA_claims_on_yugoslavia_desc: ""
  
 ITA_alliance_for_vojvodina: "Альянс за Воеводину"
 ITA_alliance_for_vojvodina_desc: ""
  
 ITA_protection_for_czechoslovakian_arms: "Защита чешского оружия"
 ITA_protection_for_czechoslovakian_arms_desc: "Еще недавно чехи трудились под немецкой тиранией, теперь они снова оказались под угрозой немецкого империализма. Нам не следует создавать полноценный альянс, но мы можем предложить защиту, конечно, за определенную плату."
  
 ITA_bulgarian_occupation: "Болгарская оккупация"
 ITA_bulgarian_occupation_desc: "Болгария была неотъемлемой частью Римской империи, северной границей Балкан. Чтобы обезопасить наши владения в этой области, завоевание этого стратегически важного региона имеет первостепенное значение."
  
 ITA_alliance_for_thrace: "Альянс за Фракию"
 ITA_alliance_for_thrace_desc: ""
  
 ITA_reconcile_with_romania: "Примириться с Румынией"
 ITA_reconcile_with_romania_desc: ""
  
 ITA_fate_of_central_europe: "Судьба Центральной Европы"
 ITA_fate_of_central_europe_desc: ""
  
 ITA_fate_of_eastern_europe: "Судьба Восточной Европы"
 ITA_fate_of_eastern_europe_desc: ""
  
 ITA_demand_istanbul: "Требовать Стамбул"
 ITA_demand_istanbul_desc: ""
  
 ITA_the_new_emperor_of_ethiopia_has_idea_victor_emmanuel_tt: "Обладает национальным духом §Y$victor_emmanuel$§!"
  
 ITA_novum_imperium_romanum: "Новус Империум Романум"
 ITA_novum_imperium_romanum_desc: ""
 roman_restore_roman_empire_category_tt: "Разблокирует решения §YВосстановление Римской империи§!."
  
 ITA_integrate_the_empire: "Интегрировать Империю"
 ITA_integrate_the_empire_desc: ""
  
 ITA_protector_of_the_balkans: "Защитник Балкан"
 ITA_protector_of_the_balkans_desc: "Народы Балкан — не звери, которых нужно победить, а потерянные люди, которых нужно привести к величию. В нашем Новом Риме для них найдется место. Наша новая империя будет построена вместе с нашими подданными, а не против них."
 
 integrate_balkans_as_protector_tt: "Открывает §Hрешения§! по §Yмарионеточными балканским союзникам§!"
 integrate_balkans_as_protector_tt2: "Разрешает §Yвоенную интервенцию§!, если балканская страна становится §Yфашистской§! или §Rсоциалистической§!"
  
 ITA_rekindling_roman_sentiments: "Возрождение римского духа"
 ITA_rekindling_roman_sentiments_desc: ""
  
 ITA_italia_irredenta: "Италия Ирредента"
 ITA_italia_irredenta_desc: "Италия должна стать целостной в буквальном смысле слова. Любая итальянская территория должна возглавляться итальянцами! Мы обратимся к нашим гражданам и напомним им о нашей силе и наследии. Вместе мы защитим наши земли и приведем нашу нацию к величию!"
  
 ITA_treaty_with_the_allies: "Договор с Союзниками"
 ITA_treaty_with_the_allies_desc: "Не так давно Италия стояла бок о бок с французами и британцами и свергла тиранические империи, владевшие итальянскими землями. Мы должны снова протянуть руку помощи, чтобы возродить эти отношения и обеспечить совместную работу наших солдат и пилотов. Или хотя бы узнать, как работает их оружие..."
  
 ITA_heartland_of_the_med: "Сердце Средиземноморья"
 ITA_heartland_of_the_med_desc: ""
  
 ITA_conquer_yugoslavia: "Завоевать Югославию"
 ITA_conquer_yugoslavia_desc: "Югославия является домом для многих италийских народов, мы должны еще раз интегрировать их в наши национальные границы."
  
 ITA_conquer_spain: "Покорить Испанию"
 ITA_conquer_spain_desc: "Испания является стратегическим регионом, из которого можно преследовать любого, кто пытается войти в наше море. Для выживания нашей нации жизненно важно, чтобы эта территория контролировалась нами."
  
 ITA_conquer_portugal: "Покорить Португалию"
 ITA_conquer_portugal_desc: "Португалия не представляет никакой стратегической ценности, но если она решит выступить против нас, она даст нашим врагам большой плацдарм для завоевания Испании."
  
 ITA_push_towards_the_middle_east: "Двигаться в сторону Ближнего Востока"
