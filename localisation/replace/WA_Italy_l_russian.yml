 ITA_reform_the_communist_partys_tt: "£faction_ITA_pci §YИтальянская компартия§! станет относится §3лояльно§!, достигая §9Высокого§! уровня §Yвлияния§!."

 ITA_the_communist_uprising: "Коммунистическое восстание"
 ITA_the_communist_uprising_desc: "В связи с провалом эфиопской кампании в стране царит нестабильность, разгораются конфликты и падает доверие. Создались условия для изменения курса."
 ITA_the_communist_uprising_map_category_name: "Выберите, где управлять влиянием вашего гарнизона."
  
 ITA_the_inevitable_civil_war: "Неизбежная гражданская война"
 ITA_the_inevitable_civil_war_desc: "После выборов гражданская война стала практически неизбежной. [Root.GetSCWsideloc] Мы должны перехватить инициативу и обеспечить контроль над гарнизонами страны."
 ITA_INSTRUCTIONS: "Мы должны отсрочить гражданскую войну, насколько это возможно, давая нам время подготовиться к националистическому восстанию."
 ITA_the_inevitable_civil_war_map_category_name: "Выбрать, где управлять влиянием своего гарнизона."
  
 ITA_civil_war: "Гражданская война в Италии началась"
 ITA_civil_war_end: "Гражданская война в Италии закончилась"
 
 ITA_opposition_civil_war_preparations: "Подготовка оппозиции к гражданской войне"
 ITA_opposition_civil_war_preparations_desc: "Пока мы стараемся помешать каждому их шагу, наши враги не бездействуют. Нам следует помнить об их действиях, готовясь к предстоящему конфликту."
 ITA_civil_war_offensives: "Наступления гражданской войны"
 ITA_civil_war_offensives_desc: "Проблемы с нашей способностью снабжать наши передовые войска затрудняют эффективные наступления на опорные пункты противника. Мы должны планировать заранее и адекватно расширять склады оборудования на передовой задолго до подготовки каких-либо крупных наступлений."
 ITA_civil_war_offensives_map_category_name: "Выбрать, где подготовить наступление."
 ITA_military_plot: "Военный заговор"
 ITA_military_plot_desc: "До нас дошли слухи о зловещем заговоре с целью свержения правительства, и, несмотря на наш недавний опыт подобных попыток государственного переворота, мы совершенно не готовы справиться с еще одним. Мы должны помешать их планам везде, где только можем, и задержать их, чтобы дать себе время подготовиться."
 
