 ITA_bonifica_integrale: "Комплексная мелиорация"
 ITA_bonifica_integrale_desc: ""
  
 ITA_retool_the_civilian_industry: "Переоснащение гражданской промышленности"
 ITA_retool_the_civilian_industry_desc: "Для подготовки к новой войне необходима новая программа индустриализации — такая, которая превратит гражданские ресурсы в настоящую военную машину."
 ITA_retool_the_civilian_industry_tt: "Если фокус «§Y$ITA_focus_on_the_centres_of_industry$§!» завершен, северные ВПО будут улучшены.\nЕсли фокус «§Y$ITA_develop_the_heel$§!» завершен, южные ВПО будут улучшены."
  
 ITA_nationalize_the_air_industries: "Национализировать авиационную промышленность"
 ITA_nationalize_the_air_industries_desc: ""
 ITA_nationalize_the_air_industries_tt: "«§YMacchi§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y500 дней§!\n«§YCaproni§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y500 дней§!\n«§YIMAM§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y500 дней§!\n«§YPiaggio§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y500 дней§!\n"
  
