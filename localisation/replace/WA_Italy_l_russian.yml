 ITA_rally_the_workers: "Сплотить рабочих"
 ITA_rally_the_workers_desc:1 "Прежде чем нанести удар, мы сосредоточим все свои усилия на том, чтобы заручиться поддержкой промышленных рабочих Италии и убедиться, что как можно больше жителей страны встанут на нашу сторону в борьбе с фашистским режимом."
 ITA_rally_the_workers_tt: "§GМы получим поддержку в Риме и Эмилии-Романье§!\n§YБудут созданы 3 нерегулярные дивизии§!"

