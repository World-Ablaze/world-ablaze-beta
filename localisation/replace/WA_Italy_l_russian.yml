 ITA_hunt_down_ethiopian_rebels_tt: "Эфиопийские повстанческие ячейки все еще существуют, несмотря на официальную капитуляцию Королевства. Чтобы установить мир, справедливость и процветание в нашей новой империи, мы должны выследить и уничтожить оставшиеся силы, угрожающие региону."
 
 ITA_internal_factions: "Внутренние фракции"
 ITA_internal_factions_desc: "Италия имеет сильный контроль над своими фракциями; сохранение счастья Ватикана является ключом к тому, чтобы люди поддерживали нашу политику. Однако растущий рост коммунистов угрожает стабильности Нации, и нам нужно решить, принять их или подавить.\n\n"
  
