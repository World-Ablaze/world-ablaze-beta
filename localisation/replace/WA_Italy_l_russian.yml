 italy.1.a: "Присоединить их к империи"
 italy.1.b: "Создать марионеточное государство"
 ita_armor.801.t: "Италия в кризисе"
 ita_armor.801.d: "Учитывая наши большие территориальные потери в Африке и на Сицилии, наш народ требует прекращения войны, и во всех наших городах начались протесты, и ходят слухи о зарождающемся восстании на юге. Чтобы восстановить веру людей, мы должны вернуть Сицилию и показать, что Италия не падет!"
 ita_armor.801.a: "Мы должны немедленно контратаковать!"

 ita_armor.802.t: "Италия предлагает защиту"
 ita_armor.802.d: "Италия обратилась к нам с предложением гарантировать нашу независимость в обмен на снаряжение. Учитывая наше уязвимое положение между многими странами, такое предложение может оказаться очень полезным. Однако для этого необходимо проявить большое доверие к Италии..."
 ita_armor.802.a: "Мы согласимся"
 ita_armor.802.b: "Мы справимся сами"

 ita_armor.803.t: "Чехословакия соглашается на наше предложение"
 ita_armor.803.d: "Чехословакия сочла, что принять наше предложение защиты было мудрым решением, и не сомневается, что мы — ценный союзник. Она согласилась поставлять нам оружие, которое должно помочь нам модернизировать нашу армию."
 ita_armor.803.a: "Отлично"

 ita_armor.804.t: "Чехословакия отвергает наше предложение"
 ita_armor.804.d: "Чехословакия не видит в нас ценного союзника и отвергла наше предложение защиты. Как бы прискорбно это ни было, это не помешает нам стать европейской сверхдержавой."
 ita_armor.804.a: "Неважно"

 ita_armor.805.t: "Итальянский ультиматум"
 ita_armor.805.d: "Итальянские дипломаты предъявили нам ультиматум с требованием подчиниться их оккупации! Мы обманывались, думая, что итальянцы будут уважать нашу независимость, раз они наши союзники. Мало надежды, что мы сможем противостоять вторжению в одиночку..."
 ita_armor.805.a: "Мы должны подчиниться..."
 ita_armor.805.b: "Сопротивляться!"

 ita_armor.806.t: "Болгария уступает"
 ita_armor.806.d: "Оценив ситуацию, болгарское правительство справедливо пришло к выводу, что нашу волю невозможно оспорить. Мы уже отдали приказ начать ввод войск в Болгарию и сейчас удерживаем их ключевые города. Это еще один шаг к восстановлению Великой Римской империи!"
 ita_armor.806.a: "Отлично"

 ita_armor.807.t: "Болгария отвергает ультиматум"
 ita_armor.807.d: "Несмотря на огромную разницу в силах, Болгария отвергла оккупацию и разорвала связи с нами. Если мы хотим их оккупировать, нужна более агрессивная дипломатия..."
 ita_armor.807.a: "Тогда применим силу"

 ita_armor.808.t: "Италия требует Стамбул"
 ita_armor.808.d: "Италия пришла к нам с довольно диковинным требованием передать ценный город Стамбул, мотивируя это тем, что они хотят восстановить Римскую империю. Хотя они могут считать себя непобедимыми, они настроены серьезно. Можем ли мы позволить себе воевать?"
 ita_armor.808.a: "Мы плохо подготовлены к войне"
 ita_armor.808.b: "Они никогда его не получат!"

 ita_armor.809.t: "Турция передает территорию"
 ita_armor.809.d: "К нашему удивлению, Турция приняла наши требования, скорее всего, потому, что не желает быть втянутой в более широкий конфликт. Для нас это большая победа!"
 ita_armor.809.a: "Отлично"

 ita_armor.810.t: "Турция отвергает претензии Италии"
 ita_armor.810.d: "Турция отвергла все наши претензии на этот город и готова защищать свою территорию. Хотя это и не самый неожиданный исход, он все же остается нежелательным."
 ita_armor.810.a: "Шансы были невелики"

 ita_armor.811.t: "Завоевание Стамбула"
 ita_armor.811.d: "С завоеванием Стамбула многие политики и сама общественность выступили в поддержку восстановления первоначального наследия города, начиная с его названия."
 ita_armor.811.a: "Возродить старую столицу!"

 ita_armor.812.t: "Германия приступает к аншлюсу"
 ita_armor.812.d: "Несмотря на нашу гарантию независимости Австрии, это не помешало Германии стремиться к аншлюсу с австрийским народом. Это ставит нас в затруднительное положение: либо мы остаемся верными своему обязательству и рискуем войной, либо отступаем."
 ita_armor.812.a: "Мы не можем надеяться на победу"
 ita_armor.812.b: "Мы выполняем свои обязательства"

 ita_armor.813.t: "Италия отказывается поддержать Австрию"
 ita_armor.813.d: "В связи с тем, что мы приступили к аншлюсу, Италия, к своему немалому конфузу, отозвала свою гарантию независимости Австрии. Это нанесло серьезный удар по репутации Италии и, вероятно, вызвало нестабильность в стране. Однако для нас это большой успех, и мы сможем продолжить аншлюс, не опасаясь сопротивления со стороны Италии. Жаль, что они не видят будущее так же, как мы."
 ita_armor.813.a: "Мы объединим немецкий народ!"

 ita_armor.814.t: "Италия предупреждает"
 ita_armor.814.d: "В связи с тем, что мы приступили к аншлюсу, Италия вновь подтвердила свою позицию по сохранению мира в Европе. Более вероятная причина заключается в том, что они рассматривают экспансию Германии как угрозу. Таким образом, мы остаемся с потенциальной войной с итальянцами и значительным усилением напряженности, если мы продолжим аншлюс, что может дорого обойтись Рейху."
 ita_armor.814.a: "Никто не остановит нас!"

 ita_armor.815.t: "Муссолини отстранен от должности главы правительства"
 ita_armor.815.d: "Вчера утром король ворвался в здание парламента Муссолини и потребовал отстранения главы правительства и его подчиненных. Это включало отстранение нескольких генералов и начальников штабов. Поскольку король обладал высшей властью, а также поддержкой народа и многих членов фашистского совета, Муссолини был арестован, и король Виктор Эммануил принял на себя руководство Италией. В речи, направленной на успокоение итальянского народа, король раскрыл планы Муссолини по созданию Римской империи, которые привели бы Италию к катастрофе и поражению. Теперь, когда Италия находится под полным контролем короля, мир гадает, что же будет дальше."
 ita_armor.815.a: "Править может только король!"
 ita_armor.815.b: "Мы должны двигаться к подлинной демократии!"
 ITA_monarchist_route_flag: "Выбран §YМонархический путь§!"
 ITA_democratic_route_flag: "Выбран §YДемократический путь§!"
 vatican_attitude_tt: "£faction_ita_vatican §YВатикан§! станет §3дружелюбнее§!, увеличивая £political_power_texticon  §Yежедневный прирост политической власти§! на §G+0.10§!."

 ita_armor.816.t: "Муссолини сбегает из тюрьмы!"
 ita_armor.816.d: "После отстранения Муссолини от должности премьер-министра его конвой, сопровождавший его в тюрьму, подвергся нападению, которое, без сомнения, было совершено чернорубашечниками, остающимися верными ему. Полиция опоздала и не смогла предотвратить его побег, а расследование, усугубленное исчезновением офицеров, показало, что в стране и ее правительстве по-прежнему существует глубоко укоренившаяся поддержка фашизма."
 ita_armor.816.a: "Начать розыск Дуче!"

 ita_armor.817.t: "Проблемы на севере"
 ita_armor.817.d: "Несколько офицеров сообщили о беспорядках в своих рядах. Многие солдаты по-прежнему поддерживают Муссолини, а многие офицеры подали в отставку в знак протеста против его увольнения. Высшее командование очень обеспокоено ситуацией в северных районах страны, которые процветали при правлении Муссолини и, по слухам, укрывают Дуче."
 ita_armor.817.a: "Мы должны противостоять его влиянию"

 ita_armor.818.t: "Италия требует Савойю"
 ita_armor.818.d: "Италия, ссылаясь на итальянское население Савойи, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.818.a: "Я полагаю, они могут взять Савойю"
 ita_armor.818.b: "Это обойдется им дороже нескольких тысяч погибших"

 ita_armor.819.t: "Италия требует Корсику"
 ita_armor.819.d: "Италия, ссылаясь на итальянское население Корсики, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.819.a: "Корсика более полезна под их контролем"
 ita_armor.819.b: "Это обойдется им дороже нескольких тысяч погибших"

 ita_armor.820.t: "Италия требует Мальту"
 ita_armor.820.d: "Италия, ссылаясь на итальянское население Мальты, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.820.a: "Я ожидаю великих свершений, отдавая Мальту"
 ita_armor.820.b: "Такая награда должна остаться у нас."

 ita_armor.821.t: "Италия требует Далмацию"
 ita_armor.821.d: "Италия, ссылаясь на итальянское население Далмации, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.821.a: "Далмация не имеет значения, пусть они ее забирают"
 ita_armor.821.b: "Это обойдется им дороже нескольких тысяч погибших"

 ita_armor.8211.t: "Италия требует Сплит"
 ita_armor.8211.d: "Италия, ссылаясь на итальянское население Сплита, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.8211.a: "Сплит не имеет значения, пусть забирают"
 ita_armor.8211.b: "Это обойдется им дороже нескольких тысяч погибших"

 ita_armor.822.t: "Италия требует Тичино"
 ita_armor.822.d: "Италия, ссылаясь на итальянское население Тичино, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.822.a: "Они могут получить Тичино, если это их осчастливит"
 ita_armor.822.b: "Это обойдется им дороже нескольких тысяч погибших"

 ita_armor.823.t: "Италия требует Крит"
 ita_armor.823.d: "Италия, ссылаясь на итальянское население Крита, стремится расширить свою пограничную зону вокруг этого района, чтобы укрепить Италию. Однако решение по этому вопросу принимать будем мы."
 ita_armor.823.a: "Мы можем доверить им Крит"
 ita_armor.823.b: "Это слишком ценно, чтобы от этого отказываться"

 ita_armor.824.t: "[From.GetName] принимает наши требования"
 ita_armor.824.d: "[From.GetName] признаёт справедливость наших требований в отношении нашей законной территории и передаёт нам Савойю."
 ita_armor.824.a: "Отлично"

 ita_armor.825.t: "[From.GetName] отклоняет наши требования"
 ita_armor.825.d: "[From.GetName] считает целесообразным препятствовать нашим скромным, справедливым и разумным требованиям в отношении нашей законной территории."
 ita_armor.825.a: "Неприемлемо"

 ita_armor.826.t: "[ITA.GetName] предлагает план захвата Гибралтара"
 ita_armor.826.d: "[ITA.GetName] предлагает собрать наших самых радикальных националистов и спровоцировать беспорядки и саботаж в Гибралтаре, чтобы ослабить его. Это откроет путь для наших войск, которые смогут захватить то, что по праву принадлежит нам. Этот план опасен и, скорее всего, приведет к войне с [ENG.GetName], если они не откажутся от Гибралтара. Однако если война неизбежна, то это поставит нас в наиболее выгодное положение."
 ita_armor.826.a: "Даём добро"
 ita_armor.826.b: "Война с [ENG.GetName] слишком опасна."

 ita_armor.827.t: "[SPR.GetName] соглашается с нашим планом"
 ita_armor.827.d: ""
 ita_armor.827.a: "Блестяще!"

 ita_armor.828.t: "[SPR.GetName] отклоняет наш план"
 ita_armor.828.d: ""
 ita_armor.828.a: "Они не считают войну неизбежной"

 ita_armor.829.t: "Проблемы в Гибралтаре"
 ita_armor.829.d: "Радикалы из Испании начали собираться вокруг Гибралтара и, хотя сначала протестовали мирно, ситуация переросла в беспорядки. Поступают сообщения о людях, пересекающих границу по воде, что может поставить под угрозу целостность нашей военной базы."
 ita_armor.829.a: "Нам нужно немедленно укрепить Гибралтар!"

 ita_armor.830.t: "Успех в Гибралтаре"
 ita_armor.830.d: "Поступили сообщения о нашем успехе в саботаже фортов и баз Гибралтара. Британские войска дезорганизованы и заняты устранением хаоса, который мы создали. Если и было время для удара, то оно настало сейчас."
 ita_armor.830.a: "Мы их хорошо напугали, но потом передумали"
 ita_armor.830.b: "Сейчас самое время действовать!"

 ita_armor.831.t: "Выборы [?global.year|0]"
 ita_armor.831.d: "Через месяц после окончания нашей гражданской войны народ проголосовал, и с небольшим перевесом победу одержал..."
 ita_armor.831.a: "...Итальянская народная партия победила"
 ita_armor.831.b: "...Национальная монархическая партия победила"
 ita_armor.831.c: "...Итальянская коммунистическая партия победила"
 ita_elections_requirment_tt: "Новые выборы состоялись"
  
 ita_armor.832.t: "Король Виктор Эммануил III отрекается от престола"
 ita_armor.832.d: "После победы на выборах скромный король Эммануэль предпринял свой первый шаг в качестве главы Италии, назначив своего двоюродного брата Фердинандо Адальберто руководителем страны, сославшись на плохое здоровье. Он подчеркнул, что Италии необходимо сильное и популярное руководство, чтобы проложить путь в будущее, и выразил полное доверие новому лидеру."
 ita_armor.832.a: "Да здравствует новый король!"

 ita_armor.833.t: "Отправить ультиматум?"
 ita_armor.833.d: "Югославия не может рассчитывать на победу в борьбе между нашими странами. Если мы отправим им требование о возвращении нашей законно принадлежащей нам земли в Далмации, они могут просто передать ее без боя."
 ita_armor.833.a: "Действуйте"
 ita_armor.833.b: "Сейчас не самое подходящее время"

 ita_armor.834.t: "Италия требует Далмацию"
 ita_armor.834.d: "Итальянские войска сосредоточиваются по другую сторону нашей границы, а их дипломаты требуют, чтобы мы уступили им всю Далмацию! Должны ли мы сопротивляться?"
 ita_armor.834.a: "Нет. Это безнадежно..."
 ita_armor.834.c: "Да! Мы не сдадимся без боя!"

 ita_armor.835.t: "[YUG.GetName] сдает Далмацию"
 ita_armor.835.d: "Югославы мудро пошли на уступки нашим требованиям и вывели все свои войска из Далмации. Мы включим эту территорию в состав союза как Молдавскую Советскую Социалистическую Республику. Ее граждане теперь будут пользоваться благами социализма."
 ita_armor.835.a: "Отлично!"

 ita_armor.836.t: "[YUG.GetName] отказывается удовлетворить наши требования"
 ita_armor.836.d: "Югославы отказались подчиниться нашим требованиям! Похоже, нам придется силой изгнать их оккупационные войска из Далмации."
 ita_armor.836.a: "Они об этом пожалеют..."

 ita_armor.837.t: "Раздел Центральной Европы"
 ita_armor.837.d: "Наши цели уже видны, но планировщики настаивают на том, чтобы мы обратились к Франции и Германии для проведения переговоров, прежде чем начинать военную операцию. Должны ли мы делить добычу или рискнуть действовать в одиночку?"
 ita_armor.837.a: "Безопаснее найти общие цели"
 ita_armor.837.b: "Нам не нужно сотрудничать"
 ita_armor.837.c: "Нет никого"

 ita_armor.838.t: "[ITA.GetName] предлагает раздел Центральной Европы"
 ita_armor.838.d: "Италия обратилась к нам с самым амбициозным планом: разделить Центральную Европу между нашими сферами влияния и ликвидировать Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав Европы, а также вызовет беспорядки в Европе. Мы, безусловно, достаточно сильны, но готовы ли мы к перестройке Европы?"
 ita_armor.838.a: "Малые государства служат только нашим врагам"
 ita_armor.838.b: "Наши интересы не совпадают"

 ita_armor.839.t: "[ITA.GetName] предлагает раздел Центральной Европы"
 ita_armor.839.d: "Италия обратилась к нам с самым амбициозным планом: разделить Центральную Европу между нашими сферами влияния и ликвидировать Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав Европы, а также вызовет беспорядки в Европе. Мы, безусловно, достаточно сильны, но готовы ли мы к перестройке Европы?"
 ita_armor.839.a: "Малые государства служат только нашим врагам"
 ita_armor.839.b: "Мы не согласны, но давайте не будем в это вмешиваться"
 ita_armor.839.c: "Наши интересы не совпадают"

 ita_armor.840.t: "[FROM.GetName] соглашается"
 ita_armor.840.d: ""
 ita_armor.840.a: "Теперь все стало проще"

 ita_armor.841.t: "[FROM.GetName] отказывается"
 ita_armor.841.d: ""
 ita_armor.841.a: "Будем надеяться, что они не будут вмешиваться"

 ita_armor.842.t: "Раздел Восточной Европы"
 ita_armor.842.d: "Наши армии готовы к завоеванию Восточной Европы, однако"
 ita_armor.842.a: "Безопаснее найти общие цели"
 ita_armor.842.b: "Нам не нужно сотрудничать"
 ita_armor.842.c: "Нет никого"

 ita_armor.843.t: "[ITA.GetName] предлагает раздел Восточной Европы"
 ita_armor.843.d: "Италия обратилась к нам с самым амбициозным планом: разделить Центральную Европу между нашими сферами влияния и ликвидировать Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав Европы, а также вызовет беспорядки в Европе. Мы, безусловно, достаточно сильны, но готовы ли мы к перестройке Европы?"
 ita_armor.843.a: "Малые государства служат только нашим врагам"
 ita_armor.843.b: "Наши интересы не совпадают"

 ita_armor.844.t: "[FROM.GetName] соглашается"
 ita_armor.844.d: ""
 ita_armor.844.a: ""

 ita_armor.845.t: "[FROM.GetName] отказывается"
 ita_armor.845.d: ""
 ita_armor.845.a: ""

 ita_armor.846.t: "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [alliance_inviter.GetFactionName]"
 ita_armor.846.d.a: "\nС подозрением наблюдая за последними событиями в мировой политике, [alliance_inviter.GetNameDef] протягивает нам руку дружбы, предлагая свою защиту и призывая нас встать вместе с ними на защиту принципов свободы и демократии. Став членом альянса [alliance_inviter.GetFactionName], мы сможем обеспечить свободу нашего народа. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории — Воеводину и Западный Банат."
 ita_armor.846.d.b: "\nПонимая, что иногда даже сильные нуждаются в союзниках, [alliance_inviter.GetAdjective] пригласили нас присоединиться к [alliance_inviter.GetFactionName]. Если мы решим принять это предложение, у нас появится отличная возможность найти свое место под солнцем. Чтобы побудить нас принять предложение, [alliance_inviter.GetNameDef] предложили нам наши исторические территории — Воеводину и Западный Банат."
 ita_armor.846.d.c: "\nНаши идеологические союзники в [alliance_inviter.GetNameDef] отметили наш ценный вклад в дело рабочих, и сегодня утром мы получили приглашение присоединиться к [alliance_inviter.GetFactionName]. Вместе с другими социалистическими республиками мы сможем с новой силой распространять революцию. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории — Воеводину и Западный Банат."
 ita_armor.846.d.e: "\nПохоже, [alliance_inviter.GetAdjective] считает нас стратегически важными для себя и полагает, что сотрудничество с нами будет для них более выгодным, чем разделение из-за идеологических разногласий. Сегодня утром посол [alliance_inviter.GetAdjective] передал нам приглашение стать членом [alliance_inviter.GetFactionName]. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории — Воеводину и Западный Банат."
 ita_armor.846.a: "Мы встанем на их сторону."
 ita_armor.846.b: "Нам нужно всего несколько тысяч погибших..."
 ita_armor.846.c: "Мы будем сражаться бок о бок с нашими товарищами!"
 ita_armor.846.e: "Это выгодный выбор."
 ita_armor.846.f: "Без них нам лучше."
 ita_armor.846.g: "У нас уже есть необходимые союзники."

 ita_armor.847.t: "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [alliance_inviter.GetFactionName]"
 ita_armor.847.d.a: "\nС подозрением наблюдая за последними событиями в мировой политике, [alliance_inviter.GetNameDef] протягивает нам руку дружбы, предлагая свою защиту и призывая нас встать вместе с ними на защиту принципов свободы и демократии. Став членом альянса [alliance_inviter.GetFactionName], мы сможем обеспечить свободу нашего народа. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории во Фракии."
 ita_armor.847.d.b: "\nПонимая, что иногда даже сильные нуждаются в союзниках, [alliance_inviter.GetAdjective] пригласили нас присоединиться к [alliance_inviter.GetFactionName]. Если мы решим принять это предложение, у нас появится отличная возможность найти свое место под солнцем. Чтобы побудить нас принять предложение, [alliance_inviter.GetNameDef] предложили нам наши исторические территории во Фракии."
 ita_armor.847.d.c: "\nНаши идеологические союзники в [alliance_inviter.GetNameDef] отметили наш ценный вклад в дело рабочих, и сегодня утром мы получили приглашение присоединиться к [alliance_inviter.GetFactionName]. Вместе с другими социалистическими республиками мы сможем с новой силой распространять революцию. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории во Фракии."
 ita_armor.847.d.e: "\nПохоже, [alliance_inviter.GetAdjective] считает нас стратегически важными для себя и полагает, что сотрудничество с нами будет для них более выгодным, чем разделение из-за идеологических разногласий. Сегодня утром посол [alliance_inviter.GetAdjective] передал нам приглашение стать членом [alliance_inviter.GetFactionName]. Чтобы побудить нас принять это предложение, [alliance_inviter.GetNameDef] предложил нам наши исторические территории во Фракии."
 ita_armor.847.a: "Мы встанем на их сторону."
 ita_armor.847.b: "Нам нужно всего несколько тысяч погибших..."
 ita_armor.847.c: "Мы будем сражаться бок о бок с нашими товарищами!"
 ita_armor.847.e: "Это выгодный выбор."
 ita_armor.847.f: "Без них нам лучше."

 ita_armor.848.t: "Германия продолжает военную экспансию"
 ita_armor.848.d: "Нацистская Германия снова и снова доказывала, что ей нельзя доверять, доходя даже до нападения на своих бывших верных союзников. Единственное, что остается сделать сейчас, — это создать блок взаимной обороны, в который войдут последние европейские страны, еще не попавшие под контроль Германии."
 ita_armor.848.a: "Средиземноморско-Балканский блок помощи"
 ita_armor.848.b: "Ничто не может остановить Германию"

 ita_armor.849.t: "Муссолини объявляет войну Франции и Англии"
 ita_armor.849.d: "В 18:00 Муссолини выступил с балкона своего дома в Риме: Солдаты, моряки и летчики! Черные рубашки революции и легионов! Мужчины и женщины Италии, Империи и Королевства Албания! Внимание! Над нашей родиной настал час, назначенный судьбой. Объявление войны уже было вручено послам Великобритании и Франции. Мы вступаем в борьбу против плутократических и реакционных демократий Запада, которые постоянно препятствовали прогрессу и часто ставили под угрозу само существование итальянского народа. Мы победим, чтобы наконец дать Италии, Европе и всему миру долгий период мира и справедливости. Народ Италии! Бери в руки оружие и прояви свою стойкость, мужество и доблесть!"
 ita_armor.849.a: "Победа за нами!"

 ita_armor.850.t: "Антонио Грамши выздоравливает"
 ita_armor.850.desc: "Антонио Грамши наконец оправился от тяжелой болезни, которую он перенес во время несправедливого заключения. Он готов помочь нашему делу всем, чем может, с еще большей убежденностью и энтузиазмом, чем когда-либо прежде!"
 ita_armor.850.a: "Исцелённый оптимизмом воли"

 ita_armor.851.t: "План по убийству Муссолини"
 ita_armor.851.d: "Муссолини слишком долго был для нас как заноза в боку, и пришло время вернуть контроль над нашей страной и устранить его. Ведутся приготовления, чтобы добраться до него на вилле в Швейцарии, где он проживает, поскольку в стране царит хаос."
 ita_armor.851.a: "Мы отрубим голову этому гаду"

 ita_armor.852.t: "План по убийству Виктора Эммануила"
 ita_armor.852.d: "Король предал свой народ, вступив в союз с Муссолини. Виктор Эммануил больше не имеет божественного права на власть, и пришло время его устранить. Поскольку он укрылся в безопасном месте в Швейцарии, спланировать эту операцию будет сложно, но мы полны решимости."
 ita_armor.852.a: "Пришло время изменить ход истории"

 ita_armor.853.t: "Муссолини атакует наши опорные пункты"
 ita_armor.853.d: "Бенито Муссолини возглавил атаку своих чернорубашечников и рассеял наши подразделения."
 ita_armor.853.a: "Нам нужно восстановить контроль"

 ita_armor.854.t: "Виктор Эммануил осуждает коммунизм"
 ita_armor.854.d: ""
 ita_armor.854.a: "Заноза в боку!"

 ita_armor.855.t: "Виктор Эммануил восхваляет режим"
 ita_armor.855.d: ""
 ita_armor.855.a: "Они поддерживают прогнившую структуру!"

 ita_armor.856.t: "Муссолини и Виктор Эммануил бегут в Швейцарию!"
 ita_armor.856.d: "Недавние забастовки и беспорядки в Риме вынудили короля и Муссолини покинуть свою резиденцию. В связи с угрозой гражданской войны они переехали в Швейцарию для обеспечения личной безопасности. Хотя они по-прежнему возглавляют страну, этот шаг только облегчил нам распространение нашего послания, а что касается их безопасности... у нас есть другие планы."
 ita_armor.856.a: "Они поддерживают гнилую структуру!"

 ita_armor.857.t: "Мафия посылает снаряжение"
 ita_armor.857.d: "Наша сделка с мафией увенчалась успехом, и теперь у нас есть доступ к некоторым видам американского оружия."
 ita_armor.857.a: "Мы будем использовать их с пользой!"

 ita_armor.858.t: "Италия воссоединяется!"
 ita_armor.858.d: "После окончания гражданской войны и стабилизации ситуации в стране мы теперь обладаем политическим влиянием, чтобы восстановить связи с югом и созвать новый парламент с участием наших демократических революционеров."
 ita_armor.858.a: "Мы будем использовать их с пользой!"

 ita_armor.859.t: "Итальянский голод!"
 ita_armor.859.d: "После окончания гражданской войны мы не смогли произвести достаточное количество продовольствия, и теперь голод быстро распространяется среди населения."
 ita_armor.859.a: "Ситуация катастрофическая..."

 ita_armor.860.t: "Итальянский голод!"
 ita_armor.860.d: "Несмотря на высокую урожайность, нам не удалось произвести достаточное количество продовольствия, и теперь голод быстро распространяется среди населения, хотя его продолжительность может быть короче."
 ita_armor.860.a: "Ситуация катастрофическая..."

 ita_armor.861.t: "[ITA.GetName] предлагает торговую сделку по углю"
 ita_armor.861.d: ""
 ita_armor.861.a: "Хорошая сделка!"
 ita_armor.861.b: "Это не в наших интересах"

 ita_armor.862.t: "[FRA.GetName] соглашается"
 ita_armor.862.d: ""
 ita_armor.862.a: "Очень хорошо"

 ita_armor.863.t: "[FRA.GetName] отказывается"
 ita_armor.863.d: ""
 ita_armor.863.a: "Нелепо!"

 ita_armor.864.t: "[ITA.GetName] предлагает разведку угля"
 ita_armor.864.d: ""
 ita_armor.864.a: "Хорошая сделка"
 ita_armor.864.b: "Это не в наших интересах"

 ita_armor.865.t: "[YUG.GetName] соглашается"
 ita_armor.865.d: ""
 ita_armor.865.a: "Отлично"

 ita_armor.866.t: "[YUG.GetName] отказывается"
 ita_armor.866.d: ""
 ita_armor.866.a: "Нам придется искать в другом месте..."

 ita_armor.867.t: "[ITA.GetName] предлагает разведку угля"
 ita_armor.867.d: ""
 ita_armor.867.a: "Хорошая сделка"
 ita_armor.867.b: "Это не в наших интересах"

 ita_armor.868.t: "[SPR.GetName] соглашается"
 ita_armor.868.d: ""
 ita_armor.868.a: "Наши инвестиции приносят плоды"

 ita_armor.869.t: "[SPR.GetName] отказывается"
 ita_armor.869.d: ""
 ita_armor.869.a: "Нам придется искать в другом месте..."

 ita_armor.870.t: "Встреча с королем"
 ita_armor.870.d: "Переговоры с королем прошли успешно, и он согласился уволить Муссолини за его поведение и опасные амбиции, которые, вероятно, превратят Италию во врага всего мира."
 ita_armor.870.a: "Теперь мы можем перейти к следующему этапу"
 
  
 ita_armor.892.t: "Гражданская война в Италии"
 ita_armor.892.d: "Сегодня ровно в 5 часов утра, ровно через день после потери связи с северными гарнизонами, по всей Испании была начата хорошо подготовленная военная операция с намерением получить контроль над всеми правительственными учреждениями и стратегическими объектами в крупных городах. Основные части армии, флота и военно-воздушных сил перестали подчиняться приказам правительства, в то время как фашистские ополченцы подняли восстание на севере страны.\n\nПолному успеху этой попытки государственного переворота помешала только оставшаяся армия, которая присягнула на верность нашему королю и благодаря быстрым действиям сумела сохранить контроль над югом и многими другими объектами по всей стране. Этот мятеж, как и предсказывалось, возглавил Муссолини, который после побега из тюрьмы планировал захват власти, а впереди нас ждёт не что иное, как общенациональная гражданская война..."
 ita_armor.892.a: "...которую под руководством нашего Короля мы победим!"
 ita_armor.892.b: "...которую мы, как Единый Народ, победим!"
 death_to_the_fascists: "Смерть фашистам!\n"
  
 ita_armor.893.t: "Отставка Муссолини"
 ita_armor.893.d: "После наших катастрофических поражений многие в нашей партии и стране открыто высказались против продолжения войны. Великий совет, возглавляемый фельдмаршалом Пьетро Бадольо и королем Эммануэлем, официально объявил об отставке Муссолини и роспуске фашистского режима. Несомненно, вскоре после этого они планируют подписать перемирие с союзниками. У нас есть два возможных варианта: отступить и позволить Италии перейти на сторону союзников, предав Германию, или собрать наших оставшихся союзников, предупредить Германию и положить конец этому восстанию. В любом случае наше будущее действительно выглядит мрачным."
 ita_armor.893.a: "Мы отступим"
 ita_armor.893.b: "Мы должны сокрушить предателей!"
  
 ITA_on_the_brink: "§RНачинается гражданскую войну...§!"
 ITA_not_on_the_brink: "§GМы смогли избежать гражданской войны!§!"
  
 ita_armor.894.t: "Вторая мировая война подходит к концу"
 ita_armor.894.d: "Поскольку Вторая мировая война закончилась, мы можем сосредоточиться на восстановлении. Нашим первым действием будет перенос столицы обратно в Рим."
 ita_armor.894.a: "Время восстанавливать"
  
 ita_armor.895.t: "Италия просит перемирия"
 ita_armor.895.d: "После нашей победы в Северной Африке и вторжения в Италию итальянское правительство свергло Муссолини и осудило фашизм. Теперь они стремятся к перемирию с нами и готовы перейти на другую сторону и сражаться вместе с нами против своих бывших союзников. Это очень хорошая возможность разорвать союз Оси и навсегда ослабить Ось на Средиземноморском театре военных действий.\nПодписывая это перемирие, Италия соглашается передать нам контроль над Северной Африкой, а также над всеми союзными землями, находящимися под ее контролем, а мы взамен вернем ей все земли на Апеннинском полуострове."
 ita_armor.895.a: "Мы можем принять эти условия"
 ita_armor.895.b: "Мы принимаем только безоговорочную капитуляцию"
 italy_armistice_tt: "§YИталия присоединится к нам, как только мы высадимся на материк.§!"
  
 ita_armor.896.t: "Италия заверяет в лояльности"
 ita_armor.896.d: "Мы только что услышали новость о том, что Большой совет Италии арестовал Муссолини и взял на себя управление итальянским правительством. Хотя этот шаг явно отталкивает Италию от фашизма, новый глава итальянского правительства уверяет нас, что Италия останется верной Оси. Однако было бы абсурдно думать, что итальянцы не пытаются подписать перемирие за закрытыми дверями. Поэтому мы должны немедленно отправить войска в Италию, чтобы обеспечить контроль Оси и подготовить операцию по спасению Муссолини, если итальянцы повернутся против нас."
 ita_armor.896.a: "Мы видим их ложь насквозь"
  
 ita_armor.897.t: "Союзники подписывают перемирие"
 ita_armor.897.d: "Союзники приняли наши условия и подписали с нами перемирие. Нам следует немедленно ожидать ответного удара со стороны Германии, наша единственная надежда – на наших новых союзников..."
 ita_armor.897.a: "Отлично"
 ita_armor.897.b: "Мы опоздали..."
  
 ita_armor.898.t: "Союзники отвергают перемирие"
 ita_armor.898.d: "Союзники отвергли наше мирное предложение и заявили, что примут только безоговорочную капитуляцию. Это весьма неожиданно, учитывая, насколько благоприятным был договор для союзников, но, тем не менее, мы остаемся в тяжелом положении, и наша единственная надежда - это победа Оси."
 ita_armor.898.a: "Тогда мы будем сражаться насмерть"
  
 ita_armor.899.t: "Конец гражданской войны в Италии"
 ita_armor.899.d: "Долгий и кровавый конфликт завершился... победой республиканцев. Эта победа потрясла фашизм до основания: место его рождения было очищено. Основное внимание итальянского народа сосредоточено на восстановлении страны, но еще более важным является решение о том, в каком направлении страна будет двигаться дальше."
 ita_armor.899.a: "С новыми силами мы восстановим страну"
 
 ita_armor.900.t: "Открытые выборы"
 ita_armor.900.d: "После того как улеглась пыль от недавних политических потрясений, для демократического правительства Италии настало время выполнить свое обещание о проведении открытых и свободных выборов. Теперь итальянский народ должен будет выбрать, кто из этих трех лидеров демократических партий станет первым, кто будет руководить страной в новой системе управления."
 ita_armor.900.a: "Ферруччо Парри из Итальянской социалистической партии"
 ita_armor.900.b: "Иваноэ Бономи из Итальянской либеральной партии"
 ita_armor.900.c: "Альчиде Де Гаспери из партии «Христианская демократия»"

 ita_armor.887.t: "Гражданская война в Италии"
 ita_armor.887.d: "Сегодня ровно в 6:30 утра, ровно через неделю после того, как коммунисты предприняли покушение на короля Виктора Эммануила и дуче Бенито Муссолини, коммунисты под руководством Антонио Грамши взяли в руки оружие, чтобы раз и навсегда покончить с фашистами!"
 ita_armor.887.a: "Мы возьмемся за оружие, Белла Чао!"

 ita_armor.888.t: "Конец гражданской войны в Италии"
 ita_armor.888.d: "После ожесточенных боев фашисты наконец-то были разгромлены! Теперь нам нужно похоронить наших братьев, реорганизовать армию и создать хорошую политическую систему. Смерть наших братьев не была напрасной, Италия снова станет великой!"
 ita_armor.888.a: "Forza Italia!"
