 ITA_war_speech: "Выступление «Жребий брошен»"
 ITA_war_speech_desc: "«Бойцы на суше, на море и в воздухе, мужчины и женщины Италии и империи, слушайте! Для нас звучит предначертанный судьбой час. Настал час бесповоротного решения. Объявление войны уже было вручено. Мы победим, чтобы наконец дать Италии, Европе и всему миру новый мир, основанный на справедливости. Итальянский народ, к оружию! Покажи свое упорство, свое мужество, свою доблесть!»"
  
 ITA_war_speech_tt: "£faction_ita_proletariat §YПролетариат§! станет больше §Gподдерживать§! войну, увеличивая £political_power_texticon  §Yежедневный прирост политической власти§! на §G+0.10§!"
  
