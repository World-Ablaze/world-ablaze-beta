 ITA_stockpile_fuel_tt: "При ведении §Rвойны§! с §YВеликой державой§!, £fuel_consumption_texticon  §Yпотребление горючего§! для §Yсамолетов и танков§! §Gбудет сокращено на 30%§!."
  
 ITA_institute_for_industrial_reconstruction: "Институт промышленной реконструкции"
 ITA_institute_for_industrial_reconstruction_desc: "Istituto per la Ricostruzione Industriale (Институт промышленной реконструкции) или IRI был введен в действие фашистским режимом в 1933 году и защитил наш народ от худших последствий Великой депрессии. Три года спустя он контролирует почти половину всех отраслей промышленности и спас нашу страну от тотальной катастрофы."
  
 ITA_develop_danieli_steelworks: "Развитие сталелитейного завода Даниэли"
 ITA_develop_danieli_steelworks_desc: ""
  
 ITA_experiments_in_hydro_power: "Эксперименты в гидроэнергетике"
 ITA_experiments_in_hydro_power_desc: ""
  
 ITA_industrial_socialization_desc: "Пришло время экспроприировать крупные заводы из рук большого бизнеса и буржуазии, чтобы они могли быть использованы на благо всего итальянского народа."
  
 ITA_invest_in_danieli_industrial_complexs: "Инвестировать в промышленный комплекс Даниели"
 ITA_invest_in_danieli_industrial_complexs_desc: "Инвестируя в существующие компании и сосредоточив внимание на нашем промышленном центре, мы сможем гораздо быстрее догнать другие великие державы."
 ITA_invest_in_danieli_industrial_complexs_tt: "Выбор этого фокуса §Rблокирует§! возможность взять §Y$ITA_focus_on_rural_industrialization$§! в течение §Rдвух лет§!; идя по этой ветке, вы получите §Yдополнительные§! §R6%§! §Yэкономической усталости§!."
 ITA_invest_in_danieli_industrial_complexs_dd_flag: "Фокус §Y$ITA_invest_in_danieli_industrial_complexs$§! выполнен"
 ITA_invest_in_danieli_industrial_complexs_dd_tt: "В настоящее время: [?ITA_invest_in_danieli_industrial_complexs_dd_flag:days|Y0]"
  
 ITA_focus_on_the_centres_of_industry: "Сосредоточиться на промышленных центрах"
 ITA_focus_on_the_centres_of_industry_desc: ""
  
 ITA_centre_for_military_modernization: "Центр военной модернизации"
 ITA_centre_for_military_modernization_desc: "Чтобы создать боеспособную армию для достижения территориальных амбиций, мы должны инвестировать в модернизацию наших вооруженных сил, чтобы противостоять любой угрозе, с которой мы сталкиваемся."
  
 ITA_development_of_synthetic_oil: "Разработка синтетического топлива"
 ITA_development_of_synthetic_oil_desc: ""
  
 ITA_italian_highways_desc: "Нам необходимо расширить нашу инфраструктуру, чтобы обеспечить легкую мобильность войск по всей нашей империи. Учитывая, что враги есть во всех уголках мира, это важнейшая часть возможности защитить всю итальянскую землю."
  
 ITA_focus_on_rural_industrialization: "Фокус на сельской индустриализации"
 ITA_focus_on_rural_industrialization_desc: "Большая часть нашей экономики по-прежнему базируется на сельском хозяйстве. Инвестируя в эти области, мы можем помочь добиться индустриализации всей страны и принести процветание югу."
 ITA_focus_on_rural_industrialization_tt: "Выбор этого фокуса §Rблокирует§! возможность взять §Y$ITA_invest_in_danieli_industrial_complexs$§! в течение §Rдвух лет§!; идя по этой ветке, вы получите §Yдополнительные§! §R6%§! §Yэкономической усталости§!."
 ITA_focus_on_rural_industrialization_dd_flag: "Фокус §Y$ITA_focus_on_rural_industrialization$§! выполнен"
 ITA_focus_on_rural_industrialization_dd_tt: "В настоящее время: [?ITA_focus_on_rural_industrialization_dd_flag:days|Y0]"
  
