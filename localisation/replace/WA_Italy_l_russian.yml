 ITA_infantry_modernization: "Модернизация пехоты"
 ITA_infantry_modernization_desc: "Нашим солдатам необходимо новое вооружение и вспомогательная техника, чтобы обеспечить свое превосходство на поле боя. Кроме того, мы должны поручить нашему генеральному штабу разработать новые стратегии, использующие достижения современности."
  
 ITA_artillery_modernization: "Модернизация артиллерии"
 ITA_artillery_modernization_desc: "Недостаточно иметь на поле боя большие пушки, если их постоянно превосходит вооружение противника. Мы начнем экстренную программу модернизации наших артиллерийских систем. Кроме того, мы должны поручить нашему генеральному штабу разработать новые стратегии, использующие достижения современности."
  
