 ITA_standardise_our_war_material_tt: "«§YAnsaldo§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y365 дней§!"

 ITA_corporate_alliances: "Корпоративные альянсы"
 ITA_corporate_alliances_desc: ""
 ITA_corporate_alliances_tt: "«§YFiat§!» (£funds_texticon  Прирост финансов: §G+100%§!) в течение §Y500 дней§!"
 ITA_industrial_miracle: "Индустриальное чудо"
 ITA_industrial_miracle_desc: "Требуется новый совет для контроля промышленного производства и реализации максимального потенциала итальянской экономики. При нашем почти полном контроле над экономикой это должно привести к значительному скачку в производстве"
 ITA_mobalize_the_mezzogiorno: "Мобилизация Mezzogiorno"
 ITA_mobalize_the_mezzogiorno_desc: ""
  
 ITA_education_reform: "Реформа образования"
 ITA_education_reform_desc: ""
  
 ITA_trade_and_tariffs: "Торговля и тарифы"
 ITA_trade_and_tariffs_desc: "Автаркия? Только дураки верят, что экономика выживет в изоляции! Мы должны немедленно открыть наши рынки, чтобы наши люди могли наслаждаться роскошью, которую может предложить мир. Это также облегчит нам расширение нашего собственного производственного сектора."
  
 ITA_autarky: "Автаркия"
 ITA_autarky_desc: ""
  
 ITA_libyan_development: "Развитие Ливии"
 ITA_libyan_development_desc: ""
  
 ITA_libyan_citizenship: "Ливийское гражданство"
 ITA_libyan_citizenship_desc: ""
  
 ITA_regional_development_tt: "Добавляет §Y1§! £civ_factory  и §Y1§! ед. сооружения §YМорская база§! в каждый регион, развитый предыдущими фокусами."
  
 ITA_fortify_africa: "Укрепить Африку"
 ITA_fortify_africa_desc: ""
  
 ITA_centres_for_army_research: "Центры армейских исследований"
 ITA_centres_for_army_research_desc: ""
  
 ITA_military_modernization: "Военная модернизация"
 ITA_military_modernization_desc: "Будь то оборудование, транспортные средства или доктрины, Королевская армия Италии нуждается во многих улучшениях и реформах в каждом аспекте."
 ITA_finished_modernization: "§RИнтенсивная модернизация прекратится в случае войны§!\nСостояние итальянских вооруженных сил...удручающее. Наши солдаты используют устаревшее снаряжение и не имеют такой же хорошей подготовки как наши соседи. Если война должна повториться, Италия должна быть к этому готова. Первый шаг — направить нашу промышленную базу на модернизацию, даже если это немного повредит нашей экономике."
  
 ITA_italian_army: "Il Regio Esercito"
 ITA_italian_army_desc: "Будь то техника, транспортные средства или доктрины — Королевская армия Италии нуждается в серьезных улучшениях и реформах во всех отношениях."
  
 ITA_italian_airforce: "La Regia Aeronautica"
 ITA_italian_airforce_desc: "Разрозненность авиационной промышленности среди множества компаний дает Королевским ВВС Италии возможность кардинально улучшить ситуацию, позволив каждому конструктору создавать свои собственные модели."
  
 ITA_italian_navy: "La Regia Marina"
 ITA_italian_navy_desc: "В силу расположения и амбиций Италии Королевский итальянский флот является жемчужиной итальянских вооруженных сил."
  
 ITA_strengthen_the_blackshirts_template_tt: "Добавляет §G3§! батальона §Y$heavy_militia$§! и §G2§! батальона §Y$artillery_brigade$§!, а также роты поддержки: §Y$horse_signal_company$, $anti_air$, $anti_tank$§! и §Y$military_police$§! к шаблону дивизии §YCamicie Nere§!. \n$ITA_blackshirts_div_cap_6_tt$\n\n"
 ITA_blackshirts_div_cap_6_tt: "Изменить лимит шаблона §YCamicie Nere§! на §G+6§!."
  
 ITA_m_battalions: "Баттальони «М»"
 ITA_m_battalions_desc: "Дуче отдал приказ о преобразовании и укреплении штурмовых батальонов Milizia Volontaria per la Sicurezza Nazionale («Чернорубашечники»), которые особенно отличились в боях. Для дальнейшего повышения их боевой эффективности батальоны «М» должны пройти специальные курсы подготовки для различных специализированных сценариев."
 ITA_m_battalions_tt: "£tech_mod  Открывает §HБаттальони «М»§!\n§Y$blackshirt_assault_battalion$§!\n   §HРавнины§!\n     Атака: §G+3%§!\n   §HХолмы§!\n     Атака: §G+3%§!\n   §HЛес§!\n     Атака: §G+3%§!\n   §HГоры§!\n     Атака: §G+3%§!\n   §HБолота§!\n     Атака: §G+3%§!\n   §HЛес + Болото§!\n     Атака: §G+3%§!\n   §HГород§!\n     Атака: §G+3%§! \n   §HУкрепление§!\n     Атака: §G+3%§!\n\n£attack_texticon Атака §Yамфибий§!: §G+10%§!."
  
