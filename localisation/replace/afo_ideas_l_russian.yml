 agrarian_society_1: "Аграрное общество"
 agrarian_society_1_desc: "Местные администраторы считают, что их аграрный образ жизни сделал большую часть колониального населения просто непригодным для военной службы или любого рода боевых действий. Они утверждают, что нам следует рекрутировать только из так называемых «боевых племен». Это убеждение настолько широко распространено и прочно укоренилось, что для его преодоления потребуется по крайней мере одно поколение. В обозримом будущем мы должны признать, что они просто проигнорируют любой приказ о призыве фермеров."
  
