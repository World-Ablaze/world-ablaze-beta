 misak_i_milli: "Мисак-Милли"
 misak_i_milli_desc: "Мисак-ы милли – Национальная клятва. После распада Османской империи и завершения Войны за независимость мы добровольно уступили большую часть территории, которую удерживали, и отказались от наших претензий на эту территорию. Мир теперь другой, и люди на этих территориях требуют нашего возвращения. Мы пойдем им навстречу."
  
 TUR_provide_refuge_to_the_victims_of_fascism_tt: "§OКоличество рабочей силы зависит от напряженности в мире§!"
  
