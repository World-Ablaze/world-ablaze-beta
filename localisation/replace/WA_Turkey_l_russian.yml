 tur_armor.801.t: "[TUR.GetNameDefCap] готовится захватить [GRE.GetName]"
 tur_armor.801.d: "[TUR.GetNameDefCap] вышел из гражданской войны в очень сильной позиции и теперь стремится вернуть себе земли, которые раньше принадлежали им, но теперь принадлежат [GRE.GetName]. После Первой мировой войны мы гарантировали независимость [GRE.GetName], и это поставило нас перед дилеммой: приходить им на помощь или нет.\n\nСправедливо это или нет, но нам предстоит решить, какая страна для нас важнее и хотим ли мы быть втянутыми в длительную, затянувшуюся войну, к которой мы, возможно, не готовы."
 tur_armor.801.a: "Это внутренний конфликт"
 tur_armor.801.b: "Поддержать [GRE.GetName]"
  
 tur_armor.802.t: "[ENG.GetNameDefCap] бросает нас!"
 tur_armor.802.d: "Британские власти заявили о нейтралитете в нашем предстоящем конфликте с [TUR.GetName] и предоставили нам самим заботиться о себе. Неважно, мы покажем этим туркам, почему Балканскую войну выиграли мы, а не они."
 tur_armor.802.a: "Мы будем сражаться до последнего"
  
 tur_armor.803.t: "[ENG.GetNameDefCap] бросает [GRE.GetName]"
 tur_armor.803.d: "[ENG.GetNameDefCap] дал свой ответ после того, как мы ясно заявили о своих намерениях вернуть утраченные земли в [GRE.GetName]: там решили, что это внутренний конфликт между нами и [GRE.GetNameDefCap], и потому отозвали гарантии защиты [GRE.GetName]. Это отличный результат, поскольку он означает, что мы не будем втянуты в более масштабный конфликт, — сейчас прекрасная возможность для сладкой мести!"
 tur_armor.803.a: "Наше завоевание будет стремительным"
  
 tur_armor.804.t: "[ENG.GetNameDefCap] поддерживает нас"
 tur_armor.804.d: "Британские власти решили поддержать нас в случае возникновения конфликта с [TUR.GetName]. Это большое повышение морального духа внутри нашей страны, и мы надеемся, что Турция переосмыслит свою агрессию."
 tur_armor.804.a: "Наши шансы увеличились"
  
 tur_armor.805.t: "[ENG.GetNameDefCap] поддерживает [GRE.GetName]"
 tur_armor.805.d: "Британские власти решили поддержать [GRE.GetName] в ответ на наше желание воссоединиться с утраченными землями. Это значительно склоняет чашу весов в пользу [GRE.GetName], и нам придется переосмыслить нашу стратегию."
 tur_armor.805.a: "Победа все равно придет"
  
 tur_armor.806.t: "[FROM.GetNameDefCap] предлагает объединение"
 tur_armor.806.d: "После исламизации Турции [TUR.GetName] заявили о своей цели объединить исламский мир под одним правителем. Большая часть нашего населения поддерживает это, но решать нам."
 tur_armor.806.a: "Мы присоединимся к Халифату"
 tur_armor.806.b: "Мы хотели бы сохранить наш суверенитет"
  
 tur_armor.807.t: "[FROM.GetNameDefCap] принимает объединение"
 tur_armor.807.d: ""
 tur_armor.807.a: "Отлично"
  
 tur_armor.808.t: "[FROM.GetNameDefCap] отвергает объединение"
 tur_armor.808.d: ""
 tur_armor.808.a: "Досадно"
  
 tur_armor.809.t: "Британский мандат под вопросом"
 tur_armor.809.d: "Властные бандиты, управляющие государством [FROM.GetNameDef], потребовали от нас немедленно сдать им территорию Аравийских земель под угрозой войны. Нельзя сказать, что мы удивлены таким решением [FROM.GetAdjective]их стервятников, но это не делает наше положение менее шатким. \n\nМы должны решить, готовы ли мы сдать нашу землю оккупантам в надежде избежать войны, или же мы готовы попытаться навсегда отбросить [FROM.GetNameDef] обратно в анналы истории, где они должны были остаться."
 tur_armor.809.a: "Это не стоит того, чтобы бороться."
 tur_armor.809.b: "Давно пора окончательно покончить с османской гегемонией."
  
 tur_armor.810.t: "[FROM.GetNameDefCap] отказывает нам!"
 tur_armor.810.d: "Дураки в государстве [FROM.GetNameDef] отвергли наше вполне разумное требование вернуть нашу бывшую территорию обратно законному владельцу. Это оставляет нам только один вариант действий – войну!"
 tur_armor.810.a: "Их наглость будет встречена нашими ятаганами."
  
 tur_armor.811.t: "Наши территории – наши!"
 tur_armor.811.d: "Слабаки [FROM.GetNameDef] продемонстрировали некоторую нехарактерную мудрость в своем решении вернуть нам арабские земли без необходимости насилия. Мы уже усердно работаем над тем, чтобы снова включить эту территорию в состав нашей империи, и подошли к перепутью. \n\nМногие из тех, кем мы сейчас управляем, с нетерпением празднуют приход своих новых лидеров после падения британского мандата."
 tur_armor.811.a: "Добро пожаловать обратно в Империю!"
  
 tur_armor.812.t: "[FROM.GetNameDefCap] предлагает мир"
 tur_armor.812.d: "После наших разрушительных потерь на Ближнем Востоке нам предоставили возможность прекратить боевые действия. Учитывая потерю такого большого количества земель, наши генералы считают, что мир — лучший вариант, поскольку он даст нам время восстановить наши силы и предотвратить потерю еще большего количества земель."
 tur_armor.812.a: "У нас нет другого выбора, кроме как принять"
  
 tur_armor.814.t: "[FROM.GetNameDefCap] предлагает мир"
 tur_armor.814.d: "После наших разрушительных потерь на Ближнем Востоке нам предоставили возможность прекратить боевые действия. Учитывая потерю такого большого количества земель, наши генералы считают, что мир — лучший вариант, поскольку он даст нам время восстановить наши силы и предотвратить потерю еще большего количества земель."
 tur_armor.814.a: "У нас нет другого выбора, кроме как принять"
  
 tur_armor.816.t: "[FROM.GetNameDefCap] предлагает мир"
 tur_armor.816.d: "После наших разрушительных потерь на Ближнем Востоке нам предоставили возможность прекратить боевые действия. Учитывая потерю такого большого количества земель, наши генералы считают, что мир — лучший вариант, поскольку он даст нам время восстановить наши силы и предотвратить потерю еще большего количества земель."
 tur_armor.816.a: "У нас нет другого выбора, кроме как принять"
  
 tur_armor.817.t: "[TUR.GetName] выдвигает ультиматум по Хатаю"
 tur_armor.817.d: "[TUR.GetLeader] потребовал включения Хатая в состав Турции. Наши полицейские силы отметили значительное скопление турецких войск на границе после предыдущего отказа, а новый отказ спровоцирует войну между нашими странами."
 tur_armor.817.a: "Не стоит воевать из-за Хатая"
 tur_armor.817.b: "Мы будем защищать Хатай как наше законное требование."
  
 tur_armor.818.t: "[FROM.GetNameDefCap] передает нам суверенитет над Хатаем"
 tur_armor.818.d: "[TUR.GetLeader] произнес небольшую речь в Антакье, приветствуя граждан Хатая в [TUR.GetNameDef], и поблагодарил [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатая. Несмотря на то, что этот шаг вызвал возмущение сирийских официальных лиц, в Хатае и в [TUR.GetNameDef] в целом царило удовлетворение, и многие [TUR.GetAdjective]ие люди совершили поездки из своих домов в Хатай, чтобы отметить появление новейшей провинции торжествами и обменом подарками."
 tur_armor.818.a: "Добро пожаловать обратно в наши ряды, братья и сестры."
  
 tur_armor.819.t: "[FROM.GetName] сохраняет твердый контроль над Хатаем"
 tur_armor.819.d: "[TUR.GetLeader] провел пламенный митинг в Газиантепе, где осудил притеснение турок за рубежом со стороны [FROM.GetNameDef]. [TUR.GetAdjective]ий народ был взбудоражен, и в настоящий момент между угнетателями Хатая и народом [FROM.GetNameDef] царит острая неприязнь. На данный момент Хатай остается вне нашей досягаемости, но мы всегда будем помнить об этом гнусном предательстве."
 tur_armor.819.a: "Да начнется освобождение!"
  
 tur_armor.820.t: "[SOV.GetName] выдвигает территориальные претензии к Турции"
 tur_armor.820.d: "[SOV.GetLeader] претендует на территорию Восточной Анатолии, которая предположительно была украдена Турцией у Грузии и Армении. Претензии [SOV.GetAdjective], в случае успеха, укрепят их позиции вокруг Черного моря."
 tur_armor.820.a: "Наши союзники защитят нас!"
 tur_armor.820.b: "Мы должны избегать конфликта."