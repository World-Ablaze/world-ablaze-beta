l_english:
 # Suiyuan incident seen from Japan
 jap_suiyuan.1.t:0 "The Mongols Look to Suiyuan"
 jap_suiyuan.1.desc:0 "The Mongol Military Government, with the Kwantung Army behind it, means to move on Suiyuan. Holding Suiyuan would unite Inner Mongolia and tighten the pressure on northern China.\n\nBut Fu Zuoyi of Shanxi is no easy opponent. He has gathered his best troops in Suiyuan, and there is no guarantee that the Mongol army can break through alone. The Kwantung Army advises bringing divisions up to Chahar before the Mongols move, to stand behind them."
 jap_suiyuan.1.a:0 "Send the Kwantung Army to Chahar"
