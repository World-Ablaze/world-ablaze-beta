 iron_shortage: "Нехватка железа"
 iron_shortage_desc: "Нашим сталелитейным заводам не хватает железа для правильного функционирования. Мы будем вынуждены их закрыть, пока не восполним дефицит. Мы можем избежать этого, захватив или выменяв больше железа."
