 emergency_pp: "Чрезвычайная политическая власть"
 emergency_pp_desc: "Используя наши тесные связи с вооруженными силами страны, мы могли бы получить дополнительные рычаги воздействия на наших политических оппонентов. Это дало бы нам небольшое дополнительное краткосрочное политическое влияние, но, скорее всего, это можно сделать только один раз, прежде чем возникнут последствия."
 
 sp_uranium_tungsten: "Уран как заменитель вольфрама"
 sp_uranium_tungsten_desc: "Недавняя отмена специального проекта §Y$sp_nuclear_reactor$§! привела к образованию запасов урана, металла с высокой плотностью. Этот уран может заменить вольфрам в наших бронебойных боеприпасах, пока запасы не иссякнут."
  
