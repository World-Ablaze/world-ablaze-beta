

 # Old symmetric tree kept beside plan C for comparison (ids end in _old).
 JAP_army_armoured_headquarters_old:0 "Army Armoured Headquarters"
 JAP_army_armoured_headquarters_old_desc:0 "The massed use of tanks the Soviets showed at Khalkhin Gol and the lightning advance of the German panzer divisions in Europe have proven that the tank is the master of the battlefield. So as not to fall behind, we will establish the Army Armoured Headquarters to bring the training and study of our armoured forces under a single authority."
 JAP_first_tank_group_old:0 "1st Tank Group"
 JAP_first_tank_group_old_desc:0 "A tank group headquarters is established to bring several tank regiments under one command and make the handling of tanks its sole business. Their task is still limited to the direct support of the infantry, but placing the tanks under a chain of command of their own lays the groundwork for a future armoured force."
