 JAP_imperial_general_headquarters:0 "Imperial General Headquarters"
 JAP_imperial_general_headquarters_desc:0 ""
 JAP_first_tank_group:0 "1st Tank Group"
 JAP_first_tank_group_desc:0 "A tank group headquarters is established to bring several tank regiments under one command and make the handling of tanks its sole business. Their task is still limited to the direct support of the infantry, but placing the tanks under a chain of command of their own lays the groundwork for a future armoured force."
 JAP_army_armoured_headquarters:0 "Army Armoured Headquarters"
 JAP_army_armoured_headquarters_desc:0 "The massed use of tanks the Soviets showed at Khalkhin Gol and the lightning advance of the German panzer divisions in Europe have proven that the tank is the master of the battlefield. So as not to fall behind, we will establish the Army Armoured Headquarters to bring the training and study of our armoured forces under a single authority."
 JAP_army_armoured_headquarters_khalkhin_gol_tt:0 "Has clashed with §Y[SOV.GetName]§! at §YKhalkhin Gol§!"
 JAP_army_armoured_headquarters_fall_of_france_tt:0 "§YFrance§! has fallen"
