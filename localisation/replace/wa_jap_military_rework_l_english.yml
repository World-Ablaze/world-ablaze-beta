 # Japanese army/navy tree rework v11.1 - English names are not decided yet.
 # Until they are, the new focuses fall back to their keys in English.
 # Names that have been decided are listed below.
 JAP_shokaku_class:0 "Construction of the Shokaku Class"
 JAP_shokaku_class_desc:0 ""
 jap_carrier_4:0 "Hiryu Class"
 jap_carrier_5:0 "Shokaku Class"
 jap_carrier_6:0 "Taiho Class"
 JAP_imperial_general_headquarters:0 "Imperial General Headquarters"
 JAP_imperial_general_headquarters_desc:0 ""
 JAP_first_tank_group:0 "1st Tank Group"
 JAP_first_tank_group_desc:0 "A tank group headquarters is established to bring several tank regiments under one command and make the handling of tanks its sole business. Their task is still limited to the direct support of the infantry, but placing the tanks under a chain of command of their own lays the groundwork for a future armoured force."
 JAP_army_armoured_headquarters:0 "Army Armoured Headquarters"
 JAP_army_armoured_headquarters_desc:0 "The massed use of tanks the Soviets showed at Khalkhin Gol and the lightning advance of the German panzer divisions in Europe have proven that the tank is the master of the battlefield. Unless the training and study of our armoured forces are brought under a single headquarters, we will be left behind by this tide."
 JAP_expand_the_armoured_divisions_desc:0 "As more tank divisions follow the 1st Tank Division, a headquarters is needed to command them. In peacetime the Armoured Army will train its divisions and keep them supplied with men and machines; in war it will send them to whichever front needs them. The tank divisions will be used not to support the infantry but as a force that moves the front."
 JAP_army_armoured_headquarters_khalkhin_gol_tt:0 "Has clashed with §Y[SOV.GetName]§! at §YKhalkhin Gol§!"
 JAP_army_armoured_headquarters_fall_of_france_tt:0 "§YFrance§! has fallen"


 # Focuses added by plan A (service-branch trunks). Placeholder names generated from the keys.
 JAP_army_armament_expansion_plan:0 "Army Armament Expansion Plan"
 JAP_army_armament_expansion_plan_desc:0 ""
 JAP_triangular_divisions:0 "Triangular Divisions"
 JAP_triangular_divisions_desc:0 ""
 JAP_shanghai_expeditionary_army:0 "Escalation of the China Incident"
 JAP_shanghai_expeditionary_army_desc:0 "The clash that began at the Marco Polo Bridge has spread to Shanghai, and the policy of non-escalation has already collapsed. The government accepts the widening of the incident and calls on the nation to unite behind the war effort. Yet the public's fervour rests on victories, and should the fighting on the continent bog down, that fervour will cool as well."
 JAP_sino_japanese_war_started_tt:0 "The Sino-Japanese War has begun"
 JAP_national_spiritual_mobilization:0 "National Spiritual Mobilisation"
 JAP_national_spiritual_mobilization_desc:0 ""
 JAP_gekokujo_restrained:0 "Gekokujō"
 JAP_gekokujo_restrained_desc:0 "The new theatre command has reined in the field armies somewhat, yet many in the officer corps still put their own convictions before the orders of their superiors."
 JAP_reinforce_the_expeditionary_army:0 "Form the China Expeditionary Army"
 JAP_reinforce_the_expeditionary_army_desc:0 "As the incident drags on, the armies in north and central China have widened the fighting on their own judgement. The new general headquarters in Nanjing is trying to bring every army on the continent under a single command. Whether this will end the field armies' independent action remains to be seen, but at least orders will come from one place."
 JAP_shift_to_protracted_war:0 "Shift to a Protracted War"
 JAP_shift_to_protracted_war_desc:0 "The deeper we advance into the continent, the longer our supply lines grow, and further advances are becoming hard to make. Occupied areas will be divided into security zones and operational zones, and holding them steady will come before any new advance. Keeping the nation's enthusiasm alive with victories cannot go on for ever."
 JAP_shift_to_protracted_war_army:0 "Shift to a Protracted War"
 JAP_shift_to_protracted_war_army_desc:0 "The deeper we advance into the continent, the longer our supply lines grow, and further advances are hard to make. Operations in China will shift to a posture of protracted war. Yet a protracted war does not mean shutting ourselves in and waiting for the enemy to counterattack. Strike first at the enemy's main force in Hunan, which threatens our occupied areas, and our hold will be all the firmer."
 JAP_conquer_hunan:0 "Conquer Hunan Province"
 JAP_cut_the_chiang_supply_routes:0 "Cut the Supply Routes to Chiang"
 JAP_cut_the_chiang_supply_routes_desc:0 "Cutting the supply routes to Chiang is a crucial task in our strategy against China. We will demand that the French Indochina authorities close the supply routes leading to China, including the railway from Haiphong to Kunming, and accept our inspection mission, with a reply within 24 hours. Once that route is closed, the Nationalist government will lose one of the main pillars of its outside aid."
 JAP_border_conflict_guidelines:0 "Border Conflict Guidelines"
 JAP_border_conflict_guidelines_desc:0 "Much of the Manchurian-Soviet border has no clearly marked line. Distrustful of the centre's insistence on keeping disputes from spreading, the Kwantung Army has drawn up its own guidelines: local commanders decide the border themselves where it is unclear, and in any clash the troops are to win regardless of numbers. A single small clash on the border could grow into a war beyond the centre's reach."
 JAP_northern_indochina_occupation:0 "Northern Indochina Occupation"
 JAP_northern_indochina_occupation_desc:0 "An agreement with the authorities in French Indochina on the use of airfields and the stationing of troops in the north is nearly settled. Yet the General Staff's chief of operations, now on the spot, says openly that there can be no peaceful entry and has told the division on the border to prepare to advance. Even if the agreement is signed, the entry may not pass without shots being fired."
 JAP_kantokuen:0 "Kantokuen"
 JAP_kantokuen_desc:0 "Many of the Kwantung Army's divisions still stand on the border at peacetime strength. Under the cover of manoeuvres we will mobilise in secret, bring them to wartime strength and gather men and materiel in northern Manchuria. They are called manoeuvres, but depending on the situation in the north, the troops may well go straight across the border."
 JAP_southern_expeditionary_army_group:0 "Southern Expeditionary Army Group"
 JAP_southern_expeditionary_army_group_desc:0 "Operations in the south will see several armies advancing at once across a wide stretch of sea. Directing them all under a single plan calls for a general army in command of every army force in the south. In time, the military administration of the lands it takes will fall to it as well."
 JAP_seize_the_southern_resource_area:0 "Seize the Southern Resource Area"
 JAP_seize_the_southern_resource_area_desc:0 "To sustain the nation's strength, the vital resource areas of the south must be secured. That means readying airfields and ports from Taiwan to Indochina to send troops and air power across the sea. On the day war comes, landing forces and air units will set out south from these bases together."
 JAP_island_defence_revision:0 "Lay the Greater East Asia Railway"
 JAP_island_defence_revision_desc:0 "The South Manchuria Railway, North China Transportation and Central China Railway have each run their own lines in their own regions. The East Asia Transport Society drew up a trunk railway joining them in one line from Pusan to Singapore, but the plan never left the drawing board. Now that Operation Ichigo has opened the way, the missing sections can be laid and the plan made real."
 JAP_island_garrisons:0 "Carry the Southern Resources Overland"
 JAP_island_garrisons_desc:0 "The Outline of Basic National Policy calls for a self-sufficient economy that binds Japan, Manchuria and China together and embraces Greater East Asia. Yet the resources of the Dutch East Indies and Malaya have so far reached the homeland by ship. The trunk railway will carry them overland instead. They will reach the homeland beyond the reach of commerce raiders, and the shipping this saves can be put to other uses."
 JAP_continental_corridor_held_tt:0 "Controls all of the following states:\n§Y-[608.GetName]\n-[607.GetName]\n-[620.GetName]\n-[602.GetName]\n-[599.GetName]\n-[932.GetName]\n-[594.GetName]§!\n§Y[671.GetName]§! is not controlled by an enemy."
 JAP_corridor_resources_tt:0 "As long as no enemy is controlling\n§Y-[608.GetName]\n-[607.GetName]\n-[620.GetName]\n-[602.GetName]\n-[599.GetName]\n-[932.GetName]\n-[594.GetName]\n-[671.GetName]§!\nall resources of the following states under our control are moved to §Y[282.GetName]§!:\n§Y-[672.GetName]\n-[335.GetName]\n-[334.GetName]\n-[673.GetName]\n-[667.GetName]\n-[333.GetName]\n-[862.GetName]§!"
 JAP_corridor_received:0 "Southern Resources Carried Overland"
 JAP_corridor_shipped:0 "Resources Carried Overland"
 JAP_operation_kita:0 "Operation Kita"
 JAP_operation_kita_desc:0 "Along the Manchurian border the Kwantung Army and the Soviet Far East forces have long stood face to face. Should war with the Soviet Union come, the Kwantung Army will cross the border, take the offensive and cut the Trans-Siberian Railway. Cut off from their supply line, the Soviet forces in the Far East will have no reinforcements to hope for."
 JAP_north_sakhalin_oilfields:0 "Reopen the North Sakhalin Oilfields"
 JAP_north_sakhalin_oilfields_desc:0 "After the Nikolayevsk Incident we occupied North Sakhalin as a guarantee, and even after withdrawing we kept the oil concession at Okha. Yet its output dwindled, held back by a lack of funds and Soviet obstruction. Now that North Sakhalin is in our hands again, a railway and a push to develop the fields will make Okha's crude fuel for the navy once more."
 JAP_far_east_resources_overland:0 "Carry the Far Eastern Resources Overland"
 JAP_far_east_resources_overland_desc:0 "The Soviet Far East is joined to the rest of the Soviet Union by the Trans-Siberian Railway, which runs along the Manchurian border. The Soviets have planned a second line further north to replace it, but its construction is still far from finished. Once we seize the line around Chita and cut the traffic westward, the iron and rare metals of the Far East will drive our factories instead of the Soviets'."
 JAP_far_east_resources_tt:0 "As long as no enemy is controlling\n§Y-[563.GetName]\n-[564.GetName]§!\nall resources of the following states under our control are moved to §Y[282.GetName]§!:\n§Y-[408.GetName]\n-[409.GetName]\n-[657.GetName]\n-[560.GetName]\n-[561.GetName]\n-[562.GetName]\n-[637.GetName]\n-[854.GetName]\n-[574.GetName]\n-[563.GetName]\n-[564.GetName]\n-[565.GetName]\n-[566.GetName]§!"
 JAP_far_east_received:0 "Far Eastern Resources Carried Overland"
 JAP_operation_ichigo:0 "Operation Ichigo"
 JAP_operation_ichigo_desc:0 "The operations section is drawing up a great offensive to cut through the continent from north to south. The Chief of the General Staff wants its aim limited to destroying the enemy's air bases, but the section chief insists on opening a land route to the south. Either way, the army will send across the continent a force larger than any it has moved since its founding."
 JAP_operation_u_go:0 "Operation U Go"
 JAP_operation_u_go_desc:0 "The commander of the 15th Army in Burma is pressing hard for an offensive across the border into India. Many object that it cannot be supplied, yet both the area army and the general army back it. Its outcome will hang on whether ammunition and food can be carried over the mountains to the front."
 JAP_second_trunk_railway:0 "Lay the Second Trunk Railway Group"
 JAP_second_trunk_railway_desc:0 "The Greater East Asia Railway plan also drew branch lines leaving the main line for India. Yet not a single line runs between Burma and India. Now that India is under our rule, lines can be run to Chittagong by two routes, tying India into the railway network of the continent."
 JAP_india_resources_overland:0 "Carry the Indian and Burmese Resources Overland"
 JAP_india_resources_overland_desc:0 "The resources of Burma and eastern India could until now only reach the homeland by sea. Yet that route runs long, from the Bay of Bengal to the South China Sea. Joining the Second Trunk Railway Group to the trunk line across the continent, we will send these resources home overland as well. The ships they took up will no longer be tied to that long route."
 JAP_india_resources_tt:0 "As long as no enemy is controlling\n§Y-[608.GetName]\n-[607.GetName]\n-[620.GetName]\n-[602.GetName]\n-[599.GetName]\n-[932.GetName]\n-[594.GetName]\n-[671.GetName]\n-[289.GetName]\n-[288.GetName]\n-[430.GetName]§!\nall resources of the following states under our control are moved to §Y[282.GetName]§!:\n§Y-[288.GetName]\n-[640.GetName]\n-[1007.GetName]\n-[430.GetName]\n-[431.GetName]\n-[432.GetName]\n-[434.GetName]\n-[959.GetName]§!"
 JAP_india_received:0 "Indian and Burmese Resources Carried Overland"
 JAP_first_and_second_general_armies:0 "First and Second General Armies"
 JAP_first_and_second_general_armies_desc:0 ""
 JAP_inspectorate_general_of_military_training:0 "Inspectorate General of Military Training"
 JAP_inspectorate_general_of_military_training_desc:0 ""
 JAP_army_ordnance_administration_headquarters:0 "Army Ordnance Administration Headquarters"
 JAP_army_ordnance_administration_headquarters_desc:0 ""
 JAP_nakano_school:0 "Nakano School"
 JAP_nakano_school_desc:0 "Intelligence and subversion can no longer be left to a handful of special agencies. The army will open a school for experts in secret warfare and send out officers who shed their uniforms to blend in with ordinary people. Their work will not stop at the enemy's capitals: winning over the peoples of Asia and turning their strength to our side will be the true battlefield of this new kind of war."
 JAP_nakano_school_spirit:0 "Nakano School"
 JAP_nakano_school_spirit_desc:0 "Officers trained at Nakano are spread across Asia in the guise of trading-company men and journalists. At home a counter-intelligence net is in place, and abroad their work alongside local independence movements is under way."
 JAP_volunteer_fighting_corps:0 "Volunteer Fighting Corps"
 JAP_volunteer_fighting_corps_desc:0 ""
 JAP_inspectorate_general_of_army_aviation:0 "Inspectorate General of Army Aviation"
 JAP_inspectorate_general_of_army_aviation_desc:0 "Specialist aviation training has so far been handled by the Army Aviation Headquarters alongside its administrative duties. Yet the missions of the air arm grow more complex and specialised every year, and the present arrangement cannot sustain its expansion. The Inspectorate General of Military Training strongly opposes a separate inspectorate as a threat to the army's three-chief system, and creating one will stir up a new rivalry within the army."
 JAP_air_armament_expansion_plan:0 "Air Armament Expansion Plan"
 JAP_air_armament_expansion_plan_desc:0 "The new armament expansion plan puts the build-up of air power first, and 'Aviation First' has become a slogan at army headquarters. Yet the air arm, the youngest branch of the army, has no central institution of its own, and behind the scenes some mockingly whisper 'Ground Absolute'. Unless orders and funds are concentrated on Nakajima and Kawasaki, the makers of the army's aircraft, 'Aviation First' will remain nothing but a slogan."
 JAP_light_fighter_dogfight_doctrine:0 "Light Fighter Dogfight Doctrine"
 JAP_light_fighter_dogfight_doctrine_desc:0 "The newly adopted Type 97 Fighter excels in turning performance and overwhelms its opponents in horizontal dogfights. The belief that a fighter's worth lies in its manoeuvrability runs deep in the army air arm, and its successor is required to be at least as manoeuvrable as the Type 97. New fighters with retractable undercarriage keep appearing in Europe, but our confidence that pilot skill and agility can close the gap remains unshaken."
 JAP_homeland_air_defence_priority:0 "Homeland Air Defence Priority"
 JAP_homeland_air_defence_priority_desc:0 "The more fighters we send to the front, the thinner our air cover over the homeland becomes, and only a handful of units are dedicated to defending the capital. Before the day comes when enemy carriers or bases on the continent launch air raids on our cities, our limited aircraft and pilots must be turned to defence, with new air defence units built around a fast, high-climbing interceptor and anti-aircraft batteries ringing our largest cities."
 JAP_heavy_bomber_expansion:0 "Heavy Bomber Expansion"
 JAP_heavy_bomber_expansion_desc:0 "The army air arm exists for more than guarding the skies above our ground troops. Even at the cost of homeland air defence, we will expand the heavy bomber units that can strike deep behind enemy lines. Once new heavy bombers to succeed the Type 97 are in service, the enemy's supply lines and industrial areas will come within reach of our bombs."
 JAP_army_air_arsenal_expansion:0 "Army Air Arsenal Expansion"
 JAP_army_air_arsenal_expansion_desc:0 "Until now the army has relied on private factories for most of its aircraft. To avoid falling behind the navy, which has production facilities of its own, the airframe and engine works scattered around Nagoya will be brought together at Tachikawa as the army's only air arsenal. Handling everything from design to production itself, the army will be able to bring out new aircraft without depending on private firms."
 JAP_youth_pilot_training:0 "Youth Pilot Training"
 JAP_youth_pilot_training_desc:0 "Pilot training has not kept pace with the expansion of our air power. We will greatly increase the intake of Youth Pilots, teenage volunteers selected for instruction at the army's aviation schools, to train non-commissioned pilots for the front. It will still be some years before they take their place there as fully fledged pilots."
