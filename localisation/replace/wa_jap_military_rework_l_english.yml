 # Added in plan C.
 JAP_border_fortifications:0 "Border Fortifications"
 JAP_border_fortifications_desc:0 "Since 1934 the Kwantung Army has been building fortresses along the Soviet border. The fortress at Hutou holds the only heights on the border that overlook the Trans-Siberian Railway on the far bank. We will expand the border fortresses to stop any Soviet invasion and to serve as bases for cutting the Trans-Siberian Railway in time of war."
 JAP_defensive_posture_against_the_soviets:0 "Prepare Operations Against the Soviets"
 JAP_defensive_posture_against_the_soviets_desc:0 "The Kantokuen mobilisation gathered men and materiel in northern Manchuria, but still not in the amounts a war with the Soviet Union would demand. We will build airfields along the border, strengthen the railways leading to it and set up supply hubs, readying the ground from which to strike into Soviet territory."
 JAP_first_air_fleet_naval_aviation_mastery_tt:0 "£doctrine_mod  Naval Aviation Doctrine Mastery Gain: §G+7%§!"
 JAP_eleventh_air_fleet:0 "11th Air Fleet"
 JAP_eleventh_air_fleet_desc:0 "The land-based air groups are placed under a single command, making large-scale operations over the sea by land attack aircraft possible."
 JAP_eleventh_air_fleet_bomber_mastery_tt:0 "£doctrine_mod  Bomber Doctrine Mastery Gain: §G+7%§!"
 JAP_staff_to_field_toseiha_tt:0 "§YToseiha§! generals: Add Planning Skill: §G+1§!"
 JAP_toseiha_officer:0 "Toseiha"
 JAP_toseiha_officer_desc:0 "§LAligned with the Toseiha, the army's Control Faction.§!"
 JAP_toseiha_officer_ascendant:0 "Toseiha"
 JAP_toseiha_officer_ascendant_desc:0 "§LAligned with the Toseiha, the army's Control Faction.§!"
 recruiting_reserves_10:0 "Will add an addition §G10§! §YReserve Infantry Divisions§! available for deployment when at war\nReserves deploy with §Y10% equipment§!\nReserves are equipped with the oldest equipment designs"
 JAP_reorganize_design_cost_tt:0 "§YALL Foot Infantry Units§! unit design cost §G-100%§!\n§YALL Artillery/Assault Units§! unit design cost §G-100%§!\n§YLight Cavalry§! and §YCavalry§! unit design cost §G-100%§!\n§OIncludes Tank Variants§!"
 JAP_inspectorate_infantry_mastery:0 "Infantry Doctrine Mastery"
 JAP_inspectorate_infantry_mastery_tt:0 "£doctrine_mod  Infantry Doctrine Mastery Gain: §G+10%§!"
 JAP_anti_air_design_cost_tt:0 "§YALL Anti Air Units§! unit design cost §G-100%§!\n§OIncludes Tank Variants§!"
 JAP_anti_tank_design_cost_tt:0 "§YALL Anti Tank Units§! unit design cost §G-100%§!\n§OIncludes Tank Variants§!"
 JAP_kato_hayabusa_tt:0 "The §Y64th Sentai 'Kato Hayabusa'§! becomes active in Kanto, led by the ace §YKato Tateo§!."
 JAP_army_aircraft_industry_drive:0 "Air Armament Expansion Plan"
 JAP_army_aircraft_industry_drive_desc:0 "Orders and funds under the Air Armament Expansion Plan are being channelled first to Nakajima and Kawasaki, the makers of the army's aircraft. As long as victories keep coming on the continent, this priority will continue to be extended."
 JAP_army_aircraft_industry_drive_tt:0 "§YNakajima§! and §YKawasaki§! fund gain: §G+20%§!\nEach success in a Sino-Japanese War mission extends it by §G60 days§!"
 JAP_air_divisions:0 "Establish the Air Divisions"
 JAP_air_divisions_desc:0 "As the front widens, a higher command that can direct air regiments and air brigades together has become indispensable. The air groups, until now ranked only as the equivalent of divisions, will be reorganised and upgraded into air divisions, establishing a unified command over air operations in each theatre. Leading the way will be Kato Tateo's 64th Sentai, flying the Hayabusa."
