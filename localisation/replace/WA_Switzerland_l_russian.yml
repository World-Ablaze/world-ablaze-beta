l_russian:
  
 SWI_national_redoubt: "Национальный редут"
 SWI_national_redoubt_desc: "Мы должны использовать наши горы в своих интересах, чтобы сделать цену вторжения слишком высокой для потенциальных врагов."
 
 
 SWI_dr_max_leo_keller: "Доктор Макс Лео Келлер"

 
 SWI_build_northern_forts: "Северные укрепления"
 SWI_build_northern_forts_desc: "Наша северная территория является домом для большей части нашего населения. Хотя мы можем продержаться в горах, наше долгосрочное выживание будет зависеть от того, сколько времени понадобится врагу, чтобы захватить нашу сердцевину."
  
 SWI_build_eastern_forts: "Восточные укрепления"
 SWI_build_eastern_forts_desc: "Наша восточная граница почти полностью обнажена. Хотя сохранение небольшой линии фронта на случай войны может быть и преимуществом, мы не можем позволить, чтобы ни дюйм территории остался без боя!"
  
 SWI_build_western_forts: "Западные укрепления"
 SWI_build_western_forts_desc: "Западные леса остаются незащищенными. Хотя мы можем дольше продержаться в горах, мы можем, по крайней мере, дать врагу кровь из носа, прежде чем он доберется до него."
  
 SWI_build_southern_forts: "Южные укрепления"
 SWI_build_southern_forts_desc: "Наших и без того значительных укреплений в нашем Редуте может оказаться недостаточно, если посмотреть на современное вооружение. Мы должны приложить усилия, чтобы сделать их сильнее."
  
 SWI_build_anti_air: "Противовоздушные огневые точки"
 SWI_build_anti_air_desc: "учитывая нашу укрепленную позицию в Европе, любой враг будет стремиться разбомбить нас. Разместив в горах укрепленные зенитные орудия, мы сможем дать отпор."
  
  
 SWI_railways: "Железнодорожные пути"
 SWI_railways_desc: ""
  
 SWI_militas: "Войска ополчения"
 SWI_militas_desc: ""
 
 
 swiss.1.t: "Долой нейтралитет"
 swiss.1.d: "Мы отказались от нашей многолетней политики нейтралитета. Нашему народу теперь придется адаптироваться к новой внешней политике."
 swiss.1.a: "Война выгодна агрессору!"