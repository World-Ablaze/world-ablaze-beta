 JAP_fourth_circle_plan_desc: "Хотя наши крупные корабли могут внушать благоговение, мы не должны забывать о важности малых кораблей в ведении войны в таком огромном океане. Развитие вспомогательного флота за счет новых фрегатов и легких авианосцев позволит сопровождать наши конвои, прикрывать наши флоты и вступать в бой с другими малыми флотами, не подвергая риску наши драгоценные крупные корабли."
  
 JAP_mine_warfare: "Минная война"
 JAP_mine_warfare_desc: "Недостаток промышленной продукции мы должны восполнить хитростью. Используя мины как ключевую часть нашей войны, мы можем вынудить вражеские флоты занять невыгодные позиции, в то время как угроза мины под килем остается."
  
 JAP_island_bulwarks: "Островные бастионы"
 JAP_island_bulwarks_desc: "Наши острова представляют собой естественную буферную зону между нашими родными островами и любой потенциальной угрозой. Необходимо провести обширную работу, чтобы не допустить их попадания в руки врага."
 JAP_island_bulwarks_tt: "§GДобавляет решения по дальнейшему улучшению этих островов.\n§!"
  
 JAP_kantai_kessen: "Кантай Кессен"
 JAP_kantai_kessen_desc: "Мы никогда не сможем напрямую конкурировать с ВМС США в затяжном конфликте. Поэтому необходимо приложить все усилия, чтобы разгромить ВМС США в одном решающем сражении сразу после начала боевых действий, уничтожив их боевые возможности и обеспечив победу до того, как их промышленность начнет спускать корабли на воду."
  
 JAP_super_submarines: "Супер подводные лодки"
 JAP_super_submarines_desc: "Скрытые под водой, эти подводные лодки смогут сеять хаос в тылу противника во время боевых действий флота."
  
  
 JAP_modernize_the_snlf: "Модернизировать SNLF"
 JAP_modernize_the_snlf_desc: "Подготовке и оснащению частей SNLF (Специальных морских десантных сил) уделялось недостаточно внимания. Внедрение бронетехники — такой как «Ка-Ми», первый специализированный плавающий танк, — а также организация более эффективной подготовки позволят нам подготовиться к войне на Тихом океане."
  
 JAP_conscript_workers_and_intellects: "Призыв рабочих и интеллигенции"
 JAP_conscript_workers_and_intellects_desc: "Нехватка живой силы задушила расширение и операции нашей армии. Мы должны предпринять шаги для улучшения ситуации, даже если это потребует призыва работников критически важных отраслей военного времени и нашего интеллектуального класса."
  
 JAP_amend_the_conscription_laws: "Изменить законы о воинской повинности"
 JAP_amend_the_conscription_laws_desc: "Мы не можем позволить себе жертвовать промышленной базой ради пополнения армии, но мы также не можем позволить потребностям промышленности уничтожить нашу армию в полевых условиях. Улучшение организации нашей мобилизации — это довольно незначительное, хотя и удовлетворительное изменение."
  
 JAP_grant_draft_exemptions: "Предоставить освобождение от призыва"
 JAP_grant_draft_exemptions_desc: "Несмотря на то, что армия жалуется на нехватку живой силы, реальная опасность заключается в нехватке рабочих рук здесь, дома, с которой сталкивается судостроительная промышленность ВМФ. Мы должны убедиться, что ВМФ получит необходимую помощь."
  
 JAP_prioritize_army_air_production: "Приоритизация производства армейской авиации"
 JAP_prioritize_army_air_production_desc: "Воздушная служба армии нуждается в самолетах. Мы должны направить основные ресурсы авиационного производства нашей страны в эти отрасли, чтобы удовлетворить их потребности и обеспечить марш наших армий под прикрытием дружественных самолетов. Независимо от нашего выбора, и армия, и флот требуют выделения ресурсов на свои самолеты, у вас будет §R4 года§! на выполнение задания."
  
 JAP_increase_the_air_budget: "Увеличить бюджет авиации"
 JAP_increase_the_air_budget_desc: "Воздушная мощь важна на суше и на море, почему мы должны ограничиваться расширением только одного рода войск? Хотя это обходится дороже, мы не можем допустить, чтобы один род войск атрофировался, в то время как другой получает приоритет. Независимо от нашего выбора, и армия, и флот требуют выделения ресурсов на свои самолеты, у вас будет §R4 года§! на выполнение задания."
  
 JAP_prioritize_navy_air_production: "Приоритизация производства авиации ВМФ"
 JAP_prioritize_navy_air_production_desc: "Военно-морская авиационная служба нуждается в самолетах. Мы должны направить основные ресурсы авиационной промышленности нашей страны в эти секторы, чтобы удовлетворить их спрос и обеспечить безопасность наших флотов под прикрытием дружественных самолетов. Независимо от нашего выбора, и армия, и флот требуют выделения ресурсов на свои самолеты, у вас будет §R4 года§! на выполнение задания."
  
 JAP_expand_the_factories: "Расширить заводы"
 JAP_expand_the_factories_desc: "Армия нуждается в ресурсах, и как бы ни протестовал флот, её потребности гораздо более насущны, чем потребности ВМФ. Быстрое расширение заводов по производству боеприпасов и артиллерийского вооружения своевременно удовлетворит её потребности, хотя это, вероятно, несколько обидит ВМФ, поскольку он нуждается в тех же ресурсах."
  
 JAP_increase_steel_production: "Увеличение производства стали"
 JAP_increase_steel_production_desc: ""
  
 JAP_expand_the_dockyards: "Расширить верфи"
 JAP_expand_the_dockyards_desc: "Флоту нужны ресурсы, и как бы ни протестовала армия, его потребности гораздо более насущны, чем потребности армии. Быстрое расширение верфей своевременно удовлетворит его потребности, хотя это, вероятно, несколько обидит армию, поскольку она нуждается в тех же ресурсах."

 JAP_government_liaison_council: "Координационный совет правительства"
 JAP_government_liaison_council_desc: "Объединив высшее руководство нашего правительства и вооруженных сил в единый совет, мы сможем эффективно разрешать споры между родами войск и вести планирование, ограничивая при этом хроническое недоверие и манипуляции, от которых страдала Координационная конференция."
 
 
 JAP_joint_staff_council: "Координационный совет Императорской ставки и правительства"
 JAP_joint_staff_council_desc: "Организовав высшие уровни нашего правительства и вооруженных сил в единый совет, мы сможем эффективно разрешать споры между ветвями власти и планами, одновременно ограничивая хроническое недоверие и манипуляции, от которых страдает Конференция по связи."
  
 JAP_recruit_takeo_yoshikawa: "Нанять Такео Ёсикаву"
 JAP_recruit_takeo_yoshikawa_desc: "Под вымышленным именем Тадаси Моримура и в качестве дипломатического вице-консула Ёсикава сможет сообщать о передвижениях США по Тихоокеанскому региону со своего поста на Гавайях."
  
 JAP_new_bomber_projections: "Новые проекты бомбардировщиков"
 JAP_new_bomber_projections_desc: "Наши нынешние бомбардировщики показали свою неэффективность против тяжелобронированных морских и наземных целей. Требуются новые бомбардировщики, способные нести более тяжелые боеприпасы."
  
 JAP_imperial_japanese_army_air_service: "Воздушная служба Императорской армии Японии"
 JAP_imperial_japanese_army_air_service_desc: "Воздушной службе армии долгое время пренебрегали, поскольку в войне на континенте нет противника, обладающего значительной авиацией. К сожалению, ситуация меняется к худшему, и мы должны быстро внедрять новые технологии, чтобы наши ВВС оставались конкурентоспособными."
  
 JAP_ground_pounders: "Штурмовики"
 JAP_ground_pounders_desc: "Непосредственная авиационная поддержка оказалась одним из самых эффективных способов применения авиации в наших войнах. Совершенствуя наши методы применения большого количества боеприпасов в определенных местах на поле боя для поддержки нашей армии, мы сможем сокрушить любого противника."
  
 JAP_establish_the_teishin_shudan: "Учредить Тэйсин Сюдан"
 JAP_establish_the_teishin_shudan_desc: "Императорская армия Японии должна иметь свои собственные силы специального назначения, отличные от парашютно-десантных подразделений морской пехоты IJN. Они будут использоваться для проведения смелых операций, высаживаясь глубоко в тылу врага и прокладывая путь нашим силам вторжения."
 JAP_establish_the_teishin_shudan_tt: "Будет получен шаблон §YДивизия ВДВ§!\n"
  
 JAP_imperial_japanese_navy_air_service: "Воздушная служба Японского Императорского флота"
 JAP_imperial_japanese_navy_air_service_desc: "Воздушной службе ВМФ долгое время пренебрегали, поскольку война на континенте имеет приоритет. Нельзя допустить, чтобы это продолжалось. Поскольку напряженность в Тихом океане растет, мы должны убедиться, что у ВМФ есть лучшие самолеты, которые могут спроектировать наши инженеры."
  
 JAP_air_acrobatics: "Воздушная акробатика"
 JAP_air_acrobatics_desc: "Наша авиационная служба ВМФ позволяет нам наносить удары за тысячу километров от наших баз. Этот уровень дальности является требованием нашей доктрины, но требует, чтобы у наших самолетов не было брони и защиты. Мы должны приложить все усилия, чтобы подготовить пилотов к этой печальной реальности, используя чрезвычайную маневренность наших самолетов, которую дает нам эта доктрина."
  
 JAP_imperial_naval_academy: "Императорская военно-морская академия"
 JAP_imperial_naval_academy_desc: "Военно-морская академия должна быть расширена, чтобы обеспечить возможность подготовки дополнительных моряков и военно-морских авиаторов для расширения нашего военно-морского флота и возмещения потерь, понесенных на море, если мы хотим одержать победу в Тихоокеанском конфликте."
  
 JAP_imperial_flight_school: "Имперская летная школа"
 JAP_imperial_flight_school_desc: "Наши пилоты несут тяжелые потери в боях, и новые пилоты часто гибнут, не набравшись опыта. Мы должны внести необходимые изменения, чтобы улучшить как выживаемость наших пилотов, так и качество получаемого ими образования."
 
 JAP_special_higher_police: "Специальная высшая полиция"
 JAP_special_higher_police_desc: "Связь районных ассоциаций с Высшей специальной полицией и создание сети информаторов позволит нам выявлять диссидентов и шпионов."

 JAP_neighborhood_associations: "Соседские объединения"
 JAP_neighborhood_associations_desc: ""

 JAP_womens_volunteer_labor_ordinance: "Указ о добровольном труде женщин"
 JAP_womens_volunteer_labor_ordinance_desc: ""

 JAP_student_labor_ordinance: "Указ о студенческом труде"
 JAP_student_labor_ordinance_desc: ""

 JAP_national_labor_mobilization_order: "Приказ о национальной мобилизации труда"
 JAP_national_labor_mobilization_order_desc: "С помощью Имперского декрета Nº 94 мы добьемся всеобщей занятости, технические колледжи и университеты будут закрыты, а больные мобилизованы."

 JAP_force_urbanites_into_farms: "Заставить городских жителей заниматься фермерством"
 JAP_force_urbanites_into_farms_desc: ""

 JAP_emergecy_measure_for_aircraft_production: "Чрезвычайные меры по производству самолетов"
 JAP_emergecy_measure_for_aircraft_production_desc: ""

 JAP_east_asia_development_board: "Совет по вопросам развития Восточной Азии"
 JAP_east_asia_development_board_desc: "СВР-ВА, также известный как Совет по вопросам развития Восточной Азии, будет гражданским агентством, цель которого - развитие оккупированных регионов Китая."

 JAP_appoint_yanagawa_heisuke: "Назначить Янагаву Хэйсукэ"
 JAP_appoint_yanagawa_heisuke_desc: "Если позволить Императорской японской армии взять под контроль Совет по развитию Восточной Азии, а затем устранить гражданское влияние, это позволит нам осуществлять больший контроль над оккупированным Китаем."

 JAP_ministry_of_greater_east_asia_desc: "Слияние Совета по развитию Восточной Азии с Министерством Великой Восточной Азии, которое было создано Хидэки Тодзио, позволит единому правительственному агентству осуществлять административный контроль над всеми оккупированными территориями."

 JAP_leverage_korean_workforce: "Использование корейской рабочей силы"
 JAP_leverage_korean_workforce_desc: ""

 JAP_leverage_indonesian_workforce: "Использование индонезийской рабочей силы"
 JAP_leverage_indonesian_workforce_desc: ""

 JAP_leverage_chinese_workforce: "Использование китайской рабочей силы"
 JAP_leverage_chinese_workforce_desc: ""

 JAP_leverage_indian_workforce: "Использование индийской рабочей силы"
 JAP_leverage_indian_workforce_desc: ""

 JAP_leverage_manchurian_workforce: "Использование маньчжурской рабочей силы"
 JAP_leverage_manchurian_workforce_desc: ""

 JAP_korean_volunteer_soldiers: "Корейские солдаты-добровольцы"
 JAP_korean_volunteer_soldiers_desc: ""

 JAP_nationalize_idemitsu_kosan_tt: "Национализирует компанию §RIdemitsu Kosan§!, делая ее недоступной для выбора."

 JAP_devalue_the_yen: "Девальвировать иену"
 JAP_devalue_the_yen_desc: "Годы войны оказали сильное давление на нашу экономику, и девальвация иены — непопулярная, но необходимая мера."

 JAP_subsidize_fujinagata: "Субсидировать верфи Фудзинагата"
 JAP_subsidize_fujinagata_desc: "Верфи Фудзинагата, расположенные недалеко от Осаки, обеспечивают значительную часть нашего судостроения средних и малых военных кораблей. В настоящее время они неорганизованны и нерентабельны, но если их должным образом субсидировать и передать под контроль Kantaiha и Zaibatsu, мы сможем увеличить наши судостроительные мощности в будущем."

 JAP_subsidize_kokura: "Приватизация фабрик Кокуры"
 JAP_subsidize_kokura_desc: "В Кокуре долгое время находилось несколько крупных оружейных заводов. Приватизировав эти заводы, в большинстве своем заброшенные из-за недостатка финансирования, Дзайбацу сможет переоборудовать их и начать производство материалов военного времени."


 JAP_sponsor_opium_trade: "Спонсировать торговлю китайским опиумом"
 JAP_sponsor_opium_trade_desc: ""

 JAP_integrate_hawaii: "Интеграция Гавайев"
 JAP_integrate_hawaii_desc: ""

 JAP_empire_of_the_rising_sun: "Империя восходящего солнца"
 JAP_empire_of_the_rising_sun_desc: ""

 JAP_the_oceanian_project: "Проект «Океания»"
 JAP_the_oceanian_project_desc: ""

 JAP_the_american_project: "Американский проект"
 JAP_the_american_project_desc: ""

 JAP_the_indian_project: "Индийский проект"
 JAP_the_indian_project_desc: ""

 JAP_guerilla_operations: "Начать партизанские операции"
 JAP_guerilla_operations_desc: "Каждый гражданин Японии должен противостоять захватчикам, единственный способ добиться условной капитуляции - нанести захватчикам массовые потери."

 JAP_relocate_capital: "Императорская штаб-квартира Мацусиро"
 JAP_relocate_capital_desc: "Перемещение правительства в подземный штаб Мацусиро, построенный при Тодзио, позволит нам продолжать борьбу."

 JAP_prevent_surrender: "Предотвратить капитуляцию"
 JAP_prevent_surrender_desc: "Наши враги вторглись на Домашние острова, император и нынешний кабинет министров решили, что война стала невозможной, армия должна взять под контроль Токио, чтобы предотвратить капитуляцию и продолжить войну."

 JAP_appoint_kuniaki_koiso: "Назначить Койсо"
 JAP_appoint_kuniaki_koiso_desc: "Недавние неудачи Тодзио лишили его доверия императора, его заменит Куниаки Койсо."

 JAP_build_suzuka_naval_arsenal: "Строительство военно-морского арсенала в Судзуке"
 JAP_build_suzuka_naval_arsenal_desc: "Компании Mitsubishi требуются дополнительные мощности для производства новых палубных истребителей для Императорского флота Японии."

 JAP_expand_toyokawa_naval_arsenal: "Расширение военно-морского арсенала Тоёкава"
 JAP_expand_toyokawa_naval_arsenal_desc: "Военно-морской арсенал Тойокава отвечает за производство оборудования для Императорского флота Японии, а его расширение превратит его в один из крупнейших арсеналов в Японии."

 JAP_ministry_of_munitions: "Создать Министерство боеприпасов"
 JAP_ministry_of_munitions_desc: "Мы видели, чего добилось немецкое министерство вооружений и боеприпасов под руководством Альберта Шпеера: унификация управления производством боеприпасов позволит повысить эффективность и увеличить объемы производства."

 JAP_appoint_nobusuke_kishi: "Назначить Нобусукэ Киси"
 JAP_appoint_nobusuke_kishi_desc: "Назначение Нобусукэ Киси главой Министерства боеприпасов приведет к росту промышленного производства."

 JAP_safeguard_our_cities: "Защитить наши города"
 JAP_safeguard_our_cities_desc: "Япония уязвима для стратегических бомбардировок как с авиабаз на материковой части Азии, так и с островов Тихого океана. Если нам не удастся создать оборонительный периметр вокруг своих островов за пределами досягаемости обычных бомбардировщиков, мы должны подготовиться к защите от бомбардировок."


 JAP_second_tokyo_arsenal: "Второй Токийский арсенал"
 JAP_second_tokyo_arsenal_desc: "Главный Токийский арсенал был разрушен землетрясением в 1923 году, однако Второй Токийский арсенал до сих пор стоит на месте и может быть расширен."

 JAP_nagoya_arsenal: "Арсенал Нагоя"
 JAP_nagoya_arsenal_desc: "Арсенал в Нагое станет одним из основных поставщиков стрелкового оружия для Императорской армии Японии."

 JAP_subsidize_idemitsu_kosan: "Субсидировать Idemitsu Kosan"
 JAP_subsidize_idemitsu_kosan_desc: "Idemitsu Kosan - одна из крупнейших химических и нефтяных компаний в Японии. Финансируя их, мы можем гарантировать, что они смогут больше сосредоточиться на синтетических исследованиях."

 JAP_nationalize_idemitsu_kosan: "Национализация Idemitsu Kosan"
 JAP_nationalize_idemitsu_kosan_desc: "Idemitsu Kosan - одна из крупнейших химических и нефтяных компаний в Японии, которую мы должны национализировать, чтобы правильно использовать ее возможности для войны."

 JAP_noborito_research_institute: "Научно-исследовательский институт Ноборито"
 JAP_noborito_research_institute_desc: "Исследовательская лаборатория "Номер девять" станет подразделением Научного института Императорской армии Японии, который располагался в разрушенном Токийском арсенале, и будет заниматься исследованиями в области электроники и разведки."
 
 JAP_preparations_to_secure_the_islands: "Подготовка к обеспечению безопасности островов"
 JAP_preparations_to_secure_the_islands_desc: "Богатые ресурсами острова Голландской Ост-Индии являются главной целью нашей войны в южной части Тихого океана. Американцы и их марионетки на Филиппинах мешают нам достичь наших целей. Наши солдаты должны быть обучены захвату и удержанию этих регионов."
  
 JAP_german_technological_exchange: "Немецкий технологический обмен"
 JAP_german_technological_exchange_desc: "Наши отношения с фашистскими державами в Европе могут быть использованы для адаптации и улучшения наших технологий в тех областях, в которых нам не хватает отечественных инноваций, особенно в случае с нашей бронетехникой."
  
 JAP_industrialize_the_north: "Индустриализация Севера"
 JAP_industrialize_the_north_desc: "Северные регионы Кореи представляют хорошие условия для индустриализации. Мы можем использовать это пространство для строительства заводов, которые мы не смогли бы разместить на наших Родных островах."
  
 JAP_industrialize_the_south: "Индустриализация Юга"
 JAP_industrialize_the_south_desc: "Южная оконечность Корейского полуострова станет местом реализации проектов гражданской промышленности, для которых мы не можем найти места на Родных островах."
  
 JAP_chahar_railways: "Чахарские железные дороги"
 JAP_chahar_railways_desc: "В северных регионах Монголии и Китая отсутствует какая-либо значимая инфраструктура. Если мы планируем вторжение в эти регионы, наши линии снабжения должны быть улучшены."
  
 JAP_build_up_menjiang: "Строительство Мэнцзяна"
 JAP_build_up_menjiang_desc: "Мы могли бы снабжать монгольскую армию, отправляя ей наше оружие, но помочь им сделать собственное оружие гораздо проще."
  
 JAP_modernize_the_mongolian_army: "Модернизация монгольской армии"
 JAP_modernize_the_mongolian_army_desc: "Как и в случае с маньчжурами, монголы должны выставить собственную армию. С нашей помощью они смогут обучить и вооружить собственную армию."
  
 JAP_mongol_military_investments: "Монгольские военные инвестиции"
 JAP_mongol_military_investments_desc: "Технологическое положение монголов удручающе отстает от нашего. Если от них ожидается, что они будут продуктивными членами Сферы совместного процветания, им потребуются дополнительные ресурсы на исследования и разработки."
  
 JAP_river_railway_system: "Сеть речных железных дорог"
 JAP_river_railway_system_desc: "Наши войска и припасы с трудом добираются туда, куда им нужно. Улучшение речных и железных дорог могло бы помочь решить эту проблему."
  
  
 JAP_CHI_heavy_industry_development: "Развитие военной промышленности"
 JAP_CHI_heavy_industry_development_desc: "Население Китая намного превышает население нашей страны. Строительство оружейных заводов в Китае позволило бы нам использовать огромный запас дешевой рабочей силы."
  
 JAP_CHI_civilian_industry_development: "Развитие гражданской промышленности"
 JAP_CHI_civilian_industry_development_desc: "Хотя Китай велик, ему не хватает промышленности. Нам следует приложить дополнительные усилия для их индустриализации, чтобы они могли служить вместе с нами в Сфере совместного процветания."
  
 JAP_restructure_the_chinese_army: "Реструктуризация китайской армии"
 JAP_restructure_the_chinese_army_desc: "В центре внимания китайской армии – количество, а не качество. Хотя это может быть и так, мы можем приложить некоторые усилия, чтобы убедиться, что их оборудование обновлено."
  
 JAP_first_air_fleet_desc: "Чтобы максимизировать ударную мощь, мы объединим в одну боевую группу крупнейшее соединение авианосцев, которое когда-либо видел мир. Когда мы разработаем доктрины, необходимые для проведения согласованных наступательных операций в такой форме, у наших врагов не будет никаких шансов против нашего превосходства в морской авиации."
  
 JAP_modernization_effort: "Усилия по модернизации"
 JAP_modernization_effort_desc: "Война продолжает Развиться, и нас нельзя застать врасплох. Более тяжелая броня и транспортные варианты дадут нам преимущество в бою с врагами Японии."
  
 JAP_kokura_arsenal: "Кокура Арсенал"
 JAP_kokura_arsenal_desc: "Арсенал Кокура — один из крупнейших оружейных заводов, расположенный в Японии. Их мощности будут расширены для вооружения наших солдат."
  
 JAP_advanced_weaponary: "Передовое вооружение"
 JAP_advanced_weaponary_desc: "Хотя предпочтительным оружием наших солдат являются арисака и штык, нам требуется современное оружие для борьбы с современными врагами. Более тяжелые артиллерийские и противотанковые платформы должны быть спроектированы с учетом этой задачи."
  
 JAP_the_imperial_japanese_air_force: "Императорские ВВС Японии"
 JAP_the_imperial_japanese_air_force_desc: "Конфликт между флотом и армией привел к созданию двух отдельных военно-воздушных сил со своей собственной тактикой и самолетами. Это мелкое соперничество должно быть сметено ради нашей империи, и будут сформированы новые единые и независимые военно-воздушные силы."
  
 JAP_project_z: "Проект Z"
 JAP_project_z_desc: "Американцы, безусловно, являются нашим главным противником на Тихом океане. Если мы хотим напрямую угрожать им, мы должны разработать тяжелые межконтинентальные бомбардировщики, способные достичь их родины!"
  
 JAP_synthetic_resource_studies: "Исследования синтетических ресурсов"
 JAP_synthetic_resource_studies_desc: "Хотя недостаток промышленности можно решить, просто построив больше заводов, мы не можем решить проблему нехватки природных ресурсов, просто создавая их. Или можем?"
  
 JAP_imperial_synthetic_programme: "Имперская синтетическая программа"
 JAP_imperial_synthetic_programme_desc: "Мы достигли того, что когда-то считалось невозможным. Каучук и нефть теперь можно производить из угля. Потребности Японии требуют от нас расширения их производства."
  
 JAP_hideo_iwakuros_order: "Приказ Хидео Ивакуро"
 JAP_hideo_iwakuros_order_desc: "Генерал Ивакуро поручил разработать тяжелые танки, превосходящие все, что мы когда-либо видели. Эти стальные звери повернут любую битву в нашу пользу."
  
 JAP_kijiro_nambus_works: "Работы Киджиро Намбу"
 JAP_kijiro_nambus_works_desc: "Киджрио Намбу — один из наших самых талантливых дизайнеров оружия. Его разработкам следует уделять повышенное внимание, чтобы их можно было производить и отправлять на передовую быстрее."
  
 JAP_integrate_takasago_volunteers: "Интеграция добровольцев Такасаго"
 JAP_integrate_takasago_volunteers_desc: "Наши верные подданные на Формозе больше приспособлены к тропическому климату, чем мы. Мы набрали ряд добровольцев, которые будут специально обучены для ведения боевых действий в суровых условиях южной части Тихого океана."
  
 JAP_integrate_joseon_volunteers: "Интеграция добровольцев Чосона"
 JAP_integrate_joseon_volunteers_desc: ""
  
