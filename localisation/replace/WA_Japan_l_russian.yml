 JAP_national_defense_state_desc: "Только полностью мобилизовав государственный аппарат, мы сможем победить наших врагов в Восточной Азии. Мы должны обратить на войну все имеющиеся отрасли промышленности и аналогичным образом использовать наши колониальные владения."
