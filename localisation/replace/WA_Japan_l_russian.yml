 JAP_operation_ketsugo: "Операция «Кэцу-Го»"
 JAP_operation_ketsugo_desc: "Защита Родных островов будет осуществляться до последнего жителя. Каждый гражданин – солдат. Будут приложены все усилия, чтобы изгнать захватчиков. Либо мы победим, либо будем стерты со страниц истории."
  
 JAP_the_divine_wind_desc: "Камикадзе, ветер, отбросивший монголов, вновь вдохновит наших авиаторов отбросить превосходящие силы наших врагов. Они отдадут свои жизни ради победы государства. Слава Императору."
  
 JAP_split_the_ija_academy: "Разделить академию Императорской армии"
 JAP_split_the_ija_academy_desc: "Разделение академии Императорской армии на школы старшего и младшего курса позволит гораздо более организованно обучать наших солдат, а также обеспечит надлежащее преподавание доктрины без вмешательства ветеранов, и наоборот."
  
 JAP_shinoda_research_section: "Расширить исследовательский отдел Синоды"
 JAP_shinoda_research_section_desc: "Расширение ресурсов, доступных исследовательскому отделу Синода, за счет недавно созданной исследовательской лаборатории номер девять, использующей заброшенный комплекс «Арсенал Койсикава», позволит нашему разведывательному отделу быстро расширить свои возможности."
  
 JAP_bicycle_battalions_tt: "Будет получен §YШаблон велосипедной дивизии§!.\n"
  
 JAP_ija_institute_of_science: "Научный институт Императорской армии"
 JAP_ija_institute_of_science_desc: "Расширение и реорганизация существующей армейской научно-исследовательской лаборатории по предотвращению эпидемий в Харбине, Маньчжоу-Го, в крупномасштабный исследовательский центр, способный проводить широкомасштабные исследования в области военных технологий, снабжаемый при этом большим количеством ресурсов из наших континентальных владений."
  
 JAP_promote_rising_officers: "Продвигать перспективных офицеров"
 JAP_promote_rising_officers_desc: "Многие наши офицеры ослаблены, опьянены победой и не принимают во внимание угрозу, с которой мы столкнулись, считая себя непобедимыми. Несколько младших офицеров доказали свою изобретательность и компетентность в бою, и хотя они не доказали свою способность командовать более крупными формированиями, им следует дать возможность доказать свою ценность, независимо от текущего статуса в звании."
  
 JAP_reorganize_the_military: "Реорганизовать армию"
 JAP_reorganize_the_military_desc: "Армию необходимо приструнить, и хотя наших полевых офицеров уже не исправить, мы можем провести реорганизацию, начиная с Академии и наших систем подготовки, чтобы должным образом прививать доктрины и навыки нашим новым офицерам и солдатам."
  
 JAP_persue_new_endevours: "Взяться за новые начинания"
 JAP_persue_new_endevours_desc: "Нашей армии не хватает значительной тяжелой техники. В наших войсках практически повсеместно отсутствует бронетехника, противотанковое вооружение и зенитное вооружение. Мы должны попытаться исправить эти упущения, прежде чем пытаться конкурировать в прямых военных действиях против Запада."
  
 JAP_technological_dominance: "Технологическое доминирование"
 JAP_technological_dominance_desc: "Хотя наши силы мотивированы и боеспособны, поддержание технологического превосходства над нашими противниками позволит нашим силам не только выжить, но и преуспеть в бою. Необходимо приложить все усилия для того, чтобы японская техника была не просто лучшей, а самой лучшей."
  
 JAP_chiba_institute_of_technology: "Технологический институт Коа"
 JAP_chiba_institute_of_technology_desc: "Недавно основанный Технологический институт Коа должен привести народы Азии к пробуждению. При частном финансировании принца Нарухико и многих других лидеров и политиков Дзайбацу институт будет обучать следующее поколение японских инженеров."
  
 JAP_new_armoured_divisions: "Новые бронетанковые дивизии"
 JAP_new_armoured_divisions_desc: "Реформирование 1-й танковой бригады в 1-ю танковую дивизию позволит нам быстро подготовить наши в настоящее время недостаточно развитые бронетанковые войска к созданию типовой системы организации танковых дивизий. Армия потребует от вас сформировать новые танковые дивизии в течение §R2 лет§!"
 JAP_new_armoured_divisions_tt: ""
  
 JAP_japanese_blitz_doctrine: "Японская блиц-доктрина"
 JAP_japanese_blitz_doctrine_desc: "Извлекая уроки из примеров Германии в Европе, мы увидели полезность бронетанковой войны в нашу нынешнюю эпоху. Мы должны приложить все усилия, чтобы адаптировать и внедрить этот новый метод ведения войны в нашу армию."
  
 JAP_third_circle_plan: "План "Третий круг""
 JAP_third_circle_plan_desc: "Мы должны начать Третью программу дополнения военно-морских вооружений сейчас, когда мы освободились от бремени военно-морского договора, и начать закладку дополнительных крупных кораблей, чтобы гарантировать безраздельное господство нашего военно-морского флота в Тихом океане. Флот потребует от вас выполнить эти планы в течение §R5 лет§!."
  
