 zuiho_ship_conversion: "Переоборудование легких авианосцев класса «Дзуйхо»"
 zuiho_ship_conversion_desc: "Класс «Дзуйхо» — это проект переоборудования в средний эскортный авианосец. Практически идентичные авианосцам класса «Титосэ», они изначально проектировались как плавучие базы подводных лодок с возможностью последующего переоборудования. «Дзуйхо» и «Сёхо» были переоборудованы до войны, после аннулирования морских договоров."
 
 chitose_ship_conversion: "Переоборудование легких авианосцев класса «Титосэ»"
 chitose_ship_conversion_desc: "Класс «Титосэ» — это проект переоборудования в средний эскортный авианосец. Они изначально проектировались как плавучие базы гидросамолетов с возможностью последующего переоборудования. «Титосэ» и «Тиёда» были спешно переоборудованы после потери авианосцев в битве за Мидуэй."
 
 kaiyo_ship_conversion: "Переоборудование легкого авианосца класса «Каё»"
 kaiyo_ship_conversion_desc: "Класс «Каё» — это проект переоборудования в малый эскортный авианосец. Это было упрощенное переоборудование уже существующего океанского лайнера, что сделало его довольно крупным и прочным, но с гладкой полетной палубой. «Каё» был переоборудован после битвы за Мидуэй, когда возросла потребность в перевозке самолетов."
 
 pre_war_taiyo_ship_conversion: "Довоенное переоборудование легкого авианосца класса «Тайё»"
 pre_war_taiyo_ship_conversion_desc: "Класс «Тайё» — это проект переоборудования в средний эскортный авианосец. Это были упрощенные переоборудования существующих грузовых лайнеров, что сделало их крупными и прочными, но с гладкой полетной палубой и минимальным набором авианосных механизмов, таких как аэрофинишеры. «Тайё» был переоборудован до войны в ожидании роста потребностей в перевозке самолетов."
 
 taiyo_ship_conversion: "Переоборудование легких авианосцев класса «Тайё»"
 taiyo_ship_conversion_desc: "Класс «Тайё» — это проект переоборудования в средний эскортный авианосец. Это были упрощенные переоборудования существующих грузовых лайнеров, что сделало их крупными и прочными, но с гладкой полетной палубой и минимальным набором авианосных механизмов, таких как аэрофинишеры. «Унъё» и «Тюё» были переоборудованы вскоре после начала войны из-за резкого роста потребностей в перевозке самолетов."
 
 shinyo_ship_conversion: "Переоборудование легкого авианосца класса «Синъё»"
 shinyo_ship_conversion_desc: "Класс «Синъё» — это проект переоборудования в средний эскортный авианосец. Практически идентичный авианосцам класса «Тайё», он представлял собой упрощенное переоборудование существующего немецкого океанского лайнера «Шарнхорст», что сделало его крупным и прочным, но с применением мер экономии, таких как гладкая полетная палуба. «Синъё» был переоборудован после битвы за Мидуэй, когда возросла потребность в полноценных авианосцах."
 
 ryuho_ship_conversion: "Переоборудование легкого авианосца класса «Рюхо»"
 ryuho_ship_conversion_desc: "Класс «Рюхо» — это проект переоборудования в средний эскортный авианосец. Он изначально проектировался как плавучая база подводных лодок с возможностью последующего переоборудования. «Рюхо» стал наименее удачным проектом переоборудования легкого авианосца из-за низкого качества изначальной конструкции."

 
 JAP_pearl_harbor: "Возможность в Перл-Харборе"
 JAP_pearl_harbor_desc: "Нам представилась уникальная возможность: Тихоокеанский флот США удобно сосредоточен в Перл-Харборе. Если мы нанесем удар сейчас, внезапная атака, такая как §Yскоординированный удар§! по Перл-Харбору, может вывести из строя значительную часть огневой мощи их флота. Если мы будем ждать слишком долго, мы упустим наш единственный шанс. Мы должны объявить войну или атаковать Перл-Харбор в течение года, пока американцы не готовы."
 JAP_pearl_harbor_tt: "§RМы потеряем элемент внезапности, а вместе с ним и возможность быстрой войны!§!"

