 JAP_spiritual_mobilization_tt: "Становятся доступными §YВоенная экономика§! и §YВсеобщая мобилизация§!"
  
 JAP_militarize_our_heavy_industries: "Милитаризация нашей тяжелой промышленности"
 JAP_militarize_our_heavy_industries_desc: "Война на континенте неизбежна. Необходимо должным образом подготовить нашу экономику к длительной кампании экспансии и военных операций."
  
 JAP_osaka_arsenal: "Арсенал Осака"
 JAP_osaka_arsenal_desc: "Осакский арсенал, являющийся основным государственным производителем оружия с 1870 года, должен быть модернизирован и расширен, чтобы должным образом снабжать наши силы оружием, необходимым для крупной войны на Дальнем Востоке."
  
 JAP_kijiro_nambu_works: "Заводы Кидзиро Намбу"
 JAP_kijiro_nambu_works_desc: "Кидзиро Намбу представил армии крупнокалиберный пулемет Тип 92, значительно усовершенствованный по сравнению с Типом 3. Он начал производство на своем собственном заводе в Токио, и, расширив промышленные активы его компании, мы сможем быстро модернизировать снаряжение нашей армии."
  
  
 JAP_expand_the_nakajima_aircraft_company: "Расширить авиастроительную компанию Накадзима"
 JAP_expand_the_nakajima_aircraft_company_desc: "Проекты самолетов Накадзимы нашли значительную поддержку в армии, и у его компании уже есть несколько заводов на Хонсю. Получив официальную государственную санкцию на свою деятельность, он сможет быстро расширить свою компанию и начать активное производство самолетов."
  
 JAP_invest_in_toyota_car_manufacturing: "Инвестировать в производство автомобилей Toyota"
 JAP_invest_in_toyota_car_manufacturing_desc: "Toyota является крупнейшим производителем автомобилей в нашей Империи. Используя её технические возможности и требования нашей армии, а также запретив импорт автомобилей с зарубежных рынков, таких как Ford или GM, мы можем значительно расширить отечественное производство автомобилей."
  
 JAP_invest_in_the_zaibatsus: "Инвестировать в Дзайбацу"
 JAP_invest_in_the_zaibatsus_desc: "Дзайбацу, к лучшему или к худшему, доминируют в нашей экономике. Если мы хотим улучшить наше экономическое положение, а также заручиться поддержкой их лидеров, мы должны убедиться, что они получают выгодные контракты для отраслей, соответствующих нашим целям."
  
 JAP_enlarge_the_road_networks: "Расширение дорожной сети"
 JAP_enlarge_the_road_networks_desc: "Нашим родным островам не повезло с обилием доступной земли, поэтому мы должны приложить все усилия, чтобы полностью использовать доступную землю и быстро построить нашу промышленную базу."
  
 JAP_imperial_research_policy: "Имперская исследовательская политика"
 JAP_imperial_research_policy_desc: "Мы должны расширить наш исследовательский аппарат, чтобы не отставать от великих держав мира. Направляя дополнительные средства и переводя больше гражданских исследований под прямой контроль государства, мы останемся на переднем крае технологий."
  
 JAP_the_yen_bloc: "Блок йены"
 JAP_the_yen_bloc_desc: "Вынуждая принять нашу валюту на наших заморских территориях, мы можем как дальше интегрировать наши колониальные администрации в нашу экономику, так и использовать"
 JAP_the_yen_bloc_tt: "§Y1% Экономической усталости§! уменьшается за §Gкаждую марионетку§! и может быть применен к новым марионеткам, созданным после завершения этого фокуса\n\n"
 
 JAP_nationalize_kokura_factorys: "Расширить заводы Кокуры"
 JAP_nationalize_kokura_factorys_desc: "Кокура уже давно является местом расположения нескольких крупных заводов по производству вооружений. Расширяя и объединяя эти заводы, которые по большей части простаивают из-за отсутствия финансирования, мы можем быстро переоснастить их и начать производство военной техники."
  
 JAP_kobe_steel_plant: "Металлургический завод Кобе"
 JAP_kobe_steel_plant_desc: "Компания Mitsubishi обратилась к нашему правительству с просьбой о финансировании расширения своего сталелитейного завода в Кобе. Близость к верфям Фудзинагата, уже жаждущим стали, делает эту сделку чрезвычайно выгодной для нашего правительства."
  
 JAP_nationalize_fujinagata_shipyards_desc: "Верфи Fujinagata, расположенные недалеко от Осаки, обеспечивают значительную часть нашего судостроения средних и малых военных кораблей. Хотя в настоящее время они дезорганизованы и нерентабельны, в случае национализации мы сможем использовать их опыт и оборудование для быстрого увеличения наших судостроительных мощностей."
  
 JAP_hi_convoys: "Хай-Конвои"
 JAP_hi_convoys_desc: "Наша нация зависит от нашего контроля над морями. Поскольку нашим конвоям приходится преодолевать большие расстояния в Тихом океане на виду у врага, мы должны убедиться, что каждый корабль сам хорошо защищен и способен противостоять преследованиям со стороны наших врагов, чтобы предотвратить истощение нашей материально-технической базы."
  
 JAP_subsidize_the_okura: "Субсидировать Окуру"
 JAP_subsidize_the_okura_desc: "Компания Окурагуми Сёкай — одна из крупнейших компаний Дзайбацу. Их опыт в строительстве позволит нам реализовывать более крупные промышленные проекты."
 
 JAP_shimizu_aluminium_plant: "Алюминиевый завод Shimizu"
 JAP_shimizu_aluminium_plant_desc: "Наша авиационная промышленность оказалась в затруднительном положении из-за нехватки алюминия, производимого в наших колониях, а также из-за высоких тарифов и эмбарго, препятствующих его импорту. Компания Nippon Light Metal Company совместно с Furukawa Electric и Tokyo Dento обратилась к нам с предложением начать выплавку алюминия на ранее заброшенных предприятиях в Симидзу и Камбаре."
  
 JAP_army_expansion_law_desc: "Несмотря на то, что наша армия хорошо оснащена для действий на границе и ограниченных конфликтов, она катастрофически плохо оснащена для проведения крупных и продолжительных операций против решительного противника. Поскольку наши пограничные инциденты с Китаем и напряженность в отношениях с колониальными державами грозят перерасти в продолжительный конфликт, мы должны подготовить нашу армию к войне."
  
 JAP_new_furukawa_contracts: "Новые контракты Фурукавы"
 JAP_new_furukawa_contracts_desc: "Фурукава — крупнейшая горнодобывающая и сырьевая компания Дзайбацу в Японии. Направляя им контракты на увеличение добычи на Родных островах и наших колониальных территориях, мы можем повысить эффективность добычи, сохраняя при этом лояльность компании."
  
 JAP_expand_the_maizuru_naval_arsenal: "Расширить военно-морской арсенал Майдзуру"
 JAP_expand_the_maizuru_naval_arsenal_desc: "Майдзуру, спроектированный как военно-морская верфь для крупных кораблей, в значительной степени был вынужден выполнять неэффективное производство небольших заказов из-за ряда бюджетных проблем. Решив эти проблемы, мы можем значительно увеличить производство, хотя и за счет нашего военного производства в других местах."
  
 JAP_develop_the_naval_ports: "Развить военно-морские порты"
 JAP_develop_the_naval_ports_desc: "Мы чрезмерно полагаемся на очень небольшое количество портов для ремонта и поддержания нашего боевого флота. Расширяя количество портовых сооружений на других крупных базах, мы можем гарантировать наличие достаточных верфей и ремонтных мощностей для поддержки нашего флота во время крупных конфликтов."
  
 JAP_expand_the_airbases: "Расширить авиабазы"
 JAP_expand_the_airbases_desc: "Хотя наша стратегия строится на том, чтобы враг никогда не достиг наших родных островов, мы должны быть готовы к такому развитию событий. Увеличение числа авиабаз в Корее и на Родных островах также позволит нашим самолетам дальнего действия наносить удары через Тихий океан с безопасных баз, не беспокоясь об американском вторжении."
  
 JAP_the_manchurian_project_desc: "На наших островах мало пригодной для использования земли, но в материковых владениях её достаточно. То, что мы не можем построить сами, мы можем построить на материке. Мы начнем крупномасштабную программу индустриализации в [MAN.GetNameDef]."
  
 JAP_the_mengjiang_project: "Проект «Мэнцзян»"
 JAP_the_mengjiang_project_desc: "Государство Мэнцзян — это первый шаг в установлении нашей сферы влияния над Монголией. Мы начнем готовить их к войне."
  
 JAP_the_china_project: "Китайский проект"
 JAP_the_china_project_desc: "Мы начали входить в сердце Китая. Эту обширную сельскую местность будет чрезвычайно сложно умиротворить, и лучше всего будет полагаться на местных администраторов, пока не будет найдено новое решение."
  
 JAP_set_up_the_wang_jingwei_regieme: "Установить режим Ван Цзинвэя"
 JAP_set_up_the_wang_jingwei_regieme_desc: "Теперь, когда мы взяли под контроль большие районы китайского побережья, мы получили любопытное предложение. Ван Цзинвэй, один из самых видных членов партии Гоминьдан, обратился к нам, желая сформировать новое китайское правительство в противовес Чан Кайши."
  
 JAP_fully_integrate_taiwan: "Полная интеграция Тайваня"
 JAP_fully_integrate_taiwan_desc: "Остров Формоза уже многие десятилетия является верной частью нашей страны. Настало время официально интегрировать его."
  
 JAP_the_korean_project: "Корейский проект"
 JAP_the_korean_project_desc: "Корея – это ворота Японии на континент. Без неё наши мечты об империи никогда не осуществятся. Она должна быть крепко привязана к нам."
  
 JAP_fully_integrate_korea: "Полностью интегрировать Корею"
 JAP_fully_integrate_korea_desc: "Корейцы были успешно перевоспитаны, чтобы следовать японским традициям и культуре. Настало время им признать свой статус части Японии."
  
 JAP_the_siberian_project: "Сибирский проект"
 JAP_the_siberian_project_desc: "Имея владения на советском Дальнем Востоке, мы можем должным образом присоединить эти оккупированные территории к нашей марионетке Маньчжоу-Го, а также создать колониальную администрацию за пределами Большого Маньчжоу-Го."
  
 JAP_the_east_asian_project: "Восточноазиатский проект"
 JAP_the_east_asian_project_desc: "Наша оккупация Восточной Азии должна быть реорганизована в настоящую колониальную администрацию, чтобы должным образом противостоять угрозам нашим новым владениям со стороны как партизан, так и союзников. Администрации на Филиппинах и в Ост-Индии позволят сохранить и использовать наши силы в других местах, одновременно более эффективно направляя местную промышленность и ресурсы на наши военные усилия."
  
 JAP_placate_the_military: "Умиротворить военных"
 JAP_placate_the_military_desc: "Инцидент 26 февраля уничтожил фракцию Кодоха, и армия, теперь объединенная в поддержку фракции Тосей-ха, готова распространить свою власть на слабое и неэффективное гражданское правительство."
  
 JAP_the_fiction_of_democracy: "Фиктивность демократии"
 JAP_the_fiction_of_democracy_desc: "Дефектную и несостоятельную демократию, установленную Конституцией Мэйдзи, следует поддерживать теоретически, но нельзя допустить, чтобы она продолжала отравлять способность государства вести войну и управлять экономикой."
  
 JAP_appoint_konoe: "Назначить Коноэ"
 JAP_appoint_konoe_desc: "Император Хирохито прислушался к мнению военного истеблишмента, Япония больше не может позволить себе заигрывать с западными идеями либерализма и гражданского правительства. Коноэ приведет Японию к ее законному месту лидера Азии!"
  
 JAP_kokutai_ideology: "Идеология Кокутай"
 JAP_kokutai_ideology_desc: "Ряд ученых и специалистов, назначенных премьер-министром Коноэ, завершили разработку «Кокутай-но Хонги», «Основных принципов национальной сущности». В этой 156-страничной брошюре описывается и диктуется создание новой Японии. Она содержит официальное учение японского государства по всем аспектам внутренней политики, международных отношений, культуры и цивилизации."
  
 JAP_indoctrination: "Движение духовной мобилизации"
 JAP_indoctrination_desc: "Мы можем использовать Кэмпэйтай для идеологической обработки населения, чтобы продвигать японское превосходство и право на гегемонию в Восточной Азии."
  
 JAP_strengthen_the_civilian_government: "Укрепить гражданское правительство"
 JAP_strengthen_the_civilian_government_desc: ""
  
 JAP_constitutional_reform: "Конституционная реформа"
 JAP_constitutional_reform_desc: ""
  
 JAP_address_the_trade_imbalance: "Решение проблемы торгового дисбаланса"
 JAP_address_the_trade_imbalance_desc: "По мере роста наших заморских владений необходимо приложить усилия для повышения конкурентоспособности японских товаров на этих рынках, чтобы исправить торговый дисбаланс, затрагивающий Родные острова."
  
 JAP_appoint_kingoro: "Назначить Кингоро"
 JAP_appoint_kingoro_desc: ""
  
 JAP_showa_statism: "Сёва-статизм"
 JAP_showa_statism_desc: "Государство является высшим воплощением Императора и его Божественной Воли. Объединив неподкупную силу нашей армии с Императором и победив Дзайбацу, которые по глупости развратили политиков слабой демократии, Япония поднимется как непреодолимая сила в Восточной Азии, готовая занять наше законное место в качестве лидеров полушария!"
  
 JAP_recognise_former_daimyo_families: "Признать семьи бывших даймё"
 JAP_recognise_former_daimyo_families_desc: "Хотя конец Дзайбацу устранил угрозу, которую представляли для нашего режима капиталисты свободного рынка, мы должны приложить усилия, чтобы привлечь на свою сторону могущественные и влиятельные семьи бывших даймё, которые до сих пор таят обиду из-за потери своих владений при создании системы префектур во время Реставрации Мэйдзи."
  
 JAP_foundations_for_a_war_with_china: "Основы войны с Китаем"
 JAP_foundations_for_a_war_with_china_desc: "Наши армии в Китае уже готовятся к войне. Мы должны позаботиться о том, чтобы в случае такого развития событий они могли быть адекватно снабжены и поддержаны авиацией."
  
 JAP_spiritual_service: "Духовное служение"
 JAP_spiritual_service_desc: "Национальное движение духовной мобилизации провозглашает, что государство и армия являются высшим проявлением добродетели синтоистской веры. Служба прославляет самого служащего, его семью и нашу славную Империю. Милитаризация образования и установление минимального срока службы обеспечат соблюдение требований."
  
 JAP_amau_doctrine: "Доктрина Амау"
 JAP_amau_doctrine_desc: "Доктрина Амау, концепция права японского государства действовать в одностороннем порядке для сохранения мира и стабильности в Восточной Азии, должна быть должным образом принята как экспансионистская политика, позволяющая более эффективно распространять японское влияние на независимые страны Восточной Азии."
  
 JAP_strike_at_china: "Удар по Китаю"
 JAP_strike_at_china_desc: "[Root.GetNameDefCap] бедна ресурсами, а наши соседи — нет. Мы должны взять у них то, чего нам не хватает, и нужен только повод, чтобы начать это делать. Такой повод могли бы дать несколько предприимчивых солдат, после чего Императору не останется иного выбора, кроме как согласиться на войну, какой бы плохо подготовленной она ни была..."
  
 JAP_exploit_china: "Эксплуатация Китая"
 JAP_exploit_china_desc: "Наши войны наносят значительный ущерб нашей экономике. Мы разработали планы эксплуатации регионов Китая, находящихся под нашим контролем, чтобы лучше контролировать наше экономическое положение."
 JAP_exploit_china_tt: "Разблокирует решения: §YЭкономическая эксплуатация Японской империей§! §YКитайской Республики§! и других §Yкитайских варлордов§!."

 JAP_seize_chinese_gold: "Изъятие китайского золота"
 JAP_seize_chinese_gold_desc: ""
  
 JAP_capital_control: "Ввести контроль над капиталом"
 JAP_capital_control_desc: "Мы должны ограничить дивиденды акционеров, поставив выдачу дивидендов под контроль государства, и тогда мы сможем выкачивать богатство из Дзайбацу."

 JAP_national_service_draft_ordinance: "Указ о призыве на государственную службу"
  
 JAP_support_mengjiang_claims: "Поддержка претензий Мэнцзяна"
 JAP_support_mengjiang_claims_desc: "Нашей монгольской марионетке не хватало легитимности, чтобы отстаивать свои претензии на всю Монголию. С нашей помощью они смогут вновь утвердиться на территории, утраченной в пользу Китая и Советов."
 JAP_support_mengjiang_claims_tt: "Позволит Мэнцзяну захватить территорию Монголии\n\n"
  
 JAP_crush_the_remaining_warlords: "Сокрушить оставшихся варлордов"
 JAP_crush_the_remaining_warlords_desc: "Националисты потерпели поражение, а их мелкий Объединенный фронт находится в руинах. Пришло время обеспечить нашу власть над Китаем!"
  
 JAP_hiranuma_kiichiros_cabinet: "Кабинет Хиранумы Киитиро"
 JAP_hiranuma_kiichiros_cabinet_desc: "Премьер-министр Коноэ неожиданно подал в отставку и вместо этого возглавил Тайный совет. Это привело к значительной нестабильности, поскольку кабинет премьер-министра Киитиро пытается справиться с военной ситуацией в Китае, меняя руководство и стратегические цели."
 JAP_hiranuma_kiichiros_cabinet_tt: "§YАвтозавершение в 1939 году§!"
 JAP_hiranuma_kiichiros_cabinet_dd_flag: "Фокус §YКабинет Хиранумы Киитиро§! выполнен"
 JAP_hiranuma_kiichiros_cabinet_dd_tt: "В настоящее время: [?JAP_hiranuma_kiichiros_cabinet_dd_flag:days|Y0]"
  
 JAP_konoes_second_term: "Второй срок Коноэ"
 JAP_konoes_second_term_desc: "Коноэ вернулся после катастрофического правления Киитиро и Ёнаи. Он намерен сплотить нацию вместе с нашими собратьями — фашистскими державами Европы, а также наконец выбраться из китайской трясины, добившись решительной победы."
  
 JAP_sign_the_tripartite_pact: "Подписать Трехсторонний пакт"
 JAP_sign_the_tripartite_pact_desc: "Подписание наконец Трехстороннего пакта, как того требовала армия, объединит нас с другими фашистскими державами мира, гарантируя наше место в Новом мировом порядке и закладывая основу для сотрудничества, если британцы или янки попытаются остановить нашу экспансию."
  
 JAP_strike_south: "Удар на юг"
 JAP_strike_south_desc: "Пришло время нанести удар по союзникам в быстрой военно-морской кампании. Только быстро захватив Филиппины, владения союзников в Тихом океане и Ост-Индию и решительно разгромив их флот на море, мы можем надеяться заставить их сесть за стол переговоров о мире."
  
 JAP_exploit_the_south: "Эксплуатация Юга"
 JAP_exploit_the_south_desc: "Промышленность наших оккупированных регионов можно использовать для снижения экономической нестабильности на Родных островах, хотя большая часть гражданской промышленности, оставшейся в регионе, будет непригодна для использования до тех пор, пока местная администрация не оправится от нашей эксплуатации."
 JAP_exploit_the_south_tt: "Разблокирует решения: §YЭкономическая эксплуатация Японской империей§! §Y[PHI.GetNameDef]§!, §Y[MAL.GetNameDef]§!, §Y[INS.GetNameDef]§!, и других."
  
 JAP_imperial_rule_association: "Ассоциация помощи трону"
 JAP_imperial_rule_association_desc: "В это время войны необходимо создать единую администрацию из несогласных фракций армии, флота и остатков гражданского правительства. АПТ, структурированная как национальная синдикалистская система, призванная вовлекать всех членов правительства в организацию государства и ведение войны, будет поддерживать стабильность внутри страны по мере усиления военных действий."
 
 JAP_army_rule_association: "Ассоциация содействия армейскому правлению"
 JAP_army_rule_association_desc: ""
 
 china_reorganized_focus: "Дерево фокусов для Китая Ван Цзинвэя"
 RNC_PARTY_NAME_SHORT: "Гоминьдан"
 RNC_PARTY_NAME_LONG: "Гоминьдан - Фракция Ван Цзинвэя"
 
 JAP_reform_the_officers: "Реформировать офицерский корпус"
 JAP_reform_the_officers_desc: "Создание Ассоциации содействия имперскому правлению и подписание Трехстороннего пакта, а также наша приверженность победе в Китае позволили национальному руководству восстановить контроль и лояльность армии, значительно повысив эффективность и сплоченность."
  
 JAP_test_the_soviets_tt: "Уберет §YСтратегическую нерешительность§! после завершения приграничной войны."
 JAP_test_the_soviets: "Испытать Советский Союз"
 JAP_test_the_soviets_desc: "После того как у Халхин-Гола начались стычки между монгольской и маньчжурской кавалерией, у нас появилась возможность прощупать советские позиции. Ранее их силы были крайне истощены, и если это по-прежнему так, удар на север, вглубь Советского Союза, все еще возможен."
  
 JAP_teijiro_toyods_cabinet: "Кабинет Тейдзиро Тойода"
 JAP_teijiro_toyods_cabinet_desc: ""
  
 JAP_consolidate_around_yonai: "Объединиться вокруг Ёнаи"
 JAP_consolidate_around_yonai_desc: "Ёнай занял решительную позицию против текущей ситуации с китайским инцидентом. Мы должны консолидировать нашу политическую волю, чтобы выйти из ситуации на континенте и предотвратить войну против Соединенных Штатов в Тихом океане, возможность, к которой мы безнадежно не готовы."
  
 JAP_placate_the_allies: "Умиротворить союзников"
 JAP_placate_the_allies_desc: "Как бы больно ни было позволить полной победе ускользнуть из наших рук, мы должны позволить колониальным державам стать посредниками в мире на континенте, прежде чем ситуация перерастет в глобальный пожар, положив конец этой войне, которая истощила наши ресурсы и изолировала нашу нацию."
 JAP_placate_the_allies_tt: "§RПриведет к миру с Китаем§!"
 JAP_placate_the_allies_bypass_tt: "В США и Великобритании есть фашистское правительство или мы находимся в состоянии войны с одним из них."
  
 JAP_strike_north_doctrine_desc: "Советский Союз снова и снова доказывал свою слабость и неспособность противостоять нашей армии. Необходимо подготовиться к нанесению удара по Внешней Маньчжурии с целью расширения наших колониальных владений и обеспечения важнейших источников железа и продовольствия."
 india_required_states_tt: "Контролирует все §YИндийские§! территории через подкотрольные государства или напрямую."
 burma_required_states_tt: "Контролирует все §YБирманские§! территории."
 philippino_required_states_tt: "Контролирует все §YФилипинские§! территории."
 indonesia_required_states_tt: "Контролирует все §YИндонезийские§! территории."
 malaya_required_states_tt: "Контролирует все §YМалайские§! территории."
 new_guinea_required_states_tt: "Контролирует все территории §YНовой Гвинеи§! и §YСоломона§!."
 australia_required_states_tt: "Контролирует все §YАвстралийские§! территории."
  
 JAP_strike_south_doctrine_desc: "Мы должны завладеть ресурсами Ост-Индии, чтобы преодолеть эмбарго европейских и североамериканских стран. Необходимо подготовиться к быстрой кампании высадки и военно-морских действий, чтобы захватить архипелаг и удержать его, отразив контратаки Запада."
 soviet_required_states_tt: "Контролирует все §YСовесткие Дальневосточные§! территории."
 mongolian_required_states_tt: "Контролирует все §YМонгольские§! территории."
 tannu_tuvan_required_states_tt: "Контролирует все территории §YТанну-Тувы§!."
  
 JAP_non_aggression_pact_with_the_usa: "Пакт о ненападении с американцами"
 JAP_non_aggression_pact_with_the_usa_desc: "Если мы собираемся нанести удар по Советскому Союзу, мы должны убедиться, что наша спина в Тихом океане надежно защищена. Соединенные Штаты остаются нашим главным противником на этом театре военных действий, но на данный момент мы должны обеспечить прочный мир."
  
 JAP_greater_east_asian_co_prosperity_sphere: "Сфера совместного процветания Великой Восточной Азии"
 JAP_greater_east_asian_co_prosperity_sphere_desc: "Только благодаря объединению наших колониальных государств и союзников по всей Восточной Азии мы сможем бросить вызов старому мировому порядку на мировой арене. Объединив ресурсы всей Восточной Азии, Сфера совместного процветания освободит страны Восточной Азии от колониальных угнетателей... предоставив нам значительный контроль над их ресурсами."
  
 JAP_non_aggression_pact_with_the_usa_dd_flag: "Фокус §Y$JAP_non_aggression_pact_with_the_usa$§! выполнен"
 JAP_non_aggression_pact_with_the_usa_dd_tt: "В настоящее время: [?JAP_non_aggression_pact_with_the_usa_dd_flag:days|Y0]"
  
 JAP_non_aggression_pact_with_the_soviet_union_dd_flag: "Фокус §Y$JAP_non_aggression_pact_with_the_soviet_union$§! выполнен"
 JAP_non_aggression_pact_with_the_soviet_union_dd_tt: "В настоящее время: [?JAP_non_aggression_pact_with_the_soviet_union_dd_flag:days|Y0]"
  
 JAP_non_aggression_pact_with_the_soviet_union: "Пакт о ненападении с русскими"
 JAP_non_aggression_pact_with_the_soviet_union_desc: "Пока мы имеем дело с союзными державами, мы должны убедиться, что граница в Маньчжоу-Го и Корее стабильна и защищена, поскольку война на два фронта закрепит наш крах. Этот пакт, конечно, на какое-то время предотвратит нашу экспансию на север."
  
 JAP_strike_north: "Удар на север"
 JAP_strike_north_desc: "Советский Союз занят отражением немецкого вторжения на западе. Это прекрасная возможность быстро нанести удар по Советскому Союзу и без особого сопротивления захватить его владения на Дальнем Востоке. Вероятность того, что они остановят наступление Германии, мала, поэтому нам не придется беспокоиться о затяжной войне."
 JAP_strike_north_tt: "Выполнены армейские задачи по захвату Индии, Австралии, Новой Зеландии и все миссии в Китае."
 
  
 JAP_develop_the_north: "Развивать Север"
 JAP_develop_the_north_desc: ""
  
 JAP_imperial_shogunate_association: "Ассоциация Императорского сёгуната"
 JAP_imperial_shogunate_association_desc: "Как сёгунат когда-то обладал властью над Императором, так и теперь Ассоциация сёгуната будет давать советы Императору и уравновешивать его власть в нашем современном национальном государстве. Состоящая из чиновников армии и флота, Ассоциация позволит военным действовать быстро и решительно в интересах Императора."
  
 JAP_mutual_aid_associations: "Ассоциации взаимной помощи"
 JAP_mutual_aid_associations_desc: ""
 
 JAP_black_dragon_society: "Общество черного дракона"
 JAP_black_dragon_society_desc: ""
  
 JAP_purge_the_kwantung_army: "Чистка Квантунской армии"
 JAP_purge_the_kwantung_army_desc: "Квантунская армия была корнем наших бед на протяжении последних двух десятилетий. Мы должны действовать быстро, чтобы удалить эту опухоль и вернуть нашей армии лояльность и надежность, необходимые для успеха большой войны на континенте."
  
 JAP_samurai_zeal: "Самурайское усердие"
 JAP_samurai_zeal_desc: "Бусидо, Дух Воина, должен быть привит каждому солдату на каждом уровне. Победа должна быть достигнута любой ценой, а капитуляция — это величайший акт предательства и трусости по отношению к своей нации, семье и императору."
  
 JAP_amphibious_warfare: "Амфибийная война"
 JAP_amphibious_warfare_desc: "Война на Тихом океане неизбежна. Таким образом, мы должны подготовить Императорский военно-морской десант Японии к боевым действиям в Тихом океане, включая расширение подготовки Специального военно-морского десанта."
  
 JAP_appoint_tojo: "Назначить Тодзио"
 JAP_appoint_tojo_desc: "Премьер-министр оказался в политической изоляции и подал в отставку на фоне слухов о том, что он лишился благосклонности императора. Хидэки Тодзио, популярный милитарист и политик, завоевал доверие Императора и выдвинулся, чтобы сплотить Японию вокруг армии. К окончательной победе! Банзай!"
  
 JAP_technological_exchanges: "Технологические обмены"
 JAP_technological_exchanges_desc: ""
  
 JAP_demand_indochina: "Требовать Французский Индокитай"
 JAP_demand_indochina_desc: "Крах Французской Республики перед лицом фашистских сил в Европе доказывает слабость старых колониальных держав. Мы оккупируем Индокитай и подготовим его к использованию в качестве базы для нашего будущего завоевания Ост-Индии."
  
 JAP_ultimatum_to_thailand: "Ультиматум Таиланду"
 JAP_ultimatum_to_thailand_desc: "Хотя Таиланд и настроен к нам благосклонно, его необходимо полностью подчинить себе, чтобы наш контроль над Восточной Азией был полным. Быстрое вторжение будет неожиданным и не встретит сопротивления и должно всего за несколько часов поставить государственный аппарат Таиланда под наш контроль..."
  
 JAP_ultimate_victory: "Окончательная победа"
