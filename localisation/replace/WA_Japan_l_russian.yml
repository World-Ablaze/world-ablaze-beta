 JAP_mechanization_desc: ""
 
 JAP_rebuild_the_heavy_escort_fleet: "Восстановление флота тяжелых эскортов"
 JAP_rebuild_the_heavy_escort_fleet_desc: ""
 JAP_rebuild_the_heavy_escort_fleet_tt: "Создает вариант §YТяжелого крейсера§! класса §YМогами§!\n"
 
 JAP_investment: "Инвестиции"
 JAP_investment_desc: "Дзайбацу — краеугольный камень экономики Японии. Мы должны инвестировать в тяжелую промышленность и переработку ресурсов, чтобы эти компании могли работать с максимальной производительностью."
  
 JAP_confiscation: "Конфискация"
 JAP_confiscation_desc: "Дзайбацу — злобное притон коррупции, грабящий людей и ослабляющий власть императора. Их богатство должно быть отобрано и возвращено империи."
  
 JAP_nationalize_civilian_industry: "Национализировать гражданскую промышленность"
 JAP_nationalize_civilian_industry_desc: "Воля императора – закон. Имперский контроль должен осуществляться над нашей гражданской промышленностью, чтобы направить ее на благо Японии."
  
 JAP_torpedo_ships: "Торпедные корабли"
 JAP_torpedo_ships_desc: "Торпеда – ценный инструмент. Руководствуясь волей императора, торпеды даже самых маленьких кораблей могут уничтожить самый большой линкор."
  
 JAP_auxiliary_carriers: "Вспомогательные носители"
 JAP_auxiliary_carriers_desc: "Хотя самолеты — слабые и ненадежные машины, они будут полезны в наших морских сражениях. Нам следует сосредоточиться на создании малых перевозчиков, чтобы не допустить чрезмерных инвестиций."
  
 JAP_ensure_military_loyalty: "Обеспечьте военную лояльность"
 JAP_ensure_military_loyalty_desc: "Хотя армейский переворот был долгожданным, мы не можем позволить себе более опрометчивых действий со стороны армии. Учитывая, что на правительственных должностях так много армейских офицеров, мы должны принять решительные меры, чтобы лишить их влияния."
 
