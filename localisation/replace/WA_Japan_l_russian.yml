 JAP_internal_factions_desc: "Япония извлекает выгоду из лояльного населения, готового делать все, что прикажет Император. Однако между различными военными группировками Японии существует острая конкуренция, которая приносит больше вреда, чем пользы. Дзайбацу прочно контролируют экономику и открыты для нашего влияния, чтобы компенсировать наши стратегические слабости.\n\n"
  
