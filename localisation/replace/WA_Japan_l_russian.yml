 jap_armor.800.t: "Инцидент на мосту Марко Поло"
 jap_armor.800.d: "Японские солдаты готовятся атаковать стратегический мост Марко Поло по приказу наших военных генералов без разрешения правительства.\n Это нападение, оправданное китайской агрессией после более ранней стрельбы возле города Ваньпин, пользуется полной поддержкой японской армии, и у нас остается только два очень трудных варианта, но выбор ясен..."
 jap_armor.800.a: "У нас нет другого выбора, кроме как довести дело до конца"
 jap_armor.800.b: "Заставить их повернуть назад"
  
 JAP_ask_for_peace_USA_TT: "§YЯпония должна контролировать все тихоокеанские острова и территории Союзников в Океании§!"
  
 jap_armor.801.t: "Япония предлагает мир"
 jap_armor.801.d: "Япония пришла к нам с мирным соглашением о прекращении боевых действий в Тихом океане. После побед Японии на островах Тихого океана и завоевания Океании у них появился очень прочный плацдарм, позволяющий отразить любые атаки с нашей стороны. Хотя победа не является невозможной и мы не готовы от нее отказаться, несколько лет мира могут дать нам время восстановить наш флот и армии для нового вторжения в Тихий океан."
 jap_armor.801.a: "Мы согласны!"
 jap_armor.801.b: "Мы никогда не смиримся с поражением!"
  
 jap_armor.802.t: "Союзники остаются непокорными"
 jap_armor.802.d: "Даже несмотря на наши огромные успехи на Тихом океане, союзники не принимают наши условия мира. Возможно, существуют планы вторжения, о которых мы не знаем, или они просто заблуждаются. Какова бы ни была причина, сейчас только вторжение в Соединенные Штаты и победа стран Оси в Европе могут привести к миру."
 jap_armor.802.a: "Мы победим!"
  
 jap_armor.810.t: "Инцидент в Ояме"
 jap_armor.810.d: "Вскоре после инцидента на мосту Марко Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Поскольку наши попытки деэскалации ситуации потерпели неудачу, японская армия запросила немедленную отправку подкреплений, если китайцы не уйдут из Шанхая."
 jap_armor.810.a: "На этот раз мы готовы!"
  
 jap_armor.812: "Китай отказывается от соглашения Хэ-Умэдзу"
 jap_armor.812.d: "Китай начал свой путь возвращения Севера, поставив его в прямой конфликт с нашими владениями в Восточном Хэбэе. Вопреки нашему соглашению они вернули войска Гоминьдана в регион Шаньдун/Хэбэй и требуют от нас отказаться от наших китайских владений. Наши военные готовы, если мы будем соблюдать условия соглашения и противостоять Китаю на границе. Скорее всего, это приведет к войне. Если мы когда-нибудь даже подумаем о выходе из соглашения, кто знает, прислушаются ли наши военные..."
 jap_armor.812.a: "Это нарушение недопустимо!"
 jap_armor.812.b: "Пришло время уйти из Китая..."
  
 jap_armor.813.t: "Япония предлагает мир"
 jap_armor.813.d: "Поскольку Япония завоевала наш Дальний Восток, мы больше не можем надеяться вернуть себе утраченную землю, которая лежит за труднопроходимой местностью и вне досягаемости нашего военно-морского флота. По этому мирному соглашению мы уступаем наши дальневосточные территории и Монголию Японии, теряя доступ к Тихому океану. Это, несомненно, трагический исход... возможно, несколько лет мира помогут нам восстановиться, чтобы подготовить месть и окончательную победу над Японией."
 jap_armor.813.a: "У нас пока будет мир..."
 jap_armor.813.b: "Мы никогда не смиримся с поражением!"
  
 jap_armor.814.t: "Катастрофа переворота молодых офицеров"
 jap_armor.814.desc: "Группе молодых офицеров не удалось прийти к власти в нынешнем правительстве. Однако многие офицеры и политики были убиты, а также бывшие премьер-министры. Нападения на город Токио и Императорский дворец потрясли нас, но быстрые действия Сугиямы, сплотившего большие силы против повстанцев, предотвратили дальнейшую эскалацию. В сочетании с указом Императора о том, что повстанческая армия должна сдаться, у повстанцев оставалось мало надежд на успех, и многие впоследствии покончили жизнь самоубийством."
 jap_armor.814.a: "Наша воля непоколебима!"
  
 jap_armor.815.t: "Переворот молодых офицеров подавлен"
 jap_armor.815.desc: "Группе молодых офицеров не удалось прийти к власти в нынешнем правительстве. Однако многие офицеры и политики были убиты, а также бывшие премьер-министры. Нападения на город Токио и Императорский дворец потрясли страну, нанеся большой ущерб и произошли боевые действия. Несмотря на указ Императора о том, что повстанческая армия должна сдаться, его воля не смогла дойти до повстанческой армии, и без единого ответа последовала кровавая баня..."
 jap_armor.815.a: "Наша армия была разобщена..."
  
 jap_armor.816.t: "[MEN.GetName] запрашивает контроль над регионом [927.GetName]"
 jap_armor.817.t: "[MEN.GetName] запрашивает контроль над регионом [621.GetName]"
 jap_armor.818.t: "[MEN.GetName] запрашивает контроль над регионом [941.GetName]"
 jap_armor.819.t: "[MEN.GetName] запрашивает контроль над регионом [926.GetName]"
 jap_armor.820.t: "[MEN.GetName] запрашивает контроль над регионом [746.GetName]"
 jap_armor.821.t: "[MEN.GetName] запрашивает контроль над регионом [948.GetName]"
 jap_armor.822.t: "[MEN.GetName] запрашивает контроль над регионом [756.GetName]"
 jap_armor.823.t: "[MEN.GetName] запрашивает контроль над регионом [788.GetName]"
 jap_armor.824.t: "[MEN.GetName] запрашивает контроль над регионом [330.GetName]"
 jap_armor.825.t: "[MEN.GetName] запрашивает контроль над регионом [789.GetName]"
 jap_armor.816.d: "Мы пообещали правительству Мэнцзяна все монгольские территории, когда он присоединился к нам против китайцев, было бы разумно, чтобы мы выполнили наше соглашение, отдав им обещанную землю, которую мы только что захватили."
 jap_armor.816.a: "Мы соблюдаем союзнические соглашения!"
 jap_armor.816.b: "Мы выполним их требования позже."
  
 jap_armor.826.t: "Сиамский вопрос"
 jap_armor.826.d: "Благодаря нашему недавнему союзу с Сиамом мы имеем над ними абсолютную власть. Чтобы лучше служить Сфере совместного процветания Восточной Азии, мы можем либо превратить их в одно из наших подвластных государств, либо провести полное вторжение, чтобы включить Сиам в состав Японской империи."
 jap_armor.826.a: "Сделать их нашим протекторатом"
 jap_armor.826.b: "Полностью включить их в состав империи!"
  
 jap_armor.827.t: "[MAN.GetName] предлагает китайское лидерство"
 jap_armor.827.d: "Теперь, когда реорганизованное национальное правительство Китая полностью сформировано, новый лидер Маньчжоу-Го предложил им взять на себя руководящую роль и работать вместе с Японией, а не в качестве имперского подданного."
 jap_armor.827.a: "Нам нужно держать весь Китай под своим контролем!"
 jap_armor.827.b: "Чем сильнее Китай, тем сильнее Япония!"
  
 jap_armor.828.t: "[JAP.GetName] отвергает китайское лидерство"
 jap_armor.828.d: "Япония, опасаясь сильного Китая, особенно после недавней японо-китайской войны, не дала нам согласия стать правителями Китая и предпочла держать своих китайских подданных под своим контролем."
 jap_armor.828.a: "Мы не можем расправить крылья..."
  
 jap_armor.829.t: "[JAP.GetName] одобряет китайское лидерство"
 jap_armor.829.d: ""
 jap_armor.829.a: "Наша судьба – изменить Китай!"
  
 jap_armor.830.t: "Последствия инцидента 26 февраля"
 jap_armor.830.d: "Поскольку радикальные группировки в японской армии дискредитированы, настало время пересмотреть кандидатуру Окады Кэйсукэ на посту премьер-министра и, возможно, поставить на его место более политическую фигуру, которая попытается обуздать военный контроль над японским правительством."
 jap_armor.830.a: "Пожелаем ему успехов!"
 jap_armor.830.b: "Мы не можем изменить статус-кво."
 
 jap_armor.831.t: "Трансляция голоса императора"
 jap_armor.831.d: "Враг начал применять новую и наиболее жестокую бомбу, разрушительная сила которой действительно не поддается исчислению и уносит жизни многих невинных людей. Если мы продолжим сражаться, это приведет не только к окончательному краху и уничтожению японской нации, но и к полному исчезновению человеческой цивилизации."
 jap_armor.831.a: "Мы должны терпеть невыносимое"
 JAP_surrender_tt: "§R[JAP.GetName] безоговорочно капитулирует.§!"
  
 afo_event.201.t: "Последний шанс выйти из Лондонского военно-морского договора"
 afo_event.201.d: "Лондонская конференция по военно-морскому договору почти подходит к завершению, это наш последний шанс отказаться от договора и строить любые корабли, которые нам нравятся."
 afo_event.201.a: "Сбросим этот железный якорь!"
 afo_event.201.b: "Это в интересах всего мира..."
  
  
 jap_armor.832.t: "Фумимаро Коноэ уходит в отставку"
 jap_armor.832.d: "Совершив очень неожиданный политический шаг, Коноэ ушел с поста премьер-министра и стал председателем Тайного совета. Это даст ему большую свободу в формировании своего массового национального движения, чтобы обеспечить полную поддержку праву армии на верховное командование. К сожалению, теперь за этим последуют политическая нестабильность и нерешительность, поскольку Коноэ, человек, возглавлявший наши военные усилия в Китае, больше не находится на своем посту."
 jap_armor.832.a: "Нам останется только пережить этот шторм!"
  
 jap_armor.833.t: "Кингоро Хасимото уходит в отставку"
 jap_armor.833.d: "Совершив очень неожиданный политический шаг, Хасимото ушел с поста премьер-министра и стал председателем Тайного совета. Это даст ему большую свободу в формировании своего массового национального движения, чтобы обеспечить полную поддержку праву армии на верховное командование. К сожалению, теперь за этим последуют политическая нестабильность и нерешительность, поскольку Хасимото, человек, возглавлявший наши военные усилия в Китае, больше не находится на своем посту."
 jap_armor.833.a: "Нам останется только пережить этот шторм!"
  
 jap_armor.834.t: "Политическая нестабильность углубляется"
 jap_armor.834.d: "Хиранума Киитиро подал в отставку из-за дружбы между Германией и Советским Союзом, а на его место Император выбрал противоречивую фигуру — Мицумасу Ёнаи. К сожалению, его позиция резко противоречит нынешним взглядам армии и привела к дальнейшему расколу различных родов войск. Только два варианта помогут нам пережить этот шторм."
 jap_armor.834.a: "Мы либо консолидируемся вокруг Ёнаи, либо вернем Коноэ."
  
 jap_armor.835.t: "[JAP.GetName] предъявляет ультиматум"
 jap_armor.835.d: "Япония нацелилась на контроль над всей Восточной Азией, и, как последняя независимая страна, мы получили от нее дипломатического посланника в надежде заключить с нами союз. Однако они пришли с кинжалом и ясно, что «нет» они не примут в качестве ответа."
 jap_armor.835.a: "Наше будущее за сферой совместного процветания!"
 jap_armor.835.b: "Если нам предстоит война, пусть это будет защита нашей Родины!"
  
 jap_armor.836.t: "[SIA.GetName] отклоняет наш ультиматум"
 jap_armor.836.d: "К сожалению, нашему посланнику не удалось заключить союз с Сиамом, однако его стратегическая важность означает, что мы должны использовать силу, чтобы превратить Таиланд в хороший плацдарм."
 jap_armor.836.a: "Тогда нам придется применить силу!"
  
 jap_armor.837.t: "[JAP.GetName] ищет посредничества для прекращения военных действий в Китае"
 jap_armor.837.d: ""
 jap_armor.837.a: "Потребовать частичного вывода японских войск"
 jap_armor.837.b: "Мы принимаем только полный вывод войск из Китая!"
 JAP_placate_the_allies_a: "§GЯпонии будет предложено вывести войска из Индокитая, Таиланда и отвести силы в Китае к восточному побережью§!"
 JAP_placate_the_allies_b: "§RЯпонии будет предложено уйти из Индокитая, Таиланда и всего материкового Китая обратно к первоначальной границе 1937 года§!"
  
 jap_armor.838.t: "[USA.GetName] запрашивает частичный вывод войск"
 jap_armor.838.d: ""
 jap_armor.838.a: "Эти условия приемлемы"
  
 jap_armor.839.t: "[USA.GetName] запрашивает полный вывод войск"
 jap_armor.839.d: ""
 jap_armor.839.a: "Бесчестные условия!"
 jap_armor.839.b: "Если это убережёт нас от войны..."
  
 jap_armor.840.t: "[JAP.GetName] принимает наши условия"
 jap_armor.840.d: ""
 jap_armor.840.a: "Блестящий дипломатический успех!"
  
 jap_armor.841.t: "[JAP.GetName] отклоняет наши условия"
 jap_armor.841.d: ""
 jap_armor.841.a: "Возможно, мы перестарались..."

 jap_armor.842.t: "Начало военного наступления"
 jap_armor.842.d: "Планирование нашего наступления в Китае завершено, и операция началась."
 jap_armor.842.a: "Вперёд, к победе!"


 

 