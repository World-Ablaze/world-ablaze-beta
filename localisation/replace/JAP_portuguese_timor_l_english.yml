l_english:
 jap_timor.2.t:0 "Portuguese Timor"
 jap_timor.2.d:0 "War with Japan has begun, and the Portuguese half of Timor lies undefended. Lisbon hides behind its neutrality and refuses to cooperate, yet if the Japanese take the island first, the road to Australia lies open. Should we send troops first, even at the cost of Portuguese neutrality?"
 jap_timor.2.a:0 "We cannot afford to worry about neutrality"
 jap_timor.2.a_tt:0 "If Japan surrenders, §YPortuguese Timor§! will be returned to §YPortugal§!"
 jap_timor.2.b:0 "Respect Portuguese neutrality"
