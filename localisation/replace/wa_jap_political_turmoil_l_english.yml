 jap_pol_turmoil.1.t:0 "The Harakiri Exchange"
 jap_pol_turmoil.1.d:0 "Attacked in the House of Representatives for the military's meddling in politics, the War Minister is pressing hard for a dissolution to punish the Diet. The ministers who came from the parties will never agree to it. There is no way to heal the split in the cabinet, and nothing left for it but to resign."
