 jap_pol_turmoil.4.t:0 "The Ugaki Cabinet Miscarries"
 jap_pol_turmoil.4.d:0 "As long as the army will not name a War Minister, not even Ugaki, with the imperial command in his hand, can form a cabinet. The days when the parties and the senior statesmen chose the Prime Minister are over. From now on only a man the army supports will lead a cabinet."
 jap_pol_turmoil.4.a:0 ""
