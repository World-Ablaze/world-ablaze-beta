 jap_pol_turmoil.6.t:0 "The Eat-and-Run Dissolution"
 jap_pol_turmoil.6.d:0 "Now that the budget has passed, this is our chance to punish the parties that will not work with the government. Unless we dissolve the Diet and let the forces that back us grow at the polls, the parties will go on holding us back for ever."
