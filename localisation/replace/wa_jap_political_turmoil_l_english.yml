l_english:
 # The turmoil of 1937 (events/JAP_political_turmoil.txt), in the order the events fire.
 jap_pol_turmoil.1.t:0 "The Harakiri Exchange"
 jap_pol_turmoil.1.d:0 "In the House of Representatives Hamada Kunimatsu of the Rikken Seiyukai attacked the military's meddling in politics. War Minister Terauchi Hisaichi took it as an insult to the army; neither man gave way and the chamber was in uproar. Having lost face, the War Minister is pressing hard for a dissolution, and the cabinet is caught between the parties and the army."
 jap_pol_turmoil.1.a:0 "This is going to be trouble"
 jap_pol_turmoil.2.t:0 "The Hirota Cabinet Resigns"
 jap_pol_turmoil.2.d:0 "The quarrel between War Minister Terauchi, who wants the Diet dissolved, and the ministers from the parties, who will not have it, could not be mended. Unable to hold his cabinet together, Hirota Koki has decided to resign. The cabinet that took on the aftermath of the February 26 Incident has fallen within a year."
 jap_pol_turmoil.2.a:0 "Who will take it on next?"
 jap_pol_turmoil.3.t:0 "Ugaki Is Commanded to Form a Cabinet"
 jap_pol_turmoil.3.d:0 "General Ugaki Kazushige, of the reserve, has received the imperial command to form the next cabinet. The elder statesman Saionji Kinmochi reckons that Ugaki, who carried through arms reductions as War Minister, is the man to hold the military in check. But an army that lost its regiments to those reductions is unlikely to follow him quietly."
 jap_pol_turmoil.3.a:0 "He is the man for it"
 jap_pol_turmoil.10.t:0 "No One Will Be War Minister"
 jap_pol_turmoil.10.d:0 "Ishiwara Kanji and others in the General Staff are driving the heads of the army to stop Ugaki's cabinet. Sugiyama Hajime and Koiso Kuniaki, both thought of for War Minister, have refused, and the post stands empty. The service ministers must be generals on the active list, so unless the army gives a man there can be no cabinet."
 jap_pol_turmoil.10.a:0 "Will no one take it?"
 jap_pol_turmoil.11.t:0 "Ugaki Asks to Be His Own War Minister"
 jap_pol_turmoil.11.d:0 "Driven into a corner, Ugaki asked the Lord Keeper of the Privy Seal, Yuasa Kurahei, to seek an imperial order returning him to the active list so that he could be War Minister himself. Yuasa, fearing what a failure would bring upon the court, refused. The way to a cabinet is all but closed."
 jap_pol_turmoil.11.a:0 "Is there nothing left to try?"
 jap_pol_turmoil.4.t:0 "The Ugaki Cabinet Miscarries"
 jap_pol_turmoil.4.d:0 "Without a War Minister, Ugaki Kazushige has given up and declined the imperial command. A man who held the command could not form a cabinet, for no other reason than that the army was against him. From now on no cabinet will stand without the army's consent."
 jap_pol_turmoil.4.a:0 "Not even the imperial command is enough"
 jap_pol_turmoil.5.t:0 "The Hayashi Cabinet"
 jap_pol_turmoil.5.d:0 "General Hayashi Senjuro, of the reserve, received the command in Ugaki's place and has formed a cabinet. It is a small one, with the Prime Minister holding several portfolios himself, and in the House of Representatives only the Showakai and the Kokumin Domei stand behind it. With the two great parties, which hold most of the seats, against it, how long it can last is doubtful."
 jap_pol_turmoil.5.a:0 "Let us see what he can do"
 jap_pol_turmoil.6.t:0 "The Eat-and-Run Dissolution"
 jap_pol_turmoil.6.d:0 "The Rikken Minseito and the Rikken Seiyukai have dragged out the debate on the cabinet's bills and given Hayashi no end of trouble. The moment the budget passed, the Prime Minister dissolved the House of Representatives, to punish the parties as he put it. Taking the budget and then sending the Diet home is being denounced as eating and running."
 jap_pol_turmoil.6.a:0 "Let the election settle it"
 jap_pol_turmoil.7.t:0 "The 20th General Election"
 jap_pol_turmoil.7.d:0 "The general election has left the Rikken Minseito and the Rikken Seiyukai the first and second parties as before. The Showakai and the Kokumin Domei, which back the government, have lost seats, and the Shakai Taishuto has risen to third. The dissolution that was to punish the parties has ended as a vote of no confidence in the cabinet."
 jap_pol_turmoil.7.a:0 "The people have spoken"
 jap_pol_turmoil.12.t:0 "Hayashi Will Not Go"
 jap_pol_turmoil.12.d:0 "Beaten at the polls, Prime Minister Hayashi has not given an inch. He has declared that he will stay in office and has even hinted at dissolving the Diet again. It has only fed the parties' anger, and the movement to bring him down grows by the day."
 jap_pol_turmoil.12.a:0 "Does he mean to stay?"
 jap_pol_turmoil.8.t:0 "Both Parties Demand the Cabinet's Resignation"
 jap_pol_turmoil.8.d:0 "The Rikken Minseito and the Rikken Seiyukai have set their own quarrel aside, joined hands and demanded that the Hayashi cabinet resign at once. With most of the House of Representatives against it, the cabinet can no longer hope to pass a single bill. It stands entirely alone."
 jap_pol_turmoil.8.a:0 "It is time to go"
 jap_pol_turmoil.9.t:0 "The Hayashi Cabinet Resigns"
 jap_pol_turmoil.9.d:0 "Beset on every side, Hayashi Senjuro has at last decided to resign. He goes four months after taking office, with nothing to show for them. To end the turmoil that began with the harakiri exchange, it will take a man whom both the military and the parties can accept."
 jap_pol_turmoil.9.a:0 "It is over at last"
