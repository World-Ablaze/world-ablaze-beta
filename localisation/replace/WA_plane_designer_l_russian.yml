 EQ_MOD_CAT_crew_equipment_TITLE: "Оборудование для экипажа"
 EQ_MOD_CAT_crew_equipment_oxygen_TITLE: "Дыхательное оборудование для экипажа"
 oxygen_masks: "Кислородные маски"
 oxygen_masks_desc: "Кислородные баллончики, прикрепленные к маскам, позволяют пилотам нормально дышать на больших высотах, где кислорода мало. С ясным сознанием пилот может работать намного лучше.\n§G$STAT_AIR_AGILITY$+1§!, §G$STAT_AIR_DEFENCE$+1§! в миссиях: §Y$AIRWING_MISSION_TYPE_INTERCEPTION$, $AIRWING_MISSION_TYPE_STRATEGIC_BOMBER$, $AIRWING_MISSION_TYPE_RECON$.§!"
 pressurized_cockpit: "Герметичная кабина"
 pressurized_cockpit_desc: "Загерметизировав кабину, можно было создать в ней давление, чтобы разреженный воздух на большой высоте не мешал пилотам и экипажу, избавляя их от необходимости использовать кислородные маски.\n§G$STAT_AIR_DEFENCE$+1, +5%§!, §G$STAT_AIR_AGILITY$+1§! в миссиях: §Y$AIRWING_MISSION_TYPE_AIR_SUPERIORITY$, $AIRWING_MISSION_TYPE_INTERCEPTION$, $AIRWING_MISSION_TYPE_STRATEGIC_BOMBER$, $AIRWING_MISSION_TYPE_RECON$.§!"
 flak_vests: "Бронежилеты"
 flak_vests_desc: "Усиленные костюмы, защищающие пилота и стрелков от осколков."
 ejection_seats: "Кресла для катапультирования"
 ejection_seats_desc: "Новое кресло пилота, разработанное для быстрого катапультирования из кабины и позволяющее пилоту безопасно выбраться из сбитого самолета."
 g_suit: "G-Костюм"
 g_suit_desc: "Боевая форма для пилотов, чтобы лучше противостоять центробежным силам. Она предотвращает отключение и потерю сознания, позволяя пилоту совершать более экстремальные маневры.\n§G$STAT_AIR_AGILITY$+2§!, §G$STAT_AIR_DEFENCE$+10%§! в миссиях: §Y$AIRWING_MISSION_TYPE_AIR_SUPERIORITY$, $AIRWING_MISSION_TYPE_INTERCEPTION$, $AIRWING_MISSION_TYPE_CAS$, $AIRWING_MISSION_TYPE_ATTACK_LOGISTICS$.§!"

