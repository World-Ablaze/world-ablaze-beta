 fast_bomber_airframe_1: "Базовый корпус быстрого бомбардировщика"
 fast_bomber_airframe_1_desc: "Благодаря использованию ряда новых технологий, разработанных в последнее время, этот самолет значительно превосходит по своим характеристикам предыдущие модели аналогичного размера."
