 medium_bomber_airframe_desc: "Среднеразмерный самолет с двумя двигателями и внутренним пространством для полезной нагрузки, топливных баков или оборонительного оборудования. Конструкция самолета достаточно гибкая, чтобы использоваться и в других целях."
