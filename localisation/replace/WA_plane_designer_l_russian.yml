 EQ_MOD_CAT_construction_material_TITLE: "Конструкционные материалы"
 non_strategic_materials: "Нестратегические материалы"
 non_strategic_materials_desc: "Заменив алюминий, где это возможно, специально обработанным деревом или тканью, можно значительно сократить использование стратегических материалов. Однако дерево и ткань не очень хорошо противостоят современному оружию и недостаточно прочны, чтобы выдержать силу мощных двигателей."
 mixed_construction: "Смешанная конструкция"
 mixed_construction_desc: "Металлический фюзеляж, покрытый вторичной конструкцией, состоящей из деревянных формеров и стрингеров, обтянутых тканью, делает самолет дешевле в массовом производстве, хотя и снижает прочность и долговечность конструкции."
 metal_construction: "Металлическая конструкция"
 metal_construction_desc: "Использование высококачественного дюралюминия для изготовления каждой детали конструкции самолета делает его надежной платформой для новейших двигателей и нагрузок, а также обеспечивает максимальную аэродинамику."

 EQ_MOD_CAT_light_plane_armour_TITLE: "Броня для легких самолетов"
 armour_light_none: "Без бронелистов"
 armour_light_none_desc: ""
 armour_light_seat: "Бронированное кресло для пилота"
 armour_light_seat_desc: "Бронированная пластина за креслом пилота обеспечивает столь необходимую защиту от обстрела хвостовыми фонарями."
 armour_light_seat_fuel: "Бронированное кресло пилота и топливный бак"
 armour_light_seat_fuel_desc: "В дополнение к пластине за пилотом, добавление брони под или вокруг топливных баков делает самолет более прочным за счет снижения дальности полета из-за дополнительного веса."
 armour_light_seat_cowl: "Бронированные кресло пилота и капот двигателя"
 armour_light_seat_cowl_desc: "Помимо пластины за спиной пилота, добавление брони на капот двигателя делает самолет более прочным за счет снижения дальности полета из-за дополнительного веса."
 armour_light_cockpit: "Бронированная кабина пилота"
 armour_light_cockpit_desc: "Закрытие передней/боковой/задней части кабины обеспечивает огромную защиту ценой снижения дальности полета."
 armour_light_seat_fuel_cowl: "Бронированные кресло пилота, топливный бак и капот двигателя"
 armour_light_seat_fuel_cowl_desc: "Броня за пилотом, топливными баками и капотом двигателя позволяет самолету выдержать тяжелые испытания и вернуться живым."
 armour_light_seat_fuel_engine: "Бронированные кресло пилота, топливный бак и моторный отсек"
 armour_light_seat_fuel_engine_desc: "Полностью бронированная ступица двигателя, кресло пилота и топливные баки позволяют самолету выдержать тяжелые испытания и вернуться живым."
 armour_light_cockpit_engine: "Бронированные кабина и моторный отсек"
 armour_light_cockpit_engine_desc: "Кабина, полностью закрытая броней, а также полностью бронированный двигатель - это действительно крепкий орешек."
 armour_light_cockpit_engine_wings: "Бронированныея кабина, моторный отсек и крылья"
 armour_light_cockpit_engine_wings_desc: "Летающий танк. Пилот в бронированной кабине. Двигатели в бронированных пластинах. Крылья усилены броней. Самолет, который может пройти через ад и вернуться обратно и все равно полетел бы!"

