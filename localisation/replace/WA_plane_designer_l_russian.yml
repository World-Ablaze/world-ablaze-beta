 light_mg_desc: "Пулеметы винтовочного калибра дают небольшую дополнительную огневую мощь по воздушным целям за весьма умеренную цену. Они быстро устаревают против более новых бронированных самолетов."

 heavy_mg_desc: "Тяжелые пулеметы значительно превосходят легкие пушки, обеспечивая достаточную огневую мощь для борьбы с современными бронированными самолетами."

 aircraft_cannon_desc: "Автоматические пушки обеспечивают значительную огневую мощь по воздушным и наземным целям при значительных затратах веса."

 upwards_cannon_desc: "Автопушки, стреляющие вверх, позволяют самолету-перехватчику поражать бомбардировщики, находясь вне поля огня оборонительного арсенала бомбардировщика."

 engine_cannon_desc: "В некоторых конструкциях двигателей внутри ступицы остается достаточно места, чтобы пушка могла стрелять прямо через гребной вал. Такое размещение наиболее оптимально для точной стрельбы."

 gun_pod_desc: "Внешние капсулы, прикрепляемые к крыльям для размещения дополнительных пушек с огромной огневой мощью. Однако дополнительный вес и дополнительное сопротивление могут оказаться губительными для маломощных самолетов."

 machinegun_turret_desc: "Несмотря на то, что для воздушного боя он несколько недостаточно мощный, легкий пулемет в турели сделает любую атаку на этот самолет более опасной."
 
 heavy_machinegun_turret_desc: "Тяжелый пулемет во вращающейся башне позволяет обороняющемуся отбиваться от истребителя, вооруженного аналогичным оружием, с некоторой надеждой на успех."
 
 offensive_mount_desc: "В отличие от типичных орудийных башен, фиксированная наступательная установка, управляемая пилотом, облегчает более точное обстреливание наземных целей."
 
 cannon_turret_desc: "Современная пушка в проходимой башне существенно меняет баланс сил между обороняющейся и атакующей сторонами в воздушном бою. Лишь немногие истребители могут выдержать прямое попадание современной пушки и продолжить бой."
 
 remote_controlled_turret_desc: "Благодаря новым инженерным решениям артиллеристы могли управлять орудийной башней дистанционно, находясь в более защищенном положении внутри самолета, а также иметь возможность укомплектовать большее количество орудий меньшим числом артиллеристов."
 
 at_rockets_desc: "Неуправляемые снаряды, подвешиваемые снаружи. Поскольку они выпускаются впереди атакующего самолета, пилоту гораздо проще навести их на цель по сравнению с бомбами. Однако относительно небольшая боеголовка делает их идеальными для поражения мягких логистических целей."
 
 air_rockets_desc: "Неуправляемые снаряды, подвешиваемые снаружи. Разработанные как противобомбовое оружие, они обладают достаточной взрывной силой, чтобы поражать наземные цели."
 
 guided_rockets_desc: "Управляемые снаряды подвешиваются снаружи с помощью рудиментарных систем слежения, чтобы увеличить шансы на попадание в цель."
 
 bomb_locks_he_desc: "Крепления для бомб под крыльями или фюзеляжем позволяют самолету атаковать наземные цели с некоторой надеждой на успех."
 
 bomb_locks_gp_desc: "Крепления для бомб под крыльями или фюзеляжем позволяют самолету атаковать наземные и морские цели с некоторой надеждой на успех."
 
 bomb_bay_he_desc: "Отсек позволяет нести достаточное количество боеприпасов для поражения широкого спектра наземных целей. Нахождение внутри фюзеляжа уменьшает сопротивление."
 
 bomb_bay_gp_desc: "Отсек позволяет нести достаточное количество боеприпасов для поражения широкого спектра наземных и морских целей. Нахождение внутри фюзеляжа снижает сопротивление."

 water_cooled_engines_desc: "Рядные двигатели обычно обеспечивают большую мощность при своих размерах и весе. Однако системы охлаждения делают их более восприимчивыми к повреждениям."

 air_cooled_engines_desc: "Радиальные двигатели массивнее и тяжелее, но они более компактны. Благодаря тому, что для охлаждения используется только воздух, они способны выдерживать большие нагрузки и продолжать работать."

 jet_engines_desc: "Этот сложный и темпераментный двигатель с совершенно иным подходом к управлению самолетом обеспечивает значительное увеличение тяги и скорости."
 
 rocket_engines_desc: "Используя ряд очень летучих видов топлива и столь же нестабильный окислитель, этот двигатель способен выдавать очень большую тягу, разгоняя самолет до высоких скоростей, за счет снижения дальности полета."
 
 torpedo_mounting_desc: "Жесткие точки, позволяющие установить торпеду под фюзеляжем. Это дает самолету мощное оружие, которое можно использовать против вражеских кораблей."
 
 anti_ship_guided_bomb_desc: "Являясь по сути противокорабельной бомбой с радионаведением, это новое оружие войны представляет собой серьезную угрозу для всех кораблей, находящихся в настоящее время на плаву."
 
 kinetic_torpedo_desc: "Не имея двигателя, торпеда полагается на кинетическую энергию, получаемую от самолета, подбрасывающего ее к цели с пикирования. Взрыватель, установленный под ватерлинией, представляет значительную опасность для ничего не подозревающих кораблей."

