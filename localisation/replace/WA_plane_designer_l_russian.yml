 medium_bomber_airframe_0: "Межвоенный корпус ударного бомбардировщика"
 medium_bomber_airframe_0_desc: "Несмотря на способность перевозить значительную полезную нагрузку на большие расстояния, потенциал роста этого самолета сильно ограничен."
 medium_bomber_airframe_1: "Базовый корпус ударного бомбардировщика"
 medium_bomber_airframe_1_desc: "Благодаря использованию ряда новых технологий, разработанных в последнее время, этот самолет значительно превосходит по своим характеристикам предыдущие модели аналогичного размера."
 medium_bomber_airframe_2: "Улучшенный корпус ударного бомбардировщика"
 medium_bomber_airframe_2_desc: "Благодаря современным производственным технологиям этот планер позволяет самолету перевозить большую полезную нагрузку на более дальние расстояния."
 medium_bomber_airframe_3: "Усовершенствованный корпус ударного бомбардировщика"
 medium_bomber_airframe_3_desc: "Разработанный для максимальной производительности и грузоподъемности, этот самолет представляет собой вершину достижений в области самолетов с традиционными двигателями."
 medium_bomber_airframe_4: "Современный корпус ударного бомбардировщика"
 medium_bomber_airframe_4_desc: "Поскольку самолеты с реактивными двигателями, вероятно, станут доминирующим видом транспорта, инженеры начинают разрабатывать конструкции самолетов с учетом особенностей реактивных двигателей."
 fast_bomber_airframe_0: "Межвоенный корпус быстрого бомбардировщика"
