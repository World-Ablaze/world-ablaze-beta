 small_fighter_airframe_0: "Межвоенный корпус истребителя"
 small_fighter_airframe_0_desc: "С начала Первой мировой войны авиация развивалась семимильными шагами. Этот самолет представляет собой кульминацию этих разработок, но очевидно, что его потенциал роста ограничен."
 small_fighter_airframe_1: "Базовый корпус истребителя"
 small_fighter_airframe_1_desc: "В последние годы появился ряд новых технологий, позволяющих создавать очень мощные, но при этом небольшие самолеты. Этот самолет представляет собой лишь первый шаг на этом пути."
 small_fighter_airframe_2: "Улучшенный корпус истребителя"
 small_fighter_airframe_2_desc: "Благодаря улучшенной аэродинамике и более прочной конструкции этот планер представляет собой явный шаг вперед по сравнению с базовой моделью."
 small_fighter_airframe_3: "Усовершенствованный корпус истребителя"
 small_fighter_airframe_3_desc: "Этот самолет, тщательно оптимизированный с точки зрения производительности, представляет собой абсолютный максимум того, что можно сделать с самолетом с поршневым двигателем."
 small_fighter_airframe_4: "Современный корпус истребителя"
 small_fighter_airframe_4_desc: "Этот самолет спроектирован так, чтобы использовать преимущества высоких скоростей, обеспечиваемых современными двигателями, и решить некоторые конструктивные проблемы, возникающие при полетах на высоких дозвуковых скоростях."
