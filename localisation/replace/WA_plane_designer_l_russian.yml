 air_air_radar_3_desc: "AДостижения в области электроники позволяют повысить разрешающую способность радаров, что означает возможность надежного отслеживания даже небольших целей."

 EQ_MOD_CAT_hmg_ammo_TITLE: "Боеприпасы для тяжелых пулеметов"
 ammo_apit: "Лента БЗТБ"
 ammo_apit_desc: "Бронебойно-зажигательные трассирующие боеприпасы обеспечивают баланс между пробиваемостью и уроном, что делает их наиболее распространенным и универсальным типом боеприпасов для воздушного боя."
 ammo_ap: "Лента БС"
 ammo_ap_desc: "Бронебойные снаряды жертвуют уроном по воздушным целям ради повышения способности пробивать бронированные наземные цел."
 EQ_MOD_CAT_cannon_ammo_TITLE: "Боеприпасы для пушки"
 ammo_he: "Лента ОФ"
 ammo_he_desc: "Специальные патроны для осколочно-фугасной пушки способны эффективно взрывать целые куски самых тяжелых самолетов, а также быть весьма эффективными против мягких наземных целей."

 dive_brakes_small: "Тормоза для погружения малых самолетов"
 dive_brakes_small_desc:1 "Легкие самолеты могли бы использовать набор спойлеров вдоль задней кромки крыла, которые раскрываются, когда самолет входит в пикирование, снижая общую скорость и позволяя самолету выходить из крутого пикирования, не отрывая крыльев. Это, в свою очередь, позволяет самолету атаковать из почти вертикального пикирования, резко повышая точность."
 dive_brakes_medium: "Тормоза для погружения средних самолетов"
 dive_brakes_medium_desc:1 "Более тяжелые самолеты могли бы использовать усиленный набор спойлеров вдоль задней кромки большего крыла, чтобы они раскрывались, когда самолет входит в пикирование, снижая общую скорость и позволяя самолету выходить из крутого пикирования без отрыва крыльев. Это, в свою очередь, позволяет самолету атаковать с резкого пикирования, резко повышая точность."
 
 EQ_MOD_CAT_fighter_role_category_TITLE: "Истребитель - Основная роль - Снаряжение"
 gun_sights: "Прицелы для оружия"
 gun_sights_desc:1 "Чтобы эффективно поражать воздушных противников, любому истребителю требуется прицел с нулевым углом.\n§RЗапрещает бомбы и торпеды.§!"
 ordnance_equipment: "Оружейное оборудование"
 ordnance_equipment_desc:1 "Превращение истребителя в многоцелевой истребитель-бомбардировщик требует установки различных креплений для вооружения и оборудования для сброса бомб.\n§OВключает бомбы и торпеды.§!"
 
