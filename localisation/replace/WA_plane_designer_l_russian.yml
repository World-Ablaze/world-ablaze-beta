 fast_bomber_airframe_desc: "Среднеразмерный самолет с двумя двигателями и внутренним пространством для полезной нагрузки, топливных баков или оборонительного оборудования. Этот самолет предпочитает использовать скорость вместо оборонительного вооружения, но все же может использоваться в других ролях."
