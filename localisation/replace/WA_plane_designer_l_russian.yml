 GER_engine_daimler_benz_db_603qe_2x_desc: "Два двигателя 603QE с водяным охлаждением установлены рядным способом, что обеспечивает двухмоторную мощность, но без паразитного сопротивления, которым страдают обычные крыльевые установки. Передний двигатель также обеспечивает достаточный зазор для большой центральной пушки. Располагая пропеллер и двигатель в задней части, самолет в целом становится более подверженным авариям и поломкам."
 GER_engine_bmw_801e_6x_jumo_004_2x: "6x BMW 801 E + 2x Jumo 004"
 GER_engine_bmw_801e_6x_jumo_004_2x_desc: "Дорогостоящая установка двух реактивных двигателей Jumo 004, соединенных с внешними радиальными двигателями BMW, позволяет значительно увеличить максимальную скорость на большой высоте, а значит, и дальность полета."
 GER_engine_gnome_rhone_14m_4_5_2x: "2x Gnome-Rhône 14M 4/5"
 GER_engine_gnome_rhone_14m_4_5_2x_desc: "Несмотря на то, что Gnome-Rhône 14M довольно слабый, это очень надежный двигатель в то время, когда более мощные силовые установки перепрофилируются на истребители."
 
