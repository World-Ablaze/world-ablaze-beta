 medium_heavy_bomber_airframe_0: "Межвоенный Medium Airframe"
 medium_heavy_bomber_airframe_0_desc: "Несмотря на способность перевозить значительную полезную нагрузку на большие расстояния, потенциал роста этого самолета сильно ограничен."
 medium_heavy_bomber_airframe_1: "Базовый Medium Airframe"
 medium_heavy_bomber_airframe_1_desc: "Благодаря использованию ряда новых технологий, разработанных в последнее время, этот самолет значительно превосходит по своим характеристикам предыдущие модели аналогичного размера."
 medium_heavy_bomber_airframe_2: "Улучшенный Medium Airframe"
 medium_heavy_bomber_airframe_2_desc: "Благодаря современным производственным технологиям этот планер позволяет самолету перевозить большую полезную нагрузку на более дальние расстояния."
 medium_heavy_bomber_airframe_3: "Усовершенствованный Medium Airframe"
 medium_heavy_bomber_airframe_3_desc: "Разработанный для максимальной производительности и грузоподъемности, этот самолет представляет собой вершину достижений в области самолетов с традиционными двигателями."
 medium_heavy_bomber_airframe_4: "Современный Medium Airframe"
 medium_heavy_bomber_airframe_4_desc: "Поскольку самолеты с реактивными двигателями, вероятно, станут доминирующим видом транспорта, инженеры начинают разрабатывать конструкции самолетов с учетом особенностей реактивных двигателей."
 large_bomber_airframe_0: "Межвоенный корпус крупного бомбардировщика"
 large_bomber_airframe_0_desc: "Этот очень большой самолет имеет достаточно места для перевозки бомб или топливных баков. Однако очевидно, что его потенциал развития сильно ограничен. На горизонте уже появляются новые поколения стратегических бомбардировщиков."
 large_bomber_airframe_1: "Базовый корпус крупного бомбардировщика"
 large_bomber_airframe_1_desc: "Этот самолет был разработан для проверки потенциала настоящего стратегического бомбардировщика, способного наносить удары по промышленным объектам в глубине вражеской территории и возвращать экипаж живым."
 large_bomber_airframe_2: "Улучшенный корпус крупного бомбардировщика"
 large_bomber_airframe_2_desc: "С учетом того, что концепция стратегического бомбардировщика уже хорошо себя зарекомендовала, этот самолет был разработан с целью увеличения полезной нагрузки и дальности полета, при этом сохраняя достаточный потенциал для будущего развития."
 large_bomber_airframe_3: "Усовершенствованный корпус крупного бомбардировщика"
 large_bomber_airframe_3_desc: "Оптимизированный для полетов на очень большие расстояния на очень большой высоте, этот самолет способен доставлять значительную полезную нагрузку вглубь вражеской территории."
 large_bomber_airframe_4: "Современный корпус крупного бомбардировщика"
 large_bomber_airframe_4_desc: "Реактивная тяга обеспечивает качественный скачок в производительности. Этот самолет был разработан с учетом этого преимущества."
 large_maritime_patrol_airframe_0: "Межвоенный корпус морского патрульного самолета"
 large_maritime_patrol_airframe_0_desc:1 "Флоту нужны самолеты с большой дальностью полета, чтобы обнаруживать врагов вдали от берега. Хотя этот самолет и несколько устарел, он обладает необходимой дальностью полета, чтобы покрывать большие участки океана."
 large_maritime_patrol_airframe_1: "Базовый корпус морского патрульного самолета"
 large_maritime_patrol_airframe_1_desc: "Появление более мощных самолетов-носителей делает необходимым поиск и уничтожение вражеских флотов вдали от берега. Первым шагом для этого является их обнаружение в открытом океане, что требует использования самолетов нового типа."
 large_maritime_patrol_airframe_2: "Улучшенный корпус морского патрульного самолета"
 large_maritime_patrol_airframe_2_desc: "Двойная угроза со стороны подводных лодок и рейдерских крейсеров требует патрулирования обширных участков океана. Этот самолет оптимизирован для этой цели."
 large_maritime_patrol_airframe_3: "Усовершенствованный корпус морского патрульного самолета"
 large_maritime_patrol_airframe_3_desc: "Радар и другие датчики позволяют обнаруживать вражеские флотилии даже в плохую погоду или темной ночью, но все новое оборудование требует более крупного планера для его перевозки."
 large_maritime_patrol_airframe_4: "Современный корпус морского патрульного самолета"
 large_maritime_patrol_airframe_4_desc: "С наступлением эры ракетных вооружений морские патрульные самолеты должны быть способны действовать еще дальше от берега и в течение более длительного времени."
 cv_small_fighter_airframe_0: "Межвоенный корпус истребителя (авианосец)"
 cv_small_fighter_airframe_0_desc: "Оснащенный аэрофинишером и усиленным шасси, этот самолет может базироваться на авианосце."
 cv_small_fighter_airframe_1: "Базовый корпус истребителя (авианосец)"
 cv_small_fighter_airframe_1_desc: "Благодаря использованию новых технологий, разработанных для наземных самолетов, этот самолет обладает такими же возможностями, но может взлетать с палубы авианосца."
 cv_small_fighter_airframe_2: "Улучшенный корпус истребителя (авианосец)"
 cv_small_fighter_airframe_2_desc: "Чтобы не отставать от развития наземной авиации, этот самолет был спроектирован с использованием новых технологий, позволяющих увеличить дальность полета и повысить производительность."
 cv_small_fighter_airframe_3: "Усовершенствованный корпус истребителя (авианосец)"
 cv_small_fighter_airframe_3_desc: "Строгие требования к авиации ограничивают размеры и возможности самолета. Этот самолет представляет собой абсолютный максимум, который можно достичь с помощью самолета с традиционным двигателем."
 cv_small_fighter_airframe_4: "Современный корпус истребителя (авианосец)"
 cv_small_fighter_airframe_4_desc: "Этот самолет был разработан с целью использовать увеличенную тягу реактивных двигателей и применить ее в морской авиации."
