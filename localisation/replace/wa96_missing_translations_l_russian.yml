 JAP_subsidize_fujinagata_tt:0 "£faction_jap_zaibatsus  §YДзайбацу§! и £faction_jap_kantaiha  §YКантайха§! становятся §Gвлиятельнее§!, повышая £GFX_faction_construction_civilian_icon  §Yскорость строительства§! на §G+2.00%§!, а £GFX_faction_construction_dockyard_icon  §Yскорость строительства верфей§! на §G4.00%§!.\n"
