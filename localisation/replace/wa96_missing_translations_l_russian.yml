 ss_recruitment_event.1.a:0 "Наша армия растёт"
 ss_recruitment_event.1.b:0 "Набирать только вспомогательные части для вермахта"
 ss_recruitment_event.1.desc:0 "5.SS-Mot.-Division 'Wiking' входила в число 38 дивизий войск СС нацистской Германии. Её набирали из иностранных добровольцев Дании, Норвегии, Швеции, Финляндии, Эстонии, Нидерландов и Бельгии под командованием немецких офицеров. Во Второй мировой она действовала на Восточном фронте и в мае 1945 года сдалась американским войскам в Австрии."
 ss_recruitment_event.1.t:0 "Создание 5.SS-Mot.-Division 'Wiking'"
 ss_recruitment_event.2.a:0 "Наша армия растёт"
 ss_recruitment_event.2.b:0 "Набирать только вспомогательные части для вермахта"
 ss_recruitment_event.2.desc:0 "6-я горная дивизия СС «Норд» сформирована в феврале 1941 года как боевая группа СС «Норд». Это единственная часть войск СС, сражавшаяся за Полярным кругом во время пребывания в Финляндии и на севере России с июня по ноябрь 1941 года. Она воевала в Карелии до Московского перемирия в сентябре 1944 года, затем покинула Финляндию. В январе 1945 года понесла большие потери в операции «Нордвинд», а в начале апреля была уничтожена американскими войсками возле Бюдингена."
 ss_recruitment_event.2.t:0 "Создание 6.SS-Gebirgs-Div. 'Nord'"
 ss_recruitment_event.43.a:0 "Наша армия растёт"
 ss_recruitment_event.43.desc:0 "В середине 1942 года дивизии «Лейбштандарт», «Дас Райх», «Мёртвая голова», «Полицай» и «Викинг» были преобразованы из моторизованных и пехотных в механизированные. Однако, в отличие от армейских аналогов, механизированные дивизии СС имели полный танковый полк и фактически соответствовали танковым дивизиям."
 ss_recruitment_event.43.t:0 "Переформирование моторизованных дивизий"
 ss_recruitment_event.44.a:0 "Наша армия растёт"
 ss_recruitment_event.44.desc:0 "В конце 1943 года дивизии «Лейбштандарт», «Дас Райх», «Мёртвая голова», «Викинг» и «Гогенштауфен» были преобразованы из механизированных в танковые."
 ss_recruitment_event.44.t:0 "Переформирование механизированных дивизий"
 ss_recruitment_event.45.a:0 "Ничего не давать СС!"
 ss_recruitment_event.45.b:0 "Передать СС 5% производства"
 ss_recruitment_event.45.c:0 "Передать СС 10% производства"
 ss_recruitment_event.45.desc:0 "В 1942 году, после назначения Альберта Шпеера, Гиммлер предложил передать войскам СС от 5% до 8% военного производства Германии в обмен на лояльных работников СС для промышленности. Можно выделить СС 0%, 5% или 10% выпуска заводов. В зависимости от выбора будущие дивизии СС появятся соответственно с 0%, 50% или 100% бесплатного снаряжения. Однако чем больше получит СС, тем сильнее будет недоволен вермахт."
 ss_recruitment_event.45.t:0 "Соглашение Гиммлера-Шпеера"
 ss_recruitment_event_22_b_tt:0 "§RВлияние СС увеличивается на 5 пунктов.\nНедовольство СС уменьшается на 5 пунктов.§!"
