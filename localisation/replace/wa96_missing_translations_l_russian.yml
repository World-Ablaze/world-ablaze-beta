 jap_armor.803.a:0 "Мы согласны!"
 jap_armor.803.b:0 "ЧЁРТА С ДВА!"
 jap_armor.803.d:0 "Япония предложила мирное соглашение о прекращении боёв на Тихом океане. После партизанской войны на Японских островах общество устало от непрерывного роста потерь, и было бы разумно принять капитуляцию на условиях."
 jap_armor.803.t:0 "Япония предлагает капитуляцию на условиях"
 jap_armor.812.t:0 "Китай отказывается от соглашения Хэ — Умэдзу"
 jap_hv_inf_6:0 "Type 98 + Type 1 + ПТР Type 97"
 jap_hv_inf_6_desc:0 "Ручной пулемёт «Тип 1» — улучшенная версия «Типа 99» с небольшим приростом всех характеристик, но более высокой стоимостью производства, чем у альтернативного образца. \n§GСохраняет эффективность производства «Тип 98» + ручного пулемёта «Тип Хэй» + ПТР «Тип 97»§!"
 jap_hv_inf_6_short:0 "Type 1 + ПТР Type 97"
 jap_hv_inf_7:0 "Type 3 + ПТ-оружие Type 4"
 jap_hv_inf_7_desc:0 "«Тип 3» — развитие ручного пулемёта «Тип 99» в единый пулемёт. Вместе с ПТ-оружием «Тип 4» он заметно усиливает пехоту, хотя она по-прежнему уступает другим странам, особенно в борьбе с бронетехникой. \n§RЭто совершенно новая модель, эффективность производства не сохраняется§!"
 jap_hv_inf_7_short:0 "Type 2 + ПТ-оружие Type 4"
 jap_inf_5:0 "Винтовка Type Hei + пистолет-пулемёт Type 2A"
 jap_inf_5_desc:0 "Пистолет-пулемёт «Тип 1» заменяется «Типом 2A», который немного улучшает все характеристики при прежней стоимости. Эти два образца остаются самым дорогим стрелковым оружием Японии. \n§GСохраняет эффективность производства винтовки «Тип Хэй» + пистолета-пулемёта «Тип 1»§!"
 jap_inf_5_short:0 "Винтовка Type Hei + пистолет-пулемёт Type 2A"
 jap_inf_6:0 "Type 5 + пистолет-пулемёт Type 100-44"
 jap_inf_6_desc:0 "В «Типе 5» использовано много решений американской M1 Garand: полуавтоматический огонь и неотъёмный магазин, заряжаемый обоймами. Эти сложные решения значительно повышают огневую мощь, но существенно снижают надёжность. \n§RЭто совершенно новая модель, эффективность производства не сохраняется§!"
 jap_inf_6_short:0 "Type 5 + пистолет-пулемёт Type 100-44"
