 fra_armor.825.a:0 "Американцы идут!"
 fra_armor.825.d:0 "После долгого и тяжёлого периода войны в одиночку США наконец вступили в бой! Как и в прошлой войне, Соединённые Штаты с их огромной промышленностью, богатством и людскими ресурсами наверняка обеспечат победу."
 fra_armor.825.t:0 "[USA.GetName] присоединяются к войне"
 fra_light_tank_chassis_3_desc:0 "AMC 35 — один из немногих французских танков своего времени с двухместной башней. Однако ради места для дополнительного члена экипажа пришлось ослабить её броню. По сравнению с Hotchkiss 39 этот проект жертвует бронёй ради скорости и прорыва. Отсутствие радиостанций по-прежнему затрудняет взаимодействие в наступлении и обороне."
