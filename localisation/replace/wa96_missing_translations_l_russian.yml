 EAI_config_DIFFICULTY_2_headline:0 "Динамическая отчаянная оборона"
 EAI_config_DIFFICULTY_2_tt:0 "Воюющие с игроком страны ИИ получают растущие бонусы промышленности и скорости подготовки войск по мере приближения к капитуляции.\n\n§RДля отдельных стран настройку можно отключить или переопределить через настройки страны.§!"
