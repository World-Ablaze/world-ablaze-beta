 CHI_n_socialism_cdl_long:0 "Демократическая лига Китая"
 CHI_purchase_weapons_from_japan:0 "Закупить оружие у [JAP.GetName]"
 EAI.3.d:0 "Похоже, это сетевая игра. Начальные настройки может задать только один игрок. Однако можно разрешить всем открывать расширенные настройки позднее либо оставить это право только себе. При открытии окна все игроки получат уведомление.\n\nХотите настроить начальные параметры Expert AI в этой партии?"
 EAI.3.o1:0 "Да, но позднее настройки сможет открывать любой игрок"
 EAI.3.o2:0 "Нет, пусть мод настроит кто-нибудь другой"
 EAI.3.o3:0 "Да, и только я смогу открывать настройки в этой игре"
 EAI.3.t:0 "Expert AI"
 EAI.4.d:0 "Игрок, управляющий [From.GetNameDef], открыл событие настройки Expert AI."
 EAI.4.t:0 "Expert AI"
 EAI_AI_is_configuring_this_country:0 "ИИ сейчас настраивает военные приоритеты."
 EAI_DM.1000.d:0 "[From.GetName] оправдывает цель войны против [Root.GetName] (25 дней)."
 EAI_DM.1000.t:0 "Expert AI"
 EAI_DM.1300.o1:0 "Мы согласны."
 EAI_DM.1300.o2:0 "Мы отказываемся."
 EAI_DM.1300.tt:0 "Мы нанесём внезапный удар через 35 дней."
 EAI_DM.1300_d:0 "[From.GetNameDef] предлагает совместное вторжение в Иран. По их словам, необходимо защитить нефтяные месторождения от противника и создать безопасный путь снабжения Советского Союза."
 EAI_DM.1300_t:0 "Операция «Одобрение»"
 EAI_DM.1301.o1:0 "Интересно..."
 EAI_DM.1301_d:0 "[SOV.GetNameDefCap] и [ENG.GetNameDef] начали совместное вторжение в Иран, объяснив его стратегическими соображениями в регионе."
 EAI_DM.1301_t:0 "Англо-советское вторжение в Иран"
 EAI_DM.1302.o1:0 "Чёрт бы их побрал."
 EAI_DM.1302_d:0 "[From.GetNameDefCap] отказывается от совместного вторжения в Иран."
 EAI_DM.1302_t:0 "Операция «Одобрение»"
 EAI_DM.1303.o1:0 "Хорошо."
 EAI_DM.1303_d:0 "[From.GetNameDefCap] соглашается помочь нам в совместном вторжении в Иран."
 EAI_DM.1303_t:0 "Операция «Одобрение»"
 EAI_DM.24.d:0 "Поражение в Зимней войне с Советским Союзом потрясло Финляндию. СССР продолжает давить на неё новыми требованиями.\n\nМы можем тайно связаться с ближайшим окружением финского правительства и предложить присоединиться к нашей предстоящей войне против Советского Союза."
 EAI_DM.24.o1:0 "Связаться с финским руководством"
 EAI_DM.24.o2:0 "Они нам не нужны"
 EAI_DM.24.t:0 "Операция «Барбаросса»"
 EAI_DM.25.d:0 "Германское правительство тайно связалось с нашим руководством. Немцы планируют вторгнуться в Советский Союз и приглашают нас присоединиться."
 EAI_DM.25.o1:0 "Принимать"
 EAI_DM.25.o2:0 "Отклонить"
 EAI_DM.25.t:0 "Операция «Барбаросса»"
 EAI_DM.26.d:0 "Финское правительство согласилось вступить в нашу войну."
 EAI_DM.26.o1:0 "Понятно"
 EAI_DM.26.t:0 "Операция «Барбаросса»"
 EAI_DM.27.d:0 "Финское правительство отказалось вступать в нашу войну."
 EAI_DM.27.t:0 "Операция «Барбаросса»"
 EAI_DM.58.d:0 "Наше руководство в Риме предлагает создать новую колонию — Итальянскую Восточную Африку, объединив три владения на Африканском Роге: Итальянскую Эритрею, Итальянскую Эфиопию и Итальянское Сомали. Вице-королём предлагается назначить героя Эфиопской войны Пьетро Бадольо."
 EAI_DM.58.o1:0 "Подготовить конституцию."
 EAI_DM.58.o2:0 "Оставить под нашим строгим управлением."
 EAI_DM.58.t:0 "Итальянская Восточная Африка"
 EAI_DM_AA.10000.d:0 "Агрессия [EAI_illegal_wargoal_invader.GetNameDef] против [EAI_illegal_wargoal_target.GetName] вызвала реакцию других стран, обеспокоенных своей безопасностью и стабильностью региона. У [EAI_illegal_wargoal_invader.GetNameDef] есть семь дней, чтобы прекратить враждебные действия против [EAI_illegal_wargoal_target.GetName].\n\nИгнорирование предупреждения испортит будущие дипломатические отношения и может привести к вмешательству в поддержку [EAI_illegal_wargoal_target.GetName]."
 EAI_DM_AA.10000.d.tt:0 "§RОтмените оправдание войны против [EAI_illegal_wargoal_target.GetName] в течение 7 дней, иначе другие страны могут поддержать [EAI_illegal_wargoal_target.GetName] гарантиями, ленд-лизом, добровольцами и ухудшением отношений с вами.§!\n\n"
 EAI_DM_AA.10000.o1:0 "Понятно."
 EAI_DM_AA.10000.t:0 "Предупреждение государству [EAI_illegal_wargoal_invader.GetName]"
