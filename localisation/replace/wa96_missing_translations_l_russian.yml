 EAI_config_ARMY_L3_text:0 "Тип бронетехники"
 EAI_config_ARMY_L3_tt:0 "§LОпределяет основной тип танков страны. Противотанковый приоритет вместо этого сосредотачивает её на противотанковых дивизиях.\n\nПри выборе средних или тяжёлых танков противотанковые дивизии используют соответственно средние или тяжёлые истребители танков.§!"
 EAI_config_ARMY_L3_tt2:0 "§RПриоритет средних/тяжёлых танков несовместим с приоритетом дополнительных средних/тяжёлых танковых частей.§!"
 EAI_config_ARMY_L3a_text:0 "Средние танки"
 EAI_config_ARMY_L3b_text:0 "Тяжёлые танки"
 EAI_config_ARMY_L3c_text:0 "Противотанковые войска"
 EAI_config_ARMY_L4-_text:0 "-"
 EAI_config_ARMY_L4_dropdown_text:0 "[EAI_GetArmorDesign]"
