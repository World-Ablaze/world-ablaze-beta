 targeted_sabotage_immobilize_rolling_stock_outcome:0 "Группа проникла в железнодорожное депо и повредила несколько машин. Неисправности проявятся через несколько километров, оставив их на перегоне."
 targeted_sabotage_organize_more_meetings_outcome:0 "Агент внедрился в среднее руководство компании и решительно перестроил процессы ради синергии и взаимодействия с ключевыми заинтересованными сторонами. Производительность резко упала."
 toolpack_fake_mp_condition_tt:0 "Не:\nЛюбая страна:\nКонтролирует\nНе управляется ИИ"
 train_equipment_4_desc:0 "Паровоз заключён в тяжёлую броню для защиты от атак противника. Перевозит столько же груза, сколько другие модели, но дороже в производстве.\n§OСохраняет часть эффективности производства предыдущей модели§!"
 unpopular_statesman:0 "Непопулярный государственный деятель"
 usa_armor.1002.a:0 "Демократы. Рузвельт незаменим."
 usa_armor.1002.d:0 "С момента учреждения президентской должности в США никто не занимал её три срока подряд. Однако из-за нестабильной мировой обстановки и международных событий последних лет президент Рузвельт решил нарушить традицию и баллотироваться в третий раз. Республиканец Уэнделл Уилки — неожиданный кандидат, промышленник с небольшим политическим опытом — критикует экономическое вмешательство Рузвельта и его оправдания третьего срока, особенно резко осуждая принятие судебной реформы.\n\nХотя внешнеполитические взгляды кандидатов во многом совпадают и Уилки готов сохранить определённую форму «Нового курса», многие считают эти выборы решающими для будущего американской демократии."
 usa_armor.1002.t:0 "Выборы 1940 года"
 usa_light_carrier_hull_1_desc:0 "§YМожно переоборудовать через решение§!\nНеплохой лёгкий авианосец для сопровождения в условиях слабого противодействия из-за малого запаса прочности"
 usa_light_carrier_hull_2_desc:0 "Единственное улучшение по сравнению с «Лонг-Айлендом» — наличие ПВО. Поэтому ему следует поручать только несложные задачи."
 usa_light_carrier_hull_3_desc:0 "Первый лёгкий авианосец США, способный участвовать в напряжённых боях благодаря повышенным скорости, прочности и дальности, а также очень сильному зенитному вооружению."
 usa_light_carrier_hull_4_desc:0 "Настоящий преемник «Индепенденса»: «Сайпан» обладает большей прочностью, вмещает больше самолётов и имеет ещё более сильную ПВО."
 usa_light_carrier_hull_5_desc:0 "«Касабланка» жертвует скоростью и прочностью ради снижения стоимости, сохраняя очень сильную ПВО."
