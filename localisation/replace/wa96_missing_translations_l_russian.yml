 NOR_destroyer_3_desc:0 "Два «Олесунна» заложены в 1939 году, но не завершены до немецкой оккупации. Первые норвежские эсминцы размеров великих держав: более 1200 тонн, четыре 120-мм/40 Bofors и четыре 533-мм аппарата."
 NOR_submarine_4_desc:0 "Четыре «Утсира» — британские «Вампиры» 1943–1944 годов; до конца войны норвежскому флоту в изгнании передали лишь одну. Умеренное развитие U: 545 тонн, четыре 533-мм аппарата, глубина 90 метров."
