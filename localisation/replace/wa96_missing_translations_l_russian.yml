 ENG_destroyer_1_desc:0 "Эсминцы типов V и W проектов Адмиралтейства и Торникрофта строились по чрезвычайной военной программе и стали вершиной британского эсминцестроения Первой мировой. Объединив прежние улучшения и новые технологии, многочисленные корабли поздней постройки составили основу послевоенных флотилий. С 1930-х их выводили в резерв и постепенно переводили на сопровождение конвоев. Они имели достаточное вооружение, высокую скорость и хорошую дальность."
