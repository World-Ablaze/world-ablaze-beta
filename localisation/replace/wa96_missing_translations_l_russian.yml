 EAI_config_ARMY_L5_text:0 "Дополнительные части"
 EAI_config_ARMY_L5_tt:0 "§LДополнительные части — тип дивизий, который страна строит в меньших количествах, чем основные пехотные, танковые и противотанковые силы.\n\nПри противотанковом приоритете выбор влияет на состав противотанковых дивизий.\n\nДополнительные средние или тяжёлые танковые части задают использование соответствующих истребителей танков.\n\nМоторизованные или лёгкие танковые части задают использование обычных линейных противотанковых бригад.§!"
 EAI_config_ARMY_L5_tt2:0 "§RПриоритет дополнительных средних/тяжёлых танковых частей несовместим с основным приоритетом средних/тяжёлых танков.§!"
