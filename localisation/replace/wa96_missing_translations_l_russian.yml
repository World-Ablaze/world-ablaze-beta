 EAI_config_country_list_title_text:0 "Список стран"
 EAI_config_custom_bonus_eq_modifier_text:0 "Динамическое снижение стоимости снаряжения"
 EAI_config_custom_bonus_off:0 "§H-§!"
 EAI_config_custom_bonus_text:0 "§YНастроить§!"
 EAI_config_custom_bonus_tt:0 "Настроить модификаторы бонусов сложности. Для большинства модификаторов 0,01 означает изменение на 1%.\n\n§R-------------- ВНИМАНИЕ! --------------§!\n\n§YНекоторые модификаторы ломают работу страны при суммарном значении -100%, включая другие игровые источники: например, снабжение, расход топлива и время подготовки.\n\nДля непонятных вам модификаторов придерживайтесь диапазона от -50% до 0%.§!"
 EAI_config_exit_text:0 "Выход"
 EAI_config_global_mode_text:0 "§YОбщая настройка§!"
 EAI_config_global_mode_tt:0 "Включить режим общей настройки.\n\nДобавьте нужные страны в список. Параметры сложности, выбранные в этом режиме, будут применяться ко всем странам списка.\n\n§RИзменения, сделанные до добавления стран в список, не применяются ко всем странам.§!"
