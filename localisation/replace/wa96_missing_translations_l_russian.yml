 EAI_config_ARMY_L2_text:0 "Состав пехоты"
 EAI_config_ARMY_L2_tt:0 "§LОпределяет состав основных пехотных, морских и горнострелковых дивизий страны. Не относится ко всем типам: например, противотанковым и пехоте шириной 10.\n\n— Оборона: без артиллерии в линейной пехоте.\n\n— Баланс: состав 7/2, 9/3 или 14/4.\n\n— Наступление: состав 4/4, 6/5 или 10/7.§!"
 EAI_config_ARMY_L2a_text:0 "Оборона"
