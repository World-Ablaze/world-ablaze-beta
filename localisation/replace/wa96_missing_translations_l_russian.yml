 CAT_CHARACTERS:0 "§HРазрешить передачу руководителей стран, командующих армией и флотом, а также советников. Доступно только при аннексии. Большинство советников не будет доступно другим странам: для оптимизации они работают только в определённых странах.\nОсобенно полезно при гражданских войнах и разделе стран после мирных конференций.§!"
 CHI_expand_guerilla_warfare:0 "Расширить партизанскую войну в регионе [FROM.GetName]"
