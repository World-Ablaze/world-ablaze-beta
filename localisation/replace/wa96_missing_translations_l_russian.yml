 hun_scout_car_equipment_4_desc:0 "Амфибийная разведывательная машина, способная двигаться на высокой скорости, D-442 FUG обеспечивает эффективную активную разведку. Стоимость его производства значительно выше, чем у 39M Csaba, но он все равно достаточно дешев в производстве."
