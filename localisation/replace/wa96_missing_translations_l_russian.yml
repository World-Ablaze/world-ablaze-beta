 EAI_config_ARMY_window_headline:0 "[EAI_GetArmyConfigCountryTarget]"
 EAI_config_COUNTRY_1_headline:0 "Бонус"
 EAI_config_COUNTRY_1_tt:0 "Эта страна получает постоянный бонус."
 EAI_config_COUNTRY_1a_text:0 "Выкл."
 EAI_config_COUNTRY_1b_text:0 "§OСложный§!"
 EAI_config_COUNTRY_1b_tt:0 "§YБонус: высокий§!\n\n§LНажмите кнопку настройки, чтобы увидеть точные модификаторы.§!"
 EAI_config_COUNTRY_1c_text:0 "Очень высокая"
 EAI_config_COUNTRY_1c_tt:0 "§YБонус: очень высокий§!\n\n§LНажмите кнопку настройки, чтобы увидеть точные модификаторы.§!"
 EAI_config_COUNTRY_1d_text:0 "Безумная"
 EAI_config_COUNTRY_1d_tt:0 "§YБонус: безумный§!\n\n§LНажмите кнопку настройки, чтобы увидеть точные модификаторы.§!"
 EAI_config_COUNTRY_2_headline:0 "Отчаянная оборона"
 EAI_config_COUNTRY_2_tt:0 "Эта страна получает растущий бонус по мере приближения к капитуляции."
 EAI_config_COUNTRY_2a_text:0 "Выкл."
 EAI_config_COUNTRY_2b_text:0 "Низкое"
 EAI_config_COUNTRY_2b_tt:0 "§YОтчаянная оборона: слабая\n\nМинимальные бонусы (прогресс капитуляции >0%):§!\n\n§L— Время подготовки дивизий: -60%\n— Выпуск верфей: +5%\n— Прирост эффективности производства: +10%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения немного снижается.§!\n\n§YМаксимальные бонусы (прогресс капитуляции >90%):§!\n\n§L— Время подготовки дивизий: -69%\n— Выпуск верфей: +50%\n— Прирост эффективности производства: +100%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения умеренно снижается.§!"
 EAI_config_COUNTRY_2c_text:0 "Средн."
 EAI_config_COUNTRY_2c_tt:0 "§YОтчаянная оборона: средняя\n\nМинимальные бонусы (прогресс капитуляции >0%):§!\n\n§L— Время подготовки дивизий: -60%\n— Выпуск верфей: +5%\n— Прирост эффективности производства: +10%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения немного снижается.§!\n\n§YМаксимальные бонусы (прогресс капитуляции >50%):§!\n\n§L— Время подготовки дивизий: -80%\n— Выпуск верфей: +100%\n— Прирост эффективности производства: +200%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения значительно снижается.§!"
 EAI_config_COUNTRY_2d_text:0 "Высокое"
 EAI_config_COUNTRY_2d_tt:0 "§YОтчаянная оборона: сильная\n\nМинимальные бонусы (прогресс капитуляции >0%):§!\n\n§L— Время подготовки дивизий: -69%\n— Выпуск верфей: +50%\n— Прирост эффективности производства: +100%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения умеренно снижается.§!\n\n§YМаксимальные бонусы (прогресс капитуляции >50%):§!\n\n§L— Время подготовки дивизий: -80%\n— Выпуск верфей: +100%\n— Прирост эффективности производства: +200%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения значительно снижается.§!"
 EAI_config_COUNTRY_3_headline:0 "Подкрепления [EAI_GetReinforcements]"
 EAI_config_COUNTRY_3_tt:0 "Эта страна может получать бесплатные дивизии и снаряжение, когда проигрывает. Подкрепления прибывают примерно ежемесячно, пока страна соответствует условиям.\n\nОбщее число доступных дивизий зависит от размера страны. Они по возможности появляются за действующим фронтом, вне поля зрения противника.\n\nСнаряжение выдаётся только в категориях сухопутного вооружения, где у ИИ есть нехватка.\n\n§YСоздано дивизий: [?Root.EAI_dd_unit_count]§!"
 EAI_config_COUNTRY_6_headline:0 "Ускорить планирование и окапывание"
 EAI_config_COUNTRY_6_tt:0 "+100% к скорости планирования и окапывания."
 EAI_config_COUNTRY_exit_text:0 "Выход"
 EAI_config_COUNTRY_window_desc:0 "§YВключение этих параметров отключает соответствующие динамические версии для данной страны. Чтобы запретить динамический параметр для неё, выберите «Выкл.».§!"
