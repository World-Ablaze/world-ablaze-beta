 BRA_destroyer_1_desc:0 "«Мараньян» — британский эсминец K, проданный Бразилии в 1922 году. Чуть более 930 тонн, четыре 4-дюймовых орудия."
 BRA_destroyer_2_desc:0 "Бразилия заказала в Британии шесть эсминцев H «Журуэна» в конце 1930-х, но с началом войны в 1939 году британцы их реквизировали. Более 1300 тонн, хорошая скорость, три 4,7-дюймовые QF Mk IX и восемь 533-мм аппаратов."
