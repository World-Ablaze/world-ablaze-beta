 frontline_support_desc:0 "Наши крупнокалиберные зенитные орудия оказались весьма эффективны против хорошо бронированных целей. Со специальными боеприпасами они превзойдут большинство современных противотанковых пушек. Однако это снизит их эффективность против вражеской авиации."
