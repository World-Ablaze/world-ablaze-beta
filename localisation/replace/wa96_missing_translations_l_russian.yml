 JAP_expand_the_nakajima_aircraft_company_desc_alt:0 "Самолёты Накадзимы пользуются большой поддержкой армии, однако следует национализировать его компанию, прежде чем она приобретёт чрезмерное влияние."
 JAP_expand_the_nakajima_aircraft_company_desc_default:0 "Самолёты Накадзимы пользуются большой поддержкой армии, а его компания уже имеет несколько заводов на Хонсю. Официальная государственная поддержка позволит быстро расширить компанию и наладить массовый выпуск самолётов."
 JAP_expand_the_nakajima_aircraft_company_name_alt:0 "Национализировать авиастроительную компанию Nakajima"
 JAP_expand_the_nakajima_aircraft_company_name_default:0 "Расширить авиастроительную компанию Nakajima"
 JAP_guide_the_zaibatsus:0 "Направить деятельность четырёх крупнейших дзайбацу"
 JAP_guide_the_zaibatsus_desc:0 "«Большая четвёрка» давно обладает беспрецедентной политической и экономической властью. Проявив такт, мы сможем направить её усилия в свою пользу."
 JAP_heavy_cruiser_1:0 "Тип «Furutaka»"
 JAP_heavy_cruiser_3:0 "Тип «Tone»"
 JAP_heavy_cruiser_4:0 "Тип «Ibuki»"
 JAP_invest_in_the_zaibatsus_desc_alt:0 "«Большая четвёрка» национализирована, но семьи бывших дзайбацу по-прежнему располагают огромными личными состояниями. Их конфискация позволит финансировать инфраструктуру и войну в Китае."
 JAP_invest_in_the_zaibatsus_desc_default:0 "К лучшему или худшему, «Большая четвёрка» господствует в нашей экономике. Для улучшения экономического положения и получения поддержки её руководителей следует обеспечить им выгодные контракты в важных для нас отраслях."
 JAP_invest_in_the_zaibatsus_name_alt:0 "Конфисковать богатства семей дзайбацу"
 JAP_invest_in_the_zaibatsus_name_default:0 "Инвестировать в дзайбацу"
 JAP_invest_in_toyota_car_manufacturing_desc_alt:0 "Toyota — крупнейший автопроизводитель нашей империи. Компания слишком долго контролировала отрасль: национализация позволит направлять производство в соответствии с нашими нуждами."
 JAP_invest_in_toyota_car_manufacturing_desc_default:0 "Toyota — крупнейший автопроизводитель нашей империи. Используя её технические возможности и армейский спрос, а также запретив импорт иностранных автомобилей, например Ford и GM, мы значительно расширим отечественное автомобилестроение."
 JAP_invest_in_toyota_car_manufacturing_name_alt:0 "Национализировать Toyota"
 JAP_invest_in_toyota_car_manufacturing_name_default:0 "Инвестировать в автомобилестроение Toyota"
 JAP_j2m3_airframe:0 "Mitsubishi J2M3 `Raiden`"
 JAP_j2m3_airframe_short:0 "J2M3 `Raiden`"
 JAP_light_cruiser_1:0 "Тип «Tenryu»"
 JAP_light_cruiser_3:0 "Тип «Agano»"
 JAP_national_defence_state_desc:0 "Только полностью мобилизовав государственный аппарат, мы сможем победить наших врагов в Восточной Азии. Мы должны обратить на войну все имеющиеся отрасли промышленности и аналогичным образом использовать наши колониальные владения."
 JAP_national_service_draft_ordinance_desc:0 "Мы должны ограничить дивиденды акционеров, поставив выдачу дивидендов под контроль государства, и тогда мы сможем выкачивать богатство из Дзайбацу."
 JAP_nationalize_the_zaibatsus:0 "Национализировать четыре крупнейших дзайбацу"
 JAP_nationalize_the_zaibatsus_desc:0 "«Большая четвёрка» давно обладает беспрецедентной политической и экономической властью. Пора положить этому конец. Государственный контроль не подлежит оспариванию."
 JAP_new_furukawa_contracts_desc_alt:0 "Furukawa — крупнейшая горнодобывающая и сырьевая компания Японии. Государственный контроль позволит увеличивать добычу везде, где мы сочтём необходимым."
 JAP_new_furukawa_contracts_desc_default:0 "Furukawa — крупнейшая горнодобывающая и сырьевая компания Японии. Контракты на расширение добычи на Японских островах и в колониях повысят эффективность разработки ресурсов и обеспечат лояльность компании."
 JAP_new_furukawa_contracts_name_alt:0 "Национализировать Furukawa"
 JAP_new_furukawa_contracts_name_default:0 "Новые контракты Furukawa"
