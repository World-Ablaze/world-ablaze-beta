 eng_light_carrier_hull_6_desc:0 "Следующий шаг в развитии эскортных авианосцев: «Колоссус» существенно превосходит «Юникорн» во всех отношениях."
 eng_light_carrier_hull_7_desc:0 "Ещё одно значительное усовершенствование эскортных авианосцев. «Сентаур» — один из лучших лёгких авианосцев."
