 tank_fin_light_chassis_infantry_support_1_desc:0 "Орудие поддержки пехоты\nБТ-7арт оснащён 76-мм пушкой КТ, весьма эффективной против пехоты. Для её размещения башню исходной модели пришлось значительно увеличить. Дополнительная масса существенно снижает скорость — главное достоинство семейства БТ. Как и большинство штурмовых орудий, машина обладает высокой противопехотной атакой, но уступает в прорыве."
