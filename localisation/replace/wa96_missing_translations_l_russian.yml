 EAI_config_ARMY_air_category_headline:0 "Воздушные силы"
 EAI_config_ARMY_cancel_text:0 "Отмена"
 EAI_config_ARMY_cancel_tt:0 "Отменить изменения военных приоритетов страны."
 EAI_config_ARMY_confirm_text:0 "Подтвердить"
 EAI_config_ARMY_confirm_tt:0 "Подтвердить изменения военных приоритетов страны."
 EAI_config_ARMY_exit_text:0 "Выход"
 EAI_config_ARMY_exit_tt:0 "Выйти из военных настроек."
 EAI_config_ARMY_help_tt:0 "Военные приоритеты ИИ\n\nВ этом моде ИИ строит вооружённые силы в соответствии со своими военными приоритетами. В начале игры они ещё не выбраны: обычно ИИ определяет их в первый месяц после снятия паузы. Они задают исследования, состав дивизий, варианты техники и проекты кораблей, объёмы производства и многое другое.\n\nНа этом экране показаны выбранные приоритеты, если в общих настройках не включён режим общей настройки. Их можно редактировать в любой момент, кроме периода настройки самим ИИ; при первом выборе он может длиться до месяца. ИИ не начнёт настройку, пока открыто окно настройки его страны.\n\nНазначенные вами вручную приоритеты ИИ менять не будет. Остальные он может пересматривать по ходу игры. Его собственный выбор зависит от общего режима военных приоритетов."
 EAI_config_ARMY_land_category_headline:0 "Сухопутные войска"
 EAI_config_ARMY_navy_category_headline:0 "Флот"
 EAI_config_ARMY_reconfigure_text:0 "Изменить"
 EAI_config_ARMY_reconfigure_tt:0 "Изменить военные приоритеты выбранной страны."
 EAI_config_ARMY_reconfigure_tt_DIPLOMATIC:0 "Изменить военное производство страны [?EAI_configuration_target.GetName]. Требует [?EAI_config_cp_cost] командного ресурса."
 EAI_config_ARMY_reset_text:0 "Сбросить"
