 tank_ita_medium_chassis_spg_2_desc:0 "Semovente da 149 — полностью незащищённая самоходная артиллерийская установка. Практическое отсутствие брони позволило установить очень мощное орудие. По чистой огневой мощи это один из немногих итальянских проектов, которые можно назвать удачными."
