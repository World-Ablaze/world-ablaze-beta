 EAI_config_DIFFICULTY_2d_tt:0 "§YОтчаянная оборона: сильная\n\nМинимальные бонусы (прогресс капитуляции >0%):§!\n\n§L— Время подготовки дивизий: -69%\n— Выпуск верфей: +50%\n— Прирост эффективности производства: +100%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения умеренно снижается.§!\n\n§YМаксимальные бонусы (прогресс капитуляции >50%):§!\n\n§L— Время подготовки дивизий: -80%\n— Выпуск верфей: +100%\n— Прирост эффективности производства: +200%\n\nКроме того, стоимость недостающего сухопутного и авиационного снаряжения значительно снижается.§!"
 EAI_config_DIFFICULTY_3_headline:0 "Динамические подкрепления [EAI_GetReinforcementsGlobal]"
 EAI_config_DIFFICULTY_3_tt:0 "Воюющие с игроком страны ИИ могут получать бесплатные дивизии и снаряжение, когда проигрывают. Подкрепления прибывают примерно ежемесячно, пока страна соответствует условиям.\n\nОбщее число доступных дивизий зависит от размера страны. Они по возможности появляются за действующим фронтом, вне вашего поля зрения.\n\nСнаряжение выдаётся только в тех категориях сухопутного вооружения, где у ИИ есть нехватка.\n\n§YВсего создано дивизий в этой игре: [?Global.EAI_global_dd_unit_count]§!\n\n§RДля отдельных стран настройку можно отключить или переопределить через настройки страны.§!"
 EAI_config_DIFFICULTY_4_headline:0 "Снижение истощения ИИ"
 EAI_config_DIFFICULTY_4_tt:0 "Страны ИИ несут меньше потерь от истощения."
 EAI_config_DIFFICULTY_4a_text:0 "Выкл."
 EAI_config_DIFFICULTY_4b_text:0 "-25%"
 EAI_config_DIFFICULTY_4c_text:0 "-50%"
 EAI_config_DIFFICULTY_4d_text:0 "-75%"
 EAI_config_DIFFICULTY_5_headline:0 "Бесплатные конвои ИИ"
 EAI_config_DIFFICULTY_5_tt:0 "Страны ИИ ежемесячно получают бесплатные конвои, если у них доступно менее 50 конвоев."
 EAI_config_DIFFICULTY_6_headline:0 "Ускорить планирование и окапывание"
 EAI_config_DIFFICULTY_6_tt:0 "+100% к скорости планирования и окапывания (динамически)."
 EAI_config_DIFFICULTY_other_headline:0 "Прочее"
 EAI_config_DIFFUCULTY_help_1_tt:0 "Руководство по сложности (страница 1/3)\n\n§LПочему в моде так много параметров сложности? У ИИ есть ряд конкретных недостатков, которые нужно компенсировать для равной игры, если вы хорошо играете, особенно за великую державу. Кроме того, одни настройки могут казаться вам правдоподобнее других.\n\nЧто такое§! §Yдинамические§! §Lнастройки? Мод выдаёт бонусы в зависимости от хода игры, а не постоянно всем странам ИИ. Динамические параметры действуют для стран ИИ, воюющих с игроком и находящихся рядом с ним или его союзниками.§! §YИндивидуальные§! §Lпараметры страны, напротив, действуют постоянно независимо от того, сражается ИИ с игроком или другим ИИ.\n\nЧто означает§! §Y«Бонус»§! §Lи чем он отличается от стандартных ползунков усиления? Он главным образом усиливает промышленность ИИ, компенсируя огромные потери снаряжения в войнах. Главная часть — гораздо более сильное снижение стоимости недостающего сухопутного и авиационного снаряжения, чем дают ползунки. ИИ легче производит действительно необходимое, но не накапливает неправдоподобные запасы ненужного.\n\nЧто такое§! §Y«Отчаянная оборона»§!§L? Эта настройка постепенно усиливает ИИ при приближении к капитуляции, повышая производство снаряжения и сокращая подготовку дивизий. Как и «Бонус», она повышает выпуск именно дефицитного снаряжения.§!"
 EAI_config_DIFFUCULTY_help_2_tt:0 "Руководство по сложности (страница 2/3)\n\n§Y«Бонус» или «Отчаянная оборона»?§! §LМожно включить один параметр или оба. Главное отличие: «Бонус» действует постоянно, а «Отчаянная оборона» — только когда ИИ обороняется. Снижение стоимости снаряжения не суммируется: используется наибольший из двух модификаторов.\n\nЧто такое§! §Y«Подкрепления»§!§L? ИИ получает и снаряжение, И дивизии, а не просто бонусы. Это более радикальная настройка сложности, чем предыдущие; используйте её, только если остальных недостаточно.§!"
 EAI_config_DIFFUCULTY_help_3_tt:0 "Руководство по сложности (страница 3/3)\n\n§LЗачем ИИ§! §Yбесплатные конвои§!§L? Его конвои легко уничтожить до такой степени, что он перестанет действовать, не имея возможности даже перевезти войска туда, где они нужны.\n\nЗачем§! §Yуменьшать истощение ИИ§!§L? ИИ не учитывает, что держит дивизии в горах или болотах, а постоянные переброски приводят к огромным потерям от истощения.§!"
 EAI_config_DIFFUCULTY_help_tt:0 "[EAI_GetDifficultyHelpPage]"
 EAI_config_GENERAL_10_text:0 "Марионеточный Египет"
 EAI_config_GENERAL_10_tt:0 "Обходное решение проблемы, когда британский ИИ не защищает Египет. Помогает избежать слишком раннего краха североафриканского театра."
 EAI_config_GENERAL_11_text:0 "Ось: не вторгаться в Норвегию"
 EAI_config_GENERAL_11_tt:0 "Запретить ИИ Оси вторжение в Норвегию, которое часто создаёт ему проблемы. Также запрещает вступление Финляндии в Ось, позволяя Германии и СССР полностью сосредоточиться на главном фронте."
 EAI_config_GENERAL_12_text:0 "Нейтральная Южная Америка"
 EAI_config_GENERAL_12_tt:0 "Не допускать вступления южноамериканских стран в войну через дипломатические скрипты этого мода; другие причины вступления не затрагиваются."
 EAI_config_GENERAL_13_dropdown_text:0 "Японо-китайская война: [EAI_GetSinoJapaneseWarSetting]"
 EAI_config_GENERAL_13_tt:0 "Определяет ход японо-китайской войны между странами ИИ при отсутствии других бонусов и значительного вмешательства игрока.\n\n— В пользу Японии: поведение Китая ограничено, чтобы Япония продвигалась и стала более сильным противником на Тихом океане.\n\n— В пользу Китая (обычное поведение ИИ): Китай действует против Японии в полную силу. §YНи одна сторона не получает специальных ограничений поведения.§!\n\n— Позиционный тупик: в начале Китай ограничен ради продвижения Японии. Позже ограничения Китая снимаются, а Япония становится пассивнее на этом фронте.\n\nПримечание: действует только в войне ИИ против ИИ. При вмешательстве игрока, атакующего ослабленную страну, ИИ может действовать в полную силу; иногда это относится только к игроку за великую державу."
 EAI_config_GENERAL_13a_text:0 "В пользу Японии"
 EAI_config_GENERAL_13b_text:0 "В пользу Китая"
 EAI_config_GENERAL_13c_text:0 "Позиционный тупик"
 EAI_config_GENERAL_14_dropdown_text:0 "Восточный фронт: [EAI_GetEasternFrontSetting]"
 EAI_config_GENERAL_14_tt:0 "Определяет ход войны на Восточном фронте между странами ИИ при отсутствии других бонусов и значительного вмешательства игрока.\n\n— В пользу Германии: поведение СССР на фронте ограничено, чтобы Германия быстро продвинулась в начале войны, после чего СССР пытается собраться и остановить вторжение. \n\n— В пользу СССР (обычное поведение ИИ): СССР действует против Оси в полную силу. §YНи одна сторона не получает специальных ограничений поведения.§! \n\nПримечание: действует только в войне ИИ против ИИ. При вмешательстве игрока, атакующего ослабленную страну, ИИ может действовать в полную силу; иногда это относится только к игроку за великую державу."
 EAI_config_GENERAL_14a_text:0 "В пользу Германии"
 EAI_config_GENERAL_14b_text:0 "В пользу СССР"
 EAI_config_GENERAL_1_dropdown_text:0 "Военные приоритеты ИИ: [EAI_GetAIFocuses]"
 EAI_config_GENERAL_1_text:0 "Военные приоритеты ИИ"
 EAI_config_GENERAL_1_tt:0 "Определяет типы сухопутных войск, кораблей и самолётов, которые исследует и строит ИИ.\n\n§YИзменение после начала игры мало повлияет на результат. Однако приоритеты отдельной страны можно перенастроить в её настройках.§!"
 EAI_config_GENERAL_1a_text:0 "Обычно"
 EAI_config_GENERAL_1a_tt:0 "§YОбычный:§! стандартный режим. ИИ слабее оптимизирует характеристики, чем в режиме испытания, зато свободнее выбирает стратегии в каждой партии и не всегда использует наиболее эффективные шаблоны."
 EAI_config_GENERAL_1b_text:0 "Испытание"
 EAI_config_GENERAL_1b_tt:0 "§YИспытание:§! ИИ выбирает наиболее эффективные варианты вместо разнообразия: пехоту шириной 40, сильные доктрины и меньше типов шаблонов, самолётов и кораблей для сосредоточения исследований и опыта."
 EAI_config_GENERAL_1c_text:0 "Историч."
 EAI_config_GENERAL_1c_tt:0 "§YИсторический:§! ИИ избегает оптимизированных стратегий вроде дивизий шириной 40 и создаёт более историчные и предсказуемые войска, особенно у великих держав. Полной исторической точности ожидать не следует."
 EAI_config_GENERAL_1d_text:0 "Случайно"
 EAI_config_GENERAL_1d_tt:0 "§YСлучайный:§! возможно всё. Для тех, кто хочет, чтобы ИИ удивлял."
 EAI_config_GENERAL_2_text:0 "Дипломатия ИИ против агрессии"
 EAI_config_GENERAL_2_tt:0 "ИИ реагирует на «незаконные» оправдания и объявления войн: без национальных территорий или претензий, не вызванные событием или фокусом.\n\nВ зависимости от мировой напряжённости и доступных дипломатических действий реакция включает гарантии, добровольцев и ленд-лиз жертве нападения, ухудшение отношений с агрессором и упреждающее вступление в альянсы при угрозе из-за войн с соседями.\n\nЭтого можно избежать пактами о ненападении или поддержанием хороших отношений с соседними странами."
 EAI_config_GENERAL_3_text:0 "Улучшенная логика ленд-лиза ИИ"
 EAI_config_GENERAL_3_tt:0 "Значительно повышает готовность ИИ отправлять ленд-лиз в зависимости от обстоятельств.\n\nЭто может заметно усложнить игру: ИИ помогает странам с нехваткой снаряжения, особенно союзникам; например, союзники могут снабжать СССР."
 EAI_config_GENERAL_4_text:0 "Ограничить исследования малых стран"
 EAI_config_GENERAL_4_tt:0 "Начальное число исследовательских ячеек всех малых стран сокращается до 1."
 EAI_config_GENERAL_5_text:0 "Режим производительности"
 EAI_config_GENERAL_5_tt:0 "— Запрещает второстепенным малым странам создавать дивизии в мирное время. Исключения: Содружество, китайские милитаристы и значимые малые европейские страны. США также ограничены более историчной численностью. Это облегчает неисторические завоевания.\n\n— Снижает частоту обновления скриптового ИИ этого мода."
 EAI_config_GENERAL_6_text:0 "Нейтральная Испания"
 EAI_config_GENERAL_6_tt:0 "Испания не вступает в альянсы. Некоторые обстоятельства, например падение Германии или СССР, могут это изменить."
 EAI_config_GENERAL_7_text:0 "Агрессивная Германия"
 EAI_config_GENERAL_7_tt:0 "Германия агрессивнее захватывает Европу: забирает территории себе, пытается сделать Венгрию и Румынию марионетками, не создаёт вишистскую Францию и т. п.\n\n§YРаботает только с историческими фокусами.§!"
 EAI_config_GENERAL_8_dropdown_text:0 "Военная агрессивность: [EAI_GetJustificationAggressiveness]"
 EAI_config_GENERAL_8_text:0 "Военная агрессивность"
 EAI_config_GENERAL_8_tt:0 "Обычно ИИ не оправдывает и не объявляет войны вне национальных фокусов. Эта настройка разрешает фашистским и коммунистическим странам делать это при благоприятной возможности.\n\n§YУровень агрессивности определяет порог мировой напряжённости для оправдания войн и частоту оправданий.\n\n— Низкий: напряжённость 90%\n— Средний: напряжённость 50%\n— Высокий: напряжённость 0%§!"
 EAI_config_GENERAL_8a_text:0 "Выкл."
 EAI_config_GENERAL_8b_text:0 "Низкое"
 EAI_config_GENERAL_8c_text:0 "Средн."
 EAI_config_GENERAL_8d_text:0 "Высокое"
 EAI_config_GENERAL_9_text:0 "Случайные идеологии обычных стран ИИ"
 EAI_config_GENERAL_9_tt:0 "Разрешить странам ИИ со стандартным деревом фокусов случайно выбирать идеологию вместо сохранения начальной. Нейтральные страны чаще переходят к уже популярным идеологиям, а остальные обычно сохраняют нынешнюю.\n\nДля смены правительства они будут отдавать приоритет соответствующим советникам и веткам стандартного дерева фокусов."
 EAI_config_GENERAL_global_army_config_tt:0 "Настроить военные приоритеты для всех стран ИИ, которые сейчас не настраиваются самим ИИ."
 EAI_config_STARTUP_1_dropdown_text:0 "[EAI_GetStartupMode]"
 EAI_config_STARTUP_1_headline:0 "Режим"
 EAI_config_STARTUP_1_tt:0 "Определяет, какие типы сухопутных войск, кораблей и самолётов исследует и строит ИИ."
 EAI_config_STARTUP_1a:0 "Обычно"
 EAI_config_STARTUP_1a_tt:0 "§YРежим: обычный§!\n\n§LСтандартный режим. ИИ слабее оптимизирует характеристики, чем в режиме испытания, зато свободнее выбирает стратегии в каждой партии и не всегда использует наиболее эффективные шаблоны дивизий.§!"
 EAI_config_STARTUP_1b:0 "Испытание"
 EAI_config_STARTUP_1b_tt:0 "§YРежим: испытание§!\n\n§LИИ сосредоточится на наиболее эффективных вариантах. Вместо разнообразия он выбирает результативные стратегии: пехоту шириной 40, сильные доктрины и меньшее число типов шаблонов, самолётов и кораблей, чтобы сосредоточить исследования и расход опыта.§!"
 EAI_config_STARTUP_1c:0 "Историч."
 EAI_config_STARTUP_1c_tt:0 "§YРежим: исторический§!\n\n§LДля тех, кто хочет избежать оптимизированных стратегий вроде дивизий шириной 40 и сделать состав войск ИИ, особенно великих держав, более историчным и предсказуемым. Полной исторической точности ожидать не следует.§!"
 EAI_config_STARTUP_1d:0 "Случайно"
 EAI_config_STARTUP_1d_tt:0 "§YРежим: случайный§!\n\n§LВозможно всё. Для тех, кто хочет, чтобы ИИ удивлял.§!"
 EAI_config_STARTUP_2_dropdown_text:0 "[EAI_GetStartupDifficulty]"
 EAI_config_STARTUP_2_headline:0 "Сложность"
 EAI_config_STARTUP_2_tt:0 "Это готовые наборы, объединяющие несколько параметров сложности. Все они необязательны и составляют лишь небольшую часть мода.\n\nЕсли нужна более высокая сложность, лучше открыть расширенные настройки и усилить конкретные страны."
 EAI_config_STARTUP_2a:0 "§3Легкий§!"
 EAI_config_STARTUP_2a_tt:0 "§YСложность: лёгкая§!\n\n§G— Улучшенная логика ленд-лиза ИИ отключена.§!"
 EAI_config_STARTUP_2b:0 "Обычно"
 EAI_config_STARTUP_2b_tt:0 "§YСложность: обычная§!"
 EAI_config_STARTUP_2c:0 "§OСложный§!"
 EAI_config_STARTUP_2c_tt:0 "§YСложность: высокая§!§R\n\n— Динамическая сложность: вражеские страны рядом с вами или союзниками получают умеренные бонусы.\n\n— Снижение истощения ИИ на 25%.§!"
 EAI_config_STARTUP_2d:0 "Очень высокая"
 EAI_config_STARTUP_2d_tt:0 "§YСложность: очень высокая§!§R\n\n— Динамическая сложность: вражеские страны рядом с вами или союзниками получают умеренные бонусы.\n\n— Динамическая отчаянная оборона: воюющие с вами страны получают растущие бонусы по мере приближения к капитуляции.\n\n— Снижение истощения ИИ на 50%.§!"
 EAI_config_STARTUP_2e:0 "Безумная"
 EAI_config_STARTUP_2e_tt:0 "§YСложность: безумная§!§R\n\n— Динамическая сложность: вражеские страны рядом с вами или союзниками получают большие бонусы.\n\n— Динамическая отчаянная оборона: воюющие с вами страны получают растущие бонусы по мере приближения к капитуляции.\n\n— Снижение истощения ИИ на 75%.§!"
 EAI_config_STARTUP_2f:0 "Невозможная"
 EAI_config_STARTUP_2f_tt:0 "§YСложность: невозможная§!§R\n\n— Динамическая сложность: вражеские страны рядом с вами или союзниками получают огромные бонусы.\n\n— Динамическая отчаянная оборона: воюющие с вами страны получают растущие бонусы по мере приближения к капитуляции.\n\n— Динамические подкрепления: проигрывающие вам страны могут получать бесплатные дивизии и снаряжение.\n\n— Снижение истощения ИИ на 75%.\n\n— Страны ИИ получают бесплатные конвои, когда доступно менее 50.§!"
 EAI_config_STARTUP_advanced_button_text:0 "Расширенные настройки"
 EAI_config_STARTUP_advanced_button_tt:0 ""
 EAI_config_STARTUP_window_desc:0 "§YВыберите общие предпочтения или откройте расширенные настройки для подробной настройки игры. Нажмите «Выход», чтобы играть со стандартными параметрами.\n\nРасширенные настройки позволяют отдельно изменять сложность и поведение ИИ вместо готовых наборов, а также подробнее объясняют функции мода.\n\nЧтобы настроить отдельную страну, выберите её на карте и нажмите CTRL-SHIFT-O, пока это окно открыто.\n\nСочетание CTRL-SHIFT-O открывает расширенные настройки в любой момент игры.§!"
 EAI_config_army_config_button_text:0 "Настроить военные приоритеты"
 EAI_config_category_button1_text:0 "Настройки сложности"
 EAI_config_category_button1_tt:0 "Параметры сложности так или иначе усиливают ИИ. Они рассчитаны на гораздо более сильное воздействие, чем стандартная сложность игры, которую можно использовать для более умеренных бонусов."
 EAI_config_category_button2_text:0 "Общие настройки"
 EAI_config_category_button2_tt:0 "Общие параметры ИИ различными способами меняют его поведение или игровой баланс."
 EAI_config_country_list_add_all_button_text:0 "Добавить все"
 EAI_config_country_list_add_selected_country_button_text:0 "Добавить"
 EAI_config_country_list_clear_all_button_text:0 "Удалить все"
