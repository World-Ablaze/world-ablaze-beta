 ARG_battleship_1_desc:0 "Два дредноута «Ривадавия» построены США для Аргентины в начале 1910-х. 27500 тонн, двенадцать 305-мм/50 орудий. Служили до 1950-х."
 ARG_destroyer_2_desc:0 "«Буэнос-Айрес» строились для Аргентины в Британии в 1936–1938 годах на основе типа G. Более 1300 тонн и четыре 4,7-дюймовые пушки QF Mk IX."
 ARG_light_cruiser_2_desc:0 "Лёгкий крейсер «Ла Аргентина» построен Британией в конце 1930-х. После учебных походов до войны вошёл в действующую эскадру для защиты нейтралитета. Увеличенная «Аретьюза»: 6500 тонн, девять 6-дюймовых орудий."
