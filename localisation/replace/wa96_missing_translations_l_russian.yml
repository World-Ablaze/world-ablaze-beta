 GER_Wehrmacht_the_replacement_army:0 "£faction_ger_wehrmacht £manpower_texticon  Восстановить армию"
 GER_Wehrmacht_the_replacement_army_desc:0 "Отечество зовёт на помощь. Откликнуться должен каждый!"
 GER_a_new_legacy_desc:0 "После разрушительной гражданской войны кайзер Оскар станет олицетворением новой эпохи Германии. Его наследие должно смыть прежние поражения и ошибки."
 GER_acquire_detailed_ss_plans:0 "Получить подробные планы СС"
 GER_acquire_detailed_ss_plans_tt:0 "Изменяет §Gвероятность убийства Гитлера на 30%§!. Изменяет §Gсилу противника в гражданской войне на -20%§!."
 GER_activate_belgium_dockyards:0 "Ввести в строй бельгийские верфи"
 GER_activate_british_dockyards:0 "Ввести в строй британские верфи"
 GER_activate_denmark_dockyards:0 "Ввести в строй датские верфи"
 GER_activate_french_dockyards:0 "Ввести в строй французские верфи"
 GER_activate_netherlands_dockyards:0 "Ввести в строй нидерландские верфи"
 GER_activate_norway_dockyards:0 "Ввести в строй норвежские верфи"
 GER_activate_swedish_dockyards:0 "Ввести в строй шведские верфи"
 GER_alfried_krupp:0 "Альфрид Крупп"
 GER_all_forces_at_all_costs_desc:0 "Чаша весов начинает склоняться не в нашу пользу. Годы войны дают о себе знать, а Советы не показывают слабости. Появилась последняя возможность: нужно ухватиться за неё всеми оставшимися силами, иначе нас поглотят бескрайние просторы!"
 GER_alliance_with_the_benelux_desc:0 "Союз со странами Бенилюкса укрепит наше положение в Европе и создаст преграду французской агрессии."
 GER_an_army_fit_for_a_navy_desc:0 "Союз с Британией позволит совместить наши сильные стороны: её господство на морях общеизвестно. Мы сосредоточимся на усилении армии, чтобы сделать этот союз величайшим в истории."
 GER_attempt_familial_reconcilliation_desc:0 "Британская королевская семья связана с Германией общим ганноверским происхождением. Стремление к партнёрству станет естественным продолжением этих связей."
 GER_barbarossa_idea:0 "Операция «Барбаросса»"
 GER_battleship_1:0 "Тип «Deutschland»"
 GER_battleship_2:0 "Тип «Scharnhorst»"
 GER_battleship_3:0 "Тип «Bismarck»"
 GER_battleship_4:0 "Тип «Hindenburg»"
 GER_bulwark_against_communism_desc:0 "Советский Союз занял воинственную позицию и открыто совершает агрессивные шаги в Европе. Пока только мы обращаем на это внимание, необходимо объединиться с другими государствами и остановить его."
 GER_carrier_3:0 "Тип «Graf Zeppelin»"
 GER_carrier_4:0 "Тип «Europa»"
 GER_colonial_focus_desc:0 "После поражения в Великой войне наши колонии были отняты и разделены между Францией и Англией. Необходимо вновь поднять этот вопрос и заявить свои права."
 GER_croats_demand_independance:0 "Хорваты требуют независимости"
 GER_deal_with_ss_remnants_desc:0 "После смерти Адольфа Гитлера и краха нацистского режима оставшиеся эсэсовцы скрылись по всей Германии. Для защиты её будущего необходимо их выявить."
 GER_denazify_the_armed_forces_desc:0 "Многие офицеры вермахта так или иначе были связаны с нацистским правительством. Чтобы двигаться дальше, необходимо разорвать все связи с прежним режимом."
 GER_denazify_the_bureaucracy_desc:0 "Аналогичную проверку должны пройти члены НСДАП. Любая, даже самая незначительная связь будет выявлена, а причастным запретят занимать официальные должности."
 GER_denazify_the_populace_desc:0 "Теперь, когда угроза НСДАП устранена на всех уровнях, необходимо исправить ущерб, причинённый нацистами народу Германии."
 GER_different_circumstances_desc:0 "Укрепив своё положение, мы заявим права на спорную Эльзас-Лотарингию и вновь включим её в состав страны."
 GER_end_the_southern_threat_desc:0 "Королевство Италия и его фашистское правительство провоцировали, захватывали и уничтожали целые государства. Другие бездействуют и позволяют Италии наращивать силу, но мы этого не допустим."
 GER_engine_junkers_jumo_211a_4x:0 "4 × Junkers Jumo 211A"
 GER_engine_junkers_jumo_211a_4x_desc:0 "$water_cooled_engines_desc$"
 GER_ernst_kaltenbrunner:0 "Эрнст Кальтенбруннер"
 GER_expand_rks:0 "Расширить границы восточных рейхскомиссариатов"
 GER_famine_payments:0 "Испанские поставки продовольствия"
 GER_famine_payments_ukraine:0 "Испанские поставки продовольствия"
 GER_festung_cherbourg:0 "[FRA.GetFlag] Крепость Шербур"
 GER_fritz_sauckel:0 "Фриц Заукель"
 GER_fritz_sauckel_desc:0 "Фриц Заукель был генеральным уполномоченным по использованию рабочей силы в 1942–1945 годах. При нём в Рейх вывезли более 8 миллионов иностранных работников со всех оккупированных территорий."
 GER_fund_heisenberg_desc:0 "Теория предсказывает невиданное абсолютное оружие, способное поставить на колени любую страну. Однако его создание потребует огромных средств и значительного времени."
 GER_fund_research_centres_desc:0 "С отменой расовой несправедливости прежнего правительства выдающиеся представители меньшинств смогут создавать новые исследовательские центры и развивать передовые технологии."
 GER_guarantee_return_of_all_pre_1939_lands:0 "Гарантировать возвращение всех территорий до 1939 года"
 GER_guarantee_return_of_all_pre_1939_lands_tt:0 "Изменяет §Rсилу противника в гражданской войне на 15%§!. Изменяет §Gвероятность заключения мира с союзниками на 20%§!."
 GER_heinrich_muller:0 "Генрих Мюллер"
 GER_immigration_measures_desc:0 "С отменой этнических и расовых ограничений прежнего правительства можно привлечь способных работников из соседних стран. Германия получит новые трудовые ресурсы."
 GER_integrate_spanish_war_economies_desc:0 "Испания наконец вошла в нашу сферу влияния и стала зависеть от германской экономики. Это можно использовать для контроля над её хозяйством и получения ресурсов. Потребуются ответные немецкие вложения, но права на крупное месторождение железной руды уменьшат зависимость от других поставщиков."
 GER_invest_into_the_abwehr_desc:0 "Разведка и способы получения сведений станут важнейшим изменением на поле боя. Чтобы не отстать, необходимо дополнительно инвестировать в нашу службу."
 GER_ju_187_c1_airframe_desc:0 "\n§YСохраняет 90% эффективности производства и допускает переоборудование из семейства $GER_ju_187_airframe$.§!"
 GER_julius_streicher:0 "Юлиус Штрейхер"
 GER_karl_blessing:0 "Карл Блессинг"
 GER_keep_austria_desc:0 "Австрийцы проголосовали за объединение с Германией. Почему же мы должны им отказывать?"
 GER_liberate_belarus_desc:0 "Народ Беларуси неоднократно проявлял стремление к независимости. После завершения войны Беларусь будет освобождена от большевизма."
 GER_liberate_ukraine_desc:0 "Украинский народ достаточно страдал при советском режиме. Нельзя допустить нового Голодомора или каких-либо преследований."
 GER_lift_the_exile_desc:0 "Вильгельм II слишком долго оставался в изгнании. После восшествия кайзера Оскара и восстановления монархии можно организовать его возвращение."
 GER_light_cruiser_1:0 "Тип «Emden»"
 GER_light_cruiser_2:0 "Тип «Leipzig»"
 GER_lost_control_of_belgium_dockyards:0 "Потерян контроль над бельгийскими верфями"
 GER_lost_control_of_british_dockyards:0 "Потерян контроль над британскими верфями"
 GER_lost_control_of_denmark_dockyards:0 "Потерян контроль над датскими верфями"
 GER_lost_control_of_french_dockyards:0 "Потерян контроль над французскими верфями"
 GER_lost_control_of_netherlands_dockyards:0 "Потерян контроль над нидерландскими верфями"
 GER_lost_control_of_norway_dockyards:0 "Потерян контроль над норвежскими верфями"
 GER_lost_control_of_swedish_dockyards:0 "Потерян контроль над шведскими верфями"
 GER_modern_carriers_desc:0 "Мощные линкоры дороги в постройке, а их потеря катастрофична. Будущее, возможно, принадлежит новым кораблям, чья универсальность и способность топить противника с воздуха открывают широкие возможности."
 GER_modern_cruisers_desc:0 "Сильному флоту необходимы способные силы охранения. Хотя эсминцы дешевле, крейсеры лучше защищают ядро флота и способны нести больше необходимого оборудования, что делает их очевидным выбором."
 GER_new_age_of_emperors_desc:0 "Кайзер Оскар — новый участник сообщества правящих монархов Европы. Его положение естественным образом противопоставляет его другим императорам."
 GER_new_industry_culture_desc:0 "Немецкая промышленность теперь принадлежит частному сектору, а не государству. Предприниматели будут конкурировать друг с другом, повышая производительность."
 GER_next_gen_battlecruisers_desc:0 "Возможность проецировать морскую мощь напрямую зависит от сильных крупных кораблей. Огромные исполины, способные выдерживать удары и наносить столь же мощные ответные, необходимы для борьбы с великими морскими державами."
 GER_organize_the_junta_desc:0 "Больше ни один человек не будет единолично править Германией. Отныне решения о её благе будет принимать коллектив высших военных руководителей."
 GER_oskar_acends_the_throne_desc:0 "Принц Оскар, пятый сын кайзера Вильгельма II, — лучший претендент на престол с учётом положения его братьев. Его собственная репутация лишь укрепляет этот выбор."
 GER_ostwall_desc:0 "Несмотря на успехи на Востоке, необходимо подготовиться к отражению противника, если ход войны изменится. Следует построить линию укреплений «Пантера — Вотан» вдоль Днепра от Чёрного моря до Балтики."
 GER_oswald_pohl:0 "Освальд Поль"
 GER_oswald_pohl_desc:0 "Освальд Поль возглавлял Главное административно-хозяйственное управление СС в 1942–1945 годах. Его задачи по увеличению выпуска вооружений и распределению рабочей силы пересекались с обязанностями Альберта Шпеера, что часто вызывало конфликты."
 GER_planned_offensive:0 "Планируемое наступление"
 GER_prussian_officer_corps_desc:0 "Престиж офицеров прусского происхождения сравним лишь со славой героев Великой войны. Поэтому новый совет прусских офицеров будет руководить подготовкой будущего офицерского корпуса."
 GER_rebuild_the_nation_desc:0 "В отчаянной попытке удержать власть нацисты разорили нашу страну. Их варварство обернулось разрушением самой Германии. Необходимо залечить нанесённые раны."
 GER_reich_plenipotentiary_for_total_war_desc:0 "Наша огромная промышленность уже превращается в неудержимую военную машину, но этого недостаточно. Для войны нужно отдать всё — даже больше, чем у нас есть! Геббельс воодушевит народ и призовёт к полной самоотдаче ради спасения Германии от уничтожения с Запада и Востока. Это касается не только немцев, но и всех народов Рейха."
 GER_reintegrate_imperial_territories_desc:0 "Мы вернули земли, когда-то принадлежавшие Германской империи. Новое правительство вновь интегрирует их в страну."
 GER_rekindle_imperial_sentiment_desc:0 "Распространение нашего влияния на бывшие монархии, некогда входившие в Австро-Венгрию, может привести к объединению этих разделённых стран и их благодарности за наши усилия."
 GER_rekindle_ottoman_sentiment_desc:0 "Османская империя была ещё одним союзником, лишившимся императорской власти. Подобно нашим действиям в других регионах, мы можем способствовать возрождению этой старой империи."
 GER_reorganise_the_ministry_of_armaments_desc:0 "Опыт Великой войны и недавней гражданской войны показывает: нельзя упускать из виду отдельные стороны промышленности. Необходимо принять все меры для выполнения производственных планов."
 GER_repatriate_former_nazi_officers_desc:0 "Многие офицеры не выбрали сторону в гражданской войне или были введены в заблуждение. Хотя они подвели Германию в самый трудный час, тех, кто не был тесно связан с нацистским движением, можно простить."
 GER_reprint_the_rentenmark_desc:0 "Рентная марка обеспечена землёй — залогами промышленного и сельскохозяйственного имущества Германии, а не традиционным золотым стандартом. После отказа от рейхсмарки приток средств в рентную марку дополнительно простимулирует промышленность."
 GER_retake_prussian_lands_desc:0 "Пруссия слишком долго была несправедливо отрезана от остальной Германии. Наконец она вновь соединится со страной, как прежде."
 GER_return_austria_desc:0 "Весь процесс объединения был сфальсифицирован с того момента, как НСДАП выдвинула эту идею. Австрия является и останется независимым государством."
 GER_reunification_with_east_prussia_desc:0 "Наше стремление соединить страну с Пруссией широко известно и тревожит Польшу. Сегодня мы официально предложим дипломатическую встречу с другими великими державами Европы, чтобы окончательно решить этот вопрос."
 GER_reverse_the_brain_drain_desc:0 "Никакая наука больше не будет объявлена «еврейской» или заклеймена иначе. Отныне разрешено изучать все научные направления."
 GER_revive_the_kaiserreich_desc:0 "События последнего десятилетия показали: демократия слишком слаба для сдерживания пагубных внутренних сил. Необходимо вернуться к твёрдому руководству кайзера и в преддверии его возвращения восстановить конституцию Германской империи."
 GER_robert_ley:0 "Роберт Лей"
 GER_robert_ley_desc:0 "Роберт Лей возглавлял Германский трудовой фронт. Он был известен тяжёлым алкоголизмом; при нём организация стала одной из самых коррумпированных в Третьем рейхе. Также руководил программой «Сила через радость» для примирения рабочего класса с режимом и позднейшей жилищной программой для немецких рабочих, потерявших дома при бомбардировках союзников."
 GER_schlieffen_once_more_desc:0 "План Шлиффена когда-то провалился, но его замысел можно возродить с учётом гораздо более быстрых способов ведения войны. Бронетехника и авиация позволят ему сработать."
 GER_secure_foreign_resources_desc:0 "Перед угрозой новой великой войны необходимо как можно скорее обеспечить доступ к природным ресурсам. В Скандинавии в изобилии есть то, что нам нужно."
 GER_secure_poland_desc:0 "Советский Союз оспаривает польские территории. Мы должны защитить Польшу от большевистской угрозы."
 GER_secure_the_balkans_desc:0 "Советы неоднократно заявляли о стремлении расширить своё влияние на Балканах. Мы должны этому помешать."
 GER_secure_the_baltics_desc:0 "Советский Союз оспаривает земли балтийских государств. Мы должны защитить Прибалтику от коммунизма."
 GER_soviet_treaty_all:0 "Германо-советский договор"
 GER_sturzbomber_programm_tt:0 "§YDornier:§! §Gприрост финансирования +200%§! на §Y365 дней§!"
 GER_take_advantage_of_the_global_market_desc:0 "Освободившись от оков автаркии, германский рынок сможет оживиться благодаря открытой торговле со всем миром."
 GER_take_back_northern_lands_desc:0 "Шлезвиг вновь стал предметом спора между нами и Данией. Его присоединение решит вопрос раз и навсегда."
 GER_the_balkans_trade_treaty_desc:0 "Торговое соглашение с балканскими союзниками по Оси повысит общий объём производства и дополнительно закрепит наше лидерство в альянсе."
 GER_the_eastern_fortress_desc:0 "Огромные ресурсы и население России делают неподготовленное нападение невыгодным. Вместо этого следует создать укреплённый рубеж, который будет сдерживать советскую агрессию, пока мы не будем готовы к борьбе."
 GER_theodor_von_hippel:0 "Теодор фон Хиппель"
 GER_towards_the_holy_roman_empire_desc:0 "Священная Римская империя была одним из крупнейших государств европейской истории. Мы непосредственно контролируем значительную часть её бывших земель. Возвращение кайзера позволяет изменить курс и возродить империю в современную эпоху."
 GER_treaty_of_friendship_desc:0 "Мы соблюдали международное право, устранили внутреннюю угрозу и даже вернули Австрии её земли. Несомненно, Франция и Великобритания заметят наши действия и согласятся заключить договор."
 GER_triumph_over_the_old_enemies_desc:0 "Мы победили в войне с французами и британцами. Несправедливость прошлого будет исправлена, а наша несокрушимая воля обеспечит торжество над ними более чем на тысячу лет."
 GER_valkyrie_neutrality_party_long:0 "Германский вермахт"
 GER_valkyrie_neutrality_party_short:0 "Вермахт"
 GER_wolfpacks_desc:0 "Опыт Первой мировой позволит разработать новые методы действий подводных лодок против охраняемых конвоев. Централизованное управление и координация отдельных лодок максимально повысят их эффективность."
 GRE_build_up_mobile_forces_tt:0 "Мы получим §Yмоторизованный§! и §Yкавалерийский шаблоны§!"
 GRE_high_unemployment_tt:0 "НЕ: имеет национальный дух §YВысокая безработица§!"
 GRE_repay_bodosakis_desc:0 ""
 HOL_light_cruiser_4_desc:0 "Два крейсера «Де Зевен Провинсиен» заложены перед немецким вторжением и завершены только в 1951 году. Изменённый проект 1939 года: более 12000 тонн, восемь 152-мм Bofors, хорошая для лёгкого крейсера броня и большая дальность."
 HUN_a_new_synthetic_industry_desc:0 "Нам не хватает природного каучука. Несмотря на высокую стоимость, необходимо создать собственную синтетическую промышленность."
 HUN_abandon_the_league_of_nations_desc:0 "Лига Наций раз за разом терпит неудачу. Германия и Италия постоянно обходят или открыто нарушают установленные правила и ограничения. Почему же мы должны оставаться в этой фиктивной миротворческой организации?"
 HUN_air_defense_corps_desc:0 "Несмотря на создание ВВС, необходимо также планировать и строить инфраструктуру для защиты от будущих воздушных нападений."
 HUN_air_land_warfare_desc:0 "Наша промышленность не способна выпускать авиацию в масштабах великих держав. Поэтому следует разработать доктрину поддержки местных сухопутных боёв."
 HUN_allaince_with_poland_desc:0 "Наши польские братья зажаты между экспансионистской Германией и зловещей советской угрозой, но не бездействуют. Польша взяла на себя огромную ответственность, создав союз «Междуморье» для противостояния немцам и Советам."
 HUN_arpad_line_desc:0 "Линия Арпада станет обширной системой укреплений. В отличие от французских и немецких линий, она будет состоять из групп небольших крепостей, образующих укреплённые районы. Благодаря конструкции и выбору мест каждый форт будет уникален, полностью приспособлен к местности и труден для обнаружения."
 HUN_cave_to_german_demands_desc:0 "Германия — главная сила Европы с мощной промышленностью и, по-видимому, неудержимой армией. Согласие с её требованиями становится всё более привлекательным, если это спасёт нас от несчастливой участи."
 HUN_cave_to_italian_demands_desc:0 "Хотя Италия слабее Германии, сблизиться с ней будет проще: она тоже недовольна итогами Великой войны. Несмотря на то, что тогда мы сражались по разные стороны, стремление распространить влияние на Балканы может нас объединить."
 HUN_central_managment_board_desc:0 "Мы полностью интегрировали промышленность возвращённых территорий и связали её с самой Венгрией. Остался последний шаг к полному использованию её возможностей: создать совет по управлению промышленным производством."
 HUN_civilian_flying_clubs_desc:0 "Появление воздушной войны и наложенные на нас ограничения требуют маскировать программы подготовки."
 HUN_combined_warfare_desc:0 "Наблюдая за манёвренной войной немцев и Советов, мы можем перенять новый способ ведения боевых действий. Совместное применение бронетехники, пехоты и полевой артиллерии позволит вести общевойсковой бой."
 HUN_commit_to_the_war_desc:0 "Народ тревожит война, в которую мы втянулись. Хотя все воодушевлены возвращением законных земель, масштабы конфликта уже напоминают Великую войну."
 HUN_concessions_from_czechoslovakia_desc:0 "Зажатая между нами и Польшей искусственно созданная Чехословакия может стать целью нашего союза. Мы вернём земли, прежде принадлежавшие нам и полякам. Этот шаг агрессивен, но необходим."
 HUN_continue_assimilation_desc:0 "После распада Австро-Венгрии в Венгрии осталось множество представителей других народов — по собственному выбору или из-за невозможности переехать. Независимо от причин необходимо обеспечить их полную интеграцию."
 HUN_contract_videoton_desc:0 "Videoton — новая электронная компания из Секешфехервара. Налаживание контактов с ней может помочь развитию нашей электроники."
 HUN_creation_of_the_artillery_corps_desc:0 "После расширения вооружённых сил крайне важно усовершенствовать доктрину применения артиллерии."
 HUN_creation_of_the_volunteer_force_desc:0 "На фоне растущей европейской напряжённости следует создать добровольческие силы для изучения новых способов ведения войны. Их составят молодые способные мужчины без судимостей и коммунистических симпатий."
 HUN_domestic_tank_designs_desc:0 "Наши нынешние танки уступают зарубежным образцам. Необходимо сократить разрыв с помощью улучшенных собственных проектов."
 HUN_equip_the_rongyos_garda_desc:0 "«Роньдьош гарда» — разношёрстная военизированная группа, защищавшая венгров в других странах, в том числе в Австрии. Её история связана со службой Венгрии в Национальной армии и антикоммунистической борьбой."
 HUN_form_the_informacios_hivatal_desc:0 "Необходимо создать разведывательную службу для защиты Венгрии от иностранного влияния."
 HUN_greater_hungary_desc:0 "Мы добились своего дипломатией или открытой военной силой. Прежние земли возвращены и включены в состав страны. Теперь справедливо принять имя, соответствующее нашему положению."
 HUN_grenz_infantry_desc:0 "Граничары, или пограничные войска, были лёгкой пехотой XVIII–XIX веков. Отличаясь от линейной пехоты и нередко уступая ей в оснащении, они часто действовали не хуже. Учитывая местность, где они воевали, мы можем использовать рельеф в своих интересах."
 HUN_hungarian_defence_forces_desc:0 "Основу Венгерских сил обороны составляют 1-я, 2-я и 3-я армии. Подвижный корпус, также известный как «Дьёршхадтест», не входит в эту структуру командования и действует самостоятельно."
 HUN_hungarian_general_staff_desc:0 "Венгрия должна подготовиться к войне. Поскольку Трианонский договор фактически отброшен, обязанности Министерства обороны перейдут к начальнику Генерального штаба и его аппарату."
 HUN_hungarian_irredentism_desc:0 "Трианонское увечье должно быть исправлено! Отнятые территории будут возвращены любыми средствами. Пока другие государства отвлечены, настал идеальный момент для удара."
 HUN_hungarian_war_machine_desc:0 "Наши союзники плохо оснащены для войны. Мы должны компенсировать их недостатки расширением военного производства и в полной мере использовать промышленную мощь."
 HUN_incorporate_the_turan_hunters_desc:0 "Туранские охотники — фашистская военизированная организация, основанная Гёмбёшем. Её включение в наши структуры опасно, но антикоммунистический пыл и стремление восстановить дотрианонские границы могут оказаться полезны."
 HUN_industrial_economic_integration_desc:0 "Расширив промышленную базу и пожиная плоды нашего труда, мы можем приступить к её дальнейшему развитию. Более тесные связи и сотрудничество между предприятиями и отраслями укрепят экономику."
 HUN_industrial_modernization_desc:0 "Быстро растущая промышленность вскоре достигнет предела возможностей. Необходимо выделить ресурсы, чтобы полнее использовать наш ограниченный промышленный потенциал."
 HUN_invest_in_fegyver_es_gepgyar_desc:0 "Fémáru, Fegyver-és Gépgyár — основной производитель стрелкового оружия для нашей армии. Учитывая положение компании, следует разместить у неё заказ на вооружение."
 HUN_invest_in_mavag_desc:0 "MÁVAG — ещё один крупный промышленный конгломерат. Это основной производитель локомотивов и гражданского транспорта, тесно связанный с предприятиями Вейсса и Ford-Werke. Он способен дополнительно обеспечить нужды гражданского населения."
 HUN_invest_in_tuzersegi_gyar_desc:0 "MÁVAG стала нашим главным производителем артиллерии. Подобно другим предприятиям, уже получившим заказы, компания должна расширить производство и содействовать совершенствованию орудий."
 HUN_join_italy_desc:0 "Италия создала собственный союз, пока состоящий лишь из её марионеток. Тем не менее она остаётся значительной средиземноморской державой, способной действовать на Балканах."
 HUN_join_the_axis_desc:0 "Военный союз Рима и Берлина, кажется, подчинил всю Европу. Прежде чем его внимание обратится к Балканам, следует официально попросить о вступлении."
 HUN_joint_tank_procurement_desc:0 "Мы присоединимся к разработке танков великой державы, с которой сблизились."
 HUN_kickstart_the_domestic_arms_industry_desc:0 "После принятия Дьёрской программы, на фоне растущей напряжённости в Европе, необходимо быстро увеличить военное производство."
 HUN_license_new_designs_desc:0 "Из-за прежних ограничений разработка отечественных самолётов сильно отстала. Поэтому необходимо искать конкурентоспособные проекты за рубежом."
 HUN_manfred_weiss_arms_integration_desc:0 "Семья Вейсс владеет крупнейшей промышленной базой. Если привлечь её на нашу сторону, она поможет военному производству, как уже помогала во время Великой войны."
 HUN_mechanization_desc:0 "Приоритетом станет 43M Lehel — бронетранспортёр, способный перевозить пехотное отделение."
 HUN_militarize_the_levente_desc:0 "Ограничения Трианонского договора можно дополнительно обойти с помощью «Левенте». Под видом физкультурных и оздоровительных занятий мы увеличим число подготовленных мужчин."
 HUN_mobile_corps_doctrine_desc:0 "После создания подвижного корпуса «Дьёршхадтест» необходимо разработать тактику манёвренной войны для дальнейшего повышения его возможностей."
 HUN_modern_field_guns_desc:0 "Полевые орудия нашей армии устарели или уступают зарубежным, особенно противотанковые пушки и артиллерия. Это необходимо исправить."
 HUN_modernize_the_hdf_desc:0 "Реальный боевой опыт позволит распространить полученные знания на все Венгерские силы обороны."
 HUN_munkaszolgalat_desc:0 "Для неспособных или не желающих проходить обычную военную службу необходимо создать трудовую повинность. Каждый мужчина должен внести свой вклад."
 HUN_nationalist_christianity_desc:0 "Христианство столетиями является частью нашей страны. Теперь, когда над Европой нависла война, многие церковные деятели готовы поддержать борьбу Венгрии против большевизма и национал-социализма."
 HUN_nationalize_key_industries_desc:0 "Чтобы полностью преодолеть экономический кризис, необходимо взять промышленность под прямой контроль. Это позволит восстановить и задействовать отрасли, пришедшие в упадок."
 HUN_new_weapon_contracts_desc:0 "После модернизации полевой артиллерии следует уделить внимание и вооружению пехотных отделений."
 HUN_our_fate_in_other_hands_desc:0 "Мы не способны противостоять великим державам Европы и вынуждены подчиняться тем, кто располагает силой. В обмен на дальнейшее сотрудничество можно выдвинуть собственные требования."
 HUN_our_fate_tied_to_another_desc:0 "Нас связывают традиции и история. Мы выступим вместе с нашими братьями по крови против окружающей нас тирании."
 HUN_papa_air_base_desc:0 "Созданным ВВС необходима подходящая база. Северная Трансданубия возле Папы подходит благодаря местной промышленности."
 HUN_prepare_oil_stockpiles_desc:0 "Нефть — дефицитный ресурс. Хотя у нас есть собственные месторождения, их запасы ограничены, поэтому необходимо создавать резервы."
 HUN_renounce_the_treaty_of_trianon_desc:0 "Совместное вторжение Германии и России в Польшу погрузило Европу в пламя. Отбросить Трианон и приступить к полноценному перевооружению теперь не просто желание, а необходимость."
 HUN_revitalize_the_civilian_industry_desc:0 "Одновременно с быстрым ростом военного производства нужно восстановить старые, пришедшие в упадок гражданские отрасли, чтобы не нарушить промышленный баланс."
 HUN_self_dependancy_desc:0 "Учитывая наше изолированное положение в Европе и растущую враждебность в мире, необходимо увеличить внутреннюю добычу сырья."
 HUN_set_up_the_national_bank_boards_desc:0 "При помощи Лиги Наций был создан Национальный банк и введён пенгё — единая венгерская валюта. Проведённые ранее в этом году реформы значительно оздоровили экономику, но возможности улучшения ещё остаются. Для завершения начатой работы будет учреждён специальный совет."
 HUN_social_reforms_desc:0 "По мере восстановления экономики и упорядочения бюджета излишки средств можно направить на социальные программы, чтобы улучшить общественные настроения в Венгрии."
 HUN_study_rocket_designs_desc:0 "Нужно изучить ракетные системы и проекты других стран: за ними может быть будущее авиации."
 HUN_subsidise_the_lower_class_desc:0 "Поддержка низших слоёв населения и предоставление им новых возможностей должны повысить производство и улучшить общественные настроения."
 HUN_support_unionist_sentiment_desc:0 "Прежнее предложение объединить Румынию и Венгрию провалилось. Однако стремление вернуть законные территории можно использовать для укрепления поддержки войны."
 HUN_the_housing_act_desc:0 "Если предоставить венгерским семьям недостающее жильё, они вновь начнут вкладывать средства в национальную экономику, ускоряя её восстановление."
 HUN_the_hungarian_air_forces_desc:0 "На основе Бледского соглашения и по распоряжению главы государства Королевские венгерские военно-воздушные силы, или MKHL, будут созданы как самостоятельный род войск."
 HUN_the_hungarian_ground_forces_desc:0 "Бледское соглашение наконец позволяет создать полноценную армию. Для этого будут использованы мобилизационные планы H.U.B.A., чтобы рост войск не опережал возможности промышленности."
 HUN_the_ludovika_academy_desc:0 "Это единственное оставшееся учреждение подготовки офицеров и высшего военного образования. Мы должны использовать академию для дальнейшего развития вооружённых сил."
 HUN_the_march_front_desc:0 "Бескровное восстание 15 марта считается началом революции против Австрийской империи. Двенадцать требований, во многом соответствующих демократическим принципам, получили широкое признание, и 15 марта стало памятным днём."
 HUN_the_national_saviour_desc:0 "Миклош Хорти спас страну от коммунистической угрозы, вернул утраченные по Трианонскому договору земли, восстановил промышленность до уровня соперников на Балканах и защитил страну от фашизма и коммунизма. Его правление запомнят как эпоху Хорти, но при необходимости нужно подготовить достойного преемника."
 HUN_the_red_terror_desc:0 "Мы сблизились с государством, противостоящим Советам. Учитывая историю большевистского влияния в нашей стране, необходимо подавить эту угрозу, чтобы она не подорвала наши военные усилия в случае войны с Советским Союзом."
 HUN_the_road_to_war_desc:0 "Мы достаточно подготовились к войне, но по мере вступления в неё новых участников потребуются дополнительные усилия."
 HUN_toe_the_german_line_desc:0 "Из-за нашего положения в центре Европы нас окружают гораздо более сильные государства. Германия ведёт агрессивную территориальную экспансию. Если мы хотим процветать, уступчивость по отношению к ней может принести награду."
 HUN_toe_the_italian_line_desc:0 "Наше центральное положение окружает нас гораздо более сильными государствами. Италия проявляет интерес к Балканам, прежде всего к Югославии. Возможно, при итальянском вторжении нам удастся договориться о возвращении прежних территорий."
 HUN_toe_the_polish_line_desc:0 "Нас связывает долгая дружба с польским народом. Хотя Польша не столь сильна, как Германия и Италия, углубить отношения с ней будет несложно."
 HUN_veszprem_design_centre_desc:0 "Близость крупной авиабазы Папа и местной промышленности, подходящей для авиастроения, делает Веспрем хорошим местом для создания конструкторского центра."
 HUN_war_for_transylvania:0 "Война за Трансильванию"
