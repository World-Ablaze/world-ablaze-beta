 eng_light_carrier_hull_1_desc:0 "Переоборудованный из океанского лайнера «Аргус» — весьма примитивный лёгкий авианосец, которому следует поручать лишь несложные задачи сопровождения."
 eng_light_carrier_hull_2_desc:0 "Первый лёгкий авианосец специальной постройки. Благодаря своей компоновке «Гермес» обладает лучшими вооружением, скоростью и дальностью."
 eng_light_carrier_hull_3_desc:0 "Значительное улучшение по сравнению с «Гермесом». «Юникорн» имеет мощное вооружение и ПВО, а также вмещает больше самолётов. Бронированная полётная палуба защищает от атак, а увеличенная дальность делает его отличным кораблём сопровождения."
 eng_light_carrier_hull_4_desc:0 "§YМожно переоборудовать через решение§!\nКорабль чрезвычайной постройки, который следует использовать при острой нехватке эскортных авианосцев"
