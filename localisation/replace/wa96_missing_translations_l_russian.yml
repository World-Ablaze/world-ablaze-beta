 JAP_subsidize_nissan_tt:0 "£faction_jap_zaibatsus  §YДзайбацу§! становятся §Gвлиятельнее§!, повышая £GFX_faction_construction_civilian_icon  §Yскорость строительства§! на §G+2.00%§!.\n"
 JAP_subsidize_the_okura_desc_alt:0 "Okuragumi Shokai — одна из крупнейших строительных компаний. Национализация её предприятий и техники позволит планировать строительство по государственным потребностям."
 JAP_subsidize_the_okura_desc_default:0 "Okuragumi Shokai — одна из наших крупнейших дзайбацу. Её строительный опыт позволит осуществлять более масштабные промышленные проекты."
