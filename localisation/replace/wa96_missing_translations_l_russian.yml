 sov_armor.858.a:0 "Мы сделали все возможное"
 sov_armor.858.d:0 "Долгие месяцы войны обернулись большими потерями для обеих сторон. Советы захватили территории, но не достигли цели и предложили вернуть потерянные земли в обмен на Карелию. Мы отчаянно её защищали, но продолжение войны сулит нам тяжёлое положение. От этого предложения нельзя отказаться."
 sov_armor.858.t:0 "[SOV.GetName] предлагает мирные условия"
 sov_armor.859.a:0 "Время всё исправит"
 sov_armor.859.da:0 "Строительство новых предприятий опередило рост числа рабочих. К сожалению, немедленно исправить это невозможно: для налаживания работы промышленности потребуется время."
 sov_armor.859.db:0 "Из-за нехватки новых предприятий многие рабочие не нашли работу и вернулись в сельское хозяйство. Последствия проявятся, когда мы снова захотим расширить промышленность."
