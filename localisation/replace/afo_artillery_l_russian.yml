 fra_artillery_upgrade_2_desc: "Одной только модернизацией многого не добиться. Нужна новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."

 fra_artillery_upgrade_3: "Модернизация артиллерии"
 fra_artillery_upgrade_3_desc: "Создание облегченной конструкции, которую можно разобрать для транспортировки, позволит обеспечить огневой поддержкой труднодоступные места."

 fra_artillery_upgrade_4: "Модернизация продвинутой артиллерии"
 fra_artillery_upgrade_4_desc: "Артиллерия с низким силуэтом станет менее заметной для врага."

 fra_anti_tank_upgrade_1: "Оборонительные позиции"
 fra_anti_tank_upgrade_1_desc: "Важность эффективных противотанковых орудий была доказана еще во время Великой войны. C появлением новых моделей танков необходимо разработать следующее поколение средств ПТО."

 fra_anti_tank_upgrade_2: "Усовершенствованный досылатель"
 fra_anti_tank_upgrade_2_desc: "Большинство противотанковых орудий являются малокалиберными. Нам нужен крупный калибр, способный пробивать толстую и наклонную броню тяжелых танков."

 fra_anti_tank_upgrade_3: "Улучшенная ПТО: модернизация I"
 fra_anti_tank_upgrade_3_desc: "Новые универсальные противотанковые орудия используют бронебойные снаряды с отделяющимся поддоном, которые пробивают броню практически любого танка."

 fra_anti_tank_upgrade_4: "Улучшенная ПТО: модернизация II"
 fra_anti_tank_upgrade_4_desc: "Повышая скорость снарядов наряду с разработкой новых типов боеприпасов, мы справимся с любой броней, которую могут создать наши враги."

 fra_anti_air_upgrade_1: "Модернизация ПВО"
 fra_anti_air_upgrade_1_desc: "Зенитные комплексы, оснащенные более быстрым механизмом перезарядки, могут нести больше снарядов и поддерживать необходимый темп огня."

 fra_anti_air_upgrade_2: "ПВО II"
 fra_anti_air_upgrade_2_desc: "Зенитные орудия с длинными стволами и мощными снарядами, способные попадать в цели на большой высоте."

 fra_anti_air_upgrade_3: "Усиление углов вертикальной наводки"
 fra_anti_air_upgrade_3_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 fra_anti_air_upgrade_4: "Улучшенная ПВО: модернизация I"
 fra_anti_air_upgrade_4_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 fra_anti_air_upgrade_5: "Улучшенная ПВО: модернизация II"
 fra_anti_air_upgrade_5_desc: "Сочетание современных радаров, компьютерной техники и автоматических систем заряжания необходимо для оперативного реагирования на более быстрые самолеты."

