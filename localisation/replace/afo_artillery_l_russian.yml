 pol_anti_tank_upgrade_4_desc: "Повышая скорость снарядов наряду с разработкой новых типов боеприпасов, мы справимся с любой броней, которую могут создать наши враги."

 pol_anti_air_upgrade_1: "Модернизация ПВО"
 pol_anti_air_upgrade_1_desc: "Зенитные комплексы, оснащенные более быстрым механизмом перезарядки, могут нести больше снарядов и поддерживать необходимый темп огня."

