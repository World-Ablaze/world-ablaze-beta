l_russian:
  

 railway_gun_equipment_0: "Canon de 240"

 fra_art_1: "Canon de 105 mle 1913 Schneider"
 fra_art_1_short: "105 mle 1913"
 fra_artillery_1: "Canon de 105 mle 1913 Schneider"
 fra_artillery_1_desc: "\n§RЭто совершенно новая модель, эффективность которой не сохранится§!"




 swe_artillery_upgrade_1: "Новый дульный тормоз"
 swe_artillery_upgrade_1_desc: "Для использования более тяжелых орудий на более легких платформах в конструкции гаубиц появились дульные тормоза."

 swe_artillery_upgrade_2: "Противовесы"
 swe_artillery_upgrade_2_desc: "Одной только модернизацией многого не добиться. Нужна новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."

 swe_artillery_upgrade_3: "Модернизация артиллерии"
 swe_artillery_upgrade_3_desc: "Создание облегченной конструкции, которую можно разобрать для транспортировки, позволит обеспечить огневой поддержкой труднодоступные места."

 swe_artillery_upgrade_4: "Модернизация продвинутой артиллерии"
 swe_artillery_upgrade_4_desc: "Артиллерия с низким силуэтом станет менее заметной для врага."

 swe_anti_tank_upgrade_1: "Оборонительные позиции"
 swe_anti_tank_upgrade_1_desc: "Важность эффективных противотанковых орудий была доказана еще во время Великой войны. C появлением новых моделей танков необходимо разработать следующее поколение средств ПТО."

 swe_anti_tank_upgrade_2: "Усовершенствованный досылатель"
 swe_anti_tank_upgrade_2_desc: "Большинство противотанковых орудий являются малокалиберными. Нам нужен крупный калибр, способный пробивать толстую и наклонную броню тяжелых танков."

 swe_anti_tank_upgrade_3: "Улучшенная ПТО: модернизация I"
 swe_anti_tank_upgrade_3_desc: "Новые универсальные противотанковые орудия используют бронебойные снаряды с отделяющимся поддоном, которые пробивают броню практически любого танка."

 swe_anti_tank_upgrade_4: "Улучшенная ПТО: модернизация II"
 swe_anti_tank_upgrade_4_desc: "Повышая скорость снарядов наряду с разработкой новых типов боеприпасов, мы справимся с любой броней, которую могут создать наши враги."

 swe_anti_air_upgrade_1: "Improved Receiver"
 swe_anti_air_upgrade_1_desc: "Improved Receiver"

 swe_anti_air_upgrade_2: "ПВО II"
 swe_anti_air_upgrade_2_desc: "Зенитные орудия с длинными стволами и мощными снарядами, способные попадать в цели на большой высоте."

 swe_anti_air_upgrade_3: "Усиление углов вертикальной наводки"
 swe_anti_air_upgrade_3_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 swe_anti_air_upgrade_4: "Улучшенная ПВО: модернизация I"
 swe_anti_air_upgrade_4_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 swe_anti_air_upgrade_5: "Улучшенная ПВО: модернизация II"
 swe_anti_air_upgrade_5_desc: "Сочетание современных радаров, компьютерной техники и автоматических систем заряжания необходимо для оперативного реагирования на более быстрые самолеты."

 swe_aa_tower_1: "Противовоздушные Орудия: модернизация I"
 swe_aa_tower_1_desc: "Противовоздушные Орудия: модернизация I"

 swe_aa_tower_2: "Противовоздушные Орудия: модернизация II"
 swe_aa_tower_2_desc: "Противовоздушные Орудия: модернизация II"

 swe_aa_tower_3: "Противовоздушные Орудия: модернизация III"
 swe_aa_tower_3_desc: "Противовоздушные Орудия: модернизация III"

 pol_artillery_upgrade_1: "Новый дульный тормоз"
 pol_artillery_upgrade_1_desc: "Для использования более тяжелых орудий на более легких платформах в конструкции гаубиц появились дульные тормоза."

 pol_artillery_upgrade_2: "Противовесы"
 pol_artillery_upgrade_2_desc: "Одной только модернизацией многого не добиться. Нужна новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."

 pol_artillery_upgrade_3: "Модернизация артиллерии"
 pol_artillery_upgrade_3_desc: "Создание облегченной конструкции, которую можно разобрать для транспортировки, позволит обеспечить огневой поддержкой труднодоступные места."

 pol_artillery_upgrade_4: "Модернизация продвинутой артиллерии"
 pol_artillery_upgrade_4_desc: "Артиллерия с низким силуэтом станет менее заметной для врага."

 pol_rocket_upgrade_1: "Стационарная рельсовая система"
 pol_rocket_upgrade_1_desc: "Самоходная артиллерийская установка, запускающая несколько ракет сразу, может быстро наносить урон на большой площади и при этом достаточно мобильна, чтобы уходить от ответного огня."

 pol_rocket_upgrade_2: "Упакованные взрывчатые вещества"
 pol_rocket_upgrade_2_desc: "Мы можем установить более тяжелые ракеты на крупную технику, выиграв в мощи, но снизив дальность действия. Организация батарей позволяет быстрее осуществлять перезарядку и смену позиции."

 pol_rocket_upgrade_3: "Системы целеуказания"
 pol_rocket_upgrade_3_desc: "Ракеты со стабилизаторами, обладающие улучшенной дальностью действия."

 pol_anti_tank_upgrade_1: "Оборонительные позиции"
 pol_anti_tank_upgrade_1_desc: "Важность эффективных противотанковых орудий была доказана еще во время Великой войны. C появлением новых моделей танков необходимо разработать следующее поколение средств ПТО."

