 ger_rocket_upgrade_2_desc: "Мы можем установить более тяжелые ракеты на крупную технику, выиграв в мощи, но снизив дальность действия. Организация батарей позволяет быстрее осуществлять перезарядку и смену позиции."

 ger_rocket_upgrade_3: "Системы целеуказания"
 ger_rocket_upgrade_3_desc: "Ракеты со стабилизаторами, обладающие улучшенной дальностью действия."

 ger_anti_tank_upgrade_1: "Оборонительные позиции"
 ger_anti_tank_upgrade_1_desc: "Важность эффективных противотанковых орудий была доказана еще во время Великой войны. C появлением новых моделей танков необходимо разработать следующее поколение средств ПТО."

 ger_anti_tank_upgrade_2: "Усовершенствованный досылатель"
 ger_anti_tank_upgrade_2_desc: "Большинство противотанковых орудий являются малокалиберными. Нам нужен крупный калибр, способный пробивать толстую и наклонную броню тяжелых танков."

 ger_anti_tank_upgrade_3: "Улучшенная ПТО: модернизация I"
 ger_anti_tank_upgrade_3_desc: "Новые универсальные противотанковые орудия используют бронебойные снаряды с отделяющимся поддоном, которые пробивают броню практически любого танка."

 ger_anti_tank_upgrade_4: "Улучшенная ПТО: модернизация II"
 ger_anti_tank_upgrade_4_desc: "Повышая скорость снарядов наряду с разработкой новых типов боеприпасов, мы справимся с любой броней, которую могут создать наши враги."

 ger_anti_air_upgrade_1: "Модернизация ПВО"
 ger_anti_air_upgrade_1_desc: "Зенитные комплексы, оснащенные более быстрым механизмом перезарядки, могут нести больше снарядов и поддерживать необходимый темп огня."

 ger_anti_air_upgrade_2: "ПВО II"
 ger_anti_air_upgrade_2_desc: "Зенитные орудия с длинными стволами и мощными снарядами, способные попадать в цели на большой высоте."

 ger_anti_air_upgrade_3: "Усиление углов вертикальной наводки"
 ger_anti_air_upgrade_3_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 ger_anti_air_upgrade_4: "Улучшенная ПВО: модернизация I"
 ger_anti_air_upgrade_4_desc: "По мере усовершенствования радаров радиолокационное наведение систем ПВО становится все более важным. Шагая в ногу с этой технологией, мы сможем создавать самые точные зенитные комплексы."

 ger_anti_air_upgrade_5: "Улучшенная ПВО: модернизация II"
 ger_anti_air_upgrade_5_desc: "Сочетание современных радаров, компьютерной техники и автоматических систем заряжания необходимо для оперативного реагирования на более быстрые самолеты."

 ger_aa_tower_1: "Противовоздушные Орудия: модернизация I"
 ger_aa_tower_1_desc: "Противовоздушные Орудия: модернизация I"

 ger_aa_tower_2: "Противовоздушные Орудия: модернизация II"
 ger_aa_tower_2_desc: "Противовоздушные Орудия: модернизация II"

 ger_aa_tower_3: "Противовоздушные Орудия: модернизация III"
 ger_aa_tower_3_desc: "Противовоздушные Орудия: модернизация III"

 sov_artillery_upgrade_1: "Новый дульный тормоз"
 sov_artillery_upgrade_1_desc: "Для использования более тяжелых орудий на более легких платформах в конструкции гаубиц появились дульные тормоза."

 sov_artillery_upgrade_2: "Противовесы"
 sov_artillery_upgrade_2_desc: "Одной только модернизацией многого не добиться. Нужна новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."

 sov_artillery_upgrade_3: "Модернизация артиллерии"
 sov_artillery_upgrade_3_desc: "Создание облегченной конструкции, которую можно разобрать для транспортировки, позволит обеспечить огневой поддержкой труднодоступные места."

 sov_artillery_upgrade_4: "Модернизация продвинутой артиллерии"
 sov_artillery_upgrade_4_desc: "Артиллерия с низким силуэтом станет менее заметной для врага."

