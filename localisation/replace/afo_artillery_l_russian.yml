 jap_rocket_upgrade_1: "Стационарная рельсовая система"
 jap_rocket_upgrade_1_desc: "Самоходная артиллерийская установка, запускающая несколько ракет сразу, может быстро наносить урон на большой площади и при этом достаточно мобильна, чтобы уходить от ответного огня."

 jap_rocket_upgrade_2: "Упакованные взрывчатые вещества"
 jap_rocket_upgrade_2_desc: "Мы можем установить более тяжелые ракеты на крупную технику, выиграв в мощи, но снизив дальность действия. Организация батарей позволяет быстрее осуществлять перезарядку и смену позиции."

 jap_rocket_upgrade_3: "Системы целеуказания"
