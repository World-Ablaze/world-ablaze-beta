 ENG_civil_defence: "Гражданская оборона"
 ENG_civil_defence_desc: "Необходимо приложить больше усилий, чтобы защитить себя в случае вторжения. Хотя такие действия, как Закон о военной подготовке, были хорошим началом, для реальной защиты нашей Родины от врага требуются дополнительные физические усилия."
  
 ENG_ministry_of_information: "Министерство информации"
 ENG_ministry_of_information_desc: ""
  
 ENG_bbc: "Мобилизовать BBC"
 ENG_bbc_desc: "BBC может стать отличным оружием, если использовать его в наших интересах: информация и правильный взгляд на события могут воодушевить наше население и спровоцировать восстание у наших врагов."
  
