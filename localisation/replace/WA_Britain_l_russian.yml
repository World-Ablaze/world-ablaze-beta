 ENG_motion_of_no_confidence_tt: "§RШтрафы§! к £stability_texticon  §Yстабильности§! §Gуменьшаются§! в зависимости от того, сколько стран материковой Европы £surrender_texticon  капитулировали.\nОткрывает решения по выступлениям Черчилля для повышения £stability_texticon  §Yстабильности§! и\n£war_support_modifiericons_texticon  §Yподдержки войны§!.\n\n"
  
