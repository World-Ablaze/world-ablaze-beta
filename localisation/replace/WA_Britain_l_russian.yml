 ENG_empty_the_gold_reserves: "Опустошить золотые резервы"
 ENG_empty_the_gold_reserves_desc: "Наши золотые запасы как за границей, так и внутри страны могут быть использованы для покрытия значительной части наших текущих расходов, позволяя большей части нашей промышленности сосредоточиться на военных усилиях."
  
 ENG_the_empires_sterling_reserves: "Стерлинговые резервы Империи"
 ENG_the_empires_sterling_reserves_desc: "Банк Англии на протяжении десятилетий накопил много денег, поступающих из нашей империи и нашей собственной национальной казны. В случае чрезвычайной ситуации мы можем воспользоваться ими, чтобы подпитать нашу экономику и предотвратить ее крах."
 ENG_sterling_reserve_loans_tt: "Будет открыто решение: §Y$ENG_the_empires_sterling_reserves$§!\n§RПотенциально приводит к банкротству [ROOT.GetFlag]Соединённого Королевства!§!\n\n"
  
 ENG_bsa_company: "Компания B.S.A"
 ENG_bsa_company_desc: "Компания Birmingham Small Arms имеет богатую историю производства огнестрельного оружия для Соединенного Королевства. Их технологический опыт поможет нам повысить эффективность производства снаряжения для нашей пехоты."
  
 ENG_royal_tank_corps: "Королевский танковый корпус"
 ENG_royal_tank_corps_desc: "Королевский танковый корпус берет свое начало от Королевского танкового полка времен Первой мировой войны, первого танкового подразделения в мире. Корпус будет реорганизован в дивизии, отвечающие потребностям современной войны."
  
  
 ENG_combat_services: "Боевые службы"
 ENG_combat_services_desc: "Армии, действующей на поле боя, требуется нечто большее, чем просто оружие и боеприпасы. Для поддержания материально-технического обеспечения, условий проживания и боеготовности наших частей необходима специализированная техника и личный состав."
 
 ENG_combined_arms_structure: "Общевойсковая структура"
 ENG_combined_arms_structure_desc: ""
  
 ENG_royal_armoured_corps: "Королевский бронетанковый корпус"
 ENG_royal_armoured_corps_desc: "Королевский бронетанковый корпус объединяет нашу бронетехнику и моторизованную кавалерию в единое организованное подразделение. Мы должны расширить разработку новых машин и тактики, которые будут использоваться в этих новых силах."
  
 ENG_armoured_fighting_vehicles_school: "Школа боевых бронированных машин"
 ENG_armoured_fighting_vehicles_school_desc: "По мере того, как мы вводим в нашу армию все больше и больше бронетехники, другие наши армейские подразделения необходимо обучать воевать совместно с ней. Если мы рассчитываем на победу, необходимо применять общевойсковую тактику."
  
 ENG_armour_evolution: "Эволюция бронетехники"
 ENG_armour_evolution_desc: ""
  
 ENG_aere: "AERE"
 ENG_aere_desc: "Научно-исследовательский институт атомной энергии"
 ENG_aere_tt: "\nЗавершение §Yмиссии Тизарда§! уменьшит необходимые начальные экономические инвестиции:"
  
 ENG_the_maud_committee: "Комитет MAUD"
 ENG_the_maud_committee_desc: ""
  
 ENG_british_austerity: "Британская экономия"
 ENG_british_austerity_desc: "Чтобы оправиться от Великой депрессии, каждой семье необходимо затянуть пояса и меньше зависеть от правительства. Сокращая государственные расходы, мы можем обеспечить большее процветание в будущем, если пойдём на необходимые жертвы сейчас."
  
 ENG_committee_of_imperial_defence: "Комитет Имперской обороны"
 ENG_committee_of_imperial_defence_desc: "Десятилетие подходит к концу, и пришло время пересмотреть наши расходы на оборону и составить новые прогнозы на будущее. Будем надеяться, что это удержит любые враждебные страны от поднятия шума."
  
 ENG_royal_airforce: "Королевские Военно-воздушные силы"
 ENG_royal_airforce_desc: "Королевские военно-воздушные силы начинались как крошечный род войск во время первой великой войны, а теперь они представляют собой гордую военную силу со многими новыми возможностями, о которых мы не могли мечтать 20 лет назад. При должном внимании они обязательно окажут большое влияние на любые будущие конфликты."
  
 ENG_fighter_command: "Командование истребителями"
 ENG_fighter_command_desc: ""
  
 ENG_bomber_command: "Командование бомбардировщиками"
 ENG_bomber_command_desc: ""
  
 ENG_coastal_command: "Береговое командование"
 ENG_coastal_command_desc: ""
  
 ENG_the_war_office: "Военное министерство"
 ENG_the_war_office_desc: "Военное министерство отвечает за все наши сухопутные силы и в настоящее время финансирует нашу профессиональную армию. При правильном подходе мы можем развивать этот род войск, особенно в области бронетехники и мобильности, чтобы оставаться лучшими среди всех других вооруженных сил."
  
 ENG_the_admiralty: "Адмиралтейство"
 ENG_the_admiralty_desc: "Адмиралтейство играет важную роль в нашей безопасности и проецировании сил. Необходимо уделять ему должное внимание, чтобы оно было впереди всех, иначе мы отстанем и потеряем нашу империю и нашу гордость."
  
 ENG_bovington_camp: "Лагерь Бовингтон"
 ENG_bovington_camp_desc: "Бовингтон кажется идеальным местом для открытия танковой школы, которая поможет обучать наших военных этому новому военному искусству."
  
