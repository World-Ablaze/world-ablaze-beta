 ENG_advancments_in_convoy_defense: "Достижения в защите конвоев"
 ENG_advancments_in_convoy_defense_desc: "Во время Великой войны Британия оказалась на грани голода, и мы должны продолжать развивать корабли сопровождения, чтобы не допустить повторения подобной катастрофы."
  
 ENG_womens_land_army: "Женская земледельческая армия"
 ENG_womens_land_army_desc: "Когда мужчины уходят на войну, дома остается много пустых мест, которые нужно заполнить, особенно на наших фабриках. Женщины Британии готовы выполнить эту роль, им просто нужно наше разрешение."
  
 ENG_emergency_powers: "Чрезвычайные полномочия"
 ENG_emergency_powers_desc: "Иногда необходимо сократить бюрократическую волокиту и принять крайние решения, причем быстро. Мы не можем позволить себе проиграть эту войну, и чтобы гарантировать выживание демократии, мы должны как можно скорее предоставить чрезвычайные полномочия премьер-министру."
  
 ENG_reintroduce_elections: "Вновь ввести выборы"
 ENG_reintroduce_elections_desc: "После окончания войны пришло время подумать и определить будущее нации и направление, в котором ей следует двигаться. Пора готовиться к следующим выборам..."
  
