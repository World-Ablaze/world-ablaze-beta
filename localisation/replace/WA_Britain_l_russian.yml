 ENG_secure_sweden: "Безопасная Швеция"
 ENG_secure_sweden_desc: "Швеция является жизненно важным торговым партнером Германии. Показав шведскому народу, что мы являемся бастионом обороны в Скандинавии, его можно убедить присоединиться к нашей борьбе и разорвать связи с Германией."
  
 ENG_secure_ireland: "Безопасная Ирландия"
 ENG_secure_ireland_desc: "Ирландия отказывается присоединиться к нашим союзникам, это может означать, что они могут захотеть присоединиться к оси, и в этом случае они станут серьезной угрозой для нашего западного побережья. Даже если бы это было не так, мы могли бы использовать больше портов для обеспечения безопасности наших морских маршрутов."
  
 ENG_luxemburg_security: "Безопасный Люксембург"
 ENG_luxemburg_security_desc: "Люксембург предоставляет силам оси возможность прорваться и отрезать Францию и Бельгию, мы должны создать силы, чтобы обезопасить эту территорию до того, как это сделает враг."
  
 ENG_ground_rearmament_focus: "Наземное перевооружение"
 ENG_ground_rearmament_focus_desc: "Армия является основой любой страны, и мы должны обеспечить, чтобы она оставалась одной из самых современных боевых сил в мире."
  
 ENG_modernize_the_royal_army: "Британская армия"
 ENG_modernize_the_royal_army_desc: "Британская армия никогда не сможет надеяться стать самой крупной. Тем не менее, инвестиции в инженеров британской армии, военную службу и медицинский корпус дают нам необходимое преимущество в будущих сражениях."
  
 ENG_royal_artillery: "Королевская артиллерия"
 ENG_royal_artillery_desc: "Обновление наших орудий для достижения превосходной огневой мощи — это то, чего больше всего требуют наши солдаты на поле боя."
  
 ENG_special_boat_service: "Особая лодочная служба"
 ENG_special_boat_service_desc: "Известно, что офицер Роджер Кортни ранее обращался в Адмиралтейство со своими идеями о бригаде складных каяков. Поначалу он не добился успеха, однако его инициалы, обнаруженные на двери капитанской каюты самого охраняемого корабля, полностью убедили высшее военно-морское командование в том, что его идеи о морской войне стоит опробовать и что инвестиции в эту область имеют большое значение."
  
 ENG_nuffield_foundation: "Фонд Наффилда"
 ENG_nuffield_foundation_desc: "Фонд Наффилда - это благотворительный фонд, основанный Уильямом Моррисом, лордом Наффилдом. Его целью является улучшение социального благосостояния путем финансирования исследовательских и инновационных проектов в области образования и социальной политики, а также наращивания исследовательского потенциала в области естественных и социальных наук."
  
 ENG_bawdsey_research_centre: "Исследовательский центр Боудси"
 ENG_bawdsey_research_centre_desc: "Поместье Боудси использовалось нашим министерством авиации при разработке новой технологии, известной как RADAR. Для дальнейшего развития этой концепции необходимо привлечь дополнительных ученых и инженеров."
  
 ENG_bletchley_park_focus: "Блетчли-парк"
 ENG_bletchley_park_focus_desc: "Для GC&CS и SIS требуется новое место. Оно имеет прекрасное географическое положение и находится недалеко от ключевых инфраструктурных узлов и коммуникаций. У него также есть много возможностей для расширения, что делает его идеальным местом для дальнейших исследовательских разработок."
  
 ENG_fund_the_secret_service: "Финансировать Секретную службу"
 ENG_fund_the_secret_service_desc: "Настало время объединить наши секретные организации в новое единое подразделение для ведения шпионажа, диверсий и разведки на оккупированных территориях. При соответствующих инвестициях мы можем превратить это подразделение в отдел, выигрывающий войну."
  
 ENG_privatize_the_housing_market: "Приватизировать рынок жилья"
 ENG_privatize_the_housing_market_desc: "В то время как большая часть нашей экономики находится в упадке, наш рынок жилья чувствует себя относительно хорошо: новые дома строятся быстрыми темпами. Предоставление частным компаниям контроля над рынком позволит им продолжить жилищный бум и вдохнет жизнь в нашу экономику."
  
 ENG_lower_interest_rates: "Снизить процентные ставки"
 ENG_lower_interest_rates_desc: "Хотя мы полностью приватизировали рынок жилья, многие компании по-прежнему не желают брать кредиты на крупные строительные проекты. Снижение процентных ставок побудит их делать еще большие инвестиции."
  
 ENG_government_loans: "Государственные кредиты"
 ENG_government_loans_desc: "Дополнительные кредиты строительным компаниям будут способствовать дальнейшему экономическому росту."
  
 ENG_approve_new_construction_projects: "Утверждение новых строительных проектов"
 ENG_approve_new_construction_projects_desc: "Мы сделали все возможное, чтобы побудить наши строительные компании приступить к более масштабным проектам. Остаётся только одобрить их проекты и пожинать плоды наших усилий."
  
 ENG_reignite_our_manufacturing_heartland: "Возродить наш промышленный центр"
 ENG_reignite_our_manufacturing_heartland_desc: "Мидлендс является центром промышленности, крупные инвестиции оживят экономику севера и вернут людей к работе."
  
 ENG_shadow_scheme: "Программа теневых заводов"
 ENG_shadow_scheme_desc: ""
 ENG_shadow_scheme_focus_tt:1 "Открывает миссию, выполнение которой дает в общей сложности §G12§! ячеек для строительства и §Y12 военных заводов§! в трёх регинах при вступлении в войну.\n\n§YБонус «теневой схемы» сменится на бонус к§! §G30% скорости конверсии§! §Yсроком на год при вступлении в войну§!\n\n"

