 ENG_parliament: "Парламент"
 ENG_parliament_desc: "Вестминстерский дворец имеет свои собственные представления о том, как следует управлять Империей. Для продвижения нашей повестки дня потребуется большое сотрудничество, но в нашем распоряжении есть варианты, позволяющие гарантировать, что у нас будет союзный парламент, который будет управлять вместе."
