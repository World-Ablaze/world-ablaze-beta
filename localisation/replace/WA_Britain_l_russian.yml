 ENG_mobilize_the_empire: "Мобилизация Империи"
 ENG_mobilize_the_empire_desc: "В Европу пришла война, и нам нужно сплотить Содружество и его народы на свою сторону, пришло время мобилизовать империю и встать на путь победы!"
  
 ENG_strengthen_the_commonwealth: "Укрепить Содружество"
 ENG_strengthen_the_commonwealth_desc: ""
  
 ENG_aluminium_company_of_canada: "Алюминиевая компания Канады"
 ENG_aluminium_company_of_canada_desc: "Алюминий крайне необходим для строительства самолетов. Расширяя добычу и производство алюминия в Канаде, мы можем гарантировать, что наши заводы и сборочные линии всегда будут обеспечены питанием."

  
 ENG_war_appropriation_act: "Закон о военных ассигнованиях"
 ENG_war_appropriation_act_desc: "Наша казна не была здоровой со времен первой мировой войны, и сейчас, когда мы находимся в середине второй, мы должны получить больше кредитов, чтобы военная машина работала бесперебойно, иначе мы потерпим полный экономический коллапс, от которого мы никогда не сможем полностью оправиться."
  
 ENG_rations_from_india: "Продовольствие из Индии"
 ENG_rations_from_india_desc: "Британия рискует столкнуться с нехваткой ресурсов. Обеспечив себе импорт продовольствия, мы сможем потратить больше денег на сбор необходимых ресурсов и продолжить борьбу."
  
 ENG_create_unit_airborne_tt: "Вы получите шаблон £unit_paratrooper_icon_small §YВоздушно-десантной дивизии§!."
  
 ENG_create_unit_marine_tt: "Вы получите шаблон £unit_marine_icon_small §YДивизии морской пехоты§!."
  
 ENG_mountaineers: "Королевские альпинисты"
 ENG_mountaineers_desc: "Требуется опыт ведения боевых действий в горных регионах. Опыт горных подразделений САС теперь должен дать нам знания, необходимые для подготовки целых дивизий."
 ENG_create_unit_mountaineer_tt: "Вы получите шаблон £unit_mountaineers_icon_small §YГорнострелковой дивизии§!."
  
 ENG_rip_up_the_london_naval_treaty: "Разорвать Лондонский военно-морской договор"
 ENG_rip_up_the_london_naval_treaty_desc: ""
  
 ENG_secure_the_atlantic_rise: "Охрана Атлантического подъема"
 ENG_secure_the_atlantic_rise_desc: ""
  
 ENG_fuel_the_war_industry: "Подпитка военной промышленности"
 ENG_fuel_the_war_industry_desc: "Пришло время полностью перевести британскую экономику на военные рельсы. Худшие прогнозы сбылись, и мы оказались в состоянии крупного конфликта, который не имеет признаков скорого окончания. Наша единственная надежда – победить, поражение – не вариант!"
  
 ENG_peace_in_our_time: "Мир в наше время"
 ENG_peace_in_our_time_desc: "Наши недавние дипломатические достижения позволили свернуть с курса на войну, несмотря на уступки, которых они потребовали. Наш премьер-министр вернулся в Лондон с хорошими новостями к ликующей толпе, заявив, что это мир в наше время!... верно?"
  
 ENG_plan_the_next_imperial_conference: "Спланировать следующую Имперскую конференцию"
 ENG_plan_the_next_imperial_conference_desc: "Имперская конференция позволит нам привести Содружество в соответствие с нашей политикой и поможет начать обсуждение вопросов торговли и перевооружения. Крайне важно, чтобы мы приступили к планированию следующей как можно скорее, чтобы убедиться, что мы и наши союзники готовы к любому будущему."
  
 ENG_plan_the_next_imperial_conference_tt: "Планы следующей §YИмперской конференции§! будут приведены в действие, что даст нам год на подготовку\n§GРазвитие промышленности в Содружестве обеспечит принятие ими бонусов Имперской конференции§!\n§OДля использования этих возможностей можно использовать максимум 365 £political_power_texticon  политической власти!§!\n§RСмена курса уничтожит шансы для создания Имперской Федерации§!\n"
  
 ENG_imperial_conference_tt: "Разблокирует решения для §YИмперской конференции§! в течение 40 дней.\n§GРазвитие промышленности в Содружестве обеспечит им получение бонусов Имперской конференции§!\n§OДля использования этих возможностей можно использовать максимум 365 £political_power_texticon  политической власти§!\n"
  
 ENG_imperial_federation_goal_tt: "Все страны Содружества, принявшие Имперскую Федерацию, должны быть §Yинтегрированными марионетками§!\n"
 ENG_imperial_federation_tt: "Все доминионы, принявшие Имперскую Федерацию, будут §Gнеспособны увеличивать свою автономию§!\n"
  
 ENG_centralize_the_merchant_fleet: "Централизация торгового флота"
 ENG_centralize_the_merchant_fleet_desc: "Торговый флот находился в руках частных компаний и судостроителей. Добавляя больше кораблей в наш резервный список и участвуя в их проектировании, мы можем сократить затраты и обеспечить большую страховку."
  
 ENG_found_the_sas: "Создать SAS"
 ENG_found_the_sas_desc: "Офицеру по имени Дэвид Стирлинг пришла в голову идея, что небольшое подразделение коммандос может беспокоить врага в его тылу, нанося огромный ущерб. Название «Воздушная служба» дает дополнительное преимущество: враг поверит, что ему придется защищаться еще и от десантников. Эта идея вполне может иметь смысл."
  
 ENG_who_dares_wins: "Кто рискует, тот побеждает"
 ENG_who_dares_wins_desc: "Мы превратили самых способных солдат в элитные боевые силы, однако мы растрачиваем их потенциал, если относимся к ним как к обычным солдатам. В ситуации, в которой мы оказались, и несмотря ни на что, побеждает тот, кто осмелится."
  
