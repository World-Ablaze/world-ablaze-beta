 ENG_form_the_nortraship: "Сформировать Nortraship"
 ENG_form_the_nortraship_desc: "Норвегия имеет большой торговый флот, который в настоящее время находится в наших портах после норвежской оккупации. Мы можем использовать эти суда и их экипажи для укрепления нашего собственного торгового флота, объединив их в Nortraship."
  
