 mtg_britain.4.d:1 "Представители правительств доминионов единогласно сообщили нам, что в одностороннем порядке разрывают отношения с Короной. В качестве основной причины, по которой отношения между Британией и Содружеством больше не могут продолжаться, они называют опасный рост фашизма и все более антидемократическую позицию Великобритании.\n\nКак заявил в эмоциональном интервью один из представителей Содружества: «Правительству, которое прибегает к насилию, ненависти и манипуляциям, нельзя доверять действовать в интересах своих подданных. Исходя из недавних событий, мы видим неминуемое падение демократии и парламента, и ситуация может только ухудшиться, если к власти придут чернорубашечники. Поэтому, чтобы защитить интересы наших народов, мы не видим иной альтернативы, кроме как отстранить короля от должности главы государства и отделиться от Великобритании».\n\nНесомненно, они надеются, что наш нынешний политический паралич не позволит нам ответить на этот резкий шаг."
  
 MTG_naval_treaty.13.t: "Вторая англо-германская гонка военно-морских вооружений"
 MTG_naval_treaty.13.desc: "Когда немцы разорвали англо-германский военно-морской договор и ознаменовали начало второй англо-германской гонки военно-морских вооружений, британское правительство официально ввело в действие статью 25 Лондонского военно-морского договора, позволяющую Королевскому флоту отступить от договорных ограничений, с потеря основной страны, подписавшей Лондонский военно-морской договор, оказалась бесполезной."
 MTG_naval_treaty.13.a: "Немцы в очередной раз бросили вызов Королевскому флоту"
  
 MTG_naval_treaty.12.t: "Вызов Королевскому флоту"
 MTG_naval_treaty.12.desc: "Правительство Германии разорвало англо-германский военно-морской договор, и этим явным вызовом Королевскому флоту нам разрешено выйти из Лондонского военно-морского договора, применив статью 25."
 MTG_naval_treaty.12.a: "Мы с ними еще раз разберемся"
 
