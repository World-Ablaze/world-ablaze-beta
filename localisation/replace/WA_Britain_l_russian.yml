 eng_armor.801.t: "Незначительная экономическая неудача"
 eng_armor.801.d: "Некоторые из наших прежних успехов, достигнутых в 1930-х годах, не принесли желаемого долгосрочного эффекта, и безработица растет. К счастью, экономисты предсказывают, что экономика скоро стабилизируется без дальнейшего вмешательства государства."
 eng_armor.801.a: "Время все уладит"
  
 eng_armor.804.t: "Румыния просит мира"
 eng_armor.804.d: ""
 eng_armor.804.a: "Принять мир!"
 eng_armor.804.b: "Отвергнуть мир!"
  
 eng_armor.805.t: "Великобритания заставляет нас ввести эмбарго на Германию"
 eng_armor.805.d: "Поскольку Германия нарушает нейтралитет Бенилюкса, Великобритания оказывает на нас давление, чтобы мы помогли остановить немецкую агрессию. Мы надеемся, что, прекратив поставки ресурсов в Германию, они увидят свою ошибку и будут стремиться к миру в Европе. Мы сделаем это, чтобы проявить солидарность с нейтральными странами мира и предотвратить новую войну."
 eng_armor.805.a: "За мир!"
 eng_armor.805.b: "Мы не хотим нарушать наш нейтралитет."
  
 eng_armor.806.t: "Швеция принимает эмбарго"
 eng_armor.806.d: "Швеция приняла наше предложение и начала налагать эмбарго на Германию, мы должны защитить их в благодарность за эту помощь в военных действиях."
 eng_armor.806.a: "Отличные новости!"
  
 eng_armor.807.t: "Швеция отвергает эмбарго"
 eng_armor.807.d: "Шведы отказались, сославшись на свой нейтралитет, и продолжают помогать немцам в их военных действиях против нас. Мы должны принять меры, чтобы остановить это!"
 eng_armor.807.a: "Мы должны остановить поток железа любой ценой!"
  
 eng_armor.808.t: "Германия требует возобновления торговли"
 eng_armor.808.d: "Провальная защита наших скандинавских братьев привела к их уничтожению, и теперь немцы обратились к нам с требованиями возобновить нашу торговлю с ними, угрожая вторжением. Чтобы предотвратить нашу собственную гибель и потерю нашей демократии, у нас нет другого выбора, кроме как подчиниться их требованиям."
 eng_armor.808.a: "Мы неохотно принимаем."
 eng_armor.808.b: "Мы не сдадимся тиранам!"
  
 eng_armor.809.t: "Швеция открывает торговлю"
 eng_armor.809.d: "Шведское правительство выполнило наши договоренности и сняло эмбарго, и железо потечет."
 eng_armor.809.a: "Очень хорошо, пожалуй, мы их еще пощадим."
  
 eng_armor.810.t: "Швеция отвергает открытие торговли"
 eng_armor.810.d: "Шведы отказались выполнить наши требования и поддержали Британию против нас. Мы непременно поставим их на место!"
 eng_armor.810.a: "Das ist ein Befehl!"
  
 eng_armor.811.t: "Швеция наложила на нас эмбарго"
 eng_armor.811.d: "Британия использовала Норвегию как средство принуждения Швеции прекратить торговлю с нами. Мы должны завоевать Норвегию, чтобы заставить шведов возобновить торговлю с нами."
 eng_armor.811.a: "Это означает катастрофу для нашего производства."
 eng_armor.811.b: "Мы должны отомстить!"
  
 eng_armor.812.t: "Великобритания наложила на нас эмбарго"
 eng_armor.812.d: "Великобритания наложила на нас полное эмбарго после наших недавних политических действий. Многие из стран-союзников Великобритании также последовали ее примеру. Похоже, нам придется искать необходимые нам ресурсы в другом месте."
 eng_armor.812.a: "Мы потеряли поставщиков жизненно важных ресурсов."
  
 eng_armor.813.t: "[PER.GetName] просит мира"
 eng_armor.813.d: "После нашего завоевания большей части Персии [From.GetName] попросил о прекращении огня и согласится на частичную оккупацию страны до тех пор, пока война в Европе не закончится."
 eng_armor.813.a: "Мы разделим север и запад."
 eng_armor.813.b: "Мы хотим полной оккупации."
  
 eng_armor.814.t: "[ENG.GetName] требует полной капитуляции"
 eng_armor.814.d: "После нашего завоевания большей части Персии [From.GetName] попросил о прекращении огня и согласится на частичную оккупацию страны до тех пор, пока война в Европе не закончится."
 eng_armor.814.a: "Мы уступим."
 eng_armor.814.b: "Эти требования абсурдны!"
  
 eng_armor.815.t: "Эвакуироваться в Канаду?"
 eng_armor.815.d: "Мы стоим перед возможностью поражения на нашем материке. Должны ли мы эвакуировать правительство и королевскую семью в Канаду, чтобы обеспечить продолжение борьбы?"
 eng_armor.815.a: "Мы вернемся!"
 eng_armor.815.b: "Мы будем стоять насмерть в Британии!"
 population_evacuates_tt: "\n§RОколо миллиона человек эвакуируется в Канаду§!"
  
 eng_armor.818.t: "Теракт в Северной Ирландии"
 eng_armor.818.d: "После нашей оккупации Ирландии преступная группировка, называющая себя ИРА, начала террористическую атаку в Северной Ирландии в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что следует ожидать новых атак, пока она не достигнет своей цели."
 eng_armor.818.e: "После последней атаки ИРА снова нанесла удар по заводам и инфраструктуре в Северной Ирландии. Кажется, конца этому не видно, пока мы либо не избавимся от них, либо не удовлетворим их требования."
 eng_armor.818.f: "После окончания нашего конфликта с ИРА оставшиеся инакомыслящие попытались напасть на Северную Ирландию, но были остановлены. Радикалы арестованы, в полиции уверены, что дальнейших нападений ожидать не стоит."
 eng_armor.818.a: "Нам нужно разобраться с этим."
 eng_armor.818.b: "Браво!"
  
 eng_armor.819.t: "Теракт в Лондоне"
 eng_armor.819.d: "После нашей оккупации Ирландии преступная группировка, называющая себя ИРА, совершила террористическую атаку в Лондоне в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что следует ожидать новых атак, пока она не достигнет своей цели."
 eng_armor.819.e: "После последней атаки ИРА снова нанесла удар по заводам и инфраструктуре в Лондоне. Кажется, конца этому не видно, пока мы либо не избавимся от них, либо не удовлетворим их требования."
 eng_armor.819.f: "После окончания нашего конфликта с ИРА оставшиеся инакомыслящие попытались напасть на Лондон, но были остановлены. Радикалы арестованы, в полиции уверены, что дальнейших нападений ожидать не стоит."
 eng_armor.819.a: "Это должно закончиться быстро."
 eng_armor.819.b: "Браво!"
  
 eng_armor.820.t: "Теракт в Бирмингеме"
 eng_armor.820.d: "После нашей оккупации Ирландии преступная группировка, называющая себя ИРА, совершила террористическую атаку в Бирмингеме в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что следует ожидать новых атак, пока она не достигнет своей цели."
 eng_armor.820.e: "После последней атаки ИРА снова нанесла удар по заводам и инфраструктуре в Бирмингеме. Кажется, конца этому не видно, пока мы либо не избавимся от них, либо не удовлетворим их требования."
 eng_armor.820.f: "После окончания нашего конфликта с ИРА оставшиеся инакомыслящие попытались атаковать Бирмингем, но были остановлены. Радикалы арестованы, в полиции уверены, что дальнейших нападений ожидать не стоит."
 eng_armor.820.a: "Мы не можем сдаться."
 eng_armor.820.b: "Браво!"
  
 eng_armor.821.t: "Теракт в Ливерпуле"
 eng_armor.821.d: "После нашей оккупации Ирландии преступная группировка, называющая себя ИРА, совершила террористическую атаку в Ливерпуле в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что следует ожидать новых атак, пока она не достигнет своей цели."
 eng_armor.821.e: "После последней атаки ИРА снова нанесла удар по заводам и инфраструктуре Ливерпуля. Кажется, конца этому не видно, пока мы либо не избавимся от них, либо не удовлетворим их требования."
 eng_armor.821.f: "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Ливерпуль, но были остановлены. Радикалы арестованы, в полиции уверены, что дальнейших нападений ожидать не стоит."
 eng_armor.821.a: "Мы столкнулись с кризисом."
 eng_armor.821.b: "Браво!"
  
 eng_armor.822.t: "Теракт в Шеффилде"
 eng_armor.822.d: "После нашей оккупации Ирландии преступная группировка, называющая себя ИРА, совершила террористическую атаку в Шеффилде в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что следует ожидать новых атак, пока она не достигнет своей цели."
 eng_armor.822.e: "После последней атаки ИРА снова нанесла удар по заводам и инфраструктуре в Шеффилде. Кажется, конца этому не видно, пока мы либо не избавимся от них, либо не удовлетворим их требования."
 eng_armor.822.f: "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Шеффилд, но были остановлены. Радикалы арестованы, в полиции уверены, что дальнейших нападений ожидать не стоит."
 eng_armor.822.a: "Прискорбный поступок."
 eng_armor.822.b: "Браво!"
  
 eng_armor.823.t: "ИРА нейтрализована"
 eng_armor.823.d: "После успешных рейдов по Ирландии лидеры ИРА и большая часть их сторонников были либо убиты, либо арестованы. Надеемся, это положит конец любым дальнейшим атакам."
 eng_armor.823.a: "Отличная работа!"
  
 eng_armor.824.t: "Армия отброшена"
 eng_armor.824.d: "После рейдов по Ирландии британская армия оказалась вовлеченной в тяжелые бои и партизанскую войну со стороны ИРА. К сожалению, лидерам ИРА удалось отступить в новые места, и наши усилия почти ничего не дали."
 eng_armor.824.a: "В следующий раз мы до них доберемся!"
  
 eng_armor.825.t: "Поставки ИРА отслежены"
 eng_armor.825.d: "Анализ рейдов показал, какое оборудование использовала ИРА: отслеживая поставки оружия в Ирландию и из нее, полиция смогла выследить незаконных поставщиков оружия и арестовать их. Это приближает нас на один шаг к поиску штаб-квартиры ИРА."
 eng_armor.825.a: "Хорошая работа!"
  
 eng_armor.826.t: "Найдены пособники ИРА"
 eng_armor.826.d: "Рейды на возможных членов ИРА привели к многочисленным арестам. По результатам допросов мы обнаружили различных агентов ИРА, стоящих за планированием некоторых будущих атак, и положили им конец. После нашего предыдущего успеха это сделает руководство еще более отчаянным и безрассудным."
 eng_armor.826.a: "Отличная работа!"
  
 eng_armor.827.t: "Руководство ИРА арестовано"
 eng_armor.827.d: "Отслеживание готовящейся атаки ИРА привело нас к одному из высокопоставленных членов ИРА. После нашего допроса в предполагаемой штаб-квартире ИРА был проведен крупный рейд с участием нескольких полицейских управлений и групп спецназа. К счастью для нас, это было правильное место, и теперь мы считаем, что ИРА нейтрализована."
 eng_armor.827.a: "Угроза наконец миновала!"
  
 eng_armor.828.t: "Лига Наций ввела против нас эмбарго"
 eng_armor.828.d: "Лига Наций наложила на нас полное эмбарго после наших недавних политических действий."
 eng_armor.828.a: "Мы потеряли поставщиков жизненно важных ресурсов."
  
 eng_armor.829.t: "Лига Наций снимает эмбарго"
 eng_armor.829.d: "Лига Наций сняла эмбарго после ослабления напряженности."
 eng_armor.829.a: "Стоит быть на их стороне"
  
 eng_armor.830.t: "Исключение из Лиги Наций"
 eng_armor.830.d: "Лига Наций исключила нас из своей фракции после наших недавних действий."
 eng_armor.830.a: "Они нам никогда не были нужны."
  
 eng_armor.831.t: "Судьба Эфиопии"
 eng_armor.831.d: "С освобождением Эфиопского полуострова встает вопрос о будущем этой земли. Мы можем продолжить наш империалистический курс и присоединить эту землю к нашей империи либо восстановить автономию Эфиопии и создать дружественное правительство, которое может стать сильным союзником."
 eng_armor.831.a: "Восстановить Эфиопию."
 eng_armor.831.b: "Присоединить землю."
 eng_armor.831.c: "Присоединить землю."
  
 eng_armor.832.t: "Марш на Кейбл-стрит"
 eng_armor.832.d: "БСФ на одном из своих маршей был остановлен на Кейбл-стрит после собрания антифашистов. К сожалению, стороны столкнулись, что привело к многочисленным травмам и арестам."
 eng_armor.832.a: "Это ужасное событие!"
 eng_armor.832.b: "Мы должны выступить против них!"
  
 eng_armor.833.t: "Марши в Ланкашире"
 eng_armor.833.d: "После катастрофы на Кейбл-стрит БСФ связал себя с более традиционными ценностями и, в частности, выступил за права женщин. Это нашло отклик у общественности, и их влияние и число последователей возросли. Как нам следует к этому относиться?"
 eng_armor.833.a: "Нам нужно пресечь его в зародыше, прежде чем он зацветет."
 eng_armor.833.b: "Возможно, мы сможем их использовать."
  
 eng_armor.834.t: "Выборы в Лондонский городской совет"
 eng_armor.834.d: "На недавних выборах в Лондоне к всеобщему удивлению наблюдался приток новых членов совета от БСФ. Так или иначе нам придется взаимодействовать с этой новой политической фракцией."
 eng_armor.834.a: "Черт бы побрал этих чернорубашечников"
 eng_armor.834.b: "Они становятся более полезными."
  
 eng_armor.835.t: "Положение об обороне 18B"
 eng_armor.835.d: ""
 eng_armor.835.a: ""
  
 eng_armor.836.t: "БСФ протестует против войны с Германией"
 eng_armor.836.d: "Наша война с Германией вызвала протесты со стороны БСФ. Твердо полагая, что Советский Союз представляет собой большую угрозу, они предсказывают, что в результате этой войны Европа станет слишком слабой, чтобы противостоять вторжению с Востока."
 eng_armor.836.a: "Мы не поступаемся принципами."
  
 eng_armor.837.t: "БСФ поддерживает войну против Советского Союза"
 eng_armor.837.d: "Наша война с Россией вызвала много аплодисментов со стороны радикальных партий, которые оказывают больше поддержки, чем раньше, чтобы помочь нам победить «красную угрозу»."
 eng_armor.837.a: "Мы рады их поддержке."
  
 eng_armor.838.t: "Блиц"
 eng_armor.838.d: ""
 eng_armor.838.a: ""
  
 eng_armor.840.t: "Военная ситуация"
 eng_armor.840.d: "Верховное командование проанализировало нашу стратегию с учетом нынешнего затруднительного положения, в котором мы находимся. Надеясь, что Советский Союз и Германия все еще могут начать войну друг с другом, они призвали нас прекратить войну против Советов и сосредоточить наше внимание на Германии."
 eng_armor.840.a: "Это было бы самым разумным."
 eng_armor.840.b: "Мы не можем простить Советский Союз."
  
 eng_armor.841.t: "Британия просит мира"
 eng_armor.841.d: "Британцы не смогут вести большую войну с двумя сильными континентальными державами. Они предлагают прекратить военные действия между нашими двумя странами, чтобы мы оба могли сосредоточиться на истинном враге в самом сердце Европы, Германии."
 eng_armor.841.a: "Мир — лучший выбор."
 eng_armor.841.b: "Мир уже горит."
  
 eng_armor.842.t: "[FROM.GetName] эвакуирует свой торговый флот"
 eng_armor.842.d: "После вторжения стран Оси [ROOT.GetName] отдал приказ отправить все торговые суда в Великобританию, чтобы предотвратить захват немцами."
 eng_armor.842.a: "Браво"
  
 eng_armor.843.t: "[ENG.GetName] требует наших заморских колоний"
 eng_armor.843.d: "Великобритания совершила полный разворот в своей внешней политике, вместо того, чтобы сохранить мир, она предпринимает шаги, чтобы стать единственной империей на Земле, и мы первые на очереди."
 eng_armor.843.a: "Без помощи мы беспомощны"
 eng_armor.843.b: "Это возмутительно!"
  
 eng_armor.844.t: "[DEN.GetName] отказывается от своих заморских колоний"
 eng_armor.844.d: "Видя свое безнадежное положение, [DEN.GetName] с горечью отдал нам свои колонии. Однако такой шаг с нашей стороны не остался незамеченным, и мы должны ожидать, что любые дальнейшие шаги будут встречены с большей силой."
 eng_armor.844.a: "Мы обеспечили северный торговый путь"
  
 eng_armor.845.t: "[DEN.GetName] не желает отдавать свои заморские колонии"
 eng_armor.845.d: "[DEN.GetName] отказались отдать свои колонии и поклялись защищать их от нашей агрессии... сколько бы времени это ни длилось."
 eng_armor.845.a: "Дураки"
  
 eng_armor.846.t: "Проблемы в Ираке"
 eng_armor.846.d: "Принц Абд аль-Илах, которому только что удалось избежать ареста, прибыл к нам и сообщил о готовящемся перевороте в Ираке. Это сообщение поступает наряду с другими сведениями об арестах пробританских граждан и изгнании политиков. Нет сомнений, что нам придется вмешаться, и поэтому нам следует немедленно подготовить оперативную группу."
 eng_armor.846.a: "Необходимо сделать приготовления"
  
 eng_armor.847.t: "Советский Союз принимает это предложение"
 eng_armor.847.d: "Советы видят важность этого вторжения и начали мобилизацию войск на границе. Как только мы будем готовы, мы дадим сигнал к полномасштабному началу вторжения."
 eng_armor.847.a: "Отлично"
  
 eng_armor.848.t: "Советский Союз отвергает наше предложение"
 eng_armor.848.d: "Советский Союз, похоже, не признает, что Иран представляет собой возможную угрозу или имеет какое-либо стратегическое значение, чтобы оправдать вторжение. Это ставит нас в такое положение, когда мы можем стать свидетелями гораздо более затяжной и дорогостоящей войны."
 eng_armor.848.a: "Мы пойдем одни"
 eng_armor.848.b: "План теперь слишком рискован"
  
 eng_armor.849.t: "Новые британские выборы"
 eng_armor.849.d: "Окончание войны привело к возвращению к нормальной жизни, и будущее Великобритании должно быть решено на следующих всеобщих выборах. Уинстон Черчилль сыграл важную роль в победе в войне, однако есть большие сомнения в его способности решать внутренние проблемы, не связанные с войной. Тем не менее он предсказывает, что очень скоро Британия столкнется с новыми угрозами, и для поддержания ее готовности к войне по-прежнему требуется сильная рука. Клемент Эттли же обещает мир и стабильность и осуждает глупые предсказания Черчилля."
 eng_armor.849.a: "Клемент Эттли — наш выбор"
 eng_armor.849.b: "Остаться с Черчиллем"
  
 ENG_BEF_category: "Британский экспедиционный корпус"
 ENG_BEF_category_desc: "Британский экспедиционный корпус, напоминающий БЭФ времен Первой мировой войны, был сформирован для усиления обороны Франции вдоль ее северной границы, а также, возможно, для защиты нейтралитета Бельгии. В случае нового вторжения Германии через страны Бенилюкса нам необходимо присутствовать, чтобы защитить наших союзников."
  
 eng_armor.850.t: "Обязательства перед Францией"
 eng_armor.850.d: "Наш союз с Францией требует, чтобы мы отправили войска для защиты их северной границы, пока там продолжаются боевые действия. §RЕсли мы потерпим неудачу, Франция, скорее всего, покинет нашу фракцию из-за нарушения нами доверия и ответственности§!.\nНа вкладке решений начинается миссия по удержанию войск вдоль границы в Северной Франции."
 eng_armor.850.a: "Мы отправим Британский экспедиционный корпус"
 ENG_commitments_to_france_tt: "Мы должны содержать £unit_infantry_icon_small §O10 дивизий во Франции, состоящих из 200 батальонов (включая батальоны поддержки) без обычной пехоты§! в пределах §Cвыделенных регионов§! на карте (§YНидерланды, Бельгия или французско-бельгийские приграничные провинции§!) до тех пор, пока у Франции, Великобритании или Германии не появится §Yпрогресс капитуляции§!"
 ENG_commitments_to_france_tt_2: "Франция покинет §YСтраны-Союзники§! и создаст §YАнтанту§!.\nВсе союзники из материковой Европы присоединятся к §YАнтанте§!."
  
 eng_armor.851.t: "Прибытие британских войск"
 eng_armor.851.d: "Британские войска прибыли в Северную Францию и заняли оборонительную позицию. Планы боевых действий теперь должны быть составлены совместно с Францией и претворены в жизнь, когда придет время."
 eng_armor.851.a: "Франция выдержит!"
  
 eng_armor.852.t: "Великобритания уходит из Франции"
 eng_armor.852.d: "Британские войска были эвакуированы из Франции без видимой причины. Мы можем только предположить, что Великобритания считает нашу защиту безнадежным делом. Если мы хотим выиграть эту войну, нам нужны надежные союзники, а не те, кто прячется за морем."
 eng_armor.852.a: "Мы получили удар в спину"
  
 eng_armor.853.t: "Распад Британской империи"
 eng_armor.853.d: "Наши огромные имперские расходы привели к огромному экономическому дефициту. Кроме того, на большей части нашей территории сильны движения за независимость, и умиротворение может оказаться единственным выходом. Мы и так едва держались, а это может стать гвоздем в крышку гроба, и Империя распадется."
 eng_armor.853.a: "Необходимо выбрать новое направление"
 
 eng_armor.855.t: "Обязательства перед Францией"
 eng_armor.855.d: "Наш новый союз с Францией требует, чтобы мы отправили войска на защиту северной границы, если начнется война. §RЕсли мы потерпим неудачу, Франция, скорее всего, покинет наш альянс из-за нарушения доверия и обязанностей§! \nНа вкладке решений появится задание отправить и держать войска вдоль границы в Северной Франции, если Германия объявит войну союзникам."
 eng_armor.855.a: "При необходимости мы отправим Британский экспедиционный корпус"
  
 eng_armor.854.t: "[ENG.GetNameWithFlag] разваливается"
 eng_armor.854.d: "Наши огромные имперские расходы привели к огромному экономическому дефициту по всем направлениям. Кроме того, на подавляющем большинстве нашей территории существуют сильные движения за независимость, и умиротворение может быть нашим единственным вариантом. Мы и так едва держались, и это может стать последним гвоздем в крышку гроба Империи."
 eng_armor.854.a: "Необходимо выбрать новое направление"
  
 britain.22.dAlt: "Сегодня Чемберлен объявил, что уходит в отставку после нескольких недель бесплодных дебатов и споров по вопросу перевооружения."
  
 eng_armor.857.t: "[ENG.GetName] требует наших атлантических островов"
 eng_armor.857.d: "Великобритания совершила полный разворот в своей внешней политике, вместо того, чтобы сохранить мир, она предпринимает шаги, чтобы стать единственной империей на Земле, и мы первые на очереди."
 eng_armor.857.a: "Без помощи мы беспомощны"
 eng_armor.857.b: "Это возмутительно!"
  
 eng_armor.858.t: "[POR.GetName] отдает свои атлантические острова"
 eng_armor.858.d: "Видя свое безнадежное положение, [POR.GetName] с горечью отдал нам свои острова. Однако такой шаг с нашей стороны не остался незамеченным, и мы должны ожидать, что любые дальнейшие шаги будут встречены с большей силой."
 eng_armor.858.a: "Мы обзавелись базами в Атлантике"
  
 eng_armor.859.t: "[POR.GetName] отказывается отдать свои атлантические острова"
 eng_armor.859.d: "[POR.GetName] отказались отдать свои острова и поклялись защищать их от нашей агрессии... сколько бы времени это ни длилось."
 eng_armor.859.a: "Дураки"
  
 eng_armor.860.t: "Чемберлен отказывается"
 eng_armor.860.d: "Невил Чемберлен должен был сформировать новое правительство, но после недавней женитьбы короля он отказался от должности премьер-министра, заявив, что чувствует, что не может представлять страну в данных обстоятельствах."
 eng_armor.860.a: "Тогда им, черт возьми, стоит найти другого парня!"
  
 eng_armor.861.t: "Правительственный кризис"
 eng_armor.861.d: "После многих дней дебатов парламент парализован и не может сформировать новое правительство. Те немногие кандидаты, которые готовы занять пост премьер-министра, не имеют поддержки большинства в палате."
 eng_armor.861.a: "Бесполезные политики"
 ENG_fallen_government_support_loss_commons: "Теряет большинство сторонников в Палате общин"
 ENG_fallen_government_support_loss_lords: "Теряет большинство сторонников в Палате лордов"
  
 eng_armor.856.t: "[USA.GetName] присоединяются к войне"
 eng_armor.856.d: "После долгого и сложного периода борьбы в одиночку США наконец присоединились к борьбе! Как и в прошлой войне, Соединенные Штаты с их огромной промышленностью, богатством и людскими ресурсами непременно обеспечат победу."
 eng_armor.856.a: "Янки идут!"
  
