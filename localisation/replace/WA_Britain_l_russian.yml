 ENG_trigger_article_25: "Выйти из Лондонского военно-морского договора, используя статью 25."
 ENG_trigger_article_25_desc: "С началом второй англо-германской гонки военно-морских вооружений нам разрешено отступить от договорных ограничений, введя в действие статью 25. Поскольку мы являемся основной стороной, подписавшей Лондонский военно-морской договор, это приведет к отмене Лондонского военно-морского договора и для остальных подписантов."
  
 ENG_illustrious: "Заказать класс «Illustrious»"
 ENG_illustrious_desc: "Мы сильно ограничены в количестве авианосцев, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 4 авианосца класса «Illustrious»"
  
 ENG_implacable: "Заказать класс «Implacable»"
 ENG_implacable_desc: "Мы сильно ограничены в количестве авианосцев, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 1 авианосец класса «Implacable»"
  
 ENG_king_george: "Заказать класс «King George V»"
 ENG_king_george_desc: "Мы сильно ограничены в количестве линкоров, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 5 линкоров класса «King George V»"
  
 ENG_lion: "Заказать класс «Lion»"
 ENG_lion_desc: "Мы сильно ограничены в количестве линкоров, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 2 линкора класса «Lion»"
  
 ENG_surrey: "Заказать класс «Surrey»"
 ENG_surrey_desc: "Мы сильно ограничены в том, сколько тяжелых крейсеров мы можем построить. В соответствии с этими ограничениями мы можем заказать только 2 тяжелых крейсера класса «Surrey»"
  
 ENG_albemarle: "Заказать класс «Albemarle»"
 ENG_albemarle_desc: "Мы сильно ограничены в том, сколько тяжелых крейсеров мы можем построить. В соответствии с этими ограничениями мы можем заказать только 2 тяжелых крейсера класса «Albemarle»"
  
 ENG_dido: "Заказать класс «Dido»"
 ENG_dido_desc: "Мы сильно ограничены в количестве легких крейсеров, которые мы можем построить. Согласно этим ограничениям, мы можем заказать только 9 крейсеров класса «Dido»."
 
 ENG_crown_colony: "Заказать класс «Crown Colony»"
 ENG_crown_colony_desc: "Мы сильно ограничены в количестве легких крейсеров, которые мы можем построить. Согласно этим ограничениям, мы можем заказать только 7 крейсеров класса «Crown Colony»."

 ENG_change_asian_resource_rights: "Изменить права на азиатские ресурсы"
 ENG_change_asian_resource_rights_desc: "Принятие этого решения при наличии прав на ресурсы на Малайском полуострове и Северном Борнео удалит эти права. \nЕсли у вас нет прав на ресурсы в этих регионах, но они контролируются вашим сателлитом, принятие этого решения даст вам права на ресурсы там."

