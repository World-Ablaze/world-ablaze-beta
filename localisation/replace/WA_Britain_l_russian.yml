 ENG_the_kings_speech: "Речь короля"
 ENG_the_kings_speech_desc: "«В этот тяжкий час, возможно, самый роковой в нашей истории, второй раз в жизни большинства из нас мы находимся на войне. Снова и снова мы пытались найти мирный выход из разногласий между нами и теми, кто теперь является нашими врагами. Но это было напрасно. Задача будет трудной. Возможно, впереди нас ждут темные дни, и война больше не ограничивается полем боя»."
 ENG_the_kings_speech_tt: "£faction_eng_british_royalists §YРоялисты§!, £faction_eng_conservative §Y§YКонсерваторы§!§! и £faction_eng_labour §Y§YЛейбористы§!§! станут §3дружелюбнее§!, в сумме увеличивая £political_power_texticon  §Yежедневный прирост политической власти§! на §G+0.15§!."
  
