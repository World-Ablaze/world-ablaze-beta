 ENG_state_visit_to_france: "Государственный визит во Французскую Республику"
 ENG_state_visit_to_france_desc: "Великая война сблизила Великобританию и Францию, и теперь, пережив потрясения последних десятилетий, пришло время восстановить наши дружеские отношения и сохранить близость наших двух стран."
  
 ENG_state_visit_to_the_usa: "Государственный визит в Соединённые Штаты"
 ENG_state_visit_to_the_usa_desc: "Соединённые Штаты Америки — растущая сверхдержава, и чем скорее мы наладим более тесные связи, тем лучше, возможно, нам придется рассчитывать на них в будущем, и лучше, чтобы они уже были с нами в дружеских отношениях."
  
