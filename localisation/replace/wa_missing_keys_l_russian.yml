 germany.1191.desc: "Война с государством [GER.GetNameDef] стремительно близится к неизбежной развязке, и [yalta_origin.GetNameDef] предлагает нам провести конференцию о будущем Европы.\n\nСогласно предложению, которое отстаивает сам Черчилль, Германия будет поделена на три государства: Западногерманское, Северогерманское и Южногерманское, в которое войдут также части бывшей Австро-Венгерской империи. Все они окажутся в сфере влияния Союзников, а остальная Центральная и Восточная Европа отойдёт в нашу сферу влияния."
 germany.1191.t: "План Черчилля"
 germany.130.desc: "После Ялтинской конференции войска отошли к соответствующим границам, и Западный Берлин вошел в зону союзной оккупации. Его расположение уязвимо, и нам следует немедленно разместить там войска."
