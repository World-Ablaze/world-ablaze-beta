 iron_shortage_ai: "Дефицит железа"
 irq_armor.03.d: "Шииты составляют значительную часть нашего населения и требуют религиозных свобод и представительства в правительстве. Предоставив эти права, мы расстроим суннитов, но это также предотвратит дальнейшие восстания и позволит нам сосредоточиться на более насущных делах."
 irq_armor.03.t: "Религиозная терпимость"
 irq_armor.4.a: "К войне!"
 ita_armor.834.b: "Да! Мы не сдадимся без боя!"
 japan.10.a: "Пусть говорят."
 japan.10.d: "Президент [USA.GetLeader] публично осудил нашу войну, назвав её неприкрытой агрессией и предупредив, что США не будут безучастно наблюдать за нападениями на мирные государства. Речь широко освещалась в прессе, и наши отношения с Вашингтоном заметно ухудшились."
 japan.10.t: "США осуждают нашу войну"
 man_armor.825: "За истинного императора!"
 man_armor.825.d: "Пришло время выполнить наше тайное соглашение с империей Цин. Мы перейдём под покровительство истинного императора Китая и вступим в войну против Республики и коммунистов."
 man_armor.825.t: "Верность договору с Цин"
 man_armor.826.d: "[FROM.GetName] выполнил своё обещание и вступил в войну на нашей стороне против Республики и коммунистов."
 man_armor.827.d: "Республика и коммунисты разгромлены, и весь Китай лежит перед императором. Милитаристы, которые всё ещё держатся за свою независимость, будут призваны подчиниться трону Цин."
 man_armor.827.t: "Присоединение милитаристов"
 man_armor.828.d: "Республики и коммунистов больше нет, и империя Цин потребовала от нас подчиниться власти императора. Встать вместе с нами против неё больше некому, и наши земли войдут в состав империи."
 man_armor.828.t: "Цин требуют подчинения"
 may_lead_to_soviet_war_tt: "§RЭто может привести к войне с Советским Союзом и Литвой.§!"
 mexico.57.a: "Революцией в Америке не будут командовать из Москвы!"
 mexico.57.b: "С ними разберутся."
 mexico.57.c: "Коммунисты грызутся между собой."
 mexico.57.desc: "В пламенной речи перед мексиканским Конгрессом [MEX.GetLeader] открыто порвал с Советским Союзом, назвав советское руководство бюрократами, предавшими международный пролетариат. Заявив, что Мексика понесёт знамя мировой революции своим путём, [MEX.GetLeader] призвал рабочих обеих Америк следовать мексиканскому примеру, а не выполнять приказы Москвы.\n\nСоветская пресса ответила потоком брани, и наблюдатели опасаются, что раскол в коммунистическом мире вскоре может перерасти в открытую вражду."
 mexico.57.title: "Мексика порывает с Москвой"
