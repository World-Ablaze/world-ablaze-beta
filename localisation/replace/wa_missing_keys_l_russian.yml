 soviet.90.a: "Бессарабия снова наша."
 soviet.90.d: "Наши войска установили контроль над Бессарабией и Северной Буковиной. Спорные земли прочно в наших руках, а румынская армия не в силах их отбить, так что Бухаресту не остается ничего иного, как признать новую границу. Войну с Румынией можно завершать."
 soviet.90.t: "Бессарабия взята"
 soviet.91.a: "Горькое поражение."
 soviet.91.d: "Кампания по возвращению Бессарабии затянулась куда дольше, чем рассчитывали в Москве. Румыны продолжают сопротивляться, наши потери растут, а народ устал от войны, которая должна была стать молниеносной. Нам не остается ничего иного, кроме как заключить мир с Бухарестом и смириться с этим унизительным исходом."
 soviet.91.t: "Провал Бессарабской кампании"
 spa_armor.807.a: "§YПроверьте политические решения§!"
 spa_armor.807.d: "Поскольку поддержка, оказанная нам Испанией, привела к эмбарго со стороны США, Испания просит нас выполнить обещание и обеспечить её импортом продовольствия, чтобы прокормить страну."
 spa_armor.807.t: "Испания просит об импорте продовольствия"
 start_systems: "Отладка: запустить швейцарские механики"
 swe_tech_commandos: "Коммандос"
 treaty_org.1.d: "После того как непосредственная угроза миру была устранена, [SOV.GetNameDef] и западные державы начали менять политический курс. Отношения начали ухудшаться, а недавние события в Восточной Германии вызывали опасения, что дипломатическим отношениям между странами придет конец.\n\nВ Брюсселе была созвана срочная конференция, на которой [FROM.GetNameDef] и ряд дипломатов предложили заключить договор о взаимопомощи."
 treaty_org.4.t: "Организация Североатлантического договора"
 tur_armor.817.desc: "[TUR.GetLeader] потребовал включения Хатая в состав Турции. Наши полицейские силы отметили значительное скопление турецких войск на границе после предыдущего отказа, а новый отказ спровоцирует войну между нашими странами."
 tur_armor.818.desc: "[TUR.GetLeader] произнес небольшую речь в Антакье, приветствуя граждан Хатая в [TUR.GetNameDef], и поблагодарил [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатая. Несмотря на то, что этот шаг вызвал возмущение сирийских официальных лиц, в Хатае и в [TUR.GetNameDef] в целом царило удовлетворение, и многие [TUR.GetAdjective]ие люди совершили поездки из своих домов в Хатай, чтобы отметить появление новейшей провинции торжествами и обменом подарками."
 tur_armor.819.desc: "[TUR.GetLeader] провел пламенный митинг в Газиантепе, где осудил притеснение турок за рубежом со стороны [FROM.GetNameDef]. [TUR.GetAdjective]ий народ был взбудоражен, и в настоящий момент между угнетателями Хатая и народом [FROM.GetNameDef] царит острая неприязнь. На данный момент Хатай остается вне нашей досягаемости, но мы всегда будем помнить об этом гнусном предательстве."
 usa_armor.801.a: "Согласиться на мир"
 usa_armor.801.b: "Отвергнуть мир"
 usa_armor.890.d: "Перед лицом надвигающейся войны Вашингтон ускорил подготовку. Перспективных офицеров повышают в звании, на вооружение поступает новая техника, а военно-морские базы, аэродромы и инфраструктура на Тихом океане расширяются. Для руководства военным производством привлечён Дональд Нельсон."
 usa_armor.890.t: "Подготовка к войне"
 usa_nuke_hiroshima: "Атомная бомбардировка Хиросимы"
 usa_nuke_nagasaki: "Атомная бомбардировка Нагасаки"
 usa_nuke_tokyo: "Атомная бомбардировка Токио"
 wtt_border_conflict_escalation.1.a: "Удержать позиции!"
 wtt_border_conflict_escalation.1.desc: "Противостояние на нашей границе с [From.GetNameRuInst] приняло опасный оборот. Вместо того чтобы отступить, войска под командованием лидера [From.GetLeader] получили подкрепления и открыли огонь по нашим позициям.\n\nТо, что начиналось как простой инцидент, переросло в настоящий пограничный конфликт. Наши войска в этом районе должны удержать позиции, иначе спорная территория будет потеряна."
 wtt_border_conflict_escalation.1.t: "[From.GetNameDefCap] обостряет пограничный инцидент"
 wtt_political_warlord_support.14.a: "Посмотрим, что мы можем выделить."
 wtt_political_warlord_support.14.desc: "Переговоры с лидером [From.GetLeader] завершились. Руководитель [From.GetNameRuGen] отметил, что экономика его страны сильно отстаёт, а народ страдает от нехватки заводов и работы.\n\nЕсли мы поможем лидеру [From.GetLeader] развить промышленность [From.GetNameRuGen], то он будет рад публично заявить о своей поддержке нашей стороны."
 wtt_political_warlord_support.14.t: "[From.GetLeader] просит промышленной помощи."
