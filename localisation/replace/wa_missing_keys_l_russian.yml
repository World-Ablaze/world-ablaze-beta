 denmark_events.3.desc: "Иностранные войска пересекли наши границы. Десятилетиями политика нейтралитета позволяла нашей стране оставаться в стороне от европейских войн, но декларации мало что значат для наступающей армии. Объявление нейтралитета больше не может нас защитить, и стране придётся встретить войну, которой она так старалась избежать."
