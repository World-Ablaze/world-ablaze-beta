 DOD_hungary.151.desc_cat_fighter: "Министерство авиации желает приобрести новый легкий истребитель для боевых рейдов и обороны объектов, но министерство иностранных дел отметило, что политические и дипломатические мотивы также должны влиять на выбор страны, у которой мы закажем самолеты."
