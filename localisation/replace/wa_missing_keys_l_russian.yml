 afo_news.57.d: "Вчера французская армия взяла штурмом ключевые объекты Парижа. Главные должностные лица были арестованы. Переворот, возглавляемый Луи Наполеоном, только что вернувшимся из изгнания, и которому помогает молодой офицерский корпус, направлен на предотвращение создания тоталитарного государства при будущем короле Альфонсе I. Что произойдет дальше, пока неясно, но, возможно, мы стоим на пороге возвращения Французской империи."
