 hi_convoys: "Хай-Конвои"
 hun_armor.838.b: "Мы получили ценный опыт"
 hun_armor.845.d: "К сожалению, [FROM.GetAdjective]ий министр иностранных дел передал послание государства [FROM.GetNameDef], которое, вне всякого сомнения, является прямым предательством идеалов альянса '[ROOT.GetFactionName]' и [ROOT.GetRulingIdeology]! [FROM.GetAdjective]ое правительство вышло из нашего альянса и заявило, что теперь будет сражаться на другой стороне."
