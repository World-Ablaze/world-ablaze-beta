 bftb_turkey.106.a: "Остановить строительство в регионе."
 bftb_turkey.106.b: "Прогресс не будет ждать курдов."
 bftb_turkey.106.desc: "Лидеры курдских общин направили [ROOT.GetLeader] петицию против новых дорог и железнодорожных путей, которые прокладываются по их землям. Курды видят в этих проектах не развитие, а способ для Анкары перебросить войска и чиновников глубже в горы, и требуют остановить строительство в их регионе и разобрать уже построенное.\n\nУступка будет стоить нам части вложений, но может успокоить самые неспокойные курдские районы."
 bftb_turkey.106.t: "Курды против строительства инфраструктуры"
 bftb_turkey.107.a: "Пусть идут — мы их выслушаем."
 bftb_turkey.107.b: "Разогнать демонстрантов."
 bftb_turkey.107.desc: "Тысячи курдов вышли на дороги востока страны: они идут от деревни к деревне и в провинциальные города, требуя автономии и права на родной язык и обычаи. Пока шествия проходят мирно, но власти опасаются, что они могут перерасти в нечто куда более опасное.\n\nМы можем потерпеть демонстрации и начать диалог ценой политических усилий или приказать жандармерии разогнать их."
 bftb_turkey.107.t: "Курдский марш за свободу"
 bftb_turkey.108.a: "Предоставить освобождение."
 bftb_turkey.108.b: "Каждый гражданин обязан служить Республике."
 bftb_turkey.108.desc: "Курдские старейшины заявили, что их молодёжь не откликнется на призыв армии, которую они считают орудием своего угнетения. Они требуют освободить курдские районы от воинской повинности, обещая взамен признать власть государства.\n\nСогласие позволит прочно закрепить регион под нашим управлением, хоть и ценой людских ресурсов, которые он мог бы дать. Отказ же будет воспринят как очередное оскорбление со стороны Анкары."
 bftb_turkey.108.t: "Курды требуют освобождения от призыва"
 bftb_turkey.109.a: "Ввести войска."
 bftb_turkey.109.b: "Сейчас нам с ними не справиться."
 bftb_turkey.109.desc: "Вооружённые отряды курдских радикалов захватили несколько сельских городков на востоке страны, изгнав жандармов и местных чиновников и подняв свои флаги над правительственными зданиями. По имеющимся данным, повстанцы хорошо организованы и пользуются поддержкой значительной части местного населения.\n\nОтвоевать городки можно только ценой дорогостоящей военной операции, но если оставить их в руках мятежников, сепаратисты лишь осмелеют."
 bftb_turkey.109.t: "Курдские радикалы захватывают сельские городки на востоке"
 bftb_turkey.78.a: "Значит, сделаем всё сами."
 bftb_turkey.78.desc: "[IRQ.GetAdjective]ие лоялисты подавили фашистский мятеж и восстановили власть правительства над всей страной. Наши надежды привести к власти в Ираке дружественный режим руками «Золотого квадрата» рухнули, однако гражданская война истощила [IRQ.GetAdjective]ую армию. Если Ирак не войдёт в нашу сферу влияния сам, его придётся привести туда силой."
 bftb_turkey.78.t: "[IRQ.GetAdjective]ое правительство побеждает"
