 SOUTH_AMERICA_collectivist_ethos: "Коллективистский этос"
 SOUTH_AMERICA_collectivist_ethos_desc: "Наши враги могут разделять и покорять малые страны, но наш народ будет един. Все за одного и один за всех."
  
 SOUTH_AMERICA_liberty_ethos: "Этос свободы"
 SOUTH_AMERICA_liberty_ethos_desc: "В эпоху идеологического фанатизма, грозящего задушить человеческий дух, мы будем защищать права и свободы личности."
  
 SOUTH_AMERICA_militarism: "Милитаризм"
 SOUTH_AMERICA_militarism_desc: "Те, кто считает армию неизбежным злом, обречены колебаться перед лицом войны. Мы внедрим милитаризм в нашу культуру, чтобы стать народом солдат."
  
 SOUTH_AMERICA_political_correctness: "Политкорректность"
 SOUTH_AMERICA_political_correctness_desc: "Люди, придерживающиеся слегка спорных или неловких взглядов, похоже, обеспокоены тем, что против них существует широкомасштабный заговор. Кажется, это отличная идея."
  
 SOUTH_AMERICA_neutrality_focus: "Курс на нейтралитет"
 SOUTH_AMERICA_neutrality_focus_desc: "Хотя другие могут утверждать, что для того, чтобы принять чью-либо сторону в глобальном конфликте, нужны храбрость и мудрость, мы знаем, что для отказа нужно нечто большее."
  
 SOUTH_AMERICA_interventionism_focus: "Курс на интервенционизм"
 SOUTH_AMERICA_interventionism_focus_desc: "Мы ценим свободу всех людей, а не только своих граждан. Если предотвращение тирании означает войну, то пусть будет так."
  
 SOUTH_AMERICA_military_youth: "Военная молодежь"
 SOUTH_AMERICA_military_youth_desc: "Организации, способствующие дисциплине и политическому образованию молодежи в нашей стране, будут способствовать раннему развитию лояльности и самопожертвования."
  
 SOUTH_AMERICA_deterrence: "Сдерживание"
 SOUTH_AMERICA_deterrence_desc: "В одиночку мы редко получаем выгоду от войны. К счастью, мы знаем, что лучшая защита — это та, которая настолько хорошо известна, что вам никогда не придется ее использовать."
  
 SOUTH_AMERICA_volunteer_corps: "Добровольческий корпус"
 SOUTH_AMERICA_volunteer_corps_desc: "Заставлять наших людей умирать за идеалы свободы было бы иронией, но создание возможностей для тех, кто желает помочь людям за рубежом, таковым не является."
  
 SOUTH_AMERICA_paramilitarism: "Парамилитаризм"
 SOUTH_AMERICA_paramilitarism_desc: "Военные принципы имеют применение за пределами вооруженных сил. С развитием полумилитаризованных подразделений в дополнение к нашим вооруженным силам больше людей будут проходить военную подготовку."
  
 SOUTH_AMERICA_indoctrination_focus: "Идеологическая обработка"
 SOUTH_AMERICA_indoctrination_focus_desc: "Установив, что наша идеология основана на истине, ее можно преподавать как истину. Образование и средства массовой информации должны отразить этот урок."
  
 SOUTH_AMERICA_foreign_expeditions: "Зарубежные экспедиции"
 SOUTH_AMERICA_foreign_expeditions_desc: "Поскольку наши враги готовы вмешаться в отдаленные конфликты во имя своих идеалов, мы должны быть готовы сделать то же самое в отношении своих идеалов."
  
 SOUTH_AMERICA_why_we_fight: "Почему мы сражаемся"
 SOUTH_AMERICA_why_we_fight_effect: "Если у нас не будет духа §YНейтральной внешней политики§!, мы сможем создавать фракции.\n"
 SOUTH_AMERICA_why_we_fight_desc: "Мир становится все более небезопасным. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Пришло время сплотить людей ради нашего дела и убедиться, что все готовы бороться за нашу свободу."
  
 SOUTH_AMERICA_political_commissars: "Политические комиссары"
 SOUTH_AMERICA_political_commissars_desc: "Чтобы обеспечить реализацию нашей политики в военной практике, мы введем в ряды армии чиновников, назначаемых по политической линии."
  
 SOUTH_AMERICA_internationalism_focus: "Фокус интернационализма"
 SOUTH_AMERICA_internationalism_focus_desc: "Идеология не знает границ. Другая нация может называть себя суверенной, но наши убеждения выше подобных претензий."
  
 SOUTH_AMERICA_nationalism_focus: "Фокус национализма"
 SOUTH_AMERICA_nationalism_focus_desc: "Наша нация уникальна, и наши политические достижения могли произойти только здесь. Мы должны бороться за нее любой ценой."
  
 SOUTH_AMERICA_ideological_fanaticism: "Идеологический фанатизм"
 SOUTH_AMERICA_ideological_fanaticism_desc: "Наши политически устоявшиеся ценности и цели стоят того, чтобы умереть за них так же, как и за любую древнюю веру. Любой последователь должен быть готов встретить смерть, а тем, кто сбился с пути, лучше быть готовыми встретить смерть."
  
 SOUTH_AMERICA_technology_sharing: "Обмен технологиями"
 SOUTH_AMERICA_technology_sharing_desc: "Поделившись технологическими достижениями с нашими союзниками, вся наша фракция сможет более эффективно проводить исследования и разработки в военное время."
 
 

 
 
 ven_armor.01.t: "Британцы требуют эмбарго"
 ven_armor.01.d: "Британцы требуют, чтобы мы наложили эмбарго на Германию, чтобы они не имели доступа к нашей нефти. Это явное нарушение нашего суверенитета, но наш народ не хочет воевать и не любит немцев. Мы не хотим войны, но если мы хотим торговать с Германией, нам, возможно, придется это сделать."
 ven_armor.01.a: "Мы согласимся на эти требования"
 ven_armor.01.b: "Они не могут заставить нас что-либо делать"
  
 ven_armor.02.t: "Венесуэла принимает наши требования"
 ven_armor.02.d: "Нефтяные бароны Венесуэлы прозрели, приняли наши условия и прекратили торговлю с Германией. Это, безусловно, повлияет на нефтяную ситуацию в Германии в нашу пользу."
 ven_armor.02.a: "Наша британская мощь снова победила."
  
 ven_armor.03.t: "Венесуэла отклоняет наши требования"
 ven_armor.03.d: "Нефтяные бароны отвергли наши требования. Теперь единственным выходом остается война. Мы должны быть осторожны, чтобы Америка не вмешалась, и поэтому блокада предпочтительнее."
 ven_armor.03.a: "Пришло время показать им, кто здесь хозяин!"
  
 ven_armor.04.t: "Венесуэла налагает на нас эмбарго"
 ven_armor.04.d: "Правительство Венесуэлы наложило на нас эмбарго. Вероятно, из-за давления со стороны англичан. Это делает Румынию жизненно важным производителем нефти для нас, и мы должны защищать ее как можно лучше."
 ven_armor.04.a: "Будь они прокляты, эти британские крысы!"
 