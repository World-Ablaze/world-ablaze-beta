 ita_motorized_equipment_1_desc: ""
   
 ita_mechanized_equipment_1: "ADR Blindato"
 ita_mechanized_equipment_1_short: "ADR Blindato"
 ita_mechanized_equipment_1_desc: "ADR Blindato имеет относительно высокую броню, но низкую для своего времени защиту. Его бронированная кабина обеспечивала хорошую защиту от осколочно-фугасного огня и огня стрелкового оружия, но обеспечивала очень мало обзора для пассажиров."
   
 ita_mechanized_equipment_2: "Fiat 665NM"
 ita_mechanized_equipment_2_short: "Fiat 665NM"
 ita_mechanized_equipment_2_desc: "Схема бронирования 665NM полностью герметизирует экипаж и десант изнутри. Он повышает твердость и надежность, но с точки зрения боевой статистики других изменений не произошло."
   
 ita_mechanized_equipment_3: "SPA Dovunque 35"
 ita_mechanized_equipment_3_short: "SPA Dovunque 35"
 ita_mechanized_equipment_3_desc: "Эта модель, известная как вездеход, отличается улучшенной механизированной мобильностью, броней и живучестью."
   
 ita_mechanized_equipment_4: "Fiat 727NM"
 ita_mechanized_equipment_4_short: "Fiat 727NM"
 ita_mechanized_equipment_4_desc: "Первый итальянский полугусеничный автомобиль, это более надежная машина, которая отталкивает броню для противодействия противотанковым ружьям за счет некоторой скорости."
   
 ita_mechanized_equipment_5: "VCC-1 Camillino"
 ita_mechanized_equipment_5_short: "VCC-1 Camillino"
 ita_mechanized_equipment_5_desc: "Основанный на американской механизированной конструкции, Camillino произвел революцию в итальянской механизированной линии, значительно увеличив характеристики по всем направлениям."
   
 ita_scout_car_equipment_1: "AB 611"
 ita_scout_car_equipment_1_short: "AB 611"
 ita_scout_car_equipment_1_desc: "AB 611 — это броневик, предназначенный в первую очередь для колониальных и полицейских служб. Таким образом, он плохо подходит для боевых действий на передовой против хорошо оснащенной пехоты. Проблемы конструкции, такие как отсутствие обзорных иллюминаторов, неподходящий двигатель и слабое вооружение, делают эту машину ужасной в использовании."
   
 ita_scout_car_equipment_2: "S37"
 ita_scout_car_equipment_2_short: "S37"
 ita_scout_car_equipment_2_desc: "S37 окажется во многих ловушках, в которые попал AB 611, поскольку у него нет соответствующих средств, обеспечивающих экипажу адекватный обзор или огневую мощь. Одним из ключевых улучшений является двигатель, поскольку у него значительно увеличена максимальная скорость. Чтобы сделать итальянские автомобили жизнеспособными, необходимо внести еще много улучшений."
   
 ita_scout_car_equipment_3: "AS 42"
 ita_scout_car_equipment_3_short: "AS 42"
 ita_scout_car_equipment_3_desc: "AS 42 — первая итальянская машина, эффективная в бою. Его низкий профиль и высокая мобильность особенно хорошо подходят для редкого поля боя в пустыне Северной Африки. Одна из проблем конструкции заключается в том, что она имеет относительно небольшое количество брони."
   
 ita_scout_car_equipment_4: "AS 43"
 ita_scout_car_equipment_4_short: "AS 43"
 ita_scout_car_equipment_4_desc: "Благодаря переработке конструкции корпуса AS 43 теперь способен выдерживать больше попаданий, не неся потерь в бою. Некоторые характеристики, такие как защита и прорыв, после редизайна немного пострадали."
   
 ita_armoured_car_equipment_2: "AB 41"
 ita_armoured_car_equipment_2_short: "AB 41"
 ita_armoured_car_equipment_2_desc: "AB 41 улучшает многие аспекты S37, позволяя ему лучше выполнять боевые задачи, не будучи при этом полностью устаревшим. Несмотря на это, AB 41 все еще сильно устарел по сравнению с боевыми бронированными машинами других крупных стран."
   
 ita_armoured_car_equipment_3: "AB 43"
 ita_armoured_car_equipment_3_short: "AB 43"
 ita_armoured_car_equipment_3_desc: "По сути являясь AB 41 с 47-мм пушкой, AB 43 имеет повышенную бронепробиваемость для борьбы с техникой противника. Однако пробиваемость все еще очень мала, и орудие, скорее всего, способно пробить только легкую броню."
   
