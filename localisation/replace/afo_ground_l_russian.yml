 jap_modern_equipment_2: "STA-2"
 jap_modern_equipment_2_short: "STA-2"
 jap_modern_equipment_2_desc: "Созданный по образцу американских танков, STA-2 жертвует значительной частью своей брони в пользу высоких наступательных характеристик и маневренности. К сожалению, STA 2 по-прежнему считается сильно отстающим в технологическом отношении по сравнению с танками других крупных стран."
   
 jap_modern_equipment_3: "Type 61"
 jap_modern_equipment_3_short: "Type 61"
 jap_modern_equipment_3_desc: "Следуя опыту STA-2 и других танков, Type 61 был оснащен 90-мм пушкой. Это дает ему повышенные бронебойные и противотанковые возможности. Несмотря на хорошее улучшение, этот танк сильно отстает от большинства современных танков."
   
