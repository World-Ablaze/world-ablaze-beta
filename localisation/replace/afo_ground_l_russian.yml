 sov_heavy_spg_equipment_4: "С-51"
 sov_heavy_spg_equipment_4_short: "С-51"
 sov_heavy_spg_equipment_4_desc: "В этой САУ используется 203-мм гаубица Б-4 вместо предыдущей меньшей 152-мм гаубицы Бр-2. Чтобы лучше адаптировать С-51 к роли платформы для вооружения дальнего действия, с машины было снято большое количество брони, а корпус был переработан, чтобы сделать его открытым. Это значительно уменьшило вес автомобиля и сделало и без того дешевый автомобиль еще дешевле."
   
