 fra_mechanized_equipment_1: "Somua MCL"
 fra_mechanized_equipment_1_short: "Somua MCL"
 fra_mechanized_equipment_1_desc: "Выполняя роль транспорта, Somua MCL не предоставляет пехоте никаких наступательных возможностей, а отсутствие брони делает его немногим лучше грузовика. Однако его низкая стоимость позволяет легко выставлять его в больших количествах."
   
 fra_mechanized_equipment_2: "Lorrain 38L"
 fra_mechanized_equipment_2_short: "Lorrain 38L"
 fra_mechanized_equipment_2_desc: "Lorrain 38L представлял собой полностью гусеничный бронетранспортер. Хотя его слабая броня обеспечивает слабую защиту, он может перевозить больше войск, чем предыдущие модели, и достаточно дешев для массового производства. \n§RЭто совершенно новая модель, которая не сохранит производственную эффективность§!"
   
 fra_mechanized_equipment_3: "Lorrain 39L"
 fra_mechanized_equipment_3_short: "Lorrain 39L"
 fra_mechanized_equipment_3_desc: "Lorraine 39L — это усовершенствованная версия модели 38L, обладающая большей мобильностью и защитой. \n§GЭффективность производства сохранится по сравнению с предыдущей моделью§!"
   
 fra_mechanized_td_equipment_1: "Chasseur de Chars Lorraine"
 fra_mechanized_td_equipment_1_short: "Chasseur de Chars Lorraine"
 fra_mechanized_td_equipment_1_desc: "Эта машина, известная просто как Chasseur de Chars Lorraine, представляет собой попытку объединить новую стандартную 47-мм противотанковую пушку SA 39 с механизированной платформой. Пистолет — отличный инструмент, но сама машина оставляет желать лучшего. \n§GЭффективность производства сохранится по сравнению с предыдущей моделью§!"
   
 fra_mechanized_equipment_4: "Lorrain 41L"
 fra_mechanized_equipment_4_short: "Lorrain 41L"
 fra_mechanized_equipment_4_desc: "Улучшенная версия 39L с 7,5-мм пулеметом MAC-34, повышенной мобильностью и радиосвязью. \n§GЭффективность производства сохранится по сравнению с предыдущей моделью§!"
   
 fra_mechanized_equipment_5: "EBR VTT"
 fra_mechanized_equipment_5_short: "EBR VTT"
 fra_mechanized_equipment_5_desc: "EBR-версия броневика Panhard EBR. Хорошая защита и огневая мощь позволяют пехоте быть гораздо более выносливой в бою. Однако именно феноменальная мобильность является изюминкой этого автомобиля. \n§RЭто совершенно новая модель, которая не сохранит производственную эффективность§!"
   
 fra_mechanized_equipment_6: "AMX VTT"
 fra_mechanized_equipment_6_short: "AMX VTT"
 fra_mechanized_equipment_6_desc: "AMX-VTT — БТР, способный выступать в качестве боевой машины на передовой. Он обеспечивает значительную защиту и огневую мощь пехоты. \n§RЭто совершенно новая модель, которая не сохранит производственную эффективность§!"
   
 fra_amphibious_mechanized_equipment_1: "Char De Bataille SRB"
 fra_amphibious_mechanized_equipment_1_short: "Char De Bataille SRB"
 fra_amphibious_mechanized_equipment_1_desc: ""
   
 fra_scout_car_equipment_1: "Panhard 175"
 fra_scout_car_equipment_1_short: "Panhard 175"
 fra_scout_car_equipment_1_desc: "Panhard 175 является развитием межвоенного опыта и усовершенствованием броневика Panhard 165. Их экипажи оснащены радиооборудованием и поддержкой, обеспечивающей лучшую координацию. Благодаря опыту Франции в таких конфликтах, как война в Рифе, ее ранний броневик является лучшим среди всех стран-союзников. Хотя он и затмевает немецкие броневики, в некоторых аспектах он все же может конкурировать с ними."
   
 fra_scout_car_equipment_2: "AMD 38"
 fra_scout_car_equipment_2_short: "AMD 38"
 fra_scout_car_equipment_2_desc: "AMD 38 имеет лишь некоторые незначительные улучшения по сравнению с Panhard 175. Он жертвует небольшим уровнем наступательных возможностей, чтобы обеспечить лучшую защиту экипажа за счет более высоких показателей защиты и брони."
   
 fra_scout_car_equipment_3: "AMR 39"
 fra_scout_car_equipment_3_short: "AMR 39"
 fra_scout_car_equipment_3_desc: "Как и его предшественник, в AMR 39 внесены лишь небольшие изменения, направленные на повышение его боевой эффективности. Он обладает большей надежностью и пробиваемостью, но только в небольших количествах."
   
 fra_scout_car_equipment_4: "Panhard AML 60"
 fra_scout_car_equipment_4_short: "AML 60"
 fra_scout_car_equipment_4_desc: "AML 60 — очень мощная разведывательная машина, оснащенная 60-мм минометом «Брандт». Он хорошо проявляет себя в антипартизанских операциях, но способен достаточно хорошо вести себя в боях на передовой."
   
 fra_armoured_car_equipment_1: "AMD 40А"
 fra_armoured_car_equipment_1_short: "AMD 40"
 fra_armoured_car_equipment_1_desc: "Созданный на базе AMD 38, AMD 40 лучше подходит для противотанкового боя. По сравнению с разведывательной машиной своего времени AMD 39, AMD 40 значительно увеличила пробиваемость и сильную атаку."
   
 fra_armoured_car_equipment_2: "Panhard EBR 10"
 fra_armoured_car_equipment_2_short: "EBR 10"
 fra_armoured_car_equipment_2_desc: "В EBR используются пуленепробиваемые шины с заполненными азотом ячейками для достижения чрезвычайно высоких скоростей. Этот революционный дизайн позволяет реализовать в этом автомобиле несколько технологических усовершенствований. В результате EBR 10 значительно превосходит все другие броневики, вплоть до уровня французских танков того времени."
   
 fra_armoured_car_equipment_3: "Panhard EBR 11"
 fra_armoured_car_equipment_3_short: "EBR 11"
 fra_armoured_car_equipment_3_desc: "Вариант EBR 11 1954 года представляет собой практически прямую копию EBR 10 с удлиненным на 75 мм стволом. В результате EBR 11 удалось добиться повышенной противотанковой пробиваемости без дополнительных затрат на производство."
   
 fra_armoured_car_equipment_4: "Panhard EBR 12"
 fra_armoured_car_equipment_4_short: "EBR 12"
 fra_armoured_car_equipment_4_desc: "Этот бронеавтомобиль является очень дешевой альтернативой созданию более тяжелобронированных машин. У него очень низкая броня, но он имеет приличные атакующие характеристики и очень маневренен за дешевую цену."
   
 fra_interwar_equipment: "Французский межвоенный танк"
 fra_interwar_equipment_short: "Французский межвоенный танк"
 fra_interwar_equipment_desc: "Renault FT заложил основу для будущих конструкций танков с одинарной поворотной башней. Его конфигурация с передним отделением экипажа и задним расположением двигателя стала стандартной компоновкой практически для всех будущих танков. Хотя он был революционным для своего времени, сейчас он сильно устарел. Он имел небольшой экипаж всего из двух человек, лишь один из которых находился в башне, что задало тренд для будущих французских танков: командир был перегружен информацией, пытаясь одновременно наблюдать, поддерживать связь и стрелять."
   
