 cze_mechanized_equipment_1_short: "M53/59 Praga"
 cze_mechanized_equipment_1_desc: "M53/59 Praga обеспечивает очень высокий уровень броневой защиты по сравнению с большинством других механизированных грузовиков того периода. Он обеспечивает хорошее сочетание боевых характеристик для пехоты, которую он несет, и может производиться по разумной цене."
   
 cze_scout_car_equipment_1: "OA vz. 23"
 cze_scout_car_equipment_1_short: "OA vz. 23"
 cze_scout_car_equipment_1_desc: "Эта разведывательная машина мало что дает с точки зрения боевых характеристик, и ее лучше всего использовать для гарнизонных и разведывательных задач. Автомобиль известен своей надежной работой даже в суровых погодных условиях."
   
