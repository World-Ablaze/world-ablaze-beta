 ger_mechanized_equipment_1: "Sd.kfz. 251 Ausf.A"
 ger_mechanized_equipment_1_short: "Sd.kfz. 251 A"
 ger_mechanized_equipment_1_desc: "База немецкой механизации, 251 А в основном используется как транспортная машина, оснащенная корпусным пулеметом для подавления пехоты противника. Хотя машина хорошо защищена от огня стрелкового оружия, ее открытый верх означает, что она уязвима для артиллерии или пехоты, хорошо оснащенной взрывчаткой."
   
 ger_mechanized_equipment_2: "Sd.kfz. 251 Ausf.B"
 ger_mechanized_equipment_2_short: "Sd.kfz. 251 B"
 ger_mechanized_equipment_2_desc: "Ausf.B во всех аспектах аналогичен Ausf.A, но радиоантенна перенесена (со ступеньки в заднее боевое отделение) и удалены целиковые прицелы для упрощения производства.\n§GПри этом производство сохранится. эффективность от $ger_mechanized_equipment_1$§!"
   
 ger_mechanized_equipment_3: "Sd.kfz. 251 Ausf.C"
 ger_mechanized_equipment_3_short: "Sd.kfz. 251 Ausf.С"
 ger_mechanized_equipment_3_desc: "Ausf.B во всех аспектах аналогичен Ausf.A, но радиоантенна перенесена (со ступеньки в заднее боевое отделение) и удалены целиковые прицелы для упрощения производства.\n§GПри этом производство сохранится. эффективность от $ger_mechanized_equipment_2$§!"
   
 ger_mechanized_equipment_4: "Sd.kfz. 251 Ausf.D"
 ger_mechanized_equipment_4_short: "Sd.kfz. 251 Ausf.D"
 ger_mechanized_equipment_4_desc: "Модель Ausf.D уменьшает количество бронелистов, необходимых при конструкции машины. Таким образом, улучшенные методы строительства позволили увеличить эффективную броню, одновременно снизив производственные затраты.\n§GЭто сохранит эффективность производства с $ger_mechanized_equipment_3$§!"
   
 ger_mechanized_equipment_5: "Kätzchen"
 ger_mechanized_equipment_5_short: "Kätzchen"
 ger_mechanized_equipment_5_desc: "Использование сильно наклоненной брони в Katzchen и увеличенных иллюминаторов улучшили защиту машины в обороне и нападении.\n§RЭто не сохранит эффективность производства по сравнению с предыдущими моделями§!"
   
 ger_mechanized_equipment_6: "Sd.kfz. 250"
 ger_mechanized_equipment_6_short: "Sd.kfz. 250"
 ger_mechanized_equipment_6_desc: "Серия 250 обычно имеет гораздо меньшую эффективную мощность, чем серия 251. Он намного меньше, чем 251 A, но может обеспечить почти такую же эффективную огневую мощь, в зависимости от модели.\n§RЭто не сохранит производственную эффективность по сравнению с предыдущими моделями§!"
   
 ger_mechanized_equipment_7: "Sd.kfz. 250 Neue Art"
 ger_mechanized_equipment_7_short: "Sd.kfz. 250 Neue Art"
 ger_mechanized_equipment_7_desc: "Упрощение боевого отделения и формы корпуса в «новом виде» позволяет упростить и удешевить производство.\n§GПри этом эффективность производства сохранится с $ger_mechanized_equipment_6$§!"
   
 ger_mechanized_equipment_8: "E-10"
 ger_mechanized_equipment_8_short: "E-10"
 ger_mechanized_equipment_8_desc: "Серия E — это попытка стандартизировать детали всей немецкой бронетехники для повышения надежности и эффективности производства. E-10 добавляет значительную огневую мощь и броню для своего экипажа без увеличения затрат.\n§RЭто не сохранит производственную эффективность по сравнению с предыдущими моделями§!"
   
 ger_mechanized_equipment_9: "HS 30"
 ger_mechanized_equipment_9_short: "HS 30"
 ger_mechanized_equipment_9_desc: "БТР HS 30 имеет значительную броневую защиту, что позволяет ему надежно справляться с переносными противотанковыми средствами пехоты. Он по-прежнему сохраняет очень высокую мобильность.\n§RЭто не сохранит эффективность производства по сравнению с предыдущими моделями§!"
   
 ger_amphibious_mechanized_equipment_1: "LWS 1"
 ger_amphibious_mechanized_equipment_1_short: "LWS 1"
 ger_amphibious_mechanized_equipment_1_desc: "Серия LWS, сокращенно от Landwasserschlepper, представляет собой легкий речной буксир с ограниченными возможностями передвижения по суше. Из-за отсутствия опыта ведения боевых действий на амфибиях присутствует несколько недостатков конструкции, в первую очередь ее высокий профиль.\n§RЭто не сохранит эффективность производства по сравнению с предыдущими моделями§!"
   
 ger_amphibious_mechanized_equipment_2: "LWS 2"
 ger_amphibious_mechanized_equipment_2_short: "LWS 2"
 ger_amphibious_mechanized_equipment_2_desc: "LWS II включает в себя шасси Panzer IV, модифицированное приподнятой кабиной водителя и плоской задней частью. Однако большую часть брони с Panzer IV пришлось снять, чтобы его можно было использовать в десантных ситуациях."
   
 ger_amphibious_mechanized_equipment_3: "LWS 3"
 ger_amphibious_mechanized_equipment_3_short: "LWS 3"
 ger_amphibious_mechanized_equipment_3_desc: "Всесторонние усовершенствования конструкции корпуса и подвески делают машину значительно более живучей и маневренной."
   
 ger_mechanized_td_equipment_1: "Sd.Kfz. 251/10 Pak 36"
 ger_mechanized_td_equipment_1_short: "Sd.Kfz. 251/10 Pak 36"
 ger_mechanized_td_equipment_1_desc: "Оборудованный 37-мм артустановкой PaK 36, 251/10 не впечатляет, когда дело доходит до противотанкового боя. В лучшем случае он может поддерживать основные пехотные подразделения в борьбе с легкобронированными грузовиками или механизированными машинами, но ему придется серьезно бороться с танками."
   
 ger_mechanized_td_equipment_2: "Sd.Kfz. 251/17 Pak 38"
 ger_mechanized_td_equipment_2_short: "Sd.Kfz. 251/17 Pak 38"
 ger_mechanized_td_equipment_2_desc: "Оснащен 50-мм артустановкой PaK 38."
   
 ger_mechanized_td_equipment_3: "Sd.Kfz. 251/22 Pak 40"
 ger_mechanized_td_equipment_3_short: "Sd.Kfz. 251/22 Pak 40"
 ger_mechanized_td_equipment_3_desc: "Модернизация противотанковой пушки до PaK 40 позволяет машине бороться с некоторыми менее бронированными танками. Его следует использовать с осторожностью, поскольку более современное противотанковое вооружение гораздо лучше справится с этой ролью."
   
 ger_mechanized_td_equipment_4: "Sd.Kfz. 250/10 Pak 36"
 ger_mechanized_td_equipment_4_short: "Sd.Kfz. 250/10 Pak 36"
 ger_mechanized_td_equipment_4_desc: "Оборудованный 37-мм артустановкой PaK 36, 250/10 не впечатляет, когда дело доходит до противотанкового боя. Однако низкие затраты означают, что его можно предоставлять в большем количестве.\n§GЭто сохранит эффективность производства с $ger_mechanized_equipment_6$§!"
   
 ger_mechanized_artillery_equipment_2: "Sd.kfz. 251/1 Stuka zu Fuss"
 ger_mechanized_artillery_equipment_2_short: "Sd.kfz. 251/1 Stuka"
 ger_mechanized_artillery_equipment_2_desc: "Wurfahmen 40, также известный как «Stuka zu Fuss», способен доставить полезную нагрузку, состоящую из 300-мм ракет, для поражения большой территории. Несмотря на попытки стабилизировать вращение ракет, они очень неточны, но отлично справляются с подавлением противника при использовании в больших количествах. В результате машины реактивной артиллерии, в том числе «Шагающая Штука», имеют очень высокий прорыв, но пониженную мягкую атаку для самоходных артиллерийских орудий."
   
 ger_mechanized_artillery_equipment_3: "S.W.S. Panzerwerfer 43"
 ger_mechanized_artillery_equipment_3_short: "S.W.S. Panzerwerfer 43"
 ger_mechanized_artillery_equipment_3_desc: "S.W.S. 15 cm Panzerwerfer способен поражать даже большую площадь, чем 251/1 Stuka. Благодаря своей взрывной и психологической мощи, он может полностью подавить вражеские формирования и не дать им дать отпор во время наступления, обеспечив огромный прорыв."
   
 ger_mechanized_artillery_equipment_4: "Raketen Panzerwerfer"
 ger_mechanized_artillery_equipment_4_short: "Raketen Panzerwerfer"
 ger_mechanized_artillery_equipment_4_desc: "Эта модель Panzerwerfer заменяет 15-см ракеты на еще более мощные 21-см ракеты. В результате прорыв и мягкая атака значительно увеличиваются."
   
 ger_mechanized_artillery_equipment_5: "Sd.Kfz. 251/9 7,5 см Stummel"
 ger_mechanized_artillery_equipment_5_short: "Sd.Kfz. 251/9 Stummel"
 ger_mechanized_artillery_equipment_5_desc: "стандартный вариант САУ, также называемый «kanonenwagen», оснащен короткоствольной 75-мм гаубицей, имеющей ту же установку, что и StuG III. Он может обеспечить приличную огневую мощь для поддержки пехоты.\n§GПри этом эффективность производства сохранится с $ger_mechanized_equipment_3$§!"
   
 ger_mechanized_artillery_equipment_6: "Sd.Kfz. 250/8 7,5 см"
 ger_mechanized_artillery_equipment_6_short: "Sd.Kfz. 250/8 7,5 см"
 ger_mechanized_artillery_equipment_6_desc: "Вариант САУ оснащен короткоствольной 75-мм гаубицей, имеющей ту же установку, что и StuG III. Он может обеспечить приличную огневую мощь для поддержки пехоты.\n§GПри этом эффективность производства сохранится с $ger_mechanized_equipment_6$§!"
   
 ger_mechanized_aa_equipment_1: "Sd.kfz. 250/9"
 ger_mechanized_aa_equipment_1_short: "Sd.kfz. 250/9"
 ger_mechanized_aa_equipment_1_desc: "Задуманный как разведывательная машина, Sd. кфз. 250/9 оснащен 2-см автоматической пушкой KwK 38 в низкой машине с открытым верхом. Относительно неэффективный в сбивании самолетов противника, он все же может работать так же хорошо, как современные бронированные самоходные зенитные машины.\n§GПри этом производственная эффективность сохранится с $ger_mechanized_equipment_6$§!"
   
 ger_mechanized_aa_equipment_2: "Sd.kfz. 251/17 Flak"
 ger_mechanized_aa_equipment_2_short: "Sd.kfz. 251/17 Flak"
 ger_mechanized_aa_equipment_2_desc: "Оборудованный той же 2-см автоматической пушкой KwK 38, что и 250/9, 251/17 имеет те же недостатки, когда дело доходит до сбивания самолетов противника. Единственное отличие состоит в том, что наводчик размещается внутри бронированной башни, что обеспечивает небольшой уровень защиты от огня стрелкового оружия."
   
 ger_mechanized_aa_equipment_3: "S.W.S. Flak"
 ger_mechanized_aa_equipment_3_short: "s.W.S. Flak"
 ger_mechanized_aa_equipment_3_desc: "Оснащенная усовершенствованной 37-мм зенитной пушкой FlaK, эта механизированная зенитная платформа значительно лучше борется с самолетами, чем любой из ее предшественников. Несмотря на то, что это дешевый ответ на вражескую авиацию, он по-прежнему относительно хрупок из-за низкой брони и защитных характеристик."
   
 ger_mechanized_aa_equipment_4: "Schützenpanzer Gepard"
 ger_mechanized_aa_equipment_4_short: "Schützenpanzer Gepard"
 ger_mechanized_aa_equipment_4_desc: "Эта 50-мм зенитная пушка способна чрезвычайно эффективно сбивать самолеты при такой низкой стоимости. Несмотря на нехватку брони, машина чрезвычайно легкая и способна очень быстро перемещаться по полю боя."
   
 ger_scout_car_equipment_0: "Sd.Kfz. 231 6-Rad"
 ger_scout_car_equipment_0_short: "Sd.Kfz. 231 6-Rad"
 ger_scout_car_equipment_0_desc: "Модель 231 6-Rad обеспечивает хорошую мобильность на пересеченной местности. Предназначенный в первую очередь для разведки и огневой поддержки, он очень легкобронирован."
   
 ger_scout_car_equipment_1: "Sd.Kfz. 221"
 ger_scout_car_equipment_1_short: "Sd.Kfz. 221"
 ger_scout_car_equipment_1_desc: "Sd.Kfz. 221 — дешевая и универсальная машина-разведчик, способная выполнять как разведывательные, так и боевые функции. По сравнению с другими броневиками его можно считать легкобронированным, и следует выбирать более тяжелую модернизированную модель."
   
 ger_scout_car_equipment_2: "Sd.Kfz. 222 A"
 ger_scout_car_equipment_2_short: "Sd.Kfz. 222 A"
 ger_scout_car_equipment_2_desc: "222 A представляет собой значительную модернизацию по сравнению с 221, оснащенную более крупной башней и более тяжелым вооружением. Никаких изменений в броне не произошло, а открытый верх машины вызывает опасения, что экипаж может быть уязвим для гранат или других взрывчатых веществ."
   
 ger_scout_car_equipment_3: "Sd.Kfz. 222 B"
 ger_scout_car_equipment_3_short: "Sd.Kfz. 222 B"
 ger_scout_car_equipment_3_desc: "В 222 B внесены небольшие изменения в башню, которые обеспечивают экипажу лучший обзор окружающей местности. Надежность также была улучшена."
   
 ger_scout_car_equipment_4: "Sd.Kfz. 231 8-Rad"
 ger_scout_car_equipment_4_short: "Sd.Kfz. 231 8-Rad"
 ger_scout_car_equipment_4_desc: "Модель 231 8-Rad отличалась от серии 231 6-Rad увеличением количества колес с 6 до 8, что улучшало мобильность на пересеченной местности. Хотя он предназначался в первую очередь для разведки, он не был бронирован со всех сторон."
   
 ger_scout_car_equipment_5: "Sd.Kfz. 234"
 ger_scout_car_equipment_5_short: "Sd.Kfz. 234"
 ger_scout_car_equipment_5_desc: "Семейство 234 имеет значительно больше брони, чем предыдущие модели, и более тяжелое вооружение, что позволяет им более эффективно выполнять боевые задачи. Использование двигателя Tatra V12 означало, что мобильность стала намного лучше."
   
 ger_scout_car_equipment_6: "Schützenpanzer Kurz"
 ger_scout_car_equipment_6_short: "Schützenpanzer Kurz"
 ger_scout_car_equipment_6_desc: "Основанный на французской машине, Schützenpanzer Kurz спроектирован как разведывательная машина со значительной броневой защитой экипажа."
   
 ger_scout_car_equipment_7: "Spähpanzer Luchs"
 ger_scout_car_equipment_7_short: "Spähpanzer Luchs"
 ger_scout_car_equipment_7_desc: "Его 8-колесная конструкция позволяет автомобилю преуспеть в условиях бездорожья. Кроме того, отличный двигатель и небольшое количество брони делают эту машину чрезвычайно быстрой и способной к прорывам при достаточной огневой поддержке."
   
 ger_armoured_car_equipment_5: "Sd.Kfz. 234/2 Puma"
 ger_armoured_car_equipment_5_short: "Sd.Kfz. 234/2 Puma"
 ger_armoured_car_equipment_5_desc: "Добавление 50-мм пушки позволяет «Пуме» бороться с легкобронированными танками союзников. Однако по возможности следует избегать этих сценариев, поскольку предполагаемая роль «Пумы» по-прежнему заключается в разведке."
 ger_armoured_car_5: "Sd.Kfz. 234/2 Puma"
 ger_scout_car_5: "Sd.Kfz. 234/2 Puma"
   
 ger_armoured_car_equipment_6: "Sd.Kfz. 234/4 Pak-Wagen"
 ger_armoured_car_equipment_6_short: "Sd.Kfz. 234/4 Pak-Wagen"
 ger_armoured_car_equipment_6_desc: "Установка 75-мм пушки Pak 40 L/46 позволяет «Пуме» действовать как легкобронированный, быстрый и смертоносный охотник за танками. Однако без добавления дополнительной брони и повторного введения открытого верха это определение стеклянной пушки."
   
