 eng_medium_equipment_9: "Sherman III"
 eng_medium_equipment_9_short: "Sherman III"
 eng_medium_tank_chassis_9_desc: "РАЗРЕШЕНО, ЕСЛИ ЛЮБОЕ ВЕРНО:\n§YНаходится во фракции с США§!,§YСША — марионетка Соединенного Королевства§!\nАмериканская разработка, полученная по ленд-лизу, — это надежная и боеспособная машина, которую можно легко производить серийно. Танк лучше в бою, чем современный британский средний танк, но далеко не так быстр. Эта модель также служит важной основой для таких вариантов, как Firefly. Любой, кто стремится внедрить эту конструкцию танка, должен опасаться падения эффективности производства, которое может произойти в результате перехода на новую, зарубежную конструкцию танка."
 
