 sov_medium_td_equipment_1: "ЗиС-30"
 sov_medium_td_equipment_1_short: "ЗиС-30"
 sov_medium_td_equipment_1_desc: "ЗиС-30 был поспешно разработан как временная мера, призванная обеспечить армию своего рода мобильной противотанковой системой. Бронебойность довольно хорошая, но открытый верх и высокий профиль танка позволяют очень легко уничтожить машину или ее экипаж."
   
 sov_medium_td_equipment_2: "Т-34-57"
