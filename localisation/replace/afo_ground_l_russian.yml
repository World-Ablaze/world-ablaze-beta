 hun_scout_car_equipment_1: "P.A.2"
 hun_scout_car_equipment_1_short: "P.A.2"
 hun_scout_car_equipment_1_desc: "P.A.2 обладает крайне скромными боевыми характеристиками, но стоит очень дешево. Он лучше всего подходит для разведки и гарнизона, и ему следует избегать боевых действий, где это возможно."
   
 hun_scout_car_equipment_2: "39M Csaba"
 hun_scout_car_equipment_2_short: "39M Csaba"
 hun_scout_car_equipment_2_desc: "Оборудованный радиостанцией, 39M Csaba мог эффективно координировать свои действия и вести разведку с другими подразделениями. Вооруженный только слабой противотанковой винтовкой и пулеметом, его наступательные характеристики не слишком полезны. Автомобиль очень быстрый и дешевый."
   
 hun_scout_car_equipment_3: "41M Hunor"
 hun_scout_car_equipment_3_short: "41M Hunor"
 hun_scout_car_equipment_3_desc: "Разведывательная машина-амфибия, способная передвигаться на высокой скорости, D-442 FUG обеспечивает эффективную и активную разведку. Себестоимость его производства значительно выше, чем у 39M Csaba, но его производство по-прежнему довольно дешево."
 
