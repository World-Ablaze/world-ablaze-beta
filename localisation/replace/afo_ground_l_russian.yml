 pol_mechanized_equipment_4: "Ot-54 skot"
 pol_mechanized_equipment_4_short: "Ot-54 skot"
 pol_mechanized_equipment_4_desc: "Ot-54 создан с учетом опыта войны и представляет собой боеспособную механизированную транспортную машину. Оставаясь довольно дешевым, Ot-64 обеспечивает хорошую мобильность и общие боевые бонусы, служа эффективным множителем силы для механизированной пехоты."

 pol_scout_car_equipment_1: "Wz.34"
 pol_scout_car_equipment_1_short: "Wz.34"
 pol_scout_car_equipment_1_desc: "WZ.34 - чрезвычайно мобильная машина, которая отлично справляется с ролью разведчика. По своим характеристикам она не уступает TKS, а ее производство обходится очень дешево. Однако этой линии не хватает дальнейших модернизаций.\n§RЭто совершенно новая модель, которая не сохранит эффективность производства§!"

 pol_scout_car_equipment_2: "Wz.40"
 pol_scout_car_equipment_2_short: "Wz.40"
 pol_scout_car_equipment_2_desc: "Модернизированный Wz.29 с заменой основного вооружения на 20-мм автопушку и более мощным двигателем, Wz.40 гораздо лучше подходит для роли разведчика и лучше справляется с пехотой.\n§RЭто совершенно новая модель, которая не сохранит эффективность производства§!"

