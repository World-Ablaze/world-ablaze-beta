 pol_mechanized_equipment_1: "C4P"
 pol_mechanized_equipment_1_short: "C4P"
 pol_mechanized_equipment_1_desc: "C4P - это транспортное средство для перевозки пехоты, которое дает очень мало боевых характеристик своей пехоте, но очень дешево в производстве и является хорошим вариантом для массовой механизации армии. Проблема в том, что до следующего механизированного обновления остается большой промежуток времени."

