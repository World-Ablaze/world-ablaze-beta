 eng_mechanized_equipment_1: "Loyd Carrier"
 eng_mechanized_equipment_1_short: "Loyd Carrier"
 eng_mechanized_equipment_1_desc: "Loyd Carrier — дешевый и эффективный усилитель силы британской армии, обеспечивающий бронезащиту и быструю мобильность пехотным подразделениям. Быстрое передвижение является обязательным условием для небольшой профессиональной армии."
 
 eng_mechanized_equipment_2: "Windsor Carrier"
 eng_mechanized_equipment_2_short: "Windsor Carrier"
 eng_mechanized_equipment_2_desc: "Windsor Carrier расширяет предыдущий универсальный авианосец и добавляет новый двигатель, позволяющий разместить больше солдат."
 
 eng_mechanized_equipment_3: "Oxford Carrier"
 eng_mechanized_equipment_3_short: "Oxford Carrier"
 eng_mechanized_equipment_3_desc: "Oxford Carrier — первый настоящий БТР Великобритании, значительно улучшающий броню и боеспособность войск за счет любого вооружения."
   
 eng_mechanized_equipment_4: "Cambridge Carrier"
 eng_mechanized_equipment_4_short: "Cambridge Carrier"
 eng_mechanized_equipment_4_desc: "Cambridge Carrier имеет бронированную крышу, защищающую находящиеся внутри войска."
  
 eng_mechanized_equipment_5: "Alvis Saracen"
 eng_mechanized_equipment_5_short: "Alvis Saracen"
 eng_mechanized_equipment_5_desc: "Alvis Saracen закрывает корпус автомобиля и снижает стоимость Oxford Carrier. Благодаря более надежному двигателю и подвеске «Сарацин» является одной из лучших механизированных единиц за свою стоимость."
 
 eng_mechanized_equipment_6: "FV432"
 eng_mechanized_equipment_6_short: "FV432"
 eng_mechanized_equipment_6_desc: "У FV432 улучшена броневая защита по сравнению с «Сарацином» и скорость. Он также способен перевозить больше людей."
 
 eng_amphibious_mechanized_equipment_1: "Terrapin"
 eng_amphibious_mechanized_equipment_1_short: "Terrapin"
 eng_amphibious_mechanized_equipment_1_desc: "Как амфибийная механизированная машина, единственное предназначение этой машины — высадка дивизий во время морских десантов. У него очень низкие боевые характеристики, и он относительно медленно передвигается по суше."
 
 eng_mechanized_artillery_equipment_2: "Loyd Gun Carrier 25pdr"
 eng_mechanized_artillery_equipment_2_short: "Loyd GC"
 eng_mechanized_artillery_equipment_2_desc: "Oxford Gun Carrier несет модернизированную 25-фунтовую пушку и является более дешевой альтернативой танковым САУ"
 
 eng_scout_car_equipment_0: "Lanchester"
 eng_scout_car_equipment_0_short: "Lanchester"
 eng_scout_car_equipment_0_desc: "Lanchester имеет очень слабые боевые характеристики из-за устаревшей конструкции и оборудования. Его лучше всего использовать для колониальных и гарнизонных целей, и для выполнения этой ниши его можно производить относительно дешево."
   
 eng_scout_car_equipment_1: "Daimler Dingo"
 eng_scout_car_equipment_1_short: "Daimler Dingo"
 eng_scout_car_equipment_1_desc: "Daimler Dingo — очень легкий разведывательный автомобиль, предназначенный в первую очередь для разведки. Небольшой профиль не позволяет легко атаковать его противотанковыми средствами. Машина чрезвычайно дешева в производстве и может использоваться повсеместно в дивизионных разведывательных ротах."
   
 eng_scout_car_equipment_2: "Humber AC MK IV"
 eng_scout_car_equipment_2_short: "Humber AC MK IV"
 eng_scout_car_equipment_2_desc: "Эта машина оснащена 37-мм пушкой и очень похожа на предшествующий броневик Daimler. Незначительные улучшения сделаны в нескольких областях, но Humber теряет некоторую броню, поэтому его производство становится еще дешевле."
   
 eng_scout_car_equipment_3: "Coventry"
 eng_scout_car_equipment_3_short: "Coventry"
 eng_scout_car_equipment_3_desc: "Coventry AC имеет минимальные улучшения по сравнению со своими предшественниками и в первую очередь предназначен для колониальных и разведывательных целей. Он по-прежнему дешев в производстве и очень надежен."
   
 eng_scout_car_equipment_4: "Daimler Ferret MK I"
 eng_scout_car_equipment_4_short: "Daimler Ferret MK I"
 eng_scout_car_equipment_4_desc: "Daimler Ferret MK I лишен почти всех боевых возможностей своих предшественников, в результате чего получилась очень быстрая машина, способная вести разведку. У этого подхода есть несколько проблем, поскольку добавленная скорость не имеет значения, если она опережает силы, для которых обеспечивает разведку."
   
 eng_scout_car_equipment_5: "Daimler Ferret MK III"
 eng_scout_car_equipment_5_short: "Daimler Ferret MK III"
 eng_scout_car_equipment_5_desc: "Улучшение предыдущей модели за счет добавления турели, позволяющей экипажу лучше видеть поле боя и обнаруживать цели противника."
   
 eng_armoured_car_equipment_1: "Daimler AC"
 eng_armoured_car_equipment_1_short: "Daimler AC"
 eng_armoured_car_equipment_1_desc: "Добавление 37-мм пушки и башни позволяет машине бороться с любыми элементами легкой брони, с которыми она может столкнуться."
   
 eng_armoured_car_equipment_2: "AEC Mk II"
 eng_armoured_car_equipment_2_short: "AEC Mk II"
 eng_armoured_car_equipment_2_desc: "6-фунтовая пушка этого броневика способна бороться с легкой и некоторой средней броней. В то же время его броня обеспечивает достойную защиту."
   
 eng_armoured_car_equipment_4: "Alvis Saladin"
 eng_armoured_car_equipment_4_short: "Alvis Saladin"
 eng_armoured_car_equipment_4_desc: "Эта машина способна пробивать легкую броню, но вряд ли будет хорошо себя вести в бою на передовой. Он очень эффективен в борьбе с хорошо оснащенными противниками сопротивления."
   
 eng_light_equipment_1: "Vickers Mk VI"
 eng_light_equipment_1_short: "Vickers Mk VI"
 
 eng_light_equipment_2: "Tetrarch"
 eng_light_equipment_2_short: "Tetrarch"
   
 eng_light_equipment_3: "Hopkins A25"
 eng_light_equipment_3_short: "Hopkins A25"
   
 eng_light_equipment_4: "M22 Locust"
 eng_light_equipment_4_short: "M22 Locust"
 eng_light_tank_chassis_4_desc: "РАЗРЕШЕНО, ЕСЛИ ЛЮБОЕ ВЕРНО.\n§YНаходится во фракции с США§!,§Y_0США — марионетка Соединенного Королевства§!\nСаранча — это американская конструкция, полученная по ленд-лизу, которая очень маневренна, что позволяет ей превосходно выполнять разведывательную роль. Он обладает приличной для легкого танка огневой мощью, но по-прежнему способен бороться только с легковооруженными противниками. Пользователи этой машины должны отметить ее ужасающе низкую бронезащиту."
   
