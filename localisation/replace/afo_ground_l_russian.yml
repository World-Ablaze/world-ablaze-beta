 jap_medium_td_equipment_8: "Na-To"
 jap_medium_td_equipment_8_short: "Na-To"
 jap_medium_td_equipment_8_desc: "Установленная на Chi-To та же 75-мм пушка Type 5, что и на Chi-To, Na To способна пробивать большинство моделей средней брони и очень дешева в производстве. Минусами этой машины являются катастрофически низкая броня, пробитие и защитные характеристики."
   
