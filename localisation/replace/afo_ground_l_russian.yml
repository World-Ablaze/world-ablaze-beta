 ger_medium_equipment_6: "PzKpfw IV Ausf. J"
 ger_medium_equipment_6_short: "Panzer IV J"
 ger_medium_tank_chassis_6_desc: "Модель J, считающаяся ретроградной по сравнению с вариантом H, дешевле в производстве без необходимости жертвовать многими характеристиками. Он медленнее и менее надежен, чем Panzer IV H, но при этом сохраняет все наступательные возможности, которыми обладал его предшественник."
   
 ger_medium_td_equipment_3: "StuG III G"
 ger_medium_td_equipment_3_short: "StuG III G"
   
 ger_medium_td_equipment_4: "Nashorn"
 ger_medium_td_equipment_4_short: "Nashorn"
   
 ger_medium_td_equipment_5: "StuG IV"
 ger_medium_td_equipment_5_short: "StuG IV"
   
 ger_medium_td_equipment_6: "Jagdpanzer IV"
 ger_medium_td_equipment_6_short: "Jagdpanzer IV"
   
 ger_medium_td_equipment_7: "Jagdpanzer IV"
 ger_medium_td_equipment_7_short: "Jagdpanzer IV"
 ger_medium_td_equipment_7_desc: "Jagdpanzer IV предназначен для замены линий Stug, которые больше не могут использовать орудия, необходимые для пробития тяжелой советской брони. Ограничив схему брони жестким компактным казематом, броню можно было распределить очень плотно под наклоном, что сделало машину очень прочной. Новая схема конструкции с использованием соединенных друг с другом пластин, сваренных между собой, значительно снижает себестоимость производства."
   
 ger_medium_spg_equipment_4: "Hummel"
 ger_medium_spg_equipment_4_short: "Hummel"
   
 ger_medium_aa_equipment_4: "Wirbelwind"
 ger_medium_aa_equipment_4_short: "Wirbelwind"
   
 ger_medium_aa_equipment_5: "Ostwind"
 ger_medium_aa_equipment_5_short: "Ostwind"
   
 ger_medium_aa_equipment_6: "Kugelblitz"
 ger_medium_aa_equipment_6_short: "Kugelblitz"
   
 ger_medium_aa_equipment_7: "Kugelblitz"
 ger_medium_aa_equipment_7_short: "Kugelblitz"
 ger_medium_aa_equipment_7_desc: "В отличие от более ранних зенитных самоходных установок, Kugelblitz имеет полностью закрытую вращающуюся башню. Он использует 30-мм пушку МК 103 в спаренной установке для борьбы с самолетами противника. Это очень дешевый автомобиль с более чем достойными характеристиками для своей роли."
   
