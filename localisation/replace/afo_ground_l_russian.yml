 ger_medium_tank_chassis_1_desc: "Neubaufahrzeug, или «новопостроенная машина», была одной из первых попыток Германии создать боевую бронированную машину. Благодаря своей многобашенной конструкции он способен обеспечить большую огневую мощь в форме жесткой и мягкой атаки. У этой дополнительной сложности есть свои недостатки, делающие этот танк чрезвычайно дорогим в производстве как с точки зрения ресурсов, так и с точки зрения заводской производительности."
   
 ger_heavy_equipment_1: "Vk 36.01 (H)"
 ger_heavy_equipment_1_short: "Vk 36.01 (H)"
 ger_heavy_tank_chassis_1_desc: "VK 36.01(H) делает большой шаг вперед в повышении боевых возможностей немецких тяжелых танков. Его производство чрезвычайно дорого из-за тех характеристик, которые оно дает; однако в будущем он послужит основой для гораздо лучших танков."
   
