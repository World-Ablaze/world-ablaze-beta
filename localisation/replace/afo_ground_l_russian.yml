 jap_interwar_equipment_1: "Type 92 Sokosha"
 jap_interwar_equipment_1_short: "Sokosha"
 jap_interwar_equipment_1_desc: "«Sokosha», также известный как тяжелый бронеавтомобиль Type 92, представляет собой кавалерийский танк, предназначенный для разведки и поддержки пехоты. Танк, оснащенный только пулеметами, пригоден только для борьбы с пехотой. Не следует ожидать, что он сможет сражаться в одиночку, поскольку он очень легкобронирован и может быть пробит пехотой без буксируемой артиллерийской поддержки. Кроме того, он крайне ненадежен и склонен к поломкам."
   
 jap_light_equipment: "Японский легкий танк"
 jap_light_equipment_short: "Японский легкий танк"
 jap_light_equipment_desc: "Японский легкий танк"
 jap_light_spg_equipment: "Японский легкий TD"
 jap_light_spg_equipment_short: "Японский легкий TD"
 jap_light_spg_equipment_desc: "Японский легкий TD"
 jap_light_aa_equipment: "Японский легкий СПАА"
 jap_light_aa_equipment_short: "Японский легкий СПАА"
 jap_light_aa_equipment_desc: "Японский легкий СПАА"
   
   
 jap_light_equipment_1: "Type 95 Ha-Go"
 jap_light_equipment_1_short: "Ha-Go"
 jap_light_tank_chassis_1_desc: "Этот легкий танк предназначался для поддержки мотопехоты в общевойсковых боях. Он оснащен 37-мм танковой пушкой Type 94, способной пробивать очень легкую броню; однако он не предназначен для этой цели и должен использоваться для прорыва линий пехоты для поддержки наступления. Из-за расстановки экипажа командир может быть перегружен задачами. В танках также не было радиосвязи, и для связи между танками во время боя использовались сигналы флажков, что затрудняло эффективное использование танка."
   
 jap_light_equipment_2: "Type 95 Ha-Go Kai"
 jap_light_equipment_2_short: "Ha-Go Kai"
 jap_light_tank_chassis_2_desc: "Более поздняя версия Ha-Go включает в себя новую 37-мм пушку Type 98 для повышения противотанковой эффективности и радиоантенны для лучшей координации наступления. Несмотря на это, этот танк уступал почти всем остальным легким танкам того времени и пригоден только для борьбы с слабыми противниками в Китае."
   
 jap_light_equipment_3: "Type 4 Ke-Nu"
 jap_light_equipment_3_short: "Ke-Nu"
 jap_light_tank_chassis_3_desc: "Type 4 Ke-Nu — переоборудованный танк Ha-Go с башней Chi-Ha. Хотя возможности прорыва против линий пехоты улучшаются, размещение башни среднего танка на корпусе легкого танка значительно утяжеляло машину с незначительными улучшениями в броневой защите."
   
 jap_light_equipment_4: "Type 98 Ke-Ni"
 jap_light_equipment_4_short: "Ke-Ni"
 jap_light_tank_chassis_4_desc: "Ke-Ni имеет более толстую наклонную броню и улучшенный двигатель. Его более высокая бронепробиваемость позволяет ему бороться с другими легкими танками, которые он может найти в Тихом океане, но нельзя ожидать, что он сможет сравниться со средними танками."
   
 jap_light_equipment_5: "Type 2 Ke-To"
 jap_light_equipment_5_short: "Ke-To"
 jap_light_tank_chassis_5_desc: "Ke-To создан на основе Ke-Ni, использует тот же двигатель и подвеску, но использует значительно увеличенную башню, в которой размещена улучшенная 37-мм пушка. Хотя пирсинг и улучшился, изменения, вероятно, слишком малы, чтобы иметь существенное значение. К настоящему времени орудие слишком устарело, чтобы пробить многие легкие танки."
   
 jap_light_equipment_6: "Type 5 Ke-Ho"
 jap_light_equipment_6_short: "Ke-Ho"
 jap_light_tank_chassis_6_desc: "Ke-Ho сочетает в себе башню Chi-Ha и корпус Ke-Ni. Эта большая башня обеспечивает достаточно места для обновленного орудия и более крупного экипажа, что приводит к значительному улучшению прорыва и бронепробиваемости. Следует отметить, что этот танк создан лишь как временный вариант и может надежно бороться только с легкой броней."
   
 jap_light_equipment_7: "Type 6 Ke-Ho Kai"
 jap_light_equipment_7_short: "Ke-Ho Kai"
 jap_light_tank_chassis_7_desc: "Стремясь расширить возможности японских легких танков, на модель «Ke-Ho» установили улучшенную схему орудия и бронирования. Танк и остальная часть его линейки продолжают устаревать."
   
 jap_light_spg_equipment_3: "Ho-To"
 jap_light_spg_equipment_3_short: "Ho-To"
 jap_light_spg_equipment_3_desc: "Ho-To не обладает наибольшей огневой мощью, но это всесторонняя машина. Он обеспечивает превосходную защиту, будучи маневренным и дешевым в производстве. Однако он очень хрупкий, и его следует беречь от бронетехники противника."
   
 jap_light_spg_equipment_6: "Ku-Se"
 jap_light_spg_equipment_6_short: "Ku-Se"
 jap_light_spg_equipment_6_desc: "Вооруженный 75-мм пушкой, Ku-Se имеет лишь минимальную лобовую броню и открытый каземат. Практически во всех отношениях он слабее своего предшественника Ho-To, который уже устарел на момент своего первого выпуска."
   
 jap_light_td_equipment_3: "Ho-Ru"
 jap_light_td_equipment_3_short: "Ho-Ru"
 jap_light_td_equipment_3_desc: "Ho-Ru представляет собой достаточно дешевый вариант бронированной противотанковой системы. Имея такую ​​же бронепробиваемость, как и 47-мм противотанковая пушка Type 1 того же периода, следует ожидать, что Ho-Ru сможет справиться только с плохо оснащенными бронетанковыми подразделениями в Китае. Из-за своей слабой брони он уязвим для контратак вражеской брони."
   
