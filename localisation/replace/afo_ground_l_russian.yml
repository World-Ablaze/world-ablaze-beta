 fra_heavy_spg_equipment_3: "LeFH 105"
 fra_heavy_spg_equipment_3_short: "LeFH 105"
 fra_heavy_spg_equipment_3_desc: "Танк Б1 был оснащен мощной 105-мм артиллерийской пушкой. Для своего времени это была одна из самых смертоносных САУ на поле боя."
   
 fra_heavy_td_equipment_6: "АМХ AS 46"
 fra_heavy_td_equipment_6_short: "АМХ AS 46"
 fra_heavy_td_equipment_6_desc: "Этот вариант истребителя танков имеет пониженные характеристики нападения по сравнению с AMX M4 45. Он хорош в обороне, его гораздо дешевле производить при приличных защитных характеристиках."
   
