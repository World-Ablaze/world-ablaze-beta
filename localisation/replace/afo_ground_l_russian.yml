 sov_motorized_equipment_1: "ЗиС-5"
 sov_motorized_equipment_1_short: "ЗиС-5"
 sov_motorized_equipment_1_desc: ""
   
 sov_mechanized_equipment_1: "Т-20 Комсомолец"
 sov_mechanized_equipment_1_short: "Т-20"
 sov_mechanized_equipment_1_desc: "Оснащенный двигателем ГАЗ-М мощностью 50 л.с., Т-20 работает на танковой подвеске, защищен 10-мм броней и 7,62-мм передним пулеметом ДТ в шаровой установке. Он предлагает хорошую мобильность по очень низкой цене, но пассажиры на открытых сиденьях, обращенных наружу, могут многое рассказать о его защите...\n§RЭто совершенно новая модель, и она не сохранит производственную эффективность§!"
   
 sov_mechanized_equipment_2: "ЗиС-22"
 sov_mechanized_equipment_2_short: "ЗиС-22"
 sov_mechanized_equipment_2_desc: "У ЗиС-22 нет вооружения и мало защиты. ЗиС-22 хоть и обеспечивает отличную проходимость, но страдает низкой надежностью и высокой стоимостью.\n§RЭто совершенно новая модель и не сохранит производственную эффективность§!"
 
 sov_mechanized_equipment_2_1: "ЗиС-33"
 sov_mechanized_equipment_2_1_short: "ЗиС-33"
 sov_mechanized_equipment_2_1_desc: "ЗиС 33 не имеет вооружения и слабо защищен. Хотя ЗиС-33 обеспечивает отличную проходимость, он страдает от низкой надежности и высокой стоимости.\n§GЭто сохранит эффективность производства предыдущей модели§!"
 
 sov_mechanized_equipment_3: "ЗиС-42"
 sov_mechanized_equipment_3_short: "ЗиС-42"
 sov_mechanized_equipment_3_desc: "Как и его предшественник, ЗиС-42 не имеет корпусного вооружения. Значительно улучшена броневая защита, позволяющая экипажу и пассажирам лучше выдерживать огонь стрелкового оружия и осколки снарядов. Полугусеничная конструкция также делает эту машину намного более надежной при движении по пересеченной местности.\n§GПри этом сохранится эффективность производства по сравнению с предыдущей моделью§!"
   
 sov_mechanized_equipment_4: "Б-3"
 sov_mechanized_equipment_4_short: "Б-3"
 sov_mechanized_equipment_4_desc: "Попытка создать по-настоящему современный БТР на базе удачной конструкции ЗиС-42. Защита значительно улучшена, но надежность по-прежнему оставляет желать лучшего.\n§GЭффективность производства сохранится по сравнению с предыдущей моделью§!"
   
 sov_mechanized_equipment_5: "БТР-152"
 sov_mechanized_equipment_5_short: "БТР-152"
 sov_mechanized_equipment_5_desc: "БТР 152, оснащенный корпусным пулеметом, является первым советским механизированным автомобилем, обеспечивающим экипажу дополнительную огневую мощь для борьбы с подразделениями противника. Дизайн вносит дополнительные улучшения в другие боевые характеристики, включая защиту и броню. БТР 152 также чрезвычайно надежен.\n§RЭто совершенно новая модель, и она не сохранит производственную эффективность§!"
   
 sov_mechanized_equipment_6: "БТР-60"
 sov_mechanized_equipment_6_short: "БТР-60"
 sov_mechanized_equipment_6_desc: "БТР 60 — чрезвычайно быстрая машина, броня которой немного улучшена по сравнению с БТР 50.\n§RЭто совершенно новая модель, и она не сохранит производственную эффективность§!"
   
 sov_amphibious_mechanized_equipment_1: "БТР-50"
 sov_amphibious_mechanized_equipment_1_short: "БТР-50"
 sov_amphibious_mechanized_equipment_1_desc: "БТР 50, способный вести десантный бой, тяжелее и быстрее своего предшественника. Ее производство немного дороже, чем все предыдущие модели.\n§RЭто совершенно новая модель, и она не сохранит эффективность производства§!"
   
 sov_mechanized_artillery_equipment_1: "БМ-13 Катюша"
 sov_mechanized_artillery_equipment_1_short: "БМ 13"
 sov_mechanized_artillery_equipment_1_desc: "БМ-13 стреляет ракетами М13, чрезвычайно эффективными при бомбардировке с насыщением. Как и все виды реактивной артиллерии, ракеты очень неточны, но отлично подходят для подавления подразделений противника. Сама «Катюша» очень мобильна и может лишить противника возможности контрбатарейной борьбы, но уязвима для огня прямой наводкой, так как почти не имеет брони. Этот автомобиль чрезвычайно дешев в производстве, и его можно собрать, используя практически любую ракетную трубу и любой грузовик.\n§GЭту модель можно переоборудовать из $sov_motorized_equipment_1$§!"
   
 sov_mechanized_artillery_equipment_2: "БМ-31 Катюша"
 sov_mechanized_artillery_equipment_2_short: "БМ 31"
 sov_mechanized_artillery_equipment_2_desc: "БМ-31 запускает еще более крупные ракеты М31, способные нанести значительно больший урон. Несмотря на то, что он по-прежнему очень дешев, он также имеет минимальную броню и может быть пробит огнем стрелкового оружия.\n§GЭта модель может быть преобразована из $sov_motorized_equipment_1$§!"
   
 sov_mechanized_artillery_equipment_3: "БМ-21 Град"
 sov_mechanized_artillery_equipment_3_short: "БМ 21 Град"
 sov_mechanized_artillery_equipment_3_desc: "Эта система способна запустить несколько залпов 122-мм ракет, способных уничтожить широкие полосы поля боя. Хотя мягкая атака между БМ-31 и БМ-21 остается неизменной, эта машина обладает непревзойденным уровнем прорыва, особенно при такой низкой цене.\n§GЭта модель может конвертироваться из $sov_motorized_equipment_1$§!"
   
 sov_mechanized_td_equipment_1: "ЗиС-30"
 sov_mechanized_td_equipment_1_short: "ЗиС-30"
 sov_mechanized_td_equipment_1_desc: "Наспех спроектированная боевая бронированная машина, созданная путем установки 57-мм противотанковой пушки ЗиС-2 на шасси тягача Т-20. Хотя орудие обеспечивает отличную бронебойность, сама машина оставляет желать лучшего.\n§GЭту модель можно переоборудовать из $sov_mechanized_equipment_1$§!"
   
 sov_mechanized_aa_equipment_1: "72 К ГАЗ ММ"
 sov_mechanized_aa_equipment_1_short: "72 К ГАЗ ММ"
 sov_mechanized_aa_equipment_1_desc: "Оснащенный 25-мм пушкой 72 К, этот грузовик представляет собой элементарную форму противовоздушной обороны. Из-за ограничений вооружения эта машина неэффективна против воздушных подразделений. Кроме того, хрупкая природа машины означает, что она уязвима для нападения как наземных, так и воздушных подразделений.\n§GЭта модель может быть преобразована из $sov_motorized_equipment_1$§!"
   
 sov_mechanized_aa_equipment_2: "ЗиС-43"
 sov_mechanized_aa_equipment_2_short: "ЗиС-43"
 sov_mechanized_aa_equipment_2_desc: "37-мм автопушка ЗиС-43 более способна бороться с самолетами, но сама машина все еще слаба. Хотя эта машина и не самая лучшая, она подойдет, если крайне необходима мобильная система ПВО.\n§GЭту модель можно переоборудовать из $sov_mechanized_equipment_3$§!"
   
 sov_mechanized_aa_equipment_3: "БТР АА"
 sov_mechanized_aa_equipment_3_short: "БТР АА"
 sov_mechanized_aa_equipment_3_desc: "Используя зенитную установку ЗПУ-2, зенитный вариант БТР-152 несколько эффективнее борется с авиацией противника. Машина по-прежнему слабо бронирована, но у нее больше шансов выжить.\n§GЭту модель можно переоборудовать из $sov_mechanized_equipment_5$§!"
   
 sov_scout_car_equipment_1: "ФАИ"
 sov_scout_car_equipment_1_short: "ФАИ"
 sov_scout_car_equipment_1_desc: "Созданный на основе лицензированной американской разработки, FAI представляет собой дешевую в производстве машину, обеспечивающую лишь легкую броню и слабую броневую защиту экипажа."
   
 sov_scout_car_equipment_2: "БА-20"
 sov_scout_car_equipment_2_short: "БА-20"
 sov_scout_car_equipment_2_desc: "БА-20, очень похожий по конструкции и внешнему виду на FAI, предназначен только для использования в качестве разведывательной машины. Броня все еще очень тонкая и способна остановить только огонь стрелкового оружия."
   
 sov_scout_car_equipment_3: "БА-64"
 sov_scout_car_equipment_3_short: "БА-64"
 sov_scout_car_equipment_3_desc: "БА-64 представляет собой значительное улучшение по сравнению с БА-20. Его наклонная броня и многогранный корпус обеспечивают превосходную защиту, чем у всех предыдущих моделей. Он также имеет значительно увеличенные наступательные возможности."
   
 sov_scout_car_equipment_4: "БТР-40"
 sov_scout_car_equipment_4_short: "БТР-40"
 sov_scout_car_equipment_4_desc: "В БТР-40 добавлены дополнительные иллюминаторы, позволяющие экипажу визуализировать окружающее поле боя и обнаружить потенциальных врагов. Автомобиль чрезвычайно надежен и может использоваться в самых разных условиях."
   
 sov_scout_car_equipment_5: "БРДМ-1"
 sov_scout_car_equipment_5_short: "БРДМ-1"
 sov_scout_car_equipment_5_desc: "БДРМ-1 — разведывательная машина-амфибия, обладающая исключительно высокой маневренностью. Бонус к пробиваемости, который он дает экипажу, значительно выше, чем у всех предыдущих моделей, но, скорее всего, не будет иметь никакого значения."
   
 sov_armoured_car_equipment_1: "БА-6"
 sov_armoured_car_equipment_1_short: "БА-6"
 sov_armoured_car_equipment_1_desc: "В БА-6 использовалась башня Т-26, используемая как в танках Т-26, так и в БТ-5, и, таким образом, он мог нести 45-мм пушку. Это дает ему возможность надежно пробивать практически все танки, которые он может встретить на поле боя. Сам броневик по-прежнему легкобронирован, а массивная башня утяжеляет танк и существенно снижает максимальную скорость."
   
 sov_armoured_car_equipment_2: "БА-10"
 sov_armoured_car_equipment_2_short: "БА-10"
 sov_armoured_car_equipment_2_desc: "Разработанный на основе конструкции БА-6, БА-10 вносит лишь минимальные изменения. По-прежнему используется тот же профиль оружия и брони, единственные изменения заключаются в небольших улучшениях защиты и мобильности."
   
 sov_armoured_car_equipment_3: "БА-11"
 sov_armoured_car_equipment_3_short: "БА-11"
 sov_armoured_car_equipment_3_desc: "БА-11 оснащен улучшенной радиостанцией, обеспечивающей лучшую координацию между машинами. Более экстремальный наклон лобовой брони также увеличивает защиту без ущерба для мобильности и производительности."
   
