 eng_medium_spg_equipment_9: "Sexton"
 eng_medium_spg_equipment_9_short: "Sexton"
 eng_medium_spg_equipment_9_desc: "Построенная на базе предоставленного по ленд-лизу американского шасси M4, Sexton была представлена ​​на замену Priest, еще одной САУ американской разработки. Priest использовал 105-мм снаряды, которые не использовались ни в одной другой британской технике, поэтому Sexton был построен с использованием той же 25-фунтовой пушки, что и Bishop. Несмотря на скромную огневую мощь, машину легко производить и перемещать."
 
 eng_medium_td_equipment_9: "Sherman Firefly"
 eng_medium_td_equipment_9_short: "Firefly"
 eng_medium_td_equipment_9_desc: "Firefly призван стать временным ответом на тяжелые немецкие машины за счет установки 17-фунтовой пушки. Основанный на американском шасси M4 Sherman, Firefly представляет собой универсальную машину, которую можно производить относительно дешево, особенно при переоборудовании из старых, неиспользованных танков Sherman."
 
