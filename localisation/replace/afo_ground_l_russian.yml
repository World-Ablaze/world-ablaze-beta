 swe_mechanized_equipment_1_short: "Terrängbil m/42D"
 swe_mechanized_equipment_1_desc: "Обеспечивая мобильность, защиту и огневую мощь перевозимой пехоте, Terrangbil m/42D представляет собой универсальную машину, которую можно производить по хорошей цене."
   
 swe_mechanized_equipment_2: "Pansarbandvagn 302"
 swe_mechanized_equipment_2_short: "Pansarbandvagn 302"
 swe_mechanized_equipment_2_desc: "По характеристикам эта машина аналогична Terrangbil, но она значительно более бронирована и имеет улучшенную схему бронирования. Хотя он и не такой быстрый, как большинство механизированных машин поздней войны, он все же очень мобилен и может с относительной легкостью перевозить пехоту по полю боя."
   
 swe_scout_car_equipment_1: "landsverk L-180"
 swe_scout_car_equipment_1_short: "landsverk L-180"
 swe_scout_car_equipment_1_desc: "L-180 – очень хорошая машина-разведчик для своего времени. Хотя он превосходно справляется со своей основной разведывательной ролью, он также полезен в роли поддержки пехоты, используя свою мобильность для преследования легкобронированной техники и пехоты."
   
 swe_scout_car_equipment_2: "Pansarbil m/39"
 swe_scout_car_equipment_2_short: "Pansarbil m/39"
 swe_scout_car_equipment_2_desc: "Pansarbil m/39 представляет собой большой скачок в качестве оборудования по сравнению с L-180. Улучшенные радиоприемники, вооружение и двигатель позволяют этой машине превосходить своего предшественника по многим параметрам."
   
 swe_scout_car_equipment_3: "Pansarbandvagn 301"
 swe_scout_car_equipment_3_short: "Pansarbandvagn 301"
 swe_scout_car_equipment_3_desc: "Pansarbandvagn 301 мало усовершенствован по сравнению со своим предшественником. Его улучшенное вооружение позволяет ему пробивать другие разведывательные машины, с которыми он может столкнуться в разведывательных целях, но большая часть характеристик машины не претерпела изменений и сильно устарела."
   
