 jap_medium_spg_equipment_8: "Ho-Ro"
 jap_medium_spg_equipment_8_short: "Ho-Ro"
 jap_medium_spg_equipment_8_desc: "Вдохновленный немецкими САУ, такими как Grille, у Ho-Ro улучшены всесторонние боевые характеристики. Хотя он сильно отстает от других крупных стран, он все же может хорошо выполнять роль противопехотного противника."
   
