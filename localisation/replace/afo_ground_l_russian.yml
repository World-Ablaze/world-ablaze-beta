 swe_medium_tank_chassis_3_desc: "В Stridsvagn m/74 используется старое шасси m/42, но модернизируется каждый модуль. Башня была заменена на хорошо наклоненную и хорошо бронированную, на которой установлена ​​специально разработанная 75-мм пушка. Значительно улучшена пробиваемость, что позволяет машине пробивать тяжелую технику."
   
