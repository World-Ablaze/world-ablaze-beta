 jap_mechanized_equipment_1: "Ho-Ki"
 jap_mechanized_equipment_1_short: "Ho-Ki"
 jap_mechanized_equipment_1_desc: "Из-за распределения ресурсов и преобладающих армейских доктрин Япония уделяла механизированным транспортным средствам очень мало внимания. Ho-Ki в первую очередь спроектирован как транспортное средство и поэтому не имеет дополнительного вооружения для пассажиров. Он также имеет открытый верх и имеет очень слабую броневую защиту."
   
 jap_mechanized_equipment_2: "Ho-Ha"
 jap_mechanized_equipment_2_short: "Ho-Ha"
 jap_mechanized_equipment_2_desc: "На основе опыта Китая установлено, что для снабжения передовых дивизий, находящихся вне досягаемости налаженных транспортных сетей, необходимо больше полугусеничных машин. Хотя Япония ранее закупила и произвела небольшое количество полугусеничных машин, Ho-Ha был первым японским автомобилем, в котором использовалась значительная броневая защита."
   
 jap_mechanized_equipment_3: "Chi-So"
 jap_mechanized_equipment_3_short: "Chi-So"
 jap_mechanized_equipment_3_desc: "Chi-So — это полностью гусеничная машина, в которой более широко использовалась броня для защиты от переносных противотанковых средств пехоты. Это также первая японская механизированная машина, экипаж которой оснащен пулеметами, установленными на машине."
   
 jap_mechanized_equipment_4: "Type 60 APC"
 jap_mechanized_equipment_4_short: "Type 60 APC"
 jap_mechanized_equipment_4_desc: "Используя сварной стальной корпус, Type 60 еще больше улучшил броню своих предшественников. Улучшенная радиосвязь и конструкция корпуса позволили экипажу повысить эффективность в бою."
   
 jap_amphibious_mechanized_equipment_1: "Ka-Tsu"
 jap_amphibious_mechanized_equipment_1_short: "Ka-Tsu"
 jap_amphibious_mechanized_equipment_1_desc: "Из-за трудностей проведения десантных операций Ka-Tsu спроектирован как машина, способная перевозить экипаж и груз на берег. Его двигательный и электрический отсеки герметично закрыты, что позволяет автомобилю выдерживать полное погружение в воду в течение ограниченного периода времени. Как и Ho-Ki, у пассажиров нет вооружения."
   
 jap_scout_car_equipment_1: "Type 92 Chiyoda"
 jap_scout_car_equipment_1_short: "Chiyoda"
 jap_scout_car_equipment_1_desc: "Type 92 Chiyoda, являющийся универсальным бронеавтомобилем, выполняет функции борьбы с партизанами, поддержки пехоты и разведки. У него невзрачные боевые характеристики, но он маневренный и его очень дешево производить в больших количествах."
   
