 usa_mechanized_equipment_1: "M2 Halftrack"
 usa_mechanized_equipment_1_short: "M2 Halftrack"
 usa_mechanized_equipment_1_desc: "Основанный на полугусеничных конструкциях, импортированных из Франции, M2 построен с использованием стандартизированных компонентов американских производителей грузовиков с целью снижения затрат и повышения производительности. Уровень мобильности, обеспечиваемый этим полугусеничным транспортным средством, затмевает большинство других стран по сравнению с ним, позволяя дивизиям быстрее добираться до районов поля боя, когда они необходимы."
   
 usa_mechanized_equipment_2: "M3 Halftrack"
 usa_mechanized_equipment_2_short: "M3 Halftrack"
 usa_mechanized_equipment_2_desc: "В конструкцию M3 были внесены небольшие изменения, чтобы увеличить общий срок службы и долгосрочную живучесть машины."
   
 usa_mechanized_equipment_3: "M5 Halftrack"
 usa_mechanized_equipment_3_short: "M5 Halftrack"
 usa_mechanized_equipment_3_desc: "Усовершенствованная бронированная версия M5, способная противостоять артиллерийским шрапнелям и противотанковым ружьям."
   
 usa_mechanized_equipment_4: "M39 APC"
 usa_mechanized_equipment_4_short: "M39 APC"
 usa_mechanized_equipment_4_desc: "M39 — самый быстрый бронетранспортер, доступный Соединенным Штатам. Хотя машина мало что дает в наступательных характеристиках, ее скорость позволяет быстро перемещаться и маневрировать на поле боя."
   
 usa_mechanized_equipment_5: "M59 APC"
 usa_mechanized_equipment_5_short: "M59 APC"
 usa_mechanized_equipment_5_desc: "M59 увеличивает броню механизированного трактора, но делает это за счет собственной скорости. Машина пока относительно дешева и может использоваться по всей армии."
   
 usa_mechanized_equipment_6: "M75 APC"
 usa_mechanized_equipment_6_short: "M75 APC"
 usa_mechanized_equipment_6_desc: "M75 заменяет двигатель M59, возвращая ему высокую скорость и хорошую подвижность."
   
 usa_mechanized_equipment_7: "M113 APC"
 usa_mechanized_equipment_7_short: "M113 APC"
 usa_mechanized_equipment_7_desc: "M113 APC более чем вдвое превосходит исходную машину, что позволяет ей противостоять большинству переносных противотанковых средств пехоты. Автомобиль также по-прежнему чрезвычайно быстр и очень надежен, но при этом не слишком дорог в производстве."
   
 usa_amphibious_mechanized_equipment_1: "LVT 1"
 usa_amphibious_mechanized_equipment_1_short: "LVT 1"
 usa_amphibious_mechanized_equipment_1_desc: "Тракторы-амфибии (amtracs) изначально предназначались для использования в качестве транспортных средств снабжения с корабля на берег после создания плацдарма. Дальнейший опыт показал, что эти машины чрезвычайно эффективны при защите войск при высадке десанта и в качестве машин огневой поддержки."
   
 usa_amphibious_mechanized_equipment_2: "LVT 2"
 usa_amphibious_mechanized_equipment_2_short: "LVT 2"
 usa_amphibious_mechanized_equipment_2_desc: "В конструкцию гусеницы и подвески были внесены изменения, которые оказались крайне ненадежными при эксплуатации LVT 1 на пересеченной местности. Эти изменения также помогли улучшить общую скорость автомобиля."
   
 usa_amphibious_mechanized_equipment_3: "LVT 3"
 usa_amphibious_mechanized_equipment_3_short: "LVT 3"
 usa_amphibious_mechanized_equipment_3_desc: "Подвеска была модифицирована и теперь включает в себя ролики для поглощения ударов при движении по неровной местности, что позволяет автомобилю двигаться намного быстрее. Добавление орудийного щита лучше защищает солдат, сидящих внутри машины, от разрывов снарядов."
   
 usa_amphibious_mechanized_equipment_4: "LVT 4"
 usa_amphibious_mechanized_equipment_4_short: "LVT 4"
 usa_amphibious_mechanized_equipment_4_desc: "LVT 4 продолжает улучшать надежность и скорость, позволяя автомобилю гораздо эффективнее выполнять свою роль."
   
 usa_amphibious_mechanized_equipment_5: "LVTP 5"
 usa_amphibious_mechanized_equipment_5_short: "LVTP 5"
 usa_amphibious_mechanized_equipment_5_desc: "LVTP 5 представляет собой полностью закрытую машину-амфибию, способную защитить весь находящийся в ней экипаж благодаря значительно усиленному бронированию. При этом он намного быстрее своего предшественника и сможет не отставать даже от мобильных танков на передовой."
   
 usa_mechanized_td_equipment_1: "M2 3,7 см"
 usa_mechanized_td_equipment_1_short: "M2 3,7 см"
 usa_mechanized_td_equipment_1_desc: "Как и большинство американских противотанковых средств, эту машину лучше всего использовать в качестве временного решения, поскольку она способна довольно стабильно пробивать среднюю броню, но будет чрезвычайно тяжело бороться с любой формой тяжелой брони."
   
 usa_mechanized_td_equipment_2: "M3 7,5 см"
 usa_mechanized_td_equipment_2_short: "M3 7,5 см"
 usa_mechanized_td_equipment_2_desc: "Как и его предшественник, M3 7,5 cm очень хорошо пробивает легкие и средние автомобили, но ничего более стабильного сделать не может. Эту машину следует использовать только как временную меру, пока исследуются и производятся более совершенные машины."
   
 usa_mechanized_artillery_equipment_1: "T12 75 GMC"
 usa_mechanized_artillery_equipment_1_short: "T12 75 GMC"
 usa_mechanized_artillery_equipment_1_desc: "Дешевый источник мобильной огневой мощи, на который следует полагаться только как на временную меру. Мягкая атака хороша, но в будущем, вероятно, станут доступны лучшие варианты."
   
 usa_mechanized_artillery_equipment_2: "T19 105 GMC"
 usa_mechanized_artillery_equipment_2_short: "T19 105 GMC"
 usa_mechanized_artillery_equipment_2_desc: "Модель T19 механизированного GMC практически не улучшает огневую мощь и вытеснит большинство других артиллерийских орудий. Эта машина чрезвычайно хороша в обороне благодаря своей огромной мобильности, позволяющей подавлять наступление противника по мере его приближения."
   
 usa_mechanized_aa_equipment_1: "M13 GMC"
 usa_mechanized_aa_equipment_1_short: "M13"
 usa_mechanized_aa_equipment_1_desc: "Обеспечивает очень слабую противовоздушную защиту и сравним со стандартными буксируемыми зенитными орудиями. Используйте его только в том случае, если наступающие подразделения без поддержки с воздуха продвигаются слишком далеко вперед в регион без аэродромов."
   
 usa_mechanized_aa_equipment_2: "M16 GMC"
 usa_mechanized_aa_equipment_2_short: "M16"
 usa_mechanized_aa_equipment_2_desc: "Как и у его предшественника, наступательные характеристики M16 оставляют желать лучшего. Тем не менее, в некоторых отношениях он может действовать против самолетов противника, но не следует ожидать, что он обеспечит надежную защиту с воздуха."
   
 usa_mechanized_aa_equipment_3: "M15 GMC"
 usa_mechanized_aa_equipment_3_short: "M15"
 usa_mechanized_aa_equipment_3_desc: "Противовоздушные возможности M15 относительно хороши, но машина очень легко бронирована и может быть уничтожена с поразительной легкостью. Его пушка универсальна и способна бороться не только с авиацией, но и с легкой техникой и пехотой."
 
 usa_scout_car_equipment_1: "M1 AC"
 usa_scout_car_equipment_1_short: "M1 AC"
 usa_scout_car_equipment_1_desc: "Бронеавтомобиль M1 обладает крайне слабыми наступательными характеристиками, но при этом машина дешевая и очень мобильная. Его низкие показатели брони также означают, что его могут пробить даже плохо оснащенные пехотные дивизии, и его следует по возможности держать подальше от боевых действий на передовой."
   
 usa_scout_car_equipment_2: "Автомобиль M3 Скаут"
 usa_scout_car_equipment_2_short: "Автомобиль M3 Скаут"
 usa_scout_car_equipment_2_desc: "M3 Scout Car по-прежнему оснащен только крупнокалиберными пулеметами, что мало влияет на атакующие характеристики его экипажа. Самое большое улучшение этой конструкции заключается в значительном повышении ее надежности."
   
 usa_scout_car_equipment_3: "M8 Greyhound"
 usa_scout_car_equipment_3_short: "M8 Greyhound"
 usa_scout_car_equipment_3_desc: "Вооруженный 37-мм пушкой, M8 Greyhound способен уничтожать более легкие машины. Однако отсутствие брони означает, что этот броневик очень уязвим к самому уничтожению. Этот автомобиль относительно дешев, поэтому его можно использовать для множества целей."
   
 usa_scout_car_equipment_4: "T17E1 Staghound"
 usa_scout_car_equipment_4_short: "T17E1 Staghound"
 usa_scout_car_equipment_4_desc: "T17E1 отлично справляется с разведывательными задачами благодаря компактному корпусу и высокой скорости. Оснащенная 37-мм пушкой, это одна из немногих разведывательных машин, способных самостоятельно справиться с некоторыми машинами противника."
   
 usa_scout_car_equipment_5: "M70 Gage Commando"
 usa_scout_car_equipment_5_short: "M70 Gage Commando"
 usa_scout_car_equipment_5_desc: "Созданный для быстрой транспортировки спецназа, M70 лишен 37-мм калибра, имевшегося на оленьей гончей, и позволяет достичь невиданного уровня скорости. Несмотря на то, что машина имеет легкую броню, ее производство и использование дешевы."
   
 usa_armoured_car_equipment_3: "М8 Greyhound"
 usa_armoured_car_equipment_3_short: "М8 Greyhound"
 usa_armoured_car_equipment_3_desc: "Вооруженный 37-мм пушкой, M8 Greyhound способен уничтожать более легкие машины. Однако отсутствие брони означает, что этот броневик очень уязвим к самому уничтожению. Этот автомобиль относительно дешев, поэтому его можно использовать для множества целей."
   
 usa_armoured_car_equipment_4: "M38 Wolfhound"
 usa_armoured_car_equipment_4_short: "M38 Wolfhound"
 usa_armoured_car_equipment_4_desc: "Как и его предшественник, «Волкодав» способен бороться с легкой броней при правильном расположении, но его также очень легко уничтожить. Низкая стоимость и высокая скорость позволяют производить его в больших количествах для патрулирования больших участков поля боя или территории гарнизона."
   
