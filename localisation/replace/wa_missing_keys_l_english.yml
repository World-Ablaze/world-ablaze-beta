 germany.1191.desc: "With the war against [GER.GetNameDef] marching towards its inevitable conclusion, [yalta_origin.GetNameDef] has approached us about a conference on the future of Europe.\n\nThe [yalta_origin.GetAdjective] proposal, championed by Churchill himself, would split [GER.GetNameDef] into three states: a West German State, a North German State and a South German State incorporating parts of the old Austro-Hungarian Empire, all within the Allied sphere of influence. In return, the rest of Central and Eastern Europe would fall within our sphere."
 germany.1191.t: "The Churchill Plan"
 germany.130.desc: "Following the aftermath of the Yalta conference, troops have moved to their respective borders and West Berlin has joined as part of the allied occupation. Its location is vulnerable and we should establish troops there immediately."
