 tank_bell_crank_suspension_desc: "A bell crank is a type of crank that changes motion through an angle. The angle can be anything from 0 to 360 degrees, but 90-degree and 180-degree bell cranks are the most common."
 tank_belleville_washer_suspension_desc: "A Belleville washer is a conical shell that can be loaded along its axis either statically or dynamically: a spring shaped like a washer."
 tank_horstmann_suspension_desc: "The Horstmann suspension, also known as Horstman, Vickers-Horstman and rarely Slow Motion, is a type of tracked suspension designed by the British tank designer John Carden and turned into a production design by the engineer Sidney Horstmann."
 tank_hydropneumatic_suspension_desc: "A hydropneumatic suspension uses special hydropneumatic dampers: the force of compression is transferred by a fluid to a sealed gas chamber that is individual to each damper and carries the main load on the wheel."
 tank_leaf_spring_suspension_desc: "A leaf spring is the elastic element of a vehicle's suspension. It transfers the load from the frame or hull to the running gear, softening shocks and jolts when driving over rough ground."
 tank_unsprung_suspension_desc: "Unsprung mass is the mass of the wheels and of the other parts that the suspension separates from the frame or hull. The mass of everything the suspension holds above the ground is called the sprung mass."
 tank_vertical_spring_suspension_desc: "A vertical coil spring suspension is a type of vehicle suspension that uses coil springs to absorb the unevenness of the ground."
 tank_volute_spring_suspension_desc: "A volute spring suspension uses volute springs, conical coils of flat steel strip that grow stiffer as they are compressed, to absorb the unevenness of the ground."
 treaty_org.1.d: "With the immediate global threat dealt with, tenuous arrangements between [SOV.GetNameDef] and their western allies have begun to deteriorate.\n\nFearing an irrevocable breakdown in communications combined with opposing ambitions in Europe - as evidenced by recent developments in East Germany - [FROM.GetNameDef] has proposed a treaty of mutual assistance, during a hurried conference in Brussels."
 treaty_org.4.t: "North Atlantic Treaty Organization"
 tur_armor.817.desc: "[TUR.GetLeader] has demanded Hatay be incorporated into Turkey. Our police forces have noted a significant Turkish buildup on the border following a previous denial, and another one will provoke a war between our countries."
 tur_armor.818.desc: "[TUR.GetLeader] gave a small speech in Antakya welcoming the citizens of Hatay into [TUR.GetNameDef], and gave thanks to [FROM.GetLeader] of [FROM.GetNameDef] for respecting the democratic will of the people of Hatay. Even though the move was met with outrage by Syrian officials, the general mood of Hatay and [TUR.GetNameDef] as a whole was one of satisfaction, and many [TUR.GetAdjective] people have made trips from their homes down to Hatay to consecrate [TUR.GetNameDef]'s newest province with celebrations and gift exchanges."
 tur_armor.819.desc: "[TUR.GetLeader] led a fiery rally in Gaziantep, where he condemned the oppression of Turks abroad by [FROM.GetNameDef]. The [TUR.GetAdjective] people have been whipped into an uproar, and there is little love lost between the oppressors of Hatay and the people of [FROM.GetNameDef] at the moment. For now, Hatay remains beyond our reach - but we shall always remember this heinous betrayal."
 usa_armor.801.a: "Accept Peace"
 usa_armor.801.b: "Reject Peace"
 usa_armor.890.d: "With war looming, Washington has stepped up its preparations. Promising officers are being promoted, new equipment is entering service, and naval bases, airfields and infrastructure across the Pacific are being expanded. Donald Nelson has been brought in to oversee war production."
 usa_armor.890.t: "Preparing for War"
