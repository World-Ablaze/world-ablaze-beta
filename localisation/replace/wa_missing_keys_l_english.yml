 afo_news.57.d: "Yesterday, key locations in Paris were stormed by the French Army. Main officials were arrested. Led by Louis Napoléon, freshly returned from exile, and helped by a young corps of officers, the coup aims at preventing the establishment of a totalitarian state under the future king Alphonse I. What will happen next is still unsure, but we might be on the verge of a return of a French Empire."
