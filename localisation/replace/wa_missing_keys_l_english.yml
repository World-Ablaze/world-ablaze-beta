 irq_armor.03.d: "The Shia make up a significant portion of our population and demand religious freedoms and representation in the government. By granting these rights we will upset the Sunnis, but it will also prevent further uprisings and allow us to focus on more pressing matters."
 irq_armor.03.t: "Religious Tolerance"
 irq_armor.4.a: "To War!"
 ita_armor.834.b: "Yes! We will not give up our territory without a fight!"
 ita_strategic_bomber_ad_tech_2: "Piaggio P.108 `Artigliere`"
 ita_strategic_bomber_ad_tech_2_desc: "In response to requirements for an anti-shipping weapon, the P.108A converts the large bomber into a patrol aircraft armed with a powerful 102 mm 102/35 mod.14 gun and three torpedoes.\n§YThis will retain 90% efficiency from $ITA_p_108_airframe$ for being part of the family.§!"
 japan.10.a: "Let them talk."
 japan.10.d: "President [USA.GetLeader] has publicly condemned our war, calling it an act of naked aggression and warning that [USA.GetNameDef] will not stand idly by while peaceful nations are attacked. The speech has been widely reported, and relations with Washington have taken a turn for the worse."
 japan.10.t: "The United States Condemns Our War"
 ledo_route_closed: "§YLedo Road closed§!"
 man_armor.825: "For the true emperor!"
 man_armor.825.d: "The time has come to honor our secret agreement with the Qing Empire. We will place ourselves under the protection of the true emperor of China and join the war against the Republic and the Communists."
 man_armor.825.t: "Honoring the Pact with the Qing"
 man_armor.826.d: "[FROM.GetName] has honored its agreement and joined the war on our side against the Republic and the Communists."
 man_armor.827.d: "With the Republic and the Communists defeated, all of China lies before the emperor. The warlords who still cling to their independence will be called upon to submit to the Qing throne."
 man_armor.827.t: "Integrating the Warlords"
 man_armor.828.d: "With the Republic and the Communists gone, the Qing Empire has demanded that we submit to the authority of the emperor. No one is left to stand with us against them, and our lands will become part of the Empire."
 man_armor.828.t: "The Qing Demand Our Submission"
 may_lead_to_soviet_war_tt: "§RThis may lead to war with the Soviet Union and Lithuania.§!"
 mexico.57.a: "The revolution of the Americas will not be dictated from Moscow!"
 mexico.57.b: "They will be dealt with."
 mexico.57.c: "The communists are quarrelling among themselves."
 mexico.57.desc: "In a fiery address to the Mexican Congress, [MEX.GetLeader] has openly broken with [SOV.GetNameDef], denouncing the Soviet leadership as bureaucrats who have betrayed the international proletariat. Proclaiming that Mexico will carry the banner of world revolution in its own way, [MEX.GetLeader] called on workers across the Americas to follow the Mexican example rather than take orders from Moscow.\n\nThe Soviet press has responded with a torrent of abuse, and observers fear the split in the communist world may soon turn into open hostility."
 mexico.57.title: "Mexico Breaks with Moscow"
