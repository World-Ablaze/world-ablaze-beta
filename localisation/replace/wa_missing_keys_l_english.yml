 soviet.90.a: "Bessarabia is ours once more."
 soviet.90.d: "Our forces have taken control of Bessarabia and Northern Bukovina. With the disputed lands firmly in our hands and the Romanian army unable to retake them, Bucharest has no choice but to accept the new border. The war with Romania can now be brought to an end."
 soviet.90.t: "Bessarabia Secured"
 soviet.91.a: "A bitter defeat."
 soviet.91.d: "The campaign to reclaim Bessarabia has dragged on far longer than anyone in Moscow expected. The Romanians continue to resist, our losses mount and the people grow weary of a war that was supposed to be swift. We have no choice but to seek peace with Bucharest and accept this humiliating outcome."
 soviet.91.t: "The Bessarabian Campaign Fails"
 spa_armor.807.a: "§YCheck your Political Decisions§!"
 spa_armor.807.d: "With Spain's support for us having led to a US embargo, Spain is asking us to honor our promise to provide them with food imports to sustain their country."
 spa_armor.807.t: "Spain is Asking for Food Imports"
