 winter_logistics_support_tech: "Winter Logistics"
 wtt_border_conflict_escalation.1.a: "Hold the line!"
 wtt_border_conflict_escalation.1.desc: "The standoff on our border with [From.GetNameDef] has taken a turn for the worse. Rather than withdrawing, forces under the command of [From.GetLeader] have been reinforced and have opened fire on our positions.\n\nWhat began as a mere incident has now become a full-blown border conflict. Our troops in the area must hold their ground, or the disputed territory will be lost."
 wtt_border_conflict_escalation.1.t: "[From.GetNameDefCap] Escalates the Border Incident"
 wtt_political_warlord_support.14.a: "We will see what we can spare."
 wtt_political_warlord_support.14.desc: "Negotiations with [From.GetLeader] have concluded. The leader of [From.GetNameDef] has noted that the economy of his state lags far behind and that his people suffer from a lack of factories and work.\n\nIf we were to help [From.GetLeader] build up the industry of [From.GetNameDef], he would be happy to publicly support us."
 wtt_political_warlord_support.14.t: "[From.GetLeader] requests industrial aid."
