 fra_armor.2010.d: "With the war over, the question of Germany's future lies before us. Three times in a single lifetime German armies have crossed our borders. Many in Paris now argue that a united Germany must never rise again, and that the Reich should be broken up into separate states."
 fra_armor.2010.t: "The Fate of Germany"
