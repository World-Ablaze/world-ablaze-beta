 bauxite_shortage_ai: "Bauxite Shortage"
 bftb_turkey.106.a: "Halt the project in the region."
 bftb_turkey.106.b: "Progress will not wait for the Kurds."
 bftb_turkey.106.desc: "Kurdish community leaders have sent a petition to [ROOT.GetLeader] protesting the new roads and railways being laid across their lands. They see the projects not as development but as a means for Ankara to move troops and officials deeper into the mountains, and demand that construction in their region be halted and the existing works dismantled.\n\nGranting the demand would cost us part of our investment, but it might calm the most restless Kurdish districts."
 bftb_turkey.106.t: "Kurds Object to Infrastructure Project"
 bftb_turkey.107.a: "Let them march; we will listen."
 bftb_turkey.107.b: "Disperse the marchers."
 bftb_turkey.107.desc: "Thousands of Kurds have taken to the roads of the east, marching from village to village and into the provincial towns to demand autonomy and the right to their own language and customs. So far the marches have been peaceful, but the authorities fear they could turn into something far more dangerous.\n\nWe can tolerate the demonstrations and open a dialogue at some political cost, or order the gendarmerie to break them up."
 bftb_turkey.107.t: "Kurds March for Freedom"
 bftb_turkey.108.a: "Grant the exemption."
 bftb_turkey.108.b: "Every citizen must serve the Republic."
 bftb_turkey.108.desc: "Kurdish notables have declared that their young men will not answer the call to arms of an army they regard as an instrument of their oppression. They demand that Kurdish districts be exempted from conscription, promising in return to accept the authority of the state.\n\nAgreeing would bring the region firmly under our administration, though at the cost of the manpower it could provide. Refusing will be seen as yet another insult by Ankara."
 bftb_turkey.108.t: "Kurds Demand Exemption from Conscription"
 bftb_turkey.109.a: "Send in the army."
 bftb_turkey.109.b: "We cannot fight them now."
 bftb_turkey.109.desc: "Armed bands of radical Kurds have overrun several rural towns in the east, driving out the gendarmes and local officials and raising their own flags over the government buildings. Reports suggest the rebels are well organised and enjoy the support of much of the local population.\n\nRetaking the towns will mean a costly military operation, but leaving them in rebel hands will only embolden the separatists."
 bftb_turkey.109.t: "Radical Kurds Occupy Rural Towns in the East"
 bftb_turkey.78.a: "Then we shall do this ourselves."
 bftb_turkey.78.desc: "The [IRQ.GetAdjective] loyalists have crushed the fascist uprising and restored the government's control over the whole country. Our hopes of seeing a friendly regime installed in [IRQ.GetNameDef] through the Golden Square have been dashed, but the civil war has left the [IRQ.GetAdjective] army exhausted. If [IRQ.GetNameDef] will not fall into our sphere on its own, our forces will have to bring it there."
 bftb_turkey.78.t: "The [IRQ.GetAdjective] Government Prevails"
