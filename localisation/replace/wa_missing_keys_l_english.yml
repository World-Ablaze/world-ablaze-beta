 hun_armor.845.d: "Unfortunately, the [FROM.GetAdjective] foreign minister has delivered [FROM.GetNameDef]’s message which is, without question, outright betrayal of the [ROOT.GetFactionName] and [ROOT.GetRulingIdeology] ideals! [FROM.GetNameDefCap] has left our alliance and declared that she will now fight for the other side."
