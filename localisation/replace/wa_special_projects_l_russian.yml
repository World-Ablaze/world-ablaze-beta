l_russian:

  SPECIAL_PROJECT_RESEARCH_TIME_TOOLTIP_TOTAL: ""
  SPECIAL_PROJECT_RESOURCE_USAGE_TOOLTIP: ""
  SPECIAL_PROJECT_RESOURCE_USAGE_DESC_TOOLTIP: ""
  SPECIAL_PROJECT_ITERATION_PROGRESS_DESC: "Этот этап дал $AMOUNT|Y$% прогресса. \nДополнительные успехи, если таковые имеются, подробно описаны ниже."
  SPECIAL_PROJECT_RESEARCH_TIME_MIN_MAX_TOOLTIP_NUMBER_PROTOTYPE_PHASE: "Выполнено итераций прототипа: $NUMBER_DONE|Y0$"

  SP_COST_RESOURCE: "Проект £GFX_resources_strip|$ICON_FRAME$  $RESOURCE|Y$ потребляет +$AMOUNT|R$"
  SP_COST_CIV: "Проект: £GFX_civ_factory  Использование фабрик: +$AMOUNT|R$"
  SP_COST_PP: "Проект: £GFX_pol_power_icon Ежедневная стоимость политической власти: +$AMOUNT|R$"

  sp_nuclear_cost: "Стоимость ядерных проектов"
  sp_nuclear_cost_desc: "Расходы, понесенные в рамках ядерных проектов, которые могут увеличиваться по мере их реализации."
  sp_land_cost: "Стоимость наземных проектов"
  sp_land_cost_desc: "Расходы, понесенные в рамках наземных проектов, которые могут увеличиваться по мере их реализации."
  sp_air_cost: "Стоимость авиационных проектов"
  sp_air_cost_desc: "Расходы, понесенные в рамках авиационных проектов, которые могут увеличиваться по мере их реализации."
  sp_naval_cost: "Стоимость морских проектов"
  sp_naval_cost_desc: "Расходы, понесенные в рамках морских проектов, которые могут увеличиваться по мере их реализации."

  heavy_water_plant: "Завод по производству тяжелой воды"
  heavy_water_plant_desc: "Заводы по производству тяжелой воды были, по сути, заводами, производящими какой-либо другой продукт, побочным продуктом которого была тяжелая вода. Хотя эти заводы были лучшим способом получения тяжелой воды, скорость производства не очень высока, и она остается дефицитным ресурсом."
  heavy_water_plant_tt: "В этой провинции находится завод по производству тяжелой воды."

  uranium_deposits: "Месторождения урана"
  uranium_deposits_desc: "Урановые рудники существовали еще до того, как уран стал широко использоваться, поскольку в них в основном добывали радий. Содержание урана в руде сильно варьировалось от рудника к руднику, поэтому для переработки и обогащения урана для конкретного применения требовалось несколько рудников."
  uranium_deposits_tt: "В этой провинции есть уран."

  SOV_nuclear_espionage_flag: "Ядерный проект(ы) был(и) украден(ы)"

  sp_nuclear_reactor_facility_state_effects_tt: "Построит 1 §YЯдерный реактор§! в регионе §Y[This.GetName]§!. \nПостроить дополнительные [?tmp_num_reactors|G0] §YЯдерные реакторы§! (максимум §G4§! в зависимости от результатов проекта) по всей стране."
  sp_nuclear_reactor_extra_reactor_tt: "Инвестиции могут привести к дополнительным §YЯдерным реакторам§!."

  sp_nuclear_reactor_initial_cost_reward: "Начальные инвестиции"
  sp_nuclear_reactor_initial_cost_reward_desc: "Для запуска этого проекта будут сделаны первоначальные инвестиции в строительство объектов, инструментов и оборудования, необходимых для его реализации до конца. Однако по мере продвижения проекта уровень постоянных инвестиций может расти. \n\n"
  sp_nuclear_reactor_initial_cost_reward_option: "Итак, начинается"

  sp_nuclear_security_choice_reward: "Безопасность проекта"
  sp_nuclear_security_choice_reward_desc: "Строгие меры безопасности, такие как полная изоляция ученых друг от друга, позволят сократить утечки информации и нежелательное внимание. Однако ослабление этих ограничений и разрешение ученым сотрудничать может привести к более быстрому прогрессу."
  sp_nuclear_security_choice_reward_high: "Остаться сверхсекретным"
  sp_nuclear_security_choice_reward_low: "Ослабить ограничения"
  sp_nuclear_security_choice_reward_high_tt: "\nС введением дополнительных ограничений на такие виды деятельности, как совместная работа, §Yучёные§! будут §Rнабирать опыт медленнее§!, а сокращение сотрудничества с промышленностью может привести к §Rуменьшению бонусов за исследования§!. Однако вероятность инцидентов, связанных с безопасностью, §Gможет быть меньше.§!."
  sp_nuclear_security_choice_reward_low_tt: "\nБлагодаря меньшим ограничениям на такие виды деятельности, как совместная работа, §Yучёные§! будут §Gбыстрее набираться опыта§!, а более активное сотрудничество с промышленностью может привести к §Gбольшему количеству бонусов за исследования§!. Однако вероятность инцидентов, связанных с безопасностью, §Rможет увеличиться§!."

  sp_nuclear_security_high_tt: "Из-за усиления мер безопасности §Yучёные§! будут §Rнабирать опыт медленнее§!, но вероятность инцидентов, связанных с безопасностью, §Gможет быть меньше§!."
  sp_nuclear_security_low_tt: "Из-за слабых мер безопасности §Yучёные§! будут §Gбыстрее набираться опыта§!, но инциденты, связанные с безопасностью, §Rмогут увеличиться§!."

  sp_nuclear_security_high_bonus_tt: "Благодаря усилению мер безопасности утечка информации сократилась."
  sp_nuclear_security_low_bonus_tt: "Из-за слабой безопасности утекает больше информации."

  sp_nuclear_supply_choice_reward: "Поставки урана"
  sp_nuclear_supply_choice_reward_desc: "Крупные и стабильные поставки урана являются наиболее важным аспектом этого проекта. Для его успеха необходимо обеспечить достаточное количество урана, чтобы можно было проводить широкомасштабные исследования."
  sp_nuclear_supply_choice_reward_option: "Мы должны обеспечить достаточное количество урана"
  sp_nuclear_supply_choice_reward_option_controlled_tt: "Поскольку мы и наши субъекты напрямую контролируем достаточное количество регионов с запасами §YУрана§! (3), проект будет продвигаться §Gбыстрее, чем ожидалось§!."
  sp_nuclear_supply_choice_reward_option_allied_tt: "Хотя мы и наши субъекты не имеем прямого контроля над достаточным количеством месторождений §YУрана§! (3), мы и наши союзники контролируем достаточное количество месторождений §YУрана§! (3), чтобы проект мог продвигаться §Gполным ходом§!.\n\nПереход большего количества месторождений §YУрана§! под наш прямой контроль и контроль наших субъектов позволит проекту развиваться даже быстрее, чем ожидалось, и может привести к появлению дополнительных §Yядерных реакторов§!."
  sp_nuclear_supply_choice_reward_option_lacking_tt: "Поскольку мы и наши союзники не контролируем достаточное количество месторождений §YУрана§! (3), проект будет продвигаться §Rмедленнее, чем ожидалось§!.\n\nПереход большего количества месторождений урана под контроль нашей страны и/или наших союзников позволит проекту развиваться полным ходом.\n\nПереход большего количества месторождений урана под прямой контроль нашей страны и наших субъетов позволит проекту развиваться даже быстрее, чем ожидалось, и может привести к появлению дополнительных §Yядерных реакторов§!."

  sp_nuclear_controlled_uranium_tt: "  Мы и наши субъекты напрямую контролируем достаточное количество месторождений §YУрана§! (3), поэтому проект продвигается §Gбыстрее, чем ожидалось§!."
  sp_nuclear_allied_controlled_uranium_tt: "  Мы, наши субъекты и наши союзники контролируем достаточное количество месторождений §YУрана§! (3), поэтому проект продвигается §Gполным ходом§!."
  sp_nuclear_lacking_uranium_tt: "  Мы, наши субъекты и наши союзники не контролируем достаточно месторождений §YУрана§! (3), поэтому проект продвигается §Rмедленнее, чем ожидалось§!."

  sp_nuclear_isotope_separation_choice_reward_desc: "Для поддержания ядерных реакций требуется обогащенный уран. В долгосрочной перспективе перспективными могут оказаться методы диффузии, как тепловой, так и газовой, в то время как электромагнитный метод уже дает результаты, а центробежный метод может быть самым дешевым. Если время имеет решающее значение, мы могли бы продвигать все методы одновременно, но это будет дорого стоить..."
  sp_nuclear_isotope_separation_choice_reward_diffusion: "Термическая или газовая диффузия"
  sp_nuclear_isotope_separation_choice_reward_electromagnetic: "Электромагнитная сепарация"
  sp_nuclear_isotope_separation_choice_reward_centrifugal: "Центробежное разделение"
  sp_nuclear_isotope_separation_choice_reward_all: "Нам понадобится весь уран, который мы сможем добыть"

  sp_nuclear_design_choice_reward: "Медлитель ядерной реакции"
  sp_nuclear_design_choice_reward_desc: "Для обеспечения управляемой скорости ядерной цепной реакции необходим замедлитель, который поглощает избыточные нейтроны. Если у нас есть соответствующее производство, можно использовать тяжелую воду. Очищенный графит, хотя и более дорогой, также может подойти."
  sp_nuclear_lacking_heavy_water_tt: "Мы и наши субъекты не контролируем никаких заводов по производству §Yтяжелой воды§!, поэтому проект будет продвигаться «медленнее, чем ожидалось»!"

  sp_nuclear_reactor_tested_reward_desc: "Первый реактор имени «[Character.GetName]» достиг критической массы в устойчивой цепной ядерной реакции, доказав возможность контролируемого ядерного деления. Этот прорыв обещает новую эру в производстве энергии и, возможно, гораздо большее."
  sp_nuclear_reactor_tested_reward_public_tt: "Может быть полезно"
  sp_nuclear_reactor_tested_tech_bonus: "Полученная информация об испытаниях ядерного реактора"

  sp_nuclear_reactor_choice_reward: "Ядерное топливо"
  sp_nuclear_reactor_choice_reward_desc: "Теперь, когда мы знаем, что крупномасштабное производство плутония возможно в качестве побочного продукта уранового ядерного реактора, мы можем сосредоточиться на нем как на источнике топлива вместо традиционного урана. Его будет проще производить, чем обогащенный уран, хотя его полезность в других областях пока неизвестна."
  sp_nuclear_reactor_choice_reward_uranium: "Мы уже знаем все об уране"
  sp_nuclear_reactor_choice_reward_plutonium: "Производство плутония будет ускорено"
  sp_nuclear_reactor_choice_reward_all: "И то, и другое, нет времени на азартные игры"

  sp_nuclear_minor_security_generic_reward: "Недостаток безопасности"
  sp_nuclear_minor_security_generic_reward_desc: "Возникла небольшая проблема с безопасностью. Наши телефонные прослушивающие устройства зафиксировали, как один из лаборантов по имени [Character.GetName] упомянул общее местонахождение ядерного исследовательского центра в разговоре со своей возлюбленной. Это потребует небольших усилий для устранения."
  sp_nuclear_minor_security_generic_reward_option: "Молчание означает безопасность"

  sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Утечка радиоактивности"
  sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "К сожалению, во время работы с реактором произошел серьезный инцидент. Благодаря оперативной реакции ученого по имени [Character.GetName] и его сотрудников  ущерб был локализован, и команда смогла собрать ценные данные по инциденту."

  sp_nuclear_major_security_generic_reward: "Серьезное нарушение безопасности"
  sp_nuclear_major_security_generic_reward_desc: "Произошло серьезное нарушение безопасности. Один из членов среднего звена, работающий под руководством ученого по имени [Character.GetName], был пойман на хранении и транспортировке за пределы предприятия файлов с данными, относящимися к результатам химических экспериментов в рамках проекта. При допросе он признался, что планировал использовать эти данные для продвижения своей собственной коммерчески успешной компании в этой области."
  sp_nuclear_minor_security_generic_reward_option_fire: "Увольте его и немедленно аннулируйте его допуск"
  sp_nuclear_minor_security_generic_reward_option_keep: "Его опыт слишком ценен, чтобы потерять"

  sp_nuclear_reactor_graphite_purity_error_reward: "Недостатки графита"
  sp_nuclear_reactor_graphite_purity_error_reward_desc: "Согласно экспериментам ученого по имени [Character.GetName] с графитом и поглощением нейтронов, он на самом деле не подходит в качестве замедлителя для наших реакторов. Мы должны немедленно исправить эту ошибку и перейти на тяжелую воду."
  sp_nuclear_reactor_graphite_purity_error_reward_option: "Мы потеряли драгоценное время"

  sp_nuclear_reactor_dupont_reward: "Доступные знания и опыт DuPont"
  sp_nuclear_reactor_dupont_reward_desc: "Компания DuPont, промышленный гигант, специализирующийся на производстве химических веществ и оружия, обладает необходимыми знаниями и опытом для строительства и эксплуатации производственных ядерных реакторов, которые генерируют как электроэнергию, так и топливо для других реакторов и, потенциально, для оружия."
  sp_nuclear_reactor_dupont_reward_tt: "DuPont мог бы продвигать проект быстрее, если бы их отношение к нам было более дружелюбным."

  sp_nuclear_reactor_minor_explosion_reward: "Незначительный взрыв реактора"

  sp_nuclear_minor_progress_generic_reward_desc: "Команда под руководством ученого по имени [Character.GetName] сделала несколько революционных открытий при работе над новейшей конструкцией ядерного реактора. Их открытия способствовали прогрессу наших знаний и исследований в этой области."

  sp_nuclear_minor_progress_generic_2_reward: "Успешный эксперимент"
  sp_nuclear_minor_progress_generic_2_reward_desc: "Последние эксперименты по ядерному делению, проведенные ученым по имени [Character.GetName], увенчались большим успехом. Эти результаты способствовали продвижению наших знаний и исследований в этой области.\n"

  sp_nuclear_scientist_xp_generic_reward_desc: "[Character.GetName], хотя и является экспертом в этой области, усовершенствовал свои навыки в практических исследованиях и полевой работе. Теперь он еще лучше подготовлен для руководства этим проектом.\n\n"

  sp_nuclear_generic_electronics_tech_reward_desc: "Ученые под руководством [Character.GetName] получили важные знания в ходе последней итерации проекта. Надеемся, что мы сможем применить их на практике, что позволит нам ускорить исследования в смежных областях.\n\n"

  sp_nuclear_generic_industry_tech_reward_desc: "В ходе работы над проектом инженеры ученого по имени [Character.GetName] сделали несколько новых изобретений, которые вполне могут быть адаптированы для использования и в других областях.\n\n"

  sp_nuclear_war_priorities_generic_reward: "Сдвиг приоритетов"
  sp_nuclear_war_priorities_generic_reward_desc: "Несмотря на результаты, обещанные ученым [Character.GetName], проект [SpecialProject.GetName] подвергся усиленному контролю и вмешательству со стороны военного руководства. Они занимаются политическими играми, чтобы перенаправить ресурсы и финансирование с этого проекта на свои собственные подразделения, что приводит к задержкам и потенциально вынуждает менять руководство проекта. Нам нужно решить, что делать с этими политическими проблемами."
  sp_nuclear_war_priorities_generic_reward_option_agree: "Все необходимо для войны"
  sp_nuclear_war_priorities_generic_reward_option_ignore: "Этот проект будет главным приоритетом для наших вооруженных сил"

  sp_nuclear_brain_drain_generic_reward: "Нехватка национального опыта"
  sp_nuclear_brain_drain_generic_reward_desc: "Хотя [Character.GetName] является ведущим экспертом в своей области, наша национальная политика привела к тому, что люди, политически обозначенные как «нежелательные», были вынуждены уехать, даже если они обладали знаниями, которые могли бы быть полезны в этом проекте. Эта «утечка мозгов» оказала серьезное влияние на национальную науку и привела к тому, что остальные члены команды не обладают достаточным потенциалом."

  sp_nuclear_reactor_cancel_reward: "Возможная отмена проекта"
  sp_nuclear_reactor_cancel_reward_desc: "Поскольку проект затягивается и его окончание не предвидится, все чаще задается вопрос о его отмене. Несмотря на то, что неоднократно обещались впечатляющие результаты, на данный момент нет ничего, что могло бы оправдать все время, усилия и ресурсы, вложенные в это бесплодное начинание. Если мы отменим проект сейчас, то, по крайней мере, сможем извлечь некоторую пользу из накопленных материалов."
  sp_nuclear_reactor_cancel_reward_option_continue: "Мы должны двигаться вперед"
  sp_nuclear_reactor_cancel_reward_option_cancel: "Наш уран может быть использован немедленно"
  sp_nuclear_reactor_cancel_reward_option_continue_tt: "Проект будет продолжен"
  sp_nuclear_reactor_cancel_reward_option_cancel_tt: "Немедленно завершите специальный проект с этими эффектами: \n  §Y(Регион с комплексом)§!: \n    Будет добавлено производство 50 £GFX_resources_strip|4 \n  Активировать миссию: §Y$sp_uranium_tungsten$§!"
  sp_nuclear_reactor_cancel_output_tt: "Специальный проект отменен. \nВсе запасы урана были перераспределены для использования в качестве заменителя вольфрама. \n§Y(Регион с комплексом)§!: \n    Будет добавлено производство 50 £GFX_resources_strip|4 \n  Активировать миссию: §Y$sp_uranium_tungsten$§!"
  sp_nuclear_reactor_cancel:0 "Отменён специальный проект §Y$sp_nuclear_reactor$§!"

  sp_nuclear_bomb_country_effects_tt: "Добавить [?tmp_num_bombs|G0] §Yатомных(ую) бомб(у)§! (максимум §G5§! в зависимости от результатов проекта) в запасы страны."
  sp_nuclear_bomb_tt: "§YЯдерные реакторы§! начинают производить §Yатомные бомбы§!."
  sp_nuclear_bomb_extra_bomb_tt: "Эти дополнительные инвестиции могут привести к дополнительной §Yатомной бомбе§!."

  sp_nuclear_bomb_initial_cost_reward: "Первоначальные инвестиции"
  sp_nuclear_bomb_initial_cost_reward_desc: "Для запуска этого проекта будут сделаны первоначальные инвестиции в строительство объектов, инструментов и оборудования, необходимых для его реализации до конца. Однако по мере продвижения проекта уровень постоянных инвестиций может расти."
  sp_nuclear_bomb_initial_cost_reward_option: "Итак, все начинается"

  sp_nuclear_bomb_test_prototype_reward: "Ядерное испытание"
  sp_nuclear_bomb_test_prototype_reward_desc: "Команда ученого по имени [Character.GetName] создала прототип бомбы. Создание и успешное тестирование значительно ускорит наш прогресс и предотвратит небольшую вероятность неисправности при первом использовании. С другой стороны, у нас теперь есть ядерная бомба..."
  sp_nuclear_bomb_test_prototype_reward_test_bomb: "Лучше перебдеть, чем недобдеть"
  sp_nuclear_bomb_test_prototype_reward_test_bomb_announcement: "Протестируйте и объявите о нашем успехе"
  sp_nuclear_bomb_tested_tech_bonus: "Полученная информация об испытаниях ядерной бомбы"
  sp_nuclear_bomb_test_prototype_reward_keep_bomb: "Нам нужно это оружие сейчас"
  sp_nuclear_bomb_test_prototype_reward_keep_bomb_tt: "По завершении проекта у нас будет в распоряжении дополнительная атомная бомба, но существует небольшой риск, что при первом использовании она окажется нерабочей."

  sp_nuclear_bomb_trigger_choice_reward: "Конструкция детонатора"
  sp_nuclear_bomb_trigger_choice_reward_desc: "Наши ученые разрабатывают два варианта конструкции атомного оружия, и в настоящее время идет дискуссия о том, какой из них следует реализовать. Конструкция оружейного типа гораздо проще, особенно для урана, но при этом менее эффективна с точки зрения использования ядерного материала. Конструкция имплозивного типа гораздо сложнее, но теоретически более эффективна с точки зрения использования ядерного материала, особенно плутония."
  sp_nuclear_bomb_trigger_choice_reward_gun_type: "Пистолетный тип является более безопасным вариантом."
  sp_nuclear_bomb_trigger_choice_reward_implosion: "Взрыв необходимо тщательно обдумать"
  sp_nuclear_bomb_trigger_choice_reward_both: "Оба должны быть разработаны"

  sp_nuclear_bomb_initiator_choice_reward: "Конструкция инициатора"
  sp_nuclear_bomb_initiator_choice_reward_desc: "Для достижения критической массы и запуска цепной реакции необходим инициатор, обеспечивающий быструю подачу нейтронов для сильной реакции деления. Идеальным инициатором было признано сочетание полония и бериллия. Однако полоний является чрезвычайно редким элементом, и его трудно безопасно добывать в количествах, необходимых для этой цели."
  sp_nuclear_bomb_initiator_choice_reward_pile: "Его могут производить существующие реакторы"
  sp_nuclear_bomb_initiator_choice_reward_pile_tt: "Этот вариант принес бы больше результатов, если бы мы ранее инвестировали в большее количество §Yядерных реакторов§!"
  sp_nuclear_bomb_initiator_choice_reward_lead: "Экстракция из свинца обходится дешевле"
  sp_nuclear_bomb_initiator_choice_reward_both: "Нам нужно и то, и другое, чтобы получить необходимую сумму."

  sp_nuclear_bomb_fuze_choice_reward: "Дизайн взрывателя"
  sp_nuclear_bomb_fuze_choice_reward_desc: "Для запуска детонатора, который инициирует цепную реакцию деления, требуется какой-то внешний триггер, и, в отличие от обычных бомб, эта бомба должна взрываться над землей. Барометр прост в определении высоты, но ненадежен при падении; часы механически сложны; а радиолокационный взрыватель не проверен и может быть поврежден при сбросе бомбардировщиком."
  sp_nuclear_bomb_fuze_choice_reward_barometer: "Барометр стоит недорого и вполне подходит для этой задачи."
  sp_nuclear_bomb_trigger_choice_reward_clock: "Нам нужно приложить усилия для миниатюризации часов."
  sp_nuclear_bomb_trigger_choice_reward_radar: "Мы должны разработать решение для устранения помех радара."
  sp_nuclear_bomb_trigger_choice_reward_all: "Комбинация дорогая, но обеспечивает избыточность"
  sp_nuclear_bomb_dud_tt: "Без резервирования взрывателя существует небольшая вероятность, что при первом использовании он не сработает."
  sp_nuclear_bomb_trigger_choice_reward_radar_no_tt: "Поскольку мы не исследовали технологию «Усовершенствованный сантиметровый радар», это может стать дорогостоящей ошибкой, если мы не приобретем ее в ближайшее время."

  sp_nuclear_bomb_lacking_radar_reward: "Недостаточная технология радара"
  sp_nuclear_bomb_lacking_radar_reward_desc: "Для бомбы был выбран дизайн радиолокационного взрывателя, но наша радиолокационная технология еще не достигла того уровня зрелости, когда ее можно было бы миниатюризировать до размеров, подходящих для бомбы, и при этом сохранить требуемую точность и устойчивость к помехам, необходимые для точного срабатывания взрывателя. Мы потеряли драгоценное время, прогресс и ресурсы, которые невозможно возместить, пойдя по тупиковому пути. Сейчас нет достаточно времени для дальнейших исследований этой технологии, поэтому необходимо выбрать другой вариант конструкции.\n\n"
  sp_nuclear_bomb_trigger_choice_reward_radar_loss_tt: "Мы потеряли драгоценное время, прогресс и ресурсы, которые невозможно возместить, пойдя по тупиковому пути. Мы должны принять трудное решение и выбрать жизнеспособный путь вперед."

  sp_nuclear_bomb_wrong_trigger_reward: "Несоответствие детонатора"
  sp_nuclear_bomb_wrong_trigger_reward_option_uranium_tt: "Для бомбы был выбран имплозионный детонатор, но испытания показали, что он может успешно взорвать только плутониевую бомбу. Поскольку в качестве основного материала для оружия был выбран уран, необходимо разработать альтернативный детонатор — детонатор пушечного типа. Мы потеряли драгоценное время, прогресс и ресурсы, которые невозможно возместить, пойдя по тупиковому пути.\n\n"
  sp_nuclear_bomb_wrong_trigger_reward_option_plutonium_tt: "Для бомбы был выбран детонатор пистолетного типа, но испытания показали, что он может успешно взорвать только урановый заряд. Поскольку в качестве основного материала для оружия был выбран плутоний, необходимо разработать альтернативный детонатор — детонатор имплозивного типа. Мы потеряли драгоценное время, прогресс и ресурсы, которые невозможно возместить, пойдя по тупиковому пути.\n\n"

  sp_nuclear_bomb_critical_mass_generic_reward: "Катастрофа эксперимента «Критическая масса»"
  sp_nuclear_bomb_critical_mass_generic_reward_desc: "Недостаточные меры безопасности в лаборатории, которые допустил [Character.GetName], привели к аварии, произошедшей во время экспериментов по определению идеальной критической массы бомбы. Это привело к облучению и жертвам среди ключевого персонала."
  sp_nuclear_bomb_critical_mass_generic_reward_option: "Безопасность должна стать главным приоритетом"

  sp_nuclear_bomb_accident_generic_reward_desc: "В одном из складов на [SpecialProject.GetName] произошел пожар. Первоначальное расследование указывает на то, что это была авария, но слухи говорят об обратном. Ходят слухи о предателе."
  sp_nuclear_bomb_accident_generic_reward_option: "Удвоить количество патрулей охраны объекта"

  nuclear_raid_dud_tt: "§RАтомная бомба была успешно сброшена, но не сработала должным образом и упала на землю, не взорвавшись.§!"