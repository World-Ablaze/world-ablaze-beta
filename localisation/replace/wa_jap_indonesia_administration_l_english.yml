 # Decisions
 JAP_indonesian_military_administrations:0 "Military Administration of the East Indies"
 JAP_indonesian_military_administrations_desc:0 "Under the Army-Navy Central Agreement the occupied East Indies are governed in three parts. The 16th Army administers Java and the 25th Army Sumatra, while the islands from Borneo eastwards fall to the navy and its civil government."
 JAP_indonesian_military_administrations_tt:0 "The §YIndonesian§! core states held by us or our subjects are handed over in three parts.\n§YJava§! goes to the §YJava Military Administration§!.\n§YSumatra§! goes to the §YSumatra Military Administration§!.\nEvery other state goes to the §YSouthwest Area Naval Civil Government§!.\nAll three become our §YImperial Protectorates§!."
 JAP_recognise_east_indies_independence:0 "Recognise the Independence of the East Indies"
 JAP_recognise_east_indies_independence_desc:0 "The Sphere has chosen the road of national independence. To secure the lasting welfare of the peoples of the East Indies, the army and navy administrations will be brought together and their independence recognised."
 JAP_recognise_east_indies_independence_tt:0 "The §YJava Military Administration§!, the §YSumatra Military Administration§! and the §YSouthwest Area Naval Civil Government§! are merged into the §YState of Indonesia§!.\nThe §YState of Indonesia§! becomes our §YImperial Subject§!."
 JAP_recognise_east_indies_independence_unlock_tt:0 "Unlocks the decision §YRecognise the Independence of the East Indies§!."
 JAP_unify_east_indies_administration:0 "Unify the Administration of the East Indies"
 JAP_unify_east_indies_administration_desc:0 "The Sphere has been placed under the guidance of the Empire. The administration of the East Indies, divided between the army and the navy, will be brought under one authority to develop its resources and hold its people."
 JAP_unify_east_indies_administration_tt:0 "The §YJava Military Administration§!, the §YSumatra Military Administration§! and the §YSouthwest Area Naval Civil Government§! are merged into the §YIndonesian Imperial Protectorate§!."
 JAP_unify_east_indies_administration_unlock_tt:0 "Unlocks the decision §YUnify the Administration of the East Indies§!."
 JAP_indonesian_administrations_in_hand_tt:0 "Every administration of the East Indies is our subject"
 JAP_indonesian_resource_states_in_hand_tt:0 "§YSumatra§!, §YJava§! and §YKalimantan§! are each owned and fully controlled by one of our subjects"
