 SOV_great_purge_tt3: "\n§RПоследний рубеж будет отключен при проведении чистки офицерского состава§!\n\n£faction_sov_army §YАрмия§! §Rтеряет большую часть своего влияния§!, уменьшая £political_power_texticon §Yприрост политической власти§! на §R-0.15§!. \n\n$SOV_modify_the_politburo_ns_intro$ \n£drift_defence_texticon Защита от смены идеологии: §G+30.00%§! \n£command_power_texticon Максимальный фактор командного ресурса: §G+50§! \n\n$SOV_modify_fyp_ns_intro$ \n£research_speed_texticon Темпы исследований: §R-5.00%§! \n\n"
  
 SOV_the_kulak_operation: "Кулацкая операция"
 SOV_the_kulak_operation_desc: "Многие предатели — не политические и даже не военные деятели, а бывшие кулаки и прочие уголовники-антисоветчики! Необходимо спасти страну от засилья таких недовольных и озлобленных элементов, которые могут представлять угрозу во время войны."
 SOV_the_kulak_operation_tt: "£faction_sov_peasants §YКрестьяне§! станут §Gлояльнее§! и §Yвлиятельнее§!\n\n$SOV_modify_fyp_ns_intro$ \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y-4.0%§! \n\n"
  
