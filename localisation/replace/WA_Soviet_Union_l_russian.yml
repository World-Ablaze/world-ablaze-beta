 SOV_expand_komsomol_memebership: "Расширить членство в Комсомоле"
 SOV_expand_komsomol_memebership_desc: "Мы не строим социализм для сегодняшних взрослых, мы строим его для детей и еще не родившихся поколений. Их необходимо научить тому, как совершенствовать и развивать то, чего мы добьемся, чтобы они могли завершить работу, которую мы начали. Мы должны создать специальную молодежную организацию, которая не только воспитывает их, но и учит их быть хорошими членами коммунистического общества."
  
