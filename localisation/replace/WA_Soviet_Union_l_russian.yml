 sov_armor.861.t: "Покончить с речной войной?"
 sov_armor.861.da: "Текущее состояние нашей войны с румынами, похоже, вступает в заключительную фазу. И мы, и они захватили земли, и у нас есть возможность заключить мирное соглашение или продолжать войну до окончательной победы."
 sov_armor.861.db: "Текущее состояние нашей войны с румынами выглядит очень мрачно. С нашей стороны не было достигнуто никаких успехов, и, возможно, будет лучше, если мы согласимся на мирный исход, какой бы горькой ни была пилюля, которую придется проглотить."
 sov_armor.861.a: "В лучшем случае - пиррова победа"
 sov_armor.861.b: "Ситуация безнадежна"
 sov_armor.861.c: "У них кончатся люди раньше, чем у нас!"

 sov_armor.862.t: "[SOV.GetName] предлагает мирные условия"
 sov_armor.862.d: "После долгих месяцев войны обе стороны понесли тяжелые потери. На данный момент Советы захватили часть территории, но не смогли достичь своей цели, и поэтому предложили условия мира, по которым нам вернут потерянные земли в обмен на Карелию. Несмотря на то, что мы ожесточенно сражались, чтобы удержать ее, в случае продолжения войны ситуация для нас выглядит плохо, поэтому это предложение, от которого мы не можем отказаться."
 sov_armor.862.a: "Мы сделали все возможное"

 sov_armor.863.t: "[SOV.GetName] отступает"
 sov_armor.863.d: "После долгих месяцев войны обе стороны пролили много крови, но так ничего и не добились. Советы заявляют, что настало время прекратить военные действия и отступить к границам каждой из стран. Это огромная победа для нас и доказательство того, что Финляндия может противостоять даже мощи гигантского медведя!"
 sov_armor.863.a: "Мы добились победы!"

 sov_armor.864.t: "[SOV.GetName] предлагает только больше крови"
 sov_armor.864.d: "Несмотря на стойкость нашей обороны и храбрость наших солдат, [SOV.GetName] не желает довольствоваться миром; вместо этого нас объявили заклятыми врагами России, и они не остановятся, пока не одержат над нами окончательную победу."
 sov_armor.864.a: "Каждый метр будет стоить им дорого!"
 
