 Incompetent_army_2_desc: "Наша армия по-прежнему отступает без надлежащего разрешения высшего командования и считает, что наши средства ведения войны безграничны, поэтому нам следует просто продолжать отступление, поскольку у нас много территории, много земли, много населения и что всегда будет много хлеба."
  
