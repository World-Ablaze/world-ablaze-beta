 soviet.13.b: "Мы должны отступить"
  
 soviet.65.t: "Советский Союз требует аннексии"
 soviet.65.d: "Чтобы компенсировать стратегическую уступку земель Японии, Советский Союз требует нашей аннексии."
 soviet.65.a: "Давайте вместе строить НАШЕ будущее, товарищи."
 soviet.65.b: "Лучше мертвый, чем красный!"
  
 soviet.66.t: "Синьцзян соглашается"
 soviet.66.d: "Правительство Синьцзяна приняло мудрое решение присоединиться к славному Союзу!"
 soviet.66.a: "Добро пожаловать, товарищи."
  
 soviet.67.t: "Синьцзян отказывается"
 soviet.67.d: "Правительство Синьцзяна приняло неудачное решение отклонить наше весьма щедрое предложение. Как они посмели!"
 soviet.67.a: "Нам никто не откажет!"
  
 soviet.68.t: "Советский Союз требует подчинения"
 soviet.68.d: "После того, как оставшиеся китайские войска были изгнаны, армия Шэн Шицая и советские войска взяли под свой контроль страну. Коммунисты основали наше новое правительство под сильным советским влиянием. Поскольку мы получили их помощь, они требуют еще большего контроля."
 soviet.68.a: "Мы присоединимся к нашим братьям, чтобы отплатить им за неоценимую помощь."
 soviet.68.b: "Мы им ничего не должны!"
  
 soviet.69.t: "Синьцзян соглашается"
 soviet.69.d: "Правительство Шэн Шицая приняло наше любезное предложение. Это должно быть адекватной компенсацией за нашу помощь."
 soviet.69.a: "Союз становится все больше!"
  
 soviet.70.t: "Синьцзян отказывается"
 soviet.70.d: "Правительство Шэн Шицая отклонило наше предложение о членстве в Союзе. Они утверждают, что уже полностью с нами расплатились."
 soviet.70.a: "Они заплатят. Так или иначе."
  
 soviet.71.t: "Соединенные Штаты одобряют предоставление нам продуктов питания по ленд-лизу"
 soviet.71.d: "Вашингтон объявил, что одобрил предоставление по ленд-лизу столь необходимых продуктов питания для помощи в нашей славной борьбе. В ближайшие пару лет для питания населения Советского Союза будет доставлено более 3 миллионов тонн продовольствия. Голодомор уже лишил нас возможности производить еду. После потери украинских территорий, захваченных кровожадными немцами, мы не смогли бы выжить без помощи капиталистов."
 soviet.71.a: "Очень щедро со стороны американцев"
  
 soviet.72.t: "США планируют построить для нас железные дороги"
 soviet.72.d: "Вашингтон объявил, что одобрил ленд-лиз и направление инженеров в Советский Союз для строительства и модернизации нашей железнодорожной сети. Поскольку большая часть территорий с развитой инфраструктурой в Европе была захвачена нацистами, мы отчаянно нуждаемся в цепочках поставок между Москвой и промышленными комплексами на Урале. США планируют удвоить количество железных дорог, которые сейчас находятся в Советском Союзе, чтобы мы могли соответствующим образом отреагировать на фашистскую угрозу."
 soviet.72.a: "Передайте привет Рузвельту"
  
 soviet.73.t: "США планируют предоставить нам заводы синтетического каучука"
 soviet.73.d: "Вашингтон заявил, что одобрил строительство для нас заводов по производству синтетического каучука. Это позволит нам меньше полагаться на хрупкие судоходные линии для этого важного импорта."
 soviet.73.a: "Весьма любезно со стороны капиталистов"
  
 soviet.74.t: "США одобряют ленд-лиз нам стали и алюминия"
 soviet.74.d: "Вашингтон объявил, что одобрил ленд-лиз высококачественной стали и алюминия для помощи в Великой Отечественной войне. Пока мы сосредоточены на срочном массовом производстве военной техники для оснащения Красной Армии, качество страдает. К счастью, американцы планируют производить большую часть стальной брони для наших танков и более половины необходимого авиационного алюминия. Благодаря этим дополнительным ресурсам мы сможем отразить нацистское вторжение."
 soviet.74.a: "Мы должны дать американцам понять, что мы благодарны"
  
 soviet.75.t: "США планируют предоставить нам гражданские заводы"
 soviet.75.d: "Вашингтон объявил, что одобрил ленд-лиз комплектных заводов и направление инженеров в Советский Союз, чтобы помочь нам улучшить наше гражданское производство. Благодаря их помощи в перемещении и строительстве гражданских заводов мы сможем значительно ускорить восстановление нашей гражданской экономики после первоначального натиска немцев."
 soviet.75.a: "Большое спасибо, США"
  
 soviet.76.t: "США планируют предоставить нам военные заводы"
 soviet.76.d: "Вашингтон объявил, что одобрил поставки по ленд-лизу высококачественного военно-производственного оборудования. За счет более высокого качества их оборудования и инструментов наше производство существенно увеличится. Нам необходимо превзойти немцев по производству, если мы хотим иметь хоть какой-то шанс на победу. С помощью американского промышленного потенциала наша промышленность получит толчок, и мы сможем выиграть войну."
 soviet.76.a: "Тост за американцев"
  
 soviet.77.t: "США строят Персидский коридор"
 soviet.77.d: "Вашингтон объявил, что одобрил строительство крупной железнодорожной системы в Персии, чтобы направлять ленд-лиз через Кавказ в обход немецких подводных лодок."
 soviet.77.a: "Отличный маршрут для ленд-лиза"
  
 soviet.78.t: "[SOV.GetName]: территориальные претензии к Турции"
 soviet.78.d: "[SOV.GetLeader] претендует на территорию Восточной Анатолии, которая была украдена Турцией у Грузии и Армении! В случае успеха мы укрепим свои позиции вокруг Черного моря."
 soviet.78.a: "Настаивать на претензиях."
  
 soviet.79.t: "[TUR.GetName] отказывается"
 soviet.79.d: "Подкрепленный своими союзниками, [TUR.GetName] отказывается передать требуемые территории. Мы можем настаивать на своих претензиях лишь до определенного предела, после чего ситуация станет враждебной."
 soviet.79.a: "Мир предпочтительнее."
 soviet.79.b: "Они пожалеют об этом!"
  
 soviet.80.t: "[TUR.GetName] соглашается"
 soviet.80.d: "Почувствовав свою слабость, [TUR.GetName] соглашается передать требуемые территории."
 soviet.80.a: "Черное море — [SOV.GetAdjective]ое озеро."
  
 soviet.81.t: "Перейти турецкую границу?"
 soviet.81.d: "Вторжение Германии в Турцию может означать только то, что они намерены нанести удар по Кавказу. Мы можем воспользоваться тем, что внимание Турции приковано к западу, и быстро продвинуть наши приграничные позиции на территории, на которые мы исторически претендуем."
 soviet.81.a: "Это наш шанс!"
 soviet.81.b: "Нам пока следует просто наблюдать.."
  
 soviet.82.t: "Предложить создать [SOV.GetAdjective]ую республику в Синьцзяне"
 soviet.82.d: "\nСиньцзян медленно отдаляется от нас и возвращается к центральному правительству Китая. Если мы хотим сохранить контроль над их ресурсами, мы могли бы предложить план их полной интеграции в [SOV.GetName]."
 soviet.82.a: "Выдвинуть предложение"
 soviet.82.b: "Мы не можем рисковать новым конфликтом"
  
 soviet.83.t: "[CHI.GetAdjective]ое правительство отклонило наше предложение"
 soviet.83.d: "\nНам отказали. Наше влияние в Китае в лучшем случае шаткое. Пришло время решить: позволим ли мы этому клочку пустынь и гор уйти от нас? Или пойдем на все и утвердим свою власть силой?"
 soviet.83.a: "Пусть уходят."
 soviet.83.b: "Синьцзян должен вступить в Союз!"
  
 soviet.84.t: "США поддерживают советские ВВС"
 soviet.84.d: "Соединенные Штаты признали тяжелое состояние советских ВВС. Они готовы обеспечить нас качественным высокооктановым авиационным топливом, чтобы наши самолеты могли максимально эффективно работать. \n$USA_provide_high_octane_fuel_SOV_tt$."
 soviet.84.a: "Тост за американцев!"
  
 soviet.85.t: "Потеря житницы"
 soviet.85.d: "Наступление врага полностью захватило Западную Украину, один из важнейших для нас продовольственных регионов. Хотя наш народ силен волей и духом, чтобы противостоять захватчикам любой ценой, потеря важнейших источников продовольствия создаст большую нагрузку на нашу экономику."
 soviet.85.a: "Наша ситуация становится критической..."
  
 soviet.86.d: "Дальнейшие наступления противника полностью захватили Восточную Украину, один из наших важнейших продовольственных регионов. Хотя наш народ силен волей и духом, чтобы противостоять захватчикам любой ценой, потеря важнейших источников продовольствия создаст большую нагрузку на нашу экономику."
  
  
 china.205.t: "[SOV.GetAdjective]ое предложение по Синьцзяну"
 china.205.d: "[SOV.GetName] обращается к нам с предложением полностью интегрировать Синьцзян в состав их страны за некоторую компенсацию нам. [SOV.GetAdjective]ое правительство явно видит, что Синьцзян возвращается в лоно Китая, и хочет этому помешать. Нам, вероятно, следует учесть текущие угрозы, с которыми мы сталкиваемся, и решить, можем ли мы рискнуть открытием еще одного фронта у себя в тылу."
 china.205.a: "Китай никогда больше не будет разделен!"
 china.205.b: "У нас нет другого выбора..."
  
 sov_armor.701.t: "Первый московский процесс"
 sov_armor.701.d: "Расследование убийства тов. Кирова в 1934 году выявило множество версий, указывающих на заговор Зиновьева и Троцкого. После серии арестов и допросов доказательства стали еще более убедительными. \n\nПосле встречи с [Root.GetLeader] Зиновьев и Каменев наконец признались, что сотрудничали с Троцким с целью свержения правительства, убийства советских лидеров и, в конечном итоге, восстановления капитализма в Советском Союзе. Сейчас они предстают перед судом вместе с 14 их сообщниками. Обвинения против них тяжелы: осуждение будет означать верную смерть."
 sov_armor.701.a: "Еще одна группа предателей привлечена к ответственности."
  
 sov_armor.702.t: "Второй Московский процесс"
 sov_armor.702.d: "После суда над первой группой троцкистов и террористов расследования НКВД продолжились и выявили новые доказательства. Карл Радек был арестован и в конце концов сломался на допросе. Он сообщил о существовании широкой сети людей, полностью или частично работающих с Троцким практически во всех сферах управления, включая армию. Зачинщики уже арестованы и дали признательные показания на допросе.\n\nЭти зачинщики, включая Радека, сейчас находятся под судом. Их преступления менее тяжки, чем те, что были вменены на прошлом процессе, но смертная казнь, безусловно, возможна."
 sov_armor.702.a: "Еще одна группа предателей привлечена к ответственности."
  
 sov_armor.703.t: "Военный заговор"
 sov_armor.703.d: "Расследование, предшествовавшее Второму Московскому процессу, также выявило большую сеть троцкистов в военном и высшем партийном руководстве, возглавляемую Бухариным. Эти люди были арестованы и на допросах признались в самых серьезных и отвратительных преступлениях - от запланированной диверсии до покушения на убийство, сговора с иностранными державами и даже подмешивания гвоздей в масло, чтобы ранить или убить обычных советских граждан.\n\nВ случае осуждения наказанием за эти преступления почти наверняка будет смертная казнь через расстрел."
 sov_armor.703.a: "Еще одна группа предателей привлечена к ответственности."
  
 sov_armor.704.t: "Третий Московский процесс"
 sov_armor.704.d: "Агенты НКВД раскрыли новый тревожный заговор с участием нескольких членов нашей партии. Тем более тревожно, что после нескольких арестов и изнурительных допросов стали известны имена нескольких бывших большевиков. Дальнейшее расследование выявило доказательства того, что некоторые из этих предполагаемых заговорщиков действительно были причастны к диверсиям, фракционности и антисоветскому поведению. Эти люди предстали перед судом и теперь ожидают приговора. Судя по предъявленным им обвинениям, осуждение, несомненно, будет означать весьма суровый приговор."
 sov_armor.704.a: "Еще одна группа предателей привлечена к ответственности."
  
 sov_armor.705.t: "Подозрительные действия: [?event_target:SOV_cowed_leader.GetName]"
 sov_armor.705.d: "До высшего командования армии дошло сообщение о подозрительной активности со стороны [?event_target:SOV_cowed_leader.GetName]."
 sov_armor.705.a: "Мы должны ограничить их передвижения, пока не получим дополнительные доказательства."
 sov_armor.705.b: "Это может быть очевидная уловка"
  
 sov_armor.706.t: "Заговор в Академии"
 sov_armor.706.d: "Анонимный информатор раскрыл существование группы студентов одной из самых престижных наших военных академий. Эта группа, похоже, решила изучать не только утвержденную программу и обсуждала идеи опальных и реакционных теоретиков. Пока неясно, откуда у них появились сочинения этих людей, но тщательное расследование и допрос зачинщиков, несомненно, быстро установят имена."
 sov_armor.706.a: "Нам необходимо обеспечить лояльность всех будущих лидеров."
 sov_armor.706.b: "Академия — это место, где можно задавать вопросы, и мы не должны этому препятствовать."
  
 sov_armor.707.t: "Суд над генералами"
 sov_armor.707.d: "Доказательства того, что в армии существует крупная троцкистская сеть, быстро растут. Каждый день НКВД арестовывает новых подозреваемых, упомянутых в предыдущих признаниях. Эти люди, в свою очередь, часто раскрывают имена новых сообщников. Потребуется время, чтобы выследить всех генералов, участвующих в этом заговоре, но ясно, что указанный ниже генерал каким-то образом с этим связан, несмотря на заявления о невиновности."
 sov_armor.707.a: "Срок в ГУЛАГе исправит их натуру"
  
 sov_armor.708.t: "Чистка младших армейских офицеров"
 sov_armor.708.d: "Поступают сообщения о широкой сети офицеров, глубоко критикующих подход [Root.GetLeader] к военным вопросам. Арестованные по обвинению в подстрекательстве к мятежу, саботаже и антисоветских взглядах быстро раскрывают имена других участников сети на допросах. Хотя уже давно существуют подозрения в лояльности генералов, это показывает, что, возможно, даже майорам и полковникам нельзя доверять."
 sov_armor.708.a: "Мы не можем позволить гнили распространиться."
 sov_armor.708.b: "Эти обвинения являются грубым преувеличением незначительных проблем."
  
 sov_armor.709.t: "Чистка младших офицеров авиации"
 sov_armor.709.d: "Недавняя проверка ВВС выявила шокирующую серию аварий и несчастных случаев во время тренировок. Кроме того, большое количество наших самых современных самолетов не полностью пригодны к выполнению миссий и ждут технического обслуживания. Как такое положение дел могло произойти, неясно, но [Root.GetLeader], обеспокоенный саботажем, потребовал полного расследования."
 sov_armor.709.a: "Мы не можем позволить гнили распространиться."
 sov_armor.709.b: "Эти обвинения являются грубым преувеличением незначительных проблем."
  
 sov_armor.710.t: "Чистка младших офицеров ВМФ"
 sov_armor.710.d: "После сообщений политработников о необычной деятельности на флоте НКВД начало полное расследование и обнаружило доказательства наличия большой сети офицеров, глубоко критически настроенных и даже враждебно настроенных по отношению к советской системе. Хотя большинство из них заявляют о своей лояльности [Root.GetLeader] и Советскому Союзу, ясно, что иностранные агентства могут легко превратить их в шпионов. Действительно, допрос показал, что некоторые из них уже были наняты капиталистическими государствами для шпионажа за нами, и они быстро раскрывают новые имена."
 sov_armor.710.a: "Мы не можем позволить гнили распространиться."
 sov_armor.710.b: "Эти обвинения являются грубым преувеличением незначительных проблем."
  
 sov_armor.711.t: "Заговор среди госслужащих"
 sov_armor.711.d: "НКВД обнаружило доказательства крупномасштабного заговора внутри гражданской администрации. Оказывается, некоторые чиновники Госплана очень сблизились с некоторыми руководителями заводов и скорректировали показатели производства пятилетки в сторону понижения. Это, по мнению НКВД, является явным свидетельством антисоветской диверсии и преднамеренного ослабления советской системы. \n\nАрестованные заговорщики во время допроса быстро раскрывают других участников заговора."
 sov_armor.711.a: "Эту коррупцию необходимо искоренить."
  
 sov_armor.712.t: "Расформировать ОКБ Туполева"
 sov_armor.712.d: "НКВД обнаружило доказательства того, что члены руководства одного из наших конструкторских бюро передавали информацию зарубежным ведомствам. Более того, их недавняя проектная работа была настолько пронизана недостатками, что прототипу потребовались обширная переработка и многочисленные доработки, чтобы он мог летать, что привело к предположениям, что это был акт саботажа. В настоящее время НКВД допрашивает конструкторов и инженеров, и ведущий следователь уверен, что в течение нескольких дней получит признательные показания."
 sov_armor.712.a: "Мы не можем допустить, чтобы подрывные элементы собирались таким образом."
  
 sov_armor.853.t: "Германия уступает Восток"
 sov_armor.853.d: "После того, как мы оказали давление на Германию, чтобы она удовлетворила наши законные претензии на Восточную Польшу, они согласились уступить то, что мы требовали, без дальнейшего конфликта. Кажется, Германия — друг Советского Союза."
 sov_armor.853.a: "Поприветствуем наших польских друзей!"
  
 sov_armor.854.t: "Германия отказывается уступать Восток"
 sov_armor.854.d: "Несмотря на наши усилия разрешить спор с Германией мирным путем, они отказались уступить Восточную Польшу. Это ясно показывает их намерение продолжать завоевание Востока, и мы окажемся следующими на плахе. Мы должны мобилизовать наши силы и совершить решительный рывок на запад, прежде чем Германия успеет завершить какие-либо приготовления."
 sov_armor.854.a: "Нет сомнений"
  
 sov_armor.860.t: "Армия молодых офицеров"
 sov_armor.860.d: "После полного уничтожения прежней армии наши новые офицеры доказывают свою пригодность и адаптируются к новым ролям в высшем военном командовании. Не опасаясь нелояльности, мы предоставили им больше свободы в проведении операций и представлении отчетов. Красная армия восстанавливает свою мощь и вскоре станет сильнее, чем когда-либо."
 sov_armor.860.a: "Лучик надежды"

 sov_armor.866.t: "Армия молодых офицеров"
 sov_armor.866.d: "После полного уничтожения прежней армии наши новые офицеры доказывают свою пригодность и адаптируются к новым ролям в высшем военном командовании. Не опасаясь нелояльности, мы предоставили им больше свободы в проведении операций и представлении отчетов. Красная армия восстанавливает свою мощь и вскоре станет сильнее, чем когда-либо."
 sov_armor.866.a: "Лучик надежды"
  
 sov_armor.867.t: "Оборона Горького"
 sov_armor.867.d: "Враг захватил Москву, и мы находимся в опасном положении, мы должны сдержать их любой ценой! Ведутся срочные строительные работы и прокладка железных дорог, чтобы остановить их в Горьком."
 sov_armor.867.a: "Мы их удержим!"

 sov_armor.868.t: "Оборона Казани"
 sov_armor.868.d: "Враг прорвал оборону Горького и приближается к нашей последней крепости в Казани. Мы собираем последние силы для обороны, мы должны удержать их здесь!"
 sov_armor.868.a: "Мы готовы к последнему сражению!"
  
 sov_armor.801.t: "Великобритания предлагает вторжение в Иран"
 sov_armor.801.d: "Великобритания предлагает совместные усилия по оккупации Ирана, чтобы лишить Германию и ее союзников доступа к его нефтяным запасам. В случае успеха мы оккупируем север, соединяющий Кавказ с Центральной Азией, а британцы оккупируют юг."
 sov_armor.801.a: "Мы принимаем эти планы"
 sov_armor.801.b: "Мы не можем выделить на это людей"
  
 sov_armor.802.t: "[ROM.GetName] просит мира"
 sov_armor.802.d: "После недавнего переворота в стране [ROM.GetName] король [ROM.GetLeader] изгнал немецкие дивизии со своей территории и потребовал перемирия. Их условия предусматривают немедленное прекращение боевых действий после выхода из Оси. Они также признают наши претензии на Бессарабию и Буковину. Однако, учитывая их уязвимое положение, мы вполне способны оказать на них давление, чтобы они признали советское господство и контроль, заставив их сражаться с Осью на нашей стороне."
 sov_armor.802.a: "Мы принимаем мир с уважением к их независимости."
 sov_armor.802.b: "Мы принимаем мир в обмен на полный контроль"
 sov_armor.802.c: "Их судьба была предрешена, когда они объявили войну"
  
 sov_armor.803.t: "[ROM.GetName] отказывается быть нашей марионеткой"
 sov_armor.803.d: ""
 sov_armor.803.a: "Мир по-прежнему предпочтительнее"
 sov_armor.803.b: "Тогда война продолжается"
  
 sov_armor.804.t: "Социалистический реализм"
 sov_armor.804.d: "Наше Министерство культуры стремилось к тому, чтобы мы могли контролировать не только наше искусство, но и нашу музыку и культуру в целом, чтобы сосредоточиться на самом важном — повседневном пролетариате. Социалистический реализм будет изображать труды людей, чья работа сделала Советский Союз такой нацией, какой он является сегодня, и помогла продолжить идеалы коммунизма. Благодаря нашему партнерству с Ассоциацией художников революционной России, Обществом станковистов и Союзом советских писателей мы можем развивать нашу культуру, побуждая наших людей двигаться вперед. Нам нужно определить, на какой сфере должно быть сосредоточено наше искусство."
 sov_armor.804.a: "Вдохновлять рабочих"
 sov_armor.804.b: "Вдохновлять народ"
 sov_armor.804.c: "Вдохновлять армию"
 sov_armor.804.e: "Вдохновлять партизан"
  
 sov_armor.805.t: "Приглашение в СЭВ"
 sov_armor.805.d: "Советский Союз пригласил нас присоединиться к его экономической сфере. Это приносит выгоды и надежду на восстановление нашей нации, но мы откажемся от контроля и впустим коммунистическое влияние."
 sov_armor.805.a: "Мы принимаем"
 sov_armor.805.b: "Отказаться"
  
 sov_armor.806.t: "[From.GetName] отклоняет приглашение"
 sov_armor.806.d: "[From.GetName] не вступит в СЭВ"
 sov_armor.806.a: "Тем хуже для них"
  
 sov_armor.807.t: "[BUL.GetName] просит мира"
 sov_armor.807.d: "После недавнего [BUL.GetAdjective]ого переворота [BUL.GetLeader] изгнал немецкие дивизии со своей территории и просит перемирия. Их условия предусматривают немедленное прекращение боевых действий после их выхода из Оси. Однако, учитывая их уязвимое положение, мы вполне способны оказать на них давление, чтобы они признали советское господство и контроль, заставив их сражаться с Осью на нашей стороне."
 sov_armor.807.a: "Мы принимаем мир с уважением к их независимости."
 sov_armor.807.b: "Мы принимаем мир в обмен на полный контроль"
 sov_armor.807.c: "Их судьба была предрешена, когда они объявили войну."
  
 sov_armor.808.t: "Болгария отказывается быть нашей марионеткой"
 sov_armor.808.d: "Болгария бросает вызов нашим требованиям и непреклонна в стремлении оставаться независимой. Однако они по-прежнему выражают готовность добиваться мира. Как нам следует реагировать?"
 sov_armor.808.a: "Мир по-прежнему предпочтительнее"
 sov_armor.808.b: "Тогда война продолжается"
  
 sov_armor.809.t: "Возвращение Западной Белоруссии и Украины"
 sov_armor.809.d: "Благодаря нашим недавним победам мы вернули себе утраченную в войне с поляками территорию и снова включили этот регион в состав Союза. Давайте поприветствуем наших освобожденных рабочих!"
 sov_armor.809.a: "Добро пожаловать в Союз, товарищи!"
  
 sov_armor.810.t: "Советы предлагают совместный договор"
 sov_armor.810.d: "Советский Союз потребовал признания своих претензий на Востоке, а также заключения пакта о ненападении между нашими странами для обеспечения мира в континентальной Европе. Этот договор явно в пользу Советов, но в любом случае они серьезно относятся к своим требованиям. Если мы откажемся, это может привести нас к войне с Советским Союзом, если они продолжат свои аннексии."
 sov_armor.810.a: "Мы не готовы к войне"
 sov_armor.810.b: "Советы нужно сдерживать"
  
 sov_armor.811.t: "[From.GetName] подписывает договор"
 sov_armor.811.d: "Во имя мира [From.GetName] подписал наш договор, и теперь у нас есть свобода осуществлять свою волю в нашей сфере влияния, не опасаясь возмездия. Теперь нам следует заняться реализацией наших претензий в Прибалтике, а также в Бессарабии."
 sov_armor.811.a: "Время расширять Союз"
  
 sov_armor.812.t: "[From.GetAdjective]ий отказ"
 sov_armor.812.d: "[From.GetName] выразили гнев по поводу наших попыток закрепить за собой наши законные земли и выступили в качестве оплота против советской агрессии! Каким бы ни был наш следующий шаг, у нас не отнимут сферу влияния."
 sov_armor.812.a: "Мы спланируем наш следующий шаг"
  
 sov_armor.813.t: "Советы предлагают совместный договор"
 sov_armor.813.d: "Советский Союз потребовал признания своих претензий на Востоке, а также заключения пакта о ненападении между нашими странами для обеспечения мира в континентальной Европе. Этот договор явно в пользу Советов, но в любом случае они серьезно относятся к своим требованиям. Если мы откажемся, это может привести нас к войне с Советским Союзом, если они продолжат свои аннексии."
 sov_armor.813.a: "Мы не готовы к войне"
 sov_armor.813.b: "Советы нужно сдерживать"
  
 sov_armor.814.t: "[From.GetName] подписывает договор"
 sov_armor.814.d: "Во имя мира [From.GetName] подписал наш договор, и теперь у нас есть свобода осуществлять свою волю в нашей сфере влияния, не опасаясь возмездия. Теперь нам следует заняться реализацией наших претензий в Прибалтике, а также в Бессарабии."
 sov_armor.814.a: "Время расширять Союз"
  
 sov_armor.815.t: "[From.GetAdjective]ий отказ"
 sov_armor.815.d: "[From.GetName] выразили гнев по поводу наших попыток закрепить за собой наши законные земли и выступили в качестве оплота против советской агрессии! Каким бы ни был наш следующий шаг, у нас не отнимут сферу влияния."
 sov_armor.815.a: "Мы спланируем наш следующий шаг"
  
 sov_armor.816.t: "Конец гражданской войны"
 sov_armor.816.d: "После окончания гражданской войны Троцкий стал законным преемником Ленина и теперь может реализовать свои коммунистические идеи. Однако остается вопрос, что делать с генералами, которые поддерживали Сталина и выступали против возвращения Троцкого. Приложив некоторые усилия, мы, возможно, сможем убедить их перейти на нашу сторону, пусть и с понижением в звании, но с сохранением военной карьеры."
 sov_armor.816.a: "Воззвать к самым патриотичным"
 sov_armor.816.b: "Воззвать к карьеристам"
 sov_armor.816.c: "Устроить чистку"
  
 sov_armor.817.t: "Набраны резервные дивизии"
 sov_armor.817.d: "Не расширяя нашу постоянную армию, наши офицеры выполнили задачу по подготовке тысяч человек в резерв. Эти люди будут жизненно необходимы в случае начала войны, когда нам потребуется срочно расширить армию."
 sov_armor.817.a: "Отлично"
  
 sov_armor.818.t: "Троцкий торжествует!"
 sov_armor.818.d: "Наша нация сильна после свержения Сталина. Теперь пришло время восстановить нашу нацию и стереть с лица земли любое наследие, оставленное Сталиным."
 sov_armor.818.a: "Воздадим почести нашему новому лидеру"
  
 sov_armor.819.t: "Вторгнуться в Польшу?"
 sov_armor.819.d: "После подписания пакта Молотова-Риббентропа Германия начала вторжение в Польшу. Есть некоторые сомнения в том, будут ли немцы соблюдать пакт или нет, поэтому нам, возможно, стоит вторгнуться самим, чтобы гарантировать, что наши претензии перейдут к нам. Существует некоторый риск того, что союзники ответят, но как они надеются сражаться и с немцами, и с Советами?"
 sov_armor.819.a: "Союзники не посмеют"
 sov_armor.819.b: "Немцы будут соблюдать пакт"
  
 sov_armor.825.t: "Смерть Сталина"
 sov_armor.825.d: "Сталин скончался по естественным причинам, нам предстоит выбрать преемника"
 sov_armor.825.a: "Наш первый секретарь Никита Хрущев"
 sov_armor.825.b: "Наш премьер Георгий Маленков"
  
 sov_armor.826.t: "Смерть Сталина"
 sov_armor.826.d: "Сталин ушел из жизни при загадочных обстоятельствах, нам предстоит выбрать преемника"
 sov_armor.826.a: "Наш первый секретарь Никита Хрущев"
 sov_armor.826.b: "Наш премьер Георгий Маленков"
  
 sov_armor.827.t: "Вспыхивает гражданская война!"
 sov_armor.827.d: "После нашего поражения мы столкнулись с масштабной борьбой за власть со стороны противостоящих фракций. Решить это сможет только кровь"
 sov_armor.827.a: "За Родину!"
  
 sov_armor.828.t: "Германия на грани"
 sov_armor.828.d: "Продолжающаяся война в Германии нанесла ущерб стране, и немцы оказались на проигравшей стороне в войне, которая может скоро закончиться. Это дает нам прекрасную возможность присоединиться и нанести удар по Западной Европе и прикончить то, что осталось, захватив при этом как можно больше земель..."
 sov_armor.828.a: "Отдать приказ и выступать!"
 sov_armor.828.b: "Эта война еще может обернуться в пользу Германии"
  
 SOV_winter_war_time_passed: "Прошло 8 месяцев с начала Зимней войны."
  
 sov_armor.849.t: "Закончить финскую войну?"
 sov_armor.849.da: "Нынешнее состояние нашей войны против финнов, похоже, вступает в завершающую фазу. И мы, и они захватили землю, и у нас есть возможность заключить мирное соглашение или продолжать эту войну до тех пор, пока не будет достигнута окончательная победа."
 sov_armor.849.db: "Нынешнее состояние нашей войны против финнов выглядит весьма безрадостным. С нашей стороны не было достигнуто никаких успехов, и, возможно, будет лучше, если мы согласимся на мирное соглашение, какой бы горькой ни была пилюля, которую можно проглотить."
 sov_armor.849.a: "В лучшем случае пиррова победа"
 sov_armor.849.b: "Ситуация безнадежна"
 sov_armor.849.c: "У них кончатся люди раньше нас!"
  
 sov_armor.850.t: "[SOV.GetName] отступает"
 sov_armor.850.d: "После долгих месяцев войны обе стороны пролили много крови, но ничего не добились. Советы заявляют, что пришло время прекратить боевые действия и отступить к границам каждой страны. Для нас это огромная победа, которая доказывает, что Финляндия может противостоять даже мощи гигантского медведя!"
 sov_armor.850.a: "Мы добились победы!"
 sov_armor.850.b: "Мы добились Победы!"
  
 sov_armor.851.t: "[SOV.GetName] предлагает только больше крови"
 sov_armor.851.d: "Несмотря на стойкость нашей обороны и доблесть наших храбрых солдат, [SOV.GetName] не желает соглашаться на мир; вместо этого нас лишь объявили заклятыми врагами России, и они не остановятся, пока не одержат над нами окончательную победу."
 sov_armor.851.a: "Каждый метр будет стоить им дорого!"
  
 sov_armor.852.t: "Конец Великой Отечественной войны"
 sov_armor.852.d: "Жестокая война, определившая судьбу нашей страны и закалившая нашу решимость, завершилась триумфом."
 sov_armor.852.a: "Победа за нами!"
 sov_armor.852.dalt: "Жестокое окончание войны, которая определила нашу страну, подошло к концу. Мы отдали все, но все равно проиграли, оттеснив Урал, мы не ждем возможности дать отпор."
 sov_armor.852.aalt: "Сломлен, но не побежден!"
  
 sov_armor.856.t: "[HUN.GetName] просит мира"
 sov_armor.856.d: "Поскольку война уже на пороге, Хорти потребовал перемирия и позволит советским войскам свободно находиться на своей территории. Их условия предусматривают немедленное прекращение боевых действий после выхода из Оси. Учитывая их уязвимое положение, мы вполне способны оказать на них давление, чтобы они признали советское господство и контроль, заставив их сражаться с Осью на нашей стороне."
 sov_armor.856.a: "Мы принимаем мир с уважением к их независимости."
 sov_armor.856.b: "Мы принимаем мир в обмен на полный контроль"
 sov_armor.856.c: "Их судьба была предрешена, когда они объявили войну"
  
 sov_armor.857.t: "[HUN.GetName] отказывается быть нашей марионеткой"
 sov_armor.857.d: ""
 sov_armor.857.a: "Мир по-прежнему предпочтительнее"
 sov_armor.857.b: "Тогда война продолжается"
  
 FRA_eastern_withdrawl: "Установил нашу сферу влияния с Францией."
 GER_eastern_withdrawl: "Установил нашу сферу влияния с Германией."
  
 sov_armor.905.t: "Советы предлагают СЭВ"
 sov_armor.905.d: "Советский Союз предложил создать в рамках Коминтерна Совет экономической взаимопомощи, чтобы помочь каждой стране построить свою промышленность."
 sov_armor.905.a: "Мы присоединимся"
 sov_armor.905.b: "Нам не нужна их поддержка"
  
 sov_armor.820.t: "Талантливые новые работники."
 sov_armor.820.d: "По мере роста нашей промышленности наша рабочая сила в эпоху индустриализации становится все более умелой и выполняет свои обязанности на хорошем уровне. Со временем все больше и больше рабочих станут опытными, и мы сможем в полной мере использовать нашу крупную промышленность."
 sov_armor.820.a: "Восхитительно."
  
 sov_armor.820.a_tt: "$SOV_modify_fyp_ns_intro$ \n£factory_output_texticon  Объем заводского производства: §G+5.00%§!"
  
 SOV_can_be_infiltrated: "Возможно дальнейшее §Hпроникновение§!.\n"
  
 sov_armor.829.t: "[SOV.GetAdjective]ая победа под Пермью"
 sov_armor.829.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками в приграничном районе вокруг Перми, [GER.GetAdjective]ая линия обороны была прорвана. [SOV.GetAdjective]ие дивизии быстро воспользовались возможностью перебросить партизан, технику и припасы через бреши и развернуть антинемецкую деятельность в Перми.\n\n"
 sov_armor.829.a: "Мы постепенно готовим контрнаступление"
 sov_armor.829.b: "Мы должны подготовить соответствующий контрудар!"
  
 sov_armor.830.t: "[SOV.GetAdjective]ое поражение под Пермью"
 sov_armor.830.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками в приграничном районе вокруг Перми, [SOV.GetAdjective]ие силы потерпели поражение и были вынуждены отступить."
 sov_armor.830.a: "В следующий раз нам придется постараться лучше!"
 sov_armor.830.b: "Наша линия надежна!"
  
 sov_armor.831.t: "Патовая ситуация под Пермью"
 sov_armor.831.d: "Боевые действия между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками вокруг Перми утихли после того, как обе стороны покинули спорный регион для перегруппировки и пополнения запасов."
 sov_armor.831.a: "Нам нужно подготовиться к следующему вторжению!"
  
 sov_armor.832.t: "[SOV.GetAdjective]ое проникновение в Пермь"
 sov_armor.832.d: "Из-за отсутствия [GER.GetAdjective]их сил [SOV.GetAdjective]ие части быстро воспользовались возможностью перебросить партизан, технику и припасы через бреши и начать антинемецкую деятельность в Перми.\n\n"
 sov_armor.832.a: "Мы постепенно готовим контрнаступление"
 sov_armor.832.b: "Мы не можем оставить Восточный фронт!"
  
 sov_armor.833.t: "[SOV.GetAdjective]ая победа под Уфой"
 sov_armor.833.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками в приграничном районе вокруг Уфы, [GER.GetAdjective]ая линия обороны была прорвана. [SOV.GetAdjective]ие дивизии быстро воспользовались возможностью перебросить партизан, технику и припасы через бреши и развернуть антинемецкую деятельность в Уфе.\n\n"
 sov_armor.833.a: "Мы постепенно готовим контрнаступление"
 sov_armor.833.b: "Мы должны подготовить соответствующий ответ!"
  
 sov_armor.834.t: "[SOV.GetAdjective]ое поражение под Уфой"
 sov_armor.834.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими силами в приграничной зоне вокруг Уфы, [SOV.GetAdjective]ие силы потерпели поражение и были вынуждены отступить."
 sov_armor.834.a: "В следующий раз нам придется постараться лучше!"
 sov_armor.834.b: "Наша линия надежна!"
  
 sov_armor.835.t: "Патовая ситуация под Уфой"
 sov_armor.835.d: "Боевые действия между [SOV.GetAdjective]ими и [GER.GetAdjective]ими силами вокруг Уфы утихли после того, как обе стороны покинули спорный регион для перегруппировки и пополнения запасов."
 sov_armor.835.a: "Нам нужно подготовиться к следующему вторжению!"
  
 sov_armor.836.t: "[SOV.GetAdjective]ое проникновение в Уфу"
 sov_armor.836.d: "Из-за отсутствия [GER.GetAdjective]их сил [SOV.GetAdjective]ие подразделения быстро воспользовались возможностью переправить партизан, технику и припасы через бреши и начать антинемецкую деятельность в Уфе.\n\n"
 sov_armor.836.a: "Мы постепенно готовим контрнаступление"
 sov_armor.836.b: "Мы не можем оставить Восточный фронт!"
  
 sov_armor.837.t: "[SOV.GetAdjective]ая победа под Оренбургом"
 sov_armor.837.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками в приграничном районе вокруг Оренбурга [GER.GetAdjective]ая линия фронта была прорвана. [SOV.GetAdjective]ие подразделения быстро воспользовались возможностью перебросить партизан, технику и припасы через бреши и развернуть антинемецкую деятельность в Оренбурге.\n\n"
 sov_armor.837.a: "Мы постепенно готовим контрнаступление"
 sov_armor.837.b: "Мы должны подготовить соответствующий контрудар!"
  
 sov_armor.838.t: "[SOV.GetAdjective]ое поражение под Оренбургом"
 sov_armor.838.d: "После столкновения между [SOV.GetAdjective]ими и [GER.GetAdjective]ими войсками в приграничном районе вокруг Оренбурга [SOV.GetAdjective]ие силы потерпели поражение и были вынуждены отступить."
 sov_armor.838.a: "В следующий раз нам придется постараться лучше!"
 sov_armor.838.b: "Наша линия надежна!"
  
 sov_armor.839.t: "Патовая ситуация под Оренбургом"
