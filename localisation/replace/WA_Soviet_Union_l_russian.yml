 SOV_extend_the_working_week_dd_flag: "Фокус §Y$SOV_extend_the_working_week$§! выполнен"
 SOV_extend_the_working_week_dd_tt: "В настоящее время: [?SOV_extend_the_working_week_dd_flag:days|Y0]"
  
 SOV_ground_support_tt: "$SOV_modify_airforce_ns_intro$ \n£cas_efficiency_texticon  Эффективность наземной поддержки: §G+10%§! \n\n"
  
 SOV_evolve_our_urban_centres: "Развивать наши городские центры"
 SOV_evolve_our_urban_centres_desc: "Если мы хотим поддержать развитие тяжелой промышленности, мы должны создать новые технологии, которые позволят нам построить эти огромные сети заводов. Нам нужно больше ресурсов и машин, которые станут основой для масштабного строительства."
  
 SOV_finish_the_second_five_year_plan: "Завершить второй пятилетний план"
 SOV_finish_the_second_five_year_plan_desc: "Второй пятилетний план отдает приоритет развитию инфраструктуры и тяжелой промышленности. Советский Союз должен быстро развиваться, чтобы не уступать капиталистическим и фашистским державам Запада."
 SOV_finish_the_second_five_year_plan_tt: "2-й 5-летний план завершен, его модификаторы удалены. \n$SOV_modify_fyp_ns_intro$ \n£construction_speed_civfactory_texticon Скорость строительства гражданских фабрик: §G+5.00%§! \n£construction_speed_infrastructure_texticon Скорость строительства инфраструктуры: §G+5.00%§! \n£construction_speed_texticon Скорость строительства: §G+20.00%§! \n\n"
  
 SOV_start_the_third_five_year_plan: "Начать третий пятилетний план"
 SOV_start_the_third_five_year_plan_desc: "Третий пятилетний план отдает приоритет развитию военной промышленности и вооружений. Советский Союз должен быстро развиваться, чтобы не уступать капиталистическим и фашистским державам Запада."
 SOV_start_the_third_five_year_plan_tt: "§YСоветская промышленность§! начинает реализацию третьего пятилетнего плана: \n£political_power_texticon  Стоимость политической власти: §R+0.30§! \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y-6.0%§! \n£construction_speed_milfactory_texticon  Скорость строительства военных заводов: §G+10.00%§!"
  
 SOV_extend_the_working_week: "Продлить рабочую неделю"
 SOV_extend_the_working_week_desc: "Для такого быстрого расширения военной промышленности нам не хватает соответствующих средств и подготовленных кадров. К счастью, каждый советский гражданин готов пойти на жертвы ради государства."
 SOV_extend_the_working_week_tt: "\n$SOV_modify_fyp_ns_intro$ \n£construction_speed_milfactory_texticon  Скорость строительства военных заводов: §G+10.00%§!"
  
 SOV_mining_infrastructure_investment: "Инвестиции в горнодобывающую инфраструктуру"
 SOV_mining_infrastructure_investment_desc: "Несмотря на объявление о том, что третья пятилетка будет сосредоточена на потребительских товарах, наша горнодобывающая промышленность остро нуждается в инвестициях. Нехватка сырья представляет угрозу для всей нынешней и будущей отечественной советской промышленности. Эти шахты, особенно слаборазработанные, разбросанные по Дальнему Востоку, необходимо будет немедленно усовершенствовать."
 SOV_mining_infrastructure_investment_info: "Добавить §Y1 уровень инфраструктуры§! в регионах с высокой добычей угля и железной руды в Сибири и на востоке России.\n"
  
 SOV_urbanise_the_urals: "Урбанизировать Урал"
 SOV_urbanise_the_urals_desc: "Если мы собираемся осуществить перемещение промышленности во время войны, жизненно важно, чтобы Урал мог поддержать эту новую промышленность. Мы должны финансировать новые инфраструктурные проекты, необходимо строить заводы, и на них должны работать люди."
  
 SOV_transformation_of_nature_tt: "Разблокирует решений по преобразованию природы\n"
  
 SOV_finish_the_third_five_year_plan: "Завершить третий пятилетний план"
 SOV_finish_the_third_five_year_plan_desc: "Мы надеемся, что новых разработок, достигнутых в военной промышленности, будет достаточно, чтобы остановить фашистов на Западе. В противном случае это может стать концом нас… и нашего великого союза."
 SOV_finish_the_third_five_year_plan_tt: "§HТретий§! пятилетний план завершен, его модификаторы удалены. \n$SOV_modify_fyp_ns_intro$ \n£construction_speed_milfactory_texticon Скорость строительства военных заводов: §G+5.00%§! \n\n"
  
 SOV_start_the_fourth_five_year_plan: "Начать четвёртый пятилетний план"
 SOV_start_the_fourth_five_year_plan_desc: "Нам все еще не хватает тяжелой промышленности и умения правильно восстанавливать ее после повреждений. Сталин обещает, что мы станем ведущей промышленной державой мира. Мы не должны его разочаровать."
 SOV_start_the_fourth_five_year_plan_tt: "§YСоветская промышленность§! начинает реализацию четвёртого пятилетнего плана: \n£political_power_texticon  Стоимость политической власти: §R+0.50§! \n£repairing  Скорость ремонта фабрик: §G+40.00%§! \n£factory_output_texticon  Объем заводского производства: §R-30.00%§! \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y+6.0%§!\n\n"
  
 SOV_start_the_fifth_five_year_plan: "Начать пятый пятилетний план"
 SOV_start_the_fifth_five_year_plan_desc: "Наступает новая эра. Родина должна показать миру, что она действительно является неоспоримой сверхдержавой."
 SOV_start_the_fifth_five_year_plan_tt: "§YСоветская промышленность§! начинает реализацию 5-го пятилетнего плана: \n£political_power_texticon  Стоимость политической власти: §R+0.50§! \n£factory_output_texticon  Объем заводского производства: §G+10.00%§! \n£construction_speed_milfactory_texticon  Скорость строительства военных заводов: §G+20.00%§! \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y-4.0%§!\n\n"
  
 SOV_arsenal_of_communism: "Арсенал коммунизма"
 SOV_arsenal_of_communism_desc: "Мы должны стать стойким бастионом поддержки для всех наших друзей и союзников по всему миру."
 SOV_arsenal_of_communism_tt: "$SOV_modify_fyp_ns_intro$ \n£factory_output_texticon  §YОбъем заводского производства§! на §G+10.00%§! \n\n"
  
 SOV_revise_the_five_year_plan: "Пересмотреть пятилетний план"
 SOV_revise_the_five_year_plan_desc: "Безрассудная ставка на милитаризм привела нацию к банкротству и уморила людей голодом! Мы должны немедленно внести коррективы в план."
 SOV_revise_the_five_year_plan_tt: "$SOV_modify_fyp_ns_intro$ \n£construction_speed_milfactory_texticon Скорость строительства военных заводов: §R-20.00%§! \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y+2.0%§! \n£construction_speed_civfactory_texticon Скорость строительства гражданских фабрик: §G+20.00%§! \n\n"
  
 SOV_finish_the_fifth_five_year_plan: "Завершить пятый пятилетний план"
 SOV_finish_the_fifth_five_year_plan_desc: "Нам наконец удалось создать мощную экономическую державу, которая обеспечит безопасность и процветание нашего народа."
 SOV_finish_the_fifth_five_year_plan_tt: "Пятый пятилетний план завершается, его модификаторы удаляются, и нам остается в наследство §GПостоянное снижение экономической усталости§!.\n\n"
  
 SOV_the_greatest_industrial_power: "Величайшая промышленная держава"
 SOV_the_greatest_industrial_power_desc: "Сталин пообещал народу, что мы будем величайшей промышленной державой, известной человечеству. В технологическом отношении мы отстаем от США. Мы должны это исправить, если хотим их обогнать."
  
 SOV_comecon: "СЭВ"
 SOV_comecon_desc: "Благодаря этому новому пакту об экономической поддержке мы покажем Западу, что нам не нужен план Маршалла для процветания и восстановления стран. Этот пакт привяжет к нам членов Коминтерна и не даст им оторваться."
 SOV_comecon_tt: "Разблокирует §YРешения СЭВ§! для марионеток и Советского Союза для оказания экономической помощи."
  
 SOV_belarus_industry_effort: "Индустриализация БССР"
 SOV_belarus_industry_effort_desc: "Несмотря на то, что мы быстро индустриализировались, некоторые места остались без внимания. БССР всегда находилась слишком близко к вражеским границам, но это означало, что она не была настолько индустриализирована. Мы должны изменить эту ситуацию, если хотим быть номером один."
  
 SOV_bread_basket_of_the_soviet_union: "Житница Советского Союза"
 SOV_bread_basket_of_the_soviet_union_desc: "Мы должны продолжить индустриализацию запущенных районов. Украина является ключевым сельскохозяйственным регионом. Мы должны и дальше повышать ее эффективность, если хотим извлечь выгоду из плодородной почвы. Урбанизация ключевых городов принесет наибольшую пользу для достижения этой цели."
 SOV_bread_basket_of_the_soviet_union_tt: "£faction_sov_peasants §YКрестьяне§! станут намного §Gэффективнее§!, уменьшая §YФабрики, производящие товары народного потребления§! на §G4.0%§!"
  
 SOV_finish_the_fourth_five_year_plan: "Завершить четвёртый пятилетний план"
 SOV_finish_the_fourth_five_year_plan_desc: "Сосредоточив внимание на дальнейшей индустриализации, мы должны быть ближе к нашей цели — обогнать Соединенные Штаты и других капиталистических проповедников. Мы не разочаруем Сталина и наш народ. Наше будущее зависит от этого."
 SOV_finish_the_fourth_five_year_plan_tt: "Четвертый пятилетний план завершается, его модификаторы удаляются, и нам в наследство остается модификатор §G+5.00%§! §YСкорость ремонта фабрик§!\n\n"
  
 SOV_expand_the_heavy_industry: "Расширить тяжелую промышленность"
 SOV_expand_the_heavy_industry_desc: ""
  
 SOV_improve_transportation: "Улучшенный транспорт"
 SOV_improve_transportation_desc: ""
  
 SOV_ballistic_missiles: "Баллистические ракеты"
 SOV_ballistic_missiles_desc: "В немецком проекте «Фау» использовались примитивные ракеты для доставки взрывчатых боеприпасов. Использование такого оружия, вероятно, даст нам преимущество в будущих войнах, поэтому нам следует воспроизвести захваченную немецкую технологию методом обратной разработки."
  
 SOV_modernization_of_the_red_army: "Модернизация Красной Армии"
 SOV_modernization_of_the_red_army_desc: "Наши ученые сосредоточатся на исследовании новейших танковых технологий, чтобы обеспечить преимущество в бою."
  
 SOV_Shock_armies: "Ударные армии"
 SOV_Shock_armies_desc: "Ударная армия — специально оснащенная армия, предназначенная для уничтожения целых соединений противника на пути его наступления. Высокая огневая мощь позволяет этим силам продвигаться против самых сложных противников."
 SOV_Shock_armies_tt: "Мы получим §G$shock_division_hq$§! §YРота сигнальной поддержки§!, которая превосходно концентрирует §YТяжёлую артиллерию§!, чтобы прорвать часть линии фронта, позволяя другим, более мобильным подразделениям использовать прорыв.\n\n"
  
 SOV_utilization_of_the_tulan_Arms_industry: "Использовать Тульскую оружейную промышленность"
 SOV_utilization_of_the_tulan_Arms_industry_desc: "Тульский оружейный завод производил оружие для России еще в XVIII веке. Близость к Московской железнодорожной системе гарантирует, что мы сможем производить и транспортировать оружие на фронт в кратчайшие сроки. «Все для фронта, все для победы»."
  
 SOV_form_the_stavka: "Сформировать Ставку"
 SOV_form_the_stavka_desc: "Вооруженные силы Советского Союза полны некомпетентности, и этого нельзя допускать больше. Сталин сформировал Главное командование, которое возьмет на себя непосредственное руководство нашими войсками, чтобы немедленно исправить ситуацию."
  
 SOV_guards_mortars: "Гвардейская ракетная артиллерия"
 SOV_guards_mortars_desc: "На поле боя раздадутся песни наших «Катюш». От колыбельной смерти фашистским захватчикам не уйти."
  
 SOV_disband_the_cavalry_army_clique: "Расформировать кавалерийскую клику"
 SOV_disband_the_cavalry_army_clique_desc: "Ворошилов. Буденный. Кулик. Эти три имени ассоциируются только с неудачей и некомпетентностью. Их необходимо как можно скорее отстранить от командных должностей."
  
 SOV_deep_battle: "Глубокий бой"
 SOV_deep_battle_desc: "Глубокий бой предполагает прорыв передовой обороны противника или тактических зон посредством общевойсковых атак, за которыми последуют свежие незадействованные мобильные оперативные резервы, отправленные для использования стратегической глубины вражеского фронта."
 SOV_deep_battle_tt: "$SOV_modify_the_red_army_ns_intro$ \n£breakthrough_texticon Прорыв армии: §G+10.00%§! \n£attacker_speed_texticon Скорость бронетехники: §G+10.00%§! \n\n"
  
  
 SOV_guards_units: "Гвардейские стрелковые части"
 SOV_guards_units_desc: "Эти подразделения оснащены самым современным снаряжением, которое у нас имеется. Несмотря на то, что их число будет ограничено, они должны обеспечить усиление огневой мощи, необходимое нам для успешного наступления на врага."
 SOV_guards_unit: "Будет разблокирован шаблон §YЭлитной гвардейской стрелковой дивизии.§!"
  
 SOV_breakthrough_tanks: "Танки прорыва"
 SOV_breakthrough_tanks_desc: "Чтобы прорваться через хорошо защищенные позиции противника, нам потребуются новые конструкции танков с большим упором на защиту и огневую мощь."
  
 SOV_perfecting_the_infantry_corps: "Совершенствование нашего пехотного корпуса"
 SOV_perfecting_the_infantry_corps_desc: "Советская Армия не испытывает недостатка в численности пехоты. Однако большинство наших солдат плохо обучены или не имеют необходимого оборудования для продвинутой тактики. Будет предпринято общее улучшение наших пехотных армий."
  
 SOV_self_propelled_artillery: "Самоходная артиллерия"
 SOV_self_propelled_artillery_desc: "С развитием новой артиллерии нам следует создавать ее механизированные версии, чтобы не отставать от наших самых быстрых дивизий. Они не смогут бороться с танками, но будут дешевле, быстрее и эффективнее сражаться с пехотой по сравнению со штурмовыми орудиями."
  
 SOV_assault_guns: "Штурмовые орудия"
 SOV_assault_guns_desc: "Чтобы поддержать линию фронта при наступлении, нам необходимо установить на бронекорпуса более крупные орудия. Эти машины будут оснащены орудиями, способными поражать даже бронированных врагов, а также наносить дополнительный удар по пехоте."
  
 SOV_revitalise_the_airforce: "Оживить ВВС"
 SOV_revitalise_the_airforce_desc: "Наши ВВС остро нуждаются в модернизации. Нам нужны новые истребители и модернизированная инфраструктура, если мы хотим поддерживать современные и боеспособные военно-воздушные силы, способные противостоять нашим самым могущественным врагам."
  
 SOV_evolution_of_the_air_strategy: "Эволюция воздушной стратегии"
 SOV_evolution_of_the_air_strategy_desc: "Наши ВВС полны устаревших самолетов, плохой тактики и неопытных пилотов. В советских ВВС следует воспитывать культуру совершенства, чтобы наши летчики могли справиться с любой угрозой Родине."
  
 SOV_confront_naval_threats: "Противостоять военно-морским угрозам"
 SOV_confront_naval_threats_desc: "Те немногие моря, к которым у нас есть доступ, легко блокируются другими державами. Мы должны нарастить военно-морской флот, чтобы обезопасить наши морские пути."
 SOV_confront_naval_threats_tt: "§GОткрывает технологию морского вторжения§!"
  
 SOV_coastal_defences: "Береговая оборона"
 SOV_coastal_defences_desc: "Нашему флоту не нужно далеко отходить от своих баз из-за ограниченного доступа к открытому океану. Нам следует сосредоточиться на разработке легких кораблей, ориентированных на обеспечение безопасности наших прибрежных вод."
  
 SOV_naval_wargames: "Военно-морские военные игры"
 SOV_naval_wargames_desc: "Нашим адмиралам не хватает опыта и базового понимания современной военно-морской тактики. Проведение масштабных военно-морских учений поможет решить некоторые из этих проблем."
 SOV_naval_wargames_tt: "§GВключает технологию вторжения амфибий§!"
  
 SOV_black_sea_fleet: "Черноморский флот"
 SOV_black_sea_fleet_desc: "Несмотря на то, что этот регион в основном тихий с точки зрения активности, всегда полезно быть уверенным, что торговля может легко проходить через нее и быть остановлена нами в случае необходимости. Поскольку это небольшой регион, ему понадобятся только небольшие корабли."
  
 SOV_baltic_fleet: "Балтийский флот"
 SOV_baltic_fleet_desc: "Этот флот будет сражаться с другими крупными флотами, поэтому ему необходимо иметь как можно большую огневую мощь. Линкоры обеспечивают необходимую нам огневую мощь, хотя Балтийское море — небольшой регион, но это ворота в Атлантику."
  
 SOV_east_asia_fleet: "Восточноазиатский флот"
 SOV_east_asia_fleet_desc: "Мы осознали, что на Тихом океане авианосцы и самолеты станут новым стандартом борьбы с флотами противника. Мы не должны отставать в этом отношении от Японии или США. Открытое море создает множество новых возможностей для обучения нашего флота и разработки новых технологий."
  
 SOV_cult_of_stalin: "Культ личности Сталина"
 SOV_cult_of_stalin_desc: "Теперь, когда Ленин мертв, пришло время людям поклоняться своему новому лидеру. Если все будет успешно, мы сможем легко контролировать людей и так же легко оправдывать свои действия. Сталин станет мучеником нового советского образа."
  
 SOV_cult_of_trotsky: "Культ личности Троцкого"
 SOV_cult_of_trotsky_desc: "Сталин не понимал, что силы коммунизма нельзя заставить простаивать. Революция должна распространяться каждую секунду, не идя на компромисс с врагами коммунизма. Троцкий будет лицом авангарда, когда революция охватит мир!"
  
 SOV_trotsky_constitution: "Конституция Троцкого"
  
 SOV_formation_of_the_nkvd: "Образование НКВД"
 SOV_formation_of_the_nkvd_desc: "Перед лицом политики лояльность и доверие являются хрупкими понятиями. Я лично считаю, что лучше, когда тебя боятся, чем любят."
  
 SOV_emergency_powers: "Чрезвычайные полномочия"
 SOV_emergency_powers_desc: "Нельзя позволить вероломным гитлеровцам захватить наши драгоценные заводы в западной части СССР. Приложив величайшие усилия и жертвуя, мы сможем быстро перебросить наиболее ценное тяжелое оборудование и средства в Челябинск и другие места на Урале."
  
 SOV_emergency_production_committee: "Чрезвычайный производственный комитет"
 SOV_emergency_production_committee_desc: "Нам не удалось должным образом закупить значительное количество оборудования, но не все потеряно. Если мы срежем некоторые углы, мы сможем полностью экипировать наши армии. Могут быть претензии со стороны наших солдат, но нам нужно количество, а не качество."
  
 SOV_defense_of_the_motherland: "В защиту Родины"
 SOV_defense_of_the_motherland_desc: "Фашисты стучатся в ворота страны! Ни в коем случае нельзя допустить падения Москвы, Ленинграда и Сталинграда. Мобилизуйте всех, от детей до стариков, чтобы спешно возвести всю возможную оборону!"
 SOV_defense_of_the_motherland_moscow_forts: "добавить §Yукрепления 6~7 уровней§! в Москве и ее окрестностях с §YПВО Уровня 4§!.\n"
 SOV_defense_of_the_motherland_leningrad_forts: "добавить §Yукрепления 5~9 уровней§! в Ленинграде и его окрестностях с §YПВО 4 уровня§!.\n"
 SOV_defense_of_the_motherland_stalingrad_forts: "\n   добавить §Yукрепления 4~7 уровней§! в Ленинграде и его окрестностях с §YПВО 2 уровня§!.\n"
 SOV_defense_of_the_motherland_volkhov_forts: "\n   добавить §Yукрепления 4-го уровня§! в Волхове и его окрестностях с §YПВО 2-го уровня§!.\n"
  
 SOV_defense_of_the_motherland_tt: "Открывает §Hрешения§! для укрепления различных регионов по всей стране.\n"
 
 
 SOV_lessons_of_war_check_flag: "Вёл войну (не включает войны в рамках пакта Молотова-Риббентропа)"
  
  
 SOV_great_patriotic_war: "[GetGreatPatrioticWarName]"
 SOV_great_patriotic_war_name_default: "Великая Отечественная война"
 SOV_great_patriotic_war_name_alt: "Великая революционная война"
 SOV_great_patriotic_war_desc: "[GetGreatPatrioticWarDesc]"
 SOV_great_patriotic_war_desc_default: "Враг у ворот, мы должны собрать все силы, чтобы дать отпор захватчикам или столкнуться с полным уничтожением."
 SOV_great_patriotic_war_desc_alt: "Врагов революции много. Их цель — погасить наше пламя. Мы должны собрать все силы и сражаться! Боритесь за реализацию нашей социалистической утопии!"
 
 SOV_barrier_troops_tt: "§GРазблокирует специальную способность приказа Nº 1919§!\n§OПриказ Nº 227 срабатывает автоматически при выполнении условий и удаляет §Yштрафы§! от чисток§!\n"
  
 SOV_peoples_militia: "Сформировать народное ополчение"
 SOV_peoples_militia_desc: "Армия добровольцев готова собраться в случае чрезвычайной ситуации в нашей стране. Нам следует назначить офицеров и организовать их в дивизии."
  
 SOV_organized_partisans: "Организовать наших партизан"
 SOV_organized_partisans_desc: "Когда на нас вторгаются, мы должны позволить людям создать организованное сопротивление, которое будет включать в себя саботаж инфраструктуры и заводов, которые захватит враг. Возможно, это всего лишь план, но мы никогда не знаем, когда он окажется полезным."
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
 SOV_new_Soviet_woman: "Новая советская женщина"
 SOV_new_Soviet_woman_desc: "Чтобы продвигать идею равенства в нашем великом союзе, мы должны разрешить женщинам служить в армии. Мы заставим их работать снайперами, медиками и экипажами бомбардировщиков. Мы надеемся, что это заполнит пробелы в наших вооруженных силах и одновременно будет способствовать продвижению нашей идеологии."
  
 SOV_new_Soviet_man: "Новый советский человек"
 SOV_new_Soviet_man_desc: "Советский Союз — это страна разнообразных национальностей, языков и культур. Однако мы все едины как авангард коммунизма. Каждый человек должен стремиться способствовать делу революции, поскольку именно это придает ему индивидуальность."
  
 SOV_new_soviet_person: "Новый советский человек"
 SOV_new_soviet_person_desc: "Советский человек должен был быть самоотверженным, образованным, здоровым, мускулистым и с энтузиазмом распространять коммунистическую революцию. Новая советская женщина была суперженщиной, которая совмещала обязанности коммунистической гражданки, работницы, занятой полный рабочий день, жены и матери."
 SOV_new_soviet_person_tt: "Более консервативные £faction_sov_peasants §YКрестьяне§! станут менее §RВлиятельными§!"
  
 SOV_social_militarism: "Социальный милитаризм"
 SOV_social_militarism_desc: "Милитаристский путь представляет собой широкий спектр обычаев, интересов, престижа, действий и мыслей, выходящих за рамки обычных вооруженных сил. Мы должны полагаться только на свои собственные ресурсы для защиты от враждебного капиталистического мира."
  
 SOV_reestablish_the_Patriarchate: "Восстановить Патриархат"
 SOV_reestablish_the_Patriarchate_desc: "Нашему народу нужна вера. Один Сталин не может обеспечить эту веру, поэтому мы должны восстановить общую религию – русское православие. Это ослабит правительство, но позволит людям объединиться под одной целью, чтобы защитить религию, которой они дорожат."
  
 SOV_collective_property: "Коллективная собственность"
 SOV_collective_property_desc: "Разделив имущество и активы на государственную и личную собственность, мы сможем собрать больше богатства под эгидой Советского Союза."
  
 SOV_soviet_acadamy_of_sciences: "Советская Академия Наук"
 SOV_soviet_acadamy_of_sciences_desc: "Эта академия отвечает за многие новые индустриальные технологии, которые создает наша страна. Мы должны продолжать инвестиции, если хотим идти в ногу с прогрессом."
  
 SOV_air_research_reforms: "Реформы авиационных исследований"
 SOV_air_research_reforms_desc: "Дополнительные исследования должны быть направлены на разработку новых самолетов для наших вооруженных сил. Капиталист доказал разрушительные возможности крупных военно-воздушных сил в небе Германии, и мы не можем позволить себе совершить ту же ошибку."
  
 SOV_synthetic_rubber_programme: "Программа синтетического каучука"
 SOV_synthetic_rubber_programme_desc: ""
  
 SOV_analyze_american_technology: "Анализировать американские технологии"
 SOV_analyze_american_technology_desc: "До наших ушей доходят слухи о новом пугающем оружии, разработанном Вашингтоном. Они не видят в нас настоящего союзника. Мы должны забрать себе их разработки, прежде чем они нанесут нам удар в спину."
  
 SOV_kurnatovs_experiments: "Эксперименты Курчатова"
 SOV_kurnatovs_experiments_desc: "Игорь Курчатов уже является ведущим ученым в области ядерной физики. Сталин высказал мнение, что он является лучшим кандидатом для руководства нашими ядерными исследованиями в будущем."
 SOV_soviet_atomic_bomb_project_unlock_operation_tt: "Открывает §Yоперации§! по внедрению в §Yядерные особые проекты§! крупных держав. Операцию можно провести против каждого §Yядерного особого проекта§!, который ведет другая крупная держава. [GetAgencyRequirement]"

 SOV_design_bureau_11: "Конструкторское бюро 11"
 SOV_design_bureau_11_desc: "Ядерное оружие имеет жизненно важное значение для выживания Советского государства, поэтому мы должны обеспечить успех этих исследований с помощью нового объекта, предназначенного для создания бомбы."
  
 SOV_analyze_german_technology: "Анализируйте немецкие технологии"
 SOV_analyze_german_technology_desc: "В немецком проекте V-бомбы использовались элементарные ракеты для доставки взрывоопасных боеприпасов. Использование такого оружия, вероятно, даст нам преимущество в будущих войнах, поэтому нам следует перепроектировать захваченную немецкую технологию."
  
 SOV_eyes_to_the_west: "Взгляд на Запад"
 SOV_eyes_to_the_west_desc: "Промышленный и сельскохозяйственный центр Советского Союза расположен на Западе. Мы должны обеспечить безопасность наших западных границ, прежде чем преследовать какие-либо другие геополитические цели."
  
 SOV_fortified_state: "Укрепленный регион"
  
 SOV_molotov_line: "Линия Молотова"
 SOV_molotov_line_desc: "Наша новая граница с Германией поддерживается чернильными линиями на хрупком листе бумаги. Наше освобождение российской территории от остатков польского государства должно быть консолидировано и обеспечено."
  
 SOV_eyes_to_the_east: "Взгляд на Восток"
 SOV_eyes_to_the_east_desc: "Обширную Сибирскую равнину в восточных регионах Советского Союза трудно укрепить и защитить. Мы должны работать над тем, чтобы обезопасить ключевые регионы, прежде чем нас застанет врасплох восточный враг."
  
 SOV_develop_asia: "Развивать Центральную Азию"
 SOV_develop_asia_desc: "Если мы хотим разместить подразделения в Центральной Азии, мы должны развивать там инфраструктуру, чтобы наши войска получали необходимое снабжение. Это поможет поддержать наступление на Иран и Ирак. Мы мало что теряем, инвестируя в этот регион."
  
 SOV_european_expansion: "Европейская экспансия"
 SOV_european_expansion_desc: "Если мы начнем оказывать влияние на страны Восточной Европы, мы можем обрести полезных союзников, которые обеспечат буфер против капиталистических угроз на западе. Он будет полагаться на то, что эти страны будут следовать нашей идеологии, но наши шпионы позаботятся о том, чтобы они это сделали."
  
 SOV_european_buffer_zone: "Европейская буферная зона"
 SOV_european_buffer_zone_desc: "Возможно, нам придется действовать более решительно при создании этого буфера. Лидеры этих стран не будут следовать за нами так слепо. Демонстрация военной силы может изменить их мнение."
  
 SOV_befriend_PRC: "Подружитесь с КНР"
 SOV_befriend_PRC_desc: "Как одна из самых близких к нам коммунистических стран, мы должны поддерживать их, чтобы они не были раздавлены китайской и японской угрозой. Если мы позволим им пасть, у нас может не быть еще одного шанса установить коммунизм в Азии."
  
 SOV_military_expansion: "Военная экспансия"
 SOV_military_expansion_desc: "Поскольку угроза войны становится все ближе, мы должны подготовиться к борьбе с превосходящим противником. Строительство новых заводов по производству боеприпасов позволит нам, по крайней мере, подготовить наши силы."
  
 SOV_claim_on_sinkiang: "Приложение Синьцзян"
  
 SOV_create_unit_vdv_tt: "\nСформировать §Y5 Элитных дивизий ВДВ§!"
  
 SOV_future_of_germany: "Будущее Германии"
 SOV_future_of_germany_desc: "Западные державы уже начали выступать против нас и объединили свои владения в Германии в западногерманское государство. Мы должны сделать то же самое и создать конкурирующее правительство в Восточной Германии."
  
 SOV_future_of_austria: "Будущее Австрии"
 SOV_future_of_austria_desc: "Во время Московских деклараций 1943 года союзники пообещали нам создание единой и нейтральной Австрии. Ситуации «трое на одного» в Германии следует избегать, поэтому мы согласны по этому вопросу."
  
 SOV_set_up_communist_korea: "Создание коммунистической Кореи"
 SOV_set_up_communist_korea_desc: "Корейцы веками находились под оккупацией Китайской и Японской империй. Один из лидеров сопротивления, Ким Ир Сен, является ярым коммунистом и многообещающим кандидатом на пост премьер-министра."
  
 SOV_liberate_the_home_of_marx: "Освободить дом Маркса"
 SOV_liberate_the_home_of_marx_desc: "Родина Карла Маркса была заражена фашизмом, не только запятнавшим его память, но и служащим вечным оскорблением всего социализма. Пришло время победить эту злую силу на немецкой земле, освободив ее население от лжепророков, которые их возглавляют."
  
 SOV_operation_zet_desc: "Хотя Гоминьдан является реакционной партией, маловероятно, что Мао и его коммунизм возобладают в Китае. Мы должны стремиться улучшить отношения с Чаном и открыть пути для предоставления ленд-лиза, чтобы помешать Японии получить гегемонию в Китае."
 SOV_operation_zet_tt: "Позволяет §YКитайской Республике§! получать §Gрегулярные поставки§! снаряжения из [ROOT.GetFlag]§YСоветского Союза§!.\nОткрывает фокусы для [CHI.GetFlag]§YКитая§!, что даст §Gнашей стране§! £army_experience  §Yопыт армии§!.\n"
  
 SOV_lay_the_foundations_of_retribution: "Заложить основы возмездия"
 SOV_lay_the_foundations_of_retribution_desc: ""
 foundations_of_retribution_tt: "§YОткрывает решения о проникновении в Центральную Россию§!"
 GER_SOV_ceasefire: "Заключил соглашение о прекращении огня с Германией."
 
 SOV_pc_of_the_navy: "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_navy_ns_name_default: "Военно-морской флот СССР"
 SOV_pc_of_the_navy_default: "Военно-морской флот СССР"
 SOV_pc_of_the_navy_alt: "Министерство военно-морского флота России"
 SOV_pc_of_the_navy_desc: "Поскольку наш флот становится все более современным и боеспособным, настало время признать его родом войск, равным по значимости армии. Первый шаг - позволить ВМС сформировать отдельную от армии администрацию."

 SOV_split_the_pc_of_defence_industry: "[GetPCofDefenceIndustryName]"
 SOV_split_the_pc_of_defence_industry_name_default: "Разделить Наркомат оборонной промышленности"
 SOV_split_the_pc_of_defence_industry_name_alt: "Разделить Министерство оборонной промышленности"
 SOV_split_the_pc_of_defence_industry_desc: "Если мы хотим эффективно наращивать военную промышленность, эту раздутую организацию необходимо разделить на специализированные министерства."
 SOV_split_the_pc_of_defence_industry_tt: "$SOV_modify_fyp_ns_intro$ \n£factory_output_texticon  §YОбъем заводского производства§!: §G+10.00%§! \n\n"

 
 
 SOV_army_reorganization_ns_tt: "\n$SOV_modify_the_red_army_ns_intro$ \n£army_experience Получаемый опыт сухопутной дивизии: §G+10%§! \n£training_texticon Минимальный уровень обучения: §G-5%§! £training_texticon Время подготовки: §G-15%§! \n\n"
 
 SOV_mol_rib_pact: "Сделка с дьяволом"
 SOV_mol_rib_pact_desc: "Несмотря на отсутствие отношений в последние несколько лет, между нами и набирающими силу державами Европы все еще возможно сближение. Их объединяет с нами ненависть к нашим общим врагам, и, как говорится, враг моего врага – мой друг. Возможно, сделка с дьяволом была бы не так уж и плоха..."
  
 SOV_establish_the_northern_fleet: "Создать Северный флот"
 SOV_establish_the_northern_fleet_desc: "Несмотря на то, что Мурманск расположен к северу от Полярного круга, по иронии судьбы, он является нашим единственным портом, который круглый год остается свободным ото льда и имеет выход в открытый океан. Нам следует создать соответствующий флот, если мы хотим обезопасить этот жизненно важный регион."
  
 SOV_our_mineral_wealth: "Наши минеральные богатства"
 SOV_our_mineral_wealth_desc: "Родина богата природными ресурсами. Мы можем стать мировыми лидерами, если только направим наши усилия на их добычу."
 SOV_our_mineral_wealth_tt: "$SOV_modify_fyp_ns_intro$ \n£resources_to_market_icon Эффективность увеличения ресурсов: §G+10.00%§! \n\n"
  
 SOV_pc_of_armament: "[GetPCofArmamentName]"
 SOV_pc_of_armament_name_default: "Народный комиссариат вооружения"
 SOV_pc_of_armament_name_alt: "Министерство вооружения"
 SOV_pc_of_armament_desc: "Программа наращивания военной мощи требует централизации разработки и производства оружия под единым руководством, чтобы производство могло осуществляться без препятствий."
 SOV_pc_of_armament_tt: "\n$SOV_modify_fyp_ns_intro$ \n£factory_output_texticon Объем заводского производства: §G+5.00%§!"
  
 SOV_pc_of_aviation_industry: "[GetPCofAviationIndustryName]"
 SOV_pc_of_aviation_industry_name_default: "Наркомат авиационной промышленности"
 SOV_pc_of_aviation_industry_name_alt: "Министерство авиационной промышленности"
 SOV_pc_of_aviation_industry_desc: "Необходимо единое министерство для контроля над авиационной промышленностью. Будут построены новые авиазаводы. Сборочные предприятия, конструкторские бюро и авиационные институты должны подчиниться."
  
 SOV_pc_of_munitions: "[GetPCofMunitionsName]"
 SOV_pc_of_munitions_name_default: "Народный комиссариат боеприпасов"
 SOV_pc_of_munitions_name_alt: "Министерство боеприпасов"
 SOV_pc_of_munitions_desc: "Наше производство вооружений будет идти гораздо быстрее, если мы централизуем промышленность по производству боеприпасов и взрывчатых веществ под одним руководством."
  
  
 SOV_pc_of_shipbuilding_industry: "[GetPCofShipbuildingIndustryName]"
 SOV_pc_of_shipbuilding_industry_name_default: "Наркомат судостроительной промышленности"
 SOV_pc_of_shipbuilding_industry_name_alt: "Министерство судостроительной промышленности"
 SOV_pc_of_shipbuilding_industry_desc: "Эта организация, контролирующая все верфи, производственные предприятия и конструкторские бюро, является ключом к реализации наших военно-морских амбиций."
 SOV_pc_of_shipbuilding_industry_tt: "$SOV_modify_fyp_ns_intro$ \n£dockyard_output_texticon Производительность верфи: §G+5.00%§! \n\n"
  
 SOV_pc_of_tank_industry: "[GetPCofTankIndustryName]"
 SOV_pc_of_tank_industry_name_default: "Наркомат танковой промышленности"
 SOV_pc_of_tank_industry_name_alt: "Министерство танковой промышленности"
 SOV_pc_of_tank_industry_desc: "Танк, несомненно, является ключом к победе в этой новой войне. Необходимость превыше всех других соображений. Поэтому необходим единый орган для организации и контроля максимального производства избранных эффективных моделей танков."
 SOV_pc_of_tank_industry_tt: "Открывает новый модуль танка: §YДешевая конструкция§!: \n£repairing  Надежность: §R-10.00%§! \n£production_cost  Стоимость производства: §G-20.00%§!"
  
 SOV_glavvoenstroi: "Главвоенстрой"
 SOV_glavvoenstroi_desc: "Главное управление оборонного строительства. Агентство, которое занимается строительством любых зданий, необходимых для военных действий."
 SOV_glavvoenstroi_tt: "$SOV_modify_fyp_ns_intro$ \n£consumer_goods_texticon  Ожидаемое количество фабрик, перенаправленных на товары народного потребления: §Y-2.0%§! \n£construction_speed_texticon  Скорость строительства: §G+5.00%§!\n\n"
  
 SOV_women_in_the_army: "Женщины в армии"
 SOV_women_in_the_army_desc: ""
  
 SOV_war_winning_tanks: "Танки-победители"
 SOV_war_winning_tanks_desc: "Будет более эффективно, если мы сосредоточим ограниченные ресурсы на нескольких успешных разработках, которые достаточно хороши для того, чтобы армия могла закончить войну."
 SOV_merge_evacuated_plants: "Объединение эвакуированных заводов"
 SOV_merge_evacuated_plants_desc: "Если мы хотим, чтобы военные усилия росли, необходимо разобраться с беспорядком, возникшим в результате экстренного демонтажа целых заводов и их переноса на тысячи миль на восток!"
  
 SOV_modern_fighter_designs: "Современные конструкции истребителей"
 SOV_modern_fighter_designs_desc: "Наши враги явно обладают преимуществом в конструкции истребителей. Новую войну нужно сначала выиграть в небе, и ключ к этому — довести наши собственные модели до паритета, а затем превзойти все остальные!"
  
 SOV_long_range_aviation: "Дальняя авиация"
 SOV_long_range_aviation_desc: "Новые бомбардировочные силы должны быть организованы на пепелище предыдущих потерь. Задача: бомбардировка административных, политических и военных объектов в глубоком тылу противника; нарушение транспорта противника и уничтожение логистических узлов за фронтом. Ядро этих специализированных бомбардировочных сил составят бомбардировщики дальнего действия и другая авиация поддержки."
  
 SOV_utilise_the_civil_air_fleet: "Задействовать гражданский воздушный флот"
 SOV_utilise_the_civil_air_fleet_desc: "В составе Гражданского воздушного флота уже много летчиков, инструкторов и других авиационных специалистов с многолетним опытом работы. Они могут внести ценный вклад в развитие ВВС."
  
 SOV_long_range_bomber_aviation: "Дальняя бомбардировочная авиация"
 SOV_long_range_bomber_aviation_desc: "Недавние плохие результаты воздушных армий являются достаточным поводом для их расформирования. Вместо этого подразделения будут переформированы в интегрированную Дальнебомбардировочную авиацию. Необходимо также вложить средства в истребители дальнего действия."
 SOV_long_range_bomber_aviation_tt: "«§YМиГ§!» (£funds_texticon  Прирост финансов: §G+50%§!) в течение §Y365 дней§!\n"
 SOV_long_range_bomber_aviation_tt2: "$SOV_modify_airforce_ns_intro$ \nНаземная атака: §G+10.00%§!"
  
 SOV_vdv: "ВДВ"
 SOV_vdv_desc: "Если мы хотим показать истинный потенциал Воздушно-десантных войск, необходимо создать полноценные подразделения воздушно-десантного корпуса. Лучшие из лучших, что может предложить Родина."
  
 SOV_reform_the_airforce: "Реформировать ВВС"
 SOV_reform_the_airforce_desc: "Последние результаты деятельности ВВС, мягко говоря, разочаровали. Чтобы привести их в надлежащее состояние, необходимы серьезная реорганизация и преобразования."
 SOV_reform_the_airforce_tt: "Позволяет решениями §YРеформа Военно-воздушных сил§! постепенно улучшать ВВС.\n\n$SOV_modify_airforce_ns_intro$ \n£air_experience Прирост опыта за подготовку авиакрыла: §G+5.00%§! \n£air_experience Прирост опыта в воздухе: §G+10.00%§!\n\n"
  
 SOV_establish_air_armies: "Создать воздушные армии"
 SOV_establish_air_armies_desc: "В соответствии с доктриной «Глубоких операций» 1-й эшелон Красной Армии должен быть сформирован вокруг массированной авиации дальнего действия. Нам нужна инфраструктура для поддержки таких усилий."
  
 SOV_cult_of_the_offensive: "Культ наступления"
 SOV_cult_of_the_offensive_desc: "Современное вооружение обеспечивает такую огневую мощь, что надежно защитить фронт становится невозможно. Следовательно, наиболее эффективное противодействие нападению — это собственное нападение. Нам просто нужно сделать его больше, чем у врага.."
 SOV_cult_of_the_offensive_tt: "$SOV_modify_the_red_army_ns_intro$ \n£attack_texticon Атака армии: §G+5%§! \n£defence_texticon Оборона армии: §R-10%§! \n£organization_gain_texticon Восстановление дивизии: §G+5%§! \n\n $SOV_modify_the_politburo_ns_intro$ \n£reinforce_texticon Скорость пополнения: §G+5.0%§! \n\n"
  
 SOV_adapt_to_enemy_tactics: "Адаптироваться к тактике противника"
 SOV_adapt_to_enemy_tactics_desc: "После месяцев напряженных боев мы можем многое узнать о том, как действует враг, и, следовательно, лучше адаптироваться, чтобы противостоять ему."
 SOV_adapt_to_enemy_tactics_tt: "$SOV_modify_the_red_army_ns_intro$ \n£training_texticon Время обучения: §G-10%§! \n£defence_texticon Оборона армии: §G+10%§! \n\n"
  
 SOV_tank_armies: "Танковые армии"
 SOV_tank_armies_desc: "Бронетанковый кулак Родины будет более эффективен в сокрушении линий противника, если мы сосредоточим бронетанковые части в крупных танковых армиях."
 SOV_attempt_combined_arms_tt: "Дает §YШаблон средней танковой дивизии§!"
 SOV_tank_armies_tt: "Дает §YШаблон тяжелой танковой дивизии§!\n\n$SOV_modify_the_red_army_ns_intro$ \n£attack_texticon Атака бронетехники: §G+10.00%§! \n£defence_texticon Защита бронетехники: §G+10.00%§! \n\n"
  
 SOV_concentrated_artillery: "Концентрированная артиллерия"
 SOV_concentrated_artillery_desc: "Ограниченное количество специалистов, разбирающихся в математике и калибровках, означает, что трудно получить надежные результаты от отдельных артиллерийских батарей. Будет более эффективно, если мы сосредоточим большое количество артиллерии под контролем одного командира, чтобы максимизировать и сфокусировать ее огонь."
  
 SOV_attempt_combined_arms: "Попытка общевойскового боя"
 SOV_attempt_combined_arms_desc: "У нас были отличные теории по объединению пехоты, артиллерии и бронетехники в сплоченную боевую единицу. Теперь пришло время применить теорию на практике как первую ступеньку на пути к совершенствованию глубокого боя."
  
 SOV_leaders_of_aviation: "Лидеры авиации"
 SOV_leaders_of_aviation_desc: "Реактивный двигатель – это начало новой эры в авиации. Если мы хотим закрепить статус [SOV.GetAdjective]их ВВС как хозяев неба, необходимы новые и передовые конструкции самолетов."
 SOV_leaders_of_aviation_tt: "$SOV_modify_airforce_ns_intro$ \n£speed_air_texticon Маневренность в воздухе: §G+5%§! \n£air_efficiency_texticon Эффективность воздушной миссии: §G+5.00%§!\n\n"
  
 SOV_modernization_of_the_rifle_corps: "Модернизация стрелкового корпуса"
 SOV_modernization_of_the_rifle_corps_desc: "Стрелковый корпус на протяжении десятилетий был основой российской армии. Пришло время привести его в соответствие с требованиями новой эпохи мобильной войны."
  
 SOV_mechanization_of_the_red_army: "Механизация Красной Армии"
 SOV_mechanization_of_the_red_army_desc: "В следующей войне не выиграют артиллерия, пехота или даже бомбардировщики. Танки и броня — вот что сформирует кулак, который пронзит врага."
  
 SOV_god_of_war: "Бог войны"
 SOV_god_of_war_desc: "На протяжении веков и на всех полях сражений артиллерия была и всегда будет богом войны."
 SOV_god_of_war_tt: "$SOV_modify_the_red_army_ns_intro$ \n£unit_artillery_brigade_icon_small Атака артиллерии: §G+15%§! \n\n"
  
 SOV_heavy_weapons_modernization: "Модернизация тяжелого вооружения"
 SOV_heavy_weapons_modernization_desc: "Современные угрозы требуют современных решений. Пехота должна быть наготове с пулеметами, противотанковыми и зенитными орудиями, чтобы преуспеть на современном поле боя."
  
 SOV_zis: "[GetZiSName]"
 SOV_zis_name_default: "Завод имени Сталина"
 SOV_zis_name_alt: "Горьковский машиностроительный завод"
 SOV_zis_desc: "Политическая слепота и некомпетентность слишком надолго задержали принятие на вооружение современных дивизионных орудий. К счастью, такие гениальные люди, как В. Г. Грабин, еще сохраняют решительность. Его завод уже переоснащается и начинает производство новых орудий. Нам нужно лишь, чтобы политическое руководство добилось их принятия на вооружение."
  
 SOV_ultimate_tank_evolution: "Вершина эволюции танков"
 SOV_ultimate_tank_evolution_desc: "После многих лет практического опыта в горниле войны мы наконец достигли пика того, каким может быть танк!"
  
 SOV_reinstate_general_staff_academy: "Восстановить Академию Генерального штаба"
 SOV_reinstate_general_staff_academy_desc: "Академия может подготовить большое количество старших командиров и штабных офицеров. Армия может модернизироваться и расширяться только в том случае, если ею будут руководить способные офицеры."
 SOV_reinstate_general_staff_academy_tt: "$SOV_modify_the_red_army_ns_intro$ \n£army_experience Прирост опыта дивизии: §G+10%§! \n"
  
 SOV_abolish_the_territorial_organisation: "Упразднить территориальную организацию"
 SOV_abolish_the_territorial_organisation_desc: "Разделение армии на местные территориальные части и постоянные войска явно провалилось. Более того, оно сильно снизило эффективность подготовки и пополнения. Мы должны покончить с этим."
 SOV_abolish_the_territorial_organisation_tt: "$SOV_modify_the_red_army_ns_intro$ \n£mobilisation_texticon Рекрутируемое население: §G+10.00%§! \n£training_texticon Время обучения: §G-5.00%§!\n"
  
 SOV_instate_political_commissars: "Ввести институт политических комиссаров"
 SOV_instate_political_commissars_desc: "Военным нельзя доверять без надзора. Нужны люди, которые обеспечат абсолютную лояльность армии правительству. Сильное государство должно требовать полного повиновения каждого солдата."
  
 SOV_reserve_armies_administration: "Управление резервных армий"
 SOV_reserve_armies_administration_desc: "Растущая глобальная напряженность означает, что крупная война может разгореться в любой момент. Расширение, мобилизация и подготовка новых армейских резервов должны происходить со всей поспешностью."
 SOV_reserve_armies_administration_tt: "Вдвое снижает затраты на людские ресурсы для резервных дивизий\n$SOV_modify_the_politburo_ns_intro$ \n£training_texticon Минимальный уровень обучения: §G-10%§! \n£mobilisation_texticon Скорость мобилизации: §G+10.00%§! \n£mobilisation_texticon Стоимость закона о призыве: §G-10.00%§! \n\n"
  
 SOV_a_multiethnic_army: "Многонациональная армия"
 SOV_a_multiethnic_army_desc: "Родина является домом для многих и разнообразных народов. Раньше многих из них не призывали на службу. Однако возросшие потребности войны означают, что мы задействуем каждого, кого только сможем."
 SOV_a_multiethnic_army_tt: "$SOV_modify_the_red_army_ns_intro$ \n£mobilisation_texticon Рекрутируемое население: §G+5.00%§! \n"
  
 SOV_rebuild_the_army: "Восстановить армию"
 SOV_rebuild_the_army_desc: "Мы понесли огромные потери. Однако Родина – это огромная нация с огромными ресурсами, а именно со своим горячо любящим ее народом. Миллионы готовы ответить на этот призыв!"
 SOV_rebuild_the_army_tt: "$SOV_modify_the_politburo_ns_intro$ \n£training_texticon Минимальный уровень обучения: §G-10%§! \nРазблокирует решения для фракции £faction_sov_army §YАрмия§!, быстро поднять новые дивизии и укрепить линию фронт. \n"
  
 SOV_lessons_of_war_tt: "$SOV_modify_the_red_army_ns_intro$ \n£defence_texticon Защита пехоты: §G+15%§! \n£attrition_texticon Зимнее истощение: §G-10%§! \n£attrition_texticon Истощение от жары: §G-10%§! \n£army_experience Прирост опыта дивизии: §G+10%§! \n\n"
 SOV_lessons_of_war_flag: "Фокус §YУроки войны§! выполнен"
 SOV_lessons_of_war_flag_tt: "В настоящее время: [?SOV_lessons_of_war_flag:days|Y0]"
  
 SOV_army_reorganization: "Реорганизация армии"
 SOV_army_reorganization_desc: "Наши попытки создать большую механизированную армию были благородными, но это было больше, чем мы могли себе позволить. Чтобы выиграть следующий конфликт, нам придется сосредоточиться на родах войск, которые веками приводили российские армии к победе: пехоте и артиллерии. Это неизбежно потребует от нас в определенной степени нарушить структуру существующих формирований."
 SOV_army_reorganization_tt: "\n$SOV_modify_the_red_army_ns_intro$ \n£army_experience  Получаемый опыт армии: §G+10.0%§!\n\n $SOV_modify_the_politburo_ns_intro$\n£training_texticon  Минимальный уровень обучения: §G-5%§!\n£training_texticon  Время подготовки: §G-15.00%§! \n\n"
  
 SOV_a_secure_industrial_base: "Защищенная промышленная база"
 SOV_a_secure_industrial_base_desc: "Самая большая угроза нашей стране, вероятно, будет исходить от страны в Европе. Осваивая территории за Уралом, мы создадим резерв промышленных мощностей, до которого будет трудно добраться даже самому дальнему бомбардировщику."
  
 SOV_a_secure_industrial_base_tt: "§YЗаводы, получаемые от ВПО, теперь будут отдавать предпочтение для строительства уральским регионам.§!"
  
 SOV_pc_of_fuel_industry: "[GetPCofFuelIndustryName]"
 SOV_pc_of_fuel_industry_name_default: "Наркомат топливной промышленности"
 SOV_pc_of_fuel_industry_name_alt: "Министерство топливной промышленности"
 SOV_pc_of_fuel_industry_desc: "Наша земля содержит одни из крупнейших запасов нефти в мире. Наше стремление к модернизации может продолжиться только в том случае, если мы вложим наши усилия в разработку черного золота новой эпохи."
  
 SOV_develop_the_heartland: "Развить сердце страны"
 SOV_develop_the_heartland_desc: "Глубинные регионы Сибири и Центральной Азии обладают огромным потенциалом. Нужно лишь вложить средства в регион, чтобы пожинать плоды."
  
 SOV_preserve_veteran_units: "Сохранить ветеранские части"
 SOV_preserve_veteran_units_desc: "Мы должны позаботиться о том, чтобы в тылу сохранились солдаты-ветераны, пережившие напряженные бои, чтобы они могли лучше делиться своим боевым опытом с волнами новобранцев."
  
 SOV_big_fleet_program: "Программа большого флота"
 SOV_big_fleet_program_desc: "Целью России на протяжении веков было обеспечение доступа к открытому морю. Пришло время воплотить это в жизнь!"
  
 SOV_purchase_foreign_expertise: "Привлечь иностранных специалистов"
 SOV_purchase_foreign_expertise_desc: "Мы должны искать иностранных специалистов, чтобы восполнить нашу слабость в военно-морском деле."
  
 SOV_modern_battleships: "Современные линкоры"
 SOV_modern_battleships_desc: "Чтобы бросить вызов другим державам в открытом море, требуется новое поколение мощных крупных кораблей, которые могли бы стать центральным элементом нашего плана по созданию современного большого флота."
  
 SOV_modern_battlecruisers: "Современные линейные крейсеры"
 SOV_modern_battlecruisers_desc: "Линкоры требуют значительных затрат времени и ресурсов и часто устаревают еще до того, как их постройка будет завершена. Меньшие линейные крейсеры могут быть построены намного быстрее и, следовательно, им гораздо легче идти в ногу с технологическими разработками, при этом превосходя любой тяжелый крейсер."
  
 SOV_modern_escorts: "Современные корабли сопровождения"
 SOV_modern_escorts_desc: "Нужны новые проекты мощных легких кораблей сопровождения, которые могли бы сопровождать и охранять крупные корабли, а также обеспечивать безопасность морских путей."
  
 SOV_raise_naval_infantry: "Сформировать морскую пехоту"
 SOV_raise_naval_infantry_desc: "Когда Родина зовет, Черные Дьяволы всегда отвечают!"
 SOV_raise_naval_infantry_tt: "§GОткрывает технологию морского вторжения§! \n$SOV_modify_fyp_ns_intro$ \n£dockyard_output_texticon Производительность верфи: §R-50.00%§! \n$SOV_modify_red_fleet_ns_intro$ \n£refitting Стоимость перевооружения: §R+10.00%§! \n£repairing Скорость ремонта кораблей: §R-10.00%§! \n£coordination_texticon Координация флота: §R-50.00%§! \n£maneuver_texticon Размещение: §R-25.00%§! \n\n"
  
 SOV_reorganize_the_navy: "Реорганизация ВМФ"
 SOV_reorganize_the_navy_desc: "Война оставила флот не в лучшей форме. Нам следует найти время и заняться реорганизацией и исправлением его плохого состояния."
 SOV_reorganize_the_navy_tt: "$SOV_modify_fyp_ns_intro$ \n£dockyard_output_texticon Производительность верфи: §G+50.00%§! \n$SOV_modify_red_fleet_ns_intro$ \n£refitting Стоимость перевооружения: §G-10.00%§! \n£repairing Скорость ремонта кораблей: §G+10.00%§! \n£coordination_texticon Координация флота: §G+50.00%§! \n£maneuver_texticon Размещение: §G+25.00%§! \n\n"
  
 SOV_conscript_men_into_labour: "Трудовая мобилизация мужчин"
 SOV_conscript_men_into_labour_desc: "У нас огромное количество рабочей силы, заточенной в дальневосточных ГУЛАГах. Мы могли бы использовать их в растущей военной промышленности."
  
 SOV_claims_against_turkey: "Претензии к Турции"
 SOV_claims_against_turkey_desc: "Турецкие территории Карс и Ардаган исторически входили в состав Российской империи. Будет только справедливо, если мы предъявим свои претензии и потребуем их возвращения! В случае успеха мы также укрепим свои позиции на Черном море."
  
 SOV_secure_the_far_east: "Обезопасить Дальний Восток"
 SOV_secure_the_far_east_desc: "С японскими провокациями на наших границах необходимо покончить раз и навсегда. Большая демонстрация силы наверняка отговорит их от дальнейших необдуманных решений."
 siberia_secured: "Обезопасить §Gвоенные§! объекты на Дальнем Востоке, предотвращая их повреждение в результате дальнейших рейдов. Мы должны сохранять полное присутствие, если хотим вообще прекратить все провокации."
  
 SOV_propose_a_soviet_republic: "Предложить создать Синьцзянскую [SOV.GetAdjective]ую республику"
 SOV_propose_a_soviet_republic_desc: "\n\nСиньцзян медленно отдаляется от нас и возвращается к центральному правительству Китая. Если мы хотим сохранить контроль над их ресурсами, мы могли бы предложить план их полной интеграции в [SOV.GetName]."
  
 SOV_offensive_juggernaut: "Наступательный Джаггернаут"
 SOV_offensive_juggernaut_desc: "Годы конфликта превратили армию в отлаженную и неудержимую машину войны!"
  
 SOV_guards_armies: "Гвардейские армии"
 SOV_guards_armies_desc: "Родина не может обеспечить бесконечный запас людей. Эффективнее будет, если сосредоточить современную технику в гвардейских частях и сгруппировать их в полные армии."
  
 SOV_wartime_lessons: "Уроки военного времени"
 SOV_wartime_lessons_desc: "Анализ тактики противника и технологических достижений приблизит нас на один шаг к достижению наших морских амбиций."
  
 SOV_guards_armies_tt: "$SOV_modify_the_red_army_ns_intro$ \n£doctrine_mod Прирост очк. освоения: §G+20%§! \n\n"
  
 SOV_the_red_storm: "Красный шторм"
 SOV_the_red_storm_desc: "Если политическое руководство будет больше доверять возможностям военного командования, можно будет эффективно организовать масштабные, хорошо спланированные операции, способные переломить ход войны."
  
 SOV_our_motherland_our_people_our_blood: "Наша Родина. Наш народ, наша кровь"
 SOV_our_motherland_our_people_our_blood_desc: "Наша долгая борьба привела нас к этому моменту. Мы научились, адаптировались и постепенно вытеснили врага с нашей земли. Наша военная мощь никогда не была сильнее! Настало время забить последний гвоздь в гроб врага!"
  
 SOV_ask_for_aid: "Просить о помощи"
 SOV_ask_for_aid_desc: "Масштабы и требования нынешней глобальной войны превосходят все, что мы могли себе представить или запланировать. [USA.GetName] заявил о своей готовности поддерживать всех врагов фашизма. К нашему огорчению, нам приходится признать реальность ситуации и принять их поддержку."
 SOV_ask_for_aid_tt: "§G[USA.GetName]§! увеличит нашу долю §OЛенд-лиза§!, помогая нам поддерживать и улучшать различные отрасли, включая, помимо прочего: §YВоенную промышленность§!, §YЭкономическую усталость§! и §YВоенно-воздушные силы§!.\n"
 SOV_ask_for_aid_flag: "[SOV.GetName] просит о помощи!"
  
 SOV_long_live_the_workers_government_tt: "$SOV_modify_fyp_ns_intro$ \n£efficiency_growth_texticon Рост эффективности производства: §G+5.00%§! \n£research_speed_texticon Темпы исследований: §G+2.00%§! \n\n"
  
 SOV_the_path_of_marxism_leninism_tt: "$SOV_modify_the_politburo_ns_intro$ \nЗащита от смены идеологии: §G+5.0%§! \nЕжедневная поддержка коммунизма: §G+0.05§! \n\n"
  
 SOV_the_permanent_revolution_tt: "$SOV_modify_the_politburo_ns_intro$ \n£drift_defence_texticon Защита от смены идеологии: §G+30.0%§! \nУсиление идеологической миссии: §G+20%§! \n£command_power_texticon Максимальный командный ресурс: §G+50§! \n\n"
  
 SOV_march_of_the_proletariat: "Марш пролетариата"
 SOV_march_of_the_proletariat_desc: "«Весь пролетариат должен быть немедленно вооружен мушкетами, винтовками, пушками и боеприпасами!»"
  
 SOV_eradicate_stalinism: "Искоренить сталинизм"
 SOV_eradicate_stalinism_desc: "Темная эпоха Сталина закончилась. Наступает рассвет новой эпохи, и остаткам старого режима нет в ней места."
  
 SOV_revolutionary_army: "Революционная армия"
 SOV_revolutionary_army_desc: "Коммунизму всегда угрожают ревизионисты, фашисты и реакционеры. Мы добьемся успеха, потому что у нас есть воля народа. Каждый мужчина должен взять в руки винтовку и служить Советскому Союзу!"
 revolutionary_army: "Революционная армия"
 revolutionary_army_tt: "£tech_mod  Открывает §HРеволюционная армия§!\n§Y$infantry$§!\n   Противопехотная атака: §G+10%§!\n   Защита: §G+15%§!\n   ОЗ: §G+25%§!\n   Организация: §G+10§!\n\n§Y$militia$§!\n   Противопехотная атака: §G+10%§!\n   Защита: §G+15%§!\n   ОЗ: §G+25%§!\n   Организация: §G+10§!\n\n§Y$heavy_militia$§!\n   Противопехотная атака: §G+10%§!\n   Защита: §G+15%§!\n   ОЗ: §G+25%§!\n   Организация: §G+10§!\n\n"
  
 SOV_international_union_of_soviet_republics_puppet_tt: "Построит §Y1 фабрику и §Y2 военных завода§! в столице."
  
 

 
 SOV_internal_factions: "Внутренние фракции"
 SOV_internal_factions_desc: "Народу России нужна сильная рука, чтобы вести его к величию. Пятилетние планы гарантируют, что эпоха расширения и процветания уже не за горами, и нам нужно, чтобы все фракции пообещали свою поддержку, чтобы извлечь из этого максимальную выгоду.\n\n"
  
 SOV_commissars_name_text: "Комиссары"
