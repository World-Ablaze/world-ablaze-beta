 STRATEGIC_REGION_eastern_front: "Восточный фронт"
 STRATEGIC_REGION_eastern_front_desc: "Восточная Европа является жизненно важной частью целостной безопасности нашей территории.\n\nКонтроль должен поддерживаться, и в случае войны мы не можем §Rпотерять§! значительные города здесь, иначе мы начнём терять\n£stability_texticon£ стабильность и £war_support_modifiericons_texticon£ поддержку войны.\n\n §Y[SOV.GetFlag][SOV.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetSOVEasterneuropecontrol] ([?global.SOV_ee_control|Y0])\n\n §Y[GER.GetFlag][GER.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetGEREasterneuropecontrol] ([?global.GER_ee_control|Y0])\n\n §Y[POL.GetFlag][POL.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetPOLEasterneuropecontrol] ([?global.POL_ee_control|Y0])\n\n §Y[ROM.GetFlag][ROM.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetROMEasterneuropecontrol] ([?global.ROM_ee_control|Y0])\n\n §Y[EST.GetFlag][EST.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetESTEasterneuropecontrol] ([?global.EST_ee_control|Y0])\n §Y[LAT.GetFlag][LAT.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetLATEasterneuropecontrol] ([?global.LAT_ee_control|Y0])\n §Y[LIT.GetFlag][LIT.GetAdjective]ий§! контроль Восточной Европы: [ROOT.GetLITEasterneuropecontrol] ([?global.LIT_ee_control|Y0])"
 
 STRATEGIC_REGION_infiltration_desc: "Восточный фронт зашел в тупик. [GER.GetAdjective]ое снабжение на пределе, но [SOV.GetAdjective]ая армия потрепана постоянными потерями, приведшими к отступлению за горы, и должна быть восстановлена, чтобы иметь хоть какую-то надежду вернуть потерянные земли.\n\n§YГерманские войска должны оставаться на границе, иначе мы рискуем: ведь [SOV.GetAdjective]ое проникновение в наши оккупированные регионы может привести к§! §Rпотере земли§! §Yпосле возобновления войны§!.\n\n§Y[SOV.GetFlag][SOV.GetAdjective]ое§! проникновение в Центральную Россию: [ROOT.GetSOVinfiltrationlevel] ([?SOV_infiltration_level|Y0])"
  
 SOV_recruiting_reserves_40: "Это приведет к тому, что §Y40 обученных пехотных дивизий§! будут доступны к развертыванию во время войны.\nРезервная пехота развертывается с §Y50% снаряжения§!\nРезервы оснащены самыми старыми моделями оружия\n\n"
  
