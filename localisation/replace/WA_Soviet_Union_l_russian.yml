 sov_armor.840.d: "Из-за отсутствия [GER.GetAdjective]их сил, [SOV.GetAdjective]ие части быстро воспользовались возможностью переправить партизан, технику и припасы через бреши и организовать антинемецкую деятельность в Оренбурге.\n\n"
