 SOV_ww3_desc: "Они думали, что смогут заставить нас подчиниться, они думали, что мы уступим и сдадимся, но сегодня мы им покажем, что Красная Армия никому не кланяется! Сегодня мы покажем им мощь Советского Союза, сегодня мы научим этих натовских собак воевать."
