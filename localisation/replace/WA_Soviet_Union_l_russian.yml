 SOV_the_polish_operation: "Польская операция"
 SOV_the_polish_operation_desc: "Недоверие Сталина к полякам особенно сильно. Он видит в них потенциальную пятую колонну полуфашистского польского государства, которая наверняка объединится с нашими внешними врагами для нападения на Советский Союз."
  
 SOV_end_the_terror: "Покончить с террором"
 SOV_end_the_terror_desc: "Угроза НКВД выходит из-под контроля. Лояльный Берия — единственный человек, которому мы можем доверить обуздание НКВД, не подрывая его авторитета и широкого влияния."
 SOV_end_the_terror_tt: "£faction_sov_peasants §YКрестьяне§! станут §Gлояльнее§! и §Yвлиятельнее§! \n\n$SOV_modify_the_politburo_ns_intro$ \n£political_power_texticon  §Yприрост политической власти§!: §G+5%§! \n\n"
  
