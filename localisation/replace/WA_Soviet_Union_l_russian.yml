 SOV_Commissars_patriotic_fighting: "£faction_sov_commissars  Патриотическая борьба"
 SOV_Commissars_patriotic_fighting_tt: "£faction_sov_commissars  §YКомиссары§! относятся §Cлояльно§! к нам и имеют маленькое §Yвлияние§! или выше. \nВремя выполнения этого решения будет длится на §Y7 дней§! дольше для каждого уровня §Yвлияния§!."
  
 SOV_Commissars_special_orders: "£faction_sov_commissars  Специальные приказы"
 SOV_Commissars_special_orders_tt: "£faction_sov_commissars  §YКомиссары§! относятся §3дружелюбно§! к нам и имеют маленькое §Yвлияние§! или выше. \nВремя выполнения этого решения будет длится на §Y30 дней§! дольше для каждого уровня §Yвлияния§!."
  
 SOV_Commissars_raise_nkvd_divisions: "£faction_sov_commissars  Формирование дивизий НКВД"
