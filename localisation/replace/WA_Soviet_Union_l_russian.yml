 SOV_trotsky_revolution: "§OЕсли в стране более 25% поддержки коммунизма, начнется гражданская война§!"
  
 SOV_begin_the_revolution: "Начать революцию"
 SOV_begin_the_revolution_desc: "В 1920 году мы были отброшены на Висле из-за военной некомпетентности Сталина. Во второй раз у нас не отнимут революцию. Польша будет побеждена, и шлюзы в Европу откроются."
  
 SOV_balkan_thrust: "Балканский натиск"
 SOV_balkan_thrust_desc: "Балканы – самый нестабильный регион Европы. Легче всего будет спровоцировать там коммунистические революции, и это позволит нам укрепить свои позиции в Европе."
  
 SOV_european_upheaval: "Европейские потрясения"
 SOV_european_upheaval_desc: "Условия нашего освобождения Европы от буржуазии к настоящему моменту наконец достигли кульминации. Пролетарии всех стран, соединяйтесь! Вам нечего терять, кроме своих цепей!"
  
 SOV_tankograd: "Танкоград"
 SOV_tankograd_desc: "Челябинск – один из крупнейших городов Приуралья. Нам следует подготовиться к перемещению большинства наших танковых заводов именно в этот регион, где уже есть заводы по производству техники."
 SOV_tankograd_tt: "Добавить максимальный уровень §YИнфраструктуры§!"
  
 SOV_uralvagonzavod: "Уралвагонзавод"
 SOV_uralvagonzavod_desc: "У Уральских танковых заводов есть потенциал стать крупнейшим производителем танков в мире!"
 SOV_uralvagonzavod_tt: "«§YУралВагонЗавод§!» (£funds_texticon  Прирост финансов: §G+50%§!) в течение §Y365 дней§!\nв течение §Y730 дней§!\n"
  
 SOV_over_mobilisation_tt: "Завершение фокусов §Y$SOV_tankograd$§! и §Y$SOV_uralvagonzavod$§! §Gоткроет§! закон §YСверхмобилизованная промышленность§!, который добавится §Gавтоматически§!, если есть §Y150§! £political_power_texticon .\n\n"
  
 SOV_the_ussr_academy_of_sciences: "Академия наук СССР"
  
 SOV_formation_ssr: "Образование новых Советских Социалистических Республик"
  
 SOV_merge_naval_plants_wa_tt: "Открывает решение §YОбъединить заводы§! для военно-морских конструкторов, что позволяет нам объединять разные заводы вместе, чтобы решить проблемы, вызванные быстрой индустриализацией."
 SOV_merge_tank_and_materiel_plants_wa_tt: "Открывает решение §YОбъединить заводы§! для конструкторов танков и техники, что позволяет нам объединять разные заводы вместе, чтобы решить проблемы, вызванные быстрой индустриализацией."
 SOV_merge_aircraft_plants_wa_tt: "Открывает решение §YОбъединить заводы§! для авиаконструкторов, что позволяет нам объединять разные заводы вместе, чтобы решить проблемы, вызванные быстрой индустриализацией."
 SOV_merge_evacuated_plants_wa_tt: "Разблокирует решения §YОбъединить заводы§!, что позволит нам устранить £efficiency_growth_texticon §Yпроблемы с эффективностью производства§!, вызванные быстрой эвакуацией."
  
 SOV_merge_wa_tt: "\n§GОбъединение заводов откроет путь к совершенствованию нашей армии, доведению ее до современных стандартов§!\n"
  
 SOV_national_academy_of_sciences_research_bonus_tt: "Изменяет национальный дух §Y$SOV_ussr_academy_of_sciences_dynamic_modifier$§! на:\nСкорость исследования: §G+0.5%§!"
  
  
 SOV_connection_of_the_interior: "Связь внутренних районов"
 SOV_connection_of_the_interior_desc: "Если мы хотим поддержать развитие тяжелой промышленности, мы должны создать новые технологии, которые позволят нам построить эти огромные сети заводов. Нам нужно больше ресурсов и машин, которые станут основой для масштабного строительства."
 SOV_connection_of_the_interior_tt: "Добавляет §Y1 инфраструктуру§! вокруг крупных советских городов в Восточной Европе. \n"
  
 SOV_gaz_automobile_plants_dd_flag: "Фокус §Y$SOV_gaz_automobile_plants$§! выполнен"
 SOV_gaz_automobile_plants_dd_tt: "В настоящее время: [?SOV_gaz_automobile_plants_dd_flag:days|Y0]"
  
 SOV_connection_of_the_interior_dd_flag: "Фокус §Y$SOV_connection_of_the_interior$§! выполнен"
 SOV_connection_of_the_interior_dd_tt: "В настоящее время: [?SOV_connection_of_the_interior_dd_flag:days|Y0]"
  
 SOV_workers_culture_dd_flag: "Фокус §Y$SOV_workers_culture$§! выполнен"
 SOV_workers_culture_dd_tt: "В настоящее время: [?SOV_workers_culture_dd_flag:days|Y0]"
  
 SOV_start_the_third_five_year_plan_dd_flag: "Фокус §Y$SOV_start_the_third_five_year_plan$§! выполнен"
 SOV_start_the_third_five_year_plan_dd_tt: "В настоящее время: [?SOV_start_the_third_five_year_plan_dd_flag:days|Y0]"
  
 SOV_bread_basket_of_the_soviet_union_dd_flag: "Фокус §Y$SOV_bread_basket_of_the_soviet_union$§! выполнен"
 SOV_bread_basket_of_the_soviet_union_dd_tt: "В настоящее время: [?SOV_bread_basket_of_the_soviet_union_dd_flag:days|Y0]"
  
 SOV_develop_the_heartland_dd_flag: "Фокус §Y$SOV_develop_the_heartland$§! выполнен"
