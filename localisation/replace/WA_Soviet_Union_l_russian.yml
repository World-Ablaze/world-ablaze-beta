 sov_armor.876.t: "Подготовка к Маньчжурской операции"
 sov_armor.876.d: "После окончания войны с Германией и подписания Тегеранского договора мы должны вступить в войну с Японией через 90 дней. Пришло время реализовать наши амбиции на Дальнем Востоке!"
 sov_armor.876.a: "Мы сокрушим Императорскую армию Японии"
 
 sov_armor.877.t: "Маньчжурская операция"
 sov_armor.877.d: "Настало время обрушить Красную Армию на ничего не подозревающих японцев! В случае успеха мы сможем влиять на Китай и Корею после окончания войны"
 sov_armor.877.a: "Ура!"