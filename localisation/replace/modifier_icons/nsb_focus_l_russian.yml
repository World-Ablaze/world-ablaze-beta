l_russian:
 SOV_the_ussr_academy_of_sciences_desc: "Годы усилий по вовлечению народа в высшее образование наконец окупились. Теперь мы можем похвастаться по-настоящему крупным и современным научным учреждением, объединяющим ведущих ученых страны. Однако на этом работа не заканчивается. Есть потенциал для распространения нашей науки среди различных народов Родины."
 SOV_restore_cossack_units_desc: "В час нужды Родина не спрашивает подробностей о том, кто хочет служить, чтобы защищать ее. Любой, кто готов взять в руки оружие против захватчика, приветствуется и будет использован в соответствии со своими способностями."
 SOV_penal_battalions_desc: "В отчаянной обороне Родины мы соберем трусов и предателей в штрафные батальоны и отправим их на передовую. Они заплатят за свои преступления кровью!"
 SOV_revive_the_stakhanovite_movement: "Поощрять стахановское движение"
 SOV_anti_capitalist_policies_desc: "Очевидно, что большинство капиталистических стран, если не все, вполне удовлетворятся тем, чтобы просто направить экспансию фашистов в другую сторону. При наличии выбора буржуазия в конечном счете всегда предпочтет угнетать пролетариат. Поэтому верить ей нельзя, и нужно быть готовыми сами перенести борьбу к ней."
 SOV_secure_leningrad_desc: "Сейчас наша граница с Финляндией находится слишком близко к региону [195.GetName]. Внезапная финская атака может за считанные часы дойти до города. Кроме того, такое положение позволяет очень легко заблокировать наш Балтийский флот. Такое положение дел неприемлемо, и мы должны ясно дать понять это финскому правительству."
 SOV_increase_weekly_paranoia_in_trait_tt: "§Y[ROOT.GetLeader]§!: изменить черту §Y«$stalin_political_paranoia$»§! на \n£SOV_paranoia_text_icon  Еженедельная политическая паранойя: §R+1§!"
