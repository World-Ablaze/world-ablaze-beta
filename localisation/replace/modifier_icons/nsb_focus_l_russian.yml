 SOV_planned_economy_dynamic_modifier_tt: "\nДобавить §Y$SOV_planned_economy_dynamic_modifier$§!, что даст (производительность фабрики: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!, $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!) \nДля каждого государства-марионетки, принявшего политику §Y$new_economic_policy$§!, дает дополнительно: \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§! \n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§! \n(Применяются дополнительные бонусы до макс. значения: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.00%§!, $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-10.00%§!)\n\n"
