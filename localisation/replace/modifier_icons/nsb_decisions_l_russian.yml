 SOV_propaganda_builders_of_communism_effect_tt: "Каждому государству-марионетке Советов дается «§Y$SOV_young_builders_of_communism$§!», они получают: (£research2_texticon  темпы исследований: §G+1.00%§!,£drift_defence_texticon  смена идеологии метрополии: §G+0.25§!) на §Y[?SOV_default_propaganda_campaign_duration]§! д."
 SOV_propaganda_anti_fascism_tt: "Дается §Y$SOV_anti_fascist_campaign_generic$§! против §Yфашистского государства с самым высоким показателем индустриализации в мире§!, что обеспечивает ( £attack_texticon  бонус к атаке против страны: §G+10.0%§!, £defence_texticon  бонус к защите против страны: §G+10.0%§!) на §Y[?SOV_default_propaganda_campaign_duration]§! д."
 SOV_propaganda_anti_capitalism_tt: "Дается §Y$SOV_anti_capitalist_campaign_generic$§! против §Yдемократического государства с самым высоким показателем индустриализации в мире§!, что обеспечивает ( £attack_texticon  бонус к атаке против страны: §G+10.0%§!, £defence_texticon  бонус к защите против страны: §G+10.0%§!) на §Y[?SOV_default_propaganda_campaign_duration]§! д."
 SOV_industry_relocation_trains_tt: "§R[?SOV_industrial_relocation_trains_decision_negative] $train_equipment$§! — будут использоваться, пока действует это решение.\n\nКаждое дополнительное §Yрешение о перемещении§!, принятое одновременно, увеличит время перемещения одной фабрики на §R1 день§!.\nТекущее время на одну фабрику: §Y[?SOV_relocating_days_mission_timeout]§!"
