 IRQ_slow_and_steady: "Медленно и стабильно"
 IRQ_slow_and_steady_desc: "Путь Ирака в современную эпоху будет долгим и трудным. Мы должны идти медленно и уверенно, проводя реформы. Британцы дадут нам независимость, если мы правильно разыграем наши карты."

 IRQ_negotiate_with_the_tribes: "Вести переговоры с племенами"
 IRQ_negotiate_with_the_tribes_desc: "Значительную часть населения Ирака составляют шииты. Их подавление может привести к тяжелым последствиям для долгосрочной стабильности Ирака. Мы должны провести с ними переговоры и посмотреть, сможем ли мы прийти к соглашению."

 IRQ_increase_autonomy: "Увеличить автономию"
 IRQ_increase_autonomy_desc: "Предоставив шиитским племенам больше автономии и религиозных свобод, мы, надеюсь, сможем подавить насилие и вернуть Ирак под контроль."

 IRQ_bridge_the_divide: "Преодолеть раскол"
 IRQ_bridge_the_divide_desc: "Разрыв между суннитами и шиитами слишком велик. Мы должны преодолеть этот разрыв и объединить людей, если хотим добиться мира и процветания в Ираке."

 IRQ_address_the_brain_drain: "Решить проблему утечки мозгов"
 IRQ_address_the_brain_drain_desc: "Самые лучшие и талантливые люди Ирака покидают страну или погибают. Мы должны решить эту проблему и гарантировать, что Ирак сможет удержать своих лучших и талантливых."

 IRQ_lay_the_foundation: "Заложить фундамент"
 IRQ_lay_the_foundation_desc: "Принятие плана развития поможет Ираку догнать остальной мир. Мы должны заложить фундамент для процветания иракского общества."

