 IRQ_shia_revolt: "Шиитское восстание"
 IRQ_shia_revolt_desc: "Шиитское население Ирака восстало против правительства, в котором доминируют сунниты. Требуя религиозной свободы и автономии, они подняли восстание в нескольких городах на юге страны."

 IRQ_military_cult: "Военный культ"
 IRQ_military_cult_desc: "Сильная армия может удержать племена вместе и предотвратить беспорядки внутри нации. Благодаря этому мы можем создать национальную идентичность, которая превзойдет феодализм."

 IRQ_military_cult_2: "Военный культ"
 IRQ_military_cult_2_desc: "Сильная армия может удержать племена вместе и предотвратить беспорядки внутри нации. Благодаря этому мы можем создать национальную идентичность, превосходящую феодализм."

 IRQ_anglo_iraq_treaty: "Англо-иракский договор"
 IRQ_anglo_iraq_treaty_desc: "Англо-иракский договор 1930 года позволил нам вкусить независимость, но он также дал британцам большое влияние на нашу страну. Уступки, сделанные в этом договоре, активно разжигают националистические настроения."
 RULE_ANGLO_IRAQ_TREATY_TT: "§RОпция недоступна из-за англо-иракского договора§!"

 IRQ_political_turmoil: "Политические беспорядки"

 IRQ_unsuitable_coast: "Неподходящее побережье"
 IRQ_unsuitable_coast_desc: "Побережье Ирака относительно плоское и болотистое, что делает его непригодным для строительства крупных верфей."

 IRQ_pilot_school: "Школа пилотов"
 IRQ_pilot_school_desc: "Королевские ВВС Ирака открыли в Багдаде школу пилотов, где лучшие и самые способные из нашей молодежи могут учиться летать."

 IRQ_nationalism: "Национализм"
 IRQ_nationalism_desc: "Иракский народ становится все более националистичным и требует большей автономии от британцев."

 IRQ_militarism: "Милитаризм"
 IRQ_militarism_desc: "Единственный способ добиться настоящей независимости - это военная сила. Иракский народ должен стать милитаристским и готовым сражаться за свою свободу, иначе мы никогда не станем свободными."

 IRQ_policy_of_unity: "Политика единства"
 IRQ_policy_of_unity_desc: "Политика единства - это политика, направленная на преодоление разрыва между суннитским и шиитским населением Ирака. Это было сделано для того, чтобы предотвратить межконфессиональное насилие в будущем и улучшить перспективы единого Ирака."

 IRQ_developement_plan: "План развития"
 IRQ_developement_plan_desc: "Будущее Ирака не может быть найдено в прошлом. Мы должны смотреть в будущее и развивать нашу страну, чтобы она стала современной, промышленно развитой страной, если мы хотим когда-нибудь выбраться из нищеты, в которой мы находились так долго."

