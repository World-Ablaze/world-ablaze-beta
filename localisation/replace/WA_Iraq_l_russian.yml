 IRQ_suppress_the_tribes_mission: "Ведутся военные действия"
 IRQ_suppress_the_tribes_mission_desc: "Мы должны бороться с враждебными племенами, пока они не стали проблемой. Отправим несколько дивизий, чтобы показать нашу силу, и все получится."

