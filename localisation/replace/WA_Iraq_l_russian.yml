l_russian:
 IRQ_invite_specialists: "Пригласить специалистов"
 IRQ_invite_specialists_desc: "Предстоящий путь будет долгим и трудным, но это не значит, что мы должны идти по нему в одиночку. Пригласив специалистов из-за рубежа, мы сможем получить необходимый толчок для развития нашей экономики."

 IRQ_general_mobilization: "Общая мобилизация"
 IRQ_general_mobilization_desc: "Мир в огне, и этот огонь теперь у нашего порога. Каждый мужчина, каждая женщина и каждый ребенок должны выполнить свой долг перед Ираком."

 IRQ_organize_the_armed_forces: "Организовать вооруженные силы"
 IRQ_organize_the_armed_forces_desc: "Вооруженные силы Ирака находятся в плачевном состоянии. Они крайне малочисленны и слабо развиты, и для того, чтобы превратить их в эффективную боевую силу, потребуются огромные усилия."

 IRQ_iraqi_air_force: "Королевские военно-воздушные силы Ирака"
 IRQ_iraqi_air_force_desc: "Королевские военно-воздушные силы Ирака были основаны в апреле 1931 года. До сих пор они находились в плачевном состоянии: не хватало пилотов и обучения. Пришло время это изменить."

 IRQ_build_up_airbases: "Построить авиабазы"
 IRQ_build_up_airbases_desc: "Самые лучшие самолеты ничего не стоят без места для посадки. Построив авиабазы, мы сможем подготовить Ирак к господству в небе."

 IRQ_establish_pilot_schools: "Создать школы пилотов"
 IRQ_establish_pilot_schools_desc: "В Королевских ВВС Ирака ощущается серьезная нехватка пилотов и обучения. Создав школы пилотов, мы сможем гарантировать, что наши пилоты смогут показать себя с лучшей стороны."

 IRQ_aircraft_purchases: "Закупки самолетов"
 IRQ_aircraft_purchases_desc: "Ирак еще недостаточно развит, чтобы разрабатывать собственные самолеты. Закупая иностранные разработки, мы сможем обеспечить наших пилотов достойными самолетами."

 IRQ_home_defence_craft: "Самолёты для обороны страны"
 IRQ_home_defence_craft_desc: "Защита нашей родины и неба имеет первостепенное значение. Чтобы обеспечить ее, нам нужны истребители, способные соперничать с нашими врагами или даже превосходить их."

 IRQ_develop_a_radar_net: "Разработать радарную сеть"
 IRQ_develop_a_radar_net_desc: "Первый шаг к перехвату - это обнаружение. Построив радарную сеть, мы сможем обеспечить ВВС ранним предупреждением о вражеских атаках."

 IRQ_precision_strikes_craft: "Самолёты точечного удара"
 IRQ_precision_strikes_craft_desc: "Обширность пустыни означает, что наши авиаудары должны быть точными. Мы должны разработать бомбардировщики специально для этой цели."

 IRQ_airbase_defences: "Оборона авиабазы"
 IRQ_airbase_defences_desc: "Войны лучше всего вести на чужой территории. Мы должны проводить политику передовой обороны, стремясь перехватить врага до того, как он достигнет нашей родины."
 IRQ_airbase_defences_tt: "Строит §YПротивовоздушную оборону 1 уровня§! и §Yукрепления 2 уровня§! на авиабазе в следующих провинциях:\n§YДохук\nНинава\nБагдад\nДи-Кар§!"

 IRQ_establish_air_doctrine: "Установить воздушную доктрину"
 IRQ_establish_air_doctrine_desc: "Великая война показала силу воздушной мощи, особенно если ее правильно применять. Наши пилоты должны получить доктрину, которой они должны следовать, чтобы обеспечить победу."

 IRQ_iraqi_army: "Королевская иракская армия"
 IRQ_iraqi_army_desc: "Королевская иракская армия - крупнейший вид вооруженных сил. Это не означает, что она способна защитить Ирак. Со временем она может стать чем-то большим."

 IRQ_develop_support_units: "Развивать подразделения поддержки"
 IRQ_develop_support_units_desc: "Природа войны в пустыне означает, что подразделения поддержки жизненно важны. Наши войска должны быть хорошо снабжены и оснащены с тыла."

 IRQ_tank_purchases: "Закупки танков"
 IRQ_tank_purchases_desc: ""

 IRQ_recruit_new_officers: "Набрать новых офицеров"
 IRQ_recruit_new_officers_desc: "Расширение армии потребует больше людей, и поэтому офицерский корпус нуждается в новой крови."

 IRQ_legacy_of_the_great_war: "Наследие Великой войны"
 IRQ_legacy_of_the_great_war_desc: "Ирак был жизненно важным полем боя в Великой войне. Уроки, полученные там, должны быть использованы для реформирования армии."

 IRQ_reform_infantry_tactics: "Реформировать тактику пехоты"
 IRQ_reform_infantry_tactics_desc: "Война изменилась, и наша тактика тоже должна измениться. Эта эпоха делает упор на механизацию и огневую мощь, и мы должны приспособить нашу пехоту к этому."

 IRQ_develop_infantry_weapons: "Разработать оружие пехоты"
 IRQ_develop_infantry_weapons_desc: "Старых винтовок времен Великой войны уже недостаточно. Пришло время разработать новое оружие."

 IRQ_establish_artillery_doctrine: "Создать артиллерийскую доктрину"
 IRQ_establish_artillery_doctrine_desc: "Появление бронетехники и авиации изменило роль артиллерии. Мы должны разработать доктрину, чтобы наша артиллерия использовалась по максимуму."

 IRQ_develop_artillery_weapons: "Разработать артиллерийское вооружение"
 IRQ_develop_artillery_weapons_desc: "Более совершенное артиллерийское оружие может сыграть важную роль в обеспечении боевого превосходства наших войск."

 IRQ_desert_experts: "Специалисты по войне в пустыне"
 IRQ_desert_experts_desc: ""

 IRQ_the_agricultural_and_industrial_bank: "Сельскохозяйственный и промышленный банк"
 IRQ_the_agricultural_and_industrial_bank_desc: ""

 IRQ_new_standard_oil_contracts: "Новые контракты со Standard Oil"
 IRQ_new_standard_oil_contracts_desc: ""

 IRQ_oil_prospecting: "Разведка нефти"
 IRQ_oil_prospecting_desc: "Разведка нефти"

 IRQ_invest_in_rural_centres: "Инвестировать в сельские центры"
 IRQ_invest_in_rural_centres_desc: "Ирак все еще остается преимущественно сельской страной. Инвестиции в сельские центры помогут вывести страну из нищеты и ввести её в современную эпоху."

 IRQ_fuel_refinement: "Переработка топлива"
 IRQ_fuel_refinement_desc: "Самая большая сила иракской экономики - это черное золото. Чем эффективнее мы сможем сделать наши нефтеперерабатывающие заводы, тем больше богатства они принесут экономике."

 IRQ_the_rafidain_bank: "Банк Рафидайн"
 IRQ_the_rafidain_bank_desc: "Наш первый коммерческий банк позволит гражданам брать кредиты, что даст возможность циркулировать большему количеству денег и позволит нашей экономике расти."

 IRQ_urbanization: "Урбанизация"
 IRQ_urbanization_desc: ""

 IRQ_erbil_steel_factory: "Эрбильский сталелитейный завод"
 IRQ_erbil_steel_factory_desc: ""

 IRQ_baghdad_arsenal: "Багдадский арсенал"
 IRQ_baghdad_arsenal_desc: ""

 IRQ_issue_new_contracts: "Выдавать новые контракты"
 IRQ_issue_new_contracts_desc: "Выдача новых контрактов будет стимулировать компании инвестировать в Ирак и увеличивать нашу собственную промышленную базу."

 IRQ_approach_Otto_wolff: "Обратиться к Отто Вольфу"
 IRQ_approach_Otto_wolff_desc: "Отто Вольф - немецкий промышленник, который выразил заинтересованность в инвестициях в Ирак. Мы должны обратиться к нему и узнать, что он может предложить."

 IRQ_protect_local_businesses: "Защищать местные предприятия"
 IRQ_protect_local_businesses_desc: "Условия англо-иракского договора поставили экономику Ирака в шаткое положение. Применяя протекционистскую политику, мы можем помочь нашим местным предприятиям расти и процветать."

 IRQ_begin_industrialization: "Начать индустриализацию"
 IRQ_begin_industrialization_desc: "По меркам остального мира Ирак остается захолустьем. Поощряя индустриализацию, мы можем помочь Ираку догнать остальной мир."

 IRQ_iraqi_state_railways: "Иракские государственные железные дороги"
 IRQ_iraqi_state_railways_desc: ""
 IRQ_iraqi_state_railways_tt: "§YДобавить 30 поездов в запас§!"

 IRQ_the_baghdad_railway: "Багдадская железная дорога"
 IRQ_the_baghdad_railway_desc: ""

 IRQ_invest_in_schools: "Инвестировать в школы"
 IRQ_invest_in_schools_desc: "В Ираке отсутствует надлежащая система образования. Инвестируя в школы, мы можем помочь нашим людям стать более образованными и продуктивными."

 IRQ_promote_innovation: "Поощрять инновации"
 IRQ_promote_innovation_desc: "Ирак занимает шаткое положение в мире. Будущее Ирака может быть обеспечено только за счет инноваций и модернизации."

 IRQ_land_reforms: "Земельные реформы"
 IRQ_land_reforms_desc: "Основная тяжесть Великой депрессии легла на плечи крестьян, которые теперь сталкиваются с большими долгами, которые они не в состоянии выплатить. Сняв с них это бремя, мы надеемся, что наша экономика снова начнет процветать."

 IRQ_camel_warfare: "Война на верблюдах"
 IRQ_camel_warfare_desc: ""
 IRQ_camel_warfare_tt: "Мы получим шаблон §YДивизия Верблюдов§!"

 IRQ_first_mechanized_brigade: "Первая механизированная бригада"
 IRQ_first_mechanized_brigade_desc: "Бронетехника - король поля боя. Пришло время подхватить эту тенденцию и создать собственные бронетанковые войска."
 IRQ_first_mechanized_brigade_tt: "Мы получим шаблон и одну §YБронеавтомобильную дивизию§!"

 IRQ_rustamiyah_combined_arms_branch: "Общевойсковое отделение в Рустамии"
 IRQ_rustamiyah_combined_arms_branch_desc: ""

 IRQ_the_iraqi_armed_forces: "Иракские вооруженные силы"
 IRQ_the_iraqi_armed_forces_desc: ""

 IRQ_iraqi_navy: "Королевский военно-морской флот Ирака"
 IRQ_iraqi_navy_desc: "Королевский флот Ирака является силой только по названию. Из-за географического положения Ирака строительство кораблей в сколько-нибудь серьёзных масштабах невозможно, поэтому потребуются значительные усилия, чтобы собрать военно-морские силы."

 IRQ_expand_basrah: "Расширить Басру"
 IRQ_expand_basrah_desc: "Портовый город Басра - единственная настоящая военно-морская база в Ираке. Хотя он не подходит для строительства доков, он все же может стать жизненно важной военно-морской базой для наших кораблей."

 IRQ_river_dockyards: "Речные доки"
 IRQ_river_dockyards_desc: "Некоторые смелые инженеры предложили идею строительства доков на реках Ирака. Хотя мы сможем построить лишь несколько из них, они должны позволить нам создать символические силы."

 IRQ_form_naval_command: "Сформировать военно-морское командование"
 IRQ_form_naval_command_desc: "Что такое корабль без команды? Что за команда без капитана? Пришло время сформировать военно-морское командование и выстроить для наших кораблей командную вертикаль."

 IRQ_offensive_measures: "Наступательные меры"
 IRQ_offensive_measures_desc: "Наш лучший шанс помешать любому врагу на морях - пресечь его торговлю и войска при его приближении. Подводные лодки - лучший инструмент для этой работы."

 IRQ_underwater_menace: "Подводная угроза"
 IRQ_underwater_menace_desc: "Война несправедлива, и ей не обязательно быть благородной. Наши военнослужащие должны быть готовы сражаться грязно и с гордостью уклоняться от боя."

 IRQ_defensive_measures: "Оборонительные меры"
 IRQ_defensive_measures_desc: "Реалистично говоря, мы не можем надеяться сравниться с врагом на морях. Лучше всего построить несколько кораблей береговой обороны, способных минировать Персидский залив, и надеяться на лучшее."

 IRQ_persian_chokepoint: "Узкое место Персидского залива"
 IRQ_persian_chokepoint_desc: "Узкое место Персидского залива играет важную роль в транспортировке нефти с Ближнего Востока в остальной мир. Заминировав его, мы можем надеяться удержать врагов от нападения и принудить их к миру."

 IRQ_fortify_the_rivers: "Укрепление рек"
 IRQ_fortify_the_rivers_desc: "Кувейт и Басра - наше единственное присутствие в Персидском заливе. Укрепив эти города, мы можем гарантировать, что любому врагу придется дорого заплатить за их захват."
 IRQ_fortify_the_rivers_tt: "Добавит по §Y1 укреплению§! в каждую провинцию за реками Тигр и Евфрат с §Yдополнительными уровнями на победние очки§!.\nДобавить §Yукрепления 3 уровня§! в столицу."

 IRQ_address_the_violence: "Решить проблему насилия"
 IRQ_address_the_violence_desc: "Шиитские восстания наносят тяжелый урон стране. Мы должны справиться с насилием и вернуть страну под контроль."

 IRQ_suppress_the_tribes: "Подавить племена"
 IRQ_suppress_the_tribes_desc: "Племенам ответят сталью и огнём. Мы не потерпим никакого сопротивления и заставим их подчиниться нашей власти."

 IRQ_further_the_divide: "Усугубить раскол"
 IRQ_further_the_divide_desc: "Мы должны обеспечить, чтобы племена держались на поводке. Мы можем использовать шиитов и дальше, чтобы временно улучшить экономику."

 IRQ_force_modernization: "Принудительная модернизация"
 IRQ_force_modernization_desc: "Ирак все еще застрял в прошлом. Мы должны заставить людей бросить свои фермы и работать на заводах."

 IRQ_pack_the_military_with_sunnis: "Наполнить армию суннитами"
 IRQ_pack_the_military_with_sunnis_desc: "Сильная армия необходима для подавления племен, а то, что большинство разделяет одну и ту же веру, поможет предотвратить раскол внутри."

 IRQ_subsidize_military_industry: "Субсидировать военную промышленность"
 IRQ_subsidize_military_industry_desc: "Будущее Ирака будет завоевано силой оружия. Единственный способ обеспечить это - создать военно-промышленную базу Ирака."

 IRQ_rally_around_sidqi: "Сплотиться вокруг Сидки"
 IRQ_rally_around_sidqi_desc: ""

 IRQ_punish_the_coup: "Наказать участников переворота"
 IRQ_punish_the_coup_desc: ""

 bakr_sidqi_assasination_flag: "Бакр Сидки мертв"

 IRQ_consolidate_power: "Консолидировать власть"
 IRQ_consolidate_power_desc: "Ирак не может быть освобожден от иностранных держав без сильного и абсолютного правительства. Правительство должно быть укреплено, а народ приведён к повиновению."

 IRQ_improve_iraqi_society: "Улучшить иракское общество"
 IRQ_improve_iraqi_society_desc: "Поощряя рост и улучшая благосостояние народа, мы можем помочь ему отойти от аграрного образа жизни и искать будущее в наших промышленных центрах."

 IRQ_dreams_of_iraq: "Мечты об Ираке"
 IRQ_dreams_of_iraq_desc: "Разобравшись с внутренними проблемами нашего населения, мы можем теперь сосредоточиться на будущем Ирака. Мир в огне, поэтому мы должны быть очень осторожны в выборе пути."

 IRQ_dreams_of_iraq_flag: "Фокус §YМечты Ирака§! выполнен"
 IRQ_dreams_of_iraq_flag_tt: "В настоящее время: [?IRQ_dreams_of_iraq_flag:days|Y0]"

 IRQ_drastic_measures: "Радикальные меры"
 IRQ_drastic_measures_desc: "Иго британцев должно быть сброшено. Мы должны принять решительные меры, чтобы Ирак стал свободным. К оружию!"

 IRQ_embrace_nationalism: "Принять национализм"
 IRQ_embrace_nationalism_desc: "Каждый человек должен осознать важность свободного и независимого Ирака. Все должны быть готовы сражаться и умереть за это дело, и самое главное - они должны понимать, почему они должны это делать."

 IRQ_seize_military_assests: "Захватить военные активы"
 IRQ_seize_military_assests_desc: "Есть много стран, которые готовы выслушать нас в нашем бедственном положении. Мы можем получить от них иностранное снаряжение и оружие, чтобы помочь нам в нашей борьбе."

 IRQ_seize_power: "Захватить власть"
 IRQ_seize_power_desc: "Время пришло! Британское иго в Ираке будет сброшено. Мы захватим власть и создадим новое правительство Ирака, свободное от оков англо-иракского договора."

 IRQ_the_golden_square: "Золотой квадрат"
 IRQ_the_golden_square_desc: ""

 IRQ_reform_state_law: "Реформировать государственные законы"
 IRQ_reform_state_law_desc: "Теперь, когда мы свободны от иностранного влияния, государство может формировать законы в соответствии с интересами иракских граждан, а не иностранных угнетателей."

 IRQ_the_habbaniya_incident: "Инцидент в Хаббании"
 IRQ_the_habbaniya_incident_desc: "Великобритания уже давно вцепилась зубами в нашу страну, настало время противостоять захватчикам сначала на наших собственных землях."

 IRQ_the_habbaniya_incident_flag: "Фокус §YИнцидент в Хаббании§! выполнен"
 IRQ_the_habbaniya_incident_flag_tt: "В настоящее время: [?IRQ_the_habbaniya_incident_flag:days|Y0]"

 IRQ_middle_eastern_war_plans: "Планы войны на Ближнем Востоке"
 IRQ_middle_eastern_war_plans_desc: "Когда наша территория находится под контролем, настало время вернуть наши законные границы и спланировать будущие наступления."

 IRQ_restore_assyrian_empire: "Восстановить Ассирийскую империю"
 IRQ_restore_assyrian_empire_desc: ""
 restore_assyrian_empire_category_tt: "Разблокирует решения §YВосстановление Ассирийской империи§!"

 IRQ_invade_syria: "Вторгнуться в Сирию"
 IRQ_invade_syria_desc: ""

 IRQ_invade_turkey: "Вторгнуться в Турцию"
 IRQ_invade_turkey_desc: ""

 IRQ_invade_egypt: "Захватить Египет"
 IRQ_invade_egypt_desc: ""

