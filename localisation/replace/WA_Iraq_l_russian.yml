 ghazi_i: "Гази I"
 abd_al_illah: "Регент, Абд аль-Иллах"
 IRQ_iraqi_zeal: "Иракское рвение"
 IRQ_royal_staff_committee: "Королевский штабной комитет"
 
 
  
 
 irq_armor.801.t: "Государство Ирак"
 irq_armor.801.d: "Шииты восстали на юге страны. Они составляют значительную часть населения, и поэтому любые наши действия окажут большое влияние на будущее Ирака. Подавление восстания еще больше укрепит наш контроль, в то время как переговоры могут обеспечить более долгосрочное решение."
 irq_armor.801.a: "Мы должны тщательно выбирать наши действия"

 irq_armor.802.t: "Восстание подавлено!"
 irq_armor.802.d: "Восстание шиитов было подавлено силой оружия. В столкновениях погибло более 90 солдат и 100 повстанцев, ситуация стабилизировалась. Иностранные державы осудили наши действия, но мы показали, что не потерпим мятежа."
 irq_armor.802.a: "Наше правление будет абсолютным!"

 irq_armor.803.t: "Религиозная терпимость"
 irq_armor.803.d: "Шииты составляют значительную часть нашего населения и требуют религиозных свобод и представительства в правительстве. Предоставив эти права, мы расстроим суннитов, но это также предотвратит дальнейшие восстания и позволит нам сосредоточиться на более насущных делах."
 irq_armor.803.a: "Предоставить им права"
 irq_armor.803.b: "Принудить к компромиссу"

 irq_armor.804.t: "Монархия свергнута!"
 irq_armor.804.d: "«Золотой квадрат» рассматривает монархию как препятствие для развития дипломатических связей с Италией и Германией. Если мы хотим достичь наших целей, то нам понадобится помощь основных союзников"
 irq_armor.804.a: "Мы обеспечим победу"

 irq_armor.805.t: "Вернуть наш суверенитет"
 irq_armor.805.d: "Мы слишком долго позволяли британцам диктовать нам условия! Пришло время освободиться и построить новое будущее!"
 irq_armor.805.a: "К войне!"

 irq_armor.806.t: "Внезапный переворот!"
 irq_armor.806.d: "Пока большая часть армии, верной нынешнему правительству, была занята обучением, молодой генерал по имени Бакар Сидки попытался захватить власть, двинув на Багдад несколько дивизий. Поскольку жизни короля угрожала опасность, правительство ушло в отставку, а Хикмату Сулейману было приказано сформировать новое правительство."
 irq_armor.806.a: "Неожиданный поворот событий"

 irq_armor.807.t: "Джамиль аль-Мидфаи отстранен от власти"
 irq_armor.807.d: "Ас-Саббаг под влиянием Нури ас-Саида начал переворот против премьер-министра"
 irq_armor.807.a: "Неожиданный поворот событий"

 irq_armor.809.t: "Смерть генерала Сидки"
 irq_armor.809.d: "Так и не простив Сидки за его убийство бывшего премьер-министра Джафара аль-Аскари, группа его бывших сторонников объединилась для организации покушения. В результате генерал Сидки был застрелен на улице сегодня утром."
 irq_armor.809.a: "Живи мечом, умри мечом"

 irq_armor.810.t: "Смерть Гази I"
 irq_armor.810.d: "Согласно официальным источникам, наш любимый король, находясь за рулем спортивного автомобиля, был вытеснен с дороги и погиб на месте в результате столкновения. Неофициально многие люди считают, что Нури ас-Саид убил короля, чтобы получить влияние на нынешнего короля Фейсала II."
 irq_armor.810.a: "Ужасный поворот событий"

 irq_armor.811.t: "[ENG.GetName] задействует англо-иракский договор"
 irq_armor.811.d: "Правительство Великобритании вводит в действие англо-иракский договор, чтобы превратить нас в плацдарм для военных операций на Ближнем Востоке"
 irq_armor.811.a: "Наш народ не примет этого!"
 irq_armor.811.b: "Мы не в состоянии противостоять"

 irq_armor.812.t: "[IRQ.GetName] отклоняет договор"
 irq_armor.812.d: ""
 irq_armor.812.a: "Тогда нам придется применить силу"

 irq_armor.813.t: "[IRQ.GetName] принимает свой новый статус"
 irq_armor.813.d: ""
 irq_armor.813.a: "Очень хорошо"

 irq_armor.814.t: "Мечты об Ираке"
 irq_armor.814.d: "Границы Ирака были продиктованы нам иностранцами и были предназначены для того, чтобы разделить мусульманское население и забрать наши ресурсы. Теперь, получив независимость, мы должны попытаться исправить эту несправедливость любыми средствами."
 irq_armor.814.a: "Нас ждет долгий путь"
 
