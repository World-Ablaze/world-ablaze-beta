  tech_battlefield_medicine_1: "Базовая медицины"
  tech_battlefield_medicine_1_desc: "Мы должны объединить медицинский персонал с инженерными подразделениями. Они смогут распределять пенициллин при ранениях, что значительно снизит вероятность заражения, значительно повысит шансы на выживание."
  tech_battlefield_medicine_2: "Улучшенная медицина"
  tech_battlefield_medicine_2_desc: "Теперь у медиков есть регулярный запас инъекций морфина. Это поможет справиться с болью, пока мы доставляем раненых в полевые госпитали."
  tech_battlefield_medicine_3: "Передовая медицина"
  tech_battlefield_medicine_3_desc: "Благодаря достижениям в области переливания крови медики теперь могут носить с собой пакеты с кровью, что крайне важно для тяжелораненых и находящихся под огнем."

