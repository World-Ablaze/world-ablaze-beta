 ten_year_rule: "Десятилетнее правило"
 ten_year_rule_desc: "Британская империя не предвидит, что мы вступим в войну, по крайней мере, до 1942 года. По этой причине мы подчинили нашу экономику нуждам народа."
  
 royal_twenty_centres: "Королевские двадцать центров"
 royal_twenty_centres_desc: "Великая депрессия привела к массовой безработице. Чтобы вернуть население к работе, мы создали трудовые лагеря с минимальной оплатой в обмен на труд. Однако нас жестко критиковали за плохие условия труда и оплату."
  
 royal_twenty_centres2: "Королевские двадцать центров"
 royal_twenty_centres2_desc: "Великая депрессия привела к массовой безработице. Чтобы вернуть население к работе, мы создали трудовые лагеря с минимальной оплатой в обмен на труд. Однако нас жестко критиковали за плохие условия труда и оплату."
  
 CAN_general_Staff: "Канадский генеральный штаб"
  
 CAN_peace_keeping_force: "Силы по поддержанию мира"
 CAN_peace_keeping_force_tt: "§RЗакон о призыве на военную службу не может быть увеличен§!\nКанадские вооруженные силы по сути разоружены, и то, что можно назвать вооруженными силами, предназначено не для боевых действий на передовой, а для местной безопасности и поддержки гражданского правопорядка."
  
 CAN_reciprocal_trade_agreement_treaty: "Взаимное торговое соглашение с США"

 CAN_conscription_crisis_desc: "Канада, которую все еще преследует призывной кризис 1917 года, в основном избегает призыва из провинции Квебек, пока не будут проведены серьезные переговоры, чтобы заручиться полной поддержкой региона."
  
