 can_armor.801.t: "Огденсбургское соглашение"
 can_armor.801.d: "С Канадой было взято обязательство, в котором мы заявили о нашей полной поддержке в случае, если их территория окажется под угрозой. Эта угроза осуществилась, и нам нужно решить, будем ли мы соблюдать это соглашение."
 can_armor.801.a: "Мы не можем допустить захватчиков на американской земле!"
 can_armor.801.b: "Пока нас никто не беспокоит, пусть колеса войны вращаются."
  
 can_armor.802.t: "[From.GetName] просит канадские территории"
 can_armor.802.d: "Издавна выражая желание «репатриировать» колониальные территории Лабрадора и Ньюфаундленда в состав своей страны, [From.GetNameDef] попросил, чтобы Лабрадор и Ньюфаундленд провели голосование об объединении с Канадой.\n[From.GetLeader] ясно дал понять, что [From.GetNameDef] считает их [From.GetAdjective]ой землей и что им должна быть предоставлена возможность объединиться с Канадой."
 can_armor.802.a: "Пусть демократический процесс идет"
 can_armor.802.b: "Британскую империю невозможно расколоть"
  
 can_armor.803.t: "Судьба сбылась"
 can_armor.803.d: "С уступкой [From.GetAdjective]ого Лабрадора и Ньюфаундленда [Root.GetNameDef] наконец-то обрела целостность. Поистине, от моря до моря, каждый настоящий канадец теперь находится в наших границах, где ему и место.\nНашим следующим шагом должно быть обеспечение безопасности и защищенности [Root.GetAdjective]ого государства!"
 can_armor.803.a: "Береговая линия – единственная безопасная граница!"
  
 can_armor.804.t: "Имперское высокомерие"
 can_armor.804.d: "Ссылаясь на свое разрушающееся «имперское право» и призывая к защите статуса Лабрадора и Ньюфаундленда как колониальных владений, [From.GetNameDef] отказывается уступить землю, которая по праву принадлежит нам! Эти люди - канадцы, а в Ньюфаундленде и Лабрадоре находятся [Root.GetAdjective]ие ресурсы, но они должны подчиняться [From.GetAdjective]им хозяевам.\nЭто неприемлемое положение дел, но ясно, что [From.GetNameDef] нельзя склонить к дипломатическому решению..."
 can_armor.804.a: "Мы найдем другие средства"
  
 can_armor.805.t: "[From.GetName] просит о взаимном торговом соглашении"
 can_armor.805.d: "Экономика Канады переплетена с нашей, и мы в значительной степени являемся их крупнейшим экспортным рынком. Поэтому их правительство предлагает снизить тарифы между нашими двумя странами для увеличения торговли. Однако снижение тарифов будет означать, что канадские товары станут дешевле, и это может повлиять на местную экономику..."
 can_armor.805.a: "Это сулит большую выгоду"
 can_armor.805.b: "Это плохо для американского бизнеса"
  
 can_armor.806.t: "[From.GetName] принимает взаимное торговое соглашение"
 can_armor.806.d: ""
 can_armor.806.a: "Отлично"
  
 can_armor.807.t: "[From.GetName] отклоняет взаимное торговое соглашение"
 can_armor.807.d: ""
 can_armor.807.a: "Досадно"
  
 can_armor.808.t: "Отчет Роуэлла Сируа"
 can_armor.808.d: "Канадская королевская комиссия, созданная три года назад, наконец-то завершила свою работу. У комиссии есть много рекомендаций, предлагающих федеральному правительству взять на себя контроль над страхованием по безработице и пенсиями. Она также рекомендует ввести выравнивающие выплаты и ежегодные крупные денежные переводы от федерального правительства провинциям.\nСледуя ее советам, мы можем надеяться на значительное сокращение расходов, не влияя при этом на повседневную жизнь канадцев."
 can_armor.808.a: "Потрясающая работа, дамы и господа"
  
 can_armor.809.t: "Поиски спонсора для алюминиевой компании"
 can_armor.809.d: "Наш проект по резкому увеличению производства алюминия"
 can_armor.809.a: "Спросить у [USA.GetNameDefCap]"
 can_armor.809.b: "Спросить у [ENG.GetNameDefCap]"
 can_armor.809.c: "Мы профинансируем это сами!"
  
 can_armor.810.t: "[CAN.GetName] просит о спонсорстве для своей алюминиевой компании"
 can_armor.810.d: ""
 can_armor.810.a: "Мы будем финансировать их"
 can_armor.810.b: "Пусть платит кто-нибудь другой"
  
 can_armor.811.t: "[FROM.GetName] соглашается спонсировать алюминиевую компанию"
 can_armor.811.d: ""
 can_armor.811.a: "Пора заполонить небо самолетами"
  
 can_armor.812.t: "[FROM.GetName] отказывается спонсировать алюминиевую компанию"
 can_armor.812.d: ""
 can_armor.812.a: "Спросить [USA.GetNameDefCap]"
 can_armor.812.b: "Спросить [ENG.GetNameDefCap]"
 can_armor.812.c: "Мы профинансируем это сами"
  
 can_armor.813.t: "[CAN.GetName] участвует в наших ядерных разработках"
 can_armor.813.d: "[CAN.GetName] собрала местных ученых и ученых-беженцев в Монреальской лаборатории, чтобы они помогали в продвижении наших ядерных проектов. Эта лаборатория станет отличной вспомогательной площадкой для экспериментальных проектов реакторов."
 can_armor.813.a: "Большой успех!"
 