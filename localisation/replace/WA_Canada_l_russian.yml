 CAN_royal_canadian_army_headquarters: "Штаб Королевской канадской армии"
  
 CAN_great_depression_1_desc: "Несмотря на то, что Великая депрессия стала явлением мирового масштаба, она началась с краха фондового рынка в Соединенных Штатах и привела к резкому росту уровня безработицы и резкому падению налоговых поступлений. Канадскому народу и его правительству и без того есть о чем беспокоиться, чтобы еще ввязываться в новую войну."
 CAN_great_depression_2_desc: "Несмотря на то, что Великая депрессия стала явлением мирового масштаба, она началась с краха фондового рынка в Соединенных Штатах и привела к резкому росту уровня безработицы и резкому падению налоговых поступлений. Канадскому народу и его правительству и без того есть о чем беспокоиться, чтобы еще ввязываться в новую войну."
  
