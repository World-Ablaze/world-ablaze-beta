 saf_armor.801.t: "Южная Африка вступает в войну!"
 saf_armor.801.d: "Объединенная партия отказывается принять нейтральную позицию Герцога во Второй мировой войне, и было проведено экстренное голосование, на котором большинство высказалось за его смещение и замену Яном Смэтсом. Однако между говорящими на английском и африкаанс в Южной Африке все еще существует глубокий раскол, и будет трудно вовлечь большую часть населения в военные усилия."
 saf_armor.801.a: "Мы победим!"
  
 saf_armor.802.t: "[From.GetName] готовит вторжение на Мадагаскар"
 saf_armor.802.d: ""
 saf_armor.802.a: "Мы не в состоянии остановить их"
 saf_armor.802.b: "Мы по-прежнему намерены его защищать"
 saf_armor.802.c: "Мы не в состоянии остановить их"
 saf_armor.802.e: "Мы по-прежнему намерены его защищать"
  
 saf_armor.803.t: "[From.GetName] готовится к обороне Мадагаскара"
 saf_armor.803.d: ""
 saf_armor.803.a: "Мы продолжим, как и планировали"
 saf_armor.803.b: "Это слишком рискованно, отступаем"
  
 saf_armor.804.t: "Возвышение Оссевабрандвага"
 saf_armor.804.d: "Прогерманские африканеры в Южной Африке создали «Оссевабрандваг» во главе с Йоханнесом ван Ренсбургом. Они поддерживают идею Volkseenheid (единства народа) и выступают против участия в войне с Германией, если она произойдет. Если мы ничего не предпримем, они могут прибегнуть к насилию, чтобы добиться желаемого."
 saf_armor.804.a: "Мы должны следить за ними"
  
 saf_armor.805.t: "«Штормьяерс» устраивают диверсии!"
 saf_armor.805.d: "После того, как Южно-Африканский союз вместе со всем Содружеством вступил во Вторую мировую войну, «Штормьяерс» в знак протеста начали саботировать гражданскую инфраструктуру. Большинство африканеров выступают против диверсий и протестуют против этих действий, однако Оссевабрандваг одобряет эти действия."
 saf_armor.805.a: "Мы должны действовать быстро!"
  
 saf_armor.806.t: "Падение Оссевабрандвага"
 saf_armor.806.d: "После диверсий правительство начинает действовать и обрушивается на «Оссевабрандваг». Тысячи его членов помещены в лагеря для интернированных, чтобы не допустить саботажа гражданской инфраструктуры. После многих лет сопротивления ОБ наконец поставлен на место."
 saf_armor.806.a: "Наконец-то все закончилось, слава богу!"