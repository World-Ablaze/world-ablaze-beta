 USA_bf2c_airframe: "Curtiss BF2C `Hawk III`"
 USA_bf2c_airframe_short: "BF2C `Hawk III`"
 USA_bf2c_airframe_desc: "Первоначально разработанный для ВМС как истребитель-носитель с убирающимся шасси, Goshawk прослужил всего несколько месяцев в 1934 году, прежде чем был снят с вооружения из-за проблем с весом и шасси. Тем не менее, как обычный сухопутный биплан, он зарекомендовал себя как надежный многоцелевой истребитель-бомбардировщик, особенно подходящий для экспорта.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
