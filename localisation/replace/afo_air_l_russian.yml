 ENG_warwick_airframe_short: "Warwick Mk II"
 ENG_warwick_airframe_desc: "\n§YЭто сохранит 90% эффективности предыдущей модели.§!"
  
 ENG_vulcan_airframe: "Avro Vulcan"
 ENG_vulcan_airframe_short: "Vulcan B.1"
 ENG_vulcan_airframe_desc: "Из трех бомбардировщиков V, Vulcan считается самым технически совершенным, оснащенным полным набором электроники. 4 массивных турбореактивных двигателя Bristol Olympus 101 обеспечивают мощность для перевозки огромного груза весом 21000 фунтов на действительно хорошую дальность 4000 км.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_canberra_airframe: "English Electric Canberra B.2"
 ENG_canberra_airframe_short: "Canberra B.2"
 ENG_canberra_airframe_desc: "Реактивный средний бомбардировщик, разработанный для замены предыдущих быстрых бомбардировщиков. Благодаря большим бомбоотсекам и усиленным пилонам крыльев Canberra является на удивление эффективным бомбардировщиком. Его можно превратить в бомбардировщик-перехватчик, пожертвовав половиной бомбоотсека для установки 4-х пушек Hispano.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_heyford_airframe: "Handley Page H.P.50 Heyford"
 ENG_heyford_airframe_short: "Heyford Mk III"
 ENG_heyford_airframe_desc: "Handley Page Heyford — двухмоторный биплан `тяжелый` бомбардировщик. Разработанный изначально как ночной бомбардировщик, он страдает от недостатка скорости, дальности и выживаемости, чтобы быть полезным за пределами учебных задач.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_hampden_airframe: "Handley Page H.P.52 Hampden"
 ENG_hampden_airframe_short: "Hampden Mk I"
 ENG_hampden_airframe_desc: "Handley Page Hampden — двухмоторный одноплановый бомбардировщик. Он способен нести приличную полезную нагрузку в 4000 фунтов на значительное расстояние. Будучи довольно легким для бомбардировщика своего размера, он довольно быстр и маневрен, что делает его пригодным для ночных бомбардировок.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 ENG_stirling_airframe: "Short Stirling"
 ENG_stirling_airframe_short: "Stirling B Mk I"
 ENG_stirling_airframe_desc: "Short Stirling — первый из четырехмоторных тяжелых бомбардировщиков. Хотя на бумаге он способен достигать хорошей дальности полета, максимальная полезная нагрузка значительно ее сокращает. Медленный и уязвимый для перехвата, он все же оснащен приличной броней и вооружением для самозащиты.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_whitley_airframe: "A.W. Whitley Mk V"
 ENG_whitley_airframe_short: "Whitley Mk V"
 ENG_whitley_airframe_desc: "Представленный как тяжелый ночной бомбардировщик, Armstrong-Whitworth Whitley способен надежно доставлять большую полезную нагрузку благодаря мощности двигателей Rolls-Royce Merlin. He страдает от отсутствия защиты и ограниченной дальности полета, последнее из которых в некоторой степени компенсируется заменой части пространства в бомбоотсеке дополнительными топливными баками.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_manchester_airframe: "Avro Manchester"
 ENG_manchester_airframe_short: "Manchester B Mk I"
 ENG_manchester_airframe_desc: "Avro Manchester — двухмоторный тяжелый бомбардировщик, призванный заменить самолеты Whitleys, Hampdens и Wellingtons. Оснащенный двумя большими, но довольно ненадежными двигателями Rolls-Royce Vulture, он тем не менее способен нести гораздо большую нагрузку, чем предыдущие бомбардировщики.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_halifax_airframe: "Handley Page H.P.59 Halifax"
 ENG_halifax_airframe_short: "Halifax B Mk II"
 ENG_halifax_airframe_desc: "Первоначально задуманный как резервный вариант для Avro Manchester, проект Handley Page в конечном итоге был изменен на четырехмоторный. Оснащенный надежным рядным двигателем Merlin XX, Halifax может нести впечатляющую полезную нагрузку, хотя и на ограниченные расстояния. Важнейшая защита также значительно улучшена по сравнению с предыдущими бомбардировщиками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_halifax_iii_airframe: "Handley Page H.P.61 Halifax"
 ENG_halifax_iii_airframe_short: "Halifax B Mk III"
 ENG_halifax_iii_airframe_desc: "Mk III заменяет двигатели Merlin на более мощные радиальные двигатели Bristol Hercules, что позволяет ему перевозить тот же груз на более дальние расстояния. Защита усиливается за счет четырехствольной башенки вместо двухствольной и противоосколочных жилетов для экипажа. Эффективность повышается за счет использования радионавигационных средств.\n§YЭто позволит сохранить эффективность на уровне 95%, но не даст возможности конвертировать данные из предыдущей модели.§!"
 
 ENG_victor_airframe: "Handley Page H.P.80 Victor"
 ENG_victor_airframe_short: "Victor B.1"
 ENG_victor_airframe_desc: "Являясь частью программы V Bomber, Victor является самым большим и тяжелым из трех бомбардировщиков. Оснащенный четырьмя массивными, потребляющими много топлива турбореактивными двигателями Armstrong Siddeley Sapphire ASSa.7, он может нести огромную полезную нагрузку весом 35 000 фунтов при уменьшенной дальности полета. Несмотря на отсутствие оборонительного вооружения и брони, Victor оснащен полным набором новейших прицельных, навигационных и радиолокационных приборов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_lancaster_airframe: "Avro Lancaster"
 ENG_lancaster_airframe_short: "Lancaster B Mk I"
 ENG_lancaster_airframe_desc: "Ланкастер был создан на основе резервного проекта для ненадежного и ограниченного Манчестера; 4 двигателя Rolls-Royce Merlin заменили предыдущие два двигателя Vulture, обеспечив лучшую тягу и скорость, а в сочетании с длинным бомбовым отсеком без препятствий он может нести самые большие полезные нагрузки на значительное расстояние, которое можно еще увеличить, заменив часть бомб топливом. Хотя оборонительное вооружение в виде старых пулеметов калибра .303 имеет ограниченную эффективность, усиленная броня и защита экипажа делают Ланкастер трудноразрушимым.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 eng_heavy_strategic_bomber_ad_tech_3: "Пакет модернизации Lancaster B Mk I (поздний)"
 eng_heavy_strategic_bomber_ad_tech_3_desc: "Модернизированные двигатели Merlin 24 обеспечивают лучшую производительность, позволяя бомбардировщикам перевозить те же грузы на более большие расстояния.\nРадионавигация обеспечивает повышенную точность при поиске целей для бомбардировки. Обычно ее можно установить вместо некоторых внутренних оборонительных установок.\nНовые башенки с тяжелым пулеметом Browning калибра .50 M2 обеспечивают столь необходимое усиление огневой мощи по сравнению с устаревшими пулеметами Vickers и Browning калибра .303."
  
 ENG_lincoln_airframe: "Avro Lincoln"
 ENG_lincoln_airframe_short: "Lincoln B Mk II"
 ENG_lincoln_airframe_desc: "Развитие базовой конструкции Lancaster, Lincoln больше, может летать выше и дальше. Его размер позволяет нести лучшее оборонительное вооружение, оснащая .50 M2 Browning и 20-мм пушками Hispano. Улучшения почти во всех областях идут в ногу с высокой стоимостью производства.\n§YЭто сохранит 90% эффективности от $ENG_lancaster_airframe$.§!"
  
 ENG_windsor_airframe: "Vickers Windsor"
 ENG_windsor_airframe_short: "Windsor B Mk II"
 ENG_windsor_airframe_desc: "Новая разработка Vickers для выполнения спецификаций для тяжелого бомбардировщика большой высоты с герметичным отсеком экипажа. Знаменитая геодезическая структура Vickers означает, что есть больше внутреннего пространства для топлива, что отражается в значительно увеличенной дальности. Оборонительное вооружение перемещено в дистанционно управляемые барбеты на крыльях.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_valiant_airframe: "Vickers Valiant"
 ENG_valiant_airframe_short: "Valiant B.1"
 ENG_valiant_airframe_desc: "Первая из бомб V. Valiant является довольно технически продвинутой. 4 турбореактивных двигателя Rolls-Royce Avon обеспечивают Valiant достаточную тягу, чтобы она могла перевозить огромную полезную нагрузку на большие расстояния.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_bristol_fighter_airframe: "Bristol F.2B Fighter"
 ENG_bristol_fighter_airframe_short: "F.2B Fighter"
 ENG_bristol_fighter_airframe_desc: "Реликвия Великой войны, `Brisfit` или `Biff` оказался маневренным самолетом, способным постоять за себя. He был принят в качестве стандартного армейского разведывательного и кооперативного самолета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 eng_scout_plane_ad_tech_1: "Истребитель Bristol F.2B"
  
 ENG_botha_airframe: "Blackburn Botha"
 ENG_botha_airframe_short: "Botha Mk I"
 ENG_botha_airframe_desc: "`Bot` — дальний разведчик и торпедоносец. У Botha большой внутренний отсек, который можно использовать для бомб, торпеды или дополнительного топлива для специальных разведывательных миссий. He страдает от недостаточно мощного двигателя и посредственных характеристик.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_mosquito_pr_mki_airframe: "De Havilland Mosquito PR Mk I"
 ENG_mosquito_pr_mki_airframe_short: "Mosquito PR Mk I"
 ENG_mosquito_pr_mki_airframe_desc: "Mosquito PR (Фотографическая разведка) — это ответ на новые требования к невооруженному скоростному, высотному, дальнему разведывательному самолету. PR снимает все пушки и бомбы, которые типичны для истребителя или бомбардировщика Mosquito, и вместо этого заполняет пространство камерами и топливом, где это возможно, что дает ему впечатляющую дальность полета на уровне, если не лучше, чем у более крупных 4-моторных бомбардировщиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
  
