 eng_fighter_multirole_equipment_1: "Hurricane Mk I"
 eng_fighter_multirole_equipment_1_short: "Hurricane Mk I"
 eng_fighter_multirole_equipment_1_desc: "Первый в длинной и высоко оцененной линейке истребителей с двигателем Merlin, Mk I Hurricane может похвастаться превосходной маневренностью, прочностью и приличной огневой мощью. В сочетании с его ограниченными, но полезными возможностями атаки наземных целей, Mk I является грозным многоцелевым самолетом.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_fighter_multirole_equipment_2: "Hurricane Mk IIB"
 eng_fighter_multirole_equipment_2_short: "Hurricane Mk II"
 eng_fighter_multirole_equipment_2_desc: "По сравнению с Mk I, Mk II использует усовершенствованную цельнометаллическую обшивку в сочетании с двигателем Merlin XX. Это позволяет нести еще 4 пулемета в крыльях или альтернативно 20-мм пушки Hispano.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_fighter_multirole_equipment_3: "Typhoon Mk I"
 eng_fighter_multirole_equipment_3_short: "Typhoon Mk I"
 eng_fighter_multirole_equipment_3_desc: "Благодаря мощному двигателю Napier Sabre, превосходное соотношение мощности и веса позволяет Typhoon перевозить очень большую полезную нагрузку, практически превосходя конкурентов по маневренности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 eng_fighter_multirole_equipment_4: "Typhoon Mk II"
 eng_fighter_multirole_equipment_4_short: "Typhoon Mk II"
 eng_fighter_multirole_equipment_4_desc: "Еще одно повышение маневренности и наземной атаки сохраняет Typhoon, теперь в облике Mk II, как очень мощный самолет.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_fighter_multirole_equipment_5: "Tempest"
 eng_fighter_multirole_equipment_5_short: "Tempest"
 eng_fighter_multirole_equipment_5_desc: "Увеличение мощности двигателя Napier Sabre до еще больших показателей обеспечивает Tempest практически непревзойденные возможности как универсального самолета с высокой маневренностью и сильными характеристиками атаки наземных целей в сочетании с высокой надежностью.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_fighter_equipment_1: "Gauntlet"
 eng_fighter_equipment_1_short: "Gauntlet"
 eng_fighter_equipment_1_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 eng_fighter_equipment_2: "Gladiator"
 eng_fighter_equipment_2_short: "Gladiator"
 eng_fighter_equipment_2_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 eng_fighter_equipment_3: "Spitfire Mk I"
 eng_fighter_equipment_3_short: "Spitfire Mk I"
 eng_fighter_equipment_3_desc: "Первый в легендарной линейке истребителей, MkI Spitfire оснащен ранней версией двигателя Rolls-Royce Merlin, мощного, легкого и надежного двигателя, который сам по себе стал легендой. MkI Spitfire сочетает в себе почти непревзойденную маневренность и надежность с достойной атакой, единственным недостатком которого является его относительно высокая стоимость производства. \n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
 eng_fighter_3: "Spitfire Мк I"
  
 eng_fighter_equipment_4: "Spitfire Mk V"
 eng_fighter_equipment_4_short: "Spitfire Mk V"
 eng_fighter_equipment_4_desc: "Перспективы Spitfire, показанные в MkI, получили дальнейшее развитие в MkV. Улучшая превосходную маневренность своего предшественника, MkV Spitfire также получает небольшое увеличение дальности, помогая Spitfire стать более универсальным в слаборазвитых театрах военных действий.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 eng_fighter_4: "Spitfire Мк V"
  
 eng_fighter_equipment_5: "Spitfire Mk IX"
 eng_fighter_equipment_5_short: "Spitfire Mk IX"
 eng_fighter_equipment_5_desc: "С дальнейшим развитием Spitfire по-прежнему способен превзойти практически любого противника, оставаясь при этом прочным и надежным. Здоровое увеличение огневой мощи также позволяет Spitfire оставаться на уровне с конкурентами.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_fighter_equipment_6: "Spitfire Mk XIV"
 eng_fighter_equipment_6_short: "Spitfire Mk XIV"
 eng_fighter_equipment_6_desc: "С Mk XIV почтенный двигатель Merlin достигает своих пределов, теперь производя более 1700 л. с. и давая Spitfire невероятное соотношение мощности к весу. Теперь вооруженный исключительно 20-мм пушками, Mk XIV также наносит удар, которого должен ожидать любой противник в воздушном бою.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_fighter_equipment_7: "Spiteful Mk XVI"
 eng_fighter_equipment_7_short: "Spiteful Mk XVI"
 eng_fighter_equipment_7_desc: "Переделав Merlin в еще более мощный Griffon, Rolls-Royce производит двигатель, способный разогнать Spitfire до скоростей, почти соперничающих с ранними реактивными самолетами. Spiteful также становится настоящим истребителем дальнего действия с дальностью полета около 1500 км. Последняя разработка линейки Spitfire, Spiteful — это подходящая лебединая песня.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_jet_fighter_equipment_1: "Meteor F1"
 eng_jet_fighter_equipment_1_short: "Meteor F1"
 eng_jet_fighter_equipment_1_desc: "Великобритания входит в реактивную эру с изяществом в форме Gloster Meteor. Размещение 4 проверенных и надежных пушек Hispano 20 мм в носовой части дает Meteor грозное вооружение, в то время как удивительная надежность реактивных двигателей Rolls-Royce Welland легко делает Meteor самым надежным из первых реактивных истребителей, омраченным только его высокой стоимостью производства.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
 eng_jet_fighter_1: "Meteor F1"
  
 eng_jet_fighter_equipment_2: "Meteor F8"
 eng_jet_fighter_equipment_2_short: "Meteor F8"
 eng_jet_fighter_equipment_2_desc: "F8 Meteor, превосходящий своего предшественника по дальности и маневренности, является одним из лучших истребителей своего времени, не имеющим недостатков ни в одном из компонентов.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 eng_jet_fighter_equipment_3: "Hunter F1"
 eng_jet_fighter_equipment_3_short: "Hunter F1"
 eng_jet_fighter_equipment_3_desc: "Почти вдвое превышая дальность полета F8 Meteor, Hawker Hunter F1 способен поддерживать бомбардировщики и с легкостью достигать превосходства в воздухе с огромных расстояний благодаря поразительной маневренности и грозному вооружению в виде четырех 30-мм пушек ADEN. В качестве универсального пакета немногие самолеты могут соперничать с Hunter.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
