 JAP_ki_10_airframe: "Kawasaki Ki-10-I `Kyū-Go Sen`"
 JAP_ki_10_airframe_short: "Ki-10-I `Kyū-Go Sen`"
 JAP_ki_10_airframe_desc: "Perry был представлен в 1935 году и обладает чертами, типичными для большинства японских самолетов. Акцент на акробатических способностях вместо брони или вооружения означает, что он уже почти устарел по сравнению с более новыми конструкциями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_ad_tech_equipment_2: "Nakajima Ki-27 Ko"
 jap_fighter_ad_tech_equipment_2_short: "Ki-27"
 jap_fighter_ad_tech_equipment_2_desc: "По-прежнему имеющий неубирающееся шасси из-за проблем в конструкции, относительно продвинутый в остальном моноплан Nate был выбран за его высокие акробатические возможности вместо его конкурентов, которые имели лучшее вооружение и максимальную скорость.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_ki_44_i_airframe: "Nakajima Ki-44-I `Shōki`"
 JAP_ki_44_i_airframe_short: "Ki-44-I `Shōki`"
 JAP_ki_44_i_airframe_desc: "Shōki  — грозный истребитель, разработанный как перехватчик. С упором на скорость полета и скороподъемность, оснащенный 2x 12,7-мм и 2x 7,7-мм пулеметами, он не обладает огневой мощью, но компенсирует это чистой производительностью благодаря мощности двигателя Ha-41 от Nakajima.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_44_ii_airframe: "Nakajima Ki-44-II `Shōki`"
 JAP_ki_44_ii_airframe_short: "Ki-44-II `Shōki`"
 JAP_ki_44_ii_airframe_desc: "Модернизированный до полного комплекта из 4x 12,7-мм Ho-103 пулеметов, Ki-44-II предлагает дополнительные опции с различными пушками, улучшенной защитой и самогерметизирующимися топливными баками. Новый двигатель Nakajima Ha-109 мощностью 1500 л. с. позволяет Ki-44 работать еще лучше, несмотря на весь дополнительный вес пушек и брони. M5 стандартизирует вооружение до 4x 20 мм Type 99-2, с дополнительными опциями для подъемных установок и 30-мм пушек.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_j2m5_airframe: "Mitsubishi J2M5 `Raiden`"
 JAP_j2m5_airframe_short: "J2M5 `Raiden`"
 JAP_j2m3_airframe_desc: "Разработанный как наземный перехватчик обороны для защиты баз ВМС Японии от бомбардировщиков. Оснащенный радиальным двигателем Mitsubishi Kasei 23, защищенный броней и вооруженный двумя 20-мм пушками Type 99-1 и двумя 20-мм пушками Type 99-2 в крыльях, Raiden обеспечивает хороший баланс между отличными характеристиками и хорошей огневой мощью и защитой.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_j2m5_airframe_desc: "Высотный вариант серии Raiden, разработанный для увеличения потолка и эффективности на большой высоте. Оснащен двигателем Mitsubishi Kasei 26 с наддувом, что обеспечивает повышенную скорость и производительность за счет дальности. На M5 вооружение унифицировано до четырех 20-мм пушек Type 99-2 с возможностью установки стреляющих вверх орудий и 30-мм пушек.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_84_i_airframe: "Nakajima Ki-84-I `Hayate`"
 JAP_ki_84_i_airframe_short: "Ki-84-I `Hayate`"
 JAP_ki_84_i_airframe_desc: "Хорошо спроектированный, с высокой скоростью и превосходной маневренностью, Hayate оснащен двойным тяжелым вооружением из двух 20-мм пушек и 12,7-мм пулеметов для поражения вражеских самолетов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§! §YЭто сохранит 90% эффективности от семейства $JAP_ki_44_i_airframe$, поскольку является его частью.§!"
  
 JAP_ki_117_airframe: "Nakajima Ki-117 `Hayate`"
 JAP_ki_117_airframe_short: "Ki-117 `Hayate`"
 JAP_ki_117_airframe_desc: "Конверсия Ki-84 в высокопроизводительный перехватчик. Ki-117 по сути не изменился, за исключением огромного двигателя Nakajima Ha-219 Ru мощностью 2400 л. с., а также герметичной кабины для полетов на большой высоте.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_katsudori_kai_airframe: "Kayaba `Katsuodori` Kai"
 JAP_katsudori_kai_airframe_short: "`Katsuodori` Kai"
 JAP_katsudori_kai_airframe_desc: "Оснащенный прямоточным воздушно-реактивным двигателем Kayaba Model 2, Katsuodori — это перехватчик ближнего действия с впечатляющим набором высоты и скоростью. Его роль против больших бомбардировщиков усиливается двумя новыми 30-мм пушками Ho-156, а также опциями для дополнительных орудийных контейнеров.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_t_1_airframe: ""Nakajima T-1 `Kōryū`"
 JAP_t_1_airframe_short: "T-1 `Kōryū`"
 JAP_t_1_airframe_desc: "Первоначально задуманный как учебный самолет для новой реактивной эры, вскоре стало понятно, что T-1 может быть превращен в способный полноценный истребитель-перехватчик с некоторыми модификациями. Более мощный двигатель Ne-340 4500 фунтов силы обеспечивает достаточную тягу для быстрого набора высоты, 4x 20-мм пушки и множество дополнительных сбрасываемых баков или вооружения из ракет, бомб или пушечных контейнеров.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_ad_tech_equipment_6: "Nakajima Ki-87"
 jap_fighter_ad_tech_equipment_6_short: "Ki-87"
 jap_fighter_ad_tech_equipment_6_desc: "Разработанный как высотный истребитель-перехватчик, этот самолет с турбонаддувом и вооружением из 30-мм и 20-мм пушек представляет собой грозную угрозу для истребителей противника, при этом у него слишком мало пушек для эффективного поражения бомбардировщиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_fighter_ad_tech_equipment_7: "Tachikawa Ki-94"
 jap_fighter_ad_tech_equipment_7_short: "Ki-94"
 jap_fighter_ad_tech_equipment_7_desc: "Разработанный как истребитель-перехватчик, Ki-94 имеет гораздо большую дальность полета, чем Ki-87, но ему все еще не хватает тяжелого вооружения, необходимого для борьбы с тяжелыми бомбардировщиками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 JAP_ki_27_airframe: "Nakajima Ki-27 `Kyū-Nana Sen`"
 JAP_ki_27_airframe_short: "Ki-27 `Kyū-Nana Sen`"
 JAP_ki_27_airframe_desc: "Истребитель-моноплан, разработанный компанией Nakajima Aircraft Company для Воздушной службы Императорской армии Японии. Несмотря на недостаток защиты, он обеспечивает превосходную маневренность благодаря малому весу и двигателю Kotobuki 41. Вооружение стандартное для той эпохи: 2 пулемета калибра 7,7 мм и возможность подвешивания умеренной бомбовой нагрузки, которую можно заменить на сбрасываемые баки, что значительно увеличивает дальность полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_43_i_airframe: "Nakajima Ki-43-I `Hayabusa`"
 JAP_ki_43_i_airframe_short: "Ki-43-I `Hayabusa`"
 JAP_ki_43_i_airframe_desc: "Hayabusa, по-прежнему оснащенный 7,7-мм пулеметом и только одним 12,7-мм пулеметом, посредственен в бою, но увеличенная бомбовая нагрузка означает, что это первый настоящий японский истребитель-бомбардировщик, способный поддерживать армию на континенте.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_ki_43_ii_airframe: "Nakajima Ki-43-II `Hayabusa`"
 JAP_ki_43_ii_airframe_short: "Ki-43-II `Hayabusa`"
 JAP_ki_43_ii_airframe_desc: "Оснащенный двумя 12,7-мм пулеметами, более мощный вариант двигателя Ha-35 позволяет нести большую бомбовую нагрузку, а также дополнительное топливо для еще больших дальностей. Защита значительно улучшена за счет внедрения самоуплотняющихся топливных баков и бронированной пластины позади пилота.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_61_i_otsu_airframe: "Kawasaki Ki-61-I Otsu `Hien`"
 JAP_ki_61_i_otsu_airframe_short: "Ki-61-I Otsu `Hien`"
 JAP_ki_61_i_otsu_airframe_desc: "Оснащенный четырьмя 12,7-мм пулеметами и рядным двигателем Ha-40, позволяющим ему нести 500 кг бомб, Hien эффективен в качестве истребителя-бомбардировщика. Однако высокий вес означает, что самолет имеет недостаточную мощность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_61_i_tei_airframe: "Kawasaki Ki-61-I Tei `Hien`"
 JAP_ki_61_i_tei_airframe_short: "Ki-61-I Tei `Hien`"
 JAP_ki_61_i_tei_airframe_desc: "Hien, оснащенный двумя 20-мм пушками Ho-5, заменяющими два пулемета. Броня дополнительно улучшена, а дальность полета увеличена за счет дополнительного внутреннего топлива. Увеличенный вес означает, что и без того недостаточно мощный двигатель испытывает еще большие трудности.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_61_ii_kai_airframe: "Kawasaki Ki-61-II Kai `Hien`"
 JAP_ki_61_ii_kai_airframe_short: "Ki-61-II Kai `Hien`"
 JAP_ki_61_ii_kai_airframe_desc: "Теперь, переоснащенный более мощным двигателем Ha-140, четырьмя 20-мм пушками и увеличенными рулем направления и фюзеляжем, Kai является достойным истребителем-бомбардировщиком.\n§GОн сохранит 95% эффективности предыдущей модели.§!"
 
 JAP_ki_100_airframe: "Kawasaki Ki-100 `Goshikisen`"
 JAP_ki_100_airframe_short: "Ki-100 `Goshikisen`"
 JAP_ki_100_airframe_desc: "Признавая ограничения ненадежного и все еще недостаточно мощного двигателя Kawasaki Ha-140, в Ki-100 была проведена радикальная переработка конструкции планера Ki-61 для установки более легкого и гораздо более надежного радиального двигателя Mitsubishi Ha-112. Это означает, что, несмотря на снижение максимальной скорости из-за увеличенного носа, самолет в целом стал гораздо более маневренным благодаря значительному снижению веса и более высокой мощности двигателя на больших высотах.\n§YЭто позволит сохранить 90% эффективности и конвертировать из модели $JAP_ki_61_ii_kai_airframe$.§!"
  
 JAP_n1k1_j_airframe: "Kawanishi N1K1-J Shiden"
 JAP_n1k1_j_airframe_short: "N1K1-J Shiden"
 JAP_n1k1_j_airframe_desc: "Способный истребитель 1930-х годов, Rex — это гидросамолет, не соответствующий времени. Не имея никаких улучшений в бомбовой нагрузке и меньшей дальности по сравнению с предыдущими японскими легкими бомбардировщиками, N1K1s единственными полезными улучшениями являются улучшения двигателя, что делает его быстрым и маневренным, но лишенным какой-либо значительной огневой мощи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_n1k2_j_airframe: "Kawanishi N1K2-J Shiden Kai"
 JAP_n1k2_j_airframe_short: "N1K2-J Shiden Kai"
 JAP_n1k2_j_airframe_desc: "Этот самолет, оснащенный немного лучше, с увеличенной бомбовой нагрузкой и большей дальностью полета за счет удаления аспекта поплавкового самолета, является посредственным, если и пригодным для использования легким бомбардировщиком.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_n1k3_a_airframe: "Kawanishi N1K3-A Shiden Kai"
 JAP_n1k3_a_airframe_short: "N1K3-A Shiden Kai"
 JAP_n1k3_a_airframe_desc: "Шиден Kai, переоборудованный под флот, оборудованный для операций с авианосцами.\n§GЭта модель сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_j6k_airframe: "Kawanishi J6K `Jinpu`"
 JAP_j6k_airframe_short: "J6K `Jinpu`"
 JAP_j6k_airframe_desc: "Улучшенная версия ранее снятого с производства Kawanishi J3K (параллельная разработка N1K Shiden) с более мощным двигателем — радиальным двигателем Nakajima Homare 42. Мощный двигатель и более прочный фюзеляж позволяют истребителю нести массивный арсенал из 2x 13,2-мм пулеметов и 6x 20-мм пушек, сохраняя при этом хорошие характеристики.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§! §YЭто сохранит 90% эффективности от семейства $JAP_n1k1_j_airframe$, поскольку является его частью.§!"
  
 JAP_j9n_kikka_airframe: "Nakajima J9N `Kikka`"
 JAP_j9n_kikka_airframe_short: "J9N `Kikka`"
 JAP_j9n_kikka_airframe_desc: "Вдохновленный немецким Me 262, J9N Orange Blossom — быстрый, хотя и несколько примитивный реактивный истребитель. Вооруженный для наземной поддержки двумя 30-мм пушками Type-5 и бомбами, а также с капризными двигателями и небольшой дальностью полета, он лучше всего проявляет себя в местной обороне.\n§YРАЗРЕШЕНО, ЕСЛИ КАКОЕ-ЛИБО ИСТИНА:§!\n§Y$GER$§! находится во фракции или марионетке §Y$JAP$§!, §Y$GER$§! завершил §Y$GER_naval_cooperation_with_japan$§!, §Y$JAP$§! завершил §Y$JAP_jet_prototypes$§!."
  
 JAP_ki_201_airframe: "Nakajima Ki-201 `Karyū`"
 JAP_ki_201_airframe_short: "Ki-201 `Karyu`"
 JAP_ki_201_airframe_desc: "Реактивный истребитель-бомбардировщик Ki-201 больше похож на немецкий Me 262, чем на Kikka. Улучшенная дальность, грузоподъемность и вооружение означают, что он в целом более эффективен, но больший вес делает его немного более медлительным, чем Kikka. Более крупный фюзеляж и более мощные двигатели также позволяют ему иметь на борту радиолокационную электронику.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_j10y_airframe: "Mizuno J10Y `Shinryū`"
 JAP_j10y_airframe_short: "J10Y `Shinryū`"
 JAP_j10y_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 JAP_a4n_airframe: "Nakajima A4N"
 JAP_a4n_airframe_short: "A4N"
 JAP_a4n_airframe_desc: "Разработанный изначально как частная инициатива Nakajima для флота, A4N является общим улучшением старого A2N. Биплан смешанной конструкции, он оснащен радиальным двигателем Hikari, вооружен 2x 7,7-мм пушками Type 97 Mgs и способен совершать крейсерские полеты на приличную дальность благодаря крыльевым сбрасываемым бакам.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_a5m_airframe: "Mitsubishi A5M4 `Claude`"
 JAP_a5m_airframe_short: "A5M4 `Claude`"
 JAP_a5m_airframe_desc: "Claude — это передовой истребитель-носитель, отличающийся высокой маневренностью и скоростью, если он плохо вооружен. Тем не менее, он оказался эффективным для региона, в котором оказался.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_a6m2_airframe: "Mitsubishi A6M2 `Reisen`"
 JAP_a6m2_airframe_short: "A6M2 `Reisen`"
 JAP_a6m2_airframe_desc: "Печально известный Zero или "Zeke", A6M2 - это фантастическое сочетание маневренности и дальности, если не хватает вооружения. Это один из лучших самолетов-носителей на момент его появления, превосходящий по дальности все остальные самолеты-носители, с доктринальным фокусом на акробатике, надеясь компенсировать отсутствие брони и тяжелого вооружения.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_a6m3_airframe: "Mitsubishi A6M3 `Reisen`"
 JAP_a6m3_airframe_short: "A6M3 `Reisen`"
 JAP_a6m3_airframe_desc: "Модернизированный новыми 20-мм пушками Mark 2 Type 99, а также оснащенный турбированным двигателем и новым дизайном крыла, A6M3 представляет собой чистую модернизацию A6M2. Обладая лучшим вооружением и маневренностью, он жертвует частью крайне важной дальности из-за более крупного двигателя.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_a6m5_airframe: "Mitsubishi A6M5 `Reisen`"
 JAP_a6m5_airframe_short: "A6M5 `Reisen`"
 JAP_a6m5_airframe_desc: "Заменив 7,7-мм пулеметы в самолете на 13,2-мм пулеметы, A6M5 представляет собой меньший скачок в характеристиках, чем M2 и M3, но все же является важным улучшением для палубного истребителя, особенно в плане защиты, дальности и потенциальных модернизаций с дополнительными пушками.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 fuel_limit_3000: "Макс. дальность около 3000 км"
 
 JAP_a6m8_airframe: "Mitsubishi A6M8 `Reisen`"
 JAP_a6m8_airframe_short: "A6M8 `Reisen`"
 JAP_a6m8_airframe_desc: "Чтобы удовлетворить требования ВМС по поддержанию объемов производства и в связи с задержками, связанными с внедрением совершенно нового типа A7M, Mitsubishi решила попробовать установить старый, но надежный двигатель Kinsei 62 на A6M. Переработанная передняя часть означала, что носовые пушки пришлось удалить, но благодаря повышению характеристик A6M8 стал таким же маневренным, как и ранние модели, и при этом самым быстрым Zero.\n§YЭто позволит сохранить эффективность на уровне 95%, но не будет конвертироваться из модели $JAP_a6m5_airframe$.§!"
  
 JAP_a7m2_airframe: "Mitsubishi A7M2 `Reppū`"
 JAP_a7m2_airframe_short: "A7M2 `Reppū`"
 JAP_a7m2_airframe_desc: "Разработанный для замены относительно устаревшего A6M Zero, Sam быстрее, немного прочнее, лучше вооружен и даже более маневренен, чем Zero.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_a7m3_airframe: "Mitsubishi A7M3 `Reppū Kai`"
 JAP_a7m3_airframe_short: "A7M3 `Reppū Kai`"
 JAP_a7m3_airframe_desc: "Оснащенный шестью новыми скорострельными 30-мм пушками Type 5 и новым двигателем с турбонаддувом Ha-43-51, этот перехватчик-вариант A7M является чрезвычайно эффективным истребителем.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_a8w7_airframe: "Nakajima A8W7 `Taifū`"
 JAP_a8w7_airframe_short: "A8W7 `Taifū`"
 JAP_a8w7_airframe_desc: "Истребитель-бомбардировщик Ki-201. A8W7 оснащен всем необходимым оборудованием для работы на авианосце. Однако увеличение веса потребовало разработки более мощного реактивного двигателя Ne-230 Kai. Улучшение дальности, производительности, а также герметичная кабина и прочное вооружение.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_45_airframe: "Kawasaki Ki-45 `Toryū`"
 JAP_ki_45_airframe_short: "Ki-45 `Toryū`"
 JAP_ki_45_airframe_desc: "Двухместный тяжелый истребитель Toryū изначально был разработан для эскортных задач, но быстро превратился в перехватчик и атакующий самолет. Будучи довольно маневренным для самолета такого размера, он мог надежно поражать различные цели, используя различные варианты вооружения, даже крупнокалиберные противотанковые пушки и стреляющие вверх пушки перехвата бомбардировщиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто сохранит 90% эффективности от $JAP_ki_48_i_airframe$.§!"
  
 JAP_ki_96_airframe: "Kawasaki Ki-96"
 JAP_ki_96_airframe_short: "Ki-96"
 JAP_ki_96_airframe_desc: "Развитие Ki-45 в одноместный, двухмоторный тяжелый истребитель. Ki-96 обтекает фюзеляж для высокой маневренности. Респектабельная огневая мощь обеспечивается 37-мм пушкой Ho-203, а также 2x 20-мм Ho-5.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто сохранит 90% эффективности от $JAP_ki_45_airframe$.§!"
  
 JAP_ki_102_airframe: "Kawasaki Ki-102"
 JAP_ki_102_airframe_short: "Ki-102"
 JAP_ki_102_airframe_desc: "Разработанный как штурмовой самолет, Ki-102 оснащен 57-мм или 37-мм пушкой, как минимум двумя 20-мм пушками и 12,7-мм пулеметом. Способен поражать наземные цели на чрезвычайно глубоком фронте. Сосредоточение на наземной поддержке и возможностях защиты оставляет его немного слабым в воздушных боях.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто сохранит 90% эффективности от $JAP_ki_96_airframe$.§!"
  
 JAP_ki_93_airframe: "Rikugen Ki-93"
 JAP_ki_93_airframe_short: "Ki-93"
 JAP_ki_93_airframe_desc: "Нацеленный на то, чтобы стать более эффективным противокорабельным и бомбардировочным истребителем, он на самом деле не дает многого по сравнению с Ki-102. Однако, где он превосходит других, так это в своей значительно улучшенной дальности даже без дополнительных подвесных баков.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_s1a_airframe: "Aichi S1A `Denko`"
 JAP_s1a_airframe_short: "S1A `Denko`"
 JAP_s1a_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 JAP_j1n_airframe: "Nakajima J1N `Gekkō`"
 JAP_j1n_airframe_short: "J1N1 `Gekkō`"
 JAP_j1n_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
 jap_heavy_fighter_ad_tech_2: "Пакет обновления Nakajima J5N"
 jap_heavy_fighter_ad_tech_2_desc: "Разработан на основе J1N для удовлетворения новых требований к более тяжелому вооружению, большой высоте и скорости. Вторичное вооружение убрано, освобождая место для 2x 30-мм и 2x 20-мм пушек. Улучшение характеристик возможно за счет мощности новых двигателей Homare."
  
 JAP_ki_83_airframe: "Mitsubishi Ki-83"
 JAP_ki_83_airframe_short: "Ki-83"
 JAP_ki_83_airframe_desc: "Тяжелый истребитель дальнего действия Ki-83 имеет обтекаемый и гладкий фюзеляж, оснащенный двумя большими двигателями Ha-211 с наддувом. Это делает его чрезвычайно быстрым и удивительно маневренным. He также имеет внушительное вооружение с двумя 30-мм и двумя 20-мм пушками, а также возможность нести несколько легких бомб для наземных миссий. Это своего рода новинка для японских конструкций, он защищен бронированным стеклом и системами пожаротушения.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_j7w1_airframe: "Kyushu J7W1 `Shinden`"
 JAP_j7w1_airframe_short: "J7W1 `Shinden`"
 JAP_j7w1_airframe_desc: "Этот тяжелый перехватчик с инновационной конструкцией толкающего винта оснащен четырьмя 30-мм пушками для поражения стратегических бомбардировщиков над ключевыми территориями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 JAP_j7w2_airframe: "J7W2 `Shinden Kai`"
 JAP_j7w2_airframe_short: "Kyushu J7W2 `Shinden Kai`"
 JAP_j7w2_airframe_desc: "J7W1, переоборудованный турбореактивными двигателями, представляет собой чрезвычайно быстрый, маневренный и хорошо вооруженный тяжелый истребитель, способный поражать все, от стратегических бомбардировщиков до истребителей противника, хотя и ограниченный относительно небольшой дальностью полета для той эпохи по сравнению с винтовыми самолетами.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_3_airframe: "Kawasaki Ki-3"
 JAP_ki_3_airframe_short: "Ki-3"
 JAP_ki_3_airframe_desc: "Разработанный как легкий бомбардировщик, Ki-3 неплох для начала 30-х годов. Оснащенный хорошей бомбовой нагрузкой и приличной дальностью, этот плохо вооруженный самолет, тем не менее, чрезвычайно уязвим для вражеского огня из-за своей конструкции, которая представляет собой не более чем металлический каркас, покрытый тканью.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_32_airframe: "Kawasaki Ki-32"
 JAP_ki_32_airframe_short: "Ki-32"
 JAP_ki_32_airframe_desc: "Разработанный как легкий бомбардировщик для замены Ki-3, Ki-32 оснащен более мощной версией двигателя Ha-9-II, что обеспечивает бомбардировщику превосходную маневренность. Более крупный планер обеспечивает достаточно места для небольшого бомбового отсека, который может быть альтернативно использован для дополнительного топлива, что позволяет Ki-32 наслаждаться превосходной дальностью полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_51_airframe: "Mitsubishi Ki-51"
 JAP_ki_51_airframe_short: "Ki-51"
 JAP_ki_51_airframe_desc: "Разработанный в ответ на потребность в маловысотных штурмовиках, Ki-51 радикально отличается от предыдущего поколения легких бомбардировщиков. Хотя бомбовая нагрузка и дальность полета ниже, он более чем компенсирует это полностью металлическим, полностью бронированным двигателем и кабиной, а также самогерметизирующимися топливными баками, что делает самолет очень крепким орешком. Маневренность еще лучше благодаря меньшему весу и более мощному двигателю, а вооружение усилено двумя крыльевыми пулеметами, которые можно модернизировать.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_71_airframe: "Mitsubishi Ki-71 `Mansyū`"
 JAP_ki_71_airframe_short: "Ki-71 `Mansyū`"
 JAP_ki_71_airframe_desc: "Попытка разработать усовершенствованную версию Ki-51. Ki-71 имеет более мощный двигатель, улучшенное вооружение и убирающееся шасси, что радикально улучшает его аэродинамические характеристики. К сожалению, ограничения по весу планера Ki-51 не приводят к улучшению дальности полета. Однако переработанные крылья обеспечивают ему тормоза пикирования и позволяют нести 12,7-мм пулеметы Ho-103 HMG и, возможно, даже 20-мм пушки.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_d4y3_airframe: "Yokosuka D4Y3 `Suisei`"
 JAP_d4y3_airframe_short: "D4Y3 `Suisei`"
 JAP_d4y3_airframe_desc: "Наземная версия пикирующего бомбардировщика D4Y; оснащена улучшенным двигателем, позволяющим нести увеличенную бомбовую нагрузку, и 13,2-мм оборонительным пулеметом, а также дополнительным топливом для большей дальности полета, которую можно дополнительно улучшить с помощью подвесных баков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§! §YЭто сохранит 90% эффективности от семейства D4Y, поскольку является его частью.§!"
  
 JAP_ki_98_airframe: "Mansyū Ki-98"
 JAP_ki_98_airframe_short: "Ki-98"
 JAP_ki_98_airframe_desc: "Самолет-штурмовик, разработанный Manchuria Airplane Manufacturing Company, Ki-98 — одноместный двухбалочный низкоплан с центральной гондолой, в которой размещаются как кабина, так и турбонаддувный двигатель Mitsubishi Ha-211. Вооружен 37-мм противотанковой пушкой Ho-205, а также двумя 20-мм пушками Ho-5. Он способен нести бомбу умеренной массы, а под крыльями — множество ракет.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_98_kai_airframe: "Mansyū Ki-98 Kai"
 JAP_ki_98_kai_airframe_short: "Ki-98 Kai"
 JAP_ki_98_kai_airframe_desc: "Уникальность конструкции позволяет легко модифицировать Ki-98 для использования реактивного двигателя, хотя и с увеличением фюзеляжа для размещения большего количества топлива. Мощность реактивного двигателя позволяет нести еще более крупные 57-мм и 30-мм пушки. Кабина теперь герметична.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_r2y2_g_airframe: "Yokosuka R2Y2-G `Keiun-Kai`"
 JAP_r2y2_g_airframe_short: "R2Y2-G `Keiun-Kai`"
 JAP_r2y2_g_airframe_desc: "Прототип разведывательного самолета с винтовым двигателем, превращенный в турбореактивный штурмовик. R2Y2 оснащен двумя реактивными двигателями Ne-330 в обычной установке под крыльями. Хотя бомбовая нагрузка и защита оставляют желать лучшего, они, тем не менее, дополнены 4 пушками калибра 30 мм, а также хорошей дальностью и производительностью. Кроме того, он оснащен бомбовыми прицелами для высокой точности на высокой скорости.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_r2y3_g_airframe: "Yokosuka R2Y3-G `Keiun-Kai`"
 JAP_r2y3_g_airframe_short: "R2Y3-G `Keiun-Kai`"
 JAP_r2y3_g_airframe_desc: "Эволюция реактивного штурмовика R2Y2. R2Y3 перемещает улучшенные двигатели внутрь корней крыльев и фюзеляжа, освобождая место на крыльях для большего количества ракет или подвесных баков. Более аэродинамичный самолет также быстрее и маневреннее, несмотря на добавление брони, защиты и более тяжелых пушек Ho-156.\n§YЭто сохранит эффективность, но не может быть преобразовано из предыдущей модели.§!"
  
 JAP_d1a_airframe: "Aichi D1A"
 JAP_d1a_airframe_short: "D1A"
 JAP_d1a_airframe_desc: "Пикирующий бомбардировщик палубного базирования Susie — это легковооруженный и относительно медленный палубный бомбардировщик, но он доказал свою полезность в этой роли исключительно благодаря своей способности быть пикирующим бомбардировщиком палубного базирования.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_d3a1_airframe: "Aichi D3A1 `Kanbaku`"
 JAP_d3a1_airframe_short: "D3A1 `Kanbaku`"
 JAP_d3a1_airframe_desc: "`Вал` все еще слишком легок, чтобы успешно сражаться с крупными надводными кораблями, но хорошо оснащен для атаки целей на суше или легких судов в море и может похвастаться значительно большей дальностью полета по сравнению со своим армейским аналогом.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_d4y1_airframe: "Yokosuka D4Y1 `Suisei`"
 JAP_d4y1_airframe_short: "D4Y1 `Suisei`"
 JAP_d4y1_airframe_desc: "Разработанный с упором на повышение живучести и противокорабельных возможностей, Judy является достойной заменой Val и наверняка окажет поддержку нашим армиям на суше и на море против более легких судов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_d4y4_airframe: "Yokosuka D4Y4 `Suisei`"
 JAP_d4y4_airframe_short: "D4Y4 `Suisei`"
 JAP_d4y4_airframe_desc: "Y4 переносит улучшенные характеристики наземного Y3, такие как мощный радиальный двигатель. Однако он улучшает защиту, добавляя много брони и компенсируя дальность полета путем удаления заднего стрелка в пользу большего количества топлива. Более того, он увеличил бомбовую нагрузку, отказавшись от люка в пользу простого подвешивания более крупной бомбы.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_r2y3_a_airframe: "Yokosuka R2Y3-A `Keiun-Kai`"
 JAP_r2y3_a_airframe_short: "R2Y3-A `Keiun-Kai`"
 JAP_r2y3_a_airframe_desc: "R2Y3, оснащенный морской авиацией, позволяющий ему работать с авианосцев. He способен поддерживать морские операции с помощью бомб, ракет или даже управляемых морских бомб для впечатляющей противокорабельной наступательной мощи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YHe может конвертироваться из $JAP_r2y3_g_airframe$.§!"
  
 JAP_b4y_airframe: "Yokosuka B4Y"
 JAP_b4y_airframe_short: "B4Y1"
 JAP_b4y_airframe_desc: "Разработанный для операций на авианосцах с целью замены более ранних бомбардировщиков-бипланов, в основном металлический биплан B4Y обладает большой дальностью полета и хорошей торпедой. Однако это достигается ценой медленности и хрупкости.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_b5n_airframe: "Nakajima B5N `Kanko`"
 JAP_b5n_airframe_short: "B5N `Kanko`"
 JAP_b5n_airframe_desc: "Более быстрый и дальнобойный, чем B4Y1, Kate — это эффективный палубный торпедоносец-бомбардировщик, который сможет поражать крупные корабли противника на расстоянии или, возможно, даже пока они находятся в порту.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_b6n_airframe: "Nakajima B6N `Tenzan`"
 JAP_b6n_airframe_short: "B6N `Tenzan`"
 JAP_b6n_airframe_desc: "Обладая фантастической дальностью и тяжелой торпедой, Jill быстр для торпедоносца, но ему не хватает брони. С этим мы сможем вступать в бой с вражескими кораблями, где бы они ни находились в Тихом океане.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_b7n_airframe: "Aichi B7A `Ryūsei`"
 JAP_b7n_airframe_short: "B7A `Ryūsei`"
 JAP_b7n_airframe_desc: "Торпедоносец-пикирующий бомбардировщик, Ryūsei — это значительное улучшение по сравнению с Tenzen. Быстрее, гораздо лучше вооружен и, хотя и легко бронирован, оснащен тяжелым боезапасом торпед или бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_b8n_airframe: "Aichi B8A `Mokusei`"
 JAP_b8n_airframe_short: "B8A `Mokusei`"
 JAP_b8n_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_p2y_airframe: "Yokosuka P2Y `Tenga`"
 JAP_p2y_airframe_short: "P2Y `Taihō`"
 JAP_p2y_airframe_desc: "Разработанный как первый турбореактивный истребитель-палубник Японии, P2Y имеет меньшую дальность полета в обмен на лучшую броню, скорость и маневренность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_p3y_airframe: "Yokosuka P3Y `Taihō`"
 JAP_p3y_airframe_short: "P3Y `Taiho`"
 JAP_p3y_airframe_desc: "Прямое улучшение P2Y, Taiho отличается превосходной скоростью, дальностью полета, броней и вооружением. Удаленный задний ствол позволяет расширить и усилить внутренний отсек для большей бомбовой нагрузки или 2x торпед.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_h4h2_airframe: "Hiro H4H2"
 JAP_h4h2_airframe_short: "H4H2"
 JAP_h4h2_airframe_desc: "H4H — это морской бомбардировщик-разведчик-моноплан, летающая лодка, разработанная Hiro Naval Arsenal. Улучшенная модель H2 оснащена новыми двигателями Myojo 2, что позволяет самолету нести больше топлива для большей эффективной дальности. Вооружение состоит из 3 пулеметов Type 92 MG в различных креплениях и умеренной бомбовой нагрузки, размещаемой снаружи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_h6k2_airframe: "Kawanishi H6K2"
 JAP_h6k2_airframe_short: "H6K2"
 JAP_h6k2_airframe_desc: "Большой летающий корабль, способный патрулировать Тихий океан, `Mavis` оснащен бомбами, торпедами и пулеметными турелями, что идеально подходит для поражения открытых вражеских судов или защиты линий снабжения от подводных лодок.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_h6k4_airframe: "Kawanishi H6K4"
 JAP_h6k4_airframe_short: "H6K4"
 JAP_h6k4_airframe_desc: "Оснащенный дополнительными блистерами MG в луче, а также модернизированной хвостовой пушкой до 20-мм пушки, этот апгрейд делает H6K4 более способным противостоять перехвату. Редизайн позволяет нести дополнительные топливные баки, что еще больше увеличивает дальность полета.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_h8k2_airframe: "Kawanishi H8K2"
 JAP_h8k2_airframe_short: "H8K2"
 JAP_h8k2_airframe_desc: "Более крупный, быстрый, лучше вооруженный и бронированный, чем H6K, Emily более эффективен и подходит для военных нужд.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_h8k3_airframe: "Kawanishi H8K3"
 JAP_h8k3_airframe_short: "H8K3"
 JAP_h8k3_airframe_desc: "Установка башен и поплавков с механизмами отвода дает улучшение скорости, хотя и за счет более высокой себестоимости производства. Однако уникальной особенностью является внедрение новых морских систем радиолокации с воздуха на поверхность, которые значительно улучшают возможности патрульного самолета.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_h11k1_airframe: "Kawanishi H11K1 `Soku`"
 JAP_h11k1_airframe_short: "H11K1 `Soku`"
 JAP_h11k1_airframe_desc: ".\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_h14k1_airframe: "Kawanishi H14K1"
 JAP_h14k1_airframe_short: "H14K1"
 JAP_h14k1_airframe_desc: "Родился из проекта KX-03. Абсолютная мерзость. Летающий остров. 18-моторное преступление против техники!\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_ki_1_airframe: "Mitsubishi Ki-1"
 JAP_ki_1_airframe_short: "Ki-1-II"
 JAP_ki_1_airframe_desc: "Mitsubishi взяла за основу свой первый проект дальнего бомбардировщика на основе Junkers K37, из-за чего он уже устарел к моменту своего появления. Медленный, хлипкий и непрочный. Тем не менее, он несет приличную бомбовую нагрузку для своего времени.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_21_airframe: "Mitsubishi Ki-21 `Kyu-Nana Jū`"
 JAP_ki_21_airframe_short: "Ki-21-I `Kyu-Nana Jū`"
 JAP_ki_21_airframe_desc: "Полностью отечественная конструкция бомбардировщика большой дальности для замены Ki-1 и более крупного Ki-20, Gwen жертвует бомбовой нагрузкой, чтобы похвастаться превосходной дальностью и скоростью, хотя полностью лишен брони. Идея заключается в том, чтобы компенсировать недостаток бомбовой нагрузки путем проведения повторных атак.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 jap_strike_bomber_ad_tech_2: "Пакет модернизации Ki-21-II"
 jap_strike_bomber_ad_tech_2_desc: "Более мощный двигатель Kasei Ha-101 значительно повышает возможности Ki-21, а именно обеспечивает дополнительную броню, защиту и оборонительное вооружение."
  
 JAP_ki_49_airframe: "Nakajima Ki-49 `Donryu`"
 JAP_ki_49_airframe_short: "Ki-49-I `Donryu`"
 JAP_ki_49_airframe_desc: "Разработанный как замена Ki-21, Donryu может похвастаться большой дальностью полета, не жертвуя уже ограниченной бомбовой нагрузкой, как на Ki-21. Защита и вооружение улучшены за счет добавления пушки и брони.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
 jap_strike_bomber_ad_tech_3: "Пакет модернизации Ki-49-II"
 jap_strike_bomber_ad_tech_3_desc: "Усовершенствованный двигатель Nakajima Ha-109, мощная броня и 12,7-мм пулеметы Ho-103 делают его надежным бомбардировщиком."
  
 JAP_ki_67_airframe: "Mitsubishi Ki-67 `Hiryū`"
 JAP_ki_67_airframe_short: "Ki-67 `Hiryū`"
 JAP_ki_67_airframe_desc: "Преемник Donryu, Peggy — это быстрый бомбардировщик-ударник с огромной дальностью полета, способный поражать цели по всей Азии. Хотя бомбовая нагрузка намного меньше, чем у конкурентов, броня и вооружение, а также способность наносить удары по судоходству торпедами делают его очень эффективным.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strike_bomber_ad_tech_4: "Пакет переоборудования штурмовика Ki-109"
 jap_strike_bomber_ad_tech_4_desc: "Задуманное как перехватчик бомбардировщиков на базе Ki-67, орудие оказалось слишком тяжелым и ненадежным на большой высоте против летящих целей. Тем не менее, оно является мощным оружием для атаки наземных целей."
 JAP_ki_109_airframe: "Mitsubishi Ki-109 `Hiryū`"
 JAP_ki_109_airframe_short: "Ki-109 `Hiryū`"
  
 JAP_ki_74_airframe: "Tachikawa Ki-74"
 JAP_ki_74_airframe_short: "Ki-74"
 JAP_ki_74_airframe_desc: "Быстрый и чрезвычайно дальнобойный, Ki-74 спроектирован с герметичной кабиной для оптимальной работы на большой высоте. Двигатели Ha-211 обеспечивают достаточную мощность для увеличенного бомбового отсека, который может альтернативно нести управляемую бомбу Ke-Go для борьбы с кораблями. Шедевр Тачикавы призван заменить все предыдущие поколения легких и средних бомбардировщиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_48_i_airframe: "Kawasaki Ki-48-I `Sokei`"
 JAP_ki_48_i_airframe_short: "Ki-48-I `Sokei`"
 JAP_ki_48_i_airframe_desc: "Разработанный как высокоскоростной легкий бомбардировщик, Sokei частично вдохновлен советским Туполевым СБ; отличающийся превосходной дальностью полета и низкой стоимостью, хотя и недостаточным объемом бомб. He полагается на скорость и маневренность для выживания, хотя, если это не сработает, он все равно может танковать попадания благодаря своей броне и защищенному топливу.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто сохранит 90% эффективности от $JAP_ki_45_airframe$.§!"
  
 JAP_ki_48_ii_airframe: "Kawasaki Ki-48-II `Sokei`"
 JAP_ki_48_ii_airframe_short: "Ki-48-II `Sokei`"
 JAP_ki_48_ii_airframe_desc: "Для устранения недостатков Ki-48 вводится новая силовая установка Ha-115. Более надежный двигатель позволяет развивать еще большую скорость и удваивать грузоподъемность, что приводит к увеличению запаса топлива, бомб и даже возможности доставки торпеды.\n§GЭто сохранит 95% эффективности предыдущей модели.§!\n§YЭто сохранит 90% эффективности $JAP_ki_45_airframe$.§!"
 jap_fast_bomber_ad_tech_2: "Пакет модернизации Ki-66"
 jap_fast_bomber_ad_tech_2_desc: "Первоначально задуманный как двухмоторный пикирующий бомбардировщик, вдохновленный немецкими разработками, Ki-66 предлагает лишь незначительные улучшения по сравнению с Ki-48-II. Однако тормоза пикирования можно было бы с тем же успехом установить непосредственно на Ki-48, в то время как Ki-66 имеет больший потенциал как тяжелый истребитель."
  
 jap_fast_bomber_ad_tech_2_1: "Kawasaki Ki-66"
 jap_fast_bomber_ad_tech_2_1_short: "Ki-66"
 jap_fast_bomber_ad_tech_2_1_desc: "Первоначально задуманный как двухмоторный пикирующий бомбардировщик, вдохновленный немецкими разработками, Ki-66 предлагает лишь незначительные улучшения по сравнению с Ki-48. Однако тормоза пикирования можно было бы с тем же успехом установить непосредственно на Ki-48, в то время как Ki-66 имеет больший потенциал как тяжелый истребитель."
  
 JAP_p1y1_airframe: "Yokosuka P1Y1 `Ginga`"
 JAP_p1y1_airframe_short: "P1Y1 `Ginga`"
 JAP_p1y1_airframe_desc: "Ginga, задуманная как преемник предыдущих двухмоторных торпедоносцев и легких бомбардировщиков, предлагает хороший баланс между защитой, вооружением, скоростью и дальностью полета. Конструкция достаточно гибкая для потенциальных преобразований для других ролей, таких как разведка или ночной перехват.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_p1y7_airframe: "Yokosuka P1Y7 `Ginga`"
 JAP_p1y7_airframe_short: "P1Y7 `Ginga`"
 JAP_p1y7_airframe_desc: "Реактивное усовершенствование P1Y. P1Y7 позволяет нести вдвое больше бомбовой нагрузки и даже новую инновационную управляемую бомбу Ke-Go. He также оснащен герметичной кабиной для лучшей работы на большой высоте.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_g3m_airframe: "Mitsubishi G3M `Rikko`"
 JAP_g3m_airframe_short: "G3M1 `Rikko`"
 JAP_g3m_airframe_desc: "G3M берет свое начало в спецификации от IJN, запрашивающей бомбардировщик с беспрецедентной дальностью полета. Бомбардировщик должен иметь возможность размещения воздушной торпеды, в то время как бомбовая нагрузка была второстепенным соображением. Защита почти второстепенна, за исключением нескольких оборонительных орудий.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g4m1_airframe: "Mitsubishi G4M1 `Hamaki`"
 JAP_g4m1_airframe_short: "G4M1 `Hamaki`"
 JAP_g4m1_airframe_desc: "Разработанный как легкий средний бомбардировщик, G4M1 жертвует защитой ради достижения высокой скорости и впечатляющей дальности. К сожалению, это делает его чрезвычайно уязвимым.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g4m2_airframe: "Mitsubishi G4M2 `Hamaki`"
 JAP_g4m2_airframe_short: "G4M2 `Hamaki`"
 JAP_g4m2_airframe_desc: "Новые двигатели Kasei 21 и увеличенные топливные баки увеличивают дальность полета Hamaki. Оборонительное вооружение усилено заменой дорсального пулемета на 20-мм пушку. Хотя все еще сильно не хватает защиты, можно пожертвовать дальностью полета ради брони.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_g4m3_airframe: "Mitsubishi G4M3 `Hamaki`"
 JAP_g4m3_airframe_short: "G4M3 `Hamaki`"
 JAP_g4m3_airframe_desc: "Вариант M3 самолета Betty, оснащенный самогерметизирующимися топливными баками и дополнительными 20-мм оборонительными башнями, на данном этапе может использоваться только в качестве морского бомбардировщика для борьбы с легкими целями, не имея значительной обычной бомбовой нагрузки по сравнению с другими самолетами, наносящими удары по наземным целям.\n§GЭта модель сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_g7m_airframe: "Mitsubishi G7M `Taizan`"
 JAP_g7m_airframe_short: "G7M `Taizan`"
 JAP_g7m_airframe_desc: "Разработанный для окончательной замены G4M3, Taizan по-прежнему не имеет брони, вооружения и даже может похвастаться уменьшенной дальностью полета, чтобы вместить умеренное улучшение оборонительного вооружения, что по-прежнему делает самолет бесполезным против любых целей, кроме легких морских целей.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_ki_210_airframe: "Mitsubishi Ki-210 `Unryu`"
 JAP_ki_210_airframe_short: "Ki-210 `Unryu`"
 JAP_ki_210_airframe_desc: "Впервые оснащенный тяжелой бомбовой нагрузкой, этот двухмоторный турбореактивный средний бомбардировщик быстр, далек для реактивного самолета и способен безнаказанно уничтожать цели на море и на суше. Для того чтобы обеспечить эту способность, не предусмотрено оборонительное вооружение, поскольку предполагается, что скорости будет достаточно, чтобы уйти от большинства врагов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 JAP_ki_20_airframe: "Mitsubishi Ki-20"
 JAP_ki_20_airframe_short: "Ki-20"
 JAP_ki_20_airframe_desc: "Представленный в 1932 году, только несколько экземпляров этого большого стратегического бомбардировщика, созданного на базе авиалайнера Junkers G.38, были произведены по лицензии. He страдает от ограничений, но, тем не менее, он все еще может нести впечатляющую бомбовую нагрузку.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g5n_airframe: "Nakajima G5N `Shinzan`"
 JAP_g5n_airframe_short: "G5N1 `Shinzan`"
 JAP_g5n_airframe_desc: "Заказанный ВМС, Liz — это сверхдальний четырехмоторный тяжелый бомбардировщик, оснащенный 20-мм оборонительными пушками, предназначенный для разрушения укреплений на островах по всему Тихому океану, нанося удары с баз, расположенных в глубине безопасной территории.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g8n_airframe: "Nakajima G8N `Renzan`"
 JAP_g8n_airframe_short: "G8N1 `Renzan`"
 JAP_g8n_airframe_desc: "Разработанный по тем же спецификациям, что и более ранняя модель G5N, G8N превосходит ее по огневой мощи и защите. 4 13-мм пулемета Type 2 HMG и 6 20-мм пулеметов Type 99-1, а также много брони.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g10n_airframe: "Nakajima G10N `Fugaku`"
 JAP_g10n_airframe_short: "G10N1 `Fugaku`"
 JAP_g10n_airframe_desc: "Разработанный как сверхдальний тяжелый бомбардировщик, Fugaku был ограничен тем, что его предполагаемый двигатель еще не был доступен. Тем не менее, оснащенный 6 двигателями Ha-219, он способен доставлять 5 тонн бомб на чудовищную дальность в 18000 км.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_g12n_airframe: "Nakajima G12N `Hijiri`"
 JAP_g12n_airframe_short: "G12N1 `Hijiri`"
 JAP_g12n_airframe_desc: "Рассматриваемый как конечный Fugaku, Hijiri использует более крупные и гораздо более мощные двигатели Ha-54, что позволяет ему нести 20 тонн бомб на расстояние более 16000 км. Различные огневые точки и дистанционно управляемые башни делают его опасным для любого вражеского перехватчика.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 JAP_ki_4_airframe: "Nakajima Ki-4"
 JAP_ki_4_airframe_short: "Ki-4"
 JAP_ki_4_airframe_desc: "Разведывательный самолет-биплан смешанной конструкции. Ki-4 также может использоваться в качестве легкого самолета наземной поддержки при необходимости.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_15_airframe: "Mitsubishi Ki-15 `Karigane`"
 JAP_ki_15_airframe_short: "Ki-15 `Karigane`"
 JAP_ki_15_airframe_desc: "Высокоскоростной разведывательный самолет Karigane представляет собой цельнометаллический моноплан, предлагающий увеличенную дальность, прочность и производительность. Его можно использовать в качестве легкого бомбардировщика, он может нести большую нагрузку с дальнейшими модернизациями двигателя.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_46_ii_airframe: "Mitsubishi Ki-46-II `Dinah`"
 JAP_ki_46_ii_airframe_short: "Ki-46-II `Dinah`"
 JAP_ki_46_ii_airframe_desc: "Разработанная на основе доктрины стратегической разведки, а не тактики, `Дина` лишена почти всех видов защиты в пользу скорости и дальности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_ki_46_iii_airframe: "Mitsubishi Ki-46-III `Dinah`"
 JAP_ki_46_iii_airframe_short: "Ki-46-III `Dinah`"
 JAP_ki_46_iii_airframe_desc: "Более быстрый и дальность полета, чем II, это улучшение обеспечивается новыми двигателями Ha-102, позволяющими самолету нести еще больше топлива и сбрасываемый бак, но при этом достигать новых пределов скорости. Недостающая защита была улучшена с помощью брони и систем пожаротушения, а также самогерметизирующихся топливных баков. Производительность хороша до такой степени, что планер также подходит для переоборудования в тяжелый истребитель.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_scout_plane_ad_tech_equipment_5: "C6N"
 jap_scout_plane_ad_tech_equipment_5_short: "C6N"
 jap_scout_plane_ad_tech_equipment_5_desc: "ВМС запросили собственную разработку разведывательного самолета, Myrt является одним из самых быстрых палубных самолетов на момент его появления. Однако подводные камни в разработке разведывательного оборудования сделали его наземным для разведывательных задач.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 JAP_r2y1_airframe: "Yokosuka R2Y1 `Keiun`"
 JAP_r2y1_airframe_short: "R2Y1 `Keiun`"
 JAP_r2y1_airframe_desc: "Странный дизайн для одномоторного разведывательного самолета. He оснащен парными двигателями Atsuta в форме одного тяжелого, но мощного Aichi Ha-70. He обеспечивает достаточно мощности для R2Y, чтобы нести достаточно топлива для большой дальности и более высоких скоростей, или, в качестве альтернативы, для любого количества возможных преобразований в тяжелый истребитель.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
  
  
 GER_he_46c_airframe: "Heinkel He 46 C-1"
 GER_he_46c_airframe_short: "He 46 C-1"
 GER_he_46c_airframe_desc: "Моноплан, предназначенный для разведки и взаимодействия с армией, He 46 довольно слаб и хрупк, имеет смешанную конструкцию и низкую маневренность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_hs_126_airframe: "Henschel Hs 126"
 GER_hs_126_airframe_short: "Hs 126"
 GER_hs_126_airframe_desc: "Полностью металлический, двухместный самолет разведки и наблюдения. Несмотря на свою хрупкость, он способен совершать крейсерские полеты на большие расстояния.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_fw_189_airframe: "Focke-Wulf Fw 189 `Uhu`"
 GER_fw_189_airframe_short: "Fw 189"
 GER_fw_189_airframe_desc: "Focke-Wulf Fw 189 Uhu (Eagle Owl) — двухмоторный, двухбалочный, трехместный тактический разведывательный и армейский самолет взаимодействия. Его можно легко усилить прочной броней, пушками и даже радаром, чтобы использовать в качестве ночного истребителя-бомбардировщика.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 ger_scout_plane_ad_tech_3: "Пакет модернизации Fw 189"
 ger_scout_plane_ad_tech_3_desc: "Новый двигатель Argus As 411, 20-мм пушки MG151 и мощная броня повышают возможности Fw 189 практически во всех отношениях."
  
 GER_ar_234_c4_airframe: "Arado Ar 234 C-4 `Blitz`"
 GER_ar_234_c4_airframe_short: "Ar 234 C-4"
 GER_ar_234_c4_airframe_desc: "Вооруженная разведывательная версия реактивного бомбардировщика Ar 234 C, оснащенная камерами и вооруженная 4 пушками MG 151/20 калибра 20 мм.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_he_51_airframe: "Henschel He 51"
 GER_he_51_airframe_short: "He 51"
 GER_he_51_airframe_desc: "He 51 — это обычный одноместный биплан с цельнометаллической конструкцией и тканевой обшивкой. He оснащен двигателем BMW VI с гликолевым охлаждением, вооружение — два 7,92-мм пулемета, установленных над двигателем.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_bf_109_b1_airframe: "Messerschmitt Bf 109 B-1 `Berta`"
 GER_bf_109_b1_airframe_short: "Bf 109 B-1"
 GER_bf_109_b1_airframe_desc: "Боевой конь нового Люфтваффе, Messerschmitt Bf 109, воплощает в себе последние достижения в области монопланов и поршневых двигателей. Bf 109 B-1 легко вооружен двумя 7,92-мм MG17 из-за хрупкой конструкции и использования более слабого двигателя. \n§RЭто совершенно новая модель, и она не сохранит эффективность§!"
  
 GER_bf_109_d1_airframe: "Messerschmitt Bf 109 D-1 `Berta`"
 GER_bf_109_d1_airframe_short: "Bf 109 D-1"
 GER_bf_109_d1_airframe_desc: "Bf 109 D-1 представляет собой усовершенствованную версию более ранней модели, в которой усилены крылья и добавлены два дополнительных 7,92-мм пулемета MG 17, установленных в крыльях. \n§GЭто позволит сохранить 95% эффективности и перейти от более ранних моделей.§!"
  
 GER_bf_109_e4_airframe: "Messerschmitt Bf 109 E-4 `Emil`"
 GER_bf_109_e4_airframe_short: "Bf 109 E-4"
 GER_bf_109_e4_airframe_desc: "Bf 109 E-4 — это первая крупная переделка планера 109, которая улучшает уровень защиты пилота и представляет две недавно разработанные 20-мм пушки MG FF/M в крыльях. Более крупный и мощный двигатель Daimler-Benz DB 601A обеспечивает значительное увеличение производительности по сравнению с более ранними моделями. \n§GЭто позволит сохранить 95% эффективности и перейти от более ранних моделей.§!"
  
 GER_bf_109_e7_airframe: "Messerschmitt Bf 109 E-7 `Emil`"
 GER_bf_109_e7_airframe_short: "Bf 109 E-7"
 GER_bf_109_e7_airframe_desc: "Bf 109 E-7 улучшает самую большую слабость ранних 109, а именно ограниченную дальность и недостаточную мощность. Сбрасываемый бак и новый двигатель DB 601N делают его существенным улучшением по сравнению с E-4.\n§GЭто сохранит 95% эффективности и преобразует из более ранних моделей.§!"
  
 GER_bf_109_f4_airframe: "Messerschmitt Bf 109 F-4 `Friedrich`"
 GER_bf_109_f4_airframe_short: "Bf 109 F-4"
 GER_bf_109_f4_airframe_desc: "Вторая радикальная переделка планера 109. F-4 значительно улучшает аэродинамические характеристики 109. Новый улучшенный двигатель Daimler-Benz DB 601E позволяет этому самолету быть одним из лучших в мире в свое время. Это достигается ценой сокращения вооружения до одного 20-мм MG 151/20 и двух 7,92-мм MG17, но центрирования их в носу.\n§YЭто сохранит эффективность, но не может быть преобразовано из предыдущей модели.§!"
  
 GER_bf_109_g6_airframe: "Messerschmitt Bf 109 G-6 `Gustav`"
 GER_bf_109_g6_airframe_short: "Bf 109 G-6"
 GER_bf_109_g6_airframe_desc: "В основном идентичен серии F. Однако 7,92-мм MG17 заменены на более крупнокалиберные 13-мм MG 131 для повышения летальности, а также был введен немного улучшенный двигатель DB 605A. \n§GЭто сохранит 95% эффективности и преобразует из $GER_bf_109_f4_airframe$§!"
  
 GER_bf_109_k4_airframe: "Messerschmitt Bf 109 K-4 `Gustav`"
 GER_bf_109_k4_airframe_short: "Bf 109 K-4 `Kurfürst`"
 GER_bf_109_k4_airframe_desc: "Новый 30-мм MK 108 заменяет 20-мм автоматические пушки предыдущих моделей, а дополнительные усовершенствования двигателя сделали этот вариант самым быстрым и самым тяжеловооруженным 109-м за всю войну. Планер Bf 109 к этому моменту в значительной степени достиг предела в плане улучшений, с которыми он справляется. \n§GЭто сохранит 95% эффективности и переделки из более ранних моделей.§!"
  
 GER_fw_190_a2_airframe: "Focke-Wulf Fw 190 A-2 `Würger`"
 GER_fw_190_a2_airframe_short: "Fw 190 A-2 `Würger`"
 GER_fw_190_a2_airframe_desc: "Разработанный Куртом Танком в Focke-Wulf, Fw 190 имеет потенциал стать основой Jagdwaffe Люфтваффе. A-2 представляет мощный двигатель BMW 801C-2, позволяющий ему нести тяжелый арсенал из двух установленных в корне крыла 20-мм MG 151, двух установленных на фюзеляже 7,92-мм MG 17 и двух установленных на крыльях 20-мм MG FF/M. \n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_fw_190_a4_airframe: "Focke-Wulf Fw 190 A-4 `Würger`"
 GER_fw_190_a4_airframe_short: "Fw 190 A-4 `Würger`"
 GER_fw_190_a4_airframe_desc: "Оснащенный более мощным двигателем BMW 801 D-2, самолет A-4 мог нести ракеты и бомбы, а также хорошо выполнять функции штурмовика.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 GER_fw_190_a6_airframe: "Focke-Wulf Fw 190 A-6 `Würger`"
 GER_fw_190_a6_airframe_short: "Fw 190 A-6 `Würger`"
 GER_fw_190_a6_airframe_desc: "Было введено структурно переработанное и более легкое крыло, а обычное вооружение было улучшено путем замены пушек MG FF на две 20-мм пушки MG 151/20E. Смещенный центр тяжести и более легкие крылья также обеспечивают улучшенную маневренность.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_fw_190_d9_airframe: "Focke-Wulf Fw 190 D-9 `Dora`"
 GER_fw_190_d9_airframe_short: "Fw 190 D-9"
 GER_fw_190_d9_airframe_desc: "Fw 190 `Dora` оснащен двухступенчатым двигателем Junkers Jumo 213E с наддувом, что делает D-9 фантастическим истребителем завоевания превосходства в воздухе. Огневая мощь дополнительно улучшена двумя установленными на фюзеляже 13-мм MG 131, заменяющими MG 17, а также опциями для более крупных пушек и форсированных двигателей.\n§YЭто сохранит 95% эффективности, но конвертация из предыдущей модели невозможна.§!"
  
 GER_ta_152_airframe: "Focke-Wulf Ta 152 H-1 `Würger`"
 GER_ta_152_airframe_short: "Ta 152 H-1 `Würger`"
 GER_ta_152_airframe_desc: "Лучший истребитель Курта Танка, Ta 152, представляет собой удлиненный фюзеляж Fw 190 D-9 с увеличенным размахом крыльев. Массивный двигатель Daimler-Benz DB603 делает Ta-152 одним из самых быстрых поршневых истребителей в мире. Модель C-3 жертвует маневренностью ради арсенала из 30-мм пушки MK103 и четырех 20-мм пушек MG151/20, стреляющих через пропеллер. С другой стороны, модель H-1 — это чистый истребитель с максимальной маневренностью.\n§GЭто сохранит 95% эффективности от $GER_fw_190_d9_airframe$§!"
  
 GER_me_262_a1a_airframe: "Messerschmitt Me 262 A-1a `Schwalbe`"
 GER_me_262_a1a_airframe_short: "Me 262 A-1a `Schwalbe`"
 GER_me_262_a1a_airframe_desc: "Первый реактивный истребитель, поступивший на вооружение, вооруженный 4 смертоносными 30-мм пушками MK108 и 2 реактивными двигателями Jumo 004. Этот истребитель превосходит все существующие винтовые конструкции, обладая большей скоростью, скороподъемностью и огневой мощью, чем большинство обычных конструкций. Однако его реактивные двигатели имеют чрезвычайно высокий расход топлива, ресурсов и стоимость производства.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_me_262_a1a_u4_airframe: "Messerschmitt Me 262 A-1a/U4 `Narwal`"
 GER_me_262_a1a_u4_airframe_short: "Me 262 A-1a/U4 `Narwal`"
 GER_me_262_a1a_u4_airframe_desc: "Narwal — это специализированная модификация, устанавливающая одну 50-мм скорострельную пушку MK214A для дополнительного удара по бомбардировщикам и тяжелой бронетехнике.\nТакже есть вариант A-1a/U1, вооруженный потрясающим арсеналом из шести носовых пушек, двух 20-мм пушек MG 151/20, двух 30-мм пушек MK 103 и двух 30-мм пушек MK 108, модификация U1 способна уничтожить любого врага. Однако все дополнительные пушки делают ее несколько перегруженной.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_me_262_hgi_airframe: "Messerschmitt Me 262 HG-I"
 GER_me_262_hgi_airframe_short: "Me 262 HG-I `Schwalbe`"
 GER_me_262_hgi_airframe_desc: "Чтобы еще больше повысить скорость Me 262, было предложено использовать стреловидные крылья. Хотя это пока не осуществимо, это привело к началу проекта HG (Hochgeschwindigkeit или высокоскоростной). HG-I по сути является модифицированным 262 с низкопрофильным фонарем, облегченной конструкцией и новейшими двигателями Jumo 004.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_me_262_hgii_airframe: "Messerschmitt Me 262 HG-II"
 GER_me_262_hgii_airframe_short: "Me 262 HG-II `Schwalbe`"
 GER_me_262_hgii_airframe_desc: "Более радикальный Hochgeschwindigkeit II (Me 262 HG II) имеет новое стреловидное крыло 35° с двигателями, смещенными ближе к фюзеляжу. He оснащен более мощными двигателями Jumo 004 и новым вооружением из 4 пушек MG213 калибра 20 мм. Пространство фюзеляжа также увеличено, чтобы можно было перевозить больше топлива внутри.\n§RЭто совершенно новая модель, и она не сохранит эффективность предыдущей модели.§!"
  
 GER_me_262_hgiii_airframe: "Messerschmitt Me 262 HG-III"
 GER_me_262_hgiii_airframe_short: "Me 262 HG-III `Schwalbe`"
 GER_me_262_hgiii_airframe_desc: "Hochgeschwindigkeit III (Me 262 HG III) имеет стреловидное крыло 45° и новейшую разработку в области реактивной техники — двигатели Heinkel HeS 011C, размещенные в корнях крыла. Вооруженный фантастическими 30-мм пушками MK213 и радаром, HG-III может быстро справиться практически со всем, что летает.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ho229_airframe: "Horten Ho 229"
 GER_ho229_airframe_short: "Ho 229"
 GER_ho229_airframe_desc: "Концепция `летающего крыла` воплотилась в жизнь. Пилот защищен специальным противоперегрузочным костюмом. В сочетании с реактивными двигателями Jumo 004C он позволяет ему выполнять экстремальные маневры. Высокая дальность полета может быть обречена на меньший вес или приличную бомбовую нагрузку.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_he_162_airframe: "Henschel He 162 `Spatz`"
 GER_he_162_airframe_short: "He 162"
 GER_he_162_airframe_desc: "Уникальная конструкция с одним реактивным двигателем, установленным на деревянном фюзеляже, что делает его простым в сборке и обслуживании. Страдая от малой дальности и довольно консервативного вооружения по сравнению с Me 262, он столь же маневренен, а также намного дешевле.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_ta_183_i_airframe: "Focke-Wulf Ta 183 I `Huckebein`"
 GER_ta_183_i_airframe_short: "Ta 183 I `Huckebein`"
 GER_ta_183_i_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_ta_183_ii_airframe: "Focke-Wulf Ta 183 II `Huckebein`"
 GER_ta_183_ii_airframe_short: "Ta 183 II `Huckebein`"
 GER_ta_183_ii_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_ar_197_airframe: "Arado Ar 197"
 GER_ar_197_airframe_short: "Ar 197"
 GER_ar_197_airframe_desc: "Биплан, отвечающий требованиям к палубному истребителю, Ar 197 оснащен двумя 20-мм пушками MG FF, двумя 7,96-мм пулеметами MG17 и фантастической дальностью полета, обеспечиваемой сбрасываемым топливным баком на фюзеляже.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_bf_109_t2_airframe: "Messerschmitt Bf 109 T-2"
 GER_bf_109_t2_airframe_short: "Bf 109 T-2"
 GER_bf_109_t2_airframe_desc: "По сути, это планер E-7, модифицированный с помощью хвостового крюка, катапультных приспособлений и увеличенного размаха крыльев, что позволяет ему взлетать с авианосцев.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_bf_109_t4_airframe: "Messerschmitt Bf 109 T-4"
 GER_bf_109_t4_airframe_short: "Bf 109 T-4"
 GER_bf_109_t4_airframe_desc: "По сути, это планер серии K, модифицированный хвостовым крюком, катапультными приспособлениями и увеличенным размахом крыльев, что позволяет ему взлетать с авианосцев.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_me_262_t_airframe: "Messerschmitt Me 262 T `Schwalbe`"
 GER_me_262_t_airframe_short: "Me 262 T `Schwalbe`"
 GER_me_262_t_airframe_desc: "Специальная модификация с тормозным крюком и воздушными тормозами позволяет Me 262 работать с авианосцев.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_ta_183_ti_airframe: "Focke-Wulf Ta 183 T-I `Huckebein`"
 GER_ta_183_ti_airframe_short: "Ta 183 T-I `Huckebein`"
 GER_ta_183_ti_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_ta_183_tii_airframe: "Focke-Wulf Ta 183 T-II `Huckebein`"
 GER_ta_183_tii_airframe_short: "Ta 183 T-II `Huckebein`"
 GER_ta_183_tii_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_fi_167_airframe: "Fieseler Fi 167"
 GER_fi_167_airframe_short: "Fi 167"
 GER_fi_167_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_bf_110_b1_airframe: "Messerschmitt Bf 110 B-1 `Zerstörer`"
 GER_bf_110_b1_airframe_short: "Bf 110 B-1"
 GER_bf_110_b1_airframe_desc: "Двухмоторный Zerstörer (истребитель, тяжелый истребитель). Bf 110 полагается на свое тяжелое вооружение, скорость и дальность полета, что делает его главным наступательным истребителем Люфтваффе. B-1 вооружен 2x MGFF 20-мм пушками, 4x 7,92-мм пулеметами MG17 LMG и одним оборонительным задним пулеметом MG15.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_bf_110_c4_airframe: "Messerschmitt Bf 110 C-4 `Zerstörer`"
 GER_bf_110_c4_airframe_short: "Bf 110 C-4"
 GER_bf_110_c4_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_bf_110_f2_airframe: "Messerschmitt Bf 110 F-2 `Zerstörer`"
 GER_bf_110_f2_airframe_short: "Bf 110 F-2"
 GER_bf_110_f2_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_bf_110_g2_airframe: "Messerschmitt Bf 110 G-2 `Zerstörer`"
 GER_bf_110_g2_airframe_short: "Bf 110 G-2"
 GER_bf_110_g2_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_me_410_a1_airframe: "Messerschmitt Me 410 A-1/U2 `Hornisse`"
 GER_me_410_a1_airframe_short: "Me 410 A"
 GER_me_410_a1_airframe_desc: "Me 410 A является результатом развития Me 210. Хотя он был разработан как скоростной бомбардировщик, он гораздо лучше работает как тяжелый истребитель. В общей сложности модификация A-1/U2 имеет впечатляющее вооружение из 4x 20-мм MG 151 и 2x 7,92-мм MG 17, а также 21-см тяжелых ракет.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_me_410_b1_airframe: "Messerschmitt Me 410 B-1/U2 `Hornisse`"
 GER_me_410_b1_airframe_short: "Me 410 B `Hornisse`"
 GER_me_410_b1_airframe_desc: "Me 410 B по сути является Me 410 A, но с большим запасом топлива, усиленным шасси и кислородной системой для полетов на большой высоте. B-1/U2 почти идентичен A-1/U2, за исключением замены легких пулеметов на 2x 13-мм пулемета MG 131.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_he_219_airframe: "Henschel He 219 A-2 `Uhu`"
 GER_he_219_airframe_short: "He 219 A-2 `Uhu`"
 GER_he_219_airframe_desc: "He 219 Uhu (`Филин`) — сравнительно сложный ночной истребитель, оснащенный усовершенствованным радаром `воздух-воздух`, катапультируемыми креслами и набором 20-мм и 30-мм пушек, включая 30-мм пушку Schräge Musik, стреляющую вверх.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_do_335_airframe: "Dornier Do 335 B-2 `Pfeil`"
 GER_do_335_airframe_short: "Do 335 B-2"
 GER_do_335_airframe_desc: "Благодаря уникальной конфигурации `тяни-толкай` и меньшему аэродинамическому сопротивлению за счет линейного расположения двух двигателей, Dornier Do 335 Pfeil (Arrow) является самым быстрым поршневым самолетом. Серия B оснащена мощными 2-мя 30-мм пушками MK103 в крыльях. Однако их можно заменить на радар `воздух-воздух`.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_do_17_z7_airframe: "Dornier Do 17 Z-7 `Kauz I`"
 GER_do_17_z7_airframe_short: "Do 17 Z-7"
 GER_do_17_z7_airframe_desc: "Хотя Do 17 не лучший в бомбардировке, сам планер надежен и достаточно гибок для других целей. Z-7 превращает Do 17 в тяжелый истребитель большой дальности, который хорошо подходит для сопровождения бомбардировщиков или обороны родины.\n§YЭто сохранит 90% эффективности и преобразует из $GER_do_17_z2_airframe$.§!"
  
 GER_do_217_j2_airframe: "Dornier Do 217 J-2"
 GER_do_217_j2_airframe_short: "Do 217 J-2"
 GER_do_217_j2_airframe_desc: "\n§YЭто совершенно новая модель, но она сохранит 90% эффективности и преобразуется из $GER_do_217_e2_airframe$§!"
  
 GER_do_217_n2_airframe: "Dornier Do 217 N-2"
 GER_do_217_n2_airframe_short: "Do 217 N-2"
 GER_do_217_n2_airframe_desc: "\n§GЭто позволит сохранить 95% эффективность от $GER_do_217_j2_airframe$§Y\n§YЭто позволит сохранить 90% эффективность и конвертировать модель $GER_do_217_k2_airframe$§!"
  
 GER_ju_88_c2_airframe: "Junkers Ju 88 C-2"
 GER_ju_88_c2_airframe_short: "Ju 88 C-2"
 GER_ju_88_c2_airframe_desc: "Zerstörer, истребитель-бомбардировщик и ночной истребитель, на базе серии A, но с носовой частью из листового металла, в которой размещены 3 20-мм пушки MG FF/M и 3 7,9-мм пушки MG17.\n§YЭто совершенно новая модель, но она сохранит 90% эффективности и будет преобразована из $GER_ju_88_a1_airframe$§!"
  
 GER_ju_88_c6_airframe: "Junkers Ju 88 C-6"
 GER_ju_88_c6_airframe_short: "Ju 88 C-6"
 GER_ju_88_c6_airframe_desc: "Тяжелый истребитель и радиоуправляемый ночной истребитель. He также может быть оснащен Schräge Musik (пушки, стреляющие вверх) для более специализированной роли перехватчика.\n§GЭто сохранит 95% эффективности от $GER_ju_88_c2_airframe$§!"
  
 GER_ju_388_j1_airframe: "Junkers Ju 388 J-1 `Störtebeker`"
 GER_ju_388_j1_airframe_short: "Ju 388 J-1"
 GER_ju_388_j1_airframe_desc: "Высотный тяжелый истребитель на базе $GER_ju_188_airframe$ с турбонаддувными радиальными двигателями BMW 801TJ. Вооружен арсеналом из 2x 30-мм MK 108 и 2x 20-мм MG 151 в носовой части, а также 2x пушек Schräge Musik.\n§YЭто совершенно новая модель, но сохранит 90% эффективности и переделает из $GER_ju_188_airframe$§!"
  
 GER_hs_123_airframe: "Henschel Hs 123 A-1"
 GER_hs_123_airframe_short: "Hs 123 A-1"
 GER_hs_123_airframe_desc: "Henschel Hs 123 — одноместный пикирующий бомбардировщик-биплан и штурмовик непосредственной поддержки. He оказался прочным и эффективным. Однако дальность полета достигается за счет ограниченной бомбовой нагрузки.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ju_87_a2_airframe: "Junkers Ju 87 A-2 `Stuka`"
 GER_ju_87_a2_airframe_short: "Ju 87 A-2 `Stuka`"
 GER_ju_87_a2_airframe_desc: "Конструкция Stuka включала несколько инноваций, таких как автоматические тормоза пикирования. Модель A-2 недостаточно мощна с двигателем Jumo 210D и имеет очень ограниченную дальность полета, но она более прочная и способна сбрасывать 500 кг бомб с хорошей точностью.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ju_87_b2_airframe: "Junkers Ju 87 B-2 `Stuka`"
 GER_ju_87_b2_airframe_short: "Ju 87 B-2"
 GER_ju_87_b2_airframe_desc: "B-2 улучшает Ju 87 с более мощным двигателем Jumo 211D, который обеспечивает ему лучшие летные характеристики, а также немного лучшую защиту. Однако он все еще ограничен в дальности и вооружении.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_ju_87_d1_airframe: "Junkers Ju 87 D-1 `Stuka`"
 GER_ju_87_d1_airframe_short: "Ju 87 D-1"
 GER_ju_87_d1_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_ju_87_d5_airframe: "Junkers Ju 87 D-5 `Stuka`"
 GER_ju_87_d5_airframe_short: "Ju 87 D-5"
 GER_ju_87_d5_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_hs_129_airframe: "Henschel Hs 129"
 GER_hs_129_airframe_short: "Hs 129 B-2"
 GER_hs_129_airframe_desc: "Henschel Hs 129 — одноместный двухмоторный штурмовик, созданный для борьбы с танками. Кабина и двигатели бронированы. Ограниченные характеристики были улучшены за счет использования французских двигателей Gnome-Rhone 14M. Огневая мощь обеспечивается двумя пулеметами MG 17 и двумя пушками MG 151. Под фюзеляжем находится универсальный подвес, на который можно установить как легкую бомбовую нагрузку, так и, что более важно, набор контейнеров с 30-мм и 37-мм противотанковыми пушками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 ger_cas_ad_tech_7: "Hs 129 B-3"
 ger_cas_ad_tech_7_desc: "В ответ на все более тяжелую броню на полях сражений требуются еще более крупные противотанковые пушки. 75-мм BK 7,5 — это монстр. Модифицированная версия почтенного PaK 40, она адаптирована для установки на проверенном Hs 129."
  
 GER_ju_187_airframe: "Junkers Ju 187 `Stuka`"
 GER_ju_187_airframe_short: "Ju 187"
 GER_ju_187_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_ju_187_c1_airframe: "Junkers Ju 187 C-1 `Stuka`"
 GER_ju_187_c1_airframe_short: "Ju 187 C-1"
  
 GER_ju_87_c_airframe: "Junkers Ju 87 C-1 `Stuka`"
 GER_ju_87_c_airframe_short: "Ju 87 C-1"
 GER_ju_87_c_airframe_desc: "Этот планер, оснащенный тормозным гаком и усиленным шасси, способен эксплуатироваться с авианосца.\n§YЭто совершенно новая модель, но она сохранит 90% эффективности от любой серии Ju 87 B.§!"
 cv_small_naval_bomber_airframeGER_ju_87_c_airframe: "Junkers Ju 87 D-4"
  
 GER_ju_87_r2_airframe: "Junkers Ju 87 R-2 `Stuka`"
 GER_ju_87_r2_airframe_short: "Ju 87 R-2 `Stuka`"
 GER_ju_87_r2_airframe_desc: "Замена серии C, модель R (Reichweite - Long Range) модифицирована 2 подвесными баками под крыльями, большим внутренним топливом и более мощным двигателем Junkers Jumo 211D. Увеличенный вес топлива ограничивает бомбовую нагрузку, но обеспечивает фантастическую дальность полета.\n§GЭто сохранит 95% эффективности предыдущей модели, как и 90% эффективности серии Ju 87 B.§!"
  
 GER_ju_87_r4_airframe: "Junkers Ju 87 R-4 `Stuka`"
 GER_ju_87_r4_airframe_short: "Ju 87 R-4 `Stuka`"
 GER_ju_87_r4_airframe_desc: "Улучшение по сравнению с версией Reichweite (большой дальности) за счет внедрения модернизации фюзеляжа от серии D, а также нового двигателя Junkers Jumo 211J, что позволяет нести более тяжелые бомбы.\n§GЭто сохранит 95% эффективности от предыдущей модели, как и 90% эффективности от серии Ju 87 D.§!"
  
 GER_me_262_a2a_airframe: "Messerschmitt Me 262 A-2a `Sturmvogel`"
 GER_me_262_a2a_airframe_short: "Me 262 A-2a `Sturmvogel`"
 GER_me_262_a2a_airframe_desc: "Окончательная версия бомбардировщика Me 262, сохранившая только две нижние 30-мм пушки MK 108. Хотя 1000 кг бомб не так опасны, как у других пикирующих бомбардировщиков, 262 имеет до 48 очень убедительных ракет R4M в свою пользу.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_me_1100_b_airframe: "Messerschmitt Me 1100 B `Feuersturm`"
 GER_me_1100_b_airframe_short: "Me 1100 B"
 GER_me_1100_b_airframe_desc: "Бомбардировочная разработка Me 262. Me 1100 имеет стреловидные крылья от проекта HG-II и новейший двигатель Jumo 004E. He способен доставить 2000 кг полезной нагрузки и набор пушек, чтобы уничтожить любую цель.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_ju_87_d4_airframe: "Junkers Ju 87 D-4"
 GER_ju_87_d4_airframe_short: "Ju 87 D-4 `Stuka`"
 GER_ju_87_d4_airframe_desc: "Ju 87 D-4 — это модель D, модифицированная специально для использования торпед в противокорабельных миссиях.\n§YЭто совершенно новая модель, но она сохранит 90% эффективности от любой серии Ju 87 D.§!"
  
 GER_ju_187_c2_airframe: "Junkers Ju 187 C-2"
 GER_ju_187_c2_airframe_short: "Ju 187 C-2"
 GER_ju_187_c2_airframe_desc: "\n§YЭто совершенно новая модель, но она сохранит 90% эффективности от любого Ju 187.§!"
  
 GER_me_262_a2c_airframe: "Messerschmitt Me 262 A-2c `Sturmvogel`"
 GER_me_262_a2c_airframe_short: "Me 262 A-2c `Sturmvogel`"
 GER_me_262_a2c_airframe_desc: "Хотя Me 262 недостаточно мощный, чтобы нести торпеду, а также достаточно топлива для морских миссий, кинетическую торпеду BT-700 можно нести как обычную бомбу.\n§YЭто совершенно новая модель, но она сохранит 90% эффективности от любой серии Me 262 A.§!"
  
 GER_me_1100_c_airframe: "Messerschmitt Me 1100 C `Schiffszerstörer`"
 GER_me_1100_c_airframe_short: "Me 1100 C `Schiffszerstörer`"
 GER_me_1100_c_airframe_desc: "Бомбардировочная модификация Me 262. Me 1100 имеет стреловидные крылья из проекта HG-II и новейший двигатель Jumo 004E. Модель C жертвует двумя пушками, чтобы освободить вес для торпедных и морских бомбовых установок, дополнительного внутреннего топлива и радара `воздух-поверхность`. Конструкция облегчена, а шасси улучшено для операций на авианосце.\n§RЭто совершенно новая модель, но она сохранит 90% эффективности от любой серии Me 1100.§Y§!"
  
 GER_fw_200_airframe: "Focke-Wulf Fw 200 C-0 `Condor`"
 GER_fw_200_airframe_short: "Fw 200 C-0"
 GER_fw_200_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 GER_fw_200_c3_airframe: "Focke-Wulf Fw 200 C-3 `Condor`"
 GER_fw_200_c3_airframe_short: "Fw 200 C-3"
 GER_fw_200_c3_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_fw_200_c4_airframe: "Focke-Wulf Fw 200 C-4 `Condor`"
 GER_fw_200_c4_airframe_short: "Fw 200 C-4"
 GER_fw_200_c4_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_bv_238_airframe: "Blohm & Voss BV 238"
 GER_bv_238_airframe_short: "BV 238"
 GER_bv_238_airframe_desc: "Самый большой и тяжелый самолет, когда-либо задуманный. BV 238 — это дальняя морская патрульная летающая лодка, оснащенная 6 двигателями DB603 и способная нести огромную нагрузку до 7000 кг бомб и почти 20 оборонительных орудий. Самолет может быть преобразован в обычный наземный бомбардировщик, если добавить дополнительные бомбовые отсеки.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ju_86_airframe: "Junkers Ju 86 D-1"
 GER_ju_86_airframe_short: "Ju 86 D-1"
 GER_ju_86_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
 medium_plane_scout_plane_airframeGER_ju_86_airframe: "Ju 86P"
 ger_fast_bomber_ad_tech_1: "Junkers Ju 86 D-1"

 GER_he_70_airframe: "Heinkel He 70 `Blitz`"
 GER_he_70_airframe_short: "He 70"
 GER_he_70_airframe_desc: "Начав свою жизнь как небольшой скоростной коммерческий самолет, он заслужил свое название «Блиц» после того, как установил новый стандарт в области высокоскоростных перевозок. Люфтваффе вскоре признала его потенциал в качестве легкого разведывательного бомбардировщика.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_he_111_h1_airframe: "Henschel He 111 H-1"
 GER_he_111_h1_airframe_short: "He 111 H-1"
 GER_he_111_h1_airframe_desc: "He 111 начал свою жизнь под видом гражданского авиалайнера. Тем не менее, первая специализированная военная версия, H-1, находит баланс между доставкой приличной бомбовой нагрузки при бомбометании с горизонтального полета, будучи при этом дешевым, надежным и простым в сборке. Это достигается ценой отсутствия защиты, а также ограниченной дальности, которую можно было бы в некоторой степени компенсировать дополнительным топливом в одном из бомбоотсеков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_he_111_h3_airframe: "Henschel He 111 H-3"
 GER_he_111_h3_airframe_short: "He 111 H-3"
 GER_he_111_h3_airframe_desc: "H-3, оснащенный усовершенствованным Jumo 211D, пытается решить проблемы защиты. Броня добавлена, и дополнительные пулеметы установлены везде, где это возможно, доведя их количество с 3 до 7. H-3 также адаптирован как торпедоносец с использованием внешних креплений.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_he_111_h6_airframe: "Henschel He 111 H-6"
 GER_he_111_h6_airframe_short: "He 111 H-6"
 GER_he_111_h6_airframe_desc: "Третья основная модель, H-6, представляет надежный двигатель Jumo 211F. Бомбовая нагрузка полностью перемещена на внешние стойки, которые также являются торпедными установками, освобождая внутреннее пространство для дополнительного топлива для увеличения дальности. Для улучшения защиты в качестве стандартной опции добавлена ​​20-мм пушка MG FF/M в носу.\n§YЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 GER_he_111_h16_airframe: "Henschel He 111 H-16"
 GER_he_111_h16_airframe_short: "He 111 H-16"
 GER_he_111_h16_airframe_desc: "Созданный на основе улучшенного H-6, H-16 имеет дополнительную броню и бронированные стекла, обновленные пулеметы MG81 и 13-мм MG131, а также радионавигационную систему для ночного бомбометания.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_he_111_h21_airframe: "Henschel He 111 H-21"
 GER_he_111_h21_airframe_short: "He 111 H-21"
 GER_he_111_h21_airframe_desc: "H-21 оснащен мощным двигателем Jumo 213E, что позволяет бомбардировщику нести еще больше бомб на большую дальность. Радар класса `воздух-земля` используется для улучшения ночных характеристик. Оборонительное вооружение улучшено путем замены дорсального крепления на силовую турель.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
  
 GER_do_217_e2_airframe: "Dornier Do 217 E-2"
 GER_do_217_e2_airframe_short: "Do 217 E-2"
 GER_do_217_e2_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
