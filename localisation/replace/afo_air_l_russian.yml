 FRA_br_1050_airframe: "Bréguet Br.1050 `Alizé`"
 FRA_br_1050_airframe_short: "Br.1050 `Alizé`"
 FRA_br_1050_airframe_desc: "Стремясь наконец обеспечить ВМС Франции полноценным палубным противолодочным самолетом большой дальности и не имея отечественных решений, Bréguet использовал новейший британский турбовинтовой двигатель Rolls-Royce Dart. Хотя в эпоху реактивной авиации он медлителен, большая дальность, хорошая защищенность и возможность нести радар и различное вооружение делают Alizé по-прежнему конкурентоспособным.\n§YДОСТУПНО, ЕСЛИ ВЫПОЛНЯЕТСЯ ЛЮБОЕ:§!\n§Y$FRA$§! состоит во фракции с §Y$ENG$§! или является ее марионеткой.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

