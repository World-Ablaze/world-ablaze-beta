 eng_strat_bomber_equipment_1_desc: "Armstrong-Whitworth Whitley — превосходный ранний бомбардировщик, способный надежно доставлять тяжелую полезную нагрузку благодаря мощности Rolls-Royce Merlin. Однако его легкое вооружение, скорее всего, потребует эскорта.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_strat_bomber_equipment_2: "Halifax"
 eng_strat_bomber_equipment_2_short: "Halifax"
 eng_strat_bomber_equipment_2_desc: "Модернизация до 4 двигателей вместо 2 позволяет Handley-Page Hampden почти вдвое увеличить полезную нагрузку по сравнению с Whitley. Его вооружение также лучше, добавлена ​​вторая счетверенная башня для .30 cal, но в этом отделе ему все еще не хватает.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_strat_bomber_equipment_3: "Lancaster"
 eng_strat_bomber_equipment_3_short: "Lancaster"
 eng_strat_bomber_equipment_3_desc: "Один из самых известных бомбардировщиков войны, Lancaster — это превосходное сочетание факторов в одном превосходном пакете; двигатели Rolls-Royce Merlin обеспечивают хорошую скорость для бомбардировщика и высокую надежность, а также позволяют ему нести одну из самых больших полезных нагрузок среди всех бомбардировщиков Второй мировой войны на огромной дальности. Однако сохранение .30 cal для обороны — одна из единственных слабостей Lancaster.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_strat_bomber_equipment_4: "Lincoln"
 eng_strat_bomber_equipment_4_short: "Lincoln"
 eng_strat_bomber_equipment_4_desc: "Улучшение базовой конструкции Lancaster, Lincoln наконец-то дает приличный прирост вооружения, оснащая .50 cal и 20mm пушки. Улучшения почти во всех областях идут в ногу с высокой стоимостью производства.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_strat_bomber_equipment_5: "Windsor"
 eng_strat_bomber_equipment_5_short: "Windsor"
 eng_strat_bomber_equipment_5_desc: "Новая разработка Vickers, Windsor использует обтекаемый передний нос для повышения эффективности, что позволяет ему снова добиться незначительных улучшений почти во всех областях. Однако, по сравнению с современниками, он теперь начинает страдать в таких областях, как дальность полета.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_jet_strat_bomber_equipment_1: "Valiant"
 eng_jet_strat_bomber_equipment_1_short: "Valiant"
 eng_jet_strat_bomber_equipment_1_desc: "Бомбардировщики Великобритании вступают в реактивную эру с самолетом мирового класса. Victor — один из самых технически продвинутых самолетов в небе, способный перевозить огромную полезную нагрузку на большие расстояния и с высокой скоростью.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
  
