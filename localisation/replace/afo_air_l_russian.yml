 ger_attacker_equipment_1: "Bf 110 B-1 `Zerstörer`"
 ger_attacker_equipment_1_short: "Bf 110 B-1"
 ger_attacker_equipment_1_desc: "Двухмоторный Zerstörer (истребитель, тяжелый истребитель). Bf 110 полагается на свое тяжелое вооружение, скорость и дальность полета, что делает его главным наступательным истребителем Люфтваффе. B-1 вооружен 2x MGFF 20-мм пушками, 4x 7,92-мм пулеметами MG17 LMG и одним оборонительным задним пулеметом MG15.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
