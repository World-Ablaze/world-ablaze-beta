 ENG_sunderland_mki_airframe_short: "Sunderland Mk I"
 ENG_sunderland_mki_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
