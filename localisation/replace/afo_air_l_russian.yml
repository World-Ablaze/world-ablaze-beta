 ita_strike_bomber_ad_tech_2: "Конверсия тяжелого истребителя SM.89"
 ita_strike_bomber_ad_tech_2_desc: "Переделка фюзеляжа SM.84 в тяжелый истребитель. Вооруженный двумя 37-мм пушками Breda, а также множеством 12,7-мм пулеметов Breda, бомбами и пикирующими тормозами, он обладает достаточной мощью, чтобы разбить практически любую наземную цель. Торпедная установка придает ему дополнительную полезность против кораблей. Выживаемость повышается за счет большого количества брони, включая всю кабину и двигатели."
