 ita_strategic_bomber_ad_tech_2: "Piaggio P.108 `Artigliere`"
 ita_strategic_bomber_ad_tech_2_desc: "В ответ на требования по борьбе с корабельным оружием самолет P.108A преобразует большой бомбардировщик в патрульный самолет с мощной 102-мм пушкой 102/35 mod.14, а также тремя торпедами.\n§YЭто позволит сохранить 90% эффективности от $ITA_p_108_airframe$ за то, что он является частью семейства.§!""
 
 ITA_p_108a_airframe: "Piaggio P.108A Serie 2 `Artigliere`"
 ITA_p_108a_airframe_short: "P.108A"
 ITA_p_108a_airframe_desc: "В качестве ответа на требования по борьбе с морскими целями, P.108A переоборудует большой бомбардировщик в патрульный самолет, оснащенный массивной 102-мм пушкой 102/35 mod.14, а также тремя торпедами.\n§YЭто сохранит 90% эффективности от $ITA_p_108_airframe$ как части семейства.§!"
  
