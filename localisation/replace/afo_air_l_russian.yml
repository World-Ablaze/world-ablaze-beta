 sov_fighter_multirole_equipment_4_short: "И-16 Тип 29"
 sov_fighter_multirole_equipment_4_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 sov_fighter_multirole_equipment_5: "ЛаГГ-3"
 sov_fighter_multirole_equipment_5_short: "ЛаГГ-3"
 sov_fighter_multirole_equipment_5_desc: "Lavochkin-Gorbunov-Gudkov LaGG-3 представляет собой радикальный отход от старых конструкций легких истребителей. Однако, несмотря на свою деревянную конструкцию, LaGG-3 облегчен своим набором из 2x 7,6-мм ШКАС, 12,7-мм УБС, 20-мм самоходных пушек ШВАК и 200 кг бомб. Добавьте к этому маломощный двигатель и деревянную раму, склонную к деформации, и LaGG-3 будет трудно впечатлить своими характеристиками.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 sov_fighter_multirole_equipment_6: "Ла-5"
 sov_fighter_multirole_equipment_6_short: "Ла-5"
 sov_fighter_multirole_equipment_6_desc: "Для решения проблем мощности и производительности ЛаГГ-3 был выбран более мощный радиальный двигатель для замены старого с водяным охлаждением. Планер и крылья теперь имеют смешанную металло-деревянную конструкцию, что освободило вес и пространство для увеличения размера топливных баков и позволило значительно увеличить дальность полета. Старое громоздкое вооружение также полностью заменено на 2x 20-мм пушки ШВАК СП, что обеспечивает лучший баланс между огневой мощью и производительностью.\n§GЭто сохранит 95% эффективности от $sov_fighter_multirole_equipment_5$§!"
  
 sov_fighter_multirole_equipment_7: "Ла-5ФН"
 sov_fighter_multirole_equipment_7_short: "Ла-5ФН"
 sov_fighter_multirole_equipment_7_desc: "Новая система впрыска топлива, усовершенствования фюзеляжа и дальнейшее облегчение планера наконец-то могут раскрыть весь потенциал Ла-5, несмотря на меньшую дальность из-за повышенного расхода топлива. Это приводит к значительно улучшенной маневренности, максимальной скорости и лучшей выживаемости.\n§GЭто сохранит 95% эффективности и может конвертироваться из $sov_fighter_multirole_equipment_6$§!"
  
 sov_fighter_multirole_equipment_8: "Ла-7"
 sov_fighter_multirole_equipment_8_short: "Ла-7"
 sov_fighter_multirole_equipment_8_desc: "Последний и вершина семейства La, La-7 включает в себя многие уроки от La-5FN в улучшенный, цельнометаллический и обтекаемый самолет. Две пушки ШВАК также заменены на 3x 20-мм пушки B-20S, что еще больше увеличивает огневую мощь истребителя.\n§GЭто сохранит 95% эффективности от $sov_fighter_multirole_equipment_7$§!"
  
 sov_fighter_multirole_equipment_9: "Ла-9"
 sov_fighter_multirole_equipment_9_short: "Ла-9"
 sov_fighter_multirole_equipment_9_desc: "Несмотря на название, сходство с Ла-7 лишь поверхностное. Ла-9 имеет цельнометаллическую конструкцию и крыло с ламинарным обтеканием. Экономия веса за счет исключения дерева из планера самолета позволяет значительно увеличить запас топлива, 4 пушки НС-23С калибра 23 мм и 500-кг бомбовое вооружение.\n§GЭто сохранит 95% эффективности от $sov_fighter_multirole_equipment_8$§!"
  
