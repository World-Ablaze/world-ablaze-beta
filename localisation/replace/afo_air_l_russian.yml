 GER_do_217_k2_airframe_short: "Do 217 K-2"
 GER_do_217_k2_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_do_217_m11_airframe: "Dornier Do 217 M-11"
 GER_do_217_m11_airframe_short: "Do 217 M-11"
 GER_do_217_m11_airframe_desc: "\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 GER_he_45_c_airframe: "Henschel He 45C"
 GER_he_45_c_airframe_short: "He 45C"
 GER_he_45_c_airframe_desc: "Heinkel He 45 был легким бомбардировщиком, произведенным в Германии в начале 1930-х годов, одним из первых самолетов, принятых на вооружение недавно сформированными Люфтваффе. Разработанный как биплан общего назначения, он использовался Люфтваффе для разведки и легких бомбардировок.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 medium_fighter_airframeGER_he_45_c_airframe: "He 45"
 medium_scout_airframeGER_he_45_c_airframe: "He 45 В1"
  
 GER_do_17_e_airframe: "Dornier Do 17 E"
 GER_do_17_e_airframe_short: "Do 17 E"
 GER_do_17_e_airframe_desc: "Конструкция Do 17, разработанная в начале 30-х годов, была создана как Schnellbomber («быстрый бомбардировщик») с целью превзойти по скорости любой истребитель того времени. Характеристики самолета улучшались за счет тонкого фюзеляжа, что, однако, приводило к снижению бомбовой нагрузки. Оптимизированный для скорости, Do 17 E не имел брони и был вооружен только тремя пулеметами для защиты.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 GER_do_17_z2_airframe: "Dornier Do 17 Z-2"
 GER_do_17_z2_airframe_short: "Do 17 Z-2"
 GER_do_17_z2_airframe_desc: "Очень неудовлетворительные характеристики Do 17 E привели к его капитальной переработке с установкой новых, более мощных двигателей — радиальных BMW Bramo 323. Новая модель «Z» наконец-то сделала Do 17 настоящим скоростным бомбардировщиком с достаточной мощностью и пространством, позволяющим удвоить бомбовую нагрузку и установить больше пулеметов и средств защиты, чем у его предшественника.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
 medium_fighter_airframeGER_do_17_z2_airframe: "Dornier Do 17 Z-7"
 medium_scout_airframeGER_do_17_z2_airframe: "Dornier Do 17 P"
  
 GER_ju_88_a1_airframe: "Junkers Ju 88 A-1 `Dreifinger`"
 GER_ju_88_a1_airframe_short: "Ju 88 A-1 `Dreifinger`"
 GER_ju_88_a1_airframe_desc: "Разработанный как так называемый Schnellbomber (`быстрый бомбардировщик`), Ju 88 представляет собой очень гибкий планер, который может использоваться как бомбардировщик, пикирующий бомбардировщик, ночной истребитель, торпедоносец и разведывательный самолет. A-1 поставляется с двигателями Jumo 211B\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 medium_fighter_airframeGER_ju_88_a1_airframe: "Ju 88 C-1"
 medium_scout_airframeGER_ju_88_a1_airframe: "Ju 88 D-1"
  
 GER_ju_88_a4_airframe: "Junkers Ju 88 A-4 `Dreifinger`"
 GER_ju_88_a4_airframe_short: "Ju 88 A-4 `Dreifinger`"
 GER_ju_88_a4_airframe_desc: "Улучшенный вариант. Увеличенный размах крыльев за счет измененных законцовок крыльев. Более мощное оборонительное вооружение. Мощность обеспечивается двигателями Jumo 211J. Усиленное шасси. Возможность установки большего количества внешних бомбодержателей и торпедных аппаратов.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 medium_fighter_airframeGER_ju_88_a4_airframe: "Ju 88 C-4"
 medium_scout_airframeGER_ju_88_a4_airframe: "Ju 88 D-2"
  
 GER_ju_188_airframe: "Junkers Ju 188 A-2 "Rächer""
 GER_ju_188_airframe_short: "Ju 188 A-2 `Rächer`"
 GER_ju_188_airframe_desc: "Продолжение Ju 88. He отличается большим количеством оборонительного вооружения и изменениями в планере. Хотя он и задуман как легкий быстрый бомбардировщик, Ju 188 все еще имеет весьма солидную бомбовую нагрузку до 3000 кг.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 medium_fighter_airframeGER_ju_188_airframe: "Ju 388 J"
 medium_scout_airframeGER_ju_188_airframe: "Ju 388 L"
  
 GER_ju_288_airframe: "Junkers Ju 288 C"
 GER_ju_288_airframe_short: "Ju 288 C"
 GER_ju_288_airframe_desc: "Разработан для проекта Bomber B как (быстрый бомбардировщик), призванный заменить все текущие конструкции. Однако Ju 288 не имеет никакого отношения к Ju 88, 188 или 388. Ju 288 представляет собой бомбардировщик, который больше, герметичен для больших высот, имеет большую дальность полета, гораздо большую бомбовую нагрузку, еще быстрее и имеет улучшенную оборонительную огневую мощь.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
 medium_fighter_airframeGER_ju_288_airframe: "Ju 288 D"
 medium_scout_airframeGER_ju_288_airframe: "Ju 288 B"
  
 GER_ar_234_b_airframe: "Arado Ar 234 B-2 `Blitz`"
 GER_ar_234_b_airframe_short: "Ar 234 B-2"
 GER_ar_234_b_airframe_desc: "Первый в мире реактивный бомбардировщик. Несколько ограниченный всего 1500 кг внешних бомб, отсутствием оборонительного вооружения и небольшой броней, его большая скорость, однако, позволяет ему обгонять большинство врагов и успешно выполнять свои миссии.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_ar_234_c_airframe: "Arado Ar 234 C-3 `Blitz`"
 GER_ar_234_c_airframe_short: "Ar 234 C-3 `Blitz`"
 GER_ar_234_c_airframe_desc: "Проблемы с двигателями Jumo привели к версии C, которая оснащена более легкими двигателями BMW 003. Четыре двигателя, а также усовершенствования планера значительно увеличивают максимальную скорость и максимальную дальность полета.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 GER_ho_267_airframe: "Horten Ho 267"
 GER_ho_267_airframe_short: "Ho 267"
 GER_ho_267_airframe_desc: "Дальний бомбардировщик, созданный на основе проекта бомбардировщика Horten Ho XVIIIB с летающим крылом. По сути, это увеличенная версия реактивного истребителя Ho 229. Довольно тяжелый для среднего бомбардировщика, Ho 267, тем не менее, способен перевозить тяжелые грузы на дальние расстояния с высокой скоростью и приличной маневренностью благодаря мощным реактивным двигателям Heinkel HeS 053.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_fw_239_airframe: "Focke-Wulf Fw 239 `1000x1000x1000`"
 GER_fw_239_airframe_short: "Fw 239"
 GER_fw_239_airframe_desc: "Инновационный двухреактивный бомбардировщик, рожденный из проекта 1000x1000x1000: способность нести 1000-килограммовую бомбу на дальность 1000 км со скоростью 1000 км/ч. Несмотря на хрупкость и безоружность, двигатели Heinkel HeS 011A, а также конструкция крыла придают ему исключительную маневренность для бомбардировщика и достаточную скорость, чтобы обогнать практически любой обычный самолет. Новые двигатели, а также дополнительное топливо позволяют ему достичь приличной дальности. Это также можно обменять на большее количество бомб\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 GER_Fw_1000_airframe: "Focke-Wulf Fw 1000"
 GER_Fw_1000_airframe_short: "Fw 1000"
 GER_Fw_1000_airframe_desc: "Межконтинентальный бомбардировщик, рожденный из проекта бомбардировщика 1000x1000x1000. Увеличенная версия Fw 239, Fw 1000 способен перевозить тяжелые грузы на большие расстояния, не жертвуя скоростью своего предшественника, благодаря мощности реактивных двигателей Heinkel HeS 053.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ju_89_airframe: "Junkers Ju 89 A-1"
 GER_ju_89_airframe_short: "Ju 89 A-1"
 GER_ju_89_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
 large_maritime_patrol_airframeGER_ju_89_airframe: "Junkers Ju 290"
  
