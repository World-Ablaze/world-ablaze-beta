 usa_fighter_ad_tech_5: "Модернизация североамериканского самолета P-51H"
 usa_fighter_ad_tech_5_desc: "P-51H по праву можно считать вершиной P-51 Mustang. Сочетание облегченного планера и мощного двигателя Packard V-1650-9, выдающего колоссальные 2000+ л. с., делает P-51H вершиной винтовых истребителей, которая может конкурировать даже с ранними реактивными самолетами!"
  
