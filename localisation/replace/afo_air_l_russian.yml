 SOV_r_5t_airframe: "Поликарпов Р-5Т"
 SOV_r_5t_airframe_short: "Р-5Т"
 SOV_r_5t_airframe_desc: "Универсальный биплан, легкий бомбардировщик, в основном деревянной конструкции. R-5T использует способность самолета нести хорошую нагрузку и превращает его в торпедоносец. Short взлет делает его даже жизнеспособным для будущих проектов авианосцев.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§! §GНо он может конвертироваться из $SOV_r_5sh_airframe$§!"
  
 SOV_r_9t_airframe: "Кочеригин Р-9Т"
 SOV_r_9t_airframe_short: "Р-9Т"
 SOV_r_9t_airframe_desc: "Первоначально разработанный из разведывательного самолета как высокоскоростной штурмовик, он позже трансформировался в пикирующий бомбардировщик. Однако грузоподъемность и большой клиренс означали, что он также мог нести торпеду, а также большой массив или вооружение в крыльях. Оснащенный радиальным двигателем М-88, обеспечивающий R-9 впечатляющие характеристики для своего класса.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 SOV_spb_2_airframe: "Поликарпов СПБ-2"
 SOV_spb_2_airframe_short: "СПБ-2"
 SOV_spb_2_airframe_desc: "SPB — это скоростной бомбардировщик, разработанный на основе проекта истребителя танков (VIT). Двойные двигатели M-105 и усиленный фюзеляж и крылья позволяют нести на борту набор пулеметов и пушек, а также солидную бомбовую или торпедную нагрузку, и при этом пользоваться защитой полностью бронированной кабины.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_che_4_airframe: "Четвериков Че-4"
 SOV_che_4_airframe_short: "Че-4"
 SOV_che_4_airframe_desc: "Первый проект для специального торпедоносца-носителя. Проект, обозначенный как ПТ-1М-82, был поручен Четверикову. Созданный вокруг мощного двигателя М-82, Че-4 способен нести традиционную бомбовую и торпедную нагрузку, но на гораздо большие расстояния, используя внешние топливные баки. Его также можно было быстро переоборудовать в эффективный пикирующий бомбардировщик с воздушными тормозами и ракетами.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_il_2t_airframe: "Ил-2Т"
 SOV_il_2t_airframe_short: "Ил-2Т"
 SOV_il_2t_airframe_desc: "Хотя изначально это была полевая модификация Ил-2, вскоре стало ясно, что он может довольно надежно монтировать торпеду под фюзеляжем.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_il_10t_airframe: "Ил-10Т"
 SOV_il_10t_airframe_short: "Ил-10Т"
 SOV_il_10t_airframe_desc: "Торпедная модификация Ил-10.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_tu_14t_airframe: "Ту-14Т `Боцман`"
 SOV_tu_14t_airframe_short: "Ту-14Т"
 SOV_tu_14t_airframe_desc: "Ту-14Т был разработан как конкурент бомбардировщику Ил-28. Проект привел к тому, что Ту-14Т использовался как торпедоносец, поскольку его характеристики как бомбардировщика были признаны уступающими. Тем не менее, он имеет большой отсек, который может вместить 3000 кг бомб, мин или нескольких торпед.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_mbr_2_airframe: "Бериев МБР-2"
 SOV_mbr_2_airframe_short: "МБР-2"
 SOV_mbr_2_airframe_desc: "Многоцелевой, в основном деревянный летающий катер с двигателем Микулина М-17. Способный на приличную дальность и несущий скромное бомбовое или минное вооружение, он, тем не менее, очень дешев для своей роли.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
