 ITA_sm_82a_airframe: "Savoia-Marchetti SM.82A `Canguru`"
 ITA_sm_82a_airframe_short: "SM.82A"
 ITA_sm_82a_airframe_desc: "Motobomba FFF — это электрическая торпеда с прямолинейным ходом, которая движется концентрическими спиралями до тех пор, пока не обнаружит свою цель. Из-за небольшой боеголовки только массовое применение могло максимизировать её эффект, и только SM.82 обладает достаточной грузоподъемностью и дальностью полета для такой миссии.\n§YЭто сохранит 90% эффективности от $ITA_sm_82_airframe$ как части семейства.§!"
  
 ITA_p_108_airframe: "Piaggio P.108 `Bombardiere`"
