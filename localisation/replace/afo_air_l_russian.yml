l_russian:
  
  

 FRA_d_501_airframe: "Dewoitine D.501"
 FRA_d_501_airframe_short: "D.501"
 FRA_d_501_airframe_desc: "Подвариант D.500 более ранних лет, который должен был заменить авиационный флот Первой мировой войны. D.501 — цельнометаллический моноплан с инновационным двигателем Hispano-Suiza 12Xbrs/Xcrs, который позволяет установить пушку через втулку пропеллера, если такая будет разработана. Вооружение приличное для своего класса: 4 пулемета MAC и Darne калибра 7,5 мм, а также приличная для своего класса защита с легкой броней и противопожарной системой.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_d_510_airframe: "Dewoitine D.510"
 FRA_d_510_airframe_short: "D.510"
 FRA_d_510_airframe_desc: "Внедрение 20-мм пушки Hispano HS.9 значительно увеличивает огневую мощь по сравнению с традиционными легкими пулеметами. Новое поколение двигателей Hispano-Suiza, 12Ycrs, повышает характеристики D.510 до новых высот, делая его одним из лучших в мире среди аналогичных моделей.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"

 FRA_ms_405_airframe: "Morane-Saulnier MS.405"
 FRA_ms_405_airframe_short: "MS.405"
 FRA_ms_405_airframe_desc: "Победитель конкурса на создание нового истребителя, проект Morane-Saulnier, стал первым французским монопланом с низкорасположенным крылом, закрытым кокпитом и убирающимся шасси. Хотя двигатель и вооружение остались такими же, как у проверенного D.510, новый аэродинамический фюзеляж позволяет MS.450 развивать гораздо более высокую скорость, а смешанная конструкция и массовое производство позволяют снизить стоимость.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_ms_406_airframe: "Morane-Saulnier MS.406"
 FRA_ms_406_airframe_short: "MS.406"
 FRA_ms_406_airframe_desc: "Окончательная версия истребителя Morane-Saulnier. Новая облегченная конструкция крыла позволяет ему нести дополнительный вес в виде подвесных баков для увеличения дальности полета. Двигатель Hispano-Suiza 12Y-31 оптимизирован для работы на больших высотах, что позволяет MS.406 летать быстрее, чем раньше. Вооружение в основном осталось прежним, за исключением новой 20-мм пушки HS.404.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"

 FRA_ms_410_airframe: "Morane-Saulnier MS.410"
 FRA_ms_410_airframe_short: "MS.410"
 FRA_ms_410_airframe_desc: "Признавая недостатки MS.406, MS.410 представляет собой попытку модернизировать саму базовую конструкцию. Новые крылья позволяют разместить внутри 4 пулемёта MAC. Переработанный радиатор и выхлопные эжекторы добавляют дополнительную тягу, позволяя самолёту сохранять маневренность и летать ещё быстрее, несмотря на увеличение веса за счёт добавленной брони и вооружения. Важным дополнением к защите является внедрение самоуплотняющихся топливных баков.\n§YThis will retain efficiency but cannot convert from the $FRA_ms_406_airframe$.§!"
 fra_fighter_ad_tech_5: "Morane-Saulnier MS.450 Upgrade Package"
 fra_fighter_ad_tech_5_desc: "Модели Morane-Saulnier долгое время страдали от слабых, маломощных двигателей. Наконец-то это можно изменить. Новейший двигатель Hispano 12Zter, а также полностью металлический фюзеляж кардинально меняют характеристики MS.450, наконец-то выводя его на один уровень с конкурентами."

 FRA_vg_36_airframe: "Arsenal VG.36"
 FRA_vg_36_airframe_short: "VG.36"
 FRA_vg_36_airframe_desc: "Компания Arsenal, возглавляемая Верниссом и Готье, представила серию VG как решение для современного истребителя, не зависящего от ограниченных запасов алюминия. После успеха прототипов VG.33, VG.36 усовершенствовал планер и добавил более мощный высотный двигатель Hispano-Suiza 12Y-51, который делает его почти таким же хорошим, как и первоначально предполагалось. Мощное вооружение из 4 крыльевых пушек MAC и центральной пушки HS.404 делает этот истребитель очень хорошим вариантом при ограниченном бюджете.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_vg_39_airframe: "Arsenal VG.39"
 FRA_vg_39_airframe_short: "VG.39"
 FRA_vg_39_airframe_desc: "Полностью металлическая переработка VG.36 с целью установки более мощного двигателя Hispano-Suiza 12ZTer, что в конечном итоге позволило достичь запланированной скорости свыше 600 км/ч. Вооружение усилено 6 пулемётами на крыльях, а также улучшена защита.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_36_airframe$, поскольку оно является его частью.§!"

 FRA_vg_60_airframe: "Arsenal VG.60"
 FRA_vg_60_airframe_short: "VG.60"
 FRA_vg_60_airframe_desc: "Хотя двигатель Hispano-Suiza 12Z-17 был предназначен для второй версии VG.39, дополнительная мощность открыла возможность для многих усовершенствований, в результате чего весь планер был радикально изменен. Усовершенствованный VG.60 может развивать невероятную скорость, при этом оставаясь достаточно маневренным, учитывая увеличение количества и качества вооружения крыла до 11-мм тяжелых пулеметов MAC.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_36_airframe$, поскольку оно является его частью.§!"

 FRA_vg_71_airframe: "Arsenal VG.71"
 FRA_vg_71_airframe_short: "VG.71"
 FRA_vg_71_airframe_desc: "TVG.70 изначально был исследовательским самолетом для изучения стреловидных крыльев в эпоху реактивных двигателей. VG.71 является результатом этих исследований. Продолжая традиции Arsenal с использованием смешанной конструкции для удешевления производства, VG.71 оснащен отечественным турбореактивным двигателем SNECMA Atar 101A, который обеспечивает высокую, хотя и ненадежную тягу. 3 пушки HS.830 калибра 30 мм обеспечивают высокую огневую мощь, сосредоточенную в носовой части. Крепления на крыльях позволяют устанавливать бомбовые подвески. Несмотря на все это, самолет немного страдает в плане дальности полета и защиты.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_36_airframe$, поскольку оно является его частью.§!"

 FRA_vg_92_airframe: "Arsenal VG.92"
 FRA_vg_92_airframe_short: "VG.92"
 FRA_vg_92_airframe_desc: "Серия VG.90 была создана в ответ на запрос ВМС на новый реактивный перехватчик и ударный истребитель. VG.92 — это наземная версия с турбореактивным двигателем ATAR 101B, который позволяет ему сохранять хорошую маневренность, несмотря на увеличение веса за счет добавления брони, систем защиты, радара и больших топливных баков для впечатляющей дальности полета, которая может быть еще больше увеличена с помощью подвесных баков. Крепления на крыльях позволяют дополнительно вооружить самолет ракетами или бомбами Matra.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_71_airframe$, поскольку оно является его частью.§!"

 FRA_vg_94_airframe: "Arsenal VG.94"
 FRA_vg_94_airframe_short: "VG.94"
 FRA_vg_94_airframe_desc: "Конечная эволюция серии реактивных истребителей VG. VG.94 практически не отличается от VG.92, но оснащен новым турбореактивным двигателем SNECMA Atar 101F с форсажем, обеспечивающим значительное увеличение тяги. Хотя вооружение осталось прежним, новые 30-мм пушки DEFA 552 имеют в два раза большую скорострельность по сравнению со старыми Hispanos.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_71_airframe$, поскольку оно является его частью.§!"

 FRA_d_371_airframe: "Dewoitine D.371"
 FRA_d_371_airframe_short: "D.371"
 FRA_d_371_airframe_desc: "Довольно уникальная для своего времени конструкция полностью металлического моноплана с высокорасположенным крылом и высокая мощность радиального двигателя Gnôme-Rhône делают D.371 исключительно маневренным. Может нести подвесной бак для увеличения дальности полета или легкие бомбы для наземной поддержки. Огневая мощь обеспечивается пулеметом $FRA_machinegun_75mm_darne_1933_4x_wing$. Защита ограничена, но не полностью игнорируется, благодаря системе пожаротушения.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_l_46_airframe: "Loire L.46"
 FRA_l_46_airframe_short: "L.46"
 FRA_l_46_airframe_desc: "Продолжая традицию высокопланов, Loire 46 не столько является усовершенствованием предыдущих моделей, сколько более дешевым решением с использованием смешанных материалов для планов перевооружения и экспорта за рубеж. Новые 7,5-мм пулеметы MAC 1934 и 20-мм пушки Hispano HS.9 предлагают улучшенные варианты огневой мощи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_mb_152_airframe: "Bloch MB.152"
 FRA_mb_152_airframe_short: "MB.152"
 FRA_mb_152_airframe_desc: "Основанный на предыдущем предложении Блоха для конкурса новых истребителей, MB.150, цельнометаллический MB.152 имеет обтекаемый фюзеляж, что позволяет установить более мощный двигатель и усовершенствованную броню. Это самолет типа «все умеет, но ни в чем не преуспевает». Несмотря на дополнительную мощность, он все еще остается довольно слабым. Однако в большинстве ситуаций он показывает отличные результаты. Вооруженный парой новых пушек Hispano 404, дополненных двумя 7,5-мм пулеметами MAC 1934, он является хорошей платформой для перехвата, особенно с учетом его очень ограниченной дальности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_mb_155_airframe: "Bloch MB.155"
 FRA_mb_155_airframe_short: "MB.155"
 FRA_mb_155_airframe_desc: "Оснащенный двигателем Gnôme-Rhône 14N-49, MB.155 в основном имеет те же характеристики, что и MB.152, но с увеличенной емкостью топливного бака и самоуплотняющимися баками для дополнительной защиты.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"

 FRA_mb_157_airframe: "Bloch MB.157"
 FRA_mb_157_airframe_short: "MB.157"
 FRA_mb_157_airframe_desc: "Усовершенствованная и доработанная версия базового фюзеляжа MB.152. Мощный высотный двигатель Gnôme-Rhône 14R-4 наконец-то позволяет самолету достичь предельных эксплуатационных характеристик.\n§GЭто позволит сохранить 95% эффективности от модели $FRA_mb_155_airframe$§!, §Rно конвертация из нее невозможна.§!"

 FRA_mb_700_airframe: "Bloch MB.700"
 FRA_mb_700_airframe_short: "MB.700"
 FRA_mb_700_airframe_desc: "Первый полностью деревянный прототип MB.700-01 был новой конструкцией, в которой использовались нестратегические материалы. Однако его характеристики были настолько впечатляющими, что было решено продолжить разработку. Новый MB.700 полностью металлический, что позволяет ему выдерживать мощность двигателя Gnôme-Rhône 14R-28, который придает ему исключительную маневренность. Более легкий самолет означает, что вооружение ограничено теми же креплениями, что и у старой серии MB.152. Спасительным фактором являются новые 11-мм пушки MAC 1938 и 20-мм пушки Hispano HS.804.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_mb_157_airframe$, поскольку оно является его частью.§!"

 FRA_n_1620_airframe: "Nord N.1620"
 FRA_n_1620_airframe_short: "N.1620"
 FRA_n_1620_airframe_desc: "Разработан на основе исследовательского реактивного самолета N.1601 со стреловидным крылом. Более крупный и тяжелый перехватчик N.1620 оснащен прямым крылом, что позволяет ему нести больше ракет и бомб, а также дополнительный топливный бак, необходимый для увеличения ограниченной дальности полета. Оснащенный двумя турбореактивными двигателями ATAR 101A, он удивительно маневренный для своих размеров. Разрушительная огневая мощь обеспечивается 4 пушками Hispano калибра 20 мм, сосредоточенными в носовой части.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_se_5003_airframe: "SNCASE SE.5003 `Baroudeur`"
 FRA_se_5003_airframe_short: "SE.5003"
 FRA_se_5003_airframe_desc: "Разработан как легкий истребитель-перехватчик с коротким взлетом. Baroudeur оснащен двигателем ATAR 101C, что позволяет ему едва достигать сверхзвуковой скорости. Из-за легкой конструкции дальность полета страдает. Вооружение состоит из стандартных 2x 30-мм пушек Hispano, а также дополнительных ракет/бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_se_212_airframe: "SNCASE SE.212 `Durandal`"
 FRA_se_212_airframe_short: "SE.212"
 FRA_se_212_airframe_desc: "Создан на основе проекта нового сверхзвукового перехватчика с треугольным крылом. Новейший двигатель ATAR 101F обеспечивает ему феноменальную скорость и маневренность. Как и типично для высокомощных перехватчиков, дальность полета страдает, особенно при замене подвесного бака на вооружение.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_d_520_airframe: "Dewoitine D.520"
 FRA_d_520_airframe_short: "D.520"
 FRA_d_520_airframe_desc: "Проиграв в конкурсе на создание истребителя Morane-Saulnier MS.405, Девуатин продолжил работу над D.520 в качестве частного предприятия, чтобы создать истребитель, способный наконец преодолеть скорость 520 км/ч. Разработанный для высокой скорости и простоты производства, истребитель с двигателем Hispano-Suiza 12Y-45 имеет несколько недостаточную мощность, но хорошо вооружен 4 пушками MAC калибра 7,5 мм на крыльях и центральной пушкой HS.404 калибра 20 мм, а также хорошо защищен. Дополнительные подвесные бомбовые держатели могут быть установлены под крыльями, что делает D.520 универсальным многоцелевым истребителем.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_d_520_c1_airframe: "Dewoitine D.520C.1"
 FRA_d_520_c1_airframe_short: "D.520C.1"
 FRA_d_520_c1_airframe_desc: "D.520C.1 можно считать окончательной версией D.520, разработанной Дювуатином, с двигателем Hispano-Suiza 12Y-49, обеспечивающим большую мощность и более высокую скорость. Для значительного увеличения боевой дальности самолета в нем предусмотрено больше внутреннего топлива. Наконец, установка самоуплотняющихся топливных баков добавляет столь необходимую защиту.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"

 FRA_d_524_airframe: "Dewoitine D.524"
 FRA_d_524_airframe_short: "D.524"
 FRA_d_524_airframe_desc: "Пытаясь улучшить высотные характеристики истребителя, Девуатин установил более новый, более крупный и гораздо более мощный двигатель Hispano-Suiza 12Z, создав модель D.524, которая по своим характеристикам наконец-то смогла сравниться с зарубежными конкурентами.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"

 FRA_se_520_z_airframe: "SNCASE SE.520Z"
 FRA_se_520_z_airframe_short: "SE.520Z"
 FRA_se_520_z_airframe_desc: "Новая серия двигателей Hispano-Suiza 12Z открыла новые возможности для проектирования. Воспользовавшись этим, в SE.520Z переработана и усовершенствована сама базовая конструкция D.520, что значительно улучшило его характеристики на больших высотах. Хотя пушка двигателя была заменена на более крупный двигатель и большее количество топлива, общая огневая мощность была сохранена за счет установки 2 пушек HS.404 калибра 20 мм в крыльях, заменивших 2 пушки MAC.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_d_520_airframe$, поскольку оно является его частью.§!"

 FRA_se_552_airframe: "SNCASE SE.552"
 FRA_se_552_airframe_short: "SE.552"
 FRA_se_552_airframe_desc: "Изначально D.550 был ответвлением от семейства D.520 с единственной целью достичь рекордов высокой скорости. Однако усовершенствования планера были настолько впечатляющими, что была изучена возможность создания военной версии. Результатом этого стало появление SE.552. Впечатляющие характеристики на больших высотах и высокая скорость в сочетании с мощным вооружением из 4 крыльевых пушек MAC 1938 калибра 11 мм и возвращением центральной пушки двигателя сделали этот истребитель настоящим ужасом небес.\n§YЭто позволит сохранить 90% эффективности семейства $FRA_d_520_airframe$, поскольку оно является его частью.§!"

 FRA_se_580_airframe: "SNCASE SE.580"
 FRA_se_580_airframe_short: "SE.580"
 FRA_se_580_airframe_desc: "Продолжая эволюцию D.520 в D.552, D.580 изначально предполагал установку двух двигателей V-12 Hispano 12Z, соединенных последовательно в более крупном фюзеляже. Однако появление нового двигателя V-24 Hispano 24Z привело к полной смене конструкции. Несмотря на более низкую маневренность из-за значительного увеличения веса, новый SE.580 способен развивать невероятную скорость. Дальность полета остается высокой, особенно с дополнительным подвесным баком. Где он превосходит всех конкурентов, так это в огневой мощи: 1x 30 мм HS.830, 4x 20 мм HS.804 и 6x 11 мм MAC плюс бомбы и ракеты делают SE.580 настоящим монстром.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_md_450_airframe: "Dassault MD.450 `Ouragan`"
 FRA_md_450_airframe_short: "MD.450 `Ouragan`"
 FRA_md_450_airframe_desc: "Являясь важной вехой в истории французских реактивных самолетов, Ouragon отличается конструкцией крыла, которая обеспечивает ему хорошую управляемость как на очень высоких, так и на низких скоростях, а также позволяет перевозить различные виды бомб, ракет и подвесных баков. Герметичная кабина пилота еще больше улучшает его характеристики. Топливоемкий турбореактивный двигатель ATAR 101 обеспечивает хорошую тягу, но за счет ограниченной дальности полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_md_452_airframe: "Dassault MD.452 `Mystère`"
 FRA_md_452_airframe_short: "MD.452 `Mystère`"
 FRA_md_452_airframe_desc: "Mystère улучшает конструкцию MD.450 за счет более мощного двигателя и стреловидных крыльев, которые обеспечивают более высокую максимальную скорость и лучшую маневренность. Увеличение тяги позволяет использовать более крупные подвесные баки для увеличения дальности полета.\n§GЭто позволит сохранить 95% эффективности предыдущей модели,§!, §Rно не конвертировать данную модель.§!"

 FRA_d_373_airframe: "Dewoitine D.373"
 FRA_d_373_airframe_short: "D.373"
 FRA_d_373_airframe_desc: "Морская версия D.371 с добавленным хвостовым крюком. Незначительное снижение характеристик из-за увеличения веса, но все остальные характеристики сохранены.\n§YЭто позволит сохранить 90% эффективности и может конвертироваться из модели $FRA_d_371_airframe$§!"

 FRA_d_790_airframe: "Dewoitine D.790"
 FRA_d_790_airframe_short: "D.790"
 FRA_d_790_airframe_desc: "Модификация самолета D.520 для обеспечения возможности его эксплуатации с авианосцев.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности и может конвертироваться из модели $FRA_d_520_airframe$§!"

 FRA_se_582_airframe: "SNCASE SE.582"
 FRA_se_582_airframe_short: "SE.582"
 FRA_se_582_airframe_desc: "Морская модификация SE.580 с добавлением аэрофинишера и складных крыльев. Из-за и без того высокого веса SE.580 максимальная скорость пришлось снизить для обеспечения возможности использования в морских операциях. Огневая мощь и грузоподъемность SE.582 с лихвой компенсируют потерю в производительности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности и может конвертироваться из модели $FRA_se_580_airframe$§!"

 FRA_mb_720_airframe: "Bloch MB.720"
 FRA_mb_720_airframe_short: "MB.720"
 FRA_mb_720_airframe_desc: "Морская версия $FRA_mb_700_airframe$ с усиленным шасси и аэрофинишером.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности и может конвертироваться из модели $FRA_mb_700_airframe$§!"

 FRA_vg_80_airframe: "Arsenal VG.80"
 FRA_vg_80_airframe_short: "VG.80"
 FRA_vg_80_airframe_desc: "Несмотря на то, что VG.80 является морской версией VG.71, он имеет несколько дополнительных конструктивных особенностей, таких как усиленный фюзеляж и катапультный кресло. Дополнительный вес означает, что VG.80 немного менее маневренный, чем его наземный предшественник.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_71_airframe$, поскольку оно является его частью.§!"

 FRA_vg_91_airframe: "Arsenal VG.91"
 FRA_vg_91_airframe_short: "VG.91"
 FRA_vg_91_airframe_desc: "Серия VG.90, уходящая корнями в VG.80, была создана в ответ на запрос ВМС на новый реактивный перехватчик и ударный истребитель. VG.91 немного уступает по маневренности своему наземному аналогу из-за дополнительного веса, связанного с установкой складных крыльев и аэрофинишера. Однако во всем остальном он аналогичен, особенно в плане впечатляющей дальности полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности семейства $FRA_vg_71_airframe$, поскольку оно является его частью.§!"

 FRA_n_2200_airframe: "Nord N.2200"
 FRA_n_2200_airframe_short: "N.2200"
 FRA_n_2200_airframe_desc: "Создавался как один из трех конкурентов на роль палубного перехватчика. Разработанный со стреловидным крылом и оснащенный одним турбореактивным двигателем ATAR 101C, N.2200 демонстрирует довольно хорошие характеристики. Вооружение включает в себя три 30-мм пушки Hispano HS.830, а также опции для установки новых ракет AA-20 Nord, ракетных контейнеров или бомб, что делает его подходящим для многих миссий по поддержке военно-морских сил.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 FRA_nc_1080_airframe: "SNCAC NC.1080"
 FRA_nc_1080_airframe_short: "NC.1080"
 FRA_nc_1080_airframe_desc: "Второй участник конкурса на создание перехватчика для авианосцев. Оснащен двигателем ATAR 101D, имеет крыло стреловидности, фюзеляж круглого сечения и инновационные системы управления. NC.1080 достаточно маневренный, хотя и не впечатляет из-за сложности управления новыми системами. Тем не менее, его увеличенная дальность полета и гибкие крепления являются преимуществом в морской авиации.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

