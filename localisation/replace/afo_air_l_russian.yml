 ger_cas_equipment_1: "Hs 123 A-1"
 ger_cas_equipment_1_short: "Hs 123 A-1"
 ger_cas_equipment_1_desc: "Henschel Hs 123 — одноместный пикирующий бомбардировщик-биплан и штурмовик непосредственной поддержки. He оказался прочным и эффективным. Однако дальность полета достигается за счет ограниченной бомбовой нагрузки.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ger_cas_equipment_2: "Ju 87 A-2 `Stuka`"
 ger_cas_equipment_2_short: "Ju 87 A-2"
 ger_cas_equipment_2_desc: "Конструкция Stuka включала несколько инноваций, таких как автоматические тормоза пикирования. Модель A-2 недостаточно мощна с двигателем Jumo 210D и имеет очень ограниченную дальность полета, но она более прочная и способна сбрасывать 500 кг бомб с хорошей точностью.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ger_cas_equipment_3: "Ju 87 B-2 `Stuka`"
 ger_cas_equipment_3_short: "Ju 87 B-2"
 ger_cas_equipment_3_desc: "B-2 улучшает Ju 87 с более мощным двигателем Jumo 211D, который обеспечивает ему лучшие летные характеристики, а также немного лучшую защиту. Однако он все еще ограничен в дальности и вооружении.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
