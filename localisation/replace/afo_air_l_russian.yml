 SOV_i_16_type_24_airframe_short: "И-16 Тип 24"
 SOV_i_16_type_24_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 sov_fighter_multirole_ad_tech_3: "Комплект вооружения И-16 Тип 28"
 sov_fighter_multirole_ad_tech_3_desc: ""
  
 SOV_lagg_3_airframe: "Лавочкин ЛаГГ-3"
 SOV_lagg_3_airframe_short: "ЛаГГ-3"
 SOV_lagg_3_airframe_desc: "Lavochkin-Gorbunov-Gudkov LaGG-3 представляет собой радикальный отход от старых конструкций легких истребителей. Однако, несмотря на свою деревянную конструкцию, LaGG-3 облегчен своим набором из 2x 7,6-мм ШКАС, 12,7-мм УБС, 20-мм самоходных пушек ШВАК и 200 кг бомб. Добавьте к этому маломощный двигатель и деревянную раму, склонную к деформации, и LaGG-3 будет трудно впечатлить своими характеристиками. Недоброжелательно пилоты стали называть его «Лакированный гарантированный гроб».\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 SOV_la_5_airframe: "Лавочкин Ла-5 `Лавка`"
 SOV_la_5_airframe_short: "Ла-5"
 SOV_la_5_airframe_desc: "Для решения проблем мощности и производительности ЛаГГ-3 был выбран более мощный радиальный двигатель для замены старого с водяным охлаждением. Планер и крылья теперь имеют смешанную металлодеревянную конструкцию, что позволило высвободить вес и пространство для увеличения размера топливных баков и увеличить дальность полета за счет снижения истинного потенциала истребителя. Старое громоздкое вооружение также полностью заменено на 2x 20-мм пушки ШВАК СП, что обеспечивает лучший баланс между огневой мощью и производительностью.\n§GЭто сохранит 95% эффективности от $SOV_lagg_3_airframe$§!"
  
 SOV_la_5fn_airframe: "Лавочкин Ла-5ФН `Лавка`"
 SOV_la_5fn_airframe_short: "Ла-5ФН"
 SOV_la_5fn_airframe_desc: "Новая система впрыска топлива, усовершенствования фюзеляжа и дальнейшее облегчение планера наконец-то могут раскрыть весь потенциал Ла-5, несмотря на меньшую дальность из-за повышенного расхода топлива. Это приводит к значительно улучшенной маневренности, максимальной скорости и лучшей выживаемости.\n§GЭто сохранит 95% эффективности и может конвертироваться из $SOV_la_5_airframe$§!"
  
 SOV_la_7_airframe: "Лавочкин Ла-7 `Лавка`"
 SOV_la_7_airframe_short: "Ла-7"
 SOV_la_7_airframe_desc: "Вершина семейства La, La-7 вобрал в себя многие уроки от La-5FN в улучшенный и обтекаемый самолет. Конструктивные изменения высвобождают вес и пространство для большего топливного бака и кислородной системы для пилота. Две пушки ШВАК заменены на гораздо более легкие 20-мм пушки B-20, что позволяет установить 3 пушки, что еще больше увеличивает огневую мощь истребителя.\n§GЭто сохранит 95% эффективности от $SOV_la_5fn_airframe$§!"
  
 SOV_la_9_airframe: "Лавочкин Ла-9 `Фриц`"
 SOV_la_9_airframe_short: "Ла-9"
 SOV_la_9_airframe_desc: "Несмотря на название, сходство с Ла-7 лишь поверхностное. Ла-9 имеет цельнометаллическую конструкцию и крыло с ламинарным потоком. Экономия веса за счет исключения дерева из планера самолета позволяет значительно увеличить запас топлива, нести 4 23-мм пушки НС-23 и 500-кг бомбы.\n§GЭто сохранит 95% эффективности от $SOV_la_7_airframe$§!"
  
 SOV_mig_1_airframe: "Микоян МиГ-1"
 SOV_mig_1_airframe_short: "МиГ-1"
 SOV_mig_1_airframe_desc: "Открывая эру нового поколения скоростных истребителей, Микоян и Гуревич спроектировали МиГ-1 в ответ на потребность в высотном истребителе с рядным двигателем. Этот в основном деревянный самолет недостаточно мощный из-за своего двигателя Микулина АМ-35. Тем не менее, он все еще может развивать фантастическую скорость. Однако его вооружение из трех пулеметов оставляет желать лучшего.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_mig_3_airframe: "Микоян МиГ-3"
 SOV_mig_3_airframe_short: "МиГ-3"
 SOV_mig_3_airframe_desc: "Стремясь исправить многочисленные проблемы, преследующие МиГ-1, конструкторы улучшили крылья и удлинили фюзеляж для устойчивости, что в итоге увеличило пространство для дополнительных топливных баков и пожаротушения с помощью инертного газа, поступающего в баки. Другие улучшения включают в себя повышение надежности с использованием большего количества деталей из дюралюминия, лучшую видимость, улучшенный прицел и обновленную приборную панель. Для увеличения низкой огневой мощи можно установить 12,7-мм пулеметные контейнеры УБ, жертвуя маневренностью.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_mig_7_airframe: "Микоян МиГ-7"
 SOV_mig_7_airframe_short: "МиГ-7"
 SOV_mig_7_airframe_desc: "Хотя МиГ-3 изначально предполагалось использовать более мощный двигатель, Микулин АМ-38 наконец-то доступен. Увеличение мощности позволяет улучшить все, особенно маневренность. Огневая мощь также повышается за счет замены пулеметов на 2 пушки ШВАК.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_mig_11_airframe: "Микоян МиГ-11 `Самолет`"
 SOV_mig_11_airframe_short: "МиГ-11"
 SOV_mig_11_airframe_desc: "В рамках инициативы по развитию планера МиГ-3 была разработана серия И-220 для испытания различных силовых установок и усовершенствований. Наконец, И-225 (МиГ-11) является самым большим, тяжелым и мощным из серии; полностью металлический, с герметичной кабиной, бронированным стеклом и арсеналом из 4 синхронизированных 20-мм пушек ШВАК. В сочетании с превосходными характеристиками благодаря мощности двигателя Микулина АМ-42 этот супер МиГ может стать настоящим ужасом небес.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_mig_9_airframe: "Микоян МиГ-9 `Фарго`"
 SOV_mig_9_airframe_short: "МиГ-9"
 SOV_mig_9_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_mig_15_airframe: "Микоян МиГ-15 `Матушка`"
 SOV_mig_15_airframe_short: "МиГ-15"
 SOV_mig_15_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_mig_15bis_airframe: "Микоян МиГ-15бис `Матушка`"
 SOV_mig_15bis_airframe_short: "МиГ-15бис"
 SOV_mig_15bis_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_mig_17_airframe: "Микоян МиГ-17 `Фреска`"
 SOV_mig_17_airframe_short: "МиГ-17"
 SOV_mig_17_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_la_15_airframe: "Лавочкин Ла-15 `Веерообразный хвост`"
 SOV_la_15_airframe_short: "Ла-15"
 SOV_la_15_airframe_desc: "Предложение Лавочкина по легкому реактивному перехватчику. Оснащенный двигателем Климова РД-500, его впечатляющая скорость и 3 пушки калибра 23 мм создают плотный пакет, включающий такие новинки, как катапультные кресла.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_la_200_airframe: "Лавочкин Ла-200"
 SOV_la_200_airframe_short: "Ла-200"
 SOV_la_200_airframe_desc: "Выполняя требования к двухместному, всепогодному, двухмоторному реактивному перехватчику, который мог бы нести новый тип радиолокационной системы, Ла-200, оснащенный двумя двигателями Климова ВК-1, может достигать невероятных скоростей. Добавление подвесных баков обеспечивает самолету большой диапазон, где он может обрушить огневую мощь 3x 37-мм пушек Н-37 на любого противника.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_i_180s_airframe: "Поликарпов И-180С"
 SOV_i_180s_airframe_short: "И-180С"
 SOV_i_180s_airframe_desc: "И-180С — это попытка КБ Поликарпова извлечь больше производительности из планера И-16. Для этого установлен более мощный звездообразный двигатель Туманского М-88. Улучшенные характеристики позволяют И-180 легко использовать для коротких взлетов с авианосца.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 SOV_yak_1c_airframe: "Яковлев Як-1С"
 SOV_yak_1c_airframe_short: "Як-1С"
 SOV_yak_1c_airframe_desc: "В попытке быстро сократить разрыв в морской авиации с другими более развитыми странами улучшенный Як-1Б был быстро модифицирован с помощью тормозного гака и усиленного шасси для обеспечения возможности эксплуатации авианосца.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_yak_9c_airframe: "Яковлев Як-9С"
 SOV_yak_9c_airframe_short: "Як-9С"
 SOV_yak_9c_airframe_desc: "В том же духе, что и Як-1С — дешевая и эффективная морская модификация, 9С — это почтенный Як-9У со всем дополнительным оборудованием, необходимым для операций на авианосце.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 SOV_yak_15c_airframe: "Яковлев Як-15С"
 SOV_yak_15c_airframe_short: "Як-15С"
 SOV_yak_15c_airframe_desc: "Одна из первых попыток Яковлева создать реактивный истребитель, Як-15 просто вбивает двигатель Климова РД-10 в планер Як-3. Очень легкий самолет жертвует дальностью полета ради довольно короткого взлета, что позволяет ему работать с авианосцев, если это необходимо. He уступает почти по всем остальным параметрам более перспективным МиГам.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
