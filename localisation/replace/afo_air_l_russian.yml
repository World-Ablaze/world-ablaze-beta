 SOV_su_2_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_su_4_airframe: "Сухой Су-4"
 SOV_su_4_airframe_short: "Су-4"
 SOV_su_4_airframe_desc: "Модификация Су-2, предполагающая установку более мощных радиальных двигателей. Установленный двигатель М-82 позволяет нести ту же бомбовую нагрузку на более высокой скорости и с более сильным вооружением из 2x 12,7-мм крупнокалиберных пулеметов Березина в крыльях и дополнительного ШКАСа в хвостовой части.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
