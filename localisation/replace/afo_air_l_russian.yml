 eng_heavy_fighter_equipment_1: "Whirlwind"
 eng_heavy_fighter_equipment_1_short: "Whirlwind"
 eng_heavy_fighter_equipment_1_desc: "Странный промежуточный проект, который в конечном итоге провалился из-за двигателей Rolls-Royce Peregrine, Whirlwind был очень любим теми, кто на нем летал. Его большой радиус действия делает его полезным в качестве эскорта бомбардировщиков, в то время как его тяжелое вооружение из 20-мм пушек компенсирует его недостаточную маневренность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_heavy_fighter_equipment_2: "Mosquito Mk II"
 eng_heavy_fighter_equipment_2_short: "Mosquito Mk II"
 eng_heavy_fighter_equipment_2_desc: "Первый в том, что станет фирменной моделью de Havilland для войны, ослепительная скорость и тяжелое вооружение Mosquito делают его ужасающим противником. Однако его шокирующая маневренность для его размера стала возможной благодаря его полностью деревянной конструкции, что сделало его более уязвимым для вражеского огня, чем его современники.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 eng_heavy_fighter_equipment_3: "Mosquito Mk XV"
 eng_heavy_fighter_equipment_3_short: "Mosquito Mk XV"
 eng_heavy_fighter_equipment_3_desc: "Значительное улучшение конструкции Mosquito. Mk XV использует улучшенный двигатель Rolls-Royce Merlin, чтобы получить гораздо более высокую производительность, чем предыдущая модель\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_heavy_fighter_equipment_4: "Hornet"
 eng_heavy_fighter_equipment_4_short: "Hornet"
 eng_heavy_fighter_equipment_4_desc: "Разработанный на основе Mosquito, Hornet является одним из самых быстрых поршневых самолетов, когда-либо поднимавшихся в небо. Сохранив счетверенные пушки Hispano своего предшественника, а также деревянную конструкцию, единственный анахронизм в этом в остальном высокопроизводительном самолете.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_attacker_equipment_1: "Beaufighter Mk I"
 eng_attacker_equipment_1_short: "Beaufighter Mk I"
 eng_attacker_equipment_1_desc: "Известный как один из самых крепких самолетов войны, Beaufighter — настоящий танк небес, способный выдержать несколько попаданий, а также раздавать их с помощью своего вооружения из пушек Hispano. Единственная проблема в том, что он управляется как танк!\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 eng_attacker_equipment_2: "Beaufighter Mk VI"
 eng_attacker_equipment_2_short: "Beaufighter Mk VI"
 eng_attacker_equipment_2_desc: "Улучшение своего предшественника с дополнительными пулеметами в качестве вооружения и гораздо более тяжелой торпедной нагрузкой, Mk VI также может похвастаться невероятной дальностью, способностью сопровождать бомбардировщики и выполнять атакующие миссии далеко за линией фронта. К сожалению, он все еще будет страдать от маневренных одномоторных истребителей.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 eng_attacker_equipment_3: "Brigand"
 eng_attacker_equipment_3_short: "Brigand"
 eng_attacker_equipment_3_desc: "Приняв более современную, обтекаемую форму для преемника Beaufighter, дальность и морская атака Brigand почти не имеют себе равных. Однако, что не было должным образом решено, так это все еще недостающая маневренность.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 eng_attacker_equipment_4: "Mosquito FB"
 eng_attacker_equipment_4_short: "Mosquito FB"
 eng_attacker_equipment_4_desc: "Сочетание молниеносной скорости Mosquito с тактической полезной нагрузкой делает его бомбардировщиком, предназначенным для нанесения ударов по позициям противника и вылетающим до того, как вражеские перехватчики успеют покинуть свои взлетно-посадочные полосы. Однако его недостаточная дальность полета означает, что он должен базироваться на взлетно-посадочных полосах, расположенных ближе к линиям противника, чем некоторым может понравиться.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
