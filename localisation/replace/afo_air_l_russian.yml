 ENG_firebrand_mkiv_airframe: "Blackburn Firebrand Mk IV"
 ENG_firebrand_mkiv_airframe_short: "Firebrand Mk IV"
 ENG_firebrand_mkiv_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ENG_seal_airframe: "Fairey Seal"
 ENG_seal_airframe_short: "Seal"
 ENG_seal_airframe_desc: "Seal создан на основе того же проекта, что и Gordon. Тканевая обшивка и легкий фюзеляж позволяют легко запускать его с кораблей. He может быть оснащен поплавками. Однако в современную эпоху монопланов он не представляет особой ценности.\n§YЭто сохранит 90% эффективности от $ENG_gordon_airframe$§!"
  
 ENG_fulmar_mki_airframe: "Fairey Fulmar Mk I"
 ENG_fulmar_mki_airframe_short: "Fulmar"
 ENG_fulmar_mki_airframe_desc: "Разработанный как замена Battle на авианосце, Fulmar — это прочный самолет с большой дальностью полета и надежным вооружением из 8 пулеметов. He предлагает универсальность с вариантами модернизации вооружения и радара.\n§YЭто сохранит 90% эффективности от $ENG_battle_mkii_airframe$§!"
  
 ENG_firefly_mkiv_airframe: "Fairey Firefly Mk IV"
 ENG_firefly_mkiv_airframe_short: "Firefly"
 ENG_firefly_mkiv_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_firecrest_airframe: "Blackburn Firecrest"
 ENG_firecrest_airframe_short: "Firecrest"
 ENG_firecrest_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_sea_vampire_fb20_airframe: "Sea Vampire FB 20"
 ENG_sea_vampire_fb20_airframe_short: "Sea Vampire"
 ENG_sea_vampire_fb20_airframe_desc: "Sea Vampire Королевского флота — это переделанный в морской вариант FB5, оснащенный тормозным крюком, шасси с большим ходом и увеличенными закрылками. По своим характеристикам это по сути тот же многоцелевой Vampire. Однако, внимание флота делает его более ориентированным на непосредственную авиационную поддержку.\n§YПеределает и сохранит 90% эффективности от $ENG_vampire_fb5_airframe$§Y. §RЭто совершенно новая модель, и она не сохранит эффективность от предыдущей модели.§!"
  
 ENG_sea_venom_faw20_airframe: "Sea Venom FAW 20"
 ENG_sea_venom_faw20_airframe_short: "Sea Venom"
 ENG_sea_venom_faw20_airframe_desc: "Разработанный как всепогодный истребитель, Sea Venom представляет собой морскую модификацию реактивного истребителя Venom для Королевского флота, оснащенную катапультируемыми креслами, поисковым радаром, усиленным тормозным гаком и шасси.\n§YБудет преобразован и сохранит 90% эффективности от $ENG_venom_fb1_airframe$§Y. §RЭто совершенно новая модель, которая не сохранит эффективность от предыдущей модели.§!"
  
 ENG_sea_vixen_faw2_airframe: "Sea Vixen FAW 2"
 ENG_sea_vixen_faw2_airframe_short: "Sea Vixen"
 ENG_sea_vixen_faw2_airframe_desc: "\n§YПреобразует и сохранит 90% эффективности от $ENG_vixen_faw1_airframe$§Y. §RЭто совершенно новая модель, и она не сохранит эффективность от предыдущей модели.§!"
  
 ENG_vildebeest_airframe: "Vickers Vildebeest"
 ENG_vildebeest_airframe_short: "Vildebeest Mk III"
 ENG_vildebeest_airframe_desc: "Довольно большой трехместный, одномоторный, биплан-торпедоносец. Цельнометаллический фюзеляж с тканевыми крыльями и хвостом, Mk III оснащен радиальным двигателем Pegasus, что позволяет ему нести торпеду или 460 кг бомб на приличное расстояние. Однако он страдает от очень низкой маневренности, ограниченной грузоподъемности и отсутствия оборонительных возможностей.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_swordfish_airframe: "Fairey Swordfish"
 ENG_swordfish_airframe_short: "Swordfish Mk I"
 ENG_swordfish_airframe_desc: "Swordfish спроектирован как палубный биплан-торпедоносец, в основном из ткани, покрывающей металлический каркас. Прозванный `Авоськой` из-за разнообразного оборудования, которое он мог нести: воздушная торпеда, 690 кг бомб, поисковый радар, камера разведки, морские мины и даже ракеты и поплавки!\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_albacore_airframe: "Fairey Albacore"
 ENG_albacore_airframe_short: "Albacore"
 ENG_albacore_airframe_desc: "Биплан-торпедоносец смешанной конструкции, разработанный как преемник Swordfish, оказался также достойным пикирующим бомбардировщиком. Улучшенный двигатель Taurus и усиленные крылья позволяют нести 920 кг бомб, закрылки хорошо работают как тормоза при пикировании. В качестве альтернативы он может поддерживать поплавки для расширенного морского патрулирования.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_barracuda_airframe: "Fairey Barracuda"
 ENG_barracuda_airframe_short: "Barracuda Mk II"
 ENG_barracuda_airframe_desc: "Fairey Barracuda — это палубный, цельнометаллический, моноплан, торпедоносец и пикирующий бомбардировщик, разработанный для замены предыдущих бипланов. Mk II оснащен мощным двигателем Merlin 32 и радаром поиска поверхности. Хотя возможная загрузка практически не изменилась по сравнению с предыдущими бомбардировщиками, Barracuda быстрее, маневреннее и прочнее. He также может увеличить свою дальность полета с помощью некоторых модификаций.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_spearfish_airframe: "Fairey Spearfish"
 ENG_spearfish_airframe_short: "Spearfish"
 ENG_spearfish_airframe_desc: "Разработан для устранения недостатков Barracuda как торпедоносца/пикирующего бомбардировщика. По сравнению с Barracuda, Spearfish имеет гораздо более мощный двигатель, внутренний отсек вооружения и более совершенный радар поиска поверхности. Оборонительные орудия несколько лучше, в общей сложности 4x .50 M2 Browning. Внешне основное наступательное оружие — 16x ракет RP-3.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_wyvern_airframe: "Westland Wyvern"
 ENG_wyvern_airframe_short: "Wyvern TF Mk II"
 ENG_wyvern_airframe_desc: "Первоначально разработанный как дальний морской истребитель, проект вскоре трансформировался в эффективный ударный бомбардировщик общего назначения с турбовинтовым двигателем. Повышенная выживаемость обеспечивается новыми катапультируемыми креслами и системами пожаротушения. Вооружение включает 16 ракет, новую торпеду Mk XVII и свыше 1380 кг бомб. 4 20-мм пушки Hispano на крыльях обеспечивают приличную огневую мощь против перехватчиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_aw168_airframe: "A.W. AW.168"
 ENG_aw168_airframe_short: "AW.168"
 ENG_aw168_airframe_desc: "Разработан Armstrong Whitworth в соответствии с требованиями Королевского флота к двухместному палубному реактивному штурмовику. Оснащенный двумя двигателями de Havilland Gyron Junior тягой 7000 фунтов-силы каждый, бомбардировщик мог развивать впечатляющую скорость 1080 км/ч. Вооружение, типичное для предыдущих палубных бомбардировщиков, практически такое же. Однако AW168 может быть оснащен пакетом из 4 30-мм пушек ADEN в бомбоотсеке для дополнительной мощи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_london_airframe: "Saro London Mk I"
 ENG_london_airframe_short: "London Mk I"
 ENG_london_airframe_desc: "Saunders Roe London — это летающая лодка-биплан, разработанная в соответствии со спецификациями для `летающей лодки общего назначения для патрулирования открытого моря`. Несмотря на недостаточную мощность, она может нести до 920 кг бомб или мин под крыльями, а также сбрасываемый бак под фюзеляжем для длительных операций.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 
 ENG_hampden_tb_airframe: "Handley Page Hampden TB"
 ENG_hampden_tb_airframe_short: "Hampden TB Mk I"
 ENG_hampden_tb_airframe_desc: "Несмотря на то, что самолет Hampden в значительной степени устарел как бомбардировщик, его планер по-прежнему может быть полезен в качестве патрульного торпедоносца и минного заградителя благодаря своей универсальности и простоте управления.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности от $ENG_hampden_airframe$.§!"
  
