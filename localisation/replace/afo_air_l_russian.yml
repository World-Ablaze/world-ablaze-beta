 jap_transport_plane_equipment_1: "Ki-34"
 jap_transport_plane_equipment_1_short: "Ki-34"
 jap_transport_plane_equipment_1_desc: "Thora — небольшой легкий транспортный самолет, созданный на основе японской копии лицензионного Douglas DC-2. Этот самолет имеет крайне ограниченную дальность полета, но вряд ли вскоре получит замену из-за отсутствия военного или гражданского спроса.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_transport_plane_equipment_2: "Ki-56"
 jap_transport_plane_equipment_2_short: "Ki-56"
 jap_transport_plane_equipment_2_desc: "Thalia — это крайне необходимая замена Ki-34, увеличивающая дальность полета в три раза за счет использования лицензионных чертежей Lockheed Model 14 Super Electra. Ki-56 — это крайне необходимая замена бессильному Ki-34.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_transport_plane_equipment_3: "Ki-92"
 jap_transport_plane_equipment_3_short: "Ki-92"
 jap_transport_plane_equipment_3_desc: "Способный доставлять десантников или грузы в любую точку 2-й цепи островов и поддерживать наши усилия в остальной части континентальной Азии, Tachikawa создал поразительно мощный транспортный самолет по сравнению с нашими предыдущими разработками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_scout_plane_equipment_1: "Ki-4"
 jap_scout_plane_equipment_1_short: "Ki-4"
 jap_scout_plane_equipment_1_desc: "Достойный разведывательный самолет для той эпохи, Ki-4 поступил на вооружение в начале 1935 года и с тех пор тесно интегрирован с нашими силами. Достаточно маневренные, чтобы уклоняться от китайских репрессий, они обеспечили успех наших усилий в регионе.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_scout_plane_equipment_2: "Ki-15 Karigane"
 jap_scout_plane_equipment_2_short: "Ki-15"
 jap_scout_plane_equipment_2_desc: "Высокоскоростной разведывательный самолет Babs успешно выполняет свои функции разведывательного самолета, а также является одним из самых быстрых самолетов в нашем арсенале.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_scout_plane_equipment_3: "Ki-46-II"
 jap_scout_plane_equipment_3_short: "Ki-46-II"
 jap_scout_plane_equipment_3_desc: "Разработанный на основе доктрины стратегической разведки, а не тактической, Dinah — быстрый, дальнобойный и в целом чрезвычайно эффективный разведывательный самолет.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_scout_plane_equipment_4: "Ki-46-III"
 jap_scout_plane_equipment_4_short: "Ki-46-III"
 jap_scout_plane_equipment_4_desc: "Это усовершенствование, которое летает быстрее и дальше от II, является простым и дешевым способом увеличить долговечность этой и без того успешной разведывательной платформы.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 jap_scout_plane_equipment_5: "C6N"
 jap_scout_plane_equipment_5_short: "C6N"
 jap_scout_plane_equipment_5_desc: "ВМС запросили собственную разработку разведывательного самолета, Myrt является одним из самых быстрых палубных самолетов на момент его появления. Однако подводные камни в разработке разведывательного оборудования сделали его наземным для разведывательных задач.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_scout_plane_equipment_6: "R2Y"
 jap_scout_plane_equipment_6_short: "R2Y"
 jap_scout_plane_equipment_6_desc: "Необычная конструкция для неудавшегося одномоторного разведывательного самолета с трехопорным шасси, превращенного в турбореактивный высокоскоростной разведывательный самолет. Keiun (`Circus Cloud`) быстрый, но имеет меньшую дальность полета, чем C6N, хотя и гораздо более маневренный.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_equipment_1: "Ki-10"
 jap_fighter_equipment_1_short: "Ki-10"
 jap_fighter_equipment_1_desc: "Perry был представлен в 1935 году и обладает чертами, типичными для большинства японских самолетов. Акцент на акробатических способностях вместо брони или вооружения означает, что он уже почти устарел по сравнению с более новыми конструкциями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_equipment_2: "Ki-27 Ko"
 jap_fighter_equipment_2_short: "Ki-27"
 jap_fighter_equipment_2_desc: "По-прежнему имеющий неубирающееся шасси из-за проблем в конструкции, относительно продвинутый в остальном моноплан Nate был выбран за его высокие акробатические возможности вместо его конкурентов, которые имели лучшее вооружение и максимальную скорость.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_fighter_equipment_3: "Ki-44 Shoki"
 jap_fighter_equipment_3_short: "Ki-44"
 jap_fighter_equipment_3_desc: "Отчаянно необходимый для замены архаичного Ki-27 Nate, Tojo — грозный истребитель, разработанный как перехватчик. С упором на скорость полета и скороподъемность, оснащенный двумя 12,7-мм и двумя 7,7-мм пулеметами, он все еще не обладает ударной силой, необходимой современному истребителю, не говоря уже о самолете-перехватчике.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_equipment_3_1: "Ki-44 Hei Shoki"
 jap_fighter_equipment_3_1_short: "Ki-44 Hei"
 jap_fighter_equipment_3_1_desc: "Ki-44-IIC, оснащенный полным комплектом из четырех 12,7-мм пулеметов, представляет собой грозный истребитель, маневренный и быстрый, с превосходной дальностью полета.\n§GЭта модель сохранит 95% эффективности предыдущей модели.§!"
  
 jap_fighter_equipment_4: "Mitsubishi J2M2 Raiden"
 jap_fighter_equipment_4_short: "J2M2 Raiden"
 jap_fighter_equipment_4_desc: "Разработанный как наземный перехватчик обороны для защиты баз ВМС Японии от бомбардировщиков. Оснащенный радиальным двигателем Mitsubishi Kasei 23, защищенный броней и вооруженный двумя 20-мм пушками Type 99 в крыльях и двумя 7,7-мм пулеметами Type 97 в носовой части, Raiden обеспечивает хороший баланс между отличными характеристиками и хорошей огневой мощью и защитой.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_equipment_4_1: "Mitsubishi J2M5 Raiden"
 jap_fighter_equipment_4_1_short: "J2M5 Raiden"
 jap_fighter_equipment_4_1_desc: "Высотный вариант серии Raiden, разработанный для увеличения потолка и эффективности на большой высоте. Оснащен двигателем Mitsubishi Kasei 26 с наддувом, что обеспечивает повышенную скорость и производительность за счет дальности. M5 дополнительно усиливает огневую мощь, заменяя пулеметы на 20-мм пушки Type 99-1.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_fighter_equipment_5: "Ki-84 Otsu"
 jap_fighter_equipment_5_short: "Ki-84"
 jap_fighter_equipment_5_desc: "Хорошо спроектированный, с высокой скоростью и превосходной маневренностью, Frank оснащен двойным тяжелым вооружением из двух 20-мм пушек и 12,7-мм пулеметов для поражения вражеских самолетов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_fighter_equipment_6: "Ki-87 Nakajima"
 jap_fighter_equipment_6_short: "Ki-87"
 jap_fighter_equipment_6_desc: "Разработанный как высотный истребитель-перехватчик, этот самолет с турбонаддувом и вооружением из 30-мм и 20-мм пушек представляет собой грозную угрозу для истребителей противника, при этом у него слишком мало пушек для эффективного поражения бомбардировщиков.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_fighter_equipment_7: "Ki-94 Tachikawa"
 jap_fighter_equipment_7_short: "Ki-94"
 jap_fighter_equipment_7_desc: "Разработанный как истребитель-перехватчик, Ki-94 имеет гораздо большую дальность полета, чем Ki-87, но ему все еще не хватает тяжелого вооружения, необходимого для борьбы с тяжелыми бомбардировщиками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_fighter_equipment_8: "J7W1 Shinden"
 jap_fighter_equipment_8_short: "J7W1"
 jap_fighter_equipment_8_desc: "Этот перехватчик с инновационной конструкцией толкающего винта оснащен четырьмя 30-мм пушками для поражения стратегических бомбардировщиков над ключевыми территориями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_fighter_multirole_equipment_1: "Ki-27 Otsu"
 jap_fighter_multirole_equipment_1_short: "Ki-27"
 jap_fighter_multirole_equipment_1_desc: "Истребитель-моноплан, разработанный компанией Nakajima Aircraft Company для Воздушной службы Императорской армии Японии. Несмотря на недостаток защиты, он обеспечивает превосходную маневренность благодаря малому весу и двигателю Kotobuki 41. Вооружение стандартное для той эпохи — 2 пулемета калибра 7,7 мм и возможность нести умеренную бомбовую нагрузку.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_multirole_equipment_2: "Ki-43 Hayabusa"
 jap_fighter_multirole_equipment_2_short: "Ki-43"
 jap_fighter_multirole_equipment_2_desc: "Hayabusa, по-прежнему оснащенный 7,7-мм пулеметом и только одним 12,7-мм пулеметом, посредственен в бою, но увеличенная бомбовая нагрузка означает, что это первый настоящий японский истребитель-бомбардировщик, способный поддерживать армию на континенте.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_fighter_multirole_equipment_3: "Ki-43 Hei Hayabusa"
 jap_fighter_multirole_equipment_3_short: "Ki-43 Hei"
 jap_fighter_multirole_equipment_3_desc: "Оснащенный двумя 12,7-мм пулеметами, хотя и с ограничениями по хранению боеприпасов, Oscar несет увеличенную бомбовую нагрузку и может похвастаться большей дальностью полета.\n§GЭффективность сохранится на уровне 95% от предыдущей модели.§!"
  
 jap_fighter_multirole_equipment_4: "Ki-61 Otsu Hien"
 jap_fighter_multirole_equipment_4_short: "Ki-61 Otsu"
 jap_fighter_multirole_equipment_4_desc: "Наконец, оснащенный комплектом из четырех 12,7-мм пулеметов, `Тони` по-настоящему эффективен как истребитель и бомбардировщик.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_fighter_multirole_equipment_5: "Ki-61 Tei Hien"
 jap_fighter_multirole_equipment_5_short: "Ki-61 Tei"
 jap_fighter_multirole_equipment_5_desc: "Тони, оснащенный двумя 20-мм пушками Ho-5, заменяющими два пулемета, представляет собой комплексное улучшение предыдущей модели.\n§GЭта модель сохранит 95% эффективности предыдущей модели.§!"
  
 jap_fighter_multirole_equipment_6: "Ki-61 Kai Hien"
 jap_fighter_multirole_equipment_6_short: "Ki-61 Kai"
 jap_fighter_multirole_equipment_6_desc: "Теперь, переоборудованный новым двигателем и увеличенным рулем направления и фюзеляжем, Kai является превосходным истребителем-бомбардировщиком.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 jap_fighter_multirole_equipment_7: "N1K1 Shiden"
 jap_fighter_multirole_equipment_7_short: "N1K1"
 jap_fighter_multirole_equipment_7_desc: "Способный истребитель 1930-х годов, Rex — это гидросамолет, не соответствующий времени. Не имея никаких улучшений в бомбовой нагрузке и меньшей дальности по сравнению с предыдущими японскими легкими бомбардировщиками, N1K1s единственными полезными улучшениями являются улучшения двигателя, что делает его быстрым и маневренным, но лишенным какой-либо значительной огневой мощи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_fighter_multirole_equipment_7_2: "N1K6 Shiden"
 jap_fighter_multirole_equipment_7_2_short: "N1K6"
 jap_fighter_multirole_equipment_7_2_desc: "Этот самолет, оснащенный немного лучше, с увеличенной бомбовой нагрузкой и большей дальностью полета за счет удаления аспекта поплавкового самолета, является посредственным, если и пригодным для использования легким бомбардировщиком.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 jap_jet_cas_equipment_1: "R2Y2 Keiun Kai"
 jap_jet_cas_equipment_1_short: "R2Y2"
 jap_jet_cas_equipment_1_desc: "Прототип разведывательного самолета с винтовым двигателем R2Y, превращенный в турбореактивный истребитель, R2Y2 Keiun Kai создан по мотивам немецкой философии реактивного дизайна.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_jet_fighter_equipment_2: "J7W2 Shinden Kai"
 jap_jet_fighter_equipment_2_short: "J7W2"
 jap_jet_fighter_equipment_2_desc: "J7W1, переоборудованный турбореактивными двигателями, представляет собой чрезвычайно быстрый, маневренный и хорошо вооруженный истребитель, способный поражать любые цели — от стратегических бомбардировщиков до истребителей противника, хотя и ограниченный относительно небольшой дальностью полета для той эпохи по сравнению с винтовыми самолетами.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_jet_fighter_equipment_3: "Ki-287 Kōryū"
 jap_jet_fighter_equipment_3_short: "Ki-287"
 jap_jet_fighter_equipment_3_desc: "Этот самолет не существовал. Однако это чрезвычайно эффективный истребитель реактивной эры.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_fighter_equipment_0: "Nakajima A4N"
 jap_cv_fighter_equipment_0_short: "A4N"
 jap_cv_fighter_equipment_0_desc: "Разработанный изначально как частная инициатива Nakajima для флота, A4N является общим улучшением старого A2N. Биплан смешанной конструкции, он оснащен радиальным двигателем Hikari, вооружен 2x 7,7-мм пушками Type 97 Mgs и способен совершать крейсерские полеты на приличную дальность благодаря крыльевым сбрасываемым бакам.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_fighter_equipment_1: "A5M2 Claude"
 jap_cv_fighter_equipment_1_short: "A5M2"
 jap_cv_fighter_equipment_1_desc: "Claude только что поступил на вооружение и является передовым истребителем-носителем, обладающим высокой маневренностью и скоростью, хотя и плохо вооруженным. Тем не менее, он оказался эффективным для региона, в котором оказался.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_fighter_equipment_2: "A6M2 Reisen"
 jap_cv_fighter_equipment_2_short: "A6M2"
 jap_cv_fighter_equipment_2_desc: "Печально известный Zero или "Zeke", A6M2 - это фантастическое сочетание маневренности и дальности, если не хватает вооружения. Это один из лучших самолетов-носителей на момент его появления, превосходящий по дальности все остальные самолеты-носители, с доктринальным фокусом на акробатике, надеясь компенсировать отсутствие брони и тяжелого вооружения.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_fighter_equipment_3: "A6M3 Reisen"
 jap_cv_fighter_equipment_3_short: "A6M3"
 jap_cv_fighter_equipment_3_desc: "Модернизированный новыми 20-мм пушками Mark 2 Type 99, оснащенный турбированным двигателем и новым дизайном крыла, A6M3 представляет собой чистую модернизацию A6M2. Обладая лучшим вооружением, маневренностью и скоростью, сохраняя при этом крайне важную дальность для поражения целей на большом расстоянии от авианосца.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_cv_fighter_equipment_4: "A6M5 Reisen"
 jap_cv_fighter_equipment_4_short: "A6M5"
 jap_cv_fighter_equipment_4_desc: "Заменив 7,7-мм пулеметы в самолете на 13,2-мм пулеметы и увеличив боезапас 20-мм пушек за счет использования новой конструкции Mark 4 с ленточным питанием вместо оригинального барабанного магазина, а также заменив пропеллер и используя улучшенный вариант двигателя M3, A6M5 представляет собой меньший скачок в характеристиках, чем M2 в M3, но все же является важным усовершенствованием для истребителя-носителя, продлевая его эффективный срок службы.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 jap_cv_fighter_equipment_5: "A7M2 Reppu"
 jap_cv_fighter_equipment_5_short: "A7M2"
 jap_cv_fighter_equipment_5_desc: "Разработанный для замены относительно устаревшего A6M Zero, Sam быстрее, лучше бронирован, лучше вооружен и лишь немного менее маневренен, чем Zero.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_fighter_equipment_6: "A7M3 Reppu"
 jap_cv_fighter_equipment_6_short: "A7M3"
 jap_cv_fighter_equipment_6_desc: "Переоснащенный в общей сложности 6 пушками Type 99 Mark 4 калибра 20 мм, A7M3 способен выдавать огромную огневую мощь, сохраняя при этом фирменную маневренность и дальность полета предыдущих японских палубных истребителей.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_cv_fighter_equipment_7: "A7M3-J Reppu Kai"
 jap_cv_fighter_equipment_7_short: "A7M3-J"
 jap_cv_fighter_equipment_7_desc: "Оснащенный шестью новыми скорострельными 30-мм пушками Type 5 и новым двигателем с турбонаддувом Ha-43, этот вариант перехватчика A7M является чрезвычайно эффективным винтовым перехватчиком и эффективным использованием старых рам A7M.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 jap_jet_cv_fighter_equipment_1: "A8W4 Shinden Kai"
 jap_jet_cv_fighter_equipment_1_short: "A8W4"
 jap_jet_cv_fighter_equipment_1_desc: "Авианосный самолет A8W4, являющийся всесторонним усовершенствованием платформы R2Y2, является фантастическим примером реактивного самолета, который может похвастаться превосходной маневренностью, вооружением, скоростью и дальностью полета по сравнению с другими реактивными самолетами той эпохи.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_jet_cv_fighter_equipment_3: "A8W7 Shinden Kai"
 jap_jet_cv_fighter_equipment_3_short: "A8W7"
 jap_jet_cv_fighter_equipment_3_desc: "Умеренное улучшение варианта W4, W7 оснащен новыми более мощными и эффективными двигателями и крыльями, обеспечивающими увеличенный боезапас, увеличенную дальность полета и лучшую маневренность по сравнению с предшественником.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 jap_heavy_fighter_equipment_1: "Ki-45 Toryu"
 jap_heavy_fighter_equipment_1_short: "Ki-45"
 jap_heavy_fighter_equipment_1_desc: "Двухместный тяжелый истребитель Nick был разработан для эскортных задач, но быстро оказался менее маневренным и неконкурентоспособным в попытках противостоять современным истребителям, оставаясь при этом слишком плохо вооруженным, чтобы успешно выполнять функции перехватчика.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_heavy_fighter_equipment_2: "Ki-96 Kawasaki"
 jap_heavy_fighter_equipment_2_short: "Ki-96"
 jap_heavy_fighter_equipment_2_desc: "Ki-96, разработанный для замены устаревшего Ki-45, является достойным тяжелым истребителем, маневренным для тяжелого истребителя с двумя двигателями, имеющим слишком легкое вооружение, чтобы угрожать тяжелым бомбардировщикам, но достаточно маневренным, чтобы поражать истребители противника на удаленной территории.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_heavy_fighter_equipment_3: "Ki-83 Mitsubishi"
 jap_heavy_fighter_equipment_3_short: "Ki-83"
 jap_heavy_fighter_equipment_3_desc: "Частично вдохновленный Ki-46 и использующий того же конструктора, Ki-83 быстр и тяжело вооружен по японским стандартам, хотя все еще более легко вооружен, чем любой другой сопоставимый тяжелый истребитель той эпохи. Способный вступать в бой с вражескими истребителями благодаря своей маневренности, он все еще не имеет вооружения, чтобы должным образом и надежно вступать в бой с тяжелыми бомбардировщиками.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_heavy_fighter_equipment_4: "R2Y1 Yokosuka"
 jap_heavy_fighter_equipment_4_short: "R2Y1"
 jap_heavy_fighter_equipment_4_desc: "Созданный на основе разведывательного самолета R2Y, этот винтовой предшественник R2Y2 является достойным тяжелым истребителем, наконец-то хорошо оснащенным для борьбы с тяжелыми бомбардировщиками. Хотя по стандартам других стран он все еще относительно легко оснащен, этот тяжелый истребитель дорог, но не имеет себе равных по маневренности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_attacker_equipment_1: "Ki-102 Kawasaki"
 jap_attacker_equipment_1_short: "Ki-102"
 jap_attacker_equipment_1_desc: "Разработанный как штурмовой самолет, Randy оснащен 57-мм или 37-мм пушкой, по крайней мере двумя 20-мм пушками и 12,7-мм пулеметом. Способный поражать наземные цели на чрезвычайно глубоком фронте, этот атакующий самолет, к сожалению, недостаточно силен и, в свою очередь, оставляет маневренность неудовлетворительной. Посредственная бомбовая нагрузка и сосредоточенность на пушках сделали его возможности наземной поддержки посредственными.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_attacker_equipment_2: "Ki-93 Rikugun"
 jap_attacker_equipment_2_short: "Ki-93"
 jap_attacker_equipment_2_desc: "Стремясь стать более эффективным самолетом для борьбы с судоходством и бомбардировщиков, этот тяжелый истребитель не преуспевает ни в том, ни в другом. Единственное реальное преимущество этого самолета — его дальность, которая позволяет нескольким слоям перехватывать бомбардировщики на маршруте и проецировать авиацию по всему полушарию с континентальных или тихоокеанских баз.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cas_equipment_1: "Ki-3 Kawasaki"
 jap_cas_equipment_1_short: "Ki-3"
 jap_cas_equipment_1_desc: "Разработанный как легкий бомбардировщик и представленный в 1934 году, Ki-3 был неплох для своей эпохи. Оснащенный приличной бомбовой нагрузкой и чрезвычайно маневренный, этот плохо вооруженный и бронированный истребитель был чрезвычайно уязвим для наземного огня или вражеских самолетов и нуждался в незащищенном воздушном пространстве, чтобы проявить себя.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cas_equipment_2: "Ki-32 Kawasaki"
 jap_cas_equipment_2_short: "Ki-32"
 jap_cas_equipment_2_desc: "Обладая превосходной маневренностью, Mary является всесторонней модернизацией с точки зрения замены устаревшего Ki-3. Оснащенная улучшенной бомбовой нагрузкой и приличной дальностью, эта временная замена должна помочь армии.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cas_equipment_3: "Ki-51 Mitsubishi"
 jap_cas_equipment_3_short: "Ki-51 `Sonia`"
 jap_cas_equipment_3_desc: "Желанная замена Mary, Sonia — это способный легкий бомбардировщик, который также может использоваться для противокорабельных и морских патрульных задач. Ki-51 был ответственен за последнее потопление японцами американского корабля. В день атомной бомбардировки Хиросимы Ki-51 потопил подводную лодку USS Bullhead класса Balao со всем экипажем.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cas_equipment_4: "Ki-71 Mitsubishi"
 jap_cas_equipment_4_short: "Ki-71 `Edna`"
 jap_cas_equipment_4_desc: "Попытка разработать усовершенствованную версию Ki-51. Ki-71 имеет более мощный двигатель, улучшенное вооружение и убирающееся шасси, что улучшает его аэродинамические характеристики. К сожалению, максимальная скорость и дальность полета не намного лучше, чем у Sonia, что несколько ограничивает возможности Edna.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_cas_equipment_5: "D4Y3 Suisei"
 jap_cas_equipment_5_short: "D4Y3 Suisei"
 jap_cas_equipment_5_desc: "Наземная версия D4Y. Оснащенная увеличенной бомбовой нагрузкой, улучшенным двигателем и 13,2-мм пулеметами, Y4 представляет собой умеренную модернизацию Judy.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_jet_fighter_multirole_equipment_1: "Kikka Kai"
 jap_jet_fighter_multirole_equipment_1_short: "Kikka"
 jap_jet_fighter_multirole_equipment_1_desc: "J9N Orange Blossom, созданный на основе немецких разработок для Me 262, является быстрым, хотя и плохо вооруженным специализированным легким бомбардировщиком. Плохо вооруженный для наземной поддержки, с капризными двигателями и малой дальностью полета, фактическое использование этого самолета в бою является спорным.\nРАЗРЕШЕНО, ЕСЛИ ЛЮБОЕ ИЗ УСЛОВИЙ ВЕРНО:\n§YВходит в состав Германии§!, §YГермания является марионеткой Японии§! или §YГермания завершила фокус на сотрудничестве с Японией§!\n"
  
 jap_jet_fighter_multirole_equipment_2: "Ki-201 Karyū"
 jap_jet_fighter_multirole_equipment_2_short: "Ki-201"
 jap_jet_fighter_multirole_equipment_2_desc: "Реактивный истребитель-штурмовик Ki-201 во многом создан на базе Me 262 Schnellbomber, но все еще страдает от многих проблем, характерных для предыдущих японских реактивных самолетов, таких как плохие летные характеристики и вооружение.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_jet_cas_equipment_2: "R2Y3 Keiun Kai"
 jap_jet_cas_equipment_2_short: "R2Y3"
 jap_jet_cas_equipment_2_desc: "Бомбардировочный вариант реактивного R2Y2, этот легкий бомбардировщик все еще не имеет вооружения, необходимого для надлежащего поражения наземных целей без подавляющего численного превосходства.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_jet_cas_equipment_3: "J10Y Shinryū"
 jap_jet_cas_equipment_3_short: "J10Y"
 jap_jet_cas_equipment_3_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_cv_cas_equipment_1: "D1A"
 jap_cv_cas_equipment_1_short: "D1A"
 jap_cv_cas_equipment_1_desc: "Пикирующий бомбардировщик палубного базирования Susie — это легковооруженный и относительно медленный палубный бомбардировщик, но он доказал свою полезность в этой роли исключительно благодаря своей способности быть пикирующим бомбардировщиком палубного базирования.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_cas_equipment_2: "D3A"
 jap_cv_cas_equipment_2_short: "D3A"
 jap_cv_cas_equipment_2_desc: "`Вал` все еще слишком легок, чтобы успешно сражаться с крупными надводными кораблями, но хорошо оснащен для атаки целей на суше или легких судов в море и может похвастаться значительно большей дальностью полета по сравнению со своим армейским аналогом.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_cas_equipment_3: "D4Y1"
 jap_cv_cas_equipment_3_short: "D4Y1"
 jap_cv_cas_equipment_3_desc: "Разработанный с упором на повышение живучести и противокорабельных возможностей, Judy является достойной заменой Val и наверняка окажет поддержку нашим армиям на суше и на море против более легких судов.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_cv_cas_equipment_4: "D4Y4"
 jap_cv_cas_equipment_4_short: "D4Y4"
 jap_cv_cas_equipment_4_desc: "Оснащенный увеличенной бомбовой нагрузкой, улучшенным двигателем и 13,2-мм пулеметами, Y4 представляет собой умеренную модернизацию Judy без особых улучшений в плане эксплуатации на море.\n§GHe сохранит 95% эффективности предыдущей модели.§!"
  
 jap_cv_cas_equipment_5: "D4Y5"
 jap_cv_cas_equipment_5_short: "D4Y5"
 jap_cv_cas_equipment_5_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_cv_nav_bomber_equipment_1: "B4Y1 Suisei"
 jap_cv_nav_bomber_equipment_1_short: "B4Y1"
 jap_cv_nav_bomber_equipment_1_desc: "Авианосный торпедоносец-бомбардировщик Jean только что поступил на вооружение и будет служить авианосцам нашего флота против наших врагов в Тихом океане. К сожалению, несмотря на то, что он благословлен хорошими торпедами, Jean медленный, плохо бронированный и плохо вооруженный.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_nav_bomber_equipment_2: "Nakajima B5N2"
 jap_cv_nav_bomber_equipment_2_short: "B5N2"
 jap_cv_nav_bomber_equipment_2_desc: "Более быстрый и дальнобойный, чем B4Y1, Kate — это эффективный палубный торпедоносец-бомбардировщик, который сможет поражать крупные корабли противника на расстоянии или, возможно, даже пока они находятся в порту.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_nav_bomber_equipment_3: "B6N2 Tenzen"
 jap_cv_nav_bomber_equipment_3_short: "B6N2"
 jap_cv_nav_bomber_equipment_3_desc: "Обладая фантастической дальностью и тяжелой торпедой, Jill быстр для торпедоносца, но ему не хватает брони. С этим мы сможем вступать в бой с вражескими кораблями, где бы они ни находились в Тихом океане.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_nav_bomber_equipment_4: "B7A2 Ryusei"
 jap_cv_nav_bomber_equipment_4_short: "B7A2"
 jap_cv_nav_bomber_equipment_4_desc: "`Торпедоносец-пикирующий бомбардировщик`, Grace — это значительное улучшение по сравнению с Tenzen. Быстрее, гораздо лучше вооружен и, хотя и легко бронирован, оснащен тяжелым боезапасом торпед или бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_cv_nav_bomber_equipment_5: "B8A2 Ginga"
 jap_cv_nav_bomber_equipment_5_short: "B8A2"
 jap_cv_nav_bomber_equipment_5_desc: "Несмотря на свою медлительность, Ginga компенсирует незначительное снижение скорости за счет улучшенной бомбовой нагрузки и бронирования, сохраняя при этом дальность полета мирового класса.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_jet_cv_nav_bomber_equipment_1: "P1Y Taihō"
 jap_jet_cv_nav_bomber_equipment_1_short: "P1Y"
 jap_jet_cv_nav_bomber_equipment_1_desc: "Разработанный как первый турбореактивный истребитель-палубник Японии, P1Y имеет меньшую дальность полета в обмен на лучшую броню, скорость и маневренность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_jet_cv_nav_bomber_equipment_2: "P2Y Taiho"
 jap_jet_cv_nav_bomber_equipment_2_short: "P2Y"
 jap_jet_cv_nav_bomber_equipment_2_desc: "Прямое улучшение P1Y, Taiho отличается превосходной скоростью, дальностью, броней и вооружением. Поистине этот самолет потопит флоты мира.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_patrol_equipment_1: "H3K"
 jap_patrol_equipment_1_short: "H3K"
 jap_patrol_equipment_1_desc: "Большой летающий катер, мы можем использовать его для защиты нашей торговли и путей снабжения около Китая и Маньчжурии.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_patrol_equipment_2: "H6K2"
 jap_patrol_equipment_2_short: "H6K2"
 jap_patrol_equipment_2_desc: "Чрезвычайно большой летающий катер, способный патрулировать Тихий океан, Mavis оснащен бомбами, пулеметными турелями и хвостовой 20-мм турелью, идеально подходит для поражения открытых вражеских судов или защиты наших внутренних линий от подводных лодок, но неспособен противостоять огневой мощи более тяжело вооруженных истребителей.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_patrol_equipment_3: "H6K4"
 jap_patrol_equipment_3_short: "H6K4"
 jap_patrol_equipment_3_desc: "Оснащенная новыми двигателями и вооружением, эта модернизация позволит H6K4 сохранить способность защищать наши внутренние линии по мере расширения наших владений по всему Тихому океану.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_patrol_equipment_4: "H8K2"
 jap_patrol_equipment_4_short: "H8K2"
 jap_patrol_equipment_4_desc: "Более быстрый, лучше вооруженный и бронированный, чем H6K, Emily способен поддерживать нашу проекцию силы через Тихий океан и даже выживать в спорных воздушных зонах.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_patrol_equipment_5: "H8K3"
 jap_patrol_equipment_5_short: "H8K3"
 jap_patrol_equipment_5_desc: "Оснащение башен и поплавков механизмами отвода обеспечивает незначительное улучшение скорости и дальности, хотя и за счет более высокой себестоимости производства из-за возросшей сложности компонентов.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 jap_patrol_equipment_6: "H11K Soku"
 jap_patrol_equipment_6_short: "H11K"
 jap_patrol_equipment_6_desc: "Оснащенный четырьмя крупнейшими двигателями, известными Mitsubishi, H11K способен защищать судоходные пути почти на межконтинентальном расстоянии. Хотя некоторые могут отвлечься от идеи гидросамолета, этот самолет все еще обеспечивает ценную, хотя и дорогую, службу против вражеских подводных лодок и рейдеров, не засоряя при этом авиабазы ​​вблизи фронта.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strike_bomber_equipment_1: "Ki-48 Sokei"
 jap_strike_bomber_equipment_1_short: "Ki-48"
 jap_strike_bomber_equipment_1_desc: "Разработанный как высокоскоростной легкий бомбардировщик, самолет Lily частично вдохновлен советским самолетом Туполев СБ и обладая превосходной дальностью полета, хотя и не имея достаточной бомбовой грузоподъемности, Ki-48 является фантастическим решением для поддержки наших войск на обширных просторах континентальной Азии.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strike_bomber_equipment_2: "Ki-49 Donryu"
 jap_strike_bomber_equipment_2_short: "Ki-49"
 jap_strike_bomber_equipment_2_desc: "Первоначально спроектированный как тяжелый бомбардировщик, Helen изначально заменил Ki-21, когда тот поступил на вооружение, но его улучшенная бомбовая нагрузка в сочетании с уменьшенной дальностью полета быстро выдвинули его на роль, которую ранее занимал Lily.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_strike_bomber_equipment_3: "Ki-66 Kawasaki"
 jap_strike_bomber_equipment_3_short: "Ki-66"
 jap_strike_bomber_equipment_3_desc: "Первоначально задуманный как двухмоторный пикирующий бомбардировщик, смоделированный на основе немецких успехов в Польше, этот самолет непосредственной поддержки отличается приемлемой дальностью полета, маневренностью и бомбовой нагрузкой, но при этом не выделяется ни в одной отдельной категории.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strike_bomber_equipment_4: "Ki-67 Hiryu"
 jap_strike_bomber_equipment_4_short: "Ki-67"
 jap_strike_bomber_equipment_4_desc: "Тяжелый бомбардировщик по своему назначению, Peggy — это быстрый ударный бомбардировщик с огромной дальностью полета, способный поражать цели по всей Азии, и даже оснащенный достаточно большой бомбовой нагрузкой, чтобы оставаться конкурентоспособным в современных конфликтах.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_strike_bomber_equipment_5: "Ki-74 Taiyo"
 jap_strike_bomber_equipment_5_short: "Ki-74"
 jap_strike_bomber_equipment_5_desc: "Быстрая и с небольшим улучшением дальности полета Patsy является незначительным улучшением по сравнению с Ki-67.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_tac_bomber_equipment_1: "G3M Rikko"
 jap_tac_bomber_equipment_1_short: "G3M"
 jap_tac_bomber_equipment_1_desc: "Средний бомбардировщик по назначению и ударный бомбардировщик по требованиям, `Тина` летает далеко, но медленно, слабо вооружен и несет разочаровывающую бомбовую нагрузку.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_tac_bomber_equipment_2: "G4M1 Hamaki"
 jap_tac_bomber_equipment_2_short: "G4M1"
 jap_tac_bomber_equipment_2_desc: "Тактический бомбардировщик, заказанный флотом, Betty должен был похвастаться превосходной дальностью полета в дополнение к фокусировке на морской войне. Однако это сделало его недостаточным на суше и слишком плохо бронированным для поражения морских целей, которые могут похвастаться даже умеренными противовоздушными возможностями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_tac_bomber_equipment_3: "G4M2"
 jap_tac_bomber_equipment_3_short: "G4M2"
 jap_tac_bomber_equipment_3_desc: "Новые двигатели и переработанные топливные баки, а также умеренное, хотя и недостаточное, усиление оборонительного вооружения не позволяют Betty потерять всю свою актуальность, хотя она определенно ощущает возраст и недостаток брони.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 jap_tac_bomber_equipment_4: "G4M3"
 jap_tac_bomber_equipment_4_short: "G4M3"
 jap_tac_bomber_equipment_4_desc: "Вариант M3 самолета Betty, оснащенный самогерметизирующимися топливными баками и дополнительными 20-мм оборонительными башнями, на данном этапе может использоваться только в качестве морского бомбардировщика для борьбы с легкими целями, не имея значительной обычной бомбовой нагрузки по сравнению с другими самолетами, наносящими удары по наземным целям.\n§GЭта модель сохранит 95% эффективности предыдущей модели.§!"
  
 jap_tac_bomber_equipment_5: "G7M"
 jap_tac_bomber_equipment_5_short: "G7M"
 jap_tac_bomber_equipment_5_desc: "Разработанный для окончательной замены G4M3, `Great Mountain` по-прежнему не имеет брони, вооружения и даже может похвастаться уменьшенной дальностью полета, чтобы вместить умеренное улучшение оборонительного вооружения, что по-прежнему делает самолет бесполезным против любых целей, кроме легких морских целей.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 jap_jet_tac_bomber_equipment_1: "Ki-210 Unryu"
 jap_jet_tac_bomber_equipment_1_short: "Ki-210"
 jap_jet_tac_bomber_equipment_1_desc: "Этот двухмоторный турбореактивный средний бомбардировщик, впервые оснащенный тяжелой бомбовой нагрузкой, быстр, дален для реактивного самолета и способен безнаказанно уничтожать цели на море и на суше.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 jap_strat_bomber_equipment_1: "Ki-20"
 jap_strat_bomber_equipment_1_short: "Ki-20"
 jap_strat_bomber_equipment_1_desc: "Представленный в 1932 году, этот большой стратегический бомбардировщик, созданный на базе авиалайнера Junkers G.38, был произведен по лицензии лишь в небольшом количестве.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strat_bomber_equipment_2: "Ki-21"
 jap_strat_bomber_equipment_2_short: "Ki-21"
 jap_strat_bomber_equipment_2_desc: "Разработанный как тяжелый бомбардировщик для замены Ki-20, Gwen значительно жертвует бомбовой нагрузкой ради большей дальности и скорости, хотя и полностью лишен брони и вооружения.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strat_bomber_equipment_3: "G5N1 Shinzan"
 jap_strat_bomber_equipment_3_short: "G5N1"
 jap_strat_bomber_equipment_3_desc: "Заказанный ВМС, Liz — это сверхдальний четырехмоторный тяжелый бомбардировщик, оснащенный 20-мм оборонительными пушками, предназначенный для разрушения укреплений на островах по всему Тихому океану, нанося удары с баз, расположенных в глубине безопасной территории.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strat_bomber_equipment_4: "G8N1 Renzan"
 jap_strat_bomber_equipment_4_short: "G8N1"
 jap_strat_bomber_equipment_4_desc: "Оснащенный тяжелым оборонительным вооружением из шести 20-мм пушек и четырех 13-мм пулеметов, `Рита` представляет собой огромный и дальний бомбардировщик, способный поражать наземные сооружения по всему Тихому океану и континентальной Азии, хотя его производство обходится дорого.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_strat_bomber_equipment_5: "G10N Fugaku"
 jap_strat_bomber_equipment_5_short: "G10N"
 jap_strat_bomber_equipment_5_desc: "Разработанный как сверхмощный тяжелый бомбардировщик сверхдальнего радиуса действия, способный атаковать западное побережье Соединенных Штатов, `Гора Фудзи` чрезвычайно тяжело вооружена и несет двадцать тонн бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 jap_jet_strat_bomber_equipment_1: "G12N Hijiri"
 jap_jet_strat_bomber_equipment_1_short: "G12N"
 jap_jet_strat_bomber_equipment_1_desc: "Тяжелый бомбардировщик с четырьмя турбореактивными двигателями G12N несет больше бомб, чем G10N, и значительно быстрее, но ради этого жертвует дальностью полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
  
 ger_transport_plane_equipment_1: "Ju-52"
 ger_transport_plane_equipment_1_short: "Ju-52"
 ger_transport_plane_equipment_1_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_transport_plane_equipment_2: "He 111 F-4"
 ger_transport_plane_equipment_2_short: "He 111 F-4"
 ger_transport_plane_equipment_2_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_transport_plane_equipment_3: "Ju-252"
 ger_transport_plane_equipment_3_short: "Ju-252"
 ger_transport_plane_equipment_3_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_transport_plane_equipment_4: "He 111 G-3"
 ger_transport_plane_equipment_4_short: "He 111 G-3"
 ger_transport_plane_equipment_4_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_scout_plane_equipment_1: "He 46C-1"
 ger_scout_plane_equipment_1_short: "He 46C-1"
 ger_scout_plane_equipment_1_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_scout_plane_equipment_2: "Hs 126"
 ger_scout_plane_equipment_2_short: "Hs 126"
 ger_scout_plane_equipment_2_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_scout_plane_equipment_3: "Fw 189"
 ger_scout_plane_equipment_3_short: "Fw 189"
 ger_scout_plane_equipment_3_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_jet_scout_plane_equipment_1: "Me 462"
 ger_jet_scout_plane_equipment_1_short: "Me 462"
 ger_jet_scout_plane_equipment_1_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ger_fighter_equipment_1: "He 51"
 ger_fighter_equipment_1_short: "He 51"
 ger_fighter_equipment_1_desc: "He 51 — это обычный одноместный биплан с цельнометаллической конструкцией и тканевой обшивкой. He оснащен двигателем BMW VI с гликолевым охлаждением, вооружение — два 7,92-мм пулемета, установленных над двигателем.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ger_fighter_equipment_2: "Bf 109 B-1 `Berta`"
 ger_fighter_equipment_2_short: "Bf 109 B-1"
 ger_fighter_equipment_2_desc: "Боевой конь нового Люфтваффе, Messerschmitt Bf 109, воплощает в себе последние достижения в области монопланов и поршневых двигателей. Bf 109 B-1 легко вооружен двумя 7,92-мм MG17 из-за хрупкой конструкции и использования более слабого двигателя. \n§RЭто совершенно новая модель, и она не сохранит эффективность§!"
  
 ger_fighter_equipment_3: "Bf 109 D-1"
 ger_fighter_equipment_3_short: "Bf 109 D-1"
 ger_fighter_equipment_3_desc: "Bf 109 D-1 представляет собой усовершенствованную версию более ранней модели, в которой усилены крылья и добавлены два дополнительных 7,92-мм пулемета MG 17, установленных в крыльях. \n§GЭто позволит сохранить 95% эффективности и преобразовать $ger_fighter_equipment_2$§!"
  
 ger_fighter_equipment_4: "Bf 109 E-4 `Emil`"
 ger_fighter_equipment_4_short: "Bf 109 E-4"
 ger_fighter_equipment_4_desc: "Bf 109 E-4 — это первая крупная переделка планера 109, которая улучшает уровень защиты пилота и представляет две недавно разработанные 20-мм пушки MG FF/M в крыльях. Более крупный и мощный двигатель Daimler-Benz DB 601A обеспечивает значительное увеличение производительности по сравнению с более ранними моделями. \n§GЭто позволит сохранить 95% эффективности и перейти от более ранних моделей.§!"
  
 ger_fighter_equipment_5: "Bf 109 E-7 `Emil`"
 ger_fighter_equipment_5_short: "Bf 109 E-7"
 ger_fighter_equipment_5_desc: "Bf 109 E-7 улучшает самую большую слабость ранних 109, а именно ограниченную дальность и недостаточную мощность. Сбрасываемый бак и новый двигатель DB 601N делают его существенным улучшением по сравнению с E-4.\n§GЭто сохранит 95% эффективности и преобразует из более ранних моделей.§!"
  
 ger_fighter_equipment_6: "Bf 109 F-4 `Friedrich`"
 ger_fighter_equipment_6_short: "Bf 109 F-4"
 ger_fighter_equipment_6_desc: "Вторая радикальная переделка планера 109. F-4 значительно улучшает аэродинамические характеристики 109. Новый улучшенный двигатель Daimler-Benz DB 601E позволяет этому самолету быть одним из лучших в мире в свое время. Это достигается ценой сокращения вооружения до одного 20-мм MG 151/20 и двух 7,92-мм MG17, но центрирования их в носу. \n§GЭто сохранит 95% эффективности и преобразования из более ранних моделей.§!"
  
 ger_fighter_equipment_7: "Bf 109 G-6 `Gustav`"
 ger_fighter_equipment_7_short: "Bf 109 G-6"
 ger_fighter_equipment_7_desc: "В основном идентичен серии F. Однако 7,92-мм MG17 заменены на более крупнокалиберные 13-мм MG 131 для повышения летальности, а также был введен немного улучшенный двигатель DB 605A. \n§GЭто сохранит 95% эффективности и преобразует из $ger_fighter_equipment_6$§!"
  
 ger_fighter_equipment_8: "Bf 109 K-4 `Kurfürst`"
 ger_fighter_equipment_8_short: "Bf 109 K-4"
 ger_fighter_equipment_8_desc: "Новый 30-мм MK 108 заменяет 20-мм автопушки предыдущих моделей, а дополнительные усовершенствования двигателя сделали этот вариант самым быстрым и самым тяжеловооруженным 109-м за всю войну. Планер Bf 109 к этому моменту в значительной степени достиг предела в плане улучшений, с которыми он справляется. \n§GЭто сохранит 95% эффективности и переделает из более ранних моделей.§!"
  
 ger_fighter_multirole_equipment_1: "Fw 190 A-2 `Würger`"
 ger_fighter_multirole_equipment_1_short: "Fw 190 A-2"
 ger_fighter_multirole_equipment_1_desc: "Разработанный Куртом Танком в Focke-Wulf, Fw 190 имеет потенциал стать основой Jagdwaffe Люфтваффе. A-2 представляет мощный двигатель BMW 801C-2, позволяющий ему нести тяжелый арсенал из двух установленных в корне крыла 20-мм MG 151, двух установленных на фюзеляже 7,92-мм MG 17 и двух установленных на крыльях 20-мм MG FF/M. \n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ger_fighter_multirole_equipment_2: "Fw 190 A-4 `Würger`"
 ger_fighter_multirole_equipment_2_short: "Fw 190 A-4"
 ger_fighter_multirole_equipment_2_desc: "Оснащенный более мощным двигателем BMW 801 D-2, самолет A-4 мог нести ракеты и бомбы, а также хорошо выполнять функции штурмовика.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 ger_fighter_multirole_equipment_3: "Fw 190 A-6 `Würger`"
 ger_fighter_multirole_equipment_3_short: "Fw 190 A-6"
 ger_fighter_multirole_equipment_3_desc: "Было введено структурно переработанное и более легкое крыло, а обычное вооружение было улучшено путем замены пушек MG FF на две 20-мм пушки MG 151/20E. Смещенный центр тяжести и более легкие крылья также обеспечивают улучшенную маневренность.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ger_fighter_multirole_equipment_4: "Fw 190 D-9 `Dora`"
 ger_fighter_multirole_equipment_4_short: "Fw 190 D-9"
 ger_fighter_multirole_equipment_4_desc: "Fw 190 `Dora` оснащен двухступенчатым двигателем Junkers Jumo 213E с наддувом, что делает D-9 фантастическим истребителем завоевания превосходства в воздухе. Огневая мощь дополнительно улучшена за счет двух фюзеляжных 13-мм пулеметов MG 131, заменяющих 7,92-мм пулеметы MG 17.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ger_fighter_multirole_equipment_5: "Ta 152 C-3 `Würger`"
 ger_fighter_multirole_equipment_5_short: "Ta 152 C-3"
 ger_fighter_multirole_equipment_5_desc: "Лучший истребитель Курта Танка, Ta 152, представляет собой удлиненный фюзеляж Fw 190 D-9 с увеличенным размахом крыльев. Массивный двигатель Daimler-Benz DB603 делает Ta-152 одним из самых быстрых поршневых истребителей в мире. Модель C-3 оснащена арсеналом из одной центральной 30-мм пушки MK108 и четырех синхронизированных 20-мм пушек MG151/20, стреляющих через пропеллер.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ger_jet_fighter_multirole_equipment_1: "Me 262 `Schwalbe`"
 ger_jet_fighter_multirole_equipment_1_short: "Me 262"
 ger_jet_fighter_multirole_equipment_1_desc: "Первый реактивный истребитель, поступивший на вооружение, вооруженный 4 смертоносными 30-мм автопушками и 2 реактивными двигателями Jumo 004. Этот истребитель превосходит все существующие винтовые конструкции, обладая большей скоростью, ускорением, скороподъемностью и огневой мощью, чем большинство винтовых конструкций. Однако его реактивные двигатели имеют чрезвычайно высокий расход топлива, а также ресурсоемкость и стоимость производства.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
