 sov_fighter_equipment_1: "И-15"
 sov_fighter_equipment_1_short: "И-15"
 sov_fighter_equipment_1_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 sov_fighter_equipment_2: "И-153"
 sov_fighter_equipment_2_short: "И-153"
 sov_fighter_equipment_2_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 sov_fighter_equipment_3: "Як-1"
 sov_fighter_equipment_3_short: "Як-1"
 sov_fighter_equipment_3_desc: "Сделанный из полностью деревянного корпуса для экономии ресурсов, Як 1, тем не менее, является шагом вперед по сравнению со старыми устаревшими конструкциями. Легкая рама не обеспечивает многого с точки зрения защиты, но она освобождает вес для 20-мм ШВАК, 2x 7,62-мм пушек ШКАС и относительно маневренных характеристик.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 sov_fighter_equipment_4: "Як-7Б"
 sov_fighter_equipment_4_short: "Як-7Б"
 sov_fighter_equipment_4_desc: "Як-7 изначально задумывался как двухместная учебная версия Як-1. Однако инженеры ОКБ Яковлева модифицировали самолет в одноместный истребитель, превосходящий Як-1. Модель B заменяет 7,62-мм пулеметы ШКАС на 12,7-мм крупнокалиберные пулеметы УБС и оснащена лучшей защитой для пилота.\n§GЭто сохранит 95% эффективности от $sov_fighter_equipment_3$§!"
  
 sov_fighter_equipment_5: "Як-9Д"
 sov_fighter_equipment_5_short: "Як-9Д"
 sov_fighter_equipment_5_desc: "Дальнейшее развитие прочного Як-7Б, Як-9 построен из более легкой композитной металлодеревянной конструкции, что обеспечивает улучшенную защиту и увеличенный запас топлива. Модель D — это дальний истребитель сопровождения с существенно увеличенным запасом топлива. Однако увеличенный вес несколько снижает его маневренность.\n§GЭто сохранит 95% эффективности и может конвертироваться из $sov_fighter_equipment_4$§!"
  
 sov_fighter_equipment_6: "Як-9У (ВК105)"
 sov_fighter_equipment_6_short: "Як-9У"
 sov_fighter_equipment_6_desc: "Окончательный вариант Як-9, Як-9У поставляется с новым более мощным двигателем и улучшенной аэродинамикой. Это приводит к значительно улучшенной скорости и маневренности, сохраняя при этом хорошую дальность полета.\n§GЭто сохранит 95% эффективности и может конвертироваться из $sov_fighter_equipment_5$§!"
  
 sov_fighter_equipment_7: "Як-9УТ"
 sov_fighter_equipment_7_short: "Як-9УТ"
 sov_fighter_equipment_7_desc: "Як-9УТ берет и без того превосходные характеристики Як-9У и улучшает их, заменяя предыдущее вооружение на 23-мм пушку НС-23С и две 20-мм пушки Б-20, что приводит к существенному увеличению огневой мощи.\n§GЭто сохранит 95% эффективности и может быть преобразовано из $sov_fighter_equipment_6$§!"
  
 sov_fighter_equipment_8: "Як-9П"
 sov_fighter_equipment_8_short: "Як-9П"
 sov_fighter_equipment_8_desc: "Последняя и самая продвинутая версия поршневых истребителей Яковлева. В отличие от своего предшественника, Як-9П имеет более легкую, цельнометаллическую конструкцию, позволяющую нести более мощную 37-мм пушку Н-37 и улучшенную внутреннюю топливную емкость для большей дальности.\n§GЭто сохранит 95% эффективности от $sov_fighter_equipment_7$§!"
  
