 SOV_yer_2_2ach30b_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_tu_4_airframe: "Туполев Ту-4 `Бык`"
 SOV_tu_4_airframe_short: "Ту-4"
 SOV_tu_4_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_tu_16_airframe: "Туполев Ту-16 `Барсук`"
 SOV_tu_16_airframe_short: "Ту-16"
 SOV_tu_16_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
  
 ENG_gauntlet_airframe: "Gloster Gauntlet"
 ENG_gauntlet_airframe_short: "Gloster Gauntlet"
 ENG_gauntlet_airframe_desc: "Биплан с открытой кабиной, на удивление хорошими летными характеристиками и приличным вооружением из двух 7,7-мм пулеметов Vickers E.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_gladiator_airframe: "Gloster Gladiator"
 ENG_gladiator_airframe_short: "Gladiator Mk II"
 ENG_gladiator_airframe_desc: "Благодаря полностью металлическому фюзеляжу и закрытой кабине Gladiator может похвастаться еще более высокими летными характеристиками, а также удвоенной огневой мощью и еще большим запасом места.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_spitfire_mkia_airframe: "Supermarine Spitfire Mk Ia"
 ENG_spitfire_mkia_airframe_short: "Spitfire Mk Ia"
 ENG_spitfire_mkia_airframe_desc: "Первый в легендарной линейке истребителей, MkI Spitfire оснащен ранней версией двигателя Rolls-Royce Merlin; мощный, легкий и надежный. MkI Spitfire сочетает в себе превосходную маневренность и надежность с достойной атакой, единственным недостатком является его относительно высокая стоимость производства. \n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_spitfire_mkv_airframe: "Supermarine Spitfire Mk V"
 ENG_spitfire_mkv_airframe_short: "Spitfire Mk V"
 ENG_spitfire_mkv_airframe_desc: "Перспективы Spitfire, показанные в MkI, получили дальнейшее развитие в MkV. Улучшая превосходную маневренность своего предшественника, MkV Spitfire также получает небольшое увеличение дальности, помогая Spitfire стать более универсальным в слаборазвитых театрах военных действий.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ENG_spitfire_f_mkix_airframe: "Supermarine Spitfire F Mk IX"
 ENG_spitfire_f_mkix_airframe_short: "Spitfire Mk IX"
 ENG_spitfire_f_mkix_airframe_desc: "С дальнейшим развитием Spitfire по-прежнему способен превзойти практически любого противника, оставаясь при этом прочным и надежным. Здоровое увеличение огневой мощи также позволяет Spitfire оставаться на уровне с конкурентами.\n§YЭто позволит сохранить эффективность на уровне 95%, но не даст возможности конвертировать данные из предыдущей модели.§!"
  
 eng_fighter_ad_tech_5: "Пакет обновления Merlin 66"
 eng_fighter_ad_tech_5_desc: "Новая версия двигателя Merlin, обозначенная как Merlin 66, еще мощнее предыдущей версии 61 и оснащена новым карбюратором на основе впрыска, полностью устраняющим любые проблемы во время маневров в невесомости и перевернутого полета. Раскрывая максимальный потенциал планера Mk IX, самолеты Spitfire, оснащенные этим новым двигателем, обозначаются как LF (низковысотный истребитель)."
  
 ENG_spitfire_f_mkxiv_airframe: "Supermarine Spitfire F Mk XIV"
 ENG_spitfire_f_mkxiv_airframe_short: "Spitfire Mk XIV"
 ENG_spitfire_f_mkxiv_airframe_desc: "С Mk XIV представлен новый двигатель: массивный Griffon. Теперь, выдавая более 1800 л. с., он дает Spitfire невероятное соотношение мощности к весу. В сочетании с полностью переработанной каплевидной кабиной Mk XIV обладает непревзойденной маневренностью и высочайшей скоростью. Вооруженный двумя 12,7-мм пулеметами M2 Browning вместо легких пулеметов, Mk XIV также обладает более мощным ударом.\n§YЭто позволит сохранить эффективность на уровне 95%, но конвертация из предыдущей модели невозможна.§!"
  
 ENG_spiteful_f16_airframe: "Supermarine Spiteful F16"
 ENG_spiteful_f16_airframe_short: "Spiteful 16"
 ENG_spiteful_f16_airframe_desc: "Переделав Merlin в еще более мощный Griffon, Rolls-Royce производит двигатель, способный разогнать Spitfire до скоростей, почти соперничающих с ранними реактивными самолетами. Spiteful также становится настоящим истребителем дальнего действия с дальностью полета около 1500 км. Последняя разработка линейки Spitfire, Spiteful — это подходящая лебединая песня.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности семейства $ENG_spitfire_mkia_airframe$, поскольку оно является его частью.§!"
  
 ENG_meteor_mk3_airframe: "Gloster Meteor F Mk 3"
 ENG_meteor_mk3_airframe_short: "Meteor F Mk 3"
 ENG_meteor_mk3_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_meteor_mk8_airframe: "Gloster Meteor F Mk 8"
 ENG_meteor_mk8_airframe_short: "Meteor F Mk 8"
 ENG_meteor_mk8_airframe_desc: "Пожертвовав дальностью полета ради усовершенствований и более мощных двигателей Derwent 8, Mk 8 — это пиковая модель, использующая новые технологии, такие как катапультные кресла и улучшенную герметизацию кабины. Радар ПВО можно установить в носу, но это заставит убрать пушки с крыльев.\n§YЭто позволит сохранить эффективность на уровне 95%, но не даст возможности конвертировать из предыдущей модели.§!"
  
 ENG_hunter_f1_airframe: "Hawker Hunter F1"
 ENG_hunter_f1_airframe_short: "Hunter F1"
 ENG_hunter_f1_airframe_desc: "Почти вдвое превышая дальность полета F8 Meteor, Hawker Hunter F1 способен поддерживать бомбардировщики и с легкостью достигать превосходства в воздухе с огромных расстояний благодаря поразительной маневренности и грозному вооружению в виде четырех 30-мм пушек ADEN. В качестве универсального пакета немногие самолеты могут соперничать с Hunter.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_javelin_airframe: "Gloster Javelin FAW1"
 ENG_javelin_airframe_short: "Javelin FAW"
 ENG_javelin_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_demon_i_airframe: "Hawker Demon I"
 ENG_demon_i_airframe_short: "Demon I"
 ENG_demon_i_airframe_desc: "Разработанный на базе легкого бомбардировщика-биплана Hawker Hart, Demon имеет смешанную конструкцию, оснащен улучшенным двигателем Kestrel, а также двумя пулеметами в носовой части.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_hurricane_mki_airframe: "Hawker Hurricane Mk I"
 ENG_hurricane_mki_airframe_short: "Hurricane Mk I"
 ENG_hurricane_mki_airframe_desc: "Hurricane, оснащенный двигателем Rolls-Royce Merlin II и 8 пулеметами Browning калибра 7,7 мм в крыльях, знаменует собой переход к действительно современному моноплану. Несмотря на тканевую обшивку, он значительно удешевляет массовое производство. Большие крылья делают его устойчивой гибкой платформой и удивительно маневренным универсалом.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_hurricane_mkii_airframe: "Hawker Hurricane Mk IIB"
 ENG_hurricane_mkii_airframe_short: "Hurricane Mk II"
 ENG_hurricane_mkii_airframe_desc: "По сравнению с Mk I, Mk II использует усовершенствованную цельнометаллическую обшивку в сочетании с двигателем Merlin XX для более высокой производительности. Это позволяет ему нести на крыльях еще 4 пулемета или, в качестве альтернативы, 20-мм пушки Hispano. Усиленные точки подвески позволяют ему нести приличное количество бомб для поддержки наземных войск.\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 eng_fighter_multirole_ad_tech_2: "Пакет модернизации Hurricane Mk IV"
 eng_fighter_multirole_ad_tech_2_desc: "Прочность и устойчивость крыльев Hurricane делают его идеальным для установки тяжелых 40-мм пушек Vickers S, превращая его в гораздо более эффективный штурмовик. Чтобы дополнить его роль прочностью, кабина и двигатель также могут быть полностью бронированы."
  
 ENG_typhoon_mkia_airframe: "Hawker Typhoon Mk IA"
 ENG_typhoon_mkia_airframe_short: "Typhoon Mk IA"
 ENG_typhoon_mkia_airframe_desc: "Разработанный как перехватчик следующего поколения, Typhoon использует мощный двигатель Napier Sabre для достижения невероятных скоростей по сравнению с его предшественником. Вооружение состоит из 12 крыльевых пулеметов в крыле типа "A" (Mk.IA), а также до 1000 фунтов бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_typhoon_mkib_airframe: "Hawker Typhoon Mk IB"
 ENG_typhoon_mkib_airframe_short: "Typhoon Mk IB"
 ENG_typhoon_mkib_airframe_desc: "Двигатель Napier Sabre IIA обеспечивает Typhoon еще большую мощность, позволяя использовать крыло типа `B` (Mk.IB) с улучшенным вооружением из 4 20-мм пушек Hispano, бомб и ракет, что делает его идеальным истребителем-бомбардировщиком.\n§GЭто позволит сохранить 95% эффективности предыдущей модели.§!"
  
 ENG_tempest_mkv_airframe: "Hawker Tempest Mk V"
 ENG_tempest_mkv_airframe_short: "Tempest Mk V"
 ENG_tempest_mkv_airframe_desc: "Разработанный для преодоления недостатков Typhoon, особенно в маневренности, Tempest более аэродинамически усовершенствован и использует усиленный двигатель Napier Sabre IIB. Почтенные пушки Hispano Mk II заменены на более легкие и скорострельные Mk V. Прочные крылья позволяют нести ассортимент бомб, ракет или даже 47-мм пушек Vickers P, что делает Tempest фантастическим истребителем-бомбардировщиком.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_vampire_fb5_airframe: "Vampire FB5"
 ENG_vampire_fb5_airframe_short: "Vampire"
 ENG_vampire_fb5_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_venom_fb1_airframe: "Venom FB1"
 ENG_venom_fb1_airframe_short: "Venom"
 ENG_venom_fb1_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ENG_vixen_faw1_airframe: "Vixen FAW1"
 ENG_vixen_faw1_airframe_short: "Vixen"
 ENG_vixen_faw1_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_canberra_pr_airframe: "Canberra PR Mk 3"
 ENG_canberra_pr_airframe_short: "Canberra PR"
 ENG_canberra_pr_airframe_desc: "Фоторазведывательная версия бомбардировщика Canberra. Внутреннее топливо расширено и добавлены системы камер.\n§RЭто совершенно новая модель и не сохранит эффективность§!\n§YЭто сохранит 90% эффективности и преобразуется из $ENG_canberra_airframe$ бомбардировщика.§!"
  
 ENG_nimrod_airframe: "Hawker Nimrod"
 ENG_nimrod_airframe_short: "Nimrod Mk II"
 ENG_nimrod_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_sea_gladiator_airframe: "Gloster Sea Gladiator"
 ENG_sea_gladiator_airframe_short: "Sea Gladiator"
 ENG_sea_gladiator_airframe_desc: "Морская версия Gladiator с дополнительным оборудованием для операций на авианосце. Однако это делает его несколько тяжелее, что влияет на его дальность и производительность.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто сохранит 90% эффективности и преобразуется из $ENG_gladiator_airframe$.§!"
  
 ENG_sea_hurricane_airframe: "Hawker Sea Hurricane"
 ENG_sea_hurricane_airframe_short: "Sea Hurricane Mk I"
 ENG_sea_hurricane_airframe_desc: "Sea Hurricane Mk I. General Aircraft взяла проект Hawker и модифицировала его с помощью катапультных катушек и тормозного крюка. Авионика была изменена на подходящую для операций на авианосце. Хотя весь дополнительный вес оборудования делает Sea Hurricane более неповоротливым, это несколько компенсируется введением улучшенного двигателя Merlin III.\n§GЭто сохранит 95% эффективности от других моделей Hurricane.§!"
  
 ENG_seafire_mkiii_airframe: "Supermarine Seafire LF Mk III"
 ENG_seafire_mkiii_airframe_short: "Seafire Mk III"
 ENG_seafire_mkiii_airframe_desc: "Seafire, морской Spitfire Mk V, включает в себя крюк-задержатель, усиленное шасси и складные крылья. LF Mk III оснащен двигателем Merlin 55M, настроенным на максимальную производительность на малой высоте\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности семейства $ENG_spitfire_mkia_airframe$, поскольку оно является его частью.§!"
  
 ENG_seafire_mkxvii_airframe: "Supermarine Seafire F Mk XVII"
 ENG_seafire_mkxvii_airframe_short: "Seafire Mk XVII"
 ENG_seafire_mkxvii_airframe_desc: "Mk XVII дополнительно усилил шасси, а также включил последние модификации основного Spitfire, а именно каплевидный купол кабины, модифицированный фюзеляж, усиленные крылья, дополнительную топливную емкость и двигатель Griffon VI. He способен нести более тяжелый груз под крыльями, а также иметь гораздо большую дальность полета.\n§GЭто сохранит 95% эффективности предыдущей модели.§! \n§YЭто позволит сохранить 90% эффективности семейства $ENG_spitfire_mkia_airframe$, поскольку оно является его частью.§!"
  
 ENG_seafang_airframe: "Supermarine Seafang F32"
 ENG_seafang_airframe_short: "Seafang F32"
 ENG_seafang_airframe_desc: "Seafang по сути является Spiteful, переработанным для использования на авианосце Королевского флота, с добавлением крюка-заградителя, винта противоположного вращения, работающего от Griffon 89 для устранения эффектов крутящего момента двигателя, и силового складывания внешних панелей крыла. Чтобы сбалансировать увеличенный вес, топливная емкость снижена, что отражается в уменьшении дальности.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!\n§YЭто позволит сохранить 90% эффективности и конвертировать из $ENG_spiteful_f16_airframe$.§!"
  
 ENG_sea_fury_airframe: "Hawker Sea Fury FB11"
 ENG_sea_fury_airframe_short: "Sea Fury"
 ENG_sea_fury_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!\n§YЭто позволит сохранить 90% эффективности от $ENG_tempest_mkv_airframe$.§!"
  
 ENG_attacker_airframe: "Supermarine Attacker F1"
 ENG_attacker_airframe_short: "Attacker F1"
 ENG_attacker_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!\n§YЭто позволит сохранить 90% эффективности от $ENG_spiteful_f16_airframe$.§!"
  
 ENG_sea_hawk_airframe: "Hawker Sea Hawk FGA6"
 ENG_sea_hawk_airframe_short: "Sea Hawk FG"
 ENG_sea_hawk_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_whirlwind_airframe: "Westland Whirlwind Mk I"
 ENG_whirlwind_airframe_short: "Whirlwind Mk I"
 ENG_whirlwind_airframe_desc: "Странный промежуточный проект, который в конечном итоге провалился из-за двигателей Rolls-Royce Peregrine, Whirlwind был очень любим теми, кто на нем летал. Его большой радиус действия делает его полезным в качестве эскорта бомбардировщиков, в то время как его тяжелое вооружение из 20-мм пушек компенсирует его недостаточную маневренность.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_mosquito_f_mkii_airframe: "De Havilland Mosquito F Mk II"
 ENG_mosquito_f_mkii_airframe_short: "Mosquito F Mk II"
 ENG_mosquito_f_mkii_airframe_desc: "Первый в том, что станет фирменной моделью de Havilland для войны, ослепительная скорость и тяжелое вооружение Mosquito делают его ужасающим противником. Однако его шокирующая маневренность для его размера стала возможной благодаря его полностью деревянной конструкции, что сделало его более уязвимым для вражеского огня, чем его современники.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 ENG_mosquito_f_mkxvi_airframe: "De Havilland Mosquito F Mk XVI"
 ENG_mosquito_f_mkxvi_airframe_short: "Mosquito F Mk XVI"
 ENG_mosquito_f_mkxvi_airframe_desc: "Значительное улучшение конструкции Mosquito. Mk XVI использует улучшенный двигатель Rolls-Royce Merlin, чтобы получить гораздо более высокую производительность, чем предыдущая модель\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ENG_hornet_airframe: "De Havilland Hornet F Mk I"
 ENG_hornet_airframe_short: "Hornet F Mk I"
 ENG_hornet_airframe_desc: "Разработанный на основе Mosquito, Hornet является одним из самых быстрых поршневых самолетов, когда-либо поднимавшихся в небо. Сохранив счетверенные пушки Hispano своего предшественника, а также деревянную конструкцию, Hornet обладает удивительной топливной емкостью, даже не принимая во внимание внешние топливные баки.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 ENG_beaufighter_mki_airframe: "Bristol Beaufighter Mk I"
 ENG_beaufighter_mki_airframe_short: "Beaufighter Mk I"
 ENG_beaufighter_mki_airframe_desc: "Известный как прочный самолет, Beaufighter — настоящий танк небес, способный принимать удары, одновременно нанося их с помощью вооружения из 4 пушек Hispano калибра 20 мм.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§! §YЭто часть семейства $ENG_beaufort_airframe_short$ и сохранит 90% эффективности предыдущих моделей.§!"
  
 ENG_beaufighter_mkvi_airframe: "Bristol Beaufighter Mk VI"
 ENG_beaufighter_mkvi_airframe_short: "Beaufighter Mk VI"
 ENG_beaufighter_mkvi_airframe_desc: "С увеличенной грузоподъемностью, а также пикирующими паузами, Mk VI называет Beaufort лучшим торпедоносцем. Обладая увеличенной дальностью полета с дополнительными топливными баками вместо крыльевого вооружения, он может выполнять задачи по атаке наземных целей в тылу противника, а также отлично подходит для патрулирования морей. Радиолокационное оборудование позволяет ему быть еще лучшим ночным истребителем.\n§GЭто сохранит 95% эффективности предыдущей модели.§! §YЭто часть семейства $ENG_beaufort_airframe_short$ и сохранит 90% эффективности от него.§!"
  
 ENG_brigand_airframe: "Bristol Brigand B1"
 ENG_brigand_airframe_short: "Brigand B1"
 ENG_brigand_airframe_desc: "Разработанный на основе Buckingham в качестве замены торпедоносца для Beaufighter, он оказался намного больше и тяжелее, что позволило ему хорошо работать как скоростной бомбардировщик с большим количеством торпедных, бомбовых и ракетных боеприпасов. Однако его маневренность страдает соответственно.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§! §YЭто часть семейства $ENG_buckingham_airframe_short$ и сохранит 90% эффективности от него.§!"
  
 ENG_gordon_airframe: "Fairey Gordon"
 ENG_gordon_airframe_short: "Gordon"
 ENG_gordon_airframe_desc: "Разработанный как легкий бомбардировщик, Gordon представляет собой традиционный биплан с металлическим каркасом, обтянутым тканью, оснащенный двигателем Armstrong Siddeley Panther. Самолет имеет довольно простую конструкцию, оснащен двумя пулеметами, имеет небольшую грузоподъемность и практически не имеет защиты. Однако он обладает хорошей дальностью полета.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_battle_mkii_airframe: "Fairey Battle Mk II"
 ENG_battle_mkii_airframe_short: "Battle Mk II"
 ENG_battle_mkii_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
