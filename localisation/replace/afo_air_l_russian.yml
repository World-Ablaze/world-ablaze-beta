 SOV_r_5sh_airframe: "Поликарпов Р-5Ш"
 SOV_r_5sh_airframe_short: "Р-5Ш"
 SOV_r_5sh_airframe_desc: "Универсальный биплан-легкий бомбардировщик в основном деревянной конструкции. Вариант штурмовика Р-5 `Штурмовик` добавляет дополнительное вооружение, состоящее из 8 крыльевых пулеметов ПВ-1, с возможностью нести до 500 кг бомб.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
