 SOV_i_153_airframe: "Поликарпов И-153 `Чайка`"
 SOV_i_153_airframe_short: "И-153"
 SOV_i_153_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 SOV_yak_1_airframe: "Яковлев Як-1"
 SOV_yak_1_airframe_short: "Як-1"
 SOV_yak_1_airframe_desc: "Сделанный из полностью деревянного корпуса для экономии ресурсов, Як 1, тем не менее, является шагом вперед по сравнению со старыми устаревшими конструкциями. Легкая рама не обеспечивает многого с точки зрения защиты, но она освобождает вес для 20-мм ШВАК, 2x 7,62-мм пушек ШКАС и относительно маневренной производительности, рассчитанной на удельный вес с уменьшенным количеством топлива. Можно нести дополнительное топливо, а пулеметы ШКАС можно заменить одним более легким 12,7-мм Березина, особенно если будет найден новый двигатель.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 SOV_yak_7_airframe: "Яковлев Як-7Б"
 SOV_yak_7_airframe_short: "Як-7Б"
 SOV_yak_7_airframe_desc: "Як-7, задуманный как двухместный учебный самолет, был модифицирован КБ Яковлева в превосходный одноместный истребитель. Освободившееся пространство теперь можно использовать для дополнительного топлива или камер разведки. На Як-7Б 7,62-мм пулеметы ШКАС заменены на два 12,7-мм крупнокалиберных пулемета Березина. Более мощный двигатель М-105ПФ способен обеспечить Як-7 более высокую скорость, несмотря на увеличенный вес.\n§GЭто сохранит 95% эффективности от $SOV_yak_1_airframe$§!"
  
 SOV_yak_9d_airframe: "Яковлев Як-9Д"
 SOV_yak_9d_airframe_short: "Як-9Д"
 SOV_yak_9d_airframe_desc: "Дальнейшее развитие прочного Як-7Б, Як-9 построен из более легкой композитной металлодеревянной конструкции, что обеспечивает улучшенную защиту и увеличенный запас топлива. Модель D — это дальний истребитель сопровождения с существенно увеличенным запасом топлива. Однако увеличенный вес несколько снижает его маневренность.\n§GЭто сохранит 95% эффективности и может конвертироваться из $SOV_yak_7_airframe$§!"
  
 SOV_yak_9u_airframe: "Яковлев Як-9У"
 SOV_yak_9u_airframe_short: "Як-9У"
 SOV_yak_9u_airframe_desc: "Окончательный вариант Як-9 поставляется с новым более мощным двигателем М-107А и улучшенной аэродинамикой. Это приводит к значительно улучшенной скорости и маневренности, сохраняя при этом хорошую дальность полета.\n§GЭто сохранит 95% эффективности и может конвертироваться из $SOV_yak_9d_airframe$§!"
  
 SOV_yak_9p_airframe: "Яковлев Як-9П"
 SOV_yak_9p_airframe_short: "Як-9П"
 SOV_yak_9p_airframe_desc: "Последняя и самая совершенная версия поршневых истребителей Яковлева. В отличие от своего предшественника, Як-9П имеет более легкую цельнометаллическую конструкцию, что позволяет ему нести более мощную 37-мм пушку Н-37 и увеличенный внутренний запас топлива для большей дальности.\n§GЭто сохранит 95% эффективности от $SOV_yak_9u_airframe$§!"

 SOV_yak_3_airframe: "Яковлев Як-3"
 SOV_yak_3_airframe_short: "Як-3"
 SOV_yak_3_airframe_desc: "The Як-3 is a light dogfighter developed on the basis of the Як-1. Retaining the wooden airframe, the Як-3 sacrifices the raw power of the Як-9 for higher agility and ease of flight. Armed with a 20mm ShVAK cannon and 2x 12.7mm Berezin machine guns.\n§YThis will retain 90% efficiency from $SOV_yak_1_airframe$ family for being part of it.§!"
 
 SOV_yak_3u_airframe: "Яковлев Як-3U"
 SOV_yak_3u_airframe_short: "Як-3U"
 SOV_yak_3u_airframe_desc: "The Як-3U is the pinnacle of the Yakovlev piston engine fighter design, combining the amazing agility of the Як-3 airframe with the almighty Shvetsov M-82FN engine famous on Lavochkin's fighters. Some wooden parts are changed for metal, allowing for more fuel to be carried. Although the guns are reduced to two cannons, the new 20mm B-20 makes up for lost firepower.\n§GThis will retain 95% efficiency but cannot convert from the previous model§!"
 
 SOV_yak_15_airframe: "Яковлев Як-15 `Перо`"
 SOV_yak_15_airframe_short: "Як-15 `Перо`"
 SOV_yak_15_airframe_desc: "One of Yakovlev's first attempts at a jet-engined fighter, the Як-15 simply hammers in a Klimov RD-10 engine into a Як-3 airframe. The very light aircraft sacrifices range and protection in order to make space for the Klimov engine in the already small airframe. It falls short in almost every regard compared to the more promising MiGs, but it does have the advantage of being an easy conversion from existing Як-3 production.\n§GThis will retain 95% efficiency from $SOV_yak_3u_airframe$§!"
 
 SOV_yak_17_airframe: "Яковлев Як-17 `Перо`"
 SOV_yak_17_airframe_short: "Як-17 `Перо`"
 SOV_yak_17_airframe_desc: "A series of upgrades to the Як-15 airframe, the Як-17 adds drop tanks for improved range, better protection with an armoured ejection seat and glass. Due to the engine still being the same underpowered RD-10, its performance is rather tragic. It can, however, serve as a good trainer for newer and better jet fighters.\n§GThis will retain 95% efficiency from $SOV_yak_15_airframe$§!"
 
 SOV_yak_23_airframe: "Яковлев Як-23 `Перо`"
 SOV_yak_23_airframe_short: "Як-23 `Перо`"
 SOV_yak_23_airframe_desc: "The Як-23 is the final upgrade to the Як-3,-15,-17 airframe. It introduces a new Klimov RD-500 engine that could finally provide good thrust. This allows the Як-23 to carry a lot more fuel for a higher range. The conventional Як-3 airframe means that the fighter still enjoys high agility.\n§GThis will retain 95% efficiency from $SOV_yak_17_airframe$§!"
 
 SOV_yak_30_airframe: "Яковлев Як-30"
 SOV_yak_30_airframe_short: "Як-30"
 SOV_yak_30_airframe_desc: "The Як-30 is Yakovlev's attempt to compete with MiG after the limited success of all their jets using the Як-3 fuselage. The Як-30 was a completely new design based on the experimental Як-25, however this variant included a swept wing for better performance at high speeds.\n§RThis is a brand new model and will retain 75% efficiency from previous models.§!"
  
