 AST_ca_1_airframe: "CAC CA-1 `Wirraway`"
 AST_ca_1_airframe_short: "CA-1 `Wirraway`"
 AST_ca_1_airframe_desc: "Основанный на американском дизайне, Wirraway пытается соответствовать требованиям современного местного австралийского истребителя. На практике, вялая производительность CA-1, но большая нагрузка в 1500 фунтов делает его гораздо более подходящим в качестве штурмовика.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности предыдущих моделей.§!"
 ast_fighter_multirole_ad_tech_1: "CAC CA-1 `Wirraway`"
  
 AST_ca_12_airframe: "CAC CA-12 `Boomerang`"
 AST_ca_12_airframe_short: "CA-12 `Boomerang`"
 AST_ca_12_airframe_desc: "Первый австралийский истребитель собственной разработки. Boomerang во многом основан на Wirraway, разделяя многие его компоненты для облегчения производства. Хотя используется более крупный двигатель P&W R-1830, самолет остается перегруженным и недостаточно мощным. Тем не менее, он способен нести хорошее вооружение и сбрасывать баки для большой дальности боя.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§! §YЭто сохранит 90% эффективности от $AST_ca_1_airframe$, поскольку является частью семейства.§!"
 ast_fighter_multirole_ad_tech_2: "CAC CA-12 `Boomerang`"
  
 AST_ca_15_airframe: "CAC CA-15 `Kangaroo`"
 AST_ca_15_airframe_short: "CA-15 `Kangaroo`"
 AST_ca_15_airframe_desc: "Разработанный с нуля как перехватчик и истребитель сопровождения дальнего радиуса действия. Первоначально предполагалось использовать массивный радиальный двигатель P&W R-2800, но наличие рядного двигателя Rolls-Royce Griffon изменило конечный продукт. Заправляемый 3 подвесными баками для большой дальности, CA-15 может вместо этого нести различные бомбы и ракеты.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности от предыдущих моделей.§!"
 ast_fighter_multirole_ad_tech_3: "CAC CA-15 `Kangaroo`"
  
 AST_ca_11_airframe: "CAC CA-11 `Woomera`"
 AST_ca_11_airframe_short: "CA-11 `Woomera`"
 AST_ca_11_airframe_desc: "Дальнобойный пикирующий и торпедоносец, Woomera имеет новые внутренние топливные баки, которые увеличивают дальность полета. Гондола двигателя также служит бомбоотсеком. Фюзеляж имеет 2 точки подвески для подвесных баков, бомб или 2 торпед или всего сразу, что делает Woomera очень гибким в своих миссиях.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 ast_attacker_ad_tech_1: "CAC CA-11 `Woomera`"
  

