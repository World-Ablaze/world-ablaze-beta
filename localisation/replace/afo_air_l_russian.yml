 GER_he_177_airframe_short: "He 177 A-1 `Greif`"
 GER_he_177_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
 large_maritime_patrol_airframeGER_he_177_airframe: "Henschel He 177 A-3/R3"
  
 GER_he_177_a5_airframe: "Henschel He 177 A-5 `Greif`"
 GER_he_177_a5_airframe_short: "He 177 A-5 `Greif`"
 GER_he_177_a5_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
 large_maritime_patrol_airframeGER_he_177_a5_airframe: "He 177 А-5/Р1"
  
 GER_he_277_a_airframe: "Henschel He 277 A-1 `Greif`"
 GER_he_277_a_airframe_short: "He 277 A-1 `Greif`"
 GER_he_277_a_airframe_desc: "Модель 277, созданная на основе He 177, оснащена более надежными и мощными радиальными двигателями BMW 801, что позволяет Greif быть больше и тяжелее, чем раньше. Внутренний бомбовый отсек увеличен до 6000 кг, который можно заменить топливом для значительного увеличения дальности полета. Оборонительная вооружение теперь гораздо сильнее благодаря различным дистанционно управляемым и моторизованным пушечным башням.\n§YЭто сохранит 90% эффективности от семейства $GER_he_177_airframe$.§!"
 large_maritime_patrol_airframeGER_he_277_a_airframe: "Henschel He 277 B `Greif`"
  
 GER_me_264_airframe: "Messerschmitt Me 264 `Amerikabomber`"
 GER_me_264_airframe_short: "Me 264 `Amerikabomber`"
 GER_me_264_airframe_desc: "Проект Amerikabomber — это инициатива по получению стратегического бомбардировщика большой дальности, способного наносить удары по американскому континенту. Me 264 уже разрабатывался для других целей, но с модификациями, такими как подвесные баки и дополнительное топливо, он способен достичь трансокеанских критериев.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ta_400_airframe: "Focke-Wulf Ta 400 `Amerikabomber`"
 GER_ta_400_airframe_short: "Ta 400 `Amerikabomber`"
 GER_ta_400_airframe_desc: "Проект Amerikabomber — это инициатива по созданию стратегического бомбардировщика большой дальности, способного наносить удары по американскому континенту. Специально разработанный для этого проекта, Ta 400 — это огромный бегемот. Уникальная комбинация из 8 двигателей: 6 радиальных двигателей BMW 801E и 2 реактивных двигателей Jumo 004, а также достаточное количество топлива обеспечивают ему большую дальность полета и огромную грузоподъемность для большого количества бомб. Возможны различные сочетания обоих.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_ar_555_airframe: "Arado Ar 555 `Amerikabomber`"
 GER_ar_555_airframe_short: "Ar 555"
 GER_ar_555_airframe_desc: "Проект Amerikabomber — это инициатива по созданию стратегического бомбардировщика большой дальности, способного наносить удары по американскому континенту. Несмотря на то, что изначально его отвергли, проект Arado E.555-11 в конце концов доказал свои достоинства. Сверхбыстрый самолет типа `летающее крыло`, оснащенный 4 двигателями BMW 018. He способен преодолевать невероятные расстояния, особенно при оснащении сбрасываемыми баками.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
  
 GER_ju_132_airframe: "Junkers Ju 132"
 GER_ju_132_airframe_short: "Ju 132"
 GER_ju_132_airframe_desc: "Кульминация разработок бомбардировщиков Junkers, Ju 132 — сверхтяжелый бомбардировщик со стреловидными крыльями, оснащенный 6 тяжелыми реактивными двигателями Jumo 012. Хотя повышенный расход топлива ограничивает дальность полета, ее можно увеличить, пожертвовав частью веса бомбы ради большего количества топлива.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
 GER_me_462_airframe: "Messerschmitt Me 462"
 GER_me_462_airframe_short: "Me 462"
 GER_me_462_airframe_desc: "Me 462 родился из проекта сверхскоростного бомбардировщика P.1107. Объединяя опыт, полученный при разработке Me 264 с точки зрения аэродинамики, веса и методов сборки, 462 выводит его на новый уровень с 4 новыми реактивными двигателями HeS 011C, зарытыми в крыльях. И без того большой радиус действия может быть дополнительно увеличен за счет подвесных баков под крыльями.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
  
  
 SOV_r_6_airframe: "Туполев Р-6"
 SOV_r_6_airframe_short: "Р-6"
 SOV_r_6_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_r_10_airframe: "Неман Р-10"
 SOV_r_10_airframe_short: "Р-10"
 SOV_r_10_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 SOV_yak_4_airframe: "Яковлев Як-4"
 SOV_yak_4_airframe_short: "Як-4"
 SOV_yak_4_airframe_desc: "Первоначально задуманный как общая модернизация для быстрого бомбардировщика Як-2 с улучшенными двигателями М-105Р, он, однако, все еще слишком уязвим и ограничен в своей грузоподъемности, чтобы быть эффективным для наземных атак. Тем не менее, замена бомбового отсека на топливный бак в сочетании с его скоростью и дальностью полета делает его довольно хорошим разведывательным самолетом.\n§RЭто совершенно новая модель, и она сохранит 75% эффективности от предыдущих моделей.§!"
  
 SOV_tu_6_airframe: "Туполев Ту-6"
 SOV_tu_6_airframe_short: "Ту-6"
 SOV_tu_6_airframe_desc: "Разработанный на основе разведывательной версии успешного бомбардировщика Ту-2С, Ту-6 представляет собой дальнейшее усовершенствование с дополнительными топливными баками, оборудованием для съемки и кислородными баллонами.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!\n§GЭто может быть преобразовано из $SOV_tu_2s_airframe$§!"
  
