 ENG_seaford_airframe: "Short Seaford MR Mk I"
 ENG_seaford_airframe_short: "Seaford MR Mk I"
 ENG_seaford_airframe_desc: "\n§GЭто сохранит 95% эффективности предыдущей модели.§!"
  
 ENG_shackleton_airframe: "Avro Shackleton MR"
 ENG_shackleton_airframe_short: "Shackleton MR Mk II"
 ENG_shackleton_airframe_desc: "\n§RЭто совершенно новая модель, которая сохранит 75% эффективности по сравнению с предыдущими моделями.§!"
  
 ENG_blenheim_airframe: "Bristol Blenheim Mk I"
 ENG_blenheim_airframe_short: "Blenheim Mk I"
 ENG_blenheim_airframe_desc: "Bristol Blenheim — способный легкий бомбардировщик. Хотя он страдает от ограниченной дальности, есть много возможностей для усовершенствований, особенно если будут найдены более мощные двигатели. Конструкция также достаточно гибкая, чтобы ее можно было использовать для других целей, таких как разведка и ночной бой.\n§RЭто совершенно новая модель, которая сохранит 75% эффективности предыдущих моделей.§! §YЭто часть семейства $ENG_blenheim_airframe_short$, которая сохранит 90% эффективности предыдущих моделей.§!"
 eng_strike_bomber_ad_tech_1: "Пакет Bristol Blenheim Mk IV"
 eng_strike_bomber_ad_tech_1_desc: "Модернизация Mk IV включает более мощный двигатель Bristol Mercury XV, который позволяет нести больше брони и оборонительного вооружения. Также предполагается, что самолет имеет некоторый потенциал в качестве тяжелого истребителя, если прикрепить счетверенный 7,7-мм пулемет Vickers в бомбоотсеке."
  
 ENG_beaufort_airframe: "Bristol Beaufort Mk I"
 ENG_beaufort_airframe_short: "Beaufort Mk I"
 ENG_beaufort_airframe_desc: "Дальнейшее развитие Blenheim, Beaufort больше и прочнее. Разработанный как торпедоносец, он способен нести одну торпеду Mk XII или обычную бомбовую нагрузку. Более крупный планер также означает, что есть много места для дополнительного оборонительного оружия и радиолокационного оборудования.\n§RЭто совершенно новая модель, и она не сохранит эффективность предыдущей модели.§! §YЭто часть семейства $ENG_blenheim_airframe_short$ и сохранит 90% эффективности от него.§!"
  
 ENG_buckingham_airframe: "Bristol Buckingham B Mk I"
 ENG_buckingham_airframe_short: "Buckingham B Mk I"
 ENG_buckingham_airframe_desc: "Ответ на спецификации Министерства авиации, требующие бомбовой нагрузки 1840 кг для перевозки на высокой скорости на дальность 2575 км для наземных операций поддержки. Buckingham хорошо бронирован, защищен и вооружен 4x пулеметами в носу и 6x в задних турелях.\n§GЭто сохранит 95% эффективности предыдущей модели.§! §YЭто часть семейства $ENG_blenheim_airframe_short$ и сохранит 90% эффективности от него.§!"
  
