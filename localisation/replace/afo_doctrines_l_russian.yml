  no_subdoctrine_selected_tt: "\nПоскольку не была выбрана §Yвторостепенная доктрина§! на направление «§Y$track$§!», будет получен боевой опыт (£army_experience£|£air_experience£|£navy_experience£) §Oвместо§! £doctrine_mastery  §Y$mastery$ очк. освоения§!:"











  pre_assault_bombardment: "Обстрел перед штурмом"
  pre_assault_bombardment_desc: "Чтобы прорвать линии противника, наша пехота должна получать поддержку артиллерии. Массированный обстрел перед пехотной атакой подавит противника и не даст ему оказать эффективное сопротивление."

  pre_assault_bombardment_artillery_concentration: "Сосредоточение артиллерии"
  pre_assault_bombardment_artillery_concentration_desc: "Урон, наносимый одной артиллерийской установкой, минимален, поэтому на поле боя необходимо выбирать точки, где несколько артиллерийских установок могут оказать заметное влияние."

  pre_assault_bombardment_artillery_barrage_strategies: "Стратегии артиллерийского обстрела"
  pre_assault_bombardment_artillery_barrage_strategies_desc: "Блокирующие, ползучие и коробчатые заграждения влияют на поле боя таким образом, что позволяют нашим войскам выигрывать сражения."



  massed_artillery: "Массированная атака артиллерии"
  massed_artillery_desc: "Использование большого количества артиллерии для обстрела обширных участков поля боя — лучший способ нанести ущерб противнику. Медленный и методичный массированный обстрел превратит любую линию фронта в прах."

  massed_artillery_covering_fire: "Прикрывающий обстрел"
  massed_artillery_covering_fire_desc: "Сконцентрировав артиллерию, мы можем обеспечить плотный огонь, чтобы прикрыть наши войска от атак противника. Кстати, интенсивность огня также способствует уничтожению."

  massed_artillery_box_barrages: "Артиллерийский заградительный огонь"
  massed_artillery_box_barrages_desc: "Блокируя артиллерийские позиции вокруг позиции, чтобы изолировать ее, заградительный огонь обеспечивает оборонительные задачи в случае атак противника на оборонительные позиции. Наша доктрина должна использовать это в качестве основы."

  zeroing_artillery: "Обнуление артиллерии"
  zeroing_artillery_desc: "Батареи ведут огонь круговыми залпами, приближаясь к назначенной цели. Это делает артиллерию более эффективной при уничтожении конкретных позиций противника, что особенно полезно для поддержки наших наступающих войск."

  zeroing_artillery_forward_observers: "Наблюдатели на передовой"
  zeroing_artillery_forward_observers_desc: "Высококвалифицированные передовые наблюдатели способны обнаруживать цели противника и вносить поправки на неточность артиллерийских батарей, что позволяет артиллерийским подразделениям оказывать более эффективную поддержку."

  zeroing_artillery_creeping_barrages: "Ползучий заградительный огонь"
  zeroing_artillery_creeping_barrages_desc: "Создавая непроходимую стену огня, продвигающуюся вперед в темпе нашего наступления, мы можем подавлять опорные пункты противника и препятствовать его отступлению или подкреплению. Наша доктрина должна использовать это в качестве основы."

  quick_fire: "Короткий обстрел"
  quick_fire_desc: "Оказание огневой поддержки в короткие сроки по запросу может быть более полезным для войск, чем длительная настройка точного огня."

  quick_fire_forward_observers: "Наблюдатели на передовой"
  quick_fire_forward_observers_desc: "Высококвалифицированные передовые наблюдатели способны обнаруживать цели противника и вносить поправки на неточность артиллерийских батарей, что позволяет артиллерийским подразделениям оказывать более эффективную поддержку."

  quick_fire_creeping_barrages: "Ползучие заграждения"
  quick_fire_creeping_barrages_desc: "Создавая непроходимую стену огня, продвигающуюся вперед в темпе нашего наступления, мы можем подавлять опорные пункты противника и препятствовать его отступлению или подкреплению. Наша доктрина должна использовать это в качестве основы."


  anti_tank_strong_points: "Противотанковые опорные пункты"
  anti_tank_strong_points_desc: "Распределив противотанковые орудия по всему фронту в опорных пунктах с большим полем обстрела, мы сможем вести эффективный огонь и быстро восстанавливаться после боя."

  anti_tank_strong_points_converging_sheaf: "Сходящийся пучок"
  anti_tank_strong_points_converging_sheaf_desc: "Применяя современные расчеты и методы, мы можем сделать так, чтобы огонь нескольких артиллерийских подразделений пересекался на заданной цели, значительно усиливая их эффект. Это позволит нам эффективно использовать больше артиллерийских подразделений, не распыляя их эффект."

  anti_tank_strong_points_air_killzones: "Воздушные зоны уничтожения"
  anti_tank_strong_points_air_killzones_desc: "Создание зон высокоинтенсивного зенитного огня вдоль маршрута полета противника позволяет нашим орудиям быстро справиться с вражескими воздушными силами."

  concentrated_spacing: "Концентрированное расстояние"
  concentrated_spacing_desc: "Концентрируя огонь наших противотанковых орудий на отдельных целях, мы можем нанести максимальный урон  бронированным врагам."

  concentrated_spacing_converging_sheaf: "Сходящийся пучок"
  concentrated_spacing_converging_sheaf_desc: "Применяя современные расчеты и методы, мы можем сделать так, чтобы огонь нескольких артиллерийских подразделений пересекался на заданной цели, значительно усиливая  их эффект. Это позволит нам эффективно использовать больше артиллерийских подразделений, не распыляя их эффект."

  concentrated_spacing_air_killzones: "Воздушные зоны уничтожения"
  concentrated_spacing_air_killzones_desc: "Создание зон высокоинтенсивного зенитного огня вдоль маршрута полета противника позволяет нашим орудиям быстро справиться с вражескими воздушными силами."


  artillery_overwatch: "Артиллерийское прикрытие"
  artillery_overwatch_desc: "Если наша артиллерия воздержится от огня и будет ждать, когда он понадобится, ее можно будет более эффективно использовать в тактике совместных действий вооруженных сил при совместных наступлениях бронетанковых и пехотных войск."

  artillery_overwatch_harrassment_fire: "Преследующий пожар"
  artillery_overwatch_harrassment_fire_desc: "Предыдущий опыт показывает, что постоянные обстрелы артиллерией заставляют противника быть всегда готовым к наступлению. Заставляя его постоянно бодрствовать и быть начеку, мы можем измотать противника еще до начала нашего наступления."

  artillery_overwatch_direct_fire: "Прямой огонь"
  artillery_overwatch_direct_fire_desc: "Привлекая артиллерию для непосредственной поддержки войск, мы можем обеспечить немедленный ответ на любые действия противника на передовой."

  selected_field_positioning: "Выбранное позиционирование"
  selected_field_positioning_desc: "Выбор основных и второстепенных позиций с использованием особенностей местности для прикрытия целей позволяет другим подразделениям создать более эффективные асимметричные линии обороны."

  selected_field_positioning_constant_barrage: "Непрерывный обстрел"
  selected_field_positioning_constant_barrage_desc: "Используя постоянные залпы по указанным позициям противника, мы можем максимально увеличить разрушительную мощь наших артиллерийских сил."

  selected_field_positioning_integrated_support: "Комплексная поддержка"
  selected_field_positioning_integrated_support_desc: "Интеграция артиллерийских подразделений в органические структуры позволяет немедленно доставлять орудия к силам, нуждающимся в поддержке. Это позволяет нам эффективно использовать огневую мощь артиллерии."


  tank_warfare: "Бронетанковая война"
  tank_warfare_desc: "Использование танков может изменить обстановку на поле боя и прорвать линии противника. Изучение способов использования этих машин поможет повысить их эффективность на поле боя."

  tank_warfare_tank_concentration: "Концентрация танков"
  tank_warfare_tank_concentration_desc: "Подразделения должны объединяться, чтобы эффективно охватывать поле боя."

  tank_warfare_tank_coordination: "Координация танков"
  tank_warfare_tank_coordination_desc: "Интеграция танков в боевую структуру заложит основу для их более значительной роли."


  frontal_tanks: "Фронтальные танки"
  frontal_tanks_desc: "Танки являются королями современного поля боя и должны быть способны самостоятельно выиграть любое сражение. Обеспечив нашим танкам центральное место в любом сражении, мы максимально увеличим их огневую мощь. Наши танки будут находиться ближе к линии огня, но это позволит нашим превосходящим бронетанковым силам выигрывать каждый раз."

  frontal_tanks_tank_platoons: "Танковые взводы"
  frontal_tanks_tank_platoons_desc: "Танки могут быть мощными, но не непобедимыми, особенно если они действуют в одиночку. Поэтому необходимо использовать танковые группы в виде танковых взводов. Это позволяет каждому танку одновременно двигаться, прикрывать и вести огонь вместе с другими танками. Такая организация обеспечивает более эффективную работу, поскольку танковый взвод может действовать как единая сила."

  frontal_tanks_tank_logistics: "Логистика танков"
  frontal_tanks_tank_logistics_desc: "С повсеместным использованием танков в вооруженных силах была усовершенствована логистика, чтобы эти стальные гиганты могли продолжать функционировать. Логистика танков имеет жизненно важное значение для каждой миссии. Благодаря этому танковые группы могут вести длительные наступательные операции, сдерживая врага и оттесняя его все дальше и дальше."

  combined_warfare: "Комбинированная война"
  combined_warfare_desc: "Комбинированная война, синоним комбинированных вооруженных сил, представляет собой использование различных видов войск с целью усиления их сильных сторон в бою и одновременно нейтрализации или смягчения слабых сторон других видов войск. В данном случае поддержка пехоты позволит танкам получить лучшее прикрытие при ведении наступления. Это даст им возможность наступать более решительно, сохраняя при этом сплоченность подразделения."

  combined_warfare_tank_platoons: "Танковые взводы"
  combined_warfare_tank_platoons_desc: "Танки могут быть мощными, но не непобедимыми, особенно если они действуют в одиночку. Поэтому необходимо использовать танковые группы в виде танковых взводов. Это позволяет каждому танку одновременно двигаться, прикрывать и вести огонь вместе с другими танками. Такая организация обеспечивает более эффективную работу, поскольку танковый взвод может действовать как единая сила."

  combined_warfare_raid_infantry: "Штурмовая пехота"
  combined_warfare_raid_infantry_desc: "Использование танков при поддержке пехоты привело к решению о моторизации или механизации пехоты. Пехота, использующая грузовики и бронетранспортеры, может лучше держать темп с танками, обеспечивая мобильную поддержку. Вместо того чтобы захватывать и удерживать территорию, пехота-рейдеры должны постоянно находиться в движении, сея хаос в тылу противника."


  schwerpunkt: "Приоритет"
  schwerpunkt_desc: "Сконцентрировав все наши бронетанковые силы в одной точке, мы сможем гарантированно прорвать оборону противника. Этот локальный успех может дезорганизовать все силы противника, разрушив некогда сплоченную линию фронта."

  schwerpunkt_kampfgruppe: "Боевая группа"
  schwerpunkt_kampfgruppe_desc: "Kampfgruppe — это специальные подразделения, созданные для достижения конкретной цели. Это позволяет быстро реорганизоваться для проведения небольших наступательных или оборонительных операций, которые могут переломить ход сражения."

  schwerpunkt_blitzkreig: "Блицкриг"
  schwerpunkt_blitzkreig_desc: "Благодаря сочетанию быстрого передвижения и ведения боевых действий с использованием всех видов вооруженных сил наши танковые войска могут подавить ключевые точки обороны противника, чтобы прорвать его оборону и проникнуть глубоко в тыл противника."

  encirclement: "Окружение"
  encirclement_desc: "Лучший способ уничтожить вражеские силы — окружить их и закрыть котел. Используя мобильную пехоту, мы сможем обойти опорные пункты противника, отрезать его от снабжения и измотать до полной капитуляции."

  encirclement_central_command: "Центральное командование"
  encirclement_central_command_desc: "Лучшая танковая сила — это организованная сила. Поставляя нашим бронетанковым войскам постоянный поток информации, они могут принимать обоснованные решения, основанные на текущей ситуации. "

  encirclement_airland_battle: "Воздушно-наземное сражение"
  encirclement_airland_battle_desc: "Несмотря на мощь танков, война будет проиграна, если мы уступим в воздушной войне. Мы должны использовать наши самоходные зенитные орудия для различных целей. Наши воздушные силы также будут использоваться в координации с бронетанковыми подразделениями для улучшения ведения боевых действий с применением всех видов вооруженных сил."

  armoured_waves: "Бронированные волны"
  armoured_waves_desc: "\n§GЭта доктрина разблокирует дух «Логистическая направленность» и общую способность «Масштабное наступление».§!\nЧем больше танков у нас в бою, тем выше шанс на победу. Все действительно так просто."

  armoured_waves_convergence_of_forces: "Сближение сил"
  armoured_waves_convergence_of_forces_desc: "Сконцентрировав наши силы на общем фронте, мы сможем добиться прорыва в широком масштабе и нанести тяжелый ущерб тылу противника."

  armoured_waves_blunt_the_spear: "Тупое копье"
  armoured_waves_blunt_the_spear_desc: "В случае, если противник попытается прорвать наши линии, мы можем использовать наши мобильные силы, чтобы измотать его войска и замедлить их наступление. Когда наступит подходящий момент, наши войска смогут перейти в контратаку и уничтожить ослабленного противника."


  war_of_movement: "Война маневров"
  war_of_movement_desc: "Перехитрить противника — лучший способ лишить его возможности эффективно сопротивляться. Обходя сильные точки сопротивления, мы можем сохранить силы наших бронетанковых войск для последующих боевых действий."

  war_of_movement_joint_planning: "Совместное планирование"
  war_of_movement_joint_planning_desc: "Улучшение координации между бронетанковыми войсками и мобильной пехотой имеет жизненно важное значение для обеспечения эффективности любой операции."

  war_of_movement_long_range_combat: "Бой на большом расстоянии"
  war_of_movement_long_range_combat_desc: "При столкновении с вражеской бронетехникой наши танки должны держаться на большом расстоянии и уничтожать ее с помощью оружия дальнего действия, не давая ей возможности ответить огнем."

  war_of_supremacy: "Война за господство"
  war_of_supremacy_desc: "Наши танки должны быть сильнее всех остальных. Мы можем быть ограничены в количестве, но благодаря качеству мы можем уничтожать вражеские танки, сохраняя при этом свои."

  war_of_supremacy_joint_planning: "Совместное планирование"
  war_of_supremacy_joint_planning_desc: "Улучшение координации между бронетанковыми войсками и мобильной пехотой имеет жизненно важное значение для обеспечения эффективности любой операции."

  war_of_supremacy_integrated_infantry_support: "Комплексная поддержка пехоты"
  war_of_supremacy_integrated_infantry_support_desc: "Пехотные подразделения помогут нашим танкам обойти и окружить противника."

  war_of_annihilation: "Война на уничтожение"
  war_of_annihilation_desc: "Наша бронетанковая часть должна быть способна справиться с любой целью, с которой она столкнется, и уничтожить ее. Чтобы ослабить противника и вывести его из равновесия, мы должны использовать их для постоянных атак и уничтожения противника при каждой возможности."

  war_of_annihilation_joint_planning: "Совместное планирование"
  war_of_annihilation_joint_planning_desc: "Улучшение координации между бронетанковыми войсками и мобильной пехотой имеет жизненно важное значение для обеспечения эффективности любой операции."

  war_of_annihilation_battlefield_brawler: "Битва на поле боя"
  war_of_annihilation_battlefield_brawler_desc: "Наши танки должны использоваться для постоянного ведения боя с противником на близком расстоянии. Это позволит нам нанести противнику максимально возможные потери, рискуя при этом самим понести увеличенные потери."


  trench_warfare_desc: "Когда линия фронта становится статичной, очень важно, чтобы наши войска могли сооружать собственные временные укрепления для защиты от артиллерийского и стрелкового огня. Если затяжной застой продлится еще дольше, они должны быть готовы сооружать сети окопов для поддержания эффективной обороны."

  trench_warfare_defensive_templates: "Стратегии обороны"
  trench_warfare_defensive_templates_desc: "Гораздо проще защищаться, чем нападать. Нашим первым шагом в заложении основ для будущих стратегий будет организация планов оборонительных операций. Это позволит нам удержать свои и вражеские территории, сохранив при этом целостность сил."

  trench_warfare_shocktroops: "Штурмовые отряды"
  trench_warfare_shocktroops_desc: "Наличие специальных подразделений, которые ведут атаки, обладая лучшей подготовкой и оборудованием, может привести к прорыву вражеских линий."


  decisive_strategy: "Решительная стратегия"
  decisive_strategy_desc: "Вместо того чтобы тратить время на мелкие стычки, мы должны направить наши усилия на несколько избранных, решающих сражений. Для этого мы можем широко использовать планирование, что позволит нам быть готовыми к любой непредвиденной ситуации."

  decisive_strategy_attritional_containment: "Сдерживание износа"
  decisive_strategy_attritional_containment_desc: "Пока наши решающие планы не будут готовы к реализации, наши войска должны быть обучены строить обширные линии обороны, чтобы удержать наши нынешние линии фронта. Это не даст врагу возможности провести контратаку и постепенно лишит его боеспособности."

  decisive_strategy_c3i: "C3I"
  decisive_strategy_c3i_desc: "C3I, что означает «командование, управление, связь и разведка», предполагает широкое использование информационных ресурсов для достижения военных целей. В результате каждый подразделение становится более организованным и может быстрее набираться опыта в боевых условиях."

  advanced_squad_tactics: "Расширенные тактики отряда"
  advanced_squad_tactics_desc: "Сосредоточившись на улучшении подготовки и тактики для командиров рот, можно добиться повышения боевых возможностей. Крупные скоординированные операции не так важны, если наши отдельные подразделения и командиры становятся лучше."

  advanced_squad_tactics_elite_troops: "Элитные войска"
  advanced_squad_tactics_elite_troops_desc: "Обеспечивая нашим войскам возможность приобрести жизненно важный боевой опыт, мы можем рассчитывать, что они будут лучшими на поле боя. Они должны быть способны превосходить противника в огневой мощи, тактическом мышлении и выносливости во всех аспектах."

  advanced_squad_tactics_c3i: "C3I"
  advanced_squad_tactics_c3i_desc: "C3I, что означает «командование, управление, связь и разведка», предполагает широкое использование информационных ресурсов для достижения военных целей. В результате каждый подразделение становится более организованным и может быстрее набираться опыта в боевых условиях."

  large_front_operations_desc: "Для ведения боевых действий на широком фронте необходимо координировать действия нескольких подразделений, чтобы обеспечить общее наступление. Организуя наступление по оперативным, а не тактическим линиям, мы можем улучшить логистику и связь."

  large_front_operations_vast_offenses: "Операционные наступления"
  large_front_operations_vast_offenses_desc: "Местные успехи имеют очень небольшое стратегическое значение. Наступления должны проникать глубоко в территорию противника и занимать обширные территории, чтобы нанести сокрушительный удар по противнику."

  large_front_operations_c3i: "C3I"
  large_front_operations_c3i_desc: "C3I, что означает «командование, управление, связь и разведка», предполагает широкое использование информационных ресурсов для достижения военных целей. В результате каждый подразделение становится более организованным и может быстрее набираться опыта в боевых условиях."


  defense_in_depth: "Глубокая оборона"
  defense_in_depth_desc: "Сосредоточившись на сдерживании, а не на предотвращении продвижения врага, мы можем использовать несколько линий обороны, чтобы постепенно измотать защитника. Как только атакующий исчерпает свои логистические ресурсы и резервы, наши другие линии могут быть использованы для контратаки и оттеснения атакующего."

  defense_in_depth_central_planning: "Централизованное планирование"
  defense_in_depth_central_planning_desc: "По мере того как подразделения становятся все более организованными, необходимость в централизованной структуре командования становится все более очевидной. Последовательная структура командования позволяет обеспечить более эффективную координацию и улучшить распространение боевого опыта и знаний."

  defense_in_depth_grand_battleplan: "Грандиозный план сражения"
  defense_in_depth_grand_battleplan_desc: "Тщательная подготовка и планирование — залог успеха на поле боя. Медленные и методичные действия — лучший способ победить врага в сражении."

  elastic_defense: "Эластичная оборона"
  elastic_defense_desc: "Эта форма обороны сосредоточена на использовании мобильных сил для организации боевого отступления с целью ослабления наступательного импульса противника. Теперь наши силы будут лучше способны быстро перемещаться вперед и назад для оперативного создания укреплений."

  elastic_defense_central_planning: "Централизованное планирование"
  elastic_defense_central_planning_desc: "По мере того как подразделения становятся все более организованными, необходимость в централизованной структуре командования становится все более очевидной. Последовательная структура командования позволяет обеспечить более эффективную координацию и улучшить распространение боевого опыта и знаний."

  elastic_defense_shock_and_awe: "Шок и трепет"
  elastic_defense_shock_and_awe_desc: "Страх и трепет основываются на подавляющем проявлении силы, чтобы сломить волю противника к борьбе. Улучшенная разведка позволяет нам быстро составить картину сложившейся ситуации и дает возможность сразу же взять под контроль любое поле боя."


  fortified_fighting_positions: "Укрепленные боевые позиции"
  fortified_fighting_positions_desc: "Используя боевые позиции в наступлении, мы можем использовать быстро сооруженные укрепления в качестве средства нападения."

  fortified_fighting_positions_mortar_pits: "Позиционные минометы"
  fortified_fighting_positions_mortar_pits_desc: "Использование минометов в установленных местах позволяет пехоте широко использовать возможности непрямой стрельбы без артиллерийской поддержки. Однако время, необходимое для установки и демонтажа этих установок, затрудняет их использование в движении."

  fortified_fighting_positions_skirmish_lines: "Линии перестрелки"
  fortified_fighting_positions_skirmish_lines_desc: "Сформировав четкие линейные построения, наша пехота будет лучше способна отражать атаки противника."

  overlapping_defensive_positions: "Перекрывающиеся оборонительные позиции"
  overlapping_defensive_positions_desc: "Использование нескольких уровней оборонительных сооружений значительно затрудняет противнику вытеснение нашей пехоты из укрепленных позиций."

  overlapping_defensive_positions_blob_formations: "Формирование «капель»"
  overlapping_defensive_positions_blob_formations_desc: "Организация пехоты в свободные и гибкие формирования позволяет улучшить оборонительные и наступательные возможности. Однако такое сосредоточение сил делает нас уязвимыми для окружения."

  overlapping_defensive_positions_continuous_offensive: "Непрерывное наступление"
  overlapping_defensive_positions_continuous_offensive_desc: "Как только мы прорвем оборону противника, наш фронт должен быть способен непрерывно продвигаться вперед. Каждая секунда, которую мы ждем, — это секунда, которая дает противнику возможность перевести дух."


  placeholder_doctrine_not_required: "§RЗАМЕЩЕНИЕ: ЭТА ДОКТРИНА НЕ ТРЕБУЕТСЯ И БУДЕТ ВСКОРО УДАЛЕНА§!"
  placeholder_doctrine_not_required_desc: ""


  mission_type_tactics: "Типы миссий и тактика"
  mission_type_tactics_desc: "Наши лидеры не должны быть автоматами. Они должны разумно интерпретировать свои приказы и отступать от их строгого соблюдения, если это способствует выполнению миссии. Победа важнее слепого повиновения."

  mission_type_tactics_combined_arms_battle_groups: "Объединенные оперативные группы"
  mission_type_tactics_combined_arms_battle_groups_desc: ""

  mission_type_tactics_control_zone_responsibilites: "Ответственность зоны контроля"
  mission_type_tactics_control_zone_responsibilites_desc: ""

  individual_excellence: "Индивидуальное превосходство"
  individual_excellence_desc: "Каждый человек – император. Наши войска должны быть способны индивидуально выполнять сложные и ответственные задачи и всегда нести свою ношу. То, как мы их обучаем, имеет решающее значение для нашего успеха на фронте."

  individual_excellence_combined_arms_battle_groups: "Объединенные оперативные группы"
  individual_excellence_combined_arms_battle_groups_desc: ""

  individual_excellence_control_zone_responsibilites: "Ответственность зоны контроля"
  individual_excellence_control_zone_responsibilites_desc: ""


  orders_by_task: "Приказы по локальным задачам"
  orders_by_task_desc: "Организуя войска для достижения локальных тактических побед, мы можем обеспечить гибкий поток команд, чтобы своевременно достичь наших целей."

  orders_by_task_pocket_defense: "Защита в окружении"
  orders_by_task_pocket_defense_desc: "Если наши войска окружены, они должны быть способны продержаться как можно дольше, чтобы либо задержать продвижение противника, либо дать возможность другим нашим силам вывести их из окружения."

  orders_by_task_hidden_supply_caches: "Скрытые тайники с припасами"
  orders_by_task_hidden_supply_caches_desc: "Используя припасы, захваченные в ходе наступлений, мы сможем более эффективно поддерживать продолжительные наступления, не полагаясь на то, что наши пути снабжения успеют наверстать упущенное."

  orders_by_directive: "Приказы по общей директиве"
  orders_by_directive_desc: "Организуя наши войска для достижения крупных стратегических целей, мы можем улучшить координацию между подразделениями для достижения грандиозных целей."

  orders_by_directive_pocket_defense: "Защита в окружении"
  orders_by_directive_pocket_defense_desc: "Если наши войска окружены, они должны быть способны продержаться как можно дольше, чтобы либо задержать продвижение противника, либо дать возможность другим нашим силам вывести их из окружения."

  orders_by_directive_hidden_supply_caches: "Скрытые тайники с запасами"
  orders_by_directive_hidden_supply_caches_desc: "Используя припасы, захваченные в ходе наступлений, мы сможем более эффективно поддерживать продолжительные наступления, не полагаясь на то, что наши пути снабжения успеют наверстать упущенное."


  fire_by_command: "Огонь по команде"
  fire_by_command_desc: "Вертикальная структура управления артиллерией предотвратит дальнейшую трату снарядов, что позволит более эффективно использовать их для достижения запланированных целей."

  fire_by_command_anti_tank_reserves: "Противотанковые резервы"
  fire_by_command_anti_tank_reserves_desc: "Обеспечение наличия части противотанковых батальонов в резерве второй линии означает, что они могут быстро реагировать на любую бронетанковую атаку противника и усилить линию фронта."

  fire_by_command_advanced_firebases: "Передовые огневые точки"
  fire_by_command_advanced_firebases_desc: "Небольшое количество артиллерии, используемое на ключевых передовых позициях, позволяет нам атаковать врага в уязвимых точках его фронта. Ударив по их слабым местам, мы можем посеять хаос в их рядах и создать брешь, которую сможет использовать наше наступление."

  fire_by_request: "Огонь по запросу"
  fire_by_request_desc: "Наши войска на местах лучше всего знают обстановку по сравнению с высшим руководством. Предоставление полевым командирам полномочий на быстрое привлечение артиллерийского огня значительно повысит эффективность и гибкость наших подразделений."

  fire_by_request_anti_tank_reserves: "Противотанковые резервы"
  fire_by_request_anti_tank_reserves_desc: "Обеспечение наличия части противотанковых батальонов в резерве второй линии означает, что они могут быстро реагировать на любую бронетанковую атаку противника и усилить линию фронта."

  fire_by_request_advanced_firebases: "Передовые огневые точки"
  fire_by_request_advanced_firebases_desc: "Небольшое количество артиллерии, используемое на ключевых передовых позициях, позволяет нам атаковать врага в уязвимых точках его фронта. Ударив по их слабым местам, мы можем посеять хаос в их рядах и создать брешь, которую сможет использовать наше наступление."






  dogfighting: "Тактика воздушного боя"
  dogfighting_desc: "Тактика, позволяющая стрелять и избегать попадания под обстрел, может значительно помочь нашим пилотам в достижении превосходства в воздухе."


  strike_formations: "Ударные формирования"
  strike_formations_desc: "Наши истребители должны уметь координировать свои действия с другими истребителями, чтобы обойти и уничтожить противника. Боевые столкновения один на один возможны только в идеальных условиях, а для снижения боевой мощи противника крайне важна командная работа."

  strike_formations_squad_hunters: "Отряд охотников"
  strike_formations_squad_hunters_desc: "Небольшие отряды самолетов способны осуществлять локальный контроль над воздушным пространством и перехватывать бомбардировщики, которые не могут дать отпор. Создав большее количество таких небольших отрядов, мы сможем перехватывать бомбардировщики до того, как они достигнут своих целей."

  strike_formations_search_and_destroy: "Найти и уничтожить"
  strike_formations_search_and_destroy_desc: "Враг рассчитывает на честную игру, поэтому нестандартные тактики, направленные на то, чтобы найти врага и уничтожить его до того, как он это ожидает, могут принести отличные результаты."

  formation_flying_desc: "Летая в формированиях, самолеты могут оказывать друг другу поддержку или совместно атаковать врагов."

  formation_flying_fighter_sweeps: "Боевые разведывательные полеты"
  formation_flying_fighter_sweeps_desc: "Агрессивные патрулирования истребителей над вражеской территорией могут застать вражеские самолеты во время взлета или посадки, когда они особенно уязвимы, или сорвать учебные полеты противника."

  formation_flying_bomber_sweeps: "Перехват омбардировщиков"
  formation_flying_bomber_sweeps_desc: "Основная задача истребителей — перехват вражеских бомбардировщиков. Очищая территорию от бомбардировщиков, мы можем защитить жизненно важные силы и инфраструктуру."


  aces_in_wings: "Асы в эскадрильях"
  aces_in_wings_desc: "Ничто не заменит боевой опыт. Наши пилоты должны быстро учиться и адаптироваться к условиям боевых действий. Тогда мы сможем легко выявить лучших пилотов из тех, кто достиг наибольших успехов."

  aces_in_wings_fighter_ace_initiative: "Инициатива асов"
  aces_in_wings_fighter_ace_initiative_desc: "Присуждение специальных наград и статуса пилотам, достигшим статуса аса, сбив пятерых противников, стимулирует рискованные действия и вызывает у пилотов-асов чувство элитарности, хотя это и заставляет опытных пилотов оставаться на боевых позициях."

  aces_in_wings_rapid_deployment: "Быстрое развертывание"
  aces_in_wings_rapid_deployment_desc: "Наши пилоты истребителей должны быть всегда готовы к немедленному вылету для защиты нашего воздушного пространства. Хотя наши летчики всегда начеку, они также более подвержены ошибкам из-за усталости и необходимости действовать быстро."

  aces_in_schools: "Асы в школах"
  aces_in_schools_desc: "Вместо того чтобы сосредотачиваться на отдельных асах, мы должны обучать наших пилотов в школах высшего пилотажа, чтобы обеспечить более высокий базовый уровень качества наших военно-воздушных сил."

  aces_in_schools_fighter_ace_initiative: "Инициатива асов"
  aces_in_schools_fighter_ace_initiative_desc: "Присуждение специальных наград и статуса пилотам, достигшим статуса аса, сбив пятерых противников, стимулирует рискованные действия и вызывает у пилотов-асов чувство элитарности, хотя это и заставляет опытных пилотов оставаться на боевых позициях."

  aces_in_schools_force_rotation: "Принудительная ротация"
  aces_in_schools_force_rotation_desc: "Боевые действия или просто длительные периоды интенсивной концентрации внимания выматывают, но, по возможности, заменяя пилотов свежими силами, мы можем сократить количество ошибок, связанных с усталостью."


  dispersed_formations: "Рассредоточенные формирования"
  dispersed_formations_desc: "Рассеивая наши боевые формирования, мы можем охватить большие участки воздушного пространства и обеспечить общее превосходство в воздухе над обширными территориями."

  dispersed_formations_multialtitude_flying: "Полеты на разных высотах"
  dispersed_formations_multialtitude_flying_desc: "Воздушный бой происходит в трех измерениях, но большинству пилотов сложнее отслеживать самолеты, летящие выше или ниже них. Мы можем воспользоваться этим, распределив наши формации по вертикали."

  dispersed_formations_forward_interception: "Прямой перехват"
  dispersed_formations_forward_interception_desc: "Осуществляя операции ближе к воздушному пространству противника, наши истребители с большей вероятностью смогут перехватить вражеские самолеты до того, как они достигнут своих целей."

  concentrated_formations: "Концентрированные формирования"
  concentrated_formations_desc: "Концентрация наших истребительных формирований позволяет нам достичь локального превосходства в воздухе и использовать тактику «разгрома по частям» для распространения превосходства на более отдаленные районы."

  concentrated_formations_multialtitude_flying: "Полеты на разных высотах"
  concentrated_formations_multialtitude_flying_desc: "Воздушный бой происходит в трех измерениях, но большинству пилотов сложнее отслеживать самолеты, летящие выше или ниже них. Мы можем воспользоваться этим, распределив наши формации по вертикали."

  concentrated_formations_fighter_escorts: "Истребители сопровождения"
  concentrated_formations_fighter_escorts_desc: "Наши истребители должны летать в непосредственной близости от наших бомбардировщиков и атаковать цели по мере их приближения. Это позволяет лучше координировать действия с нашими бомбардировочными формированиями и обеспечивает их постоянную защиту."


  target_acquisition: "Поиск цели"
  target_acquisition_desc: "Изучение тактики ведения боевых действий на передовой позволяет нашим ударным самолетам выбирать цели в условиях активных боевых действий."



  dive_bombing_direct_ground_support: "Прямая наземная поддержка"
  dive_bombing_direct_ground_support_desc: "Благодаря тесной координации действий пилотов штурмовиков с наземными наблюдателями, огневая мощь с воздуха может быть точно направлена на оказание максимальной помощи войскам в бою."

  dive_bombing_hunt_and_destroy: "Охота и уничтожение"
  dive_bombing_hunt_and_destroy_desc: "Помимо оказания прямой огневой поддержки, штурмовики могут самостоятельно выявлять цели, часто нанося неожиданные удары по наземным силам противника, продвигающимся к линии фронта."

  level_bombing: "Бомбардировка по уровню"
  level_bombing_desc: "Тактические бомбардировщики менее точны, чем пикирующие бомбардировщики, но более безопасны и просты в использовании. Их бомбы также могут использоваться в различных целях за пределами боевых действий, что делает их чрезвычайно универсальным оружием."

  level_bombing_direct_ground_support: "Прямая наземная поддержка"
  level_bombing_direct_ground_support_desc: "Благодаря тесной координации действий пилотов штурмовиков с наземными наблюдателями, огневая мощь с воздуха может быть точно направлена на оказание максимальной помощи войскам в бою."

  level_bombing_hunt_and_destroy: "Охота и уничтожение"
  level_bombing_hunt_and_destroy_desc: "Помимо оказания прямой огневой поддержки, штурмовики могут самостоятельно выявлять цели, часто нанося неожиданные удары по наземным силам противника, продвигающимся к линии фронта."


  air_superiority_desc: "Для обеспечения безопасности наших самолетов поддержки необходимо достичь полного превосходства в воздухе. Первым шагом к достижению этой цели является обнаружение вражеских истребителей до того, как они смогут угрожать нам."

  air_superiority_spotter_wings: "Крылья-наблюдатели"
  air_superiority_spotter_wings_desc: "Использование специальных разведывательных самолетов позволяет нашим ударным кораблям заранее получать информацию о кораблях противника и их формированиях. В результате они могут более легко и с меньшим риском обнаруживать и уничтожать корабли противника."

  air_superiority_low_altitude_training: "Тренировка на малой высоте"
  air_superiority_low_altitude_training_desc: "Для обеспечения максимальной точности наши ударные самолеты должны летать на чрезвычайно низких высотах, чтобы сбросить боеприпасы. Обучение наших пилотов выполнению высокорисковых маневров на таких высотах подготовит их к уклонению от огня вражеских зенитных орудий и истребителей."

  escorted_strafing: "Сопровождение штурмовиков"
  escorted_strafing_desc: "Для обеспечения безопасности наших самолетов поддержки необходимо отвлечь внимание вражеских средств ПВО. Насыщение зон боевых действий дополнительными ударами обеспечит более легкое выполнение основной задачи."

  escorted_strafing_spotter_wings: "Крылья-наблюдатели"
  escorted_strafing_spotter_wings_desc: "Использование специальных разведывательных самолетов позволяет нашим ударным кораблям заранее получать информацию о кораблях противника и их формированиях. В результате они могут с большей легкостью и меньшим риском обнаруживать и уничтожать корабли противника."

  escorted_strafing_low_altitude_training: "Тренировка на низкой высоте"
  escorted_strafing_low_altitude_training_desc: "Для обеспечения максимальной точности наши ударные самолеты должны летать на чрезвычайно низких высотах, чтобы сбросить боеприпасы. Обучение наших пилотов выполнению высокорисковых маневров на таких высотах подготовит их к уклонению от огня вражеских зенитных орудий и истребителей."



  logistical_bombing_battlefield_support: "Поддержка на поле боя"
  logistical_bombing_battlefield_support_desc: "Тактическим бомбардировщикам сложно атаковать цели вблизи мест боевых действий наших наземных войск, поскольку бомбардировка с горизонтального полета менее точна, чем бомбардировка с пикирования, но более тщательная подготовка и взаимодействие с наземными наблюдателями могут помочь преодолеть эти проблемы."

  logistical_bombing_ground_support_integration: "Интеграция наземной поддержки"
  logistical_bombing_ground_support_integration_desc: "Полная интеграция наших тактических бомбардировщиков с наземными наблюдателями повышает их точность и позволяет им напрямую поддерживать наши наземные войска в бою."


  keypoint_bombing_battlefield_support: "Поддержка на поле боя"
  keypoint_bombing_battlefield_support_desc: "Тактическим бомбардировщикам сложно атаковать цели вблизи мест боевых действий наших наземных войск, поскольку бомбардировка с горизонтального полета менее точна, чем бомбардировка с пикирования, но более тщательная подготовка и взаимодействие с наземными наблюдателями могут помочь преодолеть эти проблемы."

  keypoint_bombing_ground_support_integration: "Интеграция наземной поддержки"
  keypoint_bombing_ground_support_integration_desc: "Полная интеграция наших тактических бомбардировщиков с наземными наблюдателями повышает их точность и позволяет им напрямую поддерживать наши наземные войска в бою."


  search_patterns: "Шаблоны поиска"
  search_patterns_desc: "Хорошо продуманные схемы поиска позволяют нам более эффективно находить и поражать цели противника."


  base_strike_desc: "Удары по вражеским портам лишат их возможности восстановить свой флот. Это позволит нам доминировать на морях благодаря численному превосходству."

  base_strike_aa_baiting: "Противовоздушная приманка"
  base_strike_aa_baiting_desc: "Самолеты, сбросившие боезапас, могут оставаться в зоне боевых действий, чтобы отвлечь зенитные средства от остальной части формирования."

  base_strike_keypoint_targetting: "Ключевые точки нацеливания"
  base_strike_keypoint_targetting_desc: "Атака слабых мест обеспечит больший урон."

  mass_strike: "Массовый удар"
  mass_strike_desc: "Нанесение удара по вражеским портам одним концентрированным ударом приведет к значительным разрушениям вражеских флотов, но с более высоким уровнем потерь."

  mass_strike_aa_baiting: "Противовоздушная приманка"
  mass_strike_aa_baiting_desc: "Самолеты, сбросившие боезапас, могут оставаться в зоне боевых действий, чтобы отвлечь зенитные средства от остальной части формирования."

  mass_strike_keypoint_targetting: "Ключевые точки нацеливания"
  mass_strike_keypoint_targetting_desc: "Атака слабых мест обеспечит больший урон."


  torpedo_strike_formations: "Формирования для торпедных атак"
  torpedo_strike_formations_desc: "Концепция торпеда чрезвычайно полезна, поскольку она нацелена на корпус корабля ниже ватерлинии, где его броня наиболее уязвима. Мы должны сосредоточиться на усовершенствовании морских бомбардировщиков, оснащенных торпедами."

  torpedo_strike_formations_submarine_hunting_formations: "Формирования для охоты на пододки"
  torpedo_strike_formations_submarine_hunting_formations_desc: "Специальные формирования, предназначенные для наиболее эффективного прочесывания больших территорий, повысят вероятность обнаружения подводных лодок."

  torpedo_strike_formations_battlefleet_support: "Поддержка боевого флота"
  torpedo_strike_formations_battlefleet_support_desc: ""

  deck_strike_formations: "Формирования для атаки с палубы"
  deck_strike_formations_desc: "Удар по палубе сосредоточен на использовании пикирующих бомбардировщиков для точной доставки боевой нагрузки на вражеские корабли. Это дает дополнительный эффект в виде возможности уничтожить палубу вражеских авианосцев и лишить их возможности запускать собственные самолеты. Мы должны сосредоточиться на улучшении морских пикирующих бомбардировщиков."

  deck_strike_formations_submarine_hunting_formations: "Формирования для охоты на подлодки"
  deck_strike_formations_submarine_hunting_formations_desc: "Специальные формирования, предназначенные для наиболее эффективного прочесывания больших территорий, повысят вероятность обнаружения подводных лодок."

  deck_strike_formations_battlefleet_support: "Поддержка боевого флота"
  deck_strike_formations_battlefleet_support_desc: ""


  coastal_air_patrol: "Береговой воздушный патруль"
  coastal_air_patrol_desc: ""

  coastal_air_patrol_naval_recon_support: "Поддержка морской разведки"
  coastal_air_patrol_naval_recon_support_desc: "Использование патрульных самолетов для обнаружения флотов и определения их формирований позволяет лучше подготовить наши самолеты к выполнению поставленных задач."

  coastal_air_patrol_expert_flying: "Эксперт по полетам"
  coastal_air_patrol_expert_flying_desc: "Умелое маневрирование под вражеским огнем позволяет избежать критических попаданий и обеспечить более успешное выполнение миссий."

  deep_ocean_air_patrol: "Патрулирование глубоководных районов океана"
  deep_ocean_air_patrol_desc: ""

  deep_ocean_air_patrol_naval_recon_support: "Поддержка морской разведки"
  deep_ocean_air_patrol_naval_recon_support_desc: "Использование патрульных самолетов для обнаружения флотов и определения их формирований позволяет лучше подготовить наши самолеты к выполнению поставленных задач."

  deep_ocean_air_patrol_expert_flying: "Эксперт по полетам"
  deep_ocean_air_patrol_expert_flying_desc: "Умелое маневрирование под вражеским огнем позволяет избежать критических попаданий и обеспечить более успешное выполнение миссий."


  bomber_formations: "Формирование бомбардировщиков"
  bomber_formations_desc: "Нападая в строю, мы можем более эффективно бомбить одну цель."


  carousel_bombing_desc: "Бомбардировщики часто просто хотят сбросить все свои бомбы, как только достигнут района цели, а затем как можно скорее вернуться домой. Хотя это может сработать при бомбардировке больших территорий, когда речь идет о поражении небольшой цели, более эффективно задержаться над целью, сбрасывая только часть бомбового груза за раз для максимальной точности."

  carousel_bombing_fighter_baiting: "Приманка для истребителей"
  carousel_bombing_fighter_baiting_desc: "Выглядя уязвимыми, наши бойцы могут заманить вражеские самолеты в засаду."

  carousel_bombing_low_echelon_support: "Поддержка на низкой высоте"
  carousel_bombing_low_echelon_support_desc: "Назначая подразделения штурмовиков непосредственно небольшим наземным формированиям, он обеспечивает им постоянную дополнительную огневую поддержку, даже когда они находятся вне зоны действия традиционной артиллерии."


  operational_destruction_fighter_baiting: "Приманка для истребителей"
  operational_destruction_fighter_baiting_desc: "Выглядя уязвимыми, наши бойцы могут заманить вражеские самолеты в засаду."

  operational_destruction_low_echelon_support: "Поддержка на низкой высоте"
  operational_destruction_low_echelon_support_desc: "Назначая подразделения штурмовиков непосредственно небольшим наземным формированиям, он обеспечивает им постоянную дополнительную огневую поддержку, даже когда они находятся вне зоны действия традиционной артиллерии."


  day_bombing_tt: "Открывает воздушные налеты «§YДневные бомбардировки§!», которые позволяют §Gпоражать больше целей§! и §Gнаносить больше урона§! за счет §Rболее высоких потерь бомбардировщиков§! и §Rболее эффективной обороны противника§!."

  day_bombing_massed_bomber_formations: "Массированные бомбардировочные формирования"
  day_bombing_massed_bomber_formations_desc: "Сохраняя строй, наши бомбардировщики могут защищать свою группу и повышать наши шансы на успешный сброс бомб."

  day_bombing_deep_air_raids: "Глубокие воздушные налеты"
  day_bombing_deep_air_raids_desc: ""

  night_bombing_desc: "Благодаря ослаблению обороны противника и прикрытию наших бомбардировщиков темнотой мы можем вести наступательные и эффективные действия круглосуточно. Покажем врагу, насколько мы упорны.\n\n"
  night_bombing_tt: "Открывает воздушные налеты «§YНочные бомбардировки§!», которые §Gснижают потери бомбардировщиков§! и §Gэффективность обороны противника§!, но §Rтребуют более крупных целей§! и §Rнаносят меньший урон§!."

  night_bombing_infiltration_bombing: "Бомбардировка с проникновением"
  night_bombing_infiltration_bombing_desc: "Присоединяться к вражеским формированиям или следовать за ними до их базы может показаться безумием. Но с достаточной практикой это вполне возможно."

  night_bombing_deep_air_raids: "Глубокие воздушные налеты"
  night_bombing_deep_air_raids_desc: ""



  high_level_bombing_strategic_destruction: "Стратегическое уничтожение"
  high_level_bombing_strategic_destruction_desc: "Наши пилоты могут достигать стратегических целей гораздо быстрее, чем наши военно-морские или сухопутные войска. Не имея возможности оснастить своих новобранцев, мы вскоре превзойдем вражеские силы по численности."

  high_level_bombing_overloaded_bombers: "Перегруженные бомбардировщики"
  high_level_bombing_overloaded_bombers_desc: "Чем больше боеприпасов могут взять на борт наши бомбардировщики, тем больше ущерба они могут нанести. Чтобы наши бомбардировки были успешными, необходимо расширить возможности наших самолетов."

  low_level_bombing: "Низковысотная бомбардировка"
  low_level_bombing_desc: "Полет ближе к земле подвергает наши бомбардировщики большему риску, но наши бомбы будут лететь точнее к цели. Уничтожение цели является высшим приоритетом."

  low_level_bombing_strategic_destruction: "Стратегическое уничтожение"
  low_level_bombing_strategic_destruction_desc: "Наши пилоты могут достигать стратегических целей гораздо быстрее, чем наши военно-морские или сухопутные войска. Не имея возможности оснастить своих новобранцев, мы вскоре превзойдем вражеские силы по численности."

  low_level_bombing_operational_integrity: "Операционная целостность"
  low_level_bombing_operational_integrity_desc: "Даже в условиях постоянной угрозы наши бомбардировщики должны сохранять хладнокровие и действовать так же, как в идеальных условиях. Формирования, разработанные с учетом текущей операции, позволят им сохранять спокойствие."



