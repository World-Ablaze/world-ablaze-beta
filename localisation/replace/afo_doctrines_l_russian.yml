  auftragstaktik: "Auftragstaktik"
  auftragstaktik_desc: "Наши солдаты обучены быть независимыми, наблюдательными и очень гибкими при выполнении миссий."

  mass_assault_corps_spirit: "Массированный штурм"
  mass_assault_corps_spirit_desc: "Ведение общевойскового боя и применение эффективного оружия требуют много времени и средств. Используя массированные и постоянные атаки призывных подразделений, мы в конечном итоге истощим ресурсы или людские силы противника. С этого момента мы сможем использовать набранный темп, чтобы продолжить наступление и подавить противника."

  deep_battle: "Глубокая битва"
  deep_battle_desc: "Мы должны сосредоточиться на разгроме врага не только на фронте, но и на всей глубине боевых действий."

  overwhelming_firepower_desc: "Широкое использование огневой поддержки большой дальности является ключом к тактической победе."

  british_professionalism: "Британский профессионализм"
  british_professionalism_desc: "Наши солдаты, прежде всего, проходят подготовку, чтобы стать профессионалами в своей области."

  noria_tactics: "Тактика ротации подразделений"
  noria_tactics_desc: "Постоянная ротация подразделений в линии фронта и за ее пределами гарантирует, что в бою всегда участвуют свежие солдаты."

  rapid_decision: "Быстрое решение"
  rapid_decision_desc: "Наши солдаты проходят обучение по доктрине объединенных вооруженных сил для ведения механизированной войны."

  bushido: "Бусидо"
  bushido_desc: "Путь воина гарантирует, что наши солдаты будут выполнять приказы до самой смерти."

  integrated_strategy: "Комплексная стратегия"
  integrated_strategy_desc: "Использование всех типов подразделений позволяет достичь наших целей, от выполнения армейских задач до реализации глобальной стратегии."

