  fleet_in_being: "Наличие флота"
  fleet_in_being_desc: "Корабли остаются в порту, где они находятся в большей безопасности, и вступают в бой с врагом только в подходящий момент. Присутствие наших кораблей заставит врагов с большей осторожностью относиться к захвату наших портов."

