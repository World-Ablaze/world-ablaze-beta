 USA_army_segregation_desc: "В США проводится политика подталкивания чернокожих в их собственные подразделения. Обычно они выполняют роли поваров, чернорабочих и выполняют другую случайную работу. Некоторым чернокожим мужчинам это не нравится, но все будет хорошо, пока не будут проведены новые реформы."
 USA_army_segregation_2: "Сегрегированные армейские бригады"
 USA_army_segregation_2_desc: "Сейчас мы включили чернокожих мужчин в состав белых дивизий, но они по-прежнему разделены на разные бригады, чтобы избежать расовых конфликтов. Это гораздо лучшее решение по сравнению с тем, что было раньше, но некоторые в нашем обществе хотят пойти дальше."
 USA_FY40_shipbuilding_lessons: "Уроки судостроения по плану 40-го финансового года"
 USA_FY40_shipbuilding_lessons_desc: "План 40-го финансового года позволил накопить большой опыт крупномасштабного строительства военных кораблей. Поскольку линкоры были в центре внимания плана, их строительство будет наиболее эффективным в будущем."
 USA_FY42_shipbuilding_lessons: "Уроки судостроения по плану 42-го финансового года"
 USA_FY42_shipbuilding_lessons_desc: "План 42 финансового года дал большой опыт крупномасштабного строительства военных кораблей. Поскольку авианосцы были в центре внимания плана, их строительство будет наиболее эффективным в будущем."
