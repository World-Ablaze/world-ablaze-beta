 USA_fix_torpedo_problems: "Доработка торпед экипажами"
 USA_fix_torpedo_problems_desc: "Несмотря на сопротивление со стороны Управления вооружений, экипажам подводных лодок удается устранить некоторые проблемы. Это особенно актуально, когда речь идет об исправлениях, таких как отключение магнитного детонатора для повышения шансов попадания."
  
 USA_brooklyn: "Заказать класс «Бруклин»"
 USA_brooklyn_desc: "Мы сильно ограничены в том, сколько лёгких крейсеров мы можем построить. В соответствии с этими ограничениями мы можем заказать еще только 2 крейсера класса «Бруклин»."
  
 USA_hornet: "Заказать USS Hornet"
 USA_hornet_desc: "Мы сильно ограничены в количестве авианосцев, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 1 авианосец класса «Йорктаун»."
  
 USA_wasp: "Заказать класс «Wasp»"
 USA_wasp_desc: "Мы сильно ограничены в количестве авианосцев, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 1 авианосец класса «Wasp»."
  
 USA_north_carolina: "Заказать класс «Северная Каролина»"
 USA_north_carolina_desc: "Мы сильно ограничены в количестве линкоров, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 2 линкора класса «Северная Каролина»."
  
 USA_south_dakota: "Заказать класс «Южная Дакота»"
 USA_south_dakota_desc: "Мы сильно ограничены в количестве линкоров, которые мы можем построить. В соответствии с этими ограничениями мы можем заказать только 2 линкора класса «Южная Дакота»."
  
 audacity_ship_conversion: "Переоборудование корабля «Audacity»"
 audacity_ship_conversion_desc: "Наш последний проект легкого авианосца может быть построен с использованием захваченного немецкого торгового корабля SS Hannover, что позволит нам довольно быстро развернуть легкий авианосец."
  
 nairana_ship_conversion: "Переоборудование корабля «Nairana»"
 nairana_ship_conversion_desc: "Наш последний проект легкого авианосца может быть построен с использованием захваченного немецкого торгового корабля SS Hannover, что позволит нам довольно быстро развернуть легкий авианосец."
  
 USA_operation_torch: "Операция «Факел»"
 USA_operation_torch_desc: "Свергнуть режим Виши"
  
 USA_take_over_faction: "Взять на себя лидерство в антигитлеровской коалиции"
 USA_take_over_faction_desc: "Теперь, когда мы достаточно перевооружились, мы можем снять это бремя с плеч англичан, приняв на себя обязанности военного руководства. Однако, даже несмотря на то, что мы будем заниматься всеми аспектами лидерства с военной и дипломатической точки зрения, [ENG.GetName] останется руководителем шпионской сети союзников."
  
 USA_end_mobilization: "Конец промышленной мобилизации"
 USA_end_mobilization_desc: "Хотя значительная часть промышленности Америки была переоборудована и использована для военных нужд без ущерба для экономики, потребность в таком объеме промышленных мощностей для победы над нашими врагами сокращается. Крупномасштабную промышленную мобилизацию для войны теперь можно сократить, поскольку мы готовимся вернуться к гражданской экономике после войны."
 USA_end_mobilization_tt: "Автоматическая £factory_conversion_texticon конверсия §Yфабрик§! в §Gвоенные заводы§! §Rнавсегда прекратится§! в текущей войне."
 end_mobilization: "Было решено прекратить промышленную мобилизацию через фокус §Y$USA_office_of_war_mobilization$§!."
 
 USA_internal_factions: "Внутренние фракции"
 USA_internal_factions_desc: "Великая депрессия усилила политическую напряженность в Америке. Несмотря на финансирование его первых выборов, отраслевые титаны все больше расходятся с Рузвельтом, поскольку он угождает народу. Однако он не может позволить себе полностью потерять их поддержку, поскольку их промышленная база может понадобиться, если Соединённые Штаты будут втянуты в новую войну...\n\n"
  
