 USA_ford_production_order: "£faction_usa_chrysler_ford Производственный заказ для компаний §BFord§!§W/§!§BChrysler§!"
 USA_ford_production_order_desc: "Учитывая возможность войны на горизонте, президент постарался заранее разместить заказ у компаний Ford и Chrysler, чтобы быть лучше оснащенными. Поскольку Ford и Chrysler специализируются в первую очередь на массовом производстве в стиле сборки, лучшими вариантами являются либо бомбардировщики, танки, либо механизированная техника."
 USA_gm_production_order: "£faction_usa_gm_dupont Производственный заказ для компаний §YGeneral Motors§!§W/§!§YDuPont§!"
 USA_gm_production_order_desc: "Учитывая возможность войны на горизонте, президент постарался заранее разместить заказ у GM и DuPont, чтобы быть лучше оснащенным. Поскольку GM и DuPont специализируются в основном на массовом и химическом производстве, лучшими вариантами являются грузовики, истребители или предприятия по производству синтетического каучука."
 USA_jpmorgan_order: "£faction_usa_jpmorgan  Политика в отношении компании §YJ§!§W.§!§YP§!§W.§! §YMorgan§!"
 USA_jpmorgan_order_desc: "Учитывая возможность войны на горизонте, президент стремился заранее определить общую денежно-кредитную политику с §YJ§!§W.§!§YP§!§W.§! §YMorgan§!, чтобы быть лучше подготовленным. Поскольку влияние §YJ§!§W.§!§YP§!§W.§! §YMorgan§! очень велико, мы можем либо снизить процентные ставки, либо восстановить веру в систему, либо использовать банковскую систему, чтобы склонить общественность в нашу пользу."
  
 USA_negotiate_with_ford: "£faction_usa_chrysler_ford Переговоры с группой из §BFord§!§W/§!§BChrysler§!"
 USA_negotiate_with_GM: "£faction_usa_gm_dupont Переговоры с группой из §YGeneral Motors§!§W/§!§YDuPont§!"
 USA_negotiate_with_JPMorgan: "£faction_usa_jpmorgan Переговоры с группой из §YJ§!§W.§!§YP§!§W.§! §YMorgan§!"
  
 USA_public_fireside_chat_sway: "£faction_usa_public_support Беседы у камина в мирное время"
 USA_public_fireside_chat_sway_desc: "Рузвельт был хорошо известен своими беседами у камина. В них он мог использовать своё главное политическое оружие — харизму, чтобы напрямую влиять на американский народ на личном уровне."
 USA_public_fireside_chat_sway_tt: "£faction_usa_public_support Общественность относится §Yбеспокойно§! и имеет хотя бы маленькое §Yвлияние§!  или выше.\nЭто решение длится §Y15 дней§! независимо от уровня отношений, а начиная с §Yбеспокойно§! длится §Y45 дней§!."
  
 USA_public_fireside_chat_war_support: "£faction_usa_public_support Беседы у камина во время войны"
 USA_public_fireside_chat_war_support_desc: "Умело используя свою харизму в радиобеседах у камина, Рузвельт может лично и доверительно успокоить американский народ относительно войны за рубежом."
 USA_public_fireside_chat_war_support_tt: "£faction_usa_public_support Общественность относится §3дружелюбно§! и имеет хотя бы маленькое §Yвлияние§! или выше.\nЭто решение длится §Y60 дней§! независимо от уровня отношений, начиная с §3дружелюбно§!."
  
 USA_ford_retooling_factories_slow: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! конвертируют фабрики"
 USA_ford_retooling_factories_slow_desc: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! постепенно переоснащают часть своей автомобильной промышленности для покрытия государственных контрактов мирного времени на поставку военной продукции."
  
 USA_ford_retooling_factories_peacetime: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! конвертируют военные заводы"
 USA_ford_retooling_factories_peacetime_desc: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! переоснащают свою военную промышленность для производства потребительских товаров мирного времени. Мы можем заставить Chrysler отложить конверсию."
  
 USA_ford_retooling_factories_fast: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! быстро конвертируют заводы"
 USA_ford_retooling_factories_fast_desc: "£faction_usa_chrysler_ford §BFord§!§W/§!§BChrysler§! быстро переоснащают всю свою автомобильную промышленность для удовлетворения потребностей военного производства."
  
 USA_gm_retooling_factories_slow: "£faction_usa_gm_dupont §YGeneral Motors§!§W/§!§YDuPont§! конвертируют фабрики"
 USA_gm_retooling_factories_slow_desc: "£faction_usa_gm_dupont §YGeneral Motors§!§W/§!§YDuPont§! постепенно переоснащают часть своей автомобильной промышленности для покрытия государственных контрактов мирного времени на поставку военной продукции."
  
 USA_gm_retooling_factories_peacetime: "£faction_usa_gm_dupont §YGeneral Motors§!§W/§!§YDuPont§! конвертируют военные заводы"
 USA_gm_retooling_factories_peacetime_desc: "£faction_usa_gm_dupont §YGeneral Motors§!§W/§!§YDuPont§! переоснащают свою военную промышленность для производства потребительских товаров мирного времени. Мы можем заставить §YGeneral Motors§!§W/§!§YDuPont§! отложить конверсию."
  
