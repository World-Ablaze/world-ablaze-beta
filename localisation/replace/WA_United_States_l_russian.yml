 usa_armor.014.t: "Великая депрессия продолжается"
 usa_armor.014.d: "Великая депрессия бушует в Соединённых Штатах Америки. Хотя политика «Нового курса», принятая с 1933 по 1935 год, помогла, ситуация все еще остается ужасной. Каждый штат борется с высоким уровнем местной безработицы. Лучший способ смягчить эти местные штрафы — создать в каждом штате инфраструктуру §O8 уровня§!.\nНекоторые фокусы в политике «Нового курса» также дают §Oбесплатную инфраструктуру§! некоторым штатам. Как только в штате будет достигнут §G8 уровень инфраструктуры§!, §Oштрафы§!, наложенные на этот штат, можно будет снять решением!"
 usa_armor.014.a: "Мы добираемся автомобильным/жд транспортом, но экономисты путешествуют по инфраструктуре!"
 usa_armor.014.b: "Нельзя отделить здания от инфраструктуры!"
 usa_armor.014.c: "Инфраструктура имеет ключевое значение, но и то, как она используется, а это уже политика!"
  
 usa_armor.015.t: "Супернаводнение 1937 года"
 usa_armor.015.d: "Наводнение на реке Огайо в 1937 году — одно из самых страшных стихийных бедствий в истории США. Более 400% нормальных осадков выпало в ключевых районах долины реки Огайо, что привело к массовому разливу рек Огайо и Миссисипи, уничтожившему большие части ключевых районов страны, таких как Цинциннати, Сент-Луис, Нэшвилл и Мемфис. Без надлежащих механизмов борьбы с наводнениями эти бедствия будут продолжаться."
 usa_armor.015.a: "Мы должны принять закон, чтобы сдержать это наводнение!"
  
 usa_armor.016.t: "Забастовка профсоюза «Объединённые горняки Америки»"
 usa_armor.016.d: "Более 500 000 американских угольщиков прекратили работу ровно через минуту после полуночи, когда истек срок действия контракта профсоюза с горнодобывающими компаниями страны. Это парализовало всю нашу промышленную базу, поскольку запасов хватит лишь на несколько дней, прежде чем все производство остановится."
 usa_armor.016.a: "Профсоюзы надо приручить!"
  
 usa_armor.804.t: "Румыния просит мира"
 usa_armor.804.d: ""
 usa_armor.804.a: "Согласиться на мир"
 usa_armor.804.b: "Отвергнуть мир"
  
 usa_armor.805.t: "[USA.GetName] вводят эмбарго против нашей страны"
 usa_armor.805.d: "Соединённые Штаты Америки ввели против нас полное эмбарго после наших недавних политических действий. Благодаря связям США в Южной Америке страны, на которые распространяется доктрина Монро, последовали их примеру. Похоже, нам придется искать необходимые нам ресурсы в другом месте."
 usa_armor.805.a: "Мы потеряли поставщиков жизненно важных ресурсов"
  
 usa_armor.806.t: "Закон о судебных процедурах"
 usa_armor.806.d: "Поскольку Верховный суд безжалостно отменяет законодательство «Нового курса», необходимо принять решительные меры для обеспечения экономической безопасности американского народа. Чтобы суд перестал быть препятствием, был разработан план по включению в его состав судей, лояльных «Новому курсу». Основное положение закона позволит президенту назначить нового судью, если какой-либо судья, проработавший не менее 10 лет, не ушел в отставку через 6 месяцев после того, как ему исполнилось 70 лет. Закон, хотя он может быть конституционным, серьезно нарушит баланс сил между тремя ветвями власти, и многие американцы будут рассматривать это как попытку пересмотреть конституцию, и это почти наверняка будет стоить нам значительной поддержки."
 usa_armor.806.a: "Будем надеяться, что это сработает..."
  
 usa_armor.807.t: "Вопрос о Палате"
 usa_armor.807.d: "При планировании преодоления оппозиции Конгресса встал вопрос о том, на какой части Конгресса следует сосредоточиться, чтобы принять законопроект. Хотя законы обычно сначала направляются в палату представителей, возможно, было бы полезно сконцентрировать усилия в Сенате."
 usa_armor.807.a: "Сосредоточиться на Сенате."
 usa_armor.807.b: "Сосредоточиться на Палате представителей."
  
 usa_armor.808.t: "Девятая беседа у камина"
 usa_armor.808.d_house_not_told: "В беседе у камина Рузвельт рассказал о своих планах судебной реформы. В своей речи он сравнил три ветви американского правительства с тремя лошадьми, которыми правит американский народ, причем третья лошадь, Суд, не тянет свою долю груза. Он раскритиковал суд как «орган, разрабатывающий политику», а не суд, и высмеял его за попытку помешать оказанию помощи. Однако примеры, приведенные Рузвельтом, оказались вводящими в заблуждение или фактически неверными, и это привело к тому, что многие американцы, в том числе многие сторонники «Нового курса», разделились по этому вопросу, рассматривая это как бесстыдный захват власти."
 usa_armor.808.d_house_told: "В беседе у камина Рузвельт рассказал о своих планах судебной реформы. В своей речи он сравнил три ветви американского правительства с тремя лошадьми, которыми правит американский народ, причем третья лошадь, Суд, не тянет свою долю груза. Он раскритиковал суд как «орган, разрабатывающий политику», а не суд, и высмеял его за попытку помешать оказанию помощи. Поддержка Палаты представителей помогла укрепить это убеждение, несмотря на отсутствие доказательств, что привело к получению поддержки со стороны американского народа."
 usa_armor.808.a: "Подделка документов – необходимое зло!"
 usa_armor.808.b: "Нам нужно поторопиться с законопроектом!"
 usa_armor.808.c: "Будем надеяться, что это сработает..."
  
 usa_armor.809.t: "Дебаты среди демократов Палаты представителей"
 usa_armor.809.d: "Как только законопроект поступил в Палату представителей, разразился хаос. Демократическая партия просто распалась, поскольку две коалиции осудили друг друга, при этом многие демократы, выступавшие против законопроекта, встали на сторону республиканцев, которые воспользовались всеми преимуществами, которые у них были, чтобы разделить демократов. Положение усугубило письмо вице-президента Джона Нэнса Гарнера с осуждением законопроекта, что является прямым вызовом президенту. Поскольку партия расколота, необходимо принять меры для обеспечения принятия законопроекта."
 usa_armor.809.a: "Принудить к компромиссу!"
 usa_armor.809.b: "Осудить противников законопроекта!"
  
 usa_armor.810.t_bill_pass: "Билл проходит"
 usa_armor.810.t_bill_fails: "Билл проваливается"
 usa_armor.810.d_bill_pass: "Несмотря на жесткую оппозицию, законопроект прошел через обе палаты Конгресса. Благодаря компромиссу и убедительности законопроект был принят 225 голосами против 210 в Палате представителей и 50 против 46 в Сенате. Этот успех во многом обусловлен осуждением Рузвельтом письма Гарнера, а также уступками, сделанными на других фронтах. Однако, несмотря на этот успех, многие члены партии отвернулись от Рузвельта. Несмотря на это, законопроект вступит в силу очень скоро, что расширит возможности для законодательства."
 usa_armor.810.d_bill_fails: "Несмотря на наши усилия, законопроекту удалось собрать достаточное количество противников, чтобы эффективно его победить. Частично из-за письма вице-президента, а также действий республиканцев законопроект был полностью отклонен: 170 против и 265 в Палате представителей, и законопроект не был передан в Сенат. Кроме того, многие отвернулись от Рузвельта из-за того, что они называют попыткой диктатуры."
 usa_armor.810.a: "Какое облегчение!"
 usa_armor.810.b: "Проклятье!"
  
 usa_armor.814.t: "США против Батлера: Закон о регулировании сельского хозяйства признан неконституционным"
 usa_armor.814.d: "Сегодня Верховный суд США постановил, что Закон о регулировании сельского хозяйства является неконституционным. В деле «США против Батлера» было решено, что налог на производителей является неконституционным, поскольку он не является настоящим налогом: он облагает переработчиков сельскохозяйственной продукции только для того, чтобы передать деньги фермерам, а попытка контролировать цены на сельскохозяйственную продукцию выходит за рамки перечисленных в Конституции полномочий. Это решение ставит заслон усилиям по оказанию помощи фермерам."
 usa_armor.814.a: "С этим зарвавшимся судом надо что-то делать."
  
 usa_armor.815.t: "Забастовка во Флинте"
 usa_armor.815.d: "Сегодня Объединенные автомобильные рабочие устроили широкомасштабную забастовку на заводе General Motors во Флинте. Впервые применив новую тактику забастовок, названную «сидячей забастовкой», в отличие от пикетирования, рабочие заняли сами заводские помещения, не позволяя GM нанимать штрейкбрехеров. Чтобы поддерживать закон и порядок, мы могли бы вмешаться и добиться компромисса, однако, если мы откажемся от этого, мы сохраним нашу поддержку со стороны профсоюзов, которые составляют значительную часть коалиции Демократической партии."
 usa_armor.815.a: "Пусть профсоюз и завод сами разберутся."
 usa_armor.815.b: "Отправить ополчение, чтобы добиться компромисса!"
  
 usa_armor.816.t: "Письмо Эйнштейна — Силарда"
 usa_armor.816.d: "Сегодня на наших столах оказалось письмо, составленное всемирно известными учеными Альбертом Эйнштейном и Лео Силардом, беженцами из Европы. В письме оба заявляют, что существует вероятность того, что Германия разрабатывает бомбу, работающую на основе ядерного деления, чтобы произвести взрыв, последствия которого будут катастрофическими. Они призывают нашу администрацию начать разработку аналогичной бомбы в качестве контрмеры потенциальным разработкам Германии."
 usa_armor.816.a: "Эту возможность необходимо учесть."
  
 usa_armor.817.t: "Рецессия Рузвельта"
 usa_armor.817.d: "Из-за внезапного сокращения бюджета американская экономика снова впала в спад. Учитывая, что уровень безработицы самый высокий с начала депрессии, очевидно, что восстановлению американской экономики потребуется больше времени, чем ожидалось."
 usa_armor.817.a: "Что-то должно быть сделано!"
 usa_armor.817.b: "В конце концов всё наладится само собой..."
  
 usa_armor.818.t: "Америка обещает помощь"
 usa_armor.818.d: "Поскольку в Соединённых Штатах растет поддержка войны, недавно был принят закон, согласно которому Америка может оказывать косвенную помощь в виде экономической и военной поддержки. Надеемся, что в ближайшие годы мы можем ожидать поставок оружия и топлива."
 usa_armor.818.a: "Самый желанный спасательный круг!"
  
 usa_armor.819.t: "[USA.GetName] хотят присоединиться к антигитлеровской коалиции"
 usa_armor.819.d: "При поддержке внутри страны и в то время, как весь мир охвачен огнем, [USA.GetName] официально направили просьбу присоединиться к союзникам, чтобы начать помогать в военных действиях и свергнуть фашистскую тиранию. Наличие такого гиганта на нашей стороне заставит страны Оси пожалеть, что они вообще вступили в войну."
 usa_armor.819.a: "Сердечно приветствуем наших новых союзников!"
 usa_armor.819.b: "Нам не нужна их помощь!"
  
 usa_armor.820.t: "Торпедный кризис"
 usa_armor.820.d: "Во время нашего первого морского боя и тренировок мы обнаружили серьезные проблемы с нашими торпедами. Мы установили, что существуют серьезные проблемы с глубиной торпеды, преждевременной детонацией, срывами взрыва и круговым, а не линейным движением. По сути, нам необходимо прекратить производство наших бракованных торпед и срочно заняться устранением этих проблем, которые на какое-то время сделают нас уязвимыми."
 usa_armor.820.a: "Нам нужно быть осторожными, пока это не будет исправлено."
  
 usa_armor.821.t: "Исправлены проблемы с круговым движением торпед."
 usa_armor.821.d: "На наши торпеды установлены новые гироскопы, которые устранят любые круговые движения торпед. Ожидается, что это резко увеличит количество попаданий наших торпед, хотя остаются и другие проблемы, требующие решения."
 usa_armor.821.a: "Отлично"
  
 usa_armor.822.t: "Исправлены проблемы с глубиной торпед."
 usa_armor.822.d: "Новые улучшения плавучести торпед устранили проблемы со слишком глубоким погружением торпеды. Новый механизм Улана для контроля глубины, заменяющий маятниковое и гидростатическое управление, обеспечивает гораздо более быструю стабилизацию глубины. Однако есть еще проблемы, которые предстоит исправить"
 usa_armor.822.a: "Хорошие новости"
  
 usa_armor.823.t: "Исправлены проблемы с контактным взрывателем торпеды."
 usa_armor.823.d: "Внедрены новые доработки контактных взрывателей торпед. Взамен механического ударникового механизма установлен более надежный электрический детонатор с шариковым замыкателем."
 usa_armor.823.a: "Давно пора!"
  
 usa_armor.824.t: "Резервная каучуковая компания"
 usa_armor.824.d: "Благодаря тому, что мы вовремя заметили нашу зависимость от поставок натурального каучука из Азии, были накоплены большие запасы на случай, если когда-нибудь разразится война и эти линии поставок окажутся под угрозой. Однако нам хватит только на год."
 usa_armor.824.a: "Отличное планирование окупается!"
 
 usa_armor.825.t: "[ENG.GetName] просит о финансовой помощи"
 usa_armor.825.d: "Ситуация в Великобритании становится все более отчаянной. Война обходится британской экономике в большие суммы денег, которые становится все труднее найти. [ENG.GetLeader] позвонил в Белый дом, чтобы обсудить условия новых займов, которые помогут им продолжить военные действия еще некоторое время. Однако для того, чтобы такие займы оказали влияние на ход войны, необходимо выдать их под небольшие проценты, а это нанесет ущерб нашей экономике."
 usa_armor.825.a: "Мы должны помочь, чем можем!"
 usa_armor.825.b: "Откажите им, наша экономика важнее всего!"

 usa_armor.826.t: "[USA.GetName] утверждают новые кредиты"
 usa_armor.826.d: "[USA.GetLeader] признал наше бедственное положение и пообещал финансовую помощь, чтобы мы могли продолжать борьбу без остановки."
 usa_armor.826.a: "Замечательные новости!"

 usa_armor.827.t: "[USA.GetName] отказывают нам в новых займах"
 usa_armor.827.d: "Считая любой ущерб для экономики США неприемлемым, [USA.GetLeader] отказался предоставить финансовую помощь."
 usa_armor.827.a: "Мы обойдемся без них!"
 
 usa_armor.862.t: "Смена планов?"
 usa_armor.862.d: "Отчаянные времена, как говорится. В свете последних событий может возникнуть необходимость в более крупной и боеспособной армии. Мы должны переосмыслить, достаточно ли 90 дивизий, чтобы справиться с текущей ситуацией. Нужны ли нам сейчас 265 дивизий, чтобы обеспечить победу?"
 usa_armor.862.a: "Нам нужно как можно больше дивизий!"
 usa_armor.862.b: "Мы должны придерживаться плана."
 
 usa_armor.870.t: "Тегеранская конференция"
 usa_armor.870.d: "У нас с Советами общий враг — Германия, и нам было бы выгодно использовать это, чтобы организовать встречу и превратить ее в великий союз между нашими фракциями. Возможно, мы сможем возглавить эти переговоры и заставить Советы использовать силы против Японии и, возможно, открыть больше дипломатических отношений с азиатскими странами, такими как Турция, используя советское влияние. Однако следует ожидать трений из-за наших противоположных идеологий."
 usa_armor.870.a: "Нам следует послать делегацию."
 usa_armor.870.b: "Мы не имеем дело с коммунистами!"
  
 usa_armor.871.t: "Тегеранская конференция"
 usa_armor.871.d: "Союзники направили к нам делегацию, чтобы начать переговоры и обсудить стратегию. Их главная цель — заставить нас направить силы против Японии. Мы, конечно, согласимся на это только после того, как с Германией будет решен вопрос, но, хотя мы еще можем им отказать, это хорошая возможность укрепить наши связи с союзниками, что может оказаться полезным в открытии для нас новых рынков. Мы также могли бы оказать давление на союзников, чтобы они придерживались более агрессивной стратегии в отношении Германии и взяли на себя большее бремя, когда дело дойдет до войны."
 usa_armor.871.a: "Это хорошая возможность!"
 usa_armor.871.b: "Мы не имеем дело с капиталистами!"
  
 usa_armor.872.t: "Тегеранская конференция"
 usa_armor.872.d: "После того, как Советы согласились на конференцию, они обязались объявить войну Японии после того, как будет решен вопрос с Германией. Но они ожидают, что мы внесем больший вклад в победу над Осью."
 usa_armor.872.a: "Превосходный результат!"
  
 usa_armor.873.t: "Советы отказывают нашей делегации"
 usa_armor.873.d: "К сожалению, Советы отвергли нашу делегацию и не будут участвовать в какой-либо совместной стратегии между нами. Мы не можем зависеть от помощи Советов на Востоке, и, похоже, на горизонте маячит более продолжительная война. Возможно, нам следует сосредоточить больше усилий на Востоке и оставить Германию русским?"
 usa_armor.873.a: "Не то, на что мы надеялись"
  
 usa_armor.874.t: "Война с [JAP.GetNameRuInst]"
 usa_armor.874.d: "По итогам Тегеранской конференции мы обязаны объявить войну Японии и вместе с нашими союзниками положить конец восходящему солнцу. Наши советники уверены в нашей силе, так как Япония уже очень давно находится в состоянии войны, ее резервы и техника наверняка почти исчерпаны."
 usa_armor.874.a: "Давайте будем молотом!"
  
 usa_armor.875.t: "Восточное мирное соглашение"
 usa_armor.875.d: "С нашей победой на Востоке пришло время раздела завоеванных земель."
 usa_armor.875.a: "Победа!"
  
 usa_armor.876.t: "США предлагают экономическую помощь"
 usa_armor.876.d: "Конгресс США одобрил план Маршалла по оказанию помощи в восстановлении Европы. Согласно этому плану, США обратились к нам с экономической помощью, чтобы помочь уменьшить нашу экономическую усталость во время войны и восстановить нашу поврежденную экономику. Это также позволит нам быстрее завершить любые строительные проекты. Однако взамен мы должны принять политику свободной торговли, а также начать демилитаризацию и, конечно же, признать доминирование США внутри нашей фракции. В случае принятия плана Маршалла помощь продлится 3 года."
 usa_armor.876.a: "Мы принимаем это столь щедрое предложение!"
 usa_armor.876.b: "Мы восстановимся сами!"
  
 usa_armor.877.t: "[From.GetName] предлагают воссоединить Австрию"
 usa_armor.877.d: ""
 usa_armor.877.a: "Только если они останутся нейтральными"
  
 usa_armor.878.t: "[From.GetName] принимают нейтральное воссоединение"
 usa_armor.878.d: ""
 usa_armor.878.a: "Это будет достаточно хорошо"
  
 usa_armor.879.t: "Меньшее количество накопленного богатства"
 usa_armor.879.d: "После введения налога на накопленное богатство некоторое время назад многие затронутые им люди приняли меры, чтобы уменьшить количество застойного богатства и пустить его в дело. Для нас это означает меньше денег, но мы получим более здоровую экономику"
 usa_armor.879.a: "Мы выполнили свою работу!"
 usa_armor.879_tt: "§GУменьшает§! £consumer_goods_texticon  §Yтовары народного потребления§!, а также §Gулучшает§! £construction_speed_texticon  §Yскорость строительства§! и £resources_texticon  §Yэффективность увеличения ресурсов§! от §Yналога на накопленное богатство§!."
  
 usa_armor.1000.t: "Выборы 1936 года"
 usa_armor.1000.d: "Настал день президентских выборов. Действующий президент Франклин Делано Рузвельт уже реализовал несколько программ, в совокупности называемых "Новым курсом", направленных на то, чтобы вывести США из Великой депрессии.\n\n Несмотря на то, что многие из этих усилий были популярны, его планы по дальнейшему расширению роли и власти правительства были встречены критикой со стороны его оппонента, республиканца Альфа Лэндона. Выходец из нефтяной промышленности, Лэндон хочет видеть большую экономическую свободу, в то время как Рузвельт и Демократическая партия хотят расширить социальное обеспечение и обеспечить экономическую стабильность. Выборы могут пройти с минимальным перевесом или стать крупной победой демократов."
 usa_armor.1000.a: "Конечно, Рузвельт"
 usa_armor.1000.b: "Альф Лэндон — наш выбор"
  
 usa_armor.1001.t: "Выборы 1940 года"
 usa_armor.1001.d: "С тех пор, как впервые была учреждена должность президента Соединённых Штатов, ни один президент не правил три срока подряд. Однако в свете нестабильного состояния мира и международных событий последних нескольких лет президент Рузвельт решил порвать с традицией и баллотироваться на третий срок. Республиканец Венделл Уилки, которого характеризуют как «тёмную лошадку» — промышленника с ограниченным политическим опытом, критиковал как экономический интервенционизм Рузвельта, так и его оправдания баллотирования на третий срок.\n\nХотя кандидаты имеют много общего во внешней политике, и Уилки хочет сохранить некоторую форму Нового курса, многие по-прежнему считают эти выборы определяющим моментом для будущего американской демократии."
 usa_armor.1001.a: "Демократы. Рузвельт незаменим."
 usa_armor.1002.b: "Республиканцы. Нам нужен Уилки!"
  
 usa_armor.1003.t: "Выборы 1944 года"
 usa_armor.1003.d: "Президентство Франклина Д. Рузвельта уже во многих отношениях было исключительным. Несмотря на ухудшающееся здоровье и беспрецедентную продолжительность своего президентства, он стремится и дальше вести нашу страну через войну. Республиканцы были ограничены в выборе кандидатов из-за большого количества потенциальных кандидатов, участвовавших в войне, но выбрали губернатора Томаса Э. Дьюи, чтобы представлять их.\n\nРузвельт по-прежнему пользуется поддержкой народа, но многие подозревают, что он, возможно, не доживет до конца своего срока. Но достаточно ли этого, чтобы обеспечить Дьюи победу над человеком, который завел нас так далеко?"
 usa_armor.1003.a: "Рузвельт побеждает Дьюи."
 usa_armor.1003.b: "Дьюи с небольшим перевесом побеждает Рузвельта."
 
  
 usa_armor.1100.t: "Выборы в Конгресс"
 usa_armor.1100.d: "После завершения очередного избирательного цикла народ высказался, и Конгресс был переформирован в соответствии с его интересами."
 usa_armor.1100.a: "Нам придется с этим работать"
  
 usa_armor.880.t: "Переговоры с Генри Фордом и Уолтером Крайслером"
 usa_armor.880.d: "Генри Форд, владелец Ford Motor Company, и Уолтер Крайслер, владелец Chrysler Corporation, не видят немедленной необходимости в серьезном переоснащении для нужд военной промышленности, поскольку мы живем в мире. Они оба очень возмущены наказанием за Великую депрессию в рамках «Нового курса». На данный момент Ford и Chrysler будут принимать лишь ограниченные государственные заказы и лишь небольшую часть своей промышленной базы переведут на военное производство."
 usa_armor.880.a: "Это начало, я полагаю."
  
 usa_armor.881.t: "Переговоры с Пьером Дюпоном"
 usa_armor.881.d: "Пьер Дюпон, владелец General Motors Company и DuPont, не видит немедленной необходимости в серьезном переоснащении для нужд военной промышленности, поскольку мы живем в мире. Дюпон до сих пор недоволен тем, что правительственные расследования заклеймили его «торговцем смертью». На данный момент General Motors и DuPont будут принимать лишь ограниченные государственные заказы и переведут лишь небольшую часть своей промышленной базы на военное производство."
 usa_armor.881.a: "Это начало, я полагаю."
  
 usa_armor.882.t: "Переговоры с Джоном Морганом-мл."
 usa_armor.882.d: "Джон Пирпонт Морган-мл., владелец банковского конгломерата J.P. Morgan, всегда готов помочь правительству США в виде кредитов. Морган все еще в ярости из-за того, что его обвиняют в великом крахе фондового рынка и начале Великой депрессии, но для него бизнес есть бизнес. В обмен на более благосклонное отношение правительства США к его банку он может предоставить нам несколько очень выгодных вариантов кредита."
 usa_armor.882.a: "Как он сказал, бизнес есть бизнес."
  
 usa_armor.883.t: "Ford Motor Company строит автомобильный комплекс «Толедо»"
 usa_armor.883.d: "Ford построил один из крупнейших заводов в мире, автомобильный комплекс «Толедо», для массового производства джипов и грузовиков в невиданных ранее масштабах. Это позволит должным образом моторизовать армию Соединённых Штатов, а также остальных стран-союзников."
 usa_armor.883.a: "Союзникам нужны наши грузовики!"
  
 usa_armor.884.t: "Chrysler Corporation строит Арсенал Детройт"
 usa_armor.884.d: "Компания Chrysler построила в Детройте крупнейший завод в мире, чтобы массово производить танки в невиданных ранее масштабах. Это позволит произвести более чем достаточно танков для снабжения наших танковых корпусов и наших союзников."
 usa_armor.884.a: "Это хорошо поможет нам!"
  
 usa_armor.885.t: "Ford Motor Company возобновляет работу Уиллоу Ран"
 usa_armor.885.d: "Чтобы поэкспериментировать с производством самолетов до Великой депрессии, Форд построил крупнейший в мире авиастроительный завод Уиллоу Ран. Он был закрыт из-за отсутствия спроса после краха экономики, но если его снова открыть, он станет самым эффективным авиастроительным заводом в мире. Эдсел Форд утверждает, что с конвейера будет сходить по бомбардировщику каждый час."
 usa_armor.885.a: "Вы говорите, по B-24 каждый час?"
  
 usa_armor.886.t: "Полное сотрудничество с Ford Motor Company и Chrysler Corporation"
 usa_armor.886.d: "После начала войны Генри Форд и Уолтер Крайслер решили оставить в стороне свои претензии к правительству США и помочь любым возможным способом добиться победы. Они предлагают помочь построить новые заводы по производству боеприпасов, а также полностью переоборудовать свою производственную базу для производства военной техники, в частности джипов, грузовиков и танков."
 usa_armor.886.a: "Нам понадобится все, что мы можем получить!"
  
 usa_armor.887.t: "Полное сотрудничество с General Motors Company и DuPont"
 usa_armor.887.d: "После начала войны Пьер Дюпон решил забыть свою вражду с правительством США из-за ярлыка «торговца смертью» и вновь оправдать это прозвище, помогая союзникам в войне. Он предлагает, чтобы General Motors помогла в повышении эффективности военного производства, а DuPont Corporation помогла в исследованиях и разработках нового оружия и взрывчатых веществ."
 usa_armor.887.a: "Нам понадобится все, что мы можем получить!"
  
 usa_armor.888.t: "Кредиты от J.P. Morgan & Co."
 usa_armor.888.d: "Ведение войны — одно из самых дорогостоящих действий, которые может сделать правительство. Поскольку правительство США не может полностью оплатить весь счет за спасение мира, вмешался Джон Пирпонт Морган-младший и предложил не только покрыть разницу, но и предложить нам чрезвычайно выгодные кредиты для погашения остальной части. Это сделка, от которой мы не можем отказаться."
 usa_armor.888.a: "Небольшая инфляция еще никому не повредила..."
 usa_armor.888.b: "Я думаю, мы сможем напечатать больше сами!"
  
 usa_armor.889.t: "Ford помогает Kaiser"
 usa_armor.889.d: "Отчаянные времена требуют отчаянных мер. Хотя магия сборочного конвейера Ford Motor Company является коммерческой тайной, мы убедили Форда научить Kaiser-Industries кое-чему о массовом производстве. Благодаря этим новым знаниям Кайзер может производить корабли с невероятной скоростью."
 usa_armor.889.a: "Делиться — значит заботиться!"
  
 usa_armor.891.t: "Ford Motor Company строит «Ричмондский завод»"
 usa_armor.891.d: "Чтобы облегчить массовое производство танков и авиационных двигателей, компания Ford предлагает расширить один из своих крупнейших заводов — завод Ford в Ричмонде, штат Калифорния. Это станет отличным крупным производственным центром на Западном побережье для военных."
 usa_armor.891.a: "Это должно помочь военным усилиям!"
  
 usa_armor.895.t: "Производственный заказ для компаний Ford и Chrysler"
 usa_armor.895.d: "Учитывая возможность войны на горизонте, президент постарался заранее разместить заказ у компаний Ford и Chrysler, чтобы быть лучше оснащенными. Поскольку Форд и Крайслер специализируются в первую очередь на массовом производстве в стиле сборки, лучшими вариантами являются либо бомбардировщики, танки, либо механизированная техника."
 usa_armor.895.a: "Нам нужно 50 000 самолетов!"
 usa_armor.895.b: "Танки выиграют войну!"
 usa_armor.895.c: "Механизированная армия – вот ключ к победе!"
  
 usa_armor.896.t: "Производственный заказ для компаний General Motors и DuPont"
 usa_armor.896.d: "Учитывая возможность войны на горизонте, президент постарался заранее разместить заказ у General Motors и DuPont, чтобы быть лучше оснащенным. Поскольку General Motors и DuPont специализируются в основном на массовом и химическом производстве, лучшими вариантами являются грузовики, истребители или предприятия по производству синтетического каучука."
 usa_armor.896.a: "Нам нужно 200 000 грузовиков!"
 usa_armor.896.b: "Истребители будут нужнее!"
 usa_armor.896.c: "Заводы синтетического сырья крайне необходимы!"
  
 usa_armor.897.t: "Денежно-кредитная политика компании J.P. Morgan"
 usa_armor.897.d: "Учитывая возможность войны на горизонте, президент стремился заранее определить общую денежно-кредитную политику с J.P. Morgan, чтобы быть лучше подготовленным. Поскольку влияние J.P. Morgan очень велико, мы можем либо снизить процентные ставки, либо восстановить веру в систему, либо использовать банковскую систему, чтобы склонить общественность в нашу пользу."
 usa_armor.897.a: "Более низкие ставки означают меньшие расходы!"
 usa_armor.897.b: "Вера в банки необходима!"
 usa_armor.897.c: "Мы должны привлечь общественность на нашу сторону!"
  
 usa_armor.892.t: "[USA.GetName] запрашивают разрешение на бурение нефтяных скважин"
 usa_armor.892.d: "[USA.GetName] убеждены, что они обнаружили большие объемы неиспользованной сырой нефти, лежащей под нашей страной. Хотя у нас еще нет технологии для ее добычи, мы могли бы позволить им найти ее для нас и обложить налогом прибыль. В качестве альтернативы мы могли бы оставить все это себе, но подождать несколько лет, прежде чем пожинать плоды."
 usa_armor.892.a: "Работай умом, а не силой."
 usa_armor.892.b: "Работайте усерднее, а не умнее."
 usa_armor.892.b.tt: "У нас будут возможности потенциально обнаружить нефть к 1943 году, но это потребует значительных инвестиций.\n"
  
 usa_armor.893.t: "Разрешение на бурение получено"
 usa_armor.893.d: "Местные правители Аравийского полуострова предоставили нам разрешение на добычу сырой нефти, и мы добились успеха! Взамен они получат прибыль за счет налогообложения экспорта."
 usa_armor.893.a: "Не зря его называют черным золотом!"
  
 usa_armor.894.t: "В разрешении на бурение отказано"
 usa_armor.894.d: "Местные власти Аравийского полуострова отказали нам в разрешении на добычу сырой нефти. К сожалению, они видят потенциальную прибыль слишком ясно и предпочитают подождать, пока они не смогут получить ее самостоятельно."
 usa_armor.894.a: "Жадные ублюдки..."
  
 USA_congress_info: "Информация о новой системе Конгресса"
 USA_depression_relief: "Спасение от депрессии"
 USA_deal_with_rosevelt_depression_economy: "Рестимулирование экономики"
 USA_waited_out_rosevelt_depression_economy: "Рецессия оттаивает"
 USA_rosevelt_depression_crisis: "Рецессия Рузвельта"
 USA_rosevelt_depression_crisis_desc: "Из-за внезапного сокращения государственных расходов безработица снова растет, а экономика еще больше приходит в упадок. Если мы не примем срочных мер, это может иметь драматические последствия."
 
  
  
  
  
  
  
  
  
  


 