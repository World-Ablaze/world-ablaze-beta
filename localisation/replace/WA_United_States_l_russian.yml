 USA_agricultural_adjustment_act_1: "Первый Закон о регулировании сельского хозяйства"
 USA_agricultural_adjustment_act_1_desc: "Первый закон о регулировании сельского хозяйства, призванный повысить цены на продукты питания, представлял собой систему, в которой федеральное правительство платило фермерам за сельскохозяйственную продукцию только для того, чтобы избавиться от нее, снижая излишки и повышая цены, а также платя фермерам за то, чтобы они не сажали сельскохозяйственные культуры, и финансировало это через налог на производителей продуктов питания."
  
 USA_agricultural_adjustment_act_2: "Второй Закон о регулировании сельского хозяйства"
 USA_agricultural_adjustment_act_2_desc: "Второй закон о регулировании сельского хозяйства содержал большинство положений первого, за исключением того, что он не будет финансироваться за счет налога на производителей, чтобы соответствовать делу США против Батлера."
  
