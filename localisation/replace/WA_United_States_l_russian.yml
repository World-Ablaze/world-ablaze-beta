 USA_wpa_idea: "Управление промышленно-строительными работами общественного назначения"
 USA_wpa_idea_desc: " Управление промышленно-строительными работами общественного назначения (WPA) — независимое федеральное агентство, созданное в США в 1935 году по инициативе президента США, Франклина Делано Рузвельта, и ставшее ведущей силой в системе трудоустройства миллионов безработных (в основном, неквалифицированных мужчин) при проведении Нового экономического курса. Под общественно-значимыми работами подразумевались возведение общественных зданий, прокладка автодорог, строительство стадионов, дамб, аэродромов."
  
