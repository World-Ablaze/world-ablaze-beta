 USA_iranian_corridor: "Построить Персидский коридор"
 USA_iranian_corridor_desc: "Текущие маршруты ленд-лиза неэффективны круглый год из-за расстояния, погодных условий и т.д. Создание надежного и оптимизированного логистического пути к сердцу [SOV.GetNameRuGen] — единственный способ гарантировать, что достаточный объем ленд-лиза прибудет вовремя."
