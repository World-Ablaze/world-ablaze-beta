 USA_maritime_commission_desc: ""
  
 USA_naval_act: "Морской закон"
 USA_naval_act_desc: "Если война когда-либо перерастет в глобальный масштаб, величайшим преимуществом Соединённых Штатов будет наш контроль над обширными территориями океана, отделяющими нас от конфликта. Мы должны гарантировать, что американские воды всегда будут в безопасности."
  
 USA_second_vinson_act: "Второй закон Винсона"
 USA_second_vinson_act_desc: ""
  
 USA_FY40_plan: "План на 40-й финансовый год"
 USA_FY40_plan_desc: "План на 40-й финансовый год представляет собой план кораблестроения военно-морского флота по борьбе с зарубежными угрозами до войны по состоянию на 1940 год. План предусматривал строительство 11 авианосцев, 9 линкоров, 6 тяжелых крейсеров, 57 легких крейсеров, 95 эсминцев и 73 крейсерских подводных лодок. Хотя планировалось построить значительное количество авианосцев, основным средством проецирования мощи на таких театрах военных действий, как Тихий океан, по-прежнему считается линкор."
  
 USA_general_plan: "Генеральный план"
 USA_general_plan_desc: "Генеральный план является альтернативой планам 40 и 42 финансового года, в которых основное внимание уделялось большому количеству крупных кораблей с упором на линкоры и авианосцы соответственно. Генеральный план допускает более гибкий и разнообразный состав флота, если ни один крупный заказ не приемлем."
  
 USA_FY42_plan: "План на 42-й финансовый год"
 USA_FY42_plan_desc: "План 42-го финансового года - это план кораблестроения ВМФ на 1942 год. План включал 20 авианосцев, 50 легких авианосцев, 17 тяжелых крейсеров, 18 легких крейсеров, 400 эсминцев и фрегатов и 127 крейсерских подводных лодок. В отличие от плана 40-го финансового года, новые линкоры не заказывались, и вместо этого основным инструментом проецирования сил стали авианосцы. Кроме того, гораздо больший упор делается на строительство кораблей сопровождения."
  
