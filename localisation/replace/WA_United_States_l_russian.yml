 STRATEGIC_REGION_pacific: "Тихоокеанский контроль"
 STRATEGIC_REGION_pacific_desc: "Тихий океан жизненно важен для безопасности нашей родной территории.\n\nКонтроль необходимо сохранить, и в случае войны мы не можем позволить себе §Rпотерять§! наши владения здесь, иначе наше население начнет чувствовать угрозу. Усиление контроля над Тихим океаном позволит нам утвердить §Yбольшее господство§! над другими великими державами.\n\n§Y[USA.GetFlag][USA.GetAdjectiveCap]ий§! контроль Тихого океана: [ROOT.GetUSApacificcontrol] ([?USA_pacific_control|Y0])\n\n§Y[JAP.GetFlag][JAP.GetAdjectiveCap]ий§! контроль Тихого океана: [ROOT.GetJAPpacificcontrol] ([?JAP_pacific_control|Y0])\n\n§Y[ENG.GetFlag][ENG.GetAdjectiveCap]ий§! контроль Тихого океана: [ROOT.GetENGpacificcontrol] ([?ENG_pacific_control|Y0])\n\n§Y[AST.GetFlag][AST.GetAdjectiveCap]ий§! контроль Тихого океана: [ROOT.GetASTpacificcontrol] ([?AST_pacific_control|Y0])"

 
 USA_power_projection:0 "Демонстрация силы в Тихом океане"
 USA_power_projection_desc:0 "Мы должны передислоцировать штаб Тихоокеанского флота в Перл-Харбор, Гавайи, чтобы усилить нашу демонстрацию силы в Тихом океане. Без этого введение эмбарго против [JAP.GetNameRuPrep] невозможно.\n\nРазместите в Перл-Харборе, Гавайи, Тихоокеанский флот, состоящий как минимум из §Y8 линкоров§!, §Y8 крейсеров§! и §Y30 эсминцев§!, чтобы бросить вызов японским провокациям."
 USA_power_projection_tt:0 "§RМы не сможем ввести эмбарго против [JAP.GetNameRuPrep]...§!"
 USA_power_projection_fail:0 "Демонстрация силы в Тихом океане"
 USA_embargo_japan_tt:0 "Тихоокеанский флот на §YГавайях§! должен иметь §Y8 крупных кораблей§! и §Y38 кораблей сопровождения§!, чтобы демонстрировать силу в Тихом океане. Фокус §Y$USA_focus_on_asia$§! запустит ограниченное по времени задание. Если это задание уже провалено, вы упустили возможность."
 USA_embargo_japan_tt2:0 "Любая страна в сфере влияния §Y[USA.GetNameRuGen]§! введет §Rэмбарго§! против §Y[JAP.GetNameRuDat]§! и всех стран в их сфере влияния."
  
 
