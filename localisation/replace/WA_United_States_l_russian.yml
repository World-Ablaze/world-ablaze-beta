 USA_office_of_war_information: "Управление военной информации"
 USA_office_of_war_information_desc: ""
  
 USA_framework_for_the_united_nations: "Основы Организации Объединенных Наций"
 USA_framework_for_the_united_nations_desc: ""
  
 USA_morgenthau_plan: "«План Моргентау»"
 USA_morgenthau_plan_desc: "Министр финансов Генри Моргентау разработал план по устранению любой возможности Германии вести войну путем устранения всех ее промышленных мощностей. Несмотря на радикальность, смягченная версия его плана может быть реализована, чтобы ограничить военную мощь Германии."
  
 USA_marshall_plan: "«План Маршалла»"
 USA_marshall_plan_desc: "Истинная свобода личности не может существовать без экономической безопасности и независимости. Люди, которые голодны и не имеют работы, — это материал, из которого создаются диктатуры."
 USA_marshall_plan_tt: "Разблокировать §Yрешения по плану Маршалла§!, чтобы оказать экономическую помощь союзникам по Альянсу."
  
 USA_future_of_germany: "Будущее Германии"
 USA_future_of_germany_desc: "Германия была разобрана и демилитаризована. Разговоры об объединении Западной Германии в единое государство ходят уже давно. Демократическую Германию необходимо провести через пепел, чтобы предотвратить повторение трагедии Версаля."
  
 USA_future_of_austria: "Будущее Австрии"
 USA_future_of_austria_desc: "Австрию будут считать первой страной, подвергшейся вторжению со стороны Германии, а не соучастником войны. Она не будет разделена так же, как ее братская страна."
  
 USA_future_of_japan: "Будущее Японии"
 USA_future_of_japan_desc: "Наша оккупация Японии может развалиться при малейшей ошибке. Мы решили оставить императора Хирохито на императорском троне из-за преданности, которую ему хранит его народ. Макартур будет возглавлять переходное демократическое правительство до тех пор, пока страна не стабилизируется."
  
 USA_set_up_democratic_korea: "Создание демократической Кореи"
 USA_set_up_democratic_korea_desc: "Наша война с Японией привела к тому, что мы приобрели регион на Корейском полуострове. Зажатая между Советским Союзом, формирующимся коммунистическим Китаем и оккупированной Японией, Корея будет служить отличным буферным государством против коммунистов."
  
 USA_appoint_george_marshall: "Назначить Джорджа Маршалла"
 USA_appoint_george_marshall_desc: ""
  
