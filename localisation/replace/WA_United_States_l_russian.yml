 USA_found_the_nsa: "Создать АНБ"
 USA_found_the_nsa_desc: "National Security Agency (Агентство национальной безопасности) - разведывательное агентство США, отвечающее за глобальный мониторинг, сбор и обработку информации и данных в целях внешней и внутренней разведки и контрразведки. Агентство входит в состав Министерства обороны США, его штаб-квартира находится в Форт-Миде, штат Мэриленд. АНБ отвечает за разработку криптографических систем для защиты правительственных коммуникаций и информационных систем США. Агентство было вовлечено в многочисленные противоречия, в том числе в программы внутренней слежки, которые являются предметом постоянных споров и критики. АНБ также обвиняют во взломе компьютерных систем иностранных правительств и промышленном шпионаже. Несмотря на эти противоречия, АНБ продолжает играть важную роль в защите США и их союзников от иностранных угроз."
  
 USA_focus_on_the_support: "Сосредоточиться на ротах поддержки"
 USA_focus_on_the_support_desc: ""
  
 USA_expand_the_USACE: "Расширить USACE"
 USA_expand_the_USACE_desc: ""
  
