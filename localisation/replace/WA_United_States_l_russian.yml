 USA_keep_the_army_air_corps: "Сохранить Воздушный корпус армии"
 USA_keep_the_army_air_corps_desc: ""
  
 USA_strategic_operations: "Стратегические операции"
 USA_strategic_operations_desc: ""
  
 USA_carpet_bombing: "Ковровая бомбардировка"
 USA_carpet_bombing_desc: "Ковровая бомбардировка, также известная как «бомбардировка насыщения», предназначена для разрушения целых участков земли. Наши стратегические бомбардировщики затмят солнце в небе наших врагов. Они не будут знать ни безопасности, ни мира."
  
 USA_development_of_napalm: "Разработка напалма"
 USA_development_of_napalm_desc: "Первоначально напалм был разработан командой химиков Луи Физера для Службы химического оружия США в 1942 году в секретной лаборатории Гарвардского университета. Представляет собой зажигательную смесь гелеобразователя и летучего нефтехимического вещества (обычно бензина или дизельного топлива)."
  
