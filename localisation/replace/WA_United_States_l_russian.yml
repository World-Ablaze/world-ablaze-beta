 USA_marine_seabees: "Морская пехота"
 USA_marine_seabees_desc: "Строительные батальоны ВМФ, или более известные как гетерографы «Сиби» из «CB», изначально были задуманы как замена гражданским подрядчикам в зонах боевых действий после Перл-Харбора. Эти люди специализировались на строительстве любых типов зданий на передовой или в зонах боевых действий для военно-морского флота, особенно для морской пехоты. Их считают «самым большим вкладом, который ВМФ внес в Корпус морской пехоты во время Второй мировой войны»."
  
 USA_special_forces: "Спецназ [USA.GetNameRuGen]"
 USA_special_forces_desc: "Традиционные методы ведения войны не всегда эффективны против противника, укрывающегося в глубоком тылу или на труднодоступных островах Тихого океана. Мы начинаем подготовку элитных групп, обученных диверсиям, скрытному проникновению и ведению партизанской войны. Эти бойцы станут нашими «глазами и ушами» за линией фронта, способными дезорганизовать логистику врага и подготовить почву для высадки основных сил."
  
