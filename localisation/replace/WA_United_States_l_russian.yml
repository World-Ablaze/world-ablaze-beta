 USA_heavy_tank_doctrine: "Доктрина тяжёлых танков"
 USA_heavy_tank_doctrine_desc: "Кажется странным, что, будучи самой промышленно развитой страной в мире, мы не имеем возможности использовать самые большие танки. Зачем стремиться к количеству, а не к качеству, если мы можем просто иметь и то, и другое?"
  
 USA_invest_in_the_rock_island_arsenal: "Инвестировать в арсенал Рок-Айленда"
 USA_invest_in_the_rock_island_arsenal_desc: ""
  
 USA_the_future_of_artillery: "Будущее артиллерии"
