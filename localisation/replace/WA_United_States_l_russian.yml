 USA_perfection_of_the_fighter_desc: ""
  
 USA_the_tuskegee_airmen: "Летчики Таскиги"
 USA_the_tuskegee_airmen_desc: "Единственными полностью черными авиационными подразделениями ВВС США, которые участвовали в боях во время войны, были 332-я истребительная группа «Красные хвосты» и 99-я эскадрилья преследования «Летчики Таскиги». Начав со скромного начала на небольшой авиабазе в Таскиги, штат Алабама, эти эскадрильи в конечном итоге зарекомендовали себя как одни из лучших эскадрилий ВВС США, сражавшихся во время Второй мировой войны."
 USA_the_tuskegee_airmen_tt: "§Y332-я истребительная группа «Красные хвосты»§! и §Y99-я эскадрилья преследования «Летчики Таскиги»§! станут активными в Вашингтоне, округ Колумбия."
  
