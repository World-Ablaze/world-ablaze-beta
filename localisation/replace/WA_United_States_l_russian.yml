 USA_influence_tt: "Когда каждая из следующих стран достигнет более §G99% поддержки§! §Yдемократии§!, войдет в Альянс с нами и одновременно НЕ будет являться марионеткой другой державы, §Gоткроются§! §Yрешения об эксплуатации§!, что усилит §Yнаше влияние§!, как только будет завершен фокус «§Y$USA_uncle_sam_knows_best$§!».\n"
  
 USA_cohort_system: "СБГПА"
 USA_cohort_system_desc: "US Army's Cohesion Operational Readiness and Training System (Система боевой готовности и подготовки армии США), также известная как система СБГПА, представляет собой усовершенствованную систему, заменяющую систему индивидуальной замены при пополнении личного состава подразделений, особенно в условиях активного развертывания. Этот метод уделяет больше внимания сплоченности и товариществу солдат с целью поддержания более высокой боевой готовности подразделений."
  
 USA_revenue_act_I: "Закон о доходах I"
 USA_revenue_act_I_desc: "Великая депрессия требует решительных мер. Этот закон закладывает фундамент для восстановления национальной экономики, постепенно упорядочивая систему налогообложения и обеспечивая приток необходимых средств в бюджет для первых государственных инициатив."
  
 USA_revenue_act_II: "Закон о доходах II"
 USA_revenue_act_II_desc: "Экономика начинает подавать признаки жизни. Второй этап фискальных реформ направлен на увеличение собираемости налогов с корпораций и обеспеченных слоев населения. Эти средства позволят правительству расширить социальные программы и запустить первые инфраструктурные проекты."
  
 USA_revenue_act_III: "Закон о доходах III"
 USA_revenue_act_III_desc: "Наше финансовое положение становится стабильнее, но перед лицом растущей мировой угрозы этого недостаточно. Третий закон о доходах радикально повышает налоговое бремя, создавая мощный финансовый резерв, который станет топливом для грядущего наращивания производственных мощностей."
  
 USA_war_revenue_act: "Закон о военных доходах"
 USA_war_revenue_act_desc: "Мир стоит на пороге катастрофы. Пришло время перевести экономику на рельсы тотальной готовности. Этот закон вводит чрезвычайные военные налоги и направляет каждый свободный доллар в казну, позволяя нам развернуть беспрецедентную программу перевооружения и стать подлинным «Арсеналом демократии»."
  
 USA_robinson_patman_act: "Закон Робинсона-Патмана"
 USA_robinson_patman_act_desc: "Закон Робинсона-Патмана — это закон о борьбе с ценовой дискриминацией, призванный запретить поставщикам продавать продукцию на разные рынки по разным ценам в целях дальнейшей борьбы с трастами."
  
 USA_walsh_healey_public_contracts_act: "Закон о государственных контрактах Уолша-Хили"
 USA_walsh_healey_public_contracts_act_desc: "Мы должны гарантировать, что компании, получающие заказы от федерального правительства, придерживаются достойных стандартов оплаты труда и условий работы. Установление минимальных требований для подрядчиков укрепит стабильность на производстве перед лицом грядущих военных заказов."
  
 USA_miller_tydings_act: "Закон Миллера-Тайдингса"
 USA_miller_tydings_act_desc: "Для стабилизации рыночных цен и защиты честной конкуренции необходимо узаконить соглашения о поддержании цен между производителями и розничными торговцами. Это позволит избежать демпинга и укрепить доверие бизнеса к долгосрочному планированию."
  
 USA_robinson_patman_act_tt: "$USA_modify_gd_ns_intro_tt$ $USA_decrease_consumer_goods_1_tt$ $USA_increase_factory_output_5_tt$\n"
  
 USA_bankruptcy_act: "Закон о банкротстве"
 USA_bankruptcy_act_desc: "Последствия Великой депрессии до сих пор отравляют нашу финансовую систему. Масштабная реформа процедур банкротства позволит очистить экономику от нежизнеспособных активов и даст честным предпринимателям шанс на перерождение, стимулируя деловую активность."
 USA_bankruptcy_act_tt: "$USA_modify_gd_ns_intro_tt$ $USA_decrease_consumer_goods_1_tt$ $USA_decrease_political_power_cost_1_tt$\n"
  
 USA_investment_company_act: "Закон об инвестиционных компаниях"
 USA_investment_company_act_desc: "Хаос на фондовых рынках остался в прошлом, но доверие инвесторов все еще хрупко. Этот акт вводит строгий надзор над инвестиционными фондами, гарантируя прозрачность операций и защиту капитала граждан, что жизненно важно для мобилизации частных средств на нужды промышленности."
  
 USA_investment_advisors_act: "Инвестиционные консультанты"
 USA_investment_advisors_act_desc: "Профессионализация управления капиталом является ключом к эффективному распределению ресурсов. Регулируя деятельность финансовых советников, мы создаем надежный механизм перенаправления инвестиций в ключевые отрасли, необходимые для модернизации нашей индустриальной базы."
  
 USA_flood_control_act_I: "Закон о борьбе с наводнениями I"
 USA_flood_control_act_I_desc: "Разливы рек — это не только природное бедствие, но и удар по экономике. Первый этап программы предусматривает начало строительства системы дамб и заградительных сооружений в наиболее уязвимых регионах, что позволит минимизировать потери урожая и защитить жилой сектор."
  
 USA_flood_control_act_II: "Закон о борьбе с наводнениями II"
 USA_flood_control_act_II_desc: "Наши усилия начинают приносить плоды, но размах проблемы требует большего. Второй закон расширяет масштабы инженерных работ: мы приступаем к спрямлению русел рек и строительству насосных станций, создавая тысячи новых рабочих мест для граждан, отчаянно нуждающихся в доходе."
  
 USA_flood_control_act_III: "Закон о борьбе с наводнениями III"
 USA_flood_control_act_III_desc: "Комплексный подход — залог успеха. Этот этап фокусируется на интеграции гидротехнических сооружений с энергетической системой страны. Строительство плотин теперь сопровождается установкой турбин, превращая угрозу наводнений в источник дешевой электроэнергии для растущей индустрии."
  
 USA_flood_control_act_IV: "Закон о борьбе с наводнениями IV"
 USA_flood_control_act_IV_desc: "Создание национальной водной инфраструктуры выходит на федеральный уровень. Мы объединяем разрозненные инженерные проекты в единую систему управления речными бассейнами. Это позволит не только предотвращать катастрофы, но и сделает внутренние водные пути надежной транспортной артерией для снабжения армии и заводов."
  
 USA_flood_control_act_V: "Закон о борьбе с наводнениями V"
 USA_flood_control_act_V_desc: "Природа поставлена под контроль правительства. Завершение масштабных работ по всему континенту гарантирует безопасность наших промышленных центров и транспортных узлов от любых природных сюрпризов. Инвестиции в ландшафт обернулись фундаментом для долгосрочной экономической стабильности и военной устойчивости нации."
  
 USA_continue_spending_programs: "Продолжение программ расходов"
 USA_continue_spending_programs_desc: "Бюджетные обязательства не должны прерываться из-за бюрократических проволочек. Продление финансирования критически важных инфраструктурных и социальных проектов позволит правительству сохранять контроль над темпами восстановления страны и поддерживать спрос в экономике без потрясений."
  
 USA_hatch_act: "Закон Хэтча"
 USA_hatch_act_desc: "Чтобы искоренить коррупцию в правительстве, Закон Хэтча запрещает запугивание или подкуп избирателей и ограничивает политическую предвыборную деятельность федеральных служащих. Он запрещает использование любых государственных средств, предназначенных для оказания помощи или общественных работ, в избирательных целях, а также запрещает должностным лицам, получающим зарплату из федеральных средств, использовать обещания рабочих мест, продвижения по службе, финансовой помощи, контрактов или любых других льгот для принуждения к пожертвованиям на избирательную кампанию или политической поддержке."
  
 USA_reorganization_act: "Закон о реорганизации"
 USA_reorganization_act_desc: "Закон о реорганизации предложен президентом, чтобы дать ему право провести масштабную реорганизацию исполнительной власти. Его предполагаемые изменения включают создание новых департаментов, реструктуризацию существующих и включение большего количества частей федерального правительства под прямой контроль президента."
  
 USA_monetarist_economics: "Монетаристская экономика"
 USA_monetarist_economics_desc: "Монетаристская экономика – это школа экономической мысли, которая прямо противостоит кейнсианской экономике. Вместо того, чтобы бороться с экономическим спадом с помощью налогово-бюджетной политики (больших государственных расходов), монетаристы призывают правительство контролировать количество денег в обращении посредством количественного ужесточения."
  
 USA_rural_electrification_act: "Управление сельской электрификации"
 USA_rural_electrification_act_desc: "Учитывая, что на Великих равнинах нарастает «Пыльный котел», а бедные фермеры страдают в сельских районах, необходимы инвестиции в эти районы. Управление сельской электрификации должно приступить к реализации амбициозного плана по электрификации сельской местности, что считается непрактичным и дорогостоящим."
  
 USA_wagner_steagall_act: "Закон Вагнера-Стигола"
 USA_wagner_steagall_act_desc: "Закон о жилье, или Закон Вагнера-Стигола, будет основываться на предыдущих программах помощи, таких как Национальный жилищный закон 1934 года, чтобы облегчить финансирование и строительство домов для бедных семей."
  
 USA_national_housing_act_amendments: "Поправки к национальному жилищному закону"
 USA_national_housing_act_amendments_desc: ""
  
 USA_WPA_roads: "Расширить сельские дороги"
 USA_WPA_roads_desc: "Используя ресурсы АОР и в целях оказания помощи Сельскому управлению электрификации, мы создадим сеть сельских дорог, чтобы сделать транспортировку урожая и материалов через сельские районы более эффективной."
  
 USA_federal_works_agency: "Федеральное агентство работ"
 USA_federal_works_agency_desc: "Federal Works Agency (Федеральное агентство работ) объединит несколько строительных программ, в первую очередь АОР, в единую администрацию, чтобы упростить планирование и управление строительством, а также открыть больше возможностей для межпрограммного сотрудничества."
  
 USA_expand_tva: "Расширить АДТ"
 USA_expand_tva_desc: "Tennessee Valley Authority (Администрация долины реки Теннесси) уже доказала жизнеспособность коммунальных компаний, находящихся в федеральной собственности. Дальнейшие инвестиции в эту корпорацию принесут пользу регионам долины Теннесси, которые особенно сильно пострадали от Великой депрессии."
  
 USA_tva_ford_cooperation: "Сотрудничество Генри Форда с АДТ"
 USA_tva_ford_cooperation_desc: "Хотя Форду было отказано в возможности построить энергетическую компанию для обслуживания долины Теннесси, его капитал и инженерный опыт могли бы оказаться полезными. В условиях, когда федеральный бюджет раздувается, а АДТ накапливает долги, частная промышленность может помочь, даже если это даст промышленным титанам больше власти."
  
 USA_progress_the_wpa: "Продолжить АОР"
 USA_progress_the_wpa_desc: "Нам следует продолжить АОР и сосредоточиться на общественных парках, общественных зданиях, коммунальных услугах, аэропортах и транспорте. Также следует создать Федеральный проект писателей."
  
 USA_invest_in_junior_colleges: "Инвестировать в младшие колледжи"
 USA_invest_in_junior_colleges_desc: "Закон Смита-Хьюза 1917 г. оказал большое влияние на предоставление профессионального образования и подготовку студентов к специализированной работе. Увеличивая финансирование этих программ через младшие колледжи, мы можем еще больше привлечь людей из низших классов к высокооплачиваемой и квалифицированной работе."
  
 USA_soil_conservation_and_domestic_allotment_act: "Закон об охране почв и внутреннем распределении"
 USA_soil_conservation_and_domestic_allotment_act_desc: "Закон об охране почв и внутреннем распределении позволяет федеральному правительству платить фермерам за сокращение сельскохозяйственного производства, чтобы сохранить почву и предотвратить эрозию. Годы ведения сельского хозяйства без севооборотов и сезонов отдыха привели к значительным явлениям эрозии, таким как «Пыльный котел»."
  
 USA_bankhead_jones_farm_tenant_act: "Закон об арендаторах ферм Бэнкхеда-Джонса"
 USA_bankhead_jones_farm_tenant_act_desc: "Закон об арендаторах ферм Бэнкхеда-Джонса позволяет федеральному правительству приобретать землю для восстановления после эрозии. Кроме того, он предусматривает программу кредитования, чтобы помочь фермерам-арендаторам приобрести собственную землю."
  
 USA_second_agricultural_adjustment_act: "Второй Закон о регулировании сельского хозяйства"
 USA_second_agricultural_adjustment_act_desc: "Чтобы продолжить план Рузвельта по оказанию помощи фермерам и выполнить решение по делу «США против Батлера», Второй закон о регулировании сельского хозяйства будет финансироваться из государственного бюджета вместо налогов на переработчиков."
  
 USA_judicial_reform: "Законопроект о реформе судебных процедур"
 USA_judicial_reform_desc: "Поскольку консервативный Верховный суд отменяет жизненно важные программы «Нового курса», необходимо принять меры для защиты американского народа и оказания помощи двум другим ветвям власти. Приступив к реализации амбициозного плана «Упаковка суда», мы можем получить контроль над судом, чтобы обеспечить безопасность наших программ."
  
 USA_price_control_act: "Федеральный закон о справедливом ценообразовании"
 USA_price_control_act_desc: "Вместо того, чтобы использовать косвенный подход к контролю над рынком, мы можем устанавливать прямые цены на товары, чтобы лучше удовлетворять потребности фермеров и избегать ненужной траты материалов."
  
 USA_accumulated_wealth_tax: "Налог на накопленное богатство"
 USA_accumulated_wealth_tax_desc: "Чтобы финансировать программы «Нового курса», богатые должны платить свою долю американскому народу, чтобы поддержать его. Для этого будет введен налог на состояния, превышающие 500 000 долларов, чтобы предотвратить огромное накопление неиспользуемого богатства."
  
 USA_worker_autonomy_act: "Закон об автономии работников"
 USA_worker_autonomy_act_desc: "Чтобы лучше представлять американский народ, на фабриках будут установлены определенные ограничения на регулирование поведения работников, в первую очередь запрет препятствовать вступлению рабочих в профсоюзы."
  
 USA_suspend_the_persecution: "Приостановить преследование"
 USA_suspend_the_persecution_desc: ""
  
 USA_foreign_agents_registration_act: "Закон о регистрации иностранных агентов"
 USA_foreign_agents_registration_act_desc: "Закон о регистрации иностранных агентов налагает обязательства по публичному раскрытию информации на «иностранных агентов», в том числе на любых физических и юридических лиц, занимающихся внутренним лоббированием или защитой интересов иностранных организаций. Они должны зарегистрироваться в Министерстве юстиции, чтобы раскрыть свои отношения, деятельность и финансы."
  
 USA_alien_registration_act: "Закон о регистрации иностранцев"
 USA_alien_registration_act_desc: "Закон о регистрации иностранцев требует, чтобы все взрослые неграждане, проживающие на территории Соединённых Штатов, зарегистрировались в федеральном правительстве. Он также вводит более суровые наказания за подрывную деятельность, например, за пропаганду насильственного свержения правительства США."
  
 USA_nationality_act: "Закон о гражданстве"
 USA_nationality_act_desc: "Закон о гражданстве обновил существующий кодекс гражданства США. Процесс натурализации упрощен, и это первый в истории акт, унифицирующий все иммиграционные кодексы США."
  
 USA_fair_labor_standards_act: "Закон о справедливых трудовых стандартах"
 USA_fair_labor_standards_act_desc: "Чтобы защитить права работников, а также предотвратить отношения эксплуатации, работники должны иметь четкие права, в первую очередь минимальную заработную плату."
  
 USA_anti_union_legislation: "Антипрофсоюзное законодательство"
 USA_anti_union_legislation_desc: "После сидячей забастовки во Флинте стало очевидно, что профсоюзы не только неамериканские и коммунистические по своей природе, но и препятствуют нашему выходу из Великой депрессии. Им необходимо запретить мешать сотрудникам работать и вести бизнес."
  
 USA_nlrb_reorganization: "Реорганизация NLRB"
 USA_nlrb_reorganization_desc: "National Labor Relations Board (Национальное управление по трудовым отношениям) является одной из центральных организаций «Нового курса». Однако ее конституционность продолжает подвергаться сомнению по мере расширения ее размеров и влияния. Реорганизация поможет удовлетворить критиков, уменьшив вероятность коррупции."
  
 USA_dissolve_the_nlrb: "Распустить NLRB"
 USA_dissolve_the_nlrb_desc: "National Labor Relations Board (Национальное управление по трудовым отношениям) является одной из центральных организаций «Нового курса». Однако его размер и влияние расширяются, поскольку их не контролируют. В конечном итоге роспуск этой организации помешает федеральному правительству оказывать неправомерное влияние на экономику."
  
 USA_union_prerogative: "Прерогатива профсоюзов"
 USA_union_prerogative_desc: "Во время великой забастовки профсоюза шахтеров в 1943 году президент попытался связаться с главой профсоюза для переговоров. Несмотря на его отказ, важно сохранить статус профсоюзов и не допустить вмешательства федерального правительства в трудовые дела частного сектора."
  
 USA_smith_connally_war_labor_disputes_act: "Закон о военных трудовых спорах"
 USA_smith_connally_war_labor_disputes_act_desc: "Во время великой забастовки профсоюза шахтеров в 1943 году президент попытался связаться с главой профсоюза для переговоров. Из-за его отказа может быть принят этот закон, который позволит федеральному правительству вмешаться и обеспечить выполнение работ, если возникнет чрезвычайная ситуация в области национальной безопасности."
  
 USA_civil_aeronautics_act: "Гражданская авиация"
 USA_civil_aeronautics_act_desc: "Закон о гражданской авиации является первым важным шагом в регулировании нового авиационного сектора. Из-за большого количества авиационных происшествий и отсутствия надлежащей подготовки в этом законе особое внимание уделяется безопасным и эффективным урокам пилотирования."
  
 USA_educational_orders: "Заказы на обучение"
 USA_educational_orders_desc: "Поскольку наша военная промышленность пришла в упадок из-за сокращения бюджета и отсутствия войны, вместо этого необходимо задействовать наше положение крупнейшей в мире гражданской промышленной базы. Если разместить небольшие заказы на военную технику у частных компаний, они научатся производить её эффективнее, одновременно восполняя дефицит нашего снаряжения."
 USA_educational_orders_tt: "\nОткрывает §Hрешения на заказы учебного вооружения§! для покупки снаряжения в мирное время."
  
 USA_strategic_and_critical_materials_stock_piling_act: "Закон о создании запасов стратегических и критически важных материалов"
 USA_strategic_and_critical_materials_stock_piling_act_desc: "Закон о запасах стратегических и критически важных материалов делает упор на основные материалы, необходимые экономике США, которые могут быть недоступны во время войны. Заблаговременное накопление запасов может смягчить эту неизбежную нехватку ресурсов."
  
 USA_work_with_american_industry: "Работа с американской промышленностью"
 USA_work_with_american_industry_desc: "Масштаб наших амбиций требует безупречной координации между государственным сектором и частными промышленными гигантами. Мы должны создать прямые каналы связи между Вашингтоном и советами директоров крупнейших корпораций страны. Наша задача — не просто заключать контракты, а полностью синхронизировать производственные циклы с государственными оборонными планами. Устраняя бюрократические барьеры и стимулируя частную инициативу, мы обеспечим бесперебойный поток стали, станков и техники, который превратит наши заводы в неиссякаемый источник силы для «Арсенала демократии»."
  
 USA_renew_the_neutrality_act: "Продлить закон о нейтралитете 1935 года"
 USA_renew_the_neutrality_act_desc: "Учитывая рост напряженности в Европе и Азии, а также сильную историю изоляционизма, кажется естественным, что США продолжат свой путь к невмешательству, при этом обе стороны поддерживают эти меры."
  
 USA_rainbow_war_plans: "Военные планы «Радуга»"
 USA_rainbow_war_plans_desc: "Необходимо множество планов действий на случай непредвиденных обстоятельств, чтобы Соединённые Штаты были готовы противостоять любой потенциальной внешней угрозе. Даже нынешние союзники могут восстать против нас, поэтому важно, чтобы все случаи были рассмотрены. Эти военные планы имеют цветовую маркировку, соответствующую различным потенциальным врагам."
  
 USA_victory_at_all_costs: "Победа любой ценой"
 USA_victory_at_all_costs_desc: "Похоже, кто-то вламывается! Господа, в такие моменты наша способность нанести ответный удар должна и обязана быть огромной, чтобы сдерживать все формы агрессии. Не молитесь о легкой жизни, друзья мои, молитесь о том, чтобы стать сильнее."
 USA_victory_at_all_costs_tt: "Будут открыты решения: §YЭвакуация промышленности§!."
  
 USA_behind_every_blade_of_grass: "За каждой травинкой"
 USA_behind_every_blade_of_grass_desc: "Вторая поправка вооружила наше население настолько, что в руках американских граждан находится больше огнестрельного оружия, чем у армий всех стран мира вместе взятых. Крупные партизанские операции должны нанести урон вторгшемуся врагу."
  
 USA_reinforce_monroe_doctrine_tt: "§GУвеличивает§! £trade_deal_opinion_texticon  §Yмнение на торговые сделки§! со всеми американскими странами.\n"
  
 USA_bureau_of_ships_desc: "Мы объединим «Бюро строительств и ремонта» и «Инженерное бюро» в одну организацию для наблюдения за будущими военно-морскими разработками. А пока мы этим занимаемся, возможно, пришло время расследовать слухи о неэффективной работе торпед, которые Управление артиллерийских вооружений так яростно отрицает."
  
 USA_the_good_neighbor_policy: "Политика добрососедства"
 USA_the_good_neighbor_policy_desc: "Политика добрососедства, также известная как Конференция в Буэнос-Айресе, представляет собой встречу на высоком уровне между Соединенными Штатами и главами правительств всех других стран Западного полушария. В числе важных условий были обещания решать все споры мирным путем, воздерживаться от вмешательства во внутренние дела других стран и отказываться признавать захваченные территории."
  
 USA_south_american_rubber_investments: "Южноамериканские инвестиции в каучук"
 USA_south_american_rubber_investments_desc: "Влажный и тропический климат Южной Америки делает ее идеальным местом для выращивания каучука. Из-за потенциальной потери большей части мировых поставок натурального каучука в Азии это пригодится во время войны."
  
 USA_south_american_steel_investments: "Южноамериканские инвестиции в сталь"
 USA_south_american_steel_investments_desc: "Хотя Соединённые Штаты производят большую часть стали в мире, нельзя отрицать, что более дешевая рабочая сила и затраты в Южной Америке делают ее идеальным местом для расширения сталелитейной промышленности."
  
 USA_western_hemisphere_interventionism: "Интервенционизм в Западном полушарии"
 USA_western_hemisphere_interventionism_desc: "Хотя другие страны Западного полушария являются суверенными государствами, они по-прежнему остаются потенциальной угрозой безопасности. Кроме того, они располагают огромным количеством неиспользованных ресурсов и богатств. Мы можем убить двух зайцев одним выстрелом, гарантируя, что они будут соблюдать... демократические стандарты."
  
 USA_influence_over_north_america: "Влияние на Северную Америку"
 USA_influence_over_north_america_desc: "Остальные страны Северной Америки являются нашими прямыми соседями и имеют с нами обширные сухопутные границы. Мы должны обеспечить соответствие этих государств нашим интересам и только нашим интересам. Внешнее влияние недопустимо."
  
 USA_influence_over_south_america: "Влияние на Южную Америку"
 USA_influence_over_south_america_desc: "Несмотря на то, что они находятся дальше, на другом континенте, угрозой может стать само присутствие неконтролируемой власти в Западном полушарии. Мы должны обеспечить соответствие этих государств нашим интересам и только нашим интересам. Внешнее влияние недопустимо."
  
 USA_influence_over_the_carribbean: "Влияние на Карибский бассейн"
 USA_influence_over_the_carribbean_desc: "Несмотря на свои небольшие размеры, островные государства Карибского бассейна все же могут представлять угрозу, особенно если они позволят использовать себя в качестве отправной точки иностранному противнику. Мы должны обеспечить соответствие этих государств нашим интересам и только нашим интересам. Внешнее влияние недопустимо."
  
 USA_influence_over_central_america: "Влияние на Центральную Америку"
 USA_influence_over_central_america_desc: "Государства Центральноамериканского перешейка окружают наше самое ценное достояние в Западном полушарии: Панамский канал. Мы должны обеспечить соответствие этих государств нашим интересам и только нашим интересам. Внешнее влияние недопустимо."
  
 USA_uncle_sam_knows_best: "Дядя Сэм знает лучше"
 USA_uncle_sam_knows_best_desc: "Как только наши друзья укрепят свое «демократическое» большинство, мы сможем воспользоваться теми рычагами, которые у нас есть над ними. В конце концов, они обязаны нам тем, что мы предоставили им безраздельную власть в их странах."
 USA_uncle_sam_knows_best_tt: "§YРешения об эксплуатации§! будут доступны для того, чтобы усилить наше влияние среди других американских стран, которые имеют более §G99% поддержки§! §Yдемократии§!, находятся в Альянсе с нами и не являются марионетками других стран."
  
 USA_spanish_civil_war_amendment: "Поправка о гражданской войне в Испании"
 USA_spanish_civil_war_amendment_desc: "Используя лазейки в действующих законах о нейтралитете в отношении гражданских войн, американские компании сумели продать значительное количество оружия националистам в Испании. Так продолжаться не может."
  
 USA_quarantine_policy: "Политика «Карантина»"
 USA_quarantine_policy_desc: "Хотя формально президент по-прежнему придерживается изоляционизма, он объявил о своем намерении начать следовать политике «карантина» с целью сдерживания агрессивных мировых держав в ответ на иностранную агрессию. Хотя на первый взгляд это не очень действенно, это шаг к интервенционистской внешней политике."
  
 USA_support_the_chinese: "Поддержка [CHI.GetNameRuGen]"
 USA_support_the_chinese_desc: "[JAP.GetName] ведёт неспровоцированную и несправедливую войну против всего [CHI.GetNameRuGen]. Несмотря на гораздо большую армию, Китаю потребуется иностранная помощь, чтобы иметь шанс противостоять Японии. Вооружение армий Чан Кайши могло бы стать хорошим способом противостоять нашему главному конкуренту на Тихом океане."
  
 USA_the_hump: "Программа «Горб»"
 USA_the_hump_desc: "Поскольку большинство китайских военно-морских портов либо находятся под контролем, либо под угрозой со стороны японцев, остаются только два варианта — Бирманская дорога и перелет через «Горб». Благодаря нашим высотным транспортным самолетам мы можем увеличить пропускную способность, пролетая над Гималаями."
 USA_the_hump_tt: "Позволяет §Y[CHI.GetNameRuDat]§! получать §Gрегулярные поставки§! снаряжения из §Y[ROOT.GetNameRuGen]§!.\nОткрывает фокусы для [CHI.GetFlag]§Y[CHI.GetNameRuGen]§!, которые §Gпринесут нам§! §Yармейский опыт§!.\n"
  
 USA_x_force: "Китайская экспедиционная армия"
 USA_x_force_desc: "Оказавшись отрезанными от основной китайской армии, 5 китайских дивизий остались в Бирме и готовы сражаться с японцами. Если обучить их силами наших офицеров, снабдить британским снаряжением и передать под контроль индийских военных, их можно будет использовать для защиты от японской агрессии в Индии."
  
 USA_declare_limited_national_emergency: "Объявить ограниченное чрезвычайное положение в стране"
 USA_declare_limited_national_emergency_desc: "Из-за агрессии и насилия со стороны других мировых держав наша будущая национальная безопасность может оказаться под угрозой. Вместо того чтобы сидеть и ждать, президент может заранее объявить ограниченное чрезвычайное положение в стране, чтобы начать подготовку к будущему конфликту."
  
 USA_prepare_asian_intervention: "Подготовить интервенцию в Азии"
 USA_prepare_asian_intervention_desc: "Хотя большинство людей с беспокойством смотрят на Европу, мы также сталкиваемся с неопределенностью и нестабильностью по всему Тихоокеанскому региону. Возможно, в наших интересах вмешаться за границей, прежде чем на нас нападут ближе к дому."
  
 USA_prepare_european_intervention: "Подготовка к европейской интервенции"
 USA_prepare_european_intervention_desc: "Великие державы Европы вновь готовы ввергнуть мир в мировую войну. Мы не можем, как раньше, ждать, пока это коснется нас. Мы должны быть готовы решительно вмешаться, если какая-либо страна в Европе будет угрожать миру."
  
 USA_japan_first: "Япония прежде всего"
 USA_japan_first_desc: "Японцы представляют наибольшую угрозу из всех наших иностранных противников, и с ними необходимо разобраться в первую очередь. Их завоевание наших тихоокеанских владений и остальной Азии с ее богатыми ресурсами неприемлемо и должно быть немедленно прекращено."
  
 USA_pacific_usace_projects: "Тихоокеанские проекты USACE"
 USA_pacific_usace_projects_desc: "Наш флот не может действовать в изоляции от надежной тыловой инфраструктуры. Корпус инженеров армии США переносит свои усилия на Тихий океан, приступая к масштабному строительству глубоководных портов, аэродромов и защищенных складов снабжения на стратегических островах. Мы превращаем отдаленные атоллы в ключевые узлы, способные обеспечить проецирование нашей силы на тысячи миль от побережья Калифорнии."
  
 USA_germany_first: "Германия прежде всего"
 USA_germany_first_desc: "Немцы представляют наибольшую угрозу из всех наших иностранных противников, и с ними необходимо разобраться в первую очередь. Их завоевание Европы с ее высоким уровнем экономического развития неприемлемо и должно быть немедленно прекращено."
  
 USA_atlantic_usace_projects: "Атлантические проекты USACE"
 USA_atlantic_usace_projects_desc: "U.S. Army Corps of Engineers (Корпус инженеров Армии США) специализируется на строительстве инфраструктуры, оборонных сооружений и других военных целях в труднодоступных районах, представляющих интерес. На атлантическом театре военных действий острова и прибрежные районы, такие как Ньюфаундленд, Бермуды, Ямайка, Подветренные острова, Багамы, Тринидад и Наветренные острова, расширят наше влияние через Атлантику."
  
 USA_further_atlantic_usace_projects: "Дальнейшие атлантические проекты USACE"
 USA_further_atlantic_usace_projects_desc: "U.S. Army Corps of Engineers (Корпус инженеров Армии США) специализируется на строительстве инфраструктуры, оборонных сооружений и других военных целях в труднодоступных районах, представляющих интерес. Гренландия и Исландия являются основными местами для размещения расширенных военных объектов, необходимых для расширения нашего влияния через Атлантику."
  
 USA_usace_liberia_projects: "Проекты USACE в Либерии"
 USA_usace_liberia_projects_desc: "U.S. Army Corps of Engineers (Корпус инженеров Армии США) специализируется на строительстве инфраструктуры, оборонных сооружений и других военных целях в труднодоступных районах, представляющих интерес. Либерия, где находится крупнейшая в мире каучуковая плантация, является важным активом нашей военной экономики."
  
 USA_global_superpower_potential: "Глобальный потенциал сверхдержавы"
 USA_global_superpower_potential_desc: "Соединённые Штаты являются оплотом демократии в западном мире. Простираясь от моря до сияющего моря, мы — маяк надежды, освещающий небо, как город на холме."
  
 USA_cash_and_carry_act: "Поправка «Заплати и уноси»"
 USA_cash_and_carry_act_desc: "Хотя предыдущие законы о нейтралитете запрещали продажу оружия странам, находящимся в состоянии войны, было сделано исключение, позволяющее продавать товары при условии, что указанная страна платит за транспортировку. Хотя срок действия этого положения уже истек, мы можем призвать Конгресс возобновить действие этого положения для снабжения союзников."
 USA_cash_and_carry_act_tt: "\n§GПозволит§! иностранным §Yдемократическим§! или §gнейтральным§! странам, таким как §Y[ENG.GetName]§! и §YСодружество§!, §Gприобретать§! §Y[USA.GetAdjectiveCap]ую§! военную технику.\n\n"
 
 USA_cash_and_carry_act_flag: "Фокус §Y$USA_cash_and_carry_act$§! выполнен"
 USA_cash_and_carry_act_flag_tt: "Текущие дни: [?USA_cash_and_carry_act_flag:days|Y0]"
 
 USA_lend_lease_act_desc: "Учитывая успех программы «Заплати и уноси», а также растущую общественную поддержку войны, необходимо отправлять дополнительные поставки союзникам за границу. Закон о ленд-лизе обеспечит такие страны, как Соединённое Королевство и Советский Союз, военными материалами в обмен на послевоенную оплату. Однако это сделало бы нас ненейтральной нацией."
 USA_lend_lease_act_tt: "Это §Yрешение§! §Rуберёт возможность покупать§! §Yвоенное снаряжение§! для §Cвоюющих стран§!. Вместо этого §Yстраны антигитлеровской коалиции§! начнут получать ежемесячные §Gпоставки по ленд-лизу§!."
  
 USA_us_british_staff_conference: "Конференция штабов США и Великобритании"
 USA_us_british_staff_conference_desc: "Конференция штабов США и Великобритании — это встреча высокого уровня, предложенная британцами для того, чтобы ознакомить высшее командование США с событиями войны. Если нам придется вступить в войну, нам необходимо быть осведомленными о текущих военных событиях."
  
 USA_north_atlantic_charter: "Североатлантическая хартия"
 USA_north_atlantic_charter_desc: "Североатлантическая хартия, подписанная главами США и Великобритании, закладывает основу послевоенного мирового порядка, основанного на мире и индивидуализме. На повестке дня также стоит потенциальный послевоенный альянс для обеспечения мира."
  
 USA_the_arcadia_conference: "Первая Вашингтонская конференция"
 USA_the_arcadia_conference_desc: "Конференция «Аркадия» — одна из первых предложенных встреч на высшем уровне между командованием США и Великобритании после вступления Соединенных Штатов в войну. Для утверждения военных решений союзников предлагается создать Объединенный комитет начальников штабов, объединяющий высшее командование США и Великобритании. В связи с этим США также сформируют Комитет начальников штабов, который заменит собой Объединенный совет. Мы взяли на себя обязательство обеспечить оборону западной части Тихого океана — в частности, Австралии и Новой Зеландии; если мы не выполним эту задачу, это вызовет недовольство как у нашего военного руководства, так и у наших новых союзников."
  
 USA_office_of_the_coordinator_of_information: "Бюро координатора по вопросам информации"
 USA_office_of_the_coordinator_of_information_desc: "Бюро координатора по вопросам информации, прямой предшественник УСС, было создано по совету британцев. Его основной целью была обработка разведывательной информации и координация дипломатических и психологических операций за границей."
  
 USA_black_chamber_operations: "Операции «Черной палаты»"
 USA_black_chamber_operations_desc: "Дипломатия — это лишь фасад, за которым скрывается реальная игра интересов. Возрождение деятельности «Черной палаты» — нашего элитного криптографического подразделения — даст нам доступ к зашифрованной переписке иностранных правительств. Читая чужие секреты, мы получим неоспоримое преимущество в переговорах, сможем предугадывать планы наших оппонентов в Азии и Европе и своевременно реагировать на любые угрозы нашей национальной безопасности."
  
 USA_militaristic_wpa: "Милитаристская АОР"
 USA_militaristic_wpa_desc: "Works Progress Administration (Администрация общественных работ) сыграла неоценимую роль в управлении крупномасштабными внутренними строительными проектами во время Великой депрессии. Ее опыт в этих проектах может быть напрямую перенесен на проекты военного строительства."
  
 USA_office_of_production_management: "Управление производством"
 USA_office_of_production_management_desc: "Уильям Кнудсен — бывший руководитель автомобильной компании, обладающий опытом, необходимым для того, чтобы убедить гигантов отрасли, таких как Ford, Chrysler и General Motors, предоставить свои огромные промышленные мощности. Благодаря своему опыту он может быстро нарастить производство в качестве руководителя Управления производством."
  
 USA_office_of_price_administration_and_civilian_supply: "Управление по регулированию цен и гражданскому снабжению"
 USA_office_of_price_administration_and_civilian_supply_desc: "В обязанности Управления по регулированию цен и гражданскому снабжению входит контроль той доли экономики, которая должна продолжать производить гражданские товары для населения. Поскольку гражданская экономика сокращается, а военная экономика быстро расширяется, цены необходимо держать под контролем."
  
 USA_rubber_reserve_company_desc: "Наш доступ к запасам каучука в Юго-Восточной Азии с каждым днем становится все более рискованным. Мы не можем позволить себе полагаться исключительно на запасы каучука в Южной Америке в качестве топлива для нашей военной машины. Нам следует немедленно приступить к созданию программы по производству синтетического каучука в США."
 USA_rubber_reserve_company_tt: "\n§Y80§! £GFX_rubber_texticon дополнительных запасов, в дополнение к приведенным выше §Y20§! £GFX_rubber_texticon , появятся после объявления войны и истекут ровно через §R365 д.§!, после чего останутся только начальные §Y20§! £GFX_rubber_texticon ."
  
 USA_domestic_usace_projects: "Отечественные проекты USACE"
 USA_domestic_usace_projects_desc: "U.S. Army Corps of Engineers (Корпус инженеров Армии США) специализируется на строительстве инфраструктуры, оборонных сооружений и других военных целях в труднодоступных районах, представляющих интерес. В этом случае внутренние проекты, такие как добыча ресурсов, могут осуществляться USACE благодаря его опыту."
  
 USA_national_defense_research_committee: "Создание НКОИ"
 USA_national_defense_research_committee_desc: "National Defense Research Committee (Национальный комитет оборонных исследований), или НКОИ, был создан в качестве превентивной меры для технологической подготовки к войне. Однако ограничения мирного времени на объем выделяемых ресурсов сохранялись. До начала войны все исследовательские работы проводились в полной секретности."
 
 USA_advisory_committee_on_uranium: "Консультативный комитет по урану"
 USA_advisory_committee_on_uranium_desc: "Консультативный комитет по урану — это исследовательское подразделение НКОИ, занимающееся определением возможности создания оружия, использующего энергию расщепления атома для нанесения разрушений. Эта работа заложит основу для Манхэттенского проекта."
 USA_advisory_committee_on_uranium_tt: "Получение §Yмиссии Тизарда§! сначала от §Y[ENG.GetNameRuGen]§! даст лучший бонус."
  
 USA_the_proximity_fuze: "Бесконтактный взрыватель"
 USA_the_proximity_fuze_desc: "Разработка неконтактного взрывателя считается третьим по величине и наиболее влиятельным достижением войны наряду с атомной бомбой и радаром. Способность взрывать артиллерийские и зенитные снаряды в непосредственной близости от цели, а не при попадании, значительно повышает их эффективность."
 USA_the_proximity_fuze_tt: "£tech_mod  Открывает §HБесконтактный взрыватель\nВся £unit_artillery_brigade_icon_small  артиллерия§!\n   Противопехотная атака: §G+25%§!\n   Прорыв: §G+10%§!\n   Расход припасов: §R+10%§!\n\n§YВсе роты поддержки £unit_anti_air_brigade_icon_small  ПВО§!\n   Воздушная атака: §G+50%§!\n   Противопехотная атака: §G+25%§!\n   Расход припасов: §R+10%§!\n   Атака ПВО флота: §G+50%§!"
 usa_proximity_fuze: "Бесконтактный взрыватель"
  
 USA_office_of_scientific_research_and_development_desc: "ОНИР заменил НКОИ как полноценная исследовательская организация военного времени. В отличие от своего предшественника, он располагал практически неограниченным финансированием и ресурсами из-за необходимости в передовых технологиях для обеспечения победы."
  
 USA_limited_rearmament: "Ограниченное перевооружение"
 USA_limited_rearmament_desc: "Общественность по-прежнему категорически против отправки наших мальчиков умирать в зарубежные страны. Недавняя просьба Великобритании о закупке американского снаряжения дала нам повод увеличить производство вооружений. При достаточной поддержке мы сможем еще больше увеличить этот объем."
  
 USA_declare_unlimited_national_emergency: "Объявить неограниченное чрезвычайное положение"
 USA_declare_unlimited_national_emergency_desc: ""
  
 USA_war_production_board: "Совет военного производства"
 USA_war_production_board_desc: "У нас сильная промышленность, но не вся она хорошо приспособлена для производства военной техники. Поиск эффективных процессов, способствующих этим изменениям, будет иметь ключевое значение для использования наших ресурсов."
  
 USA_war_manpower_commission: "Комиссия по военным кадрам"
 USA_war_manpower_commission_desc: ""
  
 USA_mandate_48_hour_work_week: "Обязательная 48-часовая рабочая неделя"
 USA_mandate_48_hour_work_week_desc: ""
  
 USA_office_of_war_mobilization: "Управление военной мобилизации"
 USA_office_of_war_mobilization_desc: "Хотя значительная часть промышленности США была переоборудована и использована для военных нужд без ущерба для экономики, потребность в таком объеме промышленных мощностей для победы над нашими врагами сокращается. Крупномасштабную промышленную мобилизацию для войны теперь можно сократить, поскольку мы готовимся вернуться к гражданской экономике после войны."
 USA_office_of_war_mobilization_tt: "\nАвтоматическая £factory_conversion_texticon конверсия £civ_factory£ §Yфабрик§! в £mil_factory£ §Gвоенные заводы§! §Rнавсегда прекратится§! через §Y3 месяца§! после активации этой миссии."
  
 USA_committee_of_economic_recovery: "Комитет экономического восстановления"
 USA_committee_of_economic_recovery_desc: "Хотя наша экономика не испытывала большого напряжения во время промышленной мобилизации для войны, наши граждане принесли большие жертвы, чтобы сделать это возможным. Массовое преобразование гражданской промышленности в военную необходимо обратить вспять, чтобы вернуться к гражданской экономике."
 USA_committee_of_economic_recovery_tt: "£economy_laws_cost_texticon  Экономическая мобилизация §Yобратится вспять§!: £mil_factory£ §Gвоенные заводы§! будут автоматически £factory_conversion_texticon §gконвертироваться§! в £civ_factory£ §Yгражданские фабрики§!. Хотя этот процесс можно начать раньше, чтобы уменьшить экономическую усталость, он произойдет §Rв любом случае§!, когда война закончится."
  
 USA_keynesian_militarism: "Кейнсианский милитаризм"
 USA_keynesian_militarism_desc: "С появлением кейнсианства как основной школы экономической мысли в США его можно использовать и в военных целях. После восстановления после Великой депрессии все рабочие программы могут быть переориентированы на подготовку Соединённых Штатов к будущему конфликту. В духе кейнсианства, точно так же, как программы, финансируемые государством, улучшают жизнь гражданского населения страны, они могут таким же образом улучшить нашу военную готовность."
  
 USA_tva_alcoa_cooperation: "Сотрудничество АДТ-Alcoa"
 USA_tva_alcoa_cooperation_desc: "Поскольку АДТ является доминирующим поставщиком энергии в долине реки Теннесси, частные компании, такие как Американская алюминиевая компания Alcoa, могли бы использовать эти огромные энергетические мощности для строительства крупнейшего в мире алюминиевого завода. Этот алюминий пригодился бы во время конфликта."
  
 synthetic_rubber_programme: "Программа синтетического каучука"
 synthetic_rubber_programme_desc: "Мы слишком зависим от других стран в обеспечении наших потребностей в каучуке. Необходимо срочно инвестировать в производство синтетического каучука, чтобы обеспечить будущее производства самолетов и грузовиков."
  
 USA_office_of_censorship: "Управление цензуры"
