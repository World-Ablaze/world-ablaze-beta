 USA_rubber_reserves: "Запасы каучука"
 USA_rubber_reserves_desc: "Этого каучука было запасено столько, что нам хватит ровно на 1 год. По истечении времени останется только 1/5 ресурса."
  
 USA_educational_orders_guns: "Учебные заказы на стрелковое вооружение"
 USA_educational_orders_guns_desc: "Если заказать сравнительно небольшую партию легкого и тяжелого пехотного снаряжения у гражданских производителей, они научатся более эффективно производить это снаряжение, одновременно пополняя наши запасы."
  
 USA_educational_orders_support_equipment: "Учебные заказы на вспомогательное снаряжение"
 USA_educational_orders_support_equipment_desc: "Если заказать сравнительно небольшую партию вспомогательного снаряжения у гражданских производителей, они научатся более эффективно производить это снаряжение, одновременно пополняя наши запасы."
  
 USA_educational_orders_artillery: "Учебные заказы на артиллерию"
 USA_educational_orders_artillery_desc: "Если заказать сравнительно небольшую партию артиллерии у гражданских производителей, они научатся более эффективно производить это вооружение, одновременно пополняя наши запасы."
  
 USA_educational_orders_trucks: "Учебные заказы на грузовики"
 USA_educational_orders_trucks_desc: "Если заказать сравнительно небольшую партию грузовых машин у гражданских производителей, они научатся более эффективно производить эту технику, одновременно пополняя наши запасы."
  
  
