 USA_alpine_divisions: "Альпийские дивизии"
 USA_alpine_divisions_desc: "Хотя в армии этому нет прецедентов, альпийские дивизии могут потребоваться для победы над противником в горной местности за рубежом. Горные стрелки могут быть более эффективны на пересеченной местности, чем наши обычные пехотные дивизии."
 USA_alpine_divisions_tt: "Вы получите шаблон £unit_mountaineers_icon_small §YЛегкой дивизии (альпинисты)§!.\n"
  
 USA_army_rangers: "Армейские Рейнджеры"
 USA_army_rangers_desc: "Армейские рейнджеры существуют со времен первой войны Америки: Американской революции. С тех пор они так или иначе участвовали в каждой войне. Во время Второй мировой войны было организовано несколько батальонов рейнджеров, чтобы дополнить возможности обычных пехотных дивизий. Наиболее ярким примером этого является движение впереди пехоты и восхождение на вертикальные скалы во время дня «Д»."
 USA_army_rangers_tt: "Вы получите шаблон £unit_commandos_icon_small §YБатальона армейских рейнджеров§!.\n"
  
 USA_first_special_service_force_desc: "Канадцы предложили создать элитные американо-канадские подразделения коммандос, специализирующиеся на операциях на пересеченной местности и в экстремальных погодных условиях. Тренируясь в холодных условиях, доступных в Канаде, и в жарких условиях, доступных в США, наши спецназовцы вместе смогут справиться с этим климатом."
 USA_first_special_service_force_tt: "£tech_mod  Добавить технологию: §YПервые силы специального назначения§!\n£unit_category_special_forces_icon_small Спецназ\n    £temperature_hot_texticon  Прирост акклиматизации к жаре: §G+10%§!\n    £temperature_cold_texticon  Прирост акклиматизации к холоду: §G+10%§!"
  
 USA_commission_the_m29_weasel: "Ввести в эксплуатацию M29 Weasel"
 USA_commission_the_m29_weasel_desc: "Наш спецназ часто действует на местности, которую не может эффективно преодолеть даже джип. Производя небольшие, легкие, прочные и гусеничные машины для использования нашими альпинистами, коммандос и морской пехотой, мы можем значительно расширить их наземные возможности."
 USA_commission_the_m29_weasel_tt: "£tech_mod  Добавить технологию: §YM29 Weasel§!\n£unit_mountaineers_icon_small §HГорно-стрелковые войска§! \n   Передвижение: §G+25%§!\n£unit_marine_icon_small §HМорская пехота§! \n   Передвижение: §G+25%§!\n£unit_category_special_forces_icon_small §HКоммандос§! \n   Передвижение: §G+25%§!\n£GFX_unit_paratrooper_icon_small §HВДВ§! \n   Передвижение: §G+25%§!"
 usa_m29_weasel: "M29 Ласка"
  
 USA_oss_operations: "Операции УСС"
 USA_oss_operations_desc: "Office of Strategic Services (Управление стратегических служб) специализируется на операциях, связанных с проникновением в правительства противника и оказанием помощи зарубежным группам сопротивления. Использование для этих задач уже хорошо обученных операторов спецназа армии США повысит их эффективность."
  
 USA_international_security: "Международная безопасность"
 USA_international_security_desc: "Корпус морской пехоты был выбран в качестве военного подразделения, которое будет обеспечивать безопасность всего дипломатического персонала за рубежом. Все посольства будут укомплектованы морскими пехотинцами, что предоставит нашим сотрудникам и шпионам за границей более безопасную зону непосредственной деятельности."
  
 USA_prepare_for_an_amphibious_war: "Подготовка к десантной войне"
 USA_prepare_for_an_amphibious_war_desc: ""
  
 USA_train_for_large_scale_invasions: "Подготовка к крупномасштабным вторжениям"
 USA_train_for_large_scale_invasions_desc: ""
  
 USA_train_for_island_hopping: "Подготовка к «прыжкам по островам»"
 USA_train_for_island_hopping_desc: ""
  
 USA_mullberry_harbor_emphasis: "Акцент на гаванях «Малберри»"
 USA_mullberry_harbor_emphasis_desc: ""
  
 USA_marine_invasion_advisors: "Советники по морскому вторжению"
 USA_marine_invasion_advisors_desc: "Несмотря на то, что они специализируются на десантных вторжениях, на некоторых театрах военных действий требуются вторжения со стороны армии, а не морской пехоты. Чтобы обеспечить успех на благо Вооруженных Сил, морские пехотинцы могут консультировать своих армейских коллег о том, как осуществить высадку с моря."
 USA_marine_invasion_advisors_tt: "£tech_mod  Добавить технологию: §YСоветники по вторжению морской пехоты§!\n£unit_infantry_icon_small §HПехота§!\n   Морской десант: §G+10%§!\n£unit_heavy_infantry_icon_small §HУсиленная пехота§!\n   Морской десант: §G+10%§!\n§HВсе варианты§! £unit_light_armor_icon_small §Hлегких танков§!\n   Морской десант: §G+10%§!\n§HВсе варианты§! £unit_medium_armor_icon_small §Hсредних танков§!\n   Морской десант: §G+10%§!"
  
 USA_creation_of_the_seabees: "Создание «Морских пчёл»"
 USA_creation_of_the_seabees_desc: "Строительные батальоны ВМФ, более известные как «Сибиз» (Seabees, «морские пчёлы» — созвучно аббревиатуре «CB»), изначально были задуманы как замена гражданским подрядчикам в зонах боевых действий после Перл-Харбора. Эти люди специализировались на строительстве любых типов зданий на передовой или в зонах боевых действий для военно-морского флота, особенно для морской пехоты. Их считают «самым большим вкладом, который ВМФ внес в Корпус морской пехоты во время Второй мировой войны»."
  
 USA_marine_training_assistance: "Помощь морской пехоты в подготовке"
 USA_marine_training_assistance_desc: ""
  
 USA_great_depression_state_no_tt: "Из всех основных штатов модификатор §YЭкономика штата в когтях Великой депрессий§! можно будет удалить посредством §Yрешений на карте§!."
 
 USA_state_depressed_infra_tt: "Добавляет правильное количество ед. §Yинфраструктуры§! для строительства во всех штатах (если следовать пути §GИСТОРИЧЕСКИХ§! фокусов), чтобы удалить местные модификаторы §YЭкономика штата в когтях Великой депрессий§! с помощью §Yрешений на карте§!."
 USA_state_depressed_infra_tt2: "Добавляет правильное количество ед. §Yинфраструктуры§! для строительства во всех штатах (если следовать пути §RАЛЬТ-ИСТОРИЧЕСКИХ§! фокусов), чтобы удалить местные модификаторы §YЭкономика штата в когтях Великой депрессий§! с помощью §Yрешений на карте§!."
 USA_state_depressed_infra_tt3: "Добавляет правильное количество ед. §Yинфраструктуры§! для строительства во всех штатах (если следовать по пути §OКАЙЗЕРОВСКИХ АЛЬТ-ИСТОРИЧЕСКИХ§! фокусов), чтобы удалить местные модификаторы §YЭкономика штата в когтях Великой депрессий§! с помощью §Yрешений на карте§!."
  
 USA_modernize_the_army: "Модернизировать армию"
 USA_modernize_the_army_desc: "Наша армия крайне недостаточно подготовлена и все еще сражается, используя тактику Великой войны. Мы проконсультировались с нашими инженерами и тактиками, чтобы лучше понять эти новые боевые машины."
  
 USA_restructure_the_national_army: "Реструктуризация Национальной армии"
 USA_restructure_the_national_army_desc: "Наша армия десятилетиями находилась в застое и спячке. Пришло время начать реструктуризацию армии, чтобы можно было привлечь в нее новых рекрутов."
  
 USA_USACE_investments: "Инвестиции USACE"
 USA_USACE_investments_desc: "Корпус инженеров Армии США имеет богатую историю в Соединённых Штатах, участвуя в строительных проектах как в мирное, так и в военное время. Поскольку сложность ведения войны продолжает возрастать, мы можем ожидать, что их технический опыт окажется чрезвычайно полезным."
  
 louisiana_maneuvers_tt: ""
  
 USA_create_unit_airborne_tt: "Вы получите шаблон £unit_paratrooper_icon_small §YВоздушно-десантной дивизии§!.\n"
  
 USA_prepare_asian_intervention_tt: "Когда другая великая держава станет угрозой, будет активировано задание: §Y$USA_power_projection$§! на Тихом океане."
  
 USA_intervention_mandate_tt: "Будут открыты решения: §HМандаты на вмешательство§!."
  
 USA_war_foundations: "Военные фонды"
 USA_war_foundations_desc: "Наша нынешняя армия неопытна и устарела. Использование отчетов о продолжающейся войне поможет нам принять военную информацию."
  
 USA_join_the_allies: "Присоединиться к антигитлеровской коалиции"
 USA_join_the_allies_desc: "Америка достаточно долго была праздным наблюдателем. Когда вы видите гремучую змею, готовую нанести удар, вы не ждете, пока она нанесет удар, чтобы раздавить ее. Американцы будут защищать свободу, кем бы ни был враг и где бы он ни находился."
  
 USA_start: "Продолжить «Новый курс»"
 USA_start_desc: "Учитывая, что нация находится в руинах, Рузвельту удалось поставить США на ноги посредством Первого Нового курса. Однако, в отличие от широкой поддержки Первого нового курса, Рузвельт потерял некоторую поддержку, хотя его нацеливание на бизнес началось во время Второго нового курса. Однако большая часть общественности по-прежнему поддерживает Рузвельта, несмотря на истощение энергии «Нового курса»."
  
 USA_boulder_dam: "Строительство плотины Боулдер"
  
 USA_depression_fix: "Постепенно §Gуменьшает§! последствия от §RВеликой депрессии§!\n"
  
 USA_interstate_road_board: "Создать Совет по межгосударственным дорогам"
 USA_interstate_road_board_desc: "Чтобы помочь Управлению по электрификации сельских районов, а также для дальнейшего подключения бедных фермеров к рынкам, возникла идея создания большой сети дорог между штатами для облегчения транспортировки товаров."
  
 USA_farmer_relief_act: "Закон о помощи фермерам"
 USA_farmer_relief_act_desc: "Поскольку «Пыльный котел» терроризирует Великие равнины, фермерам, испытывающим трудности, должна быть оказана прямая помощь, чтобы они снова встали на ноги."
  
 USA_farm_bankruptcy_act: "Закон о банкротстве ферм"
 USA_farm_bankruptcy_act_desc: "Рузвельт уделял большое внимание защите фермеров в первые годы своего президентства. Если мы стремимся сохранить их поддержку, нам придется принять далеко идущие меры защиты, которые будут восприняты некоторыми представителями американской общественности как спорные."
 USA_farm_bankruptcy_act_tt: "§YПредотвратит образование нейтрального блока в случае гражданской войны§!"
  
 USA_nira_act: "Закон НИРА"
 USA_nira_act_desc: "Теперь, когда мы смогли осуществить так много радикальных изменений в нашей стране, президент считает, что пришло время вернуться к вопросу об отмене НИРА. Если мы сможем восстановить его, это окажет значительное и разностороннее влияние на нашу страну."
  
 USA_union_recognition_act: "Закон о признании Союза"
 USA_union_recognition_act_desc: "Чтобы помочь среднестатистическому американскому рабочему, необходимо принять закон, который заставит владельцев фабрик признать профсоюзы, которые составляют более 25% в любой отрасли."
  
 USA_business_relations_act: "Закон об отношениях между деловыми союзами"
 USA_business_relations_act_desc: "Чтобы Построить лучшее сотрудничество между работниками и бизнесом, необходимо принять законы, которые примирят эти две стороны и откроют диалог о том, как лучше управлять промышленностью."
  
 USA_board_of_business_management: "Совет лучшего бизнеса"
 USA_board_of_business_management_desc: "Чтобы начать дальнейшее обсуждение, необходимо создать совет, который будет представлять как профсоюзы, так и бизнес, для обсуждения правильных протоколов ведения бизнеса."
  
 USA_CRA: "Создать АРК"
 USA_CRA_desc: "После завершения строительства «плотины Боулдер» территория вокруг реки имеет потенциал как для сельского хозяйства, так и, возможно, даже для крупномасштабного города. Создав Администрацию реки Колорадо, мы сможем организовать крупные инвестиционные проекты."
  
 USA_wait_out_the_recession: "Переждать рецессию"
 USA_wait_out_the_recession_desc: "Хотя рецессия может выглядеть ужасной, это просто ожидаемый результат перехода американской экономики от государственных расходов, и не о чем беспокоиться."
 USA_wait_out_the_recession_tt: "§GЭтот фокус завершится, если вы переждёте рецессию Рузвельта вместо того, чтобы пытаться исправить ее с помощью кейнсианской экономики.§!\n§Rне даёт немедленных выгод, но может быть лучшим выбором в долгосрочной перспективе.§!"
  
 USA_keynesian_economics: "Кейнсианская экономика"
 USA_keynesian_economics_desc: "Поскольку экономика ухудшается после недавнего сокращения бюджета, необходимо использовать другие варианты. Теория Джона Мейнарда Кейнса о том, что государственные расходы необходимы для стимулирования экономики, предлагает решение, предполагающее расширение многих государственных трудовых программ, чтобы перезапустить американскую экономику."
  
 USA_budget_balancing: "Балансировка бюджета"
 USA_budget_balancing_desc: "Когда американская экономика наконец-то вернулась в нормальное русло, пришло время начать медленный процесс перехода занятости из государственного сектора в частный путем сокращения финансирования многих государственных программ."
 USA_budget_balancing_tt: "§RМожет вызвать рецессию§!"
  
 USA_flint_strike_support: "Не вмешались в сидячую забастовку во Флинте."
 USA_flint_strike_breakup: "Вмешались в сидячую забастовку во Флинте."
 USA_judicial_reform_tt: "§RЭтот законопроект будет трудно принять§!, и для него потребуется поддержка Требуется поддержка как минимум §Y[?USA.quorum_high] сенаторов§! (текущий: [?USA.senators_support]) и представителей §Y261§! (текущий: [?USA.representatives_support])\n §YГарольд Л. Икес§! уйдёт в отставку"
 congress_massive_support_trigger_tt: "Требуется поддержка как минимум §Y65 Сенаторов§W (текущий: [?senators_support|W0])§W и §Y303 Представителей §W (текущий: [?representatives_support|W0])"
 USA_judicial_reform_fail: "Закон о судебной реформе провалился"
 USA_judicial_reform_pass: "Принят Закон о судебной реформе"
  
 USA_undistributed_profits_tax: "Налог на нераспределенную прибыль"
 USA_undistributed_profits_tax_desc: "Налог на нераспределенную прибыль был еще одним видом налога на богатство, включенным в Закон о доходах 1936 года. Законопроект установил принцип, согласно которому нераспределенная корпоративная прибыль может облагаться налогом. Идея заключалась в том, чтобы заставить крупный, богатый бизнес распределять прибыль в виде дивидендов и заработной платы, вместо того, чтобы сберегать или реинвестировать ее. Это было предназначено для получения дохода для оплаты программ Нового курса Рузвельта."
  
 USA_banking_industry_loans: "Кредиты банковской отрасли"
 USA_banking_industry_loans_desc: "С момента своего избрания Рузвельт боролся с банковской отраслью, в частности, нацеливаясь на монополию §YJ§!§W.§!§YP§!§W.§! §YMorgan§!. Однако расходы на программы «Нового курса» растут, и у федерального правительства заканчиваются возможности их оплатить. Принятие кредитов от этих банков обогатит их, но предотвратит давление на бизнес через новые налоги."
  
 USA_market_deregulation: "Расслабиться в правилах рынка"
 USA_market_deregulation_desc: "Постоянно растущий список правил, которым должны следовать корпорации свободного рынка, может задушить малый бизнес, жизненно важный для восстановления экономики. Избавившись от избыточного регулирования, рынок сам сможет оправиться от Великой депрессии."
  
 USA_veteran_employement: "Ветеранские усилия по трудоустройству"
 USA_veteran_employement_desc: "Рузвельт попытался остановить Закон о скорректированной компенсации, наложив вето на том основании, что к здоровым ветеранам следует относиться так же, как и к среднестатистическому гражданину. Вместо выплаты ветеранам подачек альтернативой является гарантирование им работы. Мы просто не можем гарантировать их лечение на свободном рынке..."
  
 USA_Kaiser_Positive_1_tt1: "£faction_usa_kaiser §CKaiser-Industries§! станет §Gвлиятельнее§!, увеличивая £GFX_faction_construction_civilian_factory_icon §Yскорость строительства§! на §G+5.00%§!, и это заставит их внести больший вклад в будущие военные усилия."

 USA_Kaiser_Dockyard_Swap_tt: "£faction_usa_kaiser §CKaiser-Industries§! станет §Gвлиятельнее§! и полностью переключится на §3судостроение§!, что §Rуберёт§! все бонусы к £GFX_faction_construction_civilian_icon §Yскорости строительства§! (§G+§![?USA_kaiser_production_speed_buildings_factor|+%]), но в пропорциональном соотношении £faction_usa_kaiser §CKaiser-Industries§! §Gдаст§! бонус к £dockyard_output_texticon  §Yпроизводительности верфи§! (§G+§![?USA_kaiser_production_speed_buildings_factor|+%])."
  
