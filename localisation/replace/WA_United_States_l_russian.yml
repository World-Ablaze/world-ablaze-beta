 USA_emergency_shipbuilding_program: "Программа экстренного судостроения"
 USA_emergency_shipbuilding_program_desc: "Видя возможную угрозу приближающейся войны на два океана, Морская комиссия учреждает программу, призванную обеспечить Соединённым Штатам достаточное производство торговых и военных кораблей. Генри Кайзеру поручено создать настолько большие мощности по производству кораблей, каких еще никогда не было в истории."
 
