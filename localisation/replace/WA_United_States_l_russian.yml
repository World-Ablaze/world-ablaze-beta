 USA_selective_service_act: "Закон о выборочной службе"
 USA_selective_service_act_desc: "Эта война оказалась гораздо более значимой, чем мы первоначально рассчитывали. При достаточной политической поддержке мы можем принять закон о призыве, который позволит нам подготовить резервную армию на случай, если конфликт когда-либо достигнет берегов Америки."
 USA_selective_service_act_tt: "Можно обучить до £manpower_texticon£ §Y30 резервных дивизий§!.\nВ начале войны £conscription_laws_cost_texticon  §Yзакон о призыве§! будет изменен на §Yвыборочную службу§!."
