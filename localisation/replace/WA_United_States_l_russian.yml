 USA_office_of_production_management_tt: "Будет открыто решение: §Y$USA_negotiate_with_ford$§!\nБудет открыто решение: §Y$USA_negotiate_with_GM$§!\nБудет открыто решение: §Y$USA_negotiate_with_JPMorgan$§!\n\n"
 USA_early_mob_tt: "Позволяет переключиться на §Yраннюю мобилизацию экономики§! после завершения фокусов §Y$USA_office_of_production_management$§! и §Y$USA_limited_rearmament$§!."
 USA_partial_mob_tt: "Позволяет переключиться на §Yчастичную мобилизацию экономики§! после завершения фокусов §Y$USA_office_of_price_administration_and_civilian_supply$§! и §Y$USA_declare_unlimited_national_emergency$§!."
  
 USA_the_90_division_plan: "План «90 дивизий»"
 USA_the_90_division_plan_desc: "По нашим оценкам, силы армии в 90 дивизий будет достаточно, чтобы победить врага, сохраняя при этом потребности в рабочей силе других важных секторов, вносящих вклад в военные усилия союзников, таких как сельское хозяйство и промышленность."
  
 USA_the_265_division_plan_desc: "Для достижения полной победы необходимо подвести к противнику подавляющую силу в 265 дивизий. Независимо от потребностей в рабочей силе в других местах, превосходство в численности является ключом к победе в войне."
  
 USA_airborne_training_for_europe: "Воздушно-десантная подготовка для Европы"
 USA_airborne_training_for_europe_desc: "Тактика воздушного десанта будет сильно различаться в зависимости от обстановки на театре военных действий. Обилие городских центров Европы и относительно открытые равнинные территории делают десантирование с парашютом опасным. Для более эффективной работы в таких условиях потребуется дополнительная специализированная подготовка."
 USA_airborne_training_for_europe_tt: "£tech_mod  Добавить технологию: §YВоздушно-десантная подготовка для Европы§!\n£unit_paratrooper_icon_small §HВДВ§!\n   Организация: §G+5.0§!\n   §HГород§!\n     Атака: §G+10%§!\n     Защита: §G+20%§!\n   §HРавнины§!\n     Атака: §G+10%§!\n     Защита: §G+20%§!"
  
 USA_airborne_training_for_asia: "Воздушно-десантная подготовка для Азии"
 USA_airborne_training_for_asia_desc: "Тактика воздушного десанта будет сильно различаться в зависимости от обстановки на театре военных действий. Густые джунгли Азии и большие горные хребты особенно затрудняют десантирование с парашютом. Для более эффективной работы в таких условиях потребуется дополнительная специализированная подготовка."
 USA_airborne_training_for_asia_tt: "£tech_mod  Добавить технологию: §YВоздушно-десантная подготовка для Азии§!\n£unit_paratrooper_icon_small §HВДВ§!\n   Организация: §G+5.0§!\n   §HДжунгли§!\n     Атака: §G+10%§!\n     Защита: §G+20%§!\n   §HГоры§!\n     Атака: §G+10%§!\n     Защита: §G+20%§!"
  
 USA_army_ground_forces: "Сухопутные войска"
 USA_army_ground_forces_desc: "Сухопутные войска являются основой боевых сил армии. Все передовые боевые подразделения входят в состав этого подразделения, и поэтому необходимо обеспечить его готовность, если мы хотим выиграть какое-либо сражение."
  
 USA_army_service_forces: "Армейские службы"
 USA_army_service_forces_desc: "Армейские службы выполняют все боевые задачи армии вне линии фронта. Основы армии, логистика, связь, инженерное дело и многое другое, так же важны, как и сами боевые силы, и заслуживают такого же внимания при подготовке к войне."
  
 USA_escort_carriers: "Эскортные авианосцы"
 USA_escort_carriers_desc: "Как только важность авиации в морских боях была осознана, авианосцы планировалось использовать во всех областях морской войны, будь то крупномасштабные сражения или задачи противолодочного сопровождения. Авианосцы сопровождения, обычно переоборудованные из существующих крейсеров или гражданских грузовых судов, могут помочь устранить пробелы в воздушном прикрытии на маршрутах конвоев."
  
 USA_reject_the_nye_committee_findings: "Отклонить выводы Комитета Ная"
 USA_reject_the_nye_committee_findings_desc: "Комитет Ная представлял собой расследование Конгресса, проведенное во время правления Рузвельта, которое установило, что американский бизнес, особенно бизнес Пьера Дюпона, лоббировал в правительстве США войну и, таким образом, получил от этого большую прибыль."
  
 USA_reconcile_with_dupont_and_gm: "Примириться с General Motors Company и DuPont"
 USA_reconcile_with_dupont_and_gm_desc: "Пьер Дюпон обижен, ведь комитет Ная назвал его «торговцем смертью». Его предприятия, в первую очередь DuPont и General Motors, могли бы принести большую пользу в преодолении Великой депрессии, если мы примиримся с ним."
  
 USA_contract_with_dupont_and_gm: "Контракт с General Motors Company и DuPont"
 USA_contract_with_dupont_and_gm_desc: "General Motors и DuPont обладают обширным опытом в химической и промышленной сферах, накопленным в их частном бизнесе. Аутсорсинг федеральной работы может оказаться дешевле и эффективнее, чем пытаться выполнить ее самостоятельно."
  
 USA_reconcile_with_ford_and_chrysler: "Примириться с Ford Motor Company и Chrysler Corporation"
 USA_reconcile_with_ford_and_chrysler_desc: "Американская автомобильная промышленность, особенно Ford Motor Company и Chrysler Corporation, чувствуют себя подвергнутыми ненужным атакам, несмотря на их вклад в благосостояние экономики до Великой депрессии. Примирение с ними поможет задействовать больше американской промышленности."
  
 USA_contract_with_ford_and_chrysler: "Контракт с Ford Motor Company и Chrysler Co."
 USA_contract_with_ford_and_chrysler_desc: "Форд и Крайслер имеют большой опыт в автомобильной и промышленной сфере, полученный в их частном бизнесе. Аутсорсинг федеральной работы может оказаться дешевле и эффективнее, чем пытаться выполнить ее самостоятельно."
  
 USA_public_private_partnerships: "Государственно-частное партнерство"
 USA_public_private_partnerships_desc: "Количество частной промышленности, доступной в Соединённых Штатах, не имеет себе равных нигде в мире. Использование этого, особенно в секторе малого бизнеса, могло бы помочь правительству повысить эффективность проектов."
  
 USA_restore_boeings_airmail_contracts: "Восстановить контракты Boeing на авиапочту"
 USA_restore_boeings_airmail_contracts_desc: "В начале правления Рузвельта контракт на авиапочту между правительством США и Boeing был разорван. Воздушный корпус армии США совершенно не смог эффективно заменить роль Boeing в доставке почты по воздуху, поэтому пересмотр этого решения может быть полезным."
  
 USA_restart_fords_aircraft_production: "Возобновить производство самолетов Ford"
 USA_restart_fords_aircraft_production_desc: "До Великой депрессии Ford Motor Company производила самолеты на своем заводе в Уиллоу Ран. Предложение стимулов для возобновления этого производства могло бы помочь восстановить рабочие места и промышленность в нашем авиационном секторе."
  
 USA_veteran_employment_effort: "Трудоустройство ветеранов"
 USA_veteran_employment_effort_desc: "Большое количество бездомных и безработных ветеранов Первой мировой войны вызвало серьезные политические волнения — движение «Бонусной армии». Предложение стимулов частному сектору для трудоустройства этих ветеранов могло бы быть полезным."
  
 USA_ford_and_chrysler_paving_divisions: "Подразделения компаний Ford и Chrysler по укладке дорожного покрытия"
 USA_ford_and_chrysler_paving_divisions_desc: "Автомобильная промышленность, особенно Ford Motor Company и Chrysler Corporation, знают об автомобилях и тяжелом машиностроении больше, чем большинство других компаний. Таким образом, привлечение их к созданию инфраструктуры позволит нам использовать их опыт в этой области."
  
 USA_banking_industry_consolidation: "Консолидация банковской отрасли"
 USA_banking_industry_consolidation_desc: "Массовое изъятие вкладов в начале Великой депрессии стало возможным из-за преобладания независимых банков в маленьких городках. Содействуя консолидации всей отрасли под таким известным именем, как §YJ§!§W.§!§YP§!§W.§! §YMorgan§!, можно избежать подобной паники в будущем."
  
 USA_rural_industrial_zones: "Сельско-промышленные зоны"
 USA_rural_industrial_zones_desc: "Обилие земли и ресурсов в сельских районах Америки не имеет себе равных. Эту территорию можно было бы лучше использовать для масштабного промышленного расширения, которое будет способствовать развитию экономики."
  
 USA_exploitation_of_rural_resources: "Эксплуатация сельских ресурсов"
 USA_exploitation_of_rural_resources_desc: "Истощающиеся ресурсы, обнаруженные в городских районах по всей стране, требуют дополнительных поисков. Сельская Америка относительно нетронута и содержит огромное количество неиспользованных ресурсов, которые можно использовать."
  
 USA_ford_alcoa_cooperation: "Сотрудничество компаний Ford-Alcoa"
 USA_ford_alcoa_cooperation_desc: "Alcoa — один из крупнейших производителей алюминия в мире. Партнерство с одним из их крупнейших клиентов, Ford Motor Company, могло бы стать для них хорошим способом получить капитал, необходимый для масштабного расширения."
  
 USA_reconcile_with_jp_morgan: "Примириться с компанией J.P. Morgan"
 USA_reconcile_with_jp_morgan_desc: "Джон Пирпонт Морган-младший, владелец банковской империи J.P. Morgan, был обвинен правительством в Великом крахе фондового рынка 1929 года, который положил начало Великой депрессии. Примирение с ним могло бы принести правительству ценные денежные активы."
  
 USA_big_business_tax_breaks: "Налоговые льготы для крупного бизнеса"
 USA_big_business_tax_breaks_desc: "Большой бизнес движет экономикой. Большая часть ВВП, генерируемого частным сектором, поступает от крупного бизнеса, поэтому стимулирование их роста должно пойти на пользу экономике."
  
 USA_appoint_dupont_head_of_tva: "Назначить Пьера Дюпона главой АДТ"
 USA_appoint_dupont_head_of_tva_desc: "Из всех федеральных организаций АДТ ближе всего к частному бизнесу. Назначение на ее пост безжалостного бизнесмена, такого как Пьер Дюпон, увеличило бы доходный потенциал АДТ."
  
 USA_tva_hydro_initiative_i: "Гидроинициатива АДТ I"
 USA_tva_hydro_initiative_i_desc: "Одной из основных функций АДТ является строительство гидроэлектростанций в виде плотин. Эти электростанции могут обеспечить энергию и рабочие места, необходимые для развития местной экономики, но это дорого обходится местной инфраструктуре."
  
 USA_tva_hydro_initiative_ii: "Гидроинициатива АДТ II"
 USA_tva_hydro_initiative_ii_desc: "Одной из основных функций АДТ является строительство гидроэлектростанций в виде плотин. Эти электростанции могут обеспечить энергию и рабочие места, необходимые для развития местной экономики, но это дорого обходится местной инфраструктуре."
  
 USA_state_sponsored_rd: "Государственные НИОКР"
 USA_state_sponsored_rd_desc: "Технологические инновации и научные открытия требуют больших объемов финансирования, чтобы их можно было осуществить своевременно. Выделение федеральных средств на это дело могло бы помочь существенно ускорить развитие в этих областях."
  
 USA_small_business_tax_breaks: "Налоговые льготы для малого бизнеса"
 USA_small_business_tax_breaks_desc: "Малые предприятия невелики по размеру, но их очень много. В совокупности они обеспечивают большую часть рабочих мест в Америке, поэтому стимулирование их расширения может быть полезно для экономики."
  
 USA_kaiser_tva_merge: "Слияние Kaiser-Industries с АДТ"
 USA_kaiser_tva_merge_desc: "АДТ, как и другие правительственные организации, частично неэффективно управляется назначенными правительственными бюрократами. Опыт Kaiser-Industries, полученный при строительстве плотины Боулдер, делает компанию отличным кандидатом на выкуп и слияние с организацией."
  
 USA_kaiser_flood_control_program_i: "Программа Генри Кайзера по борьбе с наводнениями I"
 USA_kaiser_flood_control_program_i_desc: "Помимо строительства плотин, АДТ также занимается борьбой с наводнениями. Местную инфраструктуру вблизи водных путей и плотин можно сохранить, инвестируя в меры по борьбе с наводнениями, такие как дамбы и паводковые каналы."
  
 USA_kaiser_flood_control_program_ii: "Программа Генри Кайзера по борьбе с наводнениями II"
 USA_kaiser_flood_control_program_ii_desc: "Помимо строительства плотин, АДТ также занимается борьбой с наводнениями. Местную инфраструктуру вблизи водных путей и плотин можно сохранить, инвестируя в меры по борьбе с наводнениями, такие как дамбы и паводковые каналы."
  
 USA_dryland_farming_investments: "Инвестиции в засушливое земледелие"
 USA_dryland_farming_investments_desc: "Земледелие в засушливых районах — это метод ведения сельского хозяйства, специально разработанный для засушливых и чрезмерно обрабатываемых территорий, например, в некоторых частях Запада Америки. Эти методы ведения сельского хозяйства могут помочь смягчить последствия «Пыльного котла»."
  
 USA_halt_government_spending_programs: "Остановить программы государственных расходов"
 USA_halt_government_spending_programs_desc: "Многие федеральные программы были созданы в начале правления администрации Рузвельта с целью создания рабочих мест для смягчения Великой депрессии. Эти неограниченные расходы привели к тому, что правительство попало в крупные долги, и их прекращение могло бы помочь спасти экономику."
  
 USA_privatize_the_tva: "Приватизировать АДТ"
 USA_privatize_the_tva_desc: "Приватизация АДТ может сделать организацию эффективнее за счет устранения государственной бюрократии. Если управлять ею как частной компанией, она может стать более прибыльной и гораздо более широко распространенной."
  
 USA_dissolve_the_pwa: "Распустить УОР"
 USA_dissolve_the_pwa_desc: "Public Works Administration (Управление общественных работ) — одна из многих государственных рабочих программ, призванных снизить безработицу во время Великой депрессии. Однако огромные затраты и небольшая отдача показали, что эта организация, возможно, является плохой инвестицией."
  
 USA_dissolve_the_wpa: "Распустить АОР"
 USA_dissolve_the_wpa_desc: "Другая правительственная рабочая программа, Администрация общественных работ, также погрязла в расследованиях и обвинениях в политической коррупции. Роспуск этой организации избавит правительство и от расходов, и от проблем."
  
 USA_dissolve_the_ccc: "Распустить ГКОП"
 USA_dissolve_the_ccc_desc: "Гражданский корпус охраны природы был одной из первых рабочих программ, принятых во время Великой депрессии. Хотя его работа над национальными парками заслуживает похвалы, за счет его роспуска можно сэкономить много денег."
  
 USA_repeal_the_revenue_act_of_1935: "Отменить закон о доходах 1935 года"
 USA_repeal_the_revenue_act_of_1935_desc: "Закон о доходах 1935 года, также известный как «Налог на богатство», стал одним из крупнейших повышений налогов в истории США, подняв ставку налога на высокие доходы до 75%. Ее снижение даст высшему классу больше ликвидности для инвестиций в свой бизнес для укрепления экономики."
  
 uk_extra_tech_slot_2: "Дополнительные исследования"
 uk_extra_tech_slot_2_desc: "Дополнительные исследования"
 
 
