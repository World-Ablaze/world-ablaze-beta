 USA_mass_production_expertise: "Американский опыт массового производства"
 USA_mass_production_expertise_desc: "США направили к нам экспертов по массовому производству, чтобы помочь оптимизировать и рационализировать нашу тяжелую промышленность."
  
 bs_great_depression: "Великая депрессия"
 bs_great_depression_desc: "Несмотря на то, что Великая депрессия стала явлением мирового масштаба, она началась с краха фондового рынка в Соединённых Штатах и привела к резкому росту уровня безработицы и резкому падению налоговых поступлений. Американскому народу и его правительству есть о чем беспокоиться, не ввязываясь в новую войну."
 USA_great_depression: "Великая депрессия"
 USA_great_depression_desc: "Несмотря на то, что Великая депрессия стала явлением мирового масштаба, она началась с краха фондового рынка в Соединённых Штатах и привела к резкому росту уровня безработицы и резкому падению налоговых поступлений. Американскому народу и его правительству есть о чем беспокоиться, не ввязываясь в новую войну."
 
