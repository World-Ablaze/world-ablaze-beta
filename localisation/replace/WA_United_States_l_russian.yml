 USA_new_deal: "«Новый курс»"
 USA_new_deal_desc: "«Новый курс» - это экономическая и социальная программа, проводимая администрацией президента Франклина Делано Рузвельта, начиная с 1933 года. Целью программы является преодоление последствий Великой депрессии."
  
 USA_business_deal: "Деловой союз"
 USA_business_deal_desc: "Попытки правительства диктовать условия рынку лишь замедляют восстановление. Настало время довериться тем, кто построил индустриальную мощь этой нации. Заключив соглашение с лидерами промышленности и банковского сектора, мы отказываемся от избыточного регулирования в обмен на их инвестиции в развитие национального потенциала. Мы не будем «спасать» экономику с помощью субсидий — мы позволим бизнесу работать, чтобы страна снова стала сильной."
  
