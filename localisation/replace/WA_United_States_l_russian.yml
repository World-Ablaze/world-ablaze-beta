 unreliable_torpedoes_desc: "Во время нашего первого морского боя и тренировок мы обнаружили серьезные проблемы с нашими торпедами. Мы установили, что существуют серьезные проблемы с глубиной торпеды, преждевременной детонацией, срывами взрыва и круговым, а не линейным движением. По сути, нам необходимо прекратить производство наших бракованных торпед и срочно заняться устранением этих проблем, которые на какое-то время сделают нас уязвимыми."
