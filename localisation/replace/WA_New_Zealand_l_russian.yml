 NZL_unlock_district_force: "Разблокировать окружные силы"
 NZL_unlock_district_force_desc: "Силы округа не будут меняться, если только не возникнет непосредственная угроза в Тихом океане. В настоящее время страна занимает позицию внутренней обороны, и очень мало людей выделяется за пределы окружных сил для экспедиционных целей. Однако, вопреки общественному мнению, мы можем заставить выделить больше людей за границу...\n\nЭтого решения можно избежать, выполнив фокус «Оборона Новой Зеландии»."
 NZL_district_force_unlocked: "Шаблон §YDistrict Force§! был разблокирован"

   

