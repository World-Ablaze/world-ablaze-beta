 nzl_armor.801.t: "Всеобщие выборы 1938 года в Новой Зеландии"
 nzl_armor.801.d: "Лейбористская партия одержала решительную победу на выборах 1938 года после проведения популярной политики, направленной на улучшение жизни каждого новозеландца"
 nzl_armor.801.a: "Превосходно"

 nzl_armor.802.t: "Подразделения маори показывают хорошие результаты"
 nzl_armor.802.d: "Наша первая битва уже показала эффективность маорийских подразделений в составе наших дивизий, это значительно улучшит наши отношения с ними и наши шансы на победу в битвах."
 nzl_armor.802.a: "Очень хорошо"

 nzl_armor.803.t: "Майкл Джозеф Сэвидж умер"
 nzl_armor.803.d: "Наш премьер-министр, страдавший от рака толстой кишки, скончался. Состоялись государственные похороны, и страна скорбит. Его популярность среди избирателей была настолько велика, что его будут помнить еще многие поколения. Теперь мы смотрим в будущее с нашим новым лидером Фрейзером, который одержал победу в борьбе за руководство партией и теперь станет нашим новым премьер-министром."
 nzl_armor.803.a: "Мы скорбим о потере одного из наших величайших"