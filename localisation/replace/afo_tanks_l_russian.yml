 light_tank_aa_chassistank_ger_light_chassis_1: "§W§!Flakpanzer I§W§!"
 light_tank_aa_chassistank_ger_light_chassis_2: "§W§!Flakpanzer II§W§!"
 light_tank_aa_chassistank_ger_light_chassis_3: "§W§!Flakpanzer 38t§W§!"
 light_tank_aa_chassistank_ger_light_chassis_5: "§W§!Gepard§W§!"

 tank_ger_light_chassis_td_1: "§W§!Panzerjäger I§W§!"
 tank_ger_light_chassis_td_1_desc: "В попытке использовать устаревшие Panzer I, оставшиеся на складах Германии, многие из них были переделаны в истребители танков. Оснащенный чешской 47-мм противотанковой пушкой Skoda, Panzerjäger I способен пробить большинство танков своей эпохи. Следует отметить, что броня этой машины очень слаба и обеспечивает лишь ограниченную защиту от огня стрелкового оружия.\n§GЭто позволит сохранить 95% эффективности от Panzer I§!"

 tank_ger_light_chassis_td_2: "§W§!Marder II§W§!"
 tank_ger_light_chassis_td_2_desc: "Установив 7,5-мм PaK 40 на шасси Panzer II, Marder II способен пробить почти все вражеские танки своего времени, хотя в некоторых случаях и с трудом. Marder II обладает очень хорошими противотанковыми характеристиками, но испытывает серьезный недостаток в бронезащите. Сочетание слабой брони и высокого профиля делает его крайне хрупкой машиной.\n§GЭто позволит сохранить 95% эффективности от Panzer II§!"

 tank_ger_light_chassis_td_3: "§W§!Hetzer§W§!"
 tank_ger_light_chassis_td_3_desc: "Jagdpanzer 38 - это попытка использовать устаревшее шасси Panzer 38(t) начала войны. ПТ-САУ обладает хорошими оборонительными характеристиками благодаря полностью наклонной броне и очень компактному силуэту. Для своих возможностей она очень дешева.\n§GЭто позволит сохранить 95% эффективности от Panzer 38t§!"

 tank_ger_light_chassis_td_4: "§W§!Marder III Ausf.H§W§!"
 tank_ger_light_chassis_td_4_short: "§W§!Marder III H§W§!"
 tank_ger_light_chassis_td_4_desc: "Marder III - результат использования испытанного корпуса Panzer 38(t) для установки 7,5-см орудия PaK 40. Как и Marder II, Marder III обладает отличными противотанковыми возможностями в плане пробития и жесткой атаки, а также улучшенной мобильностью, защитой и надежностью.\n§GЭто позволит сохранить 95% эффективности от $tank_ger_light_chassis_3$§!"

 tank_ger_light_chassis_td_4_1: "§W§!Marder III Ausf.M§W§!"
 tank_ger_light_chassis_td_4_1_short: "§W§!Marder III M§W§!"
 tank_ger_light_chassis_td_4_1_desc: "Ausf.M - это специально разработанная машина для самоходных орудий, вновь вооруженная мощной 75-мм противотанковой пушкой PaK 40. Новая конфигурация надстройки обеспечивает более низкий силуэт, наклонную броню и гораздо более функциональное боевое отделение.\n§RЭта модель не конвертирует старые модели§! §GНо сохранит эффективность от $tank_ger_light_chassis_td_4$§!"

 tank_ger_light_chassis_td_5: "§W§!Jagdpanzer Leopard§W§!"
 tank_ger_light_chassis_td_5_desc: "Jagdpanzer Leopard значительно улучшает бронезащиту легких истребителей танков, однако в нем по-прежнему используется то же орудие, что и в предыдущих моделях. В результате истребитель танков гораздо лучше защищен от переносного противотанкового оружия пехоты, но не способен надежно пробивать современную технику.\n§GЭто позволит сохранить 95% эффективности от Leopard§!"

 tank_ger_light_chassis_td_6: "§W§!Jagdpanzer E-25§W§!"
 tank_ger_light_chassis_td_6_desc: "Серия E - это попытка стандартизировать детали немецких бронемашин для повышения надежности и эффективности производства. E-25 напоминает конструкторские решения, использованные в истребителе танков Hetzer. E-25 - чрезвычайно маленькая машина, способная очень быстро перемещаться по полю боя. Орудие, которым он оснащен, также должно быть относительно небольшим, поэтому оно способно пробивать только броню среднего уровня.\n§GЭто позволит сохранить 95% эффективности от E-25§!"

 tank_ger_light_chassis_assault_1: "§W§!Bison§W§!"
 tank_ger_light_chassis_assault_1_desc: "Штурмовое орудие\nОпыт показал, что 15 cm sIG 33 не поспевала за бронетанковыми частями. Орудие было установлено на шасси Panzer I с открытым верхом и очень тонкой броней, способной защитить экипаж только от огня стрелкового оружия и осколков снарядов. Огневая мощь, которую она обеспечивает, отлично подходит для уничтожения пехотных подразделений. Кроме того, у нее были проблемы с надежностью из-за перегруженного шасси.\n§GЭто позволит сохранить 95% эффективности от Panzer I§!"

 tank_ger_light_chassis_assault_2: "§W§!St.Pz II§W§!"
 tank_ger_light_chassis_assault_2_desc: "Штурмовое орудие\nSt. Pz II устранило многие проблемы "Бизона", получив более прочное шасси, улучшенную броню и усовершенствованное орудие. Тем не менее, у него по-прежнему отсутствует полноценная надстройка, что делает его очень уязвимым для атак.\n§GЭто позволит сохранить 95% эффективности от Panzer II§!"

 tank_ger_light_chassis_assault_3: "§W§!Grille§W§!"
 tank_ger_light_chassis_assault_3_desc: "Штурмовое орудие\nКак легкое штурмовое орудие конца войны, Grille не может похвастаться достаточным уровнем огневой мощи, чтобы идти в ногу с более тяжелыми версиями. Поэтому она была спроектирована для ведения огня прямой наводкой, что сохраняет полезность ее характеристик.\n§GЭто позволит сохранить 95% эффективности от Panzer 38t§!"

 tank_ger_light_chassis_spg_2: "§W§!Panzerhaubitze Wesp§W§!"
 tank_ger_light_chassis_spg_2_short: "§W§!Wespe§W§!"
 tank_ger_light_chassis_spg_2_desc: "Столкнувшись с теми же проблемами, что и другие легкие САУ конца войны, Wespe не может использовать тяжелое вооружение, необходимое для прорыва хорошо укрепленных фортификационных сооружений. По сравнению со своим родственником, Grille, он лучше почти по всем параметрам наступательной мощи и при этом немного дешевле.\n§GЭто позволит сохранить 95% эффективности от Panzer II§!"

 tank_ger_light_chassis_spg_5: "§W§!Waffenträger auf Leopard 'Käfer'§W§!"
 tank_ger_light_chassis_spg_5_short: "§W§!Waffenträger auf Leopard§W§!"
 tank_ger_light_chassis_spg_5_desc: "Käfer использует то же орудие, что и предыдущий Wespe, но имеет дополнительную броню и улучшенный двигатель. Снаряды, которыми он оснащен, также имеют несколько улучшенную пробиваемость, что позволяет лучше пробивать легкобронированные машины.\n§GЭто позволит сохранить 95% эффективности от $tank_ger_light_chassis_5$§!"

 tank_ger_light_chassis_aa_1: "§W§!Flakpanzer I§W§!"
 tank_ger_light_chassis_aa_1_desc: "Понимая, что моторизованным зенитным подразделениям крайне не хватает брони, для решения этой проблемы были разработаны специальные самоходные зенитные установки. Из-за небольших размеров шасси Panzer I радиостанция и большая часть боеприпасов должны были храниться на прицепе. Это эффективное и дешевое решение для сдерживания штурмовых атак.\n§GЭто позволит сохранить 95% эффективности от Panzer I§!"

 tank_ger_light_chassis_aa_2: "§W§!Flakpanzer II§W§!"
 tank_ger_light_chassis_aa_2_desc: "Flakpanzer II обеспечивает дополнительную бронезащиту экипажа, так как Flakpanzer I часто несли большие потери. Изменения в конструкции башни позволили немного улучшить противовоздушную защиту.\n§GЭто позволит сохранить 95% эффективности от Panzer II§!"

 tank_ger_light_chassis_aa_3: "§W§!Flakpanzer 38(t)§W§!"
 tank_ger_light_chassis_aa_3_desc: "Хотя Flakpanzer 38(t) добавляет дополнительную бронезащиту экипажу, одной 20-мм автопушки уже недостаточно для борьбы с вражескими самолетами на сколько-нибудь значительном уровне.\n§GЭто позволит сохранить 95% эффективности от $tank_ger_light_chassis_3$§!"

 tank_ger_light_chassis_aa_5: "§W§!Flakpanzer Leopard§W§!"
 tank_ger_light_chassis_aa_5_desc: "Еще одна модель легкого танка Leopard. 20-мм зенитная пушка уже малоэффективна, но это все еще дешевый вариант.\n§GЭто позволит сохранить 95% эффективности от $tank_ger_light_chassis_5$§!"


 tank_ger_medium_chassis_1: "§W§!Neubaufahrzeug§W§!"
 tank_ger_medium_chassis_1_desc: "Neubaufahrzeug, или "вновь построенная машина", была одной из первых попыток Германии создать боевую бронированную машину. Благодаря своей многобашенной конструкции он способен обеспечить большое количество огневой мощи в виде жесткой и мягкой атаки. Эта сложность имеет свои недостатки, делая танк чрезвычайно дорогим в производстве как с точки зрения ресурсов, так и с точки зрения объема производства."

 tank_ger_medium_chassis_2: "§W§!Panzer III Ausf. A§W§!"
 tank_ger_medium_chassis_2_short: "§W§!Panzer III A§W§!"
 tank_ger_medium_chassis_2_desc: "Эта версия Pz III ориентирована на противотанковый аспект танкового боя. Его 3,7-см орудие KwK 36 L/45 способно эффективно бороться с танками противника, существовавшими в этот период времени. Это один из немногих танков с трехместной башней, что позволяет командиру использовать все свое внимание и усилия для эффективного руководства. Этот танк должен использоваться для борьбы с танковыми соединениями противника, но в некоторой степени он способен бороться и с пехотными соединениями. Все танки были хорошо оснащены радиостанциями для эффективной координации действий при прорыве. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_medium_chassis_2_2: "§W§!Panzer III Ausf. E§W§!"
 tank_ger_medium_chassis_2_2_short: "§W§!Panzer III E§W§!"
 tank_ger_medium_chassis_2_2_desc: "Первый серийный вариант Panzer III, модель E - это всесторонняя модернизация прототипа A. Наиболее заметные изменения заключаются в усилении пробития и брони, что делает танк значительно более эффективным в борьбе с вражеской бронетехникой. Несмотря на то, что танк является достойным для своего времени, он слишком мал для установки противотанкового орудия, способного пробивать вражеские танки с более высоким уровнем брони.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_medium_chassis_2_3: "§W§!Panzer III Ausf. L§W§!"
 tank_ger_medium_chassis_2_3_short: "§W§!Panzer III L§W§!"
 tank_ger_medium_chassis_2_3_desc: "Для борьбы с более тяжелыми бронетанковыми частями Panzer III L был модифицирован для установки удлиненной версии 5-см пушки KwK 39 L/60, обеспечивающей повышенное пробитие и жесткую атаку. Дополнительная броня на корпусе и маске орудия обеспечивает повышенную защиту от вражеских снарядов.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_medium_chassis_3: "§W§!Panzer IV Ausf.F2§W§!"
 tank_ger_medium_chassis_3_short: "§W§!Panzer IV Ausf. F2§W§!"
 tank_ger_medium_chassis_3_desc: "Для борьбы с хорошо бронированными машинами противника необходимы большие и более мощные противотанковые орудия, которые не могут быть размещены на Panzer III. Поэтому Panzer IV теперь обозначается как средний танк. Орудие имеет очень хорошую пробиваемость и точность, что делает этот танк очень опасным при использовании в хорошо поддерживаемых наступлениях.\n§YЭто позволит сохранить 90% эффективности предыдущей модели§!"

 tank_ger_medium_chassis_3_2: "§W§!Panzer IV Ausf. G§W§!"
 tank_ger_medium_chassis_3_2_short: "§W§!Panzer IV G§W§!"
 tank_ger_medium_chassis_3_2_desc: "Вражеские орудия легко пробивают броню наших танков, несмотря на ее прочность. Инвестиции в усиление брони наших основных танков и разработку самолетов для уничтожения танков будут иметь большое значение для решения этих проблем.\n§YЭто позволит сохранить 90% эффективности предыдущей модели§!"
 ger_medium_tank_chassis_2_5: "Panzer IV G"

 tank_ger_medium_chassis_3_3: "§W§!Panzer IV Ausf. H§W§!"
 tank_ger_medium_chassis_3_3_short: "§W§!Panzer IV H§W§!"
 tank_ger_medium_chassis_3_3_desc: "Для борьбы с использованием советских противотанковых винтовок к танке Panzer IV были добавлены броневые юбки. Изменения в производстве также привели к тому, что броня корпуса Panzer IV стала изготавливаться из одной пластины, что повысило ее структурную целостность.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_medium_chassis_infantry_support_3: "§W§!Panzer IV Ausf. A§W§!"
 tank_ger_medium_chassis_infantry_support_3_short: "§W§!Panzer IV A§W§!"
 tank_ger_medium_chassis_infantry_support_3_desc: "Танк поддержки пехоты\nЭтот вариант Pz IV ориентирован на поддержку пехоты в танковом бою. Его 7,5-см гаубичное орудие KwK 37 позволяет эффективно бороться с пехотой, но не предназначено для борьбы с бронетехникой противника. Этот танк должен использоваться для поддержки атак против другой пехоты. Он также получил трехместную башню, впервые примененную на Panzer III. Все танки были хорошо оснащены радиостанциями для эффективной координации действий при прорыве. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_medium_chassis_infantry_support_3_2: "§W§!Panzer IV Ausf. C§W§!"
 tank_ger_medium_chassis_infantry_support_3_2_short: "§W§!Panzer IV C§W§!"
 tank_ger_medium_chassis_infantry_support_3_2_desc: "Танк поддержки пехоты\nТанк Panzer IV C получил усовершенствованный двигатель и уменьшенную надстройку, что позволило значительно увеличить боевую скорость. Роль этого танка по-прежнему заключается в борьбе с пехотой противника в рамках поддержки пехоты.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_medium_chassis_infantry_support_3_3: "§W§!Panzer IV Ausf. F§W§!"
 tank_ger_medium_chassis_infantry_support_3_3_short: "§W§!Panzer IV F§W§!"
 tank_ger_medium_chassis_infantry_support_3_3_desc: "Танк поддержки пехоты\nУвеличенная однолистовая броня спереди и по бокам обеспечивает большую бронезащиту этого варианта Panzer IV. Двигатель также усовершенствован для обеспечения большей надежности.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_medium_chassis_infantry_support_2: "§W§!Panzer III Ausf. N§W§!"
 tank_ger_medium_chassis_infantry_support_2_short: "§W§!Panzer III N§W§!"
 tank_ger_medium_chassis_infantry_support_2_desc: "Танк поддержки пехоты\nИз-за развития бронетехники Panzer III больше не подходит для размещения противотанковых орудий, достаточно мощных, чтобы пробивать высокобронированные цели противника. Поскольку эту роль взял на себя Panzer IV, Panzer III стал танком поддержки, использующим короткоствольное орудие, предназначенное для борьбы с пехотой противника. Он имеет достойную броню и вооружение, способные прорвать линию пехоты.\n§YЭто позволит сохранить 90% эффективности предыдущей модели§!"


 medium_tank_infantry_support_chassistank_ger_medium_chassis_2: "§W§!Panzer III§W§!"
 medium_tank_infantry_support_chassistank_ger_medium_chassis_3: "§W§!Panzer IV§W§!"
 medium_tank_destroyer_chassistank_ger_medium_chassis_2: "§W§!StuG III§W§!"
 medium_tank_destroyer_chassistank_ger_medium_chassis_3: "§W§!StuG IV§W§!"
 medium_tank_assault_chassistank_ger_medium_chassis_2: "§W§!StuG III§W§!"
 medium_tank_assault_chassistank_ger_medium_chassis_3: "§W§!StuG IV§W§!"
 medium_tank_artillery_chassistank_ger_medium_chassis_3: "§W§!Hummel§W§!"
 medium_tank_aa_chassistank_ger_medium_chassis_3: "§W§!Ostwind§W§!"

 tank_ger_medium_chassis_td_2: "§W§!Sturmgeschütz III Ausf. F§W§!"
 tank_ger_medium_chassis_td_2_short: "§W§!StuG III F§W§!"
 tank_ger_medium_chassis_td_2_desc: "Отказавшись от башни типичного Panzer III, можно было установить более мощное орудие по сниженной цене. Stug III F очень эффективен в борьбе с вражеской бронетехникой, а его низкий профиль и наклонная броня позволяют делать это из относительной безопасности. Эта машина чрезвычайно полезна для любой наступательной или оборонительной операции.\n§GЭто позволит сохранить 95% эффективности от Panzer III§!"

 tank_ger_medium_chassis_td_3: "§W§!Nashorn§W§!"
 tank_ger_medium_chassis_td_3_desc: "Nashorn использует разрушительную пушку PaK 43, способную пробить броню любого танка как масло. Он предназначен для уничтожения танков с дальних дистанций, поскольку крайне слабая броня делает его использование в ближнем бою рискованным. Кроме того, он довольно медленный и ненадежный, что затрудняет его использование в быстрых наступлениях.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_td_3_2: "§W§!Sturmgeschütz IV§W§!"
 tank_ger_medium_chassis_td_3_2_desc: "Stug IV построен на более надежном шасси по сравнению с Stug III G. Он также оснащен дополнительным пулеметом на корпусе для улучшения оборонительных возможностей против пехотных подразделений.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_td_3_3: "§W§!Jagdpanzer IV§W§!"
 tank_ger_medium_chassis_td_3_3_desc: "Jagdpanzer IV был разработан для замены линейки StuG, которая уже не справлялась с орудиями, необходимыми для пробивания тяжелой советской брони. Ограничение схемы бронирования жестким компактным казематом позволило распределить броню очень плотно, под наклоном, что сделало машину очень прочной. Новая схема конструкции с использованием сцепленных между собой пластин, которые свариваются друг с другом, значительно снижает стоимость производства.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_assault_2: "§W§!Sturmgeschütz III Ausf.A§W§!"
 tank_ger_medium_chassis_assault_2_short: "§W§!StuG III A§W§!"
 tank_ger_medium_chassis_assault_2_desc: "Штурмовое орудие\nНа основе опыта Первой мировой войны было решено, что для быстро наступающей пехоты, оказавшейся за пределами досягаемости своей артиллерии, необходимо иметь средство непосредственной поддержки. Поэтому Stug III A был оснащен низкоскоростной 7,5-см пушкой StuK 37 L/24. Низкий профиль и местный наклон брони значительно улучшают защиту машины, позволяя ей эффективно использовать высокую противопехотную атаку на передовой.\n§GЭто позволит сохранить 95% эффективности от Panzer III§!"

 tank_ger_medium_chassis_assault_2_2: "§W§!Sturmgeschütz III Ausf.E§W§!"
 tank_ger_medium_chassis_assault_2_2_short: "§W§!StuG III E§W§!"
 tank_ger_medium_chassis_assault_2_2_desc: "Штурмовое орудие\nНебольшие качественные изменения, такие как расширенная рубка, оборонительные противопехотные пулеметы и стереоскопические перископы, улучшили общие характеристики машины. К настоящему времени оригинальная конструкция Stug III столкнулась с трудностями в борьбе с советскими танками, что свидетельствует о том, что эти конструкции вскоре могут устареть.\n§GЭто позволит сохранить 95% эффективности от Panzer III§!"

 tank_ger_medium_chassis_assault_2_3: "§W§!Sturmhaubitze 42§W§!"
 tank_ger_medium_chassis_assault_2_3_short: "§W§!StuH 42§W§!"
 tank_ger_medium_chassis_assault_2_3_desc: "Штурмовое орудие\nВооруженный настоящей 10,5-см гаубицей, StuH 42 предназначен для обеспечения разрушительной огневой поддержки против пехоты. Эта конструкция значительно повышает мягкую атаку, а броня может быть усовершенствована еще больше.\n§GЭто позволит сохранить 95% эффективности от Panzer III§!"

 tank_ger_medium_chassis_assault_3: "§W§!Sturmpanzer IV 'Brummbär'§W§!"
 tank_ger_medium_chassis_assault_3_short: "§W§!StuPa 'Brummbär'§W§!"
 tank_ger_medium_chassis_assault_3_desc: "Штурмовое орудие\nИзвестное немцам как "Stupa" (сокращение от Sturmpanzer), оно несет 15-см орудие StuH 43 L/12. Для Brummbär бронезащита экипажа приоритетнее вооружения.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_spg_3: "§W§!Panzerhaubitze Hummel§W§!"
 tank_ger_medium_chassis_spg_3_desc: "Оснащенный 15-см гаубицей, Hummel имел более тяжелое вооружение, чем любой из его предшественников. При увеличении огневой мощи Hummel значительно подорожал.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_aa_3: "§W§!Wirbelwind§W§!"
 tank_ger_medium_chassis_aa_3_desc: "Используя четырехствольную 20-мм автопушку, Wirbelwind гораздо эффективнее сбивает вражеские самолеты, чем его предшественники. Кроме того, благодаря своей огневой мощи он удивительно эффективен против легкобронированных наземных подразделений.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_aa_3_2: "§W§!Ostwind§W§!"
 tank_ger_medium_chassis_aa_3_2_desc: "Из-за недостатков 20-мм автопушки в стрельбе по самолетам, на Ostwind вместо нее установили 37-мм. Из-за дыма, генерируемого орудием, Ostwind продолжил использовать башню с открытым верхом, в результате чего получилась легкобронированная машина. 37-мм пушка - очень мощное орудие, способное эффективно бороться с воздушными и небронированными наземными подразделениями.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"

 tank_ger_medium_chassis_aa_3_3: "§W§!Kugelblitz§W§!"
 tank_ger_medium_chassis_aa_3_3_desc: "В отличие от более ранних самоходных зенитных установок, Kugelblitz имеет полностью закрытую вращающуюся башню. Для борьбы с вражескими самолетами используется 30-мм пушка MK 103 в спаренной установке. Это очень дешевая машина с более чем достойными характеристиками для своей роли.\n§GЭто позволит сохранить 95% эффективности от Panzer IV§!"




 tank_ger_modern_chassis_1: "§W§!Panther Ausf. D§W§!"
 tank_ger_modern_chassis_1_short: "§W§!Panther D§W§!"
 tank_ger_modern_chassis_1_desc: "Panther - это первая попытка Германии создать основной боевой танк, призванный заменить Panzer III и IV. Чтобы ускорить поступление танка на вооружение и увеличить темпы производства, пришлось пойти на упрощения, что привело к нескольким нерешенным проблемам с надежностью. Хотя "Пантера" намного дороже своих предшественников, она экономически выгоднее "Тигра I", при этом обладает почти такой же лобовой броней и гораздо большей подвижностью.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_modern_chassis_1_2: "§W§!Panther Ausf. G§W§!"
 tank_ger_modern_chassis_1_2_short: "§W§!Panther Ausf. G§W§!"
 tank_ger_modern_chassis_1_2_desc: "Panther Ausf. G - это полностью доведенная до зрелости конструкция Panther. Серьезные проблемы с надежностью в значительной степени устранены. Новый двигатель делает Ausf. G еще более мобильной, чем раньше, а новая конструкция башни устраняет слабые места.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_modern_chassis_1_3: "§W§!Panther Ausf. F§W§!"
 tank_ger_modern_chassis_1_3_short: "§W§!Panther Ausf. F§W§!"
 tank_ger_modern_chassis_1_3_desc: "В варианте Panther Ausf. F изменена конструкция башни, чтобы уменьшить ее размеры как цели и повысить бронезащиту. Кроме того, в нем были устранены некоторые проблемы с надежностью, которые все еще присутствуют в конструкции Panther.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_modern_chassis_2: "§W§!Panther II§W§!"
 tank_ger_modern_chassis_2_desc: "Panther II добавляет танку значительное количество брони и пробития, что позволяет ему бороться с тяжелобронированными противниками. По сравнению со своим современником, Panther Ausf. F, она превосходит его почти по всем боевым характеристикам, но менее надежна и более дорога в производстве.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_modern_chassis_3: "§W§!E-50§W§!"
 tank_ger_modern_chassis_3_desc: "Серия E - это попытка стандартизировать детали немецких бронемашин для повышения надежности и эффективности производства. E-50 должен был заменить Panther, но на деле оказался очень похож на Tiger II. Несмотря на то, что он во всех отношениях лучше Tiger II, упрощение производства сделало его дешевле.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_modern_chassis_3_2: "§W§!E-50 Ausf.M§W§!"
 tank_ger_modern_chassis_3_2_short: "§W§!E-50M§W§!"
 tank_ger_modern_chassis_3_2_desc: "E-50 M имеет ряд усовершенствований по сравнению с E-50: трансмиссия перенесена в заднюю часть машины, где ее легче заменить. Улучшенное орудие также обеспечивает танку дополнительную огневую мощь по сравнению с предшественником.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_modern_chassis_4: "§W§!E-60§W§!"
 tank_ger_modern_chassis_4_desc: "Небольшие изменения в башне E-60 позволили установить улучшенное орудие, способное наносить больший урон.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_modern_chassis_5: "§W§!Leopard 1§W§!"
 tank_ger_modern_chassis_5_desc: "В связи с распространением кумулятивного противотанкового оружия мобильность и огневая мощь стали играть более важную роль, чем броня. В результате Leopard 1 жертвует большим количеством брони, чтобы достичь чрезвычайно высокого уровня прорыва и скорости.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"


 modern_tank_destroyer_chassistank_ger_modern_chassis_1: "§W§!Jagdpanther§W§!"
 modern_tank_destroyer_chassistank_ger_modern_chassis_3: "§W§!Jagdpanther E-50§W§!"
 modern_tank_artillery_chassistank_ger_modern_chassis_1: "§W§!GW Panther§W§!"
 modern_tank_artillery_chassistank_ger_modern_chassis_3: "§W§!GW E-50§W§!"
 modern_tank_aa_chassistank_ger_modern_chassis_1: "§W§!Coelian§W§!"
 modern_tank_aa_chassistank_ger_modern_chassis_3: "§W§!Flakpanzer E-50§W§!"

 tank_ger_modern_chassis_td_1: "§W§!Jagdpanther§W§!"
 tank_ger_modern_chassis_td_1_desc: "Сильно наклоненная бронированная рубка обеспечивает машине приличное количество брони, которую могут пробить только специальные танковые разрушители. Мощное 8,8-см орудие PaK 43 способно наносить огромный урон тяжелым целям."

 tank_ger_modern_chassis_td_1_2: "§W§!Skorpion§W§!"
 tank_ger_modern_chassis_td_1_2_desc: "Skorpion - это истребитель танков с открытой башней, значительно отличающийся от многих казематных конструкций, обычно используемых Германией. Обладая тем же орудием, что и Jagdpanther, "Скорпион" сбросил значительную часть брони, чтобы достичь более высокой скорости. Кроме того, обзор, обеспечиваемый вращающейся открытой башней, позволяет легче определять местоположение и вести прицельный огонь по вражеским машинам."

 tank_ger_modern_chassis_td_3: "§W§!Jagdpanther E-50§W§!"
 tank_ger_modern_chassis_td_3_desc: "E-50 имеет гораздо больше брони, чем его предок Jagdpanther. Многолетний боевой опыт также позволил значительно повысить надежность, наступательную мощь и скорость."

 tank_ger_modern_chassis_spg_1: "§W§!GW Panther§W§!"
 tank_ger_modern_chassis_spg_1_desc: "Несмотря на гораздо более тяжелый корпус, GW Panther ограничивается тем же орудием, что и Hummel. Экспериментальный корпус добавляет дополнительную броню, но менее надежен и более дорог в производстве.\n§RЭто не позволит сохранить эффективность от Panthers§!"

 tank_ger_modern_chassis_spg_1_2: "§W§!RB Panther§W§!"
 tank_ger_modern_chassis_spg_1_2_desc: "Продолжая использовать ту же пушку, что и на Hummel и GW Panther, RB Panther обладает достойной, но не превосходной огневой мощью. Эта модель продолжает улучшать броню и надежность своего предшественника.\n§RThis will retain efficiency from GW Panther§!"

 tank_ger_modern_chassis_spg_3: "§W§!GW E-50§W§!"
 tank_ger_modern_chassis_spg_3_desc: "GW E-50 оснащен улучшенным двигателем и дополнительной броней, что позволяет САУ достигать более широкого спектра областей на поле боя.\n§RЭта модель может быть конвертирована, но не сохранит эффективность от E-50§!"

 tank_ger_modern_chassis_aa_1: "§W§!Coelian§W§!"
 tank_ger_modern_chassis_aa_1_desc: "Использование спаренных 37-мм автопушек значительно повысило противовоздушный потенциал машины. Однако использование более тяжелого шасси Panther в качестве основы для SPAA привело к удорожанию производства."

 tank_ger_modern_chassis_aa_3: "§W§!Flakpanzer E-50§W§!"
 tank_ger_modern_chassis_aa_3_short_desc: "TFlakpanzer E-50 использует сдвоенные 5,5-см пушки в полностью закрытой башне. Он очень эффективен для сбивания вражеских самолетов, но относительно дорог для своих возможностей.\n§RЭта модель может быть конвертирована, но не сохранит эффективность от E-50§!"


 tank_ger_heavy_chassis_0: "§W§!VK 30.01§W§!"
 tank_ger_heavy_chassis_0_desc: "\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_heavy_chassis_1: "§W§!VK 36.01§W§!"
 tank_ger_heavy_chassis_1_desc: "\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_heavy_chassis_2: "§W§!Tiger I P§W§!"
 tank_ger_heavy_chassis_2_desc: "Еще одна конструкция Tiger I, модель Porsche, включает в себя дополнительную броню ценой снижения скорости и надежности и роста стоимости производства. По этим причинам многие предпочитают модель Henschel за ее большую универсальность.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 ger_heavy_2: "Tiger P"

 tank_ger_heavy_chassis_3: "§W§!Tiger I§W§!"
 tank_ger_heavy_chassis_3_desc: "Главный немецкий тяжелый танк, Tiger I, создан для борьбы с вражескими танками на дальних дистанциях. Обладая превосходным сочетанием огневой мощи и брони, он является королем поля боя, способным пробить практически любой вражеский танк, оставаясь при этом практически непробиваемым. Хотя он очень силен, его производство обходится очень дорого.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_heavy_chassis_4: "§W§!Tiger II§W§!"
 tank_ger_heavy_chassis_4_desc: "Известный также как "Королевский тигр", Tiger II является вершиной немецкой конструкции тяжелых танков. Его чрезвычайно толстая наклонная броня делает его практически неуязвимым для вражеских наземных подразделений, а тяжелое вооружение позволяет быстро справиться с ними. К сожалению, производство этого танка требует значительного времени и усилий.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_heavy_chassis_5: "§W§!Löwe§W§!"

 tank_ger_heavy_chassis_6: "§W§!E-75§W§!"
 tank_ger_heavy_chassis_6_desc: "Серия E - это попытка стандартизировать детали немецких бронемашин для повышения надежности и эффективности производства. E-75 предназначен для замены Tiger II и Jagdtiger и в значительной степени опирается на их конструкцию. На нем установлена более крупная версия башни Tiger II и улучшенная скорострельная 10,5-см пушка. Кроме того, усилена броневая защита во всех точках машины."

 tank_ger_heavy_chassis_6_2: "§W§!E-75M§W§!"
 tank_ger_heavy_chassis_6_2_desc: "Дальнейшая модернизация брони E-75 сделала E-75 M непробиваемым для любого противотанкового оружия. Кроме того, его огневая мощь чрезвычайно велика и способна уничтожить практически любого противника, с которым он может столкнуться на поле боя. Однако за это приходится платить, так как танк очень дорог в производстве в больших количествах."


 heavy_tank_destroyer_chassistank_ger_heavy_chassis_1: "§W§!Sturer Emil§W§!"
 heavy_tank_destroyer_chassistank_ger_heavy_chassis_2: "§W§!Ferdinand§W§!"
 heavy_tank_destroyer_chassistank_ger_heavy_chassis_4: "§W§!Jagdtiger§W§!"
 heavy_tank_destroyer_chassistank_ger_heavy_chassis_6: "§W§!Jagdpanzer E-75§W§!"
 heavy_tank_infantry_support_chassis_tank_ger_heavy_chassis_0: "§W§!Vk 30 01§W§!"
 heavy_tank_infantry_support_chassis_tank_ger_heavy_chassis_1: "§W§!Vk 36 01§W§!"
 heavy_tank_assault_chassistank_ger_heavy_chassis_1: "§W§!Vk 36 02§W§!"
 heavy_tank_assault_chassistank_ger_heavy_chassis_3: "§W§!Sturmtiger§W§!"
 heavy_tank_artillery_chassistank_ger_heavy_chassis_4: "§W§!GW Tiger§W§!"
 heavy_tank_artillery_chassistank_ger_heavy_chassis_6: "§W§!GW E-75§W§!"

 tank_ger_heavy_chassis_td_1: "§W§!Sturer Emil§W§!"
 tank_ger_heavy_chassis_td_1_desc: "Как и Nashorn, Sturer Emil использует в противотанковой войне подход "стеклянной пушки". Его пробивные орудия способны пробить любую бронемашину, которую он встретит на поле боя. При этом броня у него минимальна, поэтому он сам может быть пробит. Установка крупного 12,8-см орудия создает большую нагрузку на танк, что приводит к серьезным проблемам с ответственностью."

 tank_ger_heavy_chassis_td_2: "§W§!Ferdinand§W§!"
 tank_ger_heavy_chassis_td_2_desc: "Ferdinand - это дорогостоящая машина, которая очень хорошо бронирована и способена пробить практически все машины противника. Бензоэлектрическая трансмиссия, перенесенная с Tiger (P), облегчала регулировку двигателей, но часто приводила к механическим поломкам, особенно из-за чрезмерного веса машины."

 tank_ger_heavy_chassis_td_4: "§W§!Jagdtiger§W§!"
 tank_ger_heavy_chassis_td_4_desc: "Способный превзойти и перегнать любую современную машину на поле боя, Jagdtiger представляет собой образцовое сочетание огневой мощи и брони. За его боевую мощь приходится платить, так как машина крайне медлительна и подвержена некоторым проблемам с надежностью."

 tank_ger_heavy_chassis_td_6: "§W§!Jagdpanzer E-75§W§!"
 tank_ger_heavy_chassis_td_6_desc: "Продолжая дело Jagdtiger, Jagdpanzer E-75 продолжает стремиться к более крупным и тяжелым конструкциям. Улучшив некоторые проблемы надежности своих предшественников, E-75 получил еще больше брони, что делает его пробиваемым только самыми крупными противотанковыми орудиями."

 tank_ger_heavy_chassis_td_6_2: "§W§!Jagdpanzer E-75M§W§!"
 tank_ger_heavy_chassis_td_6_2_desc: "TJagdpanzer E-75 Ausf. M не может быть пробит ничем, но может пробить почти все. В любой дуэли один на один Jagdpanzer E-75M выйдет победителем. Даже несмотря на столь массивную машину, упрощенная конструкция каземата означает, что ее производство дешевле, чем можно было бы ожидать."

 tank_ger_heavy_chassis_infantry_support_0: "§W§!Vk 30.01§W§!"
 tank_ger_heavy_chassis_infantry_support_0_desc: "Тяжелый танк поддержки пехоты\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§! "

 tank_ger_heavy_chassis_infantry_support_1: "§W§!Vk 36.01 B§W§!"
 tank_ger_heavy_chassis_infantry_support_1_desc: "Тяжелый танк поддержки пехоты\n VK 36.01 значительно повышает боевые возможности немецких тяжелых танков в плане огневой мощи и защиты.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_heavy_chassis_assault_3: "§W§!Sturmtiger§W§!"
 tank_ger_heavy_chassis_assault_3_desc: "Тяжелое штурмовое орудие\nВозможность приводить в движение 376-килограммовый реактивный снаряд, способный мгновенно сравнять с землей целые городские кварталы во время плотных городских боев, позволяет танку Sturmtiger оставаться в живых. Этот танк предназначен для ведения боя на очень близких дистанциях, и для того, чтобы остаться в живых, ему требуется большое количество брони. Из-за необходимости вести бой на близких дистанциях и кропотливого процесса перезарядки Sturmtiger страдает от недостаточной пробиваемости и защиты."

 tank_ger_heavy_chassis_assault_4: "§W§!Sturmtiger Bär§W§!"
 tank_ger_heavy_chassis_assault_4_desc: "Тяжелое штурмовое орудие\n"

 tank_ger_heavy_chassis_spg_4: "§W§!GW Tiger§W§!"
 tank_ger_heavy_chassis_spg_4_desc: "GW Tiger - очень громоздкая машина и, как следствие, имеет слабую защиту и пробиваемость. У него есть небольшие улучшения в броне и противопехотной атаке, но они очень незначительны.\n§RЭта модель может быть конвертирована, но не сохранит эффективность от Tiger II§!"

 tank_ger_heavy_chassis_spg_6: "§W§!GW E-75§W§!"
 tank_ger_heavy_chassis_spg_6_desc: "В GW E-75 добавлено значительное количество брони по сравнению с предшественником. Пробитие также значительно улучшено и стало более надежным для уничтожения машин с мягкой оболочкой.\n§RЭта модель может быть конвертирована, но не сохранит эффективность от E-75§!"

 tank_ger_heavy_chassis_spg_6_2: "§W§!GW E-75M§W§!"
 tank_ger_heavy_chassis_spg_6_2_desc: "GW E-75 Ausf. M добавляет еще больше брони, позволяя этой САУ выдерживать попадания из противотанковых орудий среднего уровня.\n§GЭто позволит сохранить 95% эффективности от GW E-75§!"




 tank_ger_super_heavy_chassis_1: "§W§!Maus§W§!"
 tank_ger_super_heavy_chassis_1_desc: "Делая упор на борьбу танка с танком, Maus жертвует всеми понятиями о подвижности ради брони и пробития. Несмотря на то что он очень эффективен в бою против других танков, его громоздкие размеры делают его легкой мишенью на поле боя. Это приводит к низкой защите, которая позволяет танку быть уничтоженным при достаточном количестве подавляющего огня со стороны воздушных и наземных сил."

 tank_ger_super_heavy_chassis_2: "§W§!E-100§W§!"
 tank_ger_super_heavy_chassis_2_desc: "Серия E - это попытка стандартизировать детали немецких бронемашин для повышения надежности и эффективности производства. E-100 предназначен для замены сверхтяжелого танка Maus. Было сделано несколько упрощений, чтобы значительно снизить производственные затраты и при этом повысить боевую эффективность."



 tank_designer_scout_car_chassis: "Разведывательный автомобиль"
 tank_designer_combat_car_chassis: "Боевой автомобиль"
