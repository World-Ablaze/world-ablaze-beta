 tank_jap_medium_chassis_td_3: "§W§!Ho-Ni TD§W§!"
 tank_jap_medium_chassis_td_3_desc: "Хотя Ho-Ni TD и не является лучшей пт-сау, он способен пробить почти все уровни средней брони. Как и большинство японских танков, он не имеет значительной брони и сам подвержен риску быть пробитым."

 tank_jap_medium_chassis_td_5: "§W§!Ho-Nu§W§!"
 tank_jap_medium_chassis_td_5_desc: "Ho-Nu является почти точной копией своего предшественника, но увеличивает жесткость машины за счет замены рубки с открытым верхом на закрытую башню. Однако это приводит к увеличению стоимости производства."

 tank_jap_medium_chassis_td_5_2: "§W§!Chi-Ha 120mm TD§W§!"
 tank_jap_medium_chassis_td_5_2_desc: ""

 tank_jap_medium_chassis_td_6: "§W§!Ka-To§W§!"
 tank_jap_medium_chassis_td_6_desc: "Будучи пт-сау с открытой рубкой, Ka-To способен разместить на своем корпусе чрезвычайно крупное орудие. Способный пробить практически любой танк своего времени, этот истребитель танков отлично справляется с поставленными перед ним задачами. Несмотря на довольно низкую для машины своего времени броню, она значительно превосходит броню других японских танков."

 tank_jap_medium_chassis_td_7: "§W§!Ho-Ri§W§!"
 tank_jap_medium_chassis_td_7_desc: "Используя то же орудие, что и предыдущий Ka-To, Ho-Ri не так эффективен в пробитии танков своего времени. С добавлением еще одного лобового орудия повышается защита от пехоты."

 tank_jap_medium_chassis_infantry_support_3: "§W§!Chi-Ha 120§W§!"
 tank_jap_medium_chassis_infantry_support_3_desc: "Танк поддержки пехоты\nТанк Chi-Ha 130 оснащен короткоствольным 120-мм орудием. Хотя он и обеспечивает небольшое увеличение огневой мощи по сравнению с предыдущей моделью Ho-I, он жертвует несколькими другими характеристиками, наиболее заметными в области бронезащиты. На данный момент этот танк довольно сильно устарел."

 tank_jap_medium_chassis_infantry_support_5: "§W§!Ho-I§W§!"
 tank_jap_medium_chassis_infantry_support_5_desc: "Танк поддержки пехоты\nРазработанное как самоходная гаубица, это штурмовое орудие обеспечивает пехоте отличную огневую поддержку в ближнем бою. Несмотря на снижение прорывных и противотанковых возможностей, оно отлично справляется с уничтожением пехотных подразделений противника."

 tank_jap_medium_chassis_spg_3: "§W§!Ho-Ni§W§!"
 tank_jap_medium_chassis_spg_3_desc: "Ho-Ni - это очень слабая САУ, не имеющий никаких существенных статистических характеристик. Он слабо бронирован и имеет крайне ограниченные огневые возможности для своих размеров и стоимости. Если он и будет использоваться в бою, то только против легковооруженной пехоты."

 tank_jap_medium_chassis_spg_5: "§W§!Ho-Ro§W§!"
 tank_jap_medium_chassis_spg_5_desc: "Вдохновленный немецкими САУ, такими как Grille, Ho-Ro обладает повышенными боевыми характеристиками. Несмотря на то, что он сильно отстает от других крупных стран, он все еще может хорошо служить в качестве противопехотного орудия."

 tank_jap_medium_chassis_spg_7: "§W§!Ho-Chi§W§!"
 tank_jap_medium_chassis_spg_7_desc: "Значительные улучшения в пробитии и защите по сравнению с предыдущими моделями штурмовых орудий позволяют Ho-Chi участвовать в длительных боях. По сравнению с другими штурмовыми орудиями, у него очень слабая броня, что может стать проблемой в бою с хорошо оснащенным противником."

 tank_jap_medium_chassis_aa_5: "§W§!Ta-Ha§W§!"
 tank_jap_medium_chassis_aa_5_desc: "Благодаря использованию двух 37-мм зенитных орудий на увеличенном корпусе, эта модель ЗСУ значительно лучше сбивает вражеские самолеты, однако она сильно устарела."




 tank_jap_modern_chassis_1: "§W§!Chi-Ri Kai§W§!"
 tank_jap_modern_chassis_1_desc: "Модернизированная версия Chi-Ri обеспечила значительную бронезащиту без ущерба для мобильности. Небольшие улучшения других характеристик также были сделаны благодаря урокам, полученным в боях.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_modern_chassis_2: "§W§!Chi-Ru§W§!"
 tank_jap_modern_chassis_2_desc: "§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_modern_chassis_3: "§W§!Chi-O§W§!"
 tank_jap_modern_chassis_3_desc: "§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 modern_tank_destroyer_chassistank_jap_modern_chassis_1: "§W§!Ho-Go TD§W§!"
 modern_tank_artillery_chassistank_jap_modern_chassis_1: "§W§!Ho-Go§W§!"
 modern_tank_aa_chassistank_jap_modern_chassis_1: "§W§!Ta-Ri§W§!"

 tank_jap_modern_chassis_td_1: "§W§!Ho-Go TD§W§!"
 tank_jap_modern_chassis_td_1_desc: "По большинству параметров Ho-Go TD хуже, чем предшествующий Ho-Ri. Добавление башни повышает гибкость и маневренность в бою, но при этом танк вынужден жертвовать несколькими элементами своего боевого потенциала."

 tank_jap_modern_chassis_spg_1: "§W§!Ho-Go§W§!"
 tank_jap_modern_chassis_spg_1_desc: "Дешевая современная САУ, Ho-Go слабо бронирован, но при этом обладает неплохими наступательными возможностями. Лучше всего работает только против пехоты."

 tank_jap_modern_chassis_aa_1: "§W§!Ta-Ri§W§!"
 tank_jap_modern_chassis_aa_1_desc: "Как и его предшественники, Ta-Ri представляет собой большой скачок в развитии японской самоходной зенитной установки. Хотя она также устарела, от нее все еще можно ожидать, что она не отстанет по огневой мощи."




 tank_jap_heavy_chassis_1: "§W§!Type 91§W§!"
 tank_jap_heavy_chassis_1_desc: "Дорогой в производстве, медленный и трудно координируемый тяжелый танк Type 91 сильно устарел. Его можно использовать только против плохо оснащенной пехоты, поскольку его броня и огневая мощь крайне недостаточны. Кроме того, Type 91 задает тенденцию, характерную для многих японских тяжелых танков, - наличие нескольких башен. В то время как большинство крупных стран отказываются от такой конструкции в самом начале войны, Япония использует ее на многих машинах.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_heavy_chassis_2: "§W§!Type 95 Ro-Go§W§!"
 tank_jap_heavy_chassis_2_desc: "Продолжая трехбашенную конструкцию Type 91, Type 95 решает одну из проблем своего предшественника, значительно повышая бронезащиту. Хотя есть и небольшие улучшения в огневой мощи, они незначительны.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_heavy_chassis_3: "§W§!Ju-I§W§!"
 tank_jap_heavy_chassis_3_desc: "Продолжая трехбашенную конструкцию, Mitsu 104 оснащен 75-мм низкоскоростной пушкой, предназначенной для борьбы с пехотой. Снижение избыточной массы позволяет танку повысить мобильность, а улучшенное вооружение дает небольшие бонусы к общему наступательному потенциалу.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_heavy_chassis_4: "§W§!Ju-Ro§W§!"

 tank_jap_heavy_chassis_5: "§W§!Chi-Se§W§!"
 tank_jap_heavy_chassis_5_desc: "Chi-Se - это ответвление от Chi-Ri, но в нем сделан значительный упор на броневую защиту. Броня является значительным усовершенствованием и позволяет танку быть на одном уровне с современными танками других крупных стран, но при этом делает его производство значительно дороже.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_heavy_chassis_5_2: "§W§!Chi-Se Kai§W§!"
 tank_jap_heavy_chassis_5_2_desc: "\n§GЭто позволит сохранить 95% эффективности от Chi-Se§!"

