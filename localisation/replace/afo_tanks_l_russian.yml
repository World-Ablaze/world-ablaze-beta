 tank_fra_modern_chassis_td_2: "§W§!CDA Lorraine Mle 51§W§!"
 tank_fra_modern_chassis_td_2_desc: "Mle 51, оснащенный теми же разрушительными 90-мм орудиями, что и ARL 44, но при этом гораздо более мобильный, надежный и легко производимый, несомненно, станет важнейшей частью любой французской танковой дивизии, стремящейся бороться с тяжелой немецкой бронетехникой."

 tank_fra_modern_chassis_td_3: "§W§!AMX-AC 48§W§!"
 tank_fra_modern_chassis_td_3_desc: "Под влиянием немецких пт-сау в AMX-AC 48 имеет очень мощную лобовую броню и хорошее орудие. Его пробиваемость эквивалентна AMX-50 100, от которого он произошел, но он гораздо дешевле и прочнее. Отличительной особенностью машины были три 20-мм пулемета MG 151/20, установленные сверху боевого отделения и сзади."

 tank_fra_modern_chassis_td_4: "§W§!AMX-CDA§W§!"
 tank_fra_modern_chassis_td_4_desc: "AMX-CDA - это тяжелобронированный истребитель танков, способный пробить большую часть вражеской брони, но при этом доступный и быстрый."

 tank_fra_modern_chassis_td_5: "§W§!AMX-50 Foch§W§!"
 tank_fra_modern_chassis_td_5_desc: "Продолжая линию серии AMX-AX, Foch делает упор на тяжелую лобовую броню и мощное орудие, размещенное в каземате. У него очень высокая броня и пробиваемость для такой стоимости."

 tank_fra_modern_chassis_spg_2: "§W§!Lorraine 155 50§W§!"
 tank_fra_modern_chassis_spg_2_desc: "Эффективная и надежная САУ Lorraine 155 50 использует свое 155-мм орудие для уничтожения вражеской пехоты при относительно низкой себестоимости. Это одна из немногих САУ, обладающих столь высокой скорострельностью, но ради этого приходится жертвовать некоторой мощностью."

 tank_fra_modern_chassis_spg_2_2: "§W§!Lorraine 155 51§W§!"
 tank_fra_modern_chassis_spg_2_2_desc: "Lorraine 155 51 сохраняет и улучшает скорость своего предшественника, одновременно увеличивая возможности его вооружения. Чтобы сохранить скорость, его орудие не так развито, как у других САУ того времени."

 tank_fra_modern_chassis_spg_6: "§W§!BC 155 55§W§!"
 tank_fra_modern_chassis_spg_6_desc: "На этом САУ установлена турель, позволяющая менять цели без перемещения всей машины. Это позволяет эффективно использовать орудие на поле боя, но при этом приходится жертвовать броней САУ и стоимостью производства."

 tank_fra_modern_chassis_spg_6_2: "§W§!BC 155 58§W§!"
 tank_fra_modern_chassis_spg_6_2_desc: "Bat Chatillon 155 58 - очень быстрая машина, но у нее не самые лучшие показатели брони и легкой атаки. Он может эффективно использоваться в мобильных подразделениях, но при использовании на передовой его необходимо беречь."

 tank_fra_modern_chassis_assault_2: "§W§!CDA Lorraine Mle 52§W§!"
 tank_fra_modern_chassis_assault_2_desc: "Штурмовое орудие\nКаземат с крутым наклоном броневых листов позволяет Mle 52 сохранять большую часть бронезащиты машины, на которой он базируется. В сочетании с чудовищным 155-мм орудием Mle 52 становится грозной угрозой для хорошозащищенных позиций противника."



 tank_fra_heavy_chassis_1: "§W§!Char B1§W§!"
 tank_fra_heavy_chassis_1_desc: "Char B1 предназначен для прорыва стратегических позиций в траншеях и укреплениях. Благодаря своей броне он имеет репутацию непобедимого на поле боя. Однако недостаток огневой мощи и маневренности приводит к тому, что танк плохо приспособлен для борьбы с чем-либо, кроме пехоты. Кроме того, у него типичная для французов башня, рассчитанная на одного человека, что приводит к тому, что командир легко перегружается ответственностью на поле боя."

 tank_fra_heavy_chassis_1_2: "§W§!Char B1 bis§W§!"
 tank_fra_heavy_chassis_1_2_desc: "Char B1 bis - это модернизированный вариант раннего Char B1, получивший усиленное бронирование спереди и по бокам. Оригинальная 47-мм пушка SA 35 (L/32) Char B1 была расширена для обеспечения противотанковых возможностей. Благодаря более длинному стволу и усиленному бронированию, этот танк больше подходит для противотанковой роли. Эти танки также переоснащены более мощными двигателями, обеспечивающими столь необходимое увеличение скорости танка."

 tank_fra_heavy_chassis_1_3: "§W§!Char B1 ter§W§!"
 tank_fra_heavy_chassis_1_3_desc: "Этот вариант тяжелого танка Char B1 оснащен дополнительной броней. Также предусмотрено место для механика-водителя, что делает танк чрезвычайно надежным в полевых условиях."

 tank_fra_heavy_chassis_2: "§W§!BDR G1§W§!"
 tank_fra_heavy_chassis_2_desc: "BDR G1 представляет собой значительный отход от стандартной философии французских тяжелых танков. Он жертвует броней и противопехотным вооружением ради оснащения чрезвычайно мощной противотанковой пушкой с улучшенным пробитием и противотанковой атакой."

 tank_fra_heavy_chassis_3: "§W§!ARL 43§W§!"
 tank_fra_heavy_chassis_3_desc: "Благодаря большому наклонному лобовому листу ARL 43 обеспечивает отличную бронезащиту для той эпохи. Однако там, где он превосходит по броне, ему не хватает пробиваемости и надежности: быстро устаревающая пушка SA44 и ненадежная трансмиссия."

 tank_fra_heavy_chassis_3_2: "§W§!ARL 44§W§!"
 tank_fra_heavy_chassis_3_2_desc: "Значительно усовершенствованный по сравнению со своим предшественником, ARL 44 был разработан после освобождения материковой части Франции для быстрого продвижения устаревшей танковой программы. Доработки с использованием опыта военного времени привели к ошеломляющим улучшениям в наступательной и оборонительной областях, сделав этот танк одним из лучших тяжелых танков. Однако проблемы с хрупкой коробкой передач, подвеской и тормозами приводят к тому, что танк склонен к ненадежности."

 tank_fra_heavy_chassis_4: "§W§!FCM 50§W§!"
 tank_fra_heavy_chassis_4_desc: "Сочетая в себе множество традиционных французских танковых идей с немецкими идеями, FCM 50t является очень хорошей наступательной машиной. Хотя по сравнению с другими современными тяжелыми танками этот танк немного выше среднего, он жертвует броней, чтобы сохранить высокую максимальную скорость."

 tank_fra_heavy_chassis_5: "§W§!AMX-M4 49§W§!"
 tank_fra_heavy_chassis_5_desc: "AMX-M4 49 отличается от большинства других французских танков. Он имеет внушительное количество лобовой брони и очень мощное орудие, способное пробивать большинство вражеских целей. Следует отметить, что эти изменения делают танк значительно медленнее."

 tank_fra_heavy_chassis_6: "§W§!AMX-M4 54§W§!"
 tank_fra_heavy_chassis_6_desc: "Эта модель AMX-M4 имеет улучшенную броню, что делает ее неуязвимой практически для любого оружия. Его производство очень дорого, но в бою он показывает отличные результаты."

 heavy_tank_assault_chassistank_fra_heavy_chassis_3: "§W§!ARL V§W§!"

 tank_fra_heavy_chassis_assault_1: "§W§!ARL V39§W§!"
 tank_fra_heavy_chassis_assault_1_desc: "Штурмовое орудие\nДля удовлетворения потребности французской армии в самоходном орудии, ARL V39 оснащен мощным орудием, размещенным в неподвижном каземате. Такая конструкция делает танк простым и дешевым в производстве. По боевым характеристикам ARL V39 заметно выигрывает в противопехотной атаке, но проигрывает в пробитии, бронировании и противотанковом мастерстве."

 tank_fra_heavy_chassis_assault_3: "§W§!ARL V43§W§!"
 tank_fra_heavy_chassis_assault_3_desc: "Штурмовое орудие Замена башни ARL 43 на коробчатый каземат позволила установить мощное 105-мм орудие. Хотя V43 не представляет особой угрозы для вражеской бронитехники, она отлично проявляет себя при атаке укрепленных позиций, а также гораздо надежнее, чем машина, на которой она базируется."



 tank_fra_super_heavy_chassis_1: "§W§!Char 2C§W§!"
 tank_fra_super_heavy_chassis_1_desc: "Несмотря на 6 членов экипажа, благодаря многоствольной конструкции многие члены экипажа выполняли функции заряжающих и наводчиков, что значительно затрудняло координацию действий. Основным орудием танка является 75-мм пушка, способная наносить большой урон. Хотя Char 2C может пробить почти все вражеские броневые единицы, большой профиль танка делает его легкой мишенью, а сам танк страдает от очень низких пробития и защиты."

 tank_fra_super_heavy_chassis_2: "§W§!FCM F1§W§!"
 tank_fra_super_heavy_chassis_2_desc: "Рассчитанный на вес около 140 тонн, этот сверхтяжелый танк способен прорвать самые мощные укрепления. Для своего времени это самый мощный танк, который можно было поставить на вооружение только с точки зрения сырой статистики. Он обладает огромной огневой мощью, исходящей из двух его башен, а его броня непробиваема для большинства других танков. Однако эти танки очень дороги в производстве, а их низкая скорость может привести к тому, что их будут обходить на поле боя."



