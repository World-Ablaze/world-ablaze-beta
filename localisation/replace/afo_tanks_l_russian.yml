 tank_fra_modern_chassis_1: "§W§!AMX-M4§W§!"
 tank_fra_modern_chassis_1_desc: "Соединяя линии средних и тяжелых танков, AMX-M4 45 объединяет их маневренность и боевые качества. Это задает тенденцию для будущих французских тяжелых танков, так как многие из них предпочитают мобильность ценой относительно низкой бронезащиты как у тяжелого танка. Он обладает отличными боевыми характеристиками, благодаря использованию элементов конструкции немецкого танка Tiger II."

 tank_fra_modern_chassis_2: "§W§!Lorraine 40 90§W§!"
 tank_fra_modern_chassis_2_desc: "Lorraine 40t сохранил качающуюся башню от танков AMX-и Bat-Chat. В связи с появлением противотанковых орудий с полым зарядом трудно сделать танк непробиваемым, не добавляя громоздкую броню. В результате Lorraine 40t имеет минимальную броню, полностью сосредоточившись на огневой мощи."

 tank_fra_modern_chassis_2_2: "§W§!Lorraine 40 100§W§!"
 tank_fra_modern_chassis_2_2_desc: "Lorraine 40t сохранил качающуюся башню от танков AMX-и Bat-Chat. В связи с появлением противотанковых орудий с полым зарядом трудно сделать танк непробиваемым, не добавляя громоздкую броню. В результате Lorraine 40t имеет минимальную броню, полностью сосредоточившись на огневой мощи."

 tank_fra_modern_chassis_3: "§W§!AMX-50 100§W§!"
 tank_fra_modern_chassis_3_desc: "Первый современный танк Франции, AMX-50 100 - первый французский танк тяжелого класса, получивший автопушку. Это позволило значительно улучшить как наступательный, так и оборонительный бой, сделав его одним из лучших танков. Как и его предшественник, AMX-M4 45, этот танк отдает предпочтение подвижности, а не бронезащите, продолжая французскую модель низкой бронезащиты на своих "тяжелых" танках."

 tank_fra_modern_chassis_4: "§W§!AMX-30§W§!"
 tank_fra_modern_chassis_4_desc: "AMX-30 продолжает убеждение французов в том, что попытки предотвратить бронепробитие путем добавления дополнительной брони будут слишком неэффективными. Вместо этого танк защищен своим малым профилем и высокой скоростью. Как и другие французские танки того времени, AMX-30 является очень хорошим танком с точки зрения боевых характеристик, но может оказаться уязвимым при столкновении с мощным противотанковым орудием."

 tank_fra_modern_chassis_5: "§W§!AMX-50 120§W§!"
 fra_modern_tank_chassis_3_desc: "AMX-50 120 оснащен 120-мм орудием, модернизированным со 100-мм, предназначенным для пробивания тяжелобронированных советских танков. В соответствии с современной французской танковой доктриной, AMX-50 120 обладает очень хорошей скоростью для своей весовой категории. Хотя броня танка отнюдь не слабая, его крупный профиль означает, что его очень легко поразить противотанковыми орудиями крупного калибра, которые гарантированно пробьют его."

