 tank_eng_scout_car_chassis_1: "Lanchester"
 tank_eng_scout_car_chassis_1_short: "Lanchester"
 tank_eng_scout_car_chassis_1_desc: "Lanchester обладает очень слабыми боевыми характеристиками из-за устаревшей конструкции и оборудования. Его лучше всего использовать в колониальных и гарнизонных операциях, и он может быть произведен относительно дешево, чтобы соответствовать этой нише."

 tank_eng_scout_car_chassis_2: "Daimler Dingo"
 tank_eng_scout_car_chassis_2_short: "Daimler Dingo"
 tank_eng_scout_car_chassis_2_desc: "Daimler Dingo - это очень легкий автомобиль-разведчик, предназначенный в первую очередь для разведки. Небольшой профиль машины не позволяет ей легко поражаться противотанковыми орудиями. Машина очень дешева в производстве и может использоваться повсеместно в дивизионных разведывательных ротах."

 tank_eng_scout_car_chassis_3: "Humber AC MK III"
 tank_eng_scout_car_chassis_3_short: "Humber AC"
 tank_eng_scout_car_chassis_3_desc: "Эта машина оснащена 37-мм пушкой и очень похожа на предшествующий ей бронеавтомобиль Daimler. Небольшие улучшения были сделаны в нескольких областях, но Humber потерял часть брони, чтобы быть еще более дешевым в производстве."

 tank_eng_scout_car_chassis_4: "Daimler Ferret MK I"
 tank_eng_scout_car_chassis_4_short: "Daimler Ferret MK I"
 tank_eng_scout_car_chassis_4_desc: "Daimler Ferret Mk I лишен почти всех боевых возможностей своих предшественников, в результате чего получилась очень быстрая машина, способная вести разведку. С таким подходом есть несколько проблем, поскольку дополнительная скорость не имеет значения, если он обгоняет силы, для которых обеспечивает разведку."

 tank_eng_scout_car_chassis_4_2: "Daimler Ferret MK II"
 tank_eng_scout_car_chassis_4_2_short: "Daimler Ferret MK II"
 tank_eng_scout_car_chassis_4_2_desc: "Улучшенная по сравнению с предыдущей моделью турель позволяет экипажу лучше видеть поле боя и обнаруживать вражеские цели. "

 tank_eng_combat_car_chassis_1: "Daimler AC"
 tank_eng_combat_car_chassis_1_short: "Daimler AC"
 tank_eng_combat_car_chassis_1_desc: "37-мм пушка и башня позволяют машине справляться с любыми легкими броневыми элементами, с которыми она может столкнуться."

 tank_eng_combat_car_chassis_2: "AEC AC Mk II"
 tank_eng_combat_car_chassis_2_short: "AEC AC"
 tank_eng_combat_car_chassis_2_desc: "6-фунтовое орудие этой бронированной машины способно справиться с легкой и средней броней. В то же время броня обеспечивает достойную защиту."

 tank_eng_combat_car_chassis_3: "Coventry AC"
 tank_eng_combat_car_chassis_3_short: "Coventry AC"
 tank_eng_combat_car_chassis_3_desc: "Coventry AC имеет минимальные усовершенствования по сравнению со своими предшественниками и предназначен в основном для колониальных и разведывательных целей. Он по-прежнему дешев в производстве и очень надежен."

 tank_eng_combat_car_chassis_4: "Alvis Saladin"
 tank_eng_combat_car_chassis_4_short: "Alvis Saladin"
 tank_eng_combat_car_chassis_4_desc: "Эта машина способна пробивать легкую броню, но вряд ли хорошо проявит себя в бою на передовой. Она очень эффективна в борьбе с хорошо оснащенными отрядами сопротивления."


 tank_eng_light_chassis_1: "§W§!Vickers Mk. VI§W§!"
 tank_eng_light_chassis_1_desc: "Этот танк послужил основой или источником вдохновения для большинства танков первых лет войны. Он не обладает значительной огневой мощью и броней, поэтому лучше всего подходит для выполнения полицейских функций в колониях. Многие проблемы танка, такие как малочисленный экипаж, неправильная балансировка и слабое оборудование, являются общими симптомами плохой конструкции ранних танков."

 tank_eng_light_chassis_2: "§W§!Tetrarch§W§!"
 tank_eng_light_chassis_2_desc: "Tetrarch был разработан для устранения недостатков предыдущих танков, которые ранее оснащались только пулеметами или относительно слабыми автопушками. Эта машина оснащена 2-фунтовым орудием, позволяющим пробивать броню среднего уровня. Хотя прорыв этого танка также хорош, низкие показатели брони, защиты и мягкой атаки сильно ограничивают его возможности.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_light_chassis_3: "§W§!Hopkins§W§!"
 tank_eng_light_chassis_3_desc: "Hopkins A25 пытается сохранить актуальность легких танков, добавляя большое количество брони, но сохраняя то же 2-фунтовое орудие от Tetrarch. К этому времени легкие танки уже практически устарели за пределами разведывательных функций. Эта машина не обладает хорошими наступательными характеристиками и имеет легко пробиваемую броню.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_light_chassis_4: "§W§!FV301§W§!"
 tank_eng_light_chassis_4_desc: "Разработанный только как разведывательная машина, FV301 имеет достойные характеристики для легкого танка, но они не идут ни в какое сравнение с модернизированными танками более тяжелых весовых категорий.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_light_chassis_5: "§W§!GSR Setter§W§!"
 tank_eng_light_chassis_5_desc: "Предназначенный в основном только для разведки, Setter жертвует большей частью брони ради высокой максимальной скорости и прорыва. Пробиваемость его орудия позволяет бороться с другими легкими танками, но с тяжелобронированными подразделениями ему придется нелегко.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_light_chassis_9: "§W§!M22 Locust§W§!"

 light_tank_artillery_chassistank_eng_light_chassis_3: "§W§!Alecto§W§!"
 light_tank_artillery_chassistank_eng_light_chassis_4: "§W§!FV304§W§!"

 tank_eng_light_chassis_spg_3: "§W§!Alecto§W§!"
 tank_eng_light_chassis_spg_3_desc: "Alecto обладает мощной оборонительной мощью, а его 3,75-дюймовая гаубица быстро расправляется с легкими целями. Благодаря легкому корпусу он очень мобилен в бою и дешев в производстве."

 tank_eng_light_chassis_spg_4: "§W§!FV304§W§!"
 tank_eng_light_chassis_spg_4_desc: "25-фунтовая пушка FV304 не обладает такой мощью, как большинство ПТУР конца войны, но сохраняет актуальность благодаря своей способности быстро перемещаться по полю боя. Он обеспечивает ценную статистику при обороне и дешев в производстве."




 tank_eng_medium_chassis_support_10: "§W§!Cruiser Mk I§W§!"
 tank_eng_medium_chassis_support_10_desc: "Танк поддержки\nCruiser Mk I положил начало линейке легких, мобильных крейсерских танков, предназначенных для прорыва вражеских линий и создания хаоса на коммуникациях и линиях снабжения. К сожалению, как первая попытка реализовать концепцию, медленный и неповоротливый Cruiser Mk I лучше справлялся с ролью поддержки пехоты, в чем ему помогало мощное 2-фунтовое орудие.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_medium_chassis_support_10_2: "§W§!Cruiser Mk II§W§!"
 tank_eng_medium_chassis_support_10_2_desc: "Танк поддержки\nСохранив универсальное орудие своего предшественника, Mk II получил усиленное бронирование по сравнению с Mk I, что стало возможным благодаря снятию устаревших вспомогательных башен. Однако, относительно маломощный двигатель AEC также был сохранен, что означает, что Mk II также сохранил более низкую скорость Mk I.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_support_11: "§W§!Valentine Mk III§W§!"
 tank_eng_medium_chassis_support_11_desc: "Танк поддержки\nТанк Valentine - это попытка дать танку весовой категории крейсерских танков броню уровня Matilda. Valentine Mk III имеет немного меньшую броню, чем Matilda, но при этом дешевле в производстве, обеспечивая те же наступательные характеристики.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_medium_chassis_support_11_2: "§W§!Valentine Mk X§W§!"
 tank_eng_medium_chassis_support_11_2_desc: "Танк поддержки\nТанк Mk X улучшил модель Mk III, увеличив мощность двигателя и добавив 6-фунтовое орудие. Однако усиленная броня танка не имеет значения по сравнению с потерей подвижности относительно современных ему средних танков.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_support_11_3: "§W§!Valentine Mk XI§W§!"
 tank_eng_medium_chassis_support_11_3_desc: "Танк поддержки\nВведение новых снарядов и улучшение средств связи позволяют танку более эффективно координировать действия и атаковать во время боя.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_1: "§W§!Cruiser Mk III§W§!"
 tank_eng_medium_chassis_1_desc: "С появлением Mk III концепция крейсерского танка воплотилась в быстрый и проворный танк, каким он задумывался с самого начала. Оснащенный вездесущим 2-фунтовым орудием, он эффективен в борьбе с вражеской бронетехникой, но сам легко пробивается, страдает от проблем с надежностью и менее приспособлен для поддержки пехоты.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_medium_chassis_1_2: "§W§!Cruiser Mk IV§W§!"
 tank_eng_medium_chassis_1_2_desc: "Этот вариант крейсерского танка имеет то же орудие, что и его предшественник, но при этом заметно улучшает слабые места Mk III в надежности и броне. Унификация деталей с Mk III обеспечивает все ту же дешевизну производства.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_2: "§W§!Covenanter§W§!"
 tank_eng_medium_chassis_2_desc: "Covenanter сохранил 2-фунтовое орудие, использовавшееся на предыдущих британских крейсерских танках, но танк способен пробивать большинство уровней средней брони. Он продолжает совершенствовать броню своих предшественников, но ее уровень недостаточно высок, чтобы защитить от любого мощного противотанкового оружия.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_medium_chassis_3: "§W§!Crusader Mk I§W§!"
 tank_eng_medium_chassis_3_desc: "Crusader улучшает орудие линейки крейсерских танков, позволяя ему лучше справляться как с небронированными, так и с бронированными целями. Это хороший универсальный танк для использования в маневрах быстрого прорыва.\n\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§! §OЭто позволит сохранить 90% эффективности от модели $tank_eng_medium_chassis_2$§!"

 tank_eng_medium_chassis_3_2: "§W§!Crusader Mk III§W§!"
 tank_eng_medium_chassis_3_2_desc: "Вариант Mk III в большей степени ориентирован на борьбу с бронетехникой, чем его предшественники. Броня в виде бортовых экранов и вооружение в виде 6-фунтового орудия позволяют добиться гораздо большей боевой эффективности. Он способен на равных противостоять практически всем видам вражеской бронетехники того времени.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_4: "§W§!Cavalier§W§!"
 tank_eng_medium_chassis_4_desc: "Этот танк усовершенствован по сравнению с Crusader: броня значительно увеличена, что обеспечивает значительную защиту от слабого противотанкового оружия. Улучшенные фугасные и бронебойные снаряды также позволяют ему наносить серьезный урон всем наземным подразделениям.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_medium_chassis_4_2: "§W§!Cromwell§W§!"
 tank_eng_medium_chassis_4_2_desc: "Танк Cromwell создан исключительно как наступательная машина. Он не имеет улучшенной брони и оснащен мощным двигателем Rolls-Royce Meteor, обеспечивающим ему очень высокую подвижность. Оснащенный 75-мм орудием двойного назначения, он способен с относительной легкостью поражать любые вражеские цели. Низкий профиль позволяет ему скрываться от глаз и снижать вероятность поражения.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_5: "§W§!Comet§W§!"
 tank_eng_medium_chassis_5_desc: "Высокоскоростное 17-фунтовое орудие Comet и использование недавно разработанных бронебойных подкалиберных снарядов с отделяемым поддоном позволяют танку пробивать такие тяжелобронированные цели, как Tiger и Panther. Танк также превосходит по броне Cromwell, но вынужден жертвовать маневренностью. Опыт производства нескольких аналогичных танков также делает эту британскую разработку чрезвычайно надежной.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_medium_chassis_7: "§W§!M3 Grant§W§!"

