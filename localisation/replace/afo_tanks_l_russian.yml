 tank_pol_modern_chassis_1: "§W§!CS-53§W§!"
 tank_pol_modern_chassis_1_desc: "Сильно изменив вооружение по сравнению со своими предшественниками, CS-53 представляет собой мощный танк, способный пробивать широкий круг врагов своим 100-мм орудием. Это хорошо оснащенная машина, способная выполнять роль основного боевого танка."

