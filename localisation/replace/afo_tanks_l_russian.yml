 heavy_tank_assault_chassistank_sov_heavy_chassis_4: "§W§!ИСУ-152§W§!"
 heavy_tank_assault_chassistank_sov_heavy_chassis_5: "§W§!Объект 704§W§!"

 tank_sov_heavy_chassis_td_4: "§W§!ИСУ-122§W§!"
 tank_sov_heavy_chassis_td_4_desc: "На ИСУ-122 противотанковое вооружение установлено на корпусе ИС, а не на средних корпусах, которые часто используются для истребителей танков. В результате на него можно установить еще более тяжелое орудие и добавить дополнительную броню. Однако он стоит вдвое дороже СУ-100, хотя имеет лишь незначительные преимущества перед ним. Его стоит использовать только в том случае, если тяжелые танки остаются проблемой, несмотря на наличие СУ-100.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_td_5: "§W§!Объект 708§W§!"
 tank_sov_heavy_chassis_td_5_desc: "Объект 708 дает такой большой прирост к пробитию и броне, что это оправдывает его стоимость. Он обладает хорошими универсальными характеристиками и может эффективно сражаться с другими танками.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_td_7: "§W§!Объект 264§W§!"
 tank_sov_heavy_chassis_td_7_desc: "Добавление башни делает этот истребитель танков очень непохожим на большинство советских образцов. Его вооружение позволяет пробить практически любой танк, при этом он и сам обладает огромным количеством брони. Он также имеет приличный прорыв и мягкую атаку, что позволяет ему эффективно действовать рядом с ОБТ.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_td_8: "§W§!Объект 268§W§!"

 tank_sov_heavy_chassis_assault_2: "§W§!КВ-2§W§!"
 tank_sov_heavy_chassis_assault_2_desc: "Тяжелое штурмовое орудие\n КВ-2 хорошо бронирован и не может быть пробит ничем, кроме самых тяжелых противотанковых орудий. Несмотря на то, что танк оснащен 152-мм гаубицей, использующей в основном фугасные снаряды, его мощь может привести к полному разрушению конструкции вражеского танка. Имейте в виду, что танк тяжелый, а значит, его производство занимает много времени и он может страдать от некоторых проблем с надежностью. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_assault_3: "§W§!СУ-152§W§!"
 tank_sov_heavy_chassis_assault_3_desc: "Тяжелое штурмовое орудие\nПродолжая традицию универсальных советских штурмовых орудий, СУ-152 имеет очень хорошие показатели пробития и мягкой атаки. Кроме того, 152-мм орудие наносит значительно больший урон бронетехнике, чем предыдущие модели штурмовых орудий. С другой стороны, броня этой машины почти не улучшилась, что означает повышенный риск ее пробития.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_assault_4: "§W§!ИСУ-152§W§!"
 tank_sov_heavy_chassis_assault_4_desc: "Тяжелое штурмовое орудие\nПроект ИСУ-152 был очень похож на предыдущую модель СУ-152, но использовал шасси ИС вместо шасси КВ. Он обеспечивает небольшое улучшение брони и всех наступательных характеристик, но при этом становится дороже.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_assault_5: "§W§!Объект 704§W§!"
 tank_sov_heavy_chassis_assault_5_desc: "Тяжелое штурмовое орудие\nОбъект 704 использует другую версию 152-мм орудия с улучшенными снарядами. Оно способно пробить практически любой танк на поле боя, а также уничтожить любую пехоту. Танк также очень хорошо бронирован, но может быть пробит тяжелыми противотанковыми орудиями.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_spg_2: "§W§!212А§W§!"
 tank_sov_heavy_chassis_spg_2_desc: "Имея на вооружении 152-мм гаубицу Бр-2, 212А представляет собой малоподвижное самоходное орудие, способное наносить большой урон. Для САУ своего времени она достаточно хорошо бронирована, и можно ожидать, что она удержит позиции. Кроме того, она очень дешева в производстве для такой большой и мощной машины.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_spg_3: "§W§!С-51§W§!"
 tank_sov_heavy_chassis_spg_3_desc: "Эта САУ использует 203-мм гаубицу Б-4, а не прежнюю, меньшую 152-мм Бр-2. Чтобы лучше приспособить С-51 к роли платформы для дальнобойного оружия, с машины сняли большое количество брони, а корпус переделали так, чтобы он стал открытым. Это значительно снизило вес машины и сделало и без того дешевую машину еще дешевле.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_spg_7: "§W§!Объект 261§W§!"
 tank_sov_heavy_chassis_spg_7_desc: "На эту САУ установлено 180-мм морское орудие Б-1-П, обеспечивающее значительное увеличение противопехотной атаки по сравнению с предыдущими САУ. Однако эта модель значительно дороже, что ставит под сомнение целесообразность увеличения противопехотной атаки. Впрочем, другие боевые характеристики и общая мобильность также были улучшены.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_spg_8: "§W§!Объект 265§W§!"



