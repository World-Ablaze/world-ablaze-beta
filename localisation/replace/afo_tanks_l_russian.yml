 tank_jap_scout_car_chassis_1: "Type 92 Chiyoda"
 tank_jap_scout_car_chassis_1_short: "Chiyoda"
 tank_jap_scout_car_chassis_1_desc: "В качестве универсального бронеавтомобиля Type 92 Chiyoda служит для борьбы с партизанами, поддержки пехоты и разведки. Он не обладает достаточными боевыми характеристиками, но зато маневренен и очень дешев в производстве в больших количествах."

 tank_jap_scout_car_chassis_2: "Kani Soko Jidosha"
 tank_jap_scout_car_chassis_2_short: "Kani Soko Jidosha"
 tank_jap_scout_car_chassis_2_desc: ""


 tank_jap_light_chassis_1: "§W§!Sokosha§W§!"
 tank_jap_light_chassis_1_desc: "Известный также как тяжелый бронеавтомобиль Type 92, Sokosha - это кавалерийский танк, предназначенный для разведки и поддержки пехоты. Оснащенный только пулеметами, танк подходит только для борьбы с пехотой. Не стоит ожидать, что он сможет сражаться самостоятельно, поскольку он очень слабо бронирован и может быть пробит пехотой без поддержки буксируемого орудия. Кроме того, он крайне ненадежен и склонен к поломкам.\n§RЭто совершенно новая модель, которая сохраняет 75% эффективности по сравнению с предыдущими моделями§!"

 tank_jap_light_chassis_2: "§W§!Otsu Gata Sensha§W§!"
 tank_jap_light_chassis_2_desc: "§RЭто совершенно новая модель, которая сохраняет 75% эффективности по сравнению с предыдущими моделями§!"

 tank_jap_light_chassis_3: "§W§!Ha-Go§W§!"
 tank_jap_light_chassis_3_desc: "Этот легкий танк был разработан для поддержки моторизованной пехоты в общевойсковой войне. Он оснащен 37-мм танковой пушкой Type 94, способной пробивать очень легкую броню; однако он не предназначен для этой цели и должен использоваться для прорыва линий пехоты для поддержки наступления. Из-за особенностей экипажа командир может быть перегружен задачами. Кроме того, на танках отсутствовали радиостанции, а для связи между танками во время боя использовались флажковые сигналы, что затрудняло эффективное использование танка.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_light_chassis_3_2: "§W§!Ha-Go Kai§W§!"
 tank_jap_light_chassis_3_2_desc: "Более поздняя версия Ha-Go оснащена более новой 37-мм пушкой Type 98 для повышения противотанковой мощи и радиоантенной для лучшей координации наступательных действий. Несмотря на это, танк уступает почти всем легким танкам того времени и подходит только для борьбы с неполноценными противниками в Китае.\n§GЭто сохранит 95% эффективности предыдущей модели§!"

 tank_jap_light_chassis_3_3: "§W§!Ke-Nu§W§!"
 tank_jap_light_chassis_3_3_desc: "Type 4 Ke-Nu - это модернизированный танк Ha-Go с башней Chi-Ha. Хотя возможности прорыва против пехоты улучшились, башня среднего танка, установленная на корпус легкого танка, значительно утяжелила машину при незначительном улучшении бронезащиты.\n§GЭто сохранит 95% эффективности предыдущей модели§!"

 tank_jap_light_chassis_4: "§W§!Ke-Ni§W§!"
 tank_jap_light_chassis_4_desc: "Ke-Ni имеет более толстую наклонную броню и усовершенствованный двигатель. Более высокая пробиваемость позволяет ему бороться с другими легкими танками, которые можно встретить на Тихом океане, но нельзя ожидать, что он сможет сравниться со средними танками.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_light_chassis_4_2: "§W§!Ke-To§W§!"
 tank_jap_light_chassis_4_2_desc: "Ke-To создан на базе Ke-Ni, с тем же двигателем и подвеской, но со значительно увеличенной башней, в которой разместилась улучшенная 37-мм пушка. Хотя пробиваемость улучшена, изменения, скорее всего, слишком малы, чтобы существенно повлиять на ситуацию. К настоящему времени пушка уже слишком устарела, чтобы пробивать многие легкие танки.\n§GЭто сохранит 95% эффективности предыдущей модели§!"

 tank_jap_light_chassis_5: "§W§!Ke-Ho§W§!"
 tank_jap_light_chassis_5_desc: "Ke-Ho сочетает в себе башню Chi-Ha и корпус Ke-Ni. Большая башня обеспечивает достаточно места для обновленного орудия и более многочисленного экипажа, что позволяет значительно улучшить прорыв и пробиваемость. Следует отметить, что этот танк создан лишь как временная мера и может надежно бороться только с легкой броней.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_light_chassis_5_2: "§W§!Ke-Ho Kai§W§!"
 tank_jap_light_chassis_5_2_desc: "Стремясь продлить срок службы японских легких танков, на модель Ke-Ho установили улучшенное орудие и схему бронирования. Танк и остальная его линейка продолжают устаревать.\n§GЭто сохранит 95% эффективности предыдущей модели§!"

 tank_jap_light_chassis_6: "§W§!Ke-Ru§W§!"

