 heavy_tank_artillery_chassistank_jap_heavy_chassis_2: "§W§!Ro-Go SPG§W§!"

 tank_jap_heavy_chassis_td_5: "§W§!Ho-Ri Kai§W§!"
 tank_jap_heavy_chassis_td_5_desc: "Поздний вариант Ho-Ri получил значительное количество брони и пробития, что позволило ему эффективно бороться с вражескими танками."

 tank_jap_heavy_chassis_td_2: "§W§!Ji-Ro§W§!"

 tank_jap_heavy_chassis_assault_5: "§W§!Ho-O§W§!"
 tank_jap_heavy_chassis_assault_5_desc: "Тяжелое штурмовое орудие\nHo-O обладает приличной огневой мощью и броней, но уязвимо для подавляющего огня из-за своих больших размеров."

 tank_jap_heavy_chassis_spg_2: "§W§!Ro-Go SPG§W§!"
 tank_jap_heavy_chassis_spg_2_desc: "Несмотря на приличную огневую мощь, большие размеры делают его слишком легкой мишенью, что приводит к жалкой защите и прорыву. Кроме того, это чрезвычайно сложная конструкция, которую трудно бронировать и производить."



 tank_jap_super_heavy_chassis_0: "§W§!Ishi-108§W§!"
 super_heavy_tank_chassis_desc_0: "Сверхтяжелые танки."

 tank_jap_super_heavy_chassis_1: "§W§!O-I§W§!"
 jap_super_heavy_tank_chassis_1_desc: "Танк O-I очень хорошо бронирован и обладает высокой огневой мощью для борьбы как с вражеской бронетехникой, так и с пехотой. Однако у него есть и недостатки: огромные размеры и вес делают его медленным, дорогим в производстве и легко подбиваемым. Однако если эти танки занимают выгодную позицию, они могут нанести противнику огромный урон, при этом сами оставаясь относительно невредимыми."

 tank_jap_super_heavy_chassis_2: "§W§!O-Ro§W§!"
 tank_jap_super_heavy_chassis_2_desc: "Приоритетом O-Ro является дальнейшее увеличение брони и пробиваемости за счет других наступательных характеристик. Хотя он более надежен, чем O-I, стоимость производства продолжает стремительно расти."

 tank_jap_super_heavy_chassis_3: "§W§!O-Ha§W§!"

 tank_jap_super_heavy_chassis_4: "§W§!O-Ho§W§!"
 tank_jap_super_heavy_chassis_4_desc: "Дальнейшие усовершенствования брони делают этот танк непробиваемым для всех противотанковых орудий, кроме нескольких избранных. Следует отметить, что защита этой машины все еще очень низкая, поэтому она склонна к подавлению большим количеством вражеского огня."




