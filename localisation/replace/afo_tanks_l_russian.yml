 tank_pol_scout_car_chassis_1: "Wz.34"
 tank_pol_scout_car_chassis_1_short: "Wz.34"
 tank_pol_scout_car_chassis_1_desc: "WZ.34 - чрезвычайно мобильная машина, которая отлично справляется с ролью разведчика. По своим характеристикам он не уступает TKS, а его производство обходится очень дешево. Однако в этой линейке не хватает дальнейших модернизаций.\n§RЭто совершенно новая модель, которая не сохранит эффективность производства§!"

 tank_pol_scout_car_chassis_2: "Wz.40"
 tank_pol_scout_car_chassis_2_short: "Wz.40"
 tank_pol_scout_car_chassis_2_desc: "Модернизированный Wz.29 с заменой основного вооружения на 20-мм автопушку и более мощным двигателем, Wz.40 гораздо лучше подходит для роли разведчика и лучше справляется с пехотой.\n§RЭто совершенно новая модель, которая не сохранит эффективность производства§!"

 tank_pol_light_chassis_1: "§W§!TK-3§W§!"
 tank_pol_light_chassis_1_desc: "Созданный на базе шасси британского танкера Carden Lloyd, TK-3 представляет собой дешевый бронетранспортер с легким вооружением. Его пулеметное вооружение и крайне низкое количество брони не позволяют ему успешно выступать в какой-либо роли, кроме разведки, военной полиции или поддержки легкой пехоты.\n\n Хорошая скорость машины позволяет использовать ее при правильном маневрировании и расположении."

 tank_pol_light_chassis_2: "§W§!TKS§W§!"
 tank_pol_light_chassis_2_desc: "Оснащение TK-3 20-мм пушкой и превращение его в TKS значительно улучшило его пробиваемость и мягкость атаки, но он по-прежнему будет практически бесполезен против вражеской брони. Надежность также снизилась из-за более сложного и тяжелого основного вооружения."

 tank_pol_light_chassis_3: "§W§!PZinz 130§W§!"
 tank_pol_light_chassis_3_desc: "Прототип танка-амфибии, PZinz 130 очень быстр, но сохранил пушку от TKS, а требование к малому весу для амфибийных целей означает, что его броня также остается жалкой и тонкой."

 tank_pol_light_chassis_4: "§W§!PZinz 140§W§!"
 tank_pol_light_chassis_4_desc: "Являясь чисто сухопутной разработкой PZinz 130, 140-я модель получила незначительное увеличение брони и приличное повышение надежности и пробиваемости. В остальном он практически не отличается."

 tank_pol_light_chassis_4_2: "§W§!PZinz 180§W§!"
 tank_pol_light_chassis_4_2_desc: "После многих предыдущих разработок PZinz 180 Польша наконец-то получила то, что можно назвать современным легким танком. Все еще очень маленький и скоростной благодаря сохранению шасси от PZinz 140, он оснащен той же 37-мм пушкой, что и 10TP. Несмотря на то, что к моменту своего появления на вооружении он все еще не представляет угрозы для современных танков, его мощное усиление прорыва и жесткой атаки по сравнению с предшественниками, безусловно, позволит максимально использовать его в качестве разведывательной машины."

 light_tank_destroyer_chassistank_pol_light_chassis_1: "§W§!TKS-W§W§!"
 light_tank_destroyer_chassistank_pol_light_chassis_2: "§W§!TKS-D§W§!"
