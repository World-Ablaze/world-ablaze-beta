 tank_ita_scout_car_chassis_1: "AB 611 MG"
 tank_ita_scout_car_chassis_1_short: "AB 611"
 tank_ita_scout_car_chassis_1_desc: "AB 611 - это бронеавтомобиль, предназначенный в первую очередь для колониальных и полицейских функций. Поэтому он плохо подходит для боевых действий на передовой против хорошо оснащенной пехоты. Такие недостатки конструкции, как отсутствие смотровых отверстий, неадекватный двигатель и слабое вооружение, делают эту машину ужасной в использовании."

 tank_ita_scout_car_chassis_2: "AB S37"
 tank_ita_scout_car_chassis_2_short: "AB S37"
 tank_ita_scout_car_chassis_2_desc: "S37 попадет во многие ловушки, в которые попал AB 611, поскольку у него нет соответствующих средств для обеспечения экипажа достаточным обзором или огневой мощью. Одним из ключевых улучшений является двигатель, так как его максимальная скорость значительно возросла. Чтобы сделать итальянские машины жизнеспособными, необходимо внести еще много улучшений."

 tank_ita_scout_car_chassis_3: "AS 42"
 tank_ita_scout_car_chassis_3_short: "AS 42"
 tank_ita_scout_car_chassis_3_desc: "AS 42 - первый итальянский автомобиль, который стал эффективной боевой машиной. Его низкий профиль и высокая мобильность особенно хорошо подходят для скудных боевых действий в североафриканской пустыне. Одна из проблем конструкции заключается в относительно слабой броне."

 tank_ita_scout_car_chassis_4: "AS 43"
 tank_ita_scout_car_chassis_4_short: "AS 43"
 tank_ita_scout_car_chassis_4_desc: "Благодаря изменению конструкции корпуса, AS 43 теперь способен выдерживать больше попаданий, не неся потерь в бою. Некоторые показатели, такие как защита и прорыв, немного пострадали после переделки."

 tank_ita_combat_car_chassis_1: "AB 611"
 tank_ita_combat_car_chassis_1_short: "AB 611"
 tank_ita_combat_car_chassis_1_desc: "Оснащенная 37-мм пушкой, эта модификация значительно улучшила первоначальный дизайн."

 tank_ita_combat_car_chassis_2: "AB 41"
 tank_ita_combat_car_chassis_2_short: "AB 41"
 tank_ita_combat_car_chassis_2_desc: "AB 41 улучшает многие аспекты S37, позволяя ему лучше выполнять боевую роль, не будучи полностью устаревшим. Несмотря на это, AB 41 все еще очень устарел по сравнению с боевыми бронированными машинами других ведущих стран."

 tank_ita_combat_car_chassis_2_2: "AB 43"
 tank_ita_combat_car_chassis_2_2_short: "AB 43"
 tank_ita_combat_car_chassis_2_2_desc: "По сути, AB 41, модернизированный 47-мм орудием, AB 43 имеет повышенную пробиваемость для борьбы с вражескими машинами. Однако количество пробитий все еще очень мало, и пушка, скорее всего, способна пробивать только легкую броню."

 tank_ita_light_chassis_1: "§W§!Fiat 3000§W§!"
 tank_ita_light_chassis_1_desc: "Созданный по образцу французского Renault FT, Fiat 3000 имел много тех же проблем, что и оригинальный танк. Наличие только двух членов экипажа с башней, рассчитанной на одного человека, оказалось большой нагрузкой на командира танка, что привело к неразберихе и неэффективности. Конструкция и вооружение танка уже устарели."

 tank_ita_light_chassis_2: "§W§!L3§W§!"
 tank_ita_light_chassis_2_desc: "L3 - слабо бронированный танкетка с пулеметным вооружением, достаточно мощным для борьбы с пехотой. Он был слишком мал, чтобы вместить любой экипаж, кроме командира и наводчика. Хотя их прорыв был полезен для ведения боевых действий в таких регионах, как Эфиопия и Испания, они считаются неадекватными для современной войны."

 tank_ita_light_chassis_3: "§W§!L6 Proto§W§!"
 tank_ita_light_chassis_3_desc: "Прототип L6 - это попытка итальянской армии быстро модернизировать свою сильно устаревшую бронетехнику. Обладая достойными боевыми качествами для танка такого размера и являясь значительным улучшением по сравнению с итальянскими танкетками, прототип L6 в процессе разработки уже превзошел другие модели. Хотя переход к трем членам экипажа и был прогрессом, танк по-прежнему имел башню с одним членом экипажа, что создавало несправедливую нагрузку на командира танка. У танка также не было башенки командира, что ограничивало его возможности по прорыву и обороне."

 tank_ita_light_chassis_3_2: "§W§!L6§W§!"
 tank_ita_light_chassis_3_2_desc: "Полевая модификация L6 получила дополнительную броню, практически не изменив наступательных возможностей. Дополнительная броня фактически привела к проблемам с танком, так как двигатель не справлялся с дополнительным весом, вызывая проблемы с надежностью.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_light_chassis_4: "§W§!L8§W§!"
 tank_ita_light_chassis_4_desc: "На L8 установлена 37-мм пушка и новая подвеска, обеспечивающие повышенную пробиваемость и подвижность. Однако к этому моменту танк уже устарел, и ему будет трудно бороться с любой сколько-нибудь грамотно примененной вражеской бронетехникой.\n§RЭто новая модель, и она не сохранит эффективность§!"

 tank_ita_light_chassis_5: "§W§!M16§W§!"
 tank_ita_light_chassis_5_desc: "Вдохновленный британскими «крейсерскими» танками, с которыми пришлось столкнуться в Северной Африке, M16 получил более изящную конструкцию для достижения более высокого уровня скорости. Несмотря на то, что танк довольно быстрый, его боевые возможности невелики. Благодаря меньшему профилю танк трудно заметить и подбить, что делает его прорыв и защиту полезными характеристиками."

 tank_ita_light_chassis_5_2: "§W§!M18§W§!"
 tank_ita_light_chassis_5_2_desc: "M18 знаменует собой значительное улучшение итальянской бронетехники, удвоив броню своего предшественника. Хотя это далеко не лучший танк, M18 способен хорошо действовать на фронте при хорошей поддержке.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_light_chassis_6: "§W§!M20§W§!"
 tank_ita_light_chassis_6_desc: "M20 продолжает совершенствовать 75-мм орудие, чтобы придать танку большую наступательную мощь. Добавление усовершенствованных радиостанций позволяет значительно улучшить координацию действий при обороне и прорыве, делая экипаж гораздо более эффективным в бою."

 light_tank_destroyer_chassistank_ita_light_chassis_2: "§W§!L3 33§W§!"
 light_tank_destroyer_chassistank_ita_light_chassis_3: "§W§!Semovente da 47§W§!"
 light_tank_destroyer_chassistank_ita_light_chassis_4: "§W§!Semovente da 66§W§!"
 light_tank_artillery_chassistank_ita_light_chassis_3: "§W§!Semovente da 47§W§!"
 light_tank_artillery_chassistank_ita_light_chassis_4: "§W§!Semovente da 65§W§!"
 light_tank_aa_chassistank_ita_light_chassis_2: "§W§!L3 35M§W§!"
 light_tank_aa_chassistank_ita_light_chassis_3: "§W§!Anti aria da 20§W§!"
 light_tank_aa_chassistank_ita_light_chassis_4: "§W§!Anti aria da duello 20§W§!"
 light_tank_aa_chassistank_ita_light_chassis_5: "§W§!Anti aria da quad 20§W§!"

 tank_ita_light_chassis_td_2: "§W§!L3 33§W§!"
 tank_ita_light_chassis_td_2_desc: "Этот вариант L3, оснащенный 33-мм пушкой, имеет пробиваемость на уровне основных противотанковых орудий своего времени. Она способна пробить большинство танков раннего периода войны, но обладает очень слабой пробивной способностью, что не дает оснований выбирать ее вместо стандартной итальянской противотанковой пушки."

 tank_ita_light_chassis_td_3: "§W§!Semovente da 47 32§W§!"
 tank_ita_light_chassis_td_3_desc: "Semovente da 47 32 устанавливает одноименную противотанковую пушку в надстройке с открытым верхом. Несмотря на неплохие показатели пробития и брони, недостаток других характеристик делает эту машину слабой в бою. Из всего перечисленного наиболее существенным препятствием на пути к успеху этого танкового разрушителя является его ужасная надежность."

 tank_ita_light_chassis_td_4: "§W§!Semovente da 66 43§W§!"
 tank_ita_light_chassis_td_4_desc: "Semovente da 66 43 крайне устарел и не способен пробить ничего, кроме очень легкобронированных целей. Его легкий корпус не способен установить орудия, необходимые для борьбы с бронетанковыми частями, представляющими значительную угрозу."

 tank_ita_light_chassis_spg_3: "§W§!Semovente da 47 18§W§!"
 tank_ita_light_chassis_spg_3_desc: "Semovente da 47 18 - это первая попытка Италии создать самоходное орудие. Оно сильно устарело с точки зрения конструкции машины, страдает от ужасных боевых характеристик, скорости и надежности. Базовая итальянская артиллерия гораздо проще в производстве и использовании по сравнению с этой машиной."

 tank_ita_light_chassis_spg_4: "§W§!Semovente da 65 40§W§!"
 tank_ita_light_chassis_spg_4_desc: "Модель 65 40 значительно улучшена по сравнению с моделью 47 18, но, как и в случае со многими другими итальянскими машинами, ее конструкция все еще остается крайне устаревшей. Как и 47 18, эта машина не выдерживает сравнения с базовой итальянской артиллерией того времени и редко может рассматриваться как приемлемый вариант."

 tank_ita_light_chassis_aa_2: "§W§!L3 35M§W§!"
 tank_ita_light_chassis_aa_2_desc: "Оснащенная только спаренными пулеметами, эта машина пригодна только для борьбы с пехотой, и от нее нельзя ожидать ничего хорошего в борьбе с мощными самолетами противника. Кроме того, он крайне ненадежен."

 tank_ita_light_chassis_aa_3: "§W§!Anti aria da 20§W§!"
 tank_ita_light_chassis_aa_3_desc: "Оснащенная скорострельной 20-мм пушкой, эта машина лучше справляется с зенитными операциями, чем L3 35M, но она все равно очень неэффективна."

 tank_ita_light_chassis_aa_4: "§W§!Anti aria da duello 20§W§!"
 tank_ita_light_chassis_aa_4_desc: "Сохранив 20-мм автопушки в сдвоенном виде, da duello 20 получила более крупную башню, что значительно увеличило возможности противопехотной и противовоздушной обороны. Однако к настоящему времени существуют более тяжелые самоходные зенитные установки, которые гораздо лучше справляются с этой ролью, что делает эту серию машин устаревшей."

 tank_ita_light_chassis_aa_5: "§W§!Anti aria da quad 20§W§!"
 tank_ita_light_chassis_aa_5_desc: "Усовершенствования в конструкции корпуса и башни позволяют экипажу машины координировать действия при обороне и прорыве. Для повышения мобильности лишняя броня была удалена в несущественных местах."



 tank_ita_medium_chassis_1: "§W§!M11§W§!"
 tank_ita_medium_chassis_1_desc: "M11 - это первая попытка Италии создать настоящий средний танк. Несмотря на наличие башни, она слишком мала для размещения основного вооружения, и его приходится размещать внутри корпуса. Обязанности водителя и наводчика также объединены в одну, что не позволяет оптимально выполнять обе функции. Этот танк сильно устарел и с трудом выдерживает конкуренцию с любым видом компетентной бронетехники."

 tank_ita_medium_chassis_1_2: "§W§!M13§W§!"
 tank_ita_medium_chassis_1_2_desc: "M13 построен на шасси M11 со значительными изменениями в общей конструкции. Башня была увеличена, чтобы разместить улучшенную 47-мм пушку, которая делает M13 намного лучше своего предшественника. Однако его броня держится на заклепках и очень тонкая. Несмотря на значительное улучшение по сравнению с M11, необходимо внести еще много изменений, чтобы предотвратить устаревание этой линейки танков.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_medium_chassis_1_3: "§W§!M15§W§!"
 tank_ita_medium_chassis_1_3_desc: "Разработанный в качестве промежуточного варианта, пока не будут готовы более тяжелые танки, такие как P26, M15 имеет удлиненную версию 47-мм пушки, улучшенную броню и повышенную надежность. Как и в случае с предыдущими итальянскими танками, эти танки все еще сильно устарели и не могут противостоять ничему тяжелее чем легкий танк.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_medium_chassis_2: "§W§!P26§W§!"
 tank_ita_medium_chassis_2_desc: "Будучи значительным усовершенствованием по сравнению с предыдущими итальянскими средними танками и достойным конкурентом Sherman и Panzer IV, к 1943 году P26 не сможет сравниться с разработками других стран. Однако в любой армии всегда найдется место для надежного, универсального среднего танка."

 tank_ita_medium_chassis_3: "§W§!P43§W§!"
 tank_ita_medium_chassis_3_desc: "Дальнейшее развитие шасси P26, более крутой наклон лобовой брони, установка более мощной пушки и повышение надежности. Всестороннее улучшение, которое, хотя и остается несколько недостаточным по сравнению с конкурентами, обеспечивает столь необходимое усиление итальянских бронетанковых войск."

 tank_ita_medium_chassis_3_2: "§W§!P43 bis§W§!"
 tank_ita_medium_chassis_3_2_desc: "Еще одно усовершенствование своего предшественника, P43 bis оснащен более мощным вооружением и толстой броней, обеспечивая более высокую пробиваемость ценой некоторого снижения надежности.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 medium_tank_destroyer_chassistank_ita_medium_chassis_1: "§W§!Semovente da 75§W§!"
 medium_tank_destroyer_chassistank_ita_medium_chassis_2: "§W§!Semovente da 75§W§!"
 medium_tank_destroyer_chassistank_ita_medium_chassis_3: "§W§!Semovente da 90§W§!"
 medium_tank_artillery_chassistank_ita_medium_chassis_1: "§W§!Semovente da 149§W§!"
 medium_tank_artillery_chassistank_ita_medium_chassis_3: "§W§!Semovente da 149§W§!"
 medium_tank_assault_chassistank_ita_medium_chassis_1: "§W§!Semovente da 75§W§!"
 medium_tank_assault_chassistank_ita_medium_chassis_2: "§W§!Semovente da 105§W§!"
 medium_tank_aa_chassistank_ita_medium_chassis_1: "§W§!Semovente da 20/70 quadruplo§W§!"
 medium_tank_aa_chassistank_ita_medium_chassis_3: "§W§!Anti aria da 37§W§!"

 tank_ita_medium_chassis_td_1: "§W§!Semovente da 75 34§W§!"
 tank_ita_medium_chassis_td_1_desc: "Модель 75 34 оснащался 75-мм пушкой L/34 и был улучшен по нескольким параметрам 47 32. Несмотря на то, что пушка еще не стала отличным уничтожителем танков, она достаточно хороша для пробития большинства вражеских танков, которые можно встретить в Африке."

 tank_ita_medium_chassis_td_1_2: "§W§!Semovente da 90 53§W§!"
 tank_ita_medium_chassis_td_1_2_desc: "В связи с необходимостью усиления противотанковых возможностей итальянских экспедиционных сил, сражающихся в Советском Союзе, тяжелое зенитное орудие 90/53 было установлено на базе пт-сау с открытой башней. Благодаря крупному орудию она способна пробить почти каждый встречный танк, однако ее конструкция не имеет брони и очень хрупка. Кроме того, она ненадежна, поскольку шасси не предназначалось для такого крупного орудия."

 tank_ita_medium_chassis_td_2: "§W§!Semovente da 75 46§W§!"
 tank_ita_medium_chassis_td_2_desc: "Эта машина является продолжением Semovente da 75 34, обеспечивая всестороннюю прибавку к каждому боевому показателю. Этой пт-сау очень сложно пробивать вражескую бронетехнику, так как к этому моменту он сильно устарел."

 tank_ita_medium_chassis_td_3: "§W§!Semovente da 90 63§W§!"

 tank_ita_medium_chassis_spg_1: "Semovente da 100 17"
 tank_ita_medium_chassis_spg_1_desc: "Semovente da 100 — полностью незащищенное самоходное орудие. Хотя это означает, что у него практически нет броневой защиты, на него можно установить устаревшее, но все еще эффективное орудие."

 tank_ita_medium_chassis_spg_3: "§W§!Semovente da 149 40§W§!"

 tank_ita_medium_chassis_assault_1: "§W§!Semovente da 75 18§W§!"
 tank_ita_medium_chassis_assault_1_desc: "Штурмовое орудие\nВдохновившись чрезвычайно удачной немецкой конструкцией Stug III, итальянцы захотели создать машину аналогичного калибра. Semovente da 75 18 оснащен современной 75-мм пушкой L/18. Несмотря на то, что она не соответствует стандартам своего предшественника Stug III, это хорошо спроектированная машина, которую сдерживают только инженерные возможности Италии.."

 tank_ita_medium_chassis_assault_2: "§W§!Semovente da 105 25§W§!"
 tank_ita_medium_chassis_assault_2_desc: "Штурмовое орудие\nОснащенная 105-мм орудием L/25, эта эволюция формулы semovente обеспечивает мощную огневую мощь на поле боя при очень доступной стоимости производства. Однако недостаток других наступательных качеств делает эту машину компромиссной."

 tank_ita_medium_chassis_aa_1: "§W§!Semovente da 20/70 quadruplo§W§!"
 tank_ita_medium_chassis_aa_1_desc: "Оснащенный 4 специально модифицированными 20-мм автопушками, квадрупло 20/70 является очень эффективной зенитной машиной. По сравнению с другими самоходными зенитными орудиями он имеет соответственно большую броню. По этой причине ее производство также несколько дороже, чем у большинства других моделей."

 tank_ita_medium_chassis_aa_3: "§W§!Anti aria da 37§W§!"
 tank_ita_medium_chassis_aa_3_desc: "Несмотря на то, что эта машина имеет множество усовершенствований по сравнению с anti aria da quad 20, ей сильно не хватает противовоздушной силы, которая является ее предназначением. Несмотря на то, что машина стала намного тяжелее, она сохранила мобильность своего предшественника."




 tank_ita_modern_chassis_1: "§W§!P44§W§!"
 tank_ita_modern_chassis_1_desc: "РАЗРЕШЕНО, ЕСЛИ ОДНО ИЗ СЛЕДУЮЩИХ УСЛОВИЙ ИСТИННО:\n§YНаходится в альянсе с Германией§!,§YГермания - марионетка Италии§!\n"

 tank_ita_modern_chassis_1_2: "§W§!P48§W§!"

 tank_ita_modern_chassis_2: "§W§!P50§W§!"
 tank_ita_modern_chassis_2_desc: "Изменения, внесенные в P50, значительно повышают противотанковую пробиваемость, но этого недостаточно, чтобы пробить основные боевые танки большинства современных армий. Кроме того, сам танк имеет меньше брони, чем обычно, и может оказаться слишком слабым для противостояния другим танкам.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_modern_chassis_3: "§W§!P65§W§!"
 tank_ita_modern_chassis_3_desc: "Еще одно улучшение противотанковых возможностей позволяет этому танку бороться с основными боевыми танками некоторых ведущих стран. Хотя танк относительно быстр, ему приходится идти на компромисс с броней, которая все еще намного ниже среднего уровня."

 modern_tank_destroyer_chassistank_ita_modern_chassis_2: "§W§!Semovente da 120§W§!"
 modern_tank_destroyer_chassistank_ita_modern_chassis_3: "§W§!Semovente da 127§W§!"
 modern_tank_artillery_chassistank_ita_modern_chassis_2: "§W§!Semovente da 155§W§!"
 modern_tank_artillery_chassistank_ita_modern_chassis_3: "§W§!Semovente da 155§W§!"
 modern_tank_aa_chassistank_ita_modern_chassis_2: "§W§!Anti aria da duello 37§W§!"
 modern_tank_aa_chassistank_ita_modern_chassis_3: "§W§!Anti aria da duello 50§W§!"

 tank_ita_modern_chassis_td_2: "§W§!Semovente da 120 42§W§!"
 tank_ita_modern_chassis_td_2_desc: "Отдавая предпочтение мобильности, эта конструкция отказывается от любого уровня брони. Хотя орудие также несколько устарело, оно все еще может пробивать менее бронированные цели. Кроме того, сочетание низкой брони и меньшего орудия делает машину очень простой в производстве."

 tank_ita_modern_chassis_td_3: "§W§!Semovente da 127 70§W§!"
 tank_ita_modern_chassis_td_3_desc: "Этот апгрейд позволяет значительно улучшить защиту, пробитие и пробиваемость. При этом танк по-прежнему легко бронирован и прост в производстве."

 tank_ita_modern_chassis_spg_2: "§W§!Semovente da 155§W§!"
 tank_ita_modern_chassis_spg_2_desc: "Semovente da 155 - это маневренная машина со средними боевыми характеристиками. Несмотря на свои размеры, он очень легко бронирован и может быть пробит пехотными переносными противотанковыми орудиями. С другой стороны, эта легкая рама делает ее дешевой в производстве по сравнению с другими крупными современными машинами."

 tank_ita_modern_chassis_spg_3: "§W§!Semovente da 155 40§W§!"
 tank_ita_modern_chassis_spg_3_desc: "Semovente da 155 40 улучшает броню своего предшественника, но ее характеристики слишком малы, чтобы существенно повлиять на модернизированные силы противника."

 tank_ita_modern_chassis_aa_2: "§W§!Anti aria da duello 37§W§!"
 tank_ita_modern_chassis_aa_2_desc: "Получив значительный прирост статистики за счет установки дополнительного 37-мм орудия, da duello 37 является способным, но все же немного уступающим средним зенитным установкам."

 tank_ita_modern_chassis_aa_3: "§W§!Anti aria da duello 50§W§!"




 tank_ita_heavy_chassis_1: "§W§!C45§W§!"
 tank_ita_heavy_chassis_1_desc: "C45 был гораздо крупнее всех предыдущих итальянских образцов. На нем была установлена более крупная 90-мм пушка и хорошо наклоненная броня, хотя это и хорошие усовершенствования, но это концепции, которые уже были повсеместно реализованы и превзойдены основными танковыми странами. Танк по-прежнему имел башню, рассчитанную только на двух человек, в отличие от трех в большинстве стран, и по-прежнему не имел башенки для командира."

 tank_ita_heavy_chassis_1_2: "§W§!C50§W§!"
 tank_ita_heavy_chassis_1_2_desc: "C50 обладает достойной броней и пробиваемостью для основного боевого танка, но не как тяжелый танк. У машины много проблем из-за тесного пространства для экипажа и непомерного веса, что приводит к недостаткам в боевой эффективности и надежности.\n§GЭто позволит сохранить 95% эффективность по сравнению с предыдущей моделью§!"

 tank_ita_heavy_chassis_2: "§W§!C55§W§!"

 tank_ita_heavy_chassis_3: "§W§!C60§W§!"
 tank_ita_heavy_chassis_3_desc: "C60 получил несколько значительных улучшений по сравнению с P43. Переработанный корпус и орудие превращают его в монстра на поле боя с отличными боевыми характеристиками. Однако у него есть некоторые недостатки в способности пробивать более тяжелые танки конца войны, а также он очень слабо бронирован для тяжелого танка этого времени."

 heavy_tank_destroyer_chassistank_ita_heavy_chassis_1: "§W§!Semovente da 120§W§!"
 heavy_tank_destroyer_chassistank_ita_heavy_chassis_2: "§W§!Semovente da 127§W§!"
 heavy_tank_assault_chassistank_ita_heavy_chassis_1: "§W§!Semovente da 149§W§!"
 heavy_tank_assault_chassistank_ita_heavy_chassis_2: "§W§!Semovente da 155§W§!"

 tank_ita_heavy_chassis_td_1: "§W§!Semovente da 90 60§W§!"
 ita_heavy_td_equipment_1_desc: "Semovente da 90 60 сохраняет тот же уровень огневой мощи, что и 90 53, но улучшает самые слабые места - броню и надежность. Хотя 90 60 не обладает такими же противотанковыми возможностями, как тяжелые пт-сау других стран, он очень хорошо оснащен и при благоприятных обстоятельствах может показать отличные результаты."

 tank_ita_heavy_chassis_td_1_2: "§W§!Semovente da 120 43§W§!"
 tank_ita_heavy_chassis_td_1_2_desc: "В то время как 120 43 продолжает завершать линейку 90 60, обеспечивая дополнительный прорыв и мягкую атаку, он дает лишь небольшие бонусы к пробитию и броне, а именно этого машине больше всего не хватает среди тяжелых истребителей танков. Несмотря на то, что 120 43 - неплохая машина, против тяжелой бронетехники она будет работать не лучшим образом."

 tank_ita_heavy_chassis_td_2: "§W§!Semovente da 127 73§W§!"

 tank_ita_heavy_chassis_assault_1: "§W§!Semovente da 105 35§W§!"
 tank_ita_heavy_chassis_assault_1_desc: "Тяжелое  Штурмовое орудие\nSemovente da 105 была одной из самых мощных САУ, созданных итальянцами во время Второй мировой войны. Закрытая рубка означала, что любая огневая поддержка должна осуществляться с близкого расстояния, но он обладал достаточной подвижностью и броней, чтобы это сработало, при условии, что не столкнется с танками."

 tank_ita_heavy_chassis_assault_1_2: "§W§!Semovente da 149 43§W§!"
 tank_ita_heavy_chassis_assault_1_2_desc: "Тяжелое Штурмовое орудие\nSemovente da 149 43 очень похоже на своего предшественника 105 25. Изменения коснулись эргономики и настройки экипажа, в результате чего значительно улучшилась координация прорыва и обороны. Однако эти изменения заставили пойти на небольшие жертвы в других областях, что означает потерю некоторых наступательных возможностей."

 tank_ita_heavy_chassis_assault_2: "§W§!Semovente da 155 47§W§!"
 tank_ita_heavy_chassis_assault_2_desc: "Тяжелое Штурмовое орудие\nНа Semovente da 155 47 значительно увеличивается противопехотная атака и бронирование, жертвуя комфортом и обзором экипажа. Это делает его сложным для защиты от вражеских атак, но очень хорошим для нанесения урона целевым подразделениям. Хотя большой бонус к броне можно только приветствовать, он делает машину очень дорогой в производстве, и трудно сказать, будет ли броня достаточно существенной для защиты экипажа."





