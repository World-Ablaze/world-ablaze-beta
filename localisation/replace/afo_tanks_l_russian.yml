 tank_sov_scout_car_chassis_1: "ФАИ"
 tank_sov_scout_car_chassis_1_short: "ФАИ"
 tank_sov_scout_car_chassis_1_desc: "Созданный по американской лицензии, ФАИ представляет собой дешевое транспортное средство, обеспечивающее лишь легкую броню и слабую защиту экипажа."

 tank_sov_scout_car_chassis_2: "БА-20"
 tank_sov_scout_car_chassis_2_short: "БА-20"
 tank_sov_scout_car_chassis_2_desc: "Очень похожий по конструкции и внешнему виду на ФАИ, БА-20 предназначен только для использования в качестве разведчика. Броня очень тонкая и способна остановить только огонь из стрелкового оружия."

 tank_sov_scout_car_chassis_3: "БА-64"
 tank_sov_scout_car_chassis_3_short: "БА-64"
 tank_sov_scout_car_chassis_3_desc: "БА-64 - это значительное усовершенствование по сравнению с БА-20. Его наклонная броня и многогранный корпус обеспечивают более высокую защиту, чем у всех предыдущих моделей. Кроме того, у него значительно возросли наступательные возможности."

 tank_sov_scout_car_chassis_4: "БТР-40"
 tank_sov_scout_car_chassis_4_short: "БТР-40"
 tank_sov_scout_car_chassis_4_desc: "БТР-40 оснащен дополнительными портами обзора, позволяющими экипажу визуализировать окружающее поле боя и обнаруживать потенциальных противников. Машина очень надежна и может использоваться в самых разных условиях."

 tank_sov_scout_car_chassis_5: "БРДМ-1"
 tank_sov_scout_car_chassis_5_short: "БРДМ-1"
 tank_sov_scout_car_chassis_5_desc: "БРДМ-1 - это амфибийная машина-разведчик с чрезвычайно высокой маневренностью. Бонус к пробитию, который он дает своему экипажу, значительно выше, чем у всех предыдущих моделей, но, скорее всего, не будет иметь значения."

 tank_sov_combat_car_chassis_1: "БА-6"
 tank_sov_combat_car_chassis_1_short: "БА-6"
 tank_sov_combat_car_chassis_1_desc: "БА-6 использует башню Т-26, применявшуюся на танках Т-26 и БТ-5, и поэтому может оснащаться 45-мм орудием. Это дает ему возможность надежно пробивать практически все танки, которые он может встретить на поле боя. При этом сама бронемашина по-прежнему легко бронирована, а массивная башня утяжеляет танк и значительно снижает его максимальную скорость."

 tank_sov_combat_car_chassis_2: "БА-10"
 tank_sov_combat_car_chassis_2_short: "БА-10"
 tank_sov_combat_car_chassis_2_desc: "Разработанный на основе БА-6, БА-10 имеет лишь минимальные изменения. По-прежнему используется тот же профиль вооружения и брони, единственные изменения заключаются в незначительном улучшении защиты и мобильности."

 tank_sov_combat_car_chassis_3: "БА-11"
 tank_sov_combat_car_chassis_3_short: "БА-11"
 tank_sov_combat_car_chassis_3_desc: "БА-11 оснащен улучшенной радиостанцией, позволяющей улучшить координацию между машинами. Более экстремальный наклон лобовой брони также повышает защиту без ущерба для мобильности и производительности."

 tank_sov_light_chassis_support_1: "§W§!T-26 (33)§W§!"
 tank_sov_light_chassis_support_1_desc: "Т-26 был разработан на основе импортной модели британского 6-тонного танка Vickers. На модели 1933 года установлена 45-мм пушка L46, обладающая чрезвычайно высокой скорострельностью, что делает этот довоенный танк лучшим для своего времени по пробитию вражеской брони. Большинство этих танков не имеют радиостанций, так как те немногие радиостанции, которыми располагал Советский Союз, были в первую очередь предназначены для командирских танков. Кроме того, этот танк стал одним из самых ненадежных среди советских танков начала войны.\n§RЭто абсолютно новая модель, которая не сохраняет эффективность§!!"

 tank_sov_light_chassis_support_1_2: "§W§!T-26 (38)§W§!"
 tank_sov_light_chassis_support_1_2_desc: "Опираясь на опыт пограничных конфликтов на Дальнем Востоке и Гражданской войны в Испании, модель T-26 образца 1938 года получила новую коническую башню, более прочную и менее пробиваемую. Хотя она несколько улучшилась по сравнению с вариантом 1933 года и по-прежнему способна надежно пробивать вражеские танки, она сильно отстает от других танков почти по всем показателям.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_support_2: "§W§!Т-50§W§!"
 tank_sov_light_chassis_support_2_desc: "В T-50 применена новая схема бронирования с использованием хорошо наклоненной и цельносварной брони. Благодаря этому достигается высокий уровень бронирования для легкого танка без значительного увеличения массы. Все танки Т-50 имеют радиостанции и командирскую башенку, что является отличной особенностью, которой обычно нет в других советских танковых конструкциях. Благодаря высокому уровню пробития и брони он отлично справляется с легкими танками противника.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_light_chassis_1: "§W§!БТ-5§W§!"
 tank_sov_light_chassis_1_desc: "Скорее напоминающая легкий танк, серия БТ - это танковая линия, основанная на скорости и мобильности при легком бронировании. При правильном использовании она отлично справляется с прорывом оборонительных линий. 45-миллиметровая пушка позволяет пробивать вражеские танки, но слабая броня делает танк уязвимым даже для ручного пехотного противотанкового оружия.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_light_chassis_1_2: "§W§!БТ-7§W§!"
 tank_sov_light_chassis_1_2_desc: "БТ-7 незначительно улучшает наступательные характеристики БТ-5. Он включает в себя новую башню с наклонной броней, чтобы минимизировать затраты на вес. При этом скорость передвижения значительно возросла, и теперь он может идти вровень с моторизованными подразделениями. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_1_3: "§W§!БТ-7М§W§!"
 tank_sov_light_chassis_1_3_desc: "БТ-7М - это последняя модернизация серии БТ. Благодаря усиленной броне, повышенной надежности и новому дизельному двигателю В-2, БТ-7М достигает максимальной производительности. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_2: "§W§!Т-60§W§!"
 tank_sov_light_chassis_2_desc: "Т-60 - легкий танк, предназначенный для разведки. Он оснащен 20-мм автопушкой ТНШ, способной бороться только с легкобронированными пехотными подразделениями. Танк имеет боевые характеристики ниже среднего, но он очень дешев в производстве и может эффективно использоваться в разведывательных ротах и противопехотных атаках. Из-за башни, рассчитанной на одного человека, у него снижены прорыв и защита, поскольку командир, скорее всего, будет перегружен задачами на поле боя.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_light_chassis_2_2: "§W§!T-70§W§!"
 tank_sov_light_chassis_2_2_desc: "T-70 призван заменить T-50 в поддержке пехоты и T-60 в разведке. Используя 45-мм пушку, он имеет значительно улучшенную пробиваемость, но вряд ли будет эффективен против чего-либо, кроме легкобронированных целей. В нем также применена наклонная броня, что позволяет танку быть более тяжелобронированным, чем многие его легкие аналоги. В башне по-прежнему работает один человек, что может создать проблемы для командира при попытке управлять танком.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_2_3: "§W§!Т-80§W§!"
 tank_sov_light_chassis_2_3_desc: "Более поздний вариант T-70, T-80, получил двухместную башню и практически не изменился. К этому моменту войны легкие танки в значительной степени устарели, поскольку им трудно бороться с вражеской бронетехникой или хорошо оснащенной пехотой. Обычно они используются только для разведки. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_4: "§W§!ЛТТБ§W§!"
 tank_sov_light_chassis_4_desc: "\n§RЭто абсолютно новая модель, которая не сохраняет эффективность§!"

 tank_sov_light_chassis_5: "§W§!ПТ-76§W§!"
 tank_sov_light_chassis_5_desc: "ПТ-76 - легкий танк-амфибия, служащий в качестве платформы огневой поддержки и разведывательной машины. К сожалению, экипаж из трех человек вынуждает командира выполнять функции наводчика и радиста, что ограничивает его возможности по разведке и эффективному командованию. Танк обладает неплохими боевыми характеристиками, но от него нельзя ожидать борьбы с сильно бронированными целями.\n§RЭто абсолютно новая модель, которая не сохраняет эффективность§!"


 light_tank_assault_chassistank_sov_light_chassis_2: "§W§!СУ-76§W§!"
 light_tank_aa_chassistank_sov_light_chassis_2: "§W§!ЗСУ§W§!"

 tank_sov_light_chassis_assault_2: "§W§!СУ-76§W§!"
 tank_sov_light_chassis_assault_2_desc: "Штурмовое орудие\nНесмотря на вооружение 76-мм противотанковой пушкой ЗиС-3, СУ-76 может служить многоцелевой машиной. Ее орудие способно стрелять бронебойными и фугасными снарядами, что делает ее очень гибкой в борьбе с пехотой и бронетанковыми подразделениями. Некоторыми проблемами машины являются слабая броня и низкая надежность. Однако это компенсируется дешевизной производства. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_spg_1: "§W§!СУ-5§W§!"
 tank_sov_light_chassis_spg_1_desc: "В 1930-х годах было установлено, что буксируемые артиллерийские орудия не обладают мобильностью, необходимой для того, чтобы поспевать за наступающими армиями. Су-5-1 оснащен 76-мм пушкой. Как и для большинства ранних легких САУ, размер орудия вызывает проблемы с надежностью из-за слабой рамы легкого шасси. Кроме того, такие машины обычно имеют лишь легкую броню, защищающую только от огня стрелкового оружия и осколков снарядов. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_spg_1_2: "§W§!СУ-26§W§!"
 tank_sov_light_chassis_spg_1_2_desc: "Хотя наступательные характеристики практически не изменились, перенос 76-мм орудия на более прочное шасси позволил устранить многие проблемы с надежностью предыдущей модели. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_spg_2: "§W§!СУ-76М§W§!"
 tank_sov_light_chassis_spg_2_desc: "Улучшенная версия СУ-76, этот вариант имеет башню с открытым верхом, позволяющую вести огонь с закрытых позиций и оказывать гораздо большую поддержку пехоте.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_spg_2_2: "§W§!СУ-85БМ§W§!"
 tank_sov_light_chassis_spg_2_2_desc: "Созданный на базе СУ-76М, СУ-85Б имеет новую надстройку для установки более крупного 85-мм артиллерийского орудия.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_aa_2: "§W§!Т-90§W§!"
 tank_sov_light_chassis_aa_2_desc: "Оснащенный спаренными пулеметами, этот танк был неэффективен в борьбе с вражеской авиацией. По сравнению с ЗСУ других стран, Т-90 хорошо бронирован, но не обладает достаточной наступательной мощью. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_aa_2_2: "§W§!ЗУТ-37§W§!"
 tank_sov_light_chassis_aa_2_2_desc: "ЗУТ-37 оснащен 37-мм автопушкой, которая неплохо справляется со сбиванием вражеских самолетов. 37-мм пушка может использоваться и в других целях, так как танк способен пробивать легкобронированные цели и расправляться с пехотой. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_aa_2_3: "§W§!ЗСУ-37§W§!"
 tank_sov_light_chassis_aa_2_3_desc: "Используя то же вооружение, что и ЗУТ-37, ZSU имеет некоторые изменения в корпусе, улучшающие броневую защиту. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"




 tank_sov_medium_chassis_1: "§W§!T-28 (38)§W§!"
 tank_sov_medium_chassis_1_desc: "Т-28 - это многобашенный средний танк. Во многих отношениях он является передовым для своего времени. Все танки оснащены радиостанцией и имеют очень высокую огневую мощь, что позволяет им бороться со многими танками, разработанными в более поздние периоды. Однако он очень дорог в производстве и имел ненадежную подвеску. Из-за его сложности очень трудно вносить в него дополнительные модификации, поэтому от него не ответвляется ни одно дерево техники.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_medium_chassis_3: "§W§!Т-34 (40)§W§!"
 tank_sov_medium_chassis_3_desc: "Основная рабочая лошадка советского бронетанкового корпуса, Т-34 - дешевая, но чрезвычайно эффективная в бою машина. Новаторское использование наклонной брони обеспечило ему чрезвычайно хорошую защиту без значительного снижения скорости. Современным машинам очень сложно пробить его без использования специальных противотанковых подразделений. Из-за проблем с производством у этой машины есть некоторые проблемы с надежностью.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_medium_chassis_3_2: "§W§!Т-34 (41)§W§!"
 tank_sov_medium_chassis_3_2_desc: "Этот вариант Т-34 включает в себя улучшенную пушку F34 и радиостанции для танков, улучшающие противотанковую борьбу и координацию прорыва. Достижения в области производства позволили несколько снизить стоимость и повысить надежность. \n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_medium_chassis_3_3: "§W§!T-34 (42)§W§!"
 tank_sov_medium_chassis_3_3_desc: "Этот вариант Т-34 имеет обновленную шестиугольную башню, которая менее тесная и позволяет повысить боеспособность членов экипажа. К настоящему моменту T34 может эффективно использоваться в больших количествах. Несмотря на дешевизну производства, его броня и пробиваемость вряд ли помогут против более тяжелых моделей вражеской бронетехники.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_medium_chassis_3_4: "§W§!Т-34 (85)§W§!"
 tank_sov_medium_chassis_3_4_desc: "T-34-85 включает в себя самое значительное изменение, внесенное в любую модель T-34 за всю войну, - 85-мм пушку и новую башню для ее размещения. Хотя это очень нужное улучшение противотанковых возможностей, оно эффективно только против средней брони и ниже. Он не является надежным средством против более тяжелой бронетехники. Однако для среднего танка своего времени он все еще очень дешев в производстве.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_medium_chassis_4: "§W§!Т-34M§W§!"
 tank_sov_medium_chassis_4_desc: "\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"
 tank_sov_medium_chassis_5: "§W§!Т-43§W§!"
 tank_sov_medium_chassis_5_desc: "\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 medium_tank_destroyer_chassistank_sov_medium_chassis_3: "§W§!СУ-85§W§!"
 medium_tank_infantry_support_chassistank_sov_medium_chassis_2: "§W§!БТ-7арт.§W§!"
 medium_tank_assault_chassistank_sov_medium_chassis_2: "§W§!БТ-7арт.§W§!"
 medium_tank_assault_chassistank_sov_medium_chassis_3: "§W§!СУ-122§W§!"

 tank_sov_medium_chassis_td_3: "§W§!Т-34 (57)§W§!"
 tank_sov_medium_chassis_td_3_desc: "\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"


 tank_sov_medium_chassis_td_3_2: "§W§!СУ-85§W§!"
 tank_sov_medium_chassis_td_3_2_desc: "В то время как Т-34 и КВ-1 были более чем способны справиться с немецкими средними танками, появление танка "Тигр" привело к необходимости создания специальных противотанковых машин. СУ-85 оснащена 85-мм пушкой Д-5Т и способна справиться с такими тяжелыми танками, хотя и только в определенных условиях. Сама машина имеет хорошую броню, проста в производстве и обладает хорошей защитой.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_medium_chassis_td_3_3: "§W§!СУ-100§W§!"
 tank_sov_medium_chassis_td_3_3_desc: "В связи с тем, что конструкция Т-34-85 позволяет устанавливать 85-мм пушку, СУ-85 уже устарела и должна быть усовершенствована для более эффективного противодействия бронированным угрозам. Добавление командирского отсека и новой командирской башенки значительно улучшает возможности экипажа. Новая 100-мм пушка Д-10С способна легко пробивать танки "Тигр" и "Пантера" там, где СУ-85 иногда не справлялась. При этом машина по-прежнему очень дешева в производстве.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_light_chassis_infantry_support_1: "§W§!БТ-7арт.§W§!"
 tank_sov_light_chassis_infantry_support_1_desc: "Орудие поддержки пехоты\nНа БТ-7арт. устанавливается 76-мм орудие типа KT, что делает его очень эффективным в борьбе с пехотой. Для установки орудия башня БТ-7арт. должна быть значительно увеличена по сравнению с оригинальной моделью. Дополнительный вес приводит к значительному снижению скорости, которая является определяющей чертой линейки БТ. Как и в случае с большинством штурмовых орудий, показатели мягкой атаки очень хороши, но за это приходится платить прорывом.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_medium_chassis_infantry_support_1: "§W§!T-28 (34)§W§!"
 tank_sov_medium_chassis_infantry_support_1_desc: "Т-28 - это многобашенный средний танк. Во многих отношениях он является передовым для своего времени. Все танки оснащены радиостанцией и имеют очень высокую огневую мощь, что позволяет им бороться со многими танками, разработанными в более поздние периоды. Однако он очень дорог в производстве и имел ненадежную подвеску. Из-за его сложности очень трудно вносить в него дополнительные модификации, поэтому от него не ответвляется ни одно дерево техники.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_medium_chassis_assault_3: "§W§!СУ-122§W§!"
 tank_sov_medium_chassis_assault_3_desc: "Штурмовое орудие\nПодобно своему родственнику, СУ-76, 122-мм гаубица на СУ-122 может выполнять несколько функций. Она может использоваться для уничтожения пехотных подразделений и укреплений, а также обладает достаточной мощностью для борьбы с бронетехникой. Ее производство гораздо дороже, чем СУ-76, но и броня у нее значительно выше.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"
    
 tank_sov_medium_chassis_spg_3: "§W§!СУ-122М§W§!"
 tank_sov_medium_chassis_spg_3_desc: "Основанный на проекте У-35 по созданию ПТРК на базе Т-34, СУ-122М является кульминацией мобильной непрямой огневой поддержки в сочетании с надежным дешевым шасси.\n§RЭто абсолютно новая модель, которая не сохраняет эффективность§!"
 
 tank_sov_medium_chassis_infantry_support_3: "§W§!T-34 122§W§!"
 tank_sov_medium_chassis_infantry_support_3_desc: "Танк поддержки пехоты\n\n§GЭто позволит сохранить 95% эффективность от предыдущей модели§!"

 tank_sov_medium_chassis_aa_3: "§W§!ЗСУ-37-2§W§!"
 tank_sov_medium_chassis_aa_3_desc: "Признав эффективность ЗСУ-37, ЗСУ-37-2 переносит ЗСУ на шасси T-34 с удвоенной огневой мощью.\n§RЭто абсолютно новая модель, которая не сохраняет эффективность§!"



 tank_sov_modern_chassis_1: "§W§!Т-44§W§!"
 tank_sov_modern_chassis_1_desc: "Первый серьезный отход от линейки T-34, T-44 получил значительные улучшения в бронировании, сохранив при этом подвижность своего предшественника. Используя удлиненную 85-мм пушку, он способен эффективно сражаться с танками любой крупной страны. Несмотря на большое количество дополнительных модернизаций, он по-прежнему относительно дешев в производстве.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_modern_chassis_1_2: "§W§!T-44-100§W§!"
 tank_sov_modern_chassis_1_2_desc: "В этом варианте 85-мм пушка была заменена на 100-мм, что значительно повысило боевые возможности танка. Кроме того, в качестве защиты от пехоты в корпусе танка устанавливается пулемет. Это несколько замедляет танк из-за дополнительного веса.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_modern_chassis_2: "§W§!Т-54-1§W§!"
 tank_sov_modern_chassis_2_desc: "Т-54-1 очень похож на предшествующие Т-34-85 и Т-44-100, но использует ту же 100-мм пушку, что и Т-44. Наиболее значительной модернизации подверглись броня и трансмиссия."

 tank_sov_modern_chassis_2_2: "§W§!Т-54-2§W§!"
 tank_sov_modern_chassis_2_2_desc: "Т-54-2 имеет обновленную полусферическую башню, которая лучше бронирована и менее подвержена образованию ловушек для снарядов по сравнению с предыдущей конструкцией. Для повышения противотанковых возможностей машины предлагается удлиненная 100-мм пушка.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_modern_chassis_3: "§W§!Т-54 B§W§!"
 tank_sov_modern_chassis_3_desc: "Дальнейшая модернизация Т-54 включает в себя добавление усовершенствованных стабилизаторов для повышения точности стрельбы. Были разработаны новые прицелы и подкалиберные боеприпасы, что значительно повысило эффективность 100-мм пушки.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"


 modern_tank_destroyer_chassistank_sov_modern_chassis_1: "§W§!СУ-122-44§W§!"
 modern_tank_destroyer_chassistank_sov_modern_chassis_2: "§W§!СУ-122-54§W§!"
 modern_tank_artillery_chassistank_sov_modern_chassis_2: "§W§!СУ-152§W§!"
 modern_tank_aa_chassistank_sov_modern_chassis_2: "§W§!ЗСУ-57-2§W§!"

 tank_sov_modern_chassis_td_1: "§W§!СУ-122-44§W§!"
 tank_sov_modern_chassis_td_1_desc: "Чтобы лучше справляться с вражеской бронетехникой, на СУ-122-44 была установлена 122-мм пушка Д-25С и дополнительная броня. Этот истребитель танков все так же эффективен в борьбе с вражеской бронетехникой и способен пробить все танки, кроме самых тяжелых. Использование более современных шасси для этих машин означает, что стоимость производства значительно возросла.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_modern_chassis_td_2: "§W§!СУ-122 54§W§!"
 tank_sov_modern_chassis_td_2_desc: "Построенная на шасси Т-54, СУ-122-54 получила удлиненный ствол и улучшенные снаряды. Хотя эти изменения в первую очередь улучшили противотанковые возможности, они также помогли увеличить урон по пехоте.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_modern_chassis_spg_2: "§W§!СУ-152§W§!"
 tank_sov_modern_chassis_spg_2_desc: "Быстрая, но легкобронированная, эта САУ способна наносить быстрые артиллерийские удары по удаленным районам поля боя.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_modern_chassis_aa_2: "§W§!ЗСУ-57-2§W§!"
 tank_sov_modern_chassis_aa_2_desc: "Используя две 57-мм автопушки, ЗСУ-57-2 является очень хорошей машиной для уничтожения вражеских самолетов. Этот танк эффективен во многих ролях, обладая достойной мягкой атакой, пробитием и броней. Кроме того, он довольно дешев в производстве.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"




 tank_sov_heavy_chassis_1: "§W§!Т-35§W§!"
 tank_sov_heavy_chassis_1_desc: "Известный также как сухопутный линкор, этот танк оснащен пятью башнями, чтобы выдать как можно больше огневой мощи. Массивные размеры и сложная многобашенная конструкция приводят к тому, что это дорогой танк, на который трудно установить адекватную броневую защиту. Он также страдает от ряда проблем, таких как ужасная надежность и защита.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_2: "§W§!КВ-1 (40)§W§!"
 tank_sov_heavy_chassis_2_desc: "Неуязвимый для всего, кроме немногих образцов вооружения, установленного на технике того времени, КВ-1 - это стальной зверь, способный остановить вражеские атаки. Несмотря на тяжелую броню, высокую стоимость и низкую скорость, его наступательные характеристики примерно равны характеристикам средних танков того времени.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_2_2: "§W§!КВ-1 (41)§W§!"
 tank_sov_heavy_chassis_2_2_desc: "Небольшие изменения в удлинителе орудия и литой башне немного улучшили всесторонние характеристики КВ-1 при минимальном изменении стоимости производства. К настоящему времени все больше машин способны пробить броню КВ-1, но она по-прежнему остается очень прочной.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_2_3: "§W§!КВ-1 (42)§W§!"
 tank_sov_heavy_chassis_2_3_desc: "Версия КВ-1 с усиленным бронированием.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_3: "§W§!КВ-1С§W§!"
 tank_sov_heavy_chassis_3_desc: "КВ-1С жертвует уровнем брони и размерами, чтобы вернуть себе маневренность. Перепроектированная башня меньшего размера также дает возможность установить командирскую башенку с блоками кругового обзора, что делает этот танк чрезвычайно эффективным для обнаружения врагов в обороне. К настоящему времени броня стала скорее недостатком, чем преимуществом, так как она лишь увеличивает стоимость производства и вес, не обеспечивая при этом практически никакой защиты.\n§YЭто позволит сохранить 90% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_3_2: "§W§!КВ-85§W§!"
 tank_sov_heavy_chassis_3_2_desc: "Продолжая путь, пройденный КВ-1С, КВ-85 использует тот же корпус, но с новой башней, в которой размещено более крупное 85-мм орудие. Этот танк служит промежуточным звеном в процессе разработки новой машины, способной пробивать тяжелую вражескую броню.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_4: "§W§!ИС-1§W§!"
 tank_sov_heavy_chassis_4_desc: "ИС-1 получил броневую защиту, которая в последние годы отсутствовала в линейке КВ. Тем не менее, он сохранил 85-мм пушку, что означает, что его наступательные характеристики все еще сопоставимы с предшественниками. Линейка ИС также знаменует собой скачок в стоимости производства тяжелых танков.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_4_2: "§W§!ИС-2§W§!"
 tank_sov_heavy_chassis_4_2_desc: "ИС-2 представляет собой столь необходимое усиление вооружения линейки советских тяжелых танков, заменив 85-мм орудие на 122-мм. Даже если танк не сможет пробить вражескую броню, его фугасные снаряды способны сорвать вражескую башню, сбить ведущее колесо и гусеницу или вывести из строя экипаж. Это первый со времен КВ-1 советский тяжелый танк, способный на равных сражаться с немецкими тяжелыми танками.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_4_3: "§W§!ИС-2 (44)§W§!"
 tank_sov_heavy_chassis_4_3_desc: "ИС-2 (44) имеет лучшую наклонную броню, чем его предшественник.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_sov_heavy_chassis_5: "§W§!ИС-3§W§!"
 tank_sov_heavy_chassis_5_desc: "Полусферическая конструкция башни ИС-3 стала отличительной чертой будущих советских танков. Этот экстремальный наклон башни и "щучий нос" корпуса позволяют танку быть очень хорошо бронированным, сохраняя при этом элемент подвижности. Его слегка модернизированная 122-мм пушка не улучшает пробиваемость ИС-2, но наносит несколько больший урон вражеской технике и пехоте.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_6: "§W§!ИС-4§W§!"
 tank_sov_heavy_chassis_6_desc: "ИС-4 значительно увеличивает размеры и броню корпуса. Его могут пробить только самые мощные противотанковые орудия. Он более дорог в производстве и не дает значительных улучшений в наступательных возможностях.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_7: "§W§!ИС-7§W§!"
 tank_sov_heavy_chassis_7_desc: "ИС-7 - самый тяжелобронированный танк в советском арсенале. Его не может пробить ни одна наземная единица в игре. Он имеет слегка модернизированное орудие и сохраняет очень высокую маневренность. Однако за это приходится платить - его производство обходится довольно дорого.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_sov_heavy_chassis_8: "§W§!ИС-8§W§!"
 tank_sov_heavy_chassis_8_desc: "ИС-8 представляет собой значительное усовершенствование 122-мм противотанкового орудия, оставшегося неизменным со времен ИС-2. Он имеет мощную броню и способен наносить большой урон."

 tank_sov_heavy_chassis_8_2: "§W§!ИС-8M§W§!"
 tank_sov_heavy_chassis_8_2_desc: "ИС-8М - это модернизация танка ИС-8 с небольшими улучшениями в пушке и двигателе, в результате чего улучшились противотанковые возможности и подвижность.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"


 heavy_tank_destroyer_chassistank_sov_heavy_chassis_4: "§W§!ИСУ-122§W§!"
