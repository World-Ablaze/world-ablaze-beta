 tank_pol_heavy_chassis_1: "§W§!53TP§W§!"
 tank_pol_heavy_chassis_1_desc: "53TP имеет очень хорошее для своего времени орудие и достойную броню для тяжелого танка. Производство этой машины в больших количествах очень сложно для некрупной страны, но может быть очень ценным, если это удастся сделать.\n\n Профиль машины заставляет ее страдать от несколько низкой защиты и пробиваемости."

 tank_pol_heavy_chassis_2: "§W§!55TP§W§!"
 tank_pol_heavy_chassis_2_desc: "55TP - это огромная модернизация по сравнению с предшественником. Несмотря на то, что статистические показатели достаточно хороши, они меркнут по сравнению с тяжелыми машинами крупных наций."

 tank_pol_heavy_chassis_3: "§W§!60TP§W§!"
 tank_pol_heavy_chassis_3_desc: "60TP тяжело бронирован и способен наносить большой урон большинству видов вражеской брони. Хотя наступательные характеристики машины очень хороши, ее производство в больших количествах обходится очень дорого."


