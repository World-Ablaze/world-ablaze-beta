 medium_tank_artillery_chassistank_eng_medium_chassis_9: "§W§!Sexton§W§!"
 medium_tank_aa_chassistank_eng_medium_chassis_3: "§W§!Crusader AA§W§!"
 medium_tank_aa_chassistank_eng_medium_chassis_4: "§W§!Centaur AA§W§!"

 tank_eng_medium_chassis_td_10: "§W§!Valentine AT§W§!"
 tank_eng_medium_chassis_td_10_desc: "Valentine AT способна пробивать и наносить тяжелые повреждения практически всем видам вражеской брони. Открытый лафет означает, что он очень уязвим для вражеских контратак."

 tank_eng_medium_chassis_td_10_2: "§W§!Archer§W§!"
 tank_eng_medium_chassis_td_10_2_desc: "На устаревшее шасси Valentine было установлено модернизированное 17-фунтовое орудие, благодаря чему этот истребитель танков мог с относительной легкостью пробивать тяжелые танки. Уникальным элементом танка является то, что его орудие обращено к задней части оригинального шасси Valentine."

 tank_eng_medium_chassis_td_4: "§W§!Avenger§W§!"
 tank_eng_medium_chassis_td_4_desc: "Avenger - первый проект, в котором 17-фунтовое орудие было установлено на подвижной машине. Истребитель танков чрезвычайно эффективен против вражеской техники и способен пробить любую машину на поле боя. Машина хорошо бронирована и быстра, что делает ее очень универсальной."

 tank_eng_medium_chassis_td_4_2: "§W§!Challenger§W§!"
 tank_eng_medium_chassis_td_4_2_desc: "Challenger - это более быстрая версия Avenger, способная идти в ногу с быстрыми крейсерами британского бронетанкового корпуса. Для этого он жертвует небольшим количеством брони, но сохраняет тот же уровень огневой мощи, что и его предшественник, позволяя по-прежнему уничтожать большинство вражеских бронированных машин."

 tank_eng_medium_chassis_td_5: "§W§!Charioteer§W§!"
 tank_eng_medium_chassis_td_5_desc: "Charioteer предназначен для использования старых моделей корпусов, таких как Cromwell, путем повышения их вооружения до 20-фунтового. Уничтожитель танков легко бронирован, но способен быстро передвигаться и уничтожать бронированные части до того, как они успеют ответить."

 tank_eng_medium_chassis_td_9: "§W§!Sherman Firefly§W§!"

 tank_eng_medium_chassis_infantry_support_1: "§W§!Cruiser Mk III CS§W§!"
 tank_eng_medium_chassis_infantry_support_1_desc: "Танк поддержки пехоты\nДля решения проблемы недостаточной способности 2-Pounder поддерживать пехоту, на его место была установлена 76-мм гаубица. В значительной степени устранив противотанковые возможности, гаубица оказалась очень эффективной в борьбе с более слабыми целями."

 tank_eng_medium_chassis_infantry_support_1_2: "§W§!Cruiser Mk IV CS§W§!"
 tank_eng_medium_chassis_infantry_support_1_2_desc: "Танк поддержки пехоты\nКак и в случае с Mk III CS, Mk IV был перевооружен 76-мм гаубицей, чтобы лучше бороться с небронированными целями."

 tank_eng_medium_chassis_infantry_support_3: "§W§!Crusader CS§W§!"
 tank_eng_medium_chassis_infantry_support_3_desc: "Танк поддержки пехоты\nОснащенный теми же устаревшими 76-мм орудиями, что и предыдущие варианты Close Support, Crusader CS начинает испытывать недостаток в роли поддержки пехоты по сравнению с другими доступными вариантами."

 tank_eng_medium_chassis_infantry_support_4: "§W§!Cromwell CS§W§!"
 tank_eng_medium_chassis_infantry_support_4_desc: "Танк поддержки пехоты\nХотя 75-мм гаубица, конечно, лучше справлялась с легкими целями, чем ее 2- и 6-фунтовые предшественники, некоторые все же считали необходимым установить на Cromwell гаубицу большего калибра, чтобы специализироваться на борьбе с легкими целями. Хотя новая 94-мм гаубица справляется с этой ролью лучше, чем старая 76-мм, не стоит ожидать значительного улучшения в борьбе с вражеской бронетехникой."

 tank_eng_medium_chassis_spg_10: "§W§!Bishop§W§!"
 tank_eng_medium_chassis_spg_10_desc: "Bishop обладает приличной огневой мощью и неплохой бронезащитой. Благодаря своему высокому профилю, машину очень легко обнаружить и навести на цель на открытом поле боя."

 tank_eng_medium_chassis_spg_4: "§W§!Cromwell GC§W§!"

 tank_eng_medium_chassis_spg_5: "§W§!Comet GC§W§!"
 tank_eng_medium_chassis_spg_5_desc: "Продолжая использовать 25-фунтовую пушку, Comet Gun Carrier испытывает трудности с обеспечением подавляющей огневой мощи. Однако высокая мобильность и низкая стоимость позволяют САУ быть чрезвычайно эффективной при правильном использовании."

 tank_eng_medium_chassis_spg_9: "§W§!Sexton§W§!"

 tank_eng_medium_chassis_aa_3: "§W§!Crusader AA Mk I§W§!"
 tank_eng_medium_chassis_aa_3_desc: "Crusader AA Mk I - хороший ответ, если противник оспаривает господство в воздухе. Подавляющий характер автопушки позволяет ей наносить значительный урон пехоте и легкобронированным подразделениям, что делает ее хорошей многоцелевой машиной."

 tank_eng_medium_chassis_aa_3_2: "§W§!Crusader AA Mk II§W§!"
 tank_eng_medium_chassis_aa_3_2_desc: "Как и его предшественник, Mk II - это многоцелевая машина. Новая конструкция башни позволяет улучшить наведение на вражеские самолеты и общую координацию."

 tank_eng_medium_chassis_aa_4: "§W§!Centaur AA§W§!"
 tank_eng_medium_chassis_aa_4_desc: "Centaur AA не предоставляет никаких дополнительных наступательных возможностей по сравнению с противовоздушной линией Crusader, потомком которой он является. Чтобы лучше справляться с противотанковыми угрозами, ему значительно увеличили броню. Однако вероятность пробития даже пехотными переносными противотанковыми орудиями по-прежнему высока. Отсутствие улучшенного вооружения также может вызвать проблемы при борьбе с вражескими самолетами."




 tank_eng_modern_chassis_1: "§W§!Centurion MK I§W§!"
 tank_eng_modern_chassis_1_desc: "В танках Centurion была реализована самая важная инновация в истории британского танкостроения. Добавление кипятильника в подбашенное отделение позволило экипажу варить горячий напиток в движении, что дало ему беспрецедентные преимущества в бою. Революционная конструкция основного боевого танка представляет собой идеальное сочетание огневой мощи, брони и мобильности.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_modern_chassis_1_2: "§W§!Centurion Mk III§W§!"
 tank_eng_modern_chassis_1_2_desc: "Замена 17-фунтового орудия на новое 20-фунтовое значительно повышает наступательные возможности машины. Также были внесены незначительные улучшения в броню и двигатель.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_modern_chassis_1_3: "§W§!Centurion Mk V§W§!"
 tank_eng_modern_chassis_1_3_desc: "Незначительные улучшения гусеничной системы и схемы бронирования повышают прочность и подвижность танка. Надежность также повышена.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_modern_chassis_1_4: "§W§!Centurion Mk VII§W§!"
 tank_eng_modern_chassis_1_4_desc: "Улучшенные противотанковые снаряды позволяют машине пробивать большинство видов вражеской брони. Улучшения в броне и подвижности делают танк чрезвычайно универсальным в борьбе с любыми вражескими целями.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_modern_chassis_2: "§W§!FV430§W§!"


 modern_tank_destroyer_chassistank_eng_modern_chassis_1: "§W§!Conway§W§!"
 modern_tank_artillery_chassistank_eng_modern_chassis_1: "§W§!Centurion GC§W§!"
 modern_tank_aa_chassistank_eng_modern_chassis_1: "§W§!Falcon AA§W§!"
 modern_tank_artillery_chassistank_eng_modern_chassis_2: "§W§!FV433 Abbot§W§!"
 modern_tank_aa_chassistank_eng_modern_chassis_2: "§W§!FV433 Falcon§W§!"

 tank_eng_modern_chassis_td_1: "§W§!Conway§W§!"
 tank_eng_modern_chassis_td_1_desc: "120-мм пушка L1 Conway способна обеспечить быстрый противотанковый огонь в любой точке фронта. Машина имеет хорошую бронезащиту, способную противостоять большинству пехотных противотанковых средств, но, скорее всего, будет пробита большинством тяжелых противотанковых орудий."

 tank_eng_modern_chassis_spg_1: "§W§!FV3805§W§!"
 tank_eng_modern_chassis_spg_1_desc: "FV3805 - одна из первых британских САУ, на которой 25-фунтовое орудие было заменено на более современное 6-дюймовое. Хотя эта машина не обладает такой мощью, как ее более тяжелые собратья, ее мобильность позволяет ей обеспечивать огневую мощь в труднодоступных для более крупных машин местах. Кроме того, она дешева в производстве."

 tank_eng_modern_chassis_spg_2: "§W§!FV433 Abbot§W§!"
 tank_eng_modern_chassis_spg_2_desc: "В легкой раме FV433 установлена 105-мм пушка, обеспечивающая хорошее сочетание огневой мощи и маневренности."

 tank_eng_modern_chassis_aa_2: "§W§!FV433 Falcon§W§!"
 tank_eng_modern_chassis_aa_2_desc: "Falcon обеспечивают посредственный уровень противовоздушной обороны, которую следует использовать только в случае упорной борьбы за господство в воздухе. Как и для большинства британских машин поддержки, для Falcon приоритетом является скорость, чтобы иметь возможность оказывать поддержку в самых разных точках поля боя по мере необходимости."




 tank_eng_heavy_chassis_0: "§W§!Independent§W§!"
 tank_eng_heavy_chassis_0_desc: "При плохой броне, умопомрачительной скорости, отвратительной надежности и настолько длинном корпусе, что он не может нормально поворачиваться, единственным достоинством Independent является его хорошее основное вооружение 3-Pounder, которое все же лучше, чем высокоскоростной 2-Pounder, установленный на других британских танках."

 tank_eng_heavy_chassis_1: "§W§!Matilda Mk I§W§!"
 tank_eng_heavy_chassis_1_desc: "Matilda Mk I достаточно хорошо бронирован для своего времени, но оснащен только пулеметом, что делает его наступательные возможности ничтожными. Тесный салон, маленький экипаж и ужасающе низкая скорость делают этот танк крайне сложным для эффективного использования. Его лучше всего использовать для остановки наступления в стратегически сильных точках.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_heavy_chassis_2: "§W§!Matilda Mk II§W§!"
 tank_eng_heavy_chassis_2_desc: "Вариант Mk II - мощный пехотный танк с чрезвычайно высоким для своего времени уровнем бронирования. Его 2-фунтовое орудие очень эффективно пробивает вражескую броню, и сочетание этих двух факторов делает этот танк очень сильным на поле боя. Хотя танк очень медленный по сравнению с большинством других танков того времени, он очень надежен и способен справиться с труднопроходимой местностью.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_heavy_chassis_3: "§W§!Churchill Mk I§W§!"
 tank_eng_heavy_chassis_3_desc: "Первый танк в линейке техники Churchill, Mk I имеет довольно приличную броню, способную противостоять большинству вражеских орудий. Его 2-фунтовое орудие очень эффективно для уничтожения слабых целей, но против современной брони оно работает ужасно. Самыми большими недостатками машины являются высокая стоимость производства и низкая скорость.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_heavy_chassis_3_2: "§W§!Churchill Mk III§W§!"
 tank_eng_heavy_chassis_3_2_desc: "Mk III предусматривает серьезную модернизацию корпусного вооружения путем удаления корпусной гаубицы и замены ее на 6-фунтовое орудие. Несмотря на снижение эффективности против пехоты, модернизация позволила вывести серию Churchill на уровень современных британских танков в противотанковом бою.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_heavy_chassis_3_3: "§W§!Churchill Mk VII§W§!"
 tank_eng_heavy_chassis_3_3_desc: "Mk VII продолжил совершенствование вооружения своих предшественников, оснастив серию 75-мм противотанковой пушкой. Также значительно увеличилась броня, что позволило ему противостоять большинству противотанкового оружия своего времени. Этот танк чрезвычайно эффективен в борьбе практически со всеми видами вражеской бронетехники.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_eng_heavy_chassis_4: "§W§!Black Prince§W§!"
 tank_eng_heavy_chassis_4_desc: "Black Prince оснащен 17-фунтовым орудием, способным пробивать даже тяжелую броню противника. В сочетании с очень тяжелой броней "Черный принц" чрезвычайно эффективен в бою. В то же время усовершенствования двигателя позволяют танку иметь несколько увеличенную подвижность.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_heavy_chassis_6: "§W§!Caernarvon§W§!"
 tank_eng_heavy_chassis_6_desc: "В эту конструкцию было внесено мало изменений. Наиболее заметным улучшением стала конструкция двигателя и трансмиссии для повышения маневренности.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_eng_heavy_chassis_6_2: "§W§!Conqueror§W§!"
 tank_eng_heavy_chassis_6_2_desc: "Conqueror получает огромный бонус ко всем характеристикам своего предшественника, становясь практически непробиваемым и нанося огромный урон из 120-мм орудия L11. Его прорыв и скорость также значительно увеличены. За все эти бонусы приходится платить, так как танк очень дорог в производстве.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"


 heavy_tank_destroyer_chassistank_eng_heavy_chassis_5: "§W§!Tortoise§W§!"
 heavy_tank_destroyer_chassistank_eng_heavy_chassis_10: "§W§!Valentine AT§W§!"
 heavy_tank_destroyer_chassistank_eng_heavy_chassis_6: "§W§!Badger§W§!"
 heavy_tank_infantry_support_chassistank_eng_heavy_chassis_2: "§W§!Matilda Mk II CS§W§!"
 heavy_tank_infantry_support_chassistank_eng_heavy_chassis_3: "Churchill AVRE"
 heavy_tank_support_chassistank_eng_heavy_chassis_9: "§W§!Cruiser Mk I§W§!"
 heavy_tank_support_chassistank_eng_heavy_chassis_10: "§W§!Valentine§W§!"
 heavy_tank_artillery_chassistank_eng_heavy_chassis_10: "§W§!Bishop§W§!"
 heavy_tank_artillery_chassistank_eng_heavy_chassis_6: "§W§!Conqueror GC§W§!"

 tank_eng_heavy_chassis_td_5: "§W§!Tortoise§W§!"
 tank_eng_heavy_chassis_td_5_desc: "В соответствии со своим названием, "Черепаха" - это медленное, громоздкое транспортное средство, которое направляет свою огневую мощь исключительно на то, что находится перед ним. Она способна пробить большинство вражеских машин, оставаясь при этом практически непробиваемой. Опасайтесь ее медленной скорости, так как опытный враг знает, как обойти ее."

 tank_eng_heavy_chassis_td_6: "§W§!Badger§W§!"
 tank_eng_heavy_chassis_td_6_desc: "На бумаге Badger способен пробить любую бронемашину, которая может встретиться ему на пути. Сильно наклоненная броня и лобовое бронирование означают, что этот истребитель танков невозможно пробить спереди, и для того, чтобы справиться с ним должным образом, его нужно обойти. Его конструкция рубки затрудняет его использование при фланговом обстреле."

 tank_eng_heavy_chassis_infantry_support_2: "§W§!Matilda Mk II CS§W§!"
 tank_eng_heavy_chassis_infantry_support_2_desc: "Тяжелый танк поддержки пехоты\nПри оснащении Matilda Mk II малокалиберной 76-мм гаубицей ничего не изменилось в его медленной скорости и значительно снизились противотанковые возможности, но возросшая способность борьбы с легкими целями по-прежнему делает вариант CS грозной угрозой на поле боя."

 tank_eng_heavy_chassis_infantry_support_3: "§W§!Churchill AVRE§W§!"
 tank_eng_heavy_chassis_infantry_support_3_desc: "Тяжелый танк поддержки пехоты\nТанк Churchill AVRE использует 11-дюймовый минометный патрубок, чтобы направить 40-фунтовую бомбу в сторону вражеских подразделений. Благодаря своей взрывной силе она наносит очень большой урон всем целям в непосредственной близости. Танк также очень хорошо бронирован, что обеспечивает ему надежную защиту в наступательных операциях. Однако ему требуется значительная бронетехника и поддержка пехоты, чтобы уберечься от обстрела.."

 tank_eng_heavy_chassis_infantry_support_3_2: "§W§!Churchill Ardeer Aggie§W§!"
 tank_eng_heavy_chassis_infantry_support_3_2_desc: "Тяжелый танк поддержки пехоты\nТанк Ardeer Aggie трудно использовать в бою, так как снаряды приходится заряжать снаружи, что происходит очень медленно. Тяжелая броня танка гарантирует, что если экипаж находится внутри машины, то он будет защищен почти от всех повреждений."

 tank_eng_heavy_chassis_spg_6: "§W§!FV207§W§!"
 tank_eng_heavy_chassis_spg_6_desc: "FV207 - первая британская САУ, на которой установлено высококлассное вооружение в виде 152-мм гаубицы. Он обеспечивает значительный уровень огневой мощи, но для этого приходится жертвовать стоимостью производства и скоростью. Хотя танк построен на тяжелом шасси Caernarvon, он не может похвастаться высокими показателями брони."

 tank_eng_heavy_chassis_spg_6_2: "§W§!Conqueror GC§W§!"
 tank_eng_heavy_chassis_spg_6_2_desc: "Его чудовищное 234-мм орудие способно поразить вражеские подразделения огромной взрывной силой. Даже несмотря на тяжелое орудие, жертвы в броне позволяют САУ не отставать от других тяжелых машин."




 tank_eng_super_heavy_chassis_2: "§W§!TOG II§W§!"
 tank_eng_super_heavy_chassis_2_desc: "Разработанный с точки зрения Первой мировой войны и современного боя, TOG II был создан для того, чтобы использовать свой длинный корпус для преодоления грязной местности и больших провалов, таких как траншеи и воронки. Его большая структура затрудняет эффективное бронирование, но его орудие чрезвычайно эффективно уничтожает все цели с легкостью. Особое внимание стоит обратить на его ужасную скорость и стоимость производства."



