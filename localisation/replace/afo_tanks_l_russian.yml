 rangefinder: "Дальномер"
 rangefinder_desc: "Дальномер — устройство, предназначенное для определения расстояния от наблюдателя до объекта. Используется в геодезии, для наводки на резкость в фотографии, в прицельных приспособлениях оружия, систем бомбометания и т.д."
 assisted_turret_drive: "Усиленные приводы наводки башни"
 assisted_turret_drive_desc: "Вспомогательные приводы башни ускоряют вращение башни, позволяя быстрее нацеливаться на противника."
 rubber_tracks: "Резиновые накладки на гусеницы"
 rubber_tracks_desc: "Резиновые накладки на гусеницы помогают снизить количество поломок и повысить проходимость на дорогах"
 additional_machine_gun: "Дополнительный пулемет"
 additional_machine_gun_desc: "Дополнительные пулеметы на боковых выступах и специальных вертлюгах повышают эффективность обороны машины от атак пехоты на малой дистанции."
 tank_crew_radios: "Радиостанция для экипажа"
 tank_crew_radios_desc: "Радиостанции для связи экипажа танка."
  
  
 tank_volute_spring_suspension: "Система подвески с вертикальными спиральными пружинами"
 tank_volute_spring_suspension_desc: "Подвеска на волютных пружинах использует конические пружины из плоской стальной ленты, жёсткость которых растёт по мере сжатия; они компенсируют неровности поверхности."
 tank_vertical_spring_suspension: "Система подвески с вертикальными спиральными пружинами"
 tank_vertical_spring_suspension_desc: "Система подвески с вертикальными спиральными пружинами — это тип системы подвески транспортного средства, в которой для компенсации неровностей поверхности используются спиральные пружины."
 tank_horstmann_suspension: "Подвеска Horstmann"
 tank_horstmann_suspension_desc: "Подвеска Horstmann, также известная как Horstman, Vickers-Horstman и редко Slow Motion, представляет собой тип гусеничной подвески, разработанный британским конструктором танков Джоном Карденом и воплощенный в производственный проект инженером Сиднеем Хорстманном."
 tank_bell_crank_suspension: "Колокольчатая подвеска"
 tank_bell_crank_suspension_desc: "Колокольчатая подвеска- это тип кривошипа , который изменяет движение на угол. Угол может варьироваться от 0 до 360 градусов но наиболее распространены 90-градусные и 180-градусные коленчатые подвески."
 tank_leaf_spring_suspension: "Рессорная подвеска"
 tank_leaf_spring_suspension_desc: "Рессора — упругий элемент подвески транспортного средства. Рессора передаёт нагрузку от рамы или кузова на ходовую часть, смягчая удары и толчки при прохождении по неровностям пути."
 tank_belleville_washer_suspension: "Подвеска Шайба Бельвиля"
 tank_belleville_washer_suspension_desc: "Подвеска Шайба Бельвиля — представляет собой коническую оболочку, которая может нагружаться вдоль своей оси статически или динамически. Шайба Бельвиля — это пружина, имеющая форму шайбы."
 tank_unsprung_suspension: "Неподрессоренная подвеска"
 tank_unsprung_suspension_desc: "Неподрессоренная подвеска — понятие, применимое к наземным средствам передвижения, имеющим подвеску, которое обозначает массу, включающую массу колёс и остальных частей конструкции, отделённых подвеской от рамы либо кузова. Масса остальных элементов, удерживаемых подвеской над землёй, называется подрессоренной массой."
 tank_hydropneumatic_suspension: "Гидропневматическая подвеска"
 tank_hydropneumatic_suspension_desc: "Гидропневматическая подвеска — подвеска колёс транспортного средства, в которой функцию демпфирования выполняют гидропневматические демпферы особой конструкции, в которых усилие сжатия передаётся жидкостью на индивидуальную для каждого демпфера и несущую основную нагрузку на колесо замкнутую пневмокамеру-ресивер."
 tank_interleaved_suspension: "Перемежающийся торсион"
