 tank_hol_light_chassis_1: "§W§!CTLS-4TA§W§!"
 tank_hol_light_chassis_1_desc: "Разработанный американской фирмой Marmon-Herrington в качестве разведывательной машины для Голландской Ост-Индии, CTLS полезен только в роли разведчика из-за своего пулеметного вооружения. Приличная скорость и низкая стоимость производства позволяют легко внедрить его в большое количество дивизий."

 tank_hol_light_chassis_2: "§W§!CTMS-1TB1§W§!"
 tank_hol_light_chassis_2_desc: "Теперь, вооруженный 37-мм орудием, CTMS способен бороться с вражескими механизированными дивизиями, но малопригоден для борьбы с более тяжелой бронетехникой. Скорость снизилась по сравнению с CTLS, но сравнительно огромный прирост всех боевых характеристик делает его выгодным вложением средств по сравнению с предшественником."

 tank_hol_light_chassis_3: "§W§!MTLS-1GI4§W§!"
 tank_hol_light_chassis_3_desc: "Хотя удвоение брони по сравнению с CTMS является его наиболее привлекательной характеристикой, MTLS также примечателен тем, что в одной башне установлены две 37-мм пушки, используемые на CTMS. Это мало способствует улучшению боевых характеристик машины, но отрицательно сказывается на надежности."


