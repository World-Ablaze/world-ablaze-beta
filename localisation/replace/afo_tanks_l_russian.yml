 tank_ger_scout_car_chassis_1: "Sd.Kfz. 221"
 tank_ger_scout_car_chassis_1_short: "Sd.Kfz. 221"
 tank_ger_scout_car_chassis_1_desc: "Машина разведки\nВ качестве оружия для стрельбы использовался Sd. Kfz. 221 - это дешевая и гибкая машина-разведчик, способная выполнять как разведывательные, так и боевые функции. По сравнению с другими бронеавтомобилями его можно считать легкобронированным, и следует стремиться к созданию более тяжелой, модернизированной модели.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_scout_car_chassis_2_1: "Sd.Kfz. 222 A"
 tank_ger_scout_car_chassis_2_1_short: "Sd.Kfz. 222 A"
 tank_ger_scout_car_chassis_2_1_desc: "Разведывательная машина\n222 A - значительно модернизированный по сравнению с 221-й моделью вариант с более крупной башней и более тяжелым вооружением. Броня не была изменена, а открытый верх машины вызывает опасения, что экипаж может быть уязвим для гранат и других взрывчатых веществ.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_scout_car_chassis_2_2: "Sd.Kfz. 222 B"
 tank_ger_scout_car_chassis_2_2_short: "Sd.Kfz. 222 B"
 tank_ger_scout_car_chassis_2_2_desc: "Разведывательная машина\nВ 222 B внесены небольшие изменения в башню, которые обеспечивают экипажу лучший обзор окружающей местности. Надежность также была улучшена.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_combat_car_chassis_3: "Sd.Kfz. 231 6-Rad"
 tank_ger_combat_car_chassis_3_short: "Sd.Kfz. 231 6-Rad"
 tank_ger_combat_car_chassis_3_desc: "Бронеавтомобиль\n231 6-Rad обладает хорошей мобильностью на пересеченной местности. Предназначенный в основном для разведки и огневой поддержки, он имеет очень легкое бронирование.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_combat_car_chassis_4: "Sd.Kfz. 231 8-Rad"
 tank_ger_combat_car_chassis_4_short: "Sd.Kfz. 231 8-Rad"
 tank_ger_combat_car_chassis_4ipment_4_desc: "Бронеавтомобиль\nМодель 231 8-Rad отличалась от серии 231 6-Rad увеличенным с 6 до 8 количеством колес, что улучшало подвижность на более суровой местности. Предназначенный в первую очередь для разведки, он был небронированным со всех сторон.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_combat_car_chassis_5: "Sd.Kfz. 234"
 tank_ger_combat_car_chassis_5_short: "Sd.Kfz. 234"
 tank_ger_combat_car_chassis_5_desc: "Бронеавтомобиль\nСемейство 234 имеет значительно более мощную броню, чем предыдущие модели, и более тяжелое вооружение, что позволяет им более эффективно выполнять боевую роль. Использование двигателя Tatra V12 позволило значительно улучшить подвижность.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"
 ger_scout_armoured_car_5: "Sd.Kfz. 234/2 Puma"

 tank_ger_scout_car_chassis_6: "Schützenpanzer Kurz"
 tank_ger_scout_car_chassis_6_short: "Schützenpanzer Kurz"
 tank_ger_scout_car_chassis_6_desc: "Машина разведки\nСозданный на основе французской машины, Schützenpanzer Kurz предназначен для разведки и имеет хорошую бронезащиту для экипажа.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_scout_car_chassis_7: "Spähpanzer Luchs"
 tank_ger_scout_car_chassis_7_short: "Spähpanzer Luchs"
 tank_ger_scout_car_chassis_7_desc: "Машина разведки\nЕго 8-колесная конструкция позволяет ему успешно преодолевать бездорожье. Кроме того, отличный двигатель и небольшое количество брони делают эту машину чрезвычайно быстрой и способной на прорыв при достаточной огневой поддержке.\n§RЭто абсолютно новая модель, которая не сохраняет свою эффективность§!"

 tank_ger_combat_car_chassis_5_1: "Sd.Kfz. 234/2 Puma"
 tank_ger_combat_car_chassis_5_1_short: "Sd.Kfz. 234/2 Puma"
 tank_ger_combat_car_chassis_5_1_desc: "Бронеавтомобиль\nДобавление 50-мм пушки позволяет «Пуме» сражаться с легкобронированными танками союзников. Однако таких сценариев следует по возможности избегать, поскольку предназначение Puma - разведка."
 ger_combat_armoured_car_5_1: "Sd.Kfz. 234/2 Puma"

 tank_ger_combat_car_chassis_5_2: "Sd.Kfz. 234/4 Pak-Wagen"
 tank_ger_combat_car_chassis_5_2_short: "Sd.Kfz. 234/4 Pak-Wagen"
 tank_ger_combat_car_chassis_5_2_desc: "Добавление 75-мм пушки Pak 40 L/46 позволяет Puma выступать в роли легкобронированного, быстрого и смертоносного охотника за танками. Однако без дополнительной брони и с открытым верхом, это - определение стеклянной пушки."


 tank_ger_light_chassis_1: "§W§!Panzer I§W§!"
 tank_ger_light_chassis_1_desc: "Panzerkampfwagen I - это танк, предназначенный для обучения и внедрения концепции бронированной войны в немецкой армии. Его броня достаточна для того, чтобы остановить огонь стрелкового оружия, но вооружение не подходит для ведения танковой войны, его лучше использовать для поддержки пехоты. Однако скорость и надежность превосходны, что делает танк идеальным для немецкого «Блицкрига»."

 tank_ger_light_chassis_2: "§W§!Panzer II Ausf. A§W§!"
 tank_ger_light_chassis_2_desc: "Panzer II был разработан как промежуточный вариант на время разработки и производства более крупных и мощных танков. Вооруженный 20-мм автопушкой, он предназначен для нанесения быстрых ударов по вражеской пехоте с целью прорыва вражеских линий. Хотя его противотанковые возможности недостаточны, он может поражать другие легкие танки при хорошей поддержке. \n§YВы можете получить бесплатную полноценную производственную линию от фокуса «Планирование первого поколения танков».§!"
 ger_light: "Panzer II A"

 tank_ger_light_chassis_2_2: "§W§!Panzer II Ausf. D§W§!"
 tank_ger_light_chassis_2_2_desc: "С полностью новой торсионной подвеской и двигателем, новым корпусом с вдвое большей броней, чем у предшественника, Ausf. D обеспечивает высокую мобильность и достойную мягкую атаку за свою цену. Однако его противотанковые возможности оставляют желать лучшего.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_ger_light_chassis_3: "§W§!Panzer 38(t) Ausf. A§W§!"
 tank_ger_light_chassis_3_short: "§W§!Panzer 38(t)§W§!"
 tank_ger_light_chassis_3_desc: "\n§YРАЗРЕШЕНО, ЕСЛИ ОДНО ИЗ СЛЕДУЮЩИХ УСЛОВИЙ ЯВЛЯЕТСЯ ИСТИННОЙ: Полностью контролирует Богемию, Чехословакия - марионетка ИЛИ в союзе с Германией§!\n§YВы можете получить бесплатную полноценную производственную линию после фокуса «Судьба Чехословакии».§! \nPz.38(t) - чехословацкий танк, принятый на вооружение Германии после оккупации Богемии. Способность его орудия пробивать вражеские танки превосходит возможности любого немецкого легкого танка своего времени. Кроме того, благодаря своей надежности и универсальности, его шасси послужило базой для успешных вариантов САУ, ПТ-САУ и ЗСУ."
 ger_light_3: "Panzer 38t"

 tank_ger_light_chassis_3_1: "§W§!Panzer 38(t) Ausf. G§W§!"
 tank_ger_light_chassis_3_1_short: "§W§!Panzer 38(t) G§W§!"
 tank_ger_light_chassis_3_1_desc: "§YРАЗРЕШЕНО, ЕСЛИ ВЫПОЛНЯЕТСЯ ЛЮБОЕ ИЗ УСЛОВИЙ: Полностью контролирует Богемию, Чехословакия - марионетка ИЛИ в союзе с Германией§! \nAusf.G - это последняя "обычная" версия, с той же броней, но с лучшим распределением защиты и почти цельносварным корпусом. Его надежность и универсальность означают, что его шасси послужит базой для успешных вариантов САУ, ПТ-САУ и ЗСУ.\n§GЭто позволит сохранить 95% эффективности от $tank_ger_light_chassis_3$§!"

 tank_ger_light_chassis_4: "§W§!Panzer II Ausf. L 'Luchs'§W§!"
 tank_ger_light_chassis_4_short: "§W§!Panzer II Luchs§W§!"
 tank_ger_light_chassis_4_desc: "Известный также как Panzer II L, Luchs - это легкий танк, предназначенный для разведки. Он обладает меньшей огневой мощью, чем его предшественники, но имеет большую бронезащиту и скорость. Не стоит ожидать от этого танка хороших результатов в качестве фронтовой единицы. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_light_chassis_5: "§W§!Leopard§W§!"
 tank_ger_light_chassis_5_desc: "Leopard использует немецкий боевой опыт и служит боеспособной разведывательной машиной, используя наклонную броню от таких танков, как Panther. Он эффективен против пехоты и легкой бронетехники, но не может конкурировать с модернизированной средней и тяжелой бронетехникой. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_light_chassis_6: "§W§!E-25§W§!"
 tank_ger_light_chassis_6_desc: "Серия E - это попытка стандартизировать детали для всех немецких бронемашин, чтобы повысить надежность и эффективность производства. E-25 - очень быстрая боевая машина, способная бороться с вражескими машинами и пехотой. Несмотря на приличную броню, он может быть пробит некоторыми образцами переносного противотанкового оружия пехоты. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_ger_light_chassis_7: "§W§!E-30§W§!"
 tank_ger_light_chassis_7_desc: "E-30 улучшает все боевые элементы E-25. Он не может надежно бороться с современными машинами, но может хорошо служить в разведке и против легкобронированных подразделений. \n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 light_tank_destroyer_chassistank_ger_light_chassis_1: "§W§!Panzerjäger I§W§!"
 light_tank_destroyer_chassistank_ger_light_chassis_2: "§W§!Marder II§W§!"
 light_tank_destroyer_chassistank_ger_light_chassis_3: "§W§!Hetzer§W§!"
