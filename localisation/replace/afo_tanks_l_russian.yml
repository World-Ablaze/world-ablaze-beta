 tank_jap_light_chassis_td_3: "§W§!Ho-Ru§W§!"
 tank_jap_light_chassis_td_3_desc: "Ho-Ru представляет собой довольно дешевый вариант бронированного противотанкового орудия. Имея такую же пробиваемость, как и 47-мм противотанковая пушка Type 1 того же периода, Ho-Ru может справиться только с плохо оснащенными бронетанковыми подразделениями в Китае. Из-за слабой брони он подвержен контратакам вражеской бронетехники."

 tank_jap_light_chassis_td_5: "§W§!Ho-He§W§!"
 tank_jap_light_chassis_td_5_desc: "Ho-He - это небольшая модернизация предыдущей пт-сау Ho-Ru. Но поскольку это легкий истребитель танков, трудно оснастить его достаточной огневой мощью и броней для поддержания актуальности."

 tank_jap_light_chassis_spg_3: "§W§!Ho-To§W§!"
 tank_jap_light_chassis_spg_3_desc: "Ho-To обладает не самой большой огневой мощью, но это хорошо оснащенное транспортное средство. Он обеспечивает отличную защиту, при этом маневренен и дешев в производстве. Однако он очень хрупок, и его следует держать подальше от вражеских бронетанковых подразделений."

 tank_jap_light_chassis_spg_5: "§W§!Ku-Se§W§!"
 tank_jap_light_chassis_spg_5_desc: "Вооруженный 75-мм пушкой, Ku-Se имеет лишь минимальную лобовую броню и открыую рубку. Почти во всех отношениях он слабее своего предшественника, Ho-To, который уже устарел к моменту начала производства."

 tank_jap_light_chassis_aa_1: "§W§!Ki-To§W§!"
 tank_jap_light_chassis_aa_1_desc: "Для повышения противовоздушной эффективности Ki-To использует 20-мм автопушку. Из-за общей конструкции башни и вооружения танк очень неэффективен для сбивания вражеских самолетов. При этом он сохраняет все противопехотные возможности своего танка-родителя, что, по общему признанию, все еще очень мало."

 tank_jap_light_chassis_aa_4: "§W§!Ta-Se§W§!"
 tank_jap_light_chassis_aa_4_desc: "На Ta-Se улучшено противовоздушное вооружение, но стрелковый экипаж по-прежнему находится в тесной башне, что затрудняет обнаружение и наведение на цель вражеских самолетов. В результате улучшения противовоздушных возможностей не наблюдается."

 tank_jap_light_chassis_aa_4_2: "§W§!Ta-Se AAG§W§!"
 tank_jap_light_chassis_aa_4_2_desc: "Ta-Se AAG лишен башни Ta-Se и заменен приподнятой платформой для размещения двух 20-мм автопушек. Шасси, используемое в этой машине, слишком мало, чтобы использовать его в качестве платформы для стрельбы, и в результате боевая эффективность снижается. Несмотря на то что орудие стало гораздо более способным сбивать вражеские самолеты, оно сильно отстает в технологическом плане."



 tank_jap_medium_chassis_1: "§W§!I-Go§W§!"
 tank_jap_medium_chassis_1_desc: "Yi-Go (I-Go) вооружен короткоствольной 57-мм пушкой, предназначенной для уничтожения пехотных формирований. Несмотря на тонкую броню, корпус танка громоздкий и не позволяет развивать скорость. Танк устарел и должен быть обновлен для участия в современной войне.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_medium_chassis_2: "§W§!Chi-Ni§W§!"
 tank_jap_medium_chassis_2_desc: "Chi-Ni рассматривался как более легкая и дешевая альтернатива Chi-Ha. Из-за меньших размеров экипаж мог состоять только из трех человек, что приводило к значительным недостаткам в бою. Кроме того, несмотря на то, что это более легкий вариант, его более слабый двигатель означает, что он все еще медленнее, чем Chi-Ha.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_medium_chassis_3: "§W§!Chi-Ha§W§!"
 tank_jap_medium_chassis_3_desc: "На основе боевого опыта Китая и Сибири было решено, что Yi-Go слишком медлителен, чтобы поспевать за моторизованными пехотными частями. Несмотря на использование той же 57-мм пушки, "Чи-Ни" значительно улучшил конструкцию танка, добавив улучшенный купол, радиостанции, двигатель и схему бронирования. По возможности следует избегать боя с вражеской бронетехникой."

 tank_jap_medium_chassis_3_2: "§W§!Chi-Ha Kai§W§!"
 tank_jap_medium_chassis_3_2_desc: "Вооруженный специально разработанной 47-мм пушкой, использовавшейся на Chi-Ho, поздний вариант Chi-Ha оказался гораздо более способным справляться с вражескими бронетанковыми подразделениями. Кроме того, была увеличена башня, что позволило разместить в ней трех членов экипажа.\n§GЭто сохранит 95% эффективности от Chi-Ha§!"

 tank_jap_medium_chassis_4: "§W§!Chi-Ho§W§!"
 tank_jap_medium_chassis_4_desc: "В процессе разработки этого среднего танка большое внимание уделялось пушке, способной пробивать танки противника. Пограничные конфликты с Советским Союзом показали, что предыдущие модели были неэффективны при борьбе с чем-либо, кроме пехоты. Наряду с инновационной 47-мм пушкой, это был первый японский танк, в рулевом управлении которого использовалась гидравлическая система, что улучшило подвижность машины. Одним из очевидных недостатков этого танка является очень слабое бронирование.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_medium_chassis_5: "§W§!Chi-He§W§!"
 tank_jap_medium_chassis_5_desc: "Chi-He - первый японский танк, в стандартную комплектацию которого входила рация, что позволило улучшить оборону и прорыв. Танк использует ту же 47-мм пушку, что и Chi-Ho и Chi-Ha Kai. Несмотря на то, что броня этой модели значительно увеличилась, она все еще слишком тонкая для защиты от других средних танков.\n§GЭто сохранит 95% эффективности от Chi-Ha Kai§!"

 tank_jap_medium_chassis_5_2: "§W§!Chi-Nu§W§!"
 tank_jap_medium_chassis_5_2_desc: "Chi-Nu был разработан как временная мера, пока не будет произведено достаточное количество Chi-To и не отправлено в бой. Для выполнения этой задачи он был разработан с 75-мм пушкой, способной пробивать американскую среднюю броню. Хотя общая схема бронирования, шасси и подвеска были идентичны Chi-He, Chi-Nu имел увеличенную башню для установки нового орудия и трех членов экипажа.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_medium_chassis_6: "§W§!Chi-To§W§!"
 tank_jap_medium_chassis_6_desc: "Chi-To демонстрирует самый большой шаг в развитии японской бронетехники во время войны. Танк значительно крупнее всех своих предшественников и способен вместить экипаж из 5 человек. Благодаря модернизированной броне, 75-мм пушке и улучшенному двигателю Chi-To является чрезвычайно эффективным танком. Следует отметить, что за эти изменения пришлось заплатить повышенную стоимость производства.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

 tank_jap_medium_chassis_7: "§W§!Chi-Ri§W§!"
 tank_jap_medium_chassis_7_desc: "Chi-Ri должен был не только соответствовать бронетехнике союзников на Тихом океане, но и превосходить ее. Чтобы установить более крупную башню и улучшенное орудие, корпус Chi-To был удлинен. Хотя это означает, что огневая мощь танка может быть улучшена, пришлось пожертвовать броней, чтобы предотвратить утяжеление машины.\n§RЭто абсолютно новая модель, которая сохранит 75% эффективности предыдущих моделей.§!"

