 tank_pol_light_chassis_td_1: "§W§!TKS-W§W§!"
 tank_pol_light_chassis_td_1_desc: "Хотя TKW 2 способна пробивать очень легкую броню, она с большим трудом пробивает любую бронемашину, даже отдаленно хорошо бронированную. Кроме того, огневая мощь орудия хуже, чем у современных ПТ-САУ, что не дает оснований для производства этой машины."

 tank_pol_light_chassis_td_2: "§W§!TKS-D§W§!"

 tank_pol_light_chassis_td_4: "§W§!PZinz 160 AT§W§!"

 tank_pol_light_chassis_aa_4: "§W§!PZinz 170 AA§W§!"




 tank_pol_medium_chassis_1: "§W§!7TP dw§W§!"
 tank_pol_medium_chassis_1_desc: "Разработанный в Польше вариант широко экспортируемого британского 6-тонного танка Vickers, он не обладает достаточной наступательной мощью. Его пулеметное вооружение полезно для борьбы со слабовооруженной пехотой, но против любой вражеской брони оно не справится.\n\n Как и в случае с большинством танков начала войны, ограниченный экипаж из 3 человек ограничивает способность машины действовать как слаженная боевая сила в разгар боя."

 tank_pol_medium_chassis_1_2: "§W§!7TP jw§W§!"
 tank_pol_medium_chassis_1_2_desc: "Эта машина значительно улучшила своего предшественника, установив 37-мм противотанковую пушку, более надежный двигатель, перископ и рацию. Хотя этих улучшений все еще недостаточно, чтобы сделать 7TP отличным танком, машина предлагает мобильный и надежный ответ на вражескую бронетехнику раннего периода войны."

 tank_pol_medium_chassis_2: "§W§!10TP§W§!"
 tank_pol_medium_chassis_2_desc: "Вдохновленный американскими образцами Christie M1928 и M1931, этот крейсерский танк имеет гораздо больший акцент на мобильность, чем его предшественники. Мощный двигатель и гидравлический сервомеханизм рулевого управления позволяют танку развивать такую скорость.\n\n Увеличенный корпус также означает, что внутри может поместиться более многочисленный экипаж из 4 человек, что значительно облегчает задачу командира. Танк очень ненадежен из-за использования иностранных деталей."

 tank_pol_medium_chassis_3: "§W§!14TP§W§!"
 tank_pol_medium_chassis_3_desc: "14TP очень похож на 10TP, за исключением усиленной брони. Значительное увеличение защиты позволяет ей быть на одном уровне с броней многих средних танков ведущих стран, однако, машина все еще может быть пробита большинством противотанковых орудий.\n\n Опыт, полученный на 10TP, значительно повышает надежность этой машины."

 tank_pol_medium_chassis_4: "§W§!20TP§W§!"
 tank_pol_medium_chassis_4_desc: "20TP оснащен 75-мм орудием, способным бороться с легкой и средней броней. Несмотря на то, что при высокой стоимости машины ее характеристики несколько слабее, при благоприятных условиях она способна показать хорошие результаты."

 tank_pol_medium_chassis_5: "§W§!40TP§W§!"
 tank_pol_medium_chassis_5_desc: "Взяв элементы конструкции как от немцев, так и от Советов, 40TP получил немецкую башню и броневой профиль Т-34. Для танка столь позднего периода войны эта конструкция не имеет достаточных преимуществ в нескольких областях, но для данной ситуации она достаточно хорошо приспособлена.\n\n Она способна бороться со средней и легкой бронетехникой, но будет испытывать трудности при борьбе с модернизированными или тяжелобронированными войсками."

