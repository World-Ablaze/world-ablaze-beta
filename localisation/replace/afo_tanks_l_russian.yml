 light_tank_destroyer_chassistank_ger_light_chassis_5: "§W§!Jagdpanzer Leopard§W§!"
 light_tank_destroyer_chassistank_ger_light_chassis_6: "§W§!Jagdpanzer E-25§W§!"
 light_tank_assault_chassistank_ger_light_chassis_1: "§W§!Bison§W§!"
 light_tank_assault_chassistank_ger_light_chassis_2: "§W§!St.Pz II§W§!"
 light_tank_assault_chassisistank_ger_light_chassis_3: "§W§!Grille§W§!"
 light_tank_artillery_chassistank_ger_light_chassis_2: "§W§!Wespe§W§!"
