 tank_cze_medium_chassis_1: "§W§!St vz. 39§W§!"
 tank_cze_medium_chassis_1_desc: "Известный также как V-8-H, он оснащен 47-мм пушкой, обеспечивающей всестороннюю защиту от пехоты и транспортных средств. По случайному совпадению очень похожая на Panzer III, конструкция все же не дотягивает до нее из-за того, что экипаж из четырех человек слишком мал для выполнения большого количества боевых задач."

 tank_cze_medium_chassis_2: "§W§!Škoda T-23M§W§!"
 tank_cze_medium_chassis_2_desc: "Несмотря на незначительные улучшения, внесенные в ST vz. 39, в частности, систему рулевого управления с сервоусилителем, двигатель по-прежнему страдал от проблем с охлаждением, что приводило к его ненадежности. Но, несмотря на это, он остается достаточно способной универсальной боевой машиной."

 tank_cze_medium_chassis_3: "§W§!Škoda T-24§W§!"
 tank_cze_medium_chassis_3_desc: "Skoda T-24 имеет хорошо наклоненную броню, что позволяет увеличить бронезащиту при минимальном изменении массы. Его 75-миллиметровая пушка способна легко пробивать среднюю броню. Кроме того, машина очень быстрая и может маневрировать, чтобы получить тактическое преимущество перед вражескими силами."

 tank_cze_medium_chassis_3_2: "§W§!Škoda T-25§W§!"
 tank_cze_medium_chassis_3_2_desc: "Модернизированный вариант 75-мм орудия был добавлен для улучшения боевых возможностей машины против тяжелобронированных машин. Также были внесены незначительные улучшения в броню за счет изменения профиля башни и корпуса."

 tank_cze_medium_chassis_4: "§W§!Škoda T-40§W§!"
 tank_cze_medium_chassis_4_desc: "Skoda T-40 очень похож на своего предшественника T-25. Это фактически один и тот же танк, и T-40 даже проигрывает по статистике в нескольких случаях."

