 tank_hun_scout_car_chassis_1: "P.A.2"
 tank_hun_scout_car_chassis_1_short: "P.A.2"
 tank_hun_scout_car_chassis_1_desc: "P.A.2 обладает крайне низкими боевыми характеристиками, но при этом очень дешев. Он лучше всего подходит для разведывательных и гарнизонных целей и по возможности должен избегать боя. "

 tank_hun_scout_car_chassis_2: "39M Csaba"
 tank_hun_scout_car_chassis_2_short: "39M Csaba"
 tank_hun_scout_car_chassis_2_desc: "Оснащенный рацией, 39M Csaba мог эффективно координировать действия с другими подразделениями и обеспечивать их разведку. Вооруженный лишь слабой ПТ-винтовкой и пулеметом, он не слишком полезен для наступления. Машина чрезвычайно быстрая и дешевая."

 tank_hun_scout_car_chassis_3: "41M Hunor"
 tank_hun_scout_car_chassis_3_short: "41M Hunor"
 tank_hun_scout_car_chassis_3_desc: ""

 tank_hun_scout_car_chassis_4: "D-442 FUG"
 tank_hun_scout_car_chassis_4_short: "D-442 FUG"
 tank_hun_scout_car_chassis_4_desc: "Амфибийная разведывательная машина, способная двигаться на высокой скорости, D-442 FUG обеспечивает эффективную активную разведку. Стоимость его производства значительно выше, чем у 39M Csaba, но он все равно достаточно дешев в производстве."

 tank_hun_light_chassis_1: "§W§!Burstyn Motorgeschütz§W§!"
 tank_hun_light_chassis_1_desc: "Разработанный в Первую мировую войну, этот автомобиль был чрезвычайно медленным, слабо вооруженным и слабо бронированным. Машина не обладает достаточными наступательными характеристиками и вряд ли сможет преуспеть в бою, кроме поддержки легкой пехоты. Его ужасная конструкция также означает, что он склонен к поломкам.\n\nЭту машину следует избегать, пока не будут созданы более совершенные конструкции."

 tank_hun_light_chassis_2: "§W§!35.M Ansaldo§W§!"

 tank_hun_light_chassis_3: "§W§!36.M Ansaldo§W§!"

 tank_hun_light_chassis_4: "§W§!Straussler V4§W§!"

 tank_hun_light_chassis_5: "§W§!38.M TOLDI I§W§!"
 tank_hun_light_chassis_5_desc: "Эта машина была разработана на основе корпуса и башни Landsverk L-60 по лицензии Швеции. Хотя статистика танка ниже среднего, в целом это хороший танк, если учесть, что Венгрия - второстепенная страна. Его 20-мм автопушка способна пробивать машины с мягкой кожей, но основное его назначение - поддержка пехоты."

 tank_hun_light_chassis_5_2: "§W§!41.M TOLDI II§W§!"
 tank_hun_light_chassis_5_2_desc: "Вариант TOLDI 1941 года имеет 40-мм пушку, что позволяет ему справляться с другими легкими танками в полевых условиях. На данный момент большинство легких танков уже устарело в боевом отношении, и эту машину следует использовать только для разведки, когда это возможно."

 tank_hun_light_chassis_5_3: "§W§!43.M TOLDI III§W§!"
 tank_hun_light_chassis_5_3_desc: "Этот вариант TOLDI оснащен боковыми юбками, обеспечивающими дополнительную защиту от переносных противотанковых орудий пехоты. Боевые возможности машины по-прежнему крайне недостаточны, и ее следует использовать только для разведки."


 light_tank_destroyer_chassistank_hun_light_chassis_5: "Toldi páncélvadász"
 light_tank_aa_chassistank_hun_light_chassis_5: "40M Nimród"

 tank_hun_light_chassis_td_5: "Toldi páncélvadász"
 tank_hun_light_chassis_td_5_desc: "Для легкого танкового эсминца он вполне способен выполнять противотанковую роль, обеспечивая статистику на уровне своего современника 44M Zrinyi. Машина мобильна, но имеет очень низкую броню, и это следует иметь в виду."

 tank_hun_light_chassis_aa_5: "40M Nimród"
 tank_hun_light_chassis_aa_5_desc: "Для легкой самоходной зенитной установки "Нимрод" - очень способная противовоздушная машина. 40-мм орудие способно пробивать среднюю и легкую броню и наносить большой урон как технике, так и пехоте. Однако дальнейшая модернизация этой машины не предусмотрена."




 tank_hun_medium_chassis_1: "§W§!40.M Turán I§W§!"
 tank_hun_medium_chassis_1_desc: "Созданный на основе чешского LT vz. 35 и оснащенный 40-мм орудием, "Туран" представляет собой хороший баланс статистики для второстепенной страны. Для своего времени он очень хорошо бронирован и способен пробить большинство бронированных машин. Кроме того, это один из немногих ранних средних танков с 5-местной компоновкой экипажа."

 tank_hun_medium_chassis_1_2: "§W§!41.M Turán II§W§!"
 tank_hun_medium_chassis_1_2_desc: "Turan II оснащен модернизированным 75-мм орудием для повышения огневой мощи. Также были добавлены улучшенные радиостанции для обеспечения устойчивой связи между машинами в ходе крупных операций."

 tank_hun_medium_chassis_1_3: "§W§!43.M Turán III§W§!"
 tank_hun_medium_chassis_1_3_desc: "На Turan III установлен вариант 75-мм орудия, способный пробивать тяжелую броню и значительно повышающий противотанковые возможности машины. Для защиты от пехотных переносных противотанковых орудий были добавлены боковые юбки."


 medium_tank_destroyer_chassistank_hun_medium_chassis_1: "44M Zrinyi"
 medium_tank_assault_chassistank_hun_medium_chassis_1: "43M Zrinyi"

 tank_hun_medium_chassis_td_1: "44M Zrinyi"
 tank_hun_medium_chassis_td_1_desc: "Эта машина не имеет дополнительных пробивных возможностей по сравнению с шасси Turan III, на котором она построена, поскольку обе машины используют одно и то же орудие. Тем не менее, машина очень дешева в производстве, так что это очень хороший мобильный противотанковый вариант для слабой в промышленном отношении страны."

 tank_hun_medium_chassis_assault_1: "40M Zrinyi"
 tank_hun_medium_chassis_assault_1_desc: "Штурмовое орудие\nЭтот Zrinyi обеспечивает очень высокий уровень мягкой атаки при минимальных затратах на производство. Он также достаточно хорошо бронирован и отлично уничтожает пехотные подразделения во время бронетанковых наступлений.\n\nКак и большинство штурмовых орудий, он страдает от очень низкой защиты и прорыва из-за неточности оружия и расположения орудия."

 tank_hun_medium_chassis_assault_1_2: "43M Zrinyi"
 tank_hun_medium_chassis_assault_1_2_desc: "Штурмовое орудие\nВ варианте 1943 года Zrinyi немного улучшил огневую мощь своего предшественника. Хотя его боевые характеристики все еще довольно хороши, он не настолько выдающийся, как версия 1940 года."




 tank_hun_modern_chassis_1: "§W§!44.M Tas§W§!"

 tank_hun_modern_chassis_2: "§W§!47.M Tas§W§!"
 tank_hun_modern_chassis_2_desc: "Несмотря на относительно низкую броню, его огневая мощь способна пробить большинство машин. Скорость машины также позволяет ей совершать быстрые прорывы."

 tank_hun_modern_chassis_3: "§W§!50.M Horthy§W§!"


 modern_tank_destroyer_chassistank_hun_modern_chassis_2: "46M Tas rohamlöveg"
 modern_tank_assault_chassistank_hun_modern_chassis_2: "45M Tas Támadás"
 modern_tank_aa_chassistank_hun_modern_chassis_2: "45M Tas kihívó"

 tank_hun_modern_chassis_td_2: "46M Tas rohamlöveg"
 tank_hun_modern_chassis_td_2_desc: "46M Tas обладает хорошими пробивными и бронебойными характеристиками при довольно низкой стоимости. Он с трудом пробивает самые тяжелобронированные машины, но довольно уверенно справляется с большинством других."

 tank_hun_modern_chassis_assault_2: "45M Tas Támadás"
 tank_hun_modern_chassis_assault_2_desc: "Штурмовое орудие\n"

 tank_hun_modern_chassis_aa_2: "45M Tas kihívó"



