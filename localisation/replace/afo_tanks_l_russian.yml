 tank_cze_scout_car_chassis_1: "OA vz. 23"
 tank_cze_scout_car_chassis_1_short: "OA vz. 23"
 tank_cze_scout_car_chassis_1_desc: "Эта разведывательная машина обладает очень низкими боевыми характеристиками и лучше всего подходит для гарнизонных и разведывательных операций. Машина известна своей надежностью даже в суровых погодных условиях."


 tank_cze_light_chassis_1: "§W§!MU-4§W§!"

 tank_cze_light_chassis_2: "§W§!Lt vz.34§W§!"
 tank_cze_light_chassis_2_desc: "Построенный компанией CKD, Lt vz. 34 - довоенный легкий танк, во многом опередивший свое время. Он оснащался радиостанцией и 37-мм пушкой, способной бороться с вражескими машинами. Это дало ему довольно хорошие боевые характеристики по сравнению с другими легкими танками того времени."

 tank_cze_light_chassis_3: "§W§!Lt vz.35§W§!"
 tank_cze_light_chassis_3_desc: "Lt vz. 35 обеспечивает значительно улучшенную бронезащиту. Переработанные смотровые отверстия также позволяют экипажу лучше видеть поле боя и обнаруживать цели."

 tank_cze_light_chassis_4: "§W§!Lt vz.38§W§!"
 tank_cze_light_chassis_4_desc: "Lt vz. 38 - это хорошо оснащенный танк с достойной огневой мощью и броней. Даже в сравнении с танками ведущих стран он все равно способен держать удар."

 tank_cze_light_chassis_5: "§W§!Lt vz.40§W§!"
 tank_cze_light_chassis_5_desc: "Не получив никаких усовершенствований орудия со времен последней модели легкого танка, Lt vz. 40 страдает от критически низкой огневой мощи и способен бороться только с пехотой и очень легкой бронетехникой. В связи с этими проблемами его лучше всего использовать для разведки и гарнизонных операций."

 tank_cze_light_chassis_6: "§W§!T-15§W§!"
 tank_cze_light_chassis_6_desc: "Сохраняя устаревшую 37-мм пушку A7, T-15 превосходит своего предшественника во всех остальных областях: он быстрее, надежнее и обладает гораздо большей твердостью. Он даже потребляет меньше топлива, что будет иметь решающее значение для любой чешской армии, пытающейся противостоять натиску Оси."

 tank_cze_light_chassis_6_2: "§W§!T-15A§W§!"
 tank_cze_light_chassis_6_2_desc: "С учетом того, что более скорострельная 37-мм пушка наконец-то стала доступна, возможно, слишком поздно, к 1943 году T-15A все еще будет бороться с вражеской бронетехникой, но теперь будет лучше оснащен для борьбы с механизированными дивизиями. Броня и пробиваемость также повышаются, но за счет снижения скорости и надежности."

