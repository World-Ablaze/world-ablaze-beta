 generic_light_tank_1: "§W§!Renault FT§W§!"
 generic_light_tank_2: "§W§!Vickers 6T§W§!"


 tank_fin_medium_chassis_infantry_support_1: "§W§!БТ-42§W§!"
 tank_fin_medium_chassis_infantry_support_1_desc: "Орудие поддержки пехоты\nНа БТ-7art устанавливается 76-мм орудие типа KT, что делает его очень эффективным в борьбе с пехотой. Для установки орудия башня БТ-7art должна быть значительно увеличена по сравнению с оригинальной моделью. Дополнительный вес приводит к значительному снижению скорострельности, которая является определяющей чертой линейки БТ. Как и в случае с большинством штурмовых орудий, показатели мягкой атаки очень хороши, но за это приходится платить пробитием."
 fin_medium_spg_1: "БТ-42"
 fin_mechanized_infantry_1: "БТ-43"


 FRA_panhard_175_scout_car_chassis: "§W§!Panhard 175§W§!"
 FRA_panhard_175_scout_car_chassis_short: "Panhard 175"
 FRA_panhard_175_scout_car_chassis_desc: "Panhard 175 развивает межвоенный опыт, чтобы улучшить бронеавтомобиль Panhard 165. Экипажи оснащены радиооборудованием и поддержкой, что позволяет улучшить координацию действий. Благодаря опыту Франции в таких конфликтах, как война в Рифе, их ранние бронеавтомобили являются лучшими среди всех стран-союзниц. Хотя их превосходят немецкие бронеавтомобили, в некоторых аспектах они все же могут с ними потягаться."

 FRA_amd_38_scout_car_chassis: "§W§!AMD 38§W§!"
 FRA_amd_38_scout_car_chassis_short: "AMD 38"
 FRA_amd_38_scout_car_chassis_desc: "AMD 38 имеет лишь незначительные улучшения по сравнению с Panhard 175. Он жертвует небольшим уровнем наступательных возможностей, чтобы обеспечить большую защиту экипажа при более высоких показателях защиты и бронирования."

 FRA_amr_39_scout_car_chassis: "§W§!AMR 39§W§!"
 FRA_amr_39_scout_car_chassis_short: "AMR 39"
 FRA_amr_39_scout_car_chassis_desc: "Как и у предшественника, у AMR 39 есть лишь небольшие изменения, повышающие его боевую эффективность. Он обладает большей надежностью и пробиваемостью, но лишь в небольших количествах."

 FRA_aml_60_scout_car_chassis: "§W§!Panhard AML-60§W§!"
 FRA_aml_60_scout_car_chassis_short: "AML-60"
 FRA_aml_60_scout_car_chassis_desc: "AML-60 - очень способная машина-разведчик, оснащенная 60-мм пушкой-миномётом Brandt. Она хорошо проявляет себя в антипартизанских операциях, но способна достаточно хорошо вести себя и в фронтовых боях. "

 FRA_amd_40_combat_car_chassis: "§W§!AMD 40§W§!"
 FRA_amd_40_combat_car_chassis_short: "AMD 40"
 FRA_amd_40_combat_car_chassis_desc: "Созданный на базе шасси AMD 38, AMD 40 лучше подходит для противотанковых боев. Если сравнивать его с машиной-разведчиком своего времени, AMD 39, то AMD 40 имеет значительно более высокую пробиваемость и жесткость атаки."

 FRA_panhard_ebr_10_combat_car_chassis: "§W§!Panhard EBR 10§W§!"
 FRA_panhard_ebr_10_combat_car_chassis_short: "EBR 10"
 FRA_panhard_ebr_10_combat_car_chassis_desc: "EBR использует пуленепробиваемые шины с азотозаполненными камерами для достижения чрезвычайно высоких скоростей. Эта революционная конструкция позволяет использовать несколько технологических достижений в этой машине. В результате EBR 10 значительно превосходит все остальные бронеавтомобили, не уступая французским танкам того времени."

 FRA_panhard_ebr_11_combat_car_chassis: "§W§!Panhard EBR 11§W§!"
 FRA_panhard_ebr_11_combat_car_chassis_short: "EBR 11"
 FRA_panhard_ebr_11_combat_car_chassis_desc: "Вариант EBR 11 образца 1954 года является практически прямой копией EBR 10 с удлиненным 75-мм стволом. В результате EBR 11 удалось добиться повышенной противотанковой пробиваемости без дополнительных затрат на производство."

 FRA_panhard_ebr_12_combat_car_chassis: "§W§!Panhard EBR 12§W§!"
 FRA_panhard_ebr_12_combat_car_chassis_short: "EBR 12"
 FRA_panhard_ebr_12_combat_car_chassis_desc: "Эта бронемашина - очень дешевая альтернатива строительству более тяжелобронированных машин. У него очень низкая броня, но при этом он обладает приличными атакующими характеристиками и очень маневренен за невысокую цену. "

 FRA_renault_ft_light_tank_chassis: "§W§!Renault FT§W§!"
 FRA_renault_ft_light_tank_chassis_desc: "Renault FT заложил основу для всех будущих танков, получив очень надежную и стабильную конструкцию со стандартной компоновкой. Однако он крайне устарел"

 FRA_renault_r_35_light_tank_chassis: "§W§!Renault R35§W§!"
 FRA_renault_r_35_light_tank_chassis_desc: "Танк поддержки\nТанк Renault R35 обладает достойным бронированием и противопехотными возможностями для выполнения роли поддержки пехоты. Однако его орудие имеет крайне низкую бронепробиваемость, поскольку используется та же 37-мм пушка, что и на Hotchkiss H35. Кроме того, экипаж из двух человек и отсутствие радиостанций означали, что танк, как и большинство других французских танков, страдал от проблем с координацией. У него была одна поворотная командирская башенка, но ее приходилось вращать вручную и без того перегруженному командиру."

 FRA_renault_r_40_light_tank_chassis: "§W§!Renault R40§W§!"
 FRA_renault_r_40_light_tank_chassis_desc: "Танк поддержки\nПодобно Hotchkiss H35, Renault R35 считался недостаточно мощным орудием. У Рено R40 37-мм пушка L/35 удлинена для повышения бронепробиваемости. В комплектацию танка также входит радиостанция, но, как и в случае с другими французскими танками начала войны, ограниченный экипаж означает, что добавление радиостанции только увеличивает нагрузку на и без того напряженного командира, что приводит к снижению обороноспособности и способности к прорыву."

 FRA_renault_hotchkiss_h35_light_tank_chassis: "§W§!Hotchkiss H35§W§!"
 FRA_renault_hotchkiss_h35_light_tank_chassis_desc: "Hotchkiss очень плохо управляется при движении по неровной местности. Относительно высокая броня и 37-мм пушка L/35 SA38 позволяют ему хорошо выполнять противопехотные функции. На Hotchkiss сохранилась схема экипажа из двух человек, принятая на FT. Несмотря на это, танк настолько мал, что пространство для экипажа остается крайне тесным, что еще больше затрудняет концентрацию внимания на вопросах боя."

 FRA_renault_hotchkiss_h39_light_tank_chassis: "§W§!Hotchkiss H39§W§!"
 FRA_renault_hotchkiss_h39_light_tank_chassis_desc: "Для достижения более высоких скоростей в H39 значительно улучшен двигатель H35. Также улучшены гусеницы и подвеска, что позволило устранить многие проблемы маневренности оригинального танка. Для достижения большей бронепробиваемости танк использует удлиненную пушку L/35 37. Некоторые танки даже получили радиостанции, но из-за экипажа из двух человек их все равно сложно эффективно использовать при многозадачности."

 FRA_renault_amc_35_light_tank_chassis: "§W§!AMC 35§W§!"
 FRA_renault_amc_35_light_tank_chassis_desc: "AMC 35 - один из немногих танков французской разработки того времени, в котором была предусмотрена башня для двух человек. Однако это означает, что количество брони на башне уменьшено, чтобы освободить место для нового члена экипажа. По сравнению с Hotchkiss 39, эта конструкция жертвует броней ради увеличения скорости и прорыва. Однако отсутствие радиостанций означает, что координация наступательных и оборонительных операций по-прежнему затруднена."

 FRA_renault_amx_40_light_tank_chassis: "§W§!AMX-40§W§!"
 FRA_renault_amx_40_light_tank_chassis_desc: "Танк поддержки\nНе обладая большой огневой мощью, AMX-40 служит в тяжелобронированных подразделениях, способных защитить пехоту во время наступления. Танк имеет башню на 2 человека и мощную наклонную броню. Танк не имеет смотровых щелей, поэтому единственный способ видеть из танка - панорамный перископ в верхней части башни. Несмотря на то, что на танк предполагается установить рацию, назначенного радиста нет.  Хотя на Renault R40 есть небольшие улучшения в плане наступления, самым большим изменением стало значительное увеличение броневой защиты. "

 FRA_renault_amx_12_light_tank_chassis: "§W§!AMX-12§W§!"
 FRA_renault_amx_12_light_tank_chassis_desc: "Эта революционная конструкция имеет качающуюся башню. Его магазин револьверного типа использует автозарядку, позволяя танку разбрасывать большое количество огневой мощи. К сожалению, после стрельбы танк приходится оттаскивать в безопасное место, поскольку перезаряжать его приходится снаружи. Его надежное шасси служило основой для всех французских легких танков до 1985 года. В его состав входила рация, но не было назначенного радиста."

 FRA_renault_amx_13_75_light_tank_chassis: "§W§!AMX-13 75§W§!"
 FRA_renault_amx_13_75_light_tank_chassis_desc: "Созданный на основе прототипа AMX-12t, AMX-13 75 улучшил танк по всем параметрам, оснастив его 75-мм пушкой SA 50 для увеличения огневой мощи. По сравнению с другими легкими танками того времени, он имеет один из самых высоких показателей брони, но меньшую пробиваемость."

 FRA_renault_amx_13_90_light_tank_chassis: "§W§!AMX-13 90§W§!"
 FRA_renault_amx_13_90_light_tank_chassis_desc: "Продолжая линию AMX-13, в варианте 90 75-мм орудие заменено на 90-мм орудие среднего давления F3, способное стрелять фугасными противотанковыми снарядами (HEAT). Хотя при переходе от AMX-13 75 к AMX-13 90 статы выросли в основном незначительно, значение пробития увеличилось почти вдвое благодаря введению HEAT-снарядов."

 FRA_renault_bc_25t_light_tank_chassis: "§W§!BC 25t§W§!"
 FRA_renault_bc_25t_light_tank_chassis_desc: "Batignolles-Chatillion Char 25t является продолжением конструкции, представленной в линейке AMX-13, и использует ту же осциллирующую конструкцию башни и автозарядное вооружение. Ключевым отличием от предшественников является использование 4 членов экипажа, в котором, наконец, есть и наводчик, и радист. Во многих отношениях этот танк больше похож на средний, чем на легкий. Он превосходит другие легкие танки по всем показателям, но при этом гораздо дороже в производстве. По сравнению со средними танками он имеет довольно средние показатели, но ему сильно не хватает бронезащиты."

 light_tank_assault_chassisFRA_renault_ft_light_tank_chassis: "§W§!FT BS§W§!"
 light_tank_artillery_chassisFRA_renault_amx_12_light_tank_chassis: "§W§!AMX-AM§W§!"
 light_tank_artillery_chassisFRA_renault_amx_13_75_light_tank_chassis: "§W§!AMX-13 AM§W§!"
 light_tank_artillery_chassisFRA_renault_bc_25t_light_tank_chassis: "§W§!BC 55§W§!"
 light_tank_support_chassistank_fra_light_chassis_2: "§W§!Renault R35§W§!"
 light_tank_support_chassisFRA_renault_hotchkiss_h35_light_tank_chassis: "§W§!Hotchkiss H35§W§!"
 light_tank_support_chassistank_fra_light_chassis_5: "§W§!AMX-40§W§!"
 light_tank_aa_chassisFRA_renault_amx_13_75_light_tank_chassis: "§W§!AMX-13 DCA§W§!"

 FRA_ft_bs_light_assault_chassis: "§W§!FT BS§W§!"
 FRA_ft_bs_light_assault_chassis_desc: "Renault FT оснащен короткоствольной 75-мм пушкой Blockhaus Schneider. Из-за небольших размеров, унаследованных от Renault FT, в башню не помещается ни наводчик, ни заряжающий, ни радист. Нехватка людей и малые размеры башни крайне затрудняют эффективное использование орудия. Это означает, что, несмотря на значительные улучшения в мягкой атаке по сравнению с оригинальным FT, показатели прорыва и защиты у BS просто ужасны."

 FRA_amx_105_am_light_spg_chassis: "§W§!AMX-105 AM§W§!"
 FRA_amx_105_am_light_spg_chassis_desc: "AMX-105 AM несет точное и разрушительное 105-мм орудие на шасси AMX-12t. Однако сила отдачи намного превышает то, на что рассчитано небольшое шасси, из-за чего машина склонна к поломкам и неисправностям в полевых условиях."

 FRA_amx_13_am_light_spg_chassis: "§W§!AMX-13 AM§W§!"
 FRA_amx_13_am_light_spg_chassis_desc: "Используя 155-мм пушку на шасси AMX-13, эта ПЛРК имеет хорошие показатели мягкой атаки, но страдает от тех же проблем, что и ее предшественница, поскольку шасси не было рассчитано на отдачу такого большого орудия."

 FRA_amx_13_f3_light_spg_chassis: "§W§!AMX-13 F3§W§!"
 FRA_amx_13_f3_light_spg_chassis_desc: "Используя 155-мм пушку, AMX-13 F3 не обеспечивает столь мощной атаки, как некоторые более крупные ПТУР, но отнюдь не является маленькой. Он очень дешев в производстве и устраняет некоторые проблемы с надежностью своего предшественника, что делает его достойным внимания."

 FRA_amx_13_dca_light_spaa_chassis: "§W§!AMX-13 DCA§W§!"
 FRA_amx_13_dca_light_spaa_chassis_desc: "Французский вариант универсальной 40-мм пушки Bofors превращает AMX-13 в способную, быструю и надежную противовоздушную машину, хотя, как и следовало ожидать, броня у нее отсутствует."

 FRA_renault_d1_medium_tank_chassis: "§W§!Renault D1§W§!"
 FRA_renault_d1_medium_tank_chassis_desc: "Опираясь на опыт, полученный при создании FT, D1 служит не более чем ступенькой к более великим свершениям. С ужасной пробиваемостью, скоростью как у улитки и ужасной надежностью, единственным спасением D1 является немного лучшая броня, чем у его межвоенных аналогов. Но даже это преимущество было быстро сведено на нет развитием вооружения."

 FRA_renault_d2_medium_tank_chassis: "§W§!Renault D2§W§!"
 FRA_renault_d2_medium_tank_chassis_desc: "Для снижения веса в Renault D2 используется новая технология, позволяющая отказаться от внутренних балок, которые увеличили бы вес машины. К сожалению, эта технология делает процесс строительства чрезвычайно сложным, что приводит к высокой стоимости производства танка. Кроме того, танк очень ненадежен, что только усугубляет его высокую стоимость. Ключевым усовершенствованием D2 является добавление третьего члена экипажа в качестве оператора радио/телеграфии."

 FRA_somua_s35_medium_tank_chassis: "§W§!Somua S35§W§!"
 FRA_somua_s35_medium_tank_chassis_desc: "В Somua S35 используется хорошо наклоненная литая броня, что упрощает производство. В отличие от других французских танков, он разработан с учетом борьбы с ПТ и имеет значительные улучшения в пробитии и подвижности. Однако противопехотные возможности остались нетронутыми. Считаясь одним из лучших танков своего времени, башня с одним человеком и плохое стратегическое использование машины не позволили ей работать с максимальной эффективностью."

 FRA_somua_s40_medium_tank_chassis: "§W§!Somua S40§W§!"
 FRA_somua_s40_medium_tank_chassis_desc: "S40 увеличивает купол, первоначально присутствовавший на S35. Новая башня сварена и установлена на модернизированной надстройке, что позволило повысить стоимость и улучшить бронезащиту. По сравнению с S35, такие показатели, как пробиваемость и скорость, практически не изменились. Благодаря улучшенному прицеливанию из нового купола, этот танк значительно улучшил пробиваемость по сравнению с предшественником."

 FRA_somua_s40bis_medium_tank_chassis: "§W§!Somua S40 bis§W§!"
 FRA_somua_s40bis_medium_tank_chassis_desc: "S40 Bis получил ряд постепенных улучшений по сравнению с S40 — прежде всего немного усиленную броню и более высокую надёжность, — но сохранил пушку S35. Некогда одна из лучших противотанковых пушек в мире, теперь она с трудом справляется с бронёй противника."

 FRA_sarl_42_medium_tank_chassis: "§W§!SARL 42§W§!"
 FRA_sarl_42_medium_tank_chassis_desc: "SARL 42 заменяет типичную французскую башню, рассчитанную на одного человека, на башню с двумя членами экипажа и более крупным орудием. Новая конструкция башни позволяет выделить экипаж для выполнения различных задач в танке. Однако для поддержания аналогичного уровня бронезащиты она должна быть значительно больше, что делает машину более дорогостоящей в производстве. Кроме того, она имеет увеличенный купол, что облегчает командиру наблюдение за вражескими целями во время наступления, но в то же время делает танк более заметным."

 FRA_char_g1_medium_tank_chassis: "§W§!Char G1§W§!"
 FRA_char_g1_medium_tank_chassis_desc: "В Char G1 предполагается включить такие функции, как стабилизация орудия, полуавтоматическое заряжание и оптические дальномеры. Эти усовершенствования, а также установка 75-мм пушки L/32 позволили значительно повысить наступательные возможности как против пехоты, так и против танков. Башня танка рассчитана на двух человек и позволяет командиру самому наводить орудие, а также выполнять функции наводчика, если он того пожелает. Это первый средний танк Франции, который по своим характеристикам не уступает танкам промышленно развитых стран и при этом остается относительно дешевым в производстве."

 FRA_fcm_g2_medium_tank_chassis: "§W§!FCM G2§W§!"
 medium_tank_destroyer_chassisFRA_somua_s35_medium_tank_chassis: "§W§!SAu 40§W§!"
 medium_tank_assault_chassisFRA_somua_s35_medium_tank_chassis: "§W§!SAu 40 A§W§!"
 medium_tank_assault_chassisFRA_somua_s40bis_medium_tank_chassis: "§W§!SAu 40 A Bis§W§!"

 tank_fra_medium_chassis_td_3: "§W§!SOMUA S35 CA§W§!"
 tank_fra_medium_chassis_td_3_desc: "Созданный на базе шасси Somua S40, S35 CA заменяет башню на навесной каземат, что позволяет устанавливать более крупное орудие, способное пробивать вражеские танки. Из-за своей формы он получил прозвище "Ванна". Уменьшение сложности в результате снятия башни позволило удешевить производство танка. Несмотря на то, что пробитие танка уменьшилось по сравнению с его первоначальным вариантом, он отлично справляется с уничтожением танков благодаря повышенным показателям пробития и жесткой атаки."

 tank_fra_medium_chassis_td_3_2: "§W§!SAu 40 (75)§W§!"
 tank_fra_medium_chassis_td_3_2_desc: "Истребитель танков на базе среднего танка, 75-мм вариант SaU 40 имеет пробитие и броню, что делает его способным в бою с бронетехникой. Отсутствие слотов для хорошего обзора означает, что ТД испытывает трудности с пробитием и защитой."

 tank_fra_medium_chassis_td_4: "§W§!SAu 40 bis (75)§W§!"
 tank_fra_medium_chassis_td_4_desc: "Воплотив в шасси S40 bis концепцию каземата своего предшественника, SAu 40 bis обеспечивает хорошие противотанковые возможности, оставаясь при этом более тяжелобронированным, чем зарубежные аналоги."

 tank_fra_medium_chassis_assault_3: "§W§!SAu 40 (105)§W§!"
 tank_fra_medium_chassis_assault_3_desc: "Штурмовое орудие\nНа SAu 40 установлена 105-мм гаубица, обеспечивающая ему очень высокий уровень мягкой атаки за счет пробития. Ярко выраженная башня на вершине надстройки делает танк легко заметным, в результате чего его прорыв значительно снижается."

 tank_fra_medium_chassis_assault_4: "§W§!SAu 40 bis (105)§W§!"
 tank_fra_medium_chassis_assault_4_desc: "Штурмовое орудие\nУстанавливая ту же гаубицу, что и предыдущая версия SAu 40 bis, эта версия SAu 40 bis превосходит всех в уничтожении более мягких целей. Слишком большая пулеметная башня была снята, превратив SAu 40 bis в очень низкую и труднозаметную цель."
 
