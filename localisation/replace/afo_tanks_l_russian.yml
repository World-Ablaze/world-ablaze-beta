 tank_cze_medium_chassis_spg_3: "§W§!SnH T-25M§W§!"




 tank_cze_modern_chassis_1: "§W§!Škoda T-50§W§!"
 tank_cze_modern_chassis_1_desc: "У Skoda T-50 полностью переделана башня полусферической формы, в которой размещена 100-мм пушка. Эта модернизация позволяет ему пробивать некоторые, но не все тяжелые танки. Улучшенные системы обзора и наведения на цель также значительно повышают пробиваемость этого танка."

 tank_cze_modern_chassis_2: "§W§!Škoda T-51§W§!"
 tank_cze_modern_chassis_2_desc: "T-51 получил дальнейшее значительное улучшение всех боевых характеристик, однако танк очень слабо бронирован для современной машины этого времени. Он сможет справиться с большинством вражеских машин, но будет испытывать трудности в борьбе с тяжелобронированными противниками."

