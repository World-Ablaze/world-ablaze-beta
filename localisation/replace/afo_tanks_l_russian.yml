 tank_spr_light_chassis_1: "§W§!CCI tipo 37§W§!"
 tank_spr_light_chassis_1_desc: "Первый испанский танк Tipo 37, как и следовало ожидать, не слишком впечатляет. Его 20-мм пушка делает его несколько полезным против пехоты, но медленная скорость и минимальная броня означают, что в остальном он малопригоден."

 tank_spr_light_chassis_2: "§W§!Verdeja I§W§!"
 tank_spr_light_chassis_2_desc: "Копия советской 45-мм пушки, устанавливавшейся на такие танки, как Т-26 и БТ-5, Verdeja I обладает впечатляюще низким профилем и хорошей броней для легкого танка. Однако заднее расположение башни ограничивает угол наклона орудия, и он не слишком быстр для легкого танка."

 tank_spr_light_chassis_3: "§W§!Verdeja II§W§!"
 tank_spr_light_chassis_3_desc: "Отказавшись от странной задней турели своего предшественника, но сохранив низкий силуэт, Verdeja II улучшила свои характеристики в большинстве областей, став более быстрой и тяжелобронированной. Это позволяет добиться отличных пробивных характеристик, а единственным недостатком Verdeja II остается сохранение старой 45-мм пушки."

 light_tank_artillery_chassistank_spr_light_chassis_3: "§W§!CA Verdeja§W§!"

 tank_spr_light_chassis_spg_3: "§W§!CA Verdeja§W§!"




 tank_spr_medium_chassis_1: "§W§!Verdeja III§W§!"
 tank_spr_medium_chassis_1_desc: "О Verdeja III известно немного, кроме того, что Феликс Вердеха Бардалес получил приказ отменить его разработку после поставки из Германии танков Panzer III и IV. Таким образом, можно предположить, что следующим шагом в линии Verdeja был средний танк, аналогичный ранним Panzer, с сохранением таких отличительных черт программы Verdeja, как низкий профиль и наклонная броня."


