 tank_swe_scout_car_chassis_1: "landsverk l-180"
 tank_swe_scout_car_chassis_1_short: "landsverk l-180"
 tank_swe_scout_car_chassis_1_desc: "L-180 - очень хорошая машина-разведчик для своего времени. Хотя она отлично справляется со своей основной ролью разведчика, она также полезна в роли поддержки пехоты, используя свою мобильность для преследования мягкокожих машин и пехоты."

 tank_swe_scout_car_chassis_2: "Pansarbil m/39"
 tank_swe_scout_car_chassis_2_short: "Pansarbil m/39"
 tank_swe_scout_car_chassis_2_desc: "Pansarbil m/39 представляет собой большой скачок в качестве оборудования по сравнению с L-180. Улучшенные радиостанции, вооружение и двигатель делают эту машину не хуже предшественника во многих ролях."

 tank_swe_scout_car_chassis_3: "Pansarbandvagn 301"
 tank_swe_scout_car_chassis_3_short: "Pansarbandvagn 301"
 tank_swe_scout_car_chassis_3_desc: "Pansarbandvagn 301 мало чем отличается от своего предшественника. Улучшенное вооружение позволяет ему пробивать другие разведывательные машины, с которыми он может столкнуться во время разведки, но большинство характеристик машины не претерпели изменений и сильно устарели."


 tank_swe_light_chassis_1: "§W§!Stridsvagn m/29§W§!"
 tank_swe_light_chassis_1_desc: "Вариант немецкого Leichter Kampfwagen II, Stridsvagn m/29 вооружен двумя пулеметами и оснащен двигателем Scania-Vabis. Он крайне устарел и должен избегать боевого применения любой ценой. Лучше всего он подходит для использования в качестве учебной машины."

 tank_swe_light_chassis_2: "§W§!Stridsvagn L-60 m/38§W§!"
 tank_swe_light_chassis_2_desc: "Stridsvagn L-60 m/38 оснащен 20-мм автопушкой Madsen, которая лучше всего подходит для борьбы с пехотой и легкобронированной техникой. Несмотря на то, что машина хорошо оснащена, она не выделяется в какой-то одной области. Экипаж состоит из трех человек, что ограничивает количество задач, с которыми экипаж может справиться одновременно."

 tank_swe_light_chassis_2_2: "§W§!Stridsvagn L-60 m/39§W§!"
 tank_swe_light_chassis_2_2_desc: "Оснащенный 37-мм орудием, вариант L-60 образца 1939 года способен легко пробить большинство машин, но не обладает достаточной огневой мощью. Экипаж из трех человек не позволяет использовать машину по максимуму."

 tank_swe_light_chassis_2_3: "§W§!Stridsvagn L-60 m/40K§W§!"
 tank_swe_light_chassis_2_3_desc: "Вариант 1940L использует то же орудие, что и предыдущий, и имеет очень схожие наступательные характеристики. Корпус был удлинен и утолщен, что позволило значительно увеличить броню и противостоять многим противотанковым средствам."

 tank_swe_light_chassis_2_4: "§W§!Pvkv Varjan§W§!"


 light_tank_assault_chassistank_swe_light_chassis_2: "§W§!Stormartillerivagn m/43§W§!"
 light_tank_aa_chassistank_swe_light_chassis_2: "§W§!Landsverk L-62§W§!"

 tank_swe_light_chassis_assault_2: "§W§!Stormartillerivagn m/43 75§W§!"
 tank_swe_light_chassis_assault_2_desc: "Штурмовое орудие\nStormartillerivagn m/43 обладает внушительной огневой мощью в виде 75-мм гаубицы, заключенной в каземат. Поскольку орудие установлено только на шасси легкого танка, его огневая мощь не столь высока, как у других современных штурмовых орудий.."

 tank_swe_light_chassis_assault_2_2: "§W§!Stormartillerivagn m/43 105§W§!"
 tank_swe_light_chassis_assault_2_2_desc: "Штурмовое орудие\nЭтот вариант Stormartillerivagn m/43 оснащен 105-мм гаубицей. Легкое шасси не позволяет использовать орудие в полной мере из-за большого веса и отдачи."

 tank_swe_light_chassis_aa_2: "§W§!Landsverk L-62§W§!"
 tank_swe_light_chassis_aa_2_desc: "Противовоздушный вариант L-62 способен справиться с большинством самолетов. Его 20-мм автопушки также эффективны против легкой и средней брони, что позволяет этой машине выполнять широкий спектр функций за невысокую цену."




 tank_swe_medium_chassis_1: "§W§!Stridsvagn m/38 Lago§W§!"
 tank_swe_medium_chassis_1_desc: "Lago - это начало хорошо продуманной линейки шведских танков. Машина хорошо бронирована и способна эффективно бороться практически с любым противником."

 tank_swe_medium_chassis_2: "§W§!Stridsvagn m/42§W§!"
 swe_medium_tank_chassis_2_desc: "Stridsvagn m/42 - один из лучших средних танков среди всех малых стран. Оснащенный 75-мм орудием, он способен уничтожить любую бронетехнику, кроме самой тяжелой. Несмотря на то, что экипаж состоит из четырех человек, хорошо спроектированная башня и отличное оборудование связи позволяют экипажу полностью раскрыть свой потенциал в бою."

 tank_swe_medium_chassis_2_2: "§W§!Stridsvagn m/42 DT§W§!"

 tank_swe_medium_chassis_3: "§W§!Stridsvagn Pricken§W§!"


 medium_tank_destroyer_chassistank_swe_medium_chassis_2: "§W§!Pvkv m/43§W§!"
 medium_tank_assault_chassistank_swe_medium_chassis_2: "§W§!Pvkv m/44§W§!"
 medium_tank_aa_chassistank_swe_medium_chassis_2: "§W§!Luftvärnskanonvagn fm/43§W§!"

 tank_swe_medium_chassis_td_2: "§W§!Pvkv m/43§W§!"
 tank_swe_medium_chassis_td_2_desc: "Pkvk m/43 - это танк-уничтожитель, способный пробивать только очень легкую броню. По сравнению с Stridsvagn m/42, на базе которого он построен, он имеет гораздо более слабую пробиваемость и худшие боевые характеристики в целом. Его единственным спасением является то, что простая конструкция упрощает его производство."

 tank_swe_medium_chassis_td_2_2: "§W§!IKV 72§W§!"
 tank_swe_medium_chassis_td_2_2_desc: "IKV 72 обладает теми же противотанковыми возможностями, что и Stridsvagn m/74, но при этом значительно дешевле в производстве. Этот танковый разрушитель лучше всего действует в обороне, но не так хорошо проявляет себя в наступательных прорывах."

 tank_swe_medium_chassis_assault_2: "§W§!IKV 103§W§!"
 tank_swe_medium_chassis_assault_2_desc: "Штурмовое орудие\nIKV 103 - это штурмовое орудие, способное быстро перемещаться по полю боя для оказания поддержки. В отличие от большинства штурмовых орудий, его пробивная способность позволяет достаточно эффективно бороться со средним уровнем брони. При этом оно может быть очень дешевым, обеспечивая широкий спектр преимуществ за очень небольшие деньги."

 tank_swe_medium_chassis_aa_2: "§W§!Luftvärnskanonvagn fm/43§W§!"
 tank_swe_medium_chassis_aa_2_desc: "Изменения в конструкции башни позволяют улучшить прицеливание по самолетам. Использование того же орудия позволяет машине продолжать бороться с легкой бронетехникой и пехотой."




 tank_swe_modern_chassis_1: "§W§!IKV Leo§W§!"
 tank_swe_modern_chassis_1_desc: "IKV Leo еще больше улучшает пробитие m/74 благодаря улучшенным снарядам."

 tank_swe_modern_chassis_2: "§W§!Lansen C§W§!"
 tank_swe_modern_chassis_2_desc: "Несмотря на то, что Lansen C слабо бронирован по сравнению с современными танками, он очень эффективен при пробитии и уничтожении широкого спектра вражеских машин. Это мощная машина прорыва, и при умелом использовании в наступательных операциях она покажет отличные результаты."

 tank_swe_modern_chassis_3: "§W§!Stridsvagn 103§W§!"
 tank_swe_modern_chassis_3_desc: "Способный пробивать все танки, кроме нескольких, Stridsvagn 103 - это тяжелобронированный, но дорогой танковый эсминец. Как и большинство танковых эсминцев, он не обладает самыми высокими атакующими характеристиками, но чрезвычайно силен при удержании позиций против бронированных противников."




 tank_swe_heavy_chassis_1: "§W§!EMIL I§W§!"
 tank_swe_heavy_chassis_1_desc: "Дорогой, но мощный "Эмиль" предназначен для борьбы с численно превосходящими бронетанковыми силами. В значительной степени основанный на французских и немецких разработках, этот автомобиль имеет качающуюся башню и очень тяжелую броню. Оснащенная мощным орудием, она способна быстро расправиться с вражескими машинами."

 tank_swe_heavy_chassis_2: "§W§!Kranvagn§W§!"
 tank_swe_heavy_chassis_2_desc: "Усовершенствованный "Эмиль", "Кранвагн" значительно улучшает все наступательные характеристики, делая эту машину чрезвычайно мощной на поле боя. Этот танк очень дорог, но является лучшим вариантом для сохранения небольших людских резервов Швеции."



