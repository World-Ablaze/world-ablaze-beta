 tank_cze_light_chassis_td_3: "§W§!SID 32§W§!"
 cze_light_td_equipment_2_desc: "SID 32 не дает никаких дополнительных противотанковых возможностей по сравнению с Lt vz. 38. Хотя Lt 38 и дешевле, он и так очень дешев, так что разницы особой нет."

