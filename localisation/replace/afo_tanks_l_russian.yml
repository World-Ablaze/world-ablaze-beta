 tank_usa_scout_car_chassis_1: "M1 AC"
 tank_usa_scout_car_chassis_1_short: "M1 AC"
 tank_usa_scout_car_chassis_1_desc: "Бронеавтомобиль M1 обладает крайне слабыми наступательными характеристиками, но зато он дешев и очень мобилен. Низкая броня также означает, что его могут пробить даже плохо оснащенные пехотные дивизии, поэтому его следует по возможности держать подальше от фронтовых боевых действий."

 tank_usa_scout_car_chassis_2: "M3 Scout car"
 tank_usa_scout_car_chassis_2_short: "M3 Scout car"
 tank_usa_scout_car_chassis_2_desc: "M3 Scout Car по-прежнему оснащен только крупнокалиберными пулеметами, не внося особого вклада в наступательную статистику своего экипажа. Самое большое улучшение в этой конструкции заключается в значительно возросшей надежности."

 tank_usa_scout_car_chassis_3: "M70 Gage Commando"
 tank_usa_scout_car_chassis_3_short: "M70 Gage Commando"
 tank_usa_scout_car_chassis_3_desc: "Разработанный для быстрой транспортировки спецподразделений, M70 убирает 37-мм орудие, имеющееся на «стагхаунде», чтобы достичь невиданной скорости. При этом машина имеет лишь легкую броню и дешева в производстве и эксплуатации."

 tank_usa_combat_car_chassis_1: "M8 Greyhound"
 tank_usa_combat_car_chassis_1_short: "M8 Greyhound"
 tank_usa_combat_car_chassis_1_desc: "Вооруженный 37-миллиметровой пушкой, M8 Greyhound способен уничтожать более легкие машины. Однако отсутствие брони означает, что этот броневик очень уязвим и сам может быть уничтожен. Эта машина относительно дешева, поэтому ее можно использовать для множества целей."

 tank_usa_combat_car_chassis_2: "T17E1 Staghound"
 tank_usa_combat_car_chassis_2_short: "T17E1 Staghound"
 tank_usa_combat_car_chassis_2_desc: "Благодаря компактной раме и высокой скорости T17E1 отлично справляется с ролью разведчика. Оснащенный 37-мм пушкой, он является одним из немногих разведчиков, способных самостоятельно справиться с некоторыми машинами противника."

 tank_usa_combat_car_chassis_3: "M38 Wolfhound"
 tank_usa_combat_car_chassis_3_short: "M38 Wolfhound"
 tank_usa_combat_car_chassis_3_desc: "Как и его предшественник, «Волчонок» способен справиться с легкой бронетехникой при правильном расположении, но при этом его очень легко уничтожить. Низкая стоимость и высокая скорость позволяют производить его в большом количестве для патрулирования больших участков поля боя или гарнизона."

 tank_usa_combat_car_chassis_4: "T18E2 Boarhound"
 tank_usa_combat_car_chassis_4_short: "T18E2 Boarhound"
 tank_usa_combat_car_chassis_4_desc: ""

 tank_usa_light_chassis_1: "§W§!M2A2 Light§W§!"
 tank_usa_light_chassis_1_desc: "Будучи первым американским танком, M2 Light сильно устарел. Он может стабильно хорошо действовать против пехоты, плохо подготовленной к борьбе с бронетехникой, но разваливается, как только встречает вражеские бронетанковые части. Он очень быстрый и служит хорошей базой для будущих танковых технологий."

 tank_usa_light_chassis_1_1: "§W§!M2A4 Light§W§!"
 tank_usa_light_chassis_1_1_desc: "M2A4 оснащен 37-мм основной пушкой M5 и улучшенной броней толщиной 25 мм. Различные улучшения в трансмиссии и охлаждении двигателя повышают его надежность.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_usa_light_chassis_2: "§W§!M3 Stuart§W§!"
 tank_usa_light_chassis_2_desc: "Оснащенная 37-мм пушкой, первая модель Stuart способна наносить урон среднебронированным целям, но в некоторых сценариях может оказаться неэффективной. Наблюдения, сделанные во время войны, позволили американским конструкторам предусмотреть радиосвязь на своих "ранних" танках, что позволило им хорошо действовать в скоординированных атаках."

 tank_usa_light_chassis_3: "§W§!M5 Stuart§W§!"
 tank_usa_light_chassis_3_desc: "M5 Stuart - это всесторонняя модернизация M3, но легкие танки на данном этапе войны мало пригодны для ведения боевых действий. Сохранив то же 37-мм орудие, он лучше всего подходит для борьбы с пехотой.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_usa_light_chassis_4: "§W§!M24 Chaffee§W§!"
 tank_usa_light_chassis_4_desc: "Chaffee оснащен легким 75-мм орудием, способным пробивать легкие и средние цели. Хорошо продуманные HE-снаряды позволяют танку наносить тяжелые повреждения всем типам боевых единиц, даже если речь идет о превосходящем противнике."

 tank_usa_light_chassis_5: "§W§!Walker Bulldog§W§!"
 tank_usa_light_chassis_5_desc: "Разработанный как вооруженный разведывательный танк, Walker Bulldog способен справиться со всеми легкими целями, которые могут встретиться на его пути. Все, с чем он не может справиться, может быть эффективно обойдено благодаря высокой скорости."

 tank_usa_light_chassis_6: "§W§!T49§W§!"
 tank_usa_light_chassis_6_desc: "90-мм орудие T49 относительно неплохо для легкого танка и способно наносить серьезные повреждения целям со средней броней. Сам танк имеет минимальную броню, поэтому его следует использовать осторожно, так как он имеет относительно высокую стоимость для легкого танка."

 tank_usa_light_chassis_9: "§W§!M22 Locust§W§!"
 tank_usa_light_chassis_9_desc: "Разработанный как десантный легкий танк, Locust имеет очень низкую броню и лучше всего подходит для поддержки пехоты в борьбе с легкобронированной техникой. За свою стоимость танк дает очень мало, и его следует использовать только в особых случаях."

 light_tank_infantry_support_chassistank_usa_light_chassis_3: "§W§!M8 Scott§W§!"
 light_tank_artillery_chassistank_usa_light_chassis_4: "§W§!M41 HMC§W§!"
 light_tank_artillery_chassistank_usa_light_chassis_5: "§W§!M44§W§!"
 light_tank_aa_chassistank_usa_light_chassis_4: "§W§!M19§W§!"
 light_tank_aa_chassistank_usa_light_chassis_5: "§W§!M42 Duster§W§!"

 tank_usa_light_chassis_infantry_support_3: "§W§!M8 Scott§W§!"
 tank_usa_light_chassis_infantry_support_3_desc: "Танк поддержки пехоты\nM8 Scott обеспечивает достойную огневую мощь для легкокорпусной машины, оставаясь при этом чрезвычайно маневренным и дешевым. Как штурмовое орудие, он нуждается в значительной поддержке, чтобы эффективно использовать свою огневую мощь. Низкая башня с открытым верхом делает экипаж крайне уязвимым для вражеского огня."

 tank_usa_light_chassis_td_3: "§W§!T49 TD§W§!"
 tank_usa_light_chassis_td_3_desc: "T49 - прототип-предшественник M18 Hellcat. Он представляет собой очень быстрый, но легкобронированный легкий танк-уничтожитель. Хотя на нем установлено не такое мощное орудие, как на M18, закрытый верх обеспечивает большую прочность."

 tank_usa_light_chassis_spg_4: "§W§!M41 HMC§W§!"
 tank_usa_light_chassis_spg_4_desc: "Будучи легким САУ, M41 HMC не обладает такой огневой мощью, как большинство тяжелых машин, но все же способен нанести большой урон, если вести непрерывный огонь. Ее сильные стороны - экономичность и мобильность. При эксплуатации этой машины следует соблюдать осторожность, поскольку ее открытая конструкция делает ее очень уязвимой для атак контрбатарей."

 tank_usa_light_chassis_spg_5: "§W§!M44§W§!"
 tank_usa_light_chassis_spg_5_desc: "Соединенные Штаты - одна из немногих стран, которые продолжают вкладывать деньги в легкие самоходные орудия на столь позднем этапе войны. В результате они получают доступ к очень дешевой подавляющей огневой мощи, которая при правильном использовании отлично справляется с уничтожением пехотных подразделений."

 tank_usa_light_chassis_aa_4: "§W§!M19§W§!"
 tank_usa_light_chassis_aa_4_desc: "Соединенные Штаты - одна из немногих стран, способных поставить на вооружение мобильную легкую зенитную машину, способную наносить большой урон воздушным силам противника. Благодаря высокой скорости и простоте производства M19 может обеспечить зенитную поддержку на больших участках поля боя, когда воздушное пространство оспаривается."

 tank_usa_light_chassis_aa_5: "§W§!M42 Duster§W§!"
 tank_usa_light_chassis_aa_5_desc: "M42 Duster еще больше улучшает зенитные возможности M19, а также увеличивает его скорость. При этом следует помнить о сравнительно низкой броне, чтобы не допустить эту машину к фронтовым боям."


 tank_usa_medium_chassis_1: "§W§!M2 Medium§W§!"
 tank_usa_medium_chassis_1_desc: "M2 Medium послужил основой для всех будущих американских средних танков. Многоцелевое 37-мм орудие позволяет танку относительно легко пробивать средние танки. Однако слабый калибр орудия не позволяет танку наносить большой урон."

 tank_usa_medium_chassis_2: "§W§!M3 Lee§W§!"
 tank_usa_medium_chassis_2_desc: "Построенный как временная мера для скорейшей отправки танков, оснащенных 75-мм пушкой, M3 Lee поставляется с основным орудием в спонсоне. Несмотря на то, что танк использует архаичную конструкцию, огневая мощь, которую способен обеспечить этот танк, очень хороша. Высокий силуэт и странное расположение главного орудия делают танк сложным в использовании, ограничивая эффективность работы экипажа."

 tank_usa_medium_chassis_3: "§W§!M4A1 Sherman§W§!"
 tank_usa_medium_chassis_3_desc: "M4 Sherman - это многоцелевая машина, обладающая отличными боевыми характеристиками, стоимостью и мобильностью. При использовании в больших количествах эти танки способны уничтожить как пехоту, так и бронетанковые группы. Хотя они не способны пробить более тяжелые модели, их высокие показатели атаки могут помочь в подавлении машины."
 usa_medium_tank_chassis_3: "M4A1 Sherman"

 tank_usa_medium_chassis_4: "§W§!M4A2 Sherman§W§!"
 tank_usa_medium_chassis_4_desc: "Корпус M4A2 изготовлен с использованием сварки, а не литья, что повышает бронестойкость танка. Сварную конструкцию также гораздо проще ремонтировать в полевых условиях, что повышает надежность.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_usa_medium_chassis_4_2: "§W§!M4A3E8 Sherman§W§!"
 tank_usa_medium_chassis_4_2_desc: "M4A3E8, также известный как "Легкая восьмерка", заменил 75-мм пушку на 76-мм, что повысило возможности танка против более тяжелых танков противника. Также был установлен усовершенствованный двигатель, обеспечивающий большую подвижность.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_usa_medium_chassis_5: "§W§!T20§W§!"
 tank_usa_medium_chassis_5_desc: "Прототип T20, ставший альтернативой M4 Sherman, был спроектирован как более хорошо вооруженный и бронированный, чем его более известный кузен, с использованием более мощной 76-мм пушки. Однако экспериментальная трансмиссия Torqomatic не оправдала себя в бою. Проблемы с надежностью трансмиссии и пушки оказались слишком серьезными, чтобы выйти из стадии прототипа."

 tank_usa_medium_chassis_6: "§W§!T23§W§!"
 tank_usa_medium_chassis_6_desc: "Прямой преемник T20, прототип T23 представляет собой усиленную версию T20. Однако 76-мм орудие было укорочено, чтобы сбалансировать башню. К сожалению, прежняя ненадежная трансмиссия была заменена на экспериментальную электрическую, в результате чего эту модель постигла та же участь, что и T20."

 tank_usa_medium_support_chassis_7: "§W§!M4A3 Jumbo§W§!"
 tank_usa_medium_support_chassis_7_desc: "Танк поддержки\nНа полпути между средним и тяжелым, Sherman Jumbo обладает мощной броней. Хотя его огневая мощь достаточна для борьбы со средними танками, при борьбе с тяжелыми машинами ему придется несладко."

 tank_usa_medium_support_chassis_7_2: "§W§!M4A3 Jumbo 76'§W§!"
 tank_usa_medium_support_chassis_7_2_desc: "Танк поддержки\nЭтот вариант Jumbo сохранил то же шасси с усиленной броней, что и оригинальный M4A3E2 Jumbo, но получил 76-мм пушку от Easy Eight. Это позволило Jumbo более эффективно уничтожать вражескую бронетехнику, что сделало его более универсальным тяжелым танком.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 medium_tank_destroyer_chassistank_usa_medium_chassis_2: "§W§!M9§W§!"
 medium_tank_destroyer_chassistank_usa_medium_chassis_3: "§W§!M10 Wolverine§W§!"
 medium_tank_destroyer_chassistank_usa_medium_chassis_9: "§W§!M18 Hellcat§W§!"
 medium_tank_destroyer_chassistank_usa_medium_chassis_4: "§W§!M36 Jackson§W§!"
 medium_tank_artillery_chassistank_usa_medium_chassis_2: "§W§!M7 Priest§W§!"
 medium_tank_artillery_chassistank_usa_medium_chassis_3: "§W§!M12§W§!"
 medium_tank_artillery_chassistank_usa_medium_chassis_4: "§W§!M40§W§!"
 medium_tank_infantry_support_chassistank_usa_medium_chassis_3: "§W§!M4A1 105§W§!"
 medium_tank_infantry_support_chassistank_usa_medium_chassis_4: "§W§!M4A2 105§W§!"
 medium_tank_aa_chassistank_usa_medium_chassis_4: "§W§!M4A2 Skink§W§!"

 tank_usa_medium_chassis_td_2: "§W§!M9§W§!"
 tank_usa_medium_chassis_td_2_desc: "M9 сравнительно легко пробивает среднюю броню, но с трудом справляется с тяжелой броней. M9 также легко бронирован и уничтожается большинством противотанковых орудий. Одним из преимуществ этой машины является ее дешевая себестоимость, что позволяет быстро поставить ее на вооружение в качестве временной меры."

 tank_usa_medium_chassis_td_9: "§W§!M10A1 Wolverine§W§!"
 tank_usa_medium_chassis_td_9_desc: "M10A1 - это модернизация своего предшественника, M10 Wolverine. Несмотря на то, что в целом он остался прежним, улучшенные двигатель и шасси делают M10A1 более быстрым и бронированным танком-уничтожителем по сравнению с предшественником. Кроме того, здесь исправлены такие недостатки, как отсутствие вспомогательного привода башни в M10."

 tank_usa_medium_chassis_td_3: "§W§!M10 Wolverine§W§!"
 tank_usa_medium_chassis_td_3_desc: "Как и его предшественник, Wolverine не обладает бронепробиваемостью, достаточной для надёжного уничтожения тяжёлых танков. Башенная компоновка делает этот истребитель танков гораздо гибче в бою — черта, почти уникальная для американских истребителей танков. Кроме того, в машине устранена большая часть проблем с бронированием, присущих M9."

 tank_usa_medium_chassis_td_4: "§W§!M36 Jackson§W§!"
 tank_usa_medium_chassis_td_4_desc: "Jackson способен пробить практически все вражеские машины, которые встретятся ему на поле боя. У него гораздо больше брони, чем у предшественников, но гораздо меньше скорость, что позволяет ему лучше сражаться с танками в затяжных боях."

 tank_usa_light_chassis_td_7: "§W§!M18 Hellcat§W§!"
 tank_usa_light_chassis_td_7_desc: "76-мм пушка, используемая на модернизированных танках Sherman, была установлена на раму гораздо более компактного Hellcat. Башенная, маневренная конструкция этого танкового эсминца позволяет ему добираться до отдаленных участков поля боя и вести огонь по слабым участкам вражеской брони. Эта дешевая и мобильная конструкция уничтожителя танков позволяет эффективно перебрасывать концентрированные противотанковые средства для быстрого реагирования на вражеские машины."

 tank_usa_medium_chassis_infantry_support_4: "§W§!M4A3 105§W§!"
 tank_usa_medium_chassis_infantry_support_4_desc: "Танк поддержки пехоты\nM4A3 Bulldozer оснащен 105-мм гаубицей и предназначен в основном для уничтожения укреплений, местности и пехотных формирований для поддержки наступающей пехоты. Она обладает гораздо большей огневой мощью, но испытывает трудности при борьбе с вражеской бронетехникой. Гаубица также гораздо более неточна."

 tank_usa_medium_chassis_spg_2: "§W§!M7 Priest§W§!"
 tank_usa_medium_chassis_spg_2_desc: "Priest содержит 105-мм гаубицу M1A2 в открытой конструкции. Несмотря на то, что Priest не обладает высочайшей огневой мощью, его можно производить очень высокими темпами благодаря низкой стоимости. Эта машина служит прочной основой для будущих разработок САУ."

 tank_usa_medium_chassis_spg_3: "§W§!M12§W§!"
 tank_usa_medium_chassis_spg_3_desc: "M12 представляет собой значительное улучшение по сравнению с Priest, основанное на опыте, полученном в боях. Благодаря установке 155-мм орудия огневая мощь машины увеличилась почти вдвое. Расположение заднего орудия в открытой установке, сопровождаемое амортизирующей отдачу земляной лопатой, станет общей конструктивной схемой для будущих проектов САУ."

 tank_usa_medium_chassis_spg_4: "§W§!M40§W§!"
 tank_usa_medium_chassis_spg_4_desc: "M40 очень похож на M12, в нем использована немного улучшенная версия 155-мм пушки. Машина также построена на шасси M4, а не M3, как все ее предшественники."

 tank_usa_medium_chassis_aa_4: "§W§!M4A2 Skink§W§!"
 tank_usa_medium_chassis_aa_4_desc: "На Skink установлены четыре 20-мм пушки Polsten, способные разнести в клочья самолеты, легкие машины и пехоту. Для самоходной противовоздушной пушки она обеспечивает отличную защиту экипажа и очень прочна."



 tank_usa_modern_chassis_1: "§W§!M26 Pershing§W§!"
 tank_usa_modern_chassis_1_desc: "Прежние ограничения по размерам в линейке M4 не позволяли разместить адекватную пушку, способную пробивать тяжелобронированные танки. M26 включает в себя значительные улучшения в бронировании и добавление 90-мм пушки, способной противостоять таким угрозам. Эти изменения сопровождаются значительным увеличением стоимости производства."

 tank_usa_modern_chassis_1_2: "§W§!T26E4 Super Pershing§W§!"
 tank_usa_modern_chassis_1_2_desc: "Как и «Легкая восьмерка», T26E4 Super Pershing является вариантом своего предшественника с усиленным вооружением. Хотя танк обладает хорошими наступательными и оборонительными характеристиками, он медлителен даже по сравнению с более тяжелыми танками.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"

 tank_usa_modern_chassis_2: "§W§!M46 Patton§W§!"
 tank_usa_modern_chassis_2_desc: "M46 был разработан с учетом опыта, полученного армией США при эксплуатации более тяжелых машин, таких как Pershing. Продолжая использовать 90-мм пушку, "Паттон" усовершенствовал ненадежную трансмиссию "Першинга". Танк не сможет пробить самую тяжелую бронетехнику, но будет в состоянии устранить большинство угроз, с которыми столкнется."

 tank_usa_modern_chassis_2_2: "§W§!M47 Patton§W§!"
 tank_usa_modern_chassis_2_2_desc: "M47 имеет обновленную башню, что привело лишь к небольшому улучшению брони и прорывных способностей.\n§GЭто позволит сохранить 95% эффективности предыдущей модели§!"
 
 tank_usa_modern_chassis_3: "§W§!M48 Patton§W§!"
 tank_usa_modern_chassis_3_desc: "Добавление 105-мм орудия улучшает способность танка пробивать вражеские машины. Башня также была переработана и получила большой наклон по бокам, что улучшило бронезащиту."

 tank_usa_modern_chassis_4: "§W§!M60 Patton§W§!"
 tank_usa_modern_chassis_4_desc: "M60 - это продолжение линейки Patton с дальнейшими улучшениями в броне и огневой мощи."

 tank_usa_modern_chassis_5: "§W§!T69§W§!"
 tank_usa_modern_chassis_5_desc: "T69 стал основой для экспериментальной линейки американских танков, включающей качающиеся башни и автозаряды, созданные по мотивам французских разработок. Это отличный танк прорыва с хорошей пробивной способностью."

 tank_usa_modern_chassis_6: "§W§!T54E1§W§!"
 tank_usa_modern_chassis_6_desc: "T54 хорошо приспособлен для борьбы с широким спектром целей с помощью 105-мм орудия с автоматической загрузкой. Несмотря на приличные показатели пушки и брони, танк сохраняет элемент скорости, который может быть полезен для обхода противника."

 modern_tank_destroyer_chassistank_usa_modern_chassis_2: "§W§!Hellhound§W§!"
 modern_tank_artillery_chassistank_usa_modern_chassis_2: "§W§!M53§W§!"
 modern_tank_aa_chassistank_usa_modern_chassis_2: "§W§!M249 Vigilante§W§!"

 tank_usa_modern_chassis_td_2: "§W§!M54 Hellhound§W§!"
 tank_usa_modern_chassis_td_2_desc: "Hellhound - это мобильное танковое орудие, обладающее непревзойденной пробивной мощью. В отличие от большинства танковых эсминцев, он может использовать свои HE-снаряды для нанесения значительного урона пехоте. Танк имеет достойную броню для усиления защиты экипажа, но при этом он чрезвычайно быстр."


 tank_usa_modern_chassis_spg_2: "§W§!M55§W§!"
 tank_usa_modern_chassis_spg_2_desc: "Очень похожий по наступательным характеристикам на M40, M55 гораздо лучше оснащен для борьбы с контрбатарейной стрельбой. Более мощный двигатель позволяет танку быть более мобильным, чтобы избежать попыток, а закрытый бронированный каземат защищает экипаж в случае возникновения такой ситуации."

 tank_usa_modern_chassis_aa_2: "§W§!M249 Vigilante§W§!"
 tank_usa_modern_chassis_aa_2_desc: "M249 - самый дорогой вид оружия класса "земля-воздух", имеющийся в распоряжении Соединенных Штатов. Благодаря высокой броне и высокой противовоздушной устойчивости машина способна защитить дивизию от воздушных сил во время фронтовых боев."



 tank_usa_heavy_chassis_1: "§W§!M6 Heavy§W§!"
 tank_usa_heavy_chassis_1_desc: "Большая часть американских тяжелых танков ограничена поставками через Атлантику. Хотя M6 и не дотягивает до уровня самых современных тяжелых танков, он обеспечивает устойчивую базу для разработки будущих тяжелых конструкций. M6 также не обладает достаточной огневой мощью и не сможет сравниться со своими тяжелыми аналогами."

 tank_usa_heavy_chassis_2: "§W§!T26E5§W§!"
 tank_usa_heavy_chassis_2_desc: "T26E5 устранил большинство проблем с подвижностью, которые были присущи его предшественнику. В нем значительно улучшена броня, но пришлось пойти на компромисс, согласившись на более слабую пушку. Хотя броня может помочь в защите от противотанковых орудий, пушка должна быть предназначена только для средних машин и поддержки пехоты."

 tank_usa_heavy_chassis_3: "§W§!T29§W§!"
 tank_usa_heavy_chassis_3_desc: "Первый по-настоящему тяжелый танк Соединенных Штатов Америки, превосходящий M6 Heavy по всем боевым возможностям. 105-мм орудие способно легко уничтожать машины на больших расстояниях."

 tank_usa_heavy_chassis_4: "§W§!T32§W§!"
 tank_usa_heavy_chassis_4_desc: "T32 очень хорошо бронирован, особенно в башне, что значительно повышает выживаемость экипажа. В результате он неуязвим для огня всех противотанковых орудий, кроме специализированных. Однако его орудие не получило серьезных улучшений и значительно уступает модернизированной броне."

 tank_usa_heavy_chassis_5: "§W§!M103§W§!"
 tank_usa_heavy_chassis_5_desc: "M103 оснащен 120-мм орудием, способным пробивать даже самые тяжелые танки противника в полевых условиях. Даже без пробития, сила атаки может нанести тяжелые повреждения машине и ее обитателям."

 tank_usa_heavy_chassis_6: "§W§!T57§W§!"
 tank_usa_heavy_chassis_6_desc: "T57 - единственный американский тяжелый танк с автозагрузкой. Он представляет собой идеальное сочетание брони, огневой мощи и подвижности, но при этом является одним из самых дорогих в производстве."

 tank_usa_heavy_chassis_7: "§W§!T110E5§W§!"
 tank_usa_heavy_chassis_7_desc: "T110E5 - самый тяжелобронированный танк в арсенале Соединенных Штатов. Он способен наносить и поглощать большое количество урона, но очень дорог в производстве."


 heavy_tank_destroyer_chassistank_usa_heavy_chassis_8: "§W§!T95§W§!"
 heavy_tank_destroyer_chassistank_usa_heavy_chassis_7: "§W§!T110E3§W§!"
 heavy_tank_infantry_support_chassistank_usa_heavy_chassis_3: "§W§!T30§W§!"
 heavy_tank_artillery_chassistank_usa_heavy_chassis_2: "§W§!T92§W§!"

 tank_usa_heavy_chassis_td_8: "§W§!T95§W§!"
 tank_usa_heavy_chassis_td_8_desc: "T95 - это супертяжелая машина, которая медленно передвигается по полю боя. Разработанный для вскрытия сильно укрепленных пунктов, T95 оснащен мощной 105-мм противотанковой пушкой и очень толстой броней, не поддающейся никаким противотанковым средствам, кроме самых сильных."

 tank_usa_heavy_chassis_td_7: "§W§!T110E3§W§!"

 tank_usa_heavy_chassis_infantry_support_3: "§W§!T30§W§!"
 tank_usa_heavy_chassis_infantry_support_3_desc: "Тяжелый танк поддержки пехоты\nТ30 уникален среди большинства танков поддержки пехоты тем, что на нем установлена длинноствольная 155-мм пушка. Это дает ему очень хорошие показатели пробития и пробиваемости, которых, как известно, не хватает танкам поддержки пехоты. В то же время показатели брони и мягкой атаки остаются очень хорошими. За все эти показатели приходится платить, так как танк дорог в производстве."

 tank_usa_heavy_chassis_spg_2: "§W§!T92§W§!"
 tank_usa_heavy_chassis_spg_2_desc: "T92 стоит гораздо дороже всех предыдущих самоходных орудий благодаря своим огромным размерам и чудовищной 240-мм гаубичной пушке. Снаряды, специально разработанные для разрушения бетона, позволяют этой машине эффективно разрушать укрепления, созданные пехотой."




