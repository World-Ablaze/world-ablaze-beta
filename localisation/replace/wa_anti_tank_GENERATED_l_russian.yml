    ger_at_4: "8cm PAW 600"
    ger_at_4_short: "8cm PAW 600"
    ger_at_4_desc: "Используя революционную новую систему высокого-низкого давления для стрельбы кумулятивными боеголовками, 8cm PAW значительно легче и проще в производстве, чем ранние противотанковые орудия, при этом обладая более высокими показателями бронепробиваемости. \n§RЭто совершенно новая модель, и она не сохранит эффективность§!"
    
    ger_at_5: "10cm PAW 1000"
    ger_at_5_short: "10cm PAW 1000"
    ger_at_5_desc: "Развивая конструкцию 8cm PAW 600, 10cm PAW 1000 обеспечивает значительный прирост бронепробиваемости ценой увеличения стоимости производства. \n§RЭто совершенно новая модель, и она не сохранит эффективность§!"

    sov_at_1: "45-мм M1932"
    sov_at_1_short: "45-мм M1932"
    sov_at_1_desc: "45-мм модель 1932 года была легкой быстрострельной противотанковой пушкой, разработанной путем объединения лафета немецкой 37-мм пушки 1930 года с 45-мм стволом, принятым на вооружение из-за больших запасов легко конвертируемых французских 47-мм снарядов. Подобно своему немецкому аналогу, 45-мм M1932 была в лучшем случае посредственной.\n§RЭто совершенно новая модель, которая не сохранит эффективность§!"

    sov_at_2: "45-мм М1937"
    sov_at_2_short: "45-мм М1937"
    sov_at_2_desc: "Модель 1937 года является усовершенствованной версией M1932; в ней используются современные боеприпасы, более надежное крепление щита и подвеска.\n§GЭто позволит сохранить производственную эффективность предыдущей модели§!"

    sov_at_3: "76-мм ЗиС-3"
    sov_at_3_short: "76-мм ЗиС-3"
    sov_at_3_desc: "Сталин высоко оценил это оружие как «шедевр конструкции артиллерийских систем». ЗиС-3 отличается высокой надежностью, точностью и высокой скорострельностью.\n§tНе может быть исследовано до тех пор, пока не исчезнет идея «Кавалерийская Клика».§!\n§YВозможно получить бесплатную линию с полной эффективностью производства от фокуса: §H$SOV_zis_name_default$§!\n§RЭто совершенно новая модель, которая не сохранит эффективность§!"

    sov_at_4: "57-мм ЗиС-2"
    sov_at_4_short: "57-мм ЗиС-2"
    sov_at_4_desc: "Появление тяжелой бронетехники противника подчеркнуло необходимость создания мощного орудия. Ориентируясь на характеристики собственного отечественного тяжелого танка КВ-1, 57-мм ЗиС-2 стреляет высокоскоростными снарядами с кинетической энергией, достаточной для пробивания брони КВ-1, при этом оставаясь легким и легко маскируемым орудием. \n§RЭто совершенно новая модель, которая не сохранит эффективность§!"

    sov_at_5: "85-мм Д-44"
    sov_at_5_short: "85-мм Д-44"
    sov_at_5_desc: "Ствол был разработан на основе ствола танка Т-34-85. Более крупный калибр обеспечивает 85-мм пушке Д-44 улучшенные характеристики по сравнению с предыдущими пушками, при этом сохраняя высокую скорострельность.\n§RЭто совершенно новая модель, которая не сохранит эффективность§!"

