 POL_new_polish_industry: "Новая польская промышленность"
 POL_new_polish_industry_desc: "Теперь, когда запад отвоеван у немцев, мы должны развить растущую промышленность в таких городах, как Гдыня, которые стремительно начинают соперничать по величию с Варшавой."
  
