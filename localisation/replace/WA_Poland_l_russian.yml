 POL_expand_krakow_industries: "Расширить промышленность Кракова"
 POL_expand_krakow_industries_desc: "Старая столица Польши Краков была освобождена из лап Австрийской империи, но город по-прежнему остается скованным своим прошлым: ему не хватает современной промышленности, необходимой, чтобы соперничать с Западом. Благодаря инвестициям мы вернем Краков к жизни."
  
 POL_modernize_galician_industry: "Модернизация промышленности в Галиции"
 POL_modernize_galician_industry_desc: "Галиция, как и Краков, когда-то принадлежала австрийцам, которые ею пренебрегали, но теперь, когда она снова находится в руках Польши, мы можем дать ей инвестиции в модернизацию, в которых она так отчаянно нуждается."
  
