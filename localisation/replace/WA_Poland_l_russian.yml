 pol_armor.31.t: "Данцигский суверенитет"
 pol_armor.31.d: "После Версальского договора Данциг стал полуавтономным государством и с тех пор желал независимости от нас и даже присоединения к Германии. Мы не можем допустить, чтобы такой ключевой город был отделен от нас и поставил под угрозу наш доступ к Балтийскому морю, и поэтому у нас есть несколько вариантов."
 pol_armor.31.a: "Мягкая интеграция лучше всего"
 pol_armor.31.b: "Лучше взять город под прямой контроль"
 pol_armor.31.c: "Отменить их автономию и подготовить полную интеграцию"
  
 pol_armor.31.tt: "§RМожет привести к агрессивной реакции Германии\n§!"
  
 pol_armor.32.t: "Польша аннексирует Данциг"
 pol_armor.32.d: "Польша ввела войска в Данциг и фактически аннексировала это государство. Данциг был немецким, и в нем до сих пор проживает большинство немецкого населения. Мы можем использовать эту возможность, чтобы вернуть город и снова сделать его немецким, ссылаясь на опасения притеснений жителей Данцига со стороны поляков."
 pol_armor.32.a: "Воссоединить Данциг с Рейхом!"
 pol_armor.32.b: "Пока будем наблюдать"
  
 pol_armor.33.t: "Польская гарантия"
 pol_armor.33.d: "Учитывая нынешнюю высокую напряженность во всем мире и высокую вероятность того, что Польша может оказаться следующей на очереди, Польша попросила военной защиты, если она будет втянута в оборонительную войну. Возможно, сейчас для нас настало время занять определенную позицию и помочь сохранить мир в Европе."
 pol_armor.33.a: "Мы предоставим гарантию"
 pol_armor.33.b: "Мы не можем направить наши силы на защиту Польши."
  
 pol_armor.34.t: "[FROM.GetName] гарантирует независимость Польши"
 pol_armor.34.d: "[FROM.GetName] согласился предоставить Польше гарантию защиты от любой угрозы ее независимости."
 pol_armor.34.a: "Мы сильны"
  
 pol_armor.35.t: "[FROM.GetName] отклоняет польскую гарантию"
 pol_armor.35.d: "[FROM.GetName] отклонил нашу петицию, и мы пока остаемся одни. Мы должны подготовиться к очень тяжелой войне"
 pol_armor.35.a: "Мы остались одни"
  
 pol_armor.801.t: "Польша требует референдума"
 pol_armor.801.desc: "в речи в Варшаве [POL.GetLeader] говорил о процветании, достигнутом с Речью Посполитой. С возвращением польско-литовского государства он попросил предоставить народу Литвы выбор объединения."
 pol_armor.801.a: "Пусть народ скажет свое слово."
 pol_armor.801.b: "Такие вещи следует доверить профессионалам."
 pol_armor.801.c: "Мы обеспечим правильный результат."
 pol_armor.802.t: "Референдум одобрен"
 pol_armor.802.desc: "Подведены итоги референдума, и предварительные подсчеты показывают, что значительное большинство выступает за Союз с Польшей."
 pol_armor.802.a: "Народ высказался."
 pol_armor.803.t: "Референдум провалился"
 pol_armor.803.desc: "Несмотря на хорошо организованную кампанию пропольских группировок, предварительные результаты показывают, что незначительное большинство выступает за сохранение статус-кво."
 pol_armor.803.a: "Мудрый выбор."
 pol_armor.804.t: "Референдум удался"
 pol_armor.804.desc: "Вскоре после полуночи [LIT.GetLeader] объявил, что литовский народ проголосовал за союз с Польшей. Пришла телеграмма, в которой официально предлагалось [POL.GetLeader] ключи от страны."
 pol_armor.804.a: "Отлично."
 pol_armor.805.t: "Референдум провален"
 pol_armor.805.desc: "Несмотря на все наши усилия, народ Австрии решил сохранить статус-кво."
 pol_armor.805.a: "Мы должны освободить страну и вернуть ее законному правителю."
 pol_armor.805.b: "Мы будем уважать результат."
 pol_armor.806.t: "Референдум отклонен"
 pol_armor.806.desc: "Литовский лидер [LIT.GetLeader] публично заявил, что вся страна едина в своем неприятии объединения с Польшей и что сама идея референдума о независимости Литвы совершенно абсурдна."
 pol_armor.806.a: "Посмотрим, насколько они на самом деле едины."
 pol_armor.806.b: "«Демократия» в действии."
 pol_armor.807.t: "Руководство референдумом"
 pol_armor.807.desc: "Предложение Польши провести референдум поставило нас в затруднительное положение на международном уровне. Нельзя сказать, что мы отказываем людям в выборе, но мы не можем доверять им в том, что они сделают правильный выбор. К счастью, есть пути и средства решения этой проблемы. Какого результата мы хотим от референдума?"
 pol_armor.807.a: "Народ против"
 pol_armor.807.b: "Народ за"
 