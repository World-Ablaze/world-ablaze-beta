 POL_polish_school_of_mathematics: "Польская школа математики"
 POL_polish_school_of_mathematics_desc: "Математика занимает центральное место практически во всех сферах технологического сектора. По всей Польше, от Львова до Варшавы, процветают математические школы. Мы должны извлечь выгоду из этого золотого века польских мыслителей и предоставить этим людям все, что им нужно, чтобы Польша стала технологической державой, которой она заслуживает быть!"
  
 POL_expand_the_university_of_warsaw: "Расширить Варшавский университет"
 POL_expand_the_university_of_warsaw_desc: "Варшавский университет — это место, где большинство величайших умов Польши преподают, учатся и расширяют технологические возможности Польши. Инвестируя в расширение университета, мы получим места для еще большего количества умов и мыслителей для укрепления польского государства!"
  
 POL_nationalist_education: "Националистическое образование"
 POL_nationalist_education_desc: "Бесчисленное количество молодых умов посещают университеты по всей стране, и мы упускаем прекрасную возможность внедрить в их сознание идеалы Польши, которую мы строим. Молодых людей следует поощрять становиться патриотами, борцами и оплотами польских идеалов!"
  
 POL_polish_army: "Wojska Lądowe - Сухопутные войска"
 POL_polish_army_desc: ""
  
 POL_anti_tank_modernization: "Противотанковая модернизация"
 POL_anti_tank_modernization_desc: "Любой враг обязательно направит против нас танки. Мы должны быть готовы оказать им теплый прием."
  
 POL_modernising_the_cavalry_tt: "Будет получен §YШаблон танковой дивизии§!.\n"
  
 POL_polish_airforce: "Sily Powietrzne - Военно-воздушные силы"
 POL_polish_airforce_desc: ""
  
 POL_introduce_ground_support: "Внедрить наземную поддержку"
 POL_introduce_ground_support_desc: ""
  
 POL_polish_navy: "Marynarka Wojenna - Военно-морской флот"
 POL_polish_navy_desc: ""
  
 POL_resume_naval_modernization: "Возобновить модернизацию ВМФ"
 POL_resume_naval_modernization_desc: "Теперь, когда мы восстановили контроль над береговой линией, мы можем возобновить модернизацию нашего военно-морского флота. Победа придет, если мы изучим методы ведения морской войны, прежде чем задействовать нашу промышленность."
  
 POL_orp_orzel: "ORP Orzeł"
 POL_orp_orzel_desc: "В современной морской войне побеждают как над водой, так и под водой, и если мы хотим конкурировать с подводными лодками Германии, мы должны проектировать и выпускать оригинальные польские подводные лодки."
  
 POL_modest_modernizations: "Скромные модернизации"
 POL_modest_modernizations_desc: "У нас небольшая экономика с небольшой береговой линией, поэтому модернизация нашего военно-морского флота должна быть скромной. Эсминцы — дешевый и эффективный способ защитить свое побережье, и мы должны сделать на них ставку."
  
 POL_dragon_ambition: "Драконьи амбиции"
 POL_dragon_ambition_desc: "Польский флот до сих пор был скромен и робок в своих попытках модернизации, но этому пришел конец. Великий польский дракон поднимется над волнами, и немцы, и русские содрогнутся от его рева, когда он, словно зверь, поднимется на горизонте!"
  
