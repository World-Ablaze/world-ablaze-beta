 ita_heavy_infantry_weapons_upgrade_2: "81/14 Model 35 Mortar"
 ita_heavy_infantry_weapons_upgrade_2_desc: "81/14 Model 35 Mortar"

 ita_heavy_infantry_weapons_upgrade_3: "81/14 Model 35 Mortar"
 ita_heavy_infantry_weapons_upgrade_3_desc: "81/14 Model 35 Mortar"

 ita_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 ita_night_vision_2: "Ночное видение II"
 ita_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 jap_inf_1: "Type 38"
 jap_inf_1_short: "Type 38"
 jap_inf_1_desc: "Type 38 - довоенная винтовка, которая не обладает достаточной мощностью практически во всех отношениях. Длинный ствол винтовки делает ее одним из лучших видов оружия для штыкового боя, но за его пределами у нее мало преимуществ. Одним из ключевых аспектов является ее высокая надежность, позволяющая использовать ее во враждебных условиях в Азии.\n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_inf_2: "Type 99"
 jap_inf_2_short: "Type 99"
 jap_inf_2_desc: "Как и его предшественник, Type 99 входит в семейство винтовок Arisaka. Небольшие улучшения были внесены в его боевые возможности, но по мощности он значительно отстает от других крупных стран. Его чрезвычайно низкая стоимость и высокая надежность позволяют использовать его в суровых условиях Азии.\n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_inf_3: "Type 99 + Type 100 SMG"
 jap_inf_3_short: "Type 99 + Type 100 SMG"
 jap_inf_3_desc: "Добавление Type 100 SMG увеличивает количество стрелкового оружия, которое пехота может направить на врага, значительно улучшая подавление. Несмотря на то, что все характеристики этого оружия в лучшем случае посредственны для того времени, оно довольно дешево в производстве.\n§GЭто позволит сохранить эффективность от Type 99§!"

 jap_inf_4: "Type Hei Rifle + Type 1 SMG"
 jap_inf_4_short: "Type Hei Rifle + Type 1 SMG"
 jap_inf_4_desc: "Type Hei — экспериментальная самозарядная винтовка, частично основанная на американской винтовке Педерсена. Пистолет-пулемет Type 1 — также экспериментальный, со свободным затвором и магазином на 50 патронов. Вместе они значительно повышают огневую мощь по сравнению с Type 38, но обходятся намного дороже. \n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_hv_inf_1: "Type 3 + Type 11"
 jap_hv_inf_1_short: "Type 3 + Type 11"
 jap_hv_inf_1_desc: "Хотя ничего особенного в них нет, "Тип 3" и "Тип 11" эффективны при использовании против легковооруженной пехоты. Это оружие менее мощное, чем большинство основных, но все же пригодное для использования, особенно если учесть, что это довоенное оружие.\n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_hv_inf_2: "Type 92 + Type 96"
 jap_hv_inf_2_short: "Type 92 + Type 96"
 jap_hv_inf_2_desc: "Тип 92 является хорошим улучшением по сравнению с Тип 3, однако он все еще имеет довольно низкую скорострельность, из-за чего получил прозвище "Дятел". Хотя Тип 96 также является улучшенной моделью, он все еще испытывает трудности в нескольких аспектах.\n§RЭто новая модель, и она не сохранит эффективность§!"
 jap_heavy_infantry_weapons_2: "Type 92 + Type 96"

 jap_hv_inf_3: "Type 92 + Type 99 + Type 97 AT"
 jap_hv_inf_3_short: "Type 92 + Type 99 + Type 97 AT"
 jap_hv_inf_3_desc: "Противотанкового ружья Type 97 будет достаточно, чтобы справиться с любой бронетехникой, которую мы можем встретить в Азии. Type 99 также является столь необходимым улучшением как наступательных, так и оборонительных возможностей наших войск. Следует отметить, что обе эти модернизации требуют значительного увеличения стоимости производства.\n§GЭто позволит сохранить эффективность от Type 92 + Type 96§!"

 jap_hv_inf_4: "Type 1 + Type 99 + Type 97 AT"
 jap_hv_inf_4_short: "Type 1 + Type 99 + Type 97 AT"
 jap_hv_inf_4_desc: "Чтобы снизить стоимость производства, пришлось пожертвовать боевой эффективностью, в результате чего появился Type 1.\n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_hv_inf_5: "Type 98 + Type 97 AT"
 jap_hv_inf_5_short: "Type 98 + Type 97 AT"
 jap_hv_inf_5_desc: "Type 98 основан на авиационном пулемете Type 89, а ручной пулемет Type Hei — экспериментальная автоматическая версия винтовки Type Hei. Вместе они значительно превосходят предыдущее и последующее японское тяжелое пехотное вооружение, но обладают меньшей надежностью и не сохраняют эффективность. \n§RЭто новая модель, и она не сохранит эффективность§!"

 jap_infantry_weapons_upgrade_1: "Type 97 Grenade"
 jap_infantry_weapons_upgrade_1_desc: "Type 97 Grenade"

 jap_infantry_weapons_upgrade_2: "Type 89 GD"
 jap_infantry_weapons_upgrade_2_desc: "Type 89 GD"

 jap_infantry_weapons_upgrade_3: "Type 2 GL"
 jap_infantry_weapons_upgrade_3_desc: "Type 2 GL"

 jap_heavy_infantry_weapons_upgrade_1: "Type 97 Mortar"
 jap_heavy_infantry_weapons_upgrade_1_desc: "Type 97 Mortar"

 jap_heavy_infantry_weapons_upgrade_2: "Type 94 Mortar"
 jap_heavy_infantry_weapons_upgrade_2_desc: "Type 94 Mortar"

 jap_heavy_infantry_weapons_upgrade_3: "Type 96/97 Mortar"
 jap_heavy_infantry_weapons_upgrade_3_desc: "Type 96/97 Mortar"

 jap_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 jap_night_vision_2: "Ночное видение II"
 jap_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 ger_inf_0: "Gewehr 88"
 ger_inf_0_short: "Gewehr 88"
 ger_inf_0_desc: ""

 ger_inf_1: "Gewehr 98 + MP 18"
 ger_inf_1_short: "Gewehr 98 + MP 18"
 ger_inf_1_desc: "Германия использует MP 18 в это время и является единственной страной, сделавшей это так рано. MP 18, несмотря на свою дороговизну, дает значительные боевые бонусы стандартным пехотным подразделениям. По сравнению со всем остальным стартовым пехотным снаряжением он очень дорог.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_inf_2: "Karabiner 98k + MP 35"
 ger_inf_2_short: "Karabiner 98k + MP 35"
 ger_inf_2_desc: "В Kar98k немного улучшена мягкая атака Gewehr 98, исправлены некоторые проблемы с надежностью, но в конечном итоге изменений очень мало.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_inf_3: "Karabiner 98k + MP 40"
 ger_inf_3_short: "Karabiner 98k + MP 40"
 ger_inf_3_desc: "MP 40 значительно улучшает конструкцию SMG, делая его более компактным, что позволяет легко использовать и производить его. Несмотря на наличие некоторых усовершенствований, по своей боевой эффективности это оружие отстает от многих других.\n§GЭто позволит сохранить эффективность от Karabiner 98k + MP 35§!"

 ger_inf_4: "Gewehr 41 + MP 40"
 ger_inf_4_short: "Gewehr 41 + MP 40"
 ger_inf_4_desc: "В Gewehr 41 отсутствует затворная рама, что позволяет быстрее перезаряжать Kar98k. Снижение точности стрельбы мешает дальнейшему использованию этого оружия. Кроме того, у пистолета имеются проблемы с надежностью. В эту линейку пехотного снаряжения входят более дешевые, но менее качественные пистолеты немецкого дерева.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_inf_5: "Gewehr 43 + MP 40"
 ger_inf_5_short: "Gewehr 43 + MP 40"
 ger_inf_5_desc: "Gewehr 43 - это усовершенствованная модель Gewehr 41, созданная в спешном порядке. Практически каждая характеристика оружия была улучшена, включая боевые характеристики, надежность и стоимость производства. В этой линейке пехотного снаряжения представлены более дешевые, но менее качественные орудия немецкого дерева.\n§GЭто позволит сохранить эффективность от Gewehr 41 + MP 40§!"

 ger_inf_6: "StG 44"
 ger_inf_6_short: "StG 44"
 ger_inf_6_desc: "Sturmgewehr 44 - первая успешная реализация штурмовой винтовки. Увеличенная скорострельность при сохранении прежнего калибра позволяет пехоте наносить большой урон при правильном использовании. Однако из-за новизны конструкции винтовка имеет некоторые проблемы с надежностью и дорога в производстве.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_inf_7: "StG 45"
 ger_inf_7_short: "StG 45"
 ger_inf_7_desc: "В StG 45 используется роликовый ударно-спусковой механизм, улучшающий самовзвод оружия. Для снижения стоимости некоторые элементы оружия были удалены или упрощены. Побочным эффектом такого решения стало значительное повышение надежности.\n§GЭто позволит сохранить эффективность от StG 44§!"

 ger_inf_8: "Heckler Koch G3 + Cönder SMG"
 ger_inf_8_short: "HK-G3 + Cönder SMG"
 ger_inf_8_desc: ""

 ger_hv_inf_1: "MG 08"
 ger_hv_inf_1_short: "MG 08"
 ger_hv_inf_1_desc: "Дорогой и неэффективный, MG 08 больше не актуален в современной войне.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_hv_inf_2: "MG 34"
 ger_hv_inf_2_short: "MG 34"
 ger_hv_inf_2_desc: "MG 34 воплощает в себе концепцию универсального пулемета, способного применяться практически во всех случаях, когда требуется пулемет. В оборонительных позициях он может действовать как мощный HMG, а на передовых позициях его можно использовать для прорыва вперед.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_hv_inf_3: "MG 34 + Panzerbüchse 39"
 ger_hv_inf_3_short: "MG 34 + Panzerbüchse 39"
 ger_hv_inf_3_desc: "Panzerbüchse 39 эффективно справляется со многими устаревшими машинами, которые мы можем встретить в это время. Без улучшений он будет сильно отставать, так как не имеет возможности бороться со средней бронетехникой.\n§GЭто позволит сохранить эффективность от MG34§!"

 ger_hv_inf_4: "MG 42 + Granatbüchse 39"
 ger_hv_inf_4_short: "MG 42 + Granatbüchse 39"
 ger_hv_inf_4_desc: "Более дешевый, чем его предшественник, MG 42 отличается высокой надежностью и простотой в эксплуатации. Огромная скорострельность делает его чрезвычайно эффективным для ведения огня на подавление, особенно в обороне. Granatbüchse 39 - это модифицированный устаревший Panzerbüchse, позволяющий стрелять HEAT-гранатами, чтобы не отставать от растущей танковой брони.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ger_hv_inf_5: "MG 42 + Panzerfaust"
 ger_hv_inf_5_short: "MG 42 + Panzerfaust"
 ger_hv_inf_5_desc: "Panzerfaust состоит из кумулятивного заряда, способного уничтожать вражескую технику гораздо надежнее и дешевле, чем более ранние гранатометы и противотанковые ружья.\n§GЭто позволит сохранить эффективность от $ger_hv_inf_4$§!"

 ger_hv_inf_6: "MG 42 + Panzerschreck 44"
 ger_hv_inf_6_short: "MG 42 + Panzerschreck"
 ger_hv_inf_6_desc: "Panzerschreck - это противотанковая ракетная установка, способная с легкостью уничтожать средние и даже некоторые тяжелые танки.\n§GЭто позволит сохранить эффективность от $ger_hv_inf_5$§!"

 ger_hv_inf_7: "MG 45 + Panzerschreck 44"
 ger_hv_inf_7_short: "MG 45 + Panzerschreck"
 ger_hv_inf_7_desc: "MG 45 - это упрощенная версия MG 42, использующая роликовый механизм задержки отката, что также способствовало повышению скорострельности.\n§RЭто новая модель, и она не сохранит эффективность§!"

