 fin_night_vision_1: "Ночное видение I"
 fin_night_vision_1_desc: "Возможность видеть врага, не будучи замеченным, - ключевой момент в ночных операциях. С изобретением инфракрасных технологий мы можем оснастить нашу армию устройствами, которые, хотя и громоздки, делают это возможным."

 fin_night_vision_2: "Ночное видение II"
 fin_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."


 swe_paratroopers_description: "Десантники: §G+5%§! к скорости и защите, а также §G+10%§! к атаке в холмах и равнинах.\n"

 swe_mountaineers_description: "Горнострелки: §G+10%§! к §Yскорости, атаке§! и §Yзащите§! в горах\n§G+5%§! к §Yскорости, атаке§! и §Yзащите§! в лесах, болотах и джунглях\n§G+2%§! §Yскорости, атаке§! и §Yзащите§! на холмах.\n"
 swe_mountaineers_commando_description: "Коммандос: §G+10%§! к скорости, §G+10%§! атаке в лесах, болотах, джунглях, горах и холмах.\n"

 swe_marines_description: "Морпехи: §G+5%§! к атаке на болотах, §G+10%§! к атакечерез реки и §G+15%§! к атаке в морских вторжениях.\n"
 swe_marines_commando_description: "Коммандос: §G+5%§! к атаке на болотах, §G+10%§! к атаке через реки и §G+15%§! к атаке в морских вторжениях, плюс §G+10%§! к скорости на этих типах местности.\n"

 swe_recon_description: "Горнострелки и десантники: §G+20%§! к скорости\n"

 swe_urban_training: "Обучение в городе"
 swe_urban_training_desc: "Десантникам и горнострелкам все чаще приходится сражаться в городах и поселках. Совместные усилия могут привести к улучшению тактики ведения боя в таких условиях."
 swe_urban_training_description: "Десантники и горнострелки: §G+20%§! к атаке и защите в городской местности.\n"

 swe_fort_training: "Обучение штурму укреплений"
 swe_fort_training_desc: "Морпехи и горнострелки все чаще штурмуют укрепления. Совместные усилия могут привести к улучшению тактики ведения боя против окопавшихся врагов."
 swe_fort_training_description: "Морпехи и горнострелки: §G+10%§! к атаке и защите в укреплениях.\n"

 swe_recon_training: "Обучение разведке"
 swe_recon_training_short: "Обучение разведке"
 swe_recon_training_desc: "Десантники и горнострелки часто оказываются перед лицом невероятных трудностей. Обучение их специальной тактике разведки даст им преимущество."

 swe_water_training: "Водная подготовка"
 swe_water_training_desc: "Морским пехотинцам и горнострелкам регулярно приходится сражаться в условиях повышенной влажности. Совместные усилия и обмен опытом могут способствовать совершенствованию тактики ведения боя в воде."
 swe_water_training_description: "Морпехи и горнострелки: §G+10%§! к атаке и §G+5%§! к защите через реки и болота.\nКомандос: §G+10%§! к атаке через реки и болота.\n"

 swe_jungle_training: "Обучение в джунглях"
 swe_jungle_training_desc: "Десантникам и горнострелковым войскам обычно приходится прокладывать маршруты через джунгли для достижения целей. Если объединить эти две группы для анализа местности, это поможет лучше проводить операции в этих местах."
 swe_jungle_training_description: "Десантники, коммандос и горнострелковые войска: §G+10%§! к скорости и §G+5%§! к атаке в джунглях.\n"

 swe_tank_training: "Противотанковая подготовка"
 swe_tank_training_short: "Обучение работе с танками"
 swe_tank_training_desc: "Морпехи и горцы сражаются с растущим числом танков. Обучение их слабым местам танков и атакам в ближнем бою поможет им уничтожить вражеские танковые силы."

 swe_tech_special_forces_training: "Подготовка спецназа"
 swe_tech_special_forces_training_short: "Подготовка спецназа"
 swe_tech_special_forces_training_desc: "Ужесточить программы обучения, чтобы наши спецподразделения стали более эффективными"

 swe_paratroopers4: "Десантники IV"
 swe_paratroopers4_short: "Десантники IV"
 swe_paratroopers4_desc: ""

 swe_tech_mountaineers4: "Горнострелковые войска IV"
 swe_tech_mountaineers4_short: "Горнострелковые войска IV"
 swe_tech_mountaineers4_desc: ""

 swe_marines4: "Морпехи IV"
 swe_marines4_short: "Морпехи IV"
 swe_marines4_desc: ""

 swe_paratroopers: "Десантники I"
 swe_paratroopers_desc: "Включение воздушно-десантных войск в состав нашей армии позволит нам проводить форсированные операции и размещать ключевые войска в ранее недоступных районах, открывая новые тактические возможности."
 swe_paratroopers2: "Десантники II"
 swe_paratroopers2_desc: "Переход от небольших операций с участием всего нескольких десантников к более крупным воздушно-десантным дивизиям открывает путь к массовым десантам, превращая эти силы из новинки в естественную часть боевых действий."
 swe_paratroopers3: "Десантники III"
 swe_paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погоды, стандартизация снаряжения, такого как прыжковые ботинки, и расширенная специализированная подготовка позволят свести к минимуму путаницу и риски, связанные с этими опасными миссиями.."
 swe_marines: "Морпехи I"
 swe_marines_desc: "Войска, специализирующиеся на Морских боевых действиях, становятся все более незаменимыми. Импровизированные методы и оборудование уходят в прошлое, поскольку наша морская пехота поддерживается специализированными десантными кораблями и обучением."
 swe_marines2: "Морпехи II"
 swe_marines2_desc: "Амфибийная война требует постоянных инноваций. Улучшение материально-технической поддержки и переносные гавани могут позволить нашим морским пехотинцам проводить высадки, которые иначе были бы невозможны."
 swe_marines3: "Морпехи III"
 swe_marines3_desc: "Морские пехотинцы могут быть не только амфибийной пехотой. В будущем наша морская пехота станет одним из самых дисциплинированных и организованных подразделений специального назначения."
 swe_tech_mountaineers: "Горнострелковые войска I"
 swe_tech_mountaineers_desc: "Боевые действия в горных районах подвергают солдат множеству опасностей, но иногда их невозможно избежать. Мы можем минимизировать эти риски, обеспечив наших солдат специальной подготовкой для таких условий."
 swe_tech_mountaineers2: "Горнострелковые войска II"
 swe_tech_mountaineers2_desc: "Помимо выживания, наши войска можно обучить использовать горы в своих интересах. С легким снаряжением и мулами они могут маневрировать по этой местности лучше, чем другие пехотинцы."
 swe_tech_mountaineers3: "Горнострелковые войска III"
 swe_tech_mountaineers3_desc: "Подготовка к самым сложным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск исключительной подготовки и дисциплины."
 swe_tech_special_forces: "Спецназ"
 swe_tech_special_forces_desc: "Нетрадиционные боевые действия требуют специальной подготовки. Мы должны быть уверены, что наши войска подготовлены и способны адаптироваться к суровым условиям."
 swe_advanced_special_forces: "Продвинутая подготовка спецназа"
 swe_advanced_special_forces_desc: "Благодаря всесторонней подготовке мы можем гарантировать, что наши спецназовцы будут способны выполнять задачи, превосходящие возможности обычных людей."
 swe_improved_special_forces:1 "Расширенная программа спецназа"
 swe_improved_special_forces_desc:1 "Спецназ способен выполнять задания, которые не под силу обычным солдатам. Нам необходимо расширить программы обучения, чтобы больше наших солдат получили соответствующую квалификацию."
 swe_extreme_environment_training: "Обучение работе в экстремальных условиях"
 swe_extreme_environment_training_desc: "Мы должны быть способны сражаться в самых суровых условиях. При правильном обучении и оснащении наши войска смогут сражаться в самых экстремальных условиях."
 swe_survival_training: "Подготовка к выживанию"
 swe_survival_training_desc: "Наши спецназовцы будут часто сражаться в тылу врага и в условиях дефицита снабжения. Мы должны научить их переносить суровые погодные условия и сражаться с ограниченными запасами."
 swe_elite_forces: "Элитные войска"
 swe_elite_forces_desc: "В спецназ попадают только лучшие из лучших. Солдаты, которые пройдут обучение, будут сильнее, быстрее и будут сражаться ожесточеннее, чем кто-либо другой."

 swe_night_vision_1: "Ночное видение I"
 swe_night_vision_1_desc: "Возможность видеть врага, не будучи замеченным, - ключевой момент в ночных операциях. С изобретением инфракрасных технологий мы можем оснастить нашу армию устройствами, которые, хотя и громоздки, делают это возможным."

