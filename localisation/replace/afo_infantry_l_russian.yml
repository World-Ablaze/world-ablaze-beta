 ita_paratroopers3: "Десантники III"
 ita_paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погоды, стандартизация снаряжения, такого как прыжковые ботинки, и расширенная специализированная подготовка позволят свести к минимуму путаницу и риски, связанные с этими опасными миссиями."
 ita_marines: "Морская пехота I"
 ita_marines_desc: "Войска, специализирующиеся на Морских боевых действиях, становятся все более незаменимыми. Самодельные методы и снаряжение уходят в прошлое, когда наша морская пехота получает поддержку в виде специализированных десантных кораблей и подготовки."
 ita_marines2: "Морская пехота II"
 ita_marines2_desc: "Амфибийная война требует постоянных инноваций. Улучшенная материально-техническая поддержка и переносные гавани позволяют нашим морским пехотинцам высаживать десанты, которые иначе были бы невозможны."
 ita_marines3: "Морская пехота III"
 ita_marines3_desc: "Морские пехотинцы могут быть не только амфибийной пехотой. В будущем наша морская пехота станет одним из самых дисциплинированных и организованных спецподразделений."
 ita_tech_mountaineers: "Горнострелковые войска I"
 ita_tech_mountaineers_desc: "Бой в горных массивах подвергает войска многим опасностям, но иногда их невозможно избежать. Мы можем минимизировать эти риски, обеспечив наших солдат специальной подготовкой для таких условий."
 ita_tech_mountaineers2: "Горнострелковые войска II"
 ita_tech_mountaineers2_desc: "Выходя за рамки выживания, наши войска могут быть обучены использовать горы в своих интересах. С легким снаряжением и мулами они могут маневрировать по этой местности лучше, чем другая пехота."
 ita_tech_mountaineers3: "Горнострелковые войска III"
 ita_tech_mountaineers3_desc: "Подготовка к самым трудным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск исключительной подготовки и дисциплины."
 ita_tech_special_forces: "Спецназ"
 ita_tech_special_forces_desc: "Нетрадиционные боевые действия требуют специальной подготовки. Мы должны убедиться, что наши войска подготовлены и способны адаптироваться к суровым условиям."
 ita_advanced_special_forces: "Продвинутая подготовка спецназа"
 ita_advanced_special_forces_desc: "Благодаря интенсивной подготовке мы можем гарантировать, что наши спецназовцы смогут выполнять задачи, превосходящие возможности обычных людей."
 ita_improved_special_forces:1 "Расширенная программа спецназа"
 ita_improved_special_forces_desc:1 "Спецназ способен выполнять миссии, которые не под силу обычным солдатам. Нам нужно расширить программы обучения, чтобы больше наших солдат получили соответствующую квалификацию."
 ita_survival_training: "Обучение выживанию"
 ita_survival_training_desc: "Наши спецназовцы часто будут сражаться в тылу врага и в условиях дефицита ресурсов. Мы должны научить их переносить суровую погоду и сражаться с ограниченными запасами."
 ita_elite_forces: "Элитные силы"
 ita_elite_forces_desc: "Только лучшие из лучших становятся спецназовцами. Солдаты, которые пройдут обучение, будут сильнее, быстрее и будут сражаться ожесточеннее, чем кто-либо другой."
 ita_extreme_environment_training: "Обучение работе в экстремальных условиях"
 ita_extreme_environment_training_desc: "Мы должны быть способны сражаться в самых суровых условиях. При правильном обучении и оснащении наши войска смогут сражаться в самых экстремальных условиях."

 jap_paratroopers_description: "Десантники: §G+5%§! к Скорости и Защите, а также §G+10%§! к Атаке в Холмах и Равнинах.\n"
 jap_paratroopers2_description: "Десантники получат §G+10%§! к Защите и §G+10%§! к Передвижению in в Холмах, Пустыне и Равнинах.\n"
 
 jap_mountaineers_description: "§OГорнострелковые войска§!: \n §G+10%§! к §YСкорости, Атаке§! и §YЗащите§! в Горах\n§G+5%§! к §YСкорости, Атаке§! и §YЗащите§! в Лесах\n§G+2%§! к §YАтаке§! и §YЗащите§! в Холмах.\n"
 jap_mountaineers_commando_description: "§OКоммандос§!: \n§G+10%§! к §YСкорости§! и §YАтаке§! в Лесах, Болотах, Джунглях, Горах и Холмах.\n"
 
 jap_marines_description: "§OМорпехи§!: \n§G+5%§! к §YАтаке§! и §YЗащите§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! и §YЗащите§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 jap_marines_commando_description: "§OКоммандос§!: \n§G+5%§! к §YАтаке§! и §G+10%§! §YСкорости§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 
 jap_urban_training: "Обучение в городе"
 jap_urban_training_desc: "Десантникам и горнострелкам все чаще приходится сражаться в городах и поселках. Совместные усилия могут привести к улучшению тактики ведения боя в таких условиях."
 jap_urban_training_description: "§OДесантники§!: \n§G+20%§! к §YАтаке§! и §YЗащите§! в Городской местности\n§OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Городской местности.\n"
 
 jap_fort_training: "Обучение в укреплениях"
 jap_fort_training_desc: "Морпехи и горнострелки все чаще штурмуют крепости. Совместные усилия могут привести к улучшению тактики ведения боя против окопавшихся врагов."
 jap_fort_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Укреплениях.\n"
 
 jap_recon_training: "Обучение разведке"
 jap_recon_training_desc: "Десантники и горнострелки часто оказываются перед лицом невероятных трудностей. Обучение их специализированной тактике разведки даст им преимущество."
 jap_recon_description: "§OГорнострелковые войска§! и §OДесантники§!: \n§G+20%§! к §YСкорости передвижения§!\n"
 
 jap_water_training: "Водная подготовка"
 jap_water_training_desc: "Морпехам и горнострелкам регулярно приходится сражаться в мокрой среде. Совместные усилия и обмен опытом могут способствовать совершенствованию тактики ведения боя в воде."
 jap_water_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §G+5%§! к §YЗащите§! на реках и в болотах.\nКоммандос: \n§G+10%§! к §YАтаке§! на реках и в болотах.\n"
 
 jap_jungle_training: "Обучение в джунглях"
 jap_jungle_training_desc: "Десантникам и горнострелкам обычно приходится прокладывать маршруты через джунгли для достижения целей. Объединение двух групп для анализа этой местности поможет лучше проводить операции.."
 jap_jungle_training_description: "§OВсе войска специального назначения§!: \n§G+10%§! к §YСкорости передвижения§! и §G+5%§! к §YАтаке§! в Джунглях.\n"
 
 jap_tank_training: "Противотанковая подготовка"
 jap_tank_training_short: "Обучение танкам"
 jap_tank_training_desc: "Морские пехотинцы и горнострелки сражаются с растущим числом танков. Обучение их слабым местам танков и атакам в ближнем бою поможет им уничтожить вражеские танковые силы."
 
 jap_tech_special_forces_training: "Подготовка спецназа"
 jap_tech_special_forces_training_short: "Подготовка спецназа"
 jap_tech_special_forces_training_desc: "Ужесточить программы обучения, чтобы наши спецназовцы стали более эффективными"
 
