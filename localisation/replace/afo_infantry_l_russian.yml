 sov_paratroopers2: "Десантники II"
 sov_paratroopers2_desc: "Переход от небольших операций с несколькими десантниками к более крупным воздушно-десантным дивизиям открывает путь к массовым десантам, превращая эти силы из новинки в естественную часть военных действий."
 sov_paratroopers3: "Десантники III"
 sov_paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погоды, стандартизация снаряжения, такого как прыжковые ботинки, и расширенная специализированная подготовка позволят свести к минимуму путаницу и риски, связанные с этими опасными миссиями."
 sov_marines: "Морская пехота I"
 sov_marines_desc: "Войска, специализирующиеся на Морских боевых действиях, становятся все более незаменимыми. Самодельные методы и снаряжение уходят в прошлое, когда наша морская пехота получает поддержку в виде специализированных десантных кораблей и подготовки."
 sov_marines2: "Морская пехота II"
 sov_marines2_desc: "Амфибийная война требует постоянных инноваций. Улучшенная материально-техническая поддержка и переносные гавани позволяют нашим морским пехотинцам высаживать десанты, которые иначе были бы невозможны."
 sov_marines3: "Морская пехота III"
 sov_marines3_desc: "Морские пехотинцы могут быть не только амфибийной пехотой. В будущем наша морская пехота станет одним из самых дисциплинированных и организованных спецподразделений."
 sov_tech_mountaineers: "Горнострелковые войска I"
 sov_tech_mountaineers_desc: "Бой в горных массивах подвергает войска многим опасностям, но иногда их невозможно избежать. Мы можем минимизировать эти риски, обеспечив наших солдат специальной подготовкой для таких условий."
 sov_tech_mountaineers2: "Горнострелковые войска II"
 sov_tech_mountaineers2_desc: "Выходя за рамки выживания, наши войска могут быть обучены использовать горы в своих интересах. С легким снаряжением и мулами они могут маневрировать по этой местности лучше, чем другая пехота."
 sov_tech_mountaineers3: "Горнострелковые войска III"
 sov_tech_mountaineers3_desc: "Подготовка к самым трудным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск исключительной подготовки и дисциплины."
 sov_tech_special_forces: "Спецназ"
 sov_tech_special_forces_desc: "Нетрадиционные боевые действия требуют специальной подготовки. Мы должны убедиться, что наши войска подготовлены и способны адаптироваться к суровым условиям."
 sov_advanced_special_forces: "Продвинутая подготовка спецназа"
 sov_advanced_special_forces_desc: "Благодаря интенсивной подготовке мы можем гарантировать, что наши спецназовцы смогут выполнять задачи, превосходящие возможности обычных людей."
 sov_improved_special_forces:1 "Расширенная программа спецназа"
 sov_improved_special_forces_desc:1 "Спецназ способен выполнять миссии, которые не под силу обычным солдатам. Нам нужно расширить программы обучения, чтобы больше наших солдат получили соответствующую квалификацию."
 sov_survival_training: "Обучение выживанию"
 sov_survival_training_desc: "Наши спецназовцы часто будут сражаться в тылу врага и в условиях дефицита ресурсов. Мы должны научить их переносить суровую погоду и сражаться с ограниченными запасами."
 sov_elite_forces: "Элитные силы"
 sov_elite_forces_desc: "Только лучшие из лучших становятся спецназовцами. Солдаты, которые пройдут обучение, будут сильнее, быстрее и будут сражаться ожесточеннее, чем кто-либо другой."
 sov_extreme_environment_training: "Обучение работе в экстремальных условиях"
 sov_extreme_environment_training_desc: "Мы должны быть способны сражаться в самых суровых условиях. При правильном обучении и оснащении наши войска смогут сражаться в самых экстремальных условиях."


 usa_paratroopers_description: "Десантники: §G+5%§! к Скорости и Защите, а также §G+10%§! к Атаке в Холмах и Равнинах.\n"
 
 usa_mountaineers_description: "§OГорнострелковые войска§!: \n §G+10%§! к §YСкорости, Атаке§! и §YЗащите§! в Горах\n§G+5%§! к §YСкорости, Атаке§! и §YЗащите§! в Лесах\n§G+2%§! к §YАтаке§! и §YЗащите§! в Холмах.\n"
 usa_mountaineers_commando_description: "§OКоммандос§!: \n§G+10%§! к §YСкорости§! и §YАтаке§! в Лесах, Болотах, Джунглях, Горах и Холмах.\n"
 
 usa_marines_description: "§OМорпехи§!: \n§G+5%§! к §YАтаке§! и §YЗащите§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! и §YЗащите§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 usa_marines_commando_description: "§OКоммандос§!: \n§G+5%§! к §YАтаке§! и §G+10%§! §YСкорости§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 
 usa_urban_training: "Обучение в городе"
 usa_urban_training_desc: "Десантникам и горнострелкам все чаще приходится сражаться в городах и поселках. Совместные усилия могут привести к улучшению тактики ведения боя в таких условиях."
 usa_urban_training_description: "§OДесантники§!: \n§G+20%§! к §YАтаке§! и §YЗащите§! в Городской местности\n§OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Городской местности.\n"
 
 usa_fort_training: "Обучение в укреплениях"
 usa_fort_training_desc: "Морпехи и горнострелки все чаще штурмуют крепости. Совместные усилия могут привести к улучшению тактики ведения боя против окопавшихся врагов."
 usa_fort_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Укреплениях.\n"
 
 usa_recon_training: "Обучение разведке"
 usa_recon_training_desc: "Десантники и горнострелки часто оказываются перед лицом невероятных трудностей. Обучение их специализированной тактике разведки даст им преимущество."
 usa_recon_description: "§OГорнострелковые войска§! и §OДесантники§!: \n§G+20%§! к §YСкорости передвижения§!\n"
 
 usa_water_training: "Водная подготовка"
 usa_water_training_desc: "Морпехам и горнострелкам регулярно приходится сражаться в мокрой среде. Совместные усилия и обмен опытом могут способствовать совершенствованию тактики ведения боя в воде."
 usa_water_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §G+5%§! к §YЗащите§! на реках и в болотах.\nКоммандос: \n§G+10%§! к §YАтаке§! на реках и в болотах.\n"
 
 usa_jungle_training: "Обучение в джунглях"
 usa_jungle_training_desc: "Десантникам и горнострелкам обычно приходится прокладывать маршруты через джунгли для достижения целей. Объединение двух групп для анализа этой местности поможет лучше проводить операции.."
 usa_jungle_training_description: "§OВсе войска специального назначения§!: \n§G+10%§! к §YСкорости передвижения§! и §G+5%§! к §YАтаке§! в Джунглях.\n"
 
 usa_tank_training: "Противотанковая подготовка"
 usa_tank_training_short: "Обучение танкам"
 usa_tank_training_desc: "Морские пехотинцы и горнострелки сражаются с растущим числом танков. Обучение их слабым местам танков и атакам в ближнем бою поможет им уничтожить вражеские танковые силы."
 
 usa_tech_special_forces_training: "Подготовка спецназа"
 usa_tech_special_forces_training_short: "Подготовка спецназа"
 usa_tech_special_forces_training_desc: "Ужесточить программы обучения, чтобы наши спецназовцы стали более эффективными"
 
