 paratroopers_description: "Десантники: §G+5%§! к Скорости и Защите, а также §G+10%§! к Атаке в Холмах и Равнинах.\n"


 marines_description: "§OМорпехи§!: \n§G+5%§! к §YАтаке§! и §YЗащите§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! и §YЗащите§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 marines_commando_description: "§OКоммандос§!:\n§G+5%§! к §YАтаке§! и §G+10%§! §YСкорости§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"

 urban_training: "Обучение в городе"
 urban_training_desc: "Десантникам и горнострелкам все чаще приходится сражаться в городах и поселках. Совместные усилия могут привести к улучшению тактики ведения боя в таких условиях."
 urban_training_description: "§OДесантники§!: \n§G+20%§! к §YАтаке§! и §YЗащите§! в Городской местности\n§OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Городской местности.\n"

 fort_training: "Обучение в укреплениях"
 fort_training_desc: "Морпехи и горнострелки все чаще штурмуют крепости. Совместные усилия могут привести к улучшению тактики ведения боя против окопавшихся врагов."
 fort_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Укреплениях.\n"

 recon_training: "Обучение разведке"
 recon_training_desc: "Десантники и горнострелки часто оказываются перед лицом невероятных трудностей. Обучение их специализированной тактике разведки даст им преимущество."
 recon_description: "§OГорнострелковые войска§! и §OДесантники§!: \n§G+20%§! к §YСкорости передвижения§!\n"

 water_training: "Водная подготовка"
 water_training_desc: "Морпехам и горнострелкам регулярно приходится сражаться в мокрой среде. Совместные усилия и обмен опытом могут способствовать совершенствованию тактики ведения боя в воде."
 water_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §G+5%§! к §YЗащите§! через Реки и Болотах.\nКоммандос: \n§G+10%§! к §YАтаке§! через Реки и Болотах.\n"

 jungle_training: "Обучение в джунглях"
 jungle_training_desc: "Десантникам и горнострелкам обычно приходится прокладывать маршруты через джунгли для достижения целей. Объединение двух групп для анализа этой местности поможет лучше проводить операции.."
 jungle_training_description: "§OВсе войска специального назначения§!: \n§G+10%§! к §YСкорости передвижения§! и §G+5%§! к §YАтаке§! в Джунглях.\n"

 tank_training: "Противотанковая подготовка"
 tank_training_short: "Обучение танкам"
 tank_training_desc: "Морские пехотинцы и горнострелки сражаются с растущим числом танков. Обучение их слабым местам танков и атакам в ближнем бою поможет им уничтожить вражеские танковые силы."

