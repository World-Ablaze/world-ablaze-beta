 fra_inf_0: "Fusil Lebel Mle 1886 M93"
 fra_inf_0_short: "Fusil Lebel"
 fra_inf_0_desc: "Винтовка с затвором, созданная еще до Великой войны, может служить скорее антиквариатом, чем оружием, поскольку она является или может считаться худшим оружием среди всех основных наций. Если возникнет необходимость, у нас есть десятки тысяч таких реликвий на складах, чтобы использовать их в последней попытке вооружить наши войска.\n§RЭто новая модель, и она не сохранит эффективность§!"

 fra_inf_1: "Berthier 1907/15 M34"
 fra_inf_1_short: "Berthier M34"
 fra_inf_1_desc: "В 1920-х годах французская армия хотела отказаться от патрона 8x50 Lebel и вместо него использовать новый безоболочечный патрон 7,5x54 MAS. В результате в 1934 году под новый калибр была переделана испытанная винтовка Berthier 1917, что привело к появлению Berthier 1907/15 M34. Несмотря на некоторую дороговизну переделки, новый патрон позволил улучшить общие характеристики винтовки.\n§RЭто новая модель, и она не сохранит эффективность§!"

 fra_inf_2: "MAS-36"
 fra_inf_2_short: "MAS-36"
 fra_inf_2_desc: "MAS-36 - это винтовка с карабином, представляющая собой небольшую модернизацию Fusil Automatique. Тем не менее, оружие остается таким же дешевым, а значит, его боевые возможности все еще относительно слабы.\n§RЭто новая модель, и она не сохранит эффективность§!"

 fra_inf_3: "MAS-36 + MAS-38"
 fra_inf_3_short: "MAS-36 + MAS-38"
 fra_inf_3_desc: "Пулемет MAS-38, дополняющий винтовку MAS-36, значительно повышает боевую эффективность небольших пехотных формирований. Это оружие страдает при обороне, но очень хорошо для своего времени, когда используется в наступательных прорывах.\n§GЭто позволит сохранить эффективность от MAS-36§!"

 fra_inf_4: "MAS-40 + MAS-38"
 fra_inf_4_short: "MAS-40 + MAS-38"
 fra_inf_4_desc: "MAS-40 значительно превосходит предшествующую винтовку по мягкости атаки и защиты. Она обеспечивает высокую боевую эффективность пехоты при небольшом увеличении стоимости производства.\n§GЭто позволит сохранить эффективность от MAS-36 + MAS-38§!"

 fra_inf_5: "MAS-44 + MAS-38"
 fra_inf_5_short: "MAS-44 + MAS-38"
 fra_inf_5_desc: "MAS-44 имеет лишь незначительные улучшения по сравнению с MAS-40. Оружие имеет посредственные универсальные характеристики и при этом довольно дорого стоит.\n§GЭто позволит сохранить эффективность от MAS-40 + MAS-38§!"

 fra_inf_6: "CEAM Mle 1950 + MAT-49"
 fra_inf_6_short: "CEAM Mle 1950 + MAT-49"
 fra_inf_6_desc: "Для своего времени пушка очень слаба. Однако, поскольку большинство стран не вкладывают средства в исследование нового пехотного снаряжения, пушка превосходит те страны, которые уже не могут исследовать более новое оружие.\n§RЭто новая модель, и она не сохранит эффективность§!"

 fra_hv_inf_1: "St. Étienne Mle 1907 + Chauchat"
 fra_hv_inf_1_short: "St. Étienne Mle 1907 + Chauchat"
 fra_hv_inf_1_desc: "Несмотря на довоенную конструкцию, St. Étienne Mle 1907 и Chauchat чрезвычайно эффективны в борьбе с пехотой и обладают хорошей огневой мощью, способной подавить вражескую пехоту. Однако обе эти конструкции имеют большое количество проблем с надежностью и подвержены частым остановкам.\n§RЭто новая модель, и она не сохранит эффективность§!"
 fra_heavy_infantry_weapons_1: "St. Étienne Mle 1907 + Chauchat"

 fra_hv_inf_2: "Hotchkiss Mle 1914 + FM 24/29"
 fra_hv_inf_2_short: "Hotchkiss Mle 1914 + FM 24/29"
 fra_hv_inf_2_desc: "Это оружие жертвует небольшой огневой мощью, чтобы значительно повысить надежность своего предшественника. Упрощения также позволяют удешевить производство.\n§RЭто новая модель, и она не сохранит эффективность§!"
 fra_heavy_infantry_weapons_2: "Hotchkiss Mle 1914 + FM 24/29"

 fra_hv_inf_3: "Hotchkiss Mle 1914 + FM 24/41 + FAT (противотанковое ружьё)"
 fra_hv_inf_3_short: "Hotchkiss Mle 1914 + FM 24/41 + FAT "
 fra_hv_inf_3_desc: "Противотанковое ружье позволяет пробивать только легкобронированные танки и машины. Атакующие и оборонительные возможности этого комплекса по-прежнему эффективны при использовании против пехоты.\n§GЭто позволит сохранить эффективность от Hotchkiss Mle 1914 + FM 24/29§!"

 fra_hv_inf_4: "AA-52 + RF Mle 44"
 fra_hv_inf_4_short: "AA-52 + RF Mle 44"
 fra_hv_inf_4_desc: "Пулемет AA-52 обеспечивает очень хорошую защиту пехоты, а безоткатная противотанковая гранатометная установка позволяет пехоте справляться с умеренно бронированными машинами.\n§RЭто новая модель, и она не сохранит эффективность§!"

 fra_hv_inf_5: "MAC-58 + AA-52 + RF Mle 44"
 fra_hv_inf_5_short: "MAC-58 + AA-52 + RF Mle 44"
 fra_hv_inf_5_desc: "MAC-58 - это вариант AA-52, оснащенный патроном 50BMG, а не стандартным 7,62x51 мм НАТО. За использование более мощного патрона приходится платить ростом производства, но при этом обеспечивается более высокая огневая мощь.\n§RЭто новая модель, и она не сохранит эффективность§!"

