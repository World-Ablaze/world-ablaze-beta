 ger_night_vision_1: "Ночное видение I"
 ger_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 ger_night_vision_2: "Ночное видение II"
 ger_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 sov_inf_1: "Мосин-Наган"
 sov_inf_1_short: "Мосин-Наган"
 sov_inf_1_desc: "Разработанный еще до Великой войны, "Мосин-Наган" может показаться устаревшим. Однако, несмотря на низкую стоимость, он по-прежнему обладает хорошей огневой мощью. Благодаря своей простоте он может быть передан на вооружение малообученным войскам, и это хорошая идея - запастись большим количеством этого оружия.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_inf_2: "АВС-36 + ППД-34"
 sov_inf_2_short: "АВС-36 + ППД-34"
 sov_inf_2_desc: "АВС-36 - одна из первых в мире служебных винтовок, способных вести как одиночный, так и полностью автоматический огонь. Добавление пистолета-пулемета в арсенал пехоты также значительно повышает ее способность вести огонь большими объемами. Однако эти две конструкции оказались чрезмерно сложными, что привело к значительным проблемам как с надежностью, так и с производством. Производство этого оружия в больших количествах может сильно затруднить возможность достаточного оснащения всех дивизий.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_inf_3: "СВТ-38 + ППД-38"
 sov_inf_3_short: "СВТ-38 + ППД-38"
 sov_inf_3_desc: "СВТ-38, оставаясь чрезвычайно сложным по советским меркам, все же проще в обращении и производстве по сравнению с АВС-36. Однако полуавтоматика дает меньшую огневую мощь.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_inf_4: "СВТ-40 + ППШ-41"
 sov_inf_4_short: "СВТ-40 + ППШ-41"
 sov_inf_4_desc: "СВТ-40 и ППШ-41 значительно улучшают конструкцию предшественников, демонстрируя лучшие боевые качества во всех отношениях. Опыт предыдущих неудачных разработок позволил нам внести эти изменения, упростив при этом значительную часть производственного процесса.\n§GЭто позволит сохранить эффективность от СВТ-38 + ППД-38§!"

 sov_inf_5: "СВТ-40 + ППС"
 sov_inf_5_short: "СВТ-40 + ППС"
 sov_inf_5_desc: "ППС значительно проще, чем ППШ-41. Он меньше, имеет меньше движущихся частей и проще в использовании. Однако за это приходится расплачиваться снижением скорострельности оружия, что приводит к снижению боевых возможностей.\n§GЭто позволит сохранить эффективность от СВТ-40 + ППШ-41§!"

 sov_inf_6: "СКС + ППС"
 sov_inf_6_short: "СКС + ППС"
 sov_inf_6_desc: "Аналогично принятию ППС, СКС был принят на вооружение как чрезвычайно надежная винтовка простой конструкции. Она жертвует некоторыми боевыми характеристиками, но зато относительно дешева.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_inf_7: "АК-47 + ППС"
 sov_inf_7_short: "АК-47 + ППС"
 sov_inf_7_desc: "Добавление автомата АК-47 позволяет относительно неподготовленным войскам обладать огромной огневой мощью. Его сочетание с ППС - экономически эффективный способ оснащения пехоты адекватным стрелковым оружием.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_inf_8: "АК-47 + ППШ-41"
 sov_inf_8_short: "АК-47 + ППШ-41"
 sov_inf_8_desc: "Используя ППШ-41 вместо ППС, эта ветка является более дорогой и менее надежной, но имеет несколько улучшенные возможности по сравнению с другими аналогами 1949 года. \n§GЭто позволит сохранить эффективность от АК-47 + ППС§!"

 sov_inf_9: "Мосин-Наган + ППД-34"
 sov_inf_9_short: "Мосин-Наган + ППД-34"
 sov_inf_9_desc: "Сочетание Мосин-Нагана и ППД-34 позволяет получить недорогой, но эффективный боевой комплект пехоты с достойными, универсальными показателями. Добавление пистолета-пулемета в арсенал пехоты также значительно повышает ее способность вести огонь большими очередями.\n§GЭто позволит сохранить эффективность от $sov_inf_1$§!"

 sov_inf_10: "Мосин-Наган + ППШ-41"
 sov_inf_10_short: "Мосин-Наган + ППШ-41"
 sov_inf_10_desc: "Сочетание пистолета Мосина-Нагана и ППШ-41 позволяет получить недорогой, но эффективный боевой комплект пехоты с достойными универсальными характеристиками. Добавление в арсенал пехоты пистолета-пулемета также значительно повышает ее способность вести огонь большими очередями.\n§GЭто позволит сохранить эффективность от $sov_inf_9$§!"

 sov_hv_inf_1: "Максим МГ + ДП-27"
 sov_hv_inf_1_short: "Максим МГ + ДП-27"
 sov_hv_inf_1_desc: "Максим - один из первых пулеметов, использовавшихся в полевом бою. Изначально адаптированный к британской конструкции, пулемет с водяным охлаждением и отдачей ствола оказался полезным для советских войск благодаря своей надежности. Будучи относительно дорогими довоенными пулеметами, Максим и ДП-27 обладают умеренной статистикой.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_hv_inf_2: "Максим МГ + ДП-27 + ПТРД-41"
 sov_hv_inf_2_short: "Максим МГ + ДП-27 + ПТРД-41"
 sov_hv_inf_2_desc: "Противотанковое ружье ПТРД-41 позволяет независимым пехотным подразделениям уничтожать или выводить из строя вражескую броню. Правда, за это приходится платить, так как на производство этого оружия уходит много времени и сил.\n§GЭто позволит сохранить эффективность от Максим МГ + ДП-27§!"

 sov_hv_inf_3: "ДС-39 + ДП-27"
 sov_hv_inf_3_short: "ДС-39 + ДП-27"
 sov_hv_inf_3_desc: "ДС-39 - это общее улучшение "Максима", и благодаря повышенной мобильности он дает больше шансов на прорыв. Однако из-за проблем в конструкции он страдает от проблем с надежностью.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_hv_inf_4: "ДС-39 + ДП-27 + ПТРД-41"
 sov_hv_inf_4_short: "ДС-39 + ДП-27 + ПТРД-41"
 sov_hv_inf_4_desc: "Противотанковое ружье ПТРД-41 позволяет независимым пехотным подразделениям уничтожать или выводить из строя вражескую броню. Правда, за это приходится платить, так как на производство этого оружия уходит много времени и сил.\n§GЭто позволит сохранить эффективность от ДС-39 + ДП-27§!"

 sov_hv_inf_5: "СГ-43 + ДПМ + ПТРД-41"
 sov_hv_inf_5_short: "СГ-43 + ДПМ + ПТРД-41"
 sov_hv_inf_5_desc: "СГ-43 гораздо маневреннее своих предшественников, что позволяет использовать его на ключевых наступательных позициях. Кроме того, они проще в производстве. ДПМ - более надежная и дешевая версия ДП-27. ПТРД-41 по-прежнему позволяет пехоте справляться с некоторыми видами средней брони. В этой линейке представлены более дешевые технологии для пехотного снаряжения.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_hv_inf_6: "ДШК 38/46 + РПД + РПГ-1"
 sov_hv_inf_6_short: "ДШК 38/46 + РПД + РПГ-1"
 sov_hv_inf_6_desc: "ДШК 38/46 + РПД + РПГ-1, имея относительно низкую скорострельность, способен наносить значительный урон своими высокоскоростными пулями, способными пробивать даже легкую броню. РПД обеспечивает более высокую скорострельность, компенсируя медленную скорострельность ДШК. Однако за все это приходится платить гораздо больше, чем за предыдущие модели.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_hv_inf_7: "ДШК 38/46 + РПД + РПГ-2"
 sov_hv_inf_7_short: "ДШК 38/46 + РПД + РПГ-2"
 sov_hv_inf_7_desc: "Для вытеснения войск с более высокими противотанковыми возможностями был представлен полностью переработанный РПГ. РПГ-2 способна пробивать броню гораздо легче, чем РПГ-1, и более надежна.\n§GЭто позволит сохранить эффективность от ДШК 38/46 + РПД + РПГ-1§!"

 sov_hv_inf_8: "КПВ + РПД + РПГ-2"
 sov_hv_inf_8_short: "ПВ + РПД + РПГ-2"
 sov_hv_inf_8_desc: "КПВ, известный под пехотным обозначением ПКП, является чрезвычайно эффективным пулеметом, способным наносить значительный урон как по твердым, так и по мягким целям. Для вытеснения войск с более мощными противотанковыми возможностями был выпущен полностью переработанный РПГ. РПГ-2 способен пробивать броню гораздо легче, чем РПГ-1, и более надежен.\n§RЭто новая модель, и она не сохранит эффективность§!"

 sov_hv_inf_9: "КПВ + ПК + РПГ-2"
 sov_hv_inf_9_short: "КПВ + ПК + РПГ-2"
 sov_hv_inf_9_desc: "ПК представляет собой гораздо больший прорыв в конструкции LMG по сравнению с предыдущими моделями, предлагая гораздо больше боевых возможностей при небольшом увеличении стоимости.\n§GЭто позволит сохранить эффективность от КПВ + РПД + РПГ-2§!"

