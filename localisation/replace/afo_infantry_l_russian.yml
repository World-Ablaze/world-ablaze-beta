 eng_paratroopers: "Десантники I"
 eng_paratroopers_desc: "Включив в состав нашей армии воздушно-десантные войска, мы сможем проводить форсированные наступления и размещать ключевые войска в ранее недоступных районах, открывая новые тактические возможности."
 eng_paratroopers2: "Десантники II"
 eng_paratroopers2_desc: "Переход от небольших операций с несколькими десантниками к более крупным воздушно-десантным дивизиям открывает путь к массовым десантам, превращая эти силы из новинки в естественную часть военных действий."
 eng_paratroopers3: "Десантники III"
 eng_paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погоды, стандартизация снаряжения, такого как прыжковые ботинки, и расширенная специализированная подготовка позволят свести к минимуму путаницу и риски, связанные с этими опасными миссиями."
 eng_marines: "Морская пехота I"
 eng_marines_desc: "Войска, специализирующиеся на Морских боевых действиях, становятся все более незаменимыми. Самодельные методы и снаряжение уходят в прошлое, когда наша морская пехота получает поддержку в виде специализированных десантных кораблей и подготовки."
 eng_marines2: "Морская пехота II"
 eng_marines2_desc: "Амфибийная война требует постоянных инноваций. Улучшенная материально-техническая поддержка и переносные гавани позволяют нашим морским пехотинцам высаживать десанты, которые иначе были бы невозможны."
 eng_marines3: "Морская пехота III"
 eng_marines3_desc: "Морские пехотинцы могут быть не только амфибийной пехотой. В будущем наша морская пехота станет одним из самых дисциплинированных и организованных спецподразделений."
 eng_tech_mountaineers: "Горнострелковые войска I"
 eng_tech_mountaineers_desc: "Бой в горных массивах подвергает войска многим опасностям, но иногда их невозможно избежать. Мы можем минимизировать эти риски, обеспечив наших солдат специальной подготовкой для таких условий."
 eng_tech_mountaineers2: "Горнострелковые войска II"
 eng_tech_mountaineers2_desc: "Выходя за рамки выживания, наши войска могут быть обучены использовать горы в своих интересах. С легким снаряжением и мулами они могут маневрировать по этой местности лучше, чем другая пехота."
 eng_tech_mountaineers3: "Горнострелковые войска III"
 eng_tech_mountaineers3_desc: "Подготовка к самым трудным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск исключительной подготовки и дисциплины."
 eng_tech_special_forces: "Спецназ"
 eng_tech_special_forces_desc: "Нетрадиционные боевые действия требуют специальной подготовки. Мы должны убедиться, что наши войска подготовлены и способны адаптироваться к суровым условиям."
 eng_advanced_special_forces: "Продвинутая подготовка спецназа"
 eng_advanced_special_forces_desc: "Благодаря интенсивной подготовке мы можем гарантировать, что наши спецназовцы смогут выполнять задачи, превосходящие возможности обычных людей."
 eng_improved_special_forces:1 "Расширенная программа спецназа"
 eng_improved_special_forces_desc:1 "Спецназ способен выполнять миссии, которые не под силу обычным солдатам. Нам нужно расширить программы обучения, чтобы больше наших солдат получили соответствующую квалификацию."
 eng_survival_training: "Обучение выживанию"
 eng_survival_training_desc: "Наши спецназовцы часто будут сражаться в тылу врага и в условиях дефицита ресурсов. Мы должны научить их переносить суровую погоду и сражаться с ограниченными запасами."
 eng_elite_forces: "Элитные силы"
 eng_elite_forces_desc: "Только лучшие из лучших становятся спецназовцами. Солдаты, которые пройдут обучение, будут сильнее, быстрее и будут сражаться ожесточеннее, чем кто-либо другой."
 eng_extreme_environment_training: "Обучение работе в экстремальных условиях"
 eng_extreme_environment_training_desc: "Мы должны быть способны сражаться в самых суровых условиях. При правильном обучении и оснащении наши войска смогут сражаться в самых экстремальных условиях."

