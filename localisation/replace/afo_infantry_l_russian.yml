 pol_night_vision_1: "Ночное видение I"
 pol_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 pol_night_vision_2: "Ночное видение II"
 pol_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 cze_inf_1: "Vz.33 + ZK-383"
 cze_inf_1_short: "Vz.33 + ZK-383"
 cze_inf_1_desc: "Созданный на основе конструкции Gewehr 98 под патрон Маузера, Vz.33 является эффективным карабином с продольно-скользящим затвором. ZK-383 приближается по размерам к крупнокалиберным автоматическим винтовкам, но при этом стреляет пистолетными патронами. Благодаря своим огромным размерам он является надежным и чрезвычайно эффективным оружием, однако его производство обходится недешево.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_inf_2: "ZH-32 + ZK-383"
 cze_inf_2_short: "ZH-32 + ZK-383"
 cze_inf_2_desc: "ZH-32 - одна из первых полуавтоматических винтовок, когда-либо созданных. ZK-383 приближается по размерам к крупнокалиберному автоматическому оружию, но при этом стреляет пистолетными патронами. Из-за сложности и больших размеров это оружие очень дорого в производстве, но является самым эффективным оружием этого периода.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_inf_3: "ZH-37 + ZK-383"
 cze_inf_3_short: "ZH-37 + ZK-383"
 cze_inf_3_desc: "Постоянные усовершенствования экспериментальной конструкции ZH-32 повысили точность оружия, а улучшения в производстве привели к общему снижению стоимости производства и повышению надежности.\n§GЭто позволит сохранить эффективность от ZH-32 + ZK-383§!"

 cze_inf_4: "ZH-43 + ZK-383-H"
 cze_inf_4_short: "ZH-43 + ZK-383-H"
 cze_inf_4_desc: "Переработка механизма подачи винтовки позволила значительно повысить темп стрельбы при одновременном упрощении производства и обслуживания. В варианте H винтовки ZK-383 изменен формат магазина и конструкция ствола, что сделало оружие более удобным в обращении. К настоящему времени это оружие несколько устарело по сравнению с ведущими странами.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_inf_5: "ZK-420S + Vz.48"
 cze_inf_5_short: "ZK-420S + Vz.48"
 cze_inf_5_desc: "Используя газоотводную систему, заимствованную у M1 Garand, ZK-420S повышает надежность и стоимость. Vz.48 значительно меньше своего предшественника ZK-383, но при этом сохранил большую часть своей боевой эффективности.\n§GЭто позволит сохранить эффективность от ZH-43 + ZK-383-H§!"

 cze_inf_6: "Vz.52 + Vz.48"
 cze_inf_6_short: "Vz.52 + Vz.48"
 cze_inf_6_desc: "В то время как большинство других стран уже перешли на штурмовые винтовки, Vz.52 остается полуавтоматом. Это оружие для пехоты дешево и в меру эффективно, если сравнивать его с оружием младших возрастов, но сильно уступает в мощности оружию старших возрастов.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_hv_inf_1: "Vz.07/24 + LK vz.30"
 cze_hv_inf_1_short: "Vz.07/24 + LK vz.30"
 cze_hv_inf_1_desc: "LK vz.30 - простой и посредственный легкий пулемет, а Vz.07/24 - устаревший средний пулемет времен Австро-Венгрии, который относительно прост в производстве. Вместе эти два орудия дают лишь посредственную статистику.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_hv_inf_2: "ZB-53 + LK vz.30"
 cze_hv_inf_2_short: "ZB-53 + LK vz.30"
 cze_hv_inf_2_desc: "Замена устаревшего Vz.07/24 на ZB-53 чешской разработки значительно повышает оборонительную и наступательную мощь орудия.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_hv_inf_3: "ZB-60 + LK vz.30"
 cze_hv_inf_3_short: "ZB-60 + LK vz.30"
 cze_hv_inf_3_desc: "ZB-60 стреляет значительно более мощным калибром, чем ZB-53, что позволяет использовать его против легких машин. Большая станина тяжелого пулемета значительно удорожает производство.\n§RЭто новая модель, и она не сохранит эффективность§!"

 cze_hv_inf_4: "ZB-60 + ZB-39"
 cze_hv_inf_4_short: "ZB-60 + ZB-39"
 cze_hv_inf_4_desc: "В ZB-39 внесены незначительные усовершенствования, такие как быстросменный ствол и упрощенные компоненты, что повышает стоимость производства и надежность.\n§GЭто позволит сохранить эффективность от ZB-60 + LK vz.30§!"

 cze_hv_inf_5: "ZB-60 + ZB-39 + 81mm vz.44"
 cze_hv_inf_5_short: "ZB-60 + ZB-39 + 81mm vz.44"
 cze_hv_inf_5_desc: "Добавление специального противотанкового орудия позволяет тяжелой пехоте легко справляться со средней бронетехникой, не нуждаясь в противотанковой поддержке. Другие возможности этого оборудования на данный момент невелики.\n§GЭто позволит сохранить эффективность от ZB-60 + ZB-39§Y""

 cze_hv_inf_6: "ZK-477 + Vz.52 LMG + 81mm vz.44"
 cze_hv_inf_6_short: "ZK-477 + Vz.52 LMG + 81mm vz.44"
 cze_hv_inf_6_desc: "Vz.52 является дальнейшим усовершенствованием оригинальной конструкции Vz.26, значительно улучшив все боевые возможности, однако для своего времени это оружие довольно слабое.\n§RЭто новая модель, и она не сохранит эффективность§!"

