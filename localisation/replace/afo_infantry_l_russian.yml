 fra_infantry_weapons_upgrade_1_desc: "F-1 Grenade"

 fra_infantry_weapons_upgrade_2: "VB Rifle Grenade"
 fra_infantry_weapons_upgrade_2_desc: "VB Rifle Grenade"

 fra_infantry_weapons_upgrade_3: "LU-213"
 fra_infantry_weapons_upgrade_3_desc: "LU-213"

 fra_infantry_weapons_upgrade_4: "M-52"
 fra_infantry_weapons_upgrade_4_desc: "M-52"

 fra_heavy_infantry_weapons_upgrade_1: "Brandt Mle 1935"
 fra_heavy_infantry_weapons_upgrade_1_desc: "Brandt Mle 1935"

 fra_heavy_infantry_weapons_upgrade_2: "Brandt Mle 27/31"
 fra_heavy_infantry_weapons_upgrade_2_desc: "Brandt Mle 27/31"

 fra_heavy_infantry_weapons_upgrade_3: "Mortier de 150mm"
 fra_heavy_infantry_weapons_upgrade_3_desc: "Mortier de 150mm"

 fra_heavy_infantry_weapons_upgrade_4: "Mortier 120mm F1"
 fra_heavy_infantry_weapons_upgrade_4_desc: "Mortier 120mm F1"

 fra_night_vision_1: "Ночное видение I"
 fra_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 fra_night_vision_2: "Ночное видение II"
 fra_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 ita_inf_0: "Carcano M1891"
 ita_inf_0_short: "Carcano M1891"
 ita_inf_0_desc: "Эта винтовка довольно стандартна для довоенных винтовок, обладает слабыми боевыми характеристиками и при этом дешева в производстве.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_inf_1: "Carcano M1891 + Beretta 18"
 ita_inf_1_short: "Carcano M1891 + Beretta 18"
 ita_inf_1_desc: "Пистолет-пулемет Beretta 18 обеспечивает очень хорошую пробиваемость пехотных формирований. Это значительно повышает боевые возможности нашей пехоты, позволяя вести бой в движении. Благодаря небольшим размерам и простой конструкции Beretta 18 очень проста в производстве.\n§GЭто позволит сохранить эффективность от Carcano M1891§!"

 ita_inf_2: "FF 38 + Beretta 38"
 ita_inf_2_short: "FF 38 + Beretta 38"
 ita_inf_2_desc: "Fusile di Fanteria 38 - это улучшенный вариант Carcano с повышенной точностью стрельбы на всех дистанциях. Изменения, внесенные в Beretta 38, уменьшают пробивные способности пехоты, но незначительно повышают ее огневую мощь.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_inf_3: "Armaguerra 39 + Beretta 38"
 ita_inf_3_short: "Armaguerra 39 + Beretta 38"
 ita_inf_3_desc: "Armaguerra 39 улучшает легкую атаку и защиту своего предшественника на небольшую величину, не влияя на стоимость производства.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_inf_4: "Armaguerra 39 + FNAB-43"
 ita_inf_4_short: "Armaguerra 39 + FNAB-43"
 ita_inf_4_desc: "FNAB-43 обеспечивает повышенную огневую мощь, но значительно уступает в пробиваемости, не обеспечивая достаточного объема огня для подавления пехоты противника своими силами.\n§GЭто позволит сохранить эффективность от Armaguerra 39 + Beretta 38§!"

 ita_inf_5: "Breda M1935 PG + Beretta Model 38"
 ita_inf_5_short: "Breda M1935 + Beretta M38"
 ita_inf_5_desc: "Конкурентом Armaguerra 39 в испытаниях итальянских самозарядных винтовок стала Breda M1935, обладающая солидной огневой мощью. Однако из-за неудобного управления и конструктивных особенностей винтовка отличается низкой надежностью и высокой стоимостью.\n§RЭто совершенно новая модель, которая не сохранит эффективность производства§!"

 ita_inf_6: "Breda M1935 PG + FNAB-43"
 ita_inf_6_short: "Breda M1935 + FNAB-43"
 ita_inf_6_desc: "FNAB-43 обеспечивает повышенную огневую мощь, но значительно уступает в пробиваемости, не обеспечивая достаточного объема огня для подавления пехоты противника своими силами.\n§GЭто позволит сохранить эффективность от Breda M1935 PG + Beretta Model 38§!"

 ita_inf_7: "Armaguerra OG-45 + TZ-45"
 ita_inf_7_short: "Armaguerra OG-45 - TZ-45"
 ita_inf_7_desc: "Armaguerra 45 обладает большим тормозным усилием по сравнению с Armaguerra 38. TZ-45 отличается более высокой надежностью и довольно низкой ценой.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_hv_inf_0: "Breda Mod. 5C + Breda 30"
 ita_hv_inf_0_short: "Breda Mod. 5C + Breda 30"
 ita_hv_inf_0_desc: "Разработанное в 1930-х годах, это оружие страдает рядом инженерных недостатков. Внутренние механизмы часто выходят из строя, что приводит к постоянным проблемам, которые могут вывести оружие из строя на время или навсегда. Единственный плюс - дешевая стоимость.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_hv_inf_1: "Fiat-Revelli M1935 + Breda 30"
 ita_hv_inf_1_short: "Fiat-Revelli M1935 + Breda 30"
 ita_hv_inf_1_desc: "Fiat-Revelli M1935 - это модернизация M1914 времен Первой мировой войны, превратившая его в обычный тяжелый MG с воздушным охлаждением. Несмотря на все усилия, он по-прежнему страдает от частых заклиниваний и поломок. Breda 30 - легкий MG, который также страдает от проблем с надежностью.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_hv_inf_2: "Breda M37 + Breda 30"
 ita_hv_inf_2_short: "Breda M37 + Breda 30"
 ita_hv_inf_2_desc: "В то время как внедрение Breda M37 улучшает непосредственные боевые возможности своих предшественников, проблемы с надежностью остаются неисправленными, если не сказать - активно усугубляются. Качество этого оружия по-прежнему оставляет желать лучшего по сравнению с другими производителями.\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_hv_inf_3: "Breda M37 + Breda 30 + S 36.M"
 ita_hv_inf_3_short: "Breda M37 + Breda 30 + S 36.M"
 ita_hv_inf_3_desc: "Противотанковое ружье S36.M позволяет пехоте противостоять атакам легкобронированных машин. Однако за это приходится платить очень большие деньги, и оружие по-прежнему остается довольно ненадежным.\n§GЭто позволит сохранить эффективность от Breda M37 + Breda 30§!"

 ita_hv_inf_4: "Breda M37 + Breda 30 + LC AT"
 ita_hv_inf_4_short: "Breda M37 + Breda 30 + LC AT"
 ita_hv_inf_4_desc: "Добавление безоткатной винтовки LC AT обеспечивает небольшое количество легких противотанковых возможностей, но обходится в кругленькую сумму. Это оружие по-прежнему сталкивается с теми же проблемами, что и его предшественник, - низким качеством и надежностью.\n§GЭто позволит сохранить эффективность от Breda M37 + Breda 30 + LC AT§!"

 ita_hv_inf_5: "Breda M45 + 45mm M45"
 ita_hv_inf_5_short: "Breda M45 + 45mm M45"
 ita_hv_inf_5_desc: "\n§RЭто новая модель, и она не сохранит эффективность§!"

 ita_hv_inf_6: "Breda M45 + 90mm M47"
 ita_hv_inf_6_short: "Breda M45 + 90mm M47"
 ita_hv_inf_6_desc: "\n§GЭто позволит сохранить эффективность от Breda M45 + 45mm M45§!"

 ita_infantry_weapons_upgrade_1: "Breda Mod. 35"
 ita_infantry_weapons_upgrade_1_desc: "Breda Mod. 35"

 ita_infantry_weapons_upgrade_2: "OTO Mod. 42"
 ita_infantry_weapons_upgrade_2_desc: "OTO Mod. 42"

