 eng_night_vision_1: "Ночное видение I"
 eng_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 eng_night_vision_2: "Ночное видение II"
 eng_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 usa_inf_1: "M1903 Springfield + M1928 Thompson"
 usa_inf_1_short: "M1903 + M1928"
 usa_inf_1_desc: "Как и большинство других довоенных винтовок, Спрингфилд является посредственным универсальным оружием. Модель 45 M1928 стала первой винтовкой Томпсона, получившей широкое распространение в армии. Несмотря на высокую стоимость и низкую надежность, он обеспечивает лучшую огневую мощь.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_inf_2: "M1 Garand + M1928 Thompson"
 usa_inf_2_short: "M1 + M1928"
 usa_inf_2_desc: "Garand стала первой стандартной самозарядной винтовкой для США. Несмотря на более высокую стоимость, высокий темп стрельбы и простота использования обеспечили ей явное преимущество перед конкурентами.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_inf_3: "M1 Garand + M1928A1 Thompson"
 usa_inf_3_short: "M1 + M1928A1"
 usa_inf_3_desc: "M1928A1 стал основным вариантом Томпсона для массового производства. Несмотря на высокую стоимость, он обладает лучшими характеристиками и небольшими улучшениями в плане надежности.\n§GЭто позволит сохранить эффективность от M1 Garand + M1928 Thompson§!"

 usa_inf_4: "M1 Garand + M1 Carbine + M1A1 Thompson"
 usa_inf_4_short: "M1 Garand + M1 Carbine + M1A1 Thompson"
 usa_inf_4_desc: "Карабин M1 не был призван заменить M1 Garand. Однако он стал недорогим, более надежным и мощным дополнением к пистолетам-пулеметам. M1A1 был дальнейшим упрощением Томпсона. Хотя темп стрельбы был снижен, его стоимость резко уменьшилась.\n§GЭто позволит сохранить эффективность от M1 Garand + M1928A1 Thompson§!"

 usa_inf_5: "M1 Garand + M1 Carbine + M3 Grease Gun"
 usa_inf_5_short: "M1 Garand + M1 Carbine + M3"
 usa_inf_5_desc: "M3 выпускался под тот же патрон 45-го калибра, что и Thompson, но был гораздо дешевле.\n§GЭто позволит сохранить эффективность от M1 Garand + M1928A1 Thompson§!"

 usa_inf_6: "M1 Garand + M2 Carbine + M3A1 Grease Gun"
 usa_inf_6_short: "M1 + M2 + M3A1"
 usa_inf_6_desc: "Карабин M2 - это усовершенствованная версия M1 с автоматическим огнем. Несмотря на то, что он не является заменой легендарному M1 Garand, его огневая мощь значительно возросла. M3A1 был усовершенствован по сравнению с M3 Grease Gun, что сделало его еще дешевле и намного надежнее.\n§GЭто позволит сохранить эффективность от M1 Garand + M1 Carbine + M3 Grease Gun§!"

 usa_inf_7: "M1 Garand + M2 Carbine + M1A1 Thompson"
 usa_inf_7_short: "M1 Garand + M2 + M1A1 Thompson"
 usa_inf_7_desc: "Карабин M2 - это усовершенствованная версия M1 с автоматическим огнем. Несмотря на то, что он не является заменой легендарному M1 Garand, его огневая мощь значительно возросла. Сохранение более дорогого Томпсона обеспечивает лучшие статистические показатели, чем у Grease Gun.\n§GЭто позволит сохранить эффективность от M1 Garand + M1 Carbine + M1A1 Thompson§!"

 usa_inf_8: "M20 + M2 Carbine"
 usa_inf_8_short: "M20 + M2"
 usa_inf_8_desc: "T20 - это M1 Garand, модифицированный под магазин BAR на 20 патронов. Поступив на вооружение под обозначением M20, он дает невероятный прирост ко всем показателям."

 usa_inf_9: "M14 + M2 Carbine"
 usa_inf_9_short: "M14 + M2"
 usa_inf_9_desc: "Надежная и высокоэффективная винтовка M14 с магазином на 20 патронов стала стандартной боевой винтовкой для американской пехоты. Несмотря на дороговизну, общая огневая мощь винтовки огромна. На смену пистолету-пулемету пришел карабин M2.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_hv_inf_1: "M2HB Browning + M1918 BAR"
 usa_hv_inf_1_short: "M2 + M1918"
 usa_hv_inf_1_desc: "M2HB (Тяжелый ствол) Browning - тяжелый пулемет с воздушным охлаждением калибра .50, разработанный после Первой мировой войны. Мощный патрон калибра .50 способен пробивать мягкие машины и легкую броню. Поступивший на вооружение в конце Первой мировой войны, M1918 BAR - это взводный легкий пулемет, обладающий дорогой, но посредственной огневой мощью.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_hv_inf_2: "M2HB Browning + M1919A4 Browning + M1918 BAR"
 usa_hv_inf_2_short: "M2 + M1919A4 + M1918"
 usa_hv_inf_2_desc: "В 1936 году была завершена работа над чертежами пехотного пулемета M1919 калибра 30 с воздушным охлаждением, и он быстро стал основным пулеметом пехоты. Пулемет BAR по-прежнему используется в качестве оружия для отделения, а M2HB - в качестве тяжелого дополнения к M1919A4. Использование всех трех пулеметов обеспечивает эффективную огневую мощь и оборону американской пехоты.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_hv_inf_3: "M2HB Browning + M1919A4 Browning + M1918A2 BAR"
 usa_hv_inf_3_short: "M2 + M1919A4 + M1918A2"
 usa_hv_inf_3_desc: "M1918A2 - это несколько более дешевое усовершенствование BAR, которое позволило сделать его более надежным и эффективным в бою.\n§GЭто позволит сохранить эффективность от M2HB Browning + M1919A4 Browning + M1918 BAR§!"

 usa_hv_inf_4: "M2HB Browning + M1919A4 Browning + M1918A2 BAR + M1 Bazooka"
 usa_hv_inf_4_short: "M2 + M1919A4 + M1918A2 + M1"
 usa_hv_inf_4_desc: "Базука M1 - безоткатный противотанковый гранатомет, способный пробивать среднюю броню, но при этом значительно удорожающий производство.\n§GЭто позволит сохранить эффективность от M2HB Browning + M1919A4 Browning + M1918A2 BAR§!"

 usa_hv_inf_5: "M2HB Browning + M1919A6 Browning + M1918A2 BAR + M9 Bazooka"
 usa_hv_inf_5_short: "M2 + M1919A4 + M1918A6 + M9"
 usa_hv_inf_5_desc: "В M1919A6 внесены усовершенствования, облегчающие и повышающие надежность ее использования в полевых условиях. Базука M9 улучшает предыдущую конструкцию, делая ее более удобной для использования в полевых условиях и повышая количество наносимого ею урона.\n§GЭто позволит сохранить эффективность от M2HB Browning + M1919A4 Browning + M1918A2 BAR + M1 Bazooka§!"

 usa_hv_inf_6: "M2HB Browning + M1919A6 Browning + M1918A2 BAR + M20 Super Bazooka"
 usa_hv_inf_6_short: "M2 + M1919A4 + M1918A6 + M20"
 usa_hv_inf_6_desc: "Известная как "супербазука", M20 способна пробивать значительно больше слоев брони, чем все ее предшественники. Кроме того, она способна пробивать броню на относительно дальних дистанциях, что обеспечивает ей очень высокий показатель жесткой атаки.\n§GЭто позволит сохранить эффективность от M2HB Browning + M1919A6 Browning + M1918A2 BAR + M9 Bazooka§!"

 usa_hv_inf_7: "M2HB Browning + M60 + M20 Super Bazooka"
 usa_hv_inf_7_short: "M2HB + M60 + M20"
 usa_hv_inf_7_desc: "M60 - американский малокалиберный пулемет общего назначения, призванный заменить устаревшие M1919A6 и M1918A2 BAR в пехотных подразделениях. Инновации в конструкции обеспечили ему высокую надежность стрельбы.\n§RЭто новая модель, и она не сохранит эффективность§!"

 usa_hv_inf_8: "M85C + M60 + M20 Super Bazooka"
 usa_hv_inf_8_short: "M85C + M60 + M20"
 usa_hv_inf_8_desc: "M85C - тяжелый пулемет калибра 50, призванный заменить устаревший M2HB на более компактное и легкое оружие. Улучшенные характеристики были достигнуты за счет низкой надежности, что сделало его непопулярным в войсках. M60 - американский малокалиберный пулемет общего назначения, предназначенный для замены устаревших M1919A6 и M1918A2 BAR в пехотных подразделениях. Инновации в конструкции обеспечили ему высокую надежность стрельбы.\n§RЭто новая модель, и она не сохранит эффективность§!"

