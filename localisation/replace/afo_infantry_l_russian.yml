 sov_night_vision_1: "Ночное видение I"
 sov_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, - ключ к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 sov_night_vision_2: "Ночное видение II"
 sov_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 ast_inf_1: "Lee-Enfield + Owen SMG"
 ast_inf_1_short: "Lee-Enfield + Owen SMG"
 ast_inf_1_desc: "Ли-Энфилд, среди всех других довоенных орудий, обладает самой высокой мягкой атакой, но при этом обеспечивает хорошую защиту. В сочетании с пушкой Оуэна пехота, оснащенная этим комплектом, получает приличный прорыв.\n§RЭто новая модель, и она не сохранит эффективность§!"
 ast_infantry_weapons_1: "Lee-Enfield + Owen SMG"

 eng_inf_1: "Lee-Enfield"
 eng_inf_1_short: "Lee-Enfield"
 eng_inf_1_desc: "Ли-Энфилд, из всех других довоенных видов оружия, обладает самой высокой мягкой атакой и при этом хорошо защищает. Его постоянное совершенствование со времен Великой войны дает ему небольшое преимущество по сравнению с другим оружием того времени.\n§RЭто новая модель, и она не сохранит эффективность§!"

 eng_inf_2: "Lee-Enfield + Sten SMG"
 eng_inf_2_short: "Lee-Enfield + Sten SMG"
 eng_inf_2_desc: "Пистолет Sten имеет одну из самых простых конструкций, что позволило получить преступно дешевое оружие. Это дает возможность недорого оснастить автоматическим огнем как регулярные, так и нерегулярные вооруженные силы.\n§GЭто позволит сохранить эффективность от Lee-Enfield§!"

 eng_inf_3: "Lee-Enfield + Sterling SMG"
 eng_inf_3_short: "Lee-Enfield + Sterling SMG"
 eng_inf_3_desc: "Основанный на конструкции пистолета Sten Gun, Sterling SMG имеет очень схожие с ним характеристики с некоторыми незначительными улучшениями. К настоящему времени Lee-Enfield уже довольно сильно устарел, что делает этот набор снаряжения относительно слабым, но дешевым для своего времени.\n§GЭто позволит сохранить эффективность от Lee-Enfield + Sten SMG§!"

 eng_inf_4: "L1A1 + Sterling SMG"
 eng_inf_4_short: "L1A1 + Sterling SMG"
 eng_inf_4_desc: "L1A1 - это британское обозначение боевой винтовки FN FAL, впервые разработанной в Бельгии. L1A1 стреляет только в полуавтоматическом режиме, что приводит к явному недостатку огневой мощи. Несмотря на то, что это оружие стало лучше своих предшественников, оно слабовато для своего времени.\n§RЭто новая модель, и она не сохранит эффективность§!"

 eng_inf_5: "EM-2 + Sterling SMG"
 eng_inf_5_short: "EM-2 + Sterling SMG"
 eng_inf_5_desc: "Эта штурмовая винтовка британской разработки способна вести быстрый и точный огонь одновременно, что делает ее чрезвычайно мощным оружием. Новаторская конструкция не обошла стороной и дороговизну производства.\n§RЭто новая модель, и она не сохранит эффективность§!"

 eng_hv_inf_1: "Vickers HMG + Lewis Gun"
 eng_hv_inf_1_short: "Vickers HMG + Lewis Gun"
 eng_hv_inf_1_desc: "Пушки Vickers HMG и Lewis Gun обладают хорошей противопехотной мощью и довольно дороги. Однако высокая надежность позволяет использовать их в самых разных враждебных условиях, существующих на территории огромной империи Соединенного Королевства.\n§RЭто новая модель, и она не сохранит эффективность§!"

 eng_hv_inf_2: "Vickers + Bren MkI + Boys AT"
 eng_hv_inf_2_short: "Vickers + Bren + Boys AT"
 eng_hv_inf_2_desc: "Винтовка Boys AT Rifle позволяет пехоте бороться с легкой бронетехникой противника без специальной противотанковой поддержки. Несмотря на довольно высокую стоимость, он не уступает своим предшественникам в надежности.\n§GЭто позволит сохранить эффективность от Vickers HMG + Lewis Gun§!"

 eng_hv_inf_3: "Vickers + Bren MkII + PIAT"
 eng_hv_inf_3_short: "Vickers + Bren + PIAT"
 eng_hv_inf_3_desc: "PIAT - это минометное противотанковое орудие, способное запускать кумулятивные заряды под прямым и непрямым углом обстрела. Сложное управление несколько снижает его боевую эффективность, но он способен преодолевать средние уровни брони.\n§GЭто позволит сохранить эффективность от Vickers + Bren + Boys AT§!"

 eng_hv_inf_4: "Taden MG + CGRR"
 eng_hv_inf_4_short: "Taden MG + CGRR"
 eng_hv_inf_4_desc: "Taden MG - это пулемет общего назначения, который уменьшает количество снаряжения, необходимого пехотному подразделению. Пулемет дает небольшие бонусы к атаке и защите, что делает его универсальным оружием. Он не так надежен, как предыдущие британские образцы. CGRR, первоначально разработанный в Швеции, был перепрофилирован для британской армии. Обладая превосходной скорострельностью, он гораздо точнее и надежнее Piat.\n§RЭто новая модель, и она не сохранит эффективность§!"

