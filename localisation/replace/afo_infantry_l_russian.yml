 pol_paratroopers2_desc: "Переход от небольших операций с несколькими десантниками к более крупным воздушно-десантным дивизиям открывает путь к массовым десантам, превращая эти силы из новинки в естественную часть военных действий."
 pol_paratroopers3: "Десантники III"
 pol_paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погоды, стандартизация снаряжения, такого как прыжковые ботинки, и расширенная специализированная подготовка позволят свести к минимуму путаницу и риски, связанные с этими опасными миссиями."
 pol_marines: "Морская пехота I"
 pol_marines_desc: "Войска, специализирующиеся на Морских боевых действиях, становятся все более незаменимыми. Самодельные методы и снаряжение уходят в прошлое, когда наша морская пехота получает поддержку в виде специализированных десантных кораблей и подготовки."
 pol_marines2: "Морская пехота II"
 pol_marines2_desc: "Амфибийная война требует постоянных инноваций. Улучшенная материально-техническая поддержка и переносные гавани позволяют нашим морским пехотинцам высаживать десанты, которые иначе были бы невозможны."
 pol_marines3: "Морская пехота III"
 pol_marines3_desc: "Морские пехотинцы могут быть не только амфибийной пехотой. В будущем наша морская пехота станет одним из самых дисциплинированных и организованных спецподразделений."
 pol_tech_mountaineers: "Горнострелковые войска I"
 pol_tech_mountaineers_desc: "Бой в горных массивах подвергает войска многим опасностям, но иногда их невозможно избежать. Мы можем минимизировать эти риски, обеспечив наших солдат специальной подготовкой для таких условий."
 pol_tech_mountaineers2: "Горнострелковые войска II"
 pol_tech_mountaineers2_desc: "Выходя за рамки выживания, наши войска могут быть обучены использовать горы в своих интересах. С легким снаряжением и мулами они могут маневрировать по этой местности лучше, чем другая пехота."
 pol_tech_mountaineers3: "Горнострелковые войска III"
 pol_tech_mountaineers3_desc: "Подготовка к самым трудным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск исключительной подготовки и дисциплины."
 pol_tech_special_forces: "Спецназ"
 pol_tech_special_forces_desc: "Нетрадиционные боевые действия требуют специальной подготовки. Мы должны убедиться, что наши войска подготовлены и способны адаптироваться к суровым условиям."
 pol_advanced_special_forces: "Продвинутая подготовка спецназа"
 pol_advanced_special_forces_desc: "Благодаря интенсивной подготовке мы можем гарантировать, что наши спецназовцы смогут выполнять задачи, превосходящие возможности обычных людей."
 pol_improved_special_forces:1 "Расширенная программа спецназа"
 pol_improved_special_forces_desc:1 "Спецназ способен выполнять миссии, которые не под силу обычным солдатам. Нам нужно расширить программы обучения, чтобы больше наших солдат получили соответствующую квалификацию."
 pol_survival_training: "Обучение выживанию"
 pol_survival_training_desc: "Наши спецназовцы часто будут сражаться в тылу врага и в условиях дефицита ресурсов. Мы должны научить их переносить суровую погоду и сражаться с ограниченными запасами."
 pol_elite_forces: "Элитные силы"
 pol_elite_forces_desc: "Только лучшие из лучших становятся спецназовцами. Солдаты, которые пройдут обучение, будут сильнее, быстрее и будут сражаться ожесточеннее, чем кто-либо другой."
 pol_extreme_environment_training: "Обучение работе в экстремальных условиях"
 pol_extreme_environment_training_desc: "Мы должны быть способны сражаться в самых суровых условиях. При правильном обучении и оснащении наши войска смогут сражаться в самых экстремальных условиях."

 hun_paratroopers_description: "Десантники: §G+5%§! к Скорости и Защите, а также §G+10%§! к Атаке в Холмах и Равнинах.\n"
 
 hun_mountaineers_description: "§OГорнострелковые войска§!: \n §G+10%§! к §YСкорости, Атаке§! и §YЗащите§! в Горах\n§G+5%§! к §YСкорости, Атаке§! и §YЗащите§! в Лесах\n§G+2%§! к §YАтаке§! и §YЗащите§! в Холмах.\n"
 hun_mountaineers_commando_description: "§OКоммандос§!: \n§G+10%§! к §YСкорости§! и §YАтаке§! в Лесах, Болотах, Джунглях, Горах и Холмах.\n"
 
 hun_marines_description: "§OМорпехи§!: \n§G+5%§! к §YАтаке§! и §YЗащите§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! и §YЗащите§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 hun_marines_commando_description: "§OКоммандос§!: \n§G+5%§! к §YАтаке§! и §G+10%§! §YСкорости§! в Болотах и Джунглях\n§G+10%§! к §YАтаке§! через Реки\n§G+15%§! к §YАтаке§! в Морских вторжениях.\n"
 
 hun_urban_training: "Обучение в городе"
 hun_urban_training_desc: "Десантникам и горнострелкам все чаще приходится сражаться в городах и поселках. Совместные усилия могут привести к улучшению тактики ведения боя в таких условиях."
 hun_urban_training_description: "§OДесантники§!: \n§G+20%§! к §YАтаке§! и §YЗащите§! в Городской местности\n§OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Городской местности.\n"
 
 hun_fort_training: "Обучение в укреплениях"
 hun_fort_training_desc: "Морпехи и горнострелки все чаще штурмуют крепости. Совместные усилия могут привести к улучшению тактики ведения боя против окопавшихся врагов."
 hun_fort_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §YЗащите§! в Укреплениях.\n"
 
 hun_recon_training: "Обучение разведке"
 hun_recon_training_desc: "Десантники и горнострелки часто оказываются перед лицом невероятных трудностей. Обучение их специализированной тактике разведки даст им преимущество."
 hun_recon_description: "§OГорнострелковые войска§! и §OДесантники§!: \n§G+20%§! к §YСкорости передвижения§!\n"
 
 hun_water_training: "Водная подготовка"
 hun_water_training_desc: "Морпехам и горнострелкам регулярно приходится сражаться в мокрой среде. Совместные усилия и обмен опытом могут способствовать совершенствованию тактики ведения боя в воде."
 hun_water_training_description: "§OМорпехи§! и §OГорнострелковые войска§!: \n§G+10%§! к §YАтаке§! и §G+5%§! к §YЗащите§! на реках и в болотах.\nКоммандос: \n§G+10%§! к §YАтаке§! на реках и в болотах.\n"
 
 hun_jungle_training: "Обучение в джунглях"
 hun_jungle_training_desc: "Десантникам и горнострелкам обычно приходится прокладывать маршруты через джунгли для достижения целей. Объединение двух групп для анализа этой местности поможет лучше проводить операции.."
 hun_jungle_training_description: "§OВсе войска специального назначения§!: \n§G+10%§! к §YСкорости передвижения§! и §G+5%§! к §YАтаке§! в Джунглях.\n"
 
 hun_tank_training: "Противотанковая подготовка"
 hun_tank_training_short: "Обучение танкам"
 hun_tank_training_desc: "Морские пехотинцы и горнострелки сражаются с растущим числом танков. Обучение их слабым местам танков и атакам в ближнем бою поможет им уничтожить вражеские танковые силы."
 
 hun_tech_special_forces_training: "Подготовка спецназа"
 hun_tech_special_forces_training_short: "Подготовка спецназа"
 hun_tech_special_forces_training_desc: "Ужесточить программы обучения, чтобы наши спецназовцы стали более эффективными"
 
 hun_paratroopers4: "Десантники IV"
 hun_paratroopers4_short: "Десантники IV"
