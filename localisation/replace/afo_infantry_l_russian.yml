 cze_heavy_infantry_weapons_upgrade_1_desc: "8cm minomet vz.36"

 cze_heavy_infantry_weapons_upgrade_2: "12cm minomet vz.43"
 cze_heavy_infantry_weapons_upgrade_2_desc: "12cm minomet vz.43"

 cze_night_vision_1_desc: "Способность видеть врага, не будучи замеченным, является ключом к ночным операциям. С изобретением инфракрасной технологии мы можем оснастить нашу армию приборами, которые, хотя и громоздки, делают это возможным."

 cze_night_vision_2: "Ночное видение II"
 cze_night_vision_2_desc: "Ранние инфракрасные прицелы, изначально предназначенные для использования снайперами, имели ограниченный диапазон обзора. По мере совершенствования портативности и улучшения обзора эти приборы могут использоваться все большим числом военнослужащих, действующих ночью."

 hun_inf_1: "FEG 35.M"
 hun_inf_1_short: "FEG 35.M"
 hun_inf_1_desc: "FEG 35.M - это хорошо сконструированная винтовка, которую лучше всего использовать в оборонительных целях. Ее скорострельность довольно низкая, даже для своего возраста, и она с трудом справляется с задачей нанесения урона вражеским целям.\n§RЭто новая модель, и она не сохранит эффективность§!"

 hun_inf_2: "FEG 35.M + SIG MKMS"
 hun_inf_2_short: "FEG 35.M + SIG MKMS"
 hun_inf_2_desc: "SIG MKMS - это пистолет-пулемет большой мощности, разработанный в Швейцарии. Несмотря на то, что пистолет-пулемет довольно дорог, он является существенным улучшением для нашей пехоты и позволяет ей вести огонь в движении гораздо эффективнее.\n§GЭто позволит сохранить эффективность от FEG 35.M§!"

 hun_inf_3: "FEG 35.M + Danuvia 39.M"
 hun_inf_3_short: "FEG 35.M + Danuvia 39.M"
 hun_inf_3_desc: "Danuvia 39.M использует более крупный патрон 9x24 мм Mauser и поэтому более эффективен против пехоты по сравнению со своим предшественником. Однако использование более крупного патрона приводит к снижению темпа стрельбы и возможностей подавления.\n§GЭто позволит сохранить эффективность от FEG 35.M + SIG MKMS§!"

 hun_inf_4: "FEG 43.M + Danuvia 43.M"
 hun_inf_4_short: "FEG 43.M + Danuvia 43.M"
 hun_inf_4_desc: "FEG 43.M был переделан под стандартные немецкие боеприпасы. В варианте 43.M для Danuvia была немного изменена конструкция рукоятки и приклада. В результате боевые возможности оружия улучшились незначительно. К настоящему времени это оружие сильно устарело по сравнению с конкурентами.\n§RЭто новая модель, и она не сохранит эффективность§!"

 hun_inf_5: "FEG 43.M + Danuvia 43/A.M"
 hun_inf_5_short: "FEG 43.M + Danuvia 43/A.M"
 hun_inf_5_desc: "В Danuvia 43/A.M были внесены дополнительные небольшие изменения, которые позволили значительно улучшить все аспекты оружия. Несмотря на средние показатели, пистолет надежен и прост в производстве.\n§GЭто позволит сохранить эффективность от FEG 43.M + Danuvia 43.M§!"

 hun_inf_6: "K.A 43.M + Danuvia 44.M"
 hun_inf_6_short: "K.A 43.M + Danuvia 44.M"
 hun_inf_6_desc: "Пистолет-пулемет Danuvia 44.M значительно урезан по сравнению со своими предшественниками. Наши войска будут страдать от меньшей огневой мощи в бою, но мы сможем производить больше оружия."

 hun_inf_7: "K.A 43.M + Kucher K1"
 hun_inf_7_short: "K.A 43.M + Kucher K1"
 hun_inf_7_desc: "Предназначенный для использования в военизированных формированиях и полиции, Kucher K1 продолжает традиции своих предшественников, являясь дешевым, но достаточно эффективным оружием. Он очень похож на Danuvia 44.M и практически не имеет улучшений.\n§GЭто позволит сохранить эффективность от K.A 43.M + Danuvia 44.M§!"

 hun_hv_inf_1: "S 07/31.M + S 31.M"
 hun_hv_inf_1_short: "Schwarzlose 07/31.M + Solothurn 31.M"
 hun_hv_inf_1_desc: "Schwarzlose 07/31.M - прочный и надежный средний пулемет родом из Австро-Венгрии, а Solothurn 31.M - адаптированная конструкция немецкого MG 30. Вместе они обеспечивают значительную всестороннюю силу нашей тяжелой пехоты.\n§RЭто новая модель, и она не сохранит эффективность§!"

 hun_hv_inf_2: "S 07/31.M + S 31.M + S 36.M"
 hun_hv_inf_2_short: "Schwarzlose 07/31.M + Solothurn 31.M + Solothurn 36.M"
 hun_hv_inf_2_desc: "Добавлена противотанковая винтовка Solothurn 36.M. Несмотря на эффективность борьбы с легкой бронетехникой, винтовка очень громоздка и поэтому сложна в производстве.\n§GЭто позволит сохранить эффективность от S 07/31.M + S 31.M§!"

 hun_hv_inf_3: "S 07/43.M + S 43.M + 60mm 44.M"
 hun_hv_inf_3_short: "Schwarzlose 07/43.M + Solothurn 43.M + 60mm 44.M"
 hun_hv_inf_3_desc: "60-мм "Páncélrém" 44.M - это одноразовый ручной гранатомет, который значительно повышает противотанковые возможности нашей пехоты. К сожалению, он не сможет справиться со многими видами средней брони. Небольшие усовершенствования обоих пулеметов повысили их наступательные возможности.\n§RЭто новая модель, и она не сохранит эффективность§!"

 hun_hv_inf_4: "S 07/43.M + S 43.M + 44.M Buzogányvető"
 hun_hv_inf_4_short: "Schwarzlose 07/43.M + Solothurn 43.M + 44.M Buzogányvető"
 hun_hv_inf_4_desc: "44.M Buzogányvető использует 100-мм противотанковую ракету HEAT для нанесения тяжелых повреждений бронированным целям. Он чрезвычайно эффективен для борьбы с широким спектром брони. Однако его производство обходится недешево.\n§GЭто позволит сохранить эффективность от theS 07/43.M + S 43.M + 60mm 44.M§!"

