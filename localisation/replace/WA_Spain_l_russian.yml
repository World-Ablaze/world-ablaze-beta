 spain.11.t: "ВМС Испании переходят на другую сторону"
 spain.11.d: "После наших недавних успехов исход войны ясен, и, похоже, флот с этим согласен. Все оставшиеся корабли, верные республиканцам, теперь перешли на нашу сторону в надежде быстро положить конец войне."
 spain.11.a: "Отличные новости"
  
 spain.12.t: "ВМС Испании переходят на другую сторону"
 spain.12.d: "После наших недавних потерь наш флот перешел на сторону националистов, оставив нас на произвол судьбы. Все, на что мы можем сейчас надеяться, это чудо..."
 spain.12.a: "Предатели!"
  
 spain.13.t: "Интернациональные бригады"
 spain.13.d: "Мужчины и женщины со всего мира пришли и присоединились к нашей борьбе против националистов! Хотя им не хватает подготовки, они привносят отважный боевой задор, который поднял наш моральный дух!"
 spain.13.a: "Добро пожаловать!"
  
 spa_armor.802.t: "Война переходит в финальную стадию"
 spa_armor.802.d: "Гражданская война длится уже несколько лет, и все стороны подготовили боевые планы, необходимые для завершения конфликта в свою пользу."
 spa_armor.802.a: "Пришло время положить этому конец."
 spa_armor.802.a_tt: "§YУдаляет незапланированное наступление во всех провинциях\n§!"
  
 spa_armor.803.t: "Движение «Маки» раздавлено"
 spa_armor.803.d: ""
 spa_armor.803.a: "Передать наши поздравления войскам"
  
 spa_armor.804.t: "Маки отражают наше наступление"
 spa_armor.804.d: ""
 spa_armor.804.a: "В следующий раз мы до них доберемся"
  
 spa_armor.806.t: "Голод в Испании!"
 spa_armor.806.d: "После окончания гражданской войны нам не удалось наладить импорт продовольствия, и теперь среди населения стремительно распространяется голод."
 spa_armor.806.a: "Положение катастрофическое"
  
 spa_armor.810.t: "[USA.GetName] угрожает эмбарго нашей стране"
 spa_armor.810.d: "Соединенные Штаты Америки пригрозили ввести против нас полное эмбарго после наших недавних политических действий. Благодаря связям США в Южной Америке страны, на которые распространяется доктрина Монро, последовали их примеру. Похоже, что если мы не подчинимся их требованиям, нам, возможно, придется искать необходимые нам ресурсы в другом месте."
 spa_armor.810.a: "Мы не сможем выжить без помощи капиталистов."
 spa_armor.810.b: "Мы не поддадимся давлению!"
  
 spa_armor.811.t: "Война переходит в финальную стадию"
 spa_armor.811.d: "Гражданская война длится уже несколько лет, и все стороны подготовили боевые планы, необходимые для завершения конфликта в свою пользу."
 spa_armor.811.a: "Организуем воздушный мост с помощью союзников"
 spa_armor.811.b: "Мы привезем их морем"
 spa_africa_army_airlift_tt: "§YКаждую неделю в Севилье появляется 1 дивизия, максимум - 3\n§!"
 
 
 
 
 
  
 
 