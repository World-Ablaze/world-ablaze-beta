 bftb_bulgaria_equipment_purchases.12.a_tt: "В состав Резервного флота добавлены три эсминца"
  
 bftb_bulgaria_fatherland_front.21.t: "Отечественный фронт наносит удар!"
 bftb_bulgaria_fatherland_front.21.desc: "Сегодня по заранее составленному плану местные организации «Отечественского фронта» и вооруженные партизанские формирования захватили мэрии и районные администрации по всей стране. \nБольшая численность и поддержка сделали любое сопротивление с нашей стороны бесполезным, теперь мы вынуждены согласиться на все условия, выдвинутые сепратистами."
 bftb_bulgaria_fatherland_front.21.a: "Мы проиграли"
  
 bftb_bulgaria_fatherland_front.22.t: "Отечественный фронт наносит удар!"
 bftb_bulgaria_fatherland_front.22.desc: "Сегодня по заранее составленному плану местные организации «Отечественского фронта» и вооруженные партизанские формирования захватили мэрии и районные администрации по всей стране. \nПовстанцы не встретили или вообще не встретили сопротивления на всем побережье Черного моря от Бургаса до Варны[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport]."
 bftb_bulgaria_fatherland_front.22.a: "Тогда это гражданская война!"