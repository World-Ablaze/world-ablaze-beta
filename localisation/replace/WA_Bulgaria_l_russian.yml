 BUL_treaty_of_neuilly_sur_seine: "Нёйиский договор"
 BUL_treaty_of_neuilly_sur_seine_desc: "Следствием Нёйиского договора являются серьезные ограничения, наложенные на нашу армию. Они не только запрещают обязательную военную службу, ограничивают количество солдат и офицеров в наших силах и не позволяют нам содержать какую-либо передовую технику, но и запрещают любые военные маневры или планирование кампаний и даже оговаривают количество винтовок, которые мы можем использовать."
 BUL_army_restrictions_mobilization_law_tt: "§RНельзя улучшать законы о призыве или объявлять войны.\nНельзя обучать и расформировывать воинские части, а также редактировать их шаблоны.\nНельзя производить артиллерию, бронетехнику, авиацию и флот.§!"
  
 BUL_treaty_of_salonkia: "Салоникский договор"
 BUL_treaty_of_salonkia_tt: "В соответствии с пересмотренным договором нам разрешено перевооружить нашу армию, но нам запрещено увеличивать призыв на военную службу или угрожать нашим соседям."
  
 BUL_komsomol_activists: "Комсомольские активисты"
 BUL_komsomol_activists_tt: "£stability_texticon §YСтабильность§! §Rснизится§! на §R-30.00%§! и\n£faction_bul_zveno £faction_bul_bs £faction_bul_agrarian_union £faction_bul_nsm £faction_bul_kings_party станут §Rвраждебнее§!, в случае войны с §R[SOV.GetNameRuInst]§!.\nБудет §Gудалено§!, если §Y[SOV.GetNameRuGen]§! не существует."
  
