 BUL_crush_the_socialists_tt_2: "\nФракция £faction_bul_zveno «§YЗвено§!» будет §gуничтожена§!. Сведет всё влияние £faction_bul_zveno §YЗвена§! на £political_power_texticon §Yежедневный прирост политической власти§! ([?BUL_zveno_political_power_gain|+]) => (§Y0.00§!), £army_experience §Yполучаемый опыт армии§! ([?BUL_zveno_army_xp|+]) => (§Y0.00§!) и £stability_texticon §Yстабильность§! ([?BUL_zveno_stability|+%]) => (§Y0.00%§!).\n\nФракция £faction_bul_bs «§YШирокие социалисты§!» будет §gуничтожена§!. Сведет всё влияние £faction_bul_bs §YШироких социалистов§! на £factory_output_texticon §Yобъем заводского производства§! и £dockyard_output_texticon §Yпроизводительность верфи§! ([?BUL_socialist_industrial_capacity_factory_and_dockyard|+%]) => (§Y0.00%§!), и £stability_texticon §Yстабильность§! ([?BUL_socialist_stability|+%]) => (§Y0.00%§!).\n\nФракция £faction_bul_agrarian_union  «§GАграрный союз§!» будет §gуничтожена§!. Сведет всё влияние £faction_bul_zveno §GАграрного союза§! на £consumer_goods_texticon  §Yожидаемое количество фабрик, перенаправленных на товары народного потребления§! ([?BUL_agrarian_consumer_goods_factor|Y%.1]) => (§Y0.0%§!), £boost_popularity_texticon  §Yежедневную поддержку§! §Rсоциализма§! ([?BUL_agrarian_communist_gain|-]) => (§Y0.00§!) и £stability_texticon §Yстабильность§! ([?BUL_agrarian_stability|+%]) => (§Y0.00%§!).\n\n"
  
