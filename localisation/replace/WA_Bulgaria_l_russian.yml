 bul_armor.801.t: "Георгий Кёсеиванов уходит в отставку!"
 bul_armor.801.d: "Сегодня мы получили письмо от Георгия Кёсеиванова, в котором говорится, что из-за плохого состояния здоровья (а скорее, непопулярности) он подаст в отставку со своего поста. Он предлагает, чтобы его заменой стал Богдан Филов, германофил, который будет стремиться к более тесным связям с Германией."
 bul_armor.801.a: "Мы примем его отставку"
  
 bul_armor.802.t: "Советский Союз принимает мир"
 bul_armor.802.d: ""
 bul_armor.802.a: "Мы избежали беды"
  
 bul_armor.803.t: "Советский Союз требует верности"
 bul_armor.803.d: ""
 bul_armor.803.a: "Мы вынуждены подчиниться"
 bul_armor.803.b: "Мы не можем принять эти условия"
  
 bul_armor.804.t: "Советский Союз отвергает мир!"
 bul_armor.804.d: ""
 bul_armor.804.a: "Мы находимся в опасной ситуации..."
 bul_armor.804.b: "Обратимся к союзникам"
  
 bul_armor.805.t: "Отправить предложение в Италию"
 bul_armor.805.d: ""
 bul_armor.805.a: "Просто заказать танки"
 bul_armor.805.b: "Попросить у них также лицензию на производство"
  
 bul_armor.806.t: "Болгария хочет приобрести L3a"
 bul_armor.806.d: ""
 bul_armor.806.a: "Предоставить им лицензию"
 bul_armor.806.b: "Утвердить заказ на танки"
 bul_armor.806.c: "Они ничего не получат!"
  
 bul_armor.807.t: "Болгария хочет закупить современные истребители"
 bul_armor.807.d: ""
 bul_armor.807.a: "Предоставить им лицензию"
 bul_armor.807.b: "Продавать не в наших интересах"
  
 bul_armor.808.t: "Болгария обращается к нам за промышленным сотрудничеством"
 bul_armor.808.d: ""
 bul_armor.808.a: "Мы оба выиграем от этого."
 bul_armor.808.b: "Так не пойдет!"

 bul_armor.809.t: "Оформить лицензию на оружие в Германии"
 bul_armor.809.d: "Нашей стране не хватает собственных разработок, и хотя мы не можем строить тяжелую технику, мы можем начать производство снаряжения для пехоты. [GER.GetName] стремится помочь нашей первоначальной ремилитаризации."
 bul_armor.809.a: "Заключить лицензионные соглашения!"
 
 bul_armor.810.t: "[BUL.GetName] ищет лицензии"
 bul_armor.810.d: "Болгария, стремясь приобрести современное оборудование, обратилась к нам за нашим пехотным вооружением, и нам решать, принять ли их предложение, если мы хотим укрепить их мощь."
 bul_armor.810.a: "Это хорошая сделка"
 
 bul_armor.811.t: "[GER.GetName] принимает наше предложение"
 bul_armor.811.d: ""
