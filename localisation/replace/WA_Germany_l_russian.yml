 germany.28.a: "Австрия присоединится к Германскому Рейху!"
 
 ger_armor.201.t: "Гитлер планирует аншлюс"
 ger_armor.201.d: "Мы получили сообщения о плане Гитлера вторгнуться в Австрию и присоединить ее к своему рейху. Это дает нам возможность нанести удар по Берлину, пока большая часть армии будет находиться на юге, однако нам может потребоваться больше времени, чтобы собраться с силами, и этот план рискован. Если мы решим не действовать, Австрия будет находиться под властью нацистов, пока мы не освободим их."
 ger_armor.201.a: "Гнусный поступок, но для переворота слишком рано"
 ger_armor.201.b: "Мы планируем нанести удар в этот момент!"
  
 ger_armor.202.t: "Гитлер нацелился на Судетскую область"
 ger_armor.202.d: "Пришло новое известие о плане Гитлера аннексировать Судетскую область. Мы решили не наносить удар во время аншлюса, и теперь появилась новая возможность. С начала года мы собрали больше поддержки, и судетский кризис станет отличной возможностью свергнуть фюрера!"
 ger_armor.202.a: "Мы планируем нанести удар в этот момент!"
  
 ger_armor.203.t: "Встреча с Последним гусаром"
 ger_armor.203.d: "Август фон Макензен считается лояльным к Германии, а не только к какой-либо партии, которая находится у власти. Обращение к нему с суровой правдой о целях Гитлера и его партии и о том, как это приведет Германию к разорению, посеяло, как мы и рассчитывали, семена мятежа в душе последнего гусара, и он пообещал помочь нам в нашем перевороте. Теперь нам предстоит решить, какую роль он будет играть."
 ger_armor.203.a: "Из него выйдет отличный руководитель"
 ger_armor.203.b: "Мы должны поставить его на второстепенную роль"
 GER_203_a: "§YПозволяет вернуть Кайзера§!"
 GER_203_b: "§YРазрешит создание Хунты§!"
  
 ger_armor.204.t: "Тайная делегация"
 ger_armor.204.d: "Таинственный посланник сообщил нам тяжелые новости о том, что была создана оппозиционная партия, чтобы бросить вызов правлению Гитлера в Германии. В довершение всего нам сообщили о плане Гитлера по захвату Австрии! Нам был предложен выбор, ввязываться ли в этот конфликт и предотвратить вторжение Германии на австрийскую землю, напрямую поддержав оппозицию."
 ger_armor.204.a: "Это отличная возможность"
 ger_armor.204.b: "Нам слишком рискованно вмешиваться"
  
 ger_armor.205.t: "[HUN.GetName] обещает поддержку"
 ger_armor.205.d: "Видя прекрасную возможность восстановить Австро-Венгрию без вмешательства Гитлера, руководители Венгрии приняли наше предложение, и мы заручимся венгерской военной помощью в нашей борьбе против Гитлера."
 ger_armor.205.a: "Их поддержка будет неоценима"
  
 ger_armor.206.t: "[HUN.GetName] Отклоняет вмешательство"
 ger_armor.206.d: ""
 ger_armor.206.a: "Придется обойтись без них"
  
 ger_armor.209.t: "Офицеры Вермахта арестованы"
 ger_armor.209.d: "Наш заговор раскрыт, многие наши лидеры найдены и казнены. Для Германии наступили темные времена, и все планы по свержению Гитлера сожжены. Все, что осталось от нашей оппозиции, снова скрылось."
 ger_armor.209.a: "Для нас все закончилось"
  
 ger_armor.210.t: "Офицеры Вермахта бросают вызов Гитлеру"
 ger_armor.210.d.a: "Скрытое недовольство правлением Гитлера достигло апогея в связи с нынешним кризисом, вызванным решением администрации аннексировать Австрию. Ряд генералов Вермахта сплотились вокруг известного фельдмаршала Августа фон Макензена, который привел в действие планы, направленные на свержение Гитлера и изгнание нацистской партии из Германии.\n\nПоскольку раскол в немецком высшем командовании стал очевиден даже за рубежом, иностранные державы предпочли не вмешиваться, их больше беспокоила растущая внутренняя нестабильность Германии. Стареющий фельдмаршал действовал быстро, уже сформировав временное правительство, к которому присоединилось множество противников нацистского правительства.\n\nВоенный переворот уже в самом разгаре."
 ger_armor.210.d.b: "Скрытое недовольство правлением Гитлера достигло апогея в связи с нынешним кризисом, вызванным действиями администрации по аннексии Судетской области. Ряд генералов Вермахта сплотились вокруг известного фельдмаршала Августа фон Макензена, который привел в действие планы, направленные на свержение Гитлера и изгнание нацистской партии из Германии.\n\nПоскольку раскол в немецком высшем командовании стал очевиден даже за рубежом, иностранные державы предпочли не вмешиваться, их больше беспокоила растущая внутренняя нестабильность Германии. Стареющий фельдмаршал действовал быстро, уже сформировав временное правительство, к которому присоединилось множество противников нацистского правительства.\n\nВоенный переворот уже в самом разгаре."
 ger_armor.210.a: "Изгоните эту нацистскую нечисть с наших земель!"
  
 ger_armor.211.t: "[From.GetNameDefCap] требует Восточную Пруссию"
 ger_armor.211.d: "В разгар текущей ситуации Германия потребовала от нас территорию Восточной Пруссии, чтобы воссоединить старый прусский регион.\n\nВ текущей ситуации они очень ясно дали понять, что это их последнее слово. Никаких переговоров и дипломатии не будет. У них будет Восточная Пруссия, или они начнут из-за нее войну."
 ger_armor.211.a: "Хотят войны — пусть начинают, если осмелятся!"
 ger_armor.211.b: "Мы не можем позволить себе войну с [From.GetNameDef]."
  
 ger_armor.212.t: "[From.GetNameDefCap] отказывается отдать нам Восточную Пруссию"
 ger_armor.212.d: "Глупым дипломатическим ходом, [From.GetLeader], [From.GetAdjective]ий лидер отклонил все [Root.GetAdjective]ие требования!\n\nОни не уступят Восточную Пруссию и фактически предложили нам объявить войну, если посмеем, высмеивая наше желание защитить наших [Root.GetAdjective]их братьев и сестёр."
 ger_armor.212.a: "Быть по сему!"
  
 ger_armor.213.t: "[From.GetNameDefCap] отдает Восточную Пруссию"
 ger_armor.213.d: "Столкнувшись с перспективой войны с нами, [From.GetNameDef] согласился уступить весь контроль над Восточной Пруссией и отказаться от любых будущих притязаний на этот регион.\n\n[Root.GetAdjective]ое население Восточной Пруссии наконец окажется в безопасности в составе [Root.GetNameDef]."
 ger_armor.213.a: "За [Root.GetNameDef] и всех его [Root.GetAdjective]их жителей!"
  
 ger_armor.214.t: "Варшавская конференция"
 ger_armor.214.d: "Требования Германии относительно Восточной Пруссии в Польше, где проживает значительное количество этнических немцев, достигли апогея. [GER.GetLeader] разместил силы вдоль польской границы, готовясь к нападению. В Варшаве проходят переговоры между Великобританией, Францией, Италией и Германией в надежде на мирное окончание восточно-прусского кризиса. Какова будет позиция Великобритании?"
 ger_armor.214.d_2: "Требования Германии относительно Восточной Пруссии в Польше, где проживает значительное количество этнических немцев, достигли апогея. [GER.GetLeader] разместил силы вдоль польской границы, готовясь к нападению. Поскольку мы уже доказали, что не примем немецкий экспансионизм, это означает, что у нас теперь есть еще один союзник в войне против Германии."
 ger_armor.214.d_3: "Требования Германии относительно восточно-прусского региона Польши, где проживает значительное количество этнических немцев, достигли апогея. [GER.GetLeader] разместил силы вдоль польской границы, готовясь к нападению. В Варшаве проходят переговоры между Нидерландами, Великобританией, Францией, Италией и Германией в надежде на мирное окончание прусского кризиса. Какова будет позиция Голландии?"
 ger_armor.214.a: "Поляки предоставлены сами себе."
 ger_armor.214.b: "Польшу надо защищать!"
  
 ger_armor.215.d: "Требования Германии относительно восточно-прусского региона Польши, где проживает значительное количество этнических немцев, достигли апогея. [GER.GetLeader] разместил силы вдоль польской границы, готовясь к нападению. В Варшаве проходят переговоры между Великобританией, Францией, Италией и Германией в надежде на мирное окончание прусского кризиса.\n\nБританцы ясно дали понять, что у них нет намерения начинать войну из-за «ссоры в далекой стране». Должны ли мы последовать их примеру или выполним свои обязательства перед Польшей, предложив ей поддержку?"
 ger_armor.215.a: "Оставить поляков на произвол судьбы."
 ger_armor.215.b: "Будь прокляты британцы! Франция поддерживает своих друзей!"
  
 ger_armor.216.d: "Требования Германии относительно восточно-прусского региона Польши, где проживает значительное количество этнических немцев, достигли апогея. [GER.GetLeader] разместил силы вдоль польской границы, готовясь к нападению. В Варшаве проходят переговоры между Великобританией, Францией, Италией и Германией в надежде на мирное окончание прусского кризиса.\n\nБританцы отказались отступить и вместо этого угрожают немцам войной, если они нарушат границы Польши. Война может быть неизбежной."
 ger_armor.216.a: "Мы должны подготовиться!"
 ger_armor.216.b: "Франция должна держаться подальше от этого."
  
 ger_armor.217.t: "Франция покидает союзников"
 ger_armor.217.d: "Упрямые французы отказались последовать нашему примеру в прусском кризисе! Они поддерживают Польшу, а поскольку мы этого не делаем, они решили разорвать наш взаимный союз. Уже сейчас Франция готовится к скорой войне с Германией."
 ger_armor.217.a: "Дураки! [GER.GetLeader] надо умиротворить!"
  
 ger_armor.218.d: "Требования Германии относительно нашей территории в районе Восточной Пруссии становятся все более враждебными, и теперь их силы концентрируются вдоль нашей границы! В Варшаве проходит конференция, на которой европейские лидеры обсуждают будущее Польши, но нас не пригласили.\n\nК счастью, похоже, что союзники сдержат свои прежние обещания поддержки. Они пригрозили [GER.GetLeader] войной, если наши границы будут хоть сколько-нибудь нарушены. Несмотря на это, мы должны подготовиться к неизбежному нападению Германии."
 ger_armor.218.a: "Хорошо! Пусть приходят!"
  
 ger_armor.219.d: "Требования Германии относительно нашей территории в районе Восточной Пруссии становятся все более враждебными, и теперь их силы концентрируются вдоль нашей границы! В Варшаве проходит конференция, на которой европейские лидеры обсуждают будущее Польши, но нас не пригласили.\n\nБританские трусы отказались поддержать наш суверенитет, но, по крайней мере, французы за нас заступились! Они отказались от своего союза с Великобританией и заключили с нами новый союз, пообещав поддержать Польшу в борьбе с немецкой агрессией."
 ger_armor.219.a: "Да здравствует Франция!"
  
 ger_armor.220.t: "Варшавский диктат"
 ger_armor.220.d: "Требования Германии относительно нашей территории в районе Восточной Пруссии становятся все более враждебными, и теперь их силы концентрируются вдоль нашей границы! В Варшаве проходит конференция, на которой европейские лидеры обсуждают будущее Польши, но нас не пригласили.\n\nИ британцы, и французы отказались от своих прежних обещаний поддержать нас против немецкой агрессии. Их дипломаты ясно дали понять, что если мы решим сопротивляться немцам, мы сделаем это самостоятельно. Возможно, у нас нет другого выбора, кроме как сдать Восточную Пруссию..."
 ger_armor.220.a: "Это темный день для Европы."
 ger_armor.220.b: "Мы никогда не сдадимся!"
  
 ger_armor.221.d: "В Варшаве прошли переговоры между лидерами Германии, Великобритании, Франции и Италии, на которых обсуждалось будущее Польши. Британцы и их союзники отвергли наши законные претензии на Восточную Пруссию и угрожали нам войной, если мы «нарушим» польскую границу!\n\nПлан вторжения в Польшу составлен, но, скорее всего, это спровоцирует общеевропейскую войну. Мы должны убедиться, что готовы к этому."
 ger_armor.221.a: "Значит, придется действовать силой."
  
 ger_armor.222.d: "В Варшаве прошли переговоры между лидерами Германии, Великобритании, Франции и Италии, на которых обсуждалось будущее Польши. Британцы прислушались к голосу разума и признали наши претензии на Восточную Пруссию законными, но упрямые французы отказываются отступать.\n\nОни отказались от сотрудничества с Великобританией и вместо этого установили более тесные связи с поляками. Похоже, нам придется иметь дело с ними обоими одновременно, но, по крайней мере, теперь британцы, надеюсь, не вмешаются..."
 ger_armor.222.a: "Это может пойти нам на пользу."
  
 ger_armor.223.d: "В Варшаве прошли переговоры между лидерами Германии, Великобритании, Франции и Италии, на которых обсуждалось будущее Польши. И британцы, и французы признали наши претензии на Восточную Пруссию законными, а их предыдущие предложения поддержки полякам были отменены.\n\nНесмотря на безнадёжность своего положения, упрямые поляки отказываются сдать свою территорию! Нам придется взять ее силой. Подготовлен план вторжения, который сотрет с лица Земли этот гнусный эксперимент Версаля!"
 ger_armor.223.a: "Поляки должны быть уничтожены."
  
 ger_armor.224.d: "В Варшаве прошли переговоры между лидерами Германии, Великобритании, Франции и Италии, на которых обсуждалось будущее Польши. И британцы, и французы признали наши претензии на Восточную Пруссию законными, а их предыдущие предложения поддержки полякам были отменены.\n\nПризнавая безнадежность своего положения, поляки сдали нам прусские территории. Их угнетенные немецкие жители наконец вернутся в Фатерланд!"
 ger_armor.224.a: "Это исторический день для Германии."
  
 ger_armor.225.t: "Германия предлагает выбрать нового короля"
 ger_armor.225.d: "Венгрия уже много лет была регентством без короля, теперь Германская империя предлагает поддержать нас в новой коронации монарха под ее защитой."
 ger_armor.225.a: "Кайзерайх расцветет под защитой Германии"
 ger_armor.225.b: "Больше никаких кайзеров!"
  
 ger_armor.226.t: "Германия предлагает вернуть султана"
 ger_armor.226.d: "Германия обратилась к нам с рассказами о славном союзе между Германией и Османской империей, предлагая наделить полномочиями нового султана и защитить нас от любого иностранного вмешательства."
 ger_armor.226.a: "Снова султан"
 ger_armor.226.b: "Турция останется демократической"
  
 ger_armor.227.t: "Возвращение Австрии"
 ger_armor.227.d: "Поскольку Венгрия поддерживает наше правительство, у нас есть возможность вернуть Австрию им или оставить ее себе."
 ger_armor.227.a: "Воссоединить двойную монархию"
 ger_armor.227.b: "Австрия останется немецкой"
  
 ger_armor.228.t: "Германия требует Норд-Шлезвиг"
 ger_armor.228.d: "Германия требует вернуть Северный Шлезвиг, называя его исторической немецкой территорией."
 ger_armor.228.a: "Сдать Шлезвиг"
 ger_armor.228.b: "Защищаться до последнего солдата!"
  
 ger_armor.229.t: "[DEN.getName] возвращает Шлезвиг"
 ger_armor.229.d: "Признавая необходимость воссоединения немцев со своей страной, [DEN.getName] с радостью вернул нашу территорию."
 ger_armor.229.a: "Добро пожаловать домой"
  
 ger_armor.230.t: "[DEN.getName] отказывается вернуть Шлезвиг"
 ger_armor.230.d: "[DEN.getName] отказалась, высмеивая нашего атташе: они будут в Берлине через неделю, если мы начнем войну по этому поводу."
 ger_armor.230.a: "Тогда силой!"
  
 ger_armor.400.t: "Вступление Германии в страны Балтии"
 ger_armor.400.d: "Когда немецкие войска вошли в Прибалтику, местное население приветствовало их в надежде на восстановление своей независимости. Советская оккупация была жестокой, и поэтому многие жители стремятся присоединиться к немцам в их борьбе против Советского Союза."
 ger_armor.400.a: "Мы освободим все земли от власти большевиков"
 german_entry_baltic: "§YКаждому прибалтийскому/украинскому региону при завоевании будет добавлено§! §g15%§! £compliance_texticon  §Gподчинения§!."
  
 ger_armor.407.t: "Вступление Германии в Украину"
 ger_armor.407.d: "Когда немецкие войска вошли в Украину, местное население приветствовало их в надежде на обретение независимости от Советского Союза, особенно после событий Голодомора. Таким образом, многие жители стремятся присоединиться к немцам в их борьбе против Советского Союза."
 ger_armor.407.a: "Мы освободим все земли от власти большевиков"
 german_entry_ukraine: "§GКаждому освобожденному региону при завоевании будет добавлено§! §g15%§! £compliance_texticon  §Gподчинения§!."
  
 ger_armor.503.t: "Японская технология торпед"
 ger_armor.503.d: "После долгих усилий по приобретению чертежей и образцов превосходной японской авиационной торпеды Type 91 мы наконец получили секретную поставку. Нашим инженерам удалось создать собственную версию этой торпеды, получившую обозначение LT 850."
 ger_armor.503.a: "Мы будем очень благодарны за этот подарок!"
  
 ger_armor.710.t: "[HUN.GetName] предлагает обмен исследованиями"
 ger_armor.710.d: "Наши шпионы пронюхали о скором заключении венгерского перемирия. Мы слишком доверяли нашим союзникам, и если мы хотим сохранить контроль над их людьми и материалами, мы должны действовать быстро и перебросить войска в Венгрию и установить там марионеточный режим."
 ger_armor.710.a: "Захватите Будапешт немедленно!"
 
 ger_armor.711.t: "Судьба Югославии"
 ger_armor.711.d:1 "Мы всегда знали, что югославское государство, вырезанное из империи Габсбургов, - это искусственная страна, которой не суждено существовать долго. Этническая неприязнь, кипевшая под поверхностью, выплеснулась наружу, и государство разваливается на части. Мы должны вмешаться, чтобы исправить ситуацию."
 ger_armor.711.a: "Создать марионеточную Хорватию. Остальное разделить."
 ger_armor.711.b: "Расчленить Югославию."
 ger_armor.711.c: "Создать марионеточную Хорватию. Остальное аннексировать."
 ger_armor.711.e: "Аннексировать всю Югославию."

 ger_armor.712.t: "Судьба Греции"
 ger_armor.712.d:1 "Греция недавно расширила свои границы благодаря силе наших врагов. Теперь, когда мы получили контроль над Греческим государством, мы обязаны исправить ситуацию."
 ger_armor.712.a: "Создать марионеточную Грецию. Остальное разделить."
 ger_armor.712.b: "Разделить Грецию."
 ger_armor.712.c: "Аннексировать всю Грецию."

 ger_armor.713.t: "Хорватский вопрос"
 ger_armor.713.d:1 "После распада Югославии появилось множество группировок, желающих вступить с нами в союз или выступить против нас. Одна из них - Хорватия, где есть особенно воинственное крыло, которое мы можем использовать в своих интересах. Если этого не сделать, сопротивление может вырасти настолько, что страна станет полностью враждебной по отношению к нам."
 ger_armor.713.a: "Необходимо принять взвешенное решение"
 
 ger_armor.798.t: "[GER.GetName] просит аудиенции у короля"
 ger_armor.798.d: "[GER.GetName] успешно сверг фашистского Гитлера и возродил кайзеррейх. Однако Вильгельм II выполняет скорее консультативную роль, в то время как на трон взошел его сын, принц Оскар Прусский. Вместо враждебных действий он думает о союзе со своими родственниками. После свержения других родственных монархов, таких как царь Николай II, Оскар стал единственным, кроме короля Георга VI, потомком королевы Виктории, правящим монархом в Европе. Как это уже неоднократно случалось в истории, эти отношения могут стать основой альянса."
 ger_armor.798.a: "Мы должны держаться вместе в эти нестабильные времена"
 ger_armor.798.b: "Родня или нет, но немцы нам не союзники!"
  
 ger_armor.799.t: "[ENG.GetName] принимает предложение союза"
 ger_armor.799.d: "Король Георг VI был согласен с нами в предлагаемом нами союзе родства. Его влияние на политику [ENG.GetName] должно обеспечить хорошие международные отношения с нами. После падения других монархов — потомков королевы Виктории нет лучшего способа обеспечить продолжение правления этой династии, чем объединиться в союз."
 ger_armor.799.a: "Одна крупная держава Западной Европы на нашей стороне, осталась еще одна..."
  
 ger_armor.800.t: "[ENG.GetName] Отклоняет предложение союза"
 ger_armor.800.d: "Хотя король Георг VI был открыт для нашего предложения, остальные... некоролевские представители английского правительства вмешались и полностью прекратили разговор. Похоже, слухи верны: английская монархия пала... перед собственным народом."
 ger_armor.800.a: "Жаль"
  
 ger_armor.801.t: "Германия предлагает союз"
 ger_armor.801.d: "После наших территориальных потерь в зимней войне немцы обратились к нам с приглашением присоединиться к их фракции. С продолжающимся вторжением в Советский Союз у нас появилась возможность вернуть себе наши земли и распространить свое влияние на всю Северную Скандинавию. Это заманчивая возможность, но мы должны быть уверены, что Германия победит. Также существует вероятность того, что, если мы не примем это предложение, мы окажемся открытыми для вторжения Оси в будущем. Каким бы ни было наше решение, пути назад после него уже нет..."
 ger_armor.801.a: "Мы воспользуемся их предложением"
 ger_armor.801.b: "Нас не втянут в новую войну"
  
 ger_armor.802.t: "Финляндия присоединяется к Оси"
 ger_armor.802.d: "Хотя среди наших правительств существуют разногласия, наша цель одна – уничтожение советского зла. Наши отношения восходят ко временам до Зимней войны, и настало время нашим странам объединиться против Советов, чтобы вернуть и утвердить то, что по праву нам принадлежит. Немцы предлагают союз против Советского Союза ради величия наших наций и для того, чтобы отомстить за тех, кого мы потеряли по вине Советов."
 ger_armor.802.a: "Мы обещали месть"
  
 ger_armor.803.t: "Финляндия отказывается от нашего предложения"
 ger_armor.803.d: "Финны отказались и остаются нейтральными по отношению к тем, кто когда-то обидел их. Как могло их правительство быть настолько слабым, чтобы не воспользоваться случаем, чтобы отомстить за них!"
 ger_armor.803.a: "Нам придется удвоить наши усилия на Севере."
  
 ger_armor.804.t: "Смерть Фрица Тодта"
 ger_armor.804.d: "8 февраля 1942 года, вскоре после взлета с аэродрома Вольфшанце под Растенбургом в Восточной Пруссии, самолет Тодта внезапно разбился. К сожалению, несмотря на быструю реакцию, Тодт был объявлен мертвым на месте.\n\nВ Берлине были проведены торжественные похороны, и теперь партия ищет замену на посту нового министра вооружений. Многие смотрят на Альберта Шпеера как на многообещающего и амбициозного человека, который хорошо подойдет для этой роли."
 ger_armor.804.a: "Мы будем оплакивать эту потерю"
  
 ger_armor.805.t: "Германия приглашает нас в Ось"
 ger_armor.805.d: "В условиях, когда на Балканах бушует война, Германия обратилась к нам за помощью, пообещав предоставить нам новые земли как в Греции, так и в Югославии, если мы присоединимся к Оси."
 ger_armor.805.a: "Мы принимаем их приглашение"
 ger_armor.805.b: "Мы должны оставаться нейтральными"
  
 ger_armor.806.t: "Болгария отказывается"
 ger_armor.806.d: "Болгария отклонила наше предложение, и новый балканский фронт вряд ли откроется, если мы не заставим ее сделать это."
 ger_armor.806.a: "Мы предлагали им легкий путь"
 ger_armor.806.b: "Наверное, это к лучшему"
  
 ger_armor.807.t: "[JAP.GetName] Предлагает обмен исследованиями"
 ger_armor.807.d: "Япония просит обмена технологиями, чтобы помочь нам модернизировать наш флот, а также чтобы мы помогли модернизировать их армию."
 ger_armor.807.a: "Мы принимаем их предложение"
 ger_armor.807.b: "Нам не нужен этот обмен"
  
 ger_armor.808.t: "[GER.GetName] Принимает обмен исследованиями"
 ger_armor.808.d: ""
 ger_armor.808.a: "Отлично"
  
 ger_armor.809.t: "[GER.GetName] Отклоняет обмен исследованиями"
 ger_armor.809.d: ""
 ger_armor.809.a: "Жаль"
  
 ger_armor.810.t: "Рудольф Гесс спасен"
 ger_armor.810.d: "Во время нашего глубокого проникновения в Великобританию наши солдаты наткнулись на тюремную камеру, в которой содержится наш бывший руководитель партии Рудольф Гесс. Он был в восторге, когда мы взяли под свой контроль здание, твердя о немецкой славе и грядущем столетнем рейхе, но невозможно забыть его действия после падения Франции. Теперь остается вопрос, что с ним делать?"
 ger_armor.810.a: "Мы не можем игнорировать его действия"
 ger_armor.810.b: "Мы должны восстановить его звание"
  
 ger_armor.811.t: "[GER.GetName] требует Эльзас-Лотарингию"
 ger_armor.811.d: "Германия находится на пути к возвращению своей былой славы, и это ставит ее в прямой конфликт с нами. В настоящее время их взгляды направлены на Эльзас-Лотарингию, законную французскую территорию, которой когда-то владели немцы. Нам поставили ультиматум: верните землю или вступите в войну."
 ger_armor.811.a: "На данный момент это служит нашим интересам"
 ger_armor.811.b: "Это возмутительное требование"
  
 ger_armor.812.t: "[FRA.GetName] отдала Эльзас-Лотарингию"
 ger_armor.812.d: "Франция сочла бесполезным воевать с нами."
 ger_armor.812.a: "Сюрприз, конечно, но приятный"
  
 ger_armor.813.t: "[FRA.GetName] отклоняет наше требование"
 ger_armor.813.d: ""
 ger_armor.813.a: "Тогда мы просто возьмем силой"
  
 ger_armor.814.t: "[From.GetName] предлагает экономическую интеграцию"
 ger_armor.814.d: "Поскольку мы уже тесно переплетены, [From.GetNameDef] выступил с предложением помочь нам в расширении нашей военной экономики путем более полной интеграции наших экономик. Это значительно способствовало бы нашему военному росту и сблизило бы наши страны."
 ger_armor.814.a: "Отличная идея"
 ger_armor.814.b: "Пожалуй, нет"
  
 ger_armor.815.t: "[From.GetName] принимает экономическую интеграцию"
 ger_armor.815.d: "[From.GetAdjective]ое правительство  сообщает нам, что оно принимает наше предложение об интеграции наших военных экономик."
 ger_armor.815.a: "Под нашей опекой их армии будут расти."
  
 ger_armor.816.t: "[From.GetName] отвергает экономическую интеграцию"
 ger_armor.816.d: "[From.GetAdjective]ое правительство сообщает нам, что оно отвергает наше предложение об интеграции наших военных экономик."
 ger_armor.816.a: "Они отвергают само величие!"
  
 ger_armor.817.t: "Выбор нового главы Вермахта"
 ger_armor.817.d: "Нашим первым шагом в обеспечении безопасности нашей нации является реформирование и денацификация нашей армии. После чистки СС у нас есть три кандидата, которые могут справиться с этой задачей и помочь прославить нашу новую армию."
 ger_armor.817.a: "Людвиг Бек доказал свою лояльность"
 ger_armor.817.b: "Вернер фон Фрич может оказаться интересным выбором"
 ger_armor.817.c: "Вальтер фон Браухич был бы хорошим вариантом."
  
 ger_armor.818.t: "Выбор нового главы Люфтваффе"
 ger_armor.818.d: "Наше люфтваффе было заражено эго Геринга, ниже приведены два кандидата, которые помогут вернуть честь люфтваффе и сделать его грозным мечом Германии."
 ger_armor.818.a: "Альберт Кессельринг – хороший кандидат"
 ger_armor.818.b: "Риттер фон Грейм может подойти"
  
 ger_armor.819.t: "Выбор нового главы Кригсмарине"
 ger_armor.819.d: "Кригсмарине оказалась верной Германии, а не нацистам. Они — гордость Германии, и мы должны выбрать кандидата, который поведет их в это новое будущее."
 ger_armor.819.a: "Эрих Редер будет уничтожать флоты"
 ger_armor.819.b: "Гюнтер Лютьенс кажется многообещающим"
  
 ger_armor.820.t: "Захват чешской танковой промышленности"
 ger_armor.820.d: "Благодаря недавно установленному контролю над Чехией мы можем использовать любые полезные конструкции танков, которые нам попадутся."
 ger_armor.820.a: "Отлично"
  
 ger_armor.821.t: "Объявление четырехлетнего плана"
 ger_armor.821.d: "Экономическое чудо Германского Рейха поразило не только немецкий народ, но и международное сообщество. Нам нужно встать на путь экономической организации, и Адольф Гитлер объявил план, который будет реализован в течение следующих четырех лет. Целью этого плана будет контроль над экономикой, а также решение разногласий внутри министерства экономики между Яльмаром Шахтом и Германом Герингом."
 ger_armor.821.a: "Путь к величию!"
  
 ger_armor.822.t: "Немецкая взаимопомощь"
 ger_armor.822.d: "Германия хочет эксклюзивных торговых прав на материалы, которые мы производим. Взамен они позволят нам иметь эксклюзивные права на их ресурсы. По сути, это беспроигрышная ситуация."
 ger_armor.822.a: "Мы примем эти условия"
 ger_armor.822.b: "Нет, спасибо, мы справимся сами."
  
 ger_armor.823.t: "Италия принимает"
 ger_armor.823.d: "Италия приняла наши условия, и между нашими странами открылась более свободная торговля, а инвесторы уже обосновались в Южном Тироле. Надеюсь, это позволит обеим нашим странам помогать друг другу в нашем перевооружении."
 ger_armor.823.a: "Отлично"
  
 ger_armor.824.t: "Италия отказывается"
 ger_armor.824.d: "Итальянцы отклонили наше предложение и дистанцировались от Германии. Это может означать только то, что они не желают присоединяться к нам и, возможно, стремятся к политике, которая будет идти вразрез с нашими планами."
 ger_armor.824.a: "Мы должны внимательно следить за ними"
  
 ger_armor.825.t: "Германия выдвинула ультиматум"
 ger_armor.825.d: "Германия пришла к выводу, что [From.GetName] больше не может самостоятельно функционировать в качестве эффективного члена Оси, и предъявила нам ультиматум. Либо мы примем немецкий контроль над нашим правительством и вооруженными силами, по сути став марионеткой, либо рискуем столкнуться с силовым решением вопроса."
 ger_armor.825.a: "Они должны уважать нашу силу!"
 ger_armor.825.b: "Мы будем торговаться за лучшую позицию"
 ger_armor.825.c: "У нас нет другого выбора, кроме как принять"
  
 ger_armor.826.t: "[From.GetName] отказывается"
 ger_armor.826.d: "[From.GetName] категорически отвергает ультиматум!"
 ger_armor.826.a: "Теперь мы прибегаем к силе"
 ger_armor.826.b: "Мы отступим"
  
 ger_armor.827.t: "[From.GetName] просит большей автономии"
 ger_armor.827.d: "[From.GetName] утверждает, что, хотя мы правы в своей оценке, они хотели бы попросить большей автономии, чем мы предлагаем."
 ger_armor.827.a: "Мы позволим это"
 ger_armor.827.b: "Мы согласимся только на полный контроль"
  
 ger_armor.828.t: "[From.GetName] принимает"
 ger_armor.828.d: "[From.GetName] рассматривают сложившуюся ситуацию как нестабильную и ведущую к потенциальному кризису. Таким образом, они приняли наш ультиматум в обмен на немедленную военную поддержку."
 ger_armor.828.a: "Это для общего блага"
  
 ger_armor.830.t: "Германия объявляет войну!"
 ger_armor.830.d: "Похоже, Германия намерена настаивать на этих абсурдных требованиях... предательские собаки"
 ger_armor.830.a: "Наши шансы невелики"
  
 ger_armor.831.t: "Германия берет на себя полный контроль"
 ger_armor.831.d: "После нашего ответа Германия поставила нас под свой контроль, и нам ничего не остается, кроме как ходить на поводке. Возможно, есть надежда восстановить нашу автономию, если мы докажем, что способны"
 ger_armor.831.a: "Это для общего блага"
  
 ger_armor.832.t: "Германия утверждает свое господство"
 ger_armor.832.d: "После нашего ответа Германия предоставила нам некоторую автономию и утвердила свой контроль над нашей страной. Возможно, есть надежда восстановить нашу автономию, если мы докажем, что способны"
 ger_armor.832.a: "Мы обречены"
  
 ger_armor.833.t: "Германия отступает"
 ger_armor.833.d: "Германия осознает абсурдность своих требований и отступает. Хотя мы остаемся союзниками, напряженность возросла, и было бы неразумно доверять Германии."
 ger_armor.833.a: "Мы избежали катастрофы"
  
 ger_armor.829.t: "Германия отвергает наше предложение"
 ger_armor.829.d: "Германия отвергла все, кроме тотального контроля, и теперь у нас осталось два варианта..."
 ger_armor.829.a: "Мы просто не можем принять это"
 ger_armor.829.b: "У нас нет другого выбора, кроме как встать на колени"
  
 ger_armor.701.t: "Поддержка Циндао"
 ger_armor.701.d: "Германский рейх обратился к нам с предложением дальнейшей поддержки посредством танковой и пехотной техники, однако, как и западные державы, они требуют от нас передать контроль над портовым городом Циндао. Хотя мысль об отказе от дальнейшей территории немыслима, это предотвратит ее попадание в руки Японии в случае начала войны."
 ger_armor.701.e: "Германский рейх обратился к нам с предложением дальнейшей поддержки посредством танковой и пехотной техники, однако, как и западные державы, они требуют от нас передать контроль над портовым городом Циндао. Хотя это противоречит нашей цели японской гегемонии, наличие союзника за пределами Японии может оказаться очень ценным."
 ger_armor.701.a: "Мы можем договориться об этом"
 ger_armor.701.b: "Неприемлемо"
  
 ger_armor.702.t: "Китай принимает нашу поддержку Циндао"
 ger_armor.702.d: "Китай согласился на наше предложение, и уже сейчас осуществляется поставка оборудования в Китай. Наличие территории за пределами Германии является великим национальным достижением и показало миру, что Рейх никуда не денется!"
 ger_armor.702.a: "Китай имеет большой потенциал"
  
 ger_armor.703.t: "Китай отказывается от нашей поддержки Циндао"
 ger_armor.703.d: "Китай решил, что наша поддержка не стоит отказа от территории, и поэтому отказался принять наше предложение."
 ger_armor.703.a: "Они пожалеют об этом"
  
 ger_armor.714.t: "[GER.GetName] давит на нас, требуя закрыть нашу экономику"
 ger_armor.714.d: "Поскольку Германия полностью контролирует Египет и Ирак, они отдали нам приказ прекратить торговлю с другими странами, не входящими в Ось. Если мы будем возражать, это будет означать войну."
 ger_armor.714.a: "Здесь нет реального выбора"
 ger_armor.714.b: "Мы останемся непокоренными до конца!"
 close_off_embargo_tt: "Получает §Yэмбарго на промышленный сектор§! от державы [ROOT.GetFlag] §Y[ROOT.GetName]§!."


 ger_armor.715.t: "[TUR.GetName] принимает наши требования"
 ger_armor.715.d: "Турция уступила нашему давлению и предоставила нашей фракции полный доступ к своему экспорту, отрезав от него всех остальных. Теперь, когда хром обеспечен, мы можем сосредоточиться на другом."
 ger_armor.715.a: "Отличные новости"

 ger_armor.716.t: "[TUR.GetName] отклоняет наши требования"
 ger_armor.716.d: "Турки отказались, ссылаясь на свой нейтралитет, и продолжают оказывать помощь любой стране, которая спрашивает, может ли она помочь в военных действиях против нас. Единственным выходом для нас остается вторжение."
 ger_armor.716.a: "Мы раздавим их за несколько дней"
 ger_armor.716.b: "Война с Турцией слишком рискованна"

 ger_armor.795.t: "Соглашение Клодиуса"
 ger_armor.795.d: "\nГермания обратилась к нам с предложением об эксклюзивных правах на хром в Анталии, обещая взамен большое количество военного снаряжения. В условиях бушующей вокруг нас войны было бы полезно укрепить наши вооруженные силы, используя наши значительные запасы хромитовой руды."
 ger_armor.795.a: "Мы умиротворим немцев"
 ger_armor.795.b: "Мы только усиливаем нашего врага"

 ger_armor.796.t: "[From.GetName] подписывает соглашение"
 ger_armor.796.d: "Наши дипломатические усилия увенчались успехом, и снабжение хромом стало стабильнее."
 ger_armor.796.a: "Превосходно"
 ger_armor.796.b: "Упс, у нас не хватает снаряжения"

 ger_armor.797.t: "[From.GetName] отказывается"
 ger_armor.797.d: "Соглашение Клодиуса было отвергнуто, и нам придется торговать с ними по старинке, или же мы войдем и возьмем хром силой."
 ger_armor.797.a: "Неудачный исход"
 ger_armor.797.b: "Если они отказываются торговать, мы возьмем его силой"
  
 ger_armor.834.t: "Вторгнуться в Польшу?"
 ger_armor.834.d: "Поскольку Польша, похоже, находится на проигравшей стороне в своей войне и не имеет крупных союзников, которые могли бы ей помочь, нам представилась прекрасная возможность воспользоваться любыми претензиями, которые мы можем иметь к их стране, прежде чем они попадут в опасные руки."
 ger_armor.834.a: "Мы защитим немецкий народ"
 ger_armor.834.b: "Это слишком рискованно"
  
 ger_armor.835.t: "Судьба Югославии"
 ger_armor.835.d: "Как лидер Оси, Германия реорганизовала оккупированную страну Югославию, чтобы удовлетворить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Германии."
 ger_armor.835.a: "Мы благодарны за немецкую поддержку"
  
 ger_armor.836.t: "Судьба Югославии"
 ger_armor.836.d: "Как лидер Оси, Германия реорганизовала оккупированную страну Югославию, чтобы удовлетворить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Германии."
 ger_armor.836.a: "Мы благодарны за немецкую поддержку"
  
 ger_armor.837.t: "Судьба Югославии"
 ger_armor.837.d: "Как лидер Оси, Германия реорганизовала оккупированную страну Югославию, чтобы удовлетворить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Германии."
 ger_armor.837.a: "Нам следовало бы дать больше"
  
 ger_armor.838.t: "Судьба Греции"
 ger_armor.838.d: "Как лидер Оси, Германия реорганизовала оккупированную страну Грецию, чтобы удовлетворить претензии всех своих союзников."
 ger_armor.838.a: "Мы благодарны за немецкую поддержку"
  
 ger_armor.839.t: "Судьба Греции"
 ger_armor.839.d: "Как лидер Оси, Германия реорганизовала оккупированную страну Грецию, чтобы удовлетворить претензии всех своих союзников."
 ger_armor.839.a: "Мы благодарны за немецкую поддержку"
  
 ger_armor.840.t: "[GER.GetName] заставляет нас закрыть нашу экономику"
 ger_armor.840.d: "Поскольку Германия полностью контролирует Норвегию и важный Нарвикский маршрут, они отдали нам приказ прекратить всю торговлю с другими странами, которые не являются частью Оси. Если мы выскажем какое-либо возражение, это будет означать неминуемую войну."
 ger_armor.840.a: "Здесь нет реального выбора"
 ger_armor.840.b: "Мы останемся непокоренными до конца!"
  
 ger_armor.841.t: "[SWE.GetName] Принимает наши требования"
 ger_armor.841.d: "Швеция поддалась нашему давлению и предоставила нашей фракции полный доступ к своему экспорту, отрезав всех, кто находится за его пределами. Теперь, когда наше железо обеспечено, мы можем сосредоточиться на другом."
 ger_armor.841.a: "Отличные новости"
  
 ger_armor.842.t: "[SWE.GetName] Отклоняет наши требования"
 ger_armor.842.d: "Шведы отказались, сославшись на свой нейтралитет, и продолжают помогать любой стране, которая спрашивает, может ли она помочь в военных действиях против нас. Наш единственный вариант — вторгнуться"
 ger_armor.842.a: "Мы раздавим их за несколько дней"
 ger_armor.842.b: "Война со Швецией слишком рискованна"
  
 ger_armor.843.t: "Германия требует подчинения"
 ger_armor.843.d: "Германия, как и британцы, считает нашу нефть своей, однако в отличие от британцев"
 ger_armor.843.a: "Если немцы нам помогут, мы принимаем"
 ger_armor.843.b: "Мы не склонимся ни перед каким угнетателем"
  
 ger_armor.844.t: "Вопрос об Ираке"
 ger_armor.844.d: "Ирак теперь находится в нашей сфере влияния, туда были отправлены дипломаты для переговоров об экономической сделке, которая позволит Германии получить контроль над частью иракской промышленности, а мы взамен поможем разработать их нефтяные месторождения. Путь к подчинению Ирака проложен, но мы не получим полных прав на иракскую нефть."
 ger_armor.844.a: "Подчинение предпочтительнее"
 ger_armor.844.b: "Нам нужно взять на себя прямой контроль"
  
 ger_armor.845.t: "Ирак принимает подчинение"
 ger_armor.845.d: ""
 ger_armor.845.a: "Теперь займемся разработкой наших новых нефтяных месторождений"
  
 ger_armor.846.t: "Ирак отвергает подчинение"
 ger_armor.846.d: ""
 ger_armor.846.a: "Тогда мы возьмем его силой"
 ger_armor.846.b: "Тогда оставим их в покое"
  
 ger_armor.847.t: "Германия требует прав на нефть"
 ger_armor.847.d: ""
 ger_armor.847.a: "Мы должны оставаться нейтральными любой ценой"
 ger_armor.847.b: "Мы остаёмся верными союзникам"
  
 ger_armor.848.t: "Вопрос об Иране"
 ger_armor.848.d: "Иран поклялся оставаться нейтральным в нашем конфликте, однако, как и британцы, мы можем оказать на него давление, чтобы он предоставил нам права на свою нефть, а не подвергся немецкой оккупации."
 ger_armor.848.a: "Отправить ультиматум"
 ger_armor.848.b: "Нам нужно взять на себя прямой контроль"
  
 ger_armor.849.t: "Иран сдается"
 ger_armor.849.d: "Иран понял, как важно прислушиваться к нам, и теперь мы получили права на нефть на южных нефтяных месторождениях. Это значительно увеличит наши поступления топлива, обеспечив его стабильные поставки в будущем."
 ger_armor.849.a: "Теперь мы можем плавать в топливе!"
  
 ger_armor.850.t: "Ирак отказывается от сотрудничества"
 ger_armor.850.d: ""
 ger_armor.850.a: "Тогда мы возьмем его силой"
 ger_armor.850.b: "Тогда оставим их в покое"
  
 ger_armor.851.t: "Британское влияние в Норвегии"
 ger_armor.851.d: "После объявления войны Польше британское посольство в Норвегии работало над тем, чтобы склонить Норвегию на сторону союзников, пытаясь изолировать нашу торговлю со Швецией §RОперация «Везерюбунг» может быть проведена после завершения фокуса «Планы войны на Западе»§!"
 ger_armor.851.a: "Мы должны обезопасить Норвегию силой"
  
 ger_armor.852.t: "Гитлер найден мертвым"
 ger_armor.852.d: "После потери Берлина Гитлер, категорически повторявший, что не покинет город, решил покончить жизнь самоубийством, выбрав смерть вместо того, чтобы видеть, как антифашистские элементы захватывают страну.\n\nЕго место во главе Германии занял Карл Дениц; надеясь спасти армию и нацию, он советует вести переговоры о частичной капитуляции перед ее врагами вместо полной капитуляции."
 ger_armor.852.a: "Мы потеряли всякую надежду"
  
 ger_armor.853.t: "Советский Союз требует восточные земли"
 ger_armor.853.d: "Советский Союз стремится подтвердить свои претензии на Восточную Польшу после того, как мы ее завоевали, предполагая, что новая Европа принадлежит как Германии, так и Советскому Союзу. Столь амбициозные претензии подкреплены возможным применением силы.\n\nПохоже, что наша агрессивность на востоке заставила коммунистов опасаться, что мы можем напасть на них в следующий раз. Обычно о легкой уступке большевикам не могло быть и речи, но Советский Союз — далеко не единственная наша забота. Если мы согласимся на их требования, это может выиграть нам время, чтобы разобраться с западом, хотя это также сместит восточный фронт значительно дальше на запад."
 ger_armor.853.a: "Мирно уступить восток."
 ger_armor.853.b: "Мы предъявляем требования"
  
 ger_armor.854.t: "Амбициозный Порше"
 ger_armor.854.d: "С нашего одобрения новые танки «Тигр» будут конструкции Henschel, а не Porsche. Это не помешало Porsche уже начать производство своей версии Tiger, и теперь у нас изготовлено до 50 корпусов, которые в настоящее время не используются."
 ger_armor.854.a: "Нам следует переоборудовать их в тяжелые истребители танков"
  
 ger_armor.855.t: "Новый тяжелый истребитель танков"
 ger_armor.855.d: "Фердинанд Порше вернулся к нам с завершенным проектом нового тяжелого истребителя танков на базе корпусов Tiger. Он способен нести более длинное 88-мм орудие и имеет толстую броню, но его надежность вызывает сомнения в его эффективности."
 ger_armor.855.a: "Мы назовем их в честь Фердинанда"
 ger_armor.855.a_tt: "Добавьте технологию §YFerdinand§! и добавьте §G50§! Фердинанд на склад"
  
 ger_armor.856.t: "Амбициозный Порше"
 ger_armor.856.d: "С нашего одобрения новые танки «Тигр» будут конструкции Porsche, а не Henschel. До нашего решения компания Porsche уже начала производство своей версии «Тигра», и сейчас у нас изготовлено до 50 корпусов. К счастью для нас, это означает, что у нас есть 50 готовых танков, и мы можем официально начать производство с бонусом к эффективности."
 ger_armor.856.a: "Нам повезло"
  
 ger_armor.857.t: "Зачем умирать за Данциг?"
 ger_armor.857.d: "С нашего одобрения война была объявлена Польше и началось отвоевание германских территорий. Однако, к нашему потрясению, союзники выполнили свои обязательства и объявили нам войну в ответ. В результате мы оказались в ситуации, когда большая часть наших войск находится на польской границе, и у нас нет планов продолжения войны за пределами Польши. Нам понадобится некоторое время, чтобы организовать наше высшее командование для продолжения борьбы. Фокус «Планы войны на Западе» будет заблокирован на следующие 4 месяца."
 ger_armor.857.a: "Если они хотят войны, они ее получат"
  
 ger_armor.858.t: "Германия предлагает мир"
 ger_armor.858.d: "Поскольку страны Оси одержали полную победу в Европе, а Советский Союз оказался в руинах, Германия предлагает союзникам мирные условия. К сожалению, без серьезного плацдарма в Европе наши шансы на победу невелики, и, возможно, несколько лет мира помогут нам подготовиться к возможной победе над странами Оси."
 ger_armor.858.a: "Мы принимаем"
 ger_armor.858.b: "Мы никогда не смиримся с поражением"
  
 ger_armor.859.t: "Непокорные союзники"
 ger_armor.859.d: "Даже в случае полной победы США по-прежнему готовы вести с нами войну. Хотя полномасштабное вторжение с их стороны не исключено, оно крайне маловероятно, и вместо этого нам следует начать подготовку к вторжению в США."
 ger_armor.859.a: "Глупцы"
  
 ger_armor.860.t: "Объявление войны Соединенным Штатам"
 ger_armor.860.d: "Соединенные Штаты находятся в состоянии войны, японцы стремительно захватывают союзную территорию в Восточной Азии, и их шансы на победу высоки. Сопоставляя это с ухудшением отношений между США и Германией, фюрер приходит к выводу, что присоединение США к союзническим военным усилиям против нас будет лишь вопросом времени. Мы должны опередить их с объявлением войны, вывести Соединенные Штаты из равновесия и увеличить шансы Японии на победу на востоке."
 ger_armor.860.a: "Великая нация не позволяет объявлять себе войну"
  
 ger_armor.861.t: "Германия предлагает прекратить огонь"
 ger_armor.861.d: "Поскольку страны Оси вытеснили нас за Урал, отняв почти всю нашу промышленность и население, мы не можем продолжать военные действия, сколько бы мы ни жертвовали ради Родины. Германия предложила прекратить огонь, позволив нам сохранить все к востоку от Урала в обмен на прекращение боевых действий. Наши шансы на победу на данном этапе невелики, и, честно говоря, мы не получим лучших условий, чем эти... возможно, несколько лет мира помогут нам восстановиться, чтобы подготовить нашу месть и окончательную победу над Осью."
 ger_armor.861.a: "У нас пока будет мир..."
 ger_armor.861.b: "Мы никогда не смиримся с поражением!"
  
 ger_armor.862.t: "Непокорные Советы"
 ger_armor.862.d: ""
 ger_armor.862.a: "Глупцы"
  
 ger_armor.863.t: "Гитлер обращается к немецкому народу"
 ger_armor.863.d: "Выступление Адольфа Гитлера из бункера фюрера: Я ожидаю, что каждый немец выполнит свой долг до последнего и будет готов взять на себя любую жертву, о которой его попросят, я ожидаю, что каждый трудоспособный немец будет сражаться с полным пренебрежением к своей личной безопасности, я ожидаю, что больные и слабые или те, кто по каким-либо причинам не годен к военной службе, будут работать из последних сил, я ожидаю, что горожане выкуют оружие для этой борьбы, и я ожидаю, что крестьянин, ограничивая себя, будет снабжать хлебом солдат и рабочих этой борьбы, я ожидаю, что все женщины и девушки будут продолжать поддерживать эту борьбу с крайним фанатизмом."
 ger_armor.863.a: "Лучше смерть, чем поражение"
  
 news.338.t: "Речь Йозефа Геббельса в Спортпаласте"
 news.338.d: "Выступление Йозефа Геббельса из Спортпаласта в Берлине: Верите ли вы вместе с фюрером и нами в окончательную полную победу немецкого народа? Готовы ли вы и немецкий народ работать, если прикажет фюрер, 10, 12, а при необходимости и 14 часов в день и отдать все ради победы? Вы хотите тотальной войны? Если необходимо, хотите ли вы войны, более тотальной и радикальной, чем все, что мы можем себе представить сегодня? Стало ли ваше доверие к фюреру более сильным, верным и непоколебимым, чем когда-либо прежде? Готовы ли вы абсолютно и полностью следовать за ним, куда бы он ни пошел, и делать все необходимое для доведения войны до победного конца? Итак, народ, поднимайся, и пусть грянет буря!"
 news.338.a: "Бред"
 news.338.b: "Эндзиг"
  
 ger_armor.864.t: "Гитлер объявляет войну Соединенным Штатам Америки"
 ger_armor.864.d: "Выступление Адольфа Гитлера в рейхстаге: Депутаты! Мужи германского рейхстага! Год всемирно-исторических событий подходит к концу. Приближается год великих решений. В этот тяжелый период я обращаюсь к вам, депутатам рейхстага, как к представителям немецкой нации. Кроме того, весь немецкий народ также должен проанализировать произошедшее и принять к сведению решения, необходимые в настоящем и будущем. Немецкий народ и его солдаты сегодня работают и сражаются не только за себя и свою эпоху, но и за многие будущие поколения. Творец поручил нам историческую задачу уникального масштаба, которую мы теперь обязаны выполнить."
 ger_armor.864.a: "Эндзиг?"
  
 ger_armor.865.t: "Дело Бломберга-Фрича"
 ger_armor.865.d: "Двое наших самых высокопоставленных армейских офицеров были уличены в непристойных действиях. У нас нет другого выбора, кроме как заставить их уйти в отставку и нанять на их место новых сотрудников. Это дает дополнительное преимущество: мы можем получить полный контроль над немецкой армией путем назначения лояльных генералов."
 ger_armor.865.a: "Позорно"
  
 ger_armor.866.t: "Балканский торговый договор"
 ger_armor.866.d: "Германия предлагает торговый блок между нашими двумя странами, что будет означать удешевление импорта и экспорта."
 ger_armor.866.a: "Это взаимовыгодно"
 ger_armor.866.b: "Нет, спасибо, мы справимся сами."
  
 ger_armor.867.t: "[From.GetName] принимает"
 ger_armor.867.d: "[From.GetName] согласился на нашу торговую сделку, надеясь на более тесные отношения с нами"
 ger_armor.867.a: "Отлично"
  
 ger_armor.868.t: "[From.GetName] отклоняет"
 ger_armor.868.d: "[From.GetName] не увидел достаточной выгоды от снижения экспортных цен и поэтому отклонил наш договор."
 ger_armor.868.a: "Мы должны внимательно следить за ними"
  
 ger_armor.869.t: "Соглашение по швейцарскому франку"
 ger_armor.869.d: "Германия обратилась к нам с предложением об эксклюзивных правах на вольфрам в Порту, обещая крупную сумму в швейцарских франках. Поскольку франк гораздо стабильнее и легко обменивается в остальном мире, мы можем получить большую прибыль, если согласимся. Мы также должны подумать, не приведет ли отказ к войне."
 ger_armor.869.a: "Это очень выгодно"
 ger_armor.869.b: "Мы отказываемся иметь дело с Германией"
  
 ger_armor.870.t: "[From.GetName] подписывает соглашение"
 ger_armor.870.d: "Соглашение по швейцарскому франку было хорошо принято португальцами, и теперь у нас есть защищенные права на часть их вольфрама."
 ger_armor.870.a: "Отлично"
  
 ger_armor.871.t: "[From.GetName] отклоняет"
 ger_armor.871.d: "Соглашение по швейцарскому франку отклонено, и нам придется торговать с ними по старинке."
 ger_armor.871.a: "Нежелательный результат"
 ger_armor.871.b: "Если они отказываются торговать, мы возьмем его силой"
  
 ger_armor.872.t: "Давление на Швецию"
 ger_armor.872.d: "Германия требует военного доступа через наши территории после союза с Финляндией"
 ger_armor.872.a: "У нас нет выбора"
 ger_armor.872.b: "Неприемлемо"
  
 ger_armor.873.t: "[From.GetName] уступает"
 ger_armor.873.d: "Требования Германии о переброске войск и техники через Швецию в Финляндию для войны на востоке были приняты шведским правительством."
 ger_armor.873.a: "Хорошо"
  
 ger_armor.874: "[From.GetName] Отклоняет наши требования"
 ger_armor.874.d: ""
 ger_armor.874.a: "Тогда нам придется применить силу"
 ger_armor.874.b: "Это имело мало значения"
  
 ger_armor.875.t: "Ультиматум для [POR.GetName]"
 ger_armor.875.d: ""
 ger_armor.875.a: "Подчинить их власти Испании"
 ger_armor.875.b: "Они либо присоединятся к Оси, либо будут завоеваны"
 ger_armor.875.c: "Ввести войска"
  
 ger_armor.876.t: "[GER.GetName] требует испанского правления над нами"
 ger_armor.876.d: ""
 ger_armor.876.a: "У нас нет другого выбора, кроме как подчиниться"
 ger_armor.876.b: "Возмутительно! Готовьтесь к вторжению"
  
 ger_armor.877.t: "[GER.GetName] Требует членства в Оси"
 ger_armor.877.d: ""
 ger_armor.877.a: "У нас нет другого выбора, кроме как подчиниться"
 ger_armor.877.b: "Мы никогда не склонимся перед фашистами"
  
 ger_armor.878.t: "[POR.GetName] признает власть страны [SPR.GetName]"
 ger_armor.878.d: ""
 ger_armor.878.a: "Мудрый выбор"
  
 ger_armor.879.t: "[POR.GetName] присоединяется к Оси"
 ger_armor.879.d: ""
 ger_armor.879.a: "Мудрый выбор"
  
 ger_armor.880.t: "[POR.GetName] Отклоняет наши требования"
 ger_armor.880.d: ""
 ger_armor.880.a: "Плохой выбор. Ввести войска"
  
 ger_armor.881.t: "Ультиматум для [TUR.GetName]"
 ger_armor.881.d: ""
 ger_armor.881.a: "Потребовать пропуска наших войск и грузов"
 ger_armor.881.b: "Они либо присоединятся к Оси, либо будут завоеваны"
 ger_armor.881.c: "Ввести войска"
  
 ger_armor.882.t: "[GER.GetName] требует военного доступа"
 ger_armor.882.d: ""
 ger_armor.882.a: "У нас нет другого выбора, кроме как подчиниться"
 ger_armor.882.b: "Наша территориальная целостность не может быть нарушена"
  
 ger_armor.883.t: "[GER.GetName] Требует членства в Оси"
 ger_armor.883.d: ""
 ger_armor.883.a: "У нас нет другого выбора, кроме как подчиниться"
 ger_armor.883.b: "Мы никогда не склонимся перед фашистами"
  
 ger_armor.884.t: "[TUR.GetName] Принимает наши требования"
 ger_armor.884.d: ""
 ger_armor.884.a: "Отлично"
  
 ger_armor.885.t: "[TUR.GetName] присоединяется к Оси"
 ger_armor.885.d: ""
 ger_armor.885.a: "Отлично"
  
 ger_armor.886.t: "[TUR.GetName] Отклоняет наши требования"
 ger_armor.886.d: ""
 ger_armor.886.a: "Жаль. Ввести войска"
  
 ger_armor.887.t: "Раскрыто предательство Абвера"
 ger_armor.887.d: "Рекце, агент гестапо, обнаружил «кружок Зольф» — группу немецких интеллектуалов и сотрудников разведки с антинацистскими настроениями, которые стояли за многими неудачными операциями и передавали критически важную информацию нашим врагам."
 ger_armor.887.a: "Смерть предателям"
  
 ger_armor.888.t: "Операция «Валькирия» провалилась!"
 ger_armor.888.d: "Покушение на нашего фюрера провалилось. После того, как во время одного из наших военных совещаний в Волчьем логове взорвалась бомба, наш фюрер был всего в нескольких дюймах от смерти. Мы выследили предателей, которые осмелились попытаться свергнуть нас! Теперь нам нужно решить судьбу всех офицеров, имеющих какое-либо отношение к этому заговору. В любом случае за это придется дорого заплатить!"
 ger_armor.888.a: "Они все вкусят наш гнев!"
 ger_armor.888.b: "Очистить только руководство!"
  
 ger_armor.889.t: "Начало операции «Валькирия»"
 ger_armor.889.d: "«Валькирия» — операция по ликвидации любых внутренних чрезвычайных ситуаций. «Валькирия» — идея использовать резервную немецкую армию для защиты нации от коллапса, вызванного не союзниками или Советами, а внутренними проблемами. Но после некоторой переработки операция получила еще одну цель — начало «окончательного» покушения на Адольфа Гитлера."
 ger_armor.889.a: "Давайте начнем планировать"
  
 ger_armor.890.t: "Где нам следует осуществить заговор?"
 ger_armor.890.d: ""
 ger_armor.890.a: "В Волчьем логове"
 ger_armor.890.b: "Во время полета"
 ger_armor.890.c: "В Бергхофе"
  
 valkyrie_location_a_tt: "Изменяет §GШанс убить Гитлера на 5%§!. Изменяет §Gсилу противника в Гражданской войне на -20%§!."
 valkyrie_location_b_tt: "Изменяет §GШанс убить Гитлера на 10%§!. Изменяет §Gсилу противника в Гражданской войне на -10%§!."
 valkyrie_location_c_tt: "Изменяет §GШанс убить Гитлера на 15%§!."
  
 ger_armor.891.t: "Кто должен осуществить заговор?"
 ger_armor.891.d: ""
 ger_armor.891.a: "Клаус фон Штауффенберг"
 ger_armor.891.b: "Фридрих Ольбрихт"
 ger_armor.891.c: "Хеннинг фон Тресков"
  
 valkyrie_ringleader_a_tt: "Изменяет §GШанс убить Гитлера на 5%§!. 50% Шанс умереть, стоимость §R150 политической власти§!"
 valkyrie_ringleader_b_tt: "Изменяет §GШанс убить Гитлера на 10%§!. 50% шанс умереть, затрачивая §R10% поддержки войны§!"
 valkyrie_ringleader_c_tt: "Изменяет §GШанс убить Гитлера на 15%§!. 50% шанс умереть, изменив §Rсилу противника в Гражданской войне на 5%§!."
  
 ger_armor.893.t: "Адольф Гитлер выжил!"
 ger_armor.893.d: "Покушение на фюрера провалилось: бомба, заложенная Штауффенбергом, взорвалась в заранее определенном месте, однако фюрер был всего в нескольких дюймах от неминуемой смерти. Мы выследили предателей, которые осмелились попытаться свергнуть нас! Теперь нам нужно решить судьбу всех офицеров, имеющих какое-либо отношение к этому заговору. В любом случае за это придется дорого заплатить!"
 ger_armor.893.a: "Они все вкусят наш гнев!"
 ger_armor.893.b: "Очистить только руководство!"
  
 ger_armor.894.t: "Адольф Гитлер убит!"
 ger_armor.894.d: "Скрытое недовольство правлением Гитлера достигло апогея в связи с нынешним кризисом, вызванным неспособностью довести войну с СССР до победного конца и ухудшением положения на фронтах."
 ger_armor.894.a: "Взять правительство под контроль!"
  
 ger_armor.895.t: "[GER.GetName] Просит мира"
 ger_armor.895.d: ""
 ger_armor.895.a: "Они доказали свою приверженность миру"
 ger_armor.895.b: "Мы принимаем только безоговорочную капитуляцию"
  
 ger_armor.896.t: "[FROM.GetName] соглашается на мир"
 ger_armor.896.d: ""
 ger_armor.896.a: "Теперь мы можем бросить все силы против Советов"
  
 ger_armor.897.t: "[FROM.GetName] Отвергает мир"
 ger_armor.897.d: ""
 ger_armor.897.a: "Сейчас мы находимся в худшем положении, чем раньше..."
  
 germany.998.t: "Смерть Адольфа Гитлера"
 germany.998.d: "Два дня назад Адольф Гитлер перенес обширный инсульт, впоследствии его срочно доставили в медицинское учреждение, но он умер на следующий день, теперь НСДАП собирается, чтобы выбрать нового лидера."
 germany.998.a: "Мартин Борман"
 germany.998.b: "Йозеф Геббельс"
 germany.998.c: "Герман Геринг"
 germany.998.e: "Альберт Шпеер"
 appoint_speer_tt: "Эффект: \nОткрывает доступ к различным решениям по реформированию военной экономики. \nПромышленники станут §Gлояльными§! и получат §Gтотальное§! влияние, увеличивая скорость исследования на §G+10.00%§! \n\n"
  
  
  
 germany.98.e: "Создать марионеточную Хорватию. Остальное разделить."
 germany.99.e: "Разделить Грецию между Болгарией и Италией"
  
 germany.130.t: "Западный Берлин присоединяется к союзникам"
 germany.130.d: "После Ялтинской конференции войска отошли к соответствующим границам, и Западный Берлин вошел в зону союзной оккупации. Его расположение уязвимо, и нам следует немедленно разместить там войска."
 germany.130.a: "Отлично"

