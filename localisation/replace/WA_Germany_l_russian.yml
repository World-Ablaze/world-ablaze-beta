 GER_balkanhalbinsel_TT: "Должены контролировать все Балканы напрямую или через марионеток."
 GER_nordafrika_TT: "Должен контролировать все территории африканского континента, за исключением Конго, Кот-д'Ивуара, Нигерии, Кении, Эфиопии, Анголы и Южной Африки напрямую или через марионеток."
 GER_reichskommissariat_dismantle: "Демонтаж Соединенного Королевства"
