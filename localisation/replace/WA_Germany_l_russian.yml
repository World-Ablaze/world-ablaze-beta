 GER_reichskommissariat_ostland_required_states_tt: "Требуется, чтобы Ось контролировала все территории §YПрибалтики§! и §YБелоруси§!"
 GER_reichskommissariat_ukraine_desc: "По мере того как наши войска продвигаются по обширной украинской степи, под наш контроль попадает большое количество земель и людей. Создание гражданского оккупационного режима с четкой целью установления мира в регионе для дальнейшего использования послужит нашим интересам, чтобы наши армии могли продолжать продвигаться вглубь Советского Союза, обеспечивая безопасность тыла. Административным центром нового рейхскомиссариата станет город Ровно. Кроме того, передача советской территории Украины от военного управления к гражданскому сыграет важную роль в плане создания «жизненного пространства» (Lebensraum) для арийской расы.\n \nНа первых этапах это позволит умиротворить в некоторой степени местное население, взять под немецкий контроль экономику этих территорий и сформировать украинскую вспомогательную полицию."
 GER_reichskommissariat_ukraine_required_states_tt: "Требуется, чтобы Ось контролировала все территории §YУкраины§!"
 GER_reichskommissariat_moskowien_desc: "После успешного наступления в Подмосковье создание нового рейхскомиссариата в этом районе продолжится по плану. По мере продвижения кампании против Советского Союза на востоке оккупированные территории будут постепенно передаваться от военного управления к гражданскому. Предполагается, что новый рейхскомиссариат охватит территорию до Уральских гор. Таким образом, он охватит более или менее те же земли, которые когда-то находились под контролем средневекового Московского государства. Это ознаменует полное уничтожение России, будь она капиталистической, коммунистической или царской, и освободит Рейх от «восточного кошмара на века вперед», а такие слова, как «Россия» и «русский», навсегда уйдут в прошлое, и отныне останется только рейхскомиссариат Московия."
 GER_reichskommissariat_moskowien_required_states_tt: "Требуется, чтобы Ось контролировала все §Y[SOV.GetAdjective]ие§! регионы к западу от Урала"
 GER_reichskommissariat_Kaukasus: "Рейхскомиссариат Кавказ"
 GER_reichskommissariat_Kaukasus_desc: "Поскольку силы Вермахта продолжают продвигаться дальше вглубь богатого нефтью российского Кавказа, нам необходимо создать местную администрацию, чтобы наши силы не отвлекались на такие вещи, как надзор за местным населением. Площадь будущего рейхскомиссариата составит около 500 000 км², а население — около 18 миллионов человек. Формирование местного самоуправления снимет нагрузку с наших войск, а также теоретически успокоит коренное население. Однако в будущем этот регион с его историей взаимно враждующих государств и народов должен подвергнуться очень жесткому контролю. Ведь с падением Советской власти «забытые конфликты» между христианским и мусульманским населением на Юге Кавказа, а также между горцами и казаками на Севере – могут разгореться с чудовищной силой и новой администрации придется решать их."
 GER_reichskommissariat_Kaukasus_required_states_tt: "Требуется, чтобы Ось контролировала все территории §YКавказа§!"
 GER_reichskommissariat_turkei: "Рейхскомиссариат Турция"
  
