 SS_motorized_to_mechanized_refit_tt: "Все моторизованные дивизии СС будут §Rрасформированы§! и переоборудованы в танково-гренадерские дивизии СС. §RТАКЖЕ РАСПУТИТ ВСЕ ДРУГИЕ ДИВИЗИИ В БЕРЛИНЕ!\n§!Снаряжение будет отправлено обратно на склад. Панцергренадерская дивизия СС включает §GМеханизированную пехоту§! и дивизионную артиллерию, а также несколько батальонов §GСредних танков§!."
  
