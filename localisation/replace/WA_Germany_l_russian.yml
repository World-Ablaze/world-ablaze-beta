l_russian:

 GER_reichsautobahn: "Reichsautobahn"
 GER_reichsautobahn_tt: "Добавляет максимальную §Yинфраструктуру§! в §YСеверном Бранденбурге§!, §YЮжном Бранденбурге§!, §YНижней Саксонии§!, §YТюрингии§! и §YФранконии§!"
 GER_reichsautobahn_desc:1 "С момента своего запуска в 1933 году проект рейхсаутобана стал грандиозным успехом. Строительные работы способствовали снижению безработицы, а широкие дороги стали символом экономического возрождения Германии. Однако предстоит еще многое сделать."

 GER_issue_weapon_contracts_tt: "£faction_ger_industrialists §YПромышленники§! станут §3дружелюбнее§! и §Gвлиятельнее§!"
  
 GER_integrate_war_economies_tt5: "§R[CZE.GetName] должна одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
  
  
 GER_continue_with_schacht: "Продолжить работу с Шахтом"
 GER_continue_with_schacht_desc: "Ялмар Шахт проделал огромную работу в качестве руководителя Рейхсбанка и нашего министра экономики. Его Общество металлургических исследований сыграло жизненно важную роль в тайном обеспечении средств для нашего перевооружения, а его политика хорошо сработала во время экономического чуда этого десятилетия. Мы должны подтвердить его власть и устранить препятствия в его работе."
  
 GER_appoint_hermann_goring: "Назначить Германа Геринга"
 GER_appoint_hermann_goring_desc: "Герман Геринг является ярким примером члена НСДАП и разделяет с нами идеологические взгляды, хотя он и не самый экономически компетентный. Мы можем решить эту проблему, продолжая наше перевооружение на прочном фундаменте идеологической однородности."
 GER_appoint_hermann_goring_tt: "§RВоенные облигации теперь выполняются вдвое быстрее, однако они обеспечивают только половину снижения экономической усталости.§!"
  
 GER_reichswerke_hermann_goring: "Рейхсверке Герман Геринг"
 GER_reichswerke_hermann_goring_desc: "Геринг предвидел необходимость в Reichswerke, интегрированной государственной компании, которой было поручено превзойти стальных баронов Рура в тяжелой промышленности. Использование государственных средств позволит ей добывать низкосортные руды, которые частные компании не могут себе позволить."
  
 GER_auxiliary_autobahn: "Вспомогательный автобан"
 GER_auxiliary_autobahn_desc: "Теперь, когда мы сформировали централизованное кольцо инфраструктуры между нашими крупными городами, нам необходимо протянуть руку и соединить второстепенные города и наши новые территории и включить их в состав нашего промышленного комплекса."
  
 GER_invest_in_our_universities: "Инвестиции в наши университеты"
 GER_invest_in_our_universities_desc: "Ограничения индивидуальных свобод со стороны нацистской партии сделали Германию страной, недружественной по отношению к интеллектуалам. Инвестирование в наши университеты исправит ошибки предыдущего режима."
  
 GER_economic_reorganization: "Реорганизация экономики"
 GER_economic_reorganization_desc: "Поскольку Шахт является руководителем экономического департамента и теперь нет никаких препятствий, реорганизация нашего экономического департамента необходима и полезна для повышения эффективности министерства и интеграции с внеправительственными организациями, связанными с Ялмаром."
  
 GER_addressing_our_debt: "Решение проблемы долга"
 GER_addressing_our_debt_desc: "Мы не можем продолжать скрывать огромные долги немецкой нации в результате нашего перевооружения, возрождения и этого проклятого Версальского договора, мы должны работать над решением этого долга таким образом, чтобы уменьшить его и при этом позволить нам увеличить его. наш промышленный потенциал таким же образом, как и во время нашего «экономического чуда»."
  
 GER_anti_inflation_procedures: "Антиинфляционные процедуры"
 GER_anti_inflation_procedures_desc: "Правительство Веймара, находясь у власти, чрезмерно раздуло рейхсмарку и сделало ее бесполезной, способствуя усилению воздействия Депрессии на Германию. Рост, который мы имеем такими темпами, очень полезен для страны, но необходимо разработать процедуры, чтобы предотвратить катастрофу, которой является инфляция."
 
 GER_endorse_the_Reichsbank: "Одобрить Рейхсбанк"
 GER_endorse_the_Reichsbank_desc: "Теперь, когда президент Рейхсбанка прочно вошел в наше правительство, мы можем использовать его положение, чтобы вернуть доверие к банкам, что приведет к возвращению вложений простых людей и ускорит наше экономическое восстановление."
 GER_endorse_the_Reichsbank_tt: "Выплачено половина долга"
  
 GER_abandon_autarky: "Отказаться от автаркии"
 GER_abandon_autarky_desc: "Автаркия оказалась провальной. Поскольку наша экономика испытывает недостаток импорта, наши люди страдают, и мы никогда не сможем по-настоящему подготовиться к любым сложным ситуациям, в которых окажемся. Пришло время открыть ворота."
  
 GER_aubenwirtschafft: "Внешняя торговля"
 GER_aubenwirtschafft_desc: "Aussenwirtschaft, «Внешняя торговля», — это открытие нашей экономики для интеграции с экономиками мира для взаимной выгоды и увеличения денежного потока, поступающего в Германию в результате экспорта из нашего индустриального общества."
  
 GER_stimulate_privatization: "Стимулировать приватизацию"
 GER_stimulate_privatization_desc: "Промышленность работает лучше всего под контролем частного бизнеса: это не только сократит государственные расходы, но и подстегнет конкуренцию в создании новых изобретений."
  
 GER_totale_offenheit: "Полная открытость"
 GER_totale_offenheit_desc: "Полная открытость для иностранных рынков приведет нас к новым высотам за счет устранения ограничений в торговле, таких как тарифы и протекционизм, что позволит нам действовать как европейская сверхдержава в торговле и экономике."
  
 GER_govern_military_spending: "Регулирование военных расходов"
 GER_govern_military_spending_desc: "Военные расходы являются эффективным способом продолжать оставаться на волне бурно развивающейся экономики и необходимы в наше время и во внешней политике. Мы определим военные расходы и продолжим готовиться к этому веку."
  
 GER_intermix_military_and_civilian_industries: "Смешение военной и гражданской промышленности"
 GER_intermix_military_and_civilian_industries_desc: "Гражданская и военная промышленность не могут рассматриваться как отдельные организации нашей экономики, если мы хотим дальнейшего обращения денег и продолжения темпов роста. Интеграция поможет улучшить обе отрасли."
  
 GER_education_innovations: "Инновации в образовании"
 GER_education_innovations_desc: "Образование немецкого народа — это расходы, которые принесут долгосрочные дивиденды благодаря полезности образованного населения. Открытие крупных университетов и школ поможет развитию нашей страны."
  
 GER_investments_in_the_rhine: "Инвестиции в Рейн"
 GER_investments_in_the_rhine_desc: "Рейн издавна был экономическим сердцем Германии. Таким образом, это наиболее логичная область для инвестиций, особенно в нашу развивающуюся сталелитейную промышленность."
  
 GER_kdf_wagen_scheme_civ: "Сделка KdF-Wagen"
 GER_kdf_wagen_scheme_civ_desc: "Мы разработали Соглашение, чтобы Развить нашу гражданскую промышленность, создав систему, в которой немцы могут покупать наш Volkswagen или Народный автомобиль на будущее и использовать свои деньги для обеспечения необходимых заводов."
  
 GER_invest_in_ig_farben_schact: "Инвестировать в I.G. Farben"
 GER_invest_in_ig_farben_schact_desc: "Компания I.G. Farben была нашим основным производителем синтетической продукции и разработала эффективные методы ее производства. Мы направим финансирование в виде контрактов в I.G. Farben, чтобы позволить им расширять свою промышленность и поставлять нам больше ресурсов, которые они могут производить."
  
 GER_coal_liquidization_schact: "Сжижение угля"
 GER_coal_liquidization_schact_desc: "В Германии не хватает нефти, и поэтому мы должны удвоить наши усилия в области синтетической нефти."
  
 GER_monowitz_buna_werke: "Buna-Werke Schkopau"
 GER_monowitz_buna_werke_desc: "Для создания прорыва в технологии синтетического каучука необходим крупный комплекс."
  
 GER_synthetic_breakthroughs: "Синтетический прорыв"
 GER_synthetic_breakthroughs_desc: "Наши ученые процветали под одной крышей, и были сделаны прорывы в области синтетических технологий."
  
 GER_trade_deal_with_sweden_desc: "Благодаря своей непосредственной близости Швеция всегда была плодотворной торговой стороной для Германии. Эти отношения необходимо Развить и защищать."
  
 GER_buisness_friendly_policies: "Политика, благоприятная для бизнеса"
 GER_buisness_friendly_policies_desc: "Все эти трудовые реформы сделали немецкий народ ленивым. Наша экономика зависит от крупного бизнеса, поэтому нам следует реформировать наше законодательство в пользу корпораций."
  
 GER_nazi_economics: "Нацистская экономика"
 GER_nazi_economics_desc: "Министерство экономики может действовать только как инструмент продвижения идеалов партии, а не быть препятствием для сопротивления воле фюрера. Заполнение этих экономических позиций людьми в партии поможет смазать механизмы перевооружения."
  
 GER_deutsche_arbeits_front: "Немецкий трудовой фронт"
 GER_deutsche_arbeits_front_desc: "Организация представительства рабочего в рамках единой организации может обеспечить простоту политической организации и легкость влияния, чтобы обеспечить контроль над рабочей политикой рабочего, чтобы предотвратить забастовки и повысить производительность, а также помочь получить больше материалов."
 GER_deutsche_arbeits_front_dd_flag: "Фокус §YНемецкий трудовой фронт§! выполнен"
 GER_deutsche_arbeits_front_dd_tt: "В настоящее время: [?GER_deutsche_arbeits_front_dd_flag:days|Y0]"
  
  
 GER_strength_through_joy: "Расширение организации KdF"
 GER_strength_through_joy_desc: "Kraft durch Freude, «Сила через радость», станет нашим инструментом для ознакомления немецкого народа с преимуществами национал-социализма. Посредством организованных мероприятий и пропаганды оно также может предотвратить диссидентское и антигосударственное поведение."
  
 GER_reichsarbeitsdienst: "Трудовая служба рейха"
 GER_reichsarbeitsdienst_desc: "Трудовая служба рейха (Reichsarbeitsdienst/RAD) — крупная организация, созданная с целью помочь смягчить последствия безработицы для немецкой экономики, милитаризировать рабочую силу и внушить ей нацистскую идеологию. Во время войны RAD будет заниматься снабжением передовых войск продовольствием и боеприпасами, ремонтом поврежденных дорог, а также строительством и ремонтом взлетно-посадочных полос."
  
 GER_expand_domestic_mining: "Расширить внутреннюю добычу полезных ископаемых"
 GER_expand_domestic_mining_desc: "Нынешние горнодобывающие операции в наших регионах должны компенсировать утраченную территорию и соответствовать требованиям автаркии. Для этого мы будем использовать DAF и нашу новую инфраструктуру."
  
 GER_exploitation_of_acquired_resources: "Эксплуатация приобретенных ресурсов"
 GER_exploitation_of_acquired_resources_desc: "Теперь, когда мы завоевали новые территории, нам следует интегрировать горнодобывающие предприятия в нашу инфраструктурную систему и направить нашу рабочую силу, чтобы обеспечить производительность и эксплуатировать приобретенные ресурсы."
 GER_exploitation_of_acquired_resources_tt: "Разблокирует решения об использовании экономики других стран для §Gуменьшения§! §YЭкономической усталости§!"
  
 GER_continue_autarky: "Продолжить автаркию"
 GER_continue_autarky_desc: "Автаркия – единственный способ гарантировать, что мы не будем менять наши промышленные возможности на сельскохозяйственные угодья востока. Мы должны проглотить эту горькую пилюлю, даже если это болезненно, чтобы Германия могла оставаться самодостаточной."
  
 GER_nationalize_synthetic_industries: "Национализация синтетической промышленности"
 GER_nationalize_synthetic_industries_desc: "Хотя компании преуспели в обеспечении производства синтетических ресурсов, нам нужен прямой доступ, чтобы получить все ресурсы, необходимые для нашей военной машины. Хотя они и будут в ярости, нам необходимо национализировать их предприятия."
  
 GER_invest_in_ig_farben: "Инвестировать в I.G. Farben"
 GER_invest_in_ig_farben_desc: "Компания I.G. Farben была нашим основным производителем синтетической продукции и разработала эффективные методы ее производства. Мы направим финансирование в виде контрактов в I.G. Farben, чтобы позволить им расширять свою промышленность и поставлять нам больше ресурсов, которые они производят."
  
 GER_issue_more_oil_contracts: "Выдача новых нефтяных контрактов"
 GER_issue_more_oil_contracts_desc: "Наша контрактная система корректно работает с I.G. Farben, чтобы получить много синтетических ресурсов, теперь нам нужно расширить их за счет более крупных контрактов и дать им вертикальную интеграцию ресурсов."
  
 GER_fund_the_berlin_nuclear_group: "Финансирование Берлинской ядерной группы"
 GER_fund_the_berlin_nuclear_group_desc: "Ядерная группа Общества императора Вильгельма по продвижению науки, известная в научных кругах как Берлинская группа, проводит эксперименты по расщеплению атома и находится на переднем крае международной ядерной физики. Если ядерное деление удастся надежно реализовать, его потенциал для гражданского и военного использования будет огромным."
  
 GER_kdf_wagen_scheme_mil: "Программа «Фольксваген»"
 GER_kdf_wagen_scheme_mil_desc: "Чтобы финансировать нашу растущую армию, мы разработали схему, согласно которой немецкие граждане могут еженедельно откладывать деньги на «обещание» купить «Фольксваген», народный автомобиль, в какой-то момент в будущем. Естественно, эти деньги наверняка будут использованы с пользой на благо Рейха."
 GER_merge_the_steel_industries_tt: "§YKrupp§!:\nУвеличить размер на §G+1§! и получить черту §YПромышленный конгломерат§! (§G+20.00% Объем заводского производства§!)"
  
 GER_merge_the_steel_industries: "Объединить сталелитейную промышленность"
 GER_merge_the_steel_industries_desc: "Конгломерат Рейхсверке приобретет и национализирует обанкротившиеся частные сталелитейные предприятия и другие заводы и превратит их в средство перевооружения Германии для достижения целей четырехлетнего плана."
  
 GER_nationalize_german_arms_industries: "Национализация германской оружейной промышленности"
 GER_nationalize_german_arms_industries_desc: "Компании, отвечающие за закупки оружия, некомпетентны и замедляют экономику Германии, мы должны принять меры, чтобы захватить их заводы и производить более высокими темпами, чем когда-либо! Хоть нам и придется разбить несколько яиц, это нам очень поможет."
  
 GER_issue_weapon_contracts: "Заключение контрактов на поставку вооружения"
 GER_issue_weapon_contracts_desc: "Развитие нашей военной промышленности – это необходимая задача, требующая организации. Ответственные компании эффективны, но необходимо создать стимулы для достижения производственных целей, которые заставят их нагружать свои компании до предела и даже выше, чтобы производить продукцию для рейха. Выплаты будут организованы, и оружие потечет."
  
 GER_a_continental_army: "Континентальная армия"
 GER_a_continental_army_desc: "Теперь, когда мы приобрели компании, нам необходимо интегрировать их в нашу инфраструктурную сеть, расширить их мощности и обеспечить легкий доступ ко всем необходимым ресурсам для ускорения производства."
  
 GER_Peenemunde_Army_Research_Centre: "Армейский исследовательский центр в Пеенемюнде"
 GER_Peenemunde_Army_Research_Centre_desc: "Мы должны основать центр чисто военных исследований, чтобы быть на шаг впереди наших врагов."
  
 GER_vertical_industrial_arms_integration: "Вертикальная интеграция оружейной промышленности"
 GER_vertical_industrial_arms_integration_desc: "Оружейная промышленность выполняет огромную работу такими возросшими темпами, но узкие места возникают на этапах перехода от шахты к заводу, к поезду, к фабрике и к складу. Разрешение этим компаниям контролировать эти аспекты отрасли уменьшит узкие места и повысит нашу немецкую эффективность."
  
 GER_appoint_fritz_todt: "Назначить Фрица Тодта"
 GER_appoint_fritz_todt_desc: "Фриц Тодт будет назначен министром вооружений и боеприпасов, чтобы он мог управлять всей военной экономикой. Его исключительная работа во главе Организации Тодта доказывает, что он более чем способен управлять военным производством Рейха."
  
 GER_organization_todt_desc: "Основание Организации Тодта объединяет частные компании и государственные фирмы с рабочей силой, предоставленной Трудовой службой рейха. Это поможет рационализировать крупные строительные проекты Рейха."
 GER_organization_todt_tt: "§RОтключит§! закон о призыве §YТолько добровольцы§!\n"
  
 GER_mobilize_the_workforce: "Мобилизация рабочей силы"
 GER_mobilize_the_workforce_desc: "Немецкий народ, должно быть, уже привык к праздности мирной жизни. Рейх больше не может позволить своим гражданам быть ленивыми и слабыми. Каждый гражданин должен стать частью военных усилий."
  
 GER_wehrmachtshelferinnen: "Помощницы вермахта"
 GER_wehrmachtshelferinnen_desc: "Хотя мы никак не сможем убедить фюрера разрешить женщинам служить непосредственно в армии, мы сможем решить некоторые наши кадровые проблемы, разрешив им служить «помощницами вермахта» на вспомогательных должностях."
  
 GER_appoint_albert_speer: "Назначить Альберта Шпеера"
 GER_appoint_albert_speer_desc: "Альберт Шпеер займет пост министра экономики и будет «использовать» завоеванных нами людей для дополнения и мобилизации нашей военной промышленности на полную мощность. Работа 24/7, 365 дней в году."
 GER_appoint_albert_speer_dd_flag: "Фокус §Y$GER_appoint_albert_speer$§! выполнен"
 GER_appoint_albert_speer_dd_tt: "В настоящее время: [?GER_appoint_albert_speer_dd_flag:days|Y0]"
  
 GER_general_inspector: "Генеральный инспектор Panzertruppen"
 GER_general_inspector_desc: "Растущие требования войны требуют создания этой новой должности, которая будет отвечать за надзор за разработкой и закупками танков."
 GER_general_inspector_tt: "Все §Yразработчики танков§! снизят стоимость производства всей бронетехники на §G-5.00%§!"
  
 GER_panzerprogramm: "Panzerprogramm"
 GER_panzerprogramm_desc: "Наша армия должна быть усилена техникой любой ценой, даже если это будет мешать другим родам войск!"
 GER_panzerprogramm_tt: "Все §Yразработчики танков§! снизят стоимость производства всей бронетехники еще на §G-10.00%§! и увеличат стоимость производства авиации на §R+15.00%§!."
  
 GER_fighter_staff_committee: "Jägerstab Committee"
 GER_fighter_staff_committee_desc: "В ответ на возросшие усилия противника в воздушной войне мы должны реорганизовать нашу авиационную промышленность в рамках единого комитета, чтобы обеспечить нашу окончательную победу."
 GER_fighter_staff_committee_tt: "Все §Yразработчики авиации§! снизят стоимость производства всей авиации на §G-5.00%§!"
  
 GER_jagernotprogram: "Jägernotprogramm"
 GER_jagernotprogram_desc: "Мы должны не жалеть средств на расширение Люфтваффе, чтобы оно могло защитить небо Рейха!"
 GER_jagernotprogram_tt: "Все §Yразработчики авиации§! снизят стоимость производства всей авиации еще на §G-10.00%§! и увеличат стоимость производства танков на §R+15.00%§!."
  
 GER_nero_decree: "Приказ о выжженной земле"
 GER_nero_decree_desc: "«Все, что невозможно захватить, должно быть уничтожено!» Даже если мы будем вынуждены отступить, мы не оставим после себя ничего, что могло бы быть использовано врагом."
 GER_nero_decree_tt: "§YВоенно-морские базы§! будут заминированы для §Yавтоматического§! подрыва в случае вторжения в прибрежный регион."
  
 GER_armament_staff_committee: "Штабной комитет по вооружению"
 GER_armament_staff_committee_desc: "Успех предыдущих производственных программ должен быть применен и в других отраслях оружейной промышленности. Организация военных отраслей под единым началом обеспечит это."
  
 GER_reich_plenipotentiary_for_total_war: "Полномочный представитель Рейха по тотальной войне"
 GER_reich_plenipotentiary_for_total_war_dd_flag: "Взято решение §Y$GER_total_war_speech$§!"
 GER_reich_plenipotentiary_for_total_war_dd_tt: "В настоящее время: [?GER_reich_plenipotentiary_for_total_war_dd_flag:days|Y0]"
  
 GER_expand_kummersdorf_research_centre: "Расширение исследовательского центра Куммерсдорф"
 GER_expand_kummersdorf_research_centre_desc: "Куммерсдорф всегда был центром разработок оружия. Инвестируя больше в его оборудование и обучение персонала, мы можем значительно увеличить скорость разработки наших новейших проектов."
  
  
 GER_work_with_german_industry: "Работа с германской промышленностью"
 GER_work_with_german_industry_desc: "Чтобы все шло гладко, мы должны охватить все основные отрасли промышленности Германии. Обеспечивая справедливые, конкурентоспособные и заманчивые контракты и обещания. Позже мы сможем подойти к ним индивидуально и предложить контракты, а может быть, они придут к нам с предложениями."
 GER_work_with_german_industry_tt: "£faction_ger_industrialists §YПромышленники§! станут §3дружелюбнее§! и §Gвлиятельнее§!\n"
  
  
 GER_recognizing_the_debt: "Признание долга"
 GER_recognizing_the_debt_desc: "После дальнейшего расследования выяснилось, что долговая ситуация оказалась хуже, чем мы думали! Решив проблему долга и внеся коррективы в национальный бюджет, мы сможем избежать катастрофы. Кто знает, что бы произошло, если бы мы продолжили огромные военные расходы."
  
 GER_cut_public_expenditure: "Сокращение государственных расходов"
 GER_cut_public_expenditure_desc: "Огромные расходы Гитлера на общественные работы и программы только увеличили наши долги. Суровая реальность такова, что нам придется сократить государственные расходы, чтобы справиться с долгами и вернуть нашу экономику в нормальное русло."
  
  
 GER_reprint_the_rentenmark: "Перепечатка Rentenmark"
  
 GER_take_advantage_of_the_global_market: "Использовать преимущества мирового рынка"
  
 GER_secure_trade_deals_with_sweden: "Заключение торговых соглашений со Швецией"
 GER_secure_trade_deals_with_sweden_desc: "Германия и Швеция были очень близкими торговыми партнерами со времен Первой мировой войны. С новой администрацией мы сможем еще больше укрепить нашу торговлю и вытеснить всех остальных конкурентов на шведском рынке."
  
 GER_secure_trade_deals_with_portugal: "Заключение торговых соглашений с Португалией"
 GER_secure_trade_deals_with_portugal_desc: "В Португалии есть большая часть необходимого нам сырья. Направив наших дипломатов для дальнейшего развития отношений и заключив с ними сделку, мы сможем получить это сырье, одновременно предложив португальцам заманчивую сделку."
  
 GER_prosperity_through_trade: "Процветание через торговлю"
 GER_prosperity_through_trade_desc: "Пришло время открыть порты для всех и показать миру величие немецкой продукции! Мы должны расширить нашу торговлю для всех, чтобы оздоровить немецкую экономику."
  
  
 GER_redirected_ship_production: "Перенаправленное производство кораблей"

 GER_atlantik_wall: "Центры снабжения Атлантического вала"
 GER_atlantik_wall_desc: "Атлантический вал — это масштабное фортификационное сооружение, простирающееся по всему атлантическому побережью Германии и ее колоний. Это также требует значительных логистических усилий для обеспечения огромного гарнизона, который должен укомплектовать фортификационные сооружения, особенно те, которые находятся дальше всего от родины."
  
 GER_new_industry_culture: "Новая промышленная культура"
  
 GER_fund_research_centres: "Финансирование исследовательских центров"
  
 GER_modest_rearnament_program: "Скромная программа перевооружения"
 GER_modest_rearnament_program_desc: "После внесения множества корректировок в бюджет у нас есть достаточно средств, чтобы инвестировать и в программу перевооружения. Хотя это и не радикально, это поможет нам в подготовке к любым потенциальным конфликтам, поскольку в Европе нас окружает неопределенность."
  
 GER_new_mauser_contracts: "Новые контракты с Маузером"
 GER_new_mauser_contracts_desc: "Маузер всегда был известен своим качественным оружием и выполнением контрактных требований. Возможно, нам следует рассмотреть возможность инвестирования в них и расширения производства вооружений."
  
 GER_appoint_hans_luther: "Назначить Ганса Лютера"
 GER_appoint_hans_luther_desc: "Поскольку нацисты отстранены от политических и экономических позиций, нам следует как можно скорее постараться привлечь в наш кабинет несколько заслуживающих внимания и опытных людей. Один человек по имени Ганс Лютер идеально подходил бы на должность нашего министра транспорта."
  
 GER_reorganise_the_ministry_of_armaments: "Реорганизовать Министерство вооружений"
 GER_reorganise_the_ministry_of_armaments_tt: "Изменяет §YНемецкую промышленность§! на: §G+10.00% Объема заводского производства§!"
 GER_reorganise_the_ministry_of_armaments_dd_flag: "Фокус §Y$GER_reorganise_the_ministry_of_armaments$§! выполнен"
 GER_reorganise_the_ministry_of_armaments_dd_tt: "В настоящее время: [?GER_reorganise_the_ministry_of_armaments_dd_flag:days|Y0]"
  
 GER_mining_efforts: "Горнодобывающая промышленность"
 GER_mining_efforts_desc: "Военная машина создается не только кровью и потом рабочих, но и шахтеров."
  
 GER_fund_heisenberg: "Финансировать Гейзенберга"
  
 GER_offer_business_tax_breaks: "Предложение налоговых льгот для бизнеса"
 GER_offer_business_tax_breaks_desc: "Введя налоговые льготы, мы должны увидеть рост производительности и инвестиций в экономику! Мы всегда можем вернуться к пересмотру налогов, но сейчас Германии нужна передышка!"
  
  
 GER_krupp_hydroelectrive_initiative: "Инициатива Круппа в области гидроэнергетики"
 GER_krupp_hydroelectrive_initiative_desc: "При всех положительных результатах и инвестициях к нам обратился Крупп и предложил построить несколько гидроэлектростанций. Мы должны воспользоваться этим и еще больше повысить эффективность производства алюминия и стали."
  
 GER_opel_highways: "Автомобильные дороги Опель"
 GER_opel_highways_desc: "После некоторого анализа инфраструктуры страны мы пришли к выводу, что некоторые части Германии со временем потребуют некоторых улучшений. Мы добавим некоторые расходы в бюджет, чтобы со временем улучшить инфраструктуру."
 GER_opel_highways_tt: "Изменяет §YНемецкую промышленность§! на: §G+15.00%§! к скорости строительства §Yинфраструктуры§!"
  
 GER_work_with_steel_barons: "Работа со стальными баронами"
 GER_work_with_steel_barons_desc: "В соответствии с нашей политикой мы должны работать со всеми промышленными центрами, чтобы обеспечить улучшение экономики. Нам нужно будет обратиться к этим стальным магнатам и обеспечить сотрудничество. Если все будет сделано правильно, мы сможем еще больше расширить наше производство стали."
 GER_work_with_steel_barons_tt: "Изменяет §YНемецкую промышленность§! на: §G+15.00%§! к скорости строительства §Yсталелитейных заводов§!"
  
 GER_contract_with_rheinmetal: "Контракт с Рейнметалл"
 GER_contract_with_rheinmetal_desc: "Rheinmetal, как известно, является одной из крупнейших компаний по производству вооружений в Германии, и в наших интересах заключить с ней контракт и даже предложить некоторые субсидии, чтобы позволить им и дальше расширяться."
 GER_contract_with_rheinmetal_tt: "Изменяет §YНемецкую промышленность§! на: §G+10.00%§! к скорости строительства §Yвоенных заводов§!"
  
 GER_profit_for_taxes: "Прибыль для налогов"
 GER_profit_for_taxes_desc: "После многих долгих дней и ночей мы наконец достигли государственно-капиталистической позиции в нашей стране. Мы больше никогда не будем следовать саморазрушительной экономической практике, трижды ура Германии!"
  
 GER_end_the_relaxed_industry: "Покончить с расслабленной индустрией"
 GER_end_the_relaxed_industry_desc: "Мы не можем прожить жизнь, живя легкой жизнью, только благодаря упорному труду, решимости и единству мы как нация будем процветать. Когда экономика нашей страны восстановится и полностью заработает, мы должны обеспечить ее сохранение и избавиться от любых недостатков и некомпетентности!"
  
 GER_invest_into_the_rhine: "Инвестиции в Рейн"
 GER_invest_into_the_rhine_desc: "Рейн — это сердце немецкой промышленности, и мы должны обеспечить вложение в него больше инвестиций, чтобы наша страна была способна удовлетворить любые потребности, которые нам нужны. Будь то вооружение, инфраструктура или стратегическое строительство. Нашей индустриальной мощью будут восхищаться все!"
  
 GER_city_festungs: "Города-крепости"
 GER_city_festungs_desc: "Западный вал необходимо улучшить, чтобы он мог отражать любые атаки из зоны Бенилюкса, а также укрепить линию на французской границе."
 GER_city_festungs_tt: "§OРазблокирует решения по созданию отчаянной обороны и укреплению регионов§!"
  
 GER_flak_towers: "Зенитные башни"
 GER_flak_towers_desc: "Наша Родина уязвима для крупномасштабных бомбардировок. Инвестируя в крупномасштабные программы по строительству зенитных башен, мы сможем истреблять вражеские соединения, защищая наши промышленные центры."
  
 GER_realization_of_the_wehrmacht: "Реализация Вермахта"
 GER_realization_of_the_wehrmacht_desc: "Сильная Германия требует, чтобы Вермахт был мощной наступательной силой. Для достижения этой цели программы обучения и набора персонала должны ускориться и расшириться, если мы хотим быть готовыми к предстоящей войне."
  
 GER_oberkommando_des_heeres: "Верховное командование сухопутных войск"
 GER_oberkommando_des_heeres_desc: "Наша армия оказалась в новой эпохе технологий и тактики. Мы должны решить, по какому пути идти."
  
 GER_blomberg_fritsch_affair: "Дело Бломберга-Фрича"
 GER_blomberg_fritsch_affair_desc: "Пока идет подготовка к войне, армию необходимо подчинить. СС наконец собрало информацию о скандале с браком военного министра фон Бломберга и о предполагаемой гомосексуальности командующего армией фон Фрича, достаточную, чтобы свергнуть их обоих и гарантировать, что вермахтом будут руководить только люди, лояльные фюреру."
  
 GER_formation_of_the_okw: "Формирование ОКВ"
 GER_formation_of_the_okw_desc: "Верховное командование Вермахта объединяет наши подразделения управления армией, флотом и военно-воздушными силами. Для успеха этого высшего командования необходимо выбрать новых офицеров."
 GER_create_general_alfred_jodl_tt: "\nПоявится §YАльфред Йодль§! в званиие §YГенерала с 3 очками навыков§!."
  
 GER_fallschirmjager: "Парашютно-десантная дивизия"
 GER_fallschirmjager_desc: "Создание элитного подразделения, способного совершать крупномасштабные воздушно-десантные операции и атаковать противника с непоколебимой лояльностью и высокой степенью мастерства, необходимо для общевойсковой доктрины, которую мы разработали для следующей войны."
 GER_create_unit_fallschirmjager_tt: "Будет получен §YШаблон десантной дивизии.§!\n"
  
 GER_marinestobtruppabteilung: "Подразделение ударных сил ВМФ"
 GER_marinestobtruppabteilung_desc: "Создание элитного батальона, способного проводить небольшие морские операции с высокой степенью квалификации, необходимой для войн, которые нам предстоят."
 GER_create_unit_marinestobtruppabteilung_tt: "Будет получен §YШаблон батальона морской пехоты.§!\n"
  
 GER_the_heers_new_era: "Новая эра Heers"
 GER_the_heers_new_era_desc: "Наша армия оказалась в новой эпохе технологий и тактики. Мы должны решить, по какому пути идти."
  
 GER_war_of_movement: "Война движения"
 GER_war_of_movement_desc: "Наш опыт Великой войны показал нам, что наступление, которое останавливается, — это наступление, которое терпит неудачу. Бронированные машины станут ответом на достижение Bewegungskrieg."
  
 GER_revive_our_great_war_tactics: "Возродить тактику Великой войны"
 GER_revive_our_great_war_tactics_desc: "Такая ставка на концепцию танка рискованна и дорогостояща. Великая война доказала, что хорошая оборонительная позиция является ключом к истощению наших противников и выходу победителем."
  
 GER_achtung_panzer: "Achtung Panzer!"
 GER_achtung_panzer_desc: "Генерал Хайнц Гудериан продемонстрировал нам жизнеспособность концепции танков во время наших многочисленных военных учений. Использование им макетов деревянных танков пробудило у многих интерес к этому новому стилю боя, и теперь он обобщил свои знания в книге по применению моторизованной войны."
  
 GER_observations_from_spain: "Наблюдения из Испании"
 GER_observations_from_spain_desc: "Наш опыт победы в Испании стал хорошим источником знаний для наших теоретиков бронетехники."
  
 GER_plan_the_first_generation: "Планирование первого поколения танков"
 GER_plan_the_first_generation_desc: "Хотя это и не идеально, легкие дешевые танки необходимы, если мы хотим наращивать наши танковые силы."
  
 GER_order_the_sonderkraftfahrzeug: "Заказ специального автотранспорта"
 GER_order_the_sonderkraftfahrzeug_desc: "Маневренная война – ключ к успеху. Вместо того, чтобы ограничивать наши танки скоростью пехоты, мы должны увеличить скорость пехоты, чтобы не отставать от танков!"
  
 GER_plan_the_second_generation: "Планирование второго поколения"
 GER_plan_the_second_generation_desc: "Это новое поколение более тяжелых средних танков наконец станет надежной рабочей лошадкой для танковых дивизий."
  
 GER_durchbruchwagen: "Durchbruchswagen"
 GER_durchbruchwagen_desc: "Концепция тяжелого танка прорыва зародилась в 1930-х годах с Durchbruchswagen. Теперь, когда у нас достаточно опыта, мы можем, наконец, воплотить эту концепцию в реальность."
 GER_durchbruchwagen_tt: "«§YHenschel§!» (£funds_texticon  Прирост финансов: §G+50%§!) в течение §Y365 дней§!\n"
  
 GER_plan_the_third_generation: "Планирование третьего поколения"
 GER_plan_the_third_generation_desc: "Учитывая сообщения о том, что другие страны используют тяжелобронированные танки, мы должны сделать то же самое, но иметь соответствующее вооружение."
  
 GER_formation_of_the_panzerwaffe: "Формирование Панцерваффе"
 GER_formation_of_the_panzerwaffe_desc: "Одних наших танковых дивизий недостаточно, чтобы сломить врага и обеспечить успех, нам потребуются мобильные дивизии бронепехоты, которые обеспечат поддержку нашим танкам, когда они совершат прорыв."
  
 GER_refinement_of_bewegungskrieg: "Совершенствование маневренной войны"
 GER_refinement_of_bewegungskrieg_desc: "Хотя мы и добились успеха с нашими танками, мы не достигли совершенства. Bewegungskrieg следует постоянно изучать и совершенствовать."
  
 GER_creation_of_the_panzertruppe: "Создание танковых войск"
 GER_creation_of_the_panzertruppe_desc: "С вводом в состав Вермахта большего количества и разнообразия бронетехники стало очевидно, что необходимо создать новое специальное командование для наших бронетанковых войск."
 GER_creation_of_the_panzertruppe_tt: "Открывает шаблон §YМеханизированной танково-гренадерской дивизии§!."
  
 GER_integration_of_enigma: "Интеграция Энигмы"
 GER_integration_of_enigma_desc: "Энигма — одна из величайших технологий шифрования, которые у нас есть. Путем дальнейшей интеграции ее в нашу армию мы сможем обеспечить более безопасную связь."
 GER_integration_of_enigma_bonus_tt: "Мы получим §G+4 к уровеню криптологии§!"
  
 GER_re_establish_jager_training: "Возобновить подготовку Егерей"
 GER_re_establish_jager_training_desc: "Егеря, или легкая пехота, имеют особую историю в немецкой армии. Их традиции будут продолжены путем создания элитного и специализированного горнострелкового подразделения Gebirgsjägers."
 GER_jager_training_tt: "Горно-стрелковые войска\n§G+10%§! к атаке в лесах и горах\n§G+25%§! к защите в лесах и горах\n"
  
 GER_nebeltruppen: "Nebeltruppen"
 GER_nebeltruppen_desc: "Новое ракетное оружие может стать тем, что нам нужно для дальнейшего усиления нашей доктрины блицкрига, обеспечивающего быстрое опустошение."
  
 GER_luftverteidigung: "ПВО"
 GER_luftverteidigung_desc: "Наше небо затемнено вражескими бомбардировщиками, а наши военно-воздушные силы истощены, и чтобы компенсировать это, необходимы более крупные наземные средства ПВО, и следует перенаправить ресурсы, чтобы сделать их более эффективными."
 
 GER_specialized_equipment: "Специальное оборудование"
 GER_specialized_equipment_desc: "Наше небо омрачено вражескими бомбардировщиками, а наши воздушные силы перегружены, поэтому для компенсации необходимы более мощные наземные средства ПВО. Новые ракетные вооружения также могут быть тем, что нам нужно для дальнейшего усовершенствования нашей доктрины блицкрига, обеспечивая быстрое уничтожение. Ресурсы должны быть задействованы немедленно."

 GER_lessons_from_war: "Уроки войны"
 GER_lessons_from_war_desc: "Наша борьба на обширном Востоке против большевистской угрозы преподала нам важные уроки, которые мы должны принять во внимание. Одной скорости уже недостаточно для победы. Нам нужна столь же мощная сила; более толстая броня и более крупные орудия приведут нас к окончательной победе."
 
 GER_establish_combined_arms: "Создание общевойсковых соединений"
 GER_establish_combined_arms_desc: "Хотя танки кажутся центром поля боя, они уязвимы и слабы, если их использовать в одиночку. Их слабости должны быть дополнены эффективной пехотой."
  
 GER_evolution_of_the_aufklarungs_battalions: "Эволюция разведывательного батальона"
 GER_evolution_of_the_aufklarungs_battalions_desc: "Тяжелый бронеавтомобиль станет экономичной и универсальной заменой легких танков в наших разведывательных войсках."
  
 GER_german_fusiliers: "Немецкие стрелки"
 GER_german_fusiliers_desc: "Наша легкая пехота должна быть реорганизована в боевые батальоны вместо того, чтобы удерживать традиционные линии фронта. Это больше сыграет на их сильные стороны, а не накажет их за отсутствие тяжелого вооружения."
  
 GER_establish_the_skijager_tt: "Будет получен шаблон и дивизия §Yэлитных зимних альпинистов§!"
  
 GER_sturmgeschutz: "Sturmgeschütz"
 GER_sturmgeschutz_desc: "StuG смогут обеспечить более мобильную и прямую огневую поддержку, чем традиционная артиллерия."
  
 GER_jagdpanzer: "Jagdpanzer"
 GER_jagdpanzer_desc: "Установка мощных орудий в надстройках казематного типа обеспечит нашим войскам экономически выгодную ПТ-САУ."
  
 GER_frontline_artillery: "Передовая артиллерия"
 GER_frontline_artillery_desc: "Артиллерия может использоваться нетрадиционными способами на передовой, обеспечивая более прямую поддержку."
 GER_frontline_artillery_tt: "£tech_mod  Открывает §HПередовую артиллерию§!\n§YПВО§!:\n   Противотанковая атака: §G+100%§!\n   Противопехотная атака: §G+100%§!\n   Защита: §R-20%§!\n   Воздушная атака: §R-35%§!\n§YТяжелое ПВО§!:\n   Ширина фронта: §G-1§!\n\n"
  
 GER_aggressive_artillery: "Агрессивная артиллерия"
 GER_aggressive_artillery_desc: "Мобильные артиллерийские силы должны быть в состоянии не отставать и постоянно поддерживать наши танковые колонны."
  
 GER_ussr_tractor_experiments: "Эксперименты СССР \"Трактор\""
 GER_ussr_tractor_experiments_desc: "Хоть они и наши враги, но они одиноки, как и мы. Обмениваясь нашими технологиями бронетехники, мы можем избавиться от зависимости от Запада."
  
 GER_land_wunderwaffe: "Наземное чудо-оружие"
 GER_land_wunderwaffe_desc: "Орды большевиков и капиталистические машины сокрушат нас, если мы не сможем положить конец этой войне. Если нам удастся разработать и произвести эти Вундерваффе, мы сможем переломить ситуацию и достичь Эндзига."
  
 GER_Entwicklung_tanks: "Entwicklungs Panzer"
 GER_Entwicklung_tanks_desc: "Танки следующего поколения должны быть более смертоносными, чем предыдущее, но мы должны предпринять усилия по ограничению стоимости этих новых танков. В этом может сильно помочь общая конструкция с взаимозаменяемыми деталями."
  
 GER_cult_of_the_sturmtruppen: "Культ штурмовиков"
 GER_cult_of_the_sturmtruppen_desc: "Штурмгруппы — это пехота, специально обученная штурмовать и захватывать укрепления противника, не обращая внимания на собственные потери. Они станут краеугольным камнем наших наступательных возможностей."
  
 GER_total_sturmtruppen_prominence: "Полная известность штурмовиков"
 GER_total_sturmtruppen_prominence_desc: "Наша зависимость от штурмовиков выдвинула их на передний план нашей наступательной доктрины. Тактика будет улучшена, чтобы использовать их в бою."
  
 GER_maximize_firepower: "Максимизация огневой мощи"
 GER_maximize_firepower_desc: "Артиллерия – король поля боя. Если проблему нельзя решить с помощью чистой огневой мощи, значит, мы не используем достаточно огневой мощи."
  
 GER_solving_the_armour_problem: "Решение проблемы с броней"
 GER_solving_the_armour_problem_desc: "Наши враги вложили значительные ресурсы в бронетанковые подразделения. Мы можем решить эту проблему более дешевыми средствами, такими как башенные противотанковые пушки или истребители танков, стоимость которых составляет лишь часть их танков."
  
 GER_revive_the_freikorp: "Возродить Freikorps"
 GER_revive_the_freikorp_desc: "Freikorps — военизированная организация, состоящая из ветеранов Великой войны. Опыт, который они дают, бесценен для нашей армии."
 GER_revive_the_freikorp_tt: "Получить элитный §YШаблон дивизии Freikorp§!."
  
 GER_call_upon_the_freikorp: "Призвать  Freikorps"
 GER_call_upon_the_freikorp_desc: "Freikorps — это наемники, состоящие из ветеранов вооруженных сил. Большинство членов Freikorps были либо подвергнуты чистке, либо интегрированы в СС. Многие из них стали настороженно относиться к нынешнему правительству и его игнорированию правильных прусских традиций."
 GER_calling_upon_the_freikorp_tt: "Юудет создано §Y24 элитных пехотных дивизии Freikorp§! во Франкфурте."
  
 GER_organization_of_the_new_troops: "Организация новых войск"
 GER_organization_of_the_new_troops_desc: "Дополнительные роты поддержки были обучены и распределены по нашим передовым подразделениям. Их необходимо улучшать, если мы хотим, чтобы они оставались актуальными."
  
 GER_experimentations_with_armor: "Эксперименты с броней"
 GER_experimentations_with_armor_desc: "Несмотря на свою дороговизну, эти бронированные звери, похоже, могут принести какую-то пользу. Мы вложим некоторые ресурсы в развитие собственного бронетанкового корпуса."
  
 GER_rebuild_our_officer_corp: "Восстановление офицерского корпуса"
 GER_rebuild_our_officer_corp_desc: "Наши офицеры опытны, но они стары и им не хватает стремления к инновациям. Привлечение новых офицеров откроет нам глаза на новую тактику для нашей пехоты."
  
 GER_the_luftwaffe: "Люфтваффе"
 GER_the_luftwaffe_desc: "Из-за ограничений Версаля мы были вынуждены тайно готовить наши военно-воздушные силы. Теперь, когда мы действуем более открыто, мы можем инвестировать значительные ресурсы в исследования и разработку новых самолетов и тактик."
  
 GER_the_great_sky_war: "Великая война в небе"
 GER_the_great_sky_war_desc: "Небо Великой Войны было источником богатого опыта в области сильных и слабых сторон самолетов. Использование этих знаний очень поможет в подготовке Люфтваффе."
  
 GER_invest_in_GEMA: "Инвестировать в GEMA"
 GER_invest_in_GEMA_desc: "Общество по электроакустической и механической аппаратуре"
  
 GER_bases_on_two_fronts: "Базы на двух фронтах"
 GER_bases_on_two_fronts_desc: "Германия окружена врагами со всех сторон. Точно так же, как наша армия должна сражаться на два фронта, наши военно-воздушные силы должны иметь возможности для их поддержки."
  
 GER_aeronautic_funding: "Финансирование авиации"
 GER_aeronautic_funding_desc: "На наращивание наших военно-воздушных сил нельзя жалеть никаких средств. Необходимо выделить больше средств, чтобы мы могли разместить большее количество самолетов."
  
 GER_passenger_planes: "\"Passenger\" Самолеты"
 GER_passenger_planes_desc: "Тайно закупая дальние бомбардировщики и патрульные самолеты в качестве «пассажирских» самолетов, мы смогли получить бесценные знания об их конструкции."
  
 GER_sturzbomber_programm: "Программа «Sturzbomber»"
 GER_sturzbomber_programm_desc: "Для проведения бомбометания с пикирования требуются значительные навыки и подготовка, но при этом обеспечивается почти ювелирная точность. Наши пикирующие бомбардировщики станут залогом поддержки нашей армии в решающих боях."
  
 GER_continue_the_bf: "Продолжить Bf 109"
 GER_continue_the_bf_desc: "Мессершмитт Bf 109 оказался нашим лучшим истребителем завоевания превосходства в воздухе. Ему нет равных в небе, и его следует продолжать совершенствовать и строить."
  
 GER_prioritize_the_fw: "Приоритет Fw 190"
 GER_prioritize_the_fw_desc: "Focke-Wulf 190 менее эффективен в качестве истребителя завоевания превосходства в воздухе, но может также служить в качестве самолета поддержки. Гибкость этой многоцелевой машины предполагает, что нам следует отдать ей приоритет перед Bf 109."
  
 GER_bomber_evolution: "Эволюция бомбардировщика"
 GER_bomber_evolution_desc: "Тактические бомбардировщики предлагают лучший пакет с точки зрения стратегического поражения и наземной поддержки. Хейнкель пообещал новый бомбардировщик, который обеспечит хорошую защиту и бомбовую нагрузку, что увеличит наши воздушные возможности."
 
 GER_new_air_projects: "Новые воздушные проекты"
 GER_new_air_projects_desc: "Враг развивается и постоянно совершенствует свое оборудование, противостоящее нашим устаревшим самолетам. Если мы хотим быть эффективными в этот решающий момент, мы тоже должны совершенствовать наши истребители и средства защиты!"
 GER_new_air_projects_tt: "«§YFocke Wulf§!» (£funds_texticon  Прирост финансов: §G+50%§!) в течение §Y365 дней§!\n"
  
 GER_reform_the_reichsluftfahrtministerium: "Реформировать Министерство авиации"
 GER_reform_the_reichsluftfahrtministerium_desc: "Наше Министерство авиации уже давно дезорганизовано. Чтобы наладить производство самолетов, необходимо провести реструктуризацию и новые назначения."
  
 GER_establish_the_testing_command: "Создать Erprobungskommando"
 GER_establish_the_testing_command_desc: "Отдельное подразделение испытательного командования для тестирования новых самолетов и последующей подготовки новых пилотов позволит нашим ВВС расти и восполнять потери."
  
 GER_ural_bombers: "Уральские бомбардировщики"
 GER_ural_bombers_desc: "Войну на бескрайних просторах восточной степи невозможно выиграть, просто пройдя маршем через всю Азию. Покойный генерал Вефер еще раньше выступал за дальние бомбардировщики, способные наносить удары вглубь России. Инвестируя больше в уже существующий проект «Уральского бомбардировщика», возможно, мы сможем ускорить производство новейших стратегических бомбардировщиков."
  
 GER_horten_project: "Проект «Хортен»"
 GER_horten_project_desc: "Проект Хортен был ответом на призыв Германа Геринга создать конструкции легких бомбардировщиков, способных удовлетворить требованию «3x1000»; а именно перевезти 1000 килограмм бомб на расстояние 1000 километров со скоростью 1000 километров в час!"
  
 GER_schwalbe_project: "Проект «Швальбе»"
 GER_schwalbe_project_desc: "После обширных исследований и финансирования мы очень близки к завершению проекта Швальбе. Мы сможем дать волю нашим превосходным и высокотехнологичным реактивным истребителям, которых мир еще никогда не видел! Рейх будет править небом!"
  
 GER_v_weapons_project: "Проект «V-оружия»"
 GER_v_weapons_project_desc: "Летающие бомбы V способны достигать и уничтожать цели противника без самолета-носителя. Это оружие позволит нам отомстить тем, кто пытается бомбить немецкую землю."
 GER_v_weapons_project_tt: "Ракетные площадки будут развернутых как можно ближе к Нормандии, в зависимости от текущего территориального контроля Оси."
  
 GER_the_kriegsmarine: "Кригсмарине"
 GER_the_kriegsmarine_desc: "Избавившись от Версальского договора, мы теперь можем восстановить Кригсмарине. Крайне важно, чтобы мы поторопились восстановить наш военно-морской флот. И Дениц, и Редер внесли предложения о том, в каком направлении, по их мнению, нам следует двигаться. Однако в конечном итоге выбор стратегической позиции военно-морского флота в предстоящей долгожданной войне остается за фюрером."
  
 GER_wolfpacks: "Волчьи стаи"
  
 GER_undersea_innovations: "Подводные инновации"
 GER_undersea_innovations_desc: "В последнее время мы совершили небольшие прорывы в вооружении и моделях, благодаря чему мы сможем оснастить наши подводные лодки более смертоносным вооружением!"
  
 GER_unrestricted_submarine_warfare: "Неограниченная подводная война"
 GER_unrestricted_submarine_warfare_desc: "Неограниченная война использовалась со времен Великой войны, она доказала свою эффективность раньше и докажет свою эффективность снова! С нашими новыми и улучшенными подводными лодками мы должны вновь ввести и сформулировать новую тактику, чтобы задушить Британскую империю. Ни одну войну невозможно выиграть на пустой желудок."
  
 GER_operation_paukenschlag: "Операция «Паукеншлаг»"
 GER_operation_paukenschlag_desc: "Поскольку Соединенные Штаты вовлечены в войну, Дениц видит в этом прекрасную возможность немедленно нанести удар по американскому побережью. Если все будет сделано правильно, мы сможем еще больше заморить британцев голодом и остановить любые подкрепления или материальные средства, отправляемые союзным войскам в Европе."
  
 GER_bases_in_norway: "Базы в Норвегии"
 GER_bases_in_norway_desc: "Теперь, когда север защищен, у наших подводных лодок и флотов появится безопасный маршрут через Северную Атлантику, а наша торговля со Швецией будет в безопасности. Мы также должны инвестировать в большее количество военно-морских баз для возможных будущих операций, если того пожелает фюрер."
  
 GER_expand_the_naval_dockyards: "Расширение военно-морских верфей"
 GER_expand_the_naval_dockyards_desc: "Фюрер осознавал важность наличия сильного военно-морского флота, и не имеет значения, выберет ли он план Дёница или план Редера. Важно то, что у нас есть строительные возможности для производства самых совершенных кораблей в современном мире или для замены этих кораблей. Необходимо больше верфей, и мы выполним этот заказ, чего бы это ни стоило."
  
 GER_landwasserschleppers: "Landwasserschlepper"
 GER_landwasserschleppers_desc: "Чтобы снизить потери при любых морских вторжениях, необходимо разработать специализированные десантные корабли."
  
 GER_schwimpanzers: "Schwimmpanzer"
 GER_schwimpanzers_desc: "Чтобы помочь нашим танкам лучше действовать в десантных операциях, следует предпринять усилия по оснащению их оборудованием для преодоления глубоких бродов и средствами для плавания, чтобы исключить необходимость захвата портовых объектов перед использованием бронетанковой поддержки."
  
 GER_burn_the_naval_treaty: "Разорвать военно-морской договор"
 GER_burn_the_naval_treaty_desc: "Если мы хотим доказать, что поддерживаем план Редера, нам придется сделать первый важный, но рискованный шаг. Избавившись от обязательств по англо-германскому военно-морскому договору, мы сможем восстановить наш идеальный флот. Англичане будут возмущены этим, но они узнают, что такое истинный гнев."
  
 GER_plan_z_tt: "§YОткрывает решения о закладке кораблей с частичным завершением строительства§!\n"
  
 GER_modern_cruisers: "Современные крейсеры"
  
 GER_plan_z_desc: "Адмирал Редер считает, что британцев лучше всего победить с помощью политики надводных рейдов. Постройка достаточного количества линкоров и авианосцев для достижения этой цели станет масштабной задачей и потребует времени; возможно, слишком много времени... С другой стороны, наш нынешний надводный флот совершенно неадекватен."
  
 GER_naval_cooperation_with_japan: "Военно-морское сотрудничество с Японией"
 GER_naval_cooperation_with_japan_desc: "Несмотря на нашу прошлую историю, фюрер понимает, что Японская империя преследует ту же цель, и что сотрудничество выгодно для обеих наших великих наций. Это позволит нам обратиться за помощью в проектировании подходящих авианосцев для создания нашего флота открытого моря."

 GER_japanese_areal_torpedoes: "Японские авиационные торпеды"
 GER_japanese_areal_torpedoes_desc: "Недавняя боевая оценка выявила недостатки наших отечественных авиационных торпед. Наши японские друзья добились гораздо большего успеха со своими собственными разработками. Обращение к ним за помощью может помочь нам разработать более эффективное решение."
 GER_LT_850_torpedo: "Luft-Torpedo 45cm LT 850"
  
 GER_next_gen_battlecruisers: "Линейные крейсеры следующего поколения"
  
 GER_modern_carriers: "Современные авианосцы"
  
 GER_pressure_spain: "Давление на Испанию"
 GER_pressure_spain_desc: "Теперь, когда все противники сокрушены мощью Германии, наконец пришло время фюреру нанести личный визит самому Франко. Пришло время ему выполнить свою часть сделки и присоединиться к победившей стороне."
  
  
 GER_integrate_spanish_war_economies: "Интегрировать Испанию"
  
 GER_ultimatum_to_portugal: "Ультиматум Португалии"
 GER_ultimatum_to_portugal_desc: "Португалию уже некоторое время оставили в покое, но теперь у нас есть возможность привлечь ее в нашу сферу влияния. Дипломатией или силой — решать им."
  
 GER_strongarm_sweden: "Надавить на Швецию"
 GER_strongarm_sweden_desc: "Швеция жизненно важна не только из-за своих ресурсов, но и из-за своих дорог и железнодорожных сетей, которые стратегически расположены рядом с нашим союзником, Финляндией. Швеция должна предоставить нашим войскам доступ к этой инфраструктуре или понести последствия"
  
 GER_pact_of_steel: "Стальной пакт"
 GER_pact_of_steel_desc: "Наши отношения с Италией в лучшем случае непростые; хотя у нас во многом общая идеология, необходима дальнейшая дипломатия, чтобы прочно вовлечь их в нашу сферу."
  
 GER_the_balkans_trade_treaty: "Балканский торговый договор"
  
 GER_the_march_south: "Марш-бросок на юг"
 GER_the_march_south_desc: "Наша полная поддержка необходима на Южных Балканах, самый быстрый путь - через государства Югославии..."
  
 GER_the_turkish_ultimatum: "Турецкий ультиматум"
 GER_the_turkish_ultimatum_desc: "Турция занимает ключевое географическое положение как мост к нашим североафриканским владениям, ближневосточной нефти и южной части России. Они позиционируют себя как нейтральный игрок, но, возможно, мы сможем на них повлиять."
  
 GER_swiss_franc_agreement: "Соглашение по швейцарскому франку"
 GER_swiss_franc_agreement_desc: "Многие страны, находящиеся за пределами нашей сферы, опасаются использовать нашу валюту для торговли из-за военной ситуации, поэтому мы заключили выгодный торговый договор со Швейцарией, чтобы использовать их валюту для торговли."
 GER_swiss_franc_agreement_tt: "Все территории, окружающие Швейцарию, контролируются нами или нашими союзниками. Виши будет считаться в этом плане союзником."
  
 GER_clodius_agreement: "Соглашение Клодиуса"
 GER_clodius_agreement_desc: "Хромитовая руда необходима для функционирования нашей танковой промышленности. Сделка с Турцией позволит в значительной степени обеспечить поставки этого жизненно важного ресурса."
 GER_clodius_agreement_tt: "§GРазблокирует турецкие фокусы, чтобы они сблизились с «Осью», а также позволит развивать инфраструктуру в регионах, богатых хромом.§!\n§YЧерез год после заключения договора «Соглашение Клодиуса» может быть расширено§!\n§OНеобходимое снаряжение будет отправлено в Турцию, которая перейдет на «Свободную торговлю», и на это можно будет повлиять, если будет захвачена Африка.§!\n"
  
 GER_create_the_air_shield: "Создание воздушного щита"
 GER_create_the_air_shield_desc: "Сплошная стена зенитных установок и зенитных вышек отразит бомбардировщики, нацеленные на наши центральные районы."
  
 GER_form_the_ostlegionen: "Сформировать Остлегионен"
 GER_form_the_ostlegionen_desc: "Многие жители Востока рассматривают нашу войну с Советами как средство достижения свободы, и мы должны использовать их людские ресурсы для пополнения наших собственных сил."
  
 GER_one_battle_one_will_one_destiny: "Одна битва, одна воля, одна судьба!"
 GER_one_battle_one_will_one_destiny_desc: "Война будет выиграна на востоке, от этого зависит наше будущее. Последний великий рывок должен привести к краху советской военной машины!"

 GER_all_forces_at_all_costs: "Все силы, любой ценой!"
  
 GER_celebration_of_the_olympics: "Празднование Олимпиады"
 GER_celebration_of_the_olympics_desc: "Олимпийские игры имели оглушительный успех. Превосходство немецкой расы и нации было выставлено на всеобщее обозрение всему миру."
 olympics_1936: "Олимпийские игры 1936 года состоялись."
 GER_celebration_of_the_olympics_tt: "£faction_ger_public_support §GУлучшает§! §gотношение§! §YОбщественности§!."
  
 GER_ss_high_command: "Верховное командование СС"
 GER_ss_high_command_desc: "Дальнейшее создание СС как собственной армии требует отдельного высшего командования. Их возглавит Гиммлер."
  
 GER_subjugation_of_scandanavia: "Покорение Скандинавии"
 GER_subjugation_of_scandanavia_desc: ""
  
 GER_subjugation_of_iberia: "Покорение Иберии"
 GER_subjugation_of_iberia_desc: ""
  
 GER_subjugation_of_the_balkans: "Покорение Балкан"
 GER_subjugation_of_the_balkans_desc: ""
  
 GER_assume_direct_control: "Принятие прямого управления"
 GER_assume_direct_control_desc: "Терпение фюрера лопнуло: слишком много некомпетентных генералов намеренно вели Германию к разрушению, настало время, чтобы фюрер, который в одиночку завоевал Европу, взял на себя командование. Никакого отступления и никакой капитуляции не будет, Директива Nº 68 восстановит командное превосходство фюрера."
  
 GER_operation_valkyrie: "Операция «Валькирия»"
 GER_operation_valkyrie_desc: "Почему мы боремся за то, что, как мы знаем, неправильно, за все эти ненужные убийства, репрессии и разрушения. Мы должны объединиться и положить конец этому безумию ради наших семей, ради Священной Германии и потому, что это правильно. Пришло время привлечь фюрера и его приспешников к ответственности и начать операцию «Валькирия»."
 GER_operation_valkyrie_tt: "Ведет войну с [ENG.GetFlag] §YСоединенным Королевством§! и §YСоединеное Королевство§! является реальной угрозой\n"Ведет войну с [SOV.GetFlag] §YСоветским Союзом§! и §YСоветский Союз§! является реальной угрозой"
 GER_operation_valkyrie_mission_tt: "§RТребуется значительное количество политической власти§! (МАКСИМАЛЬНЫЕ расходы: §R500§!)"
  
 GER_peace_with_the_allies: "Мир с союзниками"
 GER_peace_with_the_allies_desc: "Фюрер мертв, и нам удалось схватить или устранить всех его прислужников и тех, кто слепо предан их делу. Теперь мы должны заключить мир с союзниками, загладить вину и восстановить то, что мы потеряли."
 hitler_overthrown: "Гитлер был свергнут"
  
 GER_support_for_qingdao: "Поддержка Циндао"
 GER_support_for_qingdao_desc: "Циндао был немецкой позицией в наши имперские времена. Поскольку Китай ведет войну за выживание против Японии, они, возможно, захотят расстаться с ней в обмен на военную помощь."
 GER_support_for_qingdao_event: "§RТребуется, чтобы Китай принял§!\n"
  
 GER_voluneers_in_the_kmt: "Добровольцы в КМТ"
 GER_voluneers_in_the_kmt_desc: "Недавнее сотрудничество с националистами придало правительству больше уверенности в наборе еще одной группы обученных немцами дивизий."
 GER_volunteers_in_kmt: "Создаст §Y5 обученных немцами китайских дивизий§! в Чунцине."
  
 GER_collaborations_with_the_japanese: "Сотрудничество с Японцами"
 GER_collaborations_with_the_japanese_desc: "Хотя Китай на протяжении десятилетий был союзником Германии, было бы наивно думать, что он способен нам чем-то помочь. С другой стороны, японский военно-морской флот достаточно велик, чтобы угрожать западным державам, и может помочь облегчить часть бремени, лежащего на нас."
  
 GER_german_luftwaffe_assistance: "Помощь Люфтваффе Германии"
 GER_german_luftwaffe_assistance_desc: "Японии не хватает промышленности, чтобы поддерживать большое количество самолетов, необходимых для победы в Тихом океане. Мы поможем им заполнить часть этого пробела нашими собственными самолетами."
  
 GER_exploitation_of_annexed_nation_3: "В случае успеха мы получим §Y3%§! к §Gснижению§! §Yэкономической усталости§!\n"
 GER_exploitation_of_annexed_nation_3_axis: "В случае успеха мы получим §Y3%§! к §Gснижению§! §Yэкономической усталости§! для §YГермании, Италии, Венгрии и Болгарии§!\n"
 GER_exploitation_of_annexed_nation_4: "В случае успеха мы получим §Y4%§! к §Gснижению§! §Yэкономической усталости§!\n"
 GER_exploitation_of_annexed_nation_4_axis: "В случае успеха мы получим §Y4%§! к §Gснижению§! §Yэкономической усталости§! для §YГермании, Италии и Болгарии§!\n"
 GER_exploitation_of_annexed_nation_10: "В случае успеха мы получим §Y10%§! к §Gснижению§! §Yэкономической усталости§!\n"
  
 GER_western_war_plans: "Планы войны на Западе"
 GER_western_war_plans_desc: "Первоначально мы не ожидали, что Соединённое Королевство и Франция сохранят свои обязательства по защите Польши. Теперь, когда у наших генералов было время подготовиться, мы можем предпринять необходимые шаги для обеспечения безопасности Западной Европы."
  
 GER_subjugate_iraq: "Подчинить Ирак"
 GER_subjugate_iraq_desc: "Теперь, когда Египет в наших руках, а все британские силы выбиты с Ближнего Востока, пришло время начать переговоры с новым иракским правительством. Основной задачей фюрера является получение богатых нефтяных месторождений, необходимых нам для будущих операций. Независимо от их ответа, мы получим то, за чем пришли."
  
 GER_pressure_iran: "Давление на Иран"
 GER_pressure_iran_desc: "Теперь, когда Ирак находится под нашим контролем, мы должны обратить наше внимание на соседнюю страну Иран. Воспользовавшись агрессивной и оскорбительной внешней политикой, проводимой в отношении иранского режима, наши дипломаты, скорее всего, уговорят их присоединиться к нашему делу и пополнить наши запасы топлива их нефтяными месторождениями. В случае, если дипломатия пойдет наперекосяк, всегда есть другие способы получить их нефтяные месторождения."
  
 GER_prepare_sealion: "Битва за Британию"
 GER_prepare_sealion_desc: "Мы сделали это! После выдающейся победы в континентальной Европе единственным соперником остались Британские острова. Герр Геринг пообещал, что бомбардировки Люфтваффе парализуют и деморализуют английский народ. Если Люфтваффе сможет выполнить эти обещания, тогда фюрер сможет приступить к операции «Морской лев»."
  
 GER_triumph_over_the_old_enemies: "Триумф над старыми врагами"
  
 GER_fate_of_yugoslavia_required_states_tt: "Требуется, чтобы Ось контролировала все §YЮгославские§! территории"
  
 GER_fate_of_greece_required_states_tt: "Требуется, чтобы Ось контролировала все §YГреческие§! территории"
  
 GER_incentivize_bulgarian_involvement: "Стимулирование участия Болгарии"
 GER_incentivize_bulgarian_involvement_desc: "Во многом Болгария похожа на нас: ее, как и нас, разорвали на части по итогам Первой мировой войны. Они должны быть более чем готовы присоединиться к нам, если мы пообещаем вернуть их имперские территории."
 GER_incentivize_bulgarian_involvement_tt: "§YУстранит любую нейтральную политику, которую может проводить Болгария, и предоставит права на ресурсы над Пловдивским хромом§!"
  
 GER_bases_in_france: "Базы во Франции"
 GER_bases_in_france_desc: "Учитывая наш быстрый успех во Франции, следующим шагом к доминированию в Западной Европе станет победа над Соединённым Королевством. Расширение баз во Франции позволит нам правильно разместить наши самолеты и подводные лодки, чтобы заставить Великобританию подчиниться."
  
 GER_bases_in_the_uk: "Базы в Британии"
 GER_bases_in_the_uk_desc: "Мы совершили невозможное и пересекли Ла-Манш. Расширяя наши базы в регионе, мы можем защитить наше военно-морское и воздушное присутствие от дальнейших врагов."
  
 GER_bases_in_greenland: "Базы в Гренландии"
 GER_bases_in_greenland_desc: "Соединенные Штаты, бастион западного вырождения, находятся за пределами нашей досягаемости за Атлантическим океаном. Малонаселенный остров Гренландия находится на ключевой стратегической позиции, которую можно использовать для вторжения на восточное побережье и в Канаду."
  
 GER_prepare_barbarossa: "Подготовить Барбароссу"
 GER_prepare_barbarossa_desc: "Наши враги на Севере, Юге и Западе потерпели поражение. Наш враг на Востоке огромен, и наша армия и логистика должны быть готовы!"
 GER_prepare_barbarossa_tt: "Открывает операцию §YСкоординированный удар§!: §G$operation_barbarossa$§!."
  
 GER_eastern_lebensraum: "Восточное жизненное пространство"
 GER_eastern_lebensraum_desc: "Вермахт не видел ничего, кроме победы, в то время как большевики тонут в своей некомпетентности. Стоит только выбить дверь, и вся гнилая конструкция рухнет."
 

 GER_form_the_reichskommissariats: "Сформировать рейхскомиссариаты"
 GER_form_the_reichskommissariats_desc: "В Рейхе необходимо правильно координировать множество вещей, включая управление и контроль над оккупированными территориями, а также внутреннюю слежку и все интеллектуальное и идеологическое воспитание нацистской партии. Все эти вещи должны управляться через административные субъекты, которые централизованно контролируются Рейхом!"
  
 GER_form_the_waffen_ss: "Сформировать Ваффен-СС"
 GER_form_the_waffen_ss_desc: "Ваффен-СС — это военное крыло Schutzstaffel. Они верны партии и будут яростно сражаться, защищая наши идеалы."
 GER_formation_of_the_waffen_ss: "Открывает решения СС"
  
 GER_recruit_from_the_hitler_youth: "Вербовка из Гитлерюгенда"
 GER_recruit_from_the_hitler_youth_desc: "«Гитлерюгенд» учит немецкую молодежь подлинным идеалам нацистской партии. Среди наших многочисленных потенциальных новобранцев эти дети самые фанатичные и готовые пожертвовать собой ради Рейха."
  
 GER_foreign_recruitment: "Разрешить вербовку иностранцев в СС"
 GER_foreign_recruitment_desc: "На завоеванных территориях присутствует много этнических немцев, которых мы можем привлечь на свою сторону. Кроме того, наша война против большевиков завоевала нам симпатии со стороны тех, кто выступает против Советского Союза."
 GER_foreign_recruitment_ss: "Позволяет вербовать дивизии СС из оккупированных регионов. Дополнительные §Yрешения о вербовке§! станут доступны по мере того, как вы понесете §Gбольше потерь в войне§!."
  
 GER_volkssturm: "Батальоны Фольксштурма"
 GER_volkssturm_desc: "В нашей отчаянной защите отечества мы можем спешно рекрутировать наших стариков и молодёжь в дивизии и заполнять бреши на линии фронта."
  
 GER_death_before_defeat: "Лучше смерть, чем поражение"
 GER_death_before_defeat_desc: "Эта война – война на истребление. Либо мы уничтожим выродившихся капиталистов и большевиков, либо они уничтожат Германию. Никакой капитуляции быть не может."
 GER_death_before_defeat_tt: "£faction_ger_ss СС станет §Gвлиятельнее§!, увеличивая £GFX_faction_pol_power_icon  §YПрирост политической власти§! на §G+0.05§! и £stability_texticon  §YСтабильность§! на §G+5.00%§!"
 death_before_defeat: "Лучше смерть, чем поражение"
  
 GER_split_yugoslavia: "Раскол Югославии"
 GER_split_yugoslavia_desc: "После завоевания Югославии мы должны поровну разделить страну между странами Оси."
  
 GER_split_greece: "Раскол Греции"
 GER_split_greece_desc: "После завоевания Греции мы должны поровну разделить страну между странами Оси."
  
 GER_integrate_romanian_war_economies: "Интеграция Румынии"
 GER_integrate_romanian_war_economies_desc: "Румыния оказалась в нашей сфере влияния и стала зависимой от немецкой экономики. Мы могли бы использовать это, чтобы установить контроль над их экономикой и забрать их ресурсы. Взамен это потребует немецких инвестиций, но получение всех прав на их нефть значительно улучшит наше положение с нефтью."
  
 GER_integrate_hungarian_war_economies: "Интеграция Венгрии"
 GER_integrate_hungarian_war_economies_desc: "Венгрия оказалась в нашей сфере влияния и стала зависимой от немецкой экономики. Мы могли бы использовать это, чтобы установить контроль над их экономикой и забрать их ресурсы. Взамен это потребует немецких инвестиций, но получение всех прав на венгерские ресурсы решит любые проблемы с бокситами, которые могут у нас возникнуть, и облегчит нашу ситуацию с железом."
  
 GER_west_wall_border_watch: "Пограничная охрана Западного вала"
 GER_west_wall_border_watch_desc: "Западный вал проходит параллельно хваленой французской линии Мажино, занимая большую часть той же территории, что и линия Зигфрида в прошлой мировой войне. Укрепление его обороны позволит нам удерживать границу меньшим количеством людей, освобождая дивизии для участия в любых потенциальных восточных кампаниях."
  
 GER_anschluss_flag: "Фокус §YАншлюс§! выполнен"
 GER_anschluss_flag_tt: "В настоящее время: [?GER_anschluss_flag:days|Y0]"
  
 GER_demand_sudetenland_flag: "Фокус §YТребовать Судетскую область§! выполнен"
 GER_demand_sudetenland_flag_tt: "В настоящее время: [?GER_demand_sudetenland_flag:days|Y0]"
  
 GER_sudetenland_acquired_flag: "§Y[GER.GetName]§! получила под свой контроль §YСудетскую область§!"
 
 GER_end_of_czechoslovakia_flag: "Фокус §YСудьба Чехословакии§! выполнен"
 GER_end_of_czechoslovakia_flag_tt: "В настоящее время: [?GER_end_of_czechoslovakia_flag:days|Y0]"
 
 GER_proclaim_the_axis_powers: "Провозглашение держав Оси"
 GER_proclaim_the_axis_powers_desc: "«Нет сомнения, что в этот момент ось европейской истории проходит через Берлин»."
  
 GER_clodius_agreement_flag: "Фокус §YСоглашение Клодиуса§! выполнен"
 GER_clodius_agreement_flag_tt: "В настоящее время: [?GER_clodius_agreement_flag:days|Y0]"
  

 GER_condor_legion: "Легион «Кондор»"
 GER_condor_legion_desc: "Националистический переворот Франсиско Франко благоприятствует нашим интересам в регионе. Мы должны послать им военную помощь, чтобы они одержали победу над коммунистами."
  
 GER_treaty_of_mutual_assistance: "Договор о взаимной помощи"
 GER_treaty_of_mutual_assistance_desc: "Италия, родина фашизма, может стать для нас важным союзником. Мы должны быть первыми, кто сделает шаг вперед, чтобы улучшить наши отношения с ними."
  
 GER_puppet_italy: "Марионеточная Италия"
 GER_puppet_italy_desc: "Нам необходимо установить высшую власть в рамках альянса оси, и мы не можем больше позволять Италии действовать независимо от нас. Пришло время предъявить ультиматум. Чем больше проблем в Италии, тем выше наши шансы на успех"
  
 GER_puppet_hungary: "Марионеточная Венгрия"
 GER_puppet_hungary_desc: "Нам необходимо установить высшую власть в рамках альянса оси, и мы не можем больше позволять Венгрии действовать независимо от нас. Пришло время предъявить ультиматум. Чем больше проблем у Венгрии, тем выше наши шансы на успех"
  
 GER_puppet_romania: "Марионеточная Румыния"
 GER_puppet_romania_desc: "Нам необходимо установить высшую власть в рамках альянса оси, и мы не можем больше позволять Румынии действовать независимо от нас. Пришло время предъявить ультиматум. Чем больше проблем в Румынии, тем выше наши шансы на успех"
  
 GER_puppet_bulgaria: "Марионеточная Болгария"
 GER_puppet_bulgaria_desc: "Нам необходимо установить высшую власть в рамках альянса оси, и мы не можем больше позволять Болгарии действовать независимо от нас. Пришло время предъявить ультиматум. Чем больше проблем у Болгарии, тем выше наши шансы на успех"
  
 GER_befriend_sweden: "Безопасное шведское железо"
 GER_befriend_sweden_desc: "Шведское железо жизненно важно для нашей военной машины, без него мы увидим закрытие большинства наших сталелитейных заводов."
  
 GER_alliance_with_finland: "Альянс с Финляндией"
 GER_alliance_with_finland_desc: "Финляндия доказала, что является компетентной военной силой, даже когда столкнулась с превосходящими силами противника. Мы должны обратиться к ним, готовясь к войне против Советов."
  
 GER_nationalist_spain_befriend: "Подружиться с Испанией"
 GER_nationalist_spain_befriend_desc: "Хотя мы еще далеки от вступления в войну, мы можем улучшить отношения, обеспечив постоянную экономическую помощь, а также их добровольческую армию."
  
 GER_amphibious_assault_crafts: "Амфибийная война"
 GER_amphibious_assault_crafts_desc: "Чтобы противостоять Соединенным Штатам, нам необходимо усовершенствовать специальное специализированное оборудование для наших морских вторжений."
  
 GER_endsieg: "Endsieg"
 GER_endsieg_desc: "Когда наше жизненное пространство обеспечено, у польского и чешского народа нет иного выбора, кроме как принять постоянный немецкий контроль, и тогда может начаться процесс ассимиляции. Это, без сомнения, очень поможет в восстановлении нашей территории после великого завоевания востока, и теперь мы можем сосредоточить все наши усилия на устранении любых угроз с запада."
 GER_endsieg_tt: "Имеет контроль над всеми §Yкрупными советскими городами§! на Западе и находится в мире с §YСоветским Союзом§!."
 GER_endsieg_effect_tt: "§YНачнется германизация названия оккупированных государств, поселков и городов§!"
  
 GER_downfall_of_the_solf_kreis: "Разгром кружка Зольф"
 GER_downfall_of_the_solf_kreis_desc: "Рейхсфюрер Генрих Гиммлер сообщил о весьма шокирующем открытии группы заговорщиков! Благодаря кроту СС сумело привлечь этих предателей к ответственности и тем самым доказало свою полезность для безопасности Рейха. Если мы хотим еще больше повысить безопасность, мы должны предоставить СС и СД больше свободы в подавлении любого сопротивления и предателей, которые могут помочь нашим врагам."
 GER_downfall_of_the_solf_kreis_tt: "£faction_ger_ss СС относятся §Cлояльно§! и обладают §Oмассовым§! влиянием\n"
  
 GER_a_new_europe: "Новая Европа"
 GER_a_new_europe_desc: ""
 GER_reichsprotectorate_tt: "Позволяет создавать новые супергосударства на завоеванных территориях §RВ настоящее время не работает§!\n"
  
 GER_naval_rearmament_tt: "§RПеревооружение ВМФ будет отменено, если вы превысите частичную мобилизацию§!"
  
 GER_pressure_iraq_tt: "Ирак согласится стать марионеткой, если у него случился фашистский переворот или он в нашей фракции."
  
 GER_pressure_iran_tt: "Иран согласится отказаться от прав на нефть при условии, что мы обеспечим безопасность Ирака и Кувейта."
  
  
 GER_surface_raiders: "Надводные рейдеры"
 GER_surface_raiders_desc: "Наши быстроходные крупные корабли способны преследовать вражеские конвои и уничтожать стандартные эскортные флотилии. Использование этих доктрин заставит наших врагов рассредоточить свои крупные корабли, и их можно будет легко разбить по частям."
  
 GER_dipose_hitler: "Убить Гитлера"
 GER_dipose_hitler_desc: "Гитлер вел эту страну к катастрофе. Мы не можем больше ждать, чтобы добиться окончательной победы, мы должны очистить себя от нацистов и направить нашу нацию в другом направлении."
  
 GER_democratic_party_assassination: "Германский Рейх"
  
 GER_reintegrate_old_german_territories: "Реинтеграция старых германских территорий"
 GER_reintegrate_old_german_territories_desc: "Версаль отомщен! Немецкий народ, живущий на территориях, которые были украдены у нас, теперь может быть возвращен в состав собственно Германии."
  
 GER_prepare_the_opposition: "Подготовить оппозицию"
 GER_prepare_the_opposition_desc: "Наша любимая страна слишком долго была запятнана и осквернена. Мы позволили Гитлеру и его приспешникам управлять государством только для того, чтобы лишить наш народ прав и превратить обычных людей в безмозглых и послушных нацистов, которые убивают невинных немецких гражданских лиц, не согласных с их идеями. Мы должны подготовиться к тому, чтобы вернуть нашу нацию и вести ее к светлому будущему, ЗДРАВСТВУЕТ СВЯЩЕННАЯ ГЕРМАНИЯ!"
 GER_prepare_the_opposition_tt: "Армия Германии будет §Rрасформирована§! и добавлена в §OГитлеровскую армию§!.\nТеперь вы будете играть за §YОппозиция§!. Все §YСнаряжение§! и §YДивизии§!, завербованные с этого момента, будут частью вашей армии во время гражданской войны.\n"
  
 GER_connections_within_the_wehrmacht: "Связи внутри Вермахта"
 GER_connections_within_the_wehrmacht_desc: "Чтобы возглавить наших бойцов, мы должны убедить генералов и адмиралов Вермахта и Кригсмарине в том, что наше дело праведно. У нас есть сообщения о том, что некоторые из них недовольны тем, как идут дела. Все, что нам нужно сделать, это подтолкнуть их в правильном направлении."
 GER_connections_within_the_wehrmacht_tt: "£faction_ger_wehrmacht §YВермахт§! станет §Cлояльным§!, увеличивая £stability_texticon  §YСтабильность§! на §G+10.00%§! и §YПрирост политической власти§! на §G+20.00%§!"
 
 GER_approach_august_von_mackensen: "Обратиться к Августу фон Макензену"
 GER_approach_august_von_mackensen_desc: "Август фон Макензен — уважаемый генерал в отставке, обладающий огромным опытом. Мало того, его присоединение к нашему делу, несомненно, повысит нашу легитимность и привлечет к нам еще больше сторонников. Все, что нам нужно будет сделать, это обратиться к нему и показать, что путь, по которому идет Германия, ведет во тьму."
  
 GER_call_upon_the_freikorps: "Призвать фрайкоры"
 GER_call_upon_the_freikorps_desc: "Мы должны осторожно обращаться с членами Freikorps, поскольку они разделяют схожую, если не ту же идеологию, что и нацисты. Однако, учитывая предательство в Ночь длинных ножей и осуждение их Гитлером, возможно, мы сможем убедить их присоединиться к нашему делу и направить свой гнев на нацистов. Ведь их солдаты жаждут хорошего боя."
 GER_call_upon_the_freikorps_tt: "Будут получены §G6§! §YЭлитных дивизий§! в начале гражданской войны.\n"
  
 GER_reach_out_to_communist_remnants: "Обращение к остаткам коммунистов"
 GER_reach_out_to_communist_remnants_desc: "Хотя у нас были разногласия, эти коммунисты тоже немцы. Мы одной крови и хотим лучшей Германии. Связавшись с остатками коммунистической партии, скрывающимися в подполье, мы сможем призвать их присоединиться к восстанию. К счастью, их ряды состоят из ветеранов и военнослужащих вермахта, имеющих военную подготовку или боевой опыт."
 GER_reach_out_to_communist_remnants_tt: "Будут получены §G6§! §YДивизий элитного ополчения§! во время гражданской войны.\nНачнётся с §Y10% поддержки коммунизма§! в правительстве.\n"
  
 GER_find_former_weimar_officials: "Поиск бывших чиновников Веймарской республики"
 GER_find_former_weimar_officials_desc: "Несмотря на то, что нацисты избавились от деятелей Веймарской республики, мы можем завербовать их и спасти некоторых из пленных, чтобы помочь в нашем деле. Их опыт понадобится новой администрации, которая придет после гражданской войны. Не только это, но и их слова могут убедить часть населения присоединиться к нашему делу."
 GER_find_former_weimar_officials_tt: "§YВеймарские советники§! будут §Gдобавлены§! в §YКабинет§! в начале гражданской войны.\nНачнётся с §Y10% поддержки демократии§! в правительстве.\n"
  
 GER_persue_legitimist_remnants: "Искать остатки легитимистов"
 GER_persue_legitimist_remnants_desc: "Прошло почти 17 лет с тех пор, как кайзер и его администрация были сосланы и смещены. Есть свидетельства того, что существует множество лоялистов, которые готовы присоединиться к нашему делу, если это означает свержение нацистских тиранов и возможность возвращения кайзера. А пока мы пообещаем возвращение кайзера, хотя и не сообщим им, вернется ли он к власти или нет. Этим мы займемся позже."
  
 GER_mission_to_hungary: "Миссия в Венгрию"
 GER_mission_to_hungary_desc: "Ходили слухи, что принц Габсбургов вернулся в Венгрию. Если бы это было правдой, то, возможно, мы могли бы послать наших верных друзей, чтобы убедить венгров присоединиться к нашему делу. Если они согласятся, нам наверняка будет гарантирована победа над нацистами."
 ger_civil_war_anschluss: "Взял на себя обязательство начать гражданскую войну вокруг аншлюса."
  
 GER_seek_like_minded_industrialists: "Искать единомышленников в промышленности"
 GER_seek_like_minded_industrialists_desc: "Многие отрасли и предприятия недовольны тем, как нацисты управляют экономикой, не говоря уже о том, что некоторые из этих предприятий подвергаются преследованиям за характер своих владельцев. Пригласив этих промышленников управлять нашими заводами, мы сможем гарантировать, что объемы производства превзойдут нацистскую нечисть."
 GER_seek_like_minded_industrialists_tt: "Открывает §HРешения§! к §Gувеличению§! §YОбъема заводского производства§! от §YОппозиции§!"
  
 GER_appeal_to_the_common_citizen: "Обращение к простому гражданину"
 GER_appeal_to_the_common_citizen_desc: "С помощью наших союзников-лоялистов, демократов и коммунистов мы сможем достучаться до немецкого народа и убедить его в нашем праведном деле."
  
 GER_appeal_to_the_common_soldier: "Обращение к простому солдату"
 GER_appeal_to_the_common_soldier_desc: "Простому солдату нелегко решиться сражаться за то, что он считает правильным. Мы не ожидаем, что сможем убедить их всех, но мы должны сделать все возможное, чтобы доказать, что мы — правильный выбор."
  
 GER_prepare_rebel_strongholds: "Подготовка опорных пунктов повстанцев"
 GER_prepare_rebel_strongholds_desc: "Пришло время начать наш план по возвращению нашей страны! Используя наше влияние и стратегически размещая войска и тайники с оружием в ключевых регионах, мы сможем сокрушить нацистов и захватить власть. Однако мы должны быть осторожны, поскольку каждый наш шаг будет только вызывать подозрения у Гитлера. Действуйте осторожно."
 GER_prepare_rebel_strongholds_tt: "Разблокирует §YРешения на карте§! для создания §YОплота§! в пределах §Y[GER.GetAdjective]их§! регионов."
  
 GER_stoke_the_fire_of_rebellion: "Разжечь огонь восстания"
 GER_stoke_the_fire_of_rebellion_desc: "Время пришло, гражданская война началась, мы задействовали наши силы и заняли как можно больше регионов. Теперь храбрецам на передовой предстоит разгромить этих фашистов и вернуть себе нашу Священную Германию."
 GER_stoke_the_fire_of_rebellion_tt: "§OБудет заполнено автоматически в исторические даты аншлюса или аннексии Судетской области\n§!"
  
