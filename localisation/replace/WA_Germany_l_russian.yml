 GER_ask_for_peace_UK_TT: "Контролировать следующие территории должна либо Германия, либо член Оси: Гибралтар, все острова Средиземного моря и Северную Африку, включая Суэцкий канал. Кроме того, должен быть достигнут мир с Советским Союзом, а США не могут вступить в войну на стороне союзников."
  
