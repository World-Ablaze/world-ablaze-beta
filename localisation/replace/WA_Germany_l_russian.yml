 GER_operation_valkyire: "Операция Валькирия"
 GER_operation_valkyire_desc: "Шанс убить Гитлера ([?GER_valkyrie_assassination|Y0]%)\nСила противника в гражданской войне ([?GER_enemy_civil_war_strength|Y0]%)\nШанс заключить мир с союзниками ([?GER_peace_with_allies|Y0]%)\n"
  
 GER_industry_reform: "Реорганизация отрасли"
 GER_industry_reform_desc: "Поскольку такие люди, как Геринг и Геббельс, вскоре уйдут с дороги, оружейная и синтетическая промышленность смогут пройти окончательные реформы и использовать свой максимальный потенциал, а увеличение рабочего времени и введение строгих пайков будут стимулировать военную экономику. Промышленность станет более организованной и будет производить еще больше оборудования и топлива."
  
 GER_increase_working_hours: "Увеличить рабочее время"
 GER_increase_working_hours_desc: "Мы увеличим рабочее время как немцев, так и не немцев, это не будет популярной мерой."
 GER_stricter_rations: "Ввести более строгое нормирование"
 GER_stricter_rations_desc: "Мирное население может есть траву, но фронту нужна техника."
 GER_reform_synthetic_industry: "Реорганизовать синтетические отрасли"
 GER_reform_synthetic_industry_desc: "Все еще сохраняются некоторая неэффективность в распределении рабочей силы и коррупция."
 GER_improved_anti_bombing: "Стандартизировать меры по борьбе с бомбардировками"
 GER_improved_anti_bombing_desc: "Некоторые заводы все еще неэффективно защищены от стратегических бомбардировок союзников, однако переход подвергнет опасности некоторые из наших заводов."
 GER_form_repair_squads: "Принудительные ремонтные отряды"
 GER_form_repair_squads_desc: "Использование людей с оккупированных территорий и набор их в ремонтные отряды ускорит ремонт и высвободит людские ресурсы."
 GER_force_cooperation: "Принудить отрасли к сотрудничеству"
 GER_force_cooperation_desc: "Некоторые из наших компаний до сих пор не сотрудничают друг с другом должным образом, и сейчас это закончится."
 GER_oust_goebbels: "Устранить Геббельса"
 GER_oust_goebbels_desc: "Идеологически мотивированное вмешательство Геббельса в немецкую военную экономику не вызвало ничего, кроме неэффективности и мошенничества, пришло время избавиться от него."
 GER_oust_goering: "Устранить Геринга"
 GER_oust_goering_desc: "Геринг озабочен разграблением нашей экономики и оккупированных территорий ради своей личной выгоды, вместо того, чтобы должным образом управлять люфтваффе. Он будет отстранен от любого поста, который позволит ему вмешиваться в немецкую промышленность."
  
 form_hre_east_prussia_required_states_tt: "Контролирует все территории §YВосточной Пруссии§!, включая §YКатовице§!, с 80% подчинением."
