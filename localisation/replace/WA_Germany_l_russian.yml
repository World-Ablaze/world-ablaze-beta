 GER_ask_for_peace_USA_TT: "Следующии территории должна контралировать Германия или член Оси: Ирландия, Домашние острова Соединенного Королевства, Гибралтар, все средиземноморские острова, Северная Африка, включая Суэцкий канал и Фарерские острова. Кроме того, должен быть достигнут мир с Советами."
  
