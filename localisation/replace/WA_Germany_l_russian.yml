 GER_safeguard_the_balkans: "Защита Балкан"
 GER_safeguard_the_balkans_desc0: "Балканы не зря называют пороховой бочкой Европы. Если коммунизм хочет закрепиться в Европе, он, скорее всего, начнет там свое начало. Этого необходимо предотвратить любой ценой."
  
  
