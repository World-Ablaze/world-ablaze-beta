 GER_me_262_1943: "Первый немецкий реактивный истребитель"
 GER_me_262_1943_desc: "Наши реактивные технологии далеко продвинулись, и наш первый реактивный истребитель уже не за горами. Потребуется немало политических маневров и услуг, чтобы подтолкнуть Люфтваффе к принятию на вооружение этой неизвестной технологии."
  
 GER_me_262_1944: "Первый немецкий реактивный истребитель"
 GER_me_262_1944_desc: "Наши реактивные технологии далеко продвинулись, и наш первый реактивный истребитель уже не за горами. Чтобы достичь этого и править небом, не потребуется много времени!"
  
 GER_reopen_trade_with_sweden: "Возобновить торговлю со Швецией"
 GER_reopen_trade_with_sweden_desc: "Британия использовала Норвегию как средство принуждения Швеции прекратить торговлю с нами. Мы должны завоевать Норвегию, чтобы заставить шведов возобновить торговлю с нами."
  
 GER_close_off_sweden: "Изолировать Швецию"
 GER_close_off_sweden_desc: "Теперь мы имеем контроль над Норвегией и имеем полную свободу заставить Швецию торговать только со странами Оси."
 
 GER_close_off_turkey: "Изолировать Турцию"
