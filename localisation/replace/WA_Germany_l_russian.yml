 form_hre_italy_required_states_tt: "Контролирует все регионы §YСеверной Италии§! до Тосканы и Эмилии-Романьи с 80% подчинением."
 form_hre_switzerland_required_states_tt: "Контролирует все §YШвейцарские§! территориями с 80% подчинением."
 form_hre_netherlands_required_states_tt: "Контролирует все §YГолландские§! территориями Европы с 80% подчинением."
 form_hre_belgium_required_states_tt: "Контролирует все §YБельгийские§! территориями Европы с 80% подчинением."
