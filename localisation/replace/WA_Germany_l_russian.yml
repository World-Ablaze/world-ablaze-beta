 GER_danzig_speech: "Произнести речь «Данциг останется немецким»"
 GER_danzig_speech_desc: "«Мои дорогие данцигцы, не только вы переживаете этот момент с глубочайшими эмоциями; более того, вся немецкая нация переживает это вместе с вами, и я тоже сознаю величие того часа, когда я впервые ступаю на землю, которую немецкие поселенцы заселили пять веков назад, которая в течение пяти столетий была немецкой и которая, можете быть уверены, останется немецкой»."
 GER_fall_of_france_speech: "Произнести речь «Версаль отомщен»"
 GER_fall_of_france_speech_desc: "«Теперь, когда мы победили французов, они почувствуют, каково это — пытаться подавить немецкий народ! Они будут платить нашим войскам, которые мы оставим охранять и защищать эту землю!»"
 GER_field_marshal_ceremony: "Провести церемонию производства в фельдмаршалы"
 GER_field_marshal_ceremony_desc: "Ошеломляющая победа над Францией требует торжественной церемонии повышения. Более того, присвоение престижного звания фельдмаршала ключевым военачальникам укрепило бы лояльность армии фюреру!"
 GER_total_war_speech: "Выступление «Тотальная война»"
 GER_total_war_speech_desc: "«Верите ли вы, вместе с Фюрером и нами, в полную и окончательную победу немецкого народа? Намерены ли вы, как и весь немецкий народ трудиться, если Фюрер прикажет, по 10, 12 и, в случае необходимости, 14 часов в сутки и отдать всё для справедливой победы? И если потребуется, хотите ли вы еще более тотальной и радикальной войны, чем вы вообще можете себе вообразить?! Вы - лучшая часть немецкого народа, и ваш ответ - это ответ всего немецкого народа, и я снова и снова спрашиваю вас: ХОТИТЕ ЛИ ВЫ ТОТАЛЬНОЙ ВОЙНЫ!?»"
  
 GER_reichskommissariats_desc: "Позволит создавать рейхскомиссариаты на контролируемых территориях.\n\n"
 GER_ukraine_grain: "Отправить сельскохозяйственную технику в Украину"
 GER_kaukasus_rwhg: "Операции Kontinentale Öl AG на Кавказе"
 GER_kaukasus_rwhg_desc: "Во время Второй мировой войны нефтяные месторождения Баку были одними из самых богатых и крупнейших в мире. Только в 1942 году на долю бакинской нефти приходилось 80% общего поступления нефтепродуктов в СССР, а общая добыча в то время составила 24 миллиона тонн. План «Блау», летнее наступление вермахта 1942 года, имел своей основной целью захват этих нефтяных месторождений. Исторически поражение под Сталинградом в 1943 году сделало реализацию этой цели невозможной. Желание Гитлера получить эту территорию было настолько велико, что накануне летнего наступления 1942 года его генералы решили угостить его тортом в виде Баку и Каспийского моря. Конечно, Гитлер вырезал Баку для себя.\n \nПриобретение этих нефтяных месторождений стало важным стратегическим и экономическим активом в результате успеха операции «Барбаросса». Хотя техника была сильно повреждена в ходе вторжения и преднамеренной диверсии отступающих сил Красной Армии. Тот факт, что под этой землей находится океан нефти, обязывает нас обеспечить особую защиту этого региона.\n\nГитлер совершенно ясно дал понять, что эта территория должна стать неотъемлемой частью Рейха и любые возможные инвестиции в развитие, интеграцию и защиту этой территории должны стать главным приоритетом. Уже разработаны планы создания обширной железнодорожной сети, соединяющей Баку на огромном расстоянии с сердцем Германии."
 GER_reichskommissariat_danemark: "Рейхскомиссариат Дания"
 GER_reichskommissariat_norwegen_desc: "Норвежское правительство сейчас находится в изгнании, а немецкие войска полностью контролируют эту территорию и выступают гарантом того, что шведское железо поставляется и будет поставляться в Рейх, кроме того - жизненно важный портовый город Нарвик теперь открыт для нас. И все это под носом проклятого Королевского флота! Кажется, нашу армию не остановить!\n \nМы можем создать рейхскомиссариат для поддержания порядка в Норвегии и привлечения местных добровольцев и полиции для контроля и предотвращения любой партизанской деятельности."
 GER_reichskommissariat_italy: "Итальянская Социальная Республика"
 GER_reichskommissariat_italy_alternate: "Итальянская Социальная Республика"
 GER_reichskommissariat_schweden: "Рейхскомиссариат Швеция"
 GER_reichskommissariat_finnland: "Рейхскомиссариат Финляндия"
 GER_reichskommissariat_niederlande_desc: "Вторжение в страны Бенилюкса во время вторжения во Францию привело бы к созданию двух политических образований с отличительными характеристиками национал-социалистического движения, каждое из которых преследовало долгосрочные цели по включению в состав самого Рейха.\n \nРейхскомиссариат Нидерланды был гражданским оккупационным режимом, установленным в оккупированных Нидерландах после того, как они пали в результате немецкого вторжения в 1940 году. Гитлер предполагал прямую ассимиляцию голландского народа в сам Рейх в более поздний период."
 GER_reichskommissariat_belgien_nordfrankreich_desc: "Вторжение в страны Бенилюкса во время вторжения во Францию привело бы к созданию двух политических образований с отличительными характеристиками национал-социалистического движения, каждое из которых преследовало долгосрочные цели по включению в состав самого Рейха.\n \nРейхскомиссариат в Бельгии был создан только в 1944 году, а до этого ею управляло военное правительство. Включая всю собственно Бельгию (кроме Эйпена, который был присоединен к Германии), а также часть богатой железом территории на севере Франции, этот режим также предназначался для будущей ассимиляции с самим Рейхом. Такие деятели, как Гиммлер и Геббельс, считали фламандскую и валлонскую нации германскими и, следовательно, достойными быть частью Великого германского рейха."
 GER_reichskommissariat_frankreich: "Рейхскомиссариат Франция"
 GER_reichskommissariat_frankreich_tt: "Контролирует ВСЕ §YФранцузские национальные территории§! в Европе\n"
 GER_reichskommissariat_britannien: "Рейхскомиссариат Британия"
 GER_reichskommissariat_irland: "Рейхскомиссариат Ирландия"
 GER_reichskommissariat_schweiz: "Рейхскомиссариат Швейцария"
 GER_reichskommissariat_tschechisch: "Рейхскомиссариат Бёмен"
 GER_reichskommissariat_polen: "Генерал-губернаторство Польша"
 GER_reichskommissariat_polen_desc: "Поражение польского государства не станет концом проблем на Востоке. Ожидается, что значительная часть населения продолжит выступать противниками нашей оккупации. Однако если мы будем придерживаться первоначального плана создания «нейтральной» зоны под нашим контролем, то как орган власти в этой области автономное государство должно иметь возможность осуществлять некоторый контроль на этой территории, снимая с нас ответственность и знаменуя конец польского государства. Новосозданное Генерал-губернаторство может не только сыграть роль разменной монеты в случае мирных переговоров, но и стать одной огромной польской резервацией."
 GER_reichskommissariat_ostland_desc: "Пришло время начать процесс расширения нашего Рейха на Восток. Создание этой администрации станет началом – Латвия, Литва, Эстония и Белоруссия станут единым территориальным образованием во главе с рейхскомиссаром. Однажды эти земли будут готовы к полной интеграции в Германский рейх. В определенных пределах каждый из трех прибалтийских округов будет иметь собственную местную администрацию под руководством Германии, это позволит восстановить частную собственность и вернуть часть земель и предприятий прежним владельцам, но на территории Белоруссии, где это невозможно по ряду причин, будут действовать особые правила.\n \nГлавная цель сейчас — разгрузить немецкую администрацию, которой не хватает кадров для выполнения административных задач во всех этих областях. Кроме того, предоставив политические стимулы народам Прибалтики, мы можем рассчитывать на их активное участие в войне против Советского Союза."
