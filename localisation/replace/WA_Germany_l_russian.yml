 GER_okh: "Верховное командование сухопутных войск"
 GER_okh_desc: "Немецкий генеральный штаб отвечал за постоянное изучение всех аспектов войны, включая составление и рассмотрение планов мобилизации или кампании. Это способствовало более высокому уровню организации в армии."
  
 GER_okw: "Верховное командование вермахта"
 GER_okw_desc: "Немецкий генеральный штаб (ОКВ) отвечал за постоянное изучение всех аспектов войны, включая составление и рассмотрение планов мобилизации или кампании. Это способствовало более высокому уровню организации в армии."
 
