 SS_form_SS_high_command_desc: "Гиммлер добился одобрения Ваффен-СС на формирование собственного высшего командования, Командование Ваффен-СС, в рамках Главного офиса СС, которое было создано в августе 1940 года. Оно получило командование СС-ВТ (Лейбштандарт и Подразделения по утилизации, переименованный в Рейх) и вооруженные полки СС-ТВ (дивизия «Тотенкопф» вместе с несколькими отдельными «Тотенкопф-Штандартен»)."
