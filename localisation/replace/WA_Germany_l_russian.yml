 GER_reichskommissariat_ural: "Рейхскомиссариат Урал"
 GER_reichskommissariat_ural_desc: "Западная Сибирь – это территория, простирающаяся на две с половиной тысячи километров от Северного Ледовитого океана до Казахских холмов и на девятьсот километров от гор Урала до Енисея. Регион богат природными ресурсами. Основные ресурсы — нефть и газ, торф, уголь, железная руда. Огромные запасы нефти и газа расположены в труднодоступных местах, в глубокой заболоченной тайге. К северу от Алтая расположен Кузнецкий угольный бассейн (Кузбасс). Основной железорудный бассейн округа, еще не разрабатываемый, расположен в Томской области. На Алтае находятся запасы ртути и золота, озера в Кулундинских степях — месторождения разных солей.\n \nПрисоединение территории за Уральскими горами — это не только логистический кошмар, но и риск для наших долгосрочных целей. Остминистериум предложил создать рейхскомиссариат Западной Сибири, который будет выполнять несколько важных функций в рамках Нового порядка."
 GER_reichskommissariat_turkestan_desc: "Преимущественно мусульманское население Центральной Азии имеет давний антагонизм с Россией, начиная с XIX века. Попадая под российское влияние в рамках геополитического маневрирования «Большой игры» между Российской и Британской империями, Центральная Азия со временем вошла в состав СССР в форме Советских Социалистических Республик. \n \nАльфред Розенберг предлагал создать в этом регионе рейхскомиссариат, однако это предложение было отвергнуто Адольфом Гитлером до тех пор, пока не удалось закрепить завоевания в Европе.\n \nТо, что было лишь историческим фактом, — немецкий «Пантуркестан», или «Мухаммед-Рейх», — теперь может быть создано благодаря нашему завоеванию СССР. Мы готовы создать немецкую гражданскую администрацию на территории бывших среднеазиатских ССР, либо можем создать вассальные государства на основе местных этнических национальностей и их различий, либо продолжить оккупацию этой территории."
 GER_annex_ostland: "Интегрировать рейхскомиссариат Остланд"
