 GER_fall_achse_preperation: "Подготовить операцию «Ось»"
 GER_fall_achse_preperation_desc: "Поскольку итальянцы, скорее всего, стремятся к перемирию с союзниками, необходимо предпринять шаги, чтобы гарантировать, что мы по-прежнему удерживаем итальянскую землю. Размещая войска в контролируемых Италией регионах, мы можем обеспечить быстрый захват власти, если итальянцы попытаются нанести нам удар в спину."
 GER_fall_achse_prep_tt: "Любой §Yнациональный итальянский регион§! вплоть §Rдо Кампании§! с немецкими дивизиями перейдет под контроль Германии после объявления войны Италии."
  
 GER_fall_achse: "Подготовить операцию «Ось»"
 GER_fall_achse_desc: "Поскольку итальянцы, скорее всего, стремятся к перемирию с союзниками, необходимо предпринять шаги, чтобы гарантировать, что мы все еще удерживаем итальянскую землю."
  
 establishing_italian_social_republic_tt: "Начнётся гражданская война в Италии. Все контролируемые Германией регионы, являющиеся национальными для Италии, перейдут в состав Рейхскомиссариата Италии."
  
 GER_barbarossa: "Активировать операцию «Барбаросса»"
 GER_barbarossa_desc: "Мы подготовили дополнительные запасы для нашего грандиозного наступления, пришло время одержать окончательную победу над коммунистической угрозой!"
 GER_barb: "Началась §YОперация Барбаросса§!"
 GER_barb_tt: "В настоящее время: [?GER_barb:days|Y0]"
  
