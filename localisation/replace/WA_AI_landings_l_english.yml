l_english:
 # [landing-announcement] Player-facing announcements of a WA-scripted amphibious landing.
 # Fired by WA_AI_LANDING_announce_landing; events in events/WA_AI_landings.txt.
 # The three names are global event targets set at the moment the landing executes:
 # WA_AI_LANDING_invader / WA_AI_LANDING_defender (countries), WA_AI_LANDING_site (the landing state).

 # .1 - a human allied to the invader: our side is ashore.
 WA_AI_landings.1.t:0 "[WA_AI_LANDING_invader.GetAdjective] Troops Are Ashore in [WA_AI_LANDING_site.GetName]"
 WA_AI_landings.1.d:0 "The signal reached us before the newspapers did: the first waves had already touched the sand.

Under cover of darkness a [WA_AI_LANDING_invader.GetAdjective] armada crossed to the [WA_AI_LANDING_defender.GetAdjective] coast, and at first light the ramps went down in [WA_AI_LANDING_site.GetName]. Naval guns worked over the dunes while the assault companies climbed the shingle under fire; by the turn of the tide there were men dug in above the high-water mark and the first vehicles were grinding their way inland off the beach.

A beachhead is not yet a front. The coming days will decide whether [WA_AI_LANDING_site.GetName] becomes a doorway or a graveyard, and that turns on a single race - the divisions coming over the water against the [WA_AI_LANDING_defender.GetAdjective] reserves marching for the coast. Whatever weight we can put on the enemy elsewhere, he cannot answer it twice."
 WA_AI_landings.1.a:0 "A foothold at last. Now widen it."

 # .2 - the invaded country itself, human: the enemy is ashore on our own soil.
 WA_AI_landings.2.t:0 "Enemy Landings in [WA_AI_LANDING_site.GetName]"
 WA_AI_landings.2.d:0 "The coastal batteries opened fire while it was still dark. By the time the reports reached us there was nothing left to argue about.

[WA_AI_LANDING_invader.GetAdjective] troops have come ashore in [WA_AI_LANDING_site.GetName], put down under the guns of their fleet and covered by aircraft ours could not drive off. The beach garrisons fought where they stood and bought hours with their lives - hours, not days. The enemy is past the dunes now, and he widens his hold with every tide.

A landing is never weaker than in its first week, while it still hangs by a rope of ships and holds no port of its own. If our reserves reach [WA_AI_LANDING_site.GetName] while the invaders are still tied to their beaches, we will put them back into the sea. If they arrive late, we shall be fighting a second war on our own soil - and fighting it for years."
 WA_AI_landings.2.a:0 "Every reserve to the coast."

 # .3 - a human allied to the invaded country: an ally coast has been breached.
 WA_AI_landings.3.t:0 "Enemy Landings on the [WA_AI_LANDING_defender.GetAdjective] Coast"
 WA_AI_landings.3.d:0 "The word comes from our allies, and it is bad.

[WA_AI_LANDING_invader.GetAdjective] forces landed in [WA_AI_LANDING_site.GetName] before dawn and are ashore in strength. [WA_AI_LANDING_defender.GetNameDefCap] is throwing what reserves it can gather toward the coast, but the first hours have gone to the enemy, and the sea lanes that might carry help to them run under his guns.

What is settled on that shore will not stay on it. Should the beachhead hold, the balance of this whole theatre tilts against every one of us - and our own coasts will suddenly seem very near indeed."
 WA_AI_landings.3.a:0 "Their shore today. Ours tomorrow."
