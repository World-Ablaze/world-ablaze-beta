 bel_armor.801.t: "Рабочие грозят забастовкой"
 bel_armor.801.d: "Дикая забастовка докеров в порту Антверпена быстро распространилась на другие промышленные регионы, и произошли массовые забастовки."
 bel_armor.801.a: "Мы должны разобраться с этим!"
  
 bel_armor.802.t: "Выборы 1936 года"
 bel_armor.802.d: "Выборы 1936 года привели к еще одной победе демократов, однако оппозиция более чем удвоила свой предыдущий результат, продемонстрировав резкий рост числа сторонников Рексистской партии."
 bel_armor.802.a: "Нам нужно разобраться с рексистами."
 bel_armor.802.b: "Отличный результат!"
  
 bel_armor.803.t: "[FROM.GetName] отменяет военный союз"
 bel_armor.803.d: "На фоне растущей напряженности в Европе Бельгия разорвала свой военный союз с нами, вытеснив французские войска со своей территории, и теперь выступает за строжайший нейтралитет. Это, несомненно, сделает Бельгию и наш северный фронт слабыми и заставит нас принять новую стратегию, если мы когда-нибудь снова будем воевать с Германией."
 bel_armor.803.a: "Глупый ход."
  
 bel_armor.804.t: "[FROM.GetName] предлагает совместную танковую программу"
 bel_armor.804.d: "Стремясь модернизировать свою армию, [FROM.GetName] обратилась к нам с просьбой помочь разработать новый танк для своих бронетанковых подразделений."
 bel_armor.804.a: "Мы принимаем"
 bel_armor.804.b: "Помощь им не в наших интересах."
  
 bel_armor.805.t: "[FROM.GetName] принимает совместную танковую программу"
 bel_armor.805.d: ""
 bel_armor.805.a: "Отлично."
  
 bel_armor.806.t: "[FROM.GetName] отклоняет совместную танковую программу"
 bel_armor.806.d: ""
 bel_armor.806.a: "Жаль."
  
 bel_armor.807.t: "[FROM.GetName] запрашивает обмен технологиями"
 bel_armor.807.d: ""
 bel_armor.807.a: "Мы растим сильного союзника."
 bel_armor.807.b: "Они не заслужили нашего доверия!"
  
 bel_armor.808.t: "[FROM.GetName] принимает обмен технологиями"
 bel_armor.808.d: ""
 bel_armor.808.a: "Это откроет многие двери."
  
 bel_armor.809.t: "[FROM.GetName] отклоняет обмен технологиями"
 bel_armor.809.d: ""
 bel_armor.809.a: "Нам придется искать других."
  
 bel_armor.810.t: "[FROM.GetName] требует нашего подчинения"
 bel_armor.810.d: ""
 bel_armor.810.a: "Мы не сдадимся без боя."
 bel_armor.810.b: "Лучше отложить бой до лучших времён."
  
 bel_armor.811.t: "[FROM.GetName] отклоняет наше требование"
 bel_armor.811.d: ""
 bel_armor.811.a: "Они развалятся достаточно быстро."
  
 bel_armor.812.t: "Аннексия Люксембурга"
 bel_armor.812.d: ""
 bel_armor.812.a: "Хорошее начало нашей империи!"