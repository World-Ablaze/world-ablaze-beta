 anti_soviet_pact_refused_call: "Отказывается соблюдать условия антисоветского пакта"
 anti_soviet_pact_refused_call_desc: "Эта нация отказалась соблюдать условия антисоветского пакта, когда ее призвали вступить в войну. Это подорвало доверие граждан к действующей власти и усилило симпатии к коммунистам."
 anti_soviet_pact_desc: "Если одна из стран, подписавших пакт, будет атакована Советским Союзом, другие должны будут вступить в войну (за исключением тех, кто уже сделал это)."
 resource_concern: "Ресурсное предприятие"
 escort_effort_focus_desc: "Когда стала понятна важность авиации в морских сражениях, авианосцы стали планировать для всех областей морской войны, будь то крупномасштабные сражения или противолодочное сопровождение. Эскортные авианосцы, обычно переоборудованные из существующих крейсеров или гражданских грузовых судов, помогают закрывать бреши в воздушном прикрытии на маршрутах конвоев."
 peoples_commissariat_focus_desc: "Раздутая централизованная организация, пронизанная коррупцией и неэффективностью. В конце концов, чтобы Родина процветала, с этим нужно что-то делать."
 SOV_pc_of_defence: "Народный Комиссариат Обороны"
 SOV_pc_of_defence_desc: "Наркомат обороны больше занят исполнением прихотей политических лидеров, чем решением военных проблем."
