 raid_type_nuclear_strike_ai_desc: "Стратегический бомбардировщик и сопровождающие его самолеты полетят к указанной цели и сбросят атомную бомбу. Затем бомбардировщик попытается покинуть зону, чтобы не попасть под ударную волну."
