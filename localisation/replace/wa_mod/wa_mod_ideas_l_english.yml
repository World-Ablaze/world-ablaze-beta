 escort_effort_focus_desc:0 "Once the importance of the air was realized in naval combat, carriers were planned to be used in all areas of naval warfare, whether it be large-scall battles or ASW escort duties. Escort carriers, usually converted from existing cruisers or civilian cargo ships, can help bridge air coverage gaps for convoy lanes."
