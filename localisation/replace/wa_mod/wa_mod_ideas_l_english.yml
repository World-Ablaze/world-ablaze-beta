 GER_bitter_loser:0 "Bitter Loser"
 GER_bitter_loser_desc:0 "Bitterness over defeat in the Great War dominates the politics of this nation."
 focke_wulf:0 "Focke Wulf"
 GER_robert_ley_desc:0 "Robert Ley was the head of the DAF. He was widely known for his rampant Alcoholism and under his watch the DAF became one of the most corrupt organizations in the Third Reich, he was also responsible for the "Strength Through Joy" program which sought to reconcile the working class with the Regime, and later the Housing Program for German Workers that had lost their Homes in allied bombing raids."
 GER_fritz_sauckel_desc:0 "Fritz Sauckel was the General Plenipotentiary for Labour Deployment from 1942 to 1945. Under his watch more than 8 Million foreign workers from all occupied territories were transported to the Reich."
 GER_oswald_pohl_desc:0 "Oswald Pohl was in charge of the economic and administrative division of the SS from 1942 until 1945. His duties of increasing Armaments production and allocating labour were also similiar to those of Albert Speer, which often caused conflicts between the two."
 ferdinand_schorner_desc:0 "A martinet, butcher, and a middling General who rose through the ranks over mountains of corpses."
