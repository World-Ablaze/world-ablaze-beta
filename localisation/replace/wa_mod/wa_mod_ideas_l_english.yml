 RAJ_agrarian_society_3_desc:0 "The local administrators believe that their agrarian lifestyle has made a large part of the Indian population simply unfit for military service or warfare of any kind. They maintain that we should only recruit from the so-called "martial tribes". This belief is so wide-spread and well-entreched that it will require at least a generation to overcome. For the foreseeable future, we must accept that they would simply ignore any order to draft farmers."
