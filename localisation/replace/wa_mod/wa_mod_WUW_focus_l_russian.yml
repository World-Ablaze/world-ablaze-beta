l_russian:
 AUS_the_matzen_oil_fields_desc: "Недавно нам повезло: на востоке [AUS.GetNameRuGen], под Матценом, была обнаружена нефть. Теперь у нас есть возможность добывать этот ресурс и с его помощью получить промышленное преимущество!"
 BEL_corruption_ns_fake_tt: "Ежедневный прирост политической власти: §R-0,25%§! \nСтабильность: §R-20%§! \nСкорость строительства: §R-20%§! \nЕжедневная поддержка фашизма: §G+0,10%§!"
 GER_amerikabomber_desc: "Американские континенты надежно защищены двумя огромными океанами. Если мы хотим довести войну до конца, нам нужны бомбардировщики дальнего действия, способные наносить удары по Америке прямо из Европы. Такие самолеты, несомненно, обойдутся очень дорого и потребуют огромных промышленных ресурсов, но, возможно, если сначала упрочить наши позиции в Европе, мы сможем уделить больше внимания проекту «Америкабомбер»."
 GER_negotiate_old_colonies_in_the_east_tt: "К нам перейдут следующие контролируемые ими регионы:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[634.GetName]§!"
