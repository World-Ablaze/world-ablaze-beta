l_english:
 form_sweden_hungary_category_desc: "We may not have all that much in common, us and the Swedes. What we do however have is the fact that we are joined in our Royal House, and Carl WIlhelm wishes to return to rule his old homelands as well. We must make his dream a reality."
 antilles_category_desc: "The Antillean Confederation was the vehement idea of Ramón Emeterio Betances about the need for natives of the Caribbean to unite into a regional entity that would seek to preserve the sovereignty and well-being of the Antillean nations. Support was strongest from the 1850s up until the Spanish–American War, and has since then mostly faded, but all is not lost. By invoking the spirit of out shared path, we can seek to establish and Antillean Confederation once and for all. Antilles for the Antilleans!"
 more_likely_to_accept_federalization_tt: "- They have a §GHigh§! Opinion of us\n- We share ideology"
 BEL_encourage_emigration_to_spain_decision: "Encourage Emmigration to [FROM.GetNameDef]"
 COG_anti_colonialism_decision_desc: "[FROM.GetAdjective] imperialism in Africa must end. The world need to wake up and realize that the days of [FROM.GetAdjective] colonialism are over. The people of [FROM.GetNameDef] must take pressure their leaders to release their suppressed African colonies."
 GER_the_fading_eagle_category_desc: "Our Italian allies have shown us their true colors, as their people have turned against us. This puts our southerns flank in great jeopardy, and we need to do all in our power to pick up the scraps and take control of the situation."
