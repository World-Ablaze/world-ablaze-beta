 GER_medium_tank_aa_equipment_2_short: "Ostwind"
 GER_medium_tank_aa_equipment_3: "Flakpanzer Wirbelwind"
 GER_medium_tank_aa_equipment_3_short: "Wirbelwind"
 GER_heavy_tank_equipment_1_desc: "«Grosstraktor» («большой трактор») — серия прототипов тяжелого танка, разработанная Германией. После Первой мировой войны Версальский договор ограничивал военное развитие Германии, поэтому разработка бронетехники и артиллерии шла в секрете."."
