 TIER_1_LABEL_LAND_TT:0 "Tier 1 covers the most basic doctrines for land combat. These are essential to even begin to know how to fight effectively after WW1."
 TIER_2_LABEL_LAND_TT:0 "Tier 2 covers intermediate doctrines for land combat. In order to fight well mid-war, these are needed."
 TIER_3_LABEL_LAND_TT:0 "Tier 3 covers the advanced doctrines for land combat. For late-war fighting, these are necessary to achieve victory."
 TIER_1_LABEL_NAVAL_TT:0 "Tier 1 covers the most basic doctrines for naval combat. These are essential to even begin to know how to fight effectively in the post-dreadnought age."
 TIER_2_LABEL_NAVAL_TT:0 "Tier 2 covers intermediate doctrines for naval combat. In order to fight well mid-war, these are needed."
 TIER_3_LABEL_NAVAL_TT:0 "Tier 3 covers the advanced doctrines for naval combat. For late-war fighting, these are necessary to achieve victory."
