 RESEARCH_REPLACE_TRANSFER: "\n$SAVED|H0$ дн. ранее сохраненного исследования будут переброшены на новую технологию."
 RESEARCH_TECH_UNUSED: "§GЩелкните, чтобы исследовать§!\nВ течение 30 дней вы можете выбрать другую область исследования без потери времени."
 air_techs_folder_desc: "Самолеты."
 dispersed_support_desc: "Рассредоточение наших средств поддержки позволяет равномерно охватить обширную площадь поля боя. Согласовав перезарядку батарей, мы никогда не будем застигнуты врасплох, а артиллерийская поддержка всегда будет доступна, когда она нужна.\n\n"
 improved_equipment_conversion: "Улучшенная доработка снаряжения"
 improved_equipment_conversion_desc: "Научно-технический прогресс позволит нам исправить проблемы более ранних моделей и привести их в соответствие с текущими нуждами."
 advanced_equipment_conversion: "Усовершенствованная доработка снаряжения"
 advanced_equipment_conversion_desc: "Организация специализированных групп и сборочных линий для конверсии устаревших моделей позволит нам поддерживать максимальную эффективность нашей военной машины."
 radio_detection: "Радиообнаружение"
 decimetric_radar: "Дециметровый радар"
 decimetric_radar_desc: "Многие виды войск полагаются на элемент внезапности, делающий их более эффективными. С появлением дециметрового радара они лишились этого преимущества."
 improved_decimetric_radar: "Улучшенный дециметровый радар"
 improved_decimetric_radar_desc: "Радар уже доказал, насколько он важен, но у нас пока слишком мало дециметровых радаров, чтобы обеспечить хороший охват. Оснастив радаром другие боевые единицы, мы сможем использовать эту технологию в полном объеме."
 improved_centimetric_radar: "Улучшенный сантиметровый радар"
 improved_centimetric_radar_desc: "Используя новейшие радарные технологии, например моноимпульсные радары, в ключевых операциях, мы добьемся предельно высокой точности обнаружения."
 advanced_centimetric_radar: "Усовершенствованный сантиметровый радар"
 advanced_centimetric_radar_desc: "Несмотря на то, что у нас есть современные радары, враг ухитряется избегать обнаружения. Последние разработки, как, например, РЛС на эффекте Допплера, позволят устранить многие из недочетов нашего оборудования."
 atomic_research: "Ядерный распад"
 atomic_research_desc: "Успешное расщепление атома урана привело бы к появлению новых элементов и, возможно, к получению большого количества энергии."
 mountain_gun_desc: "Горный рельеф Северной Индии помог разработать артиллерийское орудие, которое можно разобрать и перевезти верхом на мулах в нужную точку."
 AIR_TITLE_CV_FIGHTER: "Морские\nистребители"
 AIR_TITLE_HEAVY_STRAT_BOMBER: "Тяж. стратег.\nбомб."
 AIR_TITLE_SCOUT_PLANE: "Разведчики"
 TIER_1_LABEL_LAND_TT: "Уровень 1 охватывает самые основные доктрины наземного боя. Это важно даже для того, чтобы научиться эффективно сражаться после Первой мировой войны."
 TIER_2_LABEL_LAND_TT: "Уровень 2 охватывает промежуточные доктрины наземного боя. Чтобы хорошо сражаться в середине войны, они необходимы."
 TIER_3_LABEL_LAND_TT: "Уровень 3 охватывает передовые доктрины наземного боя. В боевых действиях в конце войны это необходимо для достижения победы."
 TIER_1_LABEL_NAVAL_TT: "Уровень 1 охватывает самые основные доктрины морского боя. Это важно даже для того, чтобы начать понимать, как эффективно сражаться в эпоху после дредноута."
 TIER_2_LABEL_NAVAL_TT: "Уровень 2 охватывает промежуточные доктрины морского боя. Чтобы хорошо сражаться в середине войны, они необходимы."
 TIER_3_LABEL_NAVAL_TT: "Уровень 3 охватывает передовые доктрины морского боя. В боевых действиях в конце войны это необходимо для достижения победы."
