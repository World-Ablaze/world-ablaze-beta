 cat_armored_cars: "Модели бронеавтомобилей"
 cat_modern_armor: "Модели современных танков"
 artillery_subtitle_anti_air: "Зенитная Артиллерия"
 artillery_subtitle_anti_tank: "Противотанковая Артиллерия"
 cat_strategic_destruction: "Доктрина стратегического разрушения"
 mtg_transport: "Транспортные корабли"
 mtg_transport_desc: "Корабли, предназначенные исключительно для передвижения войск, без каких-либо защитных возможностей."
 mtg_large_landing_craft: "Передовой Транспортный Самолёт"
 mtg_large_landing_craft_desc: "Передовые Транспортные Самолёты означают, что наши ребята смогут быстрее и эффективнее высаживаться на берег во время вторжения."
 airdrop_mines_desc: "§GПозволяет устанавливать мины с самолетов§!\nПри оснащении мин небольшим парашютом их можно безопасно сбрасывать с самолетов, что позволяет быстро и эффективно создавать минные поля."
 airsweep_mines_desc: "§GПозволяет проводить траление с самолетов§!\nСамолеты могут быть оснащены специальным оборудованием для обнаружения и безопасного подрыва морских мин с воздуха."
 basic_submarine_snorkel_desc: "Простой воздуховод, проходящий от машинного отделения через боевую рубку, который позволяет подлодке использовать дизельные двигатели и заряжать аккумуляторы в подводном положении.\n\nУстановка этого модуля на §Yподводные лодки§! снижает их §Yзаметность§!, благодаря чему их сложнее обнаружить."
 improved_submarine_snorkel_desc: "Улучшенная конструкция не позволяет воде попадать внутрь двигателей, а также снижает заметность для радаров.\n\nУстановка этого модуля на §Yподводные лодки§! снижает их §Yзаметность§!, благодаря чему их сложнее обнаружить."
 dp_secondary_battery: "Двухцелевая вторичная батарея"
 dp_secondary_battery_desc: "Объединение противокорабельных и зенитных орудий в одной установке обеспечивает большую гибкость и экономит вес.\n\nУстановка модуля §YВспомогательной батареи§! дает §YКрейсер§!, §YАвианосец§! или §YТяжелый корабль§!. небольшое количество §YАтака световым оружием§! и позволяет поразить вторую цель. Этот модуль также увеличивает §YПротивовоздушную атаку§!."
 cat_fuel: "Переработка топлива"
 industry_not_synth: "Несинтетическая промышленность"
