 train_equipment_1_desc:0 "Taken over by the military from regular civilian freight duty, this train engine is well-suited to move a large amount of supplies over long distances. However, its civilian construction makes it vulnerable.\n§GThis will retain efficiency from the previous model§!"
 train_equipment_2:0 "Simplified Train"
 train_equipment_2_desc:0 "A simplified design that ommits many features commonly found on regular freight trains for the sake of cheaper production. It is still every bit as vulnerable as a regular train, but can more easily be replaced.\n§GThis will retain efficiency from the previous model§!"
 train_equipment_3:0 "War Austerity Train"
 train_equipment_3_desc:0 "Stripped of all non-essential parts and the replacement of metal parts with wood, this train is meant to be as cheap as possible to meet war requirements.\n§OThis will retain some efficiency from the previous model§!"
 train_equipment_4:0 "Armored Train"
 train_equipment_4_desc:0 "A train engine encased in heavy armour to make it less vulnerable to enemy attack. It can carry as much cargo as any other design, but is more expensive to produce.\n§OThis will retain some efficiency from the previous model§!"
 railway_gun_equipment_desc:0 "§YWill need $industry_organization2$ industry tech to build correctly.§! \nA heavy cannon mounted on a railway carriage for transportation."
