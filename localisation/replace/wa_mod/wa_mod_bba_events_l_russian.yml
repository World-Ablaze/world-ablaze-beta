l_russian:
 BBA_ethiopia_balance_of_power_events.53.desc: "Один из властителей в регионе [?ROOT.ETH_bop_state.GetName] хочет наладить местное производство винтовок и боеприпасов и просит поддержки. Так наши войска могли бы получить более совершенное снаряжение, и боеспособность [ROOT.GetAdjective] армии выросла бы."
 BBA_ethiopia_anti_colonialism_events.5.desc: "После неудавшихся переговоров по поводу прекращения войны с государством [?global.african_colonial_country.GetNameDef] [?global.african_supporting_country.GetNameDef] решает активно поддержать [ROOT.GetAdjective] народ в его борьбе. [?global.african_colonial_country.GetAdjective] послу в государстве [?global.african_supporting_country.GetName] сообщили о том, что [?global.african_supporting_country.GetNameDef] отныне находится в состоянии войны с государством [?global.african_colonial_country.GetName], и эта война будет продолжаться до тех пор, пока [?global.african_colonial_country.GetNameDef] не откажется от империалистических и колониальных амбиций в Африке и на других континентах."
 BBA_ethiopia_industrial_financial_events.2.desc: "Подчеркивая тот факт, что [ROOT.GetName] и [FROM.GetName] тесно связаны друг с другом экономически и что большую часть промышленности в государстве [ROOT.GetName] уже контролирует [FROM.GetName], [FROM.GetLeader] требует убрать пограничные заставы между двумя странами. Управление всей внешней политикой должно перейти под контроль государства [FROM.Getname], чтобы обеспечить максимальную защиту, координацию и эффективность. Это будет фактически означать конец [ROOT.GetAdjective] независимости.\nВсе это будет сделано в интересах обоих государств, настаивает [FROM.GetLeader]."
 BBA_ethiopia_industrial_financial_events.2.b: "Лишь бы у нас оставалась хоть какая-то автономия"
 BBA_ethiopia_communist_events.06.desc: "При поддержке государства [SOV.GetName] армейские офицеры распустили временное [ETH.GetAdjective] правительство. Они утверждают, что [SOV.GetAdjective] разведка предоставила им сведения о том, что правительство под руководством лидера [ROOT.GetLeader] предало народ. Члены этого правительства якобы вели переговоры о полной оккупации страны [ITA.GetAdjective] войсками, надеясь получить за это огромные суммы денег. После столкновений с «Черными львами» члены правительства были либо убиты, либо арестованы. \n\nАрмия взяла управление страной на себя, намереваясь восстановить порядок и нейтрализовать сообщников лидера [ROOT.GetLeader]. Пока неясно, как долго будет действовать новая военная администрация."
 BBA_ethiopia_communist_events.06.indy_desc: "Армейские офицеры распустили временное [ETH.GetAdjective] правительство. По их словам, разведка предоставила сведения о том, что правительство и его глава, [ROOT.GetLeader], предали народ. Члены администрации якобы вели переговоры о полной оккупации страны [ITA.GetAdjective] войсками, надеясь получить за это огромные суммы денег. После столкновений с «Черными львами» члены правительства были либо убиты, либо арестованы. \n\nАрмия взяла управление страной на себя, намереваясь восстановить порядок и нейтрализовать сообщников лидера [ROOT.GetLeader]. Пока неясно, как долго будет действовать новая военная администрация."
 BBA_ethiopia_communist_events.14.desc: "[ETH.GetNameDefCap] просит нас помочь в создании военно-воздушных сил. В частности, правительство государства призывает нас прислать добровольцев, чтобы они тренировались вместе с нашими пилотами на старых самолетах. Это отличная возможность для наших летчиков набраться опыта и испытать нашу технику в боях с [ITA.GetAdjective] войсками."
 BBA_ethiopia_communist_events.29.desc: "[ITA.GetName] и [SOV.GetNameDef]устроили дипломатическое противостояние, но теперь оно улеглось: [ITA.GetAdjective] правители согласились прекратить боевые действия против нас. Это большая победа над силами фашизма, но вряд ли борьба на этом закончится. Остается надеяться, что мы будем и дальше сотрудничать с нашими друзьями из города [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_african_union_events.4.desc: "Организация африканского единства учредила банк под названием [ETH_GetCentralBankName]. Ему поручено создать валюту для растущей организации. Планируется выпустить общую денежную единицу и начать объединение экономического пространства государств-участников. Это, несомненно, принесет пользу экономике в будущем, но вызовет проблемы в краткосрочной перспективе, так как людям придется привыкать к новым деньгам."
 BBA_italy_missiolinis.71.desc: "С тех пор как дуче сформировал Aeronautica, она стала символом национальной гордости и одной из лучших ВВС мира. Единственная проблема в том, что она слишком мала, и теперь дуче убедили заказать дополнительные самолеты, чтобы усилить Aeronautica."
 BBA_italy_missiolinis.73.desc: "Муссолини лично заинтересовался усилением ВВС и использовал производство новых самолетов как возможность продемонстрировать мощь итальянской промышленности. Aeronautica стала центральным элементом пропаганды, восхваляющей итальянскую авиацию и инженерную мысль."
 BBA_italy_interaction_events.1.t: "[ITA.GetLeader] требует регион [151.GetName]"
 BBA_italy_interaction_events.1.desc: "Совершенно неожиданным и возмутительным шагом итальянский лидер [ITA.GetLeader] осквернил наш давний нейтралитет, предъявив нам ультиматум. В течение двух недель нам необходимо передать итальянцам район [151.GetName], иначе будет война. Как нам следует реагировать?"
 BBA_italy_interaction_events.2.desc: "Президент [SWI.GetNameDef] сегодня объявил об окончании эпохи для страны. Они уступят нам итальянскую территорию [151.GetName] и откажутся от претензий на любые италоязычные города в этом регионе. Сегодняшний день знаменует собой сокращение размера и многоэтнических ценностей [SWI.GetName], поскольку впоследствии они также лишили итальянского языка статуса официального языка."
 BBA_italy_interaction_events.3.desc: "Нация [SWI.GetName] объявила сегодня, что она отменит свой нейтралитет, игнорируя наши требования вернуть [151.GetName] итальянскому миру. Из-за этого глупого выбора у нас не остается другого выбора, кроме полного и окончательного разрушения швейцарской кантональной системы."
 BBA_italy_interaction_events.14.desc: "[ITA.GetLeader] требует обеспечить гарантии безопасности наших наций, что вполне справедливо. Куда хуже то, что [ITA.GetLeader] требует полностью демилитаризировать регионы [342.GetName] и [339.GetName], что плохо повлияет на нашу обороноспособность — ведь тогда мы не сможем установить защитные позиции на случай атаки со стороны государства [ITA.GetName] или любых его союзников."
 BBA_italy_interaction_events.21.a: "Выкуси, Греция, мы были первыми!"
 BBA_italy_interaction_events.26.a: "Они поняли, что им не сравниться с нами!"
 BBA_italy_interaction_events.44.desc: "Государство [FROM.GetLeader] запустило инициативу по заключению союза с нациями Южной Америки и объединению латинских культур в рамках одних владений. Кажется, это хорошая возможность защититься от государства [USA.GetNameDef]. Что мы ответим?"
 BBA_italy_interaction_events.667.a: "Благословен будь [FROM.GetAdjective]ий народ!"
 BBA_switzerland.11.desc_SWI: "Поскольку совет решил не вмешиваться в это дело и оставить его судам и закону Граубюндена, Давид Франкфуртер, признавшийся в убийстве Вильгельма Густлоффа, был приговорен к 18 годам тюрьмы.\n\nМы знаем, что государство [?SWI.SWI_fascist_germany.GetNameDef] желало бы более сурового приговора, и нашим дипломатам еще предстоит улаживать это разногласие, но в такие времена мы не можем рисковать, вставая на чью-либо сторону. Наш нейтралитет — вот что может уберечь [SWI.GetAdjective] народ в грядущей буре."
 BBA_switzerland.16.desc: "Один из наших тайных агентов, размещенных в государстве [FROM.GetCapitalVictoryPointName], получил предложение от [FROM.GetAdjective] правительства заключить тайный пакт между нашим альянсом и государством [FROM.GetNameDef]. Тогда это государство поможет нам навредить нашим врагам в Европе, сохраняя при этом видимость нейтралитета, а со временем даже отринув его ради нас.\n\nТакже это означает, что мы должны будем защищать их, если они окажутся под риском вторжения."
 BBA_switzerland_trade.15.desc: "К сожалению, нам сообщили, что [FROM.GetName] не будет инвестировать в [ROOT.GetAdjective] экономику. Увы, мы остались практически в изоляции перед надвигающейся угрозой фашизма."
 BBA_swiss_expansion.6.b: "[ROOT.GetName] никогда не уступит свою территорию!"
 BBA_swiss_expansion.12.desc: "Произошло неожиданное: [FROM.GetNameDef] заявляет свои претензии на [ROOT.GetAdjective] Альпы. Доводы в лучшем случае можно назвать шаткими, но государство уже поставило под ружье значительную часть населения и готово вторгнуться в случае отказа. Сам этот факт, а также благоприятный для врага ландшафт могут привести к долгой и затратной войне, случись нам отказать, — так что надо как следует взвесить свой ответ."
 BBA_swiss_expansion.13.desc: "[FROM.GetAdjective] правительство приняло правильное решение и уступило свои альпийские территории, по праву принадлежащие нам. Это гарантирует нашу будущую безопасность от агрессоров."
 BBA_generic_purchase_ships_events.01.t: "Закупка для [FROM.GetAdjective] флота"
 BBA_generic_purchase_ships_events.01.desc: "[FROM.GetNameDefCap] предлагает нам приобрести часть наших законсервированных флотских ресурсов. Эти ресурсы уже не состоят на службе в связи с устареванием и отсутствием на них современного снаряжения."
 BBA_generic_purchase_ships_events.01.a: "Это взаимовыгодное предложение."
 BBA_generic_purchase_ships_events.01.b: "У нас нет лишних флотских ресурсов."
 BBA_generic_purchase_ships_events.02.t: "[FROM.GetNameDefCap] соглашается на закупку флота"
 BBA_generic_purchase_ships_events.02.desc: "[FROM.GetAdjective] дипломаты и моряки сообщили нам, что готовы передать нам часть законсервированного снаряжения, которое мы желаем закупить. Это позволит нам расширить свой новообразованный флот."
 BBA_generic_purchase_ships_events.02.a: "Прекрасная новость."
 BBA_generic_purchase_ships_events.03.t: "[FROM.GetNameDefCap] не соглашается на закупку флота"
 BBA_generic_purchase_ships_events.03.desc: "[FROM.GetAdjective] дипломаты сообщили нам, что не желают продавать законсервированное снаряжение. Неясно, чем вызван такой отказ — наличием собственных планов на эти корабли или неодобрением нашей политики."
 BBA_generic_purchase_ships_events.03.a: "Очень жаль."
