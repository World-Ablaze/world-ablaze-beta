l_russian:
 coal_desc: "Уголь - горючее вещество и крупнейший источник выработки электроэнергии, а также важнейший компонент сталелитейного процесса. "
 iron_desc: "Железный металл имеет решающее значение для производства стали, чугуна и других сплавов."
 bauxite_desc: "Боксит - это руда, необходимая для производства алюминия."
 PRODUCTION_MATERIALS_FOOD: "Продукты питания"
 rail_way_plural: "Железные дороги"
 industrial_complex_desc: "Это сооружение снабжает регион товарами народного потребления и позволяет строить новые сооружения. При необходимости его можно превратить в завод по выпуску военной продукции.\n§Y(ПОТРЕБЛЯЕТ§! §R2§! £GFX_resources_strip|9 §RЖЕЛЕЗА§! §YИ§! §R1§! £GFX_resources_strip|5  §RСТАЛИ§!§Y)§!"
 steel_refinery: "Сталелитейный завод"
 steel_refinery_plural: "Сталелитейные заводы"
 steel_refinery_desc: "Сталелитейный завод - это промышленное предприятие по производству и разливке стали. §Y(ПОТРЕБЛЯЕТ§! §R20§! £GFX_resources_strip|7  §RУГЛЯ§! §YИ§! §R25§! £GFX_resources_strip|9 §RЖЕЛЕЗА§!§Y)§!\n"
 aluminium_refinery: "Алюминиевый завод"
 aluminium_refinery_plural: "Алюминиевые заводы"
 aluminium_refinery_desc: "Выплавка алюминия - это процесс извлечения алюминия из его оксида, глинозема, как правило, по методу Холла — Эру. §Y(ПОТРЕБЛЯЕТ §!§R15§! £GFX_resources_strip|7  §RУГЛЯ§! §YИ§! §R35§! £GFX_resources_strip|8 §RБОКСИТОВ§!§Y)§!\n"
 hydro_steel_refinery: "Гидроэлектрический сталелитейный завод"
 hydro_steel_refinery_plural: "Гидроэлектрические сталелитейные заводы"
 hydro_steel_refinery_desc: "Выплавка стали становится дешевле, если использовать гидроэлектростанции. Однако это требует больших первоначальных инвестиций в виде стоимости строительства. §Y(ПОТРЕБЛЯЕТ §!§R5§! £GFX_resources_strip|7  §RУГЛЯ§! §YИ§! §R25§! £GFX_resources_strip|9 §RЖЕЛЕЗА§!§Y)§!\n"
 hydro_aluminium_refinery: "Гидроэлектрический алюминиевый завод"
 hydro_aluminium_refinery_plural: "Гидроэлектрические алюминиевые заводы"
 hydro_aluminium_refinery_desc: "Выплавка алюминия становится дешевле, если использовать гидроэлектростанции. Однако это требует больших первоначальных инвестиций в виде стоимости строительства. §Y(ПОТРЕБЛЯЕТ §!§R35§! £GFX_resources_strip|8 §RБОКСИТОВ§!§Y)§!\n"
 steel_refinery_inactive: "Сталелитейный завод (неактивен)"
 steel_refinery_inactive_plural: "Сталелитейные заводы (неактивены)"
 steel_refinery_inactive_desc: "Этот сталелитейный завод неактивен из-за нехватки сырьевых ресурсов. Может быть активирован решением, если будет предоставлено достаточно сырьевых ресурсов."
 aluminium_refinery_inactive: "Алюминиевый завод (неактивен)"
 aluminium_refinery_inactive_plural: "Алюминиевые заводы (неактивены)"
 aluminium_refinery_inactive_desc: "Этот алюминиевый завод неактивен из-за нехватки сырьевых ресурсов. Может быть активирован решением, если будет предоставлено достаточно сырьевых ресурсов."
 hydro_steel_refinery_inactive: "Гидроэлектрический сталелитейный завод (неактивен)"
 hydro_steel_refinery_inactive_plural: "Гидроэлектрические сталелитейные заводы (неактивены)"
 hydro_steel_refinery_inactive_desc: "Этот гидроэлектрический сталелитейный завод неактивен из-за нехватки сырьевых ресурсов. Может быть активирован решением, если будет предоставлено достаточно сырьевых ресурсов."
 hydro_aluminium_refinery_inactive: "Гидроэлектрический алюминиевый завод (неактивен)"
 hydro_aluminium_refinery_inactive_plural: "Гидроэлектрические алюминиевые заводы (неактивны)"
 hydro_aluminium_refinery_inactive_desc: "Этот гидроэлектрический алюминиевый завод неактивен из-за нехватки сырьевых ресурсов. Может быть активирован решением, если будет предоставлено достаточно сырья."
 synthetic_refinery_inactive: "Нефтеперерабатывающий завод (неактивен)"
 synthetic_refinery_inactive_plural: "Нефтеперерабатывающие заводы (неактивные)"
 synthetic_refinery_inactive_desc: "Этот нефтеперерабатывающий завод неактивен из-за нехватки сырьевых ресурсов. Может быть восстановлен по решению, если будет предоставлено достаточно сырья."
 modifier_production_speed_hydro_aluminium_refinery_factor: "£construction_speed_texticon Скорость строительства §Yгидроэлектрических алюминиевых заводов§!"
 modifier_production_speed_hydro_steel_refinery_factor: "£construction_speed_texticon Скорость строительства §Yгидроэлектрических сталелитейных заводов§!"
 modifier_production_speed_steel_refinery_factor: "£construction_speed_texticon Скорость строительства §Yсталелитейных заводов§!"
 modifier_production_speed_aluminium_refinery_factor: "£construction_speed_texticon Скорость строительства §Yалюминиевых заводов§!"
 modifier_production_speed_synthetic_rubber_refinery_factor: "£construction_speed_texticon Скорость строительства §Yнефтеперерабатывающих заводов§!"
 bunker_ai: "Укрепление"
 bunker_ai_plural: "Укрепления"
 bunker_ai_desc: "Это сооружение накладывает штраф на атакующую сторону в сухопутном бою — $VALUE|+%0$ за каждый уровень укрепления. Атаки с разных направлений снижают эффект укреплений."
 synthetic_refinery_desc: "Это здание §Y(ПОТРЕБЛЯЕТ §!§R60 УГЛЯ£GFX_resources_strip|7 §!§Y)§! и обеспечивает регион"
 rocket_site_spawn: "Ракетная площадка"
 naval_base_spawn: "Морская база"
 naval_facility_desc: "Экспериментальные институты военно-морской техники позволяют запускать проекты по разработке надводных кораблей и подлодок.\nСоздать такой институт можно только в прибрежной провинции."
 naval_supply_hub_desc: "Это строение позволяет вашим флотам пополнять припасы и заправляться топливом не только в своих портах приписки, но и на этой базе, благодаря чему увеличивается дальность действия §Yоперативных соединений§!.\nПостроить морской узел снабжения можно только в прибрежной провинции, где есть морская база как минимум 6-го уровня."
 naval_headquarters_desc: "Это строение позволяет вам назначать адмиралов, увеличивая таким образом эффективность §Yоперативных соединений§!, действующих в пределах досягаемости морского штаба.\n\nЧисло штабов с назначенными адмиралами не может превышать $MAXNUM|H$.\nВ настоящее время назначено: $CURRNUM|H$\n\nПостроить морской штаб можно только в прибрежной провинции, где есть морская база как минимум 8-го уровня."
