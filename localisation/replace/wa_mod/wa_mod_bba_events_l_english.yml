l_english:
 BBA_italo_ethiopian_war_events.03.desc:0 "Our offensive has pushed the Italians back, but it failed to achieve it's goal. Our troops have run out of momentum, and the Italians are recovering from the shock of our assault.\nintelligence reports indicate that they are preparing a new push, better prepared than last time. Our forces must hold. They longer we can keep them away from our country, the more they have to commit, and the easier it will be to convince the League of Nations that this is no minor "colonial skirmish" but rather a brutal aggression by one member country against another."
 BBA_italo_ethiopian_war_events.12.desc:0 "[FROM.GetLeader] has informed the League of Nations Council that [FROM.GetNameDef] will not close the Suez Canal for [ITA.GetName]. This is a clearly breach of international agreements, and when urged to comply, [FROM.GetName] simply announced that they are leaving the League of Nations."
 BBA_italo_ethiopian_war_events.15.desc_b:0 "Even with after the League of Nations' resolution to allow support of [ROOT.GetName], the number of volunteers arriving to help us out in our war effort is unfortunately very small. Hopefully the fighting capabilities of these brave freedom fighters are on par with their enthusiasm."
 BBA_italo_ethiopian_war_events.203.desc:0 "The so-called experts wouldn't give us a month even when the war started. We've held out against a so called modern army for far longer than that. We know how they fight, and we have adopted to it. The faith among the people is returning, recruits are flocking to the banners from near and afar."
 BBA_ethiopia_balance_of_power_events.53.desc:0 "One of the lords in [?ROOT.ETH_bop_state.GetName] wants support for setting up local production of rifles and ammunition in [?ROOT.ETH_bop_state.GetName]. This could help our armed forced get better equipment and improve the fighting capabilities of the [ROOT.GetAdjective] army."
 BBA_ethiopia_exile_events.10.c:0 "These demands go to far"
 BBA_ethiopia_imperial_events.3.a:0 "We will have consider other methods"
 BBA_ethiopia_military_and_tech_events.1_peace.desc:0 "With the war behind us, we have now the chance to finish the creation of our military academy. The first class of cadets can help or nation win future wars, and ensure we make the best possible use of our experience from fighting the Italians."
 BBA_ethiopia_anti_colonialism_events.5.desc:1 "After having attempted at mediation in our war against [?global.african_colonial_country.GetNameDef] and failed, [?global.african_supporting_country.GetNameDef] has decided to actively start supporting the [ROOT.GetAdjective] struggle. The [?global.african_colonial_country.GetAdjective] ambassador to [?global.african_supporting_country.GetName] has been informed that [?global.african_supporting_country.GetNameDef] considers itself at war with [?global.african_colonial_country.GetName] from this point on, until the moment that [?global.african_colonial_country.GetNameDef] gives up it's imperialist and colonial ambitions in Africa and elsewhere."
 BBA_ethiopia_industrial_financial_events.2.desc:0 "Citing the fact that the economies of [ROOT.GetName] and [FROM.GetName] are so intertwined, and that much of the industry in [ROOT.GetName] is already controlled by [FROM.GetName], [FROM.GetLeader] demands that border stations between the two countries be removed. The control of all foreign policy is to be placed under the control of [FROM.Getname] to ensure maximum protection, coordination, and effficiency. In effect this would mean the end of [ROOT.GetAdjective] independence.\n All this will be done with the the best interest of both countries in mind, [FROM.GetLeader] ensures."
 BBA_ethiopia_industrial_financial_events.2.b:0 "As long as we can retain some kind autonomy"
 BBA_ethiopia_industrial_financial_events.4.a:0 "This can surely be accomodated"
 BBA_ethiopia_communist_events.06.desc:0 "Military officers backed by the [SOV.GetName] have dissolved the provisional [ETH.GetAdjective] government. The officers claim they were provided evidence by the [SOV.GetAdjective] intelligence service that proved the government, lead by [ROOT.GetLeader], had betrayed the people. According to the evidence, members of the government were in discussions to allow [ITA.GetAdjective] troops to fully occupy the country in exchange for vast amounts of personal wealth. Following shootouts with the Black Lions, the former members of the provisional government are believed to be dead or under arrest. \n\nThe military has now taken over leadership of the country to restore order and root out [ROOT.GetLeader]’s co-conspirators. It remains unclear how permanent the newly formed military administrative council will be."
 BBA_ethiopia_communist_events.06.indy_desc:0 "Military officers have dissolved the provisional [ETH.GetAdjective] government. The officers claim they were provided evidence by the intelligence services that proved the government, lead by [ROOT.GetLeader], had betrayed the people. According to the evidence, members of the government were in discussions to allow [ITA.GetAdjective] troops to fully occupy the country in exchange for vast amounts of personal wealth. Following shootouts with the Black Lions, the former members of the provisional government are believed to be dead or under arrest. \n\nThe military has now taken over leadership of the country to restore order and root out [ROOT.GetLeader]’s co-conspirators."
 BBA_ethiopia_communist_events.11.a:0 "This is as an opportunity we can't miss."
 BBA_ethiopia_communist_events.14.desc:0 "[ETH.GetNameDefCap] has requested our support with the development of their own air force. Their proposal includes sending volunteers to train alongside our pilots in older, surplus planes. This would be a fantastic oportunity for our pilots to get some more experience and for testing out our equipment against the [ITA.GetAdjective]s."
 BBA_ethiopia_communist_events.15.desc:0 "Generals from [SOV.GetNameDef] arrived in [ROOT.Capital.GetCapitalVictoryPointName] today. The advisors are being given an overview of the current strucutre of our armed forces and the current state of the war with [ITA.GetName]. Hopefully they will be able to help modernize our forces."
 BBA_ethiopia_communist_events.27.desc:0 "[SOV.GetNameDefCap] has back tracked on its commitment to end [ITA.GetName]’s war of aggression. It seems their willingness to go to war was nothing more than a bluff. Now we face the difficult task of bringing this war to an end on our own."
 BBA_ethiopia_communist_events.29.desc:0 "The diplomatic confrontation between [ITA.GetName] and [SOV.GetNameDef] has now subsided with the [ITA.GetAdjective]s agreeing to end their war against us. This is a huge victory against fascism, but it is unlikely to be the end of the struggle. Hopefully we can continue to cooperate with out friends in [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.52.desc:0 "The [ETH.GetAdjective] administration has orchestrated an operation to break our hold over the nations affairs. [SOV.GetAdjective] personnel across [ETH.Capital.GetCapitalVictoryPointName] were escorted by [ETH.GetAdjective] troops to make shift detention centers before [ETH.Getleader] informed our ambassador that [ETH.GetLeader.GetSheHe] would be taking full control of [ETH.GetAdjective] affairs going forward. If we act quickly, we may be able to regain control of the situation. However, the window of opportunity for such action is rapidly diminishing."
 BBA_african_union_events.4.desc:1 "The Organization of African Unity has created an African [ETH_GetCentralBankName] with the mandate to manage a currency for the growing organization. The goal is for all members to share a currency and begin integrating our economies together. This will hopefully have economic benefits in the future, but joining will cause a great deal of problems in the short term as people get used to the new currency."
 BBA_african_union_events.6.desc:1 "[FROM.GetNameDefCap] have agreed to join the [ETH_GetCentralBankName] and have now begun the process of aligning their currency with our own. Soon, trade will be much easier between our nations."
 BBA_african_union_events.8.desc:0 "The government of [FROM.GetNameDef] have agreed to join the Organization of African Unity’s executive council. They are now in the process of signing the appropriate treaties recognizing the councils authority in all legal matters."
 BBA_african_union_events.9.desc:0 "The government of [FROM.GetNameDef] have refused to join the Organization of African Unity’s executive council. [FROM.GetLeader] cites [FROM.GetLeader.GetHerHis] concerns about sovereignty and desire to make make agreements with nations outside of the organization without council approval."
 BBA_italy_missiolinis.71.t:0 "Expand the Airforce"
 BBA_italy_missiolinis.71.desc:1 "Ever since the Duce first formed the Aeronautica, it has become a symbol of national pride and one of the greatest airforces in the world. The only problem is that it’s too small, and the Duce has now been convinced to produce additional aircraft to reinforce the Aeronautica."
 BBA_italy_missiolinis.72.t:0 "A Meager Airforce"
 BBA_italy_missiolinis.73.t:0 "The Airforce Successfully Strengthened"
 BBA_italy_missiolinis.73.desc:0 "Mussolini has taken a personal interest in strengthening the airforce and used the production of new aircraft as an opportunity to showcase Italian industrialism. With the Aeronautica at its center, several pieces of propaganda have been made celebrating Italian aviation and engineering."
 BBA_italy_air_accident.12.desc:1 "While flying to the French border, Chief of Air Force Aldo Pellegrini’s and General Pietro Pintor’s airplane encountered engine problems and started to rapidly lose altitude. Faced with certain death, Pellegrini took the controls and managed to crash land the airplane thanks to his familiarity with Savoia-Marchetti aircrafts. Everyone onboard survived, albeit bruised up. "
 BBA_italy_naval_cooperation_programs.01.a:0 "A benefitial deal!"
 BBA_italy_interaction_events.1.t:1 "[ITA.GetLeader] Demands [151.GetName]"
 BBA_italy_interaction_events.1.desc:0 "In a completely unexpected and outrageous move, the Italian leader [ITA.GetLeader] has defiled our longstanding neutrality by handing us an ultimatum. Within two weeks, we need to hand over the region of [151.GetName] to the Italians, or we will have war. How should we respond?"
 BBA_italy_interaction_events.2.desc:0 "The president of [SWI.GetNameDef] has today announced the end of an era for the country. They will cede the Italian area of [151.GetName] to us, and renounce their claims to any Italian-speaking towns in the region. Today marks a reduction to the size and multi-ethnic values of [SWI.GetName], as they have also subsequently revoked Italian as an official language."
 BBA_italy_interaction_events.3.desc:0 "The nation of [SWI.GetName] has today announced that they will revoke their neutrality by defying our demands to return [151.GetName] to the Italian world. Due to this foolish choice, we are left with no option other than the complete and utter destruction of the Swiss Cantonal system."
 BBA_italy_interaction_events.14.desc:0 "[ITA.GetLeader] has issued demands of security guarantees between our two nations, which is fair enough. The more outrageous part is that [ITA.GetLeader] also requires us to fully demilitarize both [342.GetName] and [339.GetName], which could jeopardize our security, as this would mean for us that we could not set up initial defensive positions for in case we where to be attacked by [ITA.GetName] or any of her allies."
 BBA_italy_interaction_events.15.desc:0 "[FROM.GetName] has agreed to our demands and chosen to completely demilitarize western Anatolia. This means that they will be much weaker, and have no way of putting up an initial resistance where we to attack them."
 BBA_italy_interaction_events.16.desc:0 "[FROM.GetName] has denied our friendly request for security guarantees, and refused us the demilitarization of [342.GetName] and [339.GetName]. This is beyond outrageous, and will have to be dealt with in it's own way."
 BBA_italy_interaction_events.18.desc:0 "[ITA.GetNameDef] has approached us with an enticing offer. They offer us ownership of Rhodes and the Dodecanese islands in exchange for an alliance with them. This is an offer that almost seems to good to be true, but isn't. What shall we do?"
 BBA_italy_interaction_events.21.desc:0 "[ITA.GetNameDef] has approached us with an enticing offer. They offer us ownership of Rhodes and the Dodecanese islands in exchange for an alliance with them. This is an offer that almost seems to good to be true, but isn't. What shall we do?"
 BBA_italy_interaction_events.21.a:0 "That that Greece, we got it first!"
 BBA_italy_interaction_events.26.a:0 "They realize that they cannot match us!"
 BBA_italy_interaction_events.28.desc:0 "Our neighbors to the south-east have asked us to help them fend of a potential German attack against the state of Austria, whose independence they are currently guaranteeing. They ask us to now do the same. How do we respond?"
 BBA_italy_interaction_events.40.desc:0 "Now that territorial concessions have been decided, [ITA.GetName] has initated a process that will bring Italy and France into a military alliance called the Stresa Front. Now is not the time to sit idly by, for France must act in her own best interest and join Italy against the German menace."
 BBA_italy_interaction_events.44.desc:0 "[FROM.GetLeader] has started an initiative to ally with the nation's of South America and unite the Latin cultures under one dominion. This seems like a good opportunity for protection from the [USA.GetNameDef]. How should we respond?"
 BBA_italy_interaction_events.667.a:0 "Blessed be the [FROM.GetAdjective]s!"
 ITA_international_support_consumer_goods_tt:0 "Gains '§Y$ITA_international_aid$§!' which grants ($MODIFIER_CONSUMER_GOODS_EXPECTED_VALUE$: §Y[?ITA_consumer_goods_from_leftist_aid|%]§!) for §Y730§! days."
 BBA_italy_anti_colonialism_events.13.b:0 "Not in this Earth!"
 BBA_switzerland.11.desc_SWI:1 "As the council decided to stay away from the case and leave it to the courts and Grisons law, David Frankurter, who willfully assassinated Wilhelm Gustloff, was sentenced to 18 years of prison. \n\nWe know [?SWI.SWI_fascist_germany.GetNameDef] would've wanted a much more punitive sentence, so our diplomats will have their work cut out for them in order to appease them, but we couldn't risk seeming to take sides in times like these. Our neutrality is what might keep the [SWI.GetAdjective] people safe during the storm that might come."
 BBA_switzerland.13.desc:0 "The representative we sent to advice Gustloff's widow has returned with fantastic news. The verdict from the judges in [SWI.GetName] gave a very harsh sentence to David Frankfurter, close enough to what we requested."
 BBA_switzerland.16.desc:1 "One of our covert agents stationed in [FROM.GetCapitalVictoryPointName] has been approached with proposition from the [FROM.GetAdjective] government; A secret pact between our faction and [FROM.GetNameDef], which will mean they'll help us undermine our enemies in Europe, while keeping up their appearance of neutrality, and even abandoning it in our favor when the time comes.\n\nIt will also mean that we'll go in their defense if they were at risk of being invaded."
 BBA_switzerland.97.desc:0 "Under the guise of a European tour with his musically talented family, a veteran Submarine Captain has crossed our borders from Austria and is offering his services to [ROOT.GetNameDef] in exchange for asylum.\n\nGeorg Von Trapp had an impressive record with the Austro-Hungarian Navy, but since the end of The Great War, the dissolution of the empire and the loss of his fortune, he's performed with his family of singers and musicians. Since [GER.GetNameDef]'s annexation of Austria, he is being pressed into service for them, thus he escaped.\n\nCertainly his family's musical flair will be as appreciated as his naval experience, specially since we find ourselves with a coast and no staff to defend it."
 BBA_switzerland_trade.1.desc:0 "Despite their historical neutrality, [FROM.GetNameDefCap] is seeking to establish a trade agreement with our nation. Either they seek to align themselves with us, or they are more desperate than we thought. \n\nRegardless, we stand to benefit from tapping into their industrial capacity and convenient location without having to go through the ordeal of invading their heavily fortified country. On the other hand, this could mean strengthening their position in the event of an future invasion by [ROOT.GetNameDef]"
 BBA_switzerland_trade.12.desc:0 "This is something that we should have seen coming. They have used their veneer of neutrality to stab us in the back. This will have sever consequences for our economy, we must retaliate."
 BBA_switzerland_trade.15.desc:0 "Unfortunately, we have been informed that [FROM.GetName] will not be investing in the [ROOT.GetAdjective] economy. We stand more isolated that we would want to be, considering the impending danger of Fascism."
 BBA_swiss_expansion.6.b:0 "[ROOT.GetName] will never cede any territory!"
 BBA_swiss_expansion.12.desc:0 "In an unexpected turn of events, [FROM.GetNameDef] is laying claim to the [ROOT.GetAdjective] Alps. Their argument is tenuous at best, but they do have a large portion of their population deployed and ready to invade if we refuse. That and a very favorable terrain for them would make it a long and costly war should we say no, so we must weight our options."
 BBA_swiss_expansion.13.desc:0 "The [FROM.GetAdjective] government has made the right call and conceded that their alpine territories rightfully belong to use. This will guarantee our safety from aggressors further."
 BBA_generic_purchase_ships_events.01.t:0 "[FROM.GetAdjective] Naval Procurement"
 BBA_generic_purchase_ships_events.01.desc:0 "[FROM.GetNameDefCap] have approached us with an offer to procure some of our mothballed naval assets. The assets they are interested in are no longer in service due to their age and lack of modern equipment."
 BBA_generic_purchase_ships_events.01.a:0 "A mutually beneficial agreement."
 BBA_generic_purchase_ships_events.01.b:0 "We can not spare any naval assets."
 BBA_generic_purchase_ships_events.02.t:0 "[FROM.GetNameDefCap] Agree to Naval Procurement"
 BBA_generic_purchase_ships_events.02.desc:0 "[FROM.GetAdjective] diplomats and naval personnel have informed us that they will part with their mothballed equipment we offered to purchase. This will allow us to rapidly expand our fledgling navy."
 BBA_generic_purchase_ships_events.02.a:0 "Excellent news!"
 BBA_generic_purchase_ships_events.03.t:0 "[FROM.GetNameDefCap] Refuses Naval Procurement Deal"
 BBA_generic_purchase_ships_events.03.desc:0 "[FROM.GetAdjective] diplomats have informed us that they are unwilling to part with the mothballed equipment we offered to purchase. It is unclear whether the rejection is due to their own plans for the ships or is intended as a sign of their disapproval for our policies."
 BBA_generic_purchase_ships_events.03.a:0 "Unfortunate."
