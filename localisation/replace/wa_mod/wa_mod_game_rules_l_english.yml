 RULE_ALLOW_ACCESS_BLOCKED_DESC:0 "Countries can never gain military access and docking rights from any other country outside of a subject or faction member."
 RULE_ALLOW_AIR_BASE_ACCESS:0 "Air Base Access"
 RULE_ALLOW_AIR_BASE_ACCESS_FREE_DESC:0 "Countries can gain air base access from any other country."
 RULE_ALLOW_AIR_BASE_ACCESS_SAME_IDEOLOGY_DESC:0 "Countries can gain air base access from countries that share the same ruling ideology."
 RULE_ALLOW_AIR_BASE_ACCESS_BLOCKED_DESC:0 "Countries can never gain air base access from any other country outside of a subject or faction member."
 RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! may not release this country unless first completing the §Y$SOV_autonomous_soviet_republics$§! focus."
 RULE_ALLOW_TAKE_OVER_FACTION_ALLOWED_DESC:0 "Countries may take over faction leadership if they fullfil the criteria."
 PRC_AI_BEHAVIOR:0 "@PRC Communist China"
 RULE_FASCIST_ROM_ALTERNATE_AI_DESC:0 "The Romanian AI will attempt to get the Iron Guard into power and have an alliance with Germany"
 RULE_OPTION_DEFAULT_AI_DESC:0 "The AI will make decisions based on other gameplay settings, such as the option to force historical focuses and other gameplay scenarios. This is the same behavior as in version 1.5 and earlier."
 RULE_FASCIST_JAP_AI_DESC:0 "The Japanese AI will attempt to strike south against the western allies by going down the relevant path in the national focus tree."
 RULE_OPTION_NEUTRALITY_JAP_AI_DESC:0 "The Japanese AI will attempt to strike north against the Soviet Union and make common cause with the Axis by going down the relevant path in the national focus tree."
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:0 "The Hungarian AI will attempt to restore the Austro-Hungarian Empire by going down the relevant path in the national focus tree."
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:1 "The French AI will attempt to form the Little Entente to contain Germany. Should Czechoslovakia create that faction, they will join it instead."
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC:0 "The Hungarian AI will attempt to become a constitutional monarchy by going down the relevant path in the national focus tree."
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "The Czechoslovakian AI will attempt to to remain democratic and focus predominantly on its internal development by going down the relevant paths of the national focus tree."
 RULE_FASCIST_ROM_AI_DESC:0 "The Romanian AI will attempt to follow history and join the Axis by going down the revelent paths of the national focus tree."
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "The AI will attempt to remain democratic and establish full sovereignity by going down the relevant path in the national focus tree."
 RULE_OPTION_LEFT_OPPOSITION:0 "Trotsky (§GAI has been tested§!)"
 RULE_OPTION_LEFT_OPPOSITION_SOV_AI_DESC:0 "The Soviet AI will try to re-instate Trotsky, select this if you want a bigger challenge when playing as Germany."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Supreme Soviet"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "The Soviet AI will try to re-instate Trotsky and then the Supreme Soviet, select this if you want a bigger challenge when playing as Germany."
 RULE_OPTION_HISTORICAL_POL_AI_DESC:0 "The Polish AI will attempt to follow the historical chain of events as much as posible."
 RULE_OPTION_INDEPENDENCE_MAN_AI_DESC:0 "The Manchu AI will attempt to break free and take over all of China by going down the relevant bracnh of the national focus tree."
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "The British AI will attempt to make concessions to the Trade Unions and become communist, by going down the revelant path in the national focus tree."
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC:0 "The Soviet AI will expell the Communists through civil war, and reinstate Tsarist Russia, by going down the relevant path in the national focus tree."
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC:0 "The Soviet AI will expell the Communists through civil war, and establish a fascist government, by going down the relevant path in the national focus tree."
 RULE_HISTORICAL_ETH_AI_DESC:0 "The Ethiopian AI will attempt to defeat Italy using the Legaue of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild Ethiopia."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "The AI will will try to convince states around Switzerland to join the confederation, and will arm the country in preparation for owner of those states refusing to let their states be free."
 RULE_OPTION_NOR_STALINIST_AI_DESC: " The AI will attempt to increase the popularity of Communism, while aligning Norway to Stalin's Soviet Union, or the biggest Non-Trostkyist Communist country if Stalin has been ousted."
 RULE_OPTION_NOR_FASCIST: "Fascist"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "The AI will let Fascism's influence grow over time, and will eventually align with The Third Reich, or the biggest fascist country if Germany is no longer Fascist."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC: "The AI will largely follow the Historical path, but will attempt to stave of Anschluss by any means possible, fighting tooth and claw for their independence until the bitter end. This might present a challenge or delay to the outbreak of the war"
