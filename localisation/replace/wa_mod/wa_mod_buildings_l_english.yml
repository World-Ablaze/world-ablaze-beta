 hydro_steel_refinery_desc:0 "Steel Milling is made cheaper via a hydro-powered facility. However, it requires a larger initial investment in the form of construction cost. §Y(CONSUMES §!§R5 COAL£GFX_coal_texticon §Y AND §!§R25 IRON§!§Y)§!\n"
