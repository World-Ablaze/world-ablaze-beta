l_english:
 generic.10.d:0 "Our allies have used the world's first nuclear weapon, firmly placing our alliance in the lead of the current arms race. Though we have been outmatched, the weapon is mastered by our ally, ensuring our ability to retaliate should any enemy master the atom themselves."
 wtt_britain.27.d:0 "The French have rejected our demands. We are now left with the an unenviable choice of backing down or turning on our erstwhile allies..."
 wtt_britain.30.d:0 "The American government, with the gracious support of the American Committee for Defense of British Homes, has sent us an emergency shipment of old rifles, equipment, and some artillery pieces. It is too varied an assortment to be of true use for our army, but they will no doubt go a long way to hastily equipping the Home Guard garrissons."
 wtt_germany.4.d:0 "In the midst of extatic celebrations, Wilhelm II has returned as Kaiser to the German Empire! The Netherlands is owed a debt of gratitude for allowing him safe refuge these past decades, and for refusing his extradition to our former enemies on multiple occasions. Though the nation has suffered much in the recent civil war, it is hoped that the Kaiser's return will bring further stability and unity."
 wtt_germany.8.d:0 "[From.GetNameDefCap] has approached pro-monarchy and anti-fascist elements of the Italian government and the underground with plans for the assassination of Mussolini and the institution of Victor Emmanuel III as leader of the nation. The Germans ensure us they can handle the assassination; all we have to do is affirm our willingness to create a replacement government, and to pledge our future military support to German endeavours."
 wtt_germany.9.d:0 "Elements in the Italian government and underground have accepted our proposal for a coup. They are making preparations for a swift siezure of power for the King, as soon as the assassination has happened."
 wtt_germany.11.d:0 "The German plan has been put in action and Mussolini was shot in his car in the streets of Rome today. King Victor Emmanuel III has taken the reins of the nation, and has pledged to join the Central Powers alongside [From.GetNameDef]."
 wtt_germany.12.d:0 "Our plan has been executed flawlessly, and Victor Emmanuel III has taken up the mantle of leadership of his nation. His first act was to sign a treaty ensuring Italian entry into the Central Powers alliance."
 wtt_germany.14.d:1 "[From.GetNameDefCap] has approached us with an offer that they say may benefit both parties. In light of the current political situation, and the threat on our Eastern border, the Germans propose to issue a guarantee that they will come to our military aid in the event that we come to war with the Soviet Union. In return, they only ask for the return of their lost territories of Danzig and Poznan."
 wtt_germany.15.d:1 "The Poles have decided to accept our offer, and have made arrangements to transfer their border provinces to us. They have put their faith in us, and urge us to stand ready in case of Soviet aggression.."
 wtt_germany.17.d:0 "The German government has cracked down on communism, and has banished them abroad. As a result, we are now receiving a large influx of communist ideologues from our neighbour..."
 wtt_germany.20.a:0 "They better stay our of our sphere of influence!"
 wtt_germany.38.t:0 "Germans Demand Return of Qingdao"
 wtt_germany.38.desc:0 "The German Empire has spewed more and more rhetoric lately, urging for a return to colonialism. They have now, through diplomatic channels, issued a demand for the return of their old enclave in Qingdao. Perhaps we can use this to come to a lucrative arrangement..."
 wtt_germany.56.desc:0 "Our war with the Soviet Union is not proceeding well, and we risk losing everything. To our West, Germany has undergone rapid changes the last few years, but is now a stalwart defender of democratic values. Arranging a quick return of the old German Territories of Danzig and Poznan would undoubtedly save millions from oppression under the Soviet boot."
 wtt_germany.62.b:0 "MEFO Bills?"
 wtt_germany.63.desc:0 "The [GER.GetAdjective] government has issued legislation stipulating the reintegration of Alsace-Lorraine, Eupen Malmedy, Nord Schleswig, Western Poland and the integration Luxemburg into the [GER.GetName]. Mass drafting of our population has already begun..."
 wtt_germany.64.t:0 "[GER.GetName] Integrates Luxemburg"
 wtt_germany.71.desc:0 "Both our neighboring Austro-Hungarian successor states have accepted the proposed re-integration of their lands into our nation, and thereby re-forming into the Austro-Hungarian Empire. The signing of the treaty of re-unification has been greeted by extatic masses in the streets, and the [GER.GetAdjective] government has eagerly welcomed us back into their alliance."
 wtt_germany.76.t:0 "[GER.GetName] Reintegrates Eupen Malmedy"
 wtt_germany.76.a:0 "What can we do?"
 wtt_germany.77.t:0 "[GER.GetName] Reintegrates Nord Schleswig"
 wtt_germany.77.a:0 "What can we do?"
 wtt_germany.78.t:0 "[GER.GetName] Reintegrates Parts of Poland"
 wtt_germany.78.a:0 "What can we do?"
 wtt_germany.1000.a_tt:1 "Princess Victoria Louise is sent ahead to aid in the preparations of this grand ceremony. This will tax our government's resources somewhat.\n"
 wtt_news.1000.a:0 "A terrible tragidy... With unexpected results."
 wtt_news.5.desc:0 "Reports from Rome indicate Il Duce was shot and killed in broad daylight earlier today, in the streets of the city. Concurrently, elements in the government have made moves to seize power from the Italian fascists. A wave of arrests was made, and military units cordoned off government buildings and streets, instating a curfew.\n\nSpokesmen of the coup government have announced their loyalty to Victor Emmanuel III, and in his first act as leader of Italy the King signed an alliance treaty with the German Empire."
 wtt_news.11.desc:0 "With the invitation of one of their border states to the [GER.GetFactionName], the Soviet government has warned in no unclear terms against further interference in the affairs of 'their sphere of influence'.\n\nUncomfirmed reports have indicated a mobilization of the Soviet military forces, possibly preparing for war."
 wtt_news.12.desc:0 "In response to the German decision to allow the return of Wilhelm II, [FRA.GetNameDef] and [Eng.GetNameDef] have declared war on [GER.GetNameDef]. The French and British cite the 'flagrant German obstinacy' in allowing a 'known war criminal' to become head of state once again as the cause of this escalation.\n\nSpokesmen of their respective governments argue that it is utterly immoral to allow the 'key instigator' of the Great War to assume the German Crown once again, and that the German government has ignored all warnings. 'We had no other choice'."
 wtt_news.19.t:0 "Poland Returns Danzig and Poznan"
 wtt_news.19.desc:0 "In face of the continued Soviet onslaught, the Polish government this morning announced the immediate return of the old German territories of Danzig and Poznan to [GER.GetNameDef].\n\nDespite utter silence on the part of the Polish or German governments on the reasons why, experts agree it most likely is an attempt to keep these territories out of Soviet hands, in the face of imminent Polish military collapse."
 wtt_news.20.desc:1 "In light of increased perceived Soviet aggression, the [GER.GetName] has offered "states under immediate threat from communism" a chance to form an alliance against the [SOV.GetName]. Any country in the alliance will be committed to fighting a war against the [SOV.GetName], should there come a time when a member is attacked."
 wtt_news.21.t:0 "[From.GetName] Speaks Out Against Soviet Union"
 wtt_news.21.desc:0 "The German government has stepped up its rhetoric against the Soviet Union, warning that Europe's Eastern Neighbor is a "Great Red Menace" that looms over the continent. Whether it is fear-mongering or has a basis in fact is disputed, but it certainly seems like the Germans are aiming to unite the continent against the East."
 wtt_news.21.a:0 "The world must know of the Soviet threat!"
 wtt_ledo_road.4.desc:0 "The first supply convoy through the reopened Ledo road has reached Yunnan today. While it will take time until traffic flows smoothly again, supplies are once again reaching us."
 wtt_hanoi_route.4.t:0 "[From.GetNameDefCap] Reopens the Hanoi Route"
 wtt_hanoi_route.4.desc:0 "The first supply convoy through the reopened Hanoi road has reached Yunnan today. While it will take time until traffic flows smoothly again, supplies are once again reaching us."
 wtt_hanoi_route.4.a:0 "Great news!"
 wtt_china.1.t:0 "China Demands Subjugation"
 wtt_china.1.b:0 "Let him try."
 wtt_china.10.t:0 "China Demands Subjugation"
 wtt_china.12.desc:0 "Our diplomatic note to [From.GetNameDef] has apparently been leaked to the press, which is now in an uproar. Even the international news papers have written very unfavorable editorials, calling our reasonable requests of consultation "meddling in internal affairs", "a dangerous precedent" and even "naked imperialism". \n\nNeedless to say, the [From.GetAdjective] government has refused to discuss the matter any further and has indicated that bringing it up again would lead to suspension of diplomatic contacts entirely."
 wtt_infiltration.4.desc:0 "Reports of a wide-spread communist infiltration seems to have been grossly exaggerated. Raids on a number of known hideouts and communist activists have turned up nothing. This either means that the Communists have been unable to organize any cells, or that we have crushed the ones they managed to create. We must remain vigilant, however, as they will no doubt try to lull us in a sense of security before begining their efforts anew."
 wtt_infiltration.6.desc:1 "Enemy forces have begun their attack on our Base Area in [infiltrated_state.GetName]. No messages have been received from our comrades in the state, but the enemy press is reporting the conclusion of the "[infiltrated_state.GetName] Encirclement and Erradication Campaign". We must assume the worst."
 wtt_infiltration.10.desc:0 "Things are afoot in the Communist Party. Our intelligence serives have intercepted a number of couriers moving between base areas, carrying secret orders talking about "The Revolutionary Counterstroke" being prepared in secret bases all across the country. Soldiers and supplies are being gathered for a major operation - perhaps even a nation-wide uprising. We must make preparations immediately."
 CHI_xian_warlords_upset:0 "This will upset the warlords. They may decide to leave your faction, refuse your attempts to control them and will remember this slight in the future."
 wtt_xian_incident.4.a:0 "We still remember how the last one went."
 wtt_xian_incident.4.b:0 "Perhaps he is right."
 wtt_xian_incident.7.d:0 "Killing him now would lead to a war we can not win. Let him go."
 wtt_xian_incident.8.a:0 "They wouldn't harm him. Let's wait."
 wtt_xian_incident.8.b:0 "Send in the troops!"
 wtt_china_shared.2.desc:0 "In a private conversation, government officals from [From.GetNameDef] have expressed great interest in what we can do to support an independent state. Funds have been made available for groups advocating greater independence, and we have begun organising a "Provisional Free [From.GetAdjective] Government in Exile"."
 wtt_china_shared.4.desc:0 "It appears that [From.From.GetLeader]'s recent visit to [From.GetNameDef] was not just an exchange of niceties over tea. Recently, the previously separate and splittered independence movements in the country have started to coordinate in a much better fashion. It almost appears as if someone is helping them organise from abroad."
 wtt_china_shared.10.desc_a:0 "Soong Mei-Ling, Wife of Chiang Kai-Shek and one of his most trusted advisers, has travelled to Washington to lobby for increased support to China in its struggle against Japan. The Chinese Air Force is in desperate need of modern planes and skilled pilots to fly them.\n\nSoong's appeal has resonated with the gernal public, and a number of our pilots have resigned from the service to sign up at a Chinese company to provide "Training and Instruction" to Chinese pilots.\n\nWith the issue of pilots resolved, Soong Mei-Ling has approached us with a request to allow the transfer of about 150 of our most modern fighters to reequip the Chinese Air Force."
 wtt_prc.12.desc:0 "For reasons passing understanding, [From.GetLeader] has refused to cooperate with us on even the most basic matters. He claims that we are nothing but a group of bandits that will be erradicated soon enough, and has called on other warlords to join him in opposition."
 wtt_prc.23.desc:0 "Sometime during the last night, a major railway bridge in [JAP.GetManchuriaPuppet] collapsed under the weight of a passing ammunition train. Rescue and recovery efforts have been made difficult by the secondary exposions from the ammunition. The crew of the train is still missing, presumed dead.\n\nMilitary Intelligence has dispatched a team to investigate the site as soon as it is safe to do so, to find out how a sturdy bridge could collapse with no warning signs.\n\nLocal witnesses report seeing a small group in the valley below the bridge on the day before the collapse. Their whereabouts are currently unknown."
 wtt_japan.22.desc:0 "The process of exchanging our right-leaning generals and civil servants for the left-leaning ones we had previously sent into unofficial exile in [From.GetNameDef] has now beeen completed."
 wtt_japan.126.desc:2 "[From.GetAdjective] officials have approached us with a peace offer. They will leave the continent altogether, in return for an immediate cessation of hostilies."
 wtt_japan.127.desc:1 "[From.GetNameDef] has accepted our peace offer, and has ceased hostilies in return for our continental possessions."
 wtt_japan.131.desc:1 "The Republic of China is demanding that we return the territory in china we took while fighting the Japanese. These lands are the emperor's by divine right, but it may be better to concede for now."
 wtt_japan.131.t:0 "The republic demands territory."
 wtt_japan.131.a:0 "We must retreat for now."
 wtt_japan.131.b:0 "The emperor bows to no one."
 wtt_news.26.t:0 "Phillipine Independence"
 wtt_news.27.d:0 "A sudden turn of events.""
 wtt_news.33.desc:0 "Following a meeting between [CHI.GetLeader] and [PRC.GetLeader], the later has decried what he calls "a blatant and transparent attempt to co-opt the Red Army for Nationalist and counter-revolutionary purposes." [CHI.GetLeader] has refused to comment on the issue, saying only that the Nationalist armies stand ready to defend China from any attacker. \n\nReportedly, the two leaders discussed the possibility of forming a United Front against Japan.\n\nWhether this breakdown leads to a renewal of the conflict between the two parties remains to be seen."
 wtt_news.34.desc:0 "Following a Chinese appeal for American pilots and mechanics to join a volunteer outfit, US President [USA.GetLeader] has officially approved the transfer of more than a hundred modern fighter planes to the Chinese Air Force. Pilots in the US Army, Navy or Marine Corps are also given leave to join this unit.\n\nThe first ships carrying the new fighters are supposed to leave as soon as the necessary equipment is assembled. Congressional leaders have expresseed concern that skirting the edges of international law like this will invite repercussions."
 wtt_soviet_hold_city_t_success:0 "[state.GetName] Stands"
 wtt_soviet_hold_city_d_success:0 "Despite the enemy onslaught, the defenders of [state.GetName] have stood firm and held the enemy at bay. The invaders have bled themselves white on the defenses, paying a hefty price for every centimeter of ground taken. The tales of the Heroes of [state.GetName] will be remembered for generations to come!"
 wtt_soviet_hold_city_o_success:0 "[state.GetName] shall remain ours!"
 wtt_soviet_hold_city_t_fail:0 "[state.GetName] Falls"
 wtt_soviet_hold_city_d_fail:0 "Mobilizing all available forces, the [controller.GetAdjective] invaders smashed our defenses outside [state.GetName]. [controller.GetAdjective] forces have entered the city. While our defenders are engaging the enemy in vicious street battles, the city is expected to fall within days."
 wtt_news.44.desc:0 "Wearing richly decorated robes befitting an Emperor of China, [MAN.GetLeader], Son of Heaven, Lord of Ten Thousand Years, Emperor of the Great Qing Dynasty, has taken the Dragon Throne in an unusual second Coronation ceremony and now resides inside the Forbidden City as his ancestors did. Referencing the old customs, [MAN.GetLeader] claims that the victory of his forces in the Chinese Civil War proves that he has a Manadate from heaven to lead China.\n\nWhether he intents to spread his rule until it encompasses 'All under Heaven', as previous Emperors claimed, remains to be seen."
 wtt_news.45.desc:1 "Following an extensive Power Struggle between [old_leader.GetLeader] and [new_leader.GetLeader], the former has finally conceeded defeat and met with [new_leader.GetLeader] in his residence. After a mere two hours of negotiations, [old_leader.GetLeader] has evidently accepted a proposal to transfer power to [new_leader.GetLeader] and step down as Premier of the Republic. \n\nGroups of supporters of the two leaders had previously gathered outside the house, prompting fears of violent clashes between the two sides depending on the outcome.\n\nHowever, no violence has been reported and it appears that the transition of power has been fairly smooth."
 wtt_news.51.desc:0 "German radio announced today that traitorous elements of the military have attempted a coup. Following an explosion at the Führer Headquarters which miraculously only slightly injured Hitler and wounded several others, army units attempted to seize control of several government offices in Berlin. \n\nNews of [GER.GetLeader]'s survival spread quickly, and most units under control of the putschists have since returned to their barracks.\n\nA number of high-ranking German officers commited suicide in the wake of the failed attempt rather than face the indignity of a trial in front of the infamous "People's Court"."
 wtt_news.57.t:1 "Rebirth of [From.GetNameDef]"
 wtt_news.67.desc:0 "With the [From.GetOldAdjective] conquest of most of what constitutes the Arab world, the government has seized upon a renewed wave of Pan-Arabism spreading through the region. As international disagreements have been 'solved' through the outright removal of obstinate foreign governments through military means, Arab unification has seemed within easy reach, and the [From.GetOldAdjective] government has already shown its willingness to pursue this goal.\n\nWhether merely to 'ride the wave' of this public goodwill, to appeal as a home to all Arabs, or simply to facilitate regional integration, [From.GetOldAdjective] officials have now confirmed that the nation's official name shall be changed to '[From.GetNameDef]'."
 wtt_news.68.desc:0 "As the [From.GetOldAdjective] nation grows into its neighbours, government attempts at creating historical continuity have become more and more apparent, evidently in an attempt to unify the people. The achievements of the Majapahit Empire have been strongly romanticized, but incessant propaganda seems to be having an effect on public opinion.\n\nToday, the [From.GetOldAdjective] government has taken this one step further and re-named the country to '[From.GetNameDef]' in homage to the region's history, hoping that it is something everyone in the region can relate to."
 wtt_news.70.desc:0 "Under the rulership of Kaiserin Victoria, [From.GetOldNameDef] has greatly expanded their borders, surpassing even those of the old Holy Roman Empire. All continental foes that would challenge her rule have been brought to their knees by the [From.GetOldAdjective] military machine, leaving her unopposed to pursue her policies further.\n\nNow, the Kaiserin has decreed that the current opportunity shall be seized, and that the nation shall become the spiritual successor of the Holy Roman Empire. To represent this, the nation has now been officially renamed, and with it she has at last achieved the political unification of the region that has eluded the Emperors for centuries."
 wtt_warlord_vs_prc.1.desc:1 "A delegation from [warlord.GetLeader] has arrived in Moscow to sound us out about possible support in an internal party power struggle. They claim that [communist_china.GetLeader] is not sufficiently commited to the cause of communism and may, in fact, harbor reactionary thoughts and betray the revolution in its most critical phase.\n\n[warlord.GetLeader] instead proposes that we back him, promising eternal and undying loyalty to the communist cause in general and [SOV.GetLeader] in particular."
 wtt_warlord_vs_prc.10.desc:0 "Faced with the choice between giving up power or calling the Soviet bluff, [communist_china.GetLeader] choose the latter. Unfortunately, it seems that [SOV.GetLeader] was not bluffing and hostilities have commenced. Given our precarious position, we have been subjected to intense pressure by both sides, with the Soviets demanding we help them in ousting the traitor.\n\nRefusal, they say, would be the same as chosing to side with [communist_china.GetLeader]."
 wtt_warlord_vs_prc.33.desc:0 "Although receptive of the idea, [From.GetLeader] has politely but firmely declined our demand of being allowed to influence their policies more directly. It would seem that we are 'unfamiliar' with the conditions on the ground and should leave implementation of Marxist teachings to the local experts."
 wtt_manchukou.1.desc:0 "It appears that [From.GetLeader] has made the decision to finally spread his authority to the far areas of China. A representative from the [From.GetAdjective] Government has arrived, demanding that we bow to the one true Emperor of China, the Son of Heaven, [From.GetLeader]. Refusing to do so, he continued, would be punished as treason of the higest order."
 wtt_manchukou.11.desc:0 "The new Five Year Plan detailing how our government expects to grow the economy over the coming years is slowly coming together. Significant differences still exist between the various departments about where the main focus should be. \n\nWhile a consensus exists that an expansion of the heavy industry should be the goal, what these new factories should be producing is still under discussion. \n\nA decision must be made to break the deadlock."
 wtt_manchukou.11.a:0 "Build up our resource excavation"
 wtt_manchukou.11.b:0 "Invest in metal refining"
 wtt_manchukou.11.c:0 "A general program of military Industrialization"
 wtt_manchukou_bandit_sabotage.21.desc:0 "Reports have come in from one of our factories in [state.GetName], reporting that a major fire broke out last night. Local firefighters are still tackling the blaze, but are confident that they will have the fire under control by the end of the day. The damage to the factory appears to be significant, as the fire appears to have started in the storage area for highly flammable chemicals.\n\nMilitary Intelligence has started a thorough investigation to find out how the fire could break out despite the strictest safety measures. First leads indicate arson as a strong possibility."
 wtt_manchukou_bandit_sabotage.23.desc:0 "Sometime during the last night, a major railway bridge in [state.GetName] collapsed under the weight of a passing ammunition train. Rescue and recovery efforts have been made difficult by the secondary exposions from the ammunition. The crew of the train is still missing, presumed dead.\n\nMilitary Intelligence has dispatched a team to investigate the site as soon as it is safe to do so, to find out how a sturdy bridge could collapse with no warning signs.\n\nLocal witnesses report seeing a small group in the valley below the bridge on the day before the collapse. Their whereabouts are currently unknown."
 generic.17.t:0 "[From.GetName] Falls Ill"
 generic.17.d:0 "In [From.GetHerHis] service to [From.From.GetNameDef], it seems [From.GetRank] [From.GetName] has pushed [From.GetHerselfHimself] too far. As a result of the bad climate in their operational area, the [From.GetRank] has now fallen ill, and will likely need some time to recover. Until [From.GetSheHe] gets well, [From.GetSheHe] will not be performing at [From.GetHerHis] usual level."
 generic.18.t:0 "[From.GetName] Wounded"
 generic.18.d:0 "In bringing the battle to a successful conclusion, it seems [From.GetRank] [From.GetName] put [From.GetHerselfHimself] at a bit too much risk while leading [From.GetHerHis] men. [From.GetSheHeCap] has been wounded, and it will likely take some time for the wounds to fully heal, until which time the [From.GetRank] will not be performing at [From.GetHerHis] usual level."
 japan_border_conflict.1.desc:0 "As part of maintaining the demarkation line on the border between us and [JAP.GetNameDef], a work party was sent out to check the demarcation markers near Lake Khasan. When approaching the border, the work party was taken under fire by a local Japanese outpost. \n\n We have lodged a formal diplomatic protest, but the Japanese ambassador maintains that the work party was sent to move the markers to allow us to claim more territory.\n\nThe Japanese have assured us that they will respect the border but will not allow any "tampering" with the current demarcation and will respond with force should we attempt to do so.\n\n This effectively means that we can no longer move freely about our territory in the area."
 japan_border_conflict.2.t:0 "Japanese Victory at Khalkhin Gol"
 japan_border_conflict.2.desc:0 "Following a clash between [SOV.GetAdjective] and Japanese forces in the border area around Khalkhin Gol, the [SOV.GetAdjective] forces are reportedly in full retreat. Japanese units have occupied a number of strategic hills around the area and begun to fortify their positions.\n\nDuring the battle, the Japanese captured a number of [SOV.GetAdjective] tanks, which have been shipped to Tokyo for evaluation."
 japan_border_conflict.3.t:0 "Japanese Defeat at Khalkhin Gol"
 japan_border_conflict.3.desc:0 "Following a clash between [SOV.GetAdjective] and Japanese forces in the border area around Khalkhin Gol, the Japanese ambassador in Moscow has requested a cease-fire. \n\n Several Japanese assaults on [SOV.GetAdjective] positions failed with heavy casualties during the battle, raising concerns in the Japanese military about the capabilities of their forces."
 japan_border_conflict.5.desc:0 "Fighting continues between Japanese and [SOV.GetAdjective] forces around Lake Khasan. In an effort to break the dealock, Japanese forces in other areas have also started to engage [SOV.GetAdjective] forces in that sector. Intelligence suggests that the Japanese may soon reinforce the attack with fresh troops transfered from other parts of their Empire."
 japan_border_conflict.7.t:0 "[JAP.GetAdjective] Victory at Lake Khasan"
 japan_border_conflict.7.desc:0 "Following a clash between [SOV.GetAdjective] and [JAP.GetAdjective] forces in the border area around Khalkhin Gol, the [SOV.GetAdjective] forces are reportedly in full retreat. [JAP.GetAdjective] units have occupied a number of strategic hills around the area and begun to fortify their positions.\n\n"
 japan_border_conflict.7.a:0 "The [SOV.GetName] is weaker than we thought!"
 japan_border_conflict.7.b:0 "The leadership of the far eastern fronts have failed us for the last time!"
 japan_border_conflict.8.t:0 "[JAP.GetAdjective] Defeat at Lake Khasan"
 japan_border_conflict.8.desc:0 "Following a clash between [SOV.GetAdjective] and [JAP.GetAdjective] forces in the border area around Lake Khasan, the Japanese ambassador in Moscow has requested a cease-fire. \n\n Several Japanese assaults on [SOV.GetAdjective] positions failed with heavy casualties during the battle, raising concerns in the Japanese military about the capabilities of their forces."
 japan_border_conflict.8.a:0 "It is better to fail with honor than never to try at all."
 japan_border_conflict.8.b:0 "Our forces have acquitted themselves well."
 JAP_khalkhin_gol:0 "Soviets Tested"
