l_russian:
 AUS_political_events.114.t: "[FROM.GetNameDef] предлагает промышленную помощь"
 ww_congo.19.d: "Недавно правительство Свободного Конго в Стэнливиле начало войну за независимость от бельгийских властей. Спустя некоторое время повстанцы одолели колониальные войска и захватили важнейшие города страны, после чего объявили о независимости. Теперь новообразованное государство и его прежние угнетатели стремятся заключить мирное соглашение..."
 congo_independence_struggle.3.d: "С нами связались дипломаты из [BEL.GetNameRuGen]. Они признают, что эпоха колониального владычества подходит к концу, а потому предлагают нам вступить в [Bel.GetAdjective]ое содружество, где нам будет отведена роль равнозначного партнера, свободной и независимой нации. Однако, как и другие участники военного альянса, мы будем обязаны вместе участвовать в войнах.\n\nПожалуй, это было бы самым дипломатичным решением. Мы отстоим гордость и независимость Африки, не проливая ради этого кровь наших европейских друзей."
 congo_independence_struggle.5.d: "С нами связался новый посол [COG.GetNameRuGen]. Он сообщил, что правительство согласно освободиться от [BEL.GetAdjective]ой власти в обмен на вступление в [BEL.GetAdjective]ое содружество на правах полноправного и равного члена. Теперь нужно вывезти администрацию из министерства по делам колоний и назначить ее обязанности новому правительству."
 congo_independence_struggle.20.d: "Мы предприняли все меры, необходимые для сдерживания стремительно ухудшающейся обстановки, в том числе — систематическую чистку рядов «Форс Пюблик» от предателей. К сожалению, такой поступок был воспринят мятежниками враждебно, и они открыли огонь по офицерам, как только увидели, что те приближаются. Эти выстрелы ознаменовали начало войны за независимость — процесса, который уже не контролирует ни одна из сторон.\n\nРегионы, больше всего выигравшие от колонизации, сохранили верность метрополии, однако большинство населения страны ополчилось против нас."
