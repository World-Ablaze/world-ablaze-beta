l_russian:
 wtt_britain.30.d: "Американское правительство при любезной поддержке Американского комитета по защите британских домов срочно выслало нам партию старых винтовок, снаряжения и несколько артиллерийских орудий. Груз слишком разнороден, чтобы оказаться по-настоящему полезным для регулярной армии, но он, несомненно, очень поможет в спешном вооружении гарнизонов местной самообороны."
 wtt_germany.8.d: "[From.GetNameDefCap] обратился к промонархическим и антифашистским элементам итальянского правительства и подполья с планами убийства Муссолини и назначения Виктора Эммануила III лидером нации. Немцы уверяют нас, что справятся с убийством; все, что нам нужно сделать, это подтвердить нашу готовность создать новое правительство и пообещать нашу будущую военную поддержку усилиям Германии."
 wtt_germany.11.d: "Немецкий план был приведен в действие, и сегодня Муссолини был застрелен в своей машине на улице Рима. Король Виктор Эммануил III взял на себя бразды правления нацией и пообещал присоединиться к Центральным державам вместе с государством [From.GetNameDef]."
 wtt_germany.12.d: "Наш план был выполнен безупречно, и Виктор Эммануил III взял на себя руководство страной. Его первым действием было подписание договора, гарантировавшего вступление Италии в альянс Центральных держав."
 wtt_germany.14.d: "[From.GetNameDefCap] обратился к нам с предложением, которое, по его словам, может принести пользу обеим сторонам. В свете сложившейся политической ситуации и угрозы на нашей восточной границе немцы предлагают дать гарантию того, что они придут к нам на военную помощь в случае, если мы вступим в войну с Советским Союзом. Взамен они просят лишь вернуть утраченные территории Данцига и Познани."
 wtt_germany.15.d: "Поляки решили принять наше предложение и договорились о передаче нам своих приграничных провинций. Они поверили в нас и призывают быть готовыми к советской агрессии."
 wtt_germany.38.t: "Германия требует возвращения Циндао"
 wtt_germany.38.desc: "Германская империя в последнее время усилила свою воинственную риторику, побуждая нас вернуться к временам колониализма. По дипломатическим каналам немцы сейчас распространяют требование вернуть свой старый анклав в Циндао. Возможно, с его помощью нам удастся заключить выгодное соглашение..."
 wtt_germany.62.b: "Векселя «МЕФО»?"
 wtt_germany.63.desc: "Правительство [GER.GetAdjective] издало закон, предусматривающий реинтеграцию Эльзаса-Лотарингии, Эйпен-Мальмеди, Северного Шлезвига, Западной Польши и интеграцию Люксембурга в [GER.GetName]. Массовый призыв нашего населения уже начался..."
 wtt_germany.64.t: "[GER.GetName] интегрирует Люксембург"
 wtt_germany.71.desc: "Оба наших соседних государства, преемники Австро-Венгрии, приняли предложение присоединиться к нам и восстановить таким образом Австро-Венгерскую империю. Широкие массы встретили подписание договора праздничным ликованием на улицах, а [GER.GetAdjective] правительство поздравило нас с тем, что мы снова вошли в их альянс."
 wtt_germany.76.t: "[GER.GetName] реинтегрирует Эйпен-Мальмеди"
 wtt_germany.76.a: "Что мы можем сделать?"
 wtt_germany.77.t: "[GER.GetName] реинтегрирует Северный Шлезвиг"
 wtt_germany.77.a: "Что мы можем сделать?"
 wtt_germany.78.t: "[GER.GetName] реинтегрирует части Польши"
 wtt_germany.78.a: "Что мы можем сделать?"
 wtt_germany.1000.a_tt: "Помогать в подготовке грандиозной церемонии было поручено принцессе Виктории-Луизе. Это до некоторой степени истощит наши ресурсы.\n"
 wtt_news.5.desc: "По сообщениям из Рима, Иль Дуче был застрелен сегодня средь бела дня на улицах города. Одновременно с этим некоторые элементы в правительстве предприняли шаги по захвату власти у итальянских фашистов. Была произведена волна арестов, а военные части оцепили правительственные здания и улицы, введя комендантский час.\n\nПредставители правительства переворота заявили о своей лояльности Виктору Эммануилу III, и в своем первом акте в качестве лидера Италии король подписал союзный договор с Германской империей."
 wtt_news.12.desc: "В ответ на решение Германии вернуть Вильгельма II [FRA.GetNameDef] и [Eng.GetNameDef] объявили ей войну. Французы и англичане заявили о «вопиющем упрямстве» немцев, которые позволили «известному военному преступнику» снова встать во главе своего государства и тем самым обострили обстановку.\n\nПредставители этих стран утверждают, что позволить «разжигателю Великой войны» вновь надеть корону – это крайне безнравственно, и что правительство Германии проигнорировало все предупреждения. «У нас нет иного выбора»."
 wtt_news.20.desc: "В свете возросшей воспринимаемой советской агрессии [GER.GetName] предложил «государствам, находящимся под непосредственной угрозой со стороны коммунизма» шанс сформировать русский союз против [SOV.GetName]. Любая страна в альянсе будет привержена ведению войны против [SOV.GetName], если наступит момент, когда член альянса подвергнется нападению."
 wtt_news.21.t: "[From.GetName] порицает Советский Союз"
 wtt_news.21.desc: "Правительство Германии усиливают свою риторику против Советского Союза, предупреждая своих восточноевропейских соседей о нависшей над континентом «Великой красной угрозе». И хотя по поводу правомерности такого заявления могут быть сомнения, ясно одно – Германия намерена объединить Европу и настроить её против Востока."
 wtt_news.21.a: "Мир должен узнать о советской угрозе!"
 wtt_ledo_road.4.desc: "Первый конвой с припасами по вновь открытой дороге Ледо прибыл сегодня в Юньнань. Хотя пройдет время, прежде чем движение снова наладится, поставки снова дойдут до нас."
 wtt_hanoi_route.4.t: "[From.GetNameDefCap] вновь открывает Ханойский маршрут"
 wtt_hanoi_route.4.desc: "Первый конвой с припасами по вновь открытой дороге в Ханой прибыл сегодня в Юньнань. Хотя пройдет время, прежде чем движение снова наладится, поставки снова дойдут до нас."
 wtt_hanoi_route.4.a: "Отличные новости!"
 wtt_china.1.t: "Китай требует подчинения"
 wtt_china.1.b: "Пусть попробует."
 wtt_china.10.t: "Китай требует подчинения"
 wtt_china.12.desc: "Содержание нашей дипломатической ноты государству [From.GetNameDef], по всей видимости, просочилось в прессу, вызвав настоящий скандал. Даже международные газеты напечатали довольно неблагоприятные статьи, называя наши разумные требования «вмешательством во внутренние дела», «опасным прецедентом» и даже «оголтелым империализмом». \n\n[From.GetAdjective] правительство, естественно, отказалось от дальнейших обсуждений и дало понять, что в случае повторения подобного полностью приостановит дипломатические контакты."
 CHI_xian_warlords_upset: "Это рассердит местных правителей. Они могут оставить вашу сторону, отвергнуть ваши попытки установить контроль над ними и припомнить такое ваше отношение к ним в будущем."
 wtt_xian_incident.4.a: "Мы до сих пор помним, чем закончилась предыдущая попытка."
 wtt_xian_incident.4.b: "Возможно, он прав."
 wtt_xian_incident.7.d: "Если мы убьём его сейчас, то развяжем войну, которую не сможем выиграть. Отпустите его."
 wtt_xian_incident.8.a: "Они его не тронут. Подождём."
 wtt_xian_incident.8.b: "Выслать войска!"
 wtt_china_shared.2.desc: "В частной беседе представители правительства государства [From.GetNameDef] выразили большую заинтересованность тем, как мы будем поддерживать их независимость. Были созданы фонды для групп, ратующих за большую независимость, а также мы начали создавать [From.GetAdjective] «Временное правительство в изгнании»."
 wtt_japan.126.desc: "Представители [From.GetAdjective] обратились к нам с мирным предложением. Они вообще покинут континент в обмен на немедленное прекращение боевых действий."
 wtt_japan.127.desc: "[From.GetNameDef] принял наше мирное предложение и прекратил военные действия в обмен на наши континентальные владения."
 wtt_japan.131.desc: "Китайская Республика требует от нас вернуть территории Китая, которые мы захватили во время борьбы с японцами. Эти земли принадлежат императору по божественному праву, но, возможно, сейчас лучше уступить."
 wtt_japan.131.t: "Республика требует территории."
 wtt_japan.131.a: "Нам нужно пока отступить."
 wtt_japan.131.b: "Император никому не кланяется."
 wtt_news.27.d: "Неожиданный поворот событий."
 wtt_news.33.desc: "После встречи между лидерами [CHI.GetLeader] и [PRC.GetLeader] последний выступил с критикой того, что он назвал «неприкрытой и наглой попыткой привлечь Красную армию для выполнения националистических и контрреволюционных целей». [CHI.GetLeader] отказался от комментариев по этому поводу, заявив только, что националистическая армия готова защитить Китай от любого агрессора. \n\nПоступают сообщения о том, то оба лидера обсудили возможность создания единого фронта против Японии.\n\nПока не ясно, приведет ли этот разлад к очередному конфликту между двумя сторонами."
 wtt_soviet_hold_city_t_success: "[state.GetName] держится"
 wtt_soviet_hold_city_d_success: "Несмотря на натиск врага, [state.GetName] держится, и защитники отражают одну атаку за другой. Обескровленный враг платит непомерно высокую цену за каждый сантиметр занятой земли. [state.GetName] сохранит память о своих героях на многие поколения!"
 wtt_soviet_hold_city_o_success: "[state.GetName] останется за нами!"
 wtt_soviet_hold_city_t_fail: "[state.GetName] переходит в руки врага"
 wtt_soviet_hold_city_d_fail: "Мобилизовав все доступные силы, [controller.GetAdjective] захватчики сокрушили наши оборонительные сооружения вокруг города [state.GetName]. [controller.GetAdjective] отряды вошли на улицы. Наши защитники продолжают доблестно сражаться, но ожидается, что город падёт со дня на день."
 wtt_news.57.t: "Возрождение [From.GetNameDef]"
 wtt_news.67.desc: "После завоевания почти всех территорий, входящих в так называемый «арабский мир», [From.GetOldAdjective] правительство задумалось о том, чтобы воспользоваться распространившимися в регионе пан-арабскими настроениями. После силового устранения возможных возражений со стороны других стран идея объединения арабов приобрела реальные очертания, и [From.GetOldAdjective] правительство уже доказало свою готовность достичь этой цели.\n\nТо ли потакая чаяниям народа, то ли желая создать общий дом для всех арабов, то ли просто в надежде ускорить интеграционные процессы в регионе, [From.GetOldAdjective] власти подтвердили, что отныне их страна называется «[From.GetNameDef]»."
 wtt_news.68.desc: "По мере установления контроля над своими соседями [From.GetOldAdjective] правительство всё отчётливее пользуется историческими параллелями в явных попытках объединить народы под своим руководством. Достижения империи Маджапахит откровенно романтизируются, но пропаганда уже оказала влияние на общественное мнение.\n\nСегодня [From.GetOldAdjective] правительство сделало очередной шаг и объявило о смене названия страны на «[From.GetNameDef]», отдав тем самым дань уважения общему историческому наследию региона."
 wtt_news.70.desc: "Под руководством кайзерины Виктории государство [From.GetOldNameDef] значительно расширило свои границы и превзошло по своим размерам даже прежнюю Священную Римскую империю. [From.GetOldAdjective] военная машина подавила любое сопротивление в Европе, что позволило беспрепятственно преследовать дальнейшие политические цели.\n\nВ настоящее время кайзерина заявила, что необходимо воспользоваться моментом и объявить государство духовным наследником Священной Римской империи. Оно было соответствующим образом официально переименовано, и вместе с этим правительница наконец-то достигла того политического объединения, к которому стремились императоры на протяжении столетий."
 wtt_warlord_vs_prc.1.desc: "Делегация [warlord.GetLeader] прибыла в Москву, чтобы выяснить у нас возможную поддержку во внутрипартийной борьбе за власть. Они утверждают, что [communist_china.GetLeader] недостаточно предан делу коммунизма и на самом деле может питать реакционные мысли и предать революцию в ее самой критической фазе.\n\n[warlord.GetLeader] вместо этого предлагает нам поддержать его, обещая вечное и бессмертное верность делу коммунизма вообще и [SOV.GetLeader] в частности."
 wtt_manchukou.11.a: "Развивать добычу ресурсов"
 wtt_manchukou.11.b: "Инвестировать в металлургию"
 wtt_manchukou.11.c: "Общая программа военной индустриализации"
 wtt_manchukou_bandit_sabotage.21.desc: "Из региона [state.GetName] поступают донесения о том, что на одном из наших заводов вспыхнул большой пожар. Пожарные до сих пор борются с огнем, но уверены, что к концу дня его удастся потушить. По предварительным оценкам повреждения довольно значительны, поскольку очаг возгорания, судя по всему, находился на хранилище легковоспламеняющихся химикатов.\n\nВоенная разведка приступила к расследованию инцидента. Не исключена возможность намеренного поджога."
 wtt_manchukou_bandit_sabotage.23.desc: "Прошлой ночью один из главных железнодорожных мостов в регионе [state.GetName] рухнул под тяжестью проезжающего поезда с боеприпасами. Операцию по спасению и восстановлению затруднил последующий взрыв боеприпасов. Персонал поезда до сих пор не найден, вероятнее всего, все погибли.\n\nВоенная разведка сразу же, как только ситуация стала относительно безопасной, выслала группу следователей с целью выяснить, почему обрушилось такое крепкое сооружение.\n\nОчевидцы утверждают, что за день до обрушения видели в долине небольшую группу людей. В настоящее время их местонахождение неизвестно."
 generic.17.t: "[From.GetName] заболевает"
 generic.17.d: "Похоже, что [From.GetAdjective]ий [From.GetRank] ощущает последствия своей самоотверженной службы государству [From.From.GetNameDef]. Плохой климат сказался на [From.GetHerHis] здоровье, и теперь [From.GetHerHim] потребуется некоторое время на то, чтобы прийти в себя. До выздоровления [From.GetSheHe] не сможет выполнять обязанности на должном уровне."
 generic.18.t: "[From.GetName] получает ранение"
 generic.18.d: "Похоже, что [From.GetAdjective]ий [From.GetRank], с риском для жизни возглавив своих людей и успешно доведя сражение до победного конца, некоторое время не сможет выполнять обязанности на должном уровне — до тех пор, пока полностью не оправится от полученного ранения."
 japan_border_conflict.2.t: "Победа Японии на Халхин-Голе"
 japan_border_conflict.2.desc: "Сообщается, что после столкновения между [SOV.GetAdjective]ими и японскими войсками в приграничном районе вокруг Халхин-Гола [SOV.GetAdjective]ие силы полностью отступают. Японские подразделения заняли ряд стратегически важных холмов в этом районе и начали укреплять свои позиции.\n\nВ ходе боя японцы захватили несколько [SOV.GetAdjective]их танков , которые были отправлены в Токио для оценки."
 japan_border_conflict.3.t: "Поражение Японии на Халхин-Голе"
 japan_border_conflict.3.desc: "После столкновения между [SOV.GetAdjective]ими и японскими войсками в приграничной зоне вокруг Халхин-Гола посол Японии в Москве потребовал прекращения огня. \n\n Несколько японских атак на позиции СССР провалились с тяжелыми потерями во время боя, что вызвало обеспокоенность японских вооруженных сил по поводу возможностей их сил."
 japan_border_conflict.5.desc: "Продолжаются бои между японскими и [SOV.GetAdjective]ими силами вокруг озера Хасан. В попытке выйти из тупика японские войска в других районах также начали задействовать [SOV.GetAdjective]ие силы в этом секторе. Разведка предполагает, что японцы вскоре могут усилить атаку свежими войсками, переброшенными из других частей своей Империи."
 japan_border_conflict.7.t: "[JAP.GetAdjective]ая победа у озера Хасан"
 japan_border_conflict.7.desc: "Сообщается, что после столкновения между [SOV.GetAdjective]ими и [JAP.GetAdjective]ими силами в приграничной зоне вокруг Халхин-Гола [SOV.GetAdjective]ие силы полностью отступают. [JAP.GetAdjective]ие подразделения заняли ряд стратегически важных холмов в этом районе и начали укреплять свои позиции.\n\n"
 japan_border_conflict.7.a: "[SOV.GetName] слабее, чем мы думали!"
 japan_border_conflict.7.b: "Руководство Дальневосточных фронтов в последний раз подвело нас!"
 japan_border_conflict.8.t: "[JAP.GetAdjective]ое поражение у озера Хасан"
 japan_border_conflict.8.desc: "После столкновения между [SOV.GetAdjective]ими и [JAP.GetAdjective]ими силами в приграничном районе вокруг озера Хасан посол Японии в Москве потребовал прекращения огня. \n\n Несколько японских атак на позиции СССР провалились с тяжелыми потерями во время боя, что вызвало обеспокоенность японских вооруженных сил по поводу возможностей их сил."
 japan_border_conflict.8.a: "Лучше потерпеть неудачу с честью, чем вообще никогда не пытаться."
 japan_border_conflict.8.b: "Наши силы хорошо зарекомендовали себя."
 JAP_khalkhin_gol: "Советы прошли испытания"
