l_russian:
 RULE_ALLOW_AIR_BASE_ACCESS: "Доступ к авиабазе"
 RULE_ALLOW_AIR_BASE_ACCESS_FREE_DESC: "Государства могут получить доступ к авиабазам любого другого государства."
 RULE_ALLOW_AIR_BASE_ACCESS_SAME_IDEOLOGY_DESC: "Государства могут получить доступ к авиабазам государств с одинаковой идеологией."
 RULE_ALLOW_AIR_BASE_ACCESS_BLOCKED_DESC: "Государства не могут получить доступ к авиабазам государств, не входящих в их альянс или не являющейся субъектом."
 RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! может не освободить это государство, пока не завершит фокус §Y$SOV_autonomous_soviet_republics$§!."
 PRC_AI_BEHAVIOR: "@PRC Коммунистический Китай"
 RULE_FASCIST_ROM_ALTERNATE_AI_DESC: "Румынский ИИ попытается привести к власти Железную гвардию и заключить союз с Германией"
 RULE_OPTION_DEFAULT_AI_DESC: "ИИ будет принимать решения, учитывая другие параметры игры, например использование исторических фокусов и прочих игровых сценариев. Это поведение аналогично тому, что было в версии 1.5 и более ранних."
 RULE_FASCIST_JAP_AI_DESC: "Японский ИИ попытается атаковать на юге, чтобы нанести удар по западным союзникам, двигаясь по соответствующим веткам дерева национального фокуса."
 RULE_OPTION_NEUTRALITY_JAP_AI_DESC: "Японский ИИ попытается атаковать на севере, чтобы нанести удар по Советскому Союзу, и действовать сообща со странами Оси, двигаясь по соответствующим веткам дерева национального фокуса."
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC: "Венгерский ИИ будет пытаться восстановить Австро-Венгерскую империю, двигаясь по соответствующим веткам дерева национального фокуса."
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC: "Французский ИИ попытается создать Малую Антанту, чтобы помешать Германии. Если Чехословакия создаст эту группировку, французы вступят в нее."
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC: "Венгерский ИИ попытается создать конституционную монархию, двигаясь по соответствующим веткам дерева национального фокуса."
 RULE_OPTION_NOR_FASCIST: "Фашист"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "ИИ позволит фашизму со временем наращивать влияние и в итоге пойдет в ногу с Третьим рейхом или, если Германия больше не фашистская, с крупнейшим фашистским государством."
