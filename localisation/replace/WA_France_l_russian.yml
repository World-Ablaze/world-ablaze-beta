 FRA_secure_europe: "Безопасная Европа"
 FRA_secure_europe_desc: "Растущее влияние Советского Союза представляет собой угрозу окончательному миру в Европе. Польша, наш бывший союзник, должна быть освобождена от хватки Москвы."
  
 FRA_national_centre_for_scientific_research: "Национальный центр научных исследований"
 FRA_national_centre_for_scientific_research_desc: "Мы должны объединить все центры исследований под одной крышей, повысив эффективность"

 FRA_industrial_expansion_effect_tt: "Добавляет 4 £civ_factory£ в метрополии, в которые ранее были вложены инвестиции"
 FRA_military_factories_effect_wa_tt: "Добавляет 6 £mil_factory£ в каждый регион, в который ранее были вложены инвестиции"
 FRA_colonial_industry_effect_wa_tt: "Добавляет 6 £civ_factory£ в каждый колониальный регион, в который ранее были вложены инвестиции. Уменьшает £autonomy_texticon  автономию."

 FRA_prepare_war_plans: "Подготовить военные планы"
 FRA_prepare_war_plans_desc: "Ключом к успеху на поле боя является тщательное планирование и подготовка операции. Нам следует тщательно изучить планы, чтобы быть готовыми отреагировать на любую угрозу."
 FRA_dyle_breda_plan_tt: "§YОткрывает план Дайла после войны с Германией§!\n"
 FRA_prepare_war_plans_tt: "§GУровень призыва повысится во время войны против крупной державы§!\n"
  
 FRA_return_to_borodino: "Последняя битва"
 FRA_return_to_borodino_desc: "Однажды нам не удалось завоевать сердце России, но и во второй раз мы не проиграем. Призрак коммунизма будет изгнан из Европы."
  
 FRA_unite_europe: "Европейская коалиция"
 FRA_unite_europe_desc: "Год нашего труда принес свои плоды, и теперь вся Западная Европа прочно в наших руках. Поскольку на континенте нет других крупных держав, пришло время другим странам признать нашу гегемонию."
  
 FRA_air_based_sea_supremacy: "Воздушное господство на море"
 FRA_air_based_sea_supremacy_desc: "Уничтожать военные корабли другими боевыми кораблями дорого. Гораздо дешевле использовать малую авиацию для уничтожения флота противника, пока наш флот остается пришвартованным в относительной безопасности гавани."
  
 FRA_metropolitan_dockyards: "Развивать верфи метрополии"
 FRA_metropolitan_dockyards_desc: "У нас огромная колониальная империя. Чтобы обеспечить безопасность наших вод, нам нужно большее количество кораблей, а для этого — расширение существующих верфей."
  
 FRA_plan_VI: "План VI"
 FRA_plan_VI_desc: "Теперь, когда наша промышленность ремобилизована, мы можем приложить усилия для улучшения производства самолетов."
  
 FRA_an_absolute_monarch: "Абсолютная монархия"
 FRA_an_absolute_monarch_desc: "К черту правила и формальности! Франция снова поднимется, и мы не остановимся ни перед чем для достижения наших целей."
  
 FRA_a_parliamentary_monarchy: "Парламентская монархия"
 FRA_a_parliamentary_monarchy_desc: "Хотя мы и за монархию, любой разумный француз признает, что мы не хотим видеть еще одного Людовика. Парламентская система останется в силе, чтобы контролировать власть короля."
  
 FRA_military_coup_d_etat: "Военный переворот!"
 FRA_military_coup_d_etat_desc: "Мы заручились поддержкой военных и готовы назначить нового императора. Мы нанесем удар по вашему приказу."
  
 FRA_the_army_swears_loyalty: "Армия клянется в верности"
 FRA_the_army_swears_loyalty_desc: "Французская армия по-прежнему полна генералов, симпатизирующих республиканцам. Придя к компромиссу с парламентской монархией, мы убедили многих из них остаться. Им остается только принести клятву верности новому правительству."
  
 FRA_action_francaise: "«Аксьон франсез»"
 FRA_action_francaise_desc: ""
  
