 FRA_blochs_relaunch: "Перезапуск Bloch"
 FRA_blochs_relaunch_desc: "Стремясь догнать и доминировать в эпоху реактивных самолетов, Bloch хочет переименовать себя и свою компанию в Dassault, что является отсылкой к «char d'assaut» или штурмовому танку. Помимо названия, внутренняя реорганизация означает, что корпорация в целом будет лучше приспособлена к новой реактивной промышленности."
  
