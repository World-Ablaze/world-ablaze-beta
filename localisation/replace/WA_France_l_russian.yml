 FRA_crush_the_CGT: "Раздавить Всеобщую Конфедерацию Труда"
 FRA_crush_the_CGT_desc: ""
 FRA_crush_the_CGT_tt: "Фракция £faction_fra_cgt «§tВсеобщая конфедерация труда§!» будет §gуничтожена§!. Сведет всё влияние £faction_fra_cgt §tВсеобщей конфедерации труда§! на £political_power_texticon §Yежедневный прирост политической власти§! ([?FRA_CGT_political_power_gain|+]) => (§Y0.00§!), £factory_output_texticon §Yобъем заводского производства§! ([?FRA_CGT_industrial_capacity_factory|+%]) => (§Y0.00%§!) и £stability_texticon §Yстабильность§! ([?FRA_CGT_stability_factor|+%]) => (§Y0.00%§!)."
  
 FRA_plan_V: "План V"
 FRA_plan_V_desc: "Хотя мы не можем мобилизовать наши вооруженные силы в нынешней ситуации, было бы неплохо создать резерв самолетов, если нашу страну постигнет война."
  
 FRA_plan_VII: "План VII"
 FRA_plan_VII_desc: "Хотя мы не можем мобилизовать наши вооруженные силы в нынешней ситуации, было бы неплохо создать резерв танков, если нашу страну постигнет война."
  
 FRA_give_full_powers_to_reynaud: "Дать полные полномочия Рейно"
 FRA_give_full_powers_to_reynaud_desc: ""
  
 FRA_strengthen_the_government: "Укрепить правительство"
 FRA_strengthen_the_government_desc: ""
  
 FRA_appoint_petain: "Назначить Петена"
 FRA_appoint_petain_desc: "Наличие героя Вердена на стороне Рейно будет вдохновлять как наших солдат, так и общественность. С обновленной волей и энергией мы обязательно победим!"
  
 FRA_appoint_darlan: "Назначить Дарлана"
 FRA_appoint_darlan_desc: ""
 FRA_appoint_darlan_tt: "§GУкрепляет национальное единство ВВС и ВМФ Франции§!"
  
 FRA_stimulate_the_free_market: "Стимулировать свободный рынок"
 FRA_stimulate_the_free_market_desc: ""
 FRA_stimulate_the_free_market_tt: "£faction_fra_national_bloc §YНациональный блок§! уменьшает £consumer_goods_texticon  §Yожидаемое количество фабрик, перенаправленных на товары народного потребления§! до §Y0.0%§!.\n"
  
 FRA_unify_the_government: "Объединить правительство"
 FRA_unify_the_government_desc: "Политика слишком вовлечена в военные дела, и при наличии сильного правительства мы можем добиваться предоставления большей свободы нашим генералам и исследователям."
 FRA_unify_the_government_tt: "§YВоевать с крупной нацией в течение 1 года ИЛИ год - 1941§!"
  
 FRA_promote_de_gaulle: "Продвигать де Голля"
 FRA_promote_de_gaulle_desc: "Наши старые маршалы — некомпетентное, прогнившее подобие людей. Один из наших генералов, Шарль де Голль, демонстрирует исключительные способности в командовании и тактике. Мы должны приложить усилия, чтобы развить его талант."
 FRA_promote_de_gaulle_tt: "§GПовышает Национальное Единство Французской Армии§!"
  
 FRA_purge_the_old_guard: "Провести чистку старой гвардии"
 FRA_purge_the_old_guard_desc: "Некоторые из наших генералов, возможно, были великими в прошлом, но теперь они лишают всех шансов на военный успех, поскольку застряли в прошлых способах ведения войны. Им пора на пенсию."
  
 FRA_the_munitionnettes: "Муниционнетты"
 FRA_the_munitionnettes_desc: "Во время Великой войны «Munitionnettes» представляли собой женщин, которые работали на оружейных заводах по производству боеприпасов, в то время как мужчины служили на фронте. Мы должны возродить эту систему, чтобы помочь нашей промышленности."
  
 FRA_reform_our_industry: "Реформировать нашу промышленность"
 FRA_reform_our_industry_desc: "Наши промышленники слишком долго работали неэффективно. Реформы, направленные на более благоприятную для бизнеса политику, улучшат наши отношения с корпорациями и стимулируют их работать усерднее."
 FRA_reform_our_industry_tt: "£faction_fra_French_Industrialists §WПромышленники§! станут §3дружелюбнее§!, увеличивая £factory_output_texticon£ §Yобъем заводского производства§! и £dockyard_output_texticon §Yпроизводительность верфи§! на §G+10.00%§!.\n"
  
 FRA_fortress_paris: "Крепость Париж"
 FRA_fortress_paris_desc: "Париж, «Город Света», является великим символом для каждого француза. Его защита любой ценой может разрушить город, но мы должны быть готовы принести эту жертву. Это покажет всем, что мы будем бороться до победного конца."
 FRA_fortress_paris_tt: "Построит §Y2-5-ый§! уровень укрепления на оборонительной линии в §YПариже§! и позади реки §YСены§!, протекающей через город."
  
 FRA_evacuate_our_industries: "Эвакуировать нашу промышленность"
 FRA_evacuate_our_industries_desc: "Мы должны перевести нашу северную и восточную промышленность в более безопасные районы."
  
 FRA_interventionist_policies: "Интервенционистская политика"
