 FRA_arsenal_de_laeronautique_tt: "Все условия должны быть выполнены:\nРазвернуто хотя бы §Y2000§! ед. §Yистребителей§!/§Yмногоцелевых самолетов§!\nРазвернуто хотя бы §Y500§! ед. §Yштурмовиков§!/§Yатакующих самолетов§!\nРазвернуто хотя бы §Y500§! ед. §Yбомбардировщиков§!\n"
  
 FRA_contract_loire_nieuport: "Контракт с Loire-Nieuport"
 FRA_contract_loire_nieuport_desc: "Loire-Nieuport — эксперты в области пикирующих бомбардировщиков. Поддержка их разработок позволит нам оставаться лидерами в области морской и наземной пикирующей авиации."
 
 FRA_contract_vernisse_galtier: "Контракт с Vernisse & Galtier"
 FRA_contract_vernisse_galtier_desc: "Инженер Мишель Вернисс и дизайнер Жан Гальтье — два лучших специалиста в Arsenal de l'Aéronautique. Их проекты имеют огромный потенциал, если им будет оказана должная поддержка."
  
 FRA_contract_marcel_bloch: "Контракт с Marcel Bloch"
 FRA_contract_marcel_bloch_desc: "Марсель Блох — один из наших самых известных инженеров и промышленников. Его проекты имеют доказанную историю успеха и заслуживают дальнейшей поддержки."
  
