 FRA_power_to_the_radicals: "Власть радикалам"
 FRA_power_to_the_radicals_desc: ""
  
 FRA_create_the_SNCF: "Создать SNCF"
 FRA_create_the_SNCF_desc: "Наша система из множества железнодорожных компаний недостаточна и неэффективна. Объединение их в одну национальную компанию, контролируемую государством, даст нам больше контроля над нашей транспортной отраслью, повысит ее эффективность и поддержит экономику."
  
 FRA_emancipate_women: "Эмансипация женщин"
 FRA_emancipate_women_desc: ""
  
 FRA_new_army_budget: "Новый армейский бюджет"
 FRA_new_army_budget_desc: "Очевидно, что нынешних военных инвестиций недостаточно, и для того, чтобы пережить грядущие бури, необходимо резко увеличить расходы."

 FRA_revise_the_maginot_line: "Пересмотреть линию Мажино"
 FRA_revise_the_maginot_line_desc: "До сих пор мы ограничивались только немецкой границей из-за протестов Бельгии, но теперь это в прошлом! Война требует изменения политики."
  
 FRA_the_fall_of_the_popular_front: "Падение Народного фронта"
 FRA_the_fall_of_the_popular_front_desc: "С ростом экстремизма и разногласий по поводу направления французской политики хрупкий народный фронт больше не может работать вместе. Радикальная партия с этого момента будет вести нас одна!"
 FRA_the_fall_of_the_popular_front_tt: "£faction_fra_cgt §tВсеобщая конфедерация труда§! станет §Rвраждебнее§!, уменьшая £factory_output_texticon£ §Yобъем заводского производства§! на §R-60.00%§!, £political_power_texticon£ §Yежедневный прирост политической власти§! на §R-0.25§! и £stability_texticon£ §Yстабильность§! на §R-10.00%§!.\n£faction_fra_national_bloc §YНациональный блок§! станет §3дружелюбнее§!, увеличивая £stability_texticon£ §Yстабильность§! на §G+15.00%§!, и установит значение £political_power_texticon£ §Yежедневного прироста политической власти§! на §Y0.00§!."
  
 FRA_end_of_40_hours_a_week: "Конец 40-часовой недели"
 FRA_end_of_40_hours_a_week_desc: "Мы должны увеличить французское производство, чтобы подготовить страну к войне перед лицом растущей экспансии со стороны Германии. Для этого мы должны положить конец реформам, проводимым народным фронтом, вопреки любой оппозиции."
  
 FRA_extend_the_army_budget: "Расширить армейский бюджет"
  
