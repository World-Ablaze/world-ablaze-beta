 VIC_modernize_our_equipment: "Модернизировать наше снаряжение"
 VIC_modernize_our_equipment_desc: "Большая часть оставшегося у нашей армии снаряжения устарела. Вложения в новое стрелковое оружие, артиллерию и инженерное оборудование дадут нашим солдатам шанс в бою."
  
 VIC_combined_military_exercise: "Комбинированные военные учения"
 VIC_combined_military_exercise_desc: "Совместные учения с союзниками позволят нашей пехоте, лётчикам и морякам перенять опыт друг друга и проверить наши доктрины в условиях, близких к боевым."
  
