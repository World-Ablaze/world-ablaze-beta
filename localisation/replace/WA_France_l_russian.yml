 FRA_the_french_armed_forces: "Французский дух"
 FRA_the_french_armed_forces_desc: "Французский дух разделен на 4 ветви: армия, авиация, флот и народ.\nУсиление единства вооруженных сил позволит получить больше войск при переходе к Свободной Франции. Более высокое народное единство будет означать меньшую покорность оккупанту."
