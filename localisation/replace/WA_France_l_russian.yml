 FRA_grand_batterie: "Большая батарея"
 FRA_grand_batterie_desc: ""
  
 FRA_static_command: "Статическое командование"
 FRA_static_command_desc: "Готовясь к позиционной войне, армия использует телефоны вместо радио. Хотя это безопаснее и с меньшей вероятностью будет перехвачено противником, это значительно снижает нашу способность совершать масштабные маневры."
  
 FRA_static_command_radios: "Статическое командование"
 FRA_static_command_desc_radios: "Готовясь к статической войне, армия использует телефоны по радио. Хотя он безопаснее и с меньшей вероятностью будет взломан противником, он значительно снижает нашу способность совершать масштабные маневры."
  
 FRA_widespread_fear_of_the_military: "Широко распространенный страх перед военными"
 FRA_widespread_fear_of_the_military_desc: "Это вопрос времени, когда армия начнет переворот. Мы должны действовать сейчас, чтобы сохранить нашу нацию и ее целостность. Давайте очистим!"
  
 FRA_fear_of_the_military: "Страх перед армией"
 FRA_fear_of_the_military_desc: "Армию необходимо тщательно контролировать, чтобы она не стала слишком мощной для правительства. Дальнейшее новое развитие, которого хочет армия, будет служить лишь ее собственным интересам."
  
 FRA_respect_for_the_military: "Уважение к военным"
 FRA_respect_for_the_military_desc: "Армия пользуется большим уважением среди политиков."
  
 FRA_trust_in_the_military: "Доверие к военным"
 FRA_trust_in_the_military_desc: "Правительство полностью доверяет военным и сделает все возможное, чтобы их поддержать."
  
 FRA_victors_of_wwi_desc: "Великая война дорого обошлась Франции и ее народу, но благодаря Версальскому договору Франции не нужно опасаться, что война снова подступит к ее границам."
 FRA_victors_of_wwi_tt: "§GПозволяет§! взять §YОграниченный и Расширенный воинский призыв§! §Gбез забастовок§!"
  
 FRA_victors_of_wwi_2: "Победители Великой войны"
 FRA_victors_of_wwi_2_desc: "Великая война дорого обошлась Франции и ее народу. Благодаря Версальскому договору Франции не нужно беспокоиться о том, что война приблизится к ее границам."
  
