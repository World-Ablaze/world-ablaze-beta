 FRA_interventionist_policies_tt: "£faction_fra_national_bloc §YНациональный блок§! станет §3дружелюбнее§!, уменьшая £consumer_goods_texticon  §Yожидаемое количество фабрик, перенаправленных на товары народного потребления§! на §Y-4.0%§!.\n"
  
