 FRA_activate_dyle_breda_mission_desc: "План «Диль», или План D, был планом главнокомандующего армией генерала армии Мориса Гамелена по отражению попытки Германии вторгнуться во Францию через Бельгию. Река Диль (Дейле) имеет длину 86 км (53 мили) от Утен-ле-Валь через Фламандский Брабант и Антверпен; Гамелен намеревался, чтобы французские, британские и бельгийские войска остановили немецкое вторжение на рубеже реки."
  
