 FRA_france_indivisible: "Неделимая Франция"
 FRA_france_indivisible_desc: "Франция должна объединиться в единое целое, под одним флагом. Настало время открыто признать это, хотя бы для того, чтобы положить конец страхам разделения."
  
 FRA_french_union_tt: "Будут проведены референдумы в различных частях нашей колониальной империи. Положительные результаты приведут к более строгому соблюдению требований."
  
 FRA_industrial_collectivization_tt: "§OМы больше не сможем принимать промышленные контракты.§!"
  
