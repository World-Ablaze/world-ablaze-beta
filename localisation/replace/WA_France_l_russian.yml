 free_france_creation_tt: "§YШарль де Голль§! становится §Yлидером Франции§!\n§YДоступно новое дерево фокусов§!\nТекущие §Yдолжности в правительстве сбрасываются§!\nБудут получены §YДивизии, корабли и самолеты в соответствии с национальным единством§!\n §YНовая Каледония присоединится к Свободной Франции§!"
  
 fra_armor.814.t: "Кабмин уходит в отставку"
 fra_armor.814.d: "Палата депутатов избрала Рейно премьер-министром, но всего одним голосом, при этом большая часть его собственной партии воздержалась. Новое правительство особенно нестабильно; многие правые требовали, чтобы Рейно напал не на Германию, а на Советский Союз. Палата также вынудила Даладье, которого Рейно считал лично ответственным за слабость Франции, стать министром национальной обороны и войны при Рейно."
 fra_armor.814.a: "Поль Рейно возглавит новое правительство."
  
 fra_armor.890.t: "Провинции меняют верность!"
 fra_armor.890.d: "Провинции Центральной Африки, Индии, Китая и Тихоокеанского региона заявили о своей поддержке режима свободной Франции. Этот акт уже дестабилизировал как легитимность нашего правительства, так и доверие народа к нам. Если мы хотим вернуть себе эти колонии, то присоединение к Оси может быть нашей лучшей надеждой..."
 fra_armor.890.a: "Мы настоящее правительство!"
 fra_armor.890.b: "Мы подождем, пока закончится война"
  
 fra_armor.73.t: "Северная Африка восстает!"
 fra_armor.73.d: ""
 fra_armor.73.a: "Мы настоящее правительство!"
  
 fra_armor.804.t: "Объявить Париж открытым городом"
 fra_armor.804.d: "Когда немецкая армия приближается к Парижу, наше правительство потеряло веру в способность наших вооруженных сил выиграть войну. Чтобы спасти Париж от полного разрушения, французское правительство решило объявить Париж открытым городом и начало вывод правительства из Парижа."
 fra_armor.804.a: "Эвакуируйте столицу!"
  
 fra_armor.805.t: "Париж объявлен открытым городом"
 fra_armor.805.d: "Поскольку французское правительство полностью разобщено, наши победоносные войска убедили его, что дальнейшие боевые действия бесполезны, и, увидев нашу военную машину, оно решило объявить Париж открытым городом, позволив нашим войскам беспрепятственно войти в него. У нас есть узкое окно возможностей, и надо успеть, пока французские военные не нарушили приказы своего правительства и не решили сделать Париж прифронтовым городом."
 fra_armor.805.a: "Война выиграна"
  
 fra_armor.806.t: "Франция формирует Европейскую коалицию"
 fra_armor.806.d: "Французское правительство объявило о своем намерении объединить Европу под одним знаменем, чтобы противостоять «растущей угрозе враждебных сил и укрепить нашу собственную безопасность». Хотя мощь Франции за последние годы резко возросла, до сих пор неясно, каковы ее настоящие намерения. Нам еще предстоит сделать выбор. Должны ли мы присоединиться к ним или отказаться от участия во французском проекте?"
 fra_armor.806.a: "Мы должны присоединиться к ним"
 fra_armor.806.b: "У нас есть другие дела"
  
 fra_armor.807.t: "[From.GetName] соглашается присоединиться к Европейской коалиции"
 fra_armor.807.d: "[From.GetName] соглашается присоединиться к Европейской коалиции"
 fra_armor.807.a: "Они сделали правильный выбор."
  
 fra_armor.808.t: "[From.GetName] отказывается присоединиться к Европейской коалиции"
 fra_armor.808.d: "[From.GetName] отказывается присоединиться к Европейской коалиции"
 fra_armor.808.a: "Тем хуже для них."
  
 fra_armor.809.t: "Массовый призыв"
 fra_armor.809.d: "Планирование большой войны позволило нам немедленно начать мобилизацию большого количества нашего населения для развертывания на передовой."
 fra_armor.809.a: "Это должно дать нам много людских ресурсов"
  
 fra_armor.810.t: "[FRA.GetName] просит финансовой поддержки"
 fra_armor.810.d: "[FRA.GetAdjective]ое правительство запросило помощь в борьбе со своими врагами. Большую часть предыдущих лет Франция проводила раннюю мобилизацию, что привело к нехватке средств для долгосрочной войны. Должны ли мы им помочь?"
 fra_armor.810.a: "Помощь им – в наших интересах"
 fra_armor.810.b: "Нас не интересует ситуация во Франции"
  
 fra_armor.811.t: "[USA.GetName] присылает помощь!"
 fra_armor.811.d: ""
 fra_armor.811.a: "Спасибо американцам!"
  
 fra_armor.812.t: "[USA.GetName] отказывает в отправке помощи"
 fra_armor.812.d: ""
 fra_armor.812.a: "Мы разочарованы"
  
 fra_armor.815.t: "Экономика приспосабливается к Матиньонским соглашениям"
 fra_armor.815.d: "Первоначально после принятия нового закона о трудящихся многие предприятия с трудом приспосабливались к более высоким зарплатам и правам, некоторые из них обанкротились, однако с увеличением количества денег в обращении эта проблема со временем разрешилась, и в результате мы получили более сильную экономику и более довольных рабочих."
 fra_armor.815.a: "Теперь мы можем быстро развивать нашу экономику"
  
 fra_armor.820.t: "Беспорядки рабочих"
 fra_armor.820.d: "Рабочие восстают против нашего запрета на забастовки и требуют удовлетворения своих требований по улучшению условий труда. Они конфликтуют с полицией и уничтожают оборудование на своих заводах."
 fra_armor.820.a: "Полиция с этим справится"
 fra_armor.820.b: "Отправить армию на поддержку полиции"
 fra_cgt_riots_tt: "£faction_fra_cgt §tВсеобщая конфедерация труда§! §Rразозлится§!, уменьшая £stability_texticon£ §Yстабильность§! на §R-5.00%§!, £political_power_texticon£ §Yежедневный прирост политической власти§! на §R-0.05§! и £factory_output_texticon£ §Yобъем заводского производства§! на §R-5.00%§!"
  
 fra_armor.821.t: "Беспорядки рабочих выходят из-под контроля"
 fra_armor.821.d: "После нашего недавнего запрета члены профсоюзов объединились в небывалом количестве. На улицах и на фабриках вспыхнули драки, полиция пыталась заставить их вернуться на работу."
 fra_armor.821.a: "Разве мы только что не сделали это незаконным?"
 fra_armor.821.b: "Раздавите этот ленивый сброд!"
  
 fra_armor.894.t: "Бейрутская конференция"
 fra_armor.894.d: "Поскольку война в Европе развивается быстрыми темпами, настало время неизбежным победителям задуматься о будущем Германии.\n\nМы можем предложить [beirut_partner.GetNameDef] провести конференцию по разделу [GER.GetNameDef] после войны, чтобы разграничить наши сферы влияния на континенте.\n\nНаши "друзья" в [beirut_partner.GetNameDef] дали понять, что они были бы заинтересованы в такой конференции. Без сомнения, они захотят какой-то награды за свои жертвы."
 fra_armor.894.a: "Нам нужна конференция о будущем Германии."
 fra_armor.894.b: "Мы не можем сотрудничать с [yalta_partner.GetNameDef]."
  
 fra_armor.895.t: "Бейрутская конференция"
 fra_armor.895.d: "Поскольку война против [GER.GetNameDef] приближается к своему неизбежному завершению, [yalta_origin.GetNameDef] обратился к нам с предложением о конференции о будущем Германии.\n\nОни предлагают разделить [GER.GetNameDef] между востоком и западом. Это позволило бы нашей сфере влияния распространиться вглубь Европы, что компенсировало бы некоторые потери, которые мы понесли в этой ужасной борьбе."
 fra_armor.895.a: "Ради длительного сотрудничества."
 fra_armor.895.b: "Мы будем диктовать свой собственный мир."
  
 fra_armor.907.t: "Некомпетентный генерал"
 fra_armor.907.d: "Морис Гамлен продолжает наносить нашей армии одно поражение за другим и отказывается признавать ошибки в своей стратегии. Мы должны что-то с этим сделать, прежде чем проиграем эту войну!"
 fra_armor.907.a: "Убрать этого дурака из Верховного командования."
  
 FRA_rhineland_puppet_tt: "§YРейнская область будет ​​под прямым контролем Франции, а остальная Германия будет иметь ​ дружественный режим§!"
  
 fra_armor.1010.t: "Франция предлагает продать технику"
 fra_armor.1010.d: "Франция пришла к нам с предложением продать современные легкие танки и танки поддержки для расширения наших вооруженных сил."
 fra_armor.1010.a: "Конечно, я хочу танки!"
 fra_armor.1010.b: "Пусть оставят свой металлолом себе"
  
 fra_armor.1011.t: "[FROM.GetAdjective]ое правительство приняло наше предложение"
 fra_armor.1011.d: "[FROM.GetAdjective]ое правительство приняло наше предложение. Их армейский танковый корпус будет расширяться"
 fra_armor.1011.a: "Это поможет нашей экономике"
  
 fra_armor.1012.t: "[FROM.GetAdjective]ое правительство отклонило наше предложение"
 fra_armor.1012.d: "[FROM.GetAdjective]ое правительство отклонило наше предложение. Они настаивают, что им не нужны никакие танки."
 fra_armor.1012.a: "Дураки!"
  
 fra_armor.1110.t: "Франция приглашает нас в Антанту"
 fra_armor.1110.d: "В условиях растущей напряженности в Европе Франция хочет восстановить Антанту и пригласила нас для взаимной защиты."
 fra_armor.1110.a: "Принять"
 fra_armor.1110.b: "Отклонить"
  
 fra_armor.1111.t: "[FROM.GetAdjective]ое правительство согласилось"
 fra_armor.1111.d: ""
 fra_armor.1111.a: "Вместе сильнее"
  
 fra_armor.1112.t: "[FROM.GetAdjective]ое правительство отклоняет наше предложение"
 fra_armor.1112.d: ""
 fra_armor.1112.a: "Они остаются в одиночестве"
  
 fra_armor.1210.t: "Франция требует подчинения"
 fra_armor.1210.d: "Франция настаивает на том, что ей необходим полный контроль и сотрудничество в пределах наших границ, чтобы защитить свою землю. Они угрожают применить силу в случае необходимости."
 fra_armor.1210.a: "Мы не можем с ними бороться"
 fra_armor.1210.b: "Пусть попробуют взять!"
  
 fra_armor.1211.t: "Бельгия уступает"
 fra_armor.1211.d: ""
 fra_armor.1211.a: "Отлично!"
 fra_armor.1212.t: "Бельгия отказывается"
 fra_armor.1212.d: ""
 fra_armor.1212.a: "Упрямые дураки!"
 fra_armor.1212.b: "Мы не можем позволить себе войну"
  
 fra_armor.1310.t: "Бельгийский вопрос"
 fra_armor.1310.d: "Крайне важно, чтобы мы обезопасили себя на Севере от любых потенциальных нападений. Мы могли бы продлить линию Мажино на нашей границе, но местность в Бельгии гораздо лучше подходит для оборонительных позиций."
 fra_armor.1310.a: "Пригласить их в Антанту"
 fra_armor.1310.b: "Нам нужен прямой контроль!"
 fra_armor.1310.c: "Не посягать на их нейтралитет"
  
 fra_armor.1410.t: "Франция требует регион [911.GetName]"
 fra_armor.1410.d: "[FRA.GetName] требует, чтобы мы дали им регион [911.GetName]"
 fra_armor.1410.a: "Мы должны сдаться..."
  
 fra_armor.1411.t: "Швейцария принимает наши требования"
 fra_armor.1411.d: ""
 fra_armor.1411.a: "Великолепно!"
  
 fra_armor.1412.t: "Швейцария отвергает наши требования"
 fra_armor.1412.d: ""
 fra_armor.1412.a: "Мы возьмем это силой"
 fra_armor.1412.b: "Мы не можем рисковать войной"
  
 fra_armor.1510.t: "Франция предлагает пакт"
 fra_armor.1510.d: "ЗАГЛУШКА"
 fra_armor.1510.a: "Принять"
 fra_armor.1510.b: "Отклонить"
  
 fra_armor.1610.t: "Требования Франции и Италии"
 fra_armor.1610.d: "Франция и Италия требуют отдать им территории Юра и Тичино."
 fra_armor.1610.a: "Принять их требования"
 fra_armor.1610.b: "Отказать!"
  
 fra_armor.1710.t: "Франция требует подчинения"
 fra_armor.1710.d: "ЗАГЛУШКА"
 fra_armor.1710.a: "Принять их требования"
 fra_armor.1710.b: "Отказать"
  
 fra_armor.1810.t: "Союзники запрашивают военный доступ"
 fra_armor.1810.d: "Союзники хотят пройти через нашу землю"
 fra_armor.1810.a: "Принять"
 fra_armor.1810.b: "Отказать"
 fra_armor.1811.t: "Швеция согласилась предоставить нам доступ"
 fra_armor.1811.d: "Швеция согласна предоставить нам проход"
 fra_armor.1811.a: "Хорошо"
 fra_armor.1812.t: "Швеция отказывается"
 fra_armor.1812.d: "Швеция отклонила нашу просьбу из-за опасений немецкой интервенции"
 fra_armor.1812.a: "Очень жаль"
  
 fra_armor.1910.t: "Французский ультиматум"
 fra_armor.1910.d: "Коминтерн требует полного контроля над Босфором"
 fra_armor.1910.a: "Принять"
 fra_armor.1910.b: "Отказать"
 fra_armor.1911.t: "[TUR.Getname] сдается"
 fra_armor.1911.d: "[TUR.Getname] прислушался к голосу разума и без боя принял наши требования"
 fra_armor.1911.a: "Отлично"
 fra_armor.1912.t: "[TUR.Getname] отказывается"
 fra_armor.1912.d: "[TUR.Getname] отвергает наш ультиматум. Они знают, что это значит"
 fra_armor.1912.a: "Тогда на войну!"
  
 fra_armor.2010.t: "Судьба Германии"
 fra_armor.2010.d: "Война окончена, и перед нами встал вопрос о будущем Германии. За одну человеческую жизнь германские армии трижды переходили наши границы. Многие в Париже теперь утверждают, что единая Германия больше никогда не должна возродиться, а рейх следует раздробить на отдельные государства."
 fra_armor.2010.a: "Мы навсегда задушим прусского орла!"
 fra_armor.2010.b: "Это безумие!"
  
 fra_armor.2020.t: "[FROM.GetName] сдается"
 fra_armor.2020.d: "[FROM.GetName] складывает оружие и вновь становится частью Французской империи."
 fra_armor.2020.a: "Мы приветствуем их!"
  
 fra_armor.2030.t: "[VIC.GetName] просит смягчить репарации"
 fra_armor.2030.d: ""
 fra_armor.2030.a: "Согласиться снизить репарации"
 fra_armor.2030.b: "Отказать"
  
 fra_armor.2031.t: "[GER.GetName] соглашается снизить репарации"
 fra_armor.2031.d: ""
 fra_armor.2031.a: "Великолепно!"
  
 fra_armor.2032.t: "[GER.GetName] отказывает"
 fra_armor.2032.d: ""
 fra_armor.2032.a: "Сначала нам придется проявить себя"
  
 lar_end_the_occupation.1.c: "Вернуть им еще и Кале"
 lar_end_the_occupation.3.c: "Сначала нам придется проявить себя"
  
 fra_armor.816.t: "Крайне правые лиги разжигают насилие"
 fra_armor.816.d: "Члены ультраправых лиг яростно протестуют на улицах Парижа после образования Народного фронта. Недавно это вылилось в столкновения с полицией, повлекшие за собой многочисленные жертвы. Некоторые политики опасаются, что это может оказаться попыткой государственного переворота со стороны лиг."
 fra_armor.816.a: "Мы должны действовать против этого!"
  
 fra_armor.817.t: "Леон Блюм атакован!"
 fra_armor.817.d: "13 февраля, пересекая похоронную процессию Жака Бенвиля, Леон Блюм был жестоко избит толпой монархистов, которые были членами «Камло дю Руа», всего в нескольких минутах от здания Национального собрания. Однако, несмотря на то, что Леон Блюм был на волосок от смерти, он чудом выжил. Это едва не фатальное нападение на столь выдающуюся фигуру французских левых сил вызвало эмоции в социалистических кругах, достаточные для того, чтобы спровоцировать физическое возмездие.\nБыло бы неправильно оставаться в стороне и позволять сеятелям смуты сохранять влияние, необходимо что-то сделать."
 fra_armor.817.a: "Возмутительно!"
  
 fra_armor.818.t.a: "Коммунистические беженцы"
 fra_armor.818.d.a: "После победы националистов в гражданской войне в Испании коммунистические бойцы пересекают границу с Францией, ища убежища от любых репрессий со стороны новых лидеров."
 fra_armor.818.t.b: "Националистические беженцы"
 fra_armor.818.d.b: "После победы республиканцев в гражданской войне в Испании коммунисты пересекают границу с Францией в поисках убежища от любых репрессий со стороны нового правительства."
 fra_armor.818.a: "Приветствуем их!"
 fra_armor.818.b: "Откуда нам знать, что они не начнут здесь следующую войну?"
  
 fra_armor.819.t: "[BEL.GetName] пала"
 fra_armor.819.d: "Наш план защиты Бельгии провалился, и большая часть страны теперь оккупирована врагом. Война пришла на уязвимый северный фронт, и теперь мы во второй раз должны держать фронт на французской земле."
 fra_armor.819.a: "Это горькая пилюля, которую нужно проглотить"
  
 fra_armor.823.t: "Первая мировая война повторяется"
 fra_armor.823.d: "Наши границы нарушены, и враг наводняет нашу родину. В то время как мы пытаемся сражаться, используя лучшую стратегию, которую мы можем придумать, солдаты и граждане Франции видят поспешное падение правительства как неизбежное, и они выражают желание сдаться, а не позволить истории повториться, обрекая Францию на еще большую трагедию."
 fra_armor.823.a: "Мы должны объединить народ и армию"
  
 fra_armor.824.t: "Пересмотреть наш союз с Великобританией?"
 fra_armor.824.d: "В Европе снова вспыхнула война, причем гораздо раньше, чем ожидалось. Наш старый союз с Великобританией может быть возрожден, и мы сможем отбить надвигающуюся бурю."
 fra_armor.824.a: "Отправить наших делегатов"
 fra_armor.824.b: "Они нам не нужны"

 fra_monarchist.002.t: "Охвачены гражданской войной"
 fra_monarchist.002.d: "Часть страны решила выступить против нас силой и не примет мирного восхождения на престол."
 fra_monarchist.002.a: "Мы ничего не можем сделать"

 fra_monarchist.003.t: "Снова пришло время монарха"
 fra_monarchist.003.d: ""
 fra_monarchist.003.a: "Играть за Легитимистов (левый путь)"
 fra_monarchist.003.b: "Играть за орлеанистов (средний путь)"
 fra_monarchist.003.c: "Играть за Бонапартов (правый путь)"

 fra_monarchist.004.t: "Армия возвращается домой"
 fra_monarchist.004.d: "В условиях, когда на руководство Францией претендует так много разных людей, армия отказывается принимать чью-либо сторону, многие солдаты сложили оружие и ждут окончания военных действий."
 fra_monarchist.004.a: "Мы ничего не можем сделать"

 fra_monarchist.007.t: "Прибытие добровольцев"
 fra_monarchist.007.d: "Сотрудники полиции и добровольцы сформировали отряды, чтобы поддержать наши притязания на трон!"
 fra_monarchist.007.a: "Vive la France!"
 fra_monarchist.007.b: "Vive la France!"
 fra_monarchist.007.c: "Тост за наших испанских друзей!"

 fra_monarchist.009.t: "Париж разрушен"
 fra_monarchist.009.d: "Вытеснение защитников из города потребовало больших потерь. Они укрепили каждый дюйм и укрылись даже за нашими достопримечательностями. Только после нескольких месяцев непрерывных бомбардировок нам удалось выбить последних из них. Это нанесло огромный урон городу: по оценкам, было разрушено не менее 80 % территории."
 fra_monarchist.009.a: "Трагедия"

 fra_monarchist.010.t: "Перенос нашей столицы"
 fra_monarchist.010.d: "После разрушения Парижа нам придется, по крайней мере, временно перенести нашу столицу. Какой город должен принять правительство на время восстановления?"
 fra_monarchist.010.a: "Орлеан"
 fra_monarchist.010.b: "Брест"
 fra_monarchist.010.c: "Бордо"
 fra_monarchist.010.e: "Марсель"

 fra_monarchist.011.t: "Воспользоваться гражданской войной"
 fra_monarchist.011.d: "Поскольку Франция охвачена гражданской войной, мы должны воспользоваться возможностью и вернуть Эльзас. Они не смогут противостоять нам в этот момент."
 fra_monarchist.011.a: "Германия снова станет великой!"

 fra_monarchist.012.t: "Германия оккупирует регион [28.GetName]"
 fra_monarchist.012.d: "Поскольку наша страна находится в состоянии войны, Германия воспользовалась возможностью вернуть себе регион [28.GetName], на который она претендовала. Они просто ждали этого момента."
 fra_monarchist.012.a: "Мы ничего не можем сделать"
  
 
 france.206.t: "Захват французской техники"
 france.206.d: "После перемирия во Франции мы захватили большое количество техники. Согласно условиям перемирия, оставшиеся французские войска в составе государства Виши были расформированы, а также сдали свои запасы."
 france.206.a: "Зер гут!"
 france.206.a_tt: "§YМы получим запасы французского снаряжения§!"
  
 france.37.t: "Пакт Лаваля-Риббентропа – предложение Франции"
 france.37.d: "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии Риббентропом, чтобы предложить Пакт о ненападении между Францией и Германией. В качестве причины была названа необходимость для обеих стран бороться с настоящим врагом в лице Соединенного Королевства. Что нам следует ответить?"
 france.37.a: "Звучит отлично"
 france.37.b: "Ни за что!"
  
 france.35.t: "Пакт Лаваля-Риббентропа: Германия принимает"
 france.35.d: "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии фон Риббентропом, чтобы предложить Пакт о ненападении между Францией и Германией. В качестве причины была названа необходимость для обеих стран бороться с настоящим врагом в лице Соединенного Королевства. После интенсивных переговоров немецкая делегация приняла это предложение."
 france.35.a: "Отлично!"
  
 france.36.t: "Пакт Лаваля-Риббентропа: Германия отказывается"
 france.36.d: "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии фон Риббентропом, чтобы предложить Пакт о ненападении между Францией и Германией. В качестве причины была названа необходимость для обеих стран бороться с настоящим врагом в лице Соединенного Королевства. После интенсивных переговоров немецкая делегация отвергла это предложение."
 france.36.a: "Проклятье!"
 
