 FRA_a_military_training_for_the_emperor: "Военная подготовка императора"
 FRA_a_military_training_for_the_emperor_desc: "Как и Наполеоны до него, наш император должен быть одновременно политиком и тактиком. Это займет время, но он обязательно быстро научится."
  
