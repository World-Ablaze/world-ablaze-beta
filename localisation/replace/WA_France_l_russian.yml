 FRA_disjointed_government_desc: "Состояние французской политики далеко от стабильного. Назрела необходимость в реформах, но нация разделена, и вовлечение в конфликт было бы большим риском для неё.§RУдваивает стоимость антиидеологических рейдов§!"
  
 FRA_disjointed_government_2: "Разделенное правительство"
 FRA_disjointed_government_2_desc: "Состояние французской политики далеко от стабильности. Хотя реформы необходимы и приветствуются, нация разделена, и втягивание в конфликт подвергнет ее огромному риску. §R Удваивает стоимость антиидеологических рейдов§!"
  
 FRA_disjointed_government_3: "Разделенное правительство"
 FRA_disjointed_government_3_desc: "Состояние французской политики далеко от стабильности. Хотя реформы необходимы и приветствуются, нация разделена, и втягивание в конфликт подвергнет ее огромному риску. §R Удваивает стоимость антиидеологических рейдов§!"
  
