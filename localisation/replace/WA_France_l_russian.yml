 FRA_structured_doctrines_desc: "Поскольку каждому резервисту во Франции приходилось регулярно проходить повторную подготовку, французские военные решили принять очень структурированные, фиксированные и постоянные доктрины, чтобы гарантировать, что каждый солдат будет хорошо подготовлен в случае мобилизации. Хотя это позволило французским солдатам пройти достаточную подготовку, это также усложнило обновление французской доктрины по сравнению с другими странами."
