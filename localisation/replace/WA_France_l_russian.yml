 FRA_invest_in_public_works_tt: "£faction_fra_national_bloc §YНациональный блок§! должен будет профинансировать этот проект, следовательно, £consumer_goods_texticon  §Yожидаемое количество фабрик, перенаправленных на товары народного потребления§! увеличится на §Y+2.0%§!.\n"
  
