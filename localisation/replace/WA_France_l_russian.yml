 FRA_ministry_of_police_desc: ""
  
 FRA_purge_the_generals: "Чистка нелояльных генералов"
 FRA_purge_the_generals_desc: "Французская армия должна быть маяком французской праведности и доблести. На самом деле они питают нежелательную лояльность и препятствуют каждому нашему шагу. Это неприемлемо."
  
 FRA_purge_the_generals_2: "Очистка нелояльных генералов"
 FRA_purge_the_generals_2_desc: "Французская армия должна быть маяком французской праведности и доблести. На самом деле они питают нежелательную лояльность и препятствуют каждому нашему шагу. Это неприемлемо."
  
 FRA_royalist_coalition_emerges: "Возникает коалиция роялистов"
 FRA_royalist_coalition_emerges_desc: "Хотя нам и больно это признавать, республиканизм невозможно уничтожить за один день. Мы должны объединиться с другими роялистами и ориентироваться в законодательном органе, чтобы добиться благоприятной для себя политической ситуации."
  
 FRA_french_youth: "Создать французскую молодежь"
 FRA_french_youth_desc: "Будущее наших стран лежит в сердцах и душах наших детей. Они станут авангардом нашего движения и помогут нам очистить нашу страну от грязи."
  
 FRA_focus_on_politics: "Сосредоточиться на политике"
 FRA_focus_on_politics_desc: "Война изменилась в 20-м веке, и больше непрактично заставлять нашего императора принимать решения, касающиеся поля боя. Ему следует сосредоточиться на политической сфере, где у него больше всего опыта."
  
 FRA_lead_from_the_front: "Командовать с линии фронта"
 FRA_lead_from_the_front_desc: "Когда наш император сражается на фронте, он несет в себе душу Франции. Наши солдаты будут сражаться с еще большим упорством, зная, что за ними стоит вся Франция."
 FRA_a_military_training_for_the_emperor_tt: "Разблокирует решения по повышению навыков Императора."
  
 FRA_reorganize_benelux: "Реорганизация Бенилюкса"
 FRA_reorganize_benelux_desc: "Валлоны во всех отношениях являются французами. Они должны быть официально реинтегрированы в нашу нацию как можно скорее."
  
 FRA_not_another_trafalgar: "Больше никакого Трафальгара"
 FRA_not_another_trafalgar_desc: "На протяжении более ста лет Соединённое Королевство имело самый сильный военно-морской флот в Европе. Такое нелепое положение дел больше не может продолжаться. Военно-морской флот Франции будет расширен и модернизирован в соответствии с современными стандартами."
  
 FRA_latin_entente: "Французская коалиция"
 FRA_latin_entente_desc: "Франция вела и всегда будет лидировать в Европе. Остаётся единственный вопрос: как мы это сделаем."
  
 FRA_secure_portugal: "Безопасная Португалия"
 FRA_secure_portugal_desc: "Поскольку Испания прочно находится в нашей сфере влияния, мы, наконец, можем обеспечить контроль над Пиренейским полуостровом и нейтральное британское присутствие в Западной Европе."
  
 FRA_secure_oil_regions: "Безопасные нефтяные регионы"
 FRA_secure_oil_regions_desc: "Без британцев мы можем перейти к обеспечению безопасности стратегически ценных ресурсов на Ближнем Востоке. Запасы нефти будут продолжать подпитывать французскую военную машину в ближайшие годы."
  
 FRA_disunited_kingdom: "Разъединенное Королевство"
 FRA_disunited_kingdom_desc: "Война против Соединенного Королевства выиграна. Мы не можем позволить этой стране существовать и угрожать нам в будущем. Мы должны разделить Великобританию, чтобы обеспечить нашу безопасность."
  
 FRA_laval_ribbentrop_pact: "Пакт Лаваля-Риббентропа"
 FRA_laval_ribbentrop_pact_desc: "Поскольку обе наши страны находятся в состоянии войны против Соединенного Королевства, война между нами сейчас будет контрпродуктивной. Давайте попробуем заключить Пакт о ненападении, который принес бы пользу нашим странам."
  
 FRA_needs_approval: "Германия должна одобрить сделку"
  
 FRA_lessons_from_our_defeat: "Уроки нашего поражения"
 FRA_lessons_from_our_defeat_desc: "Материк и республика пали. Государство-самозванец, возглавляемое Петэном, правит нашим побежденным населением железной рукой. Правительство и армия нас подвели, но де Голль восстановит нас с нуля."
  
 FRA_join_the_manhattan_project: "Присоединиться к Манхэттенскому проекту"
 FRA_join_the_manhattan_project_desc: "Американские официальные лица обратились к нам с предложением провести совместную работу по разработке ядерного оружия. Их финансирование нам очень поможет."
  
 FRA_chasseurs_parachutistes: "Егеря-парашютисты"
 FRA_chasseurs_parachutistes_desc: "Советские межвоенные эксперименты и немецкие воздушные операции показали нам потенциал этого нового оружия."
  
 FRA_project_damocles: "Проект «Дамоклав»"
 FRA_project_damocles_desc: "Франция была ведущей страной в области ядерных исследований. Мы верим, что сможем работать над новым типом оружия, связанным с этой областью физики. Однако это будет дорого. Нам наверняка понадобится британская помощь. У этого есть потенциал изменить мир – навсегда."
  
 FRA_ils_ne_passeront_pas: "Они не пройдут!"
 FRA_ils_ne_passeront_pas_desc: "«Ils ne passeron pas!» был девизом французской армии во время битвы при Вердене в 1916 году. Это самое знаковое предложение, отражающее дух французской армии. Мы должны возродить этот дух еще раз, чтобы мотивировать наших солдат."
  
 FRA_ask_the_us_for_support: "Попросить Соединённые Штаты о поддержке"
 FRA_ask_the_us_for_support_desc: "Когда Соединенные Штаты присоединятся к союзникам, мы сможем попросить их об экономической помощи, чтобы поддержать нашу военную промышленность."
  
 FRA_create_unit_legion_tt: "£GFX_unit_mountaineers_icon_small §YЭлитная дивизия Иностранного легиона§! будет £manpower_texticon£ развернута в §YПариже§!."
  
 FRA_new_army_bureau: "Новое армейское бюро"
 FRA_new_army_bureau_desc: "Стратегии войны развивались гораздо быстрее, чем мы могли когда-либо ожидать. Армии были переданы новые ресурсы с целью поддержания и совершенствования нашей тактики."
  
 FRA_aggressive_focus_desc: "Мы не можем сидеть сложа руки, когда враги приближаются к нашим границам. И мы не можем оставить наших союзников на произвол судьбы в условиях войны. Готовьте нашу армию! Де Голль — человек для этой работы."
 FRA_aggressive_focus_tt: "£faction_fra_Far_Right_Leagues §YАрмия§! должна иметь §3дружелюбный§! уровень отношения или выше.\n"
  
 FRN_create_infantry_unit: "Французский Алжир получит §YШаблон пехоты§!, доступный для набора"
 
