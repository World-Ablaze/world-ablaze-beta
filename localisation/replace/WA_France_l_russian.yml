 FRA_reconquer_the_west_indies_desc: ""
  
 FRA_reconquer_indochina: "Отвоевать Индокитай"
 FRA_reconquer_indochina_desc: "Наши колонии в Индокитае находятся далеко от европейских сражений и идеально подходят, чтобы помочь нам защитить свои интересы в регионе."
  
 FRA_reconquer_central_africa: "Отвоевать Центральную Африку"
 FRA_reconquer_central_africa_desc: "Центральная Африка очень важна для военной экономики и как элемент пропаганды."
  
 FRA_reconquer_west_africa: "Отвоевать Западную Африку"
 FRA_reconquer_west_africa_desc: "В Западной Африке проживают миллионы человек, которых можно призвать в новую армию, чтобы с её помощью вернуть себе родину."
  
 FRA_reconquer_madagascar: "Отвоевать Мадагаскар"
 FRA_reconquer_madagascar_desc: "Если мы позволим врагу взять и укрепить Мадагаскар, в Индийском океане нас ждёт крах. Нужно действовать быстро и решительно, чтобы остров остался нашим."
  
 FRA_reconquer_syria: "Отвоевать Сирию"
 FRA_reconquer_syria_desc: "Лишив врага доступа к стратегическим территориям в Сирии, мы защитим Суэцкий канал и значительно улучшим ситуацию в Восточном Средиземноморье."
  
 FRA_reconquer_north_africa: "Отвоевать Северную Африку"
 FRA_reconquer_north_africa_desc: "Северная Африка лучше всего подходит для вторжения и последующего возвращения родины. Необходимо склонить её на нашу сторону, чтобы наша кампания по освобождению увенчалась успехом."
  
 FRA_refus_absurde_tt: "§YОтвоевал все колонии Северной и Центральной Африки§!"
  
 FRA_french_national_committee: "Основать Национальный комитет"
 FRA_french_national_committee_desc: "Мало кто верил в успех нашего дела. Но теперь мы наконец-то достаточно сильны, чтобы объявить о создании полноценного правительства в изгнании, которое готово взять на себя управление любой французской территорией, освобождённой от врагов."
 FRA_french_national_committee_tt: "Мы сможем запрашивать ленд-лиз у других стран, кроме Великобритании"
  
