 FRA_strengthen_the_government_dd_tt: "В настоящее время: [?FRA_strengthen_the_government_dd_flag:days|Y0]"
  
 FRA_develop_the_metropole: "Развивать метрополию"
 FRA_develop_the_metropole_desc: "Нашим первым шагом в восстановлении нашей промышленности должно стать улучшение нашей промышленной базы в наших континентальных владениях."
  
 FRA_invest_in_metropolitan_france: "Инвестировать в метрополию Франции"
 FRA_invest_in_metropolitan_france_desc: ""
  
 FRA_form_the_national_research_centre: "Сформировать Национальный исследовательский центр"
 FRA_form_the_national_research_centre_desc: "Жан Перрен продемонстрировал нам достоинства хорошо финансируемого научного института, полностью сосредоточенного на исследованиях; теперь мы можем подражать этому в более широком масштабе, охватывая все научные дисциплины."
  
 FRA_expand_the_atelier_de_construction: "Расширить Atelier de Construction"
 FRA_expand_the_atelier_de_construction_desc: "Без строительного сектора невозможно построить заводы. Поэтому его укрепление важно на нашем пути к расширению нашей промышленности."
  
 FRA_establish_the_atelier_et_chantier_de_france: "Основать Atelier et Chantier de France"
 FRA_establish_the_atelier_et_chantier_de_france_desc: "Основанная в 1898 году компания Ateliers et Chantiers de France пережила тяжелые времена после окончания Первой мировой войны. Мы можем поддержать ее и восстановить сильную судостроительную промышленность как основу нашего военно-морского флота."
  
 FRA_electromagnetic_barriers: "Электромагнитные барьеры"
 FRA_electromagnetic_barriers_desc: "Электромагнитное экранирование используется для минимизации помех в электронном оборудовании. Его развитие и совершенствование значительно повысят возможности наших радаров и радиостанций."
  
 FRA_hire_grande_ecoles_intellectuals: "Нанять интеллектуалов Grande Ecoles"
 FRA_hire_grande_ecoles_intellectuals_desc: "Grande écoles — это узкоспециализированные школы, в которых учатся одни из самых ярких умов нашей страны. У них есть потенциал значительно ускорить наш прогресс."
  
 FRA_merge_the_ministries_of_war: "Объединить военные министерства"
 FRA_merge_the_ministries_of_war_desc: "Объединение министерств авиации, флота и армии в единое министерство обороны улучшит нашу координацию и сделает ее более эффективной."
  
 FRA_invest_in_oil_refining: "Инвестировать в нефтепереработку"
 FRA_invest_in_oil_refining_desc: "Доступ к запасам нефти бесполезен, если мы не инвестируем в адекватные мощности по ее переработке."
  
 FRA_the_beauce_breadbasket: "Житница Босе"
 FRA_the_beauce_breadbasket_desc: "Регион Босе является житницей нашей страны, и инвестиции обеспечат будущее снабжение продовольствием нашего растущего населения."
  
 FRA_mechanize_the_southern_farms: "Механизировать южные фермы"
 FRA_mechanize_the_southern_farms_desc: "Механизация ферм важна для обеспечения их производительности при меньшей зависимости от огромного количества рабочих."
  
 FRA_victorieux_factories: "Заводы Викторье"
 FRA_victorieux_factories_desc: "Нам необходимо быстро нарастить производство вооружений ради победы Франции!"
  
 FRA_respark_the_french_war_machine: "Вновь запустить французскую военную машину"
 FRA_respark_the_french_war_machine_desc: "Наша военная машина бездействовала с окончания последней войны; пришло время вновь запустить ее и снова посвятить все одной цели: победе над врагом."
  
 FRA_fortify_the_gateways_to_africa: "Укрепить ворота в Африку"
 FRA_fortify_the_gateways_to_africa_desc: "Нам необходимо укрепить ворота в наши североафриканские колонии, чтобы надежно и надолго защитить их."
  
 FRA_fortify_indochina: "Укрепить Индокитай"
 FRA_fortify_indochina_desc: "Индокитай — одна из наших самых дальних колоний, поэтому строительство там укреплений важно, чтобы гарантировать, что они смогут продержаться достаточно долго в случае любой колониальной агрессии."
  
 FRA_fortify_the_south: "Укрепить юг"
 FRA_fortify_the_south_desc: ""
  
 FRA_french_colonial_ministry: "Французское колониальное министерство"
 FRA_french_colonial_ministry_desc: ""
  
 FRA_develop_the_peripheries: "Развивать периферию"
 FRA_develop_the_peripheries_desc: "Большое расстояние между нашими владениями в Индокитае и метрополией может показаться недостатком, но оно также защищает любую местную промышленность от нападения противника."
  
 FRA_develop_africa: "Развивать Африку"
 FRA_develop_africa_desc: "В Западной Африке имеются огромные резервы рабочей силы и ресурсов, что делает ее важным кандидатом для инвестиций."
  
 FRA_cosmopolitan_algeria: "Космополитический Алжир"
 FRA_cosmopolitan_algeria_desc: ""
  
 FRA_army_of_africa: "Армия Африки"
 FRA_army_of_africa_desc: ""
  
 FRA_cosmopolitan_morocco: "Космополитическое Марокко"
 FRA_cosmopolitan_morocco_desc: "Марокко обладает большим сельскохозяйственным потенциалом и природными ресурсами. Если мы инвестируем в его инфраструктуру, мы сможем использовать эти ресурсы для снабжения метрополии Франции."
  
 FRA_french_colonial_law: "Французское колониальное право"
 FRA_french_colonial_law_desc: ""
  
 FRA_prospect_for_rubber: "Поиски каучука"
 FRA_prospect_for_rubber_desc: "Каучук становится все более важным для нашей современной промышленности. Мы должны позаботиться о том, чтобы развить его производство там, где это возможно, в наших заморских владениях."
  
 FRA_boost_the_piednoir: "Поддержать пье-нуаров"
 FRA_boost_the_piednoir_desc: ""
  
 FRA_the_french_foreign_legion: "Французский Иностранный легион"
 FRA_the_french_foreign_legion_desc: "Французский Иностранный легион — элитное подразделение, состоящее из добровольцев со всего мира. Возможно, мы могли бы улучшить его боеспособность, объединив различные полки в одну дивизию."
  
 FRA_the_meharistes: "Мехаристы"
 FRA_the_meharistes_desc: "Войска на верблюдах доказали свою уникальную способность охранять наши границы в африканской пустыне. Они гораздо лучше подходят для этой задачи, чем наши отряды тиральеров. Мы можем развить этот успех и создать несколько дополнительных дивизий мехаристов."
 FRA_the_meharistes_tt: "(§Y[FRA.GetFlag][FRA.GetAdjective]ое Марокко§!) £manpower_texticon£ Развернуть (§Y6§!) £GFX_unit_camelry_icon_small §Yдивизий верблюжьей кавалерии§!."
  
 FRA_setup_a_colonial_industry: "Создать колониальную промышленность"
 FRA_setup_a_colonial_industry_desc: ""
 FRA_setup_a_colonial_industry_tt: "Добавляет §Y2§! £civ_factory£ в каждый регион, развитый предыдущими фокусами."
  
