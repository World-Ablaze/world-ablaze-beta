 FRA_form_the_provincial_government: "Образовать временное правительство"
 FRA_form_the_provincial_government_desc: "Теперь, когда Париж освобождён, мы больше не правительство в изгнании. Пора браться за нелёгкий труд по восстановлению страны."
  
