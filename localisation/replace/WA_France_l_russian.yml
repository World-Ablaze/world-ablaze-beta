 FRA_the_foreign_legionnaries_tt: "£GFX_unit_mountaineers_icon_small §YЭлитная дивизия Иностранного легиона§! будет £manpower_texticon£ развернута в §Yстолице§!."
  
 FRA_free_french_naval_forces: "Свободный французский флот"
 FRA_free_french_naval_forces_desc: "Наши союзники заняты отчаянной борьбой за выживание, в которой крайне важны морские пути. Мы должны им помочь."
  
 FRA_a_modern_fighting_force: "Современная боевая сила"
 FRA_a_modern_fighting_force_desc: ""
  
 FRA_french_committee_of_national_liberation: "Французский комитет национального освобождения"
 FRA_french_committee_of_national_liberation_desc: ""
  
 FRA_reach_out_to_the_trade_unions: "Обратиться к профсоюзам"
 FRA_reach_out_to_the_trade_unions_desc: "Если мы хотим ударить по промышленности, которую вынудили работать на врага, следует установить хорошую связь с рабочими. Они могут задерживать или саботировать любое производство куда эффективнее любых внешних сил."
 FRA_reach_out_to_the_trade_unions_tt: "£faction_fra_cgt §tВсеобщая конфедерация труда§! станет §3дружелюбнее§!, увеличивая £stability_texticon£ §Yстабильность§! на §G+10.00%§!, £political_power_texticon£ §Yежедневный прирост политической власти§! на §G+0.10§! и £factory_output_texticon£ §Yобъем заводского производства§! на §G+10.00%§!."
  
 FRA_cooperate_with_the_communists: "Сотрудничество с коммунистами"
 FRA_cooperate_with_the_communists_desc: "В нашей общей борьбе мы не должны отказываться ни от одного предложения помощи, даже если предлагающие называют себя товарищами."
  
 FRA_connections_within_the_industrialists: "Связи с промышленниками"
 FRA_connections_within_the_industrialists_desc: "Сотрудничество с рабочими военной промышленности полезно, но и сотрудничество с людьми, управляющими заводами, даёт свои преимущества."
 FRA_connections_within_the_industrialists_tt: "£faction_fra_French_Industrialists §WПромышленники§! станут §3дружелюбнее§!, увеличивая £factory_output_texticon£ §Yобъем заводского производства§! и £dockyard_output_texticon §Yпроизводительность верфи§! на §G+10.00%§!."
  
 FRA_the_civil_and_military_organization_tt: "£faction_fra_national_bloc §YНациональный блок§! станет §3дружелюбнее§!, увеличивая £stability_texticon£ §Yстабильность§! на §G+5.00%§!, £political_power_texticon£ §Yежедневный прирост политической власти§! на §G+0.05§! и уменьшая £consumer_goods_texticon §Yожидаемое количество фабрик, перенаправленных на товары народного потребления§! на §Y-2.0%§!."
  
