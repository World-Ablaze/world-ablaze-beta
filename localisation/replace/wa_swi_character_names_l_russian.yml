 SWI_president_for_life_desc:0 "Федеральный совет — уникальное образование среди европейских стран. Он хорошо послужил государству [ROOT.GetNonIdeologyName] в мирные времена, но сейчас, когда очевидно, что совет и страну в целом возглавляет [SWI_confederation_president_name], есть все аргументы за то, чтобы [SWI_confederation_president_his] правление продолжалось бессрочно как основа стабильности державы [ROOT.GetNameDef]. "
 SWI_guisans_coup_desc:0 "[SWI_confederation_president_name] ведет нашу великую и мирную страну к войне и бедствиям. Это уже не то государство [ROOT.GetNonIdeologyName], которое мы знаем и любим. Оно все испорчено ради самосохранения. Есть лишь один человек, достаточно популярный и способный закончить эту войну раз и навсегда — и, в идеале, вернуть некогда нейтральную нацию к своим корням. Это Анри Гизан."
