 category_militia: "Все ополчение"
  

 heavy_cavalry: "Усиленная кавалерия"
 heavy_cavalry_desc: "Кавалерия, использующая минометы и пулеметы, а также основное пехотное снаряжение, при этом используя лошадей для быстрого выхода на позиции."

 camelry: "Верблюжья пехота"
 heavy_camelry: "Усиленная верблюжья пехота"
 heavy_camelry_desc: "Усиленная верблюжья пехота, использующая минометы и пулеметы, а также основное пехотное снаряжение, при этом используя верблюдов для быстрого занятия позиции."
 
 infantry_desc: "Пехота использует только базовое пехотное снаряжение и имеет преимущество в скорости."
  
 heavy_infantry: "Усиленная пехота"
 heavy_infantry_desc: "Усиленная пехота использует не только основное пехотное снаряжение, но и минометы, и пулеметы."
  
 militia_desc: "Подразделения ополченцев, как правило, являются менее хорошо обученными подразделениями, которые используются для быстрого укомплектования линии фронта во время чрезвычайных ситуаций."
 militia_infantry: "Ополчение"
 heavy_militia: "Усиленное ополчение"
 heavy_militia_desc: "Подразделения усиленного ополчения, как правило, являются менее хорошо обученными подразделениями, которые используются для быстрого укомплектования линии фронта во время чрезвычайных ситуаций. Они используют пулеметы"
  
 infantry_equipment: "Легкое пехотное снаряжение"
 infantry_equipment_short: "Легкое пехотное сн."
 infantry_equipment_desc: "Основное индивидуальное и коллективное стрелковое оружие пехоты, а также прочие элементы экипировки пехотинца."
  
 heavy_infantry_equipment: "Тяжелое пехотное снаряжение"
 heavy_infantry_equipment_short: "Тяжелое пехотное сн."
 heavy_infantry_equipment_desc: "Тяжелое вооружение для передовых частей, включая пулеметы, минометы и противотанковые ружья."

 heavy_bicycle_battalion: "Усиленный велосипедный батальон"
 heavy_bicycle_battalion_desc: "Более быстрая пехота с оружием в придачу."
  
  
 blackshirt_officers: "Офицеры-чернорубашечники"
 blackshirt_officers_desc: "Офицеры-чернорубашечники - это батальоны, наполненные идеологически настроенными фанатиками, которые преданы Дуче."
  
 ss_officers: "Офицеры СС"
 ss_officers_desc: "Офицеры СС — это батальоны, наполненные идеологически движимыми фанатиками, лояльными фюреру."
  
 garde_imperiale_officers: "Офицеры Имперской гвардии"
 garde_imperiale_officers_desc: "Закаленные в боях ветераны, лучшие среди лучших, подразделения Имперской гвардии входят в число лучших войск в мире."
  
 nkvd_commissars: "Комиссары НКВД"
 nkvd_commissars_desc: "Комиссарам обеспечить, чтобы офицеры выполняли все приказы в точности!"
  
 shock_division_hq: "Штаб ударной дивизии"
 shock_division_hq_desc: "Ударным войскам поручено прорывать линии противника с помощью чистой огневой мощи. Но не более того."
 
