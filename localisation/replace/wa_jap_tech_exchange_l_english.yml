l_english:
 JAP_gte_category:0 "Technology Exchange with Germany"
 JAP_gte_technology_exchange:0 "Technology Exchange with Germany"
 JAP_gte_technology_exchange_desc:0 "We will bring German engineers and documents home to Japan. The more of the waypoints along the way we and our allies hold, the better the chance they arrive safely."
 JAP_gte_status_tt:0 "On success, the focuses that follow the §YIJA Institute of Science§! become stronger.\n\nThe delegation goes via Suez if we hold [JAP_gte_line_suez_canal], otherwise round the Cape."
 JAP_gte_leg_mediterranean:0 "Crossing the Mediterranean"
 JAP_gte_leg_mediterranean_desc:0 "Holding [JAP_gte_line_malta] and [JAP_gte_line_derna] gives a good chance of getting through safely."
 JAP_gte_leg_red_sea:0 "Through the Red Sea"
 JAP_gte_leg_red_sea_desc:0 "Holding [JAP_gte_line_suez_canal] and [JAP_gte_line_french_somaliland] gives a good chance of getting through safely."
 JAP_gte_leg_atlantic:0 "Crossing the Atlantic"
 JAP_gte_leg_atlantic_desc:0 "Holding [JAP_gte_line_brittany] gives a good chance of getting through safely."
 JAP_gte_leg_cape:0 "Rounding the Cape"
 JAP_gte_leg_cape_desc:0 "Holding [JAP_gte_line_western_cape] and [JAP_gte_line_madagascar] gives a good chance of getting through safely."
 JAP_gte_leg_asia:0 "Across the Indian Ocean and South China Sea"
 JAP_gte_leg_asia_desc:0 "Holding [JAP_gte_line_ceylon], [JAP_gte_line_singapore] and [JAP_gte_line_taiwan] gives a good chance of reaching the home islands safely."
 JAP_gte_in_transit_tt:0 "No delegation is under way"
 JAP_gte_cooldown_tt:0 "180 days have passed since the last failure"
 JAP_gte_success_tt:0 "Focuses that follow the §YIJA Institute of Science§! and are completed from now on have stronger effects."
 JAP_gte_failure_tt:0 "§YTechnology Exchange with Germany§! can be attempted again in 180 days."
 JAP_gte_focus_hint_tt:0 "Completing this after the §YTechnology Exchange with Germany§! makes its effects stronger."
 JAP_gte_focus_hint_ta_dan_tt:0 "Completing this after the §YTechnology Exchange with Germany§! makes its effects stronger and also grants §YTa-dan§!."
 jap_gte.2.t:0 "Technology Arrives from Germany"
 jap_gte.2.desc:0 "After a journey of several months, German engineers and bundles of drawings have reached the home islands. Our technical staff can hardly wait to unpack them and are translating the documents through the night."
 jap_gte.2.a:0 "Put it to use without delay"
 jap_gte.3.t:0 "Contact with Germany Lost"
 jap_gte.3.desc:0 "The delegation that left Germany has not appeared past its due date. All contact ended with its last message, and the drawings and engineers entrusted to it are missing. Sending people and papers again will take time to prepare."
 jap_gte.3.a:0 "We will wait for the next chance"
 JAP_ta_dan:0 "Ta-dan Shaped Charge Rounds"
 JAP_ta_dan_desc:0 "Shaped charge rounds developed with German technical help. They let low-velocity mountain and infantry guns pierce tank armour."
