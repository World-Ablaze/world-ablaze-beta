 raj_armor.801.t: "Резолюция «Вон из Индии»"
 raj_armor.801.d: "Комитет Всеиндийского конгресса собрался в Бомбее, чтобы ратифицировать резолюцию «Вон из Индии». Поскольку Ганди называет это «сделай или умри» для Индии, это попытка освободить Радж из нашей хватки и заключить мир с нашими врагами. Если мы ничего не предпримем, это может оказаться катастрофическим для нашей войны в Азии."
 raj_armor.801.a: "Мы должны арестовать Конгресс"
 raj_armor.801.b: "Вмешательство приведет только к беспорядкам"
  
 raj_armor.802.t: "[ENG.GetName] арестовывает Всеиндийский конгресс"
 raj_armor.802.d: "Опасаясь нашего выхода из войны, британские власти арестовали Всеиндийский конгресс и подавили наше движение за независимость. Нам следует тщательно обдумать наш следующий шаг."
 raj_armor.802.a: "Мы останемся верны их резолюции"
 raj_armor.802.b: "С тяжелым сердцем мы должны отступить"
  
 raj_armor.803.t: "[FROM.GetNameDefCap] представляет инвестиционный портфель"
 raj_armor.803.desc: "Представители [FROM.GetNameDef] посетили нашу страну и встретились с нашими руководителями авиации, чтобы заручиться одобрением своей схемы инвестиций в алюминий. Правительство [FROM.GetNameDef] хотело бы, чтобы мы использовали наши ресурсы для создания авиаремонтной базы для оказания помощи воздушным операциям в Индии путем создания новых авиационных и алюминиевых заводов."
 raj_armor.803.a: "Думаем, нам это может быть выгодно"
 raj_armor.803.b: "Мы не видим существенной причины для таких инвестиций."
  
 raj_armor.804.t: "[FROM.GetNameDefCap] исключает возможность инвестиций"
 raj_armor.804.desc: "Мы получили плохие новости от [FROM.GetNameDef]: хотя [FROM.GetAdjective]ое правительство не питает к нам никакой неприязни, нам сказали, что [FROM.GetNameDef] не будет вкладывать какие-либо ресурсы в нашу алюминиевую базу."
 raj_armor.804.a: "Прискорбно"
  
 raj_armor.805.t: "[FROM.GetNameDefCap] инвестирует в новые алюминиевые заводы"
 raj_armor.805.desc: "Недавно [FROM.GetAdjective]ие официальные лица сообщили нам, что проект нашего аэродрома одобрен. Наши собственные инспекторы посетили строительную площадку, чтобы убедиться, что все соответствует нашим ожиданиям, и не ушли разочарованными."
 raj_armor.805.a: "Они оказали нам большую услугу."
  
 raj_armor.806.t: "Индийский национальный конгресс уходит в отставку"
 raj_armor.806.desc: "После нашего объявления войны Индийский национальный конгресс подал в отставку в знак протеста, сославшись на то, что одобрение и интересы Индии не были учтены. Это означало, что мы восстановили контроль над территориями, утраченными на провинциальных выборах, но теперь ИНК работает в тени..."
 raj_armor.806.a: "Будем надеяться, что шумихи больше не будет"
  
 raj_armor.807.t: "Миссия Криппса"
 raj_armor.807.desc: "По прибытии в Индию Криппс провел переговоры с индийскими лидерами и попытался удовлетворить все общины своими предложениями. Друг Неру, Криппс сделал все возможное, чтобы заключить соглашение. Однако между ИНК и британским правительством существует слишком большое недоверие, и многие влиятельные люди не хотели достижения урегулирования. Таким образом, у нас остался мятежный Радж, и единственным выходом которого является заключение в тюрьму мятежных членов, чтобы сохранить закон и порядок."
 raj_armor.807.a: "Заключить их в тюрьму"
 raj_armor.807.b: "Оставить их в покое"
 raj_armor.807.c: "Уступить"
  
 RAJ_cripps_mission_fail_tt: "§RПотеряет весь британский кабинет министров, высшее командование и генералов§!\n§YУдаляет Принкли §!\n\n"
  
 raj_armor.808.t: "Лахорская резолюция"
 raj_armor.808.desc: "Мухаммад Зафарулла Хан пришел к нам с предложением заручиться поддержкой мусульманского населения в военных действиях. Ссылаясь на волнения между различными религиозными группами в Радже, он предложил нам гарантировать отдельное мусульманское государство после окончания войны, чтобы максимизировать безопасность индийских мусульман."
 raj_armor.808.a: "Это соглашение к лучшему"
 raj_armor.808.b: "Мы можем предложить лишь более широкое представительство"
  
 raj_armor.809.t: "Отправить Уэйвелла в Британскую Индию?"
 raj_armor.809.desc: "В нынешних обстоятельствах Британскому правлению требуется более милитаристский характер, чем нынешнему вице-королю. Уэйвелл — лучший выбор на эту позицию, но мы можем заменить его на Клода Окинлека. Должны ли мы одобрить этот обмен?"
 raj_armor.809.a: "Он будет хорошей заменой"
 raj_armor.809.b: "Уэйвелл слишком ценен для нас."
 RAJ_wavell_auchinleck_swap_tt: "Обменяю §YАрчибальда Уэйвелла§! на §YКлода Окинлека§!"
  
 raj_armor.810.t: "[FROM.GetName] отправляет Уэйвелла"
 raj_armor.810.desc: "Великобритания направила Арчибальда Уэйвелла в качестве нашего нового наместника, который сразу же энергично занял свою новую должность и будет руководить Раджем до конца войны."
 raj_armor.810.a: "Отлично"
  
 raj_armor.811.t: "[FROM.GetName] не отправляет Уэйвелла"
 raj_armor.811.desc: "Великобритания не увидела хорошей замены нашему нынешнему вице-королю, ссылаясь на то, что все кандидаты слишком ценны для их военных усилий."
 raj_armor.811.a: "Обойдемся"
  
 raj_armor.812.t: "Индия требует независимости!"
 raj_armor.812.desc: "Протестующие штурмовали Дом правительства, и насилие распространилось на все города. Наша ситуация в Британском Владычестве несостоятельна, и эвакуация британского штаба должна начаться немедленно. Несомненно, сразу же после нашего ухода новый индийский конгресс выйдет из войны. Все потеряно."
 raj_armor.812.a: "Произошла катастрофа"
  
 raj_armor.813.t: "Угроза голода"
 raj_armor.813.desc: "Наша нынешняя стратегическая ситуация на востоке вызывает серьезные волнения среди гражданского населения. Наше нынешнее правительство больше беспокоит ситуация за рубежом, чем то, что назревает внутри страны. если наша стратегическая ситуация не будет исправлена ​​в ближайшее время или не будет заменено правительство, мы можем столкнуться с серьезным кризисом."
 raj_armor.813.a: "Мы должны исправить ситуацию"
  
 raj_armor.814.t: "Бенгальский голод"
 raj_armor.814.desc: "Бенгалия и раньше страдала от голода, но на этот раз события сделали ситуацию намного хуже, чем обычно. Поразительно некомпетентная колониальная администрация показала себя совершенно неспособной – или, возможно, даже не желающей – адекватно отреагировать на циклон, уничтоживший большую часть урожая риса в Бенгалии. Поскольку беженцы прибывают из пострадавших от войны регионов страны, спрос на продовольствие растет с каждым днем, в то время как предложение сокращается. \n\nЦены на продукты питания резко выросли, в результате чего люди перестали ходить на работу, за которую больше не платят достаточно, чтобы прокормить свои семьи. Число призывников в армию также значительно сократилось, поскольку все больше и больше людей отказываются покидать свои дома, чтобы сражаться за правительство, которое ничего не делает, чтобы им помочь."
 raj_armor.814.a: "Это катастрофа!"
  
 raj_armor.814.t_avoided: "Бенгальского голода удалось избежать"
 raj_armor.814.desc_avoided: "Благодаря нашим недавним успехам ситуация в Бенгалии стабилизировалась, и признаки голода начали исчезать."
 raj_armor.814.b: "Отличная работа, все молодцы"
  
 raj_armor.815.t: "Бенгальский голод подходит к концу"
 raj_armor.815.desc: ""
 raj_armor.815.a: "Слава богу, все закончилось"
  
 raj_armor.816.t: "Отделиться от Великобритании?"
 raj_armor.816.desc: "Падение Великобритании подарило нам уникальную возможность оторваться от Империи."
 raj_armor.816.a: "Воспользуемся этим!"
 raj_armor.816.b: "Мы должны оставаться верными!"
  
 raj_armor.817.t: "Движение «Вон из Индии» сорвано!"
 raj_armor.817.desc: "Наши войска успешно сломили решимость Индийского национального конгресса, и в Радже был восстановлен мир. Теперь мы можем полностью сосредоточить свое внимание на военных действиях."
 raj_armor.817.a: "Блестяще"
  
 raj_armor.890.t: "Вспыхивают протесты с применением насилия!"
 raj_armor.890.desc: "Движение «Quite India» стало жестоким! необходимы немедленные действия, чтобы подавить движение и удержать Индию под британским контролем."
 raj_armor.890.a: "Неприемлемо!"