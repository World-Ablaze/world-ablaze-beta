l_english:
 jap_ins_surrender.2.t:0 "Surrender of the Dutch East Indies"
 jap_ins_surrender.2.d:0 "Surabaya has fallen after Batavia, and the Palembang oilfields are in our hands. Cornered at their last stronghold of Bandung, the Dutch forces have at last agreed to surrender in full. The occupied islands will be placed under army and navy military administration, and the resources of the south will sustain our war."
 jap_ins_surrender.2.a:0 "The riches of the south are ours"
 jap_ins_surrender.2.a_tt:0 "The islands of the §YDutch East Indies§! become §Ythree military administrations§! under our control"
