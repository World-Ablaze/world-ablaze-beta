l_english:
 # Ultimatum to Outer Mongolia (events/JAP_mongolia_ultimatum.txt). The texts follow jap_armor.835 and 836 (the ultimatum to Thailand).
 jap_pol_mongolia.1.t:0 "[JAP.GetName] Issues an Ultimatum"
 jap_pol_mongolia.1.d:0 "Japan has turned north and has sent us a diplomatic envoy in hopes of having us break with [SOV.GetNameDef] and stand on their side. However they have come with a dagger in hand and it is clear that they will not take no for an answer."
 jap_pol_mongolia.1.a:0 "Our future is with the co-prosperity sphere"
 jap_pol_mongolia.1.b:0 "If we are to go to war, let it be in defense of our homeland"
 jap_pol_mongolia.2.t:0 "[MON.GetName] Rejects our Ultimatum"
 jap_pol_mongolia.2.d:0 "Unfortunately our envoy has failed to secure an alliance with [MON.GetName], however their strategic importance means that we must use force to make Outer Mongolia into a good staging area."
 jap_pol_mongolia.2.a:0 "We will have to use force."
