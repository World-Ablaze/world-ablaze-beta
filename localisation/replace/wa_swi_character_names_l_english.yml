 SWI_president_for_life_desc:0 "The Federal Council is unique among European countries, it has served [ROOT.GetNonIdeologyName] well during times of peace, but now that it's clear that [SWI_confederation_president_name] is leading the council and the country as a whole, there's a good argument for [SWI_confederation_president_his] rule to continue indefinitely, as a pillar of stability in [ROOT.GetNameDef]. "
 SWI_guisans_coup_desc:0 "[SWI_confederation_president_name] has lead our great and peaceful country to war and misery. This is not the [ROOT.GetNonIdeologyName] we know and love, it has been corrupted in the name of self-preservation. There's only one man popular and capable enough to end this war once and for all and hopefully return this once neutral nation to its roots; Henri Guisan."
