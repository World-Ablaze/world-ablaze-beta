 gre_focus.001.t: "Демерцис умер от сердечного приступа"
 gre_focus.001.d: "Сегодня утром, прежде чем его правительство могло быть утверждено парламентом посредством вотума доверия, Демерцис был найден мертвым от сердечного приступа."
 gre_focus.001.a: "Вице-президент Метаксас возьмет на себя управление"
  
 gre_focus.002.t: "Рабочие бастуют"
 gre_focus.002.d: "По всей стране прокатились забастовки в ответ на вступление Метаксаса в должность премьер-министра."
 gre_focus.002.a: "Да..."
  
 gre_focus.003.t: "Приобретение орудий для переоборудования додредноутов"
 gre_focus.003.a: "Немецкие орудия"
 gre_focus.003.b: "Британские орудия"
 gre_focus.003.c: "Американские орудия"
 gre_focus.003.d: "Французские орудия"
  
 gre_focus.004.t: "Смерть Метаксаса"
 gre_focus.004.a: "Мы скорбим по нашему герою"
  
 gre_focus.005.t: "Александрос Коризис совершил самоубийство"
 gre_focus.005.a: "§YКороль§! поведёт нас!"
  
 gre_focus.006.t: "Италия вытеснена из Албании"
 gre_focus.006.d: "Напав на Грецию, несмотря на то, что им было приказано не делать этого, они теперь потеряли свои плацдармы в Албании, потерпев полное поражение от греков."
 gre_focus.006.a: "Греки зарекомендовали себя, предложите им место в «Оси», прежде чем они пригласят англичан"
 gre_focus.006.b: "Придется разобраться с ними"

 gre_focus.007.t: "Германия предлагает нам присоединиться к «Оси»"
 gre_focus.007.d: "После нашей победы над Италией немцы предлагают принудить итальянцев к миру, если мы готовы вступить с ними в союз и не допускать британских войск на нашу землю."
 gre_focus.007.a: "Держите своих врагов ближе, говорили они..."
 gre_focus.007.b: "Никогда!"