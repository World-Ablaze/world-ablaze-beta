 GRE_armed_neutrality: "Вооруженный нейтралитет"
 GRE_armed_neutrality_desc: "На горизонте маячит еще одна война в Европе, даже если мы не можем сказать, какое направление она примет. Мы не можем доверять Лиге Наций в том, что она защитит такую маленькую страну, как Греция. Вооруженный нейтралитет - это единственный способ уберечься от нее и позволить нам пережить шторм."
  
 GRE_ask_for_german_protection: "Попросить защиты у Германии"
 GRE_ask_for_german_protection_desc: ""
  
 GRE_british_gurantees: "Британские гарантии"
 GRE_british_gurantees_desc: ""
  
 GRE_build_the_metaxas_line: "Построить линию Метаксаса"
 GRE_build_the_metaxas_line_desc: "Болгары, недовольные мирным договором 1919 года, с нетерпением ждут любой возможности вернуть свои утраченные земли. Мы не можем им доверять, мы должны обезопасить нашу границу."
  
 GRE_secure_the_albanian_border: "Обеспечить безопасность албанской границы"
 GRE_secure_the_albanian_border_desc: "Поскольку итальянцы оккупировали Албанию, у них теперь есть прямой путь к осуществлению своих притязаний на нашу страну. Мы должны быть готовы к их нападению, поскольку вопрос лишь в том, когда они нанесут удар."
  
