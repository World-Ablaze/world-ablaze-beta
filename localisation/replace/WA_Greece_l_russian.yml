 GRE_danza_de_la_muerte: "«Пляска смерти»"
 GRE_danza_de_la_muerte_desc: "В Испании, охваченной гражданской войной, многие группировки отчаянно ищут оружие. Это прекрасная возможность увеличить наш бюджет, выполнив все их просьбы."
  
 GRE_every_warlord_a_customer: "Каждый милитарист — клиент"
 GRE_every_warlord_a_customer_desc: "Война в Китае открывает еще одну прекрасную возможность для продажи оружия. И нам понадобится как можно больше денег, чтобы подготовить Грецию к грядущим временам."
  
 GRE_profit_from_the_schachtplan: "Извлечь выгоду из плана Шахта"
 GRE_profit_from_the_schachtplan_desc: "Германия, основной получатель нашего экспорта, создала схему, вынуждающую тратить все платежи только на покупку немецких товаров. Мы можем использовать это в своих интересах, покупая немецкое оружие и получая прибыль от его перепродажи."
  
