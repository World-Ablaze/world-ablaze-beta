 GRE_hold_the_1936_elections: "Провести выборы 1936 года"
 GRE_hold_the_1936_elections_desc: "После большой политической нестабильности и двух неудачных переворотов с начала 1930-х годов генерал Кондилис вернул короля Георга к власти в прошлом году. Теперь, после новых выборов под руководством временного премьер-министра короля, мы надеемся, что сможем вернуть стабильность в нашу страну."
  
 GRE_appoint_metaxas: "Назначить Метаксаса"
 GRE_appoint_metaxas_desc: "В условиях усиления коммунистов королю нужен в правительстве кто-то, кто был бы достаточно силен, чтобы поддерживать коалицию и сдерживать левых, но кто не стал бы возглавлять очередной переворот против него. Генерал Иоаннис Метаксас, похоже, как раз такой человек."
  
 GRE_the_broad_coalition: "Широкая коалиция"
 GRE_the_broad_coalition_desc: ""
  
 GRE_the_government_crisis: "Правительство в кризисе"
 GRE_the_government_crisis_desc: "Вместо стабильности мы получили еще один тупик между популистами и либералами. Кроме того, Коммунистическая партия получила достаточно мест, чтобы повлиять на результаты голосования."
  
 GRE_continue_demertzis_government: "Сохранить правительство Демерциса"
 GRE_continue_demertzis_government_desc: "Избранные партии не в состоянии сформировать какое-либо правительство, вместо этого они просто ссорятся друг с другом. Демерцису снова придется взять ситуацию в свои руки."
  
 GRE_vote_of_confidence: "Провести вотум доверия"
 GRE_vote_of_confidence_desc: "Поскольку новое правительство, по сути, назначается королем, мы проведем вотум доверия, чтобы подтвердить его позицию."
  
 GRE_declare_state_of_emergency: "Объявить чрезвычайное положение"
 GRE_declare_state_of_emergency_desc: "Забастовки в знак протеста против захвата правительства Метаксасом дают прекрасную возможность закрепить и сосредоточить власть в руках премьер-министра, объявив чрезвычайное положение и распустив парламент. Это единственный способ вернуть нашу страну в нужное русло."
  
 GRE_ban_all_parties: "Запретить все партии"
 GRE_ban_all_parties_desc: "Чтобы вернуть стабильность, нам нужно смести старую систему роялистов и венизелистов. Все политические партии должны уйти."
  
