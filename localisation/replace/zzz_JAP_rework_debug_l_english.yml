l_english:
 JAP_rework_debug:0 "Japan Rework Debug"
 debug_jr_gakutotai_all_subjects:0 "[Debug] Grant Gakutotai to All Subjects"
 debug_jr_gakutotai_all_subjects_desc:0 "Immediately grants the Gakutotai national spirit to every subject country."
 debug_jr_ins_investment_payoff:0 "[Debug] Apply East Indies Investment Payoff"
 debug_jr_ins_investment_payoff_desc:0 "Immediately applies the completion effects of the East Indies investment decisions (resource gains plus the stability hit)."
 debug_jr_mil_admin_level_up:0 "[Debug] Raise Military Administration Burden"
 debug_jr_mil_admin_level_up_desc:0 "Raises Japan's military administration burden by one level."
 debug_jr_establish_burma:0 "[Debug] Establish Burma Instantly"
 debug_jr_establish_burma_desc:0 "Establishes the Imperial Protectorate of Burma (IPB), ignoring all conditions."
 debug_jr_establish_indochina:0 "[Debug] Establish Indochina Instantly"
 debug_jr_establish_indochina_desc:0 "Establishes the Empire of Vietnam, the Kingdom of Cambodia and the Kingdom of Luang Prabang, ignoring all conditions."
 debug_jr_establish_philippines:0 "[Debug] Establish the Philippines Instantly"
 debug_jr_establish_philippines_desc:0 "Establishes the Imperial Protectorate of the Philippines (IPP), ignoring all conditions. The Laurel government takes office and six Philippine core states are transferred (Palawan ownership stays with PHI, which survives as the host of the uprising)."
 debug_jr_rice_grant:0 "[Debug] Gain Rice Requisition Instantly"
 debug_jr_rice_grant_desc:0 "Immediately grants the Indochinese Rice Requisition national spirit."
 debug_jr_fire_rice_grace:0 "[Debug] Fire the Rice Requisition Expiry Event"
 debug_jr_fire_rice_grace_desc:0 "Immediately fires the grace period expiry event (jap_rework.1)."
 debug_jr_control_andaman:0 "[Debug] Take Control of the Andamans"
 debug_jr_control_andaman_desc:0 "Transfers control of the Andaman and Nicobar Islands (state 733) to Japan."
 debug_jr_statehood_all:0 "[Debug] Grant Statehood to All Protectorates"
 debug_jr_statehood_all_desc:0 "Grants nominal independence to every subject on the Imperial Protectorate autonomy level at once."
 debug_jr_phi_guerrillas:0 "[Debug] Spawn Philippine Guerrillas"
 debug_jr_phi_guerrillas_desc:0 "Spawns organized guerrilla activity in every Philippine core state except Manila."
 debug_jr_phi_uprising:0 "[Debug] Fire the Great Uprising Event"
 debug_jr_phi_uprising_desc:0 "Immediately fires the great uprising event (jap_rework.2) in the Philippines."
 debug_jr_shonan_bonus:0 "[Debug] Fire the Shonan Bonus"
 debug_jr_shonan_bonus_desc:0 "Immediately fires the Southeast Asia focus discount event (jap_rework.3)."
 debug_jr_geac_now:0 "[Debug] Convene the Greater East Asia Conference Now"
 debug_jr_geac_now_desc:0 "Sends the conference convocation notice to every member, ignoring the timer."
 debug_jr_conquer_philippines:0 "[Debug] Conquer the Philippines Instantly"
 debug_jr_conquer_philippines_desc:0 "Transfers control of the seven Philippine states to Japan and deletes the Philippine Army's starting divisions (board setup for wartime establishment tests; press after declaring war)."
 debug_jr_war_usa_eng:0 "[Debug] Declare War on the USA and UK"
 debug_jr_war_usa_eng_desc:0 "Declares war on the United States, the Philippines, the United Kingdom and the British Raj at once."
 debug_jr_found_sphere:0 "[Debug] Found the Co-Prosperity Sphere Instantly"
 debug_jr_found_sphere_desc:0 "Grants Japan the organization leader badge and enrolls every current subject into the Sphere at once (replicates the focus effect)."
 debug_jr_sphere_join_sia:0 "[Debug] Make Siam Join the Sphere"
 debug_jr_sphere_join_sia_desc:0 "Makes Siam leave the League of Nations and join the Co-Prosperity Sphere (replicates the ultimatum acceptance handling)."
 debug_jr_establish_ijn:0 "[Debug] Establish the Combined Fleet HQ (IJN) Instantly"
 debug_jr_establish_ijn_desc:0 "Establishes the Imperial Japanese Navy (IJN) instantly, ignoring cost and conditions. Transfers states 633 and 684 and puts it on the Imperial Protectorate autonomy level under Japan."
 debug_jr_te_unlock_nf:0 "[Debug] Complete the Tokyo Express Focus"
 debug_jr_te_unlock_nf_desc:0 "Completes the Tokyo Express Operations focus instantly, unlocking the decision category. The completion reward fires as normal, so the notification event also goes out to the USA/UK if they are at war with Japan."
 debug_jr_te_start:0 "[Debug] Launch the Tokyo Express Now"
 debug_jr_te_start_desc:0 "Launches a Tokyo Express run instantly, hard-wired to sea region 84 (Bismarck Sea), ignoring all conditions. Transfers eight Minekaze-class destroyers (or any destroyers if the named ships are missing) to the IJN as real ships, gives the IJN a 7-day flank speed buff (+5000% naval speed), and applies the supply modifier (5% per surviving ship, up to 40%) to the states facing the region (737, 1004, 1002)."
 debug_jr_te_end:0 "[Debug] End the Tokyo Express Now"
 debug_jr_te_end_desc:0 "Sets JAP_te_rounds to 0. Fleet return and modifier removal happen on the next JAP_te_tick_mission tick (up to 7 days later)."
 debug_jr_te_seed:0 "[Debug] Re-elect Region Anchors"
 debug_jr_te_seed_desc:0 "Manually reruns the anchor election (JAP_te_refresh_anchors_effect), re-picking the icon host state for all 37 sea regions."
 debug_jr_te_anchors_toggle:0 "[Debug] Toggle Forced Display of All Region Icons"
 debug_jr_te_anchors_toggle_desc:0 "Toggles the JAP_te_debug_anchors flag. While it is up, all 37 regions show their icon on the top-priority state regardless of controller (the anchor election is rerun immediately)."
 debug_jr_flank_speed_jap:0 "[Experiment] Flank Speed Buff on Japan (10 Days)"
 debug_jr_flank_speed_jap_desc:0 "Gives Japan a +5000% naval speed buff for 10 days, for measuring how far fleets can actually travel."
 debug_jr_te_warp_test:0 "[Experiment] Transfer a Destroyer to the IJN and Warp It to Truk"
 debug_jr_te_warp_test_desc:0 "Tests whether teleport_armies (documented as army-only) also works on fleets in port. Transfers one Japanese destroyer to the IJN, then sweeps every state and teleports IJN-owned units to the Truk anchorage (province 2489). The IJN owns no land divisions, so Japanese divisions are unaffected. Press after establishing the IJN."
