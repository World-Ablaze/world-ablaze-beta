l_russian:
 ROM_ion_antonescu_party: "ПН"
 ROM_ion_antonescu_party_long: "Партия Нации"
  
 ROM_invest_in_civil_works: "Инвестиции в гражданское строительство"
 ROM_invest_in_civil_works_desc: "Положение Румынии таково, что в большинстве секторов она отстает от наших конкурирующих соседей. Поэтому мы должны довести эти отрасли до должного уровня."
 
 ROM_arcul_de_triumf: "Триумфальная арка"
 ROM_arcul_de_triumf_desc: "Триумфальная арка начала разрушаться, а поскольку этот памятник очень важен, необходима его реставрация в камне."
 
 ROM_expand_the_malaxa_industries: "Расширение заводов Malaxa"
 ROM_expand_the_malaxa_industries_desc: "Компания Malaxa — промышленный гигант, основанный в Румынии, обеспечивающий многие товары для индустриализации. Расширение этой компании поможет нам в процессе индустриализации."
 
 ROM_committee_of_national_defense: "Комитет национальной обороны"
 ROM_committee_of_national_defense_desc: "Румыния расположена между растущими военными угрозами, и с учетом наших недавних территориальных приобретений, многие из этих держав могут попытаться вернуть эти земли."
 
 ROM_resita_industry: "Промышленность Решицы"
 ROM_resita_industry_desc: "Город Решица уже является домом для предприятий, которые активно финансировались Австрийской империей. Поскольку он находится рядом с местами добычи ресурсов в регионе Банат, предоставление дополнительного финансирования позволит расширить его деятельность и даст больше для страны."
 
 ROM_copsa_mica_works: "Заводы Копша-Микэ"
 ROM_copsa_mica_works_desc: "Расположенный в Трансильвании, город Копша-Микэ добывает и производит множество продуктов, используемых в военных и промышленных товарах. При наличии возможности этот город может быть расширен для добычи других металлов."
 
 ROM_new_aluminium_enteprises: "Финансирование новых алюминиевых предприятий"
 ROM_new_aluminium_enteprises_desc: "Применение алюминия приобретает все большее значение, учитывая его многочисленные способы использования не только в военной продукции, но и, во все возрастающей степени, в гражданских целях."
 
 ROM_mausoleum_of_marasesti: "Мавзолей в Мэрэшешти"
 ROM_mausoleum_of_marasesti_desc: "Место памяти наших солдат, павших в Великой войне"
 
 ROM_urbanize_city_centres: "Урбанизация городских центров"
 ROM_urbanize_city_centres_desc: "Внедрение специальных пешеходных дорожек, дорог и железных дорог в наших городах поднимет их уровень и повысит эффективность транспортировки, что приведет к ускорению роста."
 
 ROM_nationalize_caile_ferate_romane: "Национализация Румынских железных дорог"
 ROM_nationalize_caile_ferate_romane_desc: "Локомотивы — основа транспортной системы; следует приложить усилия для расширения их возможностей и увеличения количества."
 
 ROM_invite_foreign_companies: "Приглашение иностранных компаний"
 ROM_invite_foreign_companies_desc: "Иностранные компании приносят с собой обширные знания и возможности, которых не хватает на местном уровне, что позволяет привлекать иностранные инвестиции из таких промышленных центров, как Германия, Франция и даже Россия. Это значительно улучшит нашу промышленную базу."
 
 ROM_expand_the_mines: "Расширение шахт"
 ROM_expand_the_mines_desc: "Нашей растущей промышленности требуется сырье. В особенности материалы, используемые для производства переработанных ресурсов."
 
 ROM_a_manufacturing_powerhouse: "Промышленная держава"
 ROM_a_manufacturing_powerhouse_desc: "Румыния превратится в промышленного гиганта, который будет соперничать с Венгрией и Югославией и начнет доминировать на всех Балканах."
 
 ROM_armys_study_and_experimental_board: "Армейский совет по изучению и экспериментам"
 ROM_armys_study_and_experimental_board_desc: "Наша армия катастрофически устарела; поэтому первоочередной задачей должно стать улучшение всех ее аспектов."
 
 ROM_romanian_optical_enterprise: "Румынское оптическое предприятие"
 ROM_romanian_optical_enterprise_desc: "Такие страны, как Германия и Россия, создали сильную армию; нам не составит труда наблюдать за ними и извлекать уроки для собственного развития."
 
 ROM_begin_rearmament: "Начало перевооружения"
 ROM_begin_rearmament_desc: "В условиях растущих военных угроз, окружающих Румынию, необходимо начать перевооружение. Чтобы обезопасить Великую Румынию."
 
 ROM_orita_factories: "Заводы по производству пистолетов-пулеметов Orita"
 ROM_orita_factories_desc: "Пистолет-пулемет Orita — это значительное улучшение боевых возможностей нашей пехоты, особенно с учетом растущей роли боев в городах. Будут созданы новые заводы для производства большего количества этого оружия."
 
 ROM_industria_aeronautica_romana: "Industria Aeronautică Română"
 ROM_industria_aeronautica_romana_desc: "Потребность в развитии авиации растет с каждым днем — не только для защиты наших войск, но и чтобы лишить врага поддержки. Именно поэтому нам необходимо увеличить внутреннее производство самолетов."
 ROM_industria_aeronautica_romana_tt: "Развернуто хотя бы [GetROMAeronautica]/§G600§! ед. §Yистребителей§!/§Yмногоцелевых самолетов§!\n"

 ROM_arges_factories: "Заводы в Арджеше"
 ROM_arges_factories_desc: "В регионе Арджеш не хватает промышленных мощностей, способствующих укреплению обороны. Будут построены новые заводы для производства пехотного снаряжения."

 ROM_resita_artillery_factories: "Артиллерийские заводы в Решице"
 ROM_resita_artillery_factories_desc: "В Решице уже есть заводы, к тому же город расположен рядом с шахтами. Это логичное место для строительства военных заводов, чтобы удовлетворить потребности военного времени."

 ROM_societatea_pentru_exploatari_tehnice: "Societatea Pentru Exploatări Tehnice"
 ROM_societatea_pentru_exploatari_tehnice_desc: "Машиностроительный завод, превращенный в авиационный. Опыт работы с инструментами и производством поможет ему повысить эффективность и выполнять производственные планы."

 ROM_labour_force_mobilization: "Мобилизация рабочей силы"
 ROM_labour_force_mobilization_desc: ""

 ROM_land_grants: "Земельные наделы"
 ROM_land_grants_desc: "Земля будет передана растущим отраслям промышленности, чтобы ускорить наш прогресс на пути к индустриализации."

 ROM_improve_the_danubian_transport_network: "Улучшение транспортной сети Дуная"
 ROM_improve_the_danubian_transport_network_desc: "Инфраструктура — ключ к бесперебойной работе всего, поэтому ее следует улучшить вокруг нашей столицы."

 ROM_improve_the_carpathian_transport_network: "Улучшение транспортной сети Карпат"
 ROM_improve_the_carpathian_transport_network_desc: "Необходимо упростить передвижение по труднопроходимой местности в регионе Трансильвании. Поскольку там расположены несколько ключевых предприятий, крайне важно построить надлежащие дороги и железные дороги, чтобы облегчить поток товаров в столицу."

 ROM_set_up_a_welfare_system: "Создание системы социального обеспечения"
 ROM_set_up_a_welfare_system_desc: "Переход от аграрного образа жизни к работе на заводе может быть резким и трудным. Необходимо создать систему, которая облегчит этот переходный этап."

 ROM_tackle_corruption: "Борьба с коррупцией"
 ROM_tackle_corruption_desc: "Коррупция — это болезнь, которую нужно вырезать с корнем, чтобы предотвратить ее распространение. Растет обеспокоенность тем, что коррупция присутствует почти на всех уровнях нашего государства. Потребуется тщательное расследование."
 ROM_tackle_corruption_tt: "Будут открыты решения: §YБорьба с коррупцией§!."

 ROM_continue_the_violence: "Продолжить насилие"
 ROM_continue_the_violence_desc: ""

 ROM_unite_with_the_ncp: "Объединиться с НХП"
 ROM_unite_with_the_ncp_desc: ""

 ROM_organize_the_peasants: "Организовать крестьян"
 ROM_organize_the_peasants_desc: ""
 ROM_organize_the_peasants_tt: "§YПозволяет получить плацдармы на родине, которые будут под вашим контролем в начале гражданской войны§!"

 ROM_steal_carols_records: "Украсть записи Кароля"
 ROM_steal_carols_records_desc: ""

 ROM_sway_the_military: "Склонить армию на свою сторону"
 ROM_sway_the_military_desc: ""
 ROM_sway_the_military_tt: "§YПозволяет склонить армейских лидеров и их войска присоединиться к нашему восстанию§!"

 ROM_everything_for_the_country: "Все для страны"
 ROM_everything_for_the_country_desc: ""
 ROM_everything_for_the_country_tt: "§OБудет автоматически выполнено в начале выборов в декабре 1937 года\n§!"

 ROM_the_national_legionary_state: "Национальное легионерское государство"
 ROM_the_national_legionary_state_desc: ""

 ROM_the_legion_of_archangel_michael: "Легион Архангела Михаила"
 ROM_the_legion_of_archangel_michael_desc: ""
 ROM_the_legion_of_archangel_michael_tt: "£manpower_texticon£ Развертывает §Yэлитную танковую/моторизованную дивизию§!."

 ROM_nationalization_of_the_economy: "Национализация экономики"
 ROM_nationalization_of_the_economy_desc: ""

 ROM_abandon_former_treaties: "Отказаться от всех прежних договоров"
 ROM_abandon_former_treaties_desc: ""

 ROM_social_reforms: "Социальные реформы"
 ROM_social_reforms_desc: ""
 ROM_social_reforms_tt: "§GПостепенно привнесет закон и порядок в страну, в конечном итоге подавив крестьянское восстание§!"

 ROM_the_night_of_iron_lances: "Ночь железных копий"
 ROM_the_night_of_iron_lances_desc: ""

 ROM_fuel_the_red_terror: "Разжечь красный террор"
 ROM_fuel_the_red_terror_desc: ""

 ROM_reform_the_inteligensia: "Реформировать интеллигенцию"
 ROM_reform_the_inteligensia_desc: "В Румынии одни из самых высоких показателей количества выпускников вузов во всей Европе. Слишком долго они не могли найти применение своим знаниям, но этому пришел конец. Мы создадим новые гражданские и военные департаменты, которые найдут применение нашим выпускникам, а также очистим их от франкофилов, которые угрожают нашей независимости и военной мощи."

 ROM_appoint_calinescu: "Назначить Кэлинеску"
 ROM_appoint_calinescu_desc: "Образованный и опытный политик, способный противостоять насильственным радикальным движениям на политической арене Румынии. Кэлинеску поможет пройти через эти опасные времена, чтобы сохранить Румынию."

 ROM_protect_greater_romania: "Защитить Великую Румынию"
 ROM_protect_greater_romania_desc: "Румынию окружают большевики на востоке, недовольные венгры и болгары. Мы должны приложить усилия, чтобы подготовиться к защите всех румын."


 ROM_his_majestys_loyal_government_desc: "Внутренняя лояльность имеет первостепенное значение, и до тех пор, пока нация поддерживает своего короля, прагматичная внешняя политика не требуется."

 ROM_constitutional_guarantees_desc: "Конституционные изменения, внедренные королем, должны быть отменены, а также должна быть введена система гарантий, сдержек и противовесов, чтобы подобное не повторилось. В противном случае все, что у нас останется, — это пародия на демократию."

 ROM_hunedoara_steel_works_desc: "Чтобы обеспечить потребности нашего производства вооружения, крупные сталелитейные заводы в Трансильвании должны быть модернизированы и значительно расширены."

 ROM_gorgo_government: "Правительство Гоги"
 ROM_gorgo_government_desc: "Октавиан Гога имеет множество связей с широким кругом политических групп. Хотя он более непредсказуем, мы можем рассчитывать на его непоколебимую поддержку Румынии."
 ROM_gorgo_government_flag: "Фокус §Y$ROM_gorgo_government$§! выполнен"
 ROM_gorgo_government_tt: "В настоящее время: [?ROM_gorgo_government_flag:days|Y0]"

 ROM_the_night_of_the_vampires: "Ночь вампиров"
 ROM_the_night_of_the_vampires_desc: "Политическое насилие Железной гвардии вышло из-под контроля. Чтобы защитить Румынию, эта организация должна быть подвергнута чистке и изгнанию."

 ROM_national_renaissance_front: "Фронт национального возрождения"
 ROM_national_renaissance_front_desc: "Новая партия будет сформирована исключительно для централизации правительственной власти под руководством короля и его ставленников. С момента её создания все остальные партии будут запрещены. Это гарантирует, что оппозиционные группы не смогут поставить под угрозу Румынию или сбить её с выбранного пути."

 ROM_support_of_the_elites: "Поддержка элит"
 ROM_support_of_the_elites_desc: ""

 ROM_all_parties_must_end_tt: "§GПоложит конец глупым расходам короля Кароля§!"

 ROM_national_liberal_party: "Национал-либеральный фронт"
 ROM_national_liberal_party_desc: ""

 ROM_balkan_dominance: "Господство на Балканах"
 ROM_balkan_dominance_desc: "Наше положение на Балканах, где у нас крупнейшая армия и промышленность, дает нам силу; мы сможем использовать это в своих интересах."

 ROM_tear_down_the_balkan_pact: "Разорвать Балканский пакт"
 ROM_tear_down_the_balkan_pact_desc: ""

 ROM_strengthen_the_balkan_pact: "Укрепить Балканский пакт"
 ROM_strengthen_the_balkan_pact_desc: "Балканский пакт обеспечивает сохранение мира на Балканах. Хотя некоторые страны отказались к нему присоединиться, основные страны региона — Югославия, Греция и мы сами — позволят обеспечить соблюдение пакта."

 ROM_introduce_turkey_into_the_pact: "Включить Турцию в пакт"
 ROM_introduce_turkey_into_the_pact_desc: "Следует направить приглашение Турции, поскольку ее участие пойдет на пользу и ей, и нам."

 ROM_unite_the_balkan_entente: "Объединить Балканскую Антанту"
 ROM_unite_the_balkan_entente_desc: ""

 ROM_preserve_romania: "Сохранить Румынию"
 ROM_preserve_romania_desc: "Великая война закончилась, и в награду мы получили земли, населенные румынами. Благодаря этому приобретению весь румынский народ будет жить в пределах Великой Румынии."

 ROM_fortress_brigades: "Крепостные бригады"
 ROM_fortress_brigades_desc: "Небольшие специализированные бригады, предназначенные для действий в укреплениях, облегчат лежащую на армии нагрузку по охране всех наших границ."
 ROM_fortress_brigades_tt: "£manpower_texticon Будут развернуты §Y2 бригады крепостной артиллерии§!"

 ROM_unite_the_little_entente: "Объединить Малую Антанту"
 ROM_unite_the_little_entente_desc: ""

 ROM_neutrality_at_all_costs: "Нейтралитет любой ценой"
 ROM_neutrality_at_all_costs_desc: "Еще слишком рано выбирать сторону в этом новом европейском конфликте. Учитывая нашу удаленность, мы сможем придерживаться нейтралитета и дождаться, пока не станет ясно, какая сторона выгоднее."

 ROM_alliance_with_france: "Союз с Францией"
 ROM_alliance_with_france_desc: ""

 ROM_failure_of_france: "Крах Франции"
 ROM_failure_of_france_desc: "Франция не смогла остановить немецкое наступление, и её почти полная капитуляция неизбежна. Необходимо принять меры для обеспечения нашего дальнейшего процветания."

 ROM_french_military_sponsor: "Французский военный спонсор"
 ROM_french_military_sponsor_desc: ""

 ROM_rise_of_the_democrati: "Подъем демократов"
 ROM_rise_of_the_democrati_desc: ""

 ROM_new_elections: "Новые выборы"
 ROM_new_elections_desc: ""

 ROM_bulwark_against_communism: "Оплот против коммунизма"
 ROM_bulwark_against_communism_desc: ""

 ROM_crush_our_opponents: "Сокрушить наших противников"
 ROM_crush_our_opponents_desc: ""

 ROM_the_red_terror: "Красный террор"
 ROM_the_red_terror_desc: "Коммунисты на востоке — исключительно опасный враг; то, как они обращаются с собственным народом, — достаточное доказательство того, что ждет нас, если мы падем перед ними."

 ROM_rise_of_the_amicii: "Подъем Амичи"
 ROM_rise_of_the_amicii_desc: ""

 ROM_rise_of_the_iron_guard: "Подъем Железной гвардии"
 ROM_rise_of_the_iron_guard_desc: "Растущая сфера влияния немцев была оживлена ранее распущенными политическими группами. Железная гвардия снова на подъеме, но на этот раз, возможно, не будет ничего, что смогло бы её остановить."

 ROM_approach_the_comintern: "Сблизиться с Коминтерном"
 ROM_approach_the_comintern_desc: ""

 ROM_form_the_securitate: "Создать Секуритате"
 ROM_form_the_securitate_desc: ""

 ROM_begin_the_purge: "Начать чистку"
 ROM_begin_the_purge_desc: ""

 ROM_the_fascist_menace: "Фашистская угроза"
 ROM_the_fascist_menace_desc: ""

 ROM_purge_the_elites: "Чистка элит"
 ROM_purge_the_elites_desc: ""

 ROM_soviet_military_sponsor: "Советский военный спонсор"
 ROM_soviet_military_sponsor_desc: ""

 ROM_approach_the_axis: "Сблизиться со странами «Оси»"
 ROM_approach_the_axis_desc: "Поскольку союзники были изгнаны из Европы, остается только один реальный ответ на вопрос о выборе курса. Державы Оси, вместе с Германией и Италией, станут нашим билетом к большему величию."

 ROM_crush_the_rebellion: "Подавить восстание"
 ROM_crush_the_rebellion_desc: "ФРН и другие группы, выступающие против нашего вступления в «Ось», должны быть сокрушены и отстранены, чтобы обеспечить легкое вступление в наш новый политический блок."

 ROM_abolish_the_national_legionary_state: "Упразднить Национал-легионерское государство"
 ROM_abolish_the_national_legionary_state_desc: "Железная гвардия попыталась совершить переворот, и за свои действия они будут изгнаны из правительства, заключены в тюрьму или высланы."

 ROM_german_military_sponsor: "Немецкий военный спонсор"
 ROM_german_military_sponsor_desc: "Длительные переговоры с немцами должны расширить наши возможности по производству немецкой техники."

 ROM_military_cooperation: "Военное сотрудничество"
 ROM_military_cooperation_desc: "Сотрудничество с вооруженными силами Германии и Италии улучшит наше понимание этой новой эры ведения войны."

 ROM_joint_oil_exploitation_company: "Совместная нефтедобывающая компания"
 ROM_joint_oil_exploitation_company_desc: "Нефть — это жизненная сила механизированной войны, и Германия нуждается в ней. Поэтому нам нужно будет расширить нашу собственную добычу нефти, чтобы удовлетворить их спрос."

 ROM_the_lone_lynx_of_the_balkans: "Одинокая рысь Балкан"
 ROM_the_lone_lynx_of_the_balkans_desc: ""

 ROM_alliance_with_germany: "Союз с Германией"
 ROM_alliance_with_germany_desc: ""

 ROM_prepare_national_defense: "Подготовить национальную оборону"
 ROM_prepare_national_defense_desc: "Наши пограничные командиры подготовили финансирование для центров производства и ремонта оружия на спорных территориях; только благодаря этому финансированию и поддержке мы сможем открыть новые мастерские"

 ROM_invite_goring: "Пригласить Геринга"
 ROM_invite_goring_desc: ""

 ROM_joint_land_exploitation: "Совместная эксплуатация земель"
 ROM_joint_land_exploitation_desc: ""

 ROM_joint_military_exercises: "Совместные военные учения"
 ROM_joint_military_exercises_desc: ""

 ROM_romanian_panzers: "Румынские танковые войска"
 ROM_romanian_panzers_desc: ""

 ROM_legionary_worker_corps: "Легионерский рабочий корпус"
 ROM_legionary_worker_corps_desc: ""

 ROM_establish_the_mtr: "Создать государственную программу модернизации"
 ROM_establish_the_mtr_desc: ""

 ROM_reactivate_the_armed_forces: "Реактивировать вооруженные силы"
 ROM_reactivate_the_armed_forces_desc: "Армия будет нужна для наших будущих целей и для гарантии безопасности Румынии."

 ROM_romanian_air_forces: "Румынские военно-воздушные силы"
 ROM_romanian_air_forces_desc: "Использование авиации в военных целях вызывает все больший интерес и уже получило развитие в других странах."

 ROM_the_iar_80: "IAR 80"
 ROM_the_iar_80_desc: "Необходимо разработать отечественный планер, используя нашу собственную изобретательность, и первым из многих должен стать своего рода истребитель."

 ROM_build_new_airbases: "Построить новые авиабазы"
 ROM_build_new_airbases_desc: "Для развертывания нашей авиации потребуется строить специализированные аэродромы."

 ROM_expand_the_iar: "Расширить IAR"
 ROM_expand_the_iar_desc: "Нашу авиационную промышленность необходимо расширить, чтобы увеличить наши мощности по производству самолетов."

 ROM_ground_support_doctrine: "Доктрина наземной поддержки"
 ROM_ground_support_doctrine_desc: "Перепрофилирование или разработка специализированных самолетов, которые будут напрямую поддерживать наши наземные силы, произведет революцию в ведении войны."

 ROM_develop_the_support_fleet: "Развивать флот поддержки"
 ROM_develop_the_support_fleet_desc: "Мы отправим наши самолеты поддержки на фронт, чтобы расширить их существующие формирования."

 ROM_develop_the_supremacy_fleet: "Развивать флот превосходства"
 ROM_develop_the_supremacy_fleet_desc: "Мы отправим наши самолеты обеспечения превосходства на фронт, чтобы расширить их существующие формирования."

 ROM_develop_the_bomber_fleet: "Развивать флот бомбардировщиков"
 ROM_develop_the_bomber_fleet_desc: "Мы отправим наши бомбардировщики на фронт, чтобы расширить их существующие формирования."

 ROM_the_royal_romanian_airforce: "Королевские румынские военно-воздушные силы"
 ROM_the_royal_romanian_airforce_desc: "Наши военно-воздушные силы начинают обретать форму — это сила, способная обеспечить локальное превосходство. Пусть они и не достигают уровня других ВВС, у них будет четкая стратегия, в рамках которой они проявят себя лучше всех."
 ROM_the_royal_romanian_airforce_tt: "«§Y$ROM_iar_organization$§!» (£funds_texticon  Прирост финансов: §G+50%§!) в течение §Y365 дней§!\n"

 ROM_romanian_air_shield: "Румынский воздушный щит"
 ROM_romanian_air_shield_desc: "Наши истребительные формирования не смогут удовлетворить все потребности войны против таких крупных стран, как Германия или Советский Союз. Поэтому будут построены зенитные позиции, чтобы уменьшить давление на наших истребителей."

 ROM_establish_the_air_schools: "Создать авиационные школы"
 ROM_establish_the_air_schools_desc: "Место, где новые пилоты смогут учиться у опытных пилотов на своих назначенных позициях, повысит общую эффективность наших военно-воздушных сил."

 ROM_pioneer_new_air_designs: "Новаторские авиационные разработки"
 ROM_pioneer_new_air_designs_desc: "Более новые конструкции для всех наших самолетов будут необходимы по мере того, как мы будем приобретать опыт в пилотировании и производстве."

 ROM_romanian_land_forces: "Румынские сухопутные силы"
 ROM_romanian_land_forces_desc: "Сухопутная армия должна быть главным приоритетом в нашем развитии, поскольку мы окружены потенциальными врагами."

 ROM_czech_weapon_designs: "Чешские конструкции оружия"
 ROM_czech_weapon_designs_desc: "Чехи разработали надежное и эффективное пехотное оружие, которое мы могли бы приобрести, если бы у нас были хорошие отношения с чехами."

 ROM_french_armour_designs: "Французские конструкции оружия"
 ROM_french_armour_designs_desc: "Подобно чехам, французы также разработали эффективное пехотное оружие, которое мы могли бы производить сами, если бы французы разрешили."

 ROM_organization_of_our_logistics: "Организация нашей логистики"
 ROM_organization_of_our_logistics_desc: "Логистика будет стоять на втором месте после создания эффективной армии. Производство военных товаров и транспортировка этих товаров будут иметь решающее значение для эффективных боевых сил."

 ROM_creation_of_the_royal_guards: "Создание Королевской гвардии"
 ROM_creation_of_the_royal_guards_desc: "Будет сформирована элитная группа солдат, которая будет иметь особые почести, обязанности и будет оснащена новейшим оборудованием раньше регулярной армии."
 ROM_creation_of_the_royal_guards_tt: "£manpower_texticon Будет развернута §Yэлитная пехотная дивизия§!"

 ROM_equipment_scavanging: "Сборщики трофеев"
 ROM_equipment_scavanging_desc: "Хотя мы приложили огромные усилия для расширения нашей военной промышленности, она, вероятно, никогда не достигнет высот производства, достигнутых крупными странами. Поэтому солдатам и командирам придется самостоятельно добывать дополнительное снаряжение с поля боя."

 ROM_recruit_from_the_higher_war_school: "Рекрутировать из Высшей военной школы"
 ROM_recruit_from_the_higher_war_school_desc: "У Военно-технической академии много способных выпускников, которые смогут занять необходимые должности в нашей армии."

 ROM_war_games: "Военные учения"
 ROM_war_games_desc: "Проведение учений, моделирующих реальный бой между нашими дивизиями, даст нам представление о наших возможностях и позволит исправить недостатки или улучшить нашу способность вести войну."

 ROM_vantori_de_munte: "Горные стрелки (Vânatori De Munte)"
 ROM_vantori_de_munte_desc: "Специализированный отряд нашей растущей армии будет обучен действовать и вести бой в высокогорье. Эта группа будет очень эффективна в боях в Карпатских горах."

 ROM_our_tip_of_the_spear: "Наше острие копья"
 ROM_our_tip_of_the_spear_desc: "Хорошо обученные для ведения боя в сложной местности, эти части могут выступать в качестве ударных единиц, помогающих нашим стандартным военным дивизиям в бою."

 ROM_lessons_from_our_best: "Уроки лучших"
 ROM_lessons_from_our_best_desc: "Командиры и инструкторы по обучению наших элитных формирований должны распространять свои знания на остальную часть вооруженных сил."

 ROM_expand_the_army: "Расширить армию"
 ROM_expand_the_army_desc: "Армии потребуется расти, чтобы соответствовать требованиям нашей нации по защите нашего будущего и всех румын."

 ROM_build_up_our_reserves: "Создать резервы"
 ROM_build_up_our_reserves_desc: "Необходимо подготовить резерв людей, чтобы справиться с последствиями любых катастроф, которые могут возникнуть во время войны."

 ROM_battlefield_hammers: "Молоты поля боя"
 ROM_battlefield_hammers_desc: "Артиллерия была разрушительным инструментом войны, уничтожавшим целые формирования или выбивавшим окопавшихся врагов. Дальнейшее изучение этого оружия повысит его эффективность в бою."

 ROM_first_armoured_division: "Первая танковая дивизия"
 ROM_first_armoured_division_desc: "Полностью бронированная мобильная дивизия кажется будущим войны, что доказали немцы в своих сражениях. Создание нашей собственной бронетанковой дивизии должно стать приоритетом."
 ROM_first_armoured_division_tt: "\nВы получите шаблон £GFX_unit_light_armor_icon_small  §Yлегкой танковой дивизии§!.\n\n"

 ROM_study_captured_equipment: "Изучить трофейную технику"
 ROM_study_captured_equipment_desc: "Захват иностранной техники у стран, с которыми мы воюем, должен помочь в нашей собственной разработке бронированных машин."

 ROM_the_maresal_tank: "Танк «Марешал»"
 ROM_the_maresal_tank_desc: "Танк, разработанный для борьбы с другими танками, соответствует нашим промышленным возможностям и должен быть эффективным, как показали испытания против Т-34 и даже КВ-1, которые использует Советский Союз."


 ROM_romanian_grand_army: "Великая румынская армия"
 ROM_romanian_grand_army_desc: "Наша армия превратилась в боеспособную и грозную силу на Востоке. Несмотря на то, что у нас были свои неудачи, они пошли нам на пользу: боевой опыт помог реформировать и укрепить наши вооруженные силы."
 ROM_romanian_grand_army_inf_tt: "[GetROMGrandArmyInfantry]/§G40000§! §Yпехотного снаряжения§! в дивизиях на фронте"
 ROM_romanian_grand_army_hvinf_tt: "[GetROMGrandArmyHeavyInfantry]/§G18500§! §Yтяжелого пехотного снаряжения§! в дивизиях на фронте"
 ROM_romanian_grand_army_art_tt: "[GetROMGrandArmyArtillery]/§G1400§! §Yартиллерии§! в дивизиях на фронте"
 ROM_romanian_grand_army_at_tt: "[GetROMGrandArmyAntitank]/§G1200§! §Yлегкого противотанкового снаряжения§! в дивизиях на фронте"
 ROM_romanian_grand_army_aa_tt: "Более [GetROMGrandArmyAntiair]/§G400§! противовоздушнего снаряжения в армии"
 ROM_romanian_grand_army_sup_tt: "[GetROMGrandArmySupport]/§G22500§! §Yснаряжения поддержки§! в дивизиях на фронте"
 ROM_romanian_grand_army_mot_tt: "[GetROMGrandArmyMotorized]/§G1250§! §Yгрузовиков§! в дивизиях на фронте"

 ROM_domestic_artillery_production: "Отечественное производство артиллерии"
 ROM_domestic_artillery_production_desc: "Нам необходимо увеличить производство артиллерийских орудий, чтобы восполнить потери и начать наращивать численность наших вооруженных сил."

 ROM_domestic_gun_production: "Отечественное производство стрелкового оружия"
 ROM_domestic_gun_production_desc: "Нам необходимо увеличить производство пехотного снаряжения, чтобы восполнить потери и начать наращивать численность наших вооруженных сил."

 ROM_domestic_tank_production: "Отечественное производство танков"
 ROM_domestic_tank_production_desc: "Необходимо серьезно заняться реализацией серии танков собственной разработки и производства, чтобы нас не смяли вражеские танки."

 ROM_combined_warfare: "Комбинированная война"
 ROM_combined_warfare_desc: "Использование пехоты, мобильных, бронетанковых и даже воздушных сил в рамках совместных усилий укрепит наши позиции и окажется бесценной тактикой против врагов."

 ROM_indeginous_designs: "Местные разработки"
 ROM_indeginous_designs_desc: "Наши местные научно-исследовательские и опытно-конструкторские работы должны быть расширены для создания разработок, которые будут нужны не только армии, но и военно-воздушным силам."

 ROM_metra: "M.E.T.R.A"
 ROM_metra_desc: "Создание Агентства по исследованиям военной техники и технологий обеспечит нам фундамент для опоры на собственные силы в вопросах обороны."

 ROM_creation_of_the_general_staff: "Создание Генерального штаба"
 ROM_creation_of_the_general_staff_desc: "Будет создана организация нашего высшего военного руководства для принятия обоснованных решений о действиях, которые военным необходимо будет предпринять во время войны."

 ROM_royal_guards_divisions_tt: "£manpower_texticon£ Будет развернута §Yэлитная дивизия Королевской гвардии§!."

 ROM_romanian_naval_forces: "Румынские военно-морские силы"
 ROM_romanian_naval_forces_desc: "Наши военно-морские силы не должны оставаться без внимания; хотя наши вероятные враги уже разработали и построили крупные флоты, нам необходимо найти способ удержать их от входа в наши воды."

 ROM_modernize_the_coastal_defense_force: "Модернизировать силы береговой обороны"
 ROM_modernize_the_coastal_defense_force_desc: "Флот, предназначенный для защиты наших прибрежных вод, — это естественный выбор, и он должен стать приоритетом в нашей военно-морской доктрине."

 ROM_mine_warfare: "Минная война"
 ROM_mine_warfare_desc: "Мины — это пассивный и проверенный инструмент сдерживания, который может быть эффективен в Черном море."

 ROM_radar_advancments: "Развитие радаров"
 ROM_radar_advancments_desc: "Радарные установки вдоль побережья и даже внутри Румынии будут оповещать нас о приближении врагов, давая нам время подготовиться к враждебным действиям."

 ROM_road_to_black_sea_dominance: "Путь к доминированию в Черном море"
 ROM_road_to_black_sea_dominance_desc: "Корабли класса крейсеров достаточно боеспособны и не выйдут за пределы наших промышленных возможностей, не создав серьезных проблем."

 ROM_foreign_naval_training: "Иностранная военно-морская подготовка"
 ROM_foreign_naval_training_desc: "Приглашение персонала из дружественных стран для помощи в развитии нашего флота может стать высокоэффективным стратегическим инструментом."

 ROM_build_the_constanta_shipyards: "Построить верфи в Констанце"
 ROM_build_the_constanta_shipyards_desc: "Расширение наших верфей будет жизненно важно для строительства более крупных кораблей и ремонта наших существующих кораблей после прошлых сражений."

 ROM_romanian_marine_regiments: "Румынские полки морской пехоты"
 ROM_romanian_marine_regiments_desc: "Подобно нашим горнострелковым войскам, специализированная группа подразделений, обученных десантным боям, может открыть новые возможные операции в Черном море, если представится такая возможность."

 ROM_naval_war_games: "Военно-морские учения"
 ROM_naval_war_games_desc: "Проведение учений с нашими военно-морскими силами поможет выявить наши недостатки и сильные стороны."

 ROM_new_ship_designs: "Новые конструкции кораблей"
 ROM_new_ship_designs_desc: "Технологические достижения привели к возможности строительства новых судов, которые значительно более эффективны, чем наши текущие проекты."

 ROM_expand_the_marine_regiment_tt: "£manpower_texticon£ Будет развернута §Yэлитная дивизия морской пехоты§!."
 ROM_integrate_war_economies_tt3: "[GER.GetFlag] §R[GER.GetAdjective]ое правительство должно одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 
 
