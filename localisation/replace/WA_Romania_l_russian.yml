 rom_armor.801.t: "Открытие мавзолея в Мэрэшешти"
 rom_armor.801.d: "После 15 лет работ строительство нашего мемориала румынским защитникам времен Первой мировой войны завершено. Это большое событие для всей страны, и то, что мы решим сказать в этот день, скорее всего, оставит глубокий след в умах населения."
 rom_armor.801.a: "Мы обещаем, что это никогда не повторится"
 rom_armor.801.b: "Мы напомним им об их жертве"
  
 rom_armor.802.t: "Организовать сделку по оружию с [CZE.GetNameRuInst]"
 rom_armor.802.d: "В нашей стране не хватает оригинальных разработок, и хотя наша промышленность сильна, от нее мало пользы, если мы не сможем найти им хорошее применение. В то время как крупные страны избегают нас, [CZE.GetName] стремится обеспечить закупки оружия, и мы могли бы стать отличным клиентом."
 rom_armor.802.a: "Заключить лицензионные соглашения"
 rom_armor.802.b: "Предложить интеграцию технологий"
  
 rom_armor.803.t: "[ROM.GetName] ищет лицензии"
 rom_armor.803.d: "Румыния, стремясь приобрести современное вооружение, обратилась к нам с просьбой о покупке нашего оружия. Они предлагают постоянный контракт на каждую новейшую разработку, которую мы создадим, в обмен на крупную сумму денег. Принимать ли их предложение — решать нам."
 rom_armor.803.a: "Это хорошая сделка"
 rom_armor.803.b: "Так не пойдет"
 czech_integration_tt: "§OЭто приводит к постоянному приобретению чешских деревьев пехоты и артиллерийского вооружения, что лишает нас возможности интегрироваться с другими крупными странами §!\n§YЧехословакия получит доступ к румынским самолетам, если Чехословакия согласится§!"
  
 rom_armor.804.t: "[ROM.GetName] стремится к военной интеграции"
 rom_armor.804.d: "Румыния, стремясь приобрести современное вооружение, обратилась к нам с просьбой о постоянном военном сотрудничестве. Они предлагают свои конструкции самолетов в обмен на то, что мы поделимся своим пехотным снаряжением и артиллерией. Хотя это и заманчиво, мы должны быть абсолютно уверены, что Румыния не применит против нас наше оружие."
 rom_armor.804.a: "Это отличное предложение"
 rom_armor.804.b: "Продать лицензии было бы лучше."
 rom_armor.804.c: "Это предложение зашло слишком далеко"
 romanian_integration_tt: "§OЭто может привести к постоянному приобретению румынских образцов техники§!\n§YРумыния получит доступ к чешской пехоте и артиллерии, если мы согласимся§!"
  
 rom_armor.805.t: "[CZE.GetName] отклоняет наше предложение"
 rom_armor.805.d: ""
 rom_armor.805.a: "Придется обратиться к великим державам"
  
 rom_armor.806.t: "[CZE.GetName] принимает наше предложение"
 rom_armor.806.d: ""
 rom_armor.806.a: "Отлично"
  
 rom_armor.807.t: "[CZE.GetName] предлагает вместо этого продажу лицензий"
 rom_armor.807.d: ""
 rom_armor.807.a: "Придется довольствоваться этим"
  
 rom_armor.808.t: "[ROM.GetName] соглашается купить лицензии"
 rom_armor.808.d: ""
 rom_armor.808.a: "Отлично"
  
 rom_armor.810.t: "Советский Союз соглашается на мир"
 rom_armor.810.d: ""
 rom_armor.810.a: "Мы чудом избежали беды"
  
 rom_armor.811.t: "Советский Союз требует верности"
 rom_armor.811.d: ""
 rom_armor.811.a: "Мы вынуждены подчиниться"
 rom_armor.811.b: "Мы не можем принять эти условия"
  
 rom_armor.812.t: "Советский Союз отвергает мир!"
 rom_armor.812.d: ""
 rom_armor.812.a: "Мы находимся в опасной ситуации..."
 rom_armor.812.b: "Попробуем обратиться к союзникам"
  
 rom_armor.813.t: "Союзники соглашаются на мир"
 rom_armor.813.d: ""
 rom_armor.813.a: "Наконец-то хорошие новости"
  
 rom_armor.814.t: "Союзники отвергают мир!"
 rom_armor.814.d: ""
 rom_armor.814.a: "Мы воюем со всеми..."
  
 rom_armor.815.t: "Выборы 1937 года"
 rom_armor.815.d: "Подведены итоги наших недавних выборов, и хотя Национал-либеральная партия остается крупнейшей партией, радикальная партия «Все для страны» получила много мест. Эти выборы также были омрачены многочисленными актами насилия, а поскольку ни одна партия не получила явного большинства, придется провести новые выборы."
 rom_armor.815.a: "Арестовать бунтовщиков"
 rom_armor.815.b: "Демократия умирает"
 ROM_1937_election_flag: "Выборы в декабре 1937 года состоялись."
  
 rom_armor.816.t: "Террор Железной гвардии"
 rom_armor.816.d: "Учитывая текущую глобальную ситуацию, Железная гвардия претендует на власть и начала серию террористических ударов по всей стране!"
 rom_armor.816.a: "Будь они прокляты!"
  
 rom_armor.817.t: "Железная гвардия отправляется в изгнание"
 rom_armor.817.d: "После смерти их лидеров и нашей решительной реакции на их действия мы сделали практически невозможным продолжение операций Железной гвардии в Румынии. Поэтому их новый лидер, молодой, но склонный к насилию бывший государственный секретарь министерства образования Хория Сима, решил бежать в другие фашистские страны, без сомнения, готовя свое возвращение."
 rom_armor.817.a: "Но их остатки все еще здесь..."
  
 rom_armor.818.t: "Арманд Кэлинеску убит"
 rom_armor.818.d: "Несмотря на то, что «Железная гвардия» в настоящее время находится в изгнании, ее щупальца по-прежнему тянутся в Румынию: гвардейцы нанесли удар и убили одного из своих ключевых противников, Арманда Кэлинеску. Хотя почти наверняка это был прямой приказ их нового лидера Симы, есть также намеки на то, что «Железная гвардия» получила немалую помощь от своих нынешних покровителей..."
 rom_armor.818.a: "Покойся с миром"
  
 rom_armor.819.t: "[ROM.GetName] ищет лицензии"
 rom_armor.819.d: "Румыния, стремясь приобрести современное вооружение, обратилась к нам с просьбой закупить наши полевые орудия и новейшие танки. Они предлагают постоянный контракт на каждую новейшую разработку, которую мы создадим, в обмен на крупную сумму денег. Принимать ли их предложение — решать нам."
 rom_armor.819.a: "Это хорошая сделка"
 rom_armor.819.b: "Так не пойдет"
  
 rom_armor.820.t: "[FRA.GetName] принимает наше предложение"
 rom_armor.820.d: ""
 rom_armor.820.a: "Отлично"
  
 rom_armor.821.t: "[FRA.GetName] отклоняет наше предложение"
 rom_armor.821.d: ""
 rom_armor.821.a: "Нам придется поискать в другом месте"
  
 rom_armor.822.t: "Смена правительства"
 rom_armor.822.d: "Мы больше не можем мириться с провалами нашего короля. Он должен отречься от престола, и мы назначим следующего премьер-министра с его прежними полномочиями, чтобы вести Румынию в светлое будущее."
 rom_armor.822.a: "Поставим во главе популярную номинальную фигуру"
 rom_armor.822.b: "Поставим во главе кого-нибудь из военных."
 
 romania.7.t: "Мирные переговоры с [SOV.GetNameDef]"
 romania.7.d: "Мы установили контакт с [SOV.GetAdjective]им режимом. Назначена встреча в секретном месте в Крыму, где нам будет предложена возможность уступить территорию в обмен на сохранение [Root.GetAdjective]ого суверенитета. \n\nРумынские силы быстро истощаются, и предыдущие попытки открыть линию связи были безуспешны. Возможно, это наша единственная надежда на мирное разрешение конфликта."
 romania.7.a_tt: "§YЕсли [SOV.GetName] согласится:\n§!"
 romania.7.a: "Эту войну нельзя выиграть"
 romania.7.b: "Мы должны продолжать борьбу!"

 romania.8.t: "[From.GetNameDefCap] предлагает уступки"
 romania.8.d: "Война с [From.GetNameDef] была дорогостоящим делом, но поскольку мы смогли оттеснить [From.GetAdjective]ую армию, они сделали нам убедительное предложение. Мы получаем контроль над стратегически важными районами, но должны вывести свои войска и прекратить дальнейшие боевые действия.\nЭто закончит наше наступление на [From.GetNameDef] без полного контроля над регионом, но в свою очередь позволит нам сосредоточиться на расширении нашей сферы влияния в других частях мира."
 romania.8.a: "Наши солдаты нужны в других местах."
 romania.8.b: "Нам нужны все [From.GetNameDef]"

 romania.9.t: "[From.GetNameDefCap] отказывает"
 romania.9.d: "Переговоры, начатые с [From.GetNameDef], сорвались. Очевидно, это была уловка, чтобы отнять у нас время, пока [From.GetAdjective]ая армия готовилась к очередному нападению на [Root.GetAdjective]ую территорию.\n\n[Root.GetNameDef] не дрогнет и будет сражаться до последнего."
 romania.9.a: "Каждый шаг будет стоить им крови!"

 rom_armor.830.t: "Беспорядки на улицах!"
 rom_armor.830.d: "Все более деспотичный режим Кароля II вынудил нас организовать восстание, чтобы покончить с коррупцией и нищетой. Стратегически выбрав несколько городов, мы постепенно раскалываем лояльные Каролю силы, которые мы сможем быстро разгромить, когда придет время."
 rom_armor.830.a: "Другого языка они не понимают"

 rom_armor.831.t: "Утечка сведений об образе жизни Кароля"
 rom_armor.831.d: "Нашим агентам удалось подкупить чиновников, чтобы они слили информацию о счетах короля Кароля и обнажили его коррупцию. Достаточно сказать, что общественность всколыхнулась, а наши легионы подливают масла в огонь; это быстро становится большой головной болью для руководства и привлекает все больше людей к нашему делу."
 rom_armor.831.a: "Его образ навсегда запятнан"

 rom_armor.832.t: "Восстание Железной гвардии"
 rom_armor.832.d: "Массовая коррупция в стране и недовольство королем Каролем II вылились в полномасштабную гражданскую войну, в ходе которой мы планируем свергнуть опального короля и установить народное правление.\n Путь к столице должен быть обеспечен, и хотя следует ожидать кровавых боев, мы пронесем нашу победу до самых стен королевского дворца!"
 rom_armor.832.a: "Все для страны!"

 rom_armor.833.t: "Конец Гражданской войны"
 rom_armor.833.d: "Железная гвардия одержала победу в Бухаресте, король Кароль был судим и приговорен за коррупцию, равно как и его пособники. Однако с устранением прежней власти закон и порядок рухнули, и многие рабочие и крестьяне перешли к самосуду над своими бывшими хозяевами.\nНа полное устранение коррупции и возвращение стабильности в страну потребуется время, путь тернист, но слава ждет!"
 rom_armor.833.a: "К славе!"

 rom_armor.834.t: "Закон и порядок постепенно возвращаются"
 rom_armor.834.d: "Железная гвардия усердно нанимает преданных ей людей в полиции и гражданских администрациях. Со временем в страну возвращается нормальная жизнь."
 rom_armor.834.a: "Превосходно"

 rom_armor.835.t: "Чистка элиты"
 rom_armor.835.d: "Теперь, когда мы у власти, мы можем обратить внимание на людей, которые стояли в стороне и позволяли коррупции в этой стране продолжаться."
 rom_armor.835.a: "Будь они прокляты!"