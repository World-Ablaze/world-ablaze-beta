 WA_welcome_screen_text: "[GetWelcomeScreenText]"

 WA_welcome_main_h: "Добро пожаловать в World Ablaze"
 WA_welcome_main_t: "§bWorld Ablaze — это исторический мод, полностью переработанный, который меняет почти всю игровую механику, расширяет ее и добавляет более жесткий ИИ. §RЭтот мод предназначен для работы в одиночном режиме. Только косметические, музыкальные и официальные субмоды будут работать правильно при включении вместе с World Ablaze.§! Большинство изменений легко заметить с первого взгляда, например, деревья фокусов. Но если вы не знакомы с модом, ниже вы можете найти несколько опций, которые помогут прояснить некоторые из скрытых изменений в игре. \n\n Скорость игры была изменена по сравнению с ванильной скоростью: скорость 4 значительно выше, чем ванильная скорость 4, скорость 3 немного быстрее, чем ванильная скорость 3, скорость 2 равна ванильной скорости 3, а скорость 1 равна ванильной скорости 2.\n\n §RМы рекомендуем не использовать опцию сохранения в облаке Steam, поскольку известно, что она приводит к повреждению файлов сохранения. Делайте это на свой страх и риск.§! \n\nЕсли вы заинтересованы в участии в сообществе World Ablaze, есть ссылка на наш дискорд, где я рекомендую всем оставлять свои отзывы и предложения или общаться с другими игроками WA. Ссылку можно найти в главном меню или в описании мода Steam.\n\nУдачи!§!"

 WA_welcome_economy_h: "Изменения в экономике"
 WA_welcome_economy_t: "§bЭкономическая усталость — это новая система в World Ablaze, которая отражает инфляцию, большие государственные расходы и сокращение гражданской экономики. Эта система постепенно накапливает экономическую усталость, которая замедляет строительство и увеличивает ожидаемое количество фабрик, перенаправленных на товары народного потребления. В конечном итоге она также снижает стабильность и эффективность увеличения ресурсов. На более высоких уровнях она также налагает еженедельный штраф к поддержке войны, что напрямую влияет на боевые действия.\n\nПри милитаризации экономики вполне естественно испытывать экономическую усталость. Однако всегда следует стараться держать ее на как можно более низком уровне. Ниже приведены основные способы снижения экономической усталости:\n\n    1. Фокусы\n\n    2. Военные облигации (доступны только во время войны)\n\n    3. Решения, такие как эксплуатация завоеванных стран, являются наиболее эффективным способом снижения усталости, но большинство из них доступны только во время войны.\n\n    4. Снижение законов (только в крайнем случае, если усталость близка к 100%)\n\nПри частичной мобилизации ваша усталость вырастет с 0% до 100% за 24 года, при военной экономике это занимает примерно 10 лет, а при всеобщей мобилизации — примерно 6 лет.  Помните, что фокусы, закрытая экономика и более строгие законы о призыве на военную службу также могут увеличить усталость. Постарайтесь избежать 100% экономической усталости, иначе ваша страна рухнет.§!"

 WA_welcome_tech_h: "Изменения в деревьях технологий"
 WA_welcome_tech_t: "§bКаждая великая держава имеет уникальные технологии пехотного снаряжения, танков, авиации, флота и артиллерии, которые имеют исторические ттх. Второстепенные страны, которые имеют общие деревья технологий пехотного снаряжения, танков, авиации, флота и артиллерии, имеют хуже ттх, нежели великие державы. Кроме того, второстепенные страны больше не начинают с общего дерева танков; вместо этого они должны искать танки, принимая решения с великими державами. \n\nНекоторые танки, такие как Panzer IV, имеют несколько вариантов и переключение производства между этими вариантами приводит к минимальной потере эффективности производства. \n\nКорабли изначально оснащены историческими модулями, требующими минимальной модификации до тех пор, пока не будут исследованы более поздние технологии. Они были разделены на отдельные архетипы. Фрегаты превосходны в борьбе с подводными лодками, тяжелые крейсеры эффективны против легких кораблей, а легкие авианосцы являются более доступной альтернативой полноценным авианосцам.§!"

 WA_welcome_combat_h: "Изменения в боёвке"
 WA_welcome_combat_t: "§bШирина фронта была изменена до 90 на равнинах. Это означает, что идеальная дивизия теперь имеет ширину фронта 30. На пересеченной местности, такой как горы и джунгли, используется ширина фронта 20.\nПогодные условия и штрафы на местности стали гораздо более суровыми. Восстановление организации занимает больше времени и зависит от инфраструктуры, а запасов снабжения хватает на 10 дней вместо 3.\nБыли добавлены новые боевые единицы:\n- бронеавтомобили бывают двух видов: боевые и разведывательные. Боевые машины имеют ту же огневую мощь, что и легкие танки, но они стоят дешевле и более хрупкие. Разведывательные машины дают бонус к организации и могут служить для разведки. Они также являются колесными, что дает им другие модификаторы местности;\n- штурмовые орудия обладают более толстой броней, чем самоходные артиллерийские установки (САУ), но при этом проигрывают в прорыве и защите. Однако они превосходно справляются с атаками на укрепления и городские районы. Их подверженность прямому огню на передовой делает их значительно более уязвимыми, чем САУ. Эта усиленная броня обходится дороже в производстве;\n- артиллерия, пехота и кавалерия имеют свой «утяжелённый вариант». Он лучше обычного, но стоит дороже, передвигается медленнее и расходует большее количество припасов.\nРазное.\nСуществует лимит на количество авианосных самолетов, которые можно использовать в бою, основанный на размере и составе вражеского флота. Полностью прикрытый флот позволит эффективно использовать 480 авианосных самолетов против него. «Стаки смерти» (огромные флоты) были сильно ослаблены, так что оптимальный размер флота теперь составляет 60. Количество кораблей охранения, необходимых для каждого крупного корабля, теперь равно 4 вместо 3. Полностью прикрытый флот состоит из 6 обычных или легких авианосцев, 6 тяжелых кораблей (тяжелых крейсеров, линкоров или линейных крейсеров) и 48 кораблей охранения (легких крейсеров или эсминцев). Если корабль имеет на 40% больше значения пробития, чем броня врага, он наносит двойной урон. Для танков нужно на 30% больше пробития, чем броня противника, чтобы наносить полный урон. Если ваше пробитие меньше 50%, вы наносите половину урона.§!"

 WA_welcome_industry_h: "Изменения в промышленности"
 WA_welcome_industry_t: "§bПроизводительность военных заводов и фабрик сократилась вдвое, но взамен вы получаете вдвое больше таких заводов и фабрик (для большинства стран). Рост эффективности производства значительно замедлился, что привело к необходимости сделать очень важный выбор между продолжением производства больших объемов старого оборудования или переходом на более новые модели.\n\n Верфи и военные заводы нуждаются в угле (производственные линии), а фабрики — в 1 единице стали. В связи с этим максимальное количество ячеек для строительства этих типов зданий составляет 20.\n\nТакже добавлены новые ресурсы, в том числе боксит, уголь и железо. К этим ресурсам добавлены 4 новых здания.\n\nАлюминиевый завод потребляет бокситы и уголь для производства алюминия.\n\nГидроэлектрические алюминиевые/сталелитейные заводы хоть и более дорогие, но они не потребляют уголь.\n\nСталелитейный завод потребляет железо и уголь для производства стали.\n\nНефтеперерабатывающий завод потребляет большое количество угля для производства синтетической нефти и резины. \n\nИнфраструктура также больше не увеличивает количество стали и алюминия, которое вы получаете в регионе, поскольку они поступают только с этих заводов.\n\n§!"

 WA_welcome_politics_h: "Изменения в политике"
 WA_welcome_politics_t: "§bВ раздел «Политика» добавлена вкладка «Министерства».\n\nНовые дополнения включают:\nМинистерство культуры, которое занимается вопросами положения женщин в обществе. Первоначально оно делает акцент на традиционных домашних обязанностях, которые приводят к росту населения, но его можно изменить за значительную плату или путем переориентации, чтобы увеличить выгоды для вашей промышленности и вооруженных сил. Например, это может увеличить фактор военнообязанного населения и объем заводского производства.\n\nМинистерство обороны уделяет особое внимание военным облигациям, которые могут быть использованы для снижения экономической усталости. Однако эти облигации доступны только в военное время и должны быть погашены по окончании войны.\n\nМинистерство пропаганды сосредоточено на поддержке войны. Поскольку законы о высоком уровне экономики и законы о призыве на военную службу требуют еженедельной поддержки войны, это используется для противодействия. Каждый уровень обеспечивает 0.2% еженедельной поддержки войны и требует 0.02 политической власти в день.\n\nМинистерство труда сосредоточено на предоставлении различных бонусов, таких как стабильность или небольшое увеличение призывного населения за некоторое количество политической власти.\n\nМинистерство бизнеса представляет вашу экономическую философию, которая тесно переплетена с вашими политическими убеждениями. Фашисты не могут полностью приватизировать экономику, а демократии не могут принять принципы национал-социализма. Каждая экономическая идеология предлагает различные бонусы и штрафы, такие как изменения в стабильности, производстве, скорости строительства, скорости исследования, защиты от смены идеологии и т.д.\n\nНаконец, мы расширили круг политических советников, превратив их в полноценную систему кабинета министров.§!"

 sxp.1.a: "Вместо этого мы могли бы использовать его для обновления шаблонов наших дивизий."
 sxp.1.b: "Усовершенствовать тактику наших батальонов поддержки"
 sxp.1.c: "Адаптировать подготовку нашего спецназа"
 sxp.1.e: "Это может дать представление о совершенствовании нашей доктрины."
 sxp.1.d: "Полевые бои наших солдат дали нам ценный боевой опыт. Мы можем использовать его, чтобы получить преимущество на поле битвы, или продолжить сбор опыта, прежде чем применить его в какой-либо конкретной области."
 sxp.1.t: "Армейский опыт"
  
 sxp.2.a: "Вместо этого мы могли бы создать совершенно новый шаблон дивизии."
 sxp.2.b: "Значительно усовершенствовать тактику нашего батальона поддержки."
 sxp.2.c: "Усилить подготовку нашего спецназа с помощью этой новой информации."
 sxp.2.e: "Мы можем ускорить совершенствование нашей доктрины"
 sxp.2.d: "Мы накопили много знаний из боевого опыта наших армий. Мы должны использовать его, чтобы получить преимущество на поле боя, или продолжить сбор опыта, чтобы дать огромный толчок любой области по нашему выбору."
 sxp.2.t: "Армейский опыт"
  
 sxp.3.a: "Мне не нужен наш боевой опыт... Что вообще такое армейский опыт?"
 sxp.3.b: "Мы можем существенно улучшить наши батальоны поддержки."
 sxp.3.c: "Создать интенсивную программу обучения для нашего спецназа"
 sxp.3.e: "Мы можем усовершенствовать доктрину нашей армии"
 sxp.3.d: "Мы собрали много разведывательных данных, чтобы значительно повысить боевые возможности нашей армии. Мы не можем собрать больше информации, которая могла бы обеспечить лучший импульс."
 sxp.3.t: "Армейский опыт"
  
 sxp.4.a: "Это может дать представление о совершенствовании наших воздушных формирований."
 sxp.4.b: "Вместо этого мы можем корректировать боевые возможности наших самолетов."
 sxp.4.d: "Воздушные бои наших летчиков дали нам ценный боевой опыт. Мы можем использовать его, чтобы получить преимущество в воздухе, или продолжить сбор опыта для большего ускорения."
 sxp.4.t: "Воздушный опыт"
  
 sxp.5.a: "На основе этого мы можем создать новую тактику боя."
 sxp.5.b: "Вместо этого мы можем значительно улучшить наши самолеты."
 sxp.5.d: "Мы должны использовать его, чтобы получить преимущество в воздухе, или продолжить сбор опыта, чтобы вместо этого обеспечить огромный импульс."
 sxp.5.t: "Воздушный опыт"
  
 sxp.6.a: "Мы можем усовершенствовать нашу воздушную доктрину"
 sxp.6.b: "Мне не нужен наш боевой опыт... Что вообще такое авиационный опыт?"
 sxp.6.d: "Мы собрали достаточно разведывательной информации, чтобы существенно повысить боевые возможности наших ВВС. Мы не можем собрать больше информации, которая могла бы обеспечить лучший импульс."
 sxp.6.t: "Воздушный опыт"
  
 sxp.7.a: "Это может дать представление о совершенствовании наших корабельных соединений."
 sxp.7.b: "Вместо этого мы можем настроить боевые возможности наших кораблей."
 sxp.7.d: "Бои наших моряков на море дали нам ценный боевой опыт. Мы можем использовать его, чтобы получить преимущество на море, или продолжить сбор опыта для большего ускорения."
 sxp.7.t: "Опыт военно-морского флота"
  
 sxp.8.a: "На основе этого мы можем создать новую тактику боя."
 sxp.8.b: "Вместо этого мы можем значительно улучшить наши корабли."
 sxp.8.d: "Мы должны использовать его, чтобы получить преимущество на волнах, или продолжить сбор опыта, чтобы вместо этого обеспечить огромный импульс."
 sxp.8.t: "Опыт военно-морского флота"
  
 sxp.9.a: "Мы можем усовершенствовать нашу военно-морскую доктрину"
 sxp.9.b: "Мне не нужен наш боевой опыт... Что вообще такое флотский опыт?"
 sxp.9.d: "Мы собрали достаточно разведывательных данных, чтобы существенно повысить боевые возможности нашего флота. Мы больше не можем собрать информацию, которая обеспечила бы лучший импульс."
 sxp.9.t: "Опыт военно-морского флота"
  
 generic.900.t: "[From.GetAdjective]ие попытки диверсий на Краснодарских нефтяных месторождениях"
