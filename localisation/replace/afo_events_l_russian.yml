 generic.905.a: "Мы не можем этого допустить!"
  
 generic.903.t: "[From.GetAdjective]ое правительство ввело против нас эмбарго"
 generic.903.d: "\nГосударство [From.GetName] наложило на нас полное эмбарго после наших недавних политических действий. Похоже, нам придется искать необходимые нам ресурсы в другом месте, иначе мы заберем их силой."
 generic.903.a: "Мы потеряли поставщиков жизненно важных ресурсов"
  
 lar_ratify_the_stresa_front.5.t: "Ратификация Стрезского фронта"
 lar_ratify_the_stresa_front.5.desc: "Идет подготовка к подписанию и ратификации Стрезских соглашений, официально закрепляющих союз с Италией в обмен на территориальные уступки. Подписывая, мы соглашаемся передать территорию Джибути Восточной Африке. После месяцев работы дипломатической службы осталось только положить чернила на бумагу."
 lar_ratify_the_stresa_front.5.a: "Триумф [This.GetAdjective]ой дипломатии."
 lar_ratify_the_stresa_front.5.b: "Это больше не отвечает нашим интересам."
 lar_ratify_the_stresa_front.6.desc: "Пришло время выполнить обещание, которое мы дали [From.GetAdjective]ому правительству. Теперь, когда Альянс вступил в силу, мы обязаны передать Джибути под их контроль."
 lar_ratify_the_stresa_front.6.a: "Франция сдерживает свои обещания."
 lar_ratify_the_stresa_front.6.b: "Ситуация изменилась."
 lar_ratify_the_stresa_front.7.t: "[From.GetNameDefCap] отказывается ратифицировать Альянс"
 lar_ratify_the_stresa_front.7.desc: "Внезапно [From.GetAdjective]ое правительство решило больше не выполнять свое предыдущее обязательство по ратификации Стрезских соглашений. Все попытки получить объяснения по дипломатическим каналам потерпели неудачу, и [From.GetAdjective]ие дипломаты, похоже, были в равной степени шокированы внезапной переменой взглядов."
 lar_ratify_the_stresa_front.7.a: "Темный день."
 lar_ratify_the_stresa_front.8.desc: "[FRA.GetNameDefCap] и [ITA.GetNameDef] уже подписали Стрезские соглашения и официально оформили свой союз. Теперь наша очередь выполнить свою часть сделки, подписать соглашения и передать наши владения в Сомали под контроль [ITA.GetAdjective]ой армии."
 lar_ratify_the_stresa_front.8.a: "Мы дали слово."
 lar_ratify_the_stresa_front.8.b: "Наши интересы разошлись."
  
 per_armor.1.t: "Вторжение!"
 per_armor.1.d: "Британцы и Советы сговорились вторгнуться к нам! Под видом «необходимости» они надвигаются на нашу страну со всех сторон. Советские ВВС сбросили листовки с предупреждением о массированной бомбардировке, если Иран не сдастся. Мы столкнулись с распадающейся армией и разваливающимся правительством, а армейские генералы тайно встретились, чтобы обсудить варианты капитуляции."
 per_armor.1.a: "У нас нет другого выбора, кроме как сдаться"
 per_armor.1.b: "Мы будем сражаться дальше!"
  
 per_armor.2.t: "Капитуляция Ирана"
 per_armor.2.d: "Иранцы предложили сложить оружие и сдаться наступающим британским и советским войскам. Страна была в руинах, и у шаха не было другого выбора, кроме как сделать то, что лучше для его голодающего и страдающего народа."
 per_armor.2.a: "Давайте поделим территорию с нашими товарищами"
 per_armor.2.b: "Теперь мы контролируем весь Иран"
  
  
 zzz.996.t: "Страны Бенилюкса передают контроль"
 zzz.996.d: "Готовясь к вторжению в Европу, правительства Бельгии, Люксембурга и Голландии согласились предоставить Соединенному Королевству временный контроль над своей материковой территорией, когда она будет вновь захвачена. Это позволит Соединенному Королевству строить новые здания и эффективно устранять любые повреждения, нанесенные во время вторжения."
 zzz.996.a: "Мы не подведем их"
  
 zzz.997.t: "Страны Бенилюкса просят вернуть контроль"
 zzz.997.d: "После окончания войны в Европе Бельгия, Люксембург и Голландия обратились к нам с просьбой вернуть им материковую территорию."
 zzz.997.a: "Безусловно"
  
 zzz.998.t: "Франция передает контроль"
 zzz.998.d: "Готовясь к вторжению в Европу, французское правительство согласилось предоставить Соединенным Штатам временный контроль над своей материковой территорией, когда она будет вновь захвачена. Это позволит Соединенным Штатам строить новые здания и эффективно устранять любые повреждения, нанесенные во время вторжения."
 zzz.998.a: "Мы не подведем их"
  
 zzz.999.t: "Франция просит вернуть контроль"
 zzz.999.d: "После окончания войны в Европе Франция потребовала, чтобы мы вернули ей материковую территорию."
 zzz.999.a: "Безусловно"
  
  
  
  
  
  
 
 MTG_naval_treaty.14.t: "Достигнут лимит лёгких крейсеров"
 MTG_naval_treaty.14.d: "В соответствии с Лондонским военно-морским договором мы достигли предела количества лёгких крейсеров, которые можем построить."
 MTG_naval_treaty.14.a: "Мы должны подчиниться"
  
 MTG_naval_treaty.15.t: "Достигнут лимит тяжелых крейсеров"
 MTG_naval_treaty.15.d: "В соответствии с Лондонским военно-морским договором мы достигли предела количества тяжелых крейсеров, которые мы можем построить."
 MTG_naval_treaty.15.a: "Мы должны подчиняться"
  
 MTG_naval_treaty.16.t: "Лимит линкоров достигнут"
 MTG_naval_treaty.16.d: "В соответствии с Лондонским военно-морским договором мы достигли предела количества линкоров, которые мы можем построить."
 MTG_naval_treaty.16.a: "У нас нет выбора"
  
 MTG_naval_treaty.17.t: "Достигнут лимит авианосцев"
 MTG_naval_treaty.17.d: "В соответствии с Лондонским военно-морским договором мы достигли предела количества авианосцев, которые мы можем построить."
 MTG_naval_treaty.17.a: "Мы должны соблюдать договор"
  
 news.221.d: "[SOV.GetNameDefCap] пережил огромное потрясение: возвращение Троцкого получило шокирующе широкую поддержку, без сомнения, подпольные элементы группы Троцкого хорошо готовились. Сталин призвал своих сторонников отразить наступление троцкистов и сокрушить своего старого политического соперника [SOV.GetLeader]!\nВсе указывает на то, что начинается крупномасштабная и, несомненно, разрушительная гражданская война, и время покажет, какой режим останется стоять."
  
 afo_news.1.t: "Высадка союзников в Нормандии"
 afo_news.1.d: "Союзные войска начали то, что может стать последним ударом по Оси, вторжением в Нормандию. Время покажет, станет ли это первым шагом к победе и окончанию войны."
 afo_news.1.a: "Мы должны немедленно сокрушить этот новый фронт!"
 afo_news.1.b: "Вперед!"
 afo_news.1.c: "Наконец-то"
 afo_news.1.e: "Мировая арена меняется"
  
 afo_news.2.t: "Победа Оси в Северной Африке"
 afo_news.2.d: "Силы Оси теперь имеют полный контроль над Северной Африкой, получив важный Суэцкий канал и контроль над Ближним Востоком. Это серьезная неудача для союзных войск, которые теперь возлагают свои надежды на Советы."
 afo_news.2.a: "Теперь мы сосредоточим все усилия против большевиков!"
 afo_news.2.b: "Нам нужно вернуть себе Суэцкий канал"
 afo_news.2.c: "Мы победим в одиночку, если нам придется"
 afo_news.2.e: "Мировая арена меняется"
  
 afo_news.3.t: "Победа союзников в Северной Африке"
 afo_news.3.d: "Союзные войска вытеснили силы Оси в Северной Африке и теперь имеют шанс открыть второй фронт на юге Европы и стали на шаг ближе к окончанию Второй мировой войны."
 afo_news.3.a: "Мы должны победить в Европе, чтобы компенсировать эту потерю."
 afo_news.3.b: "Победа в наших руках"
 afo_news.3.c: "Мы должны сильнее продвигаться к Берлину"
 afo_news.3.e: "Мировая арена меняется"
  
 afo_news.4.t: "Высадка союзников в Северной Африке"
 afo_news.4.d: "Союзные войска высадились в бывших североафриканских колониях, находившихся под контролем Виши. Это открыло новый фронт на Европейском театре военных действий."
 afo_news.4.a: "Мы должны немедленно сокрушить этот новый фронт!"
 afo_news.4.b: "Вперед!"
 afo_news.4.c: "Давно пора!"
 afo_news.4.e: "Мировая арена меняется"
  
 afo_news.5.t: "В Германии разгорается гражданская война"
 afo_news.5.d: "Заговор с целью устранить Гитлера и предотвратить кровопролитие провалился."
 afo_news.5.a: "Что это будет означать для нашего альянса?"
 afo_news.5.b: "Наш враг рушится изнутри!"
 afo_news.5.c: "Долой национал-социалистов!"
 afo_news.5.e: "Действительно сюрприз"
  
 afo_news.6.t: "В Италии разгорается гражданская война"
 afo_news.6.d: "Итальянский народ разуверился в Муссолини: после потери колоний и Сицилии страна охвачена восстанием! Итальянские сепаратисты под предводительством фельдмаршала Пьетро Бадольо и короля Эммануила III взяли под свой контроль острова и южное побережье. Это открывает путь к беспрепятственной высадке союзников и последней главе фашистской Италии."
 afo_news.6.a: "Какая катастрофа"
 afo_news.6.b: "давайте воспользуемся этой возможностью!"
 afo_news.6.c: "Фашисты бесхарактерны"
 afo_news.6.e: "Ничуть не удивлён"
  
 afo_news.7.t: "Гитлер совершает самоубийство"
 afo_news.7.d: "После решительного наступления союзников вглубь Германии Гитлер предпочел самоубийство оставлению Берлина. Эта потеря нанесла огромный удар по моральному духу немцев, и раздаются призывы как к прекращению войны, так и к мести. В своем завещании Гитлер назначил главой государства (Staatsoberhaupt) Карла Дёница, командующего военно-морским флотом.\n\nДёниц объявил, что война будет продолжаться до тех пор, пока страна не будет спасена от поражения, однако сомнительно, что немецкие войска смогут оказать сколько-нибудь значимое сопротивление."
 afo_news.7.a: "Наш народ теряет надежду"
 afo_news.7.b: "Мы на пороге победы"
 afo_news.7.c: "Любопытно"
 afo_news.7.e: "Мы приближаемся к поражению"
  
 afo_news.8.t: "Северная Африка Виши переходит на другую сторону!"
 afo_news.8.d: "Поскольку многие провинции вишистской Франции находятся под контролем союзников, а легитимность Свободной Франции быстро растет, глава Французской Северной Африки адмирал Дарлан приказал всем силам Виши присоединиться к усилиям союзников против Оси. Это огромный удар по режиму Виши и странам Оси в Северной Африке, который дает союзникам уникальную возможность взять под полный контроль регион."
 afo_news.8.a: "Огромная катастрофа!"
 afo_news.8.b: "петля затягивается..."
 afo_news.8.c: "Французам нельзя доверять"
 afo_news.8.e: "Неожиданный поворот событий!"
  
 afo_news.9.t: "Рузвельт произносит речь «Арсенал демократии»"
 afo_news.9.d: "Сегодня, в своей 16-й беседе у камина, Рузвельт призвал американский народ осознать опасность, которую агрессия стран Оси представляет для Соединенных Штатов. Под влиянием падения Франции и изоляции Британии Рузвельт призвал американский народ осознать, что Атлантический и Тихий океаны не гарантируют безопасность Соединенных Штатов, указывая, что многие немецкие бомбардировщики легко могут достичь США. Самой узнаваемой частью речи была определяющая фраза, в которой Рузвельт заявил: «Мы должны быть великим арсеналом демократии. Для нас это чрезвычайная ситуация, столь же серьезная, как сама война». Хотя США уже некоторое время постепенно отказываются от изоляционизма, это четкий сигнал странам Оси о том, что Америка будет готова защищать свои интересы за границей, несмотря на свой прежний нейтралитет."
 afo_news.9.1: "Мы должны быть готовы защищать демократию"
 afo_news.9.2: "Тревожно"
 afo_news.9.3: "Вместе мы должны защитить демократию"
 afo_news.9.4: "Интересный"
  
 afo_news.10.t: "Выступление Хайле Селассие"
 afo_news.10.d: "После завоевания Эфиопии ее бывший лидер Хайле Селассие сбежал в штаб-квартиру Лиги Наций, чтобы сделать заявление о последних событиях. Селассие осудил итальянскую агрессию и раскритиковал мировое сообщество за бездействие. В заключение своей речи, которая позже стала заголовками во всем мире, он сказал: «Это мы сегодня. Это будете вы завтра». Хотя многие справедливо критикуют Великобританию и Францию, обе страны не готовы к какому-либо вмешательству. Именно из-за этого и предыдущих неудач Лиги, по мнению экспертов, это стало последним гвоздем в гроб Лиги Наций."
 afo_news.10.a: "Никто не встанет на нашем пути"
 afo_news.10.b: "Мы не выполнили свой долг"
 afo_news.10.c: "Какой фарс"
  
 afo_news.11.t: "Победа Японии на Тихом океане"
 afo_news.11.d: "Японская империя безраздельно господствует в Тихом океане, контролируя весь Тихий океан и океанический континент, и нет никакой надежды сдержать японскую армию и военно-морские силы. Чтобы остановить дальнейшее продвижение на запад, в Среднюю Азию и на Ближний Восток, союзники решили подписать мир с Японией, уступив территории и военно-морские базы японцам и положив начало миру между ними. \nПразднования по всей Империи продолжаются, и восстановление континента начинается прямо сейчас, но уже есть сомнения относительно того, продлится ли этот мир. США остаются мировой сверхдержавой и крайне враждебно относятся к японцам, а военные расходы остаются высокими. Будущее Империи будет зависеть от того, насколько хорошо она сможет интегрировать свои новые территории и укрепить их."
 afo_news.11.a: "Во славу Империи!"
 afo_news.11.b: "Очень тревожная ситуация"
 afo_news.11.c: "Кто бы мог подумать"
  
 afo_news.12.t: "Победа союзников на Тихом океане"
 afo_news.12.d: "С капитуляцией японцев война на Тихом океане подошла к концу. Император Хирохито подписал безоговорочную капитуляцию с союзными державами и приказал прекратить все военные операции на всей территории Японской империи. Однако капитуляция не была принята по всей стране: некоторые опорные пункты отказались сдаться, а мятежники даже ненадолго заняли императорский дворец.\nОднако США направили тысячи солдат в Токио и остальную часть Японии, чтобы предотвратить организованное сопротивление, и начали процесс восстановления и дерадикализации Японии. Большая часть Восточной Азии находится в руках союзников, создавая ощущение стабильности в регионе, однако еще неизвестно, как Китай и Советский Союз отреагируют на поражение Японии."
 afo_news.12.a: "Мы боролись до конца"
 afo_news.12.b: "Победа над Японией!"
 afo_news.12.c: "Отличная победа"
  
 afo_news.13.t: "Победа Оси в Европе"
 afo_news.13.d: "Страны Оси торжествуют в Европе. Союзники были изгнаны, а Советы лежат разбитыми и побежденными. Одну победу за другой немецкая военная машина доказывала, что она может победить, несмотря ни на что. Не имея надежды на какое-либо значимое сопротивление, Соединенные Штаты решили подписать белый мир с Германским рейхом, отказавшись от своих союзников в Европе и реорганизовав то, что осталось в Америке. \nПохвальба Гитлера о тысячелетнем рейхе воплощается в жизнь, но разговоры о третьей мировой войне — это совсем не слухи. Без сомнения, США и Германия остаются в состоянии повышенной боевой готовности и крайне враждебны друг к другу. В ближайшие несколько лет мы увидим, продолжит ли Германия оставаться сильной или разразится гражданской войной, движимой жаждой власти, или союзники так или иначе вернутся…"
 afo_news.13.a: "Нас устроит только окончательная победа!"
 afo_news.13.b: "Ужасный результат"
 afo_news.13.c: "Потрясающая победа"
  
 afo_news.14.t: "Победа союзников в Европе"
 afo_news.14.d: "С капитуляцией Германии и Италии война в Европе практически закончилась. Европа стоит среди тотального опустошения и в центре нового раскола между двумя мировыми сверхдержавами. Районы, находящиеся под советским контролем, заплатили высокую цену, и надежды на их свободу мало, а территории, находящиеся под контролем союзников, остались в полной опустошенности, так и не оправившись полностью от великой войны. Они будут зависеть от столь необходимой помощи США. \nЭто знаменует конец фашизма в Европе, и хотя это повод для большого празднования, эксперты и лидеры уже рассматривают возможность третьей мировой войны. Что бы ни ждало будущее, одно является ключевым: союзники торжествуют, но впереди еще много пути…"
 afo_news.14.a: "Победа!"
 afo_news.14.b: "Великая победа Родины!"
 afo_news.14.c: "Выдающаяся победа"
  
 afo_news.15.t: "Италия подписывает перемирие"
 afo_news.15.d: "После катастрофических потерь территории и людей Италия свергла Муссолини и подписала перемирие с союзниками, положившее конец войне для итальянцев. Северная Африка остается под контролем союзников, а Италия находится под частичной оккупацией союзников, пока война не закончится. Без сомнения, это удар по державам Оси, интересно, какой может быть реакция Германии на это?"
 afo_news.15.a: "Предатели!"
 afo_news.15.b: "Огромная победа для нас"
 afo_news.15.c: "Мы обеспечили наше выживание"
 afo_news.15.e: "Сильный удар по альянсу Оси"
  
 afo_news.16.t: "Конец Зимней войны"
 afo_news.16.d: "После захвата города Ленинграда финскими войсками финское правительство вынудило Советы подписать мирное соглашение. Такой катастрофический результат для Советов невозможно было предсказать, и это великая победа финнов, которых другим странам впредь не стоит недооценивать."
 afo_news.16.a: "Великая Победа!"
 afo_news.16.b: "Как такое могло произойти!"
 afo_news.16.c: "это беспрецедентно"
  
 afo_news.17.t: "[From.GetName] создает «Северное сияние»"
 afo_news.17.d: "Стремясь сдержать иностранную агрессию в Скандинавии, [From.GetName] предпринимает политические шаги по созданию нового альянса в регионе.\n\nВ основном военный по своей природе, [From.GetFactionName] будет, по словам [From.GetLeader], гарантировать защиту всех скандинавских народов от иностранной агрессии"
 afo_news.17.a: "Мы выстоим"
 afo_news.17.b: "Будем надеяться, что их интересы не противоречат нашим."
 afo_news.17.c: "Это может стать поводом для беспокойства."
  
 afo_news.18.t: "Финляндия уступает Аландские острова"
 afo_news.18.d: "Стремясь улучшить отношения со Швецией, Финляндия решила уступить ей Аландские острова, положив конец этому спорному вопросу. Это, несомненно, приведет к более тесному сотрудничеству между двумя странами в гражданских и, возможно, военных вопросах."
 afo_news.18.a: "На благо Финляндии"
 afo_news.18.b: "Это хороший результат"
 afo_news.18.c: "Интересный результат"
  
 afo_news.19.t: "В Финляндии разгорается гражданская война!"
 afo_news.19.d: "Отколовшаяся коммунистическая фракция в Финляндии двинулась к Хельсинки и захватила столицу после многочисленных стычек, которые теперь переросли в полноценную гражданскую войну, положившую начало Второй гражданской войне в Финляндии на памяти живущих. Иностранные аналитики пришли к выводу, что коммунисты медленно распространяли недовольство внутри Финляндии, дестабилизируя страну и позволяя им тайно ввозить людей и оружие в ожидании захвата власти. Время покажет, кто победит."
 afo_news.19.a: "За Великую Финляндию!"
 afo_news.19.b: "Наши товарищи восстают!"
 afo_news.19.c: "Коммунистическая угроза распространяется"
 afo_news.19.e: "Это тревожит"
  
 afo_news.20.t: "[SIK.GetName] аннексирован!"
 afo_news.20.d: "Министр иностранных дел России объявил сегодня об объединении Монгольского края в состав Советского Союза. Монголы, казалось, были в восторге от празднования объединения, конечно же, под пристальным наблюдением советской охраны."
 afo_news.20.a: "Синки-ваа?"
 afo_news.20.b: "Слава Советскому Союзу!"
  
 afo_news.21.t: "[SIK.GetName] принят в [SOV.GetName]!"
 afo_news.21.d: "[SOV.GetName] объявил [SIK.GetName] своим новым членом. С присоединением Монголии Союз на востоке становится еще больше. КПСС, казалось, была довольна тем, что ее членство было принято после новой войны, разразившейся между [CHI.GetName] и [JAP.GetName], поскольку они привели свою страну в новую эру безопасности."
 afo_news.21.a: "Вот вам и свободная Восточная Азия..."
 afo_news.21.b: "Вместе, товарищи!"
  
 afo_news.22.t: "[SOV.GetName] аннексирует [EST.GetName]"
 afo_news.22.d: "После ультиматума, выдвинутого [SOV.GetName], правительство [EST.GetName] согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] потребовал выполнения пакта о взаимопомощи путем создания военных баз в Эстонии. Однако теперь поступают сообщения о том, что авиабазы и порты также были захвачены советскими военными, а принудительные выборы привели к присоединению [EST.GetName] к [SOV.GetName]. Многие наблюдатели сочувствуют эстонскому народу в том, что они называют враждебным поглощением."
 afo_news.22.a: "Наслаждайтесь захватом земель, Советы. Вы будете следующими."
 afo_news.22.b: "Советская экспансия на Запад? Это должно стать интересным..."
 afo_news.22.c: "О, я надеюсь, что их голоса все еще учитываются..."
 afo_news.22.e: "Еще одно прекрасное пополнение моей коллекции..."
  
 afo_news.23.t: "[SOV.GetName] аннексирует [LAT.GetName]"
 afo_news.23.d: "После ультиматума, выдвинутого [SOV.GetName], правительство [LAT.GetName] согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] потребовал выполнения пакта о взаимопомощи путем создания военных баз в Латвии. Однако теперь поступают сообщения о том, что авиабазы и порты также были захвачены советскими военными, а принудительные выборы привели к присоединению [LAT.GetName] к [SOV.GetName]. Многие наблюдатели сочувствуют латвийскому народу в том, что они называют враждебным поглощением."
 afo_news.23.a: "Наслаждайтесь захватом земель, Советы. Вы будете следующими."
 afo_news.23.b: "Советская экспансия на Запад? Это должно стать интересным..."
 afo_news.23.c: "О, я надеюсь, что их голоса все еще учитываются..."
 afo_news.23.e: "Еще одно прекрасное пополнение моей коллекции..."
  
 afo_news.24.t: "[SOV.GetName] аннексирует [LIT.GetName]"
 afo_news.24.d: "После ультиматума, выдвинутого [SOV.GetName], правительство [LIT.GetName] согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] потребовал выполнения пакта о взаимопомощи путем создания военных баз в Литве. Однако теперь поступают сообщения о том, что авиабазы и порты также были захвачены советскими военными, а принудительные выборы привели к присоединению [LIT.GetName] к [SOV.GetName]. Многие наблюдатели сочувствуют литовскому народу в том, что они называют враждебным поглощением."
 afo_news.24.a: "Наслаждайтесь захватом земель, Советы. Вы будете следующими."
 afo_news.24.b: "Советская экспансия на Запад? Это должно стать интересным..."
 afo_news.24.c: "О, я надеюсь, что их голоса все еще учитываются..."
 afo_news.24.e: "Еще одно прекрасное пополнение моей коллекции..."
  
 afo_news.25.t: "Победа Оси в России"
 afo_news.25.d: "После долгих лет борьбы страны Оси торжествуют победу в России, пройдя Урал. Советы лежат разбитыми и побежденными, одно сражение за другим немецкая военная машина доказывала, что она может победить, несмотря ни на что. Потеряв большую часть своей промышленности, населения и армии, Советы подписали мирный договор, завершающий войну, которую они не могут выиграть. \nЦели Гитлера на Востоке теперь выполнены, но нет никаких сомнений в том, что Советы воспользуются этим временем, чтобы попытаться восстановить свои силы для повторного завоевания. Без сомнения, обе стороны будут оставаться в состоянии повышенной готовности."
 afo_news.25.a: "Мы обрели жизненное пространство!"
 afo_news.25.b: "Мы отомстим..."
 afo_news.25.c: "Ужасный результат"
 afo_news.25.e: "Потрясающая победа"
  
 afo_news.26.t: "Вильгельм II возвращается в Германскую империю"
 afo_news.26.desc: "Вчера утром правительство Германии сделало неожиданное заявление: правительство Германии официально сняло ссылку с Вильгельма II. Позже в тот же день кортеж старого кайзера пересек голландско-германскую границу. Однако с неожиданным поворотом кайзер выступил за то, чтобы вместо этого на трон взошел его сын Вильгельм III.\n\nКайзер уже поклялся увидеть возвращение Германии к своему прежнему величию, но он поддержит его со стороны, но еще неизвестно, в каком направлении нация пойдет со своей дипломатией."
 afo_news.26.a: "Да здравствует Кайзер!"
 afo_news.26.b: "Возвращение в начало века?"
 afo_news.26.c: "Мы внесли свой вклад в его безопасность."
 afo_news.26.d: "Нам следовало сильнее давить на голландцев с целью его экстрадиции!"
  
 afo_news.27.t: "Битва за Китай начинается"
 afo_news.27.d: "После инцидента с Оямой и Япония, и Китай обвинили друг друга в эскалации растущей напряженности в Китае. Переговоры прервались после того, как Китаю были предъявлены требования полностью уйти из Шанхая, которые были категорически отклонены. После боевых действий в Пекине и Тяньцзине Шанхай стал следующим полем битвы в конфликте, который теперь перерос в полномасштабную войну.\n\n У Японии есть преимущество в виде лучше оснащенной армии и военно-воздушных сил, но время покажет, смогут ли их остановить огромные масштабы Китая."
 afo_news.27.a: "Очередной провал Лиги Наций"
 afo_news.27.b: "Пришло время вернуть себе весь Китай!"
 afo_news.27.c: "Пришло время оккупировать весь Китай!"
  
 afo_news.28.t: "Падение Пекина"
 afo_news.28.d: "После нескольких недель боевых действий крупномасштабные военные столкновения между Китаем и Японией в Пекине и Тяньцзине охватили весь регион, а Япония оттеснила китайцев дальше в Хэбэй.\n\n Из-за абсолютного превосходства Японии на море и в воздухе китайская армия не смогла сохранить сплоченность и понесла огромные потери в городах. Поскольку эта территория теперь прочно находится в руках Японии, многие задаются вопросом, будет ли этого достаточно, чтобы предотвратить полномасштабную войну."
 afo_news.28.a: "Интересный результат"
 afo_news.28.b: "Мы недооценили соперника."
 afo_news.28.c: "Первая из многих грядущих побед"
  
 afo_news.29.t: "Падение Шанхая"
 afo_news.29.d: "Вскоре после сражений за Пекин и Тяньцзинь китайские и японские войска вступили в перестрелку из стрелкового оружия в районах Шанхая. Это противостояние привело к месяцам жестокой городской войны с тяжелыми жертвами с обеих сторон, и в конце концов упорного сопротивления Китая оказалось недостаточно, чтобы сдержать японские войска. Учитывая две великие победы Японии, похоже, что войне не будет конца в обозримом будущем."
 afo_news.29.a: "Интересный результат"
 afo_news.29.b: "Мы недооценили соперника."
 afo_news.29.c: "В Нанкин!"
  
 afo_news.30.t: "Падение Уханя"
 afo_news.30.d: "После многих жестоких боев в Ухане и его окрестностях японские войска наконец одержали победу, переправившись через реку и захватив ключевые районы Уханя. Невозможно переоценить, насколько это подрывает китайскую промышленность и военные усилия. Мы можем только признать, что без помощи дни Китая сочтены."
 afo_news.30.a: "Крутой поворот событий"
 afo_news.30.b: "Мы должны стоять насмерть"
 afo_news.30.c: "Китай искалечен!"
  
 afo_news.31.t: "Победа Японии в России"
 afo_news.31.d: "После долгих лет сражений японцы одерживают победу в России. Они захватили весь Дальний Восток, а Советы разбиты и побеждены. Одно сражение за другим японская военная машина доказывала, что способна побеждать, несмотря ни на что. Частью мирного соглашения является переход Монголии в сферу совместного процветания и создание нового марионеточного режима на российском Дальнем Востоке. Время покажет, будет ли Советский Союз готовиться вернуть себе эти территории позднее."
 afo_news.31.a: "Оглушительный успех!"
 afo_news.31.b: "Мы отомстим..."
 afo_news.31.c: "Ужасный результат"
 afo_news.31.e: "Потрясающая победа"
  
 afo_news.32.t: "[PRC.GetName] победил в гражданской войне!"
 afo_news.32.d: "После долгих лет борьбы китайские коммунисты одерживают победу в Китае. Они захватили весь материковый Китай в кровавых боях, а поддержка народа помогла им свергнуть правящую фракцию националистов. У [PRC.GetName], несомненно, есть планы на этот новый Китай, еще неизвестно, каковы эти планы..."
 afo_news.32.a: "Мы одержали высшую победу!"
 afo_news.32.b: "Мы отомстим..."
 afo_news.32.c: "Потрясающий результат"
  
 afo_news.33.t: "Великобритания эвакуируется в Канаду"
 afo_news.33.d: "После борьбы с немцами за каждый дюйм своего острова правительство и королевская семья Соединенного Королевства были вынуждены эвакуироваться. Кроме того, силами Королевского флота удалось эвакуировать миллион незаменимых мужчин и женщин в ходе события, которое многие называют «Вторым Дюнкерком». Несмотря на то что противника встречали на пляжах и сражались с ним на местах высадки, ополчение было отброшено и смято. Британское правительство возобновит работу по ту сторону океана, в Канаде, где оно продолжит решительно противостоять врагам Ее Величества."
 afo_news.33.a: "Мы никогда не сдадимся!"
 afo_news.33.b: "Мы больше их не увидим"
 afo_news.33.c: "Падение империи"
  
 afo_news.34.t: "Смерть Сталина"
 afo_news.34.d: "Умер великий Генеральный секретарь Коммунистической партии Советского Союза Иосиф Сталин, сообщила сегодня советская газета «Правда». Сообщается, что он умер медленной и мучительной смертью от кровоизлияния в мозг. Хотя он не оставил ни порядка преемственности, ни назначенного преемника, Президиум ЦК Коммунистической партии Советского Союза собрался сразу после смерти Сталина, чтобы обсудить коллективные шаги вперед для Союза. Его похороны планируют провести на Красной площади, а тело похоронят в Мавзолее Ленина."
 afo_news.34.a: "Да здравствует Сталин, Человек из Стали!"
 afo_news.34.b: "Жаль, что он умер своей смертью"
 afo_news.34.c: "Смерть диктатора"
  
 afo_news.35.t: "Смерть Сталина"
 afo_news.35.d: "Умер Генеральный секретарь ЦК КПСС Иосиф Сталин. Сообщается, что вскоре после сокрушительного поражения и унизительного отступления на Урал и в Сибирь Иосиф Сталин умер при загадочных обстоятельствах. В настоящее время неизвестно, была ли это естественная смерть, несчастный случай или убийство. Многие подозревают, что его власть угасла так же быстро, как и Союз, которым он когда-то руководил. Неизбежно последует борьба за власть на руинах Советского Союза. Означает ли это конец сталинизма или коммунизма в целом? Время покажет."
 afo_news.35.a: "Он подвел нас. Теперь пришло время появиться новому лидеру."
 afo_news.35.b: "Скатертью дорога"
 afo_news.35.c: "Должно быть, это было «самоубийство»."
  
 afo_news.36.t: "[SOV.GetName] охвачен гражданской войной"
 afo_news.36.d: "\n\nОстатки Объединенных Социалистических Советских Республик сегодня наконец распались в результате очевидной борьбы за власть после смерти знаменитого лидера Иосифа Сталина. Неспособность Центрального Комитета принять решение о будущем Советского Союза привела к тому, что ближайшее окружение Сталина вступило в борьбу за власть. Георгий Маленков, которого многие считали «фаворитом» Сталина, завоевал поддержку среди тех, кто все еще верен партии. И наоборот, Никита Хрущев смог заручиться поддержкой реформаторов, стремившихся изменить многие направления политики Сталина к лучшему."
 afo_news.36.a: "Возможно, мы проиграли врагу, но себе не проиграем."
 afo_news.36.b: "Нам удалось выбить дверь. Теперь мы наблюдаем, как вся гнилая конструкция рушится."
 afo_news.36.c: "Вот вам и «Союз» Социалистических Советских Республик."
  
 afo_news.37.t: "Объединение Польши-Литвы"
 afo_news.37.d: "По настоянию поляков Литва провела референдум о возможном воссоединении двух народов. Окончательный подсчет почти завершен, но уже ясно, что это убедительная победа лагеря воссоединения. Было множество сообщений о нарушениях, подтасовках и фальсификациях на выборах, но официальные лица Литвы отвергли эти обвинения и уже начали реформировать администрацию в региональное правительство польского государства.\n\nХотя польская общественность горячо приветствует этот шаг, политические последствия референдума, вероятно, будут остро ощущаться по всей Европе."
 afo_news.37.a: "Братские узы и несколько удобных взяток..."
 afo_news.37.b: "Это наша сфера влияния!"
 afo_news.37.c: "Польша еще может стать крупным игроком..."
 afo_news.37.e: "Интересный результат"
  
 wtt_germany.4.b: "Лучше, чтобы он поддерживал страну, оставаясь в стороне"
  
 afo_news.38.t: "Гражданская война в Италии"
 afo_news.38.d: "В Италии разразилась гражданская война! Муссолини вышел из тьмы, готовый вернуть себе титул дуче после своей отставки, и значительная часть итальянских вооруженных сил откликнулась на его призыв к оружию. \n\nОн основал оплот на Севере, где находится большая часть итальянской промышленности, и его взгляды устремлены на Рим и Сицилию.\nЛоялистские силы и добровольцы собрались под знаменами королевского правительства, полные решимости дать отпор и раз и навсегда покончить с угрозой Муссолини. \n\nБитва за Италию началась."
 afo_news.38.a: "Добьется ли Муссолини успеха?"
 afo_news.38.b: "К победе!"
  
 afo_news.39.t: "Конец гражданской войны в Италии"
 afo_news.39.d: "С капитуляцией последних опорных пунктов фашистов Гражданская война в Италии подошла к концу. \n\nРеспубликанцы одерживают победу, и для Италии началась новая эра. \n\nРаздираемая войной страна сильно пострадала в боях, но амбиции Италии сохраняются. Время покажет, когда Италия сделает следующий шаг"
 afo_news.39.a: "Родина фашизма свергнута"
 afo_news.39.b: "Теперь исцелим нашу нацию."
  
 afo_news.40.t: "Защитник Балкан"
 afo_news.40.d: "Стремясь стать доминирующей державой на Балканах, в регионе, известном своей нестабильностью, но невероятно ценном, Италия провозгласила себя его защитником. Дипломатов с Балкан пригласили присоединиться к Италии под единым знаменем, но мы подождем и посмотрим, как на это отреагирует каждый из них. Протесты также были поданы со стороны окружающих крупных держав, поскольку они, возможно, становятся свидетелями конца своей сферы влияния."
 afo_news.40.a: "Мы – маяк надежды для Балкан!"
 afo_news.40.b: "Пришло время погасить пороховую бочку"
 afo_news.40.c: "Конфронтация с Италией неизбежна"
 afo_news.40.e: "Интересный ход Италии."
 afo_news.40.f: "Позволим ли мы Италии избежать наказания за это?"
  
 afo_news.41.t: "Подписание Бейрутской конференции"
 afo_news.41.d: "Считая совместную победу над [GER.GetNameDef] неизбежной, [beirut_origin.GetNameDef] и [beirut_partner.GetNameDef] стремятся обеспечить будущую стабильность в Германии. [beirut_origin.GetLeader] и [beirut_partner.GetLeader] встретились, чтобы договориться о судьбе [GER.GetNameDef].\n\nДни переговоров привели к составлению новой карты Германии. Эта новая Германия разделена между Востоком и Западом, а Франция создает марионеточное государство на Рейне.\n\nЕще неизвестно, действительно ли это приведет к прочному миру в Европе."
 afo_news.41.a: "Не хвали день, пока не наступил вечер."
 afo_news.41.b: "Мы требовали того, что казалось правильным."
 afo_news.41.c: "Давайте доведем эту войну до скорейшего завершения."
 afo_news.41.e: "Возможно, это конец [GER.GetNameDef]."
  
 afo_news.42.t: "Расцвет Тиойской империи"
 afo_news.42.desc: "Военное наступление [From.GetOldAdjective] кажется совершенно неудержимым, и идея, над которой многие насмехались в последние годы – создание новой Римской империи – теперь кажется полностью в пределах досягаемости итальянцев. Большинство континентальных европейских держав, которые могли им противостоять, были практически уничтожены, что дало итальянцам возможность навязывать свою волю завоеванным народам.\n\nПомимо начала интеграции того, что они уже начали называть «отвоеванными римскими территориями», Итальянское правительство объявило о возрождении Римской империи, переименовав страну в «[From.GetNameDef]»."
 afo_news.42.a: "Дело рук бельгийских львов!"
 afo_news.42.b: "Посмотрим, как долго они продержатся"
  
 afo_news.43.t: "Капитуляция Ирана"
 afo_news.43.d: "Союзники имели полный контроль над небом Ирана, и значительная часть страны находилась в их руках. В столице Тегеране гражданское население страдало от нехватки продовольствия и воды. Советские ВВС сбросили листовки с предупреждением о массированной бомбардировке, если Иран не сдастся. Столкнувшись с распадающейся армией и разваливающимся правительством, армейские генералы тайно встретились, чтобы обсудить варианты капитуляции. Когда шах узнал о действиях генералов, он избил главу вооруженных сил тростью и физически лишил его звания. Шах послал своего премьер-министра Мохаммеда Али Форуги для переговоров с союзниками. Однако Форуги дал понять британцам, что и он, и иранский народ хотят «освободиться» от правления шаха. Шах отрекся от престола, и Иран был разделен между Соединенным Королевством и Советским Союзом."
 afo_news.43.a: "Наконец-то капиталисты нам помогают"
 afo_news.43.b: "Они думают, что это их спасет?"
 afo_news.43.c: "Это должно беспокоить фашистов..."
  
 afo_news.44.t: "СССР исключили из Лиги Наций"
 afo_news.44.d: "СССР сегодня стал первым членом Лиги Наций, насильственно исключенным из этой организации. Это действие стало прямым результатом недавней советской агрессии. Хотя этот шаг должен был иметь серьезные последствия, критики говорят, что Лига слаба и это никак не поможет сдержать советскую агрессию. Тем не менее, действия Лиги, по крайней мере, на словах уязвили. «Советский Союз был единственным членом Лиги, когда-либо пострадавшим от такого унижения»."
 afo_news.44.a: "Дураки! Настоящие враги – фашисты."
 afo_news.44.b: "В любом случае, они были глупы, встав на сторону капиталистов."
 afo_news.44.c: "Это все, что мы можем сделать"
  
 afo_news.45.t: "Средиземноморско-Балканский блок помощи"
 afo_news.45.d: "Военная машина [GER.GetName] теперь обратилась против своих бывших союзников, что является шоком для одних и неизбежностью для других. Последние оставшиеся страны Европы во главе с Италией сформировали оборонительный союз, чтобы противостоять немцам, и хотя их объединенных вооруженных сил и экономики может быть недостаточно, чтобы остановить немцев, они наверняка заставят своих бывших союзников дорого заплатить за это предательство."
 afo_news.45.a: "Не все потеряно"
 afo_news.45.b: "Будем надеяться, что Германия откусила больше, чем может проглотить"
 afo_news.45.c: "Интересный поворот событий"
 afo_news.45.e: "Пришло время объединить под нашей властью всю Европу"
  
 afo_news.46.t: "Клемент Эттли побеждает на британских выборах [GetYear] года!"
 afo_news.46.d: "Несмотря на то что его соперником был сам «британский бульдог», Клемент Эттли сумел победить на выборах, пообещав мир и стабильность для будущего Великобритании"
 afo_news.46.a: "Рады за них"
 afo_news.46.b: "Превосходный результат"
 afo_news.46.c: "Интересно"
  
 afo_news.47.t: "Уинстон Черчилль побеждает на британских выборах [GetYear] года!"
 afo_news.47.d: "Несмотря на жесткую оппозицию и сильное стремление к большей стабильности, «британский бульдог» убедил британский народ, что эта стабильность не продлится долго и что необходимо сильное руководство, чтобы сохранить Британию живой и в игре."
 afo_news.47.a: "Рады за них"
 afo_news.47.b: "Смелый результат"
 afo_news.47.c: "Нам нужно внимательно следить за этим"
  
 afo_news.51.t: "Опубликован первый комикс о Капитане Америке"
 afo_news.51.d: "Сегодня первая версия комиксов о Капитане Америке была опубликована писателем Джо Саймоном и художником Джеком Кирби. Джо Саймон отметил: «Когда вышел первый выпуск, мы получили много писем с угрозами и писем с ненавистью. Некоторые люди действительно выступали против того, за что выступал Кэп». Угрозы, включая угрожающие группы людей, слонявшихся на улице у редакции, оказались настолько серьезными, что была организована полицейская охрана, а мэр Нью-Йорка Фиорелло Ла Гуардиа лично связался с Саймоном и Кирби, чтобы выразить свою поддержку."
 afo_news.51.a: "Хорошо?"
 afo_news.51.b: "Американская пропаганда."
 afo_news.51.c: "Как мило"
  
 afo_news.50.t: "Смерть Вильгельма II"
 afo_news.50.d: "4 июня бывший и изгнанный кайзер Германии, император Вильгельм II, как сообщается, умер от тромбоэмболии легочной артерии в возрасте 82 лет. Несмотря на свою личную неприязнь к монархии, Гитлер хотел привезти тело кайзера обратно в Берлин для государственных похорон. Однако затем был раскрыт приказ Вильгельма о том, что его тело не должно возвращаться в Германию до тех пор, пока монархия не будет сначала восстановлена, и он был неохотно выполнен. Впоследствии нацистские власти организовали небольшие военные похороны, на которых присутствовало всего несколько сотен человек."
 afo_news.50.a: "Хм."
 afo_news.50.b: "Да упокоится он с миром"
  
 afo_news.52.t: "Да! У нас нет апельсинов"
 afo_news.52.d: "Хотя наша строгая программа нормирования не распространяется на свежие фрукты, тень войны означает, что нам не хватает большей части наших возможностей для импорта. Поэтому многие бывшие товары из тропиков теперь стали недосягаемой роскошью, включая такие продукты, как лимоны и апельсины. К сожалению, не хватает фасоли и лука, капусты и зеленого лука, а также всяких фруктов, но немецкий дух не сломлен!"
 afo_news.52.a: "Я просто хотел апельсинов"
  
 afo_news.53.t: "Указ Nº 9066"
 afo_news.53.d: "Около 120 000 человек японского происхождения, большинство из которых проживали на Тихоокеанском побережье, были насильственно переселены и заключены в концентрационные лагеря на западе страны. Примерно две трети интернированных были гражданами США. Эти меры были введены указом президента Франклина Д. Рузвельта вскоре после нападения Императорской Японии на Перл-Харбор. Аналогичные меры были приняты против американцев немецкого и итальянского происхождения, которые в основном не являются гражданами."
 afo_news.53.a: "Позор"
 afo_news.53.b: "Это необходимо"
  
 afo_news.54.t: "Шпеер назначен рейхсканцлером"
 afo_news.54.d: "Два дня назад, после внезапной смерти Адольфа Гитлера, Альберт Шпеер, бывший министр вооружений, был неожиданно назначен новым рейхсканцлером созванной НСДАП. Теперь Шпеер, скорее всего, приступит к полному реформированию военной промышленности и избавлению от таких конкурентов, как Геббельс и Геринг, однако маловероятно, что эти реформы будут иметь какое-либо значение."
 afo_news.54.a: "Неважно"
 afo_news.54.b: "Коррупция будет искоренена"
  
 afo_news.55.t: "[SOV.GetName] аннексирует части [TUR.GetAdjective]ой Анатолии"
 afo_news.55.d: "После ультиматума, который выдвинул [SOV.GetName], ослабленное [TUR.GetAdjective]ое правительство согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] предъявил свои исторические притязания на части восточной Анатолии. Многие наблюдатели сочувствуют [TUR.GetAdjective]ому народу в том, что они называют насильственной аннексией."
 afo_news.55.a: "Советы идут, чтобы заблокировать нас!"
 afo_news.55.b: "Советы выступают, чтобы заблокировать Германию!"
 afo_news.55.c: "О, я надеюсь, что их голоса все еще учитываются..."
 afo_news.55.e: "Кавказ теперь в безопасности.."
  
 afo_news.56.t: "[JAP.GetName] подписывает мирное соглашение с [CHI.GetAdjective]им правительством"
 afo_news.56.d: "\nЯпония после встречи с США согласилась на прекращение огня с Китаем и вывод войск со многих территорий в Восточной Азии."
 afo_news.56.a: "Время сосредоточиться на Севере"
 afo_news.56.b: "Время восстанавливать и планировать"
 afo_news.56.c: "Тревожно, мы должны обезопасить Восток"
 afo_news.56.e: "Интересный результат"
  
 afo_news.57.t: "Государственный переворот во Франции!"
 afo_news.57: "Вчера французская армия взяла штурмом ключевые объекты Парижа. Главные должностные лица были арестованы. Переворот, возглавляемый Луи Наполеоном, только что вернувшимся из изгнания, и которому помогает молодой офицерский корпус, направлен на предотвращение создания тоталитарного государства при будущем короле Альфонсе I. Что произойдет дальше, пока неясно, но мы, возможно, уже в курсе. на пороге возвращения Французской империи."
 afo_news.57.a: "Революция во Франции? Снова?"
 afo_news.57.b: "Переворот удался!"
  
 afo_news.58.t: "Падение Гибралтара"
 afo_news.58.d: "После нескольких противоречивых сообщений было подтверждено, что Гибралтар пал перед Японией. \n\nНикто не может объяснить, как это могло произойти, и как японские войска вообще оказались на этой стороне света."
 afo_news.58.a: "Кто захватил Гибралтар?!"
 afo_news.58.b: "Почетная победа"
 afo_news.58.c: "Я требую объяснений! Немедленно!"

 afo_news.59.t: "Внезапное нападение японцев на Перл-Харбор!"
 afo_news.59.d: "После нескольких противоречивых сообщений было подтверждено, что Япония совершила неспровоцированную атаку на Перл-Харбор. В результате атаки было повреждено большое количество кораблей, и пройдет некоторое время, прежде чем они вернутся в строй."
 afo_news.59.a: "Это неспровоцированное нападение не останется безнаказанным!"

 afo_news.60.t: "Войска противника сдались!"
 afo_news.60.d: "Спустя 3 долгих месяца люди, которых мы окружили, наконец сдались. Их болезненное и пошатывающееся состояние продолжает доказывать мастерство наших могучих вооруженных сил!"
 afo_news.60.a: "Вперед!"
  
 afo_news.61.t: "Восстание в Италии!"
 afo_news.61.d: "После провальной эфиопской кампании и убийства дуче и короля коммунисты и республиканцы взяли в руки оружие, чтобы избавить страну от фашизма. Уже поступают сообщения о рукопашных схватках, а лидеры различных городов заявляют о своей поддержке одного из трех режимов. Европа готовится к очередной гражданской войне..."
 afo_news.61.a: "Свергнуть фашистов!"
 afo_news.61.b: "Будем надеяться, что у них все получится"
 afo_news.61.c: "Это может вызывать беспокойство"

 afo_news.62.t: "Бенито Муссолини убит!"
 afo_news.62.d: "Бенито Муссолини был найден мертвым вместе с многими членами своего ближайшего окружения на своей вилле в Швейцарии. Фашистское правительство находится в состоянии хаоса, и Итало Бальбо взял на себя руководство, пообещав найти виновных. Италия погружается в нестабильность, и кто знает, что может произойти дальше."
 afo_news.62.a: "Идеальный результат!"
 afo_news.62.b: "Мы должны обратиться к этим революционерам"
 afo_news.62.c: "Быстрое развитие событий..."

 ITA_benito_mussolini_assasinated: "Бенито Муссолини был убит"

 afo_news.63.t: "Убийство короля Эммануила!"
 afo_news.63.d: "Король Виктор Эммануил был убит в результате взрыва бомбы под его автомобилем, несмотря на то, что он находился в безопасном месте в Швейцарии. Это ужасное событие привело к гибели любимого короля и погрузило Италию в кризис."
 afo_news.63.a: "Бог больше не благоволил Виктору Эммануилу"
 afo_news.63.b: "Темный день для итальянской монархии"
 afo_news.63.c: "Долой монархию!"

 ITA_victor_emmanuel_assasinated: "Король Эммануэль был убит"
  
 afo_news.64.t: "Открытие ядерного деления!"
 afo_news.64.d: "Легендарное расщепление атома наконец-то осуществилось. Ученые в [?global.first_atomic_research.GetNameDef] первыми успешно расщепили атом урана, бомбардируя его нейтронами. В результате атом урана распался на два разных элемента, а часть массы была потеряна в виде энергии. Это не только опровергло давнее убеждение, что атом невозможно расщепить, но и позволило использовать полученную энергию для различных целей."
 afo_news.64.a: "Мы первыми освоили ядерное деление!"
 afo_news.64.b: "Впечатляющее достижение"
 afo_news.64.c: "Мы должны действовать, иначе рискуем отстать"
  
 generic.26.t: "Тревога: морской десант!"
 generic.26.d: "Враг высадился, сбросьте их солдат в море!"
 generic.26.a: "Перейти к региону"
 generic.26.b: "Понятно"
 generic.26.c: "Больше не уведомлять"
  
 afo_event.1.t: "Добро пожаловать в World Ablaze"
 afo_event.1.d: "World Ablaze — это исторический мод глобальной переработки, который меняет почти всю игровую механику, расширяет ее и добавляет более сильный ИИ. §RЭтот мод предназначен для запуска без других модов. Только косметические, музыкальные и официальные субмоды будут работать правильно, если они включены вместе с World Ablaze. §! Большинство изменений легко заметить с первого взгляда, например, деревья фокусов. Но если вы не знакомы с модом, ниже вы можете найти несколько опций, которые помогут прояснить некоторые из скрытых изменений в игре. \n\n Скорость игры была изменена по сравнению с ванильной: скорость 4 значительно выше, чем ванильная скорость 4, скорость 3 немного быстрее, чем ванильная скорость 3, скорость 2 равна ванильной скорости 3, а скорость 1 равна ванильной скорости 2.\n\n §RМы рекомендуем не использовать опцию сохранения в облаке Steam, поскольку известно, что она приводит к повреждению файлов сохранения. Делайте это на свой страх и риск. §! \n\nЕсли вы заинтересованы в участии в сообществе World Ablaze, есть ссылка на наш дискорд, где я рекомендую всем оставлять свои отзывы и предложения или общаться с другими игроками WA. Ссылку можно найти в главном меню или в описании мода Steam.\n\nПриятной игры!"
 afo_event.1.a: "Изменения в экономике"
 afo_event.1.b: "Изменения в деревьях технологий"
 afo_event.1.c: "Изменения в боёвке"
 afo_event.1.e: "Я готов играть"
  
 afo_event.2.t: "Изменения в экономике"
 afo_event.2.d: "Экономическая усталость — это новая система в World Ablaze, которая отражает инфляцию, большие государственные расходы и сокращение гражданской экономики. Экономические, трудовые и торговые законы теперь постепенно приводят к экономической усталости, которая снижает скорость строительства и увеличивает ожидаемое количество фабрик, перенаправленных на товары народного потребления, а в конечном итоге также снижает стабильность и добычу ресурсов. На более высоких уровнях они также налагают еженедельный штраф на поддержку войны, что напрямую влияет на боевые действия. \n\nЭкономическая усталость — естественное явление при милитаризации экономики, но всегда следует стараться держать ее на как можно более низком уровне. Ниже приведены основные способы снижения экономической усталости:\n\nФокусы\nВоенные облигации (доступны во время войны) \nРешения, такие как эксплуатация завоеванных стран, являются наиболее эффективным способом снижения усталости, но большинство из них доступны только во время войны. \nСнижение законов (только в крайнем случае, если усталость близка к 100%) \n\nПри частичной мобилизации ваша усталость вырастет с 0% до 100% за 24 года, при военной экономике — примерно за 10 лет, а при всеобщей мобилизации — примерно за 6 лет. Имейте в виду, что фокусы, закрытая экономика и более строгие законы о призыве на военную службу также могут увеличить усталость, постарайтесь избежать 100%, так как ваша страна рухнет."
 afo_event.2.a: "Назад"
 afo_event.2.b: "Изменения в промышленности"
 afo_event.2.c: "Изменения в политике"
 afo_event.2.e: "Я готов играть сейчас"
  
 afo_event.3.t: "Изменения в деревьях технологий"
 afo_event.3.d: "Каждая крупная держава имеет уникальные технологические древа танков, авиации, флота и артиллерии с историческими ТТХ вооружения. Второстепенные страны, которые имеют общие деревья авиации и артиллерии, имеют худшие ТТХ, нежели крупные страны. Второстепенные страны также больше не начинают с общего дерева танков и полагаются на крупные державы в вопросах танков посредством решений.\n\nНекоторые танки имеют несколько вариантов в дереве технологий, например Panzer IV. Переключение производства между этими вариантами приведет к очень небольшой потере эффективности производства.\n\nКорабли открываются с уже установленными историческими модулями, что оставляет мало возможностей для перевооружения до тех пор, пока не будут исследованы более поздние технологии. Они также разделены на исторические архетипы. Новые дополнения специализируются на следующем: фрегаты очень эффективны против подводных лодок, тяжелые крейсеры эффективны против легких кораблей, а легкие авианосцы являются более дешевыми версиями авианосцев."
 afo_event.3.a: "Назад"
 afo_event.3.b: "Я готов играть сейчас"
  
 afo_event.4.t: "Изменения в боёвке"
 afo_event.4.d: "Ширина фронта на равнинах изменена на 90, так что идеальная дивизия имеет ширину 30. На пересеченной местности, такой как горы и джунгли, используется ширина фронта 20. Погодные условия и местность гораздо более суровые. Восстановление организации занимает больше времени и зависит от инфраструктуры, а запасов снабжения хватает на 10 дней вместо 3. Добавлены новые юниты, описания уникальных из них можно найти ниже.\n\nБронеавтомобили делятся на боевые и разведывательные. Боевые автомобили, как правило, имеют вооружение, равное вооружению легких танков, но стоят дешевле и менее прочные. Разведывательные машины обеспечивают организацию и могут использоваться для разведки. Они также колесные, что дает им иные модификаторы местности. \n\nШтурмовые орудия. У них гораздо больше брони, чем у САУ, но меньше прорыв и защита, зато выше атака укреплений и в городе. Они также действуют на передовой, что делает их гораздо более уязвимыми, чем САУ. Из-за дополнительной брони они и стоят дороже. \n\nУсиленные юниты. В настоящее время полевые орудия и пехота имеют усиленные/тяжелые варианты. Эти юниты намного лучше своих обычных аналогов, но стоят дороже, медленнее и требуют большего количества снабжения. \n\nПрочее. Существует жесткий лимит в 10 авианосцев на сражение. «Стаки смерти» были сильно ослаблены, так что теперь идеальный размер флота составляет 60. Количество кораблей охранения, необходимых на один крупный корабль, теперь составляет 4 вместо 3. Полностью прикрытый флот будет иметь 10 авианосцев или легких авианосцев, 6 крупных кораблей, состоящих из тяжелых крейсеров, линкоров или линейных крейсеров, и 48 кораблей охранения, состоящих из легких крейсеров или эсминцев. Для кораблей, имеющих на 40% больше бронепробиваемости, чем броня противника, это означает двойной урон. Для танков вам нужно на 25% больше бронепробиваемости, чем броня противника, чтобы нанести полный урон, а бронепробиваемость менее 75% означает половину урона."
 afo_event.4.a: "Назад"
 afo_event.4.b: "Я готов играть сейчас"
  
 afo_event.5.t: "Изменения в промышленности"
 afo_event.5.d: "Производительность военных заводов и фабрик сократилась вдвое, но взамен вы получаете вдвое больше таких заводов и фабрик (для большинства стран). Рост эффективности производства значительно замедлился, что ставит перед очень важным выбором между продолжением производства больших объемов старого оборудования и переходом на новейшую модель. Верфям и военным заводам требуется уголь, а гражданским фабрикам — 1 единица стали.\n\nВ связи с этим максимальное количество ячеек для строительства каждого нового здания составляет 20.\n\nТакже были добавлены новые ресурсы, в том числе бокситы, уголь и железо. Эти ресурсы сопровождаются 4 новыми зданиями.\n\nАлюминиевые заводы используют бокситы и уголь для производства алюминия.\n\nГидроэлектрические алюминиевые/сталелитейные заводы дороже, но не используют уголь.\n\nСталелитейные заводы используют железо и уголь для производства стали.\n\nЗаводы синтетического топлива потребляют большое количество угля для производства синтетической нефти.\n\nИнфраструктура также больше не увеличивает количество стали и алюминия, которые вы получаете в регионе, поскольку они поступают только с этих заводов.\n\n"
 afo_event.5.a: "Назад"
 afo_event.5.b: "Я готов играть сейчас"
  
 afo_event.6.t: "Изменения в политике"
 afo_event.6.d: "В раздел «Политика» добавлена вкладка «Министерства».\n\nСреди новых дополнений:\nМинистерство культуры, которое занимается вопросами положения женщин в обществе. Оно начинает свою работу с более ориентированных на домашний уклад ролей, которые дают вам более высокий прирост населения, но вы можете изменить это за значительную цену или с помощью фокусов, чтобы получить больше бонусов для вашей промышленности и армии. Например, более высокий уровень призывного населения и/или объема заводского производства.\n\nМинистерство обороны сосредоточено на военных облигациях. Вы используете их для снижения экономической усталости. Однако они доступны только во время войны и требуют погашения после ее окончания.\n\nМинистерство пропаганды сосредоточено на поддержке войны. Поскольку высокоуровневые экономические законы и законы о призыве еженедельно снижают поддержку войны, это министерство служит противовесом. Каждый уровень обеспечивает 0.2% еженедельной поддержки войны и требует 0.02 политической власти в день.\n\nМинистерство труда сосредоточено на предоставлении различных бонусов, таких как стабильность в обмен на часть товаров народного потребления или небольшое увеличение призывного населения в обмен на политическую власть.\n\nМинистерство бизнеса по сути является вашей экономической идеологией и тесно связано с вашей политической идеологией. Например, фашисты не могут полностью приватизировать, а демократии не могут следовать идеям национал-социализма. Каждая экономическая идеология предоставляет различные бонусы и штрафы, которые варьируются от увеличения/уменьшения стабильности, увеличения/уменьшения ожидаемого количества фабрик, скорости строительства, скорости исследования, защиты от смены идеологии и так далее.\n\nНаконец, мы превратили политических советников в полноценную систему кабинета министров."
 afo_event.6.a: "Назад"
 afo_event.6.b: "Я готов играть сейчас"
  
 afo_event.14.t: "Добро пожаловать в АФО"
 afo_event.14.d: "AFO — это полностью переработанный мод, который меняет практически всю игровую механику и расширяет ее. Его изменения включают только деревья технологий и небольшие улучшения ИИ. Если вы не знакомы с модом, вы можете найти несколько опций ниже, которые помогут прояснить некоторые из скрытых изменений в игре. \n\nЕсли вы заинтересованы в участии в AFO, есть ссылка на наш дискорд, где я рекомендую всем оставлять свои отзывы и предложения или общаться с другими игроками AFO. У мода также есть версия глобальной переработки под названием World Ablaze, в которую мы добавляем новые функции, такие как деревья фокусов, и стремимся сделать игру более исторической. Ссылки на оба мода можно найти в описании мода в Steam.\n\nПриятной игры!"
 afo_event.14.a: "Изменения в экономике"
 afo_event.14.b: "Изменения в дереве технологий"
 afo_event.14.c: "Изменения в бою"
 afo_event.14.e: "Я готов играть"
  
 afo_event.16.t: "Изменения в дереве технологий"
 afo_event.16.d: "У каждой крупной нации есть уникальные деревья технологий танков, авиации, флота, артиллерии и пехоты с историческими характеристиками техники. Малые нации, у которых есть общие деревья технологий, имеют худшие характеристики, чем крупные. Однако малые нации могут использовать решения для принятия веток технологий крупной нации, либо вступив с ней в союз, либо завоевав ее.\n\nНекоторое оборудование имеет несколько вариантов в дереве технологий, например Panzer IV. Переключение производства между этими вариантами приведет к очень незначительной потере эффективности.\n\nНе каждое обновление лучше предыдущего, но почти всегда дает преимущества в некоторых областях.\n\nВоенные корабли разблокируются с уже установленными историческими модулями, так что переоснащать и исследовать остается немного. Они также были разделены на исторические архетипы. Новые дополнения специализируются на следующем: фрегаты очень эффективны против подводных лодок, тяжелые крейсеры эффективны против легких кораблей, а легкие авианосцы являются более дешевыми версиями авианосцев."
 afo_event.16.a: "Назад"
 afo_event.16.b: "Я готов играть сейчас"
  
 afo_event.17.t: "Изменения в бою"
 afo_event.17.d: "Боевая ширина изменена со 100 на 90, поэтому идеальная дивизия имеет боевую ширину 30. Были добавлены новые юниты, описания уникальных можно найти ниже.\n\nБронемашины, они разделены на боевые и разведывательные. Боевые машины обычно имеют такое же вооружение, как и легкие танки, но дешевле и менее долговечны. Машины разведки обеспечивают организацию и могут использоваться в качестве разведки. Они также колесные, что дает им различные модификаторы местности.\n\nШтурмовые орудия, у них гораздо больше брони и мягкой атаки, чем у САУ, но у них меньше прорыва и защиты. Они также служат на передовой, что делает их намного более уязвимыми, чем САУ. Из-за дополнительной брони они и стоят дороже. \n\nТяжелые юниты. В настоящее время полевые орудия и пехота имеют тяжелые варианты. Это гораздо лучшие юниты, чем их обычные аналоги, но они стоят дороже, медленнее и требуют больше припасов.\n\nШтурмовики и многоцелевые самолеты, подобно своим собратьям-истребителям, специализируются на обеспечении наземной поддержки в дополнение к существующим миссиям, но обычно за счет дальности действия.\n\nРазное, лимит авианосцев теперь равен 12 вместо 4. Для улучшения эффективности морского вторжения существуют десантные механизированные подразделения. Легкие танки также можно использовать для разведки."
 afo_event.17.a: "Назад"
 afo_event.17.b: "Я готов играть сейчас"
  
 afo_event.19.t: "Пасхалки World Ablaze"
 afo_event.19.d: "Вы включили пасхалки World Ablaze! Развлекайтесь с небольшими забавными деталями, которые добавила команда World Ablaze. Приятной игры!"
 afo_event.19.a: "Круто!"

 afo_event.20.t: "Пасхальные яйца World Ablaze"
 afo_event.20.desc: "Вы включили пасхальные яйца World Ablaze! Наслаждайтесь небольшими дополнениями, которые мы добавили от имени команды World Ablaze. Приятного просмотра!"
 afo_event.20.a: "Круто!"
 afo_event.20.b: "Круто!"
 afo_event.20.c: "Круто!"
 afo_event.20.d: "Круто!"

 afo_event.21.t: "Неудачный ядерный налет"
 afo_event.21.d: "Недавно сброшенная атомная бомба не сработала должным образом и упала на землю, не взорвавшись. Вероятно, это произошло из-за решений, принятых в процессе разработки бомбы. Это не только полный глобальный конфуз, но и национальное унижение, если учесть время, усилия и средства, затраченные на разработку бомбы. Мы передали врагу готовый прототип, который просто не сработал. Хотя мы решили эту проблему, чтобы она не повторилась в будущем, ущерб уже нанесен."
 afo_event.21.a: "Может быть, нам следовало быть более осторожными..."

 afo_event.22.t: "Неудачный ядерный налет"
 afo_event.22.d: "Атомная бомба, сброшенная на нас недавно, не сработала должным образом и упала на землю, не взорвавшись. Вероятно, это произошло из-за решений, принятых при разработке бомбы. Это не только полный глобальный позор для них, но и национальное разочарование, если учесть время, усилия и средства, затраченные на разработку бомбы. Нам передали полностью готовый прототип, который просто не сработал. Мы сможем использовать это в своих интересах."
 afo_event.22.a: "Приятно, но их следующая бомба не подведет"

 afo_event.23.t: "[GetWarBonds] завершены"
 afo_event.23.desc: "Выпуск [GetWarBonds] завершён. Теперь у нас есть возможность немедленно выпустить [GetNextWarBonds]. Кроме того, мы можем выбрать автоматический выпуск следующего набора облигаций каждый раз, когда заканчивается выпуск серии."
 afo_event.23.a: "Выпустить [GetNextWarBonds]"
 afo_event.23.a_tt: "Это событие §Oпоявится снова§!, когда завершится §Y«[GetNextWarBonds]»§!, если доступна следующая серия военных облигаций, а страна всё ещё испытывает §Yэкономическую усталость§!."
 afo_event.23.b: "Автоматически выпускать все будущие облигации"
 afo_event.23.b_tt: "Когда завершится каждая будущая §Yсерия военных облигаций§!, следующая серия будет §Gвыбрана автоматически§!, если она доступна, а страна всё ещё испытывает §Yэкономическую усталость§!.\nЭто событие §Rбольше никогда не появится§!."
 afo_event.23.c: "Отложить на потом"
 afo_event.23.c_tt: "Это событие §Oпоявится снова§! после того, как следующая серия будет выбрана вручную и завершена."
 afo_event.23.d: "Больше не напоминать"
 afo_event.23.d_tt: "Это событие §Rбольше никогда не появится§!."
