 JAP_neutrality_party: "Кодоха"
 JAP_neutrality_party_long: "Фракция императорского пути (Кодоха)\n§gКодоха — фракция или политическое крыло Императорской армии Японии, действует с 1920-х годов и представляет собой группу офицеров-националистов, выступающих за формирование военного правительства, поддержку тоталитарной и милитаристской идеологий, а также усиление экспансионизма Японии. Во многом группировку поддерживают младшие офицеры. «Кодоха», будучи политическим течением, не была представлена никакой политической партией и не имеет официального статуса в императорской армии, однако её идеология и сторонники оказали влияние на японский милитаризм в конце 1930-х годов.§!"
 JAP_neutrality_party_kodoha_long: "Фракция императорского пути (Кодоха)\n§gКодоха — фракция или политическое крыло Императорской армии Японии, действует с 1920-х годов и представляет собой группу офицеров-националистов, выступающих за формирование военного правительства, поддержку тоталитарной и милитаристской идеологий, а также усиление экспансионизма Японии. Во многом группировку поддерживают младшие офицеры. «Кодоха», будучи политическим течением, не была представлена никакой политической партией и не имеет официального статуса в императорской армии, однако её идеология и сторонники оказали влияние на японский милитаризм в конце 1930-х годов.§!"
