 SOV_communism_party_long: "Всесоюзная коммунистическая партия (большевиков)\n§gВКП(б), или Всесоюзная коммунистическая партия (большевиков) — официальное название КПСС, начиная с 1925 года. В том же году XIV съезд провозгласил курс на построение социализма в стране, что потребовало разработать новую программу партии. В связи с объединением советских республик в Союз ССР, РКП(б) была переименована во Всесоюзную Коммунистическую партию (большевиков) — ВКП(б), включавшую КП(б) Украины, КП(б) Белоруссии и партийные организации ЗСФСР. Устав новой партии существенно отличался от устава РКП(б). В структуре партии произошли изменения: численность членов Центрального Комитета ВКП(б) была увеличена, а сам ЦК стал играть роль «внутрипартийного парламента». Съезды ВКП(б) предполагалось созывать раз в 5 лет; роль исполнительного органа партии перешла к Секретариату ЦК ВКП(б).§!"
