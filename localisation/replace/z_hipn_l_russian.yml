l_russian:
 HPC_neutrality_party: "Варлордизм"
 HPC_neutrality_party_long: "Варлордизм\n§gВарлордизм это не единая идеология вне зависимости от его описаний. Вместо этого он описывает разнообразный, непоследовательный, дезорганизованный и милитаристский характер различных клик военачальников по всему миру и был назван в честь периода военачальников в Китае, когда этот термин стал популярным в современном контексте. Начиная от бандитских группировок с государством и заканчивая организованными военными стратократиями и даже поддерживаемыми военными республиканскими правительствами или чистыми диктатурами, варлордизм имеет мало общего с политикой и больше связан с отсутствием чётких границ и вездесущим и часто хаотичным характером войны. Варлордизм часто является переходным состоянием и лишь ступенькой на пути к более чётко определённой политической системе.§!"
