 POL_neutrality_party_long: "Санация\n§gСанация — обиходное наименование политического движения, возникшего в связи с провозглашением Юзефом Пилсудским лозунга «моральной санации» общественной жизни в Польше, выдвинутого в ходе подготовки и во время майского переворота 1926 года.\nСанация установила авторитарное правление, начала борьбу с коммунизмом, провозгласила тезисы о кризисе демократии, необходимости крепкой власти и ликвидации оппозиционных партий. В целом режим носит правоцентристский, консервативно-патерналистский характер.§!"
