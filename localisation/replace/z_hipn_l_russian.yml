 JAP_fascism_party: "Тосэйха"
 JAP_fascism_party_long: "Фракция контроля (Тосэйха)\n§gТосэйха — фракция или политическое крыло Императорской армии Японии, которая действует с 1920-х годов и представляет собой группу умеренно настроенных военных офицеров, находящихся в оппозиции к радикальной ультранационалистической группировке «Кодоха», поддерживающей агрессивную имперскую политику и выступающей против идеалов модернизации.§!"
 JAP_PARTY_NAME_SHORT: "Ассоциация помощи трону"
 JAP_PARTY_NAME_LONG: "Ассоциация помощи трону\n§gАссоциация помощи трону — военная организация Японской Империи, созданная премьер-министром Коноэ Фумимаро 12 октября 1940 года для продвижения целей его движения Синтайсэй («Новый порядок»). Цель создания — «мобилизовать нацию вокруг монарха» в условиях войны.§!"
