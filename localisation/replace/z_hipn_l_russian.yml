 ENG_democratic_party_long: "Консервативная партия (Тори)\n§gКонсервативная партия Великобритании, неофициальное историческое название — Тори — правоцентристская политическая партия в Великобритании, объединяющая сторонников консерватизма и британского юнионизма. Консервативная партия основана в 1834 году и была одной из двух ведущих британских партий в XIX веке, вместе с Либеральной партией. В 1912 году изменила своё название на «Консервативная и юнионистская партия» после слияния с Либеральной юнионистской партией.§!"
