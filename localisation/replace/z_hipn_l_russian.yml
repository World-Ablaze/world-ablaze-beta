 USA_fascism_party_long: "Серебряный Легион Америки"
 USA_democratic_party_long: "Демократическая партия\n§gДемократическая партия — американская левоцентристская либеральная политическая партия, одна из двух крупнейших политических партий США наряду с Республиканской партией. Является самой старой партией в США. Начиная с 1930-х годов, партия занимает социально-либеральные, реформистские и прогрессивистские позиции, объединяя в своих рядах реформистов, прогрессивистов, либералов (в американском понимании) и центристов.§!"
 USA_republican_party_long: "Республиканская партия\nРеспубликанская партия — американская правоцентристская консервативная политическая партия, одна из двух крупнейших политических партий США наряду с Демократической партией. Была создана как объединение противников рабства и сторонников расширения компетенции власти центрального правительства"
