 GXC_democratic_party: "Гоминьдан (Ли)"
 GXC_democratic_party_long: "Гоминьдан - фракция Ли Цзунжэня\n§gЛи Цзунжэнь недолго властвовал в Северной экспедиции, в которой, отличилась Седьмая армия Национально-революционной армии. Новая клика Гуанси представляет правое милитаристское крыло Гоминьдана, верящее в превосходство НРА и важность Первого и Второго этапов революции Сунь Ятсена: свержение старой системы силой и временное правление армии в Китае.§!"
 GXC_neutrality_party: "Гоминьдан (Ли)"
 GXC_neutrality_party_long: "Гоминьдан - фракция Ли Цзунжэня\n§gЛи Цзунжэнь недолго властвовал в Северной экспедиции, в которой, отличилась Седьмая армия Национально-революционной армии. Новая клика Гуанси представляет правое милитаристское крыло Гоминьдана, верящее в превосходство НРА и важность Первого и Второго этапов революции Сунь Ятсена: свержение старой системы силой и временное правление армии в Китае.§!"
