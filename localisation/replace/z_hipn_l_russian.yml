 CHI_neutrality_party_long: "Гоминьдан — фракция Чан Кайши\n§gЧтобы обеспечить правильное применение доктрин Санмин (также известных как Три принципа народа), политическая опека служит переходной формой правления между военным и конституционным правлением.\n\nОна предписывает, что Националистическая партия, или Гоминьдан, должна направлять нацию, чтобы правильно организовать и установить необходимые государственные институты в соответствии с Основами национального восстановления доктора Сунь Ятсена, отца-основателя Гоминьдана и Республики.§!"
