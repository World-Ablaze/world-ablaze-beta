 YUN_neutrality_party_long: "Гоминьдан - фракция Лун Юня\n§gЛун Юнь оказался единственным человеком, способным прекратить распри между различными фракциями Национальная армия умиротворения. Даже если для этого пришлось выступить против собственного брата, он предпринял необходимые меры, чтобы укрепить свою администрацию в Куньмине и удержать город. Теперь, когда пыль осела после этого периода короткой гражданской войны, предстоит выяснить, есть ли у этого молодого, амбициозного генерала И то, что нужно для восстановления Юньнани. Лун Юнь часто мечтал однажды превзойти Тан Цзяо, и теперь у него наконец-то появился шанс сделать это.§!"
