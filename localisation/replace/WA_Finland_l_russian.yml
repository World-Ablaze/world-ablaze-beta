 finland.10.t: "Мирные переговоры с [SOV.GetNameDef]"
 finland.10.d: "Наша вторая война с [SOV.GetAdjective]им режимом оказалась не такой успешной, как мы надеялись. В Москве назначена встреча, на которой нам будет предложена возможность заключить мир, но мы должны будем уступить любую завоеванную территорию и легализовать коммунизм в обмен на сохранение [Root.GetAdjective]ого суверенитета. \n\nФинские силы быстро истощаются, и мы больше не можем рассчитывать на помощь Германии. Возможно, это наша единственная надежда на мирное разрешение конфликта, однако нам придется провести демилитаризацию и выплатить военные репарации."
 finland.10.a_tt: "§YЕсли [SOV.GetName] принимает:\n§!"
 finland.10.a: "Эту войну не выиграть"
 finland.10.b: "Мы должны продолжать борьбу!"
  
 finland.11.t: "Финляндия просит мира"
 finland.11.d: "Война со странами Оси обошлась дорого, но, поскольку мы смогли отбросить их армию, нам было сделано убедительное предложение из Финляндии. Мы сохраняем контроль над своей территорией, завоеванной в ходе Зимней войны, а Финляндия выходит из Оси и остается нейтральной, взамен мы выведем наши войска и прекратим дальнейшие боевые действия.\nЭто завершит наше наступление на [From.GetNameDef] без полного контроля над регионом, но в свою очередь позволит нам сосредоточиться на войне против Германии."
 finland.11.a: "Это терпимые условия"
 finland.11.b: "Мы не можем простить [From.GetNameDef] агрессию"
  
 fin_armor.601.t: "[From.GetNameDefCap] создает «Северное сияние»"
 fin_armor.601.d: "После создания Скандинавского торгового блока Финляндия объявила о создании организации «Северное сияние» с целью обеспечения безопасности региона и сдерживания иностранной агрессии. Они утверждают, что без Северного единства мы станем жертвой иностранных держав, стремящихся к нашим ресурсам и стратегическому расположению. Теперь нам предоставлена возможность присоединиться к ним или остаться в одиночестве."
 fin_armor.601.a: "Вместе как один!"
 fin_armor.601.b: "Это только нарушит нейтралитет"
  
 fin_armor.602.t: "[From.GetNameDefCap] создает «Северное сияние»"
 fin_armor.602.d: "После создания Скандинавского торгового блока Финляндия объявила о создании организации «Северное сияние» с целью обеспечения безопасности региона и сдерживания иностранной агрессии. Они утверждают, что без Северного единства мы станем жертвой иностранных держав, стремящихся к нашим ресурсам и стратегическому расположению. Теперь нам предоставлена возможность присоединиться к ним или остаться в одиночестве."
 fin_armor.602.a: "Вместе как один!"
 fin_armor.602.b: "Это только нарушит нейтралитет"
  
 fin_armor.603.t: "[From.GetNameDefCap] создает «Северное сияние»"
 fin_armor.603.d: "После создания Скандинавского торгового блока Финляндия объявила о создании организации «Северное сияние» с целью обеспечения безопасности региона и сдерживания иностранной агрессии. Они утверждают, что без Северного единства мы станем жертвой иностранных держав, стремящихся к нашим ресурсам и стратегическому расположению. Теперь нам предоставлена возможность присоединиться к ним или остаться в одиночестве."
 fin_armor.603.a: "Вместе как один!"
 fin_armor.603.b: "Это только нарушит нейтралитет"
  
 fin_armor.604.t: "[From.GetNameDefCap] отказывается присоединиться"
 fin_armor.604.d: "В ответ на наше приглашение [From.GetNameDefCap] отклонил предложение присоединиться к «Северному сиянию» и будет придерживаться своего нейтралитета, полагая, что сохранение нейтралитета убережет их от любой агрессии. Насколько ошибочным может быть такое мышление..."
 fin_armor.604.a: "Им же хуже"
  
 fin_armor.605.t: "[From.GetNameDefCap] предлагает сформировать Скандинавский торговый блок"
 fin_armor.605.d: "[From.GetNameDefCap] предлагает, ссылаясь на наши скандинавские связи, сформировать уникальный торговый блок, чтобы мы могли помогать друг другу развивать нашу экономику и становиться сильнее."
 fin_armor.605.a: "Это звучит как отличная идея"
 fin_armor.605.b: "У нас есть более выгодные торговые партнеры"
  
 fin_armor.606.t: "[From.GetNameDefCap] предлагает сформировать Скандинавский торговый блок"
 fin_armor.606.d: "[From.GetNameDefCap] предлагает, ссылаясь на наши скандинавские связи, сформировать уникальный торговый блок, чтобы мы могли помогать друг другу развивать нашу экономику и становиться сильнее."
 fin_armor.606.a: "Это звучит как отличная идея"
 fin_armor.606.b: "У нас есть лучшие страны для торговли"
  
 fin_armor.607.t: "[From.GetNameDefCap] предлагает сформировать Скандинавский торговый блок"
 fin_armor.607.d: "[From.GetNameDefCap] ссылается на наши скандинавские связи, чтобы сформировать уникальный торговый блок, чтобы мы могли помогать друг другу развивать нашу экономику и становиться сильнее."
 fin_armor.607.a: "Это звучит как отличная идея"
 fin_armor.607.b: "У нас есть лучшие страны для торговли"
  
 fin_armor.608.t: "[From.GetNameDefCap] Отказывается от создания торгового блока"
 fin_armor.608.d: "Следуя нашему предложению, [From.GetNameDefCap] отверг идею скандинавского торгового блока, сославшись на то, что есть лучшие торговые партнеры..."
 fin_armor.608.a: "Это их потеря"
  
 fin_armor.609.t: "[From.GetNameDefCap] Соглашается создать торговый блок"
 fin_armor.609.d: "Следуя нашему предложению, [From.GetNameDefCap] принял идею скандинавского торгового блока, это, несомненно, позволит нам помогать друг другу развивать нашу экономику."
 fin_armor.609.a: "Отлично"
  
 fin_armor.610.t: "[From.GetNameDefCap] предлагает уступить Аландские острова"
 fin_armor.610.d: "Стремясь улучшить отношения между нашими странами, Финляндия предложила поставить точку в Аландском вопросе и уступить нам острова. Для нас это отличный результат"
 fin_armor.610.a: "Это отличная новость"
  
 fin_armor.701.t: "[From.GetNameDefCap] предоставляет оружие"
 fin_armor.701.d: "[From.GetNameDefCap] удалось переправить к нам некоторое количество пехотного снаряжения для помощи в защите от большевиков."
 fin_armor.701.a: "Это будет большим подспорьем"
  
 fin_armor.702.t: "[From.GetNameDefCap] предоставляет пулеметы"
 fin_armor.702.d: "[From.GetNameDefCap] удалось переправить к нам тяжелое пехотное снаряжение для помощи в защите от большевиков."
 fin_armor.702.a: "Это будет большим подспорьем"
  
 fin_armor.703.t: "[From.GetNameDefCap] предоставляет вспомогательное оборудование"
 fin_armor.703.d: "[From.GetNameDefCap] удалось доставить к нам некоторое вспомогательное оборудование для помощи в нашей защите от большевиков."
 fin_armor.703.a: "Это будет большим подспорьем"
  
 fin_armor.704.t: "[From.GetNameDefCap] предоставляет истребители"
 fin_armor.704.d: "[From.GetNameDefCap] доставил нам несколько истребителей «Гладиатор», чтобы мы могли использовать их для защиты от большевиков."
 fin_armor.704.a: "Это будет большим подспорьем"
  
 fin_armor.705.t: "[From.GetNameDefCap] предоставляет бомбардировщики"
 fin_armor.705.d: "[From.GetNameDefCap] доставил нам несколько бомбардировщиков «Бленхейм», чтобы мы могли использовать их для защиты от большевиков."
 fin_armor.705.a: "Это будет большим подспорьем"
  
 fin_armor.706.t: "[From.GetNameDefCap] Предоставляет оружие"
 fin_armor.706.d: "[From.GetNameDefCap] сумел доставить к нам некоторое пехотное снаряжение для помощи в нашей защите от большевиков."
 fin_armor.706.a: "Это будет большим подспорьем"
  
 fin_armor.707.t: "[From.GetNameDefCap] Предоставляет пулеметы"
 fin_armor.707.d: "[From.GetNameDefCap] сумел переправить к нам тяжелое пехотное снаряжение для помощи в нашей защите от большевиков."
 fin_armor.707.a: "Это будет большим подспорьем"
  
 fin_armor.708.t: "[From.GetNameDefCap] Предоставляет вспомогательное оборудование"
 fin_armor.708.d: "[From.GetNameDefCap] удалось доставить к нам некоторое вспомогательное оборудование для помощи в нашей защите от большевиков."
 fin_armor.708.a: "Это будет большим подспорьем"
  
 fin_armor.709.t: "[From.GetNameDefCap] предоставляет истребители"
 fin_armor.709.d: "[From.GetNameDefCap] доставил нам несколько истребителей BF 109, чтобы мы могли использовать их для защиты от большевиков."
 fin_armor.709.a: "Это будет большим подспорьем"
  
 fin_armor.710.t: "[From.GetNameDefCap] Предоставляет бомбардировщики"
 fin_armor.710.d: "[From.GetNameDefCap] доставил нам несколько бомбардировщиков «Хейнкель», чтобы мы могли использовать их для защиты от большевиков."
 fin_armor.710.a: "Это будет большим подспорьем"
  
 fin_armor.720.t: "Финляндия обращается за помощью"
 fin_armor.720.d: "Поскольку Финляндия находится под прямой угрозой советской агрессии, американцы возмущены, и бывший президент Герберт Гувер предложил создать Финский фонд помощи для помощи финским гражданским лицам и беженцам. Нам только нужно одобрить эту помощь"
 fin_armor.720.a: "Все, что поможет финнам в тяжелом положении"
 fin_armor.720.b: "Мы не должны вмешиваться"
  
 fin_armor.721.t: "[From.GetNameDefCap] предоставляет экономическую помощь"
 fin_armor.721.d: "Герберт Гувер из [From.GetNameDefCap] поддержал наше дело и создал Финский фонд помощи. С его помощью мы можем помочь сохранить нашу экономику здоровой и способной поддержать перемещение наших людей."
 fin_armor.721.a: "Мы приветствуем их помощь"
  
 fin_armor.722.t: "Финляндия обращается за помощью"
 fin_armor.722.d: "Поскольку Финляндия находится под прямой угрозой советской агрессии, у нас есть возможность нанести косвенный удар по Советам, предоставив финнам оружие. Мы надеемся, что благодаря этому мы продлим войну и сделаем Советский Союз более слабым."
 fin_armor.722.a: "Мы должны помочь"
 fin_armor.722.b: "Мы не должны вмешиваться"
  
 fin_armor.723.t: "[From.GetNameDefCap] Предоставляет оружие"
 fin_armor.723.d: "[From.GetNameDefCap] сумел доставить к нам некоторое пехотное снаряжение для помощи в нашей защите от большевиков."
 fin_armor.723.a: "Мы приветствуем их помощь"
  
 fin_armor.724.t: "Финляндия обращается за помощью"
 fin_armor.724.d: "Поскольку Финляндия находится под прямой угрозой советской агрессии, многие официальные лица и люди сочувствуют финскому делу, и почти 25 000 добровольцев подписались. Кроме того, поступило много пожертвований на помощь финским беженцам и гражданским лицам. Если мы захотим, мы можем организовать эту помощь, чтобы помочь финскому народу в его тяжелом положении."
 fin_armor.724.a: "Мы должны приложить усилия, чтобы помочь"
 fin_armor.724.b: "Мы не должны вмешиваться"
  
 fin_armor.725.t: "[From.GetNameDefCap] присылает нам людей и экономическую помощь"
 fin_armor.725.d: "\nМногие чиновники и люди из [From.GetNameDefCap] сочувствуют нашему делу и организовали группу добровольцев и некоторые денежные фонды, чтобы помочь нам в нашей борьбе с большевиками."
 fin_armor.725.a: "Мы приветствуем их помощь"
  
 fin_armor.726.t: "[From.GetNameDefCap] просит продать танки"
 fin_armor.726.d: "Осознав свою стратегическую слабость, [FIN.GetAdjective]ая армия инициировала срочную программу модернизации и расширения своих сил. На покрытие закупок были выделены значительные денежные резервы. К нам выехала комиссия за новыми источниками танков.\n\nУчитывая остроту вопроса, [FIN.GetAdjective]ие дипломаты настояли на немедленной поставке или передаче самолетов непосредственно от производителя."
 fin_armor.726.a: "Одобрить продажу легких танков из наших резервов."
 fin_armor.726.b: "Перенаправить производство легких танков на выполнение их заказа."
 fin_armor.726.c: "Мы ничего не можем выделить."
  
 fin_armor.727.t: "[From.GetNameDefCap] одобряет продажу танков"
 fin_armor.727.d: ""
 fin_armor.727.a: "Отлично"
  
 fin_armor.728.t: "[From.GetNameDefCap] одобряет продажу танков"
 fin_armor.728.d: ""
 fin_armor.728.a: "Отлично"
  
 fin_armor.729.t: "[From.GetNameDefCap] отказывает в продаже танков"
 fin_armor.729.d: ""
 fin_armor.729.a: "Жаль"
  
 fin_armor.730.t: "[From.GetNameDefCap] просит продать самолеты"
 fin_armor.730.d: "Осознав стратегическую слабость, [FIN.GetAdjective]ие ВВС инициировали срочную программу модернизации и расширения своих сил. На покрытие закупок были выделены значительные денежные резервы. К нам выехала комиссия за новыми источниками истребителей.\n\nУчитывая остроту вопроса, [FIN.GetAdjective]ие дипломаты настояли на немедленной поставке или передаче самолетов непосредственно от производителя."
 fin_armor.730.a: "Одобрить продажу истребителей из наших резервов."
 fin_armor.730.b: "Перенаправить производство истребителей на выполнение их заказа."
 fin_armor.730.c: "Мы ничего не можем выделить."
  
 fin_armor.731.t: "[From.GetNameDefCap] одобряет продажу истребителей"
 fin_armor.731.d: ""
 fin_armor.731.a: "Отлично"
  
 fin_armor.732.t: "[From.GetNameDefCap] одобряет продажу истребителей"
 fin_armor.732.d: ""
 fin_armor.732.a: "Отлично"
  
 fin_armor.733.t: "[From.GetNameDefCap] отказывает в продаже истребителей"
 fin_armor.733.d: ""
 fin_armor.733.a: "Жаль"
  
 fin_armor.801.t: "Кюёсти Каллио скончался"
 fin_armor.801.d: "После своей отставки Кюёсти, к сожалению, скончался по пути на свою ферму, где собирался провести остаток жизни на покое. Пока страна оплакивает его кончину, мы должны назначить его преемника на посту"
 fin_armor.801.a: "Покойся с миром"
  
 fin_armor.802.t: "Финляндия предлагает мир"
 fin_armor.802.d: "После падения Ленинграда нельзя отрицать, что мы проигрываем Зимнюю войну. Было бы разумно закончить войну здесь и задуматься о том, как мы облажались."
 fin_armor.802.a: "Мы не в том положении, чтобы отказываться"
  
 fin_armor.803.t: "СКП ищет альянс"
 fin_armor.803.d: "Недавно созданная Финская Демократическая партия обратилась к нам с предложением о союзе. Они сообщили нам о намерении разжечь гражданскую войну и просят нашего прямого вмешательства. Поскольку Финляндия находится в нашей сфере влияния, нам не придется беспокоиться о внешнем вмешательстве, если мы согласимся, однако это повысит мировую напряженность. Более того, как только гражданская война закончится, не будет никакой оппозиции, если мы решим превратить Финляндию в наше марионеточное государство."
 fin_armor.803.a: "Начать подготовку к этому альянсу"
 fin_armor.803.b: "Присоединение приведет только к международному осуждению"
  
 fin_armor.804.t: "[From.GetNameDefCap] принимает сделку"
 fin_armor.804.d: "[From.GetNameDefCap] согласился непосредственно вмешаться, как только мы восстанем против белогвардейцев. Это, несомненно, будет означать, что мы добьемся успеха, однако мы должны признать, что ничто не помешает Советам остаться в нашей стране после окончания войны..."
 fin_armor.804.a: "Это опасная сделка"
  
 fin_armor.805.t: "[From.GetNameDefCap] отклоняет сделку"
 fin_armor.805.d: "[From.GetNameDefCap] решил отклонить наше предложение союза, заявив, что он не стремится увеличивать мировую напряженность и вмешиваться в наши дела. Сейчас у нас нет другого выбора, кроме как искать поддержки на местах."
 fin_armor.805.a: "Возможно, это к лучшему"
  
 fin_armor.806.t: "Коммунисты маршируют к столице"
 fin_armor.806.d: "При поддержке, которую мы собрали, наши члены прошли маршем в столицу, требуя смены правительства. Как и ожидалось, наши требования были встречены враждебно, и нам ничего не оставалось, как захватить столицу силой. Наши сторонники захватили правительственные здания и армейские склады и подготовились к гражданской войне."
 fin_armor.806.a: "За нашу Родину!"
  
 fin_armor.807.t: "Конец гражданской войны"
 fin_armor.807.d: "После долгой борьбы мы одерживаем победу над Белой гвардией. Многие из наших врагов побеждены или скрылись, теперь нам предстоит написать новую конституцию и превратить нашу страну в грозную нацию, работающую на благо народа."
 fin_armor.807.a: "Время восстанавливать"
 fin_armor.807.b: "Время восстанавливать"
  
 fin_armor.808.t: "Конец гражданской войны"
 fin_armor.808.d: "После долгой борьбы мы одерживаем победу над Белой гвардией. Многие из наших врагов побеждены или скрылись. Теперь нам предстоит написать новую конституцию, восстановить нашу страну с помощью наших советских товарищей и превратить Финляндию в грозную страну, работающую на благо народа. К сожалению, Советский Союз воспользовался возможностью захватить контроль над нашим новым правительством и разместил войска в стратегических точках. Теперь нам предъявлен ультиматум: отказаться от нашей автономии или противостоять Советам..."
 fin_armor.808.a: "Мы будем бороться за нашу свободу!"
 fin_armor.808.b: "Нет выбора"
  
 fin_armor.810.t: "Возвращение финского короля"
 fin_armor.810.d: "После 10 недель дебатов парламент наконец решил призвать короля Фридриха Карла Гессенского из его дома в Касселе. Он доказал, что твердая рука может сделать нацию успешной, а также стал одним из основателей Финляндии после большевистской революции в России. С неохотой он согласился вернуться и стать главой государства, ознаменовав конец республики и начало Королевства Финляндия."
 fin_armor.810.a: "Во славу Финляндии!"
  
 fin_armor.811.t: "Назначить нового преемника"
 fin_armor.811.d: "Поскольку здоровье нашего короля Фридриха Карла медленно ухудшалось, он решил выбрать наследника до своей смерти. \n\nПринц Ландграф, старший из наследников, выбранных Фридрихом, выразил желание сотрудничать с немцами, вплоть до вступления в НСДАП, живя в Германии. Его брат принц Вольфганг, с другой стороны, выступает против таких идей и, уважая место, которое немцы занимают в истории Финляндии, включая его собственное происхождение, предпочитает национальный суверенитет сильному военному союзу.\n\nОднако два принца, часто конфликтующие друг с другом, заявили в интервью, что решение Фридриха является окончательным, и они будут уважать волю своего отца независимо от того, кого он выберет."
 fin_armor.811.a: "Назначить принца Вольфганга"
 fin_armor.811.b: "Назначить принца Филиппа"
  
 fin_armor.812.t: "Фридрих Карл умирает"
 fin_armor.812.d: "Фридрих Карл был найден мертвым в своем доме, смерть наступила по естественным причинам. После смерти короля его сын стал лидером народа Финляндии. Отношения между принцем Вольфгангом и принцем Филиппом остаются крепкими, поскольку они оплакивают смерть своего отца, и раскола не предвидится."
 fin_armor.812.a: "Принц Вольфганг становится королем"
 fin_armor.812.b: "Принц Филипп становится королем"
  
 fin_armor.813.t: "Фридрих Карл умирает"
 fin_armor.813.d: "Фридрих Карл был найден мертвым в своем доме, смерть наступила по естественным причинам. К сожалению, ему не удалось выбрать преемника, и линия преемственности неясна, поскольку вспыхнуло много беспорядков по поводу того, кто должен возглавить страну следующим. Два его сына, которые считаются кандидатами на престол, решили оставить выбор на усмотрение народа, и оба заявили, что будут уважать любой результат."
 fin_armor.813.a: "Назначить принца Вольфганга"
 fin_armor.813.b: "Назначить принца Филиппа"
  
 fin_armor.814.t: "Северная Финляндия просит присоединиться"
 fin_armor.814.d: "Северные финны хотят интегрироваться в Швецию после того, как по всей стране была проведена «радикальная политика» короля Филиппа. Они предпочитают отделиться и искать нашей защиты, чтобы избежать потенциальной гражданской войны, но принятие их может привести к еще большей войне..."
 fin_armor.814.a: "Мы с радостью примем"
 fin_armor.814.b: "Мы не хотим провоцировать Финляндию"
  
 fin_armor.815.t: "Северная Финляндия отделяется"
 fin_armor.815.d: "Вольфганг взял в руки оружие на севере Финляндии в ответ на якобы репрессивный режим, установленный ландграфом.\nВ заявлении, адресованном своему брату ландграфу, Вольфганг сказал: «Граждане Финляндии заслуживают самоопределения! Все иное позорно для моего отца и тем более для народа». После этого шведские вооруженные силы вошли в Северную Финляндию, поскольку Вольфганг пригласил их для защиты."
 fin_armor.815.a: "Мы должны немедленно нанести ответный удар!"
 fin_armor.815.b: "Мы ничего не можем сделать сейчас"
  
 fin_armor.816.t: "[FIN.GetName] заявляет о намерении аннексировать Скандинавию"
 fin_armor.816.d: "Новая финская монархия начала неожиданную кампанию по объединению всей Скандинавии с помощью силы, теперь нам остается выбор: серьезно отнестись к угрозе и объединить Скандинавию против них, или пока подождать и посмотреть, что произойдет."
 fin_armor.816.a: "Мы должны объединить Скандинавию против них"
 fin_armor.816.b: "Время — наше лучшее оружие сейчас"
  
 fin_armor.817.t: "[SWE.GetName] призывает к объединению"
 fin_armor.817.d: "Новая финская монархия начала неожиданную кампанию по объединению всей Скандинавии силой. Швеция ответила приглашением остальной части Скандинавии во фракцию, чтобы дать отпор любому, кто пожелает нам зла. Если мы присоединимся, мы свяжем свою судьбу со Швецией, но это, возможно, не так уж и плохо."
 fin_armor.817.a: "Мы принимаем их предложение"
 fin_armor.817.b: "Мы хотим оставаться нейтральными"
  
 fin_armor.818.t: "[FROM.GetName] Отвергает объединение"
 fin_armor.818.d: "Желая оставаться максимально нейтральными и не допускать потенциальной войны, [FROM.GetName] отверг объединение."
 fin_armor.818.a: "Их скоро втянут в войну"
  
 fin_armor.819.t: "Ваша новая империя?"
 fin_armor.819.d: "[SWE.GetName] отреагировал на наше изменение политики попыткой объединить всю Скандинавию, если мы предпримем действия против них, дураки думают, что это их спасет... они уже проиграли."
 fin_armor.819.a: "Финляндия – король Скандинавии"
  
 fin_monarchist_king: "Избрал Вольфганга следующим наследником престола."
 fin_fascist_king: "Избрал Филиппа следующим наследником престола."
  
 fcw_over: "Гражданская война в Финляндии окончена"
 
  