l_english:
 # First Soviet border conflict seen from Japan
 jap_khasan.1.t:0 "The Soviets Fortify the Far Eastern Border"
 jap_khasan.1.desc:0 "The Soviet Union has set about strengthening its Far Eastern forces and is building positions and barracks along the border of the Maritime Province. More sentries stand across the Tumen, and the Korea Army reports border crossings and skirmishes almost daily.\n\nThe hills along the border, Changkufeng among them, belong to no one for certain, and it is plain that the Soviets mean to take them first. The Korea Army asks that divisions be moved up to the border to secure North Hamgyong."
 jap_khasan.1.a:0 "Move the Korea Army to the border"
