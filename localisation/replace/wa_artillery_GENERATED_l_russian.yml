    fra_art_0: "Canon de 75 Modèle 1897"
    fra_art_0_short: "Canon de 75 Modèle 1897"
    fra_art_0_desc: "Несмотря на то, что «Soixante-Quinze» была первой современной артиллерийской установкой, к 1936 году она уже устарела, и ее спасало лишь большое количество запасных частей. \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    fra_art_1_desc: "После того как 75 Mle 1897 продемонстрировал ограниченную эффективность против вражеских окопов во время Первой мировой войны, французская армия заказала большое количество Mle 1913 Schneider, хотя и проявила к нему небольшой интерес из-за большого количества 75 Mle 1897, которые уже находились на вооружении. Несмотря на то, что к 1936 году он уже устарел, он превосходил «Soixante-Quinze» по всем параметрам, кроме стоимости. \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    fra_art_2: "Canon de 105 1936 Schneider"
    fra_art_2_short: "Canon de 105 1936 Schneider"
    fra_art_2_desc: "105 Schneider улучшает мягкую атаку и защиту за небольшое увеличение стоимости. \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    fra_art_3: "105mm DEFA"
    fra_art_3_short: "105mm DEFA"
    fra_art_3_desc: "Первое 105-мм орудие, разработанное после Второй мировой войны, mle 1950, созданное DEFA, стало значительным отходом от ранних французских разработок: оно имело двухколесную торсионную подвеску и треножный лафет с тремя станинами, что обеспечивало вращение на 360°. \n§RЭто совершенно новая модель, и она не сохранит эффективность§!"

    fra_art_4: "Obusier de 105"
