    eng_art_1: "QF 18 pounder"
    eng_art_1_short: "QF 18 pounder"
    eng_art_1_desc: " \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    eng_art_2: "QF 25-pounder Mk I"
    eng_art_2_short: "QF 25-pounder Mk I"
    eng_art_2_desc: "Обычно называемый 18/25-фунтовым, Mk I представлял собой 25-фунтовую ствольную часть, установленную на 18-фунтовую лафетную установку. Он сохранил старые прицелы 18-фунтового орудия, что несколько ограничивало его возможности. \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    eng_art_3: "QF 25-pounder Mk II"
    eng_art_3_short: "QF 25-pounder Mk II"
    eng_art_3_desc: "Теперь, установленный на собственной специальной лафете, Mk II, хотя и не такой крупнокалиберный, как другие, обеспечивает высокую скорострельность, большую дальность стрельбы и эффективную систему управления артиллерией, что делает его превосходным в угнетающем огне. Это означает высокую защиту и приличную пробивную способность. \n§GЭто позволит сохранить производственную эффективность предыдущей модели.§!"

