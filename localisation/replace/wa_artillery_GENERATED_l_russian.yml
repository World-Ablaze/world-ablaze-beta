    sov_art_3: "76-мм ЗиС-3"
    sov_art_3_short: "76-мм ЗиС-3"
    sov_art_3_desc: "Сталин высоко оценил это оружие как «шедевр конструкции артиллерийских систем». ЗиС-3 отличается высокой надежностью, точностью и высокой скорострельностью. \n§tНе может быть исследовано до тех пор, пока не исчезнет клика кавалерии.§Y \n§YМожно получить бесплатное производство с полной эффективностью после завершения фокуса §H$SOV_zis_name_default$§! \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    sov_art_4: "85-мм Д-44"
    sov_art_4_short: "85-мм Д-44"
    sov_art_4_desc: "Ствол был разработан на основе ствола танка Т-34-85. Более крупный калибр обеспечивает 85-мм пушке Д-44 улучшенные характеристики по сравнению с предыдущими пушками, при этом сохраняя высокую скорострельность. \n§RЭто совершенно новая модель, эффективность которой не сохранится§!"

    sov_art_5: "122-мм Д-74"
