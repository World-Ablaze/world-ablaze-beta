 MAN_puyi_figurehead: "Айсиньгьоро Пуи"
 MAN_puyi_figurehead_desc: "Пуйи из дома Айсин Гиоро, император Кандэ империи Маньчжоу-Го. Он родился в 1906 году и должен был стать законным императором династии Цин после императора Гуансюя. Однако республиканские военачальники захватили власть и ввергли Китай в хаос. К счастью, с помощью Японии удалось установить руководство Маньчжоу-Го, чтобы продолжить наследие Пуйи, и в 1934 году Пуйи был возведен на престол как император Кандэ."
  
 MAN_puyi_figurehead_puppet: "Айсиньгьоро Пуи - марионетка"
 MAN_puyi_figurehead_puppet_desc: "Пуйи из дома Айсин Гиоро, император Кандэ империи Маньчжоу-Го. Он родился в 1906 году и должен был стать законным императором династии Цин после императора Гуансюя. Однако республиканские военачальники захватили власть и ввергли Китай в хаос. К счастью, с помощью Японии удалось установить руководство Маньчжоу-Го, чтобы продолжить наследие Пуйи, и в 1934 году Пуйи был возведен на престол как император Кандэ."
  
 MAN_puyi_figurehead_god: "Айсиньгьоро Пуи - Бог"
 MAN_puyi_figurehead_god_desc: "Пуйи из дома Айсин Гиоро, император Кандэ империи Цин. После Маньчжурского восстания и свержения японского ига Пуи начал объединение всего материкового Китая. После успешной военной кампании и дипломатических интриг Айсиньгьоро Пуи добился своей главной цели — возрождения империи Цин. Теперь он коронован в императорском дворце Пекина как «Сын Неба» и является для народа богом!"
  
 MAN_puyi_emperor: "Император Пуи"
 MAN_puyi_emperor_desc: "Пуйи из дома Айсин Гиоро, император Кандэ империи Маньчжоу-Го. Он родился в 1906 году и должен был стать законным императором династии Цин после императора Гуансюя. Однако республиканские военачальники захватили власть и ввергли Китай в хаос. К счастью, с помощью Японии удалось установить руководство Маньчжоу-Го, чтобы продолжить наследие Пуйи, и в 1934 году Пуйи был возведен на престол как император Кандэ."
  
