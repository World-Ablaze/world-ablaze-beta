 MAN_quest_for_independance: "Стремление к независимости"
 MAN_quest_for_independance_desc: "Принц Пуи — всего лишь церемониальная фигура для Маньчжоу-Го, но это не обязательно так. При достаточной поддержке и его притязаниях на династию Цин Маньчжоу-Го могло бы быть освобождено от хватки Японии."
  
 MAN_form_the_peasants: "Крестьянская армия"
 MAN_form_the_peasants_desc: "Каждый человек должен выполнять свой долг. Человеку не нужны дорогие академии, сотни книг и профессиональные инструкторы, чтобы иметь возможность бороться за свою свободу."
  
 MAN_approach_the_communists: "Обратиться к коммунистам"
 MAN_approach_the_communists_desc: "Враг моего врага — мой друг, и мало кто презирает империалистическую агрессию так сильно, как коммунисты. Советы будут более чем счастливы вооружить наши группы сопротивления, чтобы ослабить Японию."
  
 MAN_the_mukden_capital: "Перенос столицы в Мукден"
 MAN_the_mukden_capital_desc: "Мукден — величайший город Маньчжурии, где находится Мукденский дворец. Перенос нашей столицы в Мукден поднимет дух народа и облегчит передачу власти в будущем."
  
 MAN_legislate_worker_rights: "Закрепить права трудящихся в законе"
 MAN_legislate_worker_rights_desc: "Рабочие работают в ужасных условиях, поэтому часто случаются небольшие акты саботажа, а мотивация низкая. Предоставляя рабочим некоторые основные права, мы можем мотивировать рабочих бороться за новую Маньчжурию."
  
 MAN_protect_the_intellectuals: "Защитить интеллектуалов"
 MAN_protect_the_intellectuals_desc: "Японцы эксплуатируют и уничтожают интеллектуалов в Маньчжурии. Чтобы правильно управлять государством, мы должны остановить эту утечку мозгов."
  
 MAN_imp_army: "Имперская армия"
 MAN_imp_army_desc: "Наша армия по-прежнему организована и создана для того, чтобы служить полицейской силой на наших территориях. Чтобы защитить нашу страну, армия должна быть преобразована в эффективную боевую силу."
  
 MAN_qing_society: "Сформировать общество Цин"
 MAN_qing_society_desc: "Настало время предоставить нашему народу те же образовательные возможности, что и другие державы предоставляют своим народам. Только тогда мы сможем по-настоящему достичь звезд"
  
 MAN_reform_Jinyiwei: "Восстановить Цзиньивэй"
 MAN_reform_Jinyiwei_desc: "Тайная полиция императора будет восстановлена для защиты его величества и его верных подданных от иностранной подрывной деятельности."
  
 MAN_reinstate_imperial_court: "Императорский двор"
 MAN_reinstate_imperial_court_desc: "Двор императора будет восстановлен в своей былой славе, что укрепит бессмертное правление императора."
  
 MAN_focus_on_prosperity: "Эпоха процветания"
 MAN_focus_on_prosperity_desc: "Теперь мы можем, наконец, вступить в новую эпоху процветания Китая. Свободный от хватки внешних сил, наш народ наконец сможет процветать."
  
 MAN_wa_five_people_armies_tt: "Мы получим 7 дивизий с 12 батальонами легкой пехотой"
  
 MAN_chinese_citizen: "Китайский гражданин"
 MAN_chinese_citizen_desc: "Неспособность империи обеспечить и защитить свой народ привела к краху. Китайские граждане получат больше прав и более высокое качество жизни после восстановления империи, чтобы мы не столкнулись с новым восстанием."
  
 MAN_expand_the_police_force: "Расширить полицию"
 MAN_expand_the_police_force_desc: "Нынешние вооруженные силы Маньчжоу-Го в основном представляют собой полицейские силы. Расширяя эти силы для «дальнейшей стабилизации» нации, мы можем еще больше расширить наши силы без вмешательства Японии."
  
 MAN_fund_the_black_market: "Финансировать черный рынок"
 MAN_fund_the_black_market_desc: "На нашем рынке полностью доминирует японское влияние. Для достижения наших целей мы должны использовать черный рынок для финансирования нашего движения за независимость."
  
 MAN_reach_out_to_Zheng_Xiaoxu: "Связаться с Чжэн Сяосюем"
 MAN_reach_out_to_Zheng_Xiaoxu_desc: "Чжэн Сяосюй был премьер-министром нашей славной нации, прежде чем его свергла Квантунская армия. Возможно, он захочет помочь нам в нашем деле, если мы обратимся к нему."
  
 MAN_appeal_to_the_legislative_yuan: "Обращение в Законодательный Юань"
 MAN_appeal_to_the_legislative_yuan_desc: "Остальной Китай сочувствует нашему тяжелому положению в борьбе за независимость. Обратившись к законодательному юаню, мы сможем снова поднять эту тему и побудить китайских лидеров к действию."
  
 MAN_overthrow_the_kwantung: "Свергнуть Квантунскую Армию"
 MAN_overthrow_the_kwantung_desc: "Мы, наконец, готовы отстоять свою независимость и свергнуть наших деспотических повелителей. Мы должны сплотиться вокруг нашего князя, чтобы восстановить независимую Маньчжурию."
  
 MAN_eight_banners: "Восемь знамён"
 MAN_eight_banners_desc: "Чтобы защитить и расширить нашу огромную империю, восемь элитных знамен должны быть восстановлены и служить интересам нашего императора."
 MAN_eight_banners_tt: "Мы получим 8 дивизий элитной гвардии"
  
 MAN_reclaim_the_empire_afo: "Вернуть Империю"
 MAN_reclaim_the_empire_afo_desc: "Теперь, когда мы обеспечили себе свободу, мы, наконец, можем обратить взор на наши законные притязания. Император всего Китая вернется."
  
 MAN_integrate_mengjiang: "Интеграция Мэнцзяна"
 MAN_integrate_mengjiang_desc: "Теперь, когда Мэнцзян прочно находится под нашим контролем, мы можем интегрировать его в нашу империю на основании законных притязаний императора."
  
 MAN_subjugate_sinkiang: "Подчинить Синьцзян"
 MAN_subjugate_sinkiang_desc: "Синьцзян по-прежнему является законным притязанием императора. Мы возьмем его силой ради императора!"
  
 MAN_revive_imperial_heritage: "Возродить имперское наследие"
 MAN_revive_imperial_heritage_desc: "Великая империя Цин правила Китаем более 400 лет. Люди, возможно, были введены в заблуждение иностранными идеями, однако, проведя достаточную агитацию, мы могли бы возродить великое наследие империи."
  
 MAN_appeal_to_the_warlords: "Обращение к варлордам"
 MAN_appeal_to_the_warlords_desc: "Варлорды обладают значительной властью, и некоторые из них питают монархические симпатии или могут быть принуждены присоединиться к нам."
  
 MAN_send_delegations_abroad: "Отправить делегации за границу"
 MAN_send_delegations_abroad_desc: "Иностранные страны всегда были воодушевлены перспективой усиления влияния в Китае. Если мы сможем убедить некоторые из этих стран в том, что мы должны контролировать ситуацию, они, возможно, захотят поддержать нас."
  
 MAN_reach_out_to_abroad: "Дипломатическая миссия"
  
 MAN_secure_manchu: "Обезопасить Маньчжурию"
 MAN_secure_manchu_desc: "Коммунисты на нашей границе представляют явную угрозу нашей независимости и нашим стратегическим целям в Китае. Мы должны добиться урегулирования с ними."
 MAN_secure_manchu_tt: "Советы, скорее всего, нарушат это правило, если у них не будет серьезных угроз."
  
 MAN_war_of_unification: "Война за объединение"
 MAN_war_of_unification_desc: "Время пришло. Наши армии стоят наготове у границ. Люди знают о наших законных претензиях, а другие китайские группировки продолжают ссориться. Мы должны ковать железо, пока горячо."
 
 
