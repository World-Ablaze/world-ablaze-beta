 man_armor.817.t: "Борьба Маньчжурии за независимость"
 man_armor.817.d: "Наши законные земли Маньчжурии были отняты у нас в 1931 году японцами, и на их месте был установлен марионеточный режим. Сегодня несколько представителей нашего народа в Маньчжурии обратились в Законодательный юань по поводу своего тяжелого положения и надежд на освобождение от Японии. Помощь им, безусловно, может нанести Японии сильный удар, однако некоторые утверждают, что из-за претензий принца Пуи на трон было бы разумнее позволить этому движению угаснуть."
 man_armor.817.a: "Мы поможем маньчжурам в их тяжелом положении!"
 man_armor.817.b: "Мы не поддержим столь глупую затею."
  
 man_armor.818.t: "Zheng Xiaoxu answers"
 man_armor.818.d: "Чжэн Сяосюй недавно был отстранен от должности премьер-министра Маньчжурии из-за его разногласий с Квантунской армией. Хотя он больше не находится у власти, он сделал нам смелое предложение. С его связями в правительстве, некоторыми фальшивыми документами и массовыми проявлениями гражданских беспорядков мы можем оказать давление на Квантунскую армию, чтобы она заменила Кенкити Уэду на Чу Кудо, человека, преданного нашему делу."
 man_armor.818.a: "Давайте сотрудничать ради свободной Маньчжурии."
  
 man_armor.819.t: "Наша беда была услышана."
 man_armor.819.d: "Чан Кайши согласился нам помочь. Маньчжуры из армии Пути будут постепенно переброшены обратно в Маньчжурию путем тайного пересечения границы через Мэнцзян. "
 man_armor.819.a: "Они сослужат нам добрую службу"
  
 man_armor.820.t: "Чан Кайши отказывается помочь!"
 man_armor.820.d: "Несмотря на нашу очевидную потребность в помощи и законное стремление к независимости, мы не получим поддержки со стороны республики."
 man_armor.820.a: "Мы этого не забудем."
  
 man_armor.821.t: "Обращение к милитаристам"
 man_armor.821.d: "Военачальники постоянно спорят о том, на чьей стороне встать. Оказав на них большое дипломатическое давление, мы, возможно, сможем убедить их встать на нашу сторону."
 man_armor.821.a: "Добавим несколько уступок, чтобы склонить их на нашу сторону."
 man_armor.821.b: "Этого будет достаточно."
  
 man_armor.822.t: "Вопрос о Цин"
 man_armor.822.d: "Дипломаты империи Цин тайно обратились к нам, предлагая нам влияние и прощение, если мы встанем на их сторону в предстоящей гражданской войне. Это, безусловно, повлияет на наше положение в китайской политике, поэтому мы должны выбирать мудро."
 man_armor.822.a: "Мы будем служить истинному императору Китая."
 man_armor.822.b: "Нелепость!"
  
 man_armor.823.t: "[FROM.GetName] отвечает отказом!"
 man_armor.823.d: "[FROM.GetName] отказывается перейти на нашу сторону"
 man_armor.823.a: "Они будут раздавлены"
  
 MAN_appealing_to_warlord: "Обращение к Варлордам"
  
 man_armor.824.t: "[FROM.GetName] принимает!"
 man_armor.824.d: "[FROM.GetName] согласился присоединиться к нам, когда разразится гражданская война."
 man_armor.824.a: "Они сослужат нам добрую службу"
  
 man_armor.1000.t: "Китайский вопрос"
 man_armor.1000.d: "После окончания войны против Японии все внимание возвращается к вопросу объединения Китая. Мы должны сохранять бдительность, какую бы дорогу мы ни выбрали"
 man_armor.1000.a: "Китай будет единым"
  
