 MAN_quest_for_independance_idea: "Стремление к независимости"
 MAN_quest_for_independance_idea_desc: "Династия Цин правила Китаем более 300 лет. Долг каждого маньчжурца — помочь принцу Пуи освободиться от японской хватки ради мира и процветания всего Китая."
  
  
 MAN_worker_rights: "Права работников"
 MAN_worker_rights_desc: "Улучшение прав наших работников привело к увеличению общей производительности, поскольку рабочие теперь более мотивированы."
  
 MAN_intellectuals: "Сохранение интеллектуалов"
 MAN_intellectuals_desc: "Чтобы остановить утечку мозгов, мы должны защитить наших интеллектуалов от эксплуатации со стороны японцев."
  
 MAN_Imperial_army: "Имперская армия"
 MAN_Imperial_army_desc: "Имперская армия служит первой и последней защитой императора. Она служит прямым продолжением его воли и поэтому должна быть хорошо обучена."
  
 MAN_prosperity: "Эпоха процветания"
 MAN_prosperity_desc: "Китайский народ наконец-то освободился от ига внешних сил. Наконец мы можем вступить в новую эпоху процветания."
 MAN_local_police: "Местная полиция"
 MAN_local_police_desc: "Наша местная полиция состоит исключительно из маньчжурцев, что помогает нам увеличить нашу автономию и увеличить численность персонала, обеспечивая при этом защиту большего числа граждан от наших повелителей."
  
 MAN_imperial_court: "Суд императорского клана"
 MAN_imperial_court_desc: "Великий суд нашей империи отвечает за все вопросы, касающиеся императорской семьи."
 
 
 man_armor.801.t: "[FROM.GetName] готовит отряды налётчиков"
 man_armor.801.d: "Граница между нами и Маньчжоу-Го всегда была горячей точкой стычек и столкновений с тех пор, как Япония выиграла первую китайско-японскую войну. Теперь новое правительство Маньчжоу-Го организовало бригады, готовые совершать набеги и грабить нашу сельскую местность, если им представится такая возможность. Мы должны обеспечить наличие у нас достаточных войск, чтобы предотвратить это, пока мы не найдем более постоянное решение."
 man_armor.801.a: "Нам придется держать границу укрепленной"
 MAN_raids_tt: "\n§RДержать на маньчжурской границе не менее 25 дивизий (325 тыс. живой силы)§!"
  
