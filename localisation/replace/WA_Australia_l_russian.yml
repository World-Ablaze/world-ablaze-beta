 AST_expand_bhp_steelworks: "Расширить металлургический завод BHP"
 AST_expand_bhp_steelworks_desc: ""
  
 AST_unemployment_relief_works_act: "Закон о работах по оказанию помощи безработным"
 AST_unemployment_relief_works_act_desc: "Чтобы снова привести экономику в движение, мы должны сначала заняться высокой безработицей и перенаправить рабочие места с экспорта на внутреннее производство."
  
 AST_the_premiers_plan: "План премьера"
 AST_the_premiers_plan_desc: "Учитывая огромный уровень безработицы и экономические страдания на фоне резкого падения доходов от экспорта, мы должны продолжать проводить дефляционную политику и сбалансировать бюджет, чтобы предотвратить ухудшение ситуации и вернуть процветание."
  
 AST_loan_appropiation_bill: "Законопроект об ассигнованиях на кредиты"
 AST_loan_appropiation_bill_desc: "Перед одобрением парламентских займов должны быть установлены новые фильтры, которые помогут гарантировать, что нужная сумма денег будет потрачена на товары и услуги, которые полезны для развития нашей экономики."
 AST_unemployment_relief_works_act_dd_flag: "Фокус §YЗакон о работах по оказанию помощи безработным§! выполнен"
 AST_unemployment_relief_works_act_dd_tt: "В настоящее время: [?AST_unemployment_relief_works_act_dd_flag:days|Y0]"
  
 AST_industries_assistance_corporation_desc: "Недавние глобальные экономические потрясения препятствовали инвестициям и предпринимательству в Австралии. Корпорация содействия промышленности будет консультировать и финансировать малый бизнес по всей стране, чтобы снова привести экономику в движение."
  
 AST_maintain_industry_tariffs: "Поддерживать отраслевые тарифы"
 AST_maintain_industry_tariffs_desc: "Несмотря на последствия Великой депрессии для экспортного рынка, мы не должны попасть в ловушку снижения наших тарифов. Торговля в конечном итоге возобновится, и мы должны будем зарабатывать ту же сумму, что и раньше."
 AST_loan_appropiation_bill_dd_flag: "Фокус §YЗаконопроект об ассигнованиях на кредиты§! выполнен"
 AST_loan_appropiation_bill_dd_tt: "В настоящее время: [?AST_loan_appropiation_bill_dd_flag:days|Y0]"
  
 AST_merge_the_banks: "Объединить банки"
 AST_merge_the_banks_desc: "Слишком слабое регулирование усугубило наши экономические проблемы. Мы должны консолидировать прибыльные банки, чтобы наконец вернуть на рынок возвратные кредиты и полностью оправиться от депрессии."
 AST_maintain_industry_tariffs_dd_flag: "Фокус §YПоддерживать отраслевые тарифы§! выполнен"
 AST_maintain_industry_tariffs_dd_tt: "В настоящее время: [?AST_maintain_industry_tariffs_dd_flag:days|Y0]"
  
 AST_expand_mining_operations: "Расширить деятельность по добыче полезных ископаемых"
 AST_expand_mining_operations_desc: "Австралия богата минеральными ресурсами. Расширение шахт будет стимулировать наши промышленные усилия."
  
 AST_glen_davis_shale_oil_works: "Сланцевый завод Глен Дэвис"
 AST_glen_davis_shale_oil_works_desc: "Используя финансовую поддержку местных органов власти, Джордж Фрэнсис Дэвис создал новую компанию в городе Глен-Дэвис. Сланцевая нефть станет важным стратегическим ресурсом."
  
 AST_reorganize_the_department_of_defense: "Реорганизация Министерства обороны"
 AST_reorganize_the_department_of_defense_desc: "Мы должны реформировать Министерство обороны, если хотим, чтобы Австралия была готова противостоять растущей напряженности в Европе и во всем мире."
  
 AST_form_the_department_of_supply_and_development: "Сформировать Департамент снабжения и развития"
 AST_form_the_department_of_supply_and_development_desc: "Департамент снабжения и развития будет обеспечивать снабжение боеприпасами, а также различными материалами и товарами, связанными с обороной."
  
 AST_form_the_department_of_munitions: "Сформировать Департамент боеприпасов"
 AST_form_the_department_of_munitions_desc: "Поскольку очевидно, что Соединённое Королевство не сможет снабжать Австралию оружием и боеприпасами, нам необходимо ускорить собственное производство боеприпасов."
  
 AST_expand_the_lithgow_small_arms_factory: "Расширение завода стрелкового оружия в Литгоу"
 AST_expand_the_lithgow_small_arms_factory_desc: "Завод в Литгоу не может удовлетворить растущие потребности армии. Мы надеемся, что расширение за счёт новых пристроек и вспомогательных заводов поможет увеличить производство."
  
 AST_divert_domestic_production: "Переориентировать внутреннее производство"
 AST_divert_domestic_production_desc: ""
  
 AST_integrate_tugan_aircraft_into_the_cac: "Интеграция Tugan Aircraft в CAC"
 AST_integrate_tugan_aircraft_into_the_cac_desc: "Премьер-министр Джозеф Лайонс объявил о создании Авиационной корпорации Содружества (CAC) и о том, что CAC поглотит компанию Tugan Aircraft, чтобы оптимизировать производство самолетов в Австралии."
 AST_integrate_tugan_aircraft_into_the_cac_tt: "Иметь §G400§! развернутых §YИстребителей или многоцелевых самолетов§!.\n"
  
 AST_expand_cac_facilities: "Расширить возможности CAC"
 AST_expand_cac_facilities_desc: "Чтобы поднять производство до желаемого уровня, Авиастроительной корпорации Содружества потребуются новые заводы."
  
 AST_nationalize_daf: "Национализировать DAF"
 AST_nationalize_daf_desc: "DAF уже давно является производителем запчастей для гражданских самолетов. Как их крупнейший акционер мы можем осуществить поглощение, а с их национализацией мы можем получить те же самые детали по минимальной цене и увеличить производство самолетов."
 AST_nationalize_daf_tt: "Иметь §G600§! развернутыхе §YИстребителей или многоцелевых самолетов§! и §G200§! §YШтурмовиков§!\n"
  
 AST_motion_of_no_confidence: "Вотум недоверия"
 AST_motion_of_no_confidence_desc: ""
  
