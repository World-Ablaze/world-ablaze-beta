 ast_armor.801.t: "Австралийская гарантия"
 ast_armor.801.d: "Учитывая нынешнюю высокую напряженность во всем мире и высокую вероятность того, что Австралии может угрожать опасность со стороны Японии, они попросили о военной защите, если они будут втянуты в оборонительную войну в Тихом океане."
 ast_armor.801.a: "Мы предоставим гарантию!"
 ast_armor.801.b: "Мы не можем направить наши силы на защиту Австралии."
  
 ast_armor.802.t: "[FROM.GetName] гарантирует независимость Австралии"
 ast_armor.802.d: "[FROM.GetName] согласился предоставить Австралии гарантию защиты от любой угрозы ее независимости."
 ast_armor.802.a: "Мы сильны!"
  
 ast_armor.803.t: "[FROM.GetName] отклоняет австралийскую гарантию"
 ast_armor.803.d: "[FROM.GetName] отклонил нашу петицию, и мы пока остаемся одни. Мы должны подготовиться к очень тяжелой войне"
 ast_armor.803.a: "Мы стоим одни!"
  
 ast_armor.804.t: "Австралия предлагает Единое командование"
 ast_armor.804.d: "Австралия обратилась к нам с предложением создать единое командование АНЗАК путем слияния наших вооруженных сил с их собственными. Это приведет к тому, что мы передадим наши дивизии, флот и авиацию Австралии."
 ast_armor.804.a: "Это отличная идея."
 ast_armor.804.b: "Отдельное командование предпочтительнее."
  
 ast_armor.805.t: "Новая Зеландия принимает Единое командование"
 ast_armor.805.d: ""
 ast_armor.805.a: "Отлично."
  
 ast_armor.806.t: "Новая Зеландия отвергает Единое командование"
 ast_armor.806.d: ""
 ast_armor.806.a: "Превосходный результат!"
  
 ast_armor.807.t: "Военные учения АНЗАК"
 ast_armor.807.d: "Австралия провела учения между нашими вооруженными силами. Мы использовали эту возможность для разработки новой тактики и улучшения нашей военной структуры."
 ast_armor.807.a: "Отлично."
  
 ast_armor.808.t: "Австралия предлагает создать Единое командование с Индонезией"
 ast_armor.808.d: "Австралия обратилась к нам с предложением создать единое командование ABDACOM путем слияния индонезийских вооруженных сил со своими. Это приведет к тому, что мы передадим Австралии индонезийские дивизии, военно-морской флот и военно-воздушные силы."
 ast_armor.808.a: "Это отличная идея!"
 ast_armor.808.b: "Отдельное командование предпочтительнее."
  
 ast_armor.809.t: "[From.GetName] принимает командование ABDACOM"
 ast_armor.809.d: ""
 ast_armor.809.a: "Отлично."
  
 ast_armor.810.t: "[From.GetName] отклоняет командование ABDACOM"
 ast_armor.810.d: ""
 ast_armor.810.a: "Превосходный результат!"
  
 ast_armor.811.t: "[From.GetName] запрашивает новые крупные корабли"
 ast_armor.811.d: "[From.GetName] выразил озабоченность по поводу защиты Тихого океана и запросил у нас новые крупные корабли для противодействия угрозе на Востоке. Наличие большего количества кораблей под австралийским командованием будет означать большую ответственность за защиту Тихого океана для Австралии и меньшую для нас."
 ast_armor.811.a: "Можем передать новый корабль."
 ast_armor.811.b: "Пошлем небольшую флотилию."
 ast_armor.811.c: "Нам нечего выделить."
  
 ast_armor.812.t: "[From.GetName] прислал нам новый тяжелый крейсер"
 ast_armor.812.d: "[From.GetName] согласился на нашу просьбу и прислал нам новый тяжелый крейсер, который возглавит австралийский флот."
 ast_armor.812.a: "Это великолепно!"
  
 ast_armor.813.t: "[From.GetName] прислал нам группу новых тяжелых крейсеров."
 ast_armor.813.d: "[From.GetName] увидел растущую угрозу на Востоке и снабдил австралийский флот несколькими кораблями. При этом они ожидают, что мы будем играть более важную роль в защите Тихого океана; любая неспособность сделать это будет иметь катастрофические последствия для наших отношений."
 ast_armor.813.a: "Очень щедро с их стороны!"
  
 ast_armor.814.t: "[From.GetName] отклонил наш запрос"
 ast_armor.814.d: "Признавая угрозу на Востоке, [From.GetName] отклонил наш запрос, сославшись на большую потребность в кораблях в Атлантике и Северном море. Нам придется надеяться, что они быстро передумают, пока не стало слишком поздно."
 ast_armor.814.a: "Нам придется обойтись без них."
  
 ast_armor.815.t: "Умер Джозеф А. Лайонс"
 ast_armor.815.d: "Перенесший сердечный приступ во время поездки из Мельбурна в Сидней, Лайонс был доставлен в больницу Святого Винсента в Дарлингхерсте в критическом состоянии. К сожалению, вскоре он впал в кому и умер.\nСмерть одного из величайших лидеров Австралии повергла всю нацию в шок. Теперь нам придется собраться с силами и сделать так, чтобы Австралия пережила надвигающийся шторм."
 ast_armor.815.a: "Вся нация будет скорбеть."
  
 ast_armor.816.t: "Вотум доверия"
 ast_armor.816.d: "Крах кабинета Мензиса предоставил лейбористам возможность взять на себя ответственность за правительство и вести Австралию в этой войне более эффективным и надлежащим образом."
 ast_armor.816.a: "Джон Кертин — человек для этой работы!"