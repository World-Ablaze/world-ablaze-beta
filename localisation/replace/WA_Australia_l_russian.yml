 AST_rats_of_tobruk_effect_australia: "Появится §YЭлитная пехотная дивизия§! в Сиднее"
  
 AST_abandon_the_singapore_strategy: "Отказаться от сингапурской стратегии"
 AST_abandon_the_singapore_strategy_desc: ""
  
 AST_the_singapore_strategy_desc: "Сингапур слишком далеко от Лондона, чтобы быть в безопасности. Австралия возьмет на себя задачу защитить этот форпост империи от агрессии со стороны других."
  
 AST_closer_ties_with_the_netherlands: "Более тесные связи с Нидерландами"
 AST_closer_ties_with_the_netherlands_desc: ""
  
 AST_working_with_the_rnn: "Сотрудничество с Королевским флотом Нидерландов"
 AST_working_with_the_rnn_desc: ""
  
 AST_liason_to_the_dutch_military: "Связь с голландскими военными"
 AST_liason_to_the_dutch_military_desc: ""
  
 AST_defend_the_dutch_colonies: "Защитить голландские колонии"
 AST_defend_the_dutch_colonies_desc: "Голландские колонии являются великим щитом, защищающим Австралию от японской агрессии, их защита имеет первостепенное значение для защиты Австралии."
  
 AST_closer_ties_with_the_usa: "Более тесные связи с США"
 AST_closer_ties_with_the_usa_desc: ""
  
 AST_secure_lend_lease: "Обеспечить ленд-лиз"
 AST_secure_lend_lease_desc: ""
  
 AST_security_guarantees: "Гарантии безопасности"
 AST_security_guarantees_desc: ""
  
 AST_form_abdacom: "Создать ABDACOM"
 AST_form_abdacom_desc: ""
  
 AST_integrate_dutch_forces: "Интегрировать голландские войска"
 AST_integrate_dutch_forces_desc: ""
  
 AST_south_west_pacific_command: "Командование юго-западной части Тихого океана"
 AST_south_west_pacific_command_desc: ""
  
 AST_nationalize_the_wool_industry: "Национализировать шерстяную промышленность"
 AST_nationalize_the_wool_industry_desc: "Шерстяная промышленность огромна, и прибыль, полученная от нее, могла бы лучше послужить военным усилиям."
  
 AST_approve_land_grants: "Утвердить гранты на землю"
 AST_approve_land_grants_desc: "Предоставление земли горнодобывающим компаниям может оказаться выгодным в долгосрочной перспективе."
  
 AST_rural_renovation_and_maintenance_works_act: "Закон о сельских ремонтно-восстановительных работах"
 AST_rural_renovation_and_maintenance_works_act_desc: "Улучшение сельской инфраструктуры означает повышение производительности и сокращение времени на дорогу для рабочих. Это должно дать импульс нашей экономике."
  
 AST_reform_agricultural_laws: "Реформа сельскохозяйственного законодательства"
 AST_reform_agricultural_laws_desc: "Действующие сельскохозяйственные законы устарели и добавляют ненужную бюрократическую волокиту для получения современного сельскохозяйственного оборудования, что приводит к формированию черных рынков и, следовательно, к снижению налогов!"
  
 AST_urban_housing_trusts: "Городские жилищные фонды"
 AST_urban_housing_trusts_desc: "Сильная экономика — это экономика, в которой процветает молодежь, пусть деньги тратятся больше на товары, а не на дорогое жилье."
  
 AST_invest_in_external_territories: "Инвестировать во внешние территории"
 AST_invest_in_external_territories_desc: ""
  
 AST_partial_railway_standardization: "Частичная стандартизация железных дорог"
 AST_partial_railway_standardization_desc: "Благодаря стандартизированной колее новые железнодорожные проекты можно быстро и легко реализовать."
  
 AST_organise_rural_war_and_sewage_works: "Организация сельских водопроводных и канализационных работ"
 AST_organise_rural_war_and_sewage_works_desc: "Дальнейшее развитие сельских районов поможет создать рабочие места и улучшить качество жизни."
  
 AST_expand_urban_road_works: "Расширить городские дорожные работы"
 AST_expand_urban_road_works_desc: "Инвестируя в дорожные работы, мы можем ускорить строительство новых зданий и помочь создать новые рабочие места, а также поддержать существующие."
  
 AST_lower_interest_rates: "Снизить процентные ставки"
 AST_lower_interest_rates_desc: "Более низкие процентные ставки означают больше кредитов, больше кредитов означает больше расходов, больше расходов означает больше налогов!"
  
 AST_resume_assisted_migration: "Возобновить сопровождаемую миграцию"
 AST_resume_assisted_migration_desc: ""
  
 AST_strengthen_ties_with_the_uk: "Укрепить связи с Соединённым Королевством"
 AST_strengthen_ties_with_the_uk_desc: "Наша метрополия может оказать большую помощь в политических делах, и для этого мы можем использовать дипломатические миссии."
  
 AST_policy_of_imperial_defence: "Политика имперской обороны"
 AST_policy_of_imperial_defence_desc: "Мы не можем продолжать закрывать глаза на ситуацию в мире, война приближается, и мы должны подготовить новую политику, чтобы убедиться, что Австралия готова к ней."
  
 AST_rearmament: "Перевооружение"
 AST_rearmament_desc: "Нынешняя война, похоже, потребует полной поддержки австралийского народа и его промышленности, поэтому должно начаться перевооружение."
  
 AST_secure_biparty_support: "Заручиться двухпартийной поддержкой"
 AST_secure_biparty_support_desc: ""
  
 AST_commit_the_economy_to_war: "Вовлечь экономику в войну"
 AST_commit_the_economy_to_war_desc: ""
  
 AST_national_security_act_desc: "Все политические партии должны объединиться под знаменем Содружества, чтобы добиться победы. С этой целью выборы приостанавливаются, а военному консультативному совету оказывается полная поддержка."
  
  
  
 AST_csir: "CSIR - Совет по научным и промышленным исследованиям"
 AST_csir_desc: "Организация научных и промышленных исследований Содружества — это наше правительственное исследовательское подразделение, призванное повысить эффективность науки и производства в Австралии. Увеличивая нашу поддержку, мы придадим новые силы нашей военной машине."
  
 AST_recruit_billy_hughes: "Нанять Билли Хьюза"
 AST_recruit_billy_hughes_desc: "Билли Хьюз — очень влиятельный националист, который может помочь получить большую военную поддержку со стороны населения и возглавить усилия по вербовке."
  
 AST_squash_the_squander_bugs: "Раздавить ошибки растраты"
 AST_squash_the_squander_bugs_desc: "Расточительные расходы на потребительские товары, затронутые инфляцией, отнимают деньги у военных облигаций и военных усилий. Нам необходимо препятствовать этому стремлению к роскоши, пока наша армия в ней нуждается."
  
 AST_nationalize_key_industries: "Национализировать ключевые отрасли промышленности"
 AST_nationalize_key_industries_desc: ""
  
 AST_additional_militia_training_desc: ""
  
 AST_raise_additional_brigades: "Сформировать дополнительные бригады"
 AST_raise_additional_brigades_desc: "Нынешнюю численность армии необходимо удвоить, поскольку на горизонте начинают сгущаться тучи войны. Они могут участвовать в учениях и быть преобразованы в соответствующие дивизии в случае начала войны."
  
 AST_m_special_unit_desc: "Специальное подразделение М будет нашим передовым разведывательным подразделением на войне, отправляющим разведданные о дислокации и позициях противника."
  
 AST_darwin_mobile_force: "Мобильные силы Дарвина"
 AST_darwin_mobile_force_desc: ""
  
 AST_conduct_military_exercises: "Проведение военных учений"
 AST_conduct_military_exercises_desc: ""
  
 AST_exercises_with_the_british_army: "Учения с британской армией"
 AST_exercises_with_the_british_army_desc: ""
  
 AST_jungle_warfare_centre: "Центр боевых действий в джунглях"
 AST_jungle_warfare_centre_desc: "Любой будущий конфликт в Тихом океане будет включать в себя боевые действия в суровых джунглях Новой Гвинеи и на любой другой тихоокеанской территории. Центр подготовки войск для джунглей должен дать нам преимущество."
  
 AST_z_special_unit_tt: "Добавит £political_violence_texticon §Y10 сопротивления§! к каждому индонезийскому региону, контролируемому Сферой совместного процветания Восточной Азии (Японией или ее сателитами).\n\n"
  
