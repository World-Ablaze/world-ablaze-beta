 CHI_nationalize_camco: "Национализировать CAMCO"
 CHI_nationalize_camco_desc: "CAMCO изначально была основана американским предпринимателем для производства американских образцов. Национализация этих заводов даст нам бесценную базу для создания наших собственных военно-воздушных сил."
