 CHI_mission_to_the_us_soong_us_decision: "Пока §YСун Мэйлин§! является §Yполитическим советником§!, [USA.GetFlag]§Y[USA.GetNameDef]§! будут принимать решения, поддерживая §3Гоминьдан§! и §Yклики§! в войне против [JAP.GetFlag]§YЯпонской Империи§!\n"
 CHI_mission_to_the_us_desc: "У Китая долгое время были сильные союзники в США. Они представляют собой лучший шанс получить необходимую нам поддержку.\n§GМы получим возможность покупать [USA.GetFlag]§Y[USA.GetAdjective]ое§! снаряжение в случае чрезвычайной ситуации§!"
  
 CHI_price_controls_desc: "Первым шагом для удержания инфляции под контролем является обеспечение продажи основных товаров по фиксированным ценам. Это не будет популярно среди торгового класса."
  
