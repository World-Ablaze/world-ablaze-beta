 CHI_cbi_theater_airfields: "Аэродромы театра военных действий КБИ"
 CHI_cbi_theater_airfields_desc: "Американский театр военных действий «Китай-Бирма-Индия» (КБИ) стремится получить возможность выполнять стратегические бомбардировочные миссии над Японией с китайских авиабаз. Китай должен приложить все усилия для строительства авиабаз, пригодных для крупных американских стратегических бомбардировщиков дальнего радиуса действия."
  
