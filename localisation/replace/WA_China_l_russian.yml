 CHI_reorganization_of_the_navy: "Реорганизация ВМФ"
 CHI_reorganization_of_the_navy_desc: "Нашего военно-морского флота в его нынешнем виде в настоящее время не существует. Мы должны создать современный флот, способный защитить воды Китая."
  
 CHI_fund_a_second_fleet: "Профинансировать второй флот"
 CHI_fund_a_second_fleet_desc: "Наш нынешний флот слишком мал, чтобы его можно было разделить и прикрывать несколько районов одновременно. Мы должны быстро построить флот из эсминцев и легких крейсеров для защиты больших районов океана."
  
 CHI_a_green_water_navy: "Флот прибрежной зоны"
 CHI_a_green_water_navy_desc: "Мы должны сосредоточиться на разработке малых кораблей, которые мы можем позволить себе построить. Эти корабли хорошо подойдут для защиты вод вблизи дома."
  
 CHI_recruit_a_new_rocn_minister: "Нанять нового министра ВМС Китайской Республики"
 CHI_recruit_a_new_rocn_minister_desc: "Несмотря на отсутствие у нас военно-морского флота, Чэнь Шаокуань показал многообещающие способности командовать и возглавлять флот. Его следует нанять в качестве нашего будущего министра ВМС Китайской Республики."
  
 CHI_republic_of_china_navy_academy: "Военно-морская академия Китайской Республики"
