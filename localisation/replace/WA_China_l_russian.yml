 CHI_lessons_from_the_northwest: "Уроки Северо-Запада"
 CHI_lessons_from_the_northwest_desc: "Этнические меньшинства Северо-Запада являются экспертами в ведении войны в суровых горных пустынях своей родины. Мы можем использовать это, чтобы создать собственный отряд горных стрелков специального назначения."
  
 CHI_specialized_weaponary: "Специализированное вооружение"
 CHI_specialized_weaponary_desc: "Наша война с Японией раскрыла горькую правду о том, что мы не способны справиться с такой современной техникой, как танки или самолеты. Если мы хотим выжить, мы должны разработать соответствующие контрмеры."
  
