 CHI_whampoa_engineering_faculties: "Инженерные факультеты Вампоа"
 CHI_whampoa_engineering_faculties_desc: "Военная академия Вампоа не может полагаться только на преподавание тактики. Если наши солдаты будут использовать современное оборудование, технические специалисты должны быть достаточно подготовлены и обучены."
  
 chinese_equipment_designs: "Китайские образцы вооружения"
 chinese_equipment_designs_desc: "Выяснилось, что средства, выделенные на разработку нового оружия, были грубо растрачены коррумпированными чиновниками. Теперь, когда мы очистили нашу армию от этой гнили, мы можем работать над созданием собственных проектов."
  
 CHI_reorganization_of_the_army: "Реорганизация армии"
 CHI_reorganization_of_the_army_desc: "Армия состоит из неорганизованных и необученных подразделений. Мы должны двигаться к созданию армии, отвечающей потребностям современной китайской нации."
  
 CHI_heavy_equipment_prominance: "Упор на тяжелое вооружение"
 CHI_heavy_equipment_prominance_desc: "Хотя большая часть нашей пехоты полагается на простое оружие, такое как винтовки или мечи, наш опыт показал ценность более тяжелого оружия, такого как пулеметы и минометы. Мы должны двигаться к приобретению собственного тяжелого вооружения."
  
 CHI_artillery_introduction: "Внедрение артиллерии"
 CHI_artillery_introduction_desc: "Нашей пехоте не хватает соответствующей поддержки для ведения общевойсковой войны. Этому нельзя позволить продолжаться дальше."
  
