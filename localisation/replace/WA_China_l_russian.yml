 CHI_focus_on_multiroles: "Сосредоточиться на китайских многоцелевых самолетах"
 CHI_focus_on_multiroles_desc: "Из-за наших ограниченных ресурсов наши усилия лучше всего было бы направить на создание самолета, способного выполнять большое количество задач. Многоцелевые истребители кажутся наиболее подходящим вариантом действий."
  
