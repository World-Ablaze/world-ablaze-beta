 CHI_hanyang_steelworks: "Ханьянский металлургический завод"
 CHI_hanyang_steelworks_desc: "Сталь является основой каждой промышленно развитой страны. У нас нет ресурсов, чтобы в достаточной мере обеспечить ею нашу гражданскую и военную промышленность, поэтому мы должны строить больше сталелитейных заводов."
  
