 CHI_abandon_the_silver_standard_desc: "Остальной мир отошел от серебряного стандарта, и у нас заканчивается серебро, необходимое для обеспечения нашей собственной валюты. Мы должны перейти на новую валюту, обеспеченную золотом, если мы хотим предотвратить экономический коллапс."
  
