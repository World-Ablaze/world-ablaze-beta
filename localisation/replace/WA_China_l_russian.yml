 chi_armor.1.t: "200-я дивизия"
 chi_armor.1.d: "Наша недавняя закупка немецких, итальянских и британских танков позволила нам сформировать полноценную танковую дивизию. 200-я дивизия «Чжуанцзя Ши» станет нашим первым шагом на пути к созданию современной армии и станет основой для дальнейшего развития."
 chi_armor.1.a: "Пришло время разработать нашу танковую доктрину"
 CHI_tank_tt: "Будет развернута §Y1 танковая дивизия§! с §Y3 танковыми батальонами§! и §Y2 кавалерийскими батальонами§!."
  
 chi_armor.801.t: "Китайский вопрос"
 chi_armor.801.d: "После окончания войны против Японии все внимание возвращается к вопросу объединения Китая. Мы должны сохранять бдительность, какую бы дорогу мы ни выбрали"
 chi_armor.801.a: "Китай будет единым"
  
 chi_armor.802.t: "Инцидент с Оямой"
 chi_armor.802.d: "Вскоре после инцидента на мосту Марко Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Несмотря на то, что вина лежит на Японии, мы получили возмутительные требования по деэскалации ситуации. Мы ожидаем, что это будет дымовая завеса до тех пор, пока японская армия не сможет отправить подкрепление, и мы должны сделать то же самое."
 chi_armor.802.a: "Война уже на горизонте!"
  
 chi_armor.803.t: "Лю Сян госпитализирован"
 chi_armor.803.d: "Сообщалось, что лидер Сычуани Лю Сян заболел и отправился на лечение в больницу в Ханькоу, Ухань. Если с ним случится что-нибудь плохое, автономия Сычуани окажется под серьезной угрозой. Это опасное время для Сычуани."
 chi_armor.803.d_war: "Сообщается, что лидер Сычуани Лю Сян заболел и отправился на лечение в больницу в Чэнду, Сычуань. Если с ним случится что-нибудь плохое, автономия Сычуани окажется под серьезной угрозой. Это опасное время для Сычуани."
 chi_armor.803.a: "Тревожно."
  
 chi_armor.804.t: "Смерть Лю Сяна"
 chi_armor.804.d: "После нескольких месяцев госпитализации лидер [SIC.GetName] Лю Сян внезапно был найден мертвым в больнице. Ходят слухи, что он умер от страха, узнав об аресте Хань Фуцзюя, в то время как другие утверждают, что за его смертью стоит [CHI.GetLeader]. Однако это также означает, что в настоящее время в Сычуани существует вакуум власти. Какой следующий шаг нам следует сделать?"
 chi_armor.804.a: "Подчиниться центральному правительству."
 chi_armor.804.b: "Попросить центральное правительство назначить нового губернатора Сычуани."
  
 chi_armor.805.t: "Сычуань требует нового губернатора после смерти Лю Сяна"
 chi_armor.805.d: "После нескольких месяцев госпитализации в Ханькоу лидер [SIC.GetName] Лю Сян внезапно был найден мертвым в больнице. А теперь его последователи в Сычуани требуют нового губернатора и хотели бы, как и раньше, оставаться автономными. Какие меры мы должны принять в ответ?"
 chi_armor.805.a: "Нет, вместо этого мы интегрируем Сычуань."
 chi_armor.805.b: "Чжан Цюнь будет назначен новым губернатором."
  
 chi_armor.806.t: "Чжан Цюнь назначен новым губернатором провинции Сычуань."
 chi_armor.806.d: "Центральное правительство приняло нашу просьбу о назначении нового губернатора. Однако из-за глубоких связей Чжан Цюня с Гоминьданом и центральным правительством наша автономия де-факто значительно снизилась."
 chi_armor.806.a: "Быть по сему."
  
 chi_armor.807.t: "Сычуань будет интегрирована, несмотря на нашу просьбу"
 chi_armor.807.d: "Несмотря на наши последние усилия сохранить автономию Сычуани, центральное правительство все же решает поставить Сычуань под свое прямое управление."
 chi_armor.807.a: "Наконец-то воссоединились!"
  
 chi_armor.808.t: "Армия Сычуани подчиняется после смерти Лю Сяна"
 chi_armor.808.t_surrender: "Сычуаньская армия капитулировала после смерти Лю Сяна"
 chi_armor.808.d: "После нескольких месяцев госпитализации в Ханькоу лидер [SIC.GetName] Лю Сян внезапно был найден мертвым в больнице. Теперь его последователи в Сычуани подчиняются центральному правительству. Это большой шаг вперед на пути к объединенному Китаю."
 chi_armor.808.a: "Во имя Китая!"
  
 chi_armor.809.t: "Лю Сян госпитализирован"
 chi_armor.809.d: "Сообщалось, что лидер Сычуани Лю Сян заболел и отправился на лечение в больницу в Ханькоу, Ухань. Если с ним случится что-то плохое, это может стать хорошей возможностью для нас снова интегрировать Сычуань в центральное правительство. Подождем и посмотрим."
 chi_armor.809.a: "Интересно."
  
 chi_armor.810.t: "Суйюаньское наступление провалилось"
 chi_armor.810.d: "После нескольких недель битвы силы Мэнцзяна под командованием Демчугдонгруба были отброшены ополчением Шаньси. Обе стороны решили не нагнетать конфликт и подписали перемирие под контролем Японии, согласно которому статус-кво был подтвержден."
 chi_armor.810.a: "Китай показал, что Япония не непобедима!"
  
 chi_armor.811.t: "Суйюаньское наступление увенчалось успехом"
 chi_armor.811.d: "После нескольких недель боев силам Мэнцзяна под командованием Демчугдонгруба удалось отбросить ополчение Шаньси и установить контроль над Восточным Суйюанем. Обе стороны решили не обострять конфликт и подписали перемирие под контролем Японии, согласно которому провинция Суйюань отошла к Мэнцзяну."
 chi_armor.811.a: "Очередное поражение от Китая"
  
 chi_armor.812.t: "Сун Чжэюань на краю пропасти"
 chi_armor.812.d: "После крупных поражений на Севере Сун Чжэюань близок к потере контроля над всем Хэбэем, несмотря на упорные сражения в битве за Пекин. Мы можем издать следующие приказы для разрешения ситуации"
 chi_armor.812.a: "Включить армию Чжэюаня в состав Гоминьдана"
 chi_armor.812.b: "Приказать ему сражаться до последнего!"
  
 chi_armor.813.t: "Хань Фуцзюй сдается Японии!"
 chi_armor.813.d: "После недавнего вторжения Японии Хань Фуцзюй сдал японцам Шаньдун и свою армию, но, к счастью для нас, нам удалось схватить его до того, как он сбежал к японским границам. К сожалению, его армия сейчас рассеялась, и мы не в состоянии удержать ее в бою. Его нужно наказать как предателя, чтобы другим было неповадно!"
 chi_armor.813.a: "Шаньдун уязвим!"
  
 chi_armor.814.t: "Лянгуанский инцидент"
 chi_armor.814.d: "Чан Кайши по-прежнему отказывается предпринимать какие-либо практические действия в ответ на японское вторжение в Маньчжурию. Его правительство слишком некомпетентно, чтобы справиться с внешней угрозой, которую сейчас испытывает Китай. Нам нужно принять решительные меры, пока не стало слишком поздно. Но сначала нам нужно привлечь на свою сторону больше людей. Гуандунская клика будет в этом случае идеальным союзником. Объединившись, мы сможем вернуть себе нашу страну."
 chi_armor.814.a: "Искать поддержки у Гуандунской клики!"
  
 chi_armor.815.t: "Гуанси ищет поддержки против Чан Кайши"
 chi_armor.815.d: "Видя, насколько Чан Кайши некомпетентен в борьбе с японским вторжением, Новая клика Гуанси ищет у нас поддержки для нападения на нанкинское правительство Чан Кайши."
 chi_armor.815.a: "Мы поможем им свергнуть Чан Кайши."
  
 chi_armor.816.t: "Гуандунская клика соглашается"
 chi_armor.816.d: "После нескольких дней встреч и обсуждений Чэнь Цзитан и его Гуандунская армия с радостью принимают нашу просьбу. Их люди чувствуют то же, что и мы."
 chi_armor.816.a: "Отличное начало!"
  
 chi_armor.817.t: "Гуандунская клика отказывается"
 chi_armor.817.d: "Беспокоясь о японцах, Чэнь Цзитан из Гуандунской клики отказывается участвовать в нашем плане свержения Чан Кайши."
 chi_armor.817.a: "Тогда мы отменим план."
 chi_armor.817.b: "Мы будем сражаться против Чан Кайши в одиночку."
  
 chi_armor.818.t: "Создана Антияпонская армия спасения"
 chi_armor.818.d_chi: "Антияпонская Армия Спасения создана для того, чтобы настроить людей против нашего плана сокрушить коммунистов, прежде чем иметь дело с Японией. Это прямой шаг против нашего националистического правительства. Вскоре может разразиться еще одна гражданская война."
 chi_armor.818.d_gxc: "Антияпонская Армия Спасения создана для объединения людей против Кайши и его политики умиротворения в отношении Японии. Это прямой шаг против националистического правительства."
 chi_armor.818.a: "Вместе мы сила!"
 chi_armor.818.b: "Мятежники!"
  
 chi_armor.819.t: "Лянгуанский инцидент, восстание в Гуандуне"
 chi_armor.819.d: "Местные милитаристы недовольны нашим умиротворяющим отношением к японскому вторжению. Теперь Гуандунская клика призывает к свержению националистического правительства Чан Кайши."
 chi_armor.819.a: "Подкупить их офицеров и командиров, чтобы переманить их на нашу сторону и лишить противника возможности сопротивляться."
 chi_armor.819.b: "Предложить мирное соглашение и попытаться убедить их избежать нового внутреннего конфликта."
 chi_armor.819.c: "Мы подождем и посмотрим, что мы можем сделать."
  
 chi_armor.820.t: "Чан Кайши предлагает мир"
 chi_armor.820.d: "Чтобы избежать дальнейшего конфликта, нанкинское правительство Чан Кайши решило предложить мир. Какую меру нам следует принять в ответ?"
 chi_armor.820.a: "Мы примем мирное соглашение."
 chi_armor.820.b: "Мы продолжим реализацию плана."
  
 chi_armor.821.t: "Создана Антияпонская армия спасения"
 chi_armor.821.d: "Антияпонская армия спасения создана для объединения людей против Чан Кайши и его политики умиротворения в отношении Японии. Мы должны что-то сделать, пока не стало слишком поздно."
 chi_armor.821.a: "Пришло время свергнуть диктатора."
  
 chi_armor.822.t: "Офицеры и командиры Гуандунской клики переходят на другую сторону"
 chi_armor.822.d: "Огромное количество офицеров и командиров из Гуандунской клики группами присоединились к армии Чан Кайши после того, как начальник штаба авиации Хуан Гуанжуй присягнул Чан Кайши на верность. Считается, что эти офицеры и командиры негласно получили своего рода взятки от режима Чан Кайши."
 chi_armor.822.d_chi: "Огромное количество офицеров и командиров из Гуандунской клики присоединилось к нашей армии группами после того, как начальник штаба авиации Хуан Гуангрей принял наше предложение и присягнул нам на верность."
 chi_armor.822.a: "Хорошо"
 chi_armor.822.b: "Тревожно"
 chi_armor.822.c: "Сейчас мрачные времена, но мы закончим то, что начали."
 chi_armor.822.e: "Тогда мы отменим наш план."
  
 chi_armor.823.t: "Неудачная попытка подкупа"
 chi_armor.823.d: "По словам самого Хуана, Чан Кайши вчера предпринял неудачную попытку переманить на свою сторону начальника штаба авиации Хуан Гуанжуя из Гуандунской клики. Хуан Гуанжуй также заявил, что никогда не будет сражаться за режим Чан Кайши, пока тот ставит убийство китайцев выше борьбы с японцами."
 chi_armor.823.d_chi: "Офицеры и командиры наше предложение не приняли. Один из них даже сказал, что он никогда не будет сражаться за наше правительство, если мы «по-прежнему будем отдавать приоритет убийству китайцев, а не борьбе с японцами». Еще одна гражданская война может быть близка."
 chi_armor.823.a: "Этим повстанцам промывают мозги коммунисты."
 chi_armor.823.b: "Какой подонок Чан!"
 chi_armor.823.c: "Какой подонок Чан!"
  
 chi_armor.824.t: "Лянгуанский инцидент, восстание Новой клики Гуанси"
 chi_armor.824.d: "Местные милитаристы недовольны нашим умиротворяющим отношением к японскому вторжению. Теперь Новая клика Гуанси призывает к свержению националистического правительства Чан Кайши."
 chi_armor.824.a: "Подкупить их офицеров и командиров, чтобы переманить их на нашу сторону и лишить противника возможности сопротивляться."
 chi_armor.824.b: "Предложить мирное соглашение и попытаться убедить их избежать нового внутреннего конфликта."
 chi_armor.824.c: "Уничтожить этих повстанцев!"
  
 chi_armor.825.t: "Антияпонская армия спасения расформирована"
 chi_armor.825.d: "После поворота событий в политическом противостоянии и региональном конфликте Антияпонская армия спасения, сформированная Новой кликой Гуанси, теперь расформирована. Надеемся, теперь они научатся сотрудничать."
 chi_armor.825.a: "Очередного внутреннего конфликта удалось избежать."
  
 chi_armor.826.t: "[WTT_current_china_leader.GetLeader] предлагает мир"
 chi_armor.826.d: "Видя, что Китай на данный момент не может позволить себе еще одну гражданскую войну, [WTT_current_china_leader.GetLeader] и его нанкинское правительство решили предложить мир и готовы загладить вину. Они обещают, что примут решительные меры против непосредственной угрозы со стороны Японии."
 chi_armor.826.a: "Мы примем мирное соглашение."
 chi_armor.826.b: "Мы продолжим реализацию нашего плана."
  
 chi_armor.827.t: "Чан Кайши называет Антияпонскую армию спасения «прокоммунистическими повстанцами»"
 chi_armor.827.d: "В своей недавней речи Чан Кайши назвал недавно сформированную Антияпонскую армию спасения «прокоммунистическими повстанцами». Он даже заявил, что эти группы лишь дестабилизируют Китай, и подтвердил свою позицию: сначала объединить Китай, а уже потом заниматься Японией."
 chi_armor.827.a: "Пришло время свергнуть диктатора."
  
 chi_armor.828.t: "Офицеры и командиры Новой клики Гуанси переходят на другую сторону"
 chi_armor.828.d: "Огромное количество офицеров и командиров Новой клики Гуанси группами присоединяются к армии Чан Кайши после того, как Бай Чунси, одна из ключевых фигур Новой клики Гуанси, присягнул Чан Кайши на верность. Считается, что эти офицеры и командиры негласно получили своего рода взятки от режима Чан Кайши."
 chi_armor.828.d_chi: "Огромное количество офицеров и командиров клики Новой Гуанси группами присоединяются к нашей армии после того, как одна из ключевых фигур клики Новой Гуанси Бай Чунси принял наше предложение и присягнул нам на верность."
 chi_armor.828.a: "Хорошо"
 chi_armor.828.b: "Настали мрачные времена. Тогда мы отменим атаку."
  
 chi_armor.829.t: "Неудачная попытка подкупа"
 chi_armor.829.d: "По словам самого Бая, Чан Кайши вчера предпринял неудачную попытку переманить на свою сторону генерала Бай Чунси из Новой клики Гуанси. Бай также сказал, что никогда не будет сражаться за режим Чан Кайши, пока тот ставит убийство китайцев выше борьбы с японцами."
 chi_armor.829.d_chi: "Офицеры и командиры наше предложение не приняли. Бай Чунси даже сказал, что он никогда не будет сражаться за нас, если мы по-прежнему «будем отдавать приоритет убийству китайцев, а не борьбе с японцами». Еще одна гражданская война может быть близка."
 chi_armor.829.a: "Этим повстанцам промывают мозги коммунисты."
 chi_armor.829.b: "Какой подонок Чан!"
  
 chi_armor.830.t: "[GXC.GetNameDef] принимает мирное предложение Чан Кайши"
 chi_armor.830.d: "Учитывая неминуемую войну с японцами, Ли Цзунжэнь и Бай Чунси из [GXC.GetNameDef] решили принять мирное соглашение, предложенное Чан Кайши, и отменить план начала гражданской войны."
 chi_armor.830.a: "Тогда никакой войны в этом году."
  
 chi_armor.831.t: "Новая клика Гуанси приняла мирное предложение"
 chi_armor.831.d: "После нескольких дней обсуждений и переговоров Ли Цзунжэнь и Бай Чунси из [GXC.GetNameDef] наконец решили принять наше мирное предложение."
 chi_armor.831.a: "Отличные новости!"
  
 chi_armor.832.t: "Новая клика Гуанси отказалась от мирного предложения"
 chi_armor.832.d: "Наше правительство и армия Ли Цзунжэня не смогли прийти к соглашению в ходе мирных переговоров. Война с милитаристами теперь неизбежна."
 chi_armor.832.a: "Пришло время объединить Китай."
  
 chi_armor.833.t: "Первые всеобщие выборы"
 chi_armor.833.d: "После созыва Учредительного собрания и официального оформления Национального собрания проводятся новые выборы для избрания новой администрации республики. Это будут первые общенациональные выборы, проводимые в Китае. Из-за политических потрясений, произошедших в Китае после Второй мировой войны, некоторые считают это важной вехой на пути к миру и процветанию, в то время как другие считают, что это может еще больше дестабилизировать китайское руководство. Однако одно можно сказать наверняка: вот-вот начнется новая глава истории Китайской Республики."
 chi_armor.833.a: "Да здравствует демократия!"
  
 chi_armor.834.t: "[Root.GetLeader] из [Root.GetNeutralParty] победил на выборах!"
 chi_armor.834.d: "Кандидат от [Root.GetNeutralParty] [Root.GetLeader] одержал победу на первых президентских выборах Китайской Республики. [Root.GetLeader], давний лидер партии, руководивший Китаем во время войны Сопротивления, является опытным и закаленным деятелем, способным управлять этой страной. Возглавляемая им администрация должна принести национальное единство и стабильность в Китай."
 chi_armor.834.a: "Новое будущее ждет Китай!"
  
 chi_armor.835.t: "Сунь Фо из [Root.GetNeutralParty] выиграл выборы!"
 chi_armor.835.d: "Кандидат от [Root.GetNeutralParty] Сунь Фо одержал победу на первых президентских выборах Китайской Республики. Сунь Фо, сын Сунь Ятсена, является хорошо образованным джентльменом и опытным дипломатом, внесшим значительный вклад в развитие Республики. Возглавляемая им администрация должна принести в Китай мир и цивилизованность."
 chi_armor.835.a: "Новое будущее ждет Китай!"
  
 chi_armor.836.t: "Вэн Вэньхао из [Root.GetDemocraticParty] выиграл выборы!"
 chi_armor.836.d: "Кандидат от [Root.GetDemocraticParty] Вэн Вэньхао одержал победу на первых выборах президента Китайской Республики. Будучи одной из самых важных фигур в разработке Конституции, Вэн Вэньхао является убежденным конституционалистом, но также и социал-демократом. Возглавляемая им администрация должна принести Китаю процветание и демократию."
 chi_armor.836.a: "Новое будущее ждет Китай!"
  
 chi_armor.837.t: "Сюй Фулинь из [Root.GetDemocraticParty] выиграл выборы!"
 chi_armor.837.d: "Кандидат от [Root.GetDemocraticParty] Сюй Фулинь одержал победу на первых президентских выборах Китайской Республики. Будучи одним из соучредителей [Root.GetDemocraticParty] и старшим членом Тунмэнхуэй, организации, которая спровоцировала Синьхайскую революцию, Сюй Фулинь является сострадательным патриотом, выступавшим против иностранной агрессии, совершаемой против народа Китая. Возглавляемая им администрация должна принести национальное единство и стабильность в Китай."
 chi_armor.837.a: "Новое будущее ждет Китай!"
  
 chi_armor.838.t: "Чжан Лань из [Root.GetDemocraticParty] выиграл выборы!"
 chi_armor.838.d: "Кандидат от [Root.GetDemocraticParty] Чжан Лань одержал победу на первых президентских выборах Китайской Республики. Будучи основателем и председателем Китайской демократической лиги, Чжан Лань является убежденным сторонником демократии и образования для простых людей. Возглавляемая им администрация должна принести в Китай прогресс и демократию."
 chi_armor.838.a: "Новое будущее ждет Китай!"
  
 chi_armor.839.t: "Шэнь Цзюньжу из [Root.GetDemocraticParty] победил на выборах!"
 chi_armor.839.d: "Кандидат от [Root.GetDemocraticParty] Шэнь Цзюньжу одержал победу на первых президентских выборах Китайской Республики. Будучи одним из «семи джентльменов», выступавших против правления Гоминьдана, когда Китай переживал кризис, Шэнь Цзюньжу является важной фигурой в Демократической лиге Китая. Возглавляемая им администрация должна принести Китаю прогресс и процветание."
 chi_armor.839.a: "Новое будущее ждет Китай!"
  
 chi_armor.840.t: "Начало гражданской войны в Китае"
 chi_armor.840.d_lose: "Слух о нашей войне против коммунистов распространился по всему Китаю. В ответ мы стали свидетелями массовой оппозиции этой войне, причем многие из нашего населения питают симпатии к коммунистам. Чем скорее мы сможем выиграть эту войну, тем скорее мы сможем принести мир и стабильность в Китай, даже если для этого нам придется сражаться с собственным населением."
 chi_armor.840.d_equal: "Слух о нашей войне с коммунистами распространился по всему Китаю. В ответ мы увидели неоднозначную реакцию, поддержку получили обе стороны. Чем скорее мы выиграем эту войну, тем скорее мы сможем принести мир и стабильность в Китай."
 chi_armor.840.d_win: "По всему Китаю распространилась молва о нашем справедливом стремлении уничтожить [PRC.GetName] раз и навсегда. В ответ мы наблюдаем всплеск поддержки со всего Китая, поскольку мы устраняем большую угрозу безопасности Китая."
 chi_armor.840.a: "Эти коммунистические отбросы!"
 chi_armor.840.b: "Мы принесём мир в Китай!"
 chi_armor.840.c: "Настало время Китаю объединиться!"
  
 chi_armor.843.t: "Вернуться к нашему советскому партнерству?"
 chi_armor.843.d: "Наши товарищи терпят крупные поражения в своей войне, и мы рискуем еще больше втянуться в нее и потенциально проиграть. Теперь у нас есть возможность выйти из Советского Союза и снова самим определять свой курс. Стоит ли нам ею воспользоваться?"
 chi_armor.843.a: "Наш суверенитет превыше всего!"
 chi_armor.843.b: "Мы все еще в безопасности с Советами..."
  
 chi_armor.844.t: "[SIK.GetName] выходит из Советского Союза"
 chi_armor.844.d: "\nНаши недавние поражения пошатнули волю нашего нового члена Советского Союза, и теперь [SIK.GetName] хочет покинуть Советский Союз. Как бы предательски это ни было, момент выбран так, что отправка войск поставила бы нас в еще худшее положение, чем то, в котором мы сейчас находимся."
 chi_armor.844.a: "Мы не можем остановить их!"
 chi_armor.844.b: "Нельзя просто так взять и выйти из Союза..."
  
 chi_armor.845.t: "[SOV.GetName] позволяет нам уйти!"
 chi_armor.845.d: "Советский Союз, к нашему большому облегчению, осознал, что мы не стоим усилий по насильному удержанию в составе СССР. Теперь, когда мы снова свободны, мы можем либо действовать в одиночку, либо обратиться к Китаю за новым союзом."
 chi_armor.845.a: "Нам следует обратиться к Китаю"
 chi_armor.845.b: "Остаться в одиночестве — наш лучший вариант"
  
 chi_armor.846.t: "[SOV.GetName] требует, чтобы мы остались!"
 chi_armor.846.d: "[SOV.GetName] недоволен нашим выходом из СССР и угрожает применением силы, если мы продолжим идти по этому пути."
 chi_armor.846.a: "Наверняка они блефуют!"
 chi_armor.846.b: "Мы не можем рисковать войной..."
  
 chi_armor.847.t: "Попытка захвата Синьцзяна?"
 chi_armor.847.d: "В связи с недавним уходом Синьцзяна из Советского Союза у нас появилась возможность послать НРА в Синьцзян и самим захватить контроль над страной. Если мы попытаемся это сделать, наши шансы будут во многом зависеть от того, сколько сил мы сможем направить на это."
 chi_armor.847.a: "Отправить НРА."
 chi_armor.847.b: "План слишком рискованный..."
  
 chi_armor.848.t: "[SIK.GetName] требует выхода из Советского Союза!"
 chi_armor.848.d: "\nНесмотря на нашу угрозу интервенции в случае выхода Синьцзяна из Советского Союза, они все равно настаивают на своем. Это явно предательский поступок, и они испытают на себе наш гнев."
 chi_armor.848.a: "Давайте сделаем это быстро!"
  
 chi_armor.849.t: "[CHI.GetAdjective]ая попытка захватить нашу страну провалилась!"
 chi_armor.849.d: "После того как мы недавно обрели свободу, Китай послал НРА захватить нашу страну и администрацию. К счастью для нас, наши военные смогли отразить эти попытки, и НРА ушла."
 chi_armor.849.a: "Едва пронесло!"
  
 chi_armor.850.t: "Наша попытка захватить Синьцзян потерпела неудачу"
 chi_armor.850.d: "К сожалению, у нас не было достаточного количества людей, чтобы гарантировать успех этой операции, и Синьцзян остался независимым."
 chi_armor.850.a: "Попытаться стоило!"
  
 chi_armor.851.t: "[CHI.GetName] захватывает нашу страну!"
 chi_armor.851.d: "После того, как мы недавно обрели свободу, Китай послал НРА захватить нашу страну и администрацию, и, к сожалению, им это удалось."
 chi_armor.851.a: "Теперь наша судьба связана с Китаем..."
  
 chi_armor.852.t: "Нам удалось захватить Синьцзянский регион!"
 chi_armor.852.d: "Наши войска успешно пересекли границу Синьцзяна и захватили администрацию, теперь Синьцзян мы держим в своих руках."
 chi_armor.852.a: "Отлично!"
  
 chi_armor.853.t: "[CHI.GetName] просит защиты"
 chi_armor.853.d: "После поражения Китайской Республики Чан Кайши обратился к нам с просьбой о защите от любых дальнейших враждебных действий со стороны материкового Китая."
 chi_armor.853.a: "Мы будем их защищать!"
 chi_armor.853.b: "Китай сам по себе..."
  
 chi_armor.854.t: "Бирманская дорога"
 chi_armor.854.d: "Чтобы помочь нам в войне против Японии, Великобритания улучшила инфраструктуру и построила авиабазы вдоль нашей бирманской границы, а также наладила транзит поставок оружия."
 chi_armor.854.a: "Это наша дорога жизни!"
  
 chi_armor.855.t: "Дорога Ганьсу"
 chi_armor.855.d: "Чтобы помочь нам в войне против Японии, Советский Союз улучшил инфраструктуру в Синьцзяне и Сибэй Сань Ма и облегчил поставку оружия через эти территории."
 chi_armor.855.a: "Это наша дорога жизни!"
  
 chi_armor.856.t: "Ханойский маршрут"
 chi_armor.856.d: "Чтобы помочь в нашей войне против Японии, Франция улучшила инфраструктуру вдоль нашей границы с Индокитаем и облегчила поставку оружия через эту границу."
 chi_armor.856.a: "Это наша дорога жизни!"
  
 chi_armor.857.t: "Программа «Горб»"
 chi_armor.857.d: "Чтобы помочь нашей войне против Японии, США способствовали доставке оружия по воздуху через Аруначал-Прадеш."
 chi_armor.857.a: "Это наша дорога жизни!"
  
 chi_armor.858.t: "Офицеры убиты"
 chi_armor.858.d: "Китайская военная разведка «Цзюньтун» совершила множество убийств нашего офицерского состава. Потребуется время, чтобы ввести защитные меры и найти новых офицеров, чтобы заполнить пробелы"
 chi_armor.858.a: "Очень бесчестно"
  
 chi_armor.859.t: "[FROM.GetAdjective]ие власти требуют возвращения Чжаньцзяна"
 chi_armor.859.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 chi_armor.859.a: "Он по праву принадлежит Китаю..."
 chi_armor.859.b: "Спасибо, но мы оставим его себе"
  
 chi_armor.860.t: "[FROM.GetAdjective]ие войска покидают Чжаньцзян"
 chi_armor.860.d: "[FROM.GetAdjective]ое правительство приняло наши требования. Благодаря их здравомыслию войны удалось избежать."
 chi_armor.860.a: "Китай будет един!"
  
 chi_armor.861.t: "[FROM.GetAdjective]ие подонки отказываются!"
 chi_armor.861.d: "[FROM.GetAdjective]ое правительство отклонило наш ультиматум. Наши войска уже размещены на границе, готовые занять нашу законную землю!"
 chi_armor.861.a: "Тогда мы возьмем его силой!"
  
 chi_armor.862.t: "[FROM.GetAdjective]ие власти требуют возвращения Макао"
 chi_armor.862.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 chi_armor.862.a: "Он по праву принадлежит Китаю..."
 chi_armor.862.b: "Спасибо, но мы оставим его себе"
 chi_armor.862.c: "Организовать вывод в 1974 году"
  
 chi_armor.863.t: "[FROM.GetAdjective]ие войска покидают Макао"
 chi_armor.863.d: "[FROM.GetAdjective]ое правительство приняло наши требования. Благодаря их здравомыслию войны удалось избежать."
 chi_armor.863.a: "Китай будет един!"
  
 chi_armor.864.t: "[FROM.GetAdjective]ие подонки отказываются!"
 chi_armor.864.d: "[FROM.GetAdjective]ое правительство отклонило наш ультиматум. Наши войска уже размещены на границе, готовые занять нашу законную землю!"
 chi_armor.864.a: "Тогда мы возьмем его силой!"
  
 chi_armor.865.t: "[FROM.GetName] организует вывод в 1974 году"
 chi_armor.865.d: "[FROM.GetAdjective]ое правительство предложило нам компромисс: они согласны вернуть наши законные земли, но лишь в 1974 году. Как нам к этому отнестись?"
 chi_armor.865.a: "Это приемлемо."
 chi_armor.865.b: "Этого мало, готовьте армию!"
  
 chi_armor.866.t: "[FROM.GetAdjective]ие власти требуют возвращения Гонконга"
 chi_armor.866.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 chi_armor.866.a: "Он по праву принадлежит Китаю..."
 chi_armor.866.b: "Спасибо, но мы оставим его себе"
 chi_armor.866.c: "Организовать вывод в 1997 году."
  
 chi_armor.867.t: "[FROM.GetAdjective]ие войска покидают Гонконг"
 chi_armor.867.d: "[FROM.GetAdjective]ое правительство приняло наши требования. Благодаря их здравомыслию войны удалось избежать."
 chi_armor.867.a: "Китай будет един!"
  
 chi_armor.868.t: "[FROM.GetAdjective]ие подонки отказываются!"
 chi_armor.868.d: "[FROM.GetAdjective]ое правительство отклонило наш ультиматум. Наши войска уже размещены на границе, готовые занять нашу законную землю!"
 chi_armor.868.a: "Тогда мы возьмем его силой!"
  
 chi_armor.869.t: "[FROM.GetName] организует вывод в 1997 году"
 chi_armor.869.d: "[FROM.GetAdjective]ое правительство предложило нам компромисс: они согласны вернуть наши законные земли, но лишь в 1997 году. Как нам к этому отнестись?"
 chi_armor.869.a: "Это приемлемо."
 chi_armor.869.b: "Этого мало, готовьте армию!"
  
 chi_armor.870.t: "Падение Шаньдуна"
 chi_armor.870.d: ""
 chi_armor.870.a: "Мы должны крепко держаться"
  
 chi_armor.871.t: "Падение Нанкина"
 chi_armor.871.d: "Сегодня, после кровопролитной битвы, город Нанкин пал под ударами [JAP.GetAdjective]их армий. После того как [JAP.GetAdjective]ие отряды  достигли окраин Нанкина, его городские стены XIV века рухнули из-за артиллерийского обстрела, и вскоре [JAP.GetAdjective]ие войска успешно продвинулись через ворота Чжунхуа. Несмотря на то, что наша армия пыталась остановить продвижение врага как можно дольше, в конце концов она была вынуждена отступить.\n\nПока [JAP.GetAdjective]ие солдаты смотрят на пик Цзыцзиньшань, становится ясно, что этот важный город попал в [JAP.GetAdjective]ие руки надолго."
 chi_armor.871.a: "Катастрофа!"
  
 chi_armor.872.t: "Падение Уханя"
 chi_armor.872.d: "Ухань - место величайших битв прошлого века - пал под натиском японских войск! В народе уже поговаривают, что это "полная катастрофа", и растет ощущение, что мы находимся на пути к краху и падению нашего правления в Китае."
 chi_armor.872.a: "Это нас серьезно ослабило"
  
 chi_armor.873.t: "Потеря портовых городов"
 chi_armor.873.d: ""
 chi_armor.873.a: "Мы теперь изолированы"
  
 chi_armor.874.t: "Япония начинает мирные переговоры"
 chi_armor.874.d: "Ввиду отсутствия продвижения Японии вглубь Китая ее император приказал прекратить военные действия, чтобы избежать дальнейшего унижения. Это отличная новость для нашего режима, большая часть наших земель остается под нашим контролем, однако любое мирное соглашение прямо сейчас приведет к тому, что Япония сохранит за собой территорию, которую она уже завоевала, поэтому мы должны идти по этому пути осторожно и с учетом будущего."
 chi_armor.874.a: "Давайте закончим эту войну за столом переговоров"
 chi_armor.874.b: "Освобождение Маньчжурии – прежде всего!"
  
 chi_armor.875.t: "Китай соглашается на мирные переговоры"
 chi_armor.875.d: "Ввиду отсутствия нашего продвижения в Китае Император приказал положить конец военным действиям, чтобы избежать дальнейшего унижения. Китай принял наше мирное предложение, и мы можем сохранить любую захваченную территорию. Однако это дорого обходится нашему тылу, и армия явно потрясена этим опытом, но стремится восстановиться."
 chi_armor.875.a: "Так завершилась Вторая китайско-японская война."
  
 chi_armor.876.t: "Китай отвергает мирные переговоры"
 chi_armor.876.d: "В связи с отсутствием нашего продвижения в Китай, Император приказал положить конец военным действиям, чтобы избежать дальнейшего унижения. Однако Китай отклонил наше мирное предложение, и мы все еще находимся в состоянии войны, а поддержка внутри страны ослабевает."
 chi_armor.876.a: "Будем надеяться, что мы сможем восстановиться."
  
 chi_armor.889.t: "Наша идентичность"
 chi_armor.889.d: "Наш флаг символизирует прогрессивные идеалы, а двенадцать лучей солнца олицетворяют 12 месяцев и 12 часов, демонстрируя наш сильный дух. Однако Китай укоренен в традициях, и поэтому, двигаясь вперед, нам необходимо решить, что символизирует нас больше."
 chi_armor.889.a: "Нас должна олицетворять традиция"
 chi_armor.889.b: "Нас должен олицетворять прогресс"
 CHI_blue_tt1: "§YКитай останется жёлтым§!"
 CHI_blue_tt2: "§CКитай станет синим§!"
  
 chi_armor.896.t: "Китай начинает партизанскую войну"
 chi_armor.896.d: "Наше наступление на Китай разбило лучшие силы китайской армии. Теперь они прибегают к партизанской войне, чтобы замедлить наше продвижение к их столице. Учитывая огромные размеры страны, нас ждет затяжная война и мало средств противостоять их тактике."
 chi_armor.896.a: "Нам придется действовать методично"
 chi_guerilla_warfare_tt: "Разблокирует решения по планированию наступления в Китае"
  
 wtt_china.3.b: "Неприемлемо, вводите войска."
  
