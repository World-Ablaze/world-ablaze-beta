 CHI_crackdown_on_smuggling_desc: "Мы должны положить конец давней контрабанде наших национальных ресурсов, которая десятилетиями истощала наше богатство."
  
  
 CHI_expand_the_mines: "Расширить шахты"
 CHI_expand_the_mines_desc: "По всему Китаю разбросано множество нетронутых запасов ресурсов. Каждый из них должен быть использован ради нашей экономики и военных действий."
  
