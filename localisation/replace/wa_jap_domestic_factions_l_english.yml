l_english:
 JAP_army_name_text:0 "Imperial Army"
 JAP_navy_name_text:0 "Imperial Navy"
 JAP_shinmin_name_text:0 "Subjects"
 JAP_shinmin_attitude_status_amount:0 "[ROOT.JAP_GetShinminAttitudeLevel]"
 JAP_shinmin_attitude_up_tt:0 "The attitude of the §YSubjects§! §Gimproves§!, increasing §YWeekly War Support§! by §G+0.05%§!.\n"
 JAP_shinmin_attitude_down_tt:0 "The attitude of the §YSubjects§! §Rworsens§!, decreasing §YWeekly War Support§! by §R-0.05%§!.\n"
 JAP_shinmin_influence_status_amount:0 "[ROOT.JAP_GetShinminInfluenceLevel]"
 JAP_shinmin_influence_up_tt:0 "The §YSubjects§! become more §RInfluential§!, decreasing §YPolitical Power Gain§! by §R-0.05§!.\n"
 JAP_shinmin_influence_down_tt:0 "The §YSubjects§! become less §GInfluential§!, increasing §YPolitical Power Gain§! by §G+0.05§!.\n"
 JAP_shinmin_curb_influence:0 "Thought Criminals Protection and Surveillance Act"
 JAP_shinmin_curb_influence_desc:0 "Legislation is urgently needed to place subjects who hold dangerous ideas under the watch of the authorities."
 JAP_shinmin_curb_influence_tt:0 "The §YSubjects§! have at least §YTiny§! §YInfluence§!."
 JAP_shinmin_blackout:0 "Blackout"
 JAP_shinmin_blackout_desc:0 "Against air raids, the subjects and the neighbourhood associations should strictly keep the lights out at night."
 JAP_shinmin_blackout_tt:0 "The §YSubjects§! are §YWorried§! or Friendlier\nThis lasts §Y7 Days§! for every level of Friendliness starting at §Y14 Days§! on §YWorried§!. \nTaken now, it lasts §Y[ROOT.JAP_GetBlackoutDays] Days§!."
 JAP_shinmin_labour_service:0 "Labour Service"
 JAP_shinmin_labour_service_desc:0 "At the nation's call, the subjects must be widely put to work. If hands are found quickly, the efficiency of the factories is likely to rise as well."
 JAP_shinmin_labour_service_tt:0 "This lasts §Y14 Days§! for every level of §YInfluence§! the §YSubjects§! are below §YTotal§!, starting at §Y14 Days§! on §YTotal§!. \nTaken now, it lasts §Y[ROOT.JAP_GetLabourServiceDays] Days§!."
 JAP_navy_war_games_tt:0 "£faction_jap_kantaiha The Imperial Navy is §3Friendly§! and has Tiny §YInfluence§! or higher. \nThis will give §Y5 mastery§! in every naval track for every level of §YInfluence§! for a maximum of §Y35§!."
 JAP_Toseiha_divine_sword_desc:0 "The army at war urgently needs its ground troops and air power to work together. With that in place, its striking power at the front will grow further."
 JAP_kantaiha_naval_war_games_desc:0 "It is time to gather battleships, carriers, escorts and submarines and train them together. As they learn to work as one, the navy's proficiency should rise greatly."
 JAP_Zaibatsus_fund_r_and_d_desc:0 "The capital of the Zaibatsu should be turned to the work of technical innovation. Facilities will expand and new techniques take root at the same time."
 JAP_Zaibatsus_issue_material_contracts_desc:0 "New supply contracts must be agreed with the Zaibatsu to get the most out of the factories and dockyards. A large rise in output is expected."
 JAP_Zaibatsus_yasuda_desc:0 "To put the weary national economy back on its feet, there is nothing for it but to rely on the financial strength of Yasuda."
 JAP_Zaibatsus_toyota_desc:0 "A large order placed with Toyota should quickly secure a good number of military vehicles."
 JAP_Zaibatsus_sumitomo_desc:0 "To ease the shortage of housing in the cities, the building work should be entrusted to Sumitomo. New civilian factories are expected to follow."
 JAP_Zaibatsus_mitsui_desc:0 "To strengthen the industrial base of Kanto, the capital of Mitsui should be brought in. With factories and dockyards in place, it will without doubt become the heart of the nation's industry."
 JAP_army_divine_sword_tt:0 "£faction_jap_toseiha  The §YImperial Army§! is §CLoyal§! and has Tiny §YInfluence§! or higher. \nThis lasts §Y7 Days§! for every level of §YInfluence§!. \nTaken now, it lasts §Y[ROOT.JAP_GetDivineSwordDays] Days§!."
 JAP_zaibatsu_fund_r_and_d_tt:0 "£faction_jap_zaibatsus  §YZaibatsus§! are §CLoyal§! and have Tiny §YInfluence§! or higher. \nThis lasts §Y20 Days§! for every level of §YInfluence§! to a maximum of §Y140 Days§!. \nTaken now, it lasts §Y[ROOT.JAP_GetZaibatsuDecisionDays] Days§!."
 JAP_zaibatsu_issue_material_contracts_tt:0 "£faction_jap_zaibatsus  §YZaibatsus§! are §3Friendly§! and have Tiny §YInfluence§! or higher. \nThis lasts §Y20 Days§! for every level of §YInfluence§! to a maximum of §Y140 Days§!. \nTaken now, it lasts §Y[ROOT.JAP_GetZaibatsuDecisionDays] Days§!."
