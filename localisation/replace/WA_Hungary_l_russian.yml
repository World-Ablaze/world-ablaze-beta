 HUN_hungarian_national_defence_association: "Венгерская ассоциация национальной обороны"
 HUN_hungarian_national_defence_association_desc: "Венгерская ассоциация национальной обороны, или M.O.V.E, — военизированное крайне правое движение, получившее известность после Первой мировой войны. Они продвигают фашистскую политику и способствуют более тесному сближению с Германским рейхом, но могут быть перенаправлены на более полезные цели."
  
