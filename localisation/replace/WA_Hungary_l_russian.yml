 HUN_probe_the_romanians_desc: "У нас длинная граница с Румынией, и у нас есть исторические претензии на Трансильванию. Существует большое количество потенциальных горячих точек, где наши силы могут столкнуться в любой момент. Для нас это создает возможность проверить реакцию [ROM.GetAdjective]ого правительства на незначительную провокацию."
  
