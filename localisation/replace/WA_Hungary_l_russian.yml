 HUN_strongarm_the_south: "Надавить на Юг"
 HUN_strongarm_the_south_desc: ""
  
 HUN_claim_transylvania: "Претендовать на Трансильванию и Буковину"
 HUN_claim_transylvania_tt: "\n§Y[ROM.GetName]§! может уступить §Gмирно§!, если наша военная мощь превышает §Y100%§! от их, и наши силы готовы на границе."
  
 HUN_limited_war: "Вступление в войну по этим причинам приведет к §YОграниченной войне§!. Если враг не состоит в альянсе, он не присоединится к ней, и война закончится, когда будут достигнуты вышеуказанные цели. Это не приведет к аннексии и тотальной войне, как обычно."
  
 HUN_deal_with_the_southern_flank: "Разобраться с южным флангом"
 HUN_deal_with_the_southern_flank_desc: ""
  
 HUN_negotiate_with_the_entente: "Переговоры с бывшей Антантой"
 HUN_negotiate_with_the_entente_desc: "Некоторые бывшие члены Антанты, такие как §Y[FRA.GetName]§!, в настоящее время гарантируют независимость некоторых балканских образований, возникших в результате Версальского договора. Возможно, небольшое денежное стимулирование в эти нестабильные экономические времена изменит ситуацию."
 HUN_negotiate_with_the_entente_tt: "Наличие высоких §Yдипломатических отношений§! §Gувеличит§! шансы на успех дипломатического запроса."
  
 HUN_call_on_the_rome_protocol: "Апеллировать к Римскому протоколу"
 HUN_call_on_the_rome_protocol_desc: ""
 HUN_call_on_the_rome_protocol_tt: "\nПри выполнении этого фокуса §Gуменьшит§! §YМировую напряженность§!, необходимого для выполнения фокуса §YБледское соглашение§!."
 HUN_call_on_the_rome_protocol_tt_2: "Наличие высоких §Yдипломатических отношений§! §Gувеличит§! шансы на успех дипломатического запроса. Публично правящий Габсбург §Rуменьшит§! шансы на успех дипломатического запроса, но это может быть §Gскомпенсировать§!, если выполнить фокус §YТорговые сделки с Италией§!."
  
 HUN_hydroelectric_expansion: "Расширение гидроэлектростанций"
 HUN_hydroelectric_expansion_desc: "С возвращением элитного правящего класса венгров в Империю в нашем распоряжении появляется больше ликвидности. Проект национального улучшения, такой как расширение гидроэнергетической отрасли, теперь может финансироваться без зависимости от банков."

