 HUN_diet_of_hungary: "Сейм Венгрии"
 HUN_diet_of_hungary_desc: "Исконный сейм Венгрии является основным национальным собранием, ответственным за всю законодательную деятельность, не связанную с монархией. Как правило, в нём чрезмерно представлено венгерское население Империи, и он подчиняется правящему монарху."
  
  
 HUN_diet_of_hungary_2: "Сейм Венгрии (секретно)"
 HUN_diet_of_hungary_2_desc: "Исконный сейм Венгрии является основным национальным собранием, ответственным за всю законодательную деятельность, не связанную с монархией. Как правило, в нём чрезмерно представлено венгерское население Империи, и он подчиняется правящему монарху."
  
 HUN_assemble_a_new_ministry_2: "Собрание нового министерства (секретно)"
 HUN_assemble_a_new_ministry_2_desc: "Хотя регентство Хорти было благородным, для управления страной потребуются новые министры-легитимисты. Теперь скрывающиеся политические монархисты могут вернуться в центр внимания, чтобы возглавить страну под руководством короля."
  
 HUN_counter_the_fatherland_front_2: "Противодействие Отечественному фронту (Секретно)"
 HUN_counter_the_fatherland_front_2_desc: "Отечественный фронт в Австрии представляет собой прямую угрозу воссоединению. Их фашистскому влиянию на нацию необходимо противостоять любой ценой. Наш единственный выход — вести собственную подрывную деятельность, чтобы повлиять на ситуацию в наших интересах."
  
 HUN_return_of_the_elites: "Возвращение элиты"
 HUN_return_of_the_elites_desc: "После падения Империи правящий класс венгерской элиты был по большей части рассеян и отвергнут странами, восставшими из пепла. С возвращением Габсбургов у элиты появится шанс вновь использовать своё богатство и статус на благо Империи."
  
 HUN_return_of_the_elites_2: "Возвращение элиты (Секретно)"
 HUN_return_of_the_elites_2_desc: "После падения Империи правящий класс венгерской элиты был по большей части рассеян и отвергнут странами, восставшими из пепла. С возвращением Габсбургов у элиты появится шанс вновь использовать своё богатство и статус на благо Империи."
  
 HUN_empire_propaganda: "Имперская пропаганда"
 HUN_empire_propaganda_desc: "Население Венгрии в целом боялось новой войны с момента падения Империи после Первой мировой войны. Чтобы вернуть былую славу, населению нужен некий... стимул, чтобы начать думать в правильном направлении."
  
 HUN_empire_propaganda_2: "Имперская пропаганда (секретно)"
 HUN_empire_propaganda_2_desc: "Население Венгрии в целом боялось новой войны с момента падения Империи после Первой мировой войны. Чтобы вернуть былую славу, населению нужен некий... стимул, чтобы начать думать в правильном направлении."
  
 HUN_buffer_states: "[HUN.GetName] — буферное государство"
 HUN_buffer_states_desc: "Единственная задача буферного государства — стоять между двумя врагами. Хотя на бумаге они достаточно нейтральны с точки зрения международных отношений, всегда есть кто-то, кто на самом деле правит ими."
  
 HUN_ethnically_diverse_military: "Многонациональная армия"
 HUN_ethnically_diverse_military_desc: "Как это было во время и до Первой мировой войны, многонациональная Империя приведет к появлению многонациональной армии. Это вызывает проблемы, когда командование отдаёт приказы на одном языке, а войска, получающие их, говорят на другом."
  
 HUN_payments_to_france: "Платежи для [FRA.GetName]"
 HUN_payments_to_france_desc: "Заставить [FRA.GetName] принять наше предложение по Балканам обошлось недешево. В ближайшем будущем мы будем производить регулярные выплаты для выполнения нашей части сделки."
  
 HUN_payments_to_uk: "Выплаты для [ENG.GetName]"
 HUN_payments_to_uk_desc: "Заставить [ENG.GetName] принять наше предложение по Балканам обошлось недешево. В ближайшем будущем мы будем производить регулярные выплаты для выполнения нашей части сделки."
  
 HUN_the_secret_habsburg_king: "Тайный король Габсбургов"
 HUN_the_secret_habsburg_king_desc: "После окончания Первой мировой войны и падения Империи право Габсбургов на власть было аннулировано. Чтобы избежать международного кризиса, правление из тени с использованием марионеточного регента было бы более разумным, хотя и более трудным шагом."
  
 HUN_minority_oppression: "Угнетение меньшинств"
 HUN_minority_oppression_desc: "На протяжении сотен лет венгры правили всеми этническими меньшинствами Австро-Венгерской империи. Как с точки зрения социального класса, так и с точки зрения политического статуса, венгры пользовались преимуществами правящего этнического класса, что возмутило остальные балканские народы."
  
 HUN_imperial_integration: "Имперская интеграция"
 HUN_imperial_integration_desc: "Теперь, когда мы приветствуем различные этнические меньшинства Южной Европы с распростертыми объятиями, мы можем работать над более тесной их социальной и культурной интеграцией в Империю."
  
 HUN_imperial_integration_2: "Имперская интеграция (Секретно)"
 HUN_imperial_integration_2_desc: "Теперь, когда мы приветствуем различные этнические меньшинства Южной Европы с распростертыми объятиями, мы можем работать над более тесной их социальной и культурной интеграцией в Империю."
  
 three_year_plan: "Трехлетний план"
 
