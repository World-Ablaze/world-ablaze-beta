 HUN_gyorshadtest: "Gyorshadtest - Быстрый корпус"
 HUN_gyorshadtest_desc: "Силы быстрого удара позволят нам реализовать наши прорывные доктрины, и в них следует вложиться до того, как мы вступим в войну."
 HUN_gyorshadtest_tt: "Будут получены §Y2 элитные моторизованные бригады§!\n"
  
 HUN_form_an_armoured_division: "Сформировать бронетанковую дивизию"
 HUN_form_an_armoured_division_desc: "Концентрация различных элементов наших мобильных сил в единых танковых дивизиях повысит их эффективность в бою."
 HUN_form_an_armoured_division_tt: "Будет получена §YЭлитная средная танковая дивизия§!\n"
  
 HUN_antiaircraft_troops: "Зенитные войска"
 HUN_antiaircraft_troops_desc: "Чтобы защитить венгерскую родину от воздушных атак противника, мы должны создать тяжелые зенитные огневые точки."
  
 HUN_domestic_tank_designs: "Отечественные конструкции танков"
  
 HUN_assault_guns: "Штурмовые орудия"
 HUN_assault_guns_desc: "Вместо того чтобы сосредоточиться на полноценных танках, мы будем полагаться на штурмовые орудия как на более экономичную альтернативу, которая поможет нашей пехоте совершать прорывы."
  
  
  
