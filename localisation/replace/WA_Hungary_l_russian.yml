 HUN_white_peace: "Венгрия подписывает Белый мир"
 HUN_switches_sides: "Венгрия меняет сторону"

 hun_armor.801.t: "Умер Дьюла Гёмбёш"
 hun_armor.801.d: "Гёмбёш после продолжительной болезни умер от рака яичек. Популярный номинальный деятель, который помог Венгрии выйти из экономического кризиса и, что более спорно, был сторонником национал-социализма и фашизма."
 hun_armor.801.a: "Нам понадобится подходящая замена"
  
 hun_armor.802.t: "Пал Телеки покончил жизнь самоубийством"
 hun_armor.802.d: "Пал Телеки был найден мертвым в своем доме после нашего перехода к фашизму. Все признаки указывают на самоубийство: была обнаружена записка, в которой говорилось следующее. «Мы нарушили свое слово из трусости. Нация это чувствует, и мы отбросили ее честь. Мы объединились с негодяями и станем похитителями тел! Нация отбросов. Я не стал вас удерживать. Я виноват»"
 hun_armor.802.a: "Неприятное открытие"
  
 hun_armor.803.t: "Торговля с Германией ухудшается"
 hun_armor.803.d: "После событий в Германии наши прежние инвестиции и торговые соглашения обернулись против нас из-за нашей нынешней чрезмерной зависимости от них."
 hun_armor.803.a: "Экономическая катастрофа"
  
 hun_armor.804.t: "Торговля с Италией ухудшается"
 hun_armor.804.d: "После событий в Италии наши прежние инвестиции и торговые соглашения обернулись против нас из-за нашей нынешней чрезмерной зависимости от них."
 hun_armor.804.a: "Экономическая катастрофа"
  
 hun_armor.805.t: "[HUN.GetName] отказывается от Трианонского договора!"
 hun_armor.805.d: "Венгрия недавно начала выяснять у своих соседей вопрос о пересмотре некоторых ограничений, наложенных на нее после последней войны. В частности, они хотят вновь ввести воинскую повинность и расширить военную промышленность. Венгерский аргумент заключается в том, что мир с каждым днем ​​становится все менее безопасным и что им нужна адекватная армия, чтобы защитить себя."
 hun_armor.805.a: "Мы должны вмешаться!"
 hun_armor.805.b: "Они имеют право"
  
 hun_armor.806.t: "Преемник [ROOT.GetLeader]"
 hun_armor.806.d: "Наш регент [ROOT.GetLeader], к сожалению, стареет. Проблемы со здоровьем преследуют его изо дня в день, что явно влияет на его способность принимать решения. Последнее заседание коронного совета подняло вопрос: что произойдет со страной после смерти нашего любимого регента? Как мы все знаем, наличие регента принесло стране только стабильность и процветание, и поэтому [ROOT.GetLeader] решил сохранить регентство после своей смерти. \n\nПосле небольшой речи присутствовавшие политики решили, что лучше всего будет провести голосование о том, кто станет наследником [ROOT.GetLeader]. \nПосле импровизированного анонимного голосования результат оказался вполне предсказуемым: политики коронного совета впечатляющим большинством в две трети проголосовали за то, чтобы наследником [ROOT.GetLeader] стал сын Хорти [HUN_horthy_eldest_son]. \n\nКак и ожидалось, члены совета выбрали преемником члена семьи Хорти, хотя не все, похоже, довольны результатом. Премьер-министр [HUN_prime_minister_name] высказал свое личное мнение непосредственно перед началом голосования в надежде убедить некоторых голосующих выбрать предпочитаемого им кандидата, а именно Альбрехта Франца фон Габсбурга-Тешена, который в начале 1930-х годов претендовал на венгерский престол, но отступил в пользу Отто Габсбурга. \nПотрясенный предложением [HUN_prime_minister_short], [ROOT.GetLeader] немедленно потребовал провести голосование и распустил совет, как только был объявлен окончательный результат..."
 hun_armor.806.a: "Значит, Иштван."
 hun_armor.806.b: "Конечно, молодой Миклош!"
  
 hun_armor.807.t: "Съезд M.O.V.E. [GetYear] года"
 hun_armor.807.d: "Лидеры M.O.V.E в очередной раз организовали съезд, пригласив всех влиятельных политиков и бывших солдат собраться в Будапеште, чтобы обсудить будущее организации. В самой организации многие считают, что её запретят, так как [ROOT.GetLeader] не очень любит ее деятельность. \n\nПосле вступительной речи на съезде ветераны войны произнесли речи о Великой войне и будущем Венгрии. Другие говорили о том, что M.O.V.E может и должна быть более организованной группой, даже намекая на возможный захват власти в ближайшие годы, как только политическая ситуация станет более напряженной. \nВ целом, сам съезд прошел мирно, и пока обсуждались предложения некоторых посетителей о том, как улучшить организацию, мужчина в заднем ряду встал и крикнул: «Да здравствует Ронгьос Гарда!» \n\nКак бы скандально это ни казалось, эта выходка заставила все больше и больше людей встать и присоединиться к крикам. Оказалось, что на съезде в качестве слушателей присутствовали самые известные члены Ронгьос Гарда. У M.O.V.E нет проблем с Ронгьос Гарда, но, похоже, люди начинают рассматривать эти две группы как противоположности. Совершенно верно, что взгляды двух групп существенно различаются, и кажется, что люди поляризованы, поэтому нам необходимо сделать четкое заявление относительно того, какую сторону мы поддерживаем. \nСитуация обострилась, поскольку сторонники M.O.V.E начали затыкать рот сторонникам Ронгьос Гарда, и съезд был на грани того, чтобы перерасти в потасовку. \n\nСледует ли нам поддержать Ронгьос Гарда или арестовать их?"
 hun_armor.807.a: "Арестуйте их!"
 hun_armor.807.b: "Мы поддерживаем их!"
  
 hun_armor.808.t: "Слияние правых партий"
 hun_armor.808.d: "За последнее десятилетие фашизм в Венгрии пережил тяжелые времена. Возникли различные фашистские движения, которые были разгромлены администрацией Хорти. Фашистский политический ландшафт разорван на части, и если национал-социалисты хотят выжить, им отчаянно необходимо объединиться. \n\nРазличные популярные фашисты борются друг с другом за господство. К ним относятся движение «Скрещённые косы» Золтана Бёсёрмени, MNSZFMP, основанная в 1933 году Золтаном Меско, и различные небольшие партии, которые все называют себя «настоящей» MNSZP, с такими лидерами, как граф Фидель Палфи, граф Шандор Фештетич и другие. В 1934 году три лидера Меско, Палфи и Фештетич сделали первый шаг к объединению партий, подписав союз. Однако это продолжалось недолго, и Фештетич вместе с католическим священником Иштваном Балогом отправился создавать новую фашистскую партию. \n\nЕдинственный, кто способен объединить партии в одну, — это Ференц Салаши. Его харизма и ораторский талант часто напоминают слушателям Адольфа Гитлера, что обеспечило ему множество последователей во всех партиях. Сначала он поглотит группу Балога, с которым у него уже есть тесная связь. Затем он постепенно возьмет под свой зонтик одну за другой другие партии, сохраняя при этом право голоса и идентичность каждой отдельной партии в рамках новой партии, которая будет называться единственной и неповторимой «Magyar Nemzeti Szocialista Párt», или «Венгерской национал-социалистической партией»."
 hun_armor.808.a: "В светлое будущее!"
  
 hun_armor.809.t: "Движение «Венгерская жизнь»"
 hun_armor.809.d: "Сегодня, среди огромной массы сторонников, [HUN_prime_minister_name] объявил о создании своего недавно основанного Движения венгерской жизни (Magyar Élet Mozgalom) в будапештском Вигадо. \n\n«Мы хотим жить новой венгерской жизнью на древней венгерской земле. Я стою здесь сейчас, как глава правительства, не для того, чтобы давать правительственную программу, а для того, чтобы искать и представлять великие идеологические цели, которые объединяют в духе радикальной правой политики реформ, помогая тем самым обрести эту новую венгерскую жизнь. Подобно тому, как легендарный олень привел нас на нашу новую родину, мы начнем с просветительской идеи, которая означает сегодняшнюю новую венгерскую жизнь. Венгерские братья, поймите и услышьте, чего мы хотим: новой Венгрии, националистического общества, военного духа, расового самосознания, расовой защиты, духовной реформы, т. е. христианской морали, жертвенности. Социальной реформы, т. е. построения социальной справедливости, полезности служения нации, экономической реформы, венгерской земли для венгров, борьбы с бедностью, уважения к труду, общественной чистоты, венгерской жизни!» \n\nЭто были слова вступительной речи [HUN_prime_minister_short], которые ошеломили аудиторию, а затем заставили её встать и аплодировать [HUN_prime_minister_short]. Заметно счастливый, [HUN_prime_minister_short] тем самым сделал большой шаг к полному контролю, и хотя [ROOT.GetLeader] не смог его остановить, он внимательно следит за [HUN_prime_minister_short]. Насколько движение вырастет в последующие месяцы и годы, сомнительно, но можно сказать наверняка, что он получил значительную поддержку. До нас дошли сообщения, что хунгаристы недовольны этим новым движением и готовятся к идеологической войне против новой угрозы..."
 hun_armor.809.a: ""
  
 hun_armor.810.t: "Фашистский марш на Будапешт!"
 hun_armor.810.d: "Мы объединили все партии и организовались, чтобы сформировать новое правительство, требующее, чтобы Хорти ушел с поста регента и передал власть народу. Чтобы закрепить наш ультиматум, был организован марш с целью насильственного свержения Хорти, но у ворот Будапешта располагался значительный военный гарнизон.\n За этим последовала кровавая бойня, и теперь в стране разразилась полномасштабная гражданская война. Пришло время взять бразды правления страной в свои руки и повести за собой народ!"
 hun_armor.810.a: "Долой регентство!"
  
 hun_armor.811.t: "Конец гражданской войны"
 hun_armor.811.d: "Хорти поставлен на место, и мы завоевали венгерский трон!"
 hun_armor.811.a: "Пришло время преобразовать Венгрию"
  
 hun_armor.820.t: "[HUN.GetName] требует Словакию"
 hun_armor.820.d: ""
 hun_armor.820.a: "Мы не можем отказаться"
 hun_armor.820.b: "Им придется прийти и забрать это."
  
 hun_armor.821.t: "[FROM.GetName] принимает наши требования"
 hun_armor.821.d: ""
 hun_armor.821.a: "Наш первый шаг к восстановлению Великой Венгрии"
  
 hun_armor.822.t: "[FROM.GetName] отклоняет наши требования"
 hun_armor.822.d: ""
 hun_armor.822.a: "Тогда мы возьмем её силой"
  
 hun_armor.823.t: "[HUN.GetName] требует Банат и Воеводину"
 hun_armor.823.d: ""
 hun_armor.823.a: "Небольшая цена, которую нужно заплатить, чтобы избежать уничтожения"
 hun_armor.823.b: "Неприемлемо"
  
 hun_armor.824.t: "[FROM.GetName] принимает наши требования"
 hun_armor.824.d: ""
 hun_armor.824.a: "Сильная позиция, которую нужно удерживать"
  
 hun_armor.825.t: "[FROM.GetName] отклоняет наши требования"
 hun_armor.825.d: ""
 hun_armor.825.a: "Наши военные могут взять их силой"
  
 hun_armor.826.t: "[HUN.GetName] требует Хорватию"
 hun_armor.826.d: ""
 hun_armor.826.a: "У нас нет возможности отказать"
 hun_armor.826.b: "Венгрия заходит слишком далеко!"
  
 hun_armor.827.t: "[FROM.GetName] принимает наши требования"
 hun_armor.827.d: ""
 hun_armor.827.a: "Теперь мы можем строить корабли!"
  
 hun_armor.828.t: "[FROM.GetName] отклоняет наши требования"
 hun_armor.828.d: ""
 hun_armor.828.a: "Как мы и думали, поднимем знамя войны"
  
 hun_armor.829.t: "[HUN.GetName] требует Бургенланд"
 hun_armor.829.d: ""
 hun_armor.829.a: "Это незначительная земля"
 hun_armor.829.b: "Абсурд, мы должны быть готовы"
  
 hun_armor.830.t: "[FROM.GetName] принимает наши требования"
 hun_armor.830.d: ""
 hun_armor.830.a: "Еще один шаг к нашим целям"
  
 hun_armor.831.t: "[FROM.GetName] отклоняет наши требования"
 hun_armor.831.d: ""
 hun_armor.831.a: "Жаль. Готовьте армию"
  
 hun_armor.832.t: "[HUN.GetName] требует Трансильвании"
 hun_armor.832.a: "Это позволит навсегда избежать конфликта с Венгрией"
 hun_armor.832.b: "Нелепо"
  
  
  
 hun_armor.835.t: "Венгерская провокация на нашей границе"
 hun_armor.835.d: "В рамках поддержания демаркационной линии на границе между нами и [HUN.GetNameDef] была отправлена рабочая группа для проверки демаркационных знаков возле Оради. При подходе к границе рабочая группа подверглась обстрелу со стороны местной венгерской заставы. \n\nМы подали официальный дипломатический протест, но посол Венгрии утверждает, что рабочую группу послали переместить знаки, чтобы мы могли претендовать на большую территорию.\n\nВенгры заверили нас, что будут уважать границу, но не допустят какого-либо «вмешательства» в текущую демаркацию и ответят силой, если мы попытаемся это сделать.\n\n Фактически это означает, что мы больше не можем свободно передвигаться по нашей территории в этом районе."
 hun_armor.835.a: "Неприемлемо"
  
 hun_armor.836.t: "Победа Венгрии при Ораде"
 hun_armor.836.d: "Сообщается, что после столкновения между [ROM.GetAdjective]ими и венгерскими войсками в приграничном районе вокруг Оради [ROM.GetAdjective]ие силы полностью отступают. Венгерские подразделения заняли ряд стратегических холмов в этом районе и начали укреплять свои позиции.\n\nВ ходе боя венгры захватили несколько [ROM.GetAdjective]их танков, которые были отправлены в Будапешт для оценки."
 hun_armor.836.a: "Мы решили этот вопрос с честью"
 hun_armor.836.b: "Мы должны подготовить соответствующий ответ"
  
 hun_armor.837.t: "Венгерское поражение при Ораде"
 hun_armor.837.d: "После столкновения между [ROM.GetAdjective]ими и венгерскими войсками в приграничном районе вокруг Оради посол Венгрии в Будапеште потребовал прекращения огня. \n\nНесколько венгерских атак на [ROM.GetAdjective]ие позиции провалились с тяжелыми потерями во время боя, что вызвало обеспокоенность венгерских вооруженных сил по поводу возможностей их сил."
 hun_armor.837.a: "Лучше потерпеть неудачу с честью, чем вообще не пытаться"
 hun_armor.837.b: "Наши силы хорошо зарекомендовали себя"
  
 hun_armor.838.t: "Тупик в Ораде"
 hun_armor.838.d: "Боевые действия между венгерскими и [ROM.GetAdjective]ими силами вокруг Оради утихли после того, как обе стороны покинули спорный регион для перегруппировки и пополнения запасов. Признавая бесполезность дальнейших наступлений, венгерские военные предложили прекратить огонь и начать переговоры об установлении границы."
 hun_armor.838.a: "Мы получили ценный опыт"
  
 hun_armor.839.t: "Эскалация в Ораде"
 hun_armor.839.d: "Продолжаются бои между венгерскими и [ROM.GetAdjective]ими силами вокруг Оради. Пытаясь выйти из тупика, венгерские войска в других районах также начали вступать в бой с [ROM.GetAdjective]ими силами на этом участке. Разведка предполагает, что венгры могут вскоре усилить атаку свежими войсками, переброшенными из других частей своей территории."
 hun_armor.839.a: "Мы должны удержать позиции"
  
 hun_armor.840.t: "Эскалация в Ораде"
 hun_armor.840.d: "Продолжаются бои между [FROM.GetAdjective]ими и [HUN.GetAdjective]ими силами вокруг Оради. Пытаясь выйти из тупика, [FROM.GetAdjective]ие силы в других районах также начали вступать в бой с [HUN.GetAdjective]ими войсками в этом секторе. Разведка предполагает, что [FROM.GetNameDef] вскоре может усилить атаку свежими войсками, переброшенными из других частей своей страны."
 hun_armor.840.a: "Мы должны подготовиться к атаке!"
  
 HUN_probed_romanians: "Румыны протестированы"
  
 hun_armor.841.t: "[POL.GetFactionName] требует территорий"
 hun_armor.841.d: ""
 hun_armor.841.a: "Умиротворение может помочь избежать войны"
 hun_armor.841.b: "Наша целостность должна быть сохранена"
  
 hun_armor.842.t: "[FROM.GetName] принимает наши требования"
 hun_armor.842.d: ""
 hun_armor.842.a: "Отлично"
  
 hun_armor.843.t: "[FROM.GetName] отклоняет наши требования"
 hun_armor.843.d: ""
 hun_armor.843.a: "Тогда мы возьмем их силой"
  
 hun_armor.844.t: "[FROM.GetNameDefCap] стремится присоединиться к альянсу '[ROOT.GetFactionName]'"
 hun_armor.844.d: "Хотя [FROM.GetNameDef] сейчас состоит в одном блоке с государством [romania_former_ally_target.GetNameDef], изменения в [FROM.GetAdjective]ом правительстве привели нацию в большее соответствие с [ROOT.GetAdjective]ими идеалами, а [FROM.GetLeader] выразил заинтересованность в присоединении к альянсу '[ROOT.GetFactionName]'. Это историческая возможность: враг повернулся к [FROM.GetNameDef] спиной, и последнее, чего он может ожидать, — это то, что [FROM.GetAdjective]ие войска повернут против него свои орудия."
 hun_armor.844.a: "Добро пожаловать, [FROM.GetAdjective]ие друзья!"
  
 hun_armor.845.t: "[FROM.GetNameDefCap] предает [ROOT.GetNameDef]!"
 hun_armor.845.desc: "К сожалению, [FROM.GetAdjective]ий министр иностранных дел передал послание государства [FROM.GetNameDef], которое, вне всякого сомнения, является прямым предательством идеалов альянса '[ROOT.GetFactionName]' и [ROOT.GetRulingIdeology]! [FROM.GetAdjective]ое правительство заявило, что теперь будет бороться за [romania_new_ally_target.GetFactionName]."
 hun_armor.845.a: "Мы должны были знать, что [FROM.GetLeader] нельзя доверять!"
  
 hun_armor.846.t: "[romania_new_ally_target.GetNameDefCap] принимает!"
 hun_armor.846.d: "Нам сообщили, что [romania_new_ally_target.GetNameDef] принял нашу просьбу о вступлении в [romania_new_ally_target.GetFactionName], и вскоре [romania_former_ally_target.GetLeader] узнает, как сражается настоящий [ROOT.GetAdjective]ий солдат."
 hun_armor.846.a: "К оружию!"
  
 hun_armor.847.t: "Советский Союз принимает мир"
 hun_armor.847.d: ""
 hun_armor.847.a: "Мы чудом избежали беды"
  
 hun_armor.848.t: "Советский Союз требует верности"
 hun_armor.848.d: ""
 hun_armor.848.a: "Мы вынуждены подчиниться"
 hun_armor.848.b: "Мы не можем принять эти условия"
  
 hun_armor.849.t: "Советский Союз отвергает мир!"
 hun_armor.849.d: ""
 hun_armor.849.a: "Мы находимся в опасной ситуации..."
 hun_armor.849.b: "Попробуем обратиться к союзникам"
  
 hun_armor.850.t: "Вопрос о Трансильвании"
 hun_armor.850.d: "В связи с потерей территории Румынии иностранными державами перед нами открылась прекрасная возможность..."
 hun_armor.850.a: "Давайте встретимся с оккупантами лицом к лицу!"
 hun_armor.850.b: "Мы должны позволить Германии быть арбитром здесь"
 hun_armor.850.c: "Пришло время двигаться дальше"
 may_lead_to_war_with_romania: "§RМожет привести к войне с Румынией§!"

 hun_armor.851.t: "[HUN.GetName] требует Трансильванию"
 hun_armor.851.d: "Недавние территориальные потери подтолкнули венгров к требованию передачи Трансильвании! Они считают нас слабыми и неспособными победить в потенциальном конфликте, необходимо дать ответ."
 hun_armor.851.a: "Пусть они попробуют взять её!"
 hun_armor.851.b: "Мы не в том положении, чтобы ссориться из-за этого..."

 hun_armor.852.t: "[ROM.GetName] отвергает наши требования"
 hun_armor.852.d: ""
 hun_armor.852.a: "Ударим, пока они слабы!"

 hun_armor.853.t: "[ROM.GetName] принимает наши требования"
 hun_armor.853.d: ""
 hun_armor.853.a: "Знаменательный результат!"

 hun_armor.854.t: "[HUN.GetName] просит об арбитраже по поводу Трансильвании"
 hun_armor.854.d: "Венгры стремятся урегулировать вопрос о потерянных после Первой мировой войны территориях и видят возможность отвоевать часть их у Румынии. Они обратились к нам в надежде избежать прямой конфронтации. Мы должны сделать это в ближайшее время, чтобы [HUN.GetName] не подумал, что мы отложили этот вопрос."
 hun_armor.854.a: "Давайте посмотрим, что нужно сделать"

 hun_armor.855.t: "[GER.GetName] отказывается быть арбитром в вопросе Трансильвании"
 hun_armor.855.d: "Поскольку наши требования сочли лишь домыслами, нам остается самим решать вопрос с Трансильванией."
 hun_armor.855.a: "Значит, будем сражаться"
 hun_armor.855.b: "Тогда мы отступим"

 hun_armor.856.t: "[HUN.GetName] Sends Peace terms to [ROM.GetName]"
 hun_armor.856.d: "Наша битва за Трансильванию обернулась для нас полным провалом, и теперь нам грозит унизительное поражение. Мы должны запросить мир, пока не потеряли контроль над всей страной."
 hun_armor.856.a: "Все кончено, давайте искать мир"

 hun_armor.857.t: "[ROM.GetName] Sends Peace terms to [HUN.GetName]"
 hun_armor.857.d: "Наша битва за Трансильванию привела нас к поражению, и теперь мы столкнулись с возможным полномасштабным вторжением в нашу страну. Мы знаем, что венгры стремятся лишь вернуть Трансильванию, поэтому мы можем запросить мир."
 hun_armor.857.a: "Все кончено, давайте искать мир"

 hun_armor.858.t: "Патовая ситуация на фронте"
 hun_armor.858.d: "Последние 4 месяца наша битва за Трансильванию ни к чему не привела, и мы, и [ROM.GetName] устали от сражений. Наши люди ожидали быстрой победы, но поскольку она не пришла, лучший вариант - сохранить лицо и вернуться более сильными."
 hun_armor.858.a: "Все кончено, давайте искать мир"
  
 DOD_hungary.10.desc: "В связи с недавними драматическими изменениями в политическом ландшафте Балкан вопрос о наших отношениях с новой Австро-Венгерской империей поднимался неоднократно. Сегодня посол Венгрии вручил официальную ноту, в которой официально просит нас заявить о своей позиции по отношению к Империи. Габсбурги утверждают, что целью их Новой империи является более дружественное сотрудничество на Балканах."
 DOD_hungary.10.b: "Мы объединимся как союзники"
  
 DOD_hungary.12.t: "[CZE.GetName] соглашается на сближение"
 DOD_hungary.12.desc: "Соблюдая тщательный баланс между республиканской и монархической фракциями в своем правительстве, [CZE.GetLeader] решил принять наше предложение. [CZE.GetName] присоединится к нам в качестве союзника, прокладывая путь к более единым Балканам."
 DOD_hungary.12.a: "Великолепно"
 DOD_hungary.13.t: "[CZE.GetNameDefCap] отвергает наши предложения"
 DOD_hungary.13.a: "Это прискорбно"
  
 hun_armor.786.t: "[HUN.GetName] запрашивает дипломатическую поддержку"
 hun_armor.786.desc: "[HUN.GetName] уже много лет хочет перевооружиться, чтобы реализовать «право на самооборону». Таким образом, приближается встреча, которая состоится в Бледе. Несмотря на то, что написано в Римских протоколах, нас не пригласили. [HUN.GetName] уверяет нас, что мы будем приглашены и скажем свое слово в балканских делах, если мы предложим им полную дипломатическую поддержку."
 hun_armor.786.a: "Мы заслуживаем права голоса"
 hun_armor.786.b: "Нас мало волнуют вопросы Балкан"
  
 hun_armor.787.t: "[ITA.GetName] принимает наш запрос"
 hun_armor.787.desc: "Как мы и подозревали, [ITA.GetName] очень хотел бы иметь право голоса в делах на Балканах. Обращение к Римским протоколам с целью гарантировать, что они станут частью предстоящего Бледского соглашения, с нашей стороны, должно обеспечить для нас очень благоприятный результат."
 hun_armor.787.a: "В конце концов, для этого и нужны союзники."
  
 hun_armor.788.t: "[ITA.GetName] отказывается"
 hun_armor.788.desc: "[ITA.GetName], похоже, имеет другие, более насущные дела, чем заботы о раздорах между балканскими странами. К сожалению, с их отказом Римские протоколы теряют силу, а их влияние в Восточной Европе сведено на нет."
 hun_armor.788.a: "Возможно, им следовало сделать более разумный выбор."
  
 hun_armor.789.t: "[HUN.GetName] предлагает сделку"
 hun_armor.789.desc: "[HUN.GetName] утверждает, что последние пару десятилетий после Первой мировой войны они были образцовой балканской нацией. Таким образом, они чувствуют, что балканские соседи загоняют их в угол и замышляют их гибель. Запросив разрешение защищаться, они готовы предложить сделку. Они помогают нашему тяжелому экономическому положению, и мы лишаем балканские страны гарантий независимости."
 hun_armor.789.a: "В любом случае мы не могли позволить себе вмешательство в дела Балкан..."
 hun_armor.789.b: "[HUN.GetName] больше никогда не будет ничего завоёвывать"
  
 hun_armor.790.t: "[FROM.GetName] принимает наше предложение"
 hun_armor.790.desc: "Наша информация была верной, [FROM.GetName], и ее тяжелое экономическое положение лишило их возможности защищать балканские творения после Первой мировой войны. В сочетании с предложением смягчить это положение, оно оказалось слишком хорошим, чтобы они могли отказаться."
 hun_armor.790.a: "Отлично..."
  
 hun_armor.791.t: "[FROM.GetName] отвергает нашу сделку"
 hun_armor.791.desc: "Хотя мы были правы относительно сложной экономической ситуации, в которой находится [FROM.GetName], нашего предложения было недостаточно, чтобы повлиять на них. Возможно, пришло время проверить их приверженность и решимость защищать наших соседей."
 hun_armor.791.a: "Тяжелые времена создают сильных людей, верно?"
  
 hun_armor.792.t: "[HUN.GetName] требует возвращения в Империю"
 hun_armor.792.desc: "[HUN.GetName] восстал из пепла под предводительством [HUN.GetLeader]. Таким образом, теперь они требуют нашего возвращения в Империю, поскольку наша земля раньше принадлежала Короне. Хотя отказ от нашей свободы — это серьезная задача, в Европе действуют и другие силы, которые могут быть более опасными..."
 hun_armor.792.a: "Это для общего блага"
 hun_armor.792.b: "Нами больше никогда не будут править"
  
 hun_armor.793.t: "[CZE.GetName] подчиняется"
 hun_armor.793.desc: "[CZE.GetName] принял наше любезное предложение мирно вернуться в мир. Благодаря их промышленной мощи и опыту в области вооружений мы будем в лучшем положении для оставшейся части нашего европейского завоевания."
 hun_armor.793.a: "С возвращением, братья"
  
 hun_armor.794.t: "[CZE.GetName] отказывается"
 hun_armor.794.desc: "[CZE.GetName] отказался от нашего весьма щедрого предложения мирно вернуться в королевство. Их промышленная мощь и опыт в области вооружений необходимы для остальной части нашего европейского завоевания, поэтому у нас нет другого выбора, кроме как захватить его силой."
 hun_armor.794.a: "Вперёд, солдаты, в Богемию!"
  
 hun_armor.796.t: "[ROM.GetName] соглашается на сближение"
 hun_armor.796.desc: "Соблюдая тщательный баланс между республиканской и монархической фракциями в своем правительстве, [ROM.GetLeader] решил принять наше предложение. [ROM.GetName] присоединится к нам в качестве союзника, прокладывая путь к более единым Балканам."
 hun_armor.796.a: "Великолепно"
  
 hun_armor.797.t: "[ROM.GetNameDefCap] отвергает наши предложения"
 hun_armor.797.desc: "[ROM.GetNameDefCap] отказался принять какое-либо соглашение или соглашение, касающееся их будущих отношений с нами. Когда наш посол прибыл в министерство иностранных дел, чтобы обсудить переданную им ранее официальную ноту, ему сказали, что говорить не о чем, и быстро вывели за дверь. [ROM.GetAdjective]ий посол в нашем правительстве заявил, что, хотя его правительство желает мирных и дружественных отношений между нашими народами, нет возможности включить [ROM.GetNameDef] в состав Австро-Венгерской империи."
 hun_armor.797.a: "Это прискорбно."
  
 hun_armor.799.t: "[POL.GetName] соглашается на сближение"
 hun_armor.799.desc: "Соблюдая тщательный баланс между республиканской и монархической фракциями в своем правительстве, [POL.GetLeader] решил принять наше предложение. [POL.GetName] присоединится к нам в качестве союзника, прокладывая путь к более единым Балканам."
 hun_armor.799.a: "Великолепно"
  
 hun_armor.800.t: "[POL.GetNameDefCap] отвергает наши предложения"
 hun_armor.800.desc: "[POL.GetNameDefCap] отказался принять какое-либо соглашение или соглашение, касающееся их будущих отношений с нами. Когда наш посол прибыл в министерство иностранных дел, чтобы обсудить переданную им ранее официальную ноту, ему сказали, что говорить не о чем, и быстро вывели за дверь. [POL.GetAdjective]ий посол  в нашем правительстве заявил, что, хотя его правительство желает мирных и дружественных отношений между нашими народами, нет возможности включить [POL.GetNameDef] в состав Австро-Венгерской империи."
 hun_armor.800.a: "Это прискорбно."
 
 HUN_fighter_competition_tt: "Выдает лицензии на истребители"
 HUN_heavy_fighter_competition_tt: "Выдает лицензии на тяжелые истребители"