 HUN_border_conflict_warning_ROM: "Пограничная провокация на венгерской границе"
 HUN_border_conflict_warning_ROM_desc: "На нашей общей границе в Трансильвании произошло столкновение между нашими пограничниками и венгерскими солдатами. Источники в разведке в Венгрии сообщают, что это может быть лишь первым шагом в более масштабной конфронтации. Нам следует немедленно укрепить границу с Венгрией."
  
 HUN_border_conflict_escalation_warning_ROM: "Венгерские приготовления"
 HUN_border_conflict_escalation_warning_ROM_desc: "Воздушная разведка подтвердила крупные перемещения войск на венгерской стороне границы. Мы не знаем, решили ли венгры нанести удар, и если да, то когда, но мы должны быть готовы."
  
 HUN_border_incident_forgotten: "Удобный момент"
 HUN_border_incident_forgotten_desc: "Если мы хотим использовать инцидент на румынско-венгерской границе, мы должны нанести быстрый удар."
  
 HUN_escalate_incident_to_border_conflict_ROM: "Эскалация инцидента"
 HUN_escalate_incident_to_border_conflict_ROM_desc: "Похоже, что румыны не отступают. На этом этапе мы должны либо перейти к вооруженной конфронтации, либо отступить сами."
  
 HUN_border_conflict_time_until_cancelled: "Покончить с конфликтом"
 HUN_border_conflict_time_until_cancelled_desc: "При нынешних темпах мы сможем поддерживать боевые действия лишь до тех пор, пока нам не понадобится прекратить бой."
  
 HUN_border_conflict_escalate_conflict: "Эскалация конфликта"
 HUN_border_conflict_escalate_conflict_desc: "Конфликт на границе с [FROM.GetNameDef] зашел в тупик. Возможно, продолжая эскалацию и направляя на театр военных действий больше войск, мы все же сможем добиться победы."
  
 HUN_border_conflict_escalate_to_war: "Объявить войну"
 HUN_border_conflict_escalate_to_war_desc: "Бои в спорном регионе продолжаются уже некоторое время, и конца им не видно. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как первый шаг ко всеобщей войне."
  
 HUN_border_conflict_back_out_of_conflict: "Отступить"
 HUN_border_conflict_back_out_of_conflict_desc: "Опасность того, что этот конфликт выйдет из-под контроля и перерастет в полномасштабную войну между нашими странами, просто слишком велика. Нам следует остановиться, пока потери не выросли, и прощупать почву для переговоров с другой стороной."
 rom_hun_border_conflict_won: "Опыт пограничных столкновений в Корее:0"
  
 HUN_change_sides_to_allies: "Присоединиться к Странам-Союзникам"
 HUN_change_sides_to_allies_desc: "Изменения в нашем правительстве способствовали изменению нашей позиции в войне. Когда мы присоединимся к союзникам, наши нынешние «товарищи» в этом глобальном конфликте будут сбиты с толку, ведь румынские пули найдут новую цель."
 HUN_change_sides_to_commintern: "Вступить в Коминтерн"
 HUN_change_sides_to_commintern_desc: "Изменения в нашем правительстве способствовали изменению нашей позиции в войне. Когда мы вступим в Коммунистический Интернационал, наши нынешние «товарищи» в этом глобальном конфликте будут сбиты с толку, ведь румынские пули найдут новую цель."
 HUN_change_sides_to_axis: "Присоединиться к Оси"
 HUN_change_sides_to_axis_desc: "Изменения в нашем правительстве способствовали изменению нашей позиции в войне. Когда мы присоединимся к Оси, наши нынешние «товарищи» в этом глобальном конфликте будут сбиты с толку, ведь румынские пули найдут новую цель."
 HUN_change_sides: "Сменить сторону"
  
 HUN_the_price_of_secrecy: "Цена секретности"
 HUN_the_price_of_secrecy_desc: "Сохранять в тайне возвращение принца Габсбурга на трон Венгрии, мягко говоря, непросто. Чем дольше продолжается этот фарс, тем больше усилий потребуется для сохранения тайны и, следовательно, тем дороже это обойдется. Это может продолжаться бесконечно... до тех пор, пока вы готовы платить за это цену..."
 HUN_modify_sh_ns_intro_tt: "Изменить §YТайный король Габсбургов§! на:\n"
 HUN_the_price_of_secrecy_tt: "$HUN_modify_sh_ns_intro_tt$£political_power_texticon  Ежедневная стоимость политической власти: §R+0.10§! \n£stability_texticon  Стабильность: §R-2.00%§! \n£boost_popularity_texticon  Ежедневная поддержка нейтралитета: §R-0.01§!\n"
 HUN_the_price_of_secrecy_tt_2: "Удалить §YТайный король Габсбургов§!\n"
 HUN_the_price_of_secrecy_tt_3: "Выбор этого варианта до завершения фокуса §YИскупить Империю§! ИЛИ наличие не менее §Y100%§! военной мощи по сравнению с §Y[CZE.GetName]§! и §Y[YUG.GetName]§! приведет к немедленному §Rобъявлению войны с их стороны§!."
  
 HUN_outlast_the_invasion: "Выстоять против вторжения"
 HUN_outlast_the_invasion_desc: "Хотя §Y[CZE.GetName]§! и §Y[YUG.GetName]§! заявили, что их цель — свергнуть нашего нового монарха, [HUN.GetLeader], они надеются на быстрое и решительное поражение Габсбургов. Если мы сможем продержаться и доказать, что это вторжение экономически неосуществимо, мы сможем добиться прекращения огня."
 HUN_outlast_the_invasion_tt: "Контролировать §YБудапешт§! в течение всего срока выполнения задания"
 
