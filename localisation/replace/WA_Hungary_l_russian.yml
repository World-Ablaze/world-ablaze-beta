 HUN_territorial_economic_integration: "Территориальная экономическая интеграция"
 HUN_territorial_economic_integration_desc: "По мере расширения наших территориальных границ экономический капитал на наших новых территориях должен быть интегрирован в нашу экономику. Это улучшит состояние нашей экономики."
  
 HUN_central_managment_board: "Центральный совет управления"
  
 HUN_faith_in_the_regency: "Вера в Регентство"
 HUN_faith_in_the_regency_desc: "Хорти провел нашу страну через гражданские войны и экономические потрясения. Продолжение веры в него будет означать дальнейшее выживание нашей страны в надвигающемся шторме."
  
 HUN_dissolve_the_nationalist_assembly: "Распустить Национальное собрание"
 HUN_dissolve_the_nationalist_assembly_desc: "Национальное собрание представляет собой старые угли демократии, которая подвела нацию. Пришло время распустить последние остатки и передать все полномочия Регентству."
  
 HUN_crush_the_scyth_cross: "Раздавить «Коса-Крест»"
 HUN_crush_the_scyth_cross_desc: "«Коса-Крест» отличалась особой жестокостью по сравнению с другими фашистскими движениями. Они нуждаются в нашем непосредственном внимании, чтобы лидеры движения были найдены и арестованы."
  
 HUN_handle_the_move: "Разобраться с M.O.V.E."
 HUN_handle_the_move_desc: "В предыдущие годы беспорядков пришлось пойти на множество компромиссов с фашистами, чтобы сохранить стабильность в стране. Частично это было связано с привлечением членов фашистских движений к нашей национальной обороне. Однако с ростом влияния хортистов мы можем ликвидировать это экстремистское движение."
  
 HUN_a_one_party_state: "Однопартийное государство"
 HUN_a_one_party_state_desc: "Любая партия, выступающая против Регентства, выступает против Венгрии и должна быть распущена, чтобы позволить Хорти беспрепятственно руководить страной."
  
 HUN_arrest_the_extremists: "Арестовать экстремистов"
 HUN_arrest_the_extremists_desc: "Различные фашистские движения остаются угрозой стабильности страны. Быстрые аресты обезглавят эту змею."
  
 HUN_embers_the_monarchy: "Угли монархии"
 HUN_embers_the_monarchy_desc: "Будущее Венгрии всегда было неопределенным. Мы произнесем краткую речь и внесем поправки в конституцию, чтобы позволить Хорти или одному из его потомков быть коронованным новым королем, когда придет время."
  
 HUN_expand_the_vitezi_rend: "Расширить Витези Ренд"
 HUN_expand_the_vitezi_rend_desc: "Витези Ренд был основан как институт рыцарского характера, и многие наши генералы принадлежат к нему. Расширяя эту организацию для предоставления военного опыта, мы можем обучать ее членов, чтобы они стали более эффективными лидерами и бойцами."
  
 HUN_hungarian_fraternal_community: "Венгерское братское сообщество"
 HUN_hungarian_fraternal_community_desc: "Венгрию и Польшу связывает крепкое братство, построенное на протяжении веков. Открытая граница между нашими двумя странами увеличит миграцию рабочих и народов, укрепляя эту связь."
 HUN_hungarian_fraternal_community_tt: "§RСтабильность уменьшится на -30%§! в случае войны с Польшей. §YБудет удалено, если Польши не существует или она капитулировала§!\n"
  
