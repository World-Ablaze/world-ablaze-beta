l_russian:
 HUN_the_rightward_path: "Правый путь"
 HUN_the_rightward_path_desc: "Чтобы вывести нас из кризиса, мы должны развивать торговлю с нашими соседями, делая границы более открытыми. Это поможет связать наши народы со старыми отраслями промышленности бывшей империи и, следовательно, создать больше рабочих мест и богатства для нас самих."
  
 HUN_trade_deals_with_germany: "Торговые сделки с Германией"
 HUN_trade_deals_with_germany_desc: "Германия быстрыми темпами развивает свою промышленность, и наша экономика может получить большую выгоду от установления взаимных связей. Однако, если Германия станет нашим источником импорта и рынком экспорта, мы фактически привяжем себя к любым успехам или неудачам её экономики."
 HUN_trade_deals_with_germany_tt: "\n§YПривяжет нашу экономику к [GER.GetName] на следующие 6 лет. Все, что поставит это под угрозу, приведет к повышению экономической усталости на 10%§!"
  
 HUN_trade_deals_with_italy: "Торговые сделки с Италией"
 HUN_trade_deals_with_italy_desc: "Италия перевооружает свою армию. Для этого нужны ресурсы, которых у них просто нет. Открыв для них наш рынок, мы сможем извлечь выгоду из их военного бюджета, но это будет означать, что мы пострадаем, если это прекратится."
 HUN_trade_deals_with_italy_tt: "\n§YПривяжет нашу экономику к [ITA.GetName] на следующие 6 лет. Все, что поставит это под угрозу, приведет к повышению экономической усталости на 10%§!"
  
 HUN_balance_the_budget: "Сбалансировать бюджет"
 HUN_balance_the_budget_desc: "Государственные расходы слишком высоки и неэффективны. Нужна комиссия, чтобы изучить области, где мы можем сократить расходы и снизить долг."
  
 HUN_investments_from_sociatal_elites: "Инвестиции общественных элит"
 HUN_investments_from_sociatal_elites_desc: "Предлагая большие доли в национализированных отраслях, мы можем получить крупные инвестиции от самой богатой части нашего общества."
  
 HUN_the_leftward_path: "Левый путь"
 HUN_the_leftward_path_desc: "Прямое вмешательство необходимо, чтобы вывести нашу экономику из кризиса. Мы должны создавать новые отрасли промышленности и формировать спрос на их продукцию, чтобы увеличить численность рабочей силы."
  
 HUN_agricultural_land_grants: "Гранты на сельскохозяйственные земли"
 HUN_agricultural_land_grants_desc: "Необходимо выделить новые земли, чтобы освободить место для промышленного и сельскохозяйственного роста."
  
 HUN_economic_interventionism: "Экономический интервенционизм"
 HUN_economic_interventionism_desc: "Прямое вмешательство необходимо, чтобы силой вернуть экономику на путь роста. Хотя это временно увеличит затраты, экономика станет гораздо более эффективной."
  
 HUN_expand_the_technical_university_of_budapest_desc: "Нам нужно больше ярких умов, чтобы сделать прорывные открытия, которые помогут нам в будущих конфликтах. Расширяя столичный университет, мы можем увеличить резерв квалифицированных инженеров и ученых для нашей военной промышленности."
  
 HUN_nationalize_key_industries: "Национализировать ключевые отрасли промышленности"
  
 HUN_subsidise_the_lower_class: "Субсидировать низший класс"
  
 HUN_the_housing_act: "Закон о жилье"
  
 HUN_industrial_modernization: "Промышленная модернизация"
  
 HUN_a_new_synthetic_industry: "Новая синтетическая индустрия"
  
 HUN_expand_the_manfred_weiss_steel_works_desc: "Огромный сталелитейный завод Манфреда Вайса был неотъемлемым оборонным подрядчиком со времён Великой войны, и с тех пор его мощности значительно расширились. Если мы хотим увеличить наши вооруженные силы в рамках подготовки к следующей войне, гордость нашей национальной промышленности вновь придётся расширить."
  
 HUN_contract_videoton: "Контракт с «Видеотоном»"
  
 HUN_self_dependancy: "Самодостаточность"
  
 HUN_expand_nagykanizsa_oil_fields: "Расширение нефтяных месторождений Надьканижи"
 HUN_expand_nagykanizsa_oil_fields_desc: "Это немного, но нефть есть нефть. Нам нужно выжать из этой скважины все до последней капли нефти, если мы хотим иметь достаточно топлива для нашей армии."
  
 HUN_prepare_oil_stockpiles: "Подготовить запасы нефти"
  
 HUN_boost_hungarian_aviation_industry_tt: "Иметь §G400§! развернутых §Yистребителей или многоцелевых самолетов§!.\n"
  
 HUN_manfred_weiss_arms_integration: "Интеграция оружейного производства «Манфреда Вайса»"
  
