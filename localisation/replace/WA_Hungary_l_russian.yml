 HUN_theory_of_flexible_defence: "Теория гибкой защиты"
 HUN_theory_of_flexible_defence_desc: "Генерал Теофил Хароши разработал новую теорию оборонительной войны. Гибкая оборона лишь закрывала возможные пути снабжения, поэтому противник мог обойти укрепленную линию, но у каждой боевой группы без пополнения запасов быстро заканчивались боеприпасы и продовольствие."
  
