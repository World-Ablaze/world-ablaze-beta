 HUN_grenz_infantry: "Гренцерская пехота"
  
 HUN_modern_field_guns: "Современные полевые орудия"
  
 HUN_arpad_line: "Линия Арпада"
 HUN_arpad_line_tt: "Построит §Y3 укрепления§! в каждой провинции вдоль границы Трансильвании и Карпат\n"
  
 HUN_modernize_the_hdf: "Модернизация HDF"
  
 HUN_new_weapon_contracts: "Новые контракты на оружие"
  
 HUN_activate_the_hungarian_armed_forces: "Возобновить активизацию венгерских вооруженных сил"
 HUN_activate_the_hungarian_armed_forces_desc: "Венгрия больше не скована жесткими ограничениями, наложенными Трианонским договором. Мы должны немедленно начать перевооружение."
  
 HUN_Huba_I_III_desc: "Война у порога Венгрии. Мы должны ввести всеобщую воинскую повинность и мобилизовать нашу промышленность для борьбы с угрозами нашей стране. Мы не можем терпеть еще один Трианон."
  
 HUN_address_sociatal_inequalities: "Решение проблемы социального неравенства"
 HUN_address_sociatal_inequalities_desc: "Мы — нация, состоящая не только из венгров. Каждый наш гражданин должен быть признан неотъемлемой частью нашей нации, независимо от его этнической принадлежности."
  
 HUN_further_integration: "Дальнейшая интеграция"
 HUN_further_integration_desc: "Дальнейшая территориальная экспансия принесла нам ресурсы, необходимые для поддержания стабильности нашей экономики."
  
 HUN_industrial_economic_regeneration: "Промышленно-экономическое возрождение"
 HUN_industrial_economic_regeneration_desc: "С введением огромного количества заводов в нашу экономику возможность интегрировать эти предприятия значительно поможет снизить наше экономическое бремя."
  
 HUN_further_regeneration: "Дальнейшая регенерация"
 HUN_further_regeneration_desc: "Дальнейшее открытие заводов будет продолжать облегчать наши экономические проблемы."
  
 HUN_denullify_the_pragmatic_sanction_of_1713: "Восстановить прагматическую санкцию 1713 г."
 HUN_denullify_the_pragmatic_sanction_of_1713_desc: ""
  
 HUN_secret_habsburg_restoration: "Тайная реставрация Габсбургов"
 HUN_secret_habsburg_restoration_desc: "Из-за внешних сил, угрожающих Венгерскому королевству в случае возвращения Габсбургов, необходимо рассмотреть другие варианты. Наш лучший вариант — сделать Хорти королем-марионеткой, в то время как Отто фон Габсбург правит из-за кулис. Однако это будет стоить нам дорого."
 HUN_secret_habsburg_restoration_tt: "Добавит национальный дух §YТайный король Габсбургов§!, который дает (£political_power_texticon  Ежедневная стоимость политической власти:0 §R+0.10§! £stability_texticon  Стабильность:0 §R-2.00%§!)."
 HUN_secret_habsburg_restoration_tt_2: "Начнется повторяющаяся миссия §YЦена секретности§!. Пока Габсбурги правят тайно, стоимость сохранения этой тайны периодически будет §Rувеличиваться§!. Её можно отменить в любое время, но если сделать это слишком рано, это приведет к §Rобъявлению войны§! бывшими австро-венгерскими государствами: §Y[CZE.GetName]§! и §Y[YUG.GetName]§!."
 HUN_secret_habsburg_restoration_tt_3: "\nЛюбые политические §YНациональные духи§!, добавленные в это дерево, дадут только §Rполовину§! бонуса из-за §YТайного короля Габсбургов§!."
  
 HUN_right_the_wrongs_of_history: "Исправить ошибки истории"
 HUN_right_the_wrongs_of_history_desc: ""
  
 HUN_invite_the_habsburg_prince_tt: "Возвращение правящего монарха из династии Габсбургов заставит бывшие австро-венгерские государства §Y[CZE.GetName]§! и §Y[YUG.GetName]§! немедленно §Rобъявить войну§!, чтобы свергнуть его, ЕСЛИ ТОЛЬКО мы не будем иметь по крайней мере §Y100%§! от их военной мощи."
  
 HUN_his_majestys_responsible_government: "Ответственное правительство Его Величества"
 HUN_his_majestys_responsible_government_desc: ""
  
 HUN_restore_the_original_diet: "Восстановить исконный сейм"
 HUN_restore_the_original_diet_desc: "Исконный сейм Венгрии является основным национальным собранием, ответственным за всю законодательную деятельность, не связанную с монархией. Как правило, в нём чрезмерно представлено венгерское население Империи, и он подчиняется правящему монарху."
  
 HUN_assemble_a_new_ministry: "Собрать новое министерство"
 HUN_assemble_a_new_ministry_desc: "Хотя регентство Хорти было благородным, для управления страной потребуются новые министры-легитимисты. Теперь скрывающиеся политические монархисты могут вернуться в центр внимания, чтобы возглавить страну под руководством короля."
  
 HUN_rip_up_the_treaty_of_trianon: "Разорвать Трианонский договор"
 HUN_rip_up_the_treaty_of_trianon_desc: ""
  
 HUN_counter_the_fatherland_front: "Противодействие Отечественному фронту"
 HUN_counter_the_fatherland_front_desc: "Отечественный фронт в Австрии представляет собой прямую угрозу воссоединению. Их фашистскому влиянию на нацию необходимо противостоять любой ценой. Наш единственный выход — вести собственную подрывную деятельность, чтобы повлиять на ситуацию в наших интересах."
 HUN_counter_the_fatherland_front_tt: "Дух §YПротиводействие Отечественному фронту§! будет §Rудален§!, как только §Y[AUS.GetName]§! перестанет существовать."
  
 HUN_demand_a_referendum_tt: "Завершение направления §YРеинтеграция железных дорог§! и наличие высоких §YДипломатические отношения§! с §Y[AUS.getname]§! §Gувеличит§! шансы на успех референдума."
  
 HUN_integrate_austria: "Интегрировать Австрию"
 HUN_integrate_austria_desc: ""
  
 HUN_fortify_against_external_threats: "Укрепление против внешних угроз"
 HUN_fortify_against_external_threats_desc: ""
  
 HUN_redeem_the_empire: "Искупить Империю"
 HUN_redeem_the_empire_desc: "В нашу задачу не входит повторение трагедий первой Австро-Венгерской империи. Мы извлекли уроки из своих ошибок и будем работать над созданием единой и равноправной конфедерации балканских народов."
  
 HUN_reintegrate_czechsoslovakia: "Реинтегрировать Чехословакию"
 HUN_reintegrate_czechsoslovakia_desc: "Чехословакия является домом для значительной части промышленности поздней Австро-Венгерской империи. Для наших государственных интересов жизненно важно вернуть и реинтегрировать эти заводы."
 HUN_reintegrate_czechsoslovakia_tt: "\n§Y[CZE.GetName]§! могут уступить §Gмирно§! если наша военная мощь будет больше, чем §Y100%§! от их, и у нас будут готовы силы на границе."
  
 HUN_avoid_the_mistakes_of_the_past: "Избежать ошибок прошлого"
 HUN_avoid_the_mistakes_of_the_past_desc: ""
  
 HUN_fight_for_bucharest: "Бой за Бухарест"
 HUN_fight_for_bucharest_desc: ""
  
 HUN_revenge_on_the_serbs: "Месть сербам"
 HUN_revenge_on_the_serbs_desc: ""
  
 HUN_repatriation_to_the_empire: "Репатриация в Империю"
 HUN_repatriation_to_the_empire_desc: ""
 HUN_repatriation_to_the_empire_tt: "Все §Y[CZE.GetNameDef]§! дизайнеры станут §Gдоступны§! для выбора"
  
 HUN_reach_the_baltics: "Добраться до Прибалтики"
 HUN_reach_the_baltics_desc: ""
  
 HUN_restoration_triumphant: "Триумфальная Реставрация"
 HUN_restoration_triumphant_desc: "Это свершилось. Вся Австро-Венгрия была восстановлена в своем законном состоянии. Однако не все наши подданные, похоже, мыслят так же, как мы. Если мы хотим полностью стабилизировать нашу империю, потребуется дальнейшее убеждение."
  
