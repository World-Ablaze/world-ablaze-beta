 PRC_fortify_our_position_desc: ""

 PRC_prepare_for_war_with_japan: "Подготовка к войне"
 PRC_prepare_for_war_with_japan_desc: "Винтовка рождает власть. – Мао"
 PRC_prepare_for_war_with_japan_tt: "Добавляет §Y4 уровень укреплений§! в Восточном Шэньси.\n"
  
 PRC_conquer_our_neighbours: "Покорение наших соседей"
 PRC_conquer_our_neighbours_desc: "Хотя мы не можем позволить себе вести войну против националистов прямо сейчас, мы можем уничтожить наших меньших соседей и расширить свое присутствие в сельской местности."
 
 PRC_social_democracy: "Социал-демократия"
 PRC_social_democracy_desc: "Революция не выживет на одних догмах. Избрав умеренный, демократический путь к социализму, мы сможем привлечь на свою сторону крестьян, рабочих и интеллигенцию, опасающихся радикальных потрясений."
 
 PRC_unite_all_chinese_communists: "Объединить всех коммунистов"
 PRC_unite_all_chinese_communists_desc: "Синьцзян является коммунистическим только по названию. Шэн Шицай должен быть свергнут, прежде чем у него появится возможность принять какое-либо опрометчивое решение."
  
 PRC_conference_of_the_central_committee: "Конференция ЦК"
 PRC_conference_of_the_central_committee_desc: "Коммунистическая революция в Китае, похоже, находится на грани краха. Мы должны определиться со своим подходом и очистить наши ряды от ревизионистов."
  
 PRC_cult_of_mao: "Культ Мао Цзедуна"
 PRC_cult_of_mao_desc: "Мао станет отцом-наставником Китая, каким был Сунь Ятсен десятилетия назад. Новая эра коммунистического Китая наступит, если мы полностью поверим нашему великому лидеру!"
  
