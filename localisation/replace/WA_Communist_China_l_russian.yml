 PRC_a_militant_state_desc: ""
  
 PRC_proclaim_the_peoples_republic_of_china: "Провозгласить Китайскую Народную Республику"
 PRC_proclaim_the_peoples_republic_of_china_desc: "Отныне наша нация принадлежит мировому сообществу и будет мужественно и трудолюбиво работать над развитием своей собственной цивилизации и благополучия и в то же время способствовать миру и свободе во всем мире. Наша страна больше не будет нацией, подвергающейся оскорблениям и унижениям. Мы встали!"
  
 PRC_institute_the_laogai_system: "Ввести систему лаогай"
 PRC_institute_the_laogai_system_desc: "Бесполезно просто сажать всех этих предателей в тюрьму только для того, чтобы они сгнили. Привлекая их к каторжным работам, мы можем использовать их время в тюрьме и, возможно, помочь им начать новую жизнь."
  
 PRC_standardization_of_modern_chinese: "Стандартизация современного китайского языка"
 PRC_standardization_of_modern_chinese_desc: "На нашей огромной территории существует множество разновидностей китайского языка, которые слишком сложны для того, чтобы наши люди могли эффективно общаться друг с другом. Для объединения нашей нации необходимо создать единый китайский язык."
  
 PRC_one_china_policy: "Политика Единого Китая"
 PRC_one_china_policy_desc: "Мы больше не нация враждующих царств. Китай может быть только один."
  
 PRC_sinkiang_issue: "Синьцзянский вопрос"
 PRC_sinkiang_issue_desc: "Шэн Шицай — коварный оппортунист, который ни в каком смысле этого слова не следует коммунизму. На его место должен прийти компетентный и лояльный лидер."
  
 PRC_integrate_tibet: "Интегрировать Тибет"
 PRC_integrate_tibet_desc: "Тибет — страна-изгой, которая по праву принадлежит Китаю. Сам Далай-лама должен быть отстранен от власти, прежде чем он вмешается в наше правление."
  
 PRC_reclaiming_treaty_ports: "Возвращение договорных портов"
 PRC_reclaiming_treaty_ports_desc: "Европейцы топтали нас, когда мы были искалечены и слабы. Каково же их удивление теперь, когда они столкнулись с разъяренным тигром."
  
 PRC_conquer_mongolia: "Покорить Монголию"
 PRC_conquer_mongolia_desc: "Советы принимают нас за дураков, которые клюнут на очередной их надоедливый «договор». Мы без борьбы отобьем у них Порт-Артур и Монголию."
  
 PRC_the_official_china: "Официальный Китай"
 PRC_the_official_china_desc: "Националисты бежали с материка и прячутся, как крысы, на своем крошечном острове. Если мы хотим уничтожить их раз и навсегда, нас необходимо признать истинными представителями Китая."
  
