 prc_armor.12.t: "Китайский вопрос"
 prc_armor.12.d: "После окончания Антияпонской войны все внимание возвращается к вопросу объединения Китая. Мы должны сохранять бдительность, какую бы дорогу мы ни выбрали"
 prc_armor.12.a: "Китай будет единым!"
  
 prc_armor.801.t: "[PRC.GetName] запрашивает более тесное сотрудничество"
 prc_armor.801.d: "\nТеперь, когда мы сформировали Единый фронт, было бы разумно наладить более тесное сотрудничество между нашими вооруженными силами, чтобы мы могли быть лучше подготовлены к внешним угрозам."
 prc_armor.801.a: "Мы принимаем!"
 prc_armor.801.b: "Это только на пользу нашим будущим врагам!"
  
 prc_armor.802.t: "[CHI.GetName] согласен на более тесное сотрудничество"
 prc_armor.802.d: "По нашему запросу наши военные начнут совместные тренировки, чтобы лучше изучить тактику друг друга."
 prc_armor.802.a: "Отлично!"
  
 prc_armor.803.t: "[CHI.GetName] отказывает в более тесном сотрудничестве"
 prc_armor.803.d: "Несмотря на то, что мы выступаем единым фронтом, [CHI.GetName] отказывается проводить совместные учения, ссылаясь на то, что это «невозможно с материально-технической точки зрения»."
 prc_armor.803.a: "Они рассматривают нас как большую угрозу..."
 CHI_PRC_coop_flag: "[CHI.GetName] разрешила совместные тренировки"
  
 prc_armor.804.t: "[PRC.GetName] просит передать китайские территории"
 prc_armor.804.d: "После наших побед в Маньчжурии наши товарищи в Китае обратились к нам с просьбой передать им наши китайские завоевания. Это укрепит союз между нашими двумя странами, и, хотя мы физически потеряем землю, мы получим в качестве союзника весь Китай."
 prc_armor.804.a: "Давайте скрепим союз!"
 prc_armor.804.b: "Все коммунисты должны объединиться под нашим флагом!"
  
 prc_armor.805.t: "[SOV.GetName] отказывает в передаче территорий"
 prc_armor.805.d: ""
 prc_armor.805.a: "В конце концов мы возьмем их силой."
  
 prc_armor.806.t: "Выбор нашей столицы"
 prc_armor.806.d: "Теперь, когда мы контролируем весь Китай, пришло время перенести нашу столицу из Яньаня в более удобный и хорошо связанный район, и таким городом будет..."
 prc_armor.806.a: "...Гуанчжоу!"
 prc_armor.806.b: "...Шанхай!"
 prc_armor.806.c: "...Пекин!"
 prc_armor.806.e: "...Нанкин!"
  
 prc_armor.807.t: "[PRC.GetName] требует аннексии!"
 prc_armor.807.d: "После ошеломляющей победы коммунистов над националистами [PRC.GetName] теперь стремится объединить весь Китай под своим знаменем. Если мы не присоединимся, нас будут считать соперником в борьбе за объединение Китая."
 prc_armor.807.a: "Настало время Китаю объединиться!"
 prc_armor.807.b: "Мы - настоящий Китай!"
  
 prc_armor.808.t: "[SIK.GetName] соглашается на аннексию!"
 prc_armor.808.d: "[SIK.GetName] образумился и присоединился к нам в рамках единого Китая."
 prc_armor.808.a: "Мы на шаг ближе..."
  
 prc_armor.809.t: "[SIK.GetName] отвергает аннексию!"
 prc_armor.809.d: "[SIK.GetName] считает себя настоящим Китаем, мы покажем им, насколько они ошибаются..."
 prc_armor.809.a: "Предатели"
  
 prc_armor.810.t: "[PRC.GetName] требует возвращения Гуанчжоуваня"
 prc_armor.810.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 prc_armor.810.a: "Мы согласны..."
 prc_armor.810.b: "Мы отвергаем!"
  
 prc_armor.811.t: "[PRC.GetName] требует возвращения Макао"
 prc_armor.811.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 prc_armor.811.a: "Мы согласны..."
 prc_armor.811.b: "Мы отвергаем!"
  
 prc_armor.812.t: "[PRC.GetName] требует возвращения Гонконга"
 prc_armor.812.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 prc_armor.812.a: "Мы согласны..."
 prc_armor.812.b: "Мы отвергаем!"
 prc_armor.812.c: "Будем придерживаться нашего договора"
  
 prc_armor.813.t: "[PRC.GetName] требует возвращения Южного Шанхая"
 prc_armor.813.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 prc_armor.813.a: "Мы согласны..."
 prc_armor.813.b: "Мы отвергаем!"
  
 prc_armor.814.t: "[PRC.GetName] требует возвращения Циндао"
 prc_armor.814.d: "Враждебное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они послали нам ультиматум!"
 prc_armor.814.a: "Мы согласны..."
 prc_armor.814.b: "Мы отвергаем!"
  
 prc_armor.815.t: "[PRC.GetName] требует возвращения Даляня"
 prc_armor.815.d: "Дружественное [FROM.GetAdjective]ое правительство требует возвращения их 'коренных земель'. Обратившись к нам по этому вопросу, они отправили нам предложение."
 prc_armor.815.a: "Мы согласны!"
 prc_armor.815.b: "Мы отвергаем!"
 prc_armor.815.c: "Мы принимаем, если Монголия будет признана."
  
 prc_armor.816.t: "[ENG.GetName] напоминает нам о Гонконгском договоре"
 prc_armor.816.d: "Британцы сослались на первоначальный договор, согласно которому Гонконг был передан британцам сроком на 100 лет. Они заявили, что будут придерживаться этих условий и требуют, чтобы мы тоже это сделали."
 prc_armor.816.a: "Это приемлемо."
 prc_armor.816.b: "Эти условия неприемлемы!"
  
 prc_armor.817.t: "[SOV.GetName] соглашается на условную передачу"
 prc_armor.817.d: "Русские согласятся на возвращение порта только в том случае, если мы признаем Монголию и откажемся от всех претензий, которые у нас есть на эту территорию."
 prc_armor.817.a: "Это приемлемо."
 prc_armor.817.b: "Эти условия неприемлемы!"
  
 PRC_hong_kong_promised: "Гонконг обещан КНР"
 PRC_sino_soviet_treaty: "Имеет китайско-советский договор"
  
 prc_armor.818.t: "[PRC.GetName] требует, чтобы мы отказались от гарантий для Тайваня"
 prc_armor.818.d: ""
 prc_armor.818.a: "Мы согласны, отношения с коммунистами важнее..."
 prc_armor.818.b: "Мы отказываемся!"
  
 prc_armor.819.t: "[FROM.GetName] сохраняют свои гарантии для Тайваня!"
 prc_armor.819.d: ""
 prc_armor.819.a: "Мы найдем другой способ"