  mountaineer_horse_batallion_line_desc:0 "Combat in mountain ranges exposes troops to many perils, but sometimes cannot be avoided. By providing our soldiers with specialized training for this environment, we can minimize these risks."
  paratrooper_horse_batallion_line:0 "Paratroopers"
  paratrooper_horse_batallion_line_desc:0 "By incorporating airborne forces into our army, we can make forced entries and position key troops in previously inaccessible areas, allowing for new tactical opportunities."

