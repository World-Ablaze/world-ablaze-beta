  light_tank_destroyer_battalion_line:0 "Light Tank Destroyer"
  light_tank_destroyer_battalion_line_desc:0 "Tank Destroyers are tanks with a larger than normal gun in a fixed mounting in place of a turret. Light Tank Destroyers are based on the chassis of Light Tanks, which means they are fairly mobile but do not carry particularly powerful guns compared to heavier TDs."
  medium_tank_destroyer_battalion_line:0 "Medium Tank Destroyer"
  medium_tank_destroyer_battalion_line_desc:0 "Tank Destroyers are tanks with a larger than normal gun in a fixed mounting in place of a turret. Medium Tank Destroyers are based on the chassis of Medium Tanks, meaning they are fairly mobile and carry respectable firepower."
  heavy_tank_destroyer_battalion_line:0 "Heavy Tank Destroyer"
  heavy_tank_destroyer_battalion_line_desc:0 "A heavy tank destroyer has the turret removed to carry an even larger gun in a fixed mounting."
  modern_tank_destroyer_battalion_line:0 "Modern Tank Destroyer"
  modern_tank_destroyer_battalion_line_desc:0 "A Modern Tank chassis fitted with a much larger gun instead of a turret."

  light_armor_battalion_line:0 "Light Tank"
  light_armor_battalion_line_desc:0 "Lightly armored tanks."
  medium_armor_battalion_line:0 "Medium Tank"
  medium_armor_battalion_line_desc:0 "Medium tanks are flexible and can do almost any job."
  heavy_armor_battalion_line:0 "Heavy Tank"
  heavy_armor_battalion_line_desc:0 "The strongest tanks with powerful armor and weapons, but slow and tactically inflexible."
  modern_armor_battalion_line:0 "Modern Tank"
  modern_armor_battalion_line_desc:0 "Modern Tanks have evolved to deal with most battlefield situations. Powerful guns and sloped armor have eliminated the need for specialized tanks."

  super_heavy_armor_battalion_line:0 "Super-Heavy Tank"
  super_heavy_armor_battalion_line_desc:0 "Super-Heavy tanks trade mobility and speed for firepower and armor beyond that of the standard Heavy Tanks."

  modern_infantry_support_company_divisional:0 "M. Inf Support Tank"
  modern_infantry_support_company_divisional_desc:0 "Infantry Support Tanks are designed for close range direct high-explosive fire, providing good soft attack especially against buildings and fortifications."
