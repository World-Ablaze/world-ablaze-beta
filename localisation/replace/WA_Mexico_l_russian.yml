 MEX_focus_northern_iron_plants: "Северные железоделательные заводы"
 MEX_focus_northern_iron_plants_desc: "Самый промышленно развитый регион Мексики за пределами столицы — это северная граница с Америкой. Города вдоль реки Рио-Гранде, такие как Матаморос и Сьюдад-Хуарес, поддерживают тесные экономические связи с соседними городами по ту сторону границы, такими как Браунсвилл и Эль-Пасо. Мы должны использовать превосходную инфраструктуру в этом районе для дальнейшего развития нашей тяжелой промышленности."
 
 