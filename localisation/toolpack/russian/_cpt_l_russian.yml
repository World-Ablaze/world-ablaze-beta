 CPT_IPP_ETT:0 "§HИмперский Протекторат§!. Марионетка должна иметь в качестве повелителя либо фашистскую Японию, либо нейтральное/фашистское Маньчжоу-Го:\nМежду §H0-2400§W £autonomy_texticon§!"
 CPT_IPA_ETT:0 "§HПартнер Империи§!. Марионетка должна иметь в качестве повелителя либо фашистскую Японию, либо нейтральное/фашистское Маньчжоу-Го:\nМежду §H2400-4000§W £autonomy_texticon§Y или между §H2400-3000§W £autonomy_texticon§Y если Маньчжоу-Го является марионеткой Японии и выполнил фокус "Ассертивность"."
 CPT_IPS_ETT:0 "§HИмперский Субъект§!. Маньчжоу-Го должно иметь фашистскую Японию в качестве владыки:\nМежду §H3000-4000§W £autonomy_texticon§!"
