 cpt.1.t:0 "Помощь"
 cpt.1.d:0 "Запутались? Позвольте объяснить, как освоить инструмент для превращения стран в марионетки.\n\nУ этого инструмента два окна: окно "Инструмент", в котором находится сам инструмент, и окно "Галерея", где показаны все возможные статусы автономии. Наведите на них курсор, чтобы увидеть требования.\n\nТеперь об инструменте. Как уже говорилось, для большинства статусов автономии нужны определённые условия. Чтобы не запутаться, вы будете видеть только доступные варианты автономии. Так что не волнуйтесь, если у Германии варианты не такие, как у Японии.\n\nЧтобы воспользоваться инструментом, сначала нажмите на регион страны, которую хотите сделать марионеткой. Отметьте её кнопкой отметки, а затем нажмите на регион страны, которая должна стать сюзереном. Наконец, выберите один из вариантов, чтобы установить отмеченной стране этот статус автономии.\n\nКнопкой "Освободить страну" можно освободить либо все отмеченные страны, либо страну, на регион которой вы нажали.\n\n\nЕсли вы хотите сделать доброе дело и заметили какие-либо ошибки (в основном наложения, отсутствие доступных вариантов или результаты, отличающиеся от выбранных), пожалуйста, сообщите о них в разделе "Баги и проблемы" в мастерской.\n\nВ любом случае приятного использования CPT."
