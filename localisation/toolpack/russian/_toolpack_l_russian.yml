l_russian:

 toolpack.1.t:0 "Помощь"
 toolpack.1.d:0 "Запутались? Позвольте объяснить, как освоить инструмент для превращения стран в марионетки.\n\nУ этого инструмента два окна: окно "Инструмент", в котором находится сам инструмент, и окно "Галерея", где показаны все возможные статусы автономии. Наведите на них курсор, чтобы увидеть требования.\n\nТеперь об инструменте. Как уже говорилось, для большинства статусов автономии нужны определённые условия. Чтобы не запутаться, вы будете видеть только доступные варианты автономии. Так что не волнуйтесь, если у Германии варианты не такие, как у Японии.\n\nЧтобы воспользоваться инструментом, сначала нажмите на регион страны, которую хотите сделать марионеткой. Отметьте её кнопкой отметки, а затем нажмите на регион страны, которая должна стать сюзереном. Наконец, выберите один из вариантов, чтобы установить отмеченной стране этот статус автономии.\n\nКнопкой "Освободить страну" можно освободить либо все отмеченные страны, либо страну, на регион которой вы нажали.\n\n\nЕсли вы хотите сделать доброе дело и заметили какие-либо ошибки (в основном наложения, отсутствие доступных вариантов или результаты, отличающиеся от выбранных), пожалуйста, сообщите о них в разделе "Баги и проблемы" в мастерской.\n\nВ любом случае приятного использования набора инструментов."
 toolpack.1.a:0 "Понятно"



 toolpack.5.t:0 "Инструмент людских ресурсов/населения"
 toolpack.5.d:0 "MPT включает два немного отличающихся инструмента. Первый — MMT, который используется для изменения людских ресурсов стран. Выберите опцию "Страна", чтобы напрямую добавить или убрать людские ресурсы у страны, либо сначала изменить одну из двух переменных, а затем добавить ее значение выбранным странам в качестве людских ресурсов.\n\nПроблемы, с которыми вы столкнетесь: четыре переменные, которые можно редактировать с помощью этого инструмента, не могут выходить за пределы 2147k или -2147k. Это связано с тем, что при удалении от 0 дальше чем на 2,147 млн их значение меняет знак на противоположный. По этой же причине значения некоторых стран или регионов выглядят совершенно искаженными. Вините Paradox."

