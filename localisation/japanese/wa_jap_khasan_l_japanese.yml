l_japanese:
 # First Soviet border conflict seen from Japan
 jap_khasan.1.t:0 "ソ連軍、極東国境の要塞化に着手"
 jap_khasan.1.desc:0 "ソ連は極東軍の増強に乗り出し、沿海州の国境地帯に陣地と兵営を築き始めた。豆満江の対岸では歩哨の数が増え、朝鮮軍からは越境と小競り合いの報告が相次いでいる。\n\n張鼓峰をはじめ国境の高地はどちらの領土か定まっておらず、ソ連軍がいずれ先に押さえにかかるのは目に見えている。朝鮮軍は、咸鏡北道の守りを固めるため、師団を国境へ進めるべきだと具申している。"
 jap_khasan.1.a:0 "朝鮮軍を国境へ進めろ"
