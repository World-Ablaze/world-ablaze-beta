l_japanese:
 jap_timor.2.t:0 "ポルトガル領ティモール"
 jap_timor.2.d:0 "日本との戦争が始まり、ティモール島の東半分を占めるポルトガル領は無防備のまま取り残されている。リスボンは中立を盾に協力を拒んでいるが、日本軍が先にこの島を押さえれば、豪州への道が開かれてしまう。中立を破ってでも、先に兵を送るべきだろうか。"
 jap_timor.2.a:0 "中立など構っていられない"
 jap_timor.2.a_tt:0 "日本が降伏すれば§Yポルトガル領ティモール§!は§Yポルトガル§!に返還される"
 jap_timor.2.b:0 "ポルトガルの中立を尊重する"
