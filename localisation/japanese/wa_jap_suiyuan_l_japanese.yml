l_japanese:
 # Suiyuan incident seen from Japan
 jap_suiyuan.1.t:0 "蒙古軍政府、綏遠進出を企図"
 jap_suiyuan.1.desc:0 "蒙古軍政府が、関東軍の後押しを得て綏遠への進出を企てている。綏遠を押さえれば内蒙古は一つにまとまり、華北への圧力はいっそう強まる。\n\nしかし山西の傅作義は手強い。綏遠には山西軍の精鋭が集められており、蒙古軍だけで押し切れる保証はない。関東軍は、蒙古軍が動く前にチャハルへ師団を進め、背後から支えるべきだと進言している。"
 jap_suiyuan.1.a:0 "関東軍をチャハルへ送れ"
