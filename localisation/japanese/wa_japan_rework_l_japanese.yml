 jap_rework.26.a:0 "遺憾である。"
 jap_rework.37.t:0 "大東亜共同宣言"
 jap_rework.37.d:0 "大東亜会議の閉幕に際し、東京に参集した各国首脳は世界に宣明する。「大東亜各国ハ相提携シテ大東亜戦争ヲ完遂シ、大東亜ヲ米英ノ桎梏ヨリ解放シテ其ノ自存自衛ヲ全ウシ、左ノ綱領ニ基キ大東亜ヲ建設シ、以テ世界平和ノ確立ニ寄与センコトヲ期ス。共存共栄ノ秩序ヲ建設シ、相互ニ自主独立ヲ尊重シ、其ノ伝統ヲ尊重シテ各民族ノ創造性ヲ伸暢シ、互恵ノ下緊密ニ提携シ、人種的差別ヲ撤廃シ、普ク文化ヲ交流シ、進ンデ資源ヲ開放シ、以テ世界ノ進運ニ貢献ス」"
 jap_rework.37.a:0 "亜細亜は一つなり。"
 jap_rework.37.b:0 "我らの声は世界に届いた。"
 jap_rework.37.c:0 "東京の傀儡芝居だ。"
 jap_rework.37.e:0 "立派な言葉だ。実が伴うかは時が教えてくれる。"
 jap_rework.31.t:0 "大東亜防衛軍への武器供与"
 jap_rework.31.d:0 "共同防衛決議により、加盟各国は日本の指導下で防衛部隊を編成する。だがその装備を賄うのは我が国の工廠だ。陸軍省は、新編部隊の集結までにどれだけの生産力を供与へ割くべきか判断を求めている。"
 jap_rework.31.a:0 "最小限の供与でよい。（消費財+1%を30日、充足率20%）"
 jap_rework.31.b:0 "本格的に装備させろ。（消費財+5%を90日、充足率100%、全加盟国に自治度+100）"
 jap_rework.33.t:0 "共栄圏への出資"
 jap_rework.33.d:0 "経済開発決議は可決された。東京で残る問題は、約束された投資のうちどれだけが実際に本土を出るのかである。"
 jap_rework.33.a:0 "空手形で十分だ。（消費財+1%を30日、180日後に各加盟国首都に民需+1・軍需+1）"
 jap_rework.33.b:0 "本物の開発計画に出資する。（消費財+5%を180日、自治度+200、180日後に各加盟国首都にインフラ+1・民需+2・軍需+1）"
 jap_rework.35.t:0 "共栄圏の資源"
 jap_rework.35.d:0 "資源協調決議は可決された。問われているのはその中身である。占領地の資源をこれまで通り軍政当局が徴発し続けるのか、それとも主権国家間の協定として供給を受けるのか。前者は帝国の取り分を守り、後者は共栄圏に実体を与える。"
 jap_rework.35.a:0 "総動員だ。共栄圏は帝国に奉仕するために在る。（現状維持：保護国の資源はこれまで通り日本へ流れる）"
 jap_rework.35.b:0 "主権国家間の開発協定を結ぶ。（全加盟国に迎合+5・安定度+5%・自治度+200、海軍が不満）"
 jap_rework.36.t:0 "十億のアジア人"
 jap_rework.36.a:0 "宴会と記念写真で十分だ。（全加盟国と相互好感度+20）"
 jap_rework.36.b:0 "留学生と人種平等宣言に本腰を入れる。（政治力-50、全加盟国に政治力+100・自治度+100、週次戦争協力度+0.1%を20週）"
 jap_rework.40.t:0 "ビルマ国民軍の反乱"
 jap_rework.40.d:0 "アウンサン率いるビルマ国民軍が、日本軍に対する全面的な蜂起に打って出た。ラングーンの政府は日本との条約を破棄し、連合国側で参戦することを宣言した。"
 jap_rework.40.a:0 "我々は真に自由なビルマのために戦う！"
 jap_rework.41.t:0 "ビルマの離反"
 jap_rework.41.d:0 "ラングーンから憂慮すべき報告が届いた。アウンサン率いるビルマ国民軍が我々を裏切り、全面的な抗日蜂起に打って出たのだ。ビルマ政府は条約を一方的に破棄して連合国側に寝返り、これをもって同地における我が国の保護国体制は完全に崩壊した。"
 jap_rework.41.a:0 "直ちにこの反乱を鎮圧せよ！"
 jap_rework.42.t:0 "在華敵産の処理方針"
 jap_rework.42.d:0 "大本営へ：\n上海にて接収した敵国資産（香港上海銀行などの金融機関や英米の煙草工場群）の帰属が喫緊の課題となっている。現在、これらは現地の軍需を支える極めて重要な資金および物資の供給源である。しかし、対華新政策に基づき南京国民政府への権限移譲を進めるにあたり、軍が引き続きこれらの経営権を握り続けるか、あるいは南京政府へと引き渡すか、明確な決断が必要である。\n――支那派遣軍司令部"
 jap_rework.42.a:0 "軍による直接管理を維持する。"
 jap_rework.42.b:0 "南京国民政府へ資産を移管する。"
 JAP_enemy_property_toseiha_up_tt:0 "£faction_jap_toseiha  §Y統制派§!の影響力が§G上昇§!する。\n"
 JAP_enemy_property_toseiha_down_tt:0 "£faction_jap_toseiha  §Y統制派§!の影響力が§R低下§!する。\n"
 jap_rework.36.d:0 "独立親和決議は可決された。壇上ではビルマのバー・モウが、アジア人の血はアジア人の血を呼ぶと訴えている。だが決議の文言だけでは何も変わらない。共栄圏の友愛が宴席と記念撮影で終わるのか、留学生と文化使節、さらには人種平等の宣言にまで至るのか、東京の判断が問われている。"
 JAP_geac_amity_autonomy_gain:0 "大東亜会議：文化交流決議"
 JAP_geac_amity_opinion:0 "大東亜の同胞"
 JAP_geac_racial_equality:0 "人種平等宣言"
 JAP_geac_racial_equality_desc:0 "かつて講和会議で列強に退けられた人種平等の原則を、今度は我々自身の会議が世界に宣明した。西側帝国には決して唱えられない大義であり、共栄圏の結束の拠り所となる。"
 JAP_ins_resource_investment:0 "蘭印の富への投資"
 JAP_ins_resource_investment_desc:0 "パレンバンの製油施設を筆頭に、蘭印の資源産地へと大規模な資本を投じ、本土から技術者を派遣する。施設の復旧と拡張によって産出量は大きく伸びるが、それに伴う労働力は現地での徴用によって賄われることになる。"
 JAP_southern_development_fund_mission:0 "南方開発金庫"
 JAP_southern_development_fund_mission_desc:0 "南方開発金庫は、軍票の発行を通じて南方占領地の経営資金を順調に賄っている。資金が支払われるたびに、本土経済の負担は和らいでいく。"
 JAP_tokyo_express:0 "鼠輸送"
 JAP_te_status_idle:0 "鼠輸送：待機中"
 JAP_te_status_idle_desc:0 "司令部は次回の急行輸送に備えて待機している。作戦を発動するには、マップ上の海域アイコンをクリックすること。（実行には駆逐艦8隻と海軍派閥の政治的影響力が必要となる）"
 JAP_te_tick_mission:0 "鼠輸送：次回運航"
 JAP_te_tick_mission_desc:0 "次回の週次運航までのカウントダウン。期日が到来すると、生存艦数に応じて補給ボーナスが再計算され、残り週数が1減少する。残り週数：[?JAP_te_rounds|.0]"
 IJN_te_flank_speed:0 "最大戦速、針路南"
 IJN_te_flank_speed_desc:0 "輸送任務に徴発された駆逐艦隊が、最大戦速で任地へと急行している。"
 JAP_te_supply:0 "鼠輸送"
 JAP_te_supply_desc:0 "駆逐艦による高速輸送任務により、この地域への補給量が増大している。効果の大きさは、前週を生き延びた駆逐艦の数によって変動する。"
 IJN_fascism:0 "大日本帝国海軍"
 IJN_fascism_DEF:0 "大日本帝国海軍"
 IJN_democratic:0 "大日本帝国海軍"
 IJN_democratic_DEF:0 "大日本帝国海軍"
 IJN_communism:0 "大日本帝国海軍"
 IJN_communism_DEF:0 "大日本帝国海軍"
 IJN_neutrality:0 "大日本帝国海軍"
 IJN_neutrality_DEF:0 "大日本帝国海軍"
 IJN:0 "大日本帝国海軍"
 IJN_DEF:0 "大日本帝国海軍"
 IJN_ADJ:0 "大日本帝国海軍"
 IJN_fascism_party_long:0 "大日本帝国海軍"
 IJN_fascism_party:0 "帝国海軍"
 IJN_osami_nagano:0 "永野修身"
 JAP_guerilla_operations:0 "一億玉砕"
 JAP_disband_the_volunteer_corps:0 "国民義勇戦闘隊の解散"
 JAP_volunteer_corps_disbanded_tt:0 "§Y国民義勇戦闘隊の解散§!"
 JAP_tokyo_express_operations:0 "鼠輸送"
 JAP_tokyo_express_operations_desc:0 "太平洋戦線の広大な距離は、我が軍の補給線に深刻な課題を突きつけている。夜闇に乗じて高速の駆逐艦を活用することで、敵の航空哨戒によるリスクを最小限に抑えつつ、前線の島嶼守備隊に不可欠な増援と物資を輸送することが可能となる。"
 JAP_tokyo_express_operations_tt:0 "鼠輸送のディシジョンが解禁される\nマーシャル諸島およびカロリン諸島を領土とする連合艦隊司令部が、日本の従属国として樹立される"
 jap_rework.43.t:0 "トーキョーエクスプレス"
 jap_rework.43.d:0 "日本海軍が島嶼守備隊への物資補給において新たな戦略を採用したとの報告がある。彼らは夜間に高速の駆逐艦を用い、我が軍の哨戒網をすり抜けて兵員や物資の輸送を試みている。我が軍の将兵が『トーキョーエクスプレス』と呼ぶこの動きは、太平洋において新たな作戦上の課題となっている。"
 jap_rework.43.a:0 "夜間哨戒を強化せねばならない"
 jap_rework.44.t:0 "ビルマ国民軍における不穏な動き"
 jap_rework.44.d:0 "ラングーンの憲兵隊からの諜報報告によると、ビルマ国民軍の内部に懸念すべき兆候が見受けられる。アウンサン司令官が地元の民族主義指導者と密室で会合を開いており、前線付近では無許可の部隊移動も確認されている。現在彼らは我が軍と協力関係にあるが、連合国への離反や組織的な蜂起が差し迫っているのではないかという疑念が高まっている。"
 jap_rework.44.a:0 "彼らの動向を厳重に監視せよ"
 JAP_shonan_special_city:0 "昭南特別市"
 JAP_shonan_special_city_desc:0 "陥落したシンガポールは昭南特別市と改称され、軍政下に置かれた。南方軍の司令部機能もここへ移転させており、この都市を南方統治の拠点として整備すれば、占領地行政はさらに迅速化されるはずだ。"
 JAP_southern_development_bank:0 "南方開発金庫"
 JAP_southern_development_bank_desc:0 "南方占領地の開発資金を一手に供給する機関として、南方開発金庫を設立する。資金は主に軍票の発行によって賄われるため、本土の国庫に負担をかけることなく現地開発を進めることが可能となる。"
 JAP_southern_development_bank_tt:0 "§Y24§!日ごとに経済疲労が緩和される（§Y10§!回）。"
 JAP_thai_burma_railway:0 "泰緬鉄道"
 JAP_thai_burma_railway_desc:0 "現在、ビルマ方面への補給はマレー半島を回る長い海路に頼っており、戦時においては敵潜水艦の格好の標的となっている。バンコクとラングーンを鉄道で直結させることで、人員と物資を安全な陸路で輸送できるようにするのだ。"
 JAP_thai_burma_railway_tt:0 "日本または従属国が支配する全てのビルマ中核州が§Yビルマ鉄道計画§!補正を獲得する。"
 JAP_second_five_year_plan:0 "第二次五箇年計画"
 JAP_second_five_year_plan_desc:0 "満洲国の第一次五箇年計画は、同地における重工業の確固たる土台を築き上げた。第二次五箇年計画ではそれを戦争遂行に直結させ、鉄鋼、石炭、アルミニウムのさらなる増産を図る。"
 JAP_second_five_year_plan_tt:0 "満洲国は五か年計画ツリーの一部の方策を、通常の倍の期間をかけて再び取得できるようになる"
 MAN_second_organize_our_heavy_industry:0 "重工業の組織化（第二次）"
 MAN_second_organize_our_heavy_industry_desc:0 "第二次五箇年計画に基づき、同名の方針を再度実施する。"
 MAN_second_expand_showa_steel_works:0 "昭和製鋼所の拡張（第二次）"
 MAN_second_expand_showa_steel_works_desc:0 "第二次五箇年計画に基づき、同名の方針を再度実施する。"
 MAN_second_new_centres_of_industry:0 "新たな産業中心地（第二次）"
 MAN_second_new_centres_of_industry_desc:0 "第二次五箇年計画に基づき、同名の方針を再度実施する。"
 MAN_second_develop_aluminum_sources:0 "アルミニウム鉱床の開発（第二次）"
 MAN_second_develop_aluminum_sources_desc:0 "第二次五箇年計画に基づき、同名の方針を再度実施する。"
 JAP_thai_military_advisors:0 "シャム軍近代化顧問団"
 JAP_thai_military_advisors_desc:0 "アジアにおける唯一の同盟国であるシャムの陸軍は、いまだ前大戦のドクトリンで戦っている。経験豊富な将校団を派遣して王国陸軍の訓練を近代化すれば、教える立場である我々日本軍にも得るものがあるだろう。"
 JAP_philippine_logistics_hub:0 "比島兵站基地化"
 JAP_philippine_logistics_hub_desc:0 "マニラは、本土と南方資源地帯を結ぶ航路の要衝に位置している。現地の飛行場を拡張し、オロンガポとバタンガスの湾口防備を固めれば、比島は南方戦域の兵站中枢となるだろう。"
 JAP_develop_the_east_indies:0 "蘭印開発"
 JAP_develop_the_east_indies_desc:0 "ジャワとスマトラで産出される資源は、内陸から港へ運び出される段階で滞っている。両島の道路と鉄道網を整備し、資源地帯と積出港を確実に結びつけねばならない。"
 JAP_new_china_policy:0 "対華新政策"
 JAP_new_china_policy_desc:0 "占領地における抗日感情を和らげ、統治を安定させるためには新方針を採用せねばならない。租界の返還と治外法権の撤廃によって南京国民政府の政治的権威を高め、親日政権を通じて治安維持と物資動員をより円滑に進めるのだ。"
 JAP_new_china_policy_tt:0 "南京国民政府の統治下にある中国の州の迎合度が§Y10§!上昇する。\n接収した敵産の処理方針を決定する必要がある。"
 JAP_azad_hind_provisional_government:0 "自由インド仮政府"
 JAP_azad_hind_provisional_government_desc:0 "スバス・チャンドラ・ボースは、自由インド仮政府の樹立を宣言する用意がある。日本がこれを正式に承認すれば、インド国民軍は戴くべき政府を得ることになり、英国によるインド支配の正統性は公然と問われることになるだろう。"
 JAP_the_greater_east_asia_conference:0 "大東亜会議"
 JAP_the_greater_east_asia_conference_desc:0 "大東亜省は共栄圏加盟各国政府の首脳を東京に召集し、アジアの新秩序を世界に宣明する。"
 JAP_the_greater_east_asia_conference_tt:0 "第1回会議は§Y180§!日後に開催される。以後の会議はディシジョンから計画できる。"
 JAP_southern_course_undecided:0 "大東亜の路線"
 JAP_southern_course_undecided_desc:0 "共栄圏の路線が定まるまで、加盟諸民族に対する方針は白紙のままである。"
 JAP_develop_the_south:0 "南方の開発"
 JAP_develop_the_south_desc:0 "南方の加盟各国を所有物ではなく盟邦として扱い、日本からの投資によってそれぞれの経済を育てる。"
 JAP_develop_the_south_tt:0 "南方加盟国の首都州に建設枠§Y+1§!と民需工場§Y1§!を供与する。"
 JAP_continental_labor_agreement:0 "大陸との労働協定"
 JAP_southern_labor_agreement:0 "南方との労働協定"
 JAP_western_labor_agreement:0 "西方との労働協定"
 JAP_leverage_continental_workforce:0 "大陸の労働力を活用"
 JAP_leverage_southern_workforce:0 "南方の労働力を活用"
 JAP_leverage_western_workforce:0 "西方の労働力を活用"
 JAP_greater_east_asia_settlement:0 "共栄圏の将来"
 JAP_greater_east_asia_settlement_desc:0 "大東亜会議での決議の積み重ねを踏まえ、共栄圏が進むべき道を定める。独立に向かう国家の連合とするか、帝国の戦争を支える供給地とするかの決断である。"
 JAP_geas_goodwill_status_tt:0 "大東亜会議で可決した大規模決議: §Y[?JAP_geac_goodwill|.0]§!件\n§Y3§!件以上で共栄圏は§G民族独立§!へ向かう。"
 JAP_geas_auto_resolve_tt:0 "大東亜会議の閉幕とともに路線が自動的に確定する"
 JAP_geas_if_exploitation_tt:0 "共栄圏が§R帝国の指導§!の下に置かれた場合:"
 JAP_geas_if_independence_tt:0 "\n共栄圏が§G民族独立§!へ向かった場合:"
 JAP_geas_undecided_tt:0 "この方針の内容は共栄圏の路線によって決まる。"
 JAP_geas_ministry_once_tt:0 "路線に関わらず、§Y大東亜省§!が§Y1§!段階強化される。"
 JAP_geas_ministry_twice_tt:0 "路線に関わらず、§Y大東亜省§!が§Y2§!段階強化される。"
 JAP_geas_continental_exploit_tt:0 "人的資源§Y11万§!を獲得。中華民国国民政府統治下の中国の州の迎合度§R-10§!、満洲国の安定度§R-10%§!。"
 JAP_geas_continental_agree_tt:0 "人的資源§Y10万§!を獲得。§Y日本帝国主義§!が強化され(属国の自治度獲得§G+1§!、週次人的資源§G+500§!)、満洲国と中華民国国民政府の自治度§G+500§!。"
 JAP_geas_southern_exploit_tt:0 "インドネシア・フィリピン・マラヤの州の迎合度§R-10§!。"
 JAP_geas_southern_agree_tt:0 "人的資源§Y5万§!を獲得。§Y日本帝国主義§!が強化され(属国の自治度獲得§G+1§!、週次人的資源§G+500§!)、インドネシア・フィリピン・マラヤの自治度§G+500§!。"
 JAP_geas_western_exploit_tt:0 "インド・ビルマの州の迎合度§R-10§!。"
