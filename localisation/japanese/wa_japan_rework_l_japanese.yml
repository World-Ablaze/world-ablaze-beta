 JAP_greater_east_asian_co_prosperity_sphere_burma:0 "ビルマ帝国保護国"
 JAP_greater_east_asian_co_prosperity_sphere_burma_desc:0 "ビルマ全土を制圧した今、この国の統治を帝国の保護下にあるビルマ人政府へと委ねることができる。バー・モウが首班として就任する用意ができている。"
