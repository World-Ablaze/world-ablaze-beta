 JAP_greater_east_asian_co_prosperity_sphere_indochina:0 "仏印三国の建国"
 JAP_greater_east_asian_co_prosperity_sphere_indochina_desc:0 "フランスの植民地行政を完全に廃止し、ベトナム帝国、カンボジア王国、ルアンパバーン王国という名目上独立した三国を樹立する。"
 JAP_indochina_rice_requisition_agreement:0 "占領協定の延長"
 JAP_indochina_rice_requisition_agreement_desc:0 "インドシナにおけるヴィシー政権の行政機構が存続している限り、総督府にさらなる圧力をかけて、帝国への米穀供出量を一層拡大させることができる。"
 JAP_indochina_restore_rice_requisition:0 "徴発体制の再建"
 JAP_indochina_restore_rice_requisition_desc:0 "ベトナム帝国の樹立後、旧植民地行政が用いていた米穀徴発機構を再建し、本土への米穀輸送を再開させる。"
