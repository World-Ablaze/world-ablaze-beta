 PHI_organized_guerrilla_activity:0 "組織的ゲリラ活動"
 PHI_dispersed_guerrilla_activity:0 "散発的ゲリラ活動"
 PHI_dismantle_organized_guerrilla_activity:0 "組織的ゲリラ活動の解体"
 PHI_dismantle_organized_guerrilla_activity_desc:0 "ジャングルや僻地の村落で徹底的な掃討作戦を展開し、組織立ったゲリラ集団を完全に解体する。"
 PHI_counter_guerrilla_activity:0 "ゲリラ残党の掃討"
 PHI_counter_guerrilla_activity_desc:0 "組織的な抵抗が崩壊した今、残存するゲリラの細胞が再結集する前に、一つずつ確実に摘発し掃討しなければならない。"
 jap_rework.3.t:0 "南方行政の中枢、昭南"
 jap_rework.3.d:0 "シンガポールは「南の光」を意味する昭南へと公式に改称された。その港湾施設と庁舎は今や南方統治の中心となり、東南アジア経営はさらに加速していくことだろう。"
 jap_rework.3.a:0 "素晴らしい進捗だ。"
 north_china_development_company:0 "北支那開発株式会社"
 north_china_development_company_desc:0 "占領下にある華北の石炭、鉄、および鉄道インフラに資本を投じる日本の国策会社。"
 central_china_development_company:0 "中支那振興株式会社"
 central_china_development_company_desc:0 "北支那開発の中支版として上海に設立され、長江流域における商工業の復興を担う国策会社。"
 JAP_geac_conference:0 "大東亜会議"
 JAP_geac_plan_conference:0 "大東亜会議を計画する"
 JAP_geac_plan_conference_desc:0 "共栄圏各国政府の首脳を東京に召集する。"
 JAP_geac_plan_conference_tt:0 "会議は§Y180§!日後に開催される。"
 JAP_geac_timer:0 "大東亜会議"
 JAP_geac_timer_desc:0 "会議の準備が進められている。"
 JAP_geac_window:0 "会議開催中"
 JAP_geac_window_desc:0 "各国代表団が東京に参集した。会期中は議題を上程できる。"
 JAP_geac_ends_tt:0 "会議は閉会した。"
 JAP_geac_development_small:0 "共栄圏開発（小規模）"
 JAP_geac_development_small_desc:0 "機械と技術者を形ばかり送り、決議の文言を最小限の負担で満たす。"
 JAP_geac_development_large:0 "共栄圏開発（本格実施）"
 JAP_geac_development_large_desc:0 "決議の約束に見合う規模の資本、機械、技術者を加盟各国に投入する。"
 JAP_geac_economy_autonomy_gain:0 "大東亜会議：経済開発決議"
 JAP_geac_dev_completes_tt:0 "約束された建設は§Y180日後§!に完成する。"
 JAP_geac_discuss_defense:0 "議題：共同防衛"
 JAP_geac_discuss_defense_desc:0 "大東亜共同防衛のため、各加盟国が兵力を編成する。"
 JAP_geac_discuss_economy:0 "議題：経済繁栄"
 JAP_geac_discuss_economy_desc:0 "共栄圏全域で互恵的な経済発展を推進する。"
 JAP_geac_discuss_resources:0 "議題：資源協力"
 JAP_geac_discuss_resources_desc:0 "大東亜の資源を共同の戦争遂行に開放する。"
 JAP_geac_discuss_amity:0 "議題：独立親和"
 JAP_geac_discuss_amity_desc:0 "加盟各国の自主独立と互恵親和を確認する。"
 JAP_geac_discuss_defense_ai:0 "議題：共同防衛"
 JAP_geac_discuss_economy_ai:0 "議題：経済繁栄"
 JAP_geac_discuss_resources_ai:0 "議題：資源協力"
 JAP_geac_discuss_amity_ai:0 "議題：独立親和"
 JAP_geac_defense:0 "大東亜共同防衛"
 JAP_geac_defense_desc:0 "加盟各国が戦争の負担を分かち合い、我が国の産業は決戦に集中できる。"
 JAP_geac_resources_colonial_tt:0 "各地の軍政当局は、引き続き共栄圏の資源を意のままに徴発する。"
 JAP_geac_resources_navy_tt:0 "帝国海軍は、征服した油田を返してやる理由を見出せずにいる。艦隊派影響力§R-1§!。"
 JAP_geac_resources_autonomy_gain:0 "大東亜会議：資源開発協定"
 JAP_geac_arms_production_small:0 "防衛軍への武器供与（小規模）"
 JAP_geac_arms_production_small_desc:0 "大東亜防衛軍向けに、二線級装備の小口供与が続いている。"
 JAP_geac_arms_production_large:0 "防衛軍への武器供与（大規模）"
 JAP_geac_arms_production_large_desc:0 "大東亜防衛軍を完全装備させるべく、我が工廠が総力を挙げている。"
 JAP_geac_defense_muster_tt:0 "供出が約束された防衛部隊は§Y60日後§!に編成される。充足率は日本の生産方針に従う。"
 JAP_geac_defense_autonomy_gain:0 "大東亜会議：共同防衛決議"
 JAP_geac_statehood_tt:0 "全ての帝国保護国が名目的独立へ昇格する。"
 JAP_geac_phi_guerrilla_tt:0 "フィリピンのゲリラ活動が一段階沈静化する。"
 jap_rework.10.t:0 "大東亜会議"
 jap_rework.10.d:0 "大東亜共栄圏加盟各国政府の首脳が東京に参集した。会議は四十日間にわたり、新秩序の将来を審議する。"
 jap_rework.10.a:0 "アジアは我らの指導を待っている。"
 jap_rework.10.b:0 "出席しよう。"
 jap_rework.11.t:0 "決議：共同防衛"
 jap_rework.11.d:0 "議長は大東亜共同防衛のための各加盟国による兵力編成を会議に上程しようとしている。代表団にどこまで圧力をかけるか？"
 jap_rework.11.a:0 "各国代表団に諮る。"
 jap_rework.11.b:0 "圧力をかける。（政治力-25）"
 jap_rework.11.c:0 "条件を突きつける。（政治力-50）"
 jap_rework.12.d:0 "東京は大東亜共同防衛のための各加盟国による兵力編成を会議に上程した。我が代表団は回答せねばならない。"
 jap_rework.12.a:0 "賛同する。"
 jap_rework.12.b:0 "辞退せざるを得ない。"
 jap_rework.13.t:0 "[From.GetName]、決議に賛同"
 jap_rework.13.d:0 "[From.GetName]代表団は共同防衛決議に賛同した。"
 jap_rework.13.a:0 "素晴らしい。"
 jap_rework.14.t:0 "[From.GetName]、決議を辞退"
 jap_rework.14.d:0 "[From.GetName]代表団は共同防衛決議を辞退した。"
 jap_rework.14.a:0 "遺憾である。"
 jap_rework.15.t:0 "決議：経済繁栄"
 jap_rework.15.d:0 "議長は共栄圏全域での互恵的経済発展計画を会議に上程しようとしている。代表団にどこまで圧力をかけるか？"
 jap_rework.15.a:0 "各国代表団に諮る。"
 jap_rework.15.b:0 "圧力をかける。（政治力-25）"
 jap_rework.15.c:0 "条件を突きつける。（政治力-50）"
