 JAP_indochinese_rice_requisition:0 "インドシナ米穀徴発"
 JAP_indochinese_rice_requisition_desc:0 "仏印当局との協定に基づき、市価を大きく下回る公定価格で米が買い上げられ、本土へと送られている。この過酷な供出割当の負担は、インドシナの農村に重くのしかかっている。"
 jap_rework.1.t:0 "米穀輸送の途絶"
 jap_rework.1.d:0 "インドシナにおけるヴィシー政権の行政機構が崩壊したことで、米の徴発協定を履行すべき当局が消滅してしまった。これにより、日本本土への米穀輸送は完全に途絶えた。"
 jap_rework.1.a:0 "遺憾な事態だ。"
 JAP_greater_east_asian_co_prosperity_sphere_india_required_states_tt:0 "§Yアンダマン諸島§!の支配が必要。自由インドはポートブレアで樹立を宣言し、解放されたインド中核州はその統治下に移管される。"
