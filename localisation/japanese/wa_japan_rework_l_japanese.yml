 JAP_co_prosperity_sphere_leader:0 "共栄圏の盟主"
 JAP_co_prosperity_sphere_leader_desc:0 "日本は大東亜共栄圏を指導する盟主である。"
 JAP_co_prosperity_sphere_member:0 "共栄圏の一員"
 JAP_co_prosperity_sphere_member_desc:0 "この国は、日本を盟主とする大東亜共栄圏に加盟している。"
 JAP_gakutotai:0 "学徒隊"
 JAP_gakutotai_desc:0 "占領地全域において編成された学徒部隊。日本人教官による厳しい訓練を受けた現地の青年たちは、守備隊の安定した補充兵力として機能している。"
