l_japanese:
 JAP_army_name_text:0 "帝国陸軍"
 JAP_navy_name_text:0 "帝国海軍"
 JAP_shinmin_name_text:0 "臣民"
 JAP_shinmin_attitude_status_amount:0 "[ROOT.JAP_GetShinminAttitudeLevel]"
 JAP_shinmin_attitude_up_tt:0 "§Y臣民§!の態度が§G好転§!し、§Y週ごとの戦争協力度§!が§G+0.05%§!増加する。\n"
 JAP_shinmin_attitude_down_tt:0 "§Y臣民§!の態度が§R悪化§!し、§Y週ごとの戦争協力度§!が§R-0.05%§!減少する。\n"
 JAP_shinmin_influence_status_amount:0 "[ROOT.JAP_GetShinminInfluenceLevel]"
 JAP_shinmin_influence_up_tt:0 "§Y臣民§!が§R影響力を増し§!、§Y政治力獲得§!が§R-0.05§!減少する。\n"
 JAP_shinmin_influence_down_tt:0 "§Y臣民§!が§G影響力を失い§!、§Y政治力獲得§!が§G+0.05§!増加する。\n"
 JAP_shinmin_curb_influence:0 "思想犯保護観察法"
 JAP_shinmin_curb_influence_desc:0 "危険な思想を抱く臣民を公権力の監視下に置く法整備が急がれる。"
 JAP_shinmin_curb_influence_tt:0 "§Y臣民§!が§Y非常に小さい§!以上の§Y影響力§!を持っている。"
 JAP_shinmin_blackout:0 "灯火管制"
 JAP_shinmin_blackout_desc:0 "空襲に備え、臣民と隣組が夜間の光を断つ体制を徹底すべきだ。"
 JAP_shinmin_blackout_tt:0 "§Y臣民§!が§Y当惑§!以上である。\nこの効果は§Y20日間§!継続し、§Y当惑§!から始まる態度のレベルごとに§Y20日間§!継続する。"
 JAP_shinmin_labour_service:0 "勤労奉仕"
 JAP_shinmin_labour_service_desc:0 "国の号令のもと、臣民を広く作業へ動員する必要がある。人手の確保が進めば、工場の生産効率も上がる公算が大きい。"
 JAP_shinmin_labour_service_tt:0 "この効果は§Y14日間§!継続し、§Y臣民§!の§Y影響力§!が§Y絶大§!から1レベル下がるごとに§Y14日間§!継続する。"
 JAP_navy_war_games_tt:0 "£faction_jap_kantaiha 帝国海軍が§3友好的§!であり、非常に小さい以上の§Y影響力§!を持っている。\nこれは§Y影響力§!のレベルごとに海軍の各習熟度を§Y5§!付与し、最大で§Y35§!となる。"
 JAP_Toseiha_divine_sword_desc:0 "戦時下の帝国陸軍は、地上部隊と航空戦力の連携を急務としている。体制を整えれば、前線の突破力は一段と高まるだろう。"
 JAP_kantaiha_naval_war_games_desc:0 "主力艦や空母、護衛艦、潜水艦を一堂に集め、訓練を重ねる時期である。連携が深まれば、帝国海軍の練度は大きく高まるはずだ。"
 JAP_Zaibatsus_fund_r_and_d_desc:0 "財閥の資本を技術革新の現場へ振り向けるべきである。設備の拡充と新技術の確立が同時に進むに違いない。"
 JAP_Zaibatsus_issue_material_contracts_desc:0 "財閥と新たな納入の取り決めを交わし、工場や造船所の稼働を引き出す必要がある。生産量の大幅な増加が見込まれる。"
 JAP_Zaibatsus_yasuda_desc:0 "疲弊しつつある国内経済を立て直すには、安田財閥の金融力に頼るほかない。"
 JAP_Zaibatsus_toyota_desc:0 "トヨタへ大量の発注を行えば、まとまった数の軍用車両を速やかに確保できる見通しだ。"
 JAP_Zaibatsus_sumitomo_desc:0 "都市部の住まい不足を解消するため、住友財閥に建設事業を委ねるべきだ。新たな民需工場の整備も進むとみられる。"
 JAP_Zaibatsus_mitsui_desc:0 "関東の工業基盤を厚くするため、三井財閥の資本を動員すべきである。工場と造船所が揃えば、国内産業の要となることは間違いない。"
 JAP_army_divine_sword_tt:0 "£faction_jap_toseiha  §Y帝国陸軍§!が§C忠実§!であり、非常に小さい以上の§Y影響力§!を持っている。\nこの効果は§Y影響力§!のレベルごとに§Y7日間§!持続する。"
 JAP_zaibatsu_fund_r_and_d_tt:0 "£faction_jap_zaibatsus §Y財閥§!が§C忠実§!であり、非常に小さい以上の§Y影響力§!を持っている。\nこの効果は§Y影響力§!のレベルごとに§Y20日間§!継続し、最大§Y140日間§!となる。"
 JAP_zaibatsu_issue_material_contracts_tt:0 "£faction_jap_zaibatsus §Y財閥§!が§3友好的§!であり、非常に小さい以上の§Y影響力§!を持っている。\nこの効果は§Y影響力§!のレベルごとに§Y20日間§!継続し、最大§Y140日間§!となる。"
