l_japanese:
 JAP_rework_debug:0 "【デバッグ】日本リワーク"
 debug_jr_gakutotai_all_subjects:0 "【デバッグ】全従属国に学徒隊を付与"
 debug_jr_gakutotai_all_subjects_desc:0 "全ての従属国に学徒隊の国民精神を即時付与します。"
 debug_jr_ins_investment_payoff:0 "【デバッグ】蘭印投資の成果を即時適用"
 debug_jr_ins_investment_payoff_desc:0 "蘭印投資ディシジョンの完了効果（資源追加＋安定度低下）を即時適用します。"
 debug_jr_mil_admin_level_up:0 "【デバッグ】軍政負担を1段階上げる"
 debug_jr_mil_admin_level_up_desc:0 "日本の軍政維持の負担を1段階引き上げます。"
 debug_jr_establish_burma:0 "【デバッグ】ビルマ保護国を即時樹立"
 debug_jr_establish_burma_desc:0 "条件を無視してビルマ帝国保護国（IPB）を樹立します。"
 debug_jr_establish_indochina:0 "【デバッグ】仏印三国を即時樹立"
 debug_jr_establish_indochina_desc:0 "条件を無視してベトナム帝国・カンボジア王国・ルアンパバーン王国を樹立します。"
 debug_jr_establish_philippines:0 "【デバッグ】フィリピン保護国を即時樹立"
 debug_jr_establish_philippines_desc:0 "条件を無視してフィリピン帝国保護国（IPP）を樹立します。ラウレル政権が発足し、比中核6州が移譲されます（パラワンの所有権はPHIに残り、蜂起の主体として存続します）。"
 debug_jr_burma_defection:0 "【デバッグ】ビルマ離反イベントを発火"
 debug_jr_burma_defection_desc:0 "離反本番イベント（jap_rework.40）を、見張り条件（RAJ中核州＋島嶼2箇所）と60日タイマーを飛ばしてIPBに直接発火します。日本が米英と交戦中でないとイベント側の発火条件に弾かれて不発になるので、宣戦デバッグを先に押してください。"
 debug_jr_rice_grant:0 "【デバッグ】米穀徴発を即時取得"
 debug_jr_rice_grant_desc:0 "インドシナ米穀徴発の国民精神を即時取得します。"
 debug_jr_fire_rice_grace:0 "【デバッグ】米穀徴発の失効イベントを発火"
 debug_jr_fire_rice_grace_desc:0 "猶予期間満了イベント（jap_rework.1）を即時発火します。"
 debug_jr_control_andaman:0 "【デバッグ】アンダマンを日本支配下に"
 debug_jr_control_andaman_desc:0 "アンダマン・ニコバル州（733）の支配権を日本に移します。"
 debug_jr_statehood_all:0 "【デバッグ】全保護国に名目的独立を付与"
 debug_jr_statehood_all_desc:0 "帝国保護国自治度の全従属国を一括で名目的独立させます。"
 debug_jr_phi_guerrillas:0 "【デバッグ】比ゲリラを即時発生"
 debug_jr_phi_guerrillas_desc:0 "マニラを除くフィリピンの全中核州に組織的ゲリラ活動を発生させます。"
 debug_jr_phi_uprising:0 "【デバッグ】比大蜂起イベントを発火"
 debug_jr_phi_uprising_desc:0 "大蜂起イベント（jap_rework.2）をフィリピンで即時発火します。"
 debug_jr_shonan_bonus:0 "【デバッグ】昭南ボーナスを即時発火"
 debug_jr_shonan_bonus_desc:0 "東南アジアNF半減イベント（jap_rework.3）を即時発火します。"
 debug_jr_geac_now:0 "【デバッグ】大東亜会議を即時招集"
 debug_jr_geac_now_desc:0 "タイマーを無視して大東亜会議の開催通知を全加盟国に送ります。"
 debug_jr_conquer_philippines:0 "【デバッグ】フィリピン全土を即時制圧"
 debug_jr_conquer_philippines_desc:0 "比7州の支配権を日本に移し、フィリピン軍の初期師団を全て削除します（戦時樹立テストの盤面作り用。宣戦後に押すこと）。"
 debug_jr_war_usa_eng:0 "【デバッグ】米英に即時宣戦"
 debug_jr_war_usa_eng_desc:0 "アメリカ・フィリピン・イギリス・イギリス領インドにまとめて宣戦布告します。"
 debug_jr_found_sphere:0 "【デバッグ】大東亜共栄圏を即時発足"
 debug_jr_found_sphere_desc:0 "日本に盟主の国際組織バッジを付与し、現在の全従属国を共栄圏に一括加入させます（NF効果の再現）。"
 debug_jr_sphere_join_sia:0 "【デバッグ】シャムを共栄圏に加入させる"
 debug_jr_sphere_join_sia_desc:0 "シャムを国際連盟から脱退させ、共栄圏に加入させます（タイへの最後通牒の受諾時処理の再現）。"
 debug_jr_establish_ijn:0 "【デバッグ】連合艦隊司令部（IJN）を即時樹立"
 debug_jr_establish_ijn_desc:0 "政治力と条件を無視して大日本帝国海軍（IJN）を即時樹立します。マーシャル・カロリン両諸島を移譲し、日本の従属国（帝国保護領自治度）にします。元首は永野修身です。"
 debug_jr_te_unlock_nf:0 "【デバッグ】鼠輸送NFを即時完了"
 debug_jr_te_unlock_nf_desc:0 "鼠輸送作戦NFを即時完了し、ディシジョンカテゴリを解禁します。完了時効果が通常通り発火するため、交戦中の米英への通知イベントもテストできます。"
 debug_jr_te_start:0 "【デバッグ】鼠輸送を即時発動"
 debug_jr_te_start_desc:0 "条件を無視して鼠輸送（海域84ビスマルク海に直指定）を即時発動します。峯風型8隻（指名不発時は任意の駆逐艦）を実艦のままIJNへ移管し、IJNに7日間の最大戦速バフ（艦隊速度+5000%）を付与、同海域に面する州（737・1004・1002）に補給補正（生存1隻あたり5%・最大40%）を付与します。"
 debug_jr_te_end:0 "【デバッグ】鼠輸送を即時終了"
 debug_jr_te_end_desc:0 "JAP_te_roundsを0にします。次回の週次更新（最大7日後）で艦隊返還と補正解除が行われます。"
 debug_jr_te_seed:0 "【デバッグ】アンカーを再選出"
 debug_jr_te_seed_desc:0 "アンカー選出（JAP_te_refresh_anchors_effect）を手動で再実行します。37海域のアイコン担当州を選び直します。"
 debug_jr_te_anchors_toggle:0 "【デバッグ】全海域アイコンの強制表示を切替"
 debug_jr_te_anchors_toggle_desc:0 "アイコン強制表示フラグを切り替えます。有効の間は支配条件を無視して全37海域が優先度1位の州にアイコンを出します（アンカー再選出も即時実行）。"
 debug_jr_flank_speed_jap:0 "【実験】日本に最大戦速バフ（10日間）"
 debug_jr_flank_speed_jap_desc:0 "日本に艦隊速度+5000%のバフを10日間付与します。艦隊がどれだけ進めるかの実測用です。"
 debug_jr_te_warp_test:0 "【実験】駆逐艦1隻をIJNに移管してトラックへワープ"
 debug_jr_te_warp_test_desc:0 "teleport_armies（仕様書上は陸軍用）が港の艦隊にも効くかの実験です。日本の駆逐艦1隻をIJNに移管し、全州を走査してIJN籍の部隊をトラック泊地（プロヴィンス2489）に転送します。IJNは陸軍を持たないため、日本の師団には影響しません。IJN樹立後に押してください。"
 debug_jr_establish_india:0 "【デバッグ】自由インドを即時樹立"
 debug_jr_establish_india_desc:0 "アンダマン諸島を占領し、ポートブレアで自由インド仮政府を帝国保護領として樹立します。大東亜共栄圏フォーカスや政体の条件は無視します。本来のディシジョンと同じく、移管されるのはアンダマン諸島のみで、インド本土は領有権主張のままです。"
 debug_jr_establish_siberia:0 "【デバッグ】シベリア保護領を即時樹立"
 debug_jr_establish_siberia_desc:0 "シベリア計画ディシジョンが移管する極東9州を占領し、シベリア保護領を帝国保護領として樹立します。フォーカスと州支配の条件は無視します。"
 debug_jr_establish_pgc:0 "【デバッグ】中華民国臨時政府を即時樹立"
 debug_jr_establish_pgc_desc:0 "華北8州を占領し、臨時政府を帝国保護領として樹立します。支那計画フォーカスと州支配の条件は無視します。"
 debug_jr_establish_ref:0 "【デバッグ】中華民国維新政府を即時樹立"
 debug_jr_establish_ref_desc:0 "長江下流3州を占領し、維新政府を帝国保護領として樹立します。"
 debug_jr_establish_rnc:0 "【デバッグ】汪兆銘政権を即時樹立"
 debug_jr_establish_rnc_desc:0 "華北・長江の両方を領有する形で汪兆銘政権を直接樹立します。本来はフォーカスで臨時政府と維新政府を併合して成立しますが、これは閣僚確認用の近道です。"
 debug_jr_establish_indonesia:0 "【デバッグ】インドネシア帝国保護領を即時樹立"
 debug_jr_establish_indonesia_desc:0 "インドネシアの中核州をすべて占領し、インドネシアを帝国保護領として樹立します。フォーカス、政体、州支配の条件は無視します。蘭印との戦争は始めません。"
 debug_jr_establish_indonesian_administrations:0 "【デバッグ】蘭印の軍政地域を即時樹立"
 debug_jr_establish_indonesian_administrations_desc:0 "インドネシアの中核州をすべて占領し、ジャワ軍政監部、スマトラ軍政監部、南西方面海軍民政府を樹立します。フォーカス、政体、州支配の条件は無視します。"
 debug_jr_indonesia_independence:0 "【デバッグ】軍政地域を統合してインドネシア国を樹立"
 debug_jr_indonesia_independence_desc:0 "民族独立の路線のディシジョンと同じ処理を、国家方針なしで実行します。軍政地域を統合し、インドネシア国として名目的独立を与えます。"
 debug_jr_indonesia_unify:0 "【デバッグ】軍政地域を統合して帝国保護国を樹立"
 debug_jr_indonesia_unify_desc:0 "帝国の指導の路線のディシジョンと同じ処理を、国家方針なしで実行します。軍政地域を統合し、インドネシア帝国保護国を樹立します。"
 debug_jr_gte_prerequisites:0 "【デバッグ】技術交流の前提NFを完了"
 debug_jr_gte_prerequisites_desc:0 "陸軍科学研究所と三国同盟に調印を即時完了し、ドイツとの技術交流ディシジョンを使える状態にします。三国同盟に調印の完了時効果（ドイツへの通知イベント）も通常通り発火します。"
 debug_jr_gte_toggle_suez:0 "【デバッグ】スエズ経由の要衝を支配扱いに切替"
 debug_jr_gte_toggle_suez_desc:0 "スエズ運河・マルタ・デルナ・フランス領ソマリランドを、実際の支配国に関係なく支配済みとして扱うかどうかを切り替えます。"
 debug_jr_gte_toggle_cape:0 "【デバッグ】喜望峰経由の要衝を支配扱いに切替"
 debug_jr_gte_toggle_cape_desc:0 "ブルターニュ・ケープ西部・マダガスカルを、実際の支配国に関係なく支配済みとして扱うかどうかを切り替えます。"
 debug_jr_gte_toggle_common:0 "【デバッグ】共通の要衝を支配扱いに切替"
 debug_jr_gte_toggle_common_desc:0 "セイロン・シンガポール・台湾を、実際の支配国に関係なく支配済みとして扱うかどうかを切り替えます。"
 debug_jr_gte_arrive_now:0 "【デバッグ】技術交流の今の区間を即時に終える"
 debug_jr_gte_arrive_now_desc:0 "進行中の区間ミッションの残り日数を飛ばし、その場で抽選します。成功すれば次の区間が始まり、最後の区間なら到着イベントが出ます。"
 debug_jr_gte_success:0 "【デバッグ】技術交流を成功扱いにする"
 debug_jr_gte_success_desc:0 "区間ミッションを取り消し、抽選を飛ばして技術交流を成功済みにします。陸軍科学研究所に続く国家方針の強化版の効果と、タ弾の付与を確認する用です。"
 debug_jr_gte_reset:0 "【デバッグ】技術交流をリセット"
 debug_jr_gte_reset_desc:0 "区間ミッションを取り消し、成功済み・送り出し中・再挑戦待ちの状態をすべて消して、ディシジョンを最初の状態に戻します。要衝の支配扱いの切替はそのまま残ります。"
 debug_jr_indonesia_test_divisions:0 "【デバッグ】軍政地域に試験用の師団を配備"
 debug_jr_indonesia_test_divisions_desc:0 "東インドの各軍政地域の首都に、大東亜防衛軍の師団を2個ずつ配備します。統合時に師団が引き継がれるかを確かめる用です。"
