l_japanese:
 # New political tree (template): names only, the descriptions come later.
 JAP_pol_february_26_incident:0 "二・二六事件"
 JAP_pol_february_26_incident_desc:0 "皇道派の青年将校は、武力をもって国家を改造する機会をうかがっている。ひとたび事が起これば断固としてこれを鎮圧し、その機に皇道派を陸軍から一掃しなければならない。"
 JAP_pol_active_duty_officer_rule:0 "軍部大臣現役武官制"
 JAP_pol_active_duty_officer_rule_desc:0 "粛軍の一環として、陸海軍大臣の資格を現役の大将と中将に限る。予備役に退いた将官が大臣として復帰する道は閉ざされるが、軍が大臣を出さなければ内閣が成り立たなくなる危うさも抱えることになるだろう。"
 JAP_pol_harakiri_exchange:0 "腹切り問答"
 JAP_pol_harakiri_exchange_desc:0 "衆議院で政友会の浜田国松が軍部の政治介入を批判し、寺内陸相と激しく応酬した。侮辱の言葉があったなら割腹して謝すると迫られた陸相は議会の解散を求めており、内閣はもはや持ちこたえられないだろう。"
 JAP_pol_ugaki_cabinet_miscarries:0 "宇垣内閣の流産"
 JAP_pol_ugaki_cabinet_miscarries_desc:0 "組閣の大命は宇垣一成に下ったが、陸軍はかつて軍縮を断行した宇垣を嫌い、陸軍大臣を出すことを拒んでいる。大臣を得られなければ組閣は成らず、今後いかなる内閣も陸軍の同意なしには立てなくなるだろう。"
 JAP_pol_eat_and_run_dissolution:0 "食い逃げ解散"
 JAP_pol_eat_and_run_dissolution_desc:0 "林内閣は予算を成立させた直後に衆議院を解散した。政党を懲らしめ、政府を支持する勢力を議会に送り込む狙いだが、大義なき解散に世論は冷たく、選挙の結果が内閣の命運を決めることになるだろう。"
 JAP_pol_first_konoe_cabinet:0 "第一次近衛内閣"
 JAP_pol_first_konoe_cabinet_desc:0 "裕仁天皇は軍部の意向を聞き入れ、日本は今や自由主義や文民政府という西洋の考えになびくことはない。近衛文麿は日本をアジアの指導者たる正当な地位へと導くだろう！"
 JAP_pol_no_dealings_with_the_nationalists:0 "「国民政府を対手とせず」"
 JAP_pol_no_dealings_with_the_nationalists_desc:0 "国民政府が和平の条件を受け入れる見込みはないと判断し、今後は同政府を交渉の相手としないことを声明する。我々は新たな政権の成立を待ち、これと国交を調整していくことになるだろう。"
 JAP_pol_hiranuma_cabinet:0 "平沼内閣"
 JAP_pol_hiranuma_cabinet_desc:0 "首相であった近衛文麿が突如として内閣総辞職を行い、代わりに枢密院を率いることになった。騏一郎内閣は変わる指導者と戦略目標を伴いつつ中国との戦争に対処しており、酷く不安定な状況下にある。"
 JAP_pol_complicated_and_inscrutable:0 "「欧州情勢は複雑怪奇」"
 JAP_pol_complicated_and_inscrutable_desc:0 "欧州の情勢は我々の見通しを超えて動いており、ドイツとの提携を軸に据えてきた外交は拠り所を失った。内閣は複雑怪奇なる新情勢が生じたとの声明を残し、総辞職するほかない。"
 JAP_pol_yonai_cabinet:0 "米内内閣"
 JAP_pol_yonai_cabinet_desc:0 "海軍大将の米内光政に組閣の大命が下った。新内閣は欧州の戦争に介入せず、英米との関係をこれ以上損なわないことを方針とするが、ドイツとの提携を望む陸軍がこれを長く許すとは限らない。"
 JAP_pol_second_konoe_cabinet:0 "第二次近衛内閣"
 JAP_pol_second_konoe_cabinet_desc:0 "騏一郎と米内の酷く短い在任期間を経て、近衛文麿が再び首相となった。欧州のファシズムを掲揚する主要国と協力し、最終的に中国との泥沼の戦争を決定的な勝利で終わらせることを計画している。"
 JAP_pol_tripartite_pact:0 "日独伊三国同盟"
 JAP_pol_tripartite_pact_desc:0 "軍部が要求した三国同盟への調印により、我々は世界のファシスト勢力と協調することとなる。これによって新世界秩序のもとにその地位を確保することができるはず\nだ。また、我々の拡大を阻止せんとするイギリスやアメリカと対峙するにおいて、協力関係の基盤ともなるだろう。"
 JAP_pol_imperial_rule_assistance_association:0 "大政翼賛会"
 JAP_pol_imperial_rule_assistance_association_desc:0 "戦時下においては、対立する陸海軍と民政の残党をまとめ上げる統一政権を打ち立てることが必須である。大政翼賛会は国家の組織化と戦争の遂行において、政府に関わるあらゆる人間を包括する国家組合主義的体制として構築されており、激化する戦争下でも国内の安定を保つことができるだろう。"
 JAP_pol_third_konoe_cabinet:0 "第三次近衛内閣"
 JAP_pol_third_konoe_cabinet_desc:0 "日米交渉の妨げとなっている外相を更迭するため、近衛内閣はいったん総辞職し、改めて組閣する。交渉をまとめる時間は多く残されておらず、新内閣はアメリカとの妥結に全力を注ぐ必要がある。"
 JAP_pol_tojo_cabinet:0 "東條内閣"
 JAP_pol_tojo_cabinet_desc:0 "首相は政治的に孤立し、天皇陛下からの温情すら失ったという噂の中で退陣した。政治家かつ軍国主義者としても知られる東條英機は、天皇陛下の信頼を得て、軍部の後ろ盾となって日本を団結させようとしている。究極の勝利へ！万歳！"
 JAP_pol_execution_of_imperial_national_policy:0 "帝国国策遂行要領"
 JAP_pol_execution_of_imperial_national_policy_desc:0 "対米交渉の期限を定め、それまでに妥結しなければ武力を発動することを御前会議で決定する。自存自衛を全うし大東亜の新秩序を建設するため、陸海軍は開戦の準備を完整しなければならない。"
 JAP_pol_yokusan_election:0 "翼賛選挙"
 JAP_pol_yokusan_election_desc:0 "戦時下の総選挙にあたり、翼賛政治体制協議会が議員定数と同数の候補者を推薦す\nる。推薦候補が議席の大半を占めれば、議会は一丸となって戦争遂行を支えることになるだろう。"
 JAP_pol_koiso_cabinet:0 "小磯内閣"
 JAP_pol_koiso_cabinet_desc:0 "最近の東條の失策により、彼は天皇の信頼を失った。後任には小磯國昭が就任するだろう。"
 JAP_pol_tokyo_metropolis:0 "東京都制"
 JAP_pol_tokyo_metropolis_desc:0 "東京府と東京市を廃して東京都を置き、帝都の行政を政府の直接の統制下に一元化する。長年にわたり議会で実を結ばなかった懸案だが、非常時の帝都には強力な行政が欠かせない。"
 JAP_pol_religious_organisations_law:0 "宗教団体法"
 JAP_pol_religious_organisations_law_desc:0 ""
 JAP_pol_baba_finance:0 "馬場財政"
 JAP_pol_baba_finance_desc:0 "国防の充実を第一とし、高橋前蔵相が守ってきた公債漸減の方針を放棄する。軍備拡張の財源は増税と公債の増発に求めることになるが、膨張する予算が物価に跳ね返ることは避けられないだろう。"
 JAP_pol_yuki_finance:0 "結城財政"
 JAP_pol_yuki_finance_desc:0 "膨れ上がる軍事予算は物価の騰貴を招きかねず、財界は不安を募らせている。国防の充実という方針は維持しつつ、予算を縮小し増税を緩和して、軍部と財界の間を取り持たなければならない。"
 JAP_pol_peace_preservation_law_revision:0 "治安維持法の改正"
 JAP_pol_peace_preservation_law_revision_desc:0 ""
 JAP_pol_three_and_a_half_percent_bonds:0 "三分半利国債"
 JAP_pol_three_and_a_half_percent_bonds_desc:0 "公債の増発に耐えるには、金利を引き下げて利払いの負担を軽くしなければならな\nい。五分利の国債を三分半利へ借り換えれば当面の消化は進むだろうが、低利の国債がいつまで市場に受け入れられるかは分からない。"
 JAP_pol_military_finance_embrace:0 "軍財抱合"
 JAP_pol_military_finance_embrace_desc:0 "軍備の拡張には財界の協力が欠かせず、財界もまた軍需なくしては成り立たない。軍部と財界が互いに歩み寄り、物価を抑えながら生産力の拡充を進める必要がある。"
 JAP_pol_gold_production_law:0 "産金法"
 JAP_pol_gold_production_law_desc:0 "軍備の拡充に伴う輸入の急増によって、我が国の金は海外へ流出し続けている。日本銀行の正貨準備は帳簿の上でこそ保たれているが、このままでは輸入の決済に行き詰まるだろう。金の生産から使用までを政府の統制下に置き、決済に充てる金を確保しなければならない。"
 JAP_pol_tax_reform:0 "税制改正"
 JAP_pol_tax_reform_desc:0 "膨張する歳出を公債だけで賄い続けることはできない。所得税を中心に税制を改め、増税のたびに制度を作り直さずとも財源を確保できる弾力ある税制を確立しなければならない。"
 JAP_pol_military_secrets_law:0 "軍機保護法の改正"
 JAP_pol_military_secrets_law_desc:0 ""
 JAP_pol_cabinet_planning_board:0 "企画院"
 JAP_pol_cabinet_planning_board_desc:0 "企画庁と資源局を統合し、国策の立案と総動員計画を担う機関を内閣に置く。物資と資金と労力を国家の計画に従って配分する体制の、その中枢となるだろう。"
 JAP_pol_temporary_funds_adjustment_law:0 "臨時資金調整法"
 JAP_pol_temporary_funds_adjustment_law_desc:0 "限りある資金が不要不急の産業に流れることは許されない。設備資金の貸付と会社の設立や増資を政府の許可制とし、資金を軍需産業と基礎産業へ優先的に振り向けるべきだ。"
 JAP_pol_temporary_trade_measures_law:0 "輸出入品等臨時措置法"
 JAP_pol_temporary_trade_measures_law_desc:0 "輸入の急増によって外貨は不足しており、限られた輸入力は軍需に必要な物資に充てなければならない。政府は品目を指定して輸出入を制限し、その物資の製造や配給、消費にまで命令を及ぼすことができる。"
 JAP_pol_national_defence_security_law:0 "国防保安法"
 JAP_pol_national_defence_security_law_desc:0 ""
 JAP_pol_electric_power_control_law:0 "電力国家管理法"
 JAP_pol_electric_power_control_law_desc:0 "民間の電力会社から主要な発電と送電の設備を出資させ、国策会社の日本発送電に一元的に運営させる。豊富で低廉な電力を軍需産業へ優先して供給するには、電力を国家の管理に置かねばならない。"
 JAP_pol_bank_of_japan_law:0 "日本銀行法"
 JAP_pol_bank_of_japan_law_desc:0 "日本銀行の目的を国家の政策に即した通貨と金融の調整と定め、政府の監督権を強める。兌換の義務を名実ともに廃し、通貨の発行高は政府が定める限度によって管理されることになる。"
 JAP_pol_national_mobilisation_law:0 "国家総動員法"
 JAP_pol_national_mobilisation_law_desc:0 "戦時に際し、国防の目的を達するため、人的・物的資源を政府が統制し運用できるようにする。労務、物資、資金、価格、言論にわたる統制は議会の審議を経ず勅令によって発動でき、国家の総力を戦争に集中することが可能となるだろう。"
 JAP_pol_power_distribution_control:0 "配電統制"
 JAP_pol_power_distribution_control_desc:0 "全国の配電事業を地域ごとに九つの配電会社へ統合する。発電と送電に続いて配電も国家の統制下に置かれ、電力はその全過程にわたって国策に従い配分されることになる。"
 JAP_pol_national_service_draft_ordinance:0 "国民徴用令"
 JAP_pol_national_service_draft_ordinance_desc:0 "軍需産業の労働力は不足しており、もはや募集だけでは必要な人員を満たせない。国家総動員法に基づき、政府が国民を指定の工場や事業場へ徴用できるようにする必要がある。"
 JAP_pol_price_control_ordinance:0 "価格等統制令"
 JAP_pol_price_control_ordinance_desc:0 "物価の騰貴を抑えるため、あらゆる価格を特定の日の水準に釘付けにし、それを超える引き上げを禁じる。賃金や地代、運賃も同様に据え置かれるが、物資の不足が続くかぎり闇取引を防ぐことは難しいだろう。"
 JAP_pol_anti_military_speech:0 "反軍演説"
 JAP_pol_anti_military_speech_desc:0 "民政党の斎藤隆夫が衆議院の壇上から、事変をいかに収めるのか、国民の払う犠牲は何のためかと政府を問い詰めた。軍部は聖戦を冒瀆するものと激昂しており、議会は彼を除名して事を収めるほかないだろう。"
 JAP_pol_anniversary_2600:0 "紀元二千六百年"
 JAP_pol_anniversary_2600_desc:0 "神武天皇の即位から二千六百年を迎え、宮城前の式典をはじめ全国で奉祝の行事を催す。万世一系の皇統を戴く国体の尊厳を国民に改めて示すことで、国民の精神を一つにまとめ上げることができるだろう。"
 JAP_pol_industrial_patriotic_association:0 "大日本産業報国会"
 JAP_pol_industrial_patriotic_association_desc:0 "労働組合を解散させ、事業場ごとに労使が一体となる産業報国会を全国組織に統合する。労資の対立を除き、勤労を国家への奉仕と位置づけることで、生産の増強に全力を注ぐことができるだろう。"
 JAP_pol_wartime_administrative_special_law:0 "戦時行政特例法"
 JAP_pol_wartime_administrative_special_law_desc:0 "鉄鋼、石炭、軽金属、船舶、航空機の増産のため、内閣総理大臣が各省の大臣に必要な指示を下せるようにする。各省の縄張りが生産の妨げとなっている今、行政の権限を首相のもとに集中させる必要がある。"
 JAP_pol_speech_and_assembly_control_law:0 "言論出版集会結社等臨時取締法"
 JAP_pol_speech_and_assembly_control_law_desc:0 ""
 JAP_pol_munitions_company_law:0 "軍需会社法"
 JAP_pol_munitions_company_law_desc:0 "重要な軍需企業を軍需会社に指定し、政府が任命に関与する生産責任者に経営の全権と増産の責任を負わせる。株主の意向よりも国家の要請を優先させることで、企業は名実ともに国家の生産機関となるだろう。"
 JAP_pol_wartime_emergency_measures_law:0 "戦時緊急措置法"
 JAP_pol_wartime_emergency_measures_law_desc:0 "本土が戦場となる事態に備え、軍需生産、食糧、輸送、防衛など広範な事項について、政府が他の法令にかかわらず必要な命令を下せるようにする。議会を召集する余裕すら失われかねない今、政府に全権を委ねるほかない。"
 JAP_pol_army_purge_speech:0 "粛軍演説"
 JAP_pol_army_purge_speech_desc:0 ""
 JAP_pol_fundamentals_of_national_policy:0 "国策の基準"
 JAP_pol_fundamentals_of_national_policy_desc:0 ""
 JAP_pol_anti_comintern_pact:0 "日独防共協定"
 JAP_pol_anti_comintern_pact_desc:0 ""
 JAP_pol_shut_up_incident:0 "「黙れ」事件"
 JAP_pol_shut_up_incident_desc:0 ""
 JAP_pol_new_order_in_east_asia:0 "東亜新秩序"
 JAP_pol_new_order_in_east_asia_desc:0 "この戦いの目的は、日本、満洲、支那の三国が提携して東亜に新たな秩序を建設することにあると声明する。国民政府であっても、従来の政策を改めて新秩序の建設に加わるならば、我々はこれを拒まない。"
 JAP_pol_basic_national_policy_outline:0 "基本国策要綱"
 JAP_pol_basic_national_policy_outline_desc:0 ""
 JAP_pol_planning_board_incident:0 "企画院事件"
 JAP_pol_planning_board_incident_desc:0 "企画院の立案した経済新体制の原案は、資本と経営の分離を掲げて財界の猛反発を招いた。原案から急進的な条項を削り、立案にあたった官僚を治安維持法違反の容疑で検挙することで、この対立に幕を引くほかない。"
 JAP_pol_planning_board_draft_stands:0 "企画院原案の貫徹"
 JAP_pol_planning_board_draft_stands_desc:0 "企画院の立案した経済新体制の原案は、資本と経営の分離を掲げて財界の猛反発を招いた。財界の反対を押し切って原案どおりに閣議決定すれば、企業は利潤の追求から切り離され、国家の計画に従う生産の機関となるだろう。"
 JAP_pol_neutrality_pact_with_the_soviet_union:0 "日ソ中立条約"
 JAP_pol_neutrality_pact_with_the_soviet_union_desc:0 "我々は今、連合国と対峙しているが、もし二正面戦争ともなれば我々の崩壊は免れ得ない。朝鮮半島と満洲国の国境を保護、かつ安定化させる必要がある。もちろん、この協定を締結するのならば、当面の間は北方への進出は行えない。"
 JAP_pol_negotiations_with_the_united_states:0 "日米交渉"
 JAP_pol_negotiations_with_the_united_states_desc:0 "野村大使とハル国務長官の間で、日米の国交を調整する交渉が続いている。支那からの撤兵や三国同盟をめぐる隔たりは大きいが、交渉を続けるかぎりアメリカとの決定的な破局は先に延ばすことができるだろう。"
 JAP_pol_outline_of_imperial_national_policy:0 "帝国国策要綱"
 JAP_pol_outline_of_imperial_national_policy_desc:0 ""
 JAP_pol_hull_note:0 "ハル・ノート"
 JAP_pol_hull_note_desc:0 ""
 JAP_pol_ministry_of_greater_east_asia:0 "大東亜省"
 JAP_pol_ministry_of_greater_east_asia_desc:0 ""
 JAP_pol_greater_east_asia_conference:0 "大東亜会議"
 JAP_pol_greater_east_asia_conference_desc:0 ""
 JAP_pol_volunteer_military_service_law:0 "国民義勇兵役法"
 JAP_pol_volunteer_military_service_law_desc:0 ""
 JAP_pol_arita_craigie_agreement:0 "有田・クレーギー協定"
 JAP_pol_arita_craigie_agreement_desc:0 "天津の租界をめぐる対立を収めるため、有田外相とクレーギー大使の間で、イギリスが支那における我が軍の特殊な要求を認める取り決めを結ぶ。イギリスとの関係が和らげば、英米がそろって我が国に圧力をかける事態を遠ざけられるだろう。"
 JAP_pol_nomura_as_foreign_minister:0 "野村外相の起用"
 JAP_pol_nomura_as_foreign_minister_desc:0 "知米派として知られる野村吉三郎海軍大将を外務大臣に据える。アメリカとの関係を立て直すには、彼の地に知己の多い人物に交渉を託すのが最善だろう。"
 # the party of the non-aligned government until the Imperial Rule Assistance Association
 JAP_pol_national_unity_party:0 "挙国一致"
 JAP_pol_national_unity_party_long:0 "挙国一致内閣"
 # focuses taken for the player
