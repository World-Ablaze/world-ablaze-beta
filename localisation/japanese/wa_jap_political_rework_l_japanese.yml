 # effects on the Diet
 JAP_diet_gov_national_unity_tt:0 "§Y立憲民政党§!、§Y立憲政友会§!、§Y昭和会§!、§Y国民同盟§!が§Y衆議院§!の与党となる。\n"
 JAP_diet_gov_seiyukai_leaves_tt:0 "§Y立憲政友会§!が野党に転じる。\n"
 JAP_diet_gov_non_party_tt:0 "§Y昭和会§!、§Y国民同盟§!のみが§Y衆議院§!の与党となる。\n"
 JAP_diet_election_1937_tt:0 "§Y衆議院§!で§Y立憲民政党§!が§Y179§!議席、§Y立憲政友会§!が§Y175§!議席、§Y昭和会§!が§Y19§!議席、§Y国民同盟§!が§Y11§!議席を占める。\n"
 JAP_diet_gov_all_parties_tt:0 "§Y立憲民政党§!、§Y立憲政友会§!、§Y政友会正統派§!、§Y昭和会§!、§Y国民同盟§!が§Y衆議院§!の与党となる。\n"
 JAP_diet_seiyukai_split_tt:0 "§Y立憲政友会§!が分裂する。§Y衆議院§!で§Y立憲政友会§!が§Y107§!議席、§Y政友会正統派§!が§Y66§!議席を占める。\n§Y政友会正統派§!が野党に転じる。\n"
 JAP_diet_election_1942_tt:0 "§Y衆議院§!の総選挙が行われる。\n"
 JAP_pol_yokusan_seijikai_desc_before:0 "大政翼賛会は政治結社ではなく、議会には政府を支える会派が存在しない。総選挙ののち全議員を唯一の政治結社に加入させれば、議会の協力は揺るぎないものとなるだろう。"
 JAP_pol_yokusan_seijikai_desc_after:0 "大政翼賛会がありながら、推薦を受けない候補が八十五人も当選してしまった。これを放置すれば、議会はふたたび政府批判の足場となるだろう。ただちに唯一の政治結社を設けて全議員を加入させ、事態を収拾せねばならない。"
 JAP_pol_yokusan_seijikai_desc_after_saito:0 "推薦を受けない候補が八十五人も当選し、議会を除名された斎藤隆夫までが議席に返り咲いてしまった。これを放置すれば、議会はふたたび政府批判の足場となるだろう。ただちに唯一の政治結社を設けて全議員を加入させ、事態を収拾せねばならない。"
 JAP_diet_form_yokusan_seijikai_tt:0 "§Y衆議院§!で§Y大政翼賛会§!が§Y464§!議席、その他が§Y2§!議席を占める。\n"
 JAP_diet_expel_saito_tt:0 "§Y立憲民政党§!が§Y衆議院§!の議席を§R1§!失う。\n"
