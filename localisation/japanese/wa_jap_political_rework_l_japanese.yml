 jap_kyujo.1.t:0 "宮城事件"
 jap_kyujo.1.d:0 "政府が共同宣言の受諾を決めた夜、陸軍省の一部将校が近衛師団を動かして宮城を占拠し、詔書の放送を阻もうとしている。東部軍がこれに呼応すれば政府は倒れ、戦争は続くことになる。"
