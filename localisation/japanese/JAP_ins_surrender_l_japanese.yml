l_japanese:
 jap_ins_surrender.2.t:0 "蘭印の降伏"
 jap_ins_surrender.2.d:0 "首都バタビアに続いてスラバヤが陥ち、パレンバンの油田も我が手にある。最後の拠点バンドンに追い詰められた蘭印軍は、ついに全軍の降伏を受け入れた。占領した島々は陸海軍の軍政の下に置かれ、南方の資源が我が国の戦争を支えることになる。"
 jap_ins_surrender.2.a:0 "南方の資源はわれらのものだ"
 jap_ins_surrender.2.a_tt:0 "§Y蘭印§!の島々を§Y3つの軍政§!に分けて傀儡とする
§Y南西パプア§!と§Y西中部山脈§!は蘭印に残る"
 jap_ins_surrender.3.t:0 "蘭印軍の降伏"
 jap_ins_surrender.3.d:0 "ジャワは日本軍の手に落ち、植民地政府は降伏を受け入れた。だがニューギニア南部では今も我々の旗が翻っている。戦いはまだ終わっていない。"
 jap_ins_surrender.3.a:0 "最後まで戦い抜く"
