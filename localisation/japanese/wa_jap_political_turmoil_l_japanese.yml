l_japanese:
 # The turmoil of 1937 (events/JAP_political_turmoil.txt), in the order the events fire.
 jap_pol_turmoil.1.t:0 "腹切り問答"
 jap_pol_turmoil.1.d:0 "衆議院本会議で、立憲政友会の浜田国松が軍部の政治介入を厳しく批判した。寺内寿一陸軍大臣はこれを軍への侮辱と受け取り、両者は一歩も譲らず議場は騒然となった。面目を潰された陸相は議会の解散を強く求めており、内閣は政党と陸軍の板挟みに陥っている。"
 jap_pol_turmoil.1.a:0 "厄介なことになった"
 jap_pol_turmoil.2.t:0 "広田内閣総辞職"
 jap_pol_turmoil.2.d:0 "議会の解散を求める寺内陸相と、これに反対する政党出身の閣僚との対立は、ついに解けなかった。閣内の不一致を収拾できなくなった広田弘毅は、内閣総辞職を決意した。二・二六事件の後始末を担った内閣は、一年ももたずに倒れたことになる。"
 jap_pol_turmoil.2.a:0 "次は誰が引き受けるのか"
 jap_pol_turmoil.3.t:0 "宇垣一成に大命降下"
 jap_pol_turmoil.3.d:0 "後継の首相として、予備役陸軍大将の宇垣一成に組閣の大命が下った。かつて陸軍大臣として軍縮を成し遂げた宇垣であれば軍部を抑えられる、というのが元老西園寺公望の見立てである。だが、その軍縮で部隊を削られた陸軍が、大人しく従うとは考えにくい。"
 jap_pol_turmoil.3.a:0 "彼ならやれるはずだ"
 jap_pol_turmoil.10.t:0 "陸相のなり手がいない"
 jap_pol_turmoil.10.d:0 "参謀本部の石原莞爾らは宇垣の組閣を阻止すべく、陸軍首脳部を突き上げている。陸軍大臣の候補と目された杉山元も小磯国昭も就任を断り、大臣の椅子は宙に浮いた。軍部大臣は現役の将官に限られるため、陸軍が人を出さなければ内閣は成立しない。"
 jap_pol_turmoil.10.a:0 "誰も引き受けないのか"
 jap_pol_turmoil.11.t:0 "宇垣、陸相兼任を願い出る"
 jap_pol_turmoil.11.d:0 "窮した宇垣は、自らを現役に復帰させたうえで陸軍大臣を兼任できるよう、勅命を仰ぐことを内大臣の湯浅倉平に求めた。しかし湯浅は、失敗すれば宮中に累が及ぶことを恐れてこれを拒んだ。組閣の道は、ほぼ閉ざされたと言ってよいだろう。"
 jap_pol_turmoil.11.a:0 "万策尽きたか"
 jap_pol_turmoil.4.t:0 "宇垣内閣の流産"
 jap_pol_turmoil.4.d:0 "陸軍大臣を得られなかった宇垣一成は、ついに組閣を断念し大命を拝辞した。大命を受けた者が、陸軍の反対だけで内閣を作れなかったのである。今後は陸軍の同意なくして、いかなる内閣も成立しえないだろう。"
 jap_pol_turmoil.4.a:0 "大命でさえ通らないのか"
 jap_pol_turmoil.5.t:0 "林銑十郎内閣の成立"
 jap_pol_turmoil.5.d:0 "宇垣に代わって大命を受けた予備役陸軍大将の林銑十郎が、内閣を組織した。首相自らが複数の大臣を兼任する小所帯で、衆議院で与党と呼べるのは昭和会と国民同盟だけである。議席の大半を占める二大政党を敵に回して、この内閣がどこまでもつかは疑わしい。"
 jap_pol_turmoil.5.a:0 "お手並み拝見といこう"
 jap_pol_turmoil.6.t:0 "食い逃げ解散"
 jap_pol_turmoil.6.d:0 "立憲民政党と立憲政友会は重要法案の審議を引き延ばし、林内閣を散々にてこずらせてきた。予算が成立するや、林首相は政党を懲らしめるとして衆議院の解散に踏み切った。予算だけ通して議会を解散するやり方は、「食い逃げ」と非難を浴びている。"
 jap_pol_turmoil.6.a:0 "選挙で白黒をつけよう"
 jap_pol_turmoil.7.t:0 "第20回衆議院議員総選挙"
 jap_pol_turmoil.7.d:0 "総選挙の結果、立憲民政党と立憲政友会がそれぞれ第一党と第二党の座を守った。政府を支持する昭和会と国民同盟は議席を減らし、社会大衆党が第三党に躍進している。政党を懲らしめるはずの解散は、内閣への不信任を突きつけられる結果に終わった。"
 jap_pol_turmoil.7.a:0 "民意は示された"
 jap_pol_turmoil.12.t:0 "林首相の居座り"
 jap_pol_turmoil.12.d:0 "選挙に敗れてもなお、林首相は強気の姿勢を崩していない。政権を維持すると明言したばかりか、再び議会を解散することまでちらつかせている。これが政党の怒りに油を注ぎ、倒閣運動は日増しに勢いを増している。"
 jap_pol_turmoil.12.a:0 "まだ居座るつもりか"
 jap_pol_turmoil.8.t:0 "両党の退陣要求"
 jap_pol_turmoil.8.d:0 "立憲民政党と立憲政友会は、互いの対立を棚上げにして手を結び、林内閣の即時退陣を要求した。衆議院の大半を敵に回した内閣には、もはや法案を一本通す見込みもない。内閣は完全に孤立した。"
 jap_pol_turmoil.8.a:0 "潮時だろう"
 jap_pol_turmoil.9.t:0 "林内閣総辞職"
 jap_pol_turmoil.9.d:0 "四面楚歌となった林銑十郎は、ついに内閣総辞職を決めた。組閣からわずか四か月、これといった実績を残さないままの退場である。腹切り問答に始まった政局の混迷を収めるには、軍部にも政党にも受け入れられる人物が必要だろう。"
 jap_pol_turmoil.9.a:0 "ようやく終わった"
