 # The turmoil of 1937 (events/JAP_political_turmoil.txt). The texts are placeholders: titles only, three bodies taken from the focuses these events replace.
 jap_pol_turmoil.1.t:0 "腹切り問答"
 jap_pol_turmoil.1.d:0 "衆議院で軍の政治介入を批判された陸相は、懲罰として議会の解散を強く求めている。だが政党から入閣した大臣たちがこれを受け入れるはずもない。閣内の対立を収める手立てはなく、総辞職のほかに道はないだろう。"
 jap_pol_turmoil.1.a:0 ""
