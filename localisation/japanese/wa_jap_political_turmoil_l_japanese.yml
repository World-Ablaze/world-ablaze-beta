 jap_pol_turmoil.2.a:0 ""
 jap_pol_turmoil.3.t:0 "宇垣一成に大命降下"
 jap_pol_turmoil.3.d:0 ""
 jap_pol_turmoil.3.a:0 ""
 jap_pol_turmoil.4.t:0 "宇垣内閣の流産"
 jap_pol_turmoil.4.d:0 "陸軍が大臣を出さないかぎり、大命を受けた宇垣といえども組閣はできない。政党や重臣が首相を選ぶ時代は終わったのだ。今後は陸軍の支持を得られる者だけが、内閣を率いることになるだろう。"
 jap_pol_turmoil.4.a:0 ""
 jap_pol_turmoil.5.t:0 "林銑十郎内閣の成立"
 jap_pol_turmoil.5.d:0 ""
 jap_pol_turmoil.5.a:0 ""
 jap_pol_turmoil.6.t:0 "食い逃げ解散"
 jap_pol_turmoil.6.d:0 "予算が成立した今こそ、政府に協力しない政党を懲らしめる好機である。議会を解散し、政府を支持する勢力を選挙で伸ばさなければ、政党はいつまでも我々の足を引っ張り続けるだろう。"
