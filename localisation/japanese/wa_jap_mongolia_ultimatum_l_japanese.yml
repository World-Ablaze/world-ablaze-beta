l_japanese:
 # Ultimatum to Outer Mongolia (events/JAP_mongolia_ultimatum.txt). The texts follow jap_armor.835 and 836 (the ultimatum to Thailand).
 jap_pol_mongolia.1.t:0 "[JAP.GetName]が最後通牒を提示"
 jap_pol_mongolia.1.d:0 "日本は北方へ矛先を向けており、我々に対し、[SOV.GetNameDef]との関係を断って日本の側に付くよう求める外交使節を派遣してきた。しかし、彼らは短剣を携えており、我々の拒否という答えを受け入れないことは明白である。"
 jap_pol_mongolia.1.a:0 "我々の未来は共栄圏にある"
 jap_pol_mongolia.1.b:0 "もし戦うのであれば、それは祖国防衛のためだ"
 jap_pol_mongolia.2.t:0 "[MON.GetName]が最後通牒を拒否"
 jap_pol_mongolia.2.d:0 "残念ながら、[MON.GetName]との同盟締結には失敗した。しかし、その戦略的重要性から、外蒙古を良き進出拠点とするために武力を用いなければならない。"
 jap_pol_mongolia.2.a:0 "武力を行使する必要がある。"
