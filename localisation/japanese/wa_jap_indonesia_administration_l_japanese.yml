 # Decisions
 JAP_indonesian_military_administrations:0 "蘭印に軍政を施行"
 JAP_indonesian_military_administrations_desc:0 "陸海軍中央協定に従い、占領した蘭印を三つの地域に分けて統治する。ジャワは第十六軍、スマトラは第二十五軍が軍政を敷き、ボルネオから東の島々は海軍が民政府を置いて治める。"
 JAP_indonesian_military_administrations_tt:0 "我が国か従属国が支配する§Yインドネシア§!の中核州を、次の三つに分けて移譲する。\n§Yジャワ§!は§Yジャワ軍政監部§!へ。\n§Yスマトラ§!は§Yスマトラ軍政監部§!へ。\nそのほかの州は§Y南西方面海軍民政府§!へ。\n三つとも我が国の§Y帝国保護国§!となる。"
 JAP_recognise_east_indies_independence:0 "東インドの独立を認める"
 JAP_recognise_east_indies_independence_desc:0 "共栄圏は民族独立へ向かうと定まった。東インド民族の永遠の福祉を確保するため、陸海軍の軍政地域を一つにまとめ、その独立を認める。"
 JAP_recognise_east_indies_independence_tt:0 "§Yジャワ軍政監部§!、§Yスマトラ軍政監部§!、§Y南西方面海軍民政府§!を統合し、§Yインドネシア国§!を樹立する。\n§Yインドネシア国§!は我が国の§Y帝国従属国§!となる。"
 JAP_recognise_east_indies_independence_unlock_tt:0 "ディシジョン§Y東インドの独立を認める§!が解禁される。"
 JAP_unify_east_indies_administration:0 "東インドの軍政を統合"
 JAP_unify_east_indies_administration_desc:0 "共栄圏は帝国の指導の下に置かれると定まった。陸海軍に分かれた東インドの軍政を一つにまとめ、資源の開発と民心の把握を一元的に進める。"
 JAP_unify_east_indies_administration_tt:0 "§Yジャワ軍政監部§!、§Yスマトラ軍政監部§!、§Y南西方面海軍民政府§!を統合し、§Yインドネシア帝国保護国§!を樹立する。"
 JAP_unify_east_indies_administration_unlock_tt:0 "ディシジョン§Y東インドの軍政を統合§!が解禁される。"
 JAP_indonesian_administrations_in_hand_tt:0 "東インドの軍政地域がすべて我が国の従属国である"
 JAP_indonesian_resource_states_in_hand_tt:0 "§Yスマトラ§!、§Yジャワ§!、§Yカリマンタン§!のそれぞれを、我が国の従属国が領有し完全に支配している"
