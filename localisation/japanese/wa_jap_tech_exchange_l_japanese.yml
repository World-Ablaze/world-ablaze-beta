l_japanese:
 JAP_gte_category:0 "ドイツとの技術交流"
 JAP_gte_technology_exchange:0 "ドイツとの技術交流"
 JAP_gte_technology_exchange_desc:0 "ドイツから技術者と資料を本土へ迎え入れる。道中の要衝を我々と同盟国が押さえているほど、無事に届く見込みは高まるだろう。"
 JAP_gte_status_tt:0 "成功すると、§Y陸軍科学研究所§!に続く国家方針の効果が強化される。\n\n[JAP_gte_line_suez_canal]を押さえていればスエズ経由、いなければ喜望峰経由で送り出す。"
 JAP_gte_leg_mediterranean:0 "地中海の通過"
 JAP_gte_leg_mediterranean_desc:0 "[JAP_gte_line_malta]と[JAP_gte_line_derna]を押さえていれば、無事に抜けられる見込みが高い。"
 JAP_gte_leg_red_sea:0 "紅海の通過"
 JAP_gte_leg_red_sea_desc:0 "[JAP_gte_line_suez_canal]と[JAP_gte_line_french_somaliland]を押さえていれば、無事に抜けられる見込みが高い。"
 JAP_gte_leg_atlantic:0 "大西洋の通過"
 JAP_gte_leg_atlantic_desc:0 "[JAP_gte_line_brittany]を押さえていれば、無事に抜けられる見込みが高い。"
 JAP_gte_leg_cape:0 "喜望峰の通過"
 JAP_gte_leg_cape_desc:0 "[JAP_gte_line_western_cape]と[JAP_gte_line_madagascar]を押さえていれば、無事に抜けられる見込みが高い。"
 JAP_gte_leg_asia:0 "インド洋と南シナ海の通過"
 JAP_gte_leg_asia_desc:0 "[JAP_gte_line_ceylon]、[JAP_gte_line_singapore]、[JAP_gte_line_taiwan]を押さえていれば、無事に本土へ届く見込みが高い。"
 JAP_gte_in_transit_tt:0 "送り出した一行が道中にいない"
 JAP_gte_cooldown_tt:0 "前回の失敗から180日が経っている"
 JAP_gte_success_tt:0 "これ以降に完了する、§Y陸軍科学研究所§!に続く国家方針の効果が強化される。"
 JAP_gte_failure_tt:0 "180日後に、再び§Yドイツとの技術交流§!を行えるようになる。"
 JAP_gte_focus_hint_tt:0 "§Yドイツとの技術交流§!を済ませてから完了すると、効果が強化される。"
 JAP_gte_focus_hint_ta_dan_tt:0 "§Yドイツとの技術交流§!を済ませてから完了すると、効果が強化され、§Yタ弾§!も得られる。"
 jap_gte.2.t:0 "ドイツからの技術の到着"
 jap_gte.2.desc:0 "数か月に及ぶ道のりを越えて、ドイツの技術者と図面の束が本土に届いた。技術本部の技師たちは梱包を解くのももどかしく、夜を徹して資料の翻訳に取りかかっている。"
 jap_gte.2.a:0 "一刻も早く実用化せよ"
 jap_gte.3.t:0 "ドイツとの連絡の途絶"
 jap_gte.3.desc:0 "ドイツを発った一行は、予定の日を過ぎても本土に姿を現さなかった。最後の連絡を境に消息は途絶え、託された図面も技術者も行方が知れない。再び人と資料を送り出すには、相応の準備が要る。"
 jap_gte.3.a:0 "次の機会を待つ"
 JAP_ta_dan:0 "タ弾"
 JAP_ta_dan_desc:0 "ドイツの技術供与で開発した成形炸薬弾。弾速の遅い山砲や歩兵砲でも、戦車の装甲を貫くことができる。"
