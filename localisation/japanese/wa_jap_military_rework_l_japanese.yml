 JAP_eleventh_air_fleet:0 "第十一航空艦隊"
 JAP_eleventh_air_fleet_desc:0 "基地航空部隊を一つの指揮の下に束ね、陸上攻撃機による大規模な洋上作戦を可能にする。"
 JAP_eleventh_air_fleet_bomber_mastery_tt:0 "£doctrine_mod  爆撃機ドクトリン習熟度獲得: §G+7%§!"
 JAP_relentless_training_idea:0 "月月火水木金金"
 JAP_relentless_training_idea_desc:0 "休日を返上し、月月火水木金金の猛訓練に明け暮れる。数に劣る我が艦隊が勝ち抜くには、練度で敵を上回るほかない。その代償は、絶えない事故と燃料の消耗である。"
