 JAP_expand_the_armoured_divisions_old:0 "機甲軍の創設"
 JAP_expand_the_armoured_divisions_old_desc:0 "戦車第一師団に続く戦車師団が増えるにつれ、それらを統べる司令部が必要となっている。機甲軍は平時には各師団の錬成と人員・機材の補充を担い、有事には求められる戦線へ戦車師団を送り出す。戦車師団は歩兵の支援ではなく、戦線を動かす戦力として使われることになるだろう。"
