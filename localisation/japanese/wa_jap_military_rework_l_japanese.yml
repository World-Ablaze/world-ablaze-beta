 JAP_first_tank_division_old_desc:0 "戦車団を基幹に自動車化歩兵と自動車化砲兵を加え、我が国初の戦車師団を編成す\nる。戦車を歩兵に随伴させるのではなく、戦車を主軸に歩兵と砲兵が支える突破戦力である。"
 JAP_first_tank_group_old:0 "第一戦車団"
 JAP_first_tank_group_old_desc:0 "複数の戦車連隊を束ねる戦車団司令部を新設し、戦車の運用を専門に担わせる。任務は依然として歩兵の直接支援にとどまるが、戦車を独自の指揮系統で束ねることは、将来の機甲部隊への布石となるだろう。"
