 JAP_inspectorate_infantry_mastery:0 "歩兵ドクトリンの習熟"
 JAP_inspectorate_infantry_mastery_tt:0 "£doctrine_mod  歩兵ドクトリン習熟度獲得: §G+10%§!"
 JAP_anti_air_design_cost_tt:0 "§Y全ての対空§!ユニットの設計コストが§G-100%§!\n§O戦車派生型を含む§!"
 JAP_anti_tank_design_cost_tt:0 "§Y全ての対戦車§!のユニット設計コストが§G-100%§!\n§O戦車派生型を含む§!"
 JAP_army_ordnance_administration_headquarters:0 "陸軍兵器本部"
 JAP_army_ordnance_administration_headquarters_desc:0 "兵器の研究、製造、補給はそれぞれ別の機関が受け持っている。窓口が一つになれば、前線が求める兵器をより早く届けられるだろう。"
 JAP_nakano_school:0 "陸軍中野学校"
 JAP_nakano_school_desc:0 "陸軍は秘密戦の専門家を育てる学校を新たに設け、軍服を脱いで市井に紛れる将校を送り出すことになる。"
 JAP_nakano_school_spirit:0 "陸軍中野学校"
 JAP_nakano_school_spirit_desc:0 "中野で学んだ将校たちは、商社員や記者を装ってアジア各地へ散っている。国内では防諜の網が張られ、外では現地の独立運動と結んだ工作が進んでいる。"
 JAP_volunteer_fighting_corps:0 "国民義勇隊"
 JAP_volunteer_fighting_corps_desc:0 ""
 JAP_inspectorate_general_of_army_aviation:0 "陸軍航空総監部"
 JAP_inspectorate_general_of_army_aviation_desc:0 "航空の専門教育は、これまで軍政を担う航空本部が兼務してきた。専任の総監部を設ければ、陸軍の中に新たな対立を生むだろう。"
 JAP_air_armament_expansion_plan:0 "航空軍備充実計画"
 JAP_air_armament_expansion_plan_desc:0 "新たな軍備充実計画は航空兵力の増強を重視し、陸軍中央では｢航空優先｣の標語が掲げられている。だが最後発の航空兵科には中核となる機関がなく、陰では｢地上絶対｣という揶揄も囁かれている。陸軍機を手がける中島と川崎に発注と資金を集めなければ、｢航空優先｣は標語のまま終わるだろう。"
 JAP_light_fighter_dogfight_doctrine:0 "格闘戦至上主義"
 JAP_light_fighter_dogfight_doctrine_desc:0 "九七式戦闘機は旋回性能に優れ、水平面での格闘戦で敵機を圧倒する。戦闘機の価値は運動性にあるという信念は、陸軍航空に深く根を張っている。"
 JAP_homeland_air_defence_priority:0 "防空飛行隊の新設"
 JAP_homeland_air_defence_priority_desc:0 "戦闘機を前線へ送り出すほど本土の空は手薄になる。本土が空襲される日が来る前\nに、新型迎撃戦闘機の防空飛行隊と高射砲陣地を整えねばならない。"
 JAP_heavy_bomber_expansion:0 "重爆連隊の増設"
 JAP_heavy_bomber_expansion_desc:0 "陸軍航空の役割は、地上部隊の頭上を守ることだけではない。新型重爆撃機がそろえば、敵の補給線や工業地帯も爆撃の届く範囲に入るだろう。"
 JAP_army_air_arsenal_expansion:0 "陸軍航空工廠"
 JAP_army_air_arsenal_expansion_desc:0 "陸軍はこれまで、航空機の製造の大半を民間の工場に頼ってきた。自前の製造設備を持つ海軍に後れを取らないよう、名古屋に分かれていた機体と発動機の技術を立川に集め、陸軍唯一の航空工廠とする。設計から製造までを自前で担えれば、民間の都合に左右されずに新型機を送り出せるだろう。"
 JAP_youth_pilot_training:0 "少年飛行兵の大量養成"
 JAP_youth_pilot_training_desc:0 "少年飛行兵の採用枠を大幅に広げ、前線を支える下士官の操縦者を養成する。"
