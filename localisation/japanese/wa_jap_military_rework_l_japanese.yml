 JAP_first_and_second_general_armies_desc:0 ""
 JAP_inspectorate_general_of_military_training:0 "教育総監部"
 JAP_inspectorate_general_of_military_training_desc:0 "陸軍の教育は兵科ごとの学校に分かれ、教える内容も食い違いがちである。訓練の行き届いた予備兵が増えれば、新しい師団の編成も滞りなく進むだろう。"
