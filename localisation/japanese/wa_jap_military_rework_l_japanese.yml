 JAP_expand_the_armoured_divisions:0 "機甲軍の創設"
 JAP_expand_the_armoured_divisions_desc:0 "戦車第一師団に続く戦車師団が増えるにつれ、それらを統べる司令部が必要となっている。機甲軍は平時には各師団の錬成と人員・機材の補充を担い、有事には求められる戦線へ戦車師団を送り出す。戦車師団は歩兵の支援ではなく、戦線を動かす戦力として使われることになるだろう。"
 JAP_air_divisions:0 "飛行師団の創設"
 JAP_air_divisions_desc:0 "戦線の拡大とともに、飛行戦隊と飛行団を統合して運用する上級司令部が不可欠と\nなっている。師団に準ずる扱いだった飛行集団を飛行師団へ改編・昇格させ、各戦域の航空作戦を一元的に指揮する体制を確立する。その先陣を切るのは、隼を駆る加藤建夫の飛行第64戦隊である。"
 JAP_island_garrisons:0 "南方資源の陸送"
 JAP_island_garrisons_desc:0 "基本国策要綱は、日満支を一環とし大東亜を包括する自給自足経済の確立をうたっている。だが蘭印とマレーの資源は、これまで船腹に頼って本土へ運ばれてきた。縦貫鉄道を使い、その輸送を陸路へ切り替える。これにより、資源は通商破壊の脅威を受けずに本土へ届き、浮いた船腹をほかの用途に回せるようになるだろう。"
