 JAP_overconfident_ciphers:0 "暗号への過信"
 JAP_overconfident_ciphers_desc:0 "外務省の暗号機も、海軍の暗号書も、外国に破られることはないと信じられている。"
 JAP_overconfident_ciphers_complacent:0 "暗号への過信"
 JAP_overconfident_ciphers_complacent_desc:0 "緒戦の大勝に沸くなか、暗号の扱いはますます緩んでいる。破られているかもしれないと疑う声は、ほとんど聞かれない。"
 JAP_overconfident_diplomatic_ciphers:0 "外交暗号への過信"
 JAP_overconfident_diplomatic_ciphers_desc:0 "海軍は暗号書を改め、乱数表もこまめに替えるようになった。だが外務省の暗号機は、いまも破られることはないと信じられている。"
