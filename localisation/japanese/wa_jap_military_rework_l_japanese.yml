 JAP_mine_warfare:0 "機雷戦"
 JAP_mine_warfare_desc:0 ""
 JAP_shinoda_research_section:0 "篠田研究所の拡張"
 JAP_shinoda_research_section_desc:0 "近年新設された第九陸軍技術研究所という研究所と、廃墟と化した東京砲兵工廠を利用することで、篠田研究所が利用できる資源が拡大した。これによって諜報部門の能力を急速に拡大することができる。"
 JAP_ijn_technical_research_institute:0 "海軍技術研究所"
 JAP_ijn_technical_research_institute_desc:0 ""
 JAP_first_tank_group:0 "第一戦車団"
 JAP_first_tank_group_desc:0 "戦車団司令部を新設し、戦車の運用を専門に担わせる。任務は依然として歩兵の直接支援にとどまるが、将来の機甲部隊への布石となるだろう。"
 JAP_begin_mechanisation:0 "機械化への着手"
 JAP_begin_mechanisation_desc:0 "陸軍の補給と砲の牽引はいまも馬に頼っている。国内の自動車工業が育たないかぎ\nり、機械化部隊を数多くそろえることはできないだろう。"
