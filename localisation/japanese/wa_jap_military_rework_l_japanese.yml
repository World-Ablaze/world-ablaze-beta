 JAP_staff_officers_to_field_commands:0 "中央幕僚の野戦転出"
 JAP_staff_officers_to_field_commands_desc:0 "参謀本部と陸軍省の要職は、久しく部隊を離れた幕僚に占められてきた。作戦計画の立案に長じながら、師団を率いた経験を持たない者も少なくない。定期異動を機に、大陸通の情報部長をはじめとする中央の俊英を野戦部隊の長へ転出させる。机上で磨いた計画能力は、実兵の指揮で試されることになるだろう。"
