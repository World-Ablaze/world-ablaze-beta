 JAP_project_z:0 "Z計画"
 JAP_project_z_desc:0 "アメリカ人は明らかに太平洋における我々の主要な敵である。彼らを直接脅かしたいならば、彼らの本土に到達できる重大陸間爆撃機を開発しなければならない！"
 JAP_anti_air_guns:0 "高射砲と防空火器"
 JAP_anti_air_guns_desc:0 "航空機の速度と高度は年ごとに上がり、旧式の高射砲では届かなくなりつつある。空からの攻撃を防げなければ、前線の部隊も後方の工場も守れなくなる。"
 JAP_army_armoured_headquarters:0 "陸軍機甲本部の設置"
 JAP_army_armoured_headquarters_desc:0 "ノモンハンでソビエトが見せた戦車の集中運用と、欧州でドイツの装甲師団が遂げた電撃的な進撃は、戦車こそが戦場の主役であることを証明した。機甲戦力の教育と研究を一つの本部にまとめなければ、この潮流から取り残されるだろう。"
 JAP_army_armoured_headquarters_khalkhin_gol_tt:0 "§Yノモンハン§!で§Y[SOV.GetName]§!と衝突した"
 JAP_army_armoured_headquarters_fall_of_france_tt:0 "§Yフランス§!が陥落した"
 JAP_reinforce_the_expeditionary_army:0 "支那派遣軍の編成"
 JAP_reinforce_the_expeditionary_army_desc:0 "事変が長引くなか、華北と華中の現地軍はそれぞれの判断で戦線を広げてきた。南京に置かれた総司令部は、大陸の全軍を一つの指揮の下に束ねようとしている。現地軍の独断がこれで止むかはまだ分からないが、少なくとも命令の出どころは一つにな\nる。"
 JAP_reservist_associations:0 "在郷軍人会と動員基盤"
 JAP_reservist_associations_desc:0 ""
 JAP_tokyo_express_operations:0 "鼠輸送"
 JAP_tokyo_express_operations_desc:0 ""
 JAP_first_air_fleet:0 "第一航空艦隊"
 JAP_first_air_fleet_desc:0 ""
 JAP_type_3_medium_tank:0 "対戦車火力の強化"
 JAP_type_3_medium_tank_desc:0 "敵の戦車は年ごとに装甲を厚くしている。敵戦車を止める手段を持たなければ、歩兵は肉薄攻撃に頼るほかなくなる。"
 JAP_first_tank_division:0 "戦車第一師団の編成"
 JAP_first_tank_division_desc:0 "戦車団を基幹に自動車化歩兵と自動車化砲兵を加え、我が国初の戦車師団を編成す\nる。戦車を歩兵に随伴させるのではなく、戦車を主軸に歩兵と砲兵が支える突破戦力である。"
 JAP_integrate_takasago_volunteers:0 "高砂義勇隊の統合"
 JAP_integrate_takasago_volunteers_desc:0 "美麗島の忠実なる臣民は我々よりも熱帯気候に適応しやすい。南太平洋の過酷な地域で戦闘を行うため、特殊訓練を受けた大規模な義勇兵を召集するべきだ。"
 JAP_army_military_administration:0 "陸軍軍政地域を拡大"
 JAP_army_military_administration_desc:0 ""
 JAP_government_liaison_council:0 "大本営政府連絡会議"
 JAP_government_liaison_council_desc:0 "政府及び軍部の最高指導層を単一の評議会として組織することにより、各部門間の紛争を効果的に解決し、連絡会議を蝕んできた慢性的な不信や駆け引きを抑えつつ計画を推進することが可能となる。"
 JAP_navy_military_administration:0 "海軍軍政地域を拡大"
 JAP_navy_military_administration_desc:0 ""
 JAP_special_naval_landing_forces:0 "海軍特別陸戦隊の増強"
 JAP_special_naval_landing_forces_desc:0 ""
 JAP_escort_ship_mass_production:0 "海防艦の量産"
 JAP_escort_ship_mass_production_desc:0 ""
 JAP_rocket_launchers_and_expedients:0 "噴進砲と簡易兵器"
 JAP_rocket_launchers_and_expedients_desc:0 "構造が簡単で資材も少なく済む噴進砲を開発し、火砲の不足を補う。命中の精度は劣るが、数を並べて撃てば歩兵の支援には十分な火力となるだろう。"
 JAP_teishin_shudan:0 "挺進集団"
 JAP_teishin_shudan_desc:0 "挺進部隊はいまだ連隊や旅団の単位でしか運用されていない。師団規模で降下できれば、敵の後方にある要地を一挙に奪う作戦も現実のものとなるだろう。"
 JAP_secure_a_shipping:0 "陸軍船舶（A船）を確保"
 JAP_secure_a_shipping_desc:0 ""
 JAP_secure_b_shipping:0 "海軍船舶（B船）を確保"
 JAP_secure_b_shipping_desc:0 ""
 JAP_armoured_carrier_taiho:0 "装甲空母の建造"
 JAP_armoured_carrier_taiho_desc:0 ""
 JAP_original_fifth_circle_plan:0 "マル五計画"
 JAP_original_fifth_circle_plan_desc:0 ""
 JAP_modified_fifth_circle_plan:0 "改マル五計画"
 JAP_modified_fifth_circle_plan_desc:0 ""
 JAP_grand_escort_command:0 "海上護衛総司令部"
 JAP_grand_escort_command_desc:0 ""
 JAP_gun_tanks_and_self_propelled_artillery:0 "砲戦車と自走砲"
 JAP_gun_tanks_and_self_propelled_artillery_desc:0 "戦車部隊に随伴する砲兵は牽引式のままで、戦車の速さについて行けない。砲が戦車と同じ速さで動ければ、敵の対戦車砲や陣地をその場で叩けるだろう。"
 JAP_expand_the_armoured_divisions:0 "機甲軍の創設"
 JAP_expand_the_armoured_divisions_desc:0 "戦車第一師団に続く戦車師団が増えるにつれ、それらを統べる司令部が必要となっている。機甲軍は平時には各師団の錬成と人員・機材の補充を担い、有事には求められる戦線へ戦車師団を送り出す。戦車師団は歩兵の支援ではなく、戦線を動かす戦力として使われることになるだろう。"
 JAP_air_divisions:0 "飛行師団の創設"
 JAP_air_divisions_desc:0 "飛行集団を飛行師団へ改編し、各戦域の航空作戦を一元的に指揮する。その先陣を切るのは、隼を駆る加藤建夫の飛行第64戦隊である。"
 JAP_island_garrisons:0 "南方資源の陸送"
 JAP_island_garrisons_desc:0 "基本国策要綱は、日満支を一環とし大東亜を包括する自給自足経済の確立をうたっている。だが蘭印とマレーの資源は、これまで船腹に頼って本土へ運ばれてきた。縦貫鉄道を使い、その輸送を陸路へ切り替える。これにより、資源は通商破壊の脅威を受けずに本土へ届き、浮いた船腹をほかの用途に回せるようになるだろう。"
 JAP_first_escort_fleet:0 "第一海上護衛隊"
 JAP_first_escort_fleet_desc:0 ""
 JAP_hydrophones_and_depth_charges:0 "電探と水中聴音機"
 JAP_hydrophones_and_depth_charges_desc:0 ""
 JAP_army_shipping_command:0 "陸軍船舶司令部"
 JAP_army_shipping_command_desc:0 "海軍の都合に振り回されていては、陸軍の海上輸送と上陸は立ち行かない。自前で船と舟艇を運用する司令部を置けば、補給と展開の主導権を握れるはずだ。"
 JAP_run_the_navy_territories:0 "海軍軍政地域の経営"
