 JAP_infantry_direct_cooperation:0 "歩兵直協"
 JAP_infantry_direct_cooperation_desc:0 "我が国において、戦車は依然として歩兵の突撃を直接支援するための付随兵器に過ぎないと見なされている。戦車の真の価値を軍首脳部に認識させるには、手痛い戦訓や、抜本的な軍改革が必要となるだろう。"
 JAP_infantry_direct_cooperation_tt:0 "£doctrine_mod  機甲ドクトリン習熟度獲得: §R-30%§!"
