 JAP_teishin_shudan:0 "挺進集団"
 JAP_teishin_shudan_desc:0 "挺進部隊はいまだ連隊や旅団の単位でしか運用されていない。挺進練習部を廃止し、飛行師団に準じる挺進集団を編成する。師団規模で降下できれば、敵の後方にある要地を一挙に奪う作戦も現実のものとなるだろう。"
