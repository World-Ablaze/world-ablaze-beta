 JAP_army_armoured_headquarters:0 "陸軍機甲本部の設置"
 JAP_army_armoured_headquarters_desc:0 "ノモンハンでソビエトが見せた戦車の集中運用と、欧州でドイツの装甲師団が遂げた電撃的な進撃は、戦車こそが戦場の主役であることを証明した。機甲戦力の教育と研究を一つの本部にまとめなければ、この潮流から取り残されるだろう。"
