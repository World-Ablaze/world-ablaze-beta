 JAP_army_expansion_law:0 "陸軍拡大法"
 JAP_army_expansion_law_desc:0 ""
 JAP_split_the_ija_academy:0 "陸軍士官学校の分割"
 JAP_split_the_ija_academy_desc:0 "陸軍士官学校を上級と下級に分割することで、兵士をさらに組織的に訓練できる。また、熟練兵や退役軍人の介入なしに適切な教義と指導が行えるようになり、その逆もまた然りだ。"
 JAP_prioritise_the_army_plan:0 "陸軍軍備充実計画を優先"
 JAP_prioritise_the_army_plan_desc:0 ""
 JAP_five_minister_conference:0 "五相会議"
 JAP_five_minister_conference_desc:0 ""
 JAP_prioritise_the_navy_plan:0 "マル三計画を優先"
 JAP_prioritise_the_navy_plan_desc:0 ""
 JAP_big_ships_big_guns:0 "大艦巨砲主義"
 JAP_big_ships_big_guns_desc:0 ""
 JAP_preparations_for_the_post_treaty_era:0 "無条約時代の備え"
 JAP_preparations_for_the_post_treaty_era_desc:0 "ワシントン・ロンドン両海軍軍縮条約体制の終焉は、新たな建艦競争の始まりとなるだろう。比叡を高速戦艦へ復帰させ、最上型を予定されていた20.3cm砲装備へ改装して、現有艦隊の潜在力を余すことなく引き出さねばならない。"
 JAP_reorganize_the_military:0 "軍の再編"
 JAP_reorganize_the_military_desc:0 "現場の将校の暴走などを鑑みるに、陸軍は一度立ち直るべきだ。士官学校と訓練体制から再編成し、新たな将校と兵士に教義と訓練を適切に浸透させる必要がある。"
 JAP_supremacy_of_will:0 "精神的優越"
 JAP_supremacy_of_will_desc:0 "最新の武器であろうと凄烈な兵士が扱わなければ役に立たず、凄烈さは単なる岩ですら殺人的な兵器に変化させる。"
 JAP_army_leads_the_china_incident:0 "大陸の作戦を陸軍が仕切る"
 JAP_army_leads_the_china_incident_desc:0 ""
 JAP_imperial_general_headquarters:0 "大本営の設置"
 JAP_imperial_general_headquarters_desc:0 ""
 JAP_navy_leads_the_china_incident:0 "渡洋爆撃と沿岸封鎖で海軍が示す"
 JAP_navy_leads_the_china_incident_desc:0 ""
 JAP_relentless_training:0 "月月火水木金金"
 JAP_relentless_training_desc:0 ""
 JAP_third_circle_plan:0 "マル三計画"
 JAP_third_circle_plan_desc:0 ""
 JAP_recruit_takeo_yoshikawa:0 "吉川猛夫の採用"
 JAP_recruit_takeo_yoshikawa_desc:0 ""
 JAP_ija_institute_of_science:0 "陸軍科学研究所"
 JAP_ija_institute_of_science_desc:0 "満洲国、ハルビンに位置する陸軍防疫研究室を、大陸からの豊富な資源供給をもとに、軍事応用可能な技術を幅広く研究可能な大規模な研究施設に拡大、再編する。"
 JAP_fifty_division_plan:0 "五十個師団構想"
 JAP_fifty_division_plan_desc:0 "常設の師団は十七個にすぎず、大陸と満洲の両方に備えるにはまるで足りない。兵と装備をそろえる期限は厳しく、遅れれば陸軍の面目にかかわるだろう。"
 JAP_staff_officers_to_field_commands:0 "中央幕僚の野戦転出"
 JAP_staff_officers_to_field_commands_desc:0 "参謀本部と陸軍省の要職は、久しく部隊を離れた幕僚に占められてきた。机上で磨いた計画能力は、実兵の指揮で試されることになるだろう。"
 JAP_staff_to_field_toseiha_tt:0 "§Y統制派§!の将軍: 計画スキルを§G+1§!追加"
 JAP_toseiha_officer:0 "統制派"
 JAP_toseiha_officer_desc:0 "§L陸軍の統制派に連なる将官である。§!"
 JAP_toseiha_officer_ascendant:0 "統制派"
 JAP_toseiha_officer_ascendant_desc:0 "§L陸軍の統制派に連なる将官である。§!"
 JAP_night_battle_training:0 "水雷戦隊の夜戦訓練"
 JAP_night_battle_training_desc:0 ""
