 JAP_reinforce_the_expeditionary_army:0 "支那派遣軍の編成"
 JAP_reinforce_the_expeditionary_army_desc:0 "事変が長引くなか、華北と華中の現地軍はそれぞれの判断で戦線を広げてきた。南京に置かれた総司令部は、大陸の全軍を一つの指揮の下に束ねようとしている。現地軍の独断がこれで止むかはまだ分からないが、少なくとも命令の出どころは一つにな\nる。"
