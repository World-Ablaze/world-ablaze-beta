 JAP_corridor_received:0 "陸送された南方資源"
 JAP_corridor_shipped:0 "資源の陸送"
 JAP_operation_kita:0 "北方作戦"
 JAP_operation_kita_desc:0 "満ソ国境では、関東軍とソ連極東軍が長くにらみ合ってきた。対ソ開戦となれば、関東軍は国境を越えて攻勢に転じ、シベリア鉄道を断つ。補給の道を失った極東のソ連軍は、本国からの増援も望めなくなる。"
 JAP_north_sakhalin_oilfields:0 "北樺太油田の再開"
 JAP_north_sakhalin_oilfields_desc:0 "尼港事件を機に北樺太を保障占領し、撤兵ののちもオハの石油利権を手にしてきた。だがその採油は、資金の不足とソ連の妨害に阻まれて先細りとなっていた。北樺太を再び手中に収めた今、鉄路を通して開発に力を注げば、オハの原油はまた海軍の燃料となるだろう。"
 JAP_far_east_resources_overland:0 "極東資源の陸送"
 JAP_far_east_resources_overland_desc:0 "極東のソ連領は、満洲の国境に沿って走るシベリア鉄道でソ連本土とつながってい\nる。ソ連はこれに代わる第二の鉄道を北に計画したが、工事はいまだ途上にある。チタ周辺を押さえて西への輸送を断てば、極東の鉄や希少金属は、ソ連ではなく我が国の工場を動かすことになるだろう。"
 JAP_far_east_resources_tt:0 "§Y-[563.GetName]\n-[564.GetName]§!\nが敵に支配されない限り、\n以下の州のうち支配下にある州の§Y全ての資源§!を§Y[282.GetName]§!に移す:\n§Y-[408.GetName]\n-[409.GetName]\n-[657.GetName]\n-[560.GetName]\n-[561.GetName]\n-[562.GetName]\n-[637.GetName]\n-[854.GetName]\n-[574.GetName]\n-[563.GetName]\n-[564.GetName]\n-[565.GetName]\n-[566.GetName]§!"
 JAP_far_east_received:0 "陸送された極東資源"
 JAP_operation_ichigo:0 "大陸打通作戦"
 JAP_operation_ichigo_desc:0 "大陸を南北に貫く一大攻勢が、作戦課で練られている。参謀総長は目的を敵航空基地の破壊に絞るよう求めているが、作戦課長は南方へ通じる陸路の打通にこだわっている。いずれにせよ、陸軍が建軍以来動かしたことのない規模の兵力が大陸を進むことになるだろう。"
 JAP_operation_u_go:0 "ウ号作戦"
 JAP_operation_u_go_desc:0 "ビルマの第15軍司令官は、国境を越えてインドへ攻め入る作戦を強く主張している。補給の困難を理由に反対する声は少なくないが、方面軍も総軍もその実施を後押ししている。作戦の成否は、山を越えて弾薬と糧食を前線へ届けられるかどうかにかかっている。"
 JAP_second_trunk_railway:0 "第二縦貫鉄道群の敷設"
 JAP_second_trunk_railway_desc:0 "大東亜縦貫鉄道の計画は、本線から分かれてインドへ向かう支線群も描いていた。だがビルマとインドの間にはいまだ一本の鉄路も通じていない。インドを統治下に置いた今なら、二つの経路でチッタゴンまで線路を延ばし、インドを大陸の鉄道網に組み込むことができる。"
 JAP_india_resources_overland:0 "インド・ビルマ資源の陸送"
 JAP_india_resources_overland_desc:0 "ビルマとインド東部の資源は、これまで海を回って本土へ運ぶほかなかった。だがその航路は、ベンガル湾から南シナ海まで長く延びている。第二縦貫鉄道群を大陸の縦貫鉄道へつなぎ、これらの資源も陸路で本土へ送る。これにより、その分の船を長い航路に回さずに済むだろう。"
 JAP_india_resources_tt:0 "§Y-[608.GetName]\n-[607.GetName]\n-[620.GetName]\n-[602.GetName]\n-[599.GetName]\n-[932.GetName]\n-[594.GetName]\n-[671.GetName]\n-[289.GetName]\n-[288.GetName]\n-[430.GetName]§!\nが敵に支配されない限り、\n以下の州のうち支配下にある州の§Y全ての資源§!を§Y[282.GetName]§!に移す:\n§Y-[288.GetName]\n-[640.GetName]\n-[1007.GetName]\n-[430.GetName]\n-[431.GetName]\n-[432.GetName]\n-[434.GetName]\n-[959.GetName]§!"
