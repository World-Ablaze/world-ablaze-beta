 JAP_army_armament_expansion_plan:0 "陸軍軍備充実計画"
 JAP_army_armament_expansion_plan_desc:0 "ソ連は極東の兵力を年ごとに増やしており、いまの陸軍の規模では満洲を守り切れない。数年がかりで師団と航空部隊を増やし、兵器を造る工廠も合わせて広げる。計画が予算どおりに進めば、極東の兵力差はこれ以上開かずに済むだろう。"
 recruiting_reserves_10:0 "戦争時に配備可能な§Y予備歩兵師団§!を§G10§!個追加する。\n予備役は§Y10％の装備§!で配備される\n予備役は旧型設計装備を装備する。"
 JAP_triangular_divisions:0 "師団の三単位化"
 JAP_triangular_divisions_desc:0 "多くの連隊を抱える旧来の師団は、拡充や機動の面で重荷となりつつある。構成を簡素化すれば、より多くの部隊を速やかに整えられるだろう。"
 JAP_shanghai_expeditionary_army:0 "支那事変の拡大"
 JAP_shanghai_expeditionary_army_desc:0 "盧溝橋に始まった衝突は上海へ飛び火し、不拡大の方針は早くも崩れた。政府は事変の拡大を追認し、国民に挙国一致での協力を求めている。だが国民の熱気は戦果あってのものであり、大陸での戦いが行き詰まれば、その熱もまた冷めていくだろう。"
 JAP_sino_japanese_war_started_tt:0 "日中戦争が始まっている"
 JAP_national_spiritual_mobilization:0 "国民精神総動員"
 JAP_national_spiritual_mobilization_desc:0 ""
 JAP_gekokujo_restrained:0 "下剋上"
 JAP_gekokujo_restrained_desc:0 "総司令部の設置で現地軍の独断はいくらか抑えられたが、将校団には今も上官の命令より自らの信念を優先する者が少なくない。"
 JAP_gekokujo_coordinated:0 "$JAP_gekokujo$"
 JAP_gekokujo_coordinated_desc:0 "$JAP_gekokujo_desc$"
 JAP_gekokujo_restrained_coordinated:0 "$JAP_gekokujo_restrained$"
 JAP_gekokujo_restrained_coordinated_desc:0 "$JAP_gekokujo_restrained_desc$"
 JAP_shift_to_protracted_war:0 "長期持久戦への転換"
 JAP_shift_to_protracted_war_desc:0 "大陸の奥へ進むほど補給線は伸び、これ以上の進攻は難しくなっている。占拠地を治安地域と作戦地域に分け、新たな進攻よりもその安定を第一とする。戦果で国民の熱気をつなぐやり方にも限りがある。"
 JAP_shift_to_protracted_war_army:0 "長期持久戦への転換"
 JAP_shift_to_protracted_war_army_desc:0 "大陸の奥へ進むほど補給線は伸び、これ以上の進攻は難しい。対支作戦は長期持久の態勢へ移す。だが持久とは、守りに籠もって敵の反攻を待つことではない。占拠地をうかがう湖南の敵主力を先に叩いておけば、守りはいっそう固くなるだろう。"
 JAP_conquer_hunan:0 "湖南省の征服"
 JAP_cut_the_chiang_supply_routes:0 "援蔣ルートの遮断"
 JAP_cut_the_chiang_supply_routes_desc:0 "援蔣ルートの遮断は対支戦略における重要な課題である。仏印当局に対し、ハイフォンから昆明への鉄道を含む中国へ通じる補給路の閉鎖と、我が監視団の受け入れを要求し、24時間以内の回答を求める。この道が閉じれば、国民政府は外からの援助の大きな柱を一つ失うことになるだろう。"
 JAP_border_conflict_guidelines:0 "満ソ国境紛争処理要綱"
 JAP_border_conflict_guidelines_desc:0 "満ソ国境には、境界線のはっきりしない地域が少なくない。関東軍は中央の不拡大方針に不信を募らせ、境界は現地の司令官が自ら認定し、衝突すれば兵力の多寡にかかわらず必勝を期すという独自の要綱を定めた。国境の小さな衝突ひとつが、中央の手の届かない戦いへ広がりかねない。"
 JAP_northern_indochina_occupation:0 "北部仏印進駐"
 JAP_northern_indochina_occupation_desc:0 "仏印当局とは、北部の飛行場の使用と部隊の駐留をめぐる協定がまとまりつつある。だが現地に乗り込んだ参謀本部の作戦部長は、平和進駐などあり得ないと公言し、国境の師団に進撃の準備を命じている。協定が結ばれたとしても、銃火を交えずに済むとは限らない。"
 JAP_kantokuen:0 "関東軍特種演習"
 JAP_kantokuen_desc:0 "関東軍の師団の多くは、平時の定員のままで国境に張り付いている。演習の名の下に秘密裏に動員を発令し、師団を戦時定員に充足させて、北満に兵力と資材を集める。名目は演習だが、北方の情勢しだいではそのまま国境を越えることになるだろう。"
 JAP_southern_indochina_occupation:0 "南部仏印進駐"
 JAP_southern_indochina_occupation_desc:0 ""
 JAP_seize_the_southern_resource_area:0 "南方資源地帯の攻略"
 JAP_seize_the_southern_resource_area_desc:0 "国力を支えるには、南方の重要資源地帯を確保しなければならない。そのためには、海を越えて部隊と航空兵力を送り出す飛行場と港を、台湾から仏印にかけて整えておく必要がある。開戦の日には、これらの基地から上陸部隊と航空部隊が一斉に南へ向かうだろう。"
 JAP_island_defence_revision:0 "大東亜縦貫鉄道の敷設"
 JAP_island_defence_revision_desc:0 "満鉄・華北交通・華中鉄道は、それぞれの地域で別個に路線を営んできた。東亜交通学会はこれらを釜山から昭南まで一本に結ぶ縦貫鉄道を描いたが、構想は机上にとどまっていた。大陸打通に成功した今なら、残る区間を敷設して、その構想を現実のものにできる。"
 JAP_continental_corridor_held_tt:0 "以下の州を全て支配する:\n§Y-[608.GetName]\n-[607.GetName]\n-[620.GetName]\n-[602.GetName]\n-[599.GetName]\n-[932.GetName]\n-[594.GetName]§!\n§Y[671.GetName]§!が敵に支配されていない。"
