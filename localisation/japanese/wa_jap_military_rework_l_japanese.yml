 JAP_fifty_div_war_heavy_eq_tt:0 "[?num_equipment_in_armies@heavy_infantry_equipment|.0]/§G19000§!の§Y重歩兵装備§!がフィールド上の師団に配備されている。"
 JAP_fifty_div_war_artillery_tt:0 "[?JAP_army_artillery_total|.0]/§G2600§!門の§Y野戦砲・山砲・重砲§!がフィールド上の師団に配備されている。"
 JAP_infantry_direct_cooperation:0 "歩兵直協"
 JAP_infantry_direct_cooperation_desc:0 "我が国において、戦車は依然として歩兵の突撃を直接支援するための付随兵器に過ぎないと見なされている。機甲部隊を一括して運用・教育する専門組織は存在せず、独立した兵科としてのドクトリン研究は棚上げされたままだ。戦車の真の価値を軍首脳部に認識させるには、手痛い戦訓や、抜本的な軍改革が必要となるだろう。"
 JAP_infantry_direct_cooperation_tt:0 "£doctrine_mod  機甲ドクトリン習熟度獲得: §R-30%§!"
 JAP_first_air_fleet_naval_aviation_mastery_tt:0 "£doctrine_mod  海軍航空隊ドクトリン習熟度獲得: §G+7%§!"
 JAP_eleventh_air_fleet:0 "第十一航空艦隊"
 JAP_eleventh_air_fleet_desc:0 "基地航空部隊を一つの指揮の下に束ね、陸上攻撃機による大規模な洋上作戦を可能にする。"
 JAP_eleventh_air_fleet_bomber_mastery_tt:0 "£doctrine_mod  爆撃機ドクトリン習熟度獲得: §G+7%§!"
 JAP_relentless_training_idea:0 "月月火水木金金"
 JAP_relentless_training_idea_desc:0 "休日を返上し、月月火水木金金の猛訓練に明け暮れる。数に劣る我が艦隊が勝ち抜くには、練度で敵を上回るほかない。その代償は、絶えない事故と燃料の消耗である。"
 JAP_relentless_training_idea_training_tt:0 "艦艇の訓練による経験値獲得: §G+25%§!"
