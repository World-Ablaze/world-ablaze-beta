 JAP_expand_the_gains:0 "戦果の拡張"
 JAP_expand_the_gains_desc:0 ""
 JAP_second_stage_operations:0 "第二段作戦"
 JAP_second_stage_operations_desc:0 ""
 JAP_second_stage_operations_idea:0 "第二段作戦へ向けた取り組み"
 JAP_second_stage_operations_idea_desc:0 "第一段作戦を終えた艦隊は内地に戻り、整備を受けている。南方の油田からは、次の作戦を支える重油が届き始めた。"
