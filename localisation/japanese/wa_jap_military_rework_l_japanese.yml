 JAP_border_fortifications:0 "満ソ国境要塞の増強"
 JAP_border_fortifications_desc:0 "満ソ国境の要塞は、1934年から関東軍の手で築かれてきた。中でも虎頭の要塞は、対岸のシベリア鉄道を見渡せる国境で唯一の高地を押さえている。要塞群を拡充すれば、ソ連軍の侵攻を阻むだけでなく、有事にはその鉄道を砲火の下に置くこともできる。"
 JAP_defensive_posture_against_the_soviets:0 "対ソ作戦準備"
 JAP_defensive_posture_against_the_soviets_desc:0 "関特演で北満に兵力と資材を集めたが、ソ連と戦うのに必要な量にはなお届いていない。国境沿いの飛行場と鉄道、補給の拠点を整えておかねばならない。次に北で事を起こすとき、物資の不足に足を取られることはないだろう。"

