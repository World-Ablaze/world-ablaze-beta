 JAP_operation_ketsugo:0 "決号作戦"
 JAP_ichioku_gyokusai:0 "一億玉砕"
 JAP_relocate_imperial_headquarters:0 "大本営の移転"
 JAP_kato_hayabusa_tt:0 "§Y飛行第64戦隊「加藤隼戦闘隊」§!が関東に展開する。戦隊長はエースの§Y加藤建夫§!。"
 JAP_army_aircraft_industry_drive:0 "航空軍備充実計画"
 JAP_army_aircraft_industry_drive_desc:0 "陸軍機を手がける中島と川崎には、航空軍備充実計画に基づく発注と資金が優先的に回されている。大陸での戦果が続く限り、この優遇も延長されていく。"
 JAP_army_aircraft_industry_drive_tt:0 "§Y中島飛行機§!と§Y川崎§!の資金獲得: §G+20%§!\n日中戦争のミッションに成功するたびに期間が§G60日§!延びる"
 JAP_absolute_defence_perimeter_days_tt:0 "§Yアメリカ§!または§Yイギリス§!との開戦から§Y600§!日が経過している。\n現在の日数: [?JAP_pacific_war_started:days|Y0]"
 JAP_third_naval_replenishment_plan:0 "第三次海軍軍備補充計画"
 JAP_third_naval_replenishment_plan_desc:0 "昭和12年度からの第三次海軍軍備補充計画で、戦艦2隻、空母2隻を含む66隻の艦艇を建造する。"
 JAP_third_and_fourth_naval_plans:0 "第三次海軍軍備補充計画並びに第四次海軍軍備充実計画"
 JAP_third_and_fourth_naval_plans_desc:0 "第三次計画の艦艇がまだ完成しないうちに、昭和14年度から第四次海軍軍備充実計画が始まった。両計画の艦艇をあわせて建造する。"
 JAP_fourth_naval_expansion_plan:0 "第四次海軍軍備充実計画"
 JAP_fourth_naval_expansion_plan_desc:0 "昭和14年度からの第四次海軍軍備充実計画で、戦艦2隻、空母1隻を含む80隻の艦艇を建造する。"
 JAP_naval_plans_merge_tt:0 "§Y第三次海軍軍備補充計画並びに第四次海軍軍備充実計画§!に切り替わり、期限が§Y700§!日延びる"
