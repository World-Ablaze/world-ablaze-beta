 JAP_pacific_control_gain_1_tt:0 "太平洋の支配: §G+1§!"
 JAP_operation_c_andaman:0 "アンダマン諸島の攻略"
 JAP_operation_c_andaman_desc:0 "ベンガル湾の入口にあるアンダマン諸島を押さえれば、セイロンの英東洋艦隊への道が開ける。"
 JAP_operation_c_ceylon:0 "セイロンの攻略"
 JAP_operation_c_ceylon_desc:0 "コロンボとトリンコマリーを落とせば、英東洋艦隊はインド洋の拠点を失い、セイロンのゴム園も手に入る。"
 JAP_operation_mo_port_moresby:0 "ポートモレスビーの攻略"
 JAP_operation_mo_port_moresby_desc:0 "ポートモレスビーは、ニューギニアの南岸から豪州北部をにらむ連合軍の航空基地である。海路から攻め落とす。"
 JAP_operation_mo_solomons:0 "ソロモン諸島の攻略"
 JAP_operation_mo_solomons_desc:0 "ツラギに続いてソロモン諸島に飛行場を築けば、珊瑚海から南太平洋までを空から見張れる。"
 JAP_operation_mi_midway:0 "ミッドウェー島の攻略"
 JAP_operation_mi_midway_desc:0 "ミッドウェー島を攻めれば、米空母部隊は出てこざるを得ない。誘い出して一挙に叩く。"
 JAP_operation_mi_hawaii:0 "ハワイの攻略"
 JAP_operation_mi_hawaii_desc:0 "ミッドウェーを足場にオアフ島を落とせば、米太平洋艦隊は西海岸まで退くほかな\nい。"
 JAP_operation_al_attu:0 "アッツ島の攻略"
 JAP_operation_al_attu_desc:0 "アリューシャン列島の西の端、アッツ島を押さえて、北から本土を突かれる道を塞ぐ。米軍の目を北へ引きつければ、ミッドウェーの備えも薄くなる。"
 JAP_operation_fs_fiji_samoa:0 "フィジーとサモアの攻略"
 JAP_operation_fs_fiji_samoa_desc:0 "米本土から豪州へ向かう船団は、フィジーとサモアの近くを通る。ここを取れば、米豪の連絡線を断てる。"
 JAP_operation_fs_new_caledonia:0 "ニューカレドニアの攻略"
 JAP_operation_fs_new_caledonia_desc:0 "ヌーメアの港とニッケル鉱山を押さえ、豪州を東から締め上げる。"
 JAP_fifth_carrier_division_losses:0 "第五航空戦隊の損耗"
 JAP_fifth_carrier_division_losses_desc:0 "珊瑚海で翔鶴は傷つき、瑞鶴は多くの搭乗員を失った。二隻が次の作戦に加わるには、まだ時間がかかる。"
 JAP_loss_of_veteran_aviators:0 "熟練搭乗員の喪失"
 JAP_loss_of_veteran_aviators_desc:0 "ミッドウェーで失った搭乗員は、何年もかけて育てた者たちだった。その穴を埋める者は、すぐには育たない。"
 JAP_severing_us_australia:0 "米豪遮断"
 JAP_severing_us_australia_desc:0 "南太平洋の島々に拠った艦艇と航空隊が、豪州へ向かう船団を待ち構えている。"
 JAP_severing_us_australia_strengthened:0 "米豪遮断"
 JAP_severing_us_australia_strengthened_desc:0 "ニューカレドニアも落ち、豪州へ向かう船団の航路はさらに狭まった。"
 JAP_severing_us_australia_days_tt:0 "§Y米豪遮断§!は、強められても、始まってから§Y360§!日で終わる。"
 jap_second_stage.1.t:0 "英東洋艦隊の健在"
 jap_second_stage.1.d:0 "インド洋に出た機動部隊は、英東洋艦隊の主力を捕らえられなかった。艦隊がベンガル湾をうかがう限り、ビルマへの海上輸送は安心できない。"
 jap_second_stage.1.a:0 "次の機会を待つ"
 jap_second_stage.2.t:0 "米豪連絡線の健在"
 jap_second_stage.2.d:0 "フィジーとサモアは落ちず、米本土から豪州への船団はいまも南太平洋を渡っている。豪州に集まった兵力は、いずれ反攻に向けられるだろう。"
 jap_second_stage.2.a:0 "やむを得ない"
