 JAP_army_ordnance_administration_headquarters:0 "陸軍兵器本部"
 JAP_army_ordnance_administration_headquarters_desc:0 ""
 JAP_nakano_school:0 "陸軍中野学校"
 JAP_nakano_school_desc:0 "諜報と謀略は、もはや一部の特務機関だけに任せておける仕事ではない。陸軍は秘密戦の専門家を育てる学校を新たに設け、軍服を脱いで市井に紛れる将校を送り出すことになる。彼らが向かう先は敵国の中枢だけではない。アジアの各地で現地の人々と手を結び、その力を味方に引き込むことこそが、新しい秘密戦の主戦場となるだろう。"
 JAP_nakano_school_spirit:0 "陸軍中野学校"
 JAP_nakano_school_spirit_desc:0 "中野で学んだ将校たちは、商社員や記者を装ってアジア各地へ散っている。国内では防諜の網が張られ、外では現地の独立運動と結んだ工作が進んでいる。"
 JAP_volunteer_fighting_corps:0 "国民義勇隊"
 JAP_volunteer_fighting_corps_desc:0 ""
 JAP_inspectorate_general_of_army_aviation:0 "陸軍航空総監部"
 JAP_inspectorate_general_of_army_aviation_desc:0 "航空の専門教育は、これまで軍政を担う航空本部が兼務してきた。だが航空兵科の任務は年ごとに複雑化と専門化を重ね、拡大する航空兵力をこのままの体制で支えることはできない。教育総監部は陸軍三長官制を崩すとして強く反対しており、専任の総監部を設ければ、陸軍の中に新たな対立を生むだろう。"
 JAP_air_armament_expansion_plan:0 "航空軍備充実計画"
 JAP_air_armament_expansion_plan_desc:0 "新たな軍備充実計画は航空兵力の増強を重視し、陸軍中央では｢航空優先｣の標語が掲げられている。だが最後発の航空兵科には中核となる機関がなく、陰では｢地上絶対｣という揶揄も囁かれている。陸軍機を手がける中島と川崎に発注と資金を集めなければ、｢航空優先｣は標語のまま終わるだろう。"
 JAP_light_fighter_dogfight_doctrine:0 "格闘戦至上主義"
 JAP_light_fighter_dogfight_doctrine_desc:0 "新たに採用した九七式戦闘機は旋回性能に優れ、水平面での格闘戦で敵機を圧倒す\nる。戦闘機の価値は運動性にあるという信念は陸軍航空に深く根を張り、次期戦闘機にも九七戦と同等以上の運動性が求められている。欧州では引込脚の新型戦闘機が\n次々と現れているが、操縦者の技量と機体の運動性があればその差は埋められるという自信が揺らぐことはない。"
 JAP_homeland_air_defence_priority:0 "防空飛行隊の新設"
 JAP_homeland_air_defence_priority_desc:0 "戦闘機を前線へ送り出すほど本土の空は手薄になり、帝都を守る専任の戦闘機隊はわずかしかない。敵の空母や大陸の基地から本土が空襲される日が来る前に、限られた機体と操縦者を防衛に振り向け、速度と上昇力に優れた新型迎撃戦闘機の防空飛行隊と、大都市を囲む高射砲陣地を整えねばならない。"
 JAP_heavy_bomber_expansion:0 "重爆連隊の増設"
 JAP_heavy_bomber_expansion_desc:0 "陸軍航空の役割は、地上部隊の頭上を守ることだけではない。本土の防空に回す余力を削ってでも、敵の後方深くを叩く重爆撃機の部隊を増強する。九七式重爆に続く新型重爆撃機がそろえば、敵の補給線や工業地帯も爆撃の届く範囲に入るだろう。"
 JAP_army_air_arsenal_expansion:0 "陸軍航空工廠"
 JAP_army_air_arsenal_expansion_desc:0 "陸軍はこれまで、航空機の製造の大半を民間の工場に頼ってきた。自前の製造設備を持つ海軍に後れを取らないよう、名古屋に分かれていた機体と発動機の技術を立川に集め、陸軍唯一の航空工廠とする。設計から製造までを自前で担えれば、民間の都合に左右されずに新型機を送り出せるだろう。"
 JAP_youth_pilot_training:0 "少年飛行兵の大量養成"
 JAP_youth_pilot_training_desc:0 "航空兵力の拡大に、操縦者の育成が追いついていない。10代の志願者から選抜して航空学校で教育する少年飛行兵の採用枠を大幅に広げ、前線を支える下士官の操縦者を養成する。彼らが一人前の操縦者として前線に立つまでには、なお数年を要するだろう。"
