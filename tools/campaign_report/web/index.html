<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>__REPORT_TITLE__</title>
  <style>/*__REPORT_STYLE__*/</style>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark">W<span>A</span></span><span>WORLD ABLAZE<small>CAMPAIGN OBSERVATORY</small></span></a>
    <div class="nav-label">EXPLORE</div>
    <nav aria-label="Report tabs" id="nav"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> Local report · works offline<small id="campaign-id"></small><button id="download-json">Export JSON data ↗</button><button id="import-json" title="Load a campaign.json produced by this generator. It replaces the embedded data for this session only; nothing leaves your browser.">Import JSON data ↘</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>
  </aside>
  <main>
    <header class="page-header"><div><div class="eyebrow">WORLD ABLAZE / AI ANALYSIS</div><h1 id="page-title">Overview</h1><p id="page-subtitle"></p></div><div class="report-stamp"><span>CAMPAIGN REPORT</span><strong id="coverage-label"></strong><small id="sample-label"></small></div></header>
    <section class="filters" aria-label="Shared filters">
      <div class="country-filter"><label>COUNTRIES</label><button id="country-toggle" aria-expanded="false" aria-controls="country-panel"></button><div id="country-panel" class="country-panel" hidden><input id="country-search" type="search" placeholder="Search countries…" aria-label="Search countries"><div class="country-actions"><button id="major-tags">7 majors</button><button id="all-tags">All</button><button id="no-tags">None</button></div><div id="country-options"></div></div></div>
      <div class="date-filter"><label for="date-from">TIME WINDOW</label><div class="date-inputs"><input id="date-from" type="date" aria-label="Start date"><span>→</span><input id="date-to" type="date" aria-label="End date"></div><div class="window-sliders"><input type="range" id="range-from" aria-label="First observation"><input type="range" id="range-to" aria-label="Last observation"></div></div>
      <div class="quick-filter"><label>QUICK RANGE</label><div class="segmented"><button data-period="12">1 year</button><button data-period="36">3 years</button><button data-period="all" class="selected">All time</button></div></div>
      <div class="inspect-filter"><label for="inspect-date">INSPECTION DATE <strong id="inspect-label"></strong></label><input id="inspect-date" type="range" aria-label="Date for compositions and tables"></div>
    </section>
    <div class="selection-strip"><div id="selected-chips"></div><label class="switch"><input id="indexed" type="checkbox"> Rebase trends to 100</label></div>
    <section id="content" aria-live="polite"></section>
    <details id="quality" class="quality"><summary>Sources, coverage and limitations <span id="quality-count"></span></summary><div id="quality-content"></div></details>
    <footer><span>WORLD ABLAZE · OBSERVATIONS, NOT A CAUSAL DIAGNOSIS</span><span id="build-info"></span></footer>
  </main>
  <div id="tooltip" role="tooltip" hidden></div>
  <dialog id="data-dialog"><header><div><span class="eyebrow">CHART DATA</span><h2 id="dialog-title"></h2></div><button id="close-dialog" aria-label="Close">✕</button></header><p id="dialog-source"></p><div id="dialog-table" class="table-scroll"></div></dialog>
  <noscript>This report includes all its data offline. Enable JavaScript to use filters and charts.</noscript>
  <script id="report-data" type="application/json">/*__REPORT_DATA__*/</script>
  <script>/*__REPORT_APP__*/</script>
</body>
</html>
